                var html_0ac11501d544a24748faf376e5407848 = $(`<div id="html_0ac11501d544a24748faf376e5407848" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hebden Water</h1><div class="nugget-popup"><p>Fluvial flooding at the Hebden Water / River Calder confluence contributed to significant flooding in Hebden Bridge during Storm Ciara (8&ndash;9 February 2020); this event caused mass property and infrastructure damage in Hebden Bridge and damage to council buildings including Hebden Bridge library. (p8)</p></div><div class="nugget-popup"><p>Hebden Water is named as the tributary at the Hebden Bridge confluence with the River Calder. Hebden Bridge was one of the towns that suffered mass property and infrastructure damage during the February 2020 storm, with flooding at the Calder/Hebden Water confluence contributing to the impacts (including damage to council buildings such as Hebden Bridge library). [PAG] (p9)</p></div><div class="nugget-popup"><p>Hebden Water (Nutclough) gauge rose sharply during the 09/02/2020 event, peaking around midday and then falling while remaining above baseline levels. [PAG,IMG] (p26)</p></div><div class="nugget-popup"><p>Associated gauge peak (Hebden Bridge Nutclough) reached 2.19 m at 11:45 on 9 February 2020; this was ranked 2nd among listed events for that location. [TAB] (p27)</p></div><div class="nugget-popup"><p>The Environment Agency issued flood warnings for Hebden Water at Hebden Bridge (including Old Gate, Valley Road to Midgehole Road) on 9 February 2020; Hebden Water contributed to the river flooding that heavily impacted Hebden Bridge during the event. [TAB] (p47)</p></div><div class="nugget-popup"><p>Six reservoirs on Hebden Water (Gorple Lower, WD Lower, WD Middle, WD Upper, Widdop and Gorpley) were held at 90% capacity prior to the storm and then filled during the heavy rainfall on 9th February 2020, resulting in those reservoirs spilling at various times between 11:30 and 18:00 on 9th February 2020. (p48)</p></div></div></body></div>`)[0];

                var html_a1d9e0963dedcb67ed1c309d2e1e6560 = $(`<div id="html_a1d9e0963dedcb67ed1c309d2e1e6560" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Calder</h1><div class="nugget-popup"><p>Rapid rises in the River Calder during Storm Ciara (8&ndash;9 February 2020) contributed to widespread fluvial flooding across the Calder Valley, leading to flooding of residential and business properties and serious damage to roads, bridges and major infrastructure within the borough. (p8)</p></div><div class="nugget-popup"><p>The River Calder (and its main tributaries) produced fluvial flooding along its course through Todmorden, Hebden Bridge, Mytholmroyd, Sowerby Bridge, Luddenden and Brighouse during the February 2020 event, contributing to property and infrastructure flooding and damage in those towns. [IMG] (p9)</p></div><div class="nugget-popup"><p>River Calder gauges across the catchment rose sharply beginning late on 08/02/2020, peaking around midday on 09/02/2020 with levels above the historical averages and showing a secondary peak on the falling limb about 12 hours after the main peak. [PAG,IMG] (p26)</p></div><div class="nugget-popup"><p>River Calder at the Todmorden Centre Vale gauge reached a peak level of 1.97 m on 9 February 2020 (time of peak 08:45). This event ranked 2nd compared to the listed historical events at this gauge. [TAB] (p27)</p></div><div class="nugget-popup"><p>High flows and overtopping from the River Calder (and flows from Jumble Hole Clough) increased flood extents in Hebden Bridge and contributed to flooding impacts in the town centre. [PAG] (p34)</p></div><div class="nugget-popup"><p>The River Calder contributed fluvial flooding in the Sowerby Bridge town centre around its confluence with the River Ryburn, leading to inundation of nearby businesses and properties. (p41)</p></div><div class="nugget-popup"><p>The Environment Agency issued flood warnings for multiple reaches of the River Calder on 9 February 2020 (warnings covered locations including Brearley & Luddenden Foot, Hebden Bridge, Mytholm and Hebble End, Central Mytholmroyd, Brighouse, Sowerby Bridge, Copley, Elland, Cooper Bridge, Central Mirfield and Bradley). Flooding on and around the River Calder was part of the event that produced widespread impacts across the Calder Valley. [TAB,PAG] (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8 schools temporarily closed; 2 schools significantly damaged; ␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀ [PAG] (p9)</p></div><div class="nugget-popup quant"><p>at least 39 flood warnings; 3,965 buildings affected across the Calder Valley; 3,433 residential properties; 532 business properties; 50 dwellings deemed unsuitable for living; £6.7m estimated economic damage to local business; £10 million infrastructure damage (including £750,000 Council assets) [TAB,PAG] (p47)</p></div></div></body></div>`)[0];

                var html_3e595b630815095dc321ea5e10503d16 = $(`<div id="html_3e595b630815095dc321ea5e10503d16" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Calderdale</h1><div class="nugget-popup"><p>Severe flooding across the borough on 9 February 2020 when river levels rose rapidly following intense, localised rainfall. Residential and commercial properties were inundated, transport and communications infrastructure were disrupted and recovery/planning actions were required. [PAG] (p3)</p></div><div class="nugget-popup"><p>The February 2020 storm caused widespread flooding across Calderdale towns (Hebden Bridge, Todmorden, Mytholmroyd, Elland, Sowerby Bridge, Luddenden) producing mass property and infrastructure damage: major roads and bridges were seriously damaged; a significant number of residential and business properties were flooded; eight schools were temporarily closed (two schools experienced significant damage); council buildings including Hebden Bridge library suffered damage. [IMG] (p9)</p></div><div class="nugget-popup"><p>Extensive fluvial and pluvial flooding on 9 February 2020 (Storm Ciara) that caused flooded highways and transport infrastructure, and inundation of residential and business properties and other essential infrastructure across the borough. [IMG] (p16)</p></div><div class="nugget-popup"><p>Across the Calder catchment within Calderdale, river stage hydrographs for the 9 February 2020 event show river levels rising from the early hours and reaching peaks around midday; tributary peaks occurred between about 11:30 and 13:15, indicating a rapid response of 0.5&ndash;2.25 hours. Calder gauges also show a secondary peak on the falling limb about 12 hours after the event peak. [IMG] (p25)</p></div><div class="nugget-popup"><p>The borough experienced flooding during the event; flood extent maps (EA) and flood incident maps show flooding across towns in Calderdale with clusters of properties affected (internal and/or external flooding reported in the incident records). [IMG,PAG] (p29)</p></div><div class="nugget-popup"><p>Widespread river (fluvial) and surface&ndash;water flooding during Storm Ciara (February 2020). Drainage and culvert failures routed surface water along road networks (notably Halifax Road and Ibbotroyd Avenue) and damaged footways and access covers; canal flooding damaged towpaths and boundary walls adjacent to residential properties. Clusters of residential and business properties across the borough were recorded as affected by flooding. [IMG,PAG] (p30)</p></div><div class="nugget-popup"><p>The culvert carrying Walsden Water beneath the building collapsed/damaged (base and sides), badly restricting the channel and putting the watercourse at risk of blockage. The partial collapse put the building in danger of falling into the river, which would have increased flood risk to surrounding properties. [PAG,IMG] (p33)</p></div><div class="nugget-popup"><p>Extensive flooding across the borough: CMBC records show properties with Hebden Bridge postal addresses were flooded; Mytholmroyd experienced significant flooding despite temporary flood defences being in place during construction of the Mytholmroyd Flood Alleviation Scheme (sections of existing defences had been demolished and temporary barriers and bulk bags were used). [IMG,MUL] (p37)</p></div><div class="nugget-popup"><p>Properties and driveways along Rochdale Road and Hill Top Road were subjected to external flooding of gardens and access routes. [IMG] (p40)</p></div><div class="nugget-popup"><p>Flooding across the borough included fluvial inundation along river corridors and widespread surface&ndash;water and drainage flooding affecting residential properties, highways and a school (school closure in Greetland due to infrastructure damage). Infrastructure impacts included blocked culverts, overwhelmed drains and a major landslip on the A6025 requiring lengthy closures and costly repairs. [PAG,IMG] (p43)</p></div><div class="nugget-popup"><p>The recorded flood outline and incident mapping for the borough show flood extent concentrated along the main river corridors and affecting both urban and rural parts of Calderdale, with impacts including inundation of properties and infrastructure (locks/basins, embankments, towpaths) within Brighouse. [IMG] (p45)</p></div><div class="nugget-popup"><p>Widespread flooding across the borough impacted thousands of properties, caused businesses to lose operations, and generated substantial infrastructure damage and rehousing needs. (p47)</p></div><div class="nugget-popup"><p>Widespread flooding across the borough affecting multiple towns: rail disruptions in the Calder Valley (including Dobroyd Road at Todmorden and a blocked culvert between Sowerby Bridge Tunnel and Luddenden Foot), localised severe flooding at Park Road, Elland (front doors buckling, main roads closed), rapid river rise on Walsden Water and a cloudburst in Todmorden that exacerbated flooding. Multi&ndash;site emergency response: six Flood Hubs opened to support affected residents; emergency services responded to numerous flood&ndash;related incidents; evacuations and rescues carried out. (p50)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1267 properties; 695 residential properties; 572 businesses; £6.7m; almost 50% concentrated in Hebden Bridge and Brighouse; 37% of all impacted properties across the UK (Calderdale residential share). [PAG] (p3)</p></div><div class="nugget-popup quant"><p>£4.5 million; 8 schools; 2 schools [IMG] (p9)</p></div><div class="nugget-popup quant"><p>250 properties [PAG,IMG] (p33)</p></div><div class="nugget-popup quant"><p>380 business properties; 701 residential properties (Hebden Bridge postal address) [IMG,MUL] (p37)</p></div><div class="nugget-popup quant"><p>3,965 buildings affected in Calder Valley within Calderdale (3,433 residential; 532 business); estimated economic damage to local business £6.7m; 50 dwellings unsuitable for living and required rehousing; estimated total cost to infrastructure £10,000,000 (of which £750,000 relates to Council assets) (p47)</p></div><div class="nugget-popup quant"><p>6 Flood Hubs; 31 incidents; 88 residents evacuated; 1 successful rescue; 140 troops (70 from Catterick; 70 from Special Forces) (p50)</p></div></div></body></div>`)[0];

                var html_1f2f0da260ead58c3c5e00e47e4351b1 = $(`<div id="html_1f2f0da260ead58c3c5e00e47e4351b1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>West Yorkshire</h1><div class="nugget-popup"><p>Experienced intense, prolonged rainfall during Storm Ciara that caused rapid river level rises and contributed to flooding across the county, including impacts in Calderdale on 9 February 2020. (p3)</p></div><div class="nugget-popup"><p>Areas within West Yorkshire (notably Calderdale) experienced significant flooding during the February 2020 storm, with towns in the Calder Valley suffering mass property and infrastructure damages from fluvial, surface water and drainage&ndash;related flooding. [IMG] (p9)</p></div><div class="nugget-popup"><p>Extensive fluvial (river) and pluvial (surface) flooding on 9 February 2020 across the Calder catchment in West Yorkshire caused flooded highways and transport infrastructure, flooded residential and business properties, and impacted other essential infrastructure. [IMG] (p16)</p></div><div class="nugget-popup"><p>Extensive flooding in Hebden Bridge driven by hillside runoff and overtopping of the canal and River Calder. Torrential surface flows channelled down multiple roads (Keighley Road, Birchcliffe, Palace House Road, Mytholm Steeps, Saville Road) causing internal flooding of properties on Keighley Road, Birchcliffe, Hanging Road, Market Street, Oxford Street and Cambridge Street. Properties on Oxford Road and Cambridge Street experienced water depths in excess of 1.5 m, causing severe damage. Debris and large rocks were carried by flows, damaging buildings and infrastructure; bridleway paths were damaged blocking access to Greenland Road and Blackshaw Head. Calis Bridge and Jumble Hole Clough were affected by high river volumes. Large&ndash;scale deposition of gravel and sand in the River Calder caused the river to change course, prompting concerns over the stability of the Hebden Bridge Aqueduct. In South Todmorden (Shade Chapel) the culvert carrying Walsden Water beneath the building partially collapsed, damaging the base and sides of the culvert, restricting the channel and threatening blockage; the partial collapse also put the building at risk of falling into the river, which would have increased flood risk to nearby properties. [PAG,IMG] (p35)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>380 business properties; 701 residential properties; up to 250 properties; water depths greater than 1.5 m [PAG,IMG] (p35)</p></div></div></body></div>`)[0];

                var html_e65ee1c1d8366f06a67d3ca0342e9bbe = $(`<div id="html_e65ee1c1d8366f06a67d3ca0342e9bbe" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Crowther Bridge</h1><div class="nugget-popup"><p>Boats were reported stranded on canal paths at Crowther Bridge and Batty Cut following receding water levels during the 9 February 2020 flood. Overall damage to the canal system from the event was predicted at around £1.8m. (p49)</p></div></div></body></div>`)[0];

                var html_5fc0d489c909f913f5a514c93ef3ecc2 = $(`<div id="html_5fc0d489c909f913f5a514c93ef3ecc2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hebden Bridge</h1><div class="nugget-popup"><p>One of the most impacted areas during the Storm Ciara event on 9 February 2020 &mdash; the report states that almost half of the buildings affected in Calderdale were concentrated in Hebden Bridge and Brighouse, with numerous residential and business properties flooded. (p3)</p></div><div class="nugget-popup"><p>Fluvial flooding at the Hebden Water / River Calder confluence during Storm Ciara caused flooding of properties and damage to major infrastructure; council buildings were damaged including Hebden Bridge library. [PAG] (p8)</p></div><div class="nugget-popup"><p>Experienced fluvial flooding associated with Hebden Water / River Calder confluence during the February 2020 storm; suffered property and infrastructure damage including damage to council buildings such as Hebden Bridge library. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>River stage at the Calder catchment gauge for Hebden Bridge rose during the 9 February 2020 event, with levels increasing from the early hours and reaching a peak around midday as shown on the River Calder hydrographs. [IMG] (p25)</p></div><div class="nugget-popup"><p>The Hebden Bridge gauge recorded a high river level, indicating river flooding at Hebden Bridge during the event. [TAB] (p27)</p></div><div class="nugget-popup"><p>Environment Agency recorded flood outline and property points show properties in Hebden Bridge were affected by river (fluvial) flooding during the February 2020 Storm Ciara event; flood extents follow the river valley and overlapped clusters of properties adjacent to the river. [IMG] (p30)</p></div><div class="nugget-popup"><p>Torrential surface&ndash;water and hillside runoff led to rapid overland flows along many roads (notably Keighley Road, Birchcliffe, Palace House Road, Mytholm 'Steeps' and Saville Road). Canal and River Calder overtopping increased flood extents. Extensive internal flooding of residential properties occurred across Keighley Road, Birchcliffe, Hanging Road, Market Street, Oxford Street and Cambridge Street; debris and large rocks were carried by flows, and bridleway paths were damaged and blocked. Calis Bridge was affected by high river volumes. (p33)</p></div><div class="nugget-popup"><p>Main sources of flooding were surface water and hillside overland flow, with flooding extents also increased by canal and River Calder overtopping. Blocked culverts, fallen trees and debris contributed to localised impacts. Extensive flooding in the town centre caused internal flooding of residential properties across multiple streets, external damage from debris and large rocks, and severe property damage where water depths exceeded 1.5 m. [PAG,IMG] (p34)</p></div><div class="nugget-popup"><p>Flooding in Hebden Bridge and surrounding parts of Calderdale (West Yorkshire) including river and surface&ndash;water driven inundation, severe internal property flooding, infrastructure damage (bridges, bridleways), and threat to structures such as Shade Chapel culvert and the Hebden Bridge Aqueduct following channel change and sediment deposition. [PAG,IMG] (p35)</p></div><div class="nugget-popup"><p>Flooding affected properties with Hebden Bridge postal addresses; business and residential properties were inundated during the event. [PAG,MUL] (p36)</p></div><div class="nugget-popup"><p>Hebden Bridge was one of the most impacted areas in Calderdale during the 8&ndash;10 February 2020 floods; flood warnings were issued for the River Calder and Hebden Water at Hebden Bridge on 9 February 2020, and CMBC report that almost half of the buildings affected across Calderdale were concentrated in Hebden Bridge and Brighouse. [TAB] (p47)</p></div><div class="nugget-popup"><p>Flooding reported through the centre of town driven in part by unexpectedly opened sluices; three boats were observed adrift at Stubbing's Wharf during the event, indicating navigational and infrastructure impacts. (p49)</p></div><div class="nugget-popup"><p>Local flood wardens were on watch from 05:00am; a Flood Hub was opened to support affected residents. The area also featured in emergency response activity (evacuations and rescues) related to flooded cellars, blocked infrastructure and extensive flooding of properties during the event. (p50)</p></div><div class="nugget-popup"><p>Floodwaters lifted beer barrels causing damage and a hazard to the public; temporary defences (sandbags, flood walls, flood barriers) were reported to have been overtopped during the February 2020 event. [TAB] (p51)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>almost 50% of affected buildings (Hebden Bridge and Brighouse combined) (p3)</p></div><div class="nugget-popup quant"><p>water depths &gt;1.5m (p33)</p></div><div class="nugget-popup quant"><p>water depths greater than 1.5 m [PAG,IMG] (p34)</p></div><div class="nugget-popup quant"><p>380 business properties; 701 residential properties; up to 250 properties [PAG,IMG] (p35)</p></div><div class="nugget-popup quant"><p>380 business properties; 701 residential properties [PAG,MUL] (p36)</p></div><div class="nugget-popup quant"><p>Almost 50% of affected buildings concentrated in Hebden Bridge and Brighouse; Brighouse: 187 business properties and 34 residential properties (with Brighouse postal address) affected on 8&ndash;10 February 2020 [MUL] (p47)</p></div></div></body></div>`)[0];

                var html_9d30e90be446af1d5f81627df2c9cd96 = $(`<div id="html_9d30e90be446af1d5f81627df2c9cd96" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Brighouse</h1><div class="nugget-popup"><p>Experienced river flooding on 9 February 2020 when river levels rose rapidly following intense, localised rainfall (Storm Ciara); identified as one of the most impacted areas in Calderdale. (p3)</p></div><div class="nugget-popup"><p>River stage recorded on the Calder at Brighouse was part of the River Calder hydrographs that show levels rising from the early hours and peaking around midday on 9 February 2020. [IMG] (p25)</p></div><div class="nugget-popup"><p>The Brighouse gauge on the River Calder recorded a flood peak of 2.006 m on 9 February 2020 (time of peak 15:45). Feb 2020 was the 2nd highest event at this gauge in the listed historical events. [TAB] (p27)</p></div><div class="nugget-popup"><p>Multiple flood incidents occurred: culvert blockages and sewer capacity issues caused surface&ndash;water flooding on roads (e.g. Lillands Lane). Sixteen businesses experienced cellar flooding near Commercial Street and Lord Street; Phoenix and Clifton bridges were damaged; a masonry wall collapsed near the Lidl; Masonic halls reported partial cellar flooding on Bridge End; river overtopping and surface flows flooded properties near Winding Rise (ponding in gardens) and caused external flooding on Elland Road (Brighouse Hub). Canal overtopping at Brighouse Lock caused a barge to drift onto the footpath; Brighouse Bottom Lock basin flooded adjacent properties from Calder inflows; embankment damage was observed at Cooper Bridge. [PAG] (p44)</p></div><div class="nugget-popup"><p>Canal overtopped at Brighouse Lock causing a barge to drift out of the channel onto the adjacent footpath; at Brighouse Bottom Lock a large volume of water entered the downstream basin from the River Calder, flooding the basin and adjacent properties; flood damage observed to an embankment at Cooper Bridge; Anchor Pit towpath at Dyke Bridge suffered scour and wall collapse making the walkway unsafe and requiring rebuilding. [IMG,PAG] (p45)</p></div><div class="nugget-popup"><p>Brighouse experienced river flooding during the 8&ndash;10 February 2020 event; CMBC records indicate properties with Brighouse postal addresses were affected and the EA issued flood warnings for the River Calder at Brighouse and Brighouse &ndash; Brookfoot Business Park on 9 February 2020. [TAB,PAG,MUL] (p47)</p></div><div class="nugget-popup"><p>Reports of flooding in Brighouse and Sowerby Bridge on 9th February 2020; Environment Agency flood warnings were issued for the River Calder and River Ryburn at Sowerby Bridge/Central Sowerby Bridge during the event. (p48)</p></div><div class="nugget-popup"><p>Two craft were reported adrift at Brighouse lock during the 9 February 2020 flood. (p49)</p></div><div class="nugget-popup"><p>Brighouse was one of the communities served by an opened Flood Hub during the event and was the origin of emergency calls handled by the fire brigade as a result of flooding impacts. (p50)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Almost 50% of the buildings affected in Calderdale were concentrated in Hebden Bridge and Brighouse. (p3)</p></div><div class="nugget-popup quant"><p>16 businesses; 1 barge [PAG] (p44)</p></div><div class="nugget-popup quant"><p>187 business properties; 34 residential properties [TAB,PAG,MUL] (p47)</p></div><div class="nugget-popup quant"><p>33 reports of flooding; 4 internal incidents; 3 overloaded sewer incidents; 1 blocked sewer incident; 5 external incidents; 4 external overloaded sewer incidents (p48)</p></div></div></body></div>`)[0];

                var html_c72b153cf5dd6dcda746668ce23de19e = $(`<div id="html_c72b153cf5dd6dcda746668ce23de19e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Walsden</h1><div class="nugget-popup"><p>Fluvial flows overtopped riverbanks across the railway corridor between Walsden and Todmorden, contributing to local flooding along transport corridors. (p30)</p></div><div class="nugget-popup"><p>Fluvial flows overtopped riverbanks in locations between Walsden and Todmorden and flooding affected valley&ndash;bottom areas. The Calder and Hebble Navigation flood flows damaged the towpath and boundary walls adjacent to residential properties in the Walsden area. Multiple culvert failures in the local area (including a burst culvert that damaged a footway and a lifted access lid exposing a manhole) caused localised damage to highways/footways and allowed surface water to flow along road networks. Nearby low&ndash;lying areas experienced minor structural damage to property exteriors and reported internal flooding of some houses and flooded cellars/ground floors on streets such as Gledhill Street. [PAG,IMG] (p32)</p></div><div class="nugget-popup"><p>High canal/river water levels caused towpath damage, erosion and stone displacement alongside the canal, creating maintenance needs and hazards for canal users. [PAG,IMG] (p33)</p></div><div class="nugget-popup"><p>Environment Agency issued flood warnings affecting Walsden (Walsden Water at Walsden at 06:29; Walsden Water and Ramsden Clough at Walsden at 08:14) on 9 February 2020. [TAB] (p47)</p></div></div></body></div>`)[0];

                var html_746022107a429bd6a1c2f224589549e9 = $(`<div id="html_746022107a429bd6a1c2f224589549e9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Todmorden</h1><div class="nugget-popup"><p>Flooding from the River Calder and Walsden Water during Storm Ciara caused property flooding and damage to local infrastructure (roads/bridges) in Todmorden. [PAG] (p8)</p></div><div class="nugget-popup"><p>Affected by fluvial flooding from the River Calder and Walsden Water during the February 2020 storm, contributing to mass property and infrastructure damage across the valley. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>Fluvial and surface&ndash;water flooding affected multiple streets and neighbourhoods. River flows overtopped banks at locations including Cross Keys, Key Sike Lane and across the railway between Walsden and Todmorden. Surface water and blocked drainage routed along Halifax Road and Ibbotroyd Avenue. Main flow paths concentrated along Ashenhurst Road, Cambridge Street and Stile Road. Meadow Bottom and Wickenberry experienced flooding with minor external structural damage; a number of houses close to a bridle path reported internal flooding believed to be about 0.2 m deep. Properties on Gledhill Street had flooded cellars and ground floors. Several culverts failed (Wilson Close culvert burst damaging the footway; a culvert in Stoney Road Playing Fields lifted an access lid exposing a manhole). The culvert beneath Shade Chapel in South Todmorden partially collapsed, causing significant damage to the culvert base and sides and damaging the building foundations. [PAG,IMG] (p32)</p></div><div class="nugget-popup"><p>Shade Chapel suffered significant structural damage when the culvert carrying Walsden Water beneath the building collapsed; damage to the culvert base and sides badly restricted the channel, risked blockage of the watercourse and put the building in danger of falling into the river, increasing flood risk to nearby properties. (p33)</p></div><div class="nugget-popup"><p>Environment Agency issued multiple flood warnings across Todmorden on 9 February 2020 (River Calder at Cornholme, Lydgate and Todmorden High School at 08:25; River Calder at Todmorden from the Cricket Ground to the Railway Bridge at 08:32; Patmos Burnley Road at 08:32; Millwood at 08:32; Central Todmorden at 08:32; and Walsden Water at Todmorden from Shade to Salford at 08:27). [TAB] (p47)</p></div><div class="nugget-popup"><p>Reports of flooding in Todmorden on 9th February 2020. Yorkshire Water carried out CCTV surveys in and around Halifax Road (Todmorden) which showed only minor sewer surcharging on Cambridge Street, Hey Street, Stanworth Street and Hazlewood Street. [PAG] (p48)</p></div><div class="nugget-popup"><p>The Todmorden station area (including Dobroyd Road) was flooded, contributing to disruption of rail services in the town during the event. (p49)</p></div><div class="nugget-popup"><p>Flooding reported on Dobroyd Road at Todmorden station; local flood group reported water rising rapidly from early morning (noted from Walsden Water) and a cloudburst during the day that worsened conditions. [PAG] (p50)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 0.2 m internal flooding (reported for houses near a bridle path); up to 250 properties (would have had increased flood risk if Shade Chapel had fallen into the channel) [PAG,IMG] (p32)</p></div></div></body></div>`)[0];

                var html_031c05277617e742a310196f58cbe969 = $(`<div id="html_031c05277617e742a310196f58cbe969" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Mytholmroyd</h1><div class="nugget-popup"><p>Experienced river flooding on 9 February 2020 when river levels rose rapidly following intense, localised rainfall (Storm Ciara); identified in the report as a local flood hotspot. (p3)</p></div><div class="nugget-popup"><p>Flooding associated with the River Calder, White Lea Clough watercourse and the Rochdale Canal, plus highway/drainage flooding during Storm Ciara resulted in residential and business properties being flooded and damage to roads and infrastructure in Mytholmroyd. [PAG] (p8)</p></div><div class="nugget-popup"><p>Flooding during the February 2020 storm from River Calder, Cragg Brook and other local watercourses (and associated highway/urban flooding) led to significant property and infrastructure damage as part of the mass impacts in the valley. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>EA recorded flood outline and mapped property points indicate properties in Mytholmroyd were affected by riverine flooding during the February 2020 event. [IMG] (p30)</p></div><div class="nugget-popup"><p>Significant flooding occurred in Mytholmroyd on 9th February 2020 despite the presence of temporary flood defences associated with the ongoing Flood Alleviation Scheme; community and local infrastructure were affected. [PAG] (p37)</p></div><div class="nugget-popup"><p>Significant river flooding occurred on the valley floor despite temporary flood defences. Temporary barriers were overwhelmed and in places were washed away at the road edge, allowing flow under the barrier; defences would not have completely contained the River Calder and flooding reached similar extents and depths to those recorded. Temporary barriers were also overtopped at Location B. [PAG,IMG] (p38)</p></div><div class="nugget-popup"><p>Significant flooding occurred on 9th February 2020 despite temporary Mytholmroyd FAS measures under construction. Temporary flood barriers and bulk bags were overtopped or undermined by flow (material washed from beneath road edges allowing flow under barriers). Canal towpaths and boundary walls were undercut and cracked; embankments were voided and the canal channel was silted. Temporary defences failed or were overtopped at multiple locations, leading to widespread road and property inundation, garden flooding, cellar flooding and damage to towpath infrastructure. [PAG,IMG] (p39)</p></div><div class="nugget-popup"><p>A Flood Hub was opened in Mytholmroyd to support those affected and volunteers assisted families and clean&ndash;up operations following flooding. (p50)</p></div><div class="nugget-popup"><p>During the February 2020 flood event, 143 properties at risk in Mytholmroyd were not signed up to the available flood warning information service (affecting preparedness for the flooding). [TAB] (p51)</p></div><div class="nugget-popup"><p>Mytholmroyd experienced flooding while its Flood Alleviation Scheme (FAS) was still under construction. The public perceived temporary works had failed, although the report states flooding was inevitable given the event. In addition, the local flood siren failed to operate when flood warnings were issued, reducing local warning redundancy despite flood alerts/warnings being issued. [TAB,PAG] (p53)</p></div><div class="nugget-popup"><p>On 9th February 2020 Mytholmroyd was inundated by flood water; local flood alleviation works were still under construction and did not prevent flooding. The flooding led to impacts on residents (some requiring extra support), disruption to the community and damage to local infrastructure. A local flood siren failed to operate when flood warnings were issued (reducing local warning resilience). (p54)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>143 properties [TAB] (p51)</p></div></div></body></div>`)[0];
                popup_eba1b8deae1843fc5a9e6f80adba3d3d.setContent(html_031c05277617e742a310196f58cbe969);

                var html_3ab585549a713752916caf9cd5ee64cd = $(`<div id="html_3ab585549a713752916caf9cd5ee64cd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Sowerby Bridge</h1><div class="nugget-popup"><p>Experienced river flooding on 9 February 2020 when river levels rose rapidly following intense, localised rainfall (Storm Ciara); identified in the report as a local flood hotspot. (p3)</p></div><div class="nugget-popup"><p>Flooding at the River Calder / River Ryburn confluence during Storm Ciara led to property flooding and damage to local infrastructure and transport links in Sowerby Bridge. [PAG] (p8)</p></div><div class="nugget-popup"><p>Experienced fluvial flooding associated with the River Calder / River Ryburn (confluence) during the February 2020 storm and was listed among areas with mass property and infrastructure damage. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>River stage recorded at the Calder gauge near Sowerby Bridge rose during the 9 February 2020 event and reached peak levels around midday, as part of the River Calder hydrograph response. [IMG] (p25)</p></div><div class="nugget-popup"><p>The Sowerby Bridge gauge recorded a high river level, indicating river flooding at Sowerby Bridge during the event. [TAB] (p27)</p></div><div class="nugget-popup"><p>Environment Agency recorded flood outline and property points indicate properties in Sowerby Bridge were affected by river (fluvial) flooding during the February 2020 Storm Ciara event; flood extents follow the river corridor and coincide with clusters of affected properties. [IMG] (p30)</p></div><div class="nugget-popup"><p>Flooding incidents concentrated in the town centre around the confluence of the River Calder and River Ryburn; recorded incidents affected properties and transport routes (fluvial and surface&ndash;water mechanisms). [IMG,PAG] (p40)</p></div><div class="nugget-popup"><p>Flooding concentrated in the town centre around the confluence of the River Calder and River Ryburn. Businesses (notably on West Street, Walton Street, Water Street, Station Road and Victoria Road) and residential properties were flooded; blocked drainage and culverts contributed to localised surface water and sewer&ndash;related flooding. Cellar flooding and localised landslip impacts were also recorded. [IMG,PAG] (p41)</p></div><div class="nugget-popup"><p>Flooding concentrated around the river confluence (River Calder and River Ryburn) inundated the town centre and adjacent low&ndash;lying areas. Many businesses on West Street, Walton Street, Water Street, Station Road and Victoria Road were flooded. Blocked drainage caused flooding along Borland Road and external flooding of properties in Triangle; surface water and debris in fields blocked a culvert. Cellars of several houses along Hill Top Road were flooded. Minor landslips occurred at the rear of properties in Mill Bank. [PAG,IMG,MUL] (p42)</p></div><div class="nugget-popup"><p>Environment Agency issued flood warnings for the River Calder and River Ryburn at Sowerby Bridge on 9 February 2020, identifying risk of river flooding to the town, adjacent low&ndash;lying land and transport routes. [TAB,PAG] (p47)</p></div><div class="nugget-popup"><p>Yorkshire Water Services recorded reports of flooding in Sowerby Bridge during the storm event; incidents included reports attributed to overloaded sewer systems. (p48)</p></div><div class="nugget-popup"><p>Surface water from a blocked culvert led to flooding across the railway lines between Sowerby Bridge Tunnel and Luddenden Foot, causing rail service disruption. Sowerby Bridge was also listed as a location where a Flood Hub was opened to support affected residents. [IMG,PAG] (p50)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>132 business properties; 76 residential properties [IMG,PAG] (p41)</p></div><div class="nugget-popup quant"><p>132 business properties; 76 residential properties [PAG,IMG,MUL] (p42)</p></div></div></body></div>`)[0];

                var html_0a331a92e31dbcc4c591194889bc8376 = $(`<div id="html_0a331a92e31dbcc4c591194889bc8376" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Elland</h1><div class="nugget-popup"><p>Elland experienced flooding during Storm Ciara that contributed to mass property and infrastructure damage across the Calder Valley, with residential and business properties flooded and damage to roads and other infrastructure. [PAG] (p8)</p></div><div class="nugget-popup"><p>Listed among the towns that experienced mass property and infrastructural damage during the February 2020 storm; significant numbers of residential and business properties were flooded and major infrastructure (roads and bridges) were seriously damaged in the Calder Valley. [IMG] (p9)</p></div><div class="nugget-popup"><p>The Elland gauge recorded a significant flood peak and associated high flow during the 9 February 2020 event. [TAB] (p27)</p></div><div class="nugget-popup"><p>Fluvial (river) flooding associated with the River Calder produced mapped clusters of flooded properties in the Elland and Greetland ward group (flooding recorded as internal and/or external). The Elland gauge record shows the event was significant in the gauge record. [IMG] (p29)</p></div><div class="nugget-popup"><p>Flooding in the Elland area contributed to increased surface water volumes and local road closures; the broader area saw internal flooding of residential properties and overwhelmed drainage infrastructure. [PAG] (p42)</p></div><div class="nugget-popup"><p>Elland experienced combined&ndash;source flooding (fluvial, canal breaches, surface water, blocked gullies, sewer overflows and hillslope runoff). Residential properties around Park Road suffered internal flooding. Large volumes of surface water were reported at Stainland Road, Long Heys, Hammerstones Leach Lane, Crestfield Crescent and South Lane. A culvert on Stainland Road was blocked causing water to back up, and drains on Gosport Lane and Gosport Close were overwhelmed. Elland Bridge channel was partially blocked by a 13m shipping container which reduced the bridge opening by 7%, increasing surface water volumes and causing road closures from further bank overtopping. [PAG,IMG] (p43)</p></div><div class="nugget-popup"><p>Environment Agency issued flood warnings for the River Calder at Elland on 9 February 2020 (covers sections from Saddleworth Road to Lowfields Business Park and North Dean Business Park to Park Road), indicating river flooding risk to Elland and nearby business parks and roads. [TAB,PAG] (p47)</p></div><div class="nugget-popup"><p>Elland Lock (canal) experienced bank overtopping due to inundation from a flooded towpath; canal water inundation was reported around the lock and dam gates were opened to release water but refilled after reclosure. [PAG] (p48)</p></div><div class="nugget-popup"><p>Park Road, Elland experienced significant localised flooding from about 10:30 on 9 February 2020. Water was slow to recede (reported around 19:30), some front doors were buckling and main roads were closed. (p50)</p></div><div class="nugget-popup"><p>Canal towpath in Elland remained covered by silt and sludge following the flood; the park on Park Road (Elland) had a drainage system that was reportedly blocked and overgrown and required testing, clearing and repair after the 9 February 2020 flood. (p51)</p></div><div class="nugget-popup"><p>Areas of Elland (notably Park Lane/Park Road) suffered significant flooding on 9th February 2020 due to interacting fluvial, canal and surface water sources, with additional surface runoff from the hillside contributing to impacts. [TAB] (p53)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>return period 35&ndash;40 years; ranking 3 in 50&ndash;year gauge record [IMG] (p29)</p></div></div></body></div>`)[0];
