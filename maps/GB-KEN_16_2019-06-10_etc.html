                var html_de82f612d30d1da356bae82fab8e0bf9 = $(`<div id="html_de82f612d30d1da356bae82fab8e0bf9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Vigo Village</h1><div class="nugget-popup"><p>Vigo was described as particularly badly affected by very heavy rainfall on 10 June 2019; properties in the Vigo area were flooded by surface water and many were affected internally. (p1)</p></div><div class="nugget-popup"><p>Multiple residential properties were affected by flooding with clusters of affected properties in the central and eastern residential zones and some on the western edge of the village. [IMG] (p2)</p></div><div class="nugget-popup"><p>The village experienced both external and internal property flooding during the event (including a report under the heading 'Vigo School' of external and internal flooding). Multiple residential properties on named streets in the village were affected (internal and external), and roads were impacted by surface water. [PAG] (p4)</p></div><div class="nugget-popup"><p>Surface water flooding flowed from the woodland south of Admers Wood, crossed Erskine, travelled along Admers Wood and Beech Mast, then along footpaths into Ferndown Road. Fire Brigade attended and pumped flood water. (p7)</p></div><div class="nugget-popup"><p>Prolonged heavy rainfall and overland flows from surrounding woodland and rural catchment led to significant surface water flooding across the village. Surface water runoff combined with overwhelmed private and highway drainage; foul sewers (foul&ndash;only public sewers) contributed to sewer surcharging and manhole overflows in parts of the village. [PAG] (p8)</p></div><div class="nugget-popup"><p>A heavy rainstorm (reported as a 1&ndash;in&ndash;217&ndash;year event) overwhelmed highway drainage. Overland flows from developed areas, surrounding woodland and rural catchment travelled along dry valleys and collected at local topographical low points, causing flooding to properties in the village. (p11)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>around 100 properties (Vigo and Culverstone combined) (p1)</p></div><div class="nugget-popup quant"><p>5 properties on Rhododendron Avenue; 1 property on White Post Lane; 1 property on Meadow Lane; 1 property on Wrotham Road [PAG] (p4)</p></div></div></body></div>`)[0];
                popup_a1e33f5c4e79ea5e59cc945ce32c982a.setContent(html_de82f612d30d1da356bae82fab8e0bf9);

                var html_716bf5797002ddfee11006bfa7743790 = $(`<div id="html_716bf5797002ddfee11006bfa7743790" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Culverstone Green</h1><div class="nugget-popup"><p>Properties in Culverstone were flooded by surface water during the 10 June 2019 event; many properties were affected internally. Additional flooding incidents affecting properties in Culverstone occurred on 20 December 2019 and 9 February 2020 following further heavy rain on saturated ground. [MUL] (p1)</p></div><div class="nugget-popup"><p>Properties in Culverstone were affected by flooding; roads in the area received emergency repairs (locations marked on the map). [IMG] (p2)</p></div><div class="nugget-popup"><p>At least one property in Culverstone (Heron Hill Lane) reported internal flooding to the cellar. [PAG] (p4)</p></div><div class="nugget-popup"><p>Surface water flooding affected roads (including Rhododendron Avenue) and caused internal flooding to at least one property in the village. (p8)</p></div><div class="nugget-popup"><p>A heavy rainstorm overwhelmed drainage and caused overland flows from developed areas and surrounding catchments to flow along dry valleys and collect in local topographical lows, causing flooding to properties in the village and vicinity. [PAG] (p10)</p></div><div class="nugget-popup"><p>The same extreme storm overwhelmed drainage causing overland flows to follow dry valleys and collect at local low points, resulting in flooding to properties. Drainage asset issues were identified: the soakaway at the junction of White Post Lane and Carters Hill Road is functioning but nearing end of life; soakaways at Whitepost Lane/Rhododendron Avenue and Meadow Lane were found in good condition; gullies at Harvel Road and Southfield Shaw require further investigation and the soakaway at that location is to be inspected. [PAG] (p11)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>around 100 properties (Vigo and Culverstone combined) [MUL] (p1)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p4)</p></div><div class="nugget-popup quant"><p>one property (p8)</p></div></div></body></div>`)[0];
