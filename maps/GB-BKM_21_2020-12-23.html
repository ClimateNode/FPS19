                var html_c814de3fb6ba2e84023d76eb9538d043 = $(`<div id="html_c814de3fb6ba2e84023d76eb9538d043" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Great Ouse</h1><div class="nugget-popup"><p>The River Great Ouse experienced extreme flows during the event on 23rd and 24th December 2020, producing elevated flood risk along its corridor through Buckingham. This prompted designated flood warning areas for low&ndash;lying locations alongside the river (Fulwell, Radclive and parts of Buckingham) and threatened streets and residential areas adjacent to the channel. [IMG] (p29)</p></div></div></body></div>`)[0];

                var html_c1f2a98cfcbfcddf240683d0ebd7262d = $(`<div id="html_c1f2a98cfcbfcddf240683d0ebd7262d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Buckinghamshire</h1><div class="nugget-popup"><p>Across the county there were widespread flood impacts during the storm: Transport for Buckinghamshire managed many road closures and issued sandbags prioritised by need. Anglian Water reported very high flows in its network, pumping stations ran at full capacity, staff visited locations experiencing surface water and foul sewage flooding and advised some residents not to flush toilets. Council incident teams and volunteer LALOs were deployed countywide to support communities. (p6)</p></div></div></body></div>`)[0];

                var html_113d6bb1b40926e013cd2b83414ee230 = $(`<div id="html_113d6bb1b40926e013cd2b83414ee230" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Buckingham</h1><div class="nugget-popup"><p>Internal flooding of residential properties in the town. The December 2020 event caused internal flooding to properties; previous events in April 1998 and July 2007 also resulted in substantial property flooding, with additional smaller events in November 2012 and March 2016. [MUL] (p5)</p></div><div class="nugget-popup"><p>Properties in Buckingham flooded during the storm; the Environment Agency issued a Flood Warning only after many properties had already flooded, limiting residents' ability to respond. Roads in and around the town were closed. Community volunteers used pumps and buckets to protect properties; the Community Centre was opened for food, drink and rest. The University of Buckingham sand&ndash;bagged at&ndash;risk buildings, moved electrical equipment, provided emergency accommodation to students whose homes were flooded, and set up a local grants fund. (p6)</p></div><div class="nugget-popup"><p>Flooding caused internal flooding of properties (including non&ndash;residential), external flooding to properties, flooding of roads and car parks, displacement of residents, damage to possessions and stock, and financial and mental&ndash;health impacts for residents. [PAG] (p7)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties, including basements; the flooding event caused internal flooding to at least 72 properties in the town. (p14)</p></div><div class="nugget-popup"><p>The town, situated on the River Great Ouse which flows through the centre, was impacted by flooding during the 23rd&ndash;24th December 2020 event. [PAG] (p15)</p></div><div class="nugget-popup"><p>River Great Ouse floodwaters affected low&ndash;lying areas of Buckingham adjacent to the river. Flood warning areas and zones included specific streets and neighbourhoods in the town, indicating river flooding risk and exposure during the extreme flows experienced in December 2020. [IMG] (p29)</p></div><div class="nugget-popup"><p>Areas of Buckingham alongside the River Great Ouse were subject to extreme river flows during the event on 23rd and 24th December 2020. The town contains low&ndash;lying streets and locations (e.g. Fulwell, Radclive, Brackley Road, Newcombe Crescent, Foundry Drive, School Lane, Nelson Street, Hunter Street, Chandos Road, Victoria Row, Ford Street, Stratford Road, Marsh Edge, West Street, Fisher's Field, Candleford Court, Cornwall's Meadow and Wharfside Place) that are within Environment Agency flood warning areas and were at risk from River Great Ouse flooding during the December 2020 event. [PAG] (p30)</p></div><div class="nugget-popup"><p>The town experienced flooding in December 2020 which has prompted a review of the Buckingham Flood Plan. [PAG] (p32)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 72 properties; 75 properties; 96 properties [MUL] (p5)</p></div><div class="nugget-popup quant"><p>at least 72 properties (including at least 11 non&ndash;residential); at least 15 properties external flooding [PAG] (p7)</p></div><div class="nugget-popup quant"><p>72 properties (p14)</p></div></div></body></div>`)[0];
