                var html_87d20059705aa528d26f950febbd310c = $(`<div id="html_87d20059705aa528d26f950febbd310c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Gold Brook</h1><div class="nugget-popup"><p>Gold Brook exceeded its channel capacity and overtopped its banks during Storm Babet, contributing a fluvial element to internal flooding of properties on Low Street, Abbey Hill, Nuttery Vale, Denham Low Road and Chickering Road. (p7)</p></div><div class="nugget-popup"><p>Exceeded channel capacity and overtopped its banks on 20 October 2023, contributing a fluvial element to internal flooding of properties on Low Street, Abbey Hill, Nuttery Vale, Denham Low Road and Chickering Road in Hoxne. [PAG,IMG] (p8)</p></div><div class="nugget-popup"><p>Gold Brook (the watercourse after the confluence) produced elevated fluvial flows that, together with Chickering Beck, led to flooding in and around Hoxne and overwhelmed local drainage during the event. [PAG] (p11)</p></div><div class="nugget-popup"><p>Named as the downstream watercourse at the confluence with Chickering Beck; elevated flows in Gold Brook during Storm Babet were linked to fluvial flooding of low&ndash;lying parts of Hoxne. [PAG] (p12)</p></div><div class="nugget-popup"><p>As the downstream watercourse at the confluence with Chickering Beck, Gold Brook contributed to converging high flows that overwhelmed drainage and watercourses near Hoxne during the storm, contributing to flooding in the village. [PAG] (p13)</p></div><div class="nugget-popup"><p>Gold Brook overtopped its banks upstream of Swan bridge, flooding adjacent fields and areas. The overtopping increased flows that, when constricted at Swan bridge, caused back&ndash;up that inundated gardens and multiple properties on Low Street, contributing to internal flooding and merging with surface&ndash;water from the highway which overwhelmed highway drainage. (p16)</p></div><div class="nugget-popup"><p>Gold Brook overtopped its banks; fields and areas either side of the watercourse upstream of the bridge were extensively flooded and the high flows contributed to backing up at Swan bridge, exacerbating downstream flooding of gardens and properties. [PAG] (p17)</p></div><div class="nugget-popup"><p>Overtopped across surrounding fields and flowed onto Abbey Hill, surrounding properties and contributing to internal flooding of some houses from the front. [PAG] (p18)</p></div><div class="nugget-popup"><p>Gold Brook exceeded its capacity and overtopped; surface water runoff from surrounding fields overwhelmed the small channel, causing internal flooding of properties at Nuttery Vale and contributing to flood impacts around Abbey Hill. The channel conveyance is reduced by a constricting road bridge at Nuttery Vale. [PAG] (p19)</p></div><div class="nugget-popup"><p>The Gold Brook watercourse exceeded capacity and overtopped; the relatively small channel was overwhelmed by surface water runoff from surrounding fields, causing overtopping that led to internal flooding of nearby properties. (p20)</p></div><div class="nugget-popup"><p>The Gold Brook watercourse exceeded capacity and overtopped after heavy rainfall, causing floodwater to flow across adjacent low&ndash;lying land and into properties. Its small channel, surface water run&ndash;off from surrounding fields, and a constricting road bridge reduced conveyance leading to overtopping and downstream flooding (including impacts at Nut Tree Vale and Denham Low Road). [PAG,IMG] (p21)</p></div><div class="nugget-popup"><p>Overtopped its banks following heavy rainfall on 20 October, flowing across surrounding fields and causing internal property flooding on Denham Low Road. (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>10 to 45 cm deep (p16)</p></div><div class="nugget-popup quant"><p>up to 60cm of water flooding internally (some buildings) [PAG] (p19)</p></div><div class="nugget-popup quant"><p>up to 60cm of internal flooding reported in some properties [PAG,IMG] (p21)</p></div></div></body></div>`)[0];

                var html_a5084bec003cd01a5eb0f94f497e0a0f = $(`<div id="html_a5084bec003cd01a5eb0f94f497e0a0f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Green Street, Hoxne</h1><div class="nugget-popup"><p>Flooding on Green Street was caused primarily by surface water run&ndash;off combined with overwhelmed sewerage and drainage infrastructure. (p7)</p></div><div class="nugget-popup"><p>Listed as one of the eight investigation locations identified as being affected by flooding during the 18 Oct 2023&ndash;21 Oct 2023 event. Suffolk Highways records also show historic reports of flooding on Green Street. (p9)</p></div><div class="nugget-popup"><p>Experienced surface water (pluvial) flooding during Storm Babet; the area was affected by flooding in the event. (p10)</p></div><div class="nugget-popup"><p>On the morning of 20 October heavy rainfall caused large volumes of surface water to pool on the carriageway near Church Close. Floodwater flowed off the highway over low kerbs and across driveways, causing internal flooding to houses (primarily from the front). Some properties also experienced rear flooding from higher gardens to the south. The volume of water on the road likely overwhelmed highway drainage; initial investigations indicate a possible break between a drainage gully and a manhole. Suffolk Highways are aware and have proposed future works. [IMG,PAG] (p15)</p></div><div class="nugget-popup"><p>Prolonged heavy rainfall on 20 October caused large amounts of surface water to pool on the highway and flow off the carriageway over low kerbs and across driveways into properties. Houses were flooded internally (primarily from the front) and some properties also flooded from the rear as surface water ran from higher gardens south of Green Street. Highway drainage assets were overwhelmed and a possible break between a gully and manhole was identified. [PAG] (p16)</p></div><div class="nugget-popup"><p>Properties on Green Street flooded during Storm Babet; site is recorded on the Suffolk Highways Flood Site register and Property Flood Resilience (PFR) offers have been made to affected properties. [TAB] (p27)</p></div></div></body></div>`)[0];

                var html_82e72447e9e64e50ea09b247f6e29659 = $(`<div id="html_82e72447e9e64e50ea09b247f6e29659" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cross Street, Hoxne</h1><div class="nugget-popup"><p>Cross Street experienced flooding driven by surface water run&ndash;off combined with overwhelmed sewerage and drainage infrastructure. [IMG] (p7)</p></div><div class="nugget-popup"><p>Listed as one of the eight investigation locations identified as being affected by flooding during the 18 Oct 2023&ndash;21 Oct 2023 event. [IMG] (p9)</p></div><div class="nugget-popup"><p>Reports of internal flooding on Cross Street resulting from sewer blockages (reported to Anglian Water over the last five years). Cross Street was also identified as being affected by surface water flooding during Storm Babet (October 2023). (p10)</p></div><div class="nugget-popup"><p>Experienced surface water flooding during Storm Babet. [IMG,PAG] (p11)</p></div><div class="nugget-popup"><p>Multiple properties on Cross Street were impacted by surface water flooding during heavy rainfall (morning of 20 October). Floodwater pooled on the road as highway gullies and sewer infrastructure reached capacity. Manholes were reported surcharging and bubbling with a mixture of foul water and rainwater in the middle of the street; roadside gullies were reported blocked or overwhelmed. [IMG,PAG] (p20)</p></div><div class="nugget-popup"><p>Multiple properties were impacted by surface&ndash;water pooling on the carriageway during heavy rainfall (morning of 20 October) as highway gullies and sewer infrastructure reached capacity. Manholes were surcharging and bubbling with a mixture of foul water and rainwater in the road; blocked/overwhelmed roadside gullies and additional surface water entering from fields (filling the rear ditch) reduced drainage effectiveness and added to the flooding. [PAG,IMG] (p21)</p></div><div class="nugget-popup"><p>Gullies and drainage features on Cross Street were subject to cleansing (annual cyclic cleanse in June 2024) and additional watercourse maintenance (clearing debris, fallen trees and silt removal) as part of post&ndash;flooding works following the Storm Babet event. [TAB] (p27)</p></div></div></body></div>`)[0];

                var html_d3092a813a9f948d8eb25b733d45c771 = $(`<div id="html_d3092a813a9f948d8eb25b733d45c771" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Low Street, Hoxne</h1><div class="nugget-popup"><p>Internal flooding of residential and commercial properties on Low Street during Storm Babet; flooding included a fluvial element caused by local watercourses (Gold Brook/Chickering Beck) exceeding capacity and overtopping banks, combined with surface water run&ndash;off. (p7)</p></div><div class="nugget-popup"><p>Listed as one of the eight investigation locations identified as being affected by flooding during the 18 Oct 2023&ndash;21 Oct 2023 event. (p9)</p></div><div class="nugget-popup"><p>Low Street was identified as an area at high risk of fluvial flooding and was affected by flooding during Storm Babet. (p11)</p></div><div class="nugget-popup"><p>Excess surface water flowed down the gradient from the north end of Low Street towards the Swan bridge area. Surface water drainage was inhibited by clogged gullies; a manhole in front of the Swan pub was surcharging from 09:30 on 20 October. This surcharging merged with surface water, pooling across the highway to the pub, Swan Bridge and along Sandpit Lane. Floodwater from the overtopping Gold Brook and Chickering Beck backed up at Swan Bridge, flowed across gardens and into properties. Multiple properties suffered internal flooding (depths reported), the area was submerged by mid&ndash;afternoon and highway drainage could not discharge to the overfull watercourse. Floodwater began to recede overnight and Low Street was clear by the morning of 21 October. Some properties flooded again during Storm Ciaran (1 &ndash; 2 November 2023). [PAG,MUL] (p16)</p></div><div class="nugget-popup"><p>Intense, prolonged rainfall caused excess surface water to flow down Low Street from the north, merging with surcharging water from a manhole (surcharging observed from 09:30 on 20 Oct). Water pooled around the Swan pub and bridge area, flowed across gardens and into properties causing internal flooding (depths reported), and the highway drainage was overwhelmed and could not discharge into the overfull watercourse. Flood levels on Low Street peaked around 20:30 on 20 Oct and electricity failed on Low Street at 21:15. Floodwater receded by the morning of 21 Oct. Some properties on Low Street were reported to have flooded internally again during Storm Ciaran (1&ndash;2 Nov 2023). [PAG,IMG,MUL] (p17)</p></div><div class="nugget-popup"><p>Identified in LLFA recommendations for investigation of highway drainage capacity and Anglian Water assets near the Swan pub; residents and officers asked to report observed blockages below Swan bridge, indicating drainage failure or blockages were associated with the flooding response in the area. [IMG,PAG] (p18)</p></div><div class="nugget-popup"><p>The residential street was inundated with muddy floodwater extending along its length, reaching the entrances of multiple houses and covering public street furniture, affecting access and properties. [IMG] (p23)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>properties flooded internally ranging from 10 to 45 cm deep [PAG,MUL] (p16)</p></div><div class="nugget-popup quant"><p>internal flooding depths 10&ndash;45 cm [PAG,IMG,MUL] (p17)</p></div></div></body></div>`)[0];

                var html_dd5b60e4f28899711f10b1b3576de42d = $(`<div id="html_dd5b60e4f28899711f10b1b3576de42d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Abbey Hill, Hoxne</h1><div class="nugget-popup"><p>Internal flooding of properties on Abbey Hill during Storm Babet, with some fluvial contribution from local watercourses (Gold Brook/Chickering Beck) overtopping their banks. (p7)</p></div><div class="nugget-popup"><p>Listed as one of the eight investigation locations identified as being affected by flooding during the 18 Oct 2023&ndash;21 Oct 2023 event. Suffolk Highways records indicate Abbey Hill has been reported to flood historically. (p9)</p></div><div class="nugget-popup"><p>Abbey Hill was identified as an area at high risk of fluvial flooding and was affected by flooding during Storm Babet. (p11)</p></div><div class="nugget-popup"><p>Listed among the lowest&ndash;lying locations in Hoxne and identified as one of the worst affected areas by flooding following Storm Babet. [PAG] (p12)</p></div><div class="nugget-popup"><p>Fluvial flooding from Chickering Beck and Gold Brook overtopped and flowed across gardens from about 11:30am on 20 October; floodwater began entering houses from early afternoon and some properties were flooded internally from the front. Surface&ndash;water runoff on the highway down the hill also contributed, surrounding properties with floodwater. [PAG] (p17)</p></div><div class="nugget-popup"><p>Chickering Beck and Gold Brook exceeded capacity and overtopped. Floodwater flowed across gardens from approximately 11:30 on 20 October and began entering houses from the early afternoon; some houses were flooded internally from the front. Surface water running down the highway also contributed. Highway drainage (gullies) were overwhelmed and ineffective due to silt build&ndash;up and blockages, reducing the road's ability to drain floodwater. [IMG,PAG] (p18)</p></div><div class="nugget-popup"><p>Floodwater from overtopping watercourses spread across fields and gardens and impacted multiple properties along Abbey Hill. Surface water on the highway flowed down Abbey Hill toward properties; existing highway drainage assets were overwhelmed and gullies were found silted/blocked (root ingress noted), requiring clearing after Storm Babet. [PAG] (p19)</p></div><div class="nugget-popup"><p>Site recorded on the Suffolk Highways flood site register; extensive investigations (jetting and CCTV) were carried out in 2023 in response to flooding and future works are to be programmed. [TAB] (p27)</p></div></div></body></div>`)[0];

>Quantified impacts</i><div class="nugget-popup quant"><p>up to 60 cm internal flooding in some buildings [PAG] (p19)</p></div><div class="nugget-popup quant"><p>up to 60cm of water flooding internally [IMG,PAG] (p20)</p></div><div class="nugget-popup quant"><p>up to 60cm of water flooding internally (reported in some buildings) [IMG] (p21)</p></div></div></body></div>`)[0];

                var html_b2daf168d873b70a1895daeaeeb85b34 = $(`<div id="html_b2daf168d873b70a1895daeaeeb85b34" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hoxne</h1><div class="nugget-popup"><p>Street&ndash;level inundation affecting residential properties and public street furniture (traditional red telephone box); floodwaters reached the base of buildings and covered the street. [IMG] (p1)</p></div><div class="nugget-popup"><p>Intense rainfall and converging overland flow paths overwhelmed natural flow routes, watercourses and drainage infrastructure, resulting in internal flooding of properties and disruption to infrastructure and services. (p4)</p></div><div class="nugget-popup"><p>Major flooding on 20 October 2023 caused internal flooding to residential and commercial properties. Fluvial flooding occurred where Gold Brook and Chickering Beck exceeded their banks and contributed to inundation on Low Street, Abbey Hill, Nuttery Vale, Denham Low Road and Chickering Road. Surface water runoff combined with overwhelmed sewer and drainage infrastructure caused flooding on Green Street, Cross Street and Eye Road. [IMG,PAG] (p7)</p></div><div class="nugget-popup"><p>Major flooding on 20 October 2023 causing internal flooding to properties. Flooding was from both fluvial (rivers/overtopping) and pluvial (surface water run&ndash;off) sources, with overwhelmed sewerage and drainage infrastructure. Flood water affected properties on Low Street, Abbey Hill, Nuttery Vale, Denham Low Road and Chickering Road (including a fluvial element from nearby watercourses) and surface&ndash;water/sewer&ndash;induced flooding on Green Street, Cross Street and Eye Road. [PAG] (p8)</p></div><div class="nugget-popup"><p>Hoxne lay within an Environment Agency Flood Alert (issued 20 Oct 2023) and the investigation identified multiple parts of the village affected by flooding during the event. Eight distinct locations within the Hoxne investigation area were identified as being affected: Green Street, Low Street, Abbey Hill, Eye Road, Nuttery Vale, Cross Street, Denham Low Road and Chickering Road. The EA also stated it cannot issue warnings for local watercourses (Chickering Beck and Gold Brook). [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>Low&ndash;lying village at the confluence of Chickering Beck and Gold Brook experienced fluvial flooding as high flows from the two tributaries converged; drainage infrastructure was overwhelmed leading to inundation in the village during the event. [PAG] (p11)</p></div><div class="nugget-popup"><p>The village experienced fluvial flooding during Storm Babet, with convergence of tributary flows causing inundation of low&ndash;lying roads and areas. [PAG,IMG] (p12)</p></div><div class="nugget-popup"><p>Low&ndash;lying parts of the village experienced flooding during intense rainfall associated with Storm Babet. Considerable flows converged at the confluence of Chickering Beck and Gold Brook, overwhelming drainage and watercourses and causing flooding in the village. Low Road, Abbey Hill and Nuttery Vale were identified as some of the worst affected areas. [PAG,IMG] (p13)</p></div><div class="nugget-popup"><p>Storm Babet (19&ndash;20 October) produced heavy rainfall over the Hoxne catchment that led to surface water flooding of low&ndash;lying areas. Highway surfaces and flow paths conveyed large volumes of water, overwhelming drainage and causing internal flooding to houses (see Green Street reports). Surface water moved across low kerbs and driveways and also entered properties from higher gardens. (p15)</p></div><div class="nugget-popup"><p>Intense/prolonged rainfall caused excess surface water to flow down Low Street and merge with surcharging water from a manhole. The Gold Brook overtopped upstream of the bridge; Swan Bridge acted as a constriction causing water to back up and flow across gardens and the highway. Multiple properties suffered internal flooding (front and garden entry), the Swan pub carpark was inundated, and highway drainage was overwhelmed. Floodwater peaked in the evening and caused an electricity outage on Low Street; water had receded by the morning of 21 October. Some properties flooded again during Storm Ciaran (1&ndash;2 Nov 2023). [PAG,IMG,MUL] (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 25 properties (p4)</p></div><div class="nugget-popup quant"><p>approximately 25 properties [IMG,PAG] (p7)</p></div><div class="nugget-popup quant"><p>approximately 25 properties [PAG] (p8)</p></div><div class="nugget-popup quant"><p>8 distinct locations [IMG,PAG] (p9)</p></div><div class="nugget-popup quant"><p>10 to 45cm internal flooding depth [PAG,IMG,MUL] (p17)</p></div></div></body></div>`)[0];
