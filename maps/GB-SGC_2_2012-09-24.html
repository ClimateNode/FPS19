                var html_01d0b7ca3dd4d48c905bfbdce6f27b84 = $(`<div id="html_01d0b7ca3dd4d48c905bfbdce6f27b84" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>NHS Blood and Transplant Filton</h1><div class="nugget-popup"><p>Subject of a Section 19 flood investigation following a flood event. (p1)</p></div><div class="nugget-popup"><p>Internal flooding of the NHS Blood and Transplant centre &mdash; all blood donations were removed and the site was closed until it had dried and been cleaned. The centre's recovery programme returned it to full operation two weeks after the event. (p2)</p></div><div class="nugget-popup"><p>Internal flooding of the NHS Blood and Transplant Centre (critical infrastructure) occurred, triggering the Section 19 flood investigation. (p7)</p></div><div class="nugget-popup"><p>Evacuated the site of people and blood stock during the flood incident; were involved throughout the incident and produced post&ndash;event reviews focused on emergency procedures. [PAG] (p8)</p></div><div class="nugget-popup"><p>Flooding inundated the NHS Blood and Transplant Filton site on 24th September 2012. The site surface water drainage network was overwhelmed (due to downstream constraints in the culverted watercourse and attenuation pond threatening to overspill). Blood stocks were moved to other sites and the centre was non&ndash;operational during recovery. (p12)</p></div><div class="nugget-popup"><p>The NHS Blood organisation's Filton facility was flooded on 24th September 2012, triggering the organisation's emergency response (blood relocated to other sites) and a temporary operational outage until recovery within two weeks. (p13)</p></div></div></body></div>`)[0];
                popup_185ef9cf1fa1c07aa5194c2040653a3a.setContent(html_01d0b7ca3dd4d48c905bfbdce6f27b84);

                var html_21add16dba3a3529eee052c795f8061f = $(`<div id="html_21add16dba3a3529eee052c795f8061f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Stoke Brook</h1><div class="nugget-popup"><p>Catastrophic failure/blockage of culverts conveying the Stoke Brook caused water to collect upstream and led to rapid flooding of the NHS centre. Culverts were previously deformed and had emergency remedial measures in place (pumps) that were insufficient. (p2)</p></div><div class="nugget-popup"><p>Stoke Brook (the main river / local watercourse referenced) caused or contributed to flooding that affected Filton and the NHS Blood and Transplant Centre. (p7)</p></div><div class="nugget-popup"><p>The tributary to Stoke Brook runs north of the site, takes drainage from a wider catchment (including Filton Airfield) and is culverted through Network Rail land; high upstream water levels and culvert issues were associated with flooding. The culverted channel and its condition (deformation/fracture of the culvert) contributed to the watercourse behaviour during flood events. [IMG,MUL] (p9)</p></div><div class="nugget-popup"><p>Levels on Stoke Brook rose overnight (23&ndash;24 September 2012), triggering telemetry alarms. The gauge upstream of the Filton culverts recorded a peak level of 2.8m at 10:00 on 24th September 2012. The raised levels, exacerbated by culvert blockage, contributed to upstream flooding (peak flood level estimated around 50.6&ndash;50.7mAOD). (p13)</p></div><div class="nugget-popup"><p>Stoke Brook is identified as the watercourse where fluvial flooding occurred and which concentrated flood risk locally. The brook and its culvert were implicated in the flood event; remedial reinforcement works on the culvert and measures (over&ndash;pumping) were implemented and flood zoning boundaries around the brook were reduced after improvement works. [PAG,IMG] (p16)</p></div></div></body></div>`)[0];
                popup_7c11a6c3b03f30929aa41460c8a2a5f4.setContent(html_21add16dba3a3529eee052c795f8061f);

                var html_f22f3d7f23d04a28b5c7757616c53529 = $(`<div id="html_f22f3d7f23d04a28b5c7757616c53529" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Stoke Gifford</h1><div class="nugget-popup"><p>On 24 September 2012 floodwater ponded upstream of partially blocked railway culverts in the Stoke Gifford area, causing the NHS blood donation centre to be flooded: water entered the building at 09:00, the majority of the ground floor was flooded within 20 minutes, flood depth of 150mm was recorded inside, and the building lost power within an hour; the site was closed, donations removed, and the centre was returned to full operation after about two weeks following drying and cleaning. [PAG,IMG] (p15)</p></div></div></body></div>`)[0];
