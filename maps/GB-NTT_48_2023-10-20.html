                var html_7b32109ad3bf5e893386793f12df5610 = $(`<div id="html_7b32109ad3bf5e893386793f12df5610" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Idle</h1><div class="nugget-popup"><p>The River Idle rose through 20th, 21st, 22nd and the early morning of 23rd October 2023, reaching a peak level of 1.79m and exceeding the previous record. This high river level caused flooding in the Ordsall area. [PAG] (p3)</p></div><div class="nugget-popup"><p>The River Idle rose through 20th&ndash;23rd October and overtopped its defences. The overtopping released water onto the highway at the south side of the bridge, initiating flows across nearby streets, into adjacent fields and contributing to internal flooding of properties in Ordsall. [IMG,PAG] (p4)</p></div><div class="nugget-popup"><p>The River Idle caused flooding through Retford town centre and downstream during Storm Babet; the Environment Agency will de&ndash;silt the river through the town centre and downstream, carry out tree works to improve flow, and is investigating upstream flood storage to reduce future flooding. [PAG] (p8)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>peak level 1.79m [PAG] (p3)</p></div><div class="nugget-popup quant"><p>Reached a peak level of 1.79m (above previous record of 1.65m) [IMG,PAG] (p4)</p></div></div></body></div>`)[0];

                var html_273af8c1a6ad8c425be2a124a12f1eba = $(`<div id="html_273af8c1a6ad8c425be2a124a12f1eba" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ordsall</h1><div class="nugget-popup"><p>Sustained heavy rainfall (Storm Babet) caused a flood event in Ordsall resulting in internal flooding of residential properties and a business, and additional flooding to gardens and outbuildings. (p1)</p></div><div class="nugget-popup"><p>Residential properties and at least one business experienced internal flooding; additional flooding affected gardens and outbuildings. Roads and properties were flooded more quickly because the ground was already saturated after a prolonged period of rain. [PAG] (p2)</p></div><div class="nugget-popup"><p>Parts of Ordsall were affected by flooding associated with the River Idle rising; specific streets within Ordsall were identified as flood&ndash;affected. [IMG,PAG] (p3)</p></div><div class="nugget-popup"><p>Ordsall experienced fluvial flooding driven by the River Idle rising and overtopping its defences; floodwaters affected highways, adjacent fields and caused internal flooding to residential and business properties in the town. [IMG,PAG] (p4)</p></div><div class="nugget-popup"><p>Ordsall was affected by flooding from the River Idle during Storm Babet; the Environment Agency is investigating upstream flood storage options that may benefit Ordsall, and a multi&ndash;agency drop&ndash;in event is planned. (p8)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>6 residential properties; 1 business (p1)</p></div><div class="nugget-popup quant"><p>6 residential properties; 1 business [PAG] (p2)</p></div><div class="nugget-popup quant"><p>Three residential properties and one business internally flooded on All Hallows Road; three residential properties internally flooded on Goosemoor Lane [IMG,PAG] (p4)</p></div></div></body></div>`)[0];
