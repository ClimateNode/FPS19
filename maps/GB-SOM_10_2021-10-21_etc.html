                var html_02b24c4ade988056d82355511a7bc8ce = $(`<div id="html_02b24c4ade988056d82355511a7bc8ce" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1>Glynswood, Chard</h1><div class="nugget-popup"><p>The Glynswood neighbourhood was impacted by flooding during the heavy rainfall event of 21&ndash;22 October 2021. The report includes resident&ndash;submitted photographs of flooding in progress and characterises the rainfall as roughly a 1&ndash;in&ndash;38&ndash;year event (less severe than a 1&ndash;in&ndash;100&ndash;year event). [IMG] (p5)</p></div><div class="nugget-popup"><p>Flooding reported around Glynswood with internal property flooding affecting properties in the area. [TAB] (p11)</p></div><div class="nugget-popup"><p>Two properties in Glynswood were internally flooded. Part of the flooding was due to the local stream (running across open ground behind the secondary school) backing up; blockage at the debris grid to the culvert or lack of culvert capacity was suspected to have contributed. Surface water also flowed from nearby pinch points (Catch Gate Lane, Thorndon Park) onto Glynswood. [PAG] (p13)</p></div><div class="nugget-popup"><p>Two properties internally flooded in Glynswood. Flooding was caused in part by a stream running across open ground behind the secondary school backing up; contributors may have included a blocked debris grid at a culvert and/or insufficient culvert capacity, in combination with overland flow of rainwater. [TAB] (p14)</p></div><div class="nugget-popup"><p>Area was the focus of public concern about a sluice; Wessex Water attended the Glynswood area to investigate sewer flooding and surface water entering the sewer system during the event. [TAB] (p16)</p></div><div class="nugget-popup"><p>Wessex Water attended the Glynswood area to investigate sewer flooding and surface water entering the sewer system; residents reported concerns about a sluice. There were reports of residents lifting sewer manhole covers to release surface water, which caused sewer surcharging elsewhere. (p17)</p></div><div class="nugget-popup"><p>Surface water ran into a brook that conveyed flows through open space in Glynswood and entered a culverted section beneath properties at the eastern end; the culvert acted as a bottleneck that restricted flows and increased local flooding risk during the event. [IMG] (p19)</p></div><div class="nugget-popup"><p>Photographic evidence in the report (Figure 9) shows flooding occurring on Glynswood in Chard; the street was inundated by floodwater. (p22)</p></div><div class="nugget-popup"><p>Street flooding covered a significant portion of the roadway and extended to the verge/entrances of adjacent residential properties; multiple parked cars were partially in standing water; residents observed/stood near houses suggesting risk to homes and the need for immediate attention. Water depth visually shallow (a few centimetres) but sufficient to inundate the road surface and approach doorways. [IMG] (p23)</p></div></div></body></div>`)[0];

                var html_ac03d2f88844f3e267c992792d113738 = $(`<div id="html_ac03d2f88844f3e267c992792d113738" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Chard</h1><div class="nugget-popup"><p>Following heavy rainfall on 21&ndash;22 October 2021 the town experienced flooding: streets and urban areas were inundated and properties were affected. The event was assessed as 1&ndash;in&ndash;38&ndash;year intensity, so extent and depths were less than those shown for a 1&ndash;in&ndash;100&ndash;year event. [IMG] (p5)</p></div><div class="nugget-popup"><p>Flooding occurred around Catchgate Lane (northwest), Beeching Close (northeast) and Glynswood. Several properties and businesses were flooded, with water reported up to two feet (approximately 600 mm) deep; some properties were described as quite badly flooded though the water cleared without significant lasting damage. The Guildhall was opened as a Place of Safety and sandbags were distributed from there. [PAG] (p12)</p></div><div class="nugget-popup"><p>Two properties in the Glynswood area were internally flooded. Part of this flooding was due to a stream that backs up across the open ground behind the secondary school; the report notes possible contribution from a blocked debris grid on a culvert and/or insufficient culvert capacity. [TAB,MUL] (p14)</p></div><div class="nugget-popup"><p>The town experienced the 1&ndash;in&ndash;38&ndash;year rainfall event which produced primary flow paths across the town, causing surface water to run through open spaces and watercourses and leading to localised flooding of properties and areas (photos from Chard referenced). Flood mitigation measures are being developed in response, including pilot projects and wider modelling. [TAB] (p20)</p></div><div class="nugget-popup"><p>Flood water flowed along and across a residential street, inundating the carriageway adjacent to houses and parked cars. Water was orange&ndash;brown and carrying silt and debris, indicating sediment&ndash;laden surface runoff affecting the street and nearby properties. [PAG,IMG] (p25)</p></div><div class="nugget-popup"><p>Thorndon Park Drive: two houses flooded. [PAG,MUL] (p26)</p></div></div></body></div>`)[0];
