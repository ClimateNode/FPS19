land; River Tyne reached its highest recorded levels in 10 areas. [PAG,MUL] (p5)</p></div><div class="nugget-popup quant"><p>three properties (West Woodburn reported on 05/12/2015) [PAG,MUL] (p6)</p></div><div class="nugget-popup quant"><p>4 flood warnings; 11 alerts; 12 Flood Alerts; 6 Flood Warnings; more than 30 towns or villages; 1 property; 1 catering van [PAG,MUL] (p7)</p></div><div class="nugget-popup quant"><p>over 3500 properties protected by EA flood defences [PAG,MUL] (p11)</p></div></div></body></div>`)[0];
