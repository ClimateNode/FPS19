                var html_c6bcc81897fd9f866c1086e1a9743110 = $(`<div id="html_c6bcc81897fd9f866c1086e1a9743110" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Yazor Brook</h1><div class="nugget-popup"><p>Yazor Brook (an ordinary watercourse and tributary of the River Wye) is identified in the report as the relevant watercourse for the catchment; its flooding is associated with the February 2020 fluvial/surface&ndash;water flooding that led to internal flooding of properties in Credenhill. [PAG] (p1)</p></div><div class="nugget-popup"><p>Overflow and breaching of Yazor Brook or its upstream tributaries caused fluvial flooding of properties; at least one report states the brook breached its banks, encircled a house and came up through the drains. [MUL] (p2)</p></div><div class="nugget-popup"><p>Overflow/peak flows in the Yazor Brook caused flooding to properties downstream of the inlet weir; flows were routed into the FAS culvert which discharges to the River Wye. (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>10 properties [PAG] (p1)</p></div><div class="nugget-popup quant"><p>4 properties [MUL] (p2)</p></div></div></body></div>`)[0];
