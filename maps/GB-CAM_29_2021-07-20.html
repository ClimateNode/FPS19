                var html_a38bd32d256978384d9fa3ec21fe442e = $(`<div id="html_a38bd32d256978384d9fa3ec21fe442e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Granta</h1><div class="nugget-popup"><p>A floodplain associated with the River Granta runs through Linton and high surface&ndash;water flood risk zones are concentrated along the river. During the intense rainfall on 20 July 2021 significant flooding occurred in Linton; flood extent and surface&ndash;water flooding were closely associated with the River Granta corridor and extended into nearby low&ndash;lying built&ndash;up areas. [PAG,IMG] (p7)</p></div></div></body></div>`)[0];

                var html_98a6e0ac59d94a2874118e09a5efcf14 = $(`<div id="html_98a6e0ac59d94a2874118e09a5efcf14" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>High Street, Linton</h1><div class="nugget-popup"><p>Identified as one of three key risk areas where internal property flooding was reported on 20 July 2021; properties experienced rapid ingress of water with levels receding relatively quickly. [PAG] (p9)</p></div><div class="nugget-popup"><p>Surface water flooding occurred at a topographic low where high surface water flows were directed toward properties; limited highway drainage and low kerbs contributed to inundation. Internal property flooding was reported in this area and water entered properties rapidly before receding. [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>Surface water pooled in a topographic low and was directed toward properties. Properties were flooded internally and gardens and outbuildings were affected. The area has low kerbs and limited highway drainage which contributed to the flooding. No reports of residents leaving their premises. [TAB] (p11)</p></div><div class="nugget-popup"><p>Reports of flooding prompted on&ndash;site attendance and investigations by the LLFA and Highway Authority; highway drainage investigations were funded/confirmed and gully maintenance frequency was increased. South Cambridgeshire District Council provided sandbags to properties in the area. [TAB] (p14)</p></div><div class="nugget-popup"><p>During the intense convective storm on 20 July 2021 surface water followed local topography and flowed along High Street. Rainfall rates exceeded drainage capacity, causing surface water flooding of the road and low&ndash;lying points. [TAB] (p20)</p></div></div></body></div>`)[0];

                var html_ad4e399de2ac072ac870c557e48bb455 = $(`<div id="html_ad4e399de2ac072ac870c557e48bb455" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Balsham Road, Linton</h1><div class="nugget-popup"><p>Part of the Balsham Road/Lamb Fair Court risk area where internal property flooding was reported on 20 July 2021; flooding involved rapid entry of water into properties. [PAG] (p9)</p></div><div class="nugget-popup"><p>Reported location of internal property flooding as one of three key risk areas in the village; properties experienced rapid&ndash;onset flooding with water ingress to buildings. [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>Surface water flowed down Balsham Road from the highway and surrounding fields; the highways drainage system was inundated. Water flowed over dropped kerbs towards properties on the south side of the road, flooding properties internally and gardens/outbuildings to an approximate depth of 15 cm. Water receded within about 12 hours. Some highway drains were found partially or fully blocked. There are reports of residents having to leave their property for over one month. [TAB] (p11)</p></div><div class="nugget-popup"><p>Surface water runoff from the fields and highway above these roads contributed to flooding; the LLFA is working with Highways and landowners to investigate measures to reduce runoff and whether additional attenuation capacity can be introduced. Highway drainage (gullies) were inspected and works orders raised for cleaning. (p13)</p></div><div class="nugget-popup"><p>During the 20 July 2021 storm surface water flowed along Balsham Road; the drainage network capacity was exceeded. Riparian maintenance issues were also identified as a contributing factor to flooding on this road. [TAB] (p20)</p></div></div></body></div>`)[0];

                var html_357f21aa4b22927bf696cd30b3cbfbd9 = $(`<div id="html_357f21aa4b22927bf696cd30b3cbfbd9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lonsdale, Linton</h1><div class="nugget-popup"><p>Reported internal property flooding as part of the south&ndash;east residential cluster (grouped with Bakers Lane, Bartlow Road and Finchams Close); flooding was rapid ('flash') with properties affected internally. [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>Surface water flowing west along Horseheath Road entered Lonsdale; most was captured by the highway drainage system, but there was an initial report of minor flooding at the bottom of Lonsdale where water entered a garage. [PAG] (p11)</p></div><div class="nugget-popup"><p>A retaining wall situated between Lonsdale and Bakers Lane initially held back an inrush of water but then overtopped/failed, releasing a large volume of surface water that flowed towards and into properties in the adjoining streets and exacerbated flooding. (p12)</p></div><div class="nugget-popup"><p>Surface water flowing across a construction site at Lonsdale prompted meetings and immediate mitigation by the developer (tankers on standby to reduce water in a partly constructed basin, rearranging stored materials to avoid mobilising debris into the basin) to reduce the risk of further flooding. (p14)</p></div><div class="nugget-popup"><p>On 20 July 2021 surface water ran along Lonsdale into low points causing surface water flooding. The report also records misconnections/ingress of rainwater into the foul network or sewer at this location, exacerbating sewer&ndash;related flooding risks; riparian maintenance issues were noted as a contributing factor. [TAB] (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one garage [PAG] (p11)</p></div><div class="nugget-popup quant"><p>15&ndash;45cm; 15&ndash;20cm (p12)</p></div></div></body></div>`)[0];

                var html_428f9b2949686a7f969a4fd7c1df1d4d = $(`<div id="html_428f9b2949686a7f969a4fd7c1df1d4d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Horseheath Road, Linton</h1><div class="nugget-popup"><p>Large volumes of surface water from surrounding arable fields and carriageways flowed onto and along Horseheath Road. Highway drainage was minimal and inundated, causing water to enter a construction site through the temporary site entrance and main entrance and to continue westerly along the road into Lonsdale. [PAG] (p11)</p></div><div class="nugget-popup"><p>Large volumes of surface water flowed westerly down Horseheath Road due to a large upstream surface water catchment, absence of crops and minimal highway drainage. Surface water entered the construction site south of Horseheath Road via the temporary entrance, and other flows continued along the road into the development site and further into Lonsdale. [PAG] (p12)</p></div><div class="nugget-popup"><p>Surface water runoff from the fields and highway above these roads contributed to flooding; the LLFA is working with Highways and landowners to investigate measures to reduce runoff and whether additional attenuation capacity can be introduced. Highway drainage (gullies) were inspected and works orders raised for cleaning. (p13)</p></div><div class="nugget-popup"><p>Surface water from the 20 July 2021 event flooded the highway; highway gullies were blocked/required cleaning and highway drainage on Horseheath Road was reviewed. The road was added to a grip&ndash;cutting programme to improve surface water removal. [TAB] (p15)</p></div></div></body></div>`)[0];

                var html_8bbf1cf3096b30b8f7802dcbc123e156 = $(`<div id="html_8bbf1cf3096b30b8f7802dcbc123e156" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cambridgeshire</h1><div class="nugget-popup"><p>Areas within the county experienced surface water flooding that prompted the LLFA to undertake walkovers and inspections. In response, works orders were raised to clean gullies in affected areas, a new recording system was introduced to monitor all drainage works, and a cyclic gully&ndash;cleaning programme (every other year) was established. (p13)</p></div><div class="nugget-popup"><p>County&ndash;wide response included increasing the frequency of gully maintenance to every second year and undertaking highway drainage investigations to reduce surface water runoff after flooding; these policy/maintenance changes were made following the flooding. [TAB] (p14)</p></div><div class="nugget-popup"><p>Following flooding in the area, gully cleaning was increased and the frequency of gully maintenance for gullies across Cambridgeshire was changed (actioned from July 2021); highway gullies were cleaned in areas where flooding was experienced to improve surface water removal. [TAB] (p15)</p></div></div></body></div>`)[0];

                var html_05b5368f4e06e5c74fe02d53c9b88f74 = $(`<div id="html_05b5368f4e06e5c74fe02d53c9b88f74" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Linton</h1><div class="nugget-popup"><p>Linton has a floodplain associated with the River Granta and large areas are at significant risk of surface water flooding. The 20 July 2021 flooding occurred largely in areas already identified as at risk; some properties around the village centre are located within a flood zone. The village has also experienced previous flooding events in 2014, 2017 and 2019. [MUL] (p5)</p></div><div class="nugget-popup"><p>On 20 July 2021 the village experienced flooding largely from surface water; inundation occurred in parts of the village already identified as at risk from surface water, including areas around the village centre and properties located within mapped flood zones. [PAG,IMG] (p6)</p></div><div class="nugget-popup"><p>Significant surface&ndash;water flooding occurred across parts of the village on 20 July 2021 after an intense rainfall event; flooding affected large areas already identified as at risk from surface water, with inundation extending into built&ndash;up parts of Linton. [PAG,IMG] (p7)</p></div><div class="nugget-popup"><p>Significant flooding occurred on 20 July 2021 from intense, convective rainfall. The event produced localised, intense surface water/flash flooding that resulted in internal and external flooding of properties; local flood reports were submitted to the Lead Local Flood Authority (LLFA) and Linton Parish Council documenting affected properties. [PAG] (p8)</p></div><div class="nugget-popup"><p>On 20 July 2021 the LLFA received 23 flood reports from Linton. Properties experienced rapid ('flash') water entry with water levels receding relatively quickly. Overall 17 properties were reported to have flooded internally and a further 6 properties experienced external flooding of gardens, outbuildings and roads. At least 5 properties were likely to be uninhabitable for 1&ndash;12 months. Three localised risk areas were identified (High Street; Balsham Road/Lamb Fair Court; Lonsdale/Bakers Lane/Bartlow Road/Finchams Close). (p9)</p></div><div class="nugget-popup"><p>Village&ndash;wide reports of property flooding: internal and external flooding of residential properties and gardens/outbuildings; multiple rapid&ndash;onset (flash) surface&ndash;water flood incidents with water entering properties and receding relatively quickly. At least some properties rendered uninhabitable. [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>Surface water flooding affected the town, with reports that residents had to leave their properties for periods of between 1 and 8 months. The LLFA and the highway authority attended to investigate reports, inspected highway drainage, and raised works orders to clean gullies. Further work was initiated with Highways and landowners to reduce surface water runoff from fields and highway and to investigate introducing additional attenuation capacity. (p13)</p></div><div class="nugget-popup"><p>On 20 July 2021 an intense convective storm produced surface water flooding across Linton. Rainfall exceeded drainage capacity so surface water flowed along roads and across fields toward the village low points; drainage networks were overwhelmed. A partially constructed development (stripped of vegetation and without a completed surface water network) increased runoff and contributed to the flooding. (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>23 flood reports [PAG] (p8)</p></div><div class="nugget-popup quant"><p>23 flood reports; 17 properties flooded internally; 6 properties with external flooding; at least 5 properties uninhabitable (p9)</p></div><div class="nugget-popup quant"><p>23 flood reports; 17 properties flooded internally; 6 properties with external flooding; at least 5 properties likely uninhabitable for 1&ndash;12 months [PAG,IMG] (p10)</p></div></div></body></div>`)[0];
