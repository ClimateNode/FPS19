                var html_0e4d76716b78374767057e020112a68e = $(`<div id="html_0e4d76716b78374767057e020112a68e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hakka's Brook</h1><div class="nugget-popup"><p>Hakka's Brook flooded in several locations and was identified as the cause of flooding in the area, contributing to internal flooding of properties in East Hagbourne. [TAB] (p2)</p></div><div class="nugget-popup"><p>The Hakka's Brook box culvert beneath Blewbury Road was noted as containing utilities; the report recommends considering relocating those utilities because they constrain the culvert and its ability to convey flow. (p3)</p></div><div class="nugget-popup"><p>Hakka's Brook (the main river) was inspected along its length downstream of Blewbury Road and landowners were to be contacted about riparian responsibilities as a consequence of river flooding associated with the 04 Jan 2024 &ndash; 05 Jan 2024 event. (p4)</p></div><div class="nugget-popup"><p>Hakka's Brook (ordinary watercourse through East Hagbourne) overflowed/took flow and transfers flow via a fixed side weir into a box culvert and an adjacent ordinary watercourse, contributing to the local flooding. [PAG] (p7)</p></div><div class="nugget-popup"><p>The Hakka's Brook flooded in multiple locations and breached its banks, contributing to nearby internal property flooding and highway inundation; some residents reported property ingress occurring before the stream breached, indicating high groundwater also played a role. (p11)</p></div><div class="nugget-popup"><p>Residents reported foul drainage being affected during the event, with flooding causing inability to flush toilets (surcharging/backflow of foul drains). (p12)</p></div><div class="nugget-popup"><p>River levels in the Hakka's Brook rose following heavy rainfall, contributing to flooding that impacted roads and properties in East Hagbourne. Channel capacity was reduced by high silt levels in the relief channel, a partially blocked culvert and highway drainage link, and vegetation downstream of Blewbury Road; utilities within the box culvert beneath Blewbury Road also reduced capacity during peak flows. (p15)</p></div><div class="nugget-popup"><p>A side weir and overflow box culvert on Hakka's Brook provided an overflow route; the overflow structure and highway pipe link to a relief channel were observed, indicating flow routing during the flood event. (p16)</p></div><div class="nugget-popup"><p>Hakka's Brook breached its banks during the 04&ndash;05 Jan 2024 event, causing river flooding that contributed to inundation in East Hagbourne. (p19)</p></div><div class="nugget-popup"><p>Hakka's Brook (main river) was identified for inspection downstream of Blewbury Road because blockages / channel condition contributed to local flooding; landowners to be contacted about riparian responsibilities. [TAB] (p25)</p></div><div class="nugget-popup"><p>Hakka's Brook (the main river) was identified for inspection downstream of Blewbury Road because high flows / river behaviour during the event contributed to flooding; landowners downstream were to be written to about riparian responsibilities. (p26)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>9 properties [TAB] (p2)</p></div></div></body></div>`)[0];

                var html_13b14b15805cecca55a6988efb9fe1f8 = $(`<div id="html_13b14b15805cecca55a6988efb9fe1f8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Blewbury Road, East Hagbourne</h1><div class="nugget-popup"><p>Blewbury Road is the location of the Hakka's Brook box culvert; the report recommends relocating utilities in the culvert and ensuring highway gullies and pipe links are clear so the road drainage can flow and reduce flood risk. (p3)</p></div><div class="nugget-popup"><p>Area downstream of Blewbury Road was inspected in relation to Hakka's Brook overflowing; recommendations include clearing highway gullies and pipe links to restore flow after flooding on 04 Jan 2024 &ndash; 05 Jan 2024. (p4)</p></div><div class="nugget-popup"><p>Sub&ndash;optimal flow conditions in channels downstream of Blewbury Road and inability for water to drain into the relief channel impeded highway drainage, contributing to flooding of the highway. (p11)</p></div><div class="nugget-popup"><p>The culvert beneath Blewbury Road and its outfall into the Hakka's Brook relief channel showed reduced capacity (silt, partial blockages and vegetation downstream) and contained utilities crossing the culvert; these issues reduced conveyance during peak flows and contributed to flooding impacts on the highway and nearby properties. [PAG] (p15)</p></div><div class="nugget-popup"><p>Vegetation and siltation in Hakka's Brook immediately downstream of the culvert under Blewbury Road contributed to flooding during 04 Jan 2024 &ndash; 05 Jan 2024; Environment Agency cleared vegetation from the brook downstream of the culvert to restore flow. (p18)</p></div><div class="nugget-popup"><p>Flooding affected Blewbury Road on 04&ndash;05 Jan 2024 due to an inability for water to drain away, contributing to local inundation. (p19)</p></div><div class="nugget-popup"><p>Blewbury Road was identified as the location of a box culvert carrying Hakka's Brook and utilities; relocation of utilities and culvert&ndash;related works were recommended because culvert/flow issues contributed to flooding at this location. [TAB] (p25)</p></div></div></body></div>`)[0];

                var html_9d0258a5e466757f418e0e6824545b15 = $(`<div id="html_9d0258a5e466757f418e0e6824545b15" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>East Hagbourne</h1><div class="nugget-popup"><p>A flood incident occurred in East Hagbourne during the event investigated in this Section 19 report. [PAG] (p1)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties in the village caused by flooding from Hakka's Brook, with high groundwater and highway flooding also cited as contributing factors. [TAB] (p2)</p></div><div class="nugget-popup"><p>Properties in East Hagbourne were internally flooded, triggering a Section 19 investigation. [PAG] (p6)</p></div><div class="nugget-popup"><p>Village experienced internal flooding of properties during the reported flood event. [IMG,PAG] (p7)</p></div><div class="nugget-popup"><p>Internal flooding of properties in the village, which triggered a formal flood investigation. [PAG] (p10)</p></div><div class="nugget-popup"><p>Internal flooding affected residential properties in the village after heavy rainfall and Hakka's Brook breaching; high groundwater and highway flooding contributed, pumps were inadequate for one property causing internal ingress, and foul drainage was affected (toilets unable to be flushed). (p11)</p></div><div class="nugget-popup"><p>Flooding affected roads and properties in East Hagbourne. The primary cause was elevated levels in the Hakka's Brook; surface water runoff from surrounding fields and groundwater following heavy rainfall on 03 and 04 January contributed, with local reports indicating some properties were flooded by groundwater rather than direct watercourse overtopping. [MUL] (p15)</p></div><div class="nugget-popup"><p>The village was flooded on 04&ndash;05 Jan 2024 when the Hakka's Brook breached its banks, groundwater levels rose and water could not drain away from Blewbury Road, causing local flooding. (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>9 properties [TAB] (p2)</p></div><div class="nugget-popup quant"><p>more than 5 properties [PAG] (p10)</p></div><div class="nugget-popup quant"><p>more than 5 properties; one property (p11)</p></div></div></body></div>`)[0];
