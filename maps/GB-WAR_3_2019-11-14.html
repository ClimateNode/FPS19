></div><div class="nugget-popup quant"><p>1 property; 1 business property; 1 flood wall failure [TAB,MUL] (p17)</p></div></div></body></div>`)[0];

                var html_cc41a9548f5be27d325b26aa821c29aa = $(`<div id="html_cc41a9548f5be27d325b26aa821c29aa" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Warwickshire</h1><div class="nugget-popup"><p>Heavy rainfall on 14/15 November 2019 caused surface water/urban flooding across parts of the county, resulting in internal property flooding, highway flooding and flooding to gardens and outbuildings. Impacts included internal flooding of properties, disruption to schools and road closures across affected communities. (p3)</p></div><div class="nugget-popup"><p>Widespread flooding across Warwickshire on 14/15 November 2019, including confirmed internal property flooding at multiple locations; recovery and follow&ndash;on actions largely complete. (p4)</p></div><div class="nugget-popup"><p>Heavy rainfall on 14&ndash;15 November 2019 produced widespread runoff across Warwickshire: soils were wetter than average and many rivers were responsive and described as notably or exceptionally high by the Environment Agency. Environment Agency Flood Alerts and Flood Warnings were in force for river flooding across parts of the county. [PAG] (p6)</p></div><div class="nugget-popup"><p>Following heavy rainfall on 14 November, river levels rose notably across the county and rivers generally peaked later on 14 November or into 15 November; Environment Agency Flood Alerts and Flood Warnings and a Flood Guidance Statement were in force for parts of the county. Antecedent wet soils increased rapid runoff, and some smaller ordinary watercourses (particularly in steep or urban areas) responded more quickly to the rainfall. [PAG,IMG] (p7)</p></div><div class="nugget-popup"><p>Confirmed internal flooding of properties across the county (map of confirmed internally flooded properties for the 14/15 November 2019 event). Widespread highway flooding reported countywide resulting in road closures, flood signage and local sandbagging where properties were significantly affected. [PAG,IMG] (p9)</p></div><div class="nugget-popup"><p>Widespread highway and urban/surface&ndash;water flooding across the county on 14/15 November 2019: large numbers of highway flood reports and many reports of flooding to gardens, garages/outbuildings, driveways and footpaths. The county&#8217;s resilient highway network was also affected, with incidents occurring on priority routes. [IMG] (p11)</p></div><div class="nugget-popup"><p>Numerous reports across the area of flooding to gardens, garages/outbuildings, driveways and footpaths. Some reports of internal property flooding were recorded but remained unconfirmed after WCC and partners attempted confirmation (visits and correspondence). [IMG] (p12)</p></div><div class="nugget-popup"><p>County&ndash;wide rainfall on 14/15 November 2019 produced widespread flooding across many communities in Warwickshire. Rivers reacted quickly causing river flooding in some areas, and rainfall running over already saturated ground produced extensive surface water flooding; sewer and groundwater flooding also contributed in a minority of locations. The event led to multiple community impacts including flooded access that caused school closures and numerous locations requiring investigation and support. [PAG] (p13)</p></div><div class="nugget-popup"><p>Properties across Warwickshire were flooded during 14/15 November 2019; within the county only Stratford&ndash;on&ndash;Avon District met the government threshold to administer recovery grants. (p14)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>34 properties; 28 emergency school closures; more than 150 reports of highway flooding; 20 locations with confirmed internal property flooding (p3)</p></div><div class="nugget-popup quant"><p>20 locations where internal property flooding was confirmed (p4)</p></div><div class="nugget-popup quant"><p>34 properties; 20 locations; 3 business premises; more than 150 highway flooding reports [PAG,IMG] (p9)</p></div><div class="nugget-popup quant"><p>more than 150 highway flood reports; 43 highway or fire & rescue reports on the WCC resilient network [IMG] (p11)</p></div><div class="nugget-popup quant"><p>28 emergency school closures [IMG] (p12)</p></div><div class="nugget-popup quant"><p>20 locations included in the report; 70% of locations affected by surface water flooding; 30% affected by main river/river flooding; 25% affected by ordinary watercourse; 10% affected by sewer flooding; 10% affected by other (such as groundwater). [PAG] (p13)</p></div><div class="nugget-popup quant"><p>30 properties eligible (p14)</p></div></div></body></div>`)[0];

                var html_bc3a7ca75735577bb403c9332c822bd0 = $(`<div id="html_bc3a7ca75735577bb403c9332c822bd0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Stratford-On-Avon</h1><div class="nugget-popup"><p>Most of the flooding impacts from the 14/15 November 2019 event occurred within Stratford&ndash;on&ndash;Avon District: the majority of internal property floodings, many highway flood reports and emergency school closures were located here. (p3)</p></div><div class="nugget-popup"><p>Southern parts of the county (Stratford area) received the highest rainfall during the event, producing a stronger river response and notable rises in river levels into 14&ndash;15 November; EA flood guidance, alerts and warnings covered the area. [PAG,IMG] (p7)</p></div><div class="nugget-popup"><p>Internal flooding of properties across the local area: a total of 34 properties suffered internal flooding across 20 locations; three of the flooded properties were business premises and the remainder were residential. Flooding followed heavy rainfall and notable rises in river levels that peaked on 14 November or into 15 November 2019. (p8)</p></div><div class="nugget-popup"><p>Most of the internally flooded properties from the 14/15 November 2019 event were located within Stratford&ndash;on&ndash;Avon District; these formed the basis of the investigation and are reported in the appendices. [PAG,IMG] (p9)</p></div><div class="nugget-popup"><p>Flooded highways or external school grounds prevented safe access, resulting in 28 emergency school closures distributed across districts in the county. [IMG] (p12)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>34 properties (majority within Stratford); 28 emergency school closures; more than 150 reports of highway flooding; 20 locations with confirmed internal property flooding (p3)</p></div><div class="nugget-popup quant"><p>34 properties; 20 locations; 3 business premises (p8)</p></div><div class="nugget-popup quant"><p>34 properties; 20 locations; 3 business premises [PAG,IMG] (p9)</p></div><div class="nugget-popup quant"><p>28 emergency school closures [IMG] (p12)</p></div></div></body></div>`)[0];
