                var html_0c6f581faae44bf5276f39f97166145a = $(`<div id="html_0c6f581faae44bf5276f39f97166145a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Grove Park, Old Hurst</h1><div class="nugget-popup"><p>Floodwater significantly affected external premises (gardens) and caused internal flooding to residential properties in the Grove Park area. [TAB] (p10)</p></div><div class="nugget-popup"><p>Surface water flooding occurred where three watercourses converge at the eastern corner of Grove Park; ditches exceeded channel capacity and contributed to overland flows toward nearby properties. A culvert under Grove Park was observed (April and September 2021) and was clear of large debris in Sept 2021 but further desilting was identified as required. One watercourse had been altered without Land Drainage Consent; three small pipes installed within that watercourse were removed after the flood. [IMG] (p12)</p></div><div class="nugget-popup"><p>Internal flooding of properties, gardens and outbuildings with floodwater reaching about 30 cm depth; at least one resident was displaced from their home. [TAB] (p13)</p></div><div class="nugget-popup"><p>During the winter 2020 flooding the Grove Park area experienced watercourse&ndash;related flooding. The LLFA undertook walkovers of reported flooded locations, inspected topography and relevant features, and met residents and landowners known to have flooded. The LLFA also met riparian landowners on site to confirm required watercourse management and the need for Ordinary Watercourse Land Drainage Consent and planned to write to riparian owners to clarify responsibilities under the Land Drainage Act (1991). [TAB] (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 properties with internal property flooding [TAB] (p10)</p></div><div class="nugget-popup quant"><p>two residential properties; maximum internal flood depth of c.30cm; residents unable to return for 5&ndash;10 days; three small pipes removed [IMG] (p12)</p></div><div class="nugget-popup quant"><p>c.30 cm depth; 1 resident displaced for 5&ndash;10 days [TAB] (p13)</p></div></div></body></div>`)[0];

ng to a maximum depth of c.30 cm); air bricks showing flow at 8&ndash;16 cm; one resident reported having to leave premises for 5&ndash;10 days [IMG,MUL] (p14)</p></div><div class="nugget-popup quant"><p>c.15cm (depth) [TAB] (p16)</p></div></div></body></div>`)[0];

                var html_92dcdc7fead7510c906e6a84240dde14 = $(`<div id="html_92dcdc7fead7510c906e6a84240dde14" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>East Anglia</h1><div class="nugget-popup"><p>The region experienced widespread surface&ndash;water flooding associated with very wet conditions in December 2020 and an intense rainfall event on 23rd December 2020; saturated soils and high runoff contributed to significant surface&ndash;water flooding across the area (including recorded events on 4th and 23rd December). [PAG,MUL] (p7)</p></div></div></body></div>`)[0];

                var html_62c5c017f37d5b78abc554ce04b6ea42 = $(`<div id="html_62c5c017f37d5b78abc554ce04b6ea42" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Old Hurst</h1><div class="nugget-popup"><p>Localized inundation of low points in the village (one to the north and one to the south) from surface water. To the north, the confluence of two unnamed ordinary watercourses adjacent to residential properties can flood when runoff exceeds bank capacity. To the south, runoff from arable land can overwhelm surface water ditches and flow toward residential properties. Flooding has affected buildings: Cambridge Fire and Rescue Service recorded flooding of properties to the north in February 2014, and the northern location flooded again during the Winter 2020 event. [MUL] (p4)</p></div><div class="nugget-popup"><p>Surface&ndash;water flooding affected Old Hurst during intense heavy rainfall on 23rd December 2020. Saturated ground and a high water table following a very wet autumn and December produced very high runoff and resulted in significant surface&ndash;water flooding in and around the village. Surface&ndash;water flooding had also been reported to the LLFA for areas to the south of the village on 4th December 2020. [MUL] (p7)</p></div><div class="nugget-popup"><p>An area within/adjacent to Old Hurst flooded in winter 2020. A ditch to the south and east of the flooded area had been poorly maintained for many years and is expected to have contributed to the flood risk; LLFA intervention and follow&ndash;up maintenance (including removal of a previously blocked piped access crossing) were carried out to improve conveyance. [IMG] (p15)</p></div><div class="nugget-popup"><p>Significant overland surface water flooding across saturated farmland and from ditches which exceeded channel capacity during December 2020; groundwater and fluvial (river) flooding were also identified in village areas. The LLFA has engaged riparian owners and is taking/considering maintenance and enforcement actions to reduce future risk. [MUL] (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 domestic properties; 1 commercial property [MUL] (p4)</p></div></div></body></div>`)[0];
