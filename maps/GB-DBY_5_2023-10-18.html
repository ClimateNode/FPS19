                var html_db1528c46279c2e7ee0b17c8341f14e4 = $(`<div id="html_db1528c46279c2e7ee0b17c8341f14e4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Almshouses</h1><div class="nugget-popup"><p>Internal flooding of properties in the Almshouses complex on School Lane; the majority of the community's flooded homes were in this complex. (p4)</p></div><div class="nugget-popup"><p>Properties within the Almshouses complex had floodwater enter the courtyard and then the properties through doorways after Henmore Brook overtopped adjacent defences; internal flooding depths reported up to 15 cm. The protective embankment did not overtop but was temporarily lowered after the peak to allow trapped water to drain. [PAG] (p7)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>part of the 10 residential properties on School Lane that were internally flooded; internal flooding up to 15 cm [PAG] (p7)</p></div></div></body></div>`)[0];

                var html_da32728150e02f6f8e3ddd60d2928154 = $(`<div id="html_da32728150e02f6f8e3ddd60d2928154" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Henmore Brook</h1><div class="nugget-popup"><p>Responded rapidly to Storm Babet (short lag between peak rainfall and peak flow) and produced high flows that contributed to flooding in Ashbourne; peak flow during Storm Babet was the second highest on record at the Ashbourne gauging station. [PAG,MUL] (p3)</p></div><div class="nugget-popup"><p>Henmore Brook had a very large peak flow during Storm Babet (second highest on the gauging station record), with a short 3&ndash;hour lag from peak rainfall to peak flow; the brook on its floodplain contributed to internal flooding of properties to the west of Ashbourne. [PAG] (p4)</p></div><div class="nugget-popup"><p>Overbanking of Henmore Brook during the storm caused river flooding that inundated the adjacent residential community in central Ashbourne. Floodwaters entered homes in the Almshouses on School Lane and properties on Coachmans Close and affected non&ndash;residential buildings including St Oswald&#8217;s Church Centre (hall), Kingdom Hall and the Bridge Public House on Dig Street. [PAG,IMG] (p5)</p></div><div class="nugget-popup"><p>Flooding from Henmore Brook overtopped flood defences and caused internal property flooding in the adjacent Ashbourne community (properties on School Lane, Coachmans Close and nearby non&ndash;residential buildings). Flood warnings were issued for the Henmore Brook at Ashbourne during the event. [IMG,PAG] (p6)</p></div><div class="nugget-popup"><p>Identified as the primary source of flooding during Storm Babet; overtopping of Henmore Brook banks and a retaining wall allowed flow to escape the channel and inundate adjacent streets and properties (notably School Lane and Coachmans Close). [IMG] (p7)</p></div><div class="nugget-popup"><p>Banks of Henmore Brook overtopped, sending water northwards along School Lane into the Almshouses courtyard and properties; overtopping adjacent to School Lane bridge also directed flows that flooded nearby buildings. Flood levels exceeded the previous 1% AEP design standard at this location and at Coachmans Close. The embankment protecting the Almshouses did not overtop but was purposefully lowered after Storm Babet's peak to allow trapped water to drain and was subsequently reinstated. [PAG] (p8)</p></div><div class="nugget-popup"><p>Described as the subject of post&ndash;event actions: the Environment Agency is updating the Henmore Brook flood model to investigate the current standard of protection provided by defences and to test whether water can be stored earlier in the Ashbourne Flood Storage Reservoir during lower&ndash;magnitude events. These actions follow flooding on 20 October 2023. (p9)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Peak flow was the second highest in the station's record; lag time between peak rainfall and peak river flow recorded in Ashbourne was 3 hours. [PAG,MUL] (p3)</p></div><div class="nugget-popup quant"><p>16 properties [PAG] (p4)</p></div><div class="nugget-popup quant"><p>3 purpose built flood defences overtopped [IMG,PAG] (p6)</p></div><div class="nugget-popup quant"><p>16 internally flooded properties (community total) [IMG] (p7)</p></div><div class="nugget-popup quant"><p>10 residential properties; up to 15 cm depth [PAG] (p8)</p></div></div></body></div>`)[0];

                var html_0261268e6b4d0762552e925156162168 = $(`<div id="html_0261268e6b4d0762552e925156162168" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hilton Brook</h1><div class="nugget-popup"><p>Hilton Brook is the main river flowing through the community where internal property flooding occurred during Storm Babet; the text and map link watercourse locations and flooded streets, so the brook is likely a contributing source to the internal flooding in Hilton. [IMG] (p9)</p></div><div class="nugget-popup"><p>Overflow of Hilton Brook onto its floodplain caused internal flooding of properties in Hilton during Storm Babet; most flooded homes were west of the brook. [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>The community sits on the Hilton Brook floodplain; most flooded homes were west of Hilton Brook. Internal flooding of properties in the community occurred during Storm Babet. A flood relief channel and engineered high ground adjacent to Uttoxeter Road are identified along the brook. [PAG,IMG] (p11)</p></div><div class="nugget-popup"><p>Hilton Brook overflowed upstream of Hilton village, overtopped its channel (upstream of the relief channel) and caused flooding onto Uttoxeter Road and into nearby properties. A blocked culvert beneath Uttoxeter Road was reported to have contributed to upstream overtopping. The Sutton Mill gauge on Hilton Brook recorded its highest&ndash;ever level during the event. [PAG] (p12)</p></div><div class="nugget-popup"><p>Overflowed (about 600 m upstream of the Uttoxeter Road crossing) and overtopped upstream of the village; a blocked culvert beneath Uttoxeter Road caused the channel to overtop and flood onto Uttoxeter Road, with floodwater flowing westwards and along flow routes to Main Street and Mill Lane, internally flooding local properties. Internal depths reached almost 1 m at some properties; some semi&ndash;detached properties are known to flood frequently; one property had a sump and pump; a few properties only flooded externally. [PAG,IMG] (p13)</p></div><div class="nugget-popup"><p>Hilton Brook overtopped/caused flooding at Sutton on the Hill and Uttoxeter Road (Hilton), leading to property flooding. Sandbags provided to some properties were overwhelmed by high flood levels. The flood relief channel was inspected and found to be operating as designed; investigations are exploring redirecting floodwater that currently escapes upstream back into the Hilton Brook channel to reduce future property flooding. [PAG] (p14)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 residential properties; 2 commercial properties [PAG,IMG] (p10)</p></div><div class="nugget-popup quant"><p>5 homes; 3 commercial properties [PAG,IMG] (p11)</p></div><div class="nugget-popup quant"><p>Peak gauge level 1.84 m at Sutton Mill (highest recorded at that gauge) [PAG] (p12)</p></div><div class="nugget-popup quant"><p>7 properties on Uttoxeter Road; 1 home on Mill Lane; five homes and three commercial properties (reported) [PAG,IMG] (p13)</p></div></div></body></div>`)[0];

                var html_8352db6452003b57f3608e608267ea4e = $(`<div id="html_8352db6452003b57f3608e608267ea4e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hilton</h1><div class="nugget-popup"><p>Internal flooding of properties in the community during Storm Babet (October 2023). The report text states residential and commercial properties suffered internal flooding; map annotations show flooding concentrated on Uttoxeter Road and Mill Lane. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>Internal flooding of properties in the village during Storm Babet; most flooded homes were west of Hilton Brook on the brook's floodplain. Flood risk maps show affected properties lie in Flood Zone 2 and Flood Zone 3 and have at least low long&ndash;term surface water risk; areas off Main Street have high surface water risk. [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>Properties within the Hilton community experienced internal flooding when Hilton Brook overflowed upstream of the village and water flowed onto Uttoxeter Road before reaching the relief channel. Some properties experienced internal depths of almost 1 m; semi&ndash;detached properties in the area are known to flood frequently. [PAG] (p12)</p></div><div class="nugget-popup"><p>Overflow from Hilton Brook (about 600 m upstream of the Uttoxeter Road culvert) caused floodwater to escape the channel, flow into the village along Uttoxeter Road and Mill Lane, and internally flood residential and commercial properties; internal flood depths reached almost 1 m at some properties. Culvert blockage and a weir/sharp bend upstream were reported as contributing factors. [PAG,IMG] (p13)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 residential properties; 2 commercial properties (report text); map annotations: 7 homes and 1 business internally flooded on Uttoxeter Road; 1 home internally flooded on Mill Lane (map) [IMG,PAG] (p9)</p></div><div class="nugget-popup quant"><p>4 residential properties and 2 commercial properties [PAG,IMG] (p10)</p></div><div class="nugget-popup quant"><p>Five homes and three commercial properties flooded internally; internal flood depth almost 1 m at some properties [PAG] (p12)</p></div><div class="nugget-popup quant"><p>5 homes; 3 commercial properties; 7 properties on Uttoxeter Road; 1 home on Mill Lane [PAG,IMG] (p13)</p></div></div></body></div>`)[0];
