al and man&ndash;made drainage networks across locations in Lancashire, producing particularly damaging flooding in parts of the county (notably Burnley and Lancaster districts). [PAG] (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>64 properties; 50 homes internally flooded [PAG] (p3)</p></div><div class="nugget-popup quant"><p>64 properties reported as flooding; 50 homes internally flooded [PAG] (p12)</p></div><div class="nugget-popup quant"><p>64 properties flooded overall; 50 homes internally flooded [PAG] (p13)</p></div></div></body></div>`)[0];
