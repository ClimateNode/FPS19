                var html_4d7ab87ee7238ede3225448a90d1d8cd = $(`<div id="html_4d7ab87ee7238ede3225448a90d1d8cd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Tandridge</h1><div class="nugget-popup"><p>Internal property flooding at multiple addresses and road closures reported in the district. [TAB,PAG] (p2)</p></div><div class="nugget-popup"><p>The area experienced a combination of fluvial, surface water, groundwater and sewer flooding caused by unprecedented winter 2013/14 rainfall (275% of an average winter), resulting in internal property flooding and other impacts across the district. (p8)</p></div><div class="nugget-popup"><p>The report records flooding across Tandridge during winter 2013/14, with internal property flooding occurring within the area. [IMG] (p11)</p></div><div class="nugget-popup"><p>The district experienced local surface water flooding and fluvial flooding during the winter 2013/14 storms as a result of intense rainfall on already&ndash;saturated soils and sharp rises in river flows. [PAG,MUL] (p12)</p></div><div class="nugget-popup"><p>Residential properties experienced internal, basement and garden flooding; sewage backed up into WCs and sewage was present in gardens. Four properties were evacuated. Eight properties were without WC facilities for over six weeks. Thirteen businesses reported flooding or were impacted; three commercial premises were vacated during the flooding. Along the course of the Caterham Bourne, 1,086 homes suffered power cuts. The A22 was closed (main access) and a temporary pedestrian bridge was constructed to assist schoolchildren; the railway line into Caterham was also flooded. (p15)</p></div><div class="nugget-popup"><p>Flooding from the Caterham Bourne and associated surface water/sewer flooding caused internal, basement and garden flooding of residential properties; sewage backing up into WCs and sewage in gardens; evacuation of some homes; businesses and infrastructure were disrupted. Power supplies to homes failed along the Caterham Bourne corridor. The A22 (main access into Croydon) was closed and the railway line into Caterham flooded. A temporary pedestrian bridge was installed on the A22 to maintain access to school. Kenley Water Works (just outside the district) was threatened by contaminated flood water and large pumps ran continuously to reduce flood levels, posing a risk to local water supply. [PAG] (p16)</p></div><div class="nugget-popup"><p>Tandridge District was particularly affected by flooding during winter 2013/14, prompting local response and strategic coordination. (p18)</p></div><div class="nugget-popup"><p>Tandridge was part of the area affected by the Winter 2013/14 floods; key drainage assets in Tandridge were identified and added to the flooding asset register as part of the post&ndash;event response and asset management. [PAG] (p19)</p></div><div class="nugget-popup"><p>The Caterham Bourne rose following heavy rainfall and a rise in groundwater levels, causing flooding of roads and properties in Tandridge, including road closures and internal property flooding reported in the Smallfield sub area. [MUL] (p40)</p></div><div class="nugget-popup"><p>Tandridge experienced widespread flooding during winter 2013/14, including internal property flooding caused by surface water, ordinary watercourse (riparian ditches), sewer and groundwater sources. (p42)</p></div><div class="nugget-popup"><p>During the winter 2013/14 flood event, lack of maintenance of riparian watercourses and ditches contributed to flood impacts across the district; this prompted collection of historic flooding data, prioritisation of drainage maintenance works and recommendations for further studies and schemes. (p43)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 180 incidents of internal property flooding (p8)</p></div><div class="nugget-popup quant"><p>180 incidents of internal property flooding [IMG] (p11)</p></div><div class="nugget-popup quant"><p>4 properties evacuated; 8 properties without WC for over six weeks; 13 businesses impacted; 3 commercial premises vacated; 1,086 homes with power cuts; 4 weeks (A22 closure) (p15)</p></div><div class="nugget-popup quant"><p>4 properties evacuated; 8 properties without WC facilities for over six weeks; 13 businesses reported flooding or were impacted; 3 commercial premises vacated; 1,086 homes suffered power cuts; Kenley Water Works supplies more than 46,000 properties; A22 shut for four weeks [PAG] (p16)</p></div><div class="nugget-popup quant"><p>approximately 180 incidents of internal property flooding (p42)</p></div></div></body></div>`)[0];

                var html_4f5aef65de67388a63d8db1f561c8f7f = $(`<div id="html_4f5aef65de67388a63d8db1f561c8f7f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Surrey</h1><div class="nugget-popup"><p>The western part of Tandridge (within the Upper River Mole catchment in Surrey) experienced sharp rises in river flows and fluvial flooding from the River Mole and its tributaries, together with local surface water flooding during the late&ndash;December 2013 event; fluvial flood warnings were issued across the south east. [MUL] (p12)</p></div><div class="nugget-popup"><p>Parts of Surrey within the River Mole and upper River Eden catchments experienced unusually high river flows (peaking around a 1 in 50 annual chance in the Mole) and prolonged surface water ponding during winter 2013/14, producing flooding across affected catchment areas. (p14)</p></div><div class="nugget-popup"><p>Flooding occurred across the county during winter 2013/14, triggering strategic response and flood risk management actions by RMAs. [PAG] (p18)</p></div><div class="nugget-popup"><p>County&ndash;level response to the Winter 2013/14 floods: inspected and cleansed flood&ndash;affected roads, carried out ditching, cleared trees and debris, coordinated recycling and distribution of sandbags, operated a call centre, administered the Repair and Renew grant for flooded residents and businesses, and coordinated response meetings (Strategic and Tactical groups). Surrey Fire and Rescue Service pumped flood waters to protect residents, property and infrastructure; extensive carriageway damage was assessed for inclusion in the Project 400 resurfacing programme. [MUL] (p19)</p></div><div class="nugget-popup"><p>Caterham Bourne flooding (driven by heavy rainfall and raised groundwater) caused flooding of roads and properties in Surrey. [PAG,MUL] (p40)</p></div><div class="nugget-popup"><p>Surrey experienced major, widespread flooding during winter 2013/14 driven by exceptional rainfall, with flooding from surface water, ordinary watercourses, sewers and groundwater. [PAG] (p42)</p></div><div class="nugget-popup"><p>Widespread flooding occurred during the winter 2013/14 event; lack of maintenance of riparian watercourses and ditches across Surrey contributed to the severity of impacts and influenced prioritisation of future drainage maintenance and flood defence work. [PAG] (p43)</p></div></div></body></div>`)[0];
