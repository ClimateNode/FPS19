                var html_525189a6c907718c097053dc6a7e5428 = $(`<div id="html_525189a6c907718c097053dc6a7e5428" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Creaton Road, Hollowell</h1><div class="nugget-popup"><p>Internal flooding to properties on Creaton Road; ponding in the highway of Creaton Road; on 27/07/13 surface water was manually prevented from entering two further properties on Creaton Road. [TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Surface water from higher ground settled as a large area of ponding at low points on Creaton Road, spanning the entire carriageway and unable to drain sufficiently to Stowe Brook; road gullies surcharged and ponded water entered properties (including flowing through doorways and air bricks). Residents undertook actions (sweeping water to gullies, re&ndash;excavating a verge grip drain) to allow partial drainage to Stowe Brook. (p12)</p></div><div class="nugget-popup"><p>Drainage systems became fully surcharged and water began to flow out of road gullies and manhole chambers. The area of Creaton Road immediately west of Stowe Brook formed a large, deep pond that was unable to drain down sufficiently into road gullies and drainage systems. (p13)</p></div><div class="nugget-popup"><p>Surface water overtopped the kerbs and caused local ponding/flooding on the carriageway and verges. [IMG,PAG] (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 properties (internal flooding) on 06/06/10; 2 properties (internal flooding) on 27/07/13; 2 properties (surface water prevented) on 27/07/13 [TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup quant"><p>1 property had surface water flow at over 300mm to low points and internal ground floor flooding to a depth of 25mm; kitchen of 1 second property was flooded; residents of 2 further properties took action to prevent ingress. (p12)</p></div></div></body></div>`)[0];

                var html_124c409b32bbf1a18e72fd3dd686fcee = $(`<div id="html_124c409b32bbf1a18e72fd3dd686fcee" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Northamptonshire</h1><div class="nugget-popup"><p>Formal investigation was required because flood incidents occurred in Hollowell (within Northamptonshire). Internal flooding affected properties: at least two properties experienced internal flooding, and internal flooding has occurred on more than one occasion in the last five years. The incident on 27 July 2013 in Hollowell triggered the formal investigation. [MUL] (p8)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least two properties (internal flooding); internal flooding occurred on more than one occasion in the last 5 years [MUL] (p8)</p></div></div></body></div>`)[0];

                var html_4849113bb51aa2a9468968c138b2c7d1 = $(`<div id="html_4849113bb51aa2a9468968c138b2c7d1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hollowell</h1><div class="nugget-popup"><p>Intense short&ndash;duration rainfall caused existing drainage to be unable to cope; excess surface water flowed along natural contours into low points in the village, resulting in internal flooding of properties. [PAG] (p6)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration rainfall exceeded drainage capacity causing excess surface water to flow overland to low points in the village, resulting in internal flooding of properties. [PAG,MUL] (p7)</p></div><div class="nugget-popup"><p>Intense rainfall on 27 July 2013 exceeded drainage capacity causing flooding. Internal flooding of residential properties occurred; at least two properties experienced internal flooding and at least two other properties were at high risk and residents manually prevented ingress. (p9)</p></div><div class="nugget-popup"><p>An intense rainfall event on the evening of 27/07/13 led to various incidents of flooding that affected people and property in the locality. (p11)</p></div><div class="nugget-popup"><p>Flood incidents occurred in the village associated with surface runoff, groundwater and/or ordinary (non&ndash;Main River) watercourses; NCC can investigate, suggest causes and make recommendations to mitigate risk but cannot compel or fund all actions. (p14)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration rainfall produced surface water flooding across the village. Drainage systems were unable to cope, causing surface water run&ndash;off from private areas to flow onto the public highway and vice versa; surface water from higher parts of the village reached the lowest points (up to 700 metres). Physical barriers (kerbs) were compromised and ponding and high velocity flows occurred at low points, causing overtopping towards properties. (p18)</p></div><div class="nugget-popup"><p>Anglian Water Services is to assess sources of water entering the public sewerage system; excess surface water or inappropriate inflows to the sewer network are identified as contributing to flood risk (risk of sewer surcharge/flooding), so assessment and reduction of these inflows is recommended. (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least two properties [PAG] (p6)</p></div><div class="nugget-popup quant"><p>internal flooding of at least two properties; more than one occasion in the last 5 years [PAG,MUL] (p7)</p></div><div class="nugget-popup quant"><p>at least two properties; at least two other properties (p9)</p></div></div></body></div>`)[0];
