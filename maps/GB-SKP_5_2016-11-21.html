                var html_c248ea81cb915da33a4cb50f43b4812f = $(`<div id="html_c248ea81cb915da33a4cb50f43b4812f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Woodbrook Road, Mellor</h1><div class="nugget-popup"><p>Named in the report title (Flood Investigation Report Woodbrook Road) and spatially associated with the marked Woodbrook Road Site, implying the street was the location under investigation for flooding. [IMG] (p1)</p></div><div class="nugget-popup"><p>Internal flooding to properties on the residential development occurred during the November 2016 event; flow path and overland discharge arrangements at the rear of the site were noted. (p3)</p></div><div class="nugget-popup"><p>Internal flooding occurred to properties on Woodbrook Road during the incident. [PAG] (p7)</p></div><div class="nugget-popup"><p>Residential properties on Woodbrook Road were flooded. [PAG] (p14)</p></div><div class="nugget-popup"><p>Residential properties on Woodbrook Road were flooded by overland surface water flows (flows overtopping the channel/culvert and discharging across the land toward property thresholds). Report recommends re&ndash;profiling the overland flow channel so its level is 870 mm below property thresholds and other measures to prevent recurrence. (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 properties (p3)</p></div><div class="nugget-popup quant"><p>5 properties internally flooded [PAG] (p7)</p></div></div></body></div>`)[0];

                var html_063803fbf322e32965c2654fe6f56381 = $(`<div id="html_063803fbf322e32965c2654fe6f56381" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Longhurst Lane, Mellor</h1><div class="nugget-popup"><p>Internal flooding of residential properties on Longhurst Lane caused by overland flood flows and a blocked culvert inlet/trash screen and impediments along the overland flow route; floodwater also discharged onto Longhurst Lane from an on&ndash;site flood flow path at the rear of Woodbrook Road. (p3)</p></div><div class="nugget-popup"><p>The culverted section of Cataract Brook under the adopted highway was implicated in the flooding incident on 21 November 2016; the culvert beneath Longhurst Lane conveyed the brook and was central to the incident. (p5)</p></div><div class="nugget-popup"><p>Flooding affected properties on Longhurst Lane and disrupted traffic along the road between Marple Bridge and Mellor. [PAG] (p7)</p></div><div class="nugget-popup"><p>Floodwater surged across and onto Longhurst Lane on the night of 21st November 2016, overtopping the footway and carriageway and inundating the road. Pedestrians and at least one vehicle were affected. The flooding was associated with a blocked trash screen at a culvert inlet which contributed to water backing up onto the road. [IMG] (p8)</p></div><div class="nugget-popup"><p>Overland flow was obstructed upstream by fences and trees, causing water to rise above the low&ndash;point and overspill onto Longhurst Lane. (p13)</p></div><div class="nugget-popup"><p>Flood flows from the overland flow channel and culverted watercourse discharged onto Longhurst Lane causing flooding of the carriageway/adjacent footpath. Recommendations include lowering the adjacent footpath and kerb by 100 mm, installing an additional gully to take excess flows, and increasing connection pipe diameter from 150 mm to 225 mm. [TAB,PAG] (p16)</p></div><div class="nugget-popup"><p>Overland/surface water flows from the local flood flow route affected the carriageway and adjacent footpath and overwhelmed local highway drainage, prompting recommendations to add gullies and improve culvert connections to manage excess flows. (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>12 properties (p3)</p></div><div class="nugget-popup quant"><p>12 properties flooded; 1 property internally flooded [PAG] (p7)</p></div><div class="nugget-popup quant"><p>water level reached 116.476 AOD; intended overspill point at 115.372 AOD; water level rose 1.104 m above the overspill low point (p13)</p></div></div></body></div>`)[0];
