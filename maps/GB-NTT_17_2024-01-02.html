                var html_992ac8e8982acb3d4685f74f67066ecc = $(`<div id="html_992ac8e8982acb3d4685f74f67066ecc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Trent</h1><div class="nugget-popup"><p>Between 2 and 4 January 2024 water levels in the River Trent at Colwick rose to near&ndash;record levels and were the primary cause of the flooding that led to internal flooding of properties in Colwick. [PAG] (p1)</p></div><div class="nugget-popup"><p>Water levels within the River Trent at Colwick rose to near&ndash;record levels due to sustained rainfall over a saturated catchment, causing flooding of roads and properties in Colwick. (p2)</p></div><div class="nugget-popup"><p>High water levels in the River Trent during Storm Henk prevented local watercourses from discharging to the river, causing backwater in those channels and contributing to internal flooding of residential and business properties in Vale Road, Charworth Road and Churchill Business Park. [PAG] (p3)</p></div><div class="nugget-popup"><p>High water levels in the River Trent (driven by rainfall during Storm Henk) prevented the local watercourse from discharging, producing backwater that caused channel capacity exceedance and internal flooding to nearby residential and business properties. [PAG] (p4)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>16 residential properties; 5 businesses [PAG] (p1)</p></div><div class="nugget-popup quant"><p>16 residential properties; 5 business properties [PAG] (p3)</p></div><div class="nugget-popup quant"><p>16 residential properties; 5 business properties [PAG] (p4)</p></div></div></body></div>`)[0];
