                var html_43d2c06057110cc767ad5572f7eb238f = $(`<div id="html_43d2c06057110cc767ad5572f7eb238f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>The Common</h1><div class="nugget-popup"><p>As river levels rose in the River Colne and Wraysbury River, water flowed across back gardens and into the main access road. Properties and accesses were surrounded by floodwater (reported to rise under floor boards) and sandbags/pumps were used to protect contents. [IMG,TAB] (p9)</p></div><div class="nugget-popup"><p>The Common was identified in this investigation as the location of a significant flood event and is recommended as a site&ndash;specific project to reduce flood risk. (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 residents reported water surrounding their properties and accesses; water depth approx 30cm; potentially 38 properties and 12 businesses could have been cut off; Approx 2 days duration [IMG,TAB] (p9)</p></div></div></body></div>`)[0];

                var html_aa241ac677020147b5996f956f191bbc = $(`<div id="html_aa241ac677020147b5996f956f191bbc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Fray's River</h1><div class="nugget-popup"><p>The Frays River was included in the flood warning issued for the area (the warning covered the River Colne and Frays River at West Drayton and Stanwell Moor), indicating it contributed to the local flood risk and was relevant to the event. [TAB] (p7)</p></div><div class="nugget-popup"><p>High river levels in the Frays River caused water to flow into adjacent back gardens and contributed to drains being unable to discharge to the river, producing ponding on the access road and flooding of properties' rear gardens. [TAB] (p10)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 properties' back gardens [TAB] (p10)</p></div></div></body></div>`)[0];

                var html_a6960d35fe5d135f47da282780cfab0f = $(`<div id="html_a6960d35fe5d135f47da282780cfab0f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Borough of Hillingdon</h1><div class="nugget-popup"><p>The borough experienced its largest flood event for a number of years. Flooding in the borough could affect residents and properties across multiple catchments (River Colne, River Crane, River Pinn and Yeading Brooks) and from surface water; evidence of impacts was collected via numerous calls, emails and letters to the Council. (p4)</p></div><div class="nugget-popup"><p>The borough experienced flood impacts requiring coordinated response: highways staff attended sites (including nights/weekends), debris was cleared from river structures to reduce blockages, sandbags were delivered to residents, and the Council and Environment Agency visited known hotspots. [PAG] (p5)</p></div><div class="nugget-popup"><p>Across the borough approximately 29 residential properties (and associated gardens and some garages) were affected by flooding; a small number of businesses and educational institutions were also reported affected, with one educational institution severely affected internally. Flooding reports came from across the whole borough. (p6)</p></div><div class="nugget-popup"><p>The report states the three electricity substations could have issues with flooded access during the event (access may have been compromised by water over the highway/entrances). [TAB] (p7)</p></div><div class="nugget-popup"><p>Flooding at Springwell Lane (Harefield) on the River Colne/ordinary watercourse/surface water pathway caused road inundation. Water could not drain because the River Colne was very high; vehicles were shown standing in water (up to wheel level in photos). Access to one business was cut off. The Council Highways team attended and placed signs to close the road. [TAB] (p19)</p></div><div class="nugget-popup"><p>Areas across the borough experienced flooding from local sources (surface water and groundwater) and from Main River flooding. Main River flooding is reported in association with the River Pinn and Cannons Brook. The investigation identified significant flood events at 'The Common' and 'Kings College Playing Fields'. (p23)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>29 residential properties; 1 educational institution (p6)</p></div><div class="nugget-popup quant"><p>3 Electricity Substations [TAB] (p7)</p></div><div class="nugget-popup quant"><p>1 business [TAB] (p19)</p></div></div></body></div>`)[0];
                popup_72e8985e632f4ea51b7bf5c0b4f3ba8a.setContent(html_a6960d35fe5d135f47da282780cfab0f);
