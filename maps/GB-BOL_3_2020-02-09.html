                var html_a7acd0114f7fbec7e882a4bac64739d8 = $(`<div id="html_a7acd0114f7fbec7e882a4bac64739d8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Irwell</h1><div class="nugget-popup"><p>Fluvial flooding from the Rivers Irwell and Croal (after significant rainfall on saturated ground) caused internal flooding of properties and businesses in Riverside Drive, Prestolee and Smiths Road. (p3)</p></div><div class="nugget-popup"><p>On 9 February 2020 the River Irwell rose to a peak of 1.31m at 13:30 (likely the fifth highest since 1948). A Flood Warning for the River Irwell at Prestolee and Ringley Bridges was issued at 09:05 on 9 February and reports of flooding to property in the area were made from approximately 12:45 (Community Flood Group). Historically the River Irwell has overflowed at Prestolee causing internal flooding (20 September 1946) and on 26 December 2015 (Storm Eva) flooding from the River Irwell caused internal flooding to residential properties on Riverside Drive and to properties on the opposite bank at Stoneclough Rise; Smiths Road also recorded internal flooding on 26 December 2015. [MUL] (p13)</p></div><div class="nugget-popup"><p>The River Irwell rose and flooded over its banks; rising river levels filled the surface water sewer system at the outfall serving Riverside Drive, causing backflow into highway gullies and resulting in highway flooding before the river bank was overtopped. Floating debris from the river impacted and damaged the brickwork outfall structure. (p16)</p></div><div class="nugget-popup"><p>The River Irwell overtopped/impacted its embankment adjacent to Riverside Drive, leaving a sandy mix of debris (including man&ndash;made material) on the embankment and contributing to marginal embankment stability and downstream flooding of Riverside Drive. (p17)</p></div><div class="nugget-popup"><p>The River Irwell at Riverside Drive swelled on 9th February 2020 and flooded into its floodplain, inundating property; a Flood Alert and Flood Warning were issued for the Irwell (Prestolee and Ringley area) with a targeted Flood Warning issued at 09:05 and the first threshold crossed at 10:30. [PAG] (p19)</p></div><div class="nugget-popup"><p>River Irwell rose to levels that triggered a Flood Alert and a Flood Warning for the Prestolee/Stoneclough/Ringley area; the first Flood Warning threshold for the area was crossed on the day of the event. After the event the EA Operations team removed sediment from the river in the area, assessed the viability of temporary defences and treated invasive riverbank vegetation to enable assessment of a potential flood wall; the EA also surveyed and re&ndash;modelled the river as part of a Strategic Business Case and progressed to an Outline Business Case for a proposed flood scheme. (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>25 properties; 5 businesses; 1 metre depth in some properties (p3)</p></div><div class="nugget-popup quant"><p>36 properties; 9 properties; 5 residential properties; 2 businesses [MUL] (p13)</p></div><div class="nugget-popup quant"><p>first Flood Warning threshold crossed; 81 properties within GM25 Flood Warning Area; 74 properties potentially received the flood warning; 52 properties registered with Floodline; 22 properties via Extended Direct Warnings (p20)</p></div></div></body></div>`)[0];

                var html_a92d0e8b3795927de185d63fb25eba9b = $(`<div id="html_a92d0e8b3795927de185d63fb25eba9b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Smith's Road, Darcy Lever</h1><div class="nugget-popup"><p>Internal flooding of properties and businesses on 9 February 2020 caused by fluvial flooding from the Rivers Irwell and Croal. (p3)</p></div><div class="nugget-popup"><p>Map identifies a flood location at the downstream edge of the catchment upstream of Smiths Road, indicating river flooding occurred at or immediately upstream of the area near Smiths Road. [IMG] (p11)</p></div><div class="nugget-popup"><p>Properties on Smiths Road were flooded on 9th February 2020 (the River Croal monitoring station at Moses Gate is approx. 1 km downstream of these flooded properties). (p12)</p></div><div class="nugget-popup"><p>Historic and recorded flooding occurred at Smith Road: river/surface&ndash;water related inundation affected residential and commercial properties; anecdotal evidence indicates areas served by sewers drained away after the river flooding associated with the 9 February event. [MUL] (p14)</p></div><div class="nugget-popup"><p>Highway drainage performed poorly during the flood, with gully gratings having become proud of the carriageway and the sag point served by only a single gully, reducing interception and flow capacity; gullies needed resetting and additional capacity to intercept water during the event. (p17)</p></div><div class="nugget-popup"><p>Location where the River Croal swelled on 9th February 2020 and flooded into the floodplain, resulting in properties being inundated. (p19)</p></div><div class="nugget-popup"><p>Surface water flooding and potential backflow into surface water sewer outfalls affecting the road and nearby properties; actions suggested include more frequent gully maintenance and examination of non&ndash;return valves on outfalls. [TAB] (p21)</p></div><div class="nugget-popup"><p>Surface water and sewer&ndash;related flooding affected properties at Riverside Drive and Smiths Road, with overflow risk into private property (specifically risk of overflow into the vehicle access and into no. 3 Smiths Road). The locations experienced issues with potential backflow from surface water/sewer outfalls during flood events. (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>25 properties; 5 businesses (Riverside Drive and Smiths Road) (p3)</p></div><div class="nugget-popup quant"><p>5 residential properties; 2 businesses [MUL] (p14)</p></div></div></body></div>`)[0];

                var html_eacb69502a3559637f9c82fad6db8eab = $(`<div id="html_eacb69502a3559637f9c82fad6db8eab" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Riverside Drive, Prestolee</h1><div class="nugget-popup"><p>Internal flooding of properties at around 1.30pm on 9 February 2020; flood depths were significant with around 1 metre depth in some properties. (p3)</p></div><div class="nugget-popup"><p>Flooding occurred at Riverside Drive, a residential area; the location is one of the two specific flood locations investigated in the report. [IMG] (p6)</p></div><div class="nugget-popup"><p>Inundation during the river flooding caused siltation of highway drainage gullies; gullies were found with high silt levels and were cleaned after the flood event. [PAG] (p14)</p></div><div class="nugget-popup"><p>During the flood the River Irwell rose and back&ndash;filled the surface water sewer outfall serving Riverside Drive, causing water to issue from highway gullies and resulting in flooding of the highway before the river overtopped its bank. Debris (a rolled&ndash;up section of chain link fencing) was found trapped at the sewer outfall hindering discharge; the outfall brickwork showed structural damage likely from impact by floating debris. (p16)</p></div><div class="nugget-popup"><p>Floodwaters from the River Irwell spilled onto Riverside Drive (via the left bank), depositing a sandy mix of debris with a high proportion of man&ndash;made material on the embankment and making the embankment marginally stable; the road and adjoining embankment were directly affected by the river flooding. [PAG] (p17)</p></div><div class="nugget-popup"><p>River water spilled onto Riverside Drive via the left bank during the storm, resulting in flooding affecting the Riverside Drive community. (p18)</p></div><div class="nugget-popup"><p>River Irwell swelled and flooded into its floodplain at Riverside Drive, inundating properties. A Forward Incident Officer was deployed to Riverside Drive at ~11:00 on 9 February to carry out door&ndash;knocking and advise evacuation; some residents evacuated while others remained. Follow&ndash;up visits and clean&ndash;up were carried out, with river silt and debris deposited on external areas and in highway gullies. (p19)</p></div><div class="nugget-popup"><p>Flooding affected Riverside Drive: the surface water outfall was identified as structurally impaired and there was risk of backflow into the surface water sewer during flood events. This led to continued development of a flood defence project for Riverside Drive and recommendations to consider reconstruction of the outfall and installation of non&ndash;return valves to reduce property flooding. [TAB] (p21)</p></div><div class="nugget-popup"><p>The surface water outfall at Riverside Drive is structurally impaired, contributing to flooding risk and allowing potential backflow into the drainage system during flood events; this has led RMAs to recommend reconstruction of the outfall and consideration of non&ndash;return valves to reduce property flooding. [PAG] (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>25 properties; 5 businesses; 1 metre depth in some properties (p3)</p></div><div class="nugget-popup quant"><p>10 Adult Social Care Officers; 2 Housing Officers; 2 Forward Incident Officers (p19)</p></div></div></body></div>`)[0];

                var html_c141845318f9e1034762ed93a684f313 = $(`<div id="html_c141845318f9e1034762ed93a684f313" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Prestolee</h1><div class="nugget-popup"><p>Prestolee (including Riverside Drive and Smiths Road) was directly impacted by river flooding on 9 February 2020, resulting in internal flooding of properties and businesses; properties on Riverside Drive experienced significant inundation (around 1 metre depth in some cases). (p3)</p></div><div class="nugget-popup"><p>River Irwell flooding at Prestolee/Ringley Bridges led to reports of flooding to property starting at approximately 12:45pm following the Flood Warning issued on 9th February 2020. Prestolee has also been the location of past River Irwell overflows (20th September 1946) and the Boxing Day 2015 event associated with Storm Eva. [MUL] (p13)</p></div><div class="nugget-popup"><p>The Prestolee community was specifically targeted by a Flood Warning issued on the morning of the event; EA staff provided real&ndash;time forecasting information to the local community flood group during the incident and used the group to organise a post&ndash;event community drop&ndash;in. (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>25 properties; 5 businesses; up to 1 metre depth (in some Riverside Drive properties) (p3)</p></div></div></body></div>`)[0];
