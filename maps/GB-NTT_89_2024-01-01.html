                var html_c775e9ce182b25cbc1436ae17f819542 = $(`<div id="html_c775e9ce182b25cbc1436ae17f819542" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Worksop</h1><div class="nugget-popup"><p>The River Ryton, which flows through Worksop, rose after sustained heavy rainfall and exceeded the property&ndash;flooding indicator level; properties on several streets in central Worksop were flooded. [IMG,PAG] (p2)</p></div><div class="nugget-popup"><p>Parts of Worksop experienced internal and external property flooding. Data show a total of 14 residential and 3 business properties suffered internal property flooding in the affected area, with additional external flooding affecting gardens and outbuildings. Named streets affected include Allen Street (12 properties), Hardy Street (5 properties) and Bridge Street (1 business property). [PAG] (p3)</p></div><div class="nugget-popup"><p>The Environment Agency issued Flood Warnings for the River Ryton at Worksop (including Worksop town centre). Multi&ndash;agency activity (EA flood patrols and blockage clearance, community information gathering and a multi&ndash;agency drop&ndash;in) was carried out to understand and respond to impacts on affected communities; local authorities provided sandbags/resilience stores and other support to vulnerable premises/residents in the district. (p5)</p></div><div class="nugget-popup"><p>Conveyance and tree works and desilting through the town centre were proposed as recovery works, indicating the river's channel and banks were affected by the flood. (p6)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>18 properties (12 on Allen Street; 5 on Hardy Street; 1 on Bridge Street) [IMG,PAG] (p2)</p></div><div class="nugget-popup quant"><p>14 residential properties; 3 business properties; 12 properties on Allen Street; 5 properties on Hardy Street; 1 property on Bridge Street [PAG] (p3)</p></div></div></body></div>`)[0];
