                var html_ecd63cb17e62e658ed4b53e8576e0e2e = $(`<div id="html_ecd63cb17e62e658ed4b53e8576e0e2e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Smalls Croft, Woodborough</h1><div class="nugget-popup"><p>Properties on Smalls Croft were impacted by surface&ndash;water flooding; the location is marked on the flood&ndash;affected area map and highlighted in surface&ndash;water flood&ndash;risk mapping. [IMG,PAG] (p3)</p></div><div class="nugget-popup"><p>Water from the Woodborough Brook, which burst its bank and flowed down Main Street, entered Smalls Croft. Due to lower topography water pooled on Smalls Croft (observed to be roughly 1 m deep in places) and 11 residential properties were internally flooded. [IMG] (p5)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>11 properties [IMG,PAG] (p3)</p></div><div class="nugget-popup quant"><p>11 residential properties [IMG] (p5)</p></div></div></body></div>`)[0];

                var html_46d97916b13b4e2829d3c99bc20c7bd9 = $(`<div id="html_46d97916b13b4e2829d3c99bc20c7bd9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bank Hill, Woodborough</h1><div class="nugget-popup"><p>Bank Hill was identified on the flood&ndash;affected area maps and in the report as having experienced surface&ndash;water flooding. [IMG,PAG] (p3)</p></div><div class="nugget-popup"><p>A drainage ditch south of Bank Hill flows into a culvert which was overwhelmed during Storm Babet; water flowed along the highway and into adjacent properties, causing internal flooding. [IMG] (p8)</p></div><div class="nugget-popup"><p>Flooding was experienced on Bank Hill; investigations by NCC are ongoing and meetings with residents have been held to discuss the flooding they experienced. (p12)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 properties [IMG,PAG] (p3)</p></div><div class="nugget-popup quant"><p>3 residential properties [IMG] (p8)</p></div></div></body></div>`)[0];

                var html_f58f59235e02af982a4aa1ea0305533a = $(`<div id="html_f58f59235e02af982a4aa1ea0305533a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Woodborough</h1><div class="nugget-popup"><p>During the storm event Woodborough experienced river and surface&ndash;water flooding: Woodborough Brook recorded a peak water level (1.115 m at 11:45) and heavy sustained rainfall led to rapid saturation of the ground and flooding of roads, gardens, outbuildings and properties. Internal flooding occurred in multiple residential properties. [PAG] (p2)</p></div><div class="nugget-popup"><p>The village experienced surface&ndash;water flooding concentrated in the central area and at peripheral sites; multiple streets/addresses across the village were flooded as shown on the location and flood&ndash;risk maps. [IMG,PAG] (p3)</p></div><div class="nugget-popup"><p>Flooding in the village from the Woodborough Brook bursting its banks led to surface&ndash;water flows along Main Street that entered properties and left many residents unable to leave or access the village for many hours. [PAG] (p4)</p></div><div class="nugget-popup"><p>The community was the subject of a Flood Alert for River Trent tributaries (20/10/2023). The Environment Agency carried out flood patrols, operated structures and cleared blockages before and after peak flows; EA and other RMAs deployed officers/surveyors to visit affected households and gather data. The Woodborough Flood Action Group collated local flood mechanisms and impacts and shared these with NCC. [PAG] (p11)</p></div><div class="nugget-popup"><p>The village experienced flooding; the Woodborough Flood Action Group collated and shared the impacts and mechanisms of flooding with NCC officers. A natural flood management scheme is being delivered in the upper catchment to create temporary storage to attenuate water during flood events and reduce risk. (p12)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>49 residential properties; Main Street: 30 properties; Smalls Croft: 11 properties; Pinfold Crescent: 2 properties; Shelt Hill: 2 properties; Bank Hill: 3 properties; Pinfold Close: 1 property [PAG] (p2)</p></div><div class="nugget-popup quant"><p>Main Street (30 properties); Smalls Croft (11 properties); Pinfold Crescent (2 properties); Shelt Hill (2 properties); Bank Hill (3 properties); Pinfold Close (1 property). [IMG,PAG] (p3)</p></div><div class="nugget-popup quant"><p>28 residential properties; 2 businesses; 11 residential properties [PAG] (p4)</p></div></div></body></div>`)[0];
