m Brook flood defences. (p66)</p></div><div class="nugget-popup"><p>Contains Flood Cluster E where internal flooding affected a property on Palmyra Square South within the ward; the cluster is in the town centre and is primarily commercial. (p70)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>171 properties internally flooded; 59 properties externally flooded; 230 properties total [PAG] (p42)</p></div><div class="nugget-popup quant"><p>Molyneux Avenue: 4 properties internally flooded; 1 property externally flooded. Reid Avenue: 8 properties internally flooded. Rutter Avenue: 9 properties externally flooded. Southworth Avenue: 52 properties internally flooded; 25 properties externally flooded. Summerfield Avenue: 2 properties externally flooded. Grand Total: 109 properties internally flooded; 51 properties externally flooded. [IMG,PAG] (p43)</p></div><div class="nugget-popup quant"><p>46 properties internally flooded; 7 properties externally flooded (p53)</p></div><div class="nugget-popup quant"><p>15 properties (p60)</p></div><div class="nugget-popup quant"><p>16 properties; 2 highway gullies (p66)</p></div><div class="nugget-popup quant"><p>1 property (p70)</p></div></div></body></div>`)[0];

                var html_8385414697fd39b25628804962bb3dff = $(`<div id="html_8385414697fd39b25628804962bb3dff" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Sankey Brook</h1><div class="nugget-popup"><p>Experienced exceptionally high river levels during Storm Christoph; a gauging location at Higham Avenue on Sankey Brook recorded its highest water level in its period of record. (p22)</p></div><div class="nugget-popup"><p>Monitoring recorded exceptionally high river levels during the referenced storm: the Higham Avenue gauge on Sankey Brook recorded its highest water level for its period of record during the event, indicating a rapid and strong river&ndash;level response. [TAB,PAG] (p23)</p></div><div class="nugget-popup"><p>Multiple Flood Warnings (and a Flood Alert) were issued for Sankey Brook during Storm Christoph, including specific warnings for Sankey Brook at Gemini, areas at Dallam, Sankey Bridges and surrounding neighbourhoods (Bewsey, Longford, Orford, Great Sankey, Penketh), indicating active risk of river flooding. [TAB,MUL] (p30)</p></div><div class="nugget-popup"><p>Raised watercourse levels in Sankey Brook impeded discharge from local surface water outfalls and the pump station at Higham Avenue, causing hydraulic restriction that degraded surface water drainage performance in adjacent areas. [PAG] (p45)</p></div><div class="nugget-popup"><p>River flooding during Storm Christoph (18 Jan 2021 &ndash; 21 Jan 2021). Observed flood extents from the event generally corresponded with the medium&ndash;risk flood outline. The brook received discharges from the Higham Avenue pump station and the connected combined sewer network, contributing to inundation of adjacent low&ndash;lying areas in the Bewsey/Higham Avenue area. [IMG,PAG] (p46)</p></div><div class="nugget-popup"><p>Sankey Brook reached exceptionally high levels during the event, exceeding the local minor&ndash;flood threshold and causing hydraulic restriction that would impair surface water drainage and may have caused backflow into tributaries. [IMG,PAG] (p51)</p></div><div class="nugget-popup"><p>Primary flood mechanism was water overtopping the banks of Sankey Brook; raised watercourse levels caused hydraulic restriction of gravity outfalls and pumps discharging to Sankey Brook were effective until overwhelmed by overtopping and subsequent power failure, contributing to surface water flooding in the area. (p52)</p></div><div class="nugget-popup"><p>Sankey Brook rose to very high levels during the event (gauge peak recorded), overtopping bank levels and causing hydraulic restriction to low&ndash;level outfalls. High Sankey Brook levels contributed to backflow into tributary watercourses and to flooding in the Bewsey and Whitecross area (including impacts around Hawleys Lane underbridge). [PAG] (p59)</p></div><div class="nugget-popup"><p>Sankey Brook experienced high fluvial levels during the Storm Christoph event; gauge data at Higham Avenue recorded a maximum level on 21 January 2021, contributing to fluvial flooding and flood extents that affected nearby residential and low&ndash;lying areas. (p64)</p></div><div class="nugget-popup"><p>Raised water levels on Sankey Brook during the event caused hydraulic restriction of low&ndash;level outfalls, which reduced the performance of surface water drainage and likely produced backflow into connected tributaries (including Dallam Brook). (p65)</p></div><div class="nugget-popup"><p>Raised water levels in Sankey Brook caused hydraulic restriction at surface water outfalls, reducing the performance of surface water drainage systems and contributing to the observed flood extents during Storm Christoph. (p79)</p></div><div class="nugget-popup"><p>Sankey Brook experienced raised fluvial levels during the Storm Christoph event, with the Higham Avenue gauge peaking and exceeding the 2.80m minor&ndash;flood threshold; elevated levels caused hydraulic restriction of low&ndash;level outfalls and affected surface water drainage performance in the surrounding area. [IMG] (p83)</p></div><div class="nugget-popup"><p>Water overtopped the banks of Sankey Brook, producing raised watercourse levels that caused hydraulic restriction to low&ndash;level outfalls and reduced the performance of surface water drainage; high river levels may have caused backflow into adjacent tributaries. [PAG] (p84)</p></div><div class="nugget-popup"><p>Raised watercourse levels in Sankey Brook caused hydraulic restriction at surface water sewer outfalls discharging to the brook, reducing the performance of surface water drainage systems. (p86)</p></div><div class="nugget-popup"><p>Sankey Brook reached very high levels during the event (peak recorded at the nearby gauge), causing hydraulic restriction to low&ndash;level outfalls and affecting the performance of surface&ndash;water drainage systems. High water levels in Sankey Brook would have linked to and driven backflow into connected channels (including Sankey Canal), contributing to local flooding and drainage failure in the catchment. [IMG,PAG] (p90)</p></div><div class="nugget-popup"><p>High water levels on Sankey Brook caused downstream hydraulic restriction and back&ndash;flow into connected watercourses (including Sankey Canal/North Park Brook), contributing to flooding at Grant Close. [PAG] (p91)</p></div><div class="nugget-popup"><p>Raised watercourse levels during the event likely caused hydraulic restriction at the outfall of the public surface water sewer serving Rostherne Close, reducing the performance of the surface water drainage system. (p118)</p></div><div class="nugget-popup"><p>During Storm Christoph the Sankey Brook reached a peak level at the Liverpool Road gauge that exceeded the Environment Agency&#8217;s minor&ndash;flood threshold, causing river flooding conditions and creating hydraulic restriction at low outfalls that reduced the effectiveness of surface water drainage systems. [IMG] (p121)</p></div><div class="nugget-popup"><p>Brook levels rose and the brook overtopped its banks after initial surface water/sewer flooding, contributing to increased inundation and causing hydraulic restriction at low&ndash;level outfalls which reduced surface water drainage performance. (p122)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one of 13 gauging stations recorded highest water levels during the event (Higham Avenue is cited) [TAB,PAG] (p23)</p></div><div class="nugget-popup quant"><p>Maximum water level at the Higham Avenue gauge was 3.82m on 21 January 2021 (minor flooding threshold 2.80m; previous record 3.32m on 26 September 2012). [IMG,PAG] (p51)</p></div><div class="nugget-popup quant"><p>3.82 m peak water level recorded at the nearby gauge (Higham Avenue) on 21 January 2021; previous gauge record 3.32 m (26 September 2012) [IMG,PAG] (p90)</p></div><div class="nugget-popup quant"><p>Maximum gauge level 4.24m on 21 Jan 2021; EA minor&ndash;flood threshold 3.80m; previous recorded high 3.98m on 05 Dec 2013. [IMG] (p121)</p></div></div></body></div>`)[0];

                var html_b8f28666d0af90f8c15e6187a2d5a161 = $(`<div id="html_b8f28666d0af90f8c15e6187a2d5a161" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Dallam Brook</h1><div class="nugget-popup"><p>Raised levels in Dallam Brook contributed to hydraulic restriction of low&ndash;level surface water outfalls discharging to the brook, reducing the effectiveness of local surface water drainage systems. [PAG] (p45)</p></div><div class="nugget-popup"><p>Dallam Brook and its corridor are identified as the focus of the highest flood risk; observed flood extents during Storm Christoph concentrated along this watercourse, causing river flooding of adjacent low&ndash;lying land and residential areas. [IMG] (p47)</p></div><div class="nugget-popup"><p>Experienced hydraulic restriction due to raised receiving watercourse levels and may have experienced back flow from Sankey Brook as high levels were recorded, contributing to local flooding. (p52)</p></div><div class="nugget-popup"><p>Fluvial flooding from Dallam Brook during Storm Christoph (18 Jan 2021 &ndash; 21 Jan 2021) produced observed flood extents that match the mapped medium&ndash;risk flood outline; adjacent low&ndash;lying areas were inundated. Surface water sewers discharge to Dallam Brook to the south, linking surface&ndash;water runoff into the brook and local flood interaction between sewers and the watercourse. [IMG,PAG] (p57)</p></div><div class="nugget-popup"><p>Tributary experienced hydraulic restriction and may have experienced backflow from Sankey Brook due to the high recorded water levels; received discharge from local surface water systems and was implicated in local drainage performance issues contributing to flooding near the underbridge. [PAG] (p59)</p></div><div class="nugget-popup"><p>Dallam Brook is adjacent to properties at the head of the Charter Avenue cul&ndash;de&ndash;sac and, as a main river in the area, contributed to the local flood hazard with potential overbank flows or inundation affecting those properties during the event. (p64)</p></div><div class="nugget-popup"><p>Experienced hydraulic restriction and overtopping of its flood defences during the event; highway gullies at the head of the cul&ndash;de&ndash;sac surcharged prior to overtopping, contributing to local surface water impacts. (p65)</p></div><div class="nugget-popup"><p>Overtopping of flood defences on Dallam Brook contributed to the flooding mechanism that inundated Charter Avenue (part of Bewsey and Whitecross Flood Cluster C). (p66)</p></div></div></body></div>`)[0];

                var html_5095db174ec7f93d67b6a1905ef8f864 = $(`<div id="html_5095db174ec7f93d67b6a1905ef8f864" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cockshot Brook</h1><div class="nugget-popup"><p>The culverted east&ndash;west watercourse (running ~600m) discharges to Cockshot Brook. The brook is the downstream receiver of runoff conveyed by that culvert and was implicated in historic flooding at this location, prompting a 2017 realignment and upsizing of the culvert to reduce risk to properties. During 18 Jan 2021&ndash;21 Jan 2021, the primary mechanism was surface water runoff from agricultural land accumulating in a localised topographic depression and conveyed via the culverted watercourse to Cockshot Brook, contributing to local flood risk. (p94)</p></div></div></body></div>`)[0];

                var html_4ca78dbc1bbc6ac4064956bb287a6dac = $(`<div id="html_4ca78dbc1bbc6ac4064956bb287a6dac" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Warrington Unitary Authority</h1><div class="nugget-popup"><p>Flooding across multiple locations in Warrington leading to internal and external property flooding on a number of residential streets (see cluster and per&ndash;street counts in Table 2.2). [TAB] (p7)</p></div><div class="nugget-popup"><p>Homes were evacuated due to rising floodwater. (p9)</p></div><div class="nugget-popup"><p>During Storm Christoph, prolonged heavy rainfall led to sustained high water levels in receiving watercourses and reduced performance of adjacent drainage systems, which caused flooding across parts of Warrington. (p21)</p></div><div class="nugget-popup"><p>Watercourse gauges sited in the Warrington area monitor rivers and, during the event, at least some gauges in/near Warrington recorded record measurements (examples in the text include Higham Avenue on Sankey Brook and Little Woolden Hall on Glaze Brook). [TAB] (p23)</p></div><div class="nugget-popup"><p>Widespread flood risk across much of Warrington: properties and communities are identified as at risk of inundation from the Estuary (high tides) and from nearby watercourses/canals. Specific assets/areas listed as at risk include properties between Callands Road and Sankey Brook; Marshall Avenue; Hawleys Lane; Southworth Avenue; Charter Avenue; areas from Longshore/Hawleys Lane to the Victoria Park allotments including the car park, bowling greens, running track, allotments, playground, skatepark and sports pitches; properties at and around Bollington Mill and Bollington Hall Farm; properties on Lymm Road adjacent to Agden Brook; properties on Alder and Hall Lane; Longford, Winwick Quay, Hawleys Park, Orford, Callands and Bewsey; parts of Penketh and Sankey Bridges south of the A562 and A57 and Gatewarth Industrial Estate; Knutsford Road area (at risk from estuary high tides) including properties from Knutsford Road to the railway embankment behind St Mary's Street; Bank Quay area including industrial units behind the railway embankment, Bank Quay Station, Atherton Quay; Fiddlers Ferry area including the Sailing Club, The Ferry Tavern and Riverside Trading Estate (at risk from the Mersey Estuary due to high tides); properties between the Ship Canal and Thelwall New Road, along Lymm Road and properties along Ferry Lane. These areas are identified within the Flood Warning Area for Warrington and therefore are expected to be affected by flooding hazards noted above. [IMG,PAG] (p26)</p></div><div class="nugget-popup"><p>Multiple areas across Warrington are identified as at risk of flooding: tidal flooding from the Mersey Estuary affecting centre park/Arpley Meadows, Kingsway North, Howley, Bank Quay, Manor Park/Westy/Howley areas; river flooding from watercourses including the River Bollin and Sankey Brook affecting areas adjacent to the Ship Canal and River Bollin, Sankey Bridges, Gemini Industrial Park and other local streets. [TAB,PAG] (p28)</p></div><div class="nugget-popup"><p>Warrington was the focus of multiple flood alerts and flood warnings issued during the event for local river catchments (River Sankey, River Bollin, River Glaze), with warnings and severe warnings issued for locations including Sankey Brook (Gemini, Dallam, Sankey Bridges) and River Bollin (Little Bollington, Heatley). [TAB] (p30)</p></div><div class="nugget-popup"><p>Groundwater levels across Warrington rose through January and were recorded as being between 'Normal' and 'Exceptionally high' for the time of year. Levels ended January higher than at the end of December; the rise is attributed in the report to Storm Christoph. The borough contains a network of 16 Environment Agency groundwater monitors that recorded these elevated levels. [IMG,TAB] (p32)</p></div><div class="nugget-popup"><p>Groundwater levels within Warrington increased (Figure 23). Some monitoring sites showed pronounced spikes (e.g. Croft PS, Myddleton Lane), and saturated ground led to surface water flows onto highways; groundwater was considered to have partially contributed to local flooding. [IMG] (p33)</p></div><div class="nugget-popup"><p>Surface&ndash;water flooding affected residential properties within the borough (two properties on Woodbridge Close, Appleton). (p37)</p></div><div class="nugget-popup"><p>Elevated Sankey Brook levels (peak recorded at Higham Avenue) caused hydraulic restriction of low&ndash;level outfalls within the area, reducing surface water drainage performance and creating potential for local surface water flooding and backflow into tributaries. [IMG] (p51)</p></div><div class="nugget-popup"><p>Bewsey and Whitecross Flood Cluster B (within Warrington) experienced property flooding during the event summarized in Table 5.3. (p53)</p></div><div class="nugget-popup"><p>The Bewsey & Whitecross Flood Cluster E in the town centre (within the borough) experienced internal flooding to one property on Palmyra Square South. [IMG,PAG] (p70)</p></div><div class="nugget-popup"><p>Raised levels on Sankey Brook (peak recorded at the Higham Avenue gauge) caused hydraulic restriction of low&ndash;level outfalls, degrading surface water drainage performance in the local area and making minor fluvial flooding possible adjacent to the brook. [IMG] (p83)</p></div><div class="nugget-popup"><p>Sankey Brook reached a peak level (3.82m at Higham Avenue on 21 Jan 2021) during the event, producing raised watercourse levels that caused hydraulic restriction of low&ndash;level outfalls. This reduced the performance of surface water drainage, and backflow from Sankey Canal into smaller connected watercourses (including North Park Brook and the wooded watercourse by Ladywood Road) is reported to have contributed to localised flooding (including flooding referenced at Grant Close). [IMG,PAG] (p90)</p></div><div class="nugget-popup"><p>Warrington Borough Council concluded that within the Croft Flood Cluster (Heath Lane) the primary flood mechanism during the event was surface water runoff and overland flow caused by heavy rainfall on already&ndash;saturated rural and agricultural land, resulting in flooding at Heath Lane. [PAG] (p97)</p></div><div class="nugget-popup"><p>Sankey Brook levels at the Liverpool Road gauge (Warrington) peaked above the EA minor&ndash;flood threshold during the Storm Christoph event, meaning minor flooding was possible in the area and low&ndash;level outfalls experienced hydraulic restriction that impaired surface water drainage performance. [IMG] (p121)</p></div><div class="nugget-popup"><p>Areas within Warrington Borough (notably the Lymm / Reddish Lane area) experienced river overbank flooding and localised inundation of roads, fields and some residential properties during the referenced events. [IMG] (p139)</p></div><div class="nugget-popup"><p>Flood depths and extents observed during Storm Christoph (18&ndash;21 Jan 2021) in the local area matched those from the July 2019 event; inundation was associated with a nearby pond and watercourse north&ndash;east of Reddish Lane and produced overland flooding. No foul sewer flooding was reported by residents, although high water volumes may have obscured evidence of foul flooding. [IMG] (p140)</p></div><div class="nugget-popup"><p>Flooding during Storm Christoph affected properties on Reddish Lane; the council applied for and secured funding and is constructing a drainage scheme (replacement of an open watercourse with large&ndash;diameter piped drainage and a partition wall) to reduce future flooding risk. [IMG,PAG] (p148)</p></div><div class="nugget-popup"><p>The document is part of a Section 19 flood investigation concerning a flood event in Warrington that occurred between 18 January 2021 and 21 January 2021. [PAG] (p155)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 properties (p37)</p></div><div class="nugget-popup quant"><p>46 properties internally flooded; 7 properties externally flooded (p53)</p></div><div class="nugget-popup quant"><p>1 property [IMG,PAG] (p70)</p></div><div class="nugget-popup quant"><p>mapped local depths &gt;0.50m in the worst&ndash;affected locations; referenced observed flood level 11.850m AOD [IMG] (p139)</p></div></div></body></div>`)[0];

                var html_07d1181a07916580035d86f4e0dc9b11 = $(`<div id="html_07d1181a07916580035d86f4e0dc9b11" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Mersey</h1><div class="nugget-popup"><p>The River Mersey experienced sharply increased flows during the same period: monitoring (e.g. Ashton Weir) shows monthly mean flows rising into the exceptionally high band by Feb&ndash;21; river flow sites in the Mersey catchment were classified above normal / notably high during the storm period. [IMG,TAB] (p23)</p></div><div class="nugget-popup"><p>High tides in the Mersey Estuary caused tidal flooding risk to multiple named areas in the report, including the Knutsford Road area of Warrington (properties extending from Knutsford Rd to the railway embankment behind St Mary's Street), the Bank Quay area (industrial units behind the railway embankment at Bank Quay Station and properties around Atherton Quay), Fiddlers Ferry area (Sailing Club, The Ferry Tavern and Riverside Trading Estate) and the stretch from Runcorn to Woolston affecting parts of Manor Park, Sandymoor (Runcorn), Howley, Wilderspool, Latchford, Westy, Paddington and Woolston. [TAB] (p28)</p></div></div></body></div>`)[0];

                var html_f5bb22004da49d51951675d8636fd860 = $(`<div id="html_f5bb22004da49d51951675d8636fd860" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Weaver</h1><div class="nugget-popup"><p>The River Weaver responded rapidly to heavy rainfall during Storm Christoph: gauging stations on the Weaver recorded exceptionally high flows and some of the highest water levels on record for their periods of record (examples given include Hayhurst Bridge and Ashbrook). Hydrometry teams carried out the highest spot flow gaugings on record at Weaver locations (Rudheath). [IMG,PAG] (p23)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Thirteen gauging stations in GMC recorded their highest water levels (includes Weaver sites); Ashbrook monthly mean flow rose to exceptionally high levels (Feb&ndash;21 on plots); highest spot flow gaugings recorded at Rudheath (Weaver). [IMG,PAG] (p23)</p></div></div></body></div>`)[0];

                var html_124003e044da7e816495a76d3f13f5e6 = $(`<div id="html_124003e044da7e816495a76d3f13f5e6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Bollin</h1><div class="nugget-popup"><p>Flooding from the River Bollin/adjacent Ship Canal affected land adjacent to the watercourse, putting Reddish Hall and properties on Rushes Avenue, Birch Brook Road and Chaise Meadow at risk; properties on Old Mill Lane are also described as at risk from this watercourse. [TAB] (p28)</p></div><div class="nugget-popup"><p>The River Bollin catchment was covered by a Flood Alert (013WAFBO issued 18/01/2021 19:44). Specific Flood Warnings and subsequent Severe Flood Warnings were issued for River Bollin locations (e.g. Little Bollington and Heatley), indicating risk of river flooding on the River Bollin. [TAB,PAG,MUL] (p30)</p></div><div class="nugget-popup"><p>Groundwater monitors associated with the Bollin / Dean / Upper Mersey catchment (e.g. Oughtrington Lane B) recorded elevated groundwater levels in January; region&ndash;wide groundwater levels were classed 'Notably high' to 'Exceptionally high' for the time of year following Storm Christoph. [TAB] (p32)</p></div><div class="nugget-popup"><p>High river flows caused overbank flooding on the Bollin (recorded upstream of Lymm at Bramhall and Poynton) during the late July/early August 2019 event; flood depths/extents observed during Storm Christoph (January 2021) were reported to be similar to the 2019 event. [IMG,MUL] (p138)</p></div><div class="nugget-popup"><p>Significant river flooding recorded upstream of Lymm; Environment Agency telemetry shows a maximum water level of 1.49 m at Bollington Mill during the event. [IMG,PAG] (p143)</p></div><div class="nugget-popup"><p>River levels rose above the Environment Agency minor&ndash;flood threshold (1.00m) during the event; peak recorded at the Bollington Mill gauge reached 1.49m on 21 January 2021, indicating potential for minor flooding in the vicinity. [PAG] (p144)</p></div><div class="nugget-popup"><p>The River Bollin reached very high levels (matching the previous peak in August 2019), left its banks and caused inundation of adjacent ordinary watercourses and fields. Raised Bollin levels caused hydraulic restriction at low&ndash;level outfalls, reducing surface water drainage performance and producing backflow into minor tributary watercourses, contributing to flooding of properties (notably at Reddish Lane). [MUL] (p145)</p></div><div class="nugget-popup"><p>Water levels adjacent to the Bollin corresponded with flood levels observed at Reddish Lane, indicating overflow from the Bollin into fields and onto the lane. [IMG,PAG] (p146)</p></div><div class="nugget-popup"><p>The River Bollin left its banks during the event and entered the tributary watercourse to the rear of properties on Reddish Lane. Raised Bollin water levels (approximately 11.850m AOD) prevented connected drainage outfalls from discharging, caused hydraulic backflow up the tributary and contributed to flooding of adjacent fields, carriageway and properties. (p147)</p></div><div class="nugget-popup"><p>A significant flood envelope is identified north of Warrington Lane; observed flood extents on the River Bollin during Storm Christoph corresponded with the medium&ndash;risk flood outline. (p152)</p></div><div class="nugget-popup"><p>High water levels in the River Bollin during the 18 Jan 2021 &ndash; 21 Jan 2021 event caused backflow into the network of minor watercourses and ditches that drain to the Bollin, contributing to hydraulic restriction in those smaller channels and localised flooding impacts. [PAG] (p153)</p></div><div class="nugget-popup"><p>Significant river flooding was recorded on the River Bollin upstream of Lymm, with high water levels measured during the event. The flooding contributed to extensive local impacts (reported on 19&ndash;21 January 2021) and hydrometric monitoring recorded a peak at Bollington Mill. [IMG,PAG] (p156)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 in 100 year event (per Environment Agency); maximum recorded river level 1.49m at Bollington Mill (01 Aug 2019) [IMG,MUL] (p138)</p></div></div></body></div>`)[0];

s="nugget-popup"><p>Sankey Brook at the Higham Avenue gauge recorded a high fluvial level during the Storm Christoph event, indicating significant river flooding at the gauge location; this level exceeded the prior recorded maximum for the station. (p64)</p></div><div class="nugget-popup"><p>The nearest telemetry/gauge on Sankey Brook at Higham Avenue recorded a peak water level of 3.82 m on 21 January 2021, exceeding the Environment Agency minor&ndash;flooding threshold (2.80 m). Elevated river levels at this location would have caused hydraulic restriction of outfalls and degraded surface&ndash;water drainage performance locally, increasing flood risk to adjacent streets and properties. (p90)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>11 internal properties; 1 external property [TAB] (p7)</p></div><div class="nugget-popup quant"><p>One of 13 gauging stations in GMC that recorded their highest water levels (p22)</p></div><div class="nugget-popup quant"><p>11 properties internally flooded; 1 property externally flooded [TAB] (p42)</p></div></div></body></div>`)[0];

d [TAB] (p113)</p></div><div class="nugget-popup quant"><p>1 externally flooded property [IMG,PAG] (p123)</p></div></div></body></div>`)[0];

                var html_41bfee187284cdb5721c46c9c533e368 = $(`<div id="html_41bfee187284cdb5721c46c9c533e368" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Reddish Lane, Lymm</h1><div class="nugget-popup"><p>Internal flooding to residential properties on Reddish Lane during the event. (p137)</p></div><div class="nugget-popup"><p>Road and adjacent properties were inundated; flooding blocked road access and reached property entrances. Deepest flooding concentrated near the intersection and adjacent properties; photographic insets confirm significant road and property inundation. [IMG,MUL] (p139)</p></div><div class="nugget-popup"><p>During the Storm Christoph event (18 Jan 2021 &ndash; 21 Jan 2021) the area around Reddish Lane experienced surface water flooding. The United Utilities combined sewer serves Reddish Lane; residents did not report foul (sewer) flooding, but the presence of large volumes of water means evidence of foul flooding may not be obvious. (p140)</p></div><div class="nugget-popup"><p>Properties at Reddish Lane were inundated from a tributary/ordinary watercourse that flows to their rear after the River Bollin left its banks; water flowed from the rear watercourse around property sides and flooded low areas of the carriageway. A tide&ndash;flap at the outfall would have been closed, restricting discharge and contributing to inundation. [PAG] (p145)</p></div><div class="nugget-popup"><p>Reddish Lane was inundated with water originating from the River Bollin. Water flowed from the watercourse to the rear of affected properties, moved around the sides of properties and flooded low areas of the carriageway. [IMG,PAG] (p146)</p></div><div class="nugget-popup"><p>Flood water from the River Bollin left its banks and backflowed up the tributary running to the rear of properties on Reddish Lane. Water flowed around the sides of the affected property and flooded low areas of the carriageway. Raised watercourse levels prevented drainage outfalls from discharging (tide/flap valves shut) and the low&ndash;spot surface water drain which discharges to a United Utilities combined pumped system would likely have been overwhelmed, reducing drainage performance and prolonging inundation. [PAG] (p147)</p></div><div class="nugget-popup"><p>Flooding during Storm Christoph affected the area behind properties on Reddish Lane, prompting a funded scheme to replace the open watercourse with a large diameter piped drainage system and construct a partition wall to control flows and reduce future flood risk to the properties. [PAG] (p148)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>6 properties (p137)</p></div><div class="nugget-popup quant"><p>observed flood level 11.850m AOD; mapped observed flood depth 1.125m AOD; deepest mapped depths &gt;0.50m [IMG,MUL] (p139)</p></div><div class="nugget-popup quant"><p>flood level reached approximately 11.850m AOD; adjacent property levels around 11.46m AOD [PAG] (p147)</p></div></div></body></div>`)[0];

iv class="nugget-popup"><p>Within this flood cluster (East of Whittle Hall Lane) Alderbank Road and Belmont Crescent were identified as having experienced external flooding driven by raised levels in Whittle Brook; raised water levels likely impaired surface water outfalls and drainage performance. Mossdale Close could not be assigned a definitive cause from the available information. (p130)</p></div><div class="nugget-popup"><p>Part of the Great Sankey residential area (cluster D / Sunflower Drive) experienced surface water flooding resulting in external flooding to one property. [IMG,TAB] (p131)</p></div><div class="nugget-popup"><p>Residential flood cluster where properties experienced external flooding during the event. [TAB] (p133)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>190 properties; 84 internally flooded; 106 externally flooded [TAB] (p113)</p></div><div class="nugget-popup quant"><p>15 properties (p122)</p></div><div class="nugget-popup quant"><p>1 property externally flooded (Highfield Avenue) [IMG,TAB,PAG] (p123)</p></div><div class="nugget-popup quant"><p>3 properties externally flooded (Alderbank Road: 1 externally flooded; Belmont Crescent: 1 externally flooded; Mossdale Close: 1 externally flooded). [IMG,TAB] (p127)</p></div><div class="nugget-popup quant"><p>1 externally flooded property [IMG,TAB] (p131)</p></div><div class="nugget-popup quant"><p>2 properties externally flooded [TAB] (p133)</p></div></div></body></div>`)[0];

ned sewer and possible influence from a nearby brook. (p123)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>15 properties [PAG] (p122)</p></div><div class="nugget-popup quant"><p>1 externally flooded property (Highfield Avenue) (p123)</p></div></div></body></div>`)[0];
