                var html_14e8c85c645a88894c78245fad2460a1 = $(`<div id="html_14e8c85c645a88894c78245fad2460a1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Fox Lane, Wootton</h1><div class="nugget-popup"><p>Flooding of the highway junction between Fox Lane and Whitecross on 4 January 2024. Highly waterlogged soils and an unmaintained ordinary watercourse about 190 m north of the junction led to the channel surcharging, water cascading through adjacent woodland and discharging over an embankment into the receiving watercourse on Fox Lane, which was unable to cope and further surcharged, flooding the junction. (p2)</p></div><div class="nugget-popup"><p>The highway junction between Fox Lane and Whitecross experienced flooding; the trash screen and piped watercourse at the Fox Lane junction were identified for monitoring, maintenance and remedial works. [TAB,MUL] (p4)</p></div><div class="nugget-popup"><p>The highway junction between Fox Lane and Whitecross was flooded when a culvert entrance was overwhelmed by cascading water from an adjacent watercourse; the culvert capacity was exceeded and the culvert became overwhelmed by water and debris from a silted/blocked upstream channel, causing water to cascade across adjacent land and through woodland onto the junction. (p13)</p></div><div class="nugget-popup"><p>A watercourse to the north, silted and partially blocked with woody debris, caused water to cascade through the adjacent woodland and overwhelm the culvert adjacent to Fox Lane. The overwhelmed culvert resulted in water flowing across the woodland and contributed to local flooding; heavy catchment rainfall and flows along the Fox Lane watercourse were noted as possible contributing factors. [PAG,MUL] (p14)</p></div><div class="nugget-popup"><p>A watercourse and culvert entrance adjacent to Fox Lane was overwhelmed during the heavy rainfall, contributing to flooding; post&ndash;event the landowner removed obstructions from an obstructed section of watercourse north of Fox Lane. [PAG,MUL] (p15)</p></div><div class="nugget-popup"><p>The report recommends monitoring, maintenance and remedial works to the trash screen and piped watercourse at the Fox Lane junction because these assets were implicated in the surface water flooding that affected the junction and contributed to local property flooding during the investigated events. [TAB,MUL] (p21)</p></div></div></body></div>`)[0];

                var html_dabc21971a0ccf658e8edeedabfc81db = $(`<div id="html_dabc21971a0ccf658e8edeedabfc81db" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Whitecross</h1><div class="nugget-popup"><p>Flooding affected residential properties and gardens along Whitecross. On 4 January 2024 seven private residential properties and four gardens were flooded as surface water cascaded along the Whitecross highway and was unable to discharge through the 900 mm culvert; water entered properties via lower accessways off Whitecross. Garden flooding was partly attributed to the watercourse running along the rear of the properties. Two of the properties flooded internally again on 18 February 2024 following further heavy rainfall. [PAG,MUL] (p2)</p></div><div class="nugget-popup"><p>Residential properties and gardens along Whitecross were flooded; the highway junction between Fox Lane and Whitecross was inundated causing highway and property flooding. [TAB,MUL] (p4)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties within Whitecross that triggered a formal investigation. [MUL] (p9)</p></div><div class="nugget-popup"><p>Surface water running off the Whitecross highway entered lower accessways and flooded properties and gardens; temporary defences (sand bag dams) were breached by the volume and velocity of runoff; garden flooding was also reported from a surcharged rear watercourse though internal flooding from that source did not occur. Inspections and photographs showed internal flooding in properties. [PAG] (p13)</p></div><div class="nugget-popup"><p>A watercourse north of Fox Lane was silted and blocked with woody debris causing water to cascade through the adjacent woodland, overwhelm a culvert adjacent to Fox Lane and flood the highway, property gardens and properties in Whitecross. [PAG,MUL] (p14)</p></div><div class="nugget-popup"><p>Exceptional heavy rainfall on 4th January 2024 and 18th February 2024 caused highway runoff to be unable to drain to a 900 mm culvert, resulting in surcharging and flooding of the highway, adjacent land and properties. A watercourse at the rear of properties breached its banks causing garden flooding. [MUL] (p15)</p></div><div class="nugget-popup"><p>Highway drainage system and associated artificial watercourse along Whitecross were implicated by flooding during the reported events; recommendation to monitor, maintain and carry out remedial works to the highway drainage and artificial watercourse to reduce internal flooding of properties and businesses. [TAB,MUL] (p21)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>7 private residential properties; 4 gardens; 2 properties [PAG,MUL] (p2)</p></div><div class="nugget-popup quant"><p>more than 5 properties (internal flooding) [MUL] (p9)</p></div><div class="nugget-popup quant"><p>7 properties; 0.25 m peak flood level within properties [PAG] (p13)</p></div></div></body></div>`)[0];
