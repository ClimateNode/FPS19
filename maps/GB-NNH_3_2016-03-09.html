                var html_4a52faef2aec6e7e873dd667b63555ae = $(`<div id="html_4a52faef2aec6e7e873dd667b63555ae" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lyveden Brook</h1><div class="nugget-popup"><p>Lyveden Brook was implicated in the event: ordinary watercourse flooding from the brook contributed to flooding of residential areas near its confluence with the River Nene. Upstream of Stoke Doyle Road a severe narrowing at a large tree, a length of barbed wire across the channel and a build&ndash;up of debris were observed, restricting flow and likely exacerbating flooding. Parts of the western developed area drain to public sewers that discharge to the brook, increasing flow into the channel during the event. (p10)</p></div><div class="nugget-popup"><p>On the morning of 9th March 2016 the depth of water in the brook increased by approximately two metres above usual, causing the banks to be overtopped and water to flow across rear gardens of properties on the north and east edge of the Warren Bridge residential estate. Water levels in gardens and the brook subsided in the late afternoon after the rain stopped. (p13)</p></div><div class="nugget-popup"><p>Water levels in the brook rose during the event and contributed to higher garden and upstream water depths. Debris (barbed wire) trapped upstream reduced conveyance and caused the channel to become deeper upstream; the narrow, twisting channel downstream limited flow away to the River Nene, contributing to raised water levels. (p14)</p></div><div class="nugget-popup"><p>Shown with evidence of high water levels; produced overbank and overland flow routes that contributed to schematic flood areas and inundation of nearby rear gardens and properties. Narrowing of the channel and a barbed&ndash;wire obstruction were identified as localised pinch points that increased water levels and localised flooding. [IMG] (p33)</p></div><div class="nugget-popup"><p>A barbed&ndash;wire fence crossing the brook trapped debris after high flows, creating an obstruction that impeded water flow and contributed to flooding of adjacent banks and nearby gardens/properties. [IMG] (p46)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 70 properties flooded internally; over 200 reports of flooding (p10)</p></div><div class="nugget-popup quant"><p>two metres deeper than usual (p13)</p></div></div></body></div>`)[0];
                popup_addf87cd7b73278f2bc80b70f0200707.setContent(html_4a52faef2aec6e7e873dd667b63555ae);

                var html_142279930405f8a0a96d57b16bdb8b8f = $(`<div id="html_142279930405f8a0a96d57b16bdb8b8f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Warren Bridge, Oundle</h1><div class="nugget-popup"><p>Internal flooding of a property at Warren Bridge due to heavy rainfall on a saturated catchment; ordinary watercourses could not convey flows and excess surface water flowed to low points around private property, entering the building. (p7)</p></div><div class="nugget-popup"><p>Internal flooding of a property at Warren Bridge; the property has experienced internal flooding on more than one occasion in the last five years, triggering a formal investigation. [MUL] (p9)</p></div><div class="nugget-popup"><p>Flooding from the overtopped brook affected properties on Warren Bridge on 9th March 2016: 1st property had garden flooded with water coming to within approximately one metre (75mm height difference) from the garage floor; 2nd property had garden flooded, 75&ndash;100mm depth of water in an adjoining garage, seepage of water into the house and water flowed into airbricks; 3rd property experienced flooding of an adjoining garage; 4th property had garden flooded with no impact on the house. (p13)</p></div><div class="nugget-popup"><p>Heavy rainfall on a saturated catchment caused ordinary watercourses to be unable to convey flows, producing excess surface water that flowed over ground to low points and caused flooding at Warren Bridge. (p16)</p></div><div class="nugget-popup"><p>Rear garden of a private property was heavily inundated; muddy brown floodwater covered most of the garden and partially submerged a garden bench, potted plants and other garden features, indicating significant local flooding of the property. [IMG] (p45)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property (p7)</p></div><div class="nugget-popup quant"><p>1 property [MUL] (p9)</p></div><div class="nugget-popup quant"><p>4 properties; 75&ndash;100mm depth in garage; 75mm height difference (p13)</p></div></div></body></div>`)[0];

                var html_af996eb7bc1c02fc84978e5d5253539f = $(`<div id="html_af996eb7bc1c02fc84978e5d5253539f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Stoke Doyle Road, Oundle</h1><div class="nugget-popup"><p>A severe narrowing of the watercourse and a build&ndash;up of debris (including a section of barbed wire fencing across the watercourse) was observed upstream of Stoke Doyle Road; these obstructions were noted during flood investigations and can contribute to ordinary watercourse flooding. [PAG] (p10)</p></div><div class="nugget-popup"><p>Flood&ndash;investigation observations recorded a severe narrowing of Lyveden Brook immediately upstream of Stoke Doyle Road at a large tree, together with a section of barbed&ndash;wire fencing across the channel and a build&ndash;up of debris; downstream of the road the channel is narrow, shallow and meandering. These channel obstructions and constrictions were noted during flood investigations and are relevant to river flooding in the vicinity of Stoke Doyle Road. (p11)</p></div><div class="nugget-popup"><p>Garden flood to a level 25 mm below the threshold of the dwelling; water flowed into airbricks. An industrial pump was used all day to remove water; resident reported that without pumping the house would have flooded internally. [TAB] (p12)</p></div><div class="nugget-popup"><p>Property garden flooded to a depth 25 mm below the internal threshold; floodwater flowed into airbricks. An industrial pump was used all day to remove water; resident reported that without pumping the house would have flooded internally. [PAG] (p13)</p></div><div class="nugget-popup"><p>The culvert/bridge under Stoke Doyle Road was at full capacity with water reportedly reaching the soffit, causing water to become deeper upstream and flow over the road east of the culvert/bridge. A property on Stoke Doyle Road had flood water in its garden that reached 25 mm below the threshold level, flowed into airbricks; an industrial pump was used all day to remove water and the resident reported the house would have flooded internally without it. [PAG] (p14)</p></div><div class="nugget-popup"><p>A narrow, twisting watercourse downstream of Stoke Doyle Road constrained flow toward the River Nene during the 9 March 2016 event, preventing water from flowing away quickly and contributing to local drainage/flooding issues. [PAG] (p15)</p></div><div class="nugget-popup"><p>The bridge/culvert on Stoke Doyle Road was the subject of initial investigations into its type and capacity because of concerns about its ability to convey flood flows during the event. (p16)</p></div><div class="nugget-popup"><p>A bridge/culvert at Stoke Doyle Road (star 05) is shown interacting with flow; the crossing/culvert is identified as a critical location where constriction could cause localised flooding of the carriageway and adjacent areas. [IMG] (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>25 mm below threshold level (garden) on 09/03/16; industrial pump used all day. [TAB] (p12)</p></div><div class="nugget-popup quant"><p>1 property; 25 mm below threshold level [PAG] (p13)</p></div><div class="nugget-popup quant"><p>25 mm below threshold level [PAG] (p14)</p></div></div></body></div>`)[0];

                var html_548edd0826b762b8e2d02d5ce3313bea = $(`<div id="html_548edd0826b762b8e2d02d5ce3313bea" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Oundle</h1><div class="nugget-popup"><p>Flood incident at Warren Bridge in Oundle on 9 March 2016 caused internal flooding of at least one property; heavy rainfall on a saturated catchment led to ordinary watercourses and surface water runoff flowing to low points around private property. (p7)</p></div><div class="nugget-popup"><p>Town location of the Warren Bridge flood incident on 9 March 2016; at least one property in Oundle experienced internal flooding associated with that incident. [PAG] (p9)</p></div><div class="nugget-popup"><p>The town and its western developed area lie within the Lyveden Brook catchment. During the 9 March 2016 event ordinary watercourse (river) flooding and surface water runoff contributed to reported flooding affecting properties in the catchment and residential developments near where Lyveden Brook meets the River Nene. (p10)</p></div><div class="nugget-popup"><p>Flooding occurred in Oundle (at Warren Bridge) when heavy rainfall on a saturated catchment caused ordinary watercourses to be unable to convey rainwater, resulting in excess surface water flowing to low points around private property. [PAG] (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property (p7)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p9)</p></div></div></body></div>`)[0];
