                var html_d2a35a1dbe82d97fb65295b9b0e920c0 = $(`<div id="html_d2a35a1dbe82d97fb65295b9b0e920c0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>The Street, Coney Weston</h1><div class="nugget-popup"><p>Internal flooding of a property (domestic or business) on The Street, experienced on more than one occasion. (p2)</p></div><div class="nugget-popup"><p>Repeated highway flooding to depths of approximately 200&ndash;300mm over a distance exceeding 30m. Ditches adjacent to the highway were at or over capacity and overflowed onto the highway from overland runoff from adjacent fields, with surface water encroaching into private gardens and contributing to property flooding. [IMG] (p3)</p></div><div class="nugget-popup"><p>Ground&ndash;floor flooding of multiple properties (including at least one property with ground&ndash;floor sleeping accommodation) to a depth of 100 mm with damage to internal furnishings and furniture. Extensive flooding of private driveways, gardens and outbuildings with damage to stored items. Highway rendered impassable to pedestrians and vehicles for several days, with cars and small vans requiring towing after attempting to drive through deep water. (p4)</p></div><div class="nugget-popup"><p>Highway gullies along The Street were reported to have been surcharging during the storm event, resulting in water flowing down the highway and contributing to overland flow from adjacent greenfield areas. [TAB] (p5)</p></div><div class="nugget-popup"><p>Surface water from a nearby ordinary watercourse/blocked highway drainage affected The Street, prompting a capital scheme to improve highways drainage, regrade and improve roadside ditches, and to cleanse and survey the highways drainage system; property&ndash;level resilience options and funding are to be explored. (p6)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property (p2)</p></div><div class="nugget-popup quant"><p>200&ndash;300mm depth; &gt;30m length [IMG] (p3)</p></div><div class="nugget-popup quant"><p>100 mm; at least one property with ground&ndash;floor sleeping accommodation (p4)</p></div></div></body></div>`)[0];
