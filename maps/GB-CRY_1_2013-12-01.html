                var html_4df59b46a1299097eb01152b642c84f0 = $(`<div id="html_4df59b46a1299097eb01152b642c84f0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bourne Park</h1><div class="nugget-popup"><p>High flows in the Caterham Bourne, additional groundwater emergence and surcharging sewers caused Bourne Park to flood. A temporary flood storage area was created in the park to hold the flood waters. (p6)</p></div><div class="nugget-popup"><p>Rising groundwater entered the foul sewer network causing manholes to overflow and surcharge raw sewage both internally and externally, particularly around Bourne Park and upstream in Whyteleafe. [TAB] (p23)</p></div><div class="nugget-popup"><p>Foul sewer surcharging led to foul (sewage) flooding across the park; aerial imagery documents widespread foul flooding of the open park area on 14 February 2014. A culvert in Bourne Park became silted and blocked following the flood (photo July 2014). [IMG,MUL] (p29)</p></div><div class="nugget-popup"><p>Bourne Park had demountable flood barriers installed to control emerging groundwater associated with the flooding incident. [TAB] (p55)</p></div></div></body></div>`)[0];

                var html_89d44f2acd23aae121b3106423d70d63 = $(`<div id="html_89d44f2acd23aae121b3106423d70d63" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>UK</h1><div class="nugget-popup"><p>Prolonged, exceptional rainfall across December 2013&ndash;January 2014 (notably December 2013 and January 2014) led to widespread flood conditions in parts of the UK, with particularly intense impacts across southern England; the report cites this two&ndash;month period as the wettest on record in parts of southern England and Kent. [IMG] (p20)</p></div></div></body></div>`)[0];

                var html_5cabb2c704c00e1648982ddbad24683a = $(`<div id="html_5cabb2c704c00e1648982ddbad24683a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Purley Cross</h1><div class="nugget-popup"><p>Floodwater was pumped from Dale Road into an open section of the bourne north of the railway. A pedestrian underpass was deliberately flooded to divert floodwaters away from properties. (p7)</p></div><div class="nugget-popup"><p>Served as the downstream discharge/receiving location for pumped floodwater from the Kenley WTW emergency works; pipes were extended to this open section north of the railway line to relieve the WTW site. (p31)</p></div><div class="nugget-popup"><p>The pedestrian/road underpass at Purley Cross was deliberately allowed to inundate and was cordoned off, used temporarily as a balancing pond to store floodwater and reduce downstream flow toward Purley Oaks. [IMG] (p35)</p></div></div></body></div>`)[0];

                var html_544cec29dab0ccd12eadad572f2973ff = $(`<div id="html_544cec29dab0ccd12eadad572f2973ff" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Croydon</h1><div class="nugget-popup"><p>Significant flooding around the route of the Caterham Bourne (Kenley and Purley). Residential properties were affected at Bourne Park Close, Brighton Road, Dale Road, Foxley Hill Road, Godstone Road, Lansdown Road and Purley Park Road. Bourne Park flooded (temporary flood storage created) and the Bourne View Flood Storage Area was used though some issues were identified. [MUL] (p6)</p></div><div class="nugget-popup"><p>Council coordinated a multi&ndash;agency response, mobilised pumps and temporary defences to protect communities; number of flooded properties was reported as low due to early mobilisation; active short&ndash; and long&ndash;term recovery and mitigation planning (clearance, dredging/de&ndash;silting, inspection, investigating Dale Road, and catchment&ndash;scale alleviation/attenuation measures). (p8)</p></div><div class="nugget-popup"><p>Significant flooding across the London Borough of Croydon between December 2013 and January 2014. Flooding resulted from high groundwater (which drove the Caterham Bourne), foul sewer flooding due to groundwater ingress and emergency pumping stressing the sewer system, and surface water flooding from heavy rainfall and saturated soils. Croydon Council declared a Major Incident on 6 February 2014 and implemented a large pumping operation to protect homes, businesses and critical infrastructure. (p9)</p></div><div class="nugget-popup"><p>The borough experienced extreme rainfall in December 2013 and January 2014 which led to flooding issues investigated by the Council (Croydon Borough&ndash;wide flood investigation covering impacts attributed to surface water/urban runoff and watercourse surcharging). [TAB,PAG] (p19)</p></div><div class="nugget-popup"><p>The bourne moves into the more urbanised parts of Croydon; exceptionally high groundwater in December 2013&ndash;January 2014 led to high fluvial flows, ingress of groundwater into the foul sewer network, saturated soils and extreme pressure on surface water drainage, contributing to urban flooding in Croydon. [PAG] (p21)</p></div><div class="nugget-popup"><p>Widespread high groundwater led to basement and garden flooding across the borough. Roads flooded due to bourne water surcharging from culverts (e.g. Dale Road/Godstone Road) and relief pumping; a row of commercial businesses between Kenley Hotel and Westbourne Florist experienced internal flooding as the road filled with water. Emergency pumping and flood protection measures were mobilised to protect properties. [TAB,PAG,MUL] (p26)</p></div><div class="nugget-popup"><p>Areas within the London Borough of Croydon along the Caterham Bourne were investigated because they experienced flooding. Gardens in Bourne Park Close were reported flooded with foul sewage (photograph captioned July 2014), prompting remedial action (new fencing) following the event. [PAG,IMG] (p28)</p></div><div class="nugget-popup"><p>Experienced widespread flooding in December 2013&ndash;January 2014; early mobilisation of pumps and use of temporary attenuation areas prevented significant property flooding; multi&ndash;agency response and a major incident declaration were used to protect communities. (p44)</p></div><div class="nugget-popup"><p>Communities in Croydon were threatened by flooding associated with the Caterham Bourne and combined sources of surface water/urban flooding; mitigation options and maintenance programmes are proposed to reduce future threats. (p46)</p></div></div></body></div>`)[0];

                var html_0679910fa8772a17f48c8d61bc3d7461 = $(`<div id="html_0679910fa8772a17f48c8d61bc3d7461" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Dale Road, Purley</h1><div class="nugget-popup"><p>Residential properties on Dale Road were impacted by flooding during the Caterham Bourne event driven by exceptionally high groundwater, with combined surface water/sewer influences possible. (p6)</p></div><div class="nugget-popup"><p>Deepest flooding of approximately 1 metre occurred at this location; properties were inundated and residents were evacuated. Intensive pumping operations were required in the area. (p7)</p></div><div class="nugget-popup"><p>Experienced flood problems associated with the bourne rising; recovery and restoration actions were identified including channel and culvert clearance, dredging and de&ndash;silting, more regular maintenance/inspection, and working with Thames Water on asset maintenance. Authorities planned investigations into influences on the flooding at Dale Road. (p8)</p></div><div class="nugget-popup"><p>Road flooding caused by a surcharging Bourne culvert; relief pumping was carried out. [TAB,MUL] (p26)</p></div><div class="nugget-popup"><p>Street and adjacent properties were inundated; emergency responders constructed sandbag walls, used boats to evacuate residents and water was pumped out of the street during the event. [IMG,PAG] (p34)</p></div><div class="nugget-popup"><p>Road and adjacent areas were flooded, prompting response officers to build sandbag walls and to pump water out; pumped water was diverted to a short open section of the Bourne north of the railway line. [IMG,PAG] (p35)</p></div><div class="nugget-popup"><p>Dale Road experienced flooding related to an undersized/managed culvert; the investigation recommends clarifying asset ownership and assessing downstream implications of changing the culvert size to reduce future flood impact. [TAB] (p50)</p></div><div class="nugget-popup"><p>Road and adjacent residential buildings remained flooded; evacuations carried out (Liberty Court and Nicholas Court); relief measures (pumps/HVPs and sandbags) used and emergency services operated to manage water levels. [TAB,MUL] (p54)</p></div><div class="nugget-popup"><p>Dale Road remained flooded across the response period: pumping at Dale Road was operating at capacity; the Army laid sandbags; water levels were significantly reduced by 17 February but later increased slightly and remained stable. Tesco Underpass became full. Environment Agency pumps later replaced LFB HVPs at Dale Road. [TAB,PAG,MUL] (p55)</p></div><div class="nugget-popup"><p>Site experienced flooding; an investigation continued into the exact cause and water levels at the site were reported to be falling during the post&ndash;event response. [TAB,PAG] (p56)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 metre flood depth; 56 properties evacuated (Dale Road and Foxley Hill Road) (p7)</p></div><div class="nugget-popup quant"><p>8 LFB appliances; three HVPs [TAB,MUL] (p54)</p></div><div class="nugget-popup quant"><p>8 LFB appliances on site [TAB,PAG,MUL] (p55)</p></div></div></body></div>`)[0];

                var html_24fe2935f420461ae217d948f5563aa5 = $(`<div id="html_24fe2935f420461ae217d948f5563aa5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kenley</h1><div class="nugget-popup"><p>Significant flooding from the groundwater&ndash;fed Caterham Bourne affected Kenley. The bourne rose along its route through Whyteleafe into Kenley, travelling through a mixture of culverts and open ditches and causing local inundation along the A22 corridor. (p6)</p></div><div class="nugget-popup"><p>Significant flooding was experienced in the Kenley and Purley area as the bourne flowed through these locations prior to entering Croydon. (p9)</p></div><div class="nugget-popup"><p>Areas in Kenley were affected by overflow from the Caterham Bourne: open sections produced fluvial&ndash;type flooding that overwhelmed banks and inundated local assets, specifically the Kenley Cricket ground. Insufficient culvert capacity and surcharge of manholes led to upstream backing up and overflows in the Kenley area. Debris&ndash;blocked trash screens contributed to local backups. [TAB] (p22)</p></div><div class="nugget-popup"><p>Flooding from the bourne in February 2014 threatened Kenley, with reports of potential for catastrophic flooding in the Purley and Kenley area as high flows caused the culverted bourne to surcharge. [IMG] (p31)</p></div><div class="nugget-popup"><p>Floodwaters reached the main building at the water treatment works (WTW); water was pumped from Kenley WTW as part of response and temporary defences were erected to protect infrastructure and pipes leading off down the A22 (photographed February 2014). [IMG,MUL] (p32)</p></div><div class="nugget-popup"><p>Kenley waterworks was identified as at risk: a robust evacuation plan was developed for when trigger levels were reached at the Kenley waterworks, including construction of temporary flood storage/assembly areas to protect the water treatment works. [MUL] (p39)</p></div><div class="nugget-popup"><p>Kenley Water Treatment Works (WTW) at Godstone Road was threatened with shutdown due to inundation from the Bourne and rising groundwater; boreholes at Kenley required increased abstraction to try to reduce groundwater levels. [PAG,MUL] (p41)</p></div><div class="nugget-popup"><p>The Kenley water treatment works (Godstone Road) was inundated/threatened by flooding from the Bourne, risking shutdown; sandbags and pumps were deployed around key assets and pumps installed to remove water; contingency plans were made to supply customers from other works. The London Fire Brigade was notified on 6 February 2014 that rising flood water in the Kenley area threatened the integrity of the WTW. [PAG,MUL] (p42)</p></div><div class="nugget-popup"><p>Rising floodwater in the Kenley area threatened the integrity of the Kenley Water Treatment Works, prompting high&ndash;volume pump deployments, sustained LFB flood management activities and a dedicated police presence; a critical situation at the Kenley Water Treatment Works required temporary transfer of incident management. [MUL] (p43)</p></div><div class="nugget-popup"><p>The Kenley water treatment works (WTW) was identified as being at flood risk; the report recommends developing protection measures for the WTW that do not increase flood risk elsewhere and to record WTW failure on the council's risk register. [TAB] (p50)</p></div><div class="nugget-popup"><p>Kenley WTW had surcharging issues; measures including sandbags and demountable flood defences were put in place and the works were reported as stable under ongoing monitoring. [TAB,MUL] (p54)</p></div><div class="nugget-popup"><p>Water levels at Kenley WTW rose above critical level during heavy rainfall on 14 February 2014; pumping operated at maximum capacity and significant groundwater pumping was undertaken to lower the water table. LFB high&ndash;volume pumps at Kenley WTW were later replaced by Environment Agency pumps. Status was later recorded as 'Green'. [TAB,MUL] (p55)</p></div></div></body></div>`)[0];
                popup_7c3951de1f45d68d016617bbf8ea8bfd.setContent(html_24fe2935f420461ae217d948f5563aa5);

                var html_03308a1544346830749883b8bf558df2 = $(`<div id="html_03308a1544346830749883b8bf558df2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Purley</h1><div class="nugget-popup"><p>Areas of Kenley and Purley around the route of the Caterham Bourne experienced significant flooding driven by exceptionally high groundwater levels and combined surface&ndash;water/sewer influences; residential properties in these areas were affected. [MUL] (p6)</p></div><div class="nugget-popup"><p>The Caterham Bourne flowed into Croydon along the A22 towards Purley and the area experienced significant flooding during the event. (p9)</p></div><div class="nugget-popup"><p>The EA issued a Groundwater Flood Alert for Purley on 8 January 2014 following rapid rises in groundwater in December 2013&ndash;January 2014. Rising groundwater caused emergence of springs and flooding of gardens and basements and also influenced sewer ingress and pressure on surface water drainage. [MUL] (p21)</p></div><div class="nugget-popup"><p>Area at risk and a recipient area for pumped floodwater (pumped to Purley Cross/open section north of the railway) as part of the emergency response; report states there was potential for catastrophic flooding in Purley if the Kenley WTW shut down due to the bourne surcharging. (p31)</p></div><div class="nugget-popup"><p>The Kenley/Purley area experienced flooding that required emergency response from police and other services and local flood&ndash;management activities to minimise property damage. (p43)</p></div><div class="nugget-popup"><p>Purley underpass flooded and was used as a temporary attenuation area during the December 2013&ndash;January 2014 event to prevent property flooding. (p44)</p></div><div class="nugget-popup"><p>Localised flooding in the Purley area and on the railway; high water volumes at nearby Purley Oaks Pond led to pump failures and later deployment of pumps to reduce levels. [TAB,MUL] (p54)</p></div><div class="nugget-popup"><p>Following the heavy rainfall on 14 February 2014, properties in Purley were affected by flooding and evacuations: nine properties were evacuated. [TAB] (p55)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>47,000 homes (drinking water supply at risk if Kenley WTW shut down) (p31)</p></div><div class="nugget-popup quant"><p>3 pumps to be installed; 2 pumps working at full capacity [TAB,MUL] (p54)</p></div><div class="nugget-popup quant"><p>9 properties evacuated [TAB] (p55)</p></div></div></body></div>`)[0];

                var html_b83bdff9ab53d265c4311d4beb4b401e = $(`<div id="html_b83bdff9ab53d265c4311d4beb4b401e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Woldingham</h1><div class="nugget-popup"><p>Exceptional rainfall caused groundwater to rise and emerge in Woldingham, producing flow pathways that contributed to the Caterham Bourne; very high groundwater levels were recorded. [MUL] (p6)</p></div><div class="nugget-popup"><p>Sources of the Caterham Bourne rose above ground in Woldingham and Caterham, causing local flooding in these areas as the bourne flowed prior to entering Croydon. (p9)</p></div><div class="nugget-popup"><p>Groundwater emergence and flow across fields and onto/across a road, producing visible standing water and surface flooding paths across agricultural land adjacent to the road; flow paths continued into neighbouring fields. [IMG] (p18)</p></div><div class="nugget-popup"><p>Rapid rise in groundwater recorded at the Woldingham observation borehole: levels rose sharply between late December 2013 and late January 2014, approaching ground level and contributing to sustained flow in the upper reaches of the Caterham Bourne through early 2014. [PAG,IMG] (p25)</p></div><div class="nugget-popup"><p>Fields alongside Woldingham Road experienced emerging water in January&ndash;February 2014; Surrey County Council, TDC and the Army constructed a series of emergency storage areas in these fields which were later formalised into major attenuation structures to control water discharged downstream. (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>groundwater levels increased by over 22 metres between late December 2013 and late January 2014 [MUL] (p6)</p></div><div class="nugget-popup quant"><p>approximately 22.7 m rise (≈26%) between 23 December 2013 and 23 January 2014 [PAG,IMG] (p25)</p></div></div></body></div>`)[0];

                var html_2b4edaed9790926b9ab919898a2041d6 = $(`<div id="html_2b4edaed9790926b9ab919898a2041d6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Whyteleafe</h1><div class="nugget-popup"><p>High groundwater caused sources of the Caterham Bourne to rise above ground in Woldingham (and Caterham), producing flows through Woldingham and Whyteleafe that contributed to downstream flooding into Croydon. (p9)</p></div><div class="nugget-popup"><p>Emergency works were carried out on a demolition site where the culverted Bourne had been damaged; a 24&ndash;hour highways/flood crew operated in Whyteleafe during the event and community flood surgeries were held to keep residents informed. (p40)</p></div><div class="nugget-popup"><p>Flooding led to evacuations of properties in Whyteleafe. [TAB] (p54)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>6 properties [TAB] (p54)</p></div></div></body></div>`)[0];

                var html_6ed6b128dbc2dd907423177eb009ddac = $(`<div id="html_6ed6b128dbc2dd907423177eb009ddac" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Purley Oaks</h1><div class="nugget-popup"><p>Prolonged rise in groundwater levels in the lower catchment consistent with groundwater flooding; elevated groundwater levels remained high through March 2014. (p24)</p></div><div class="nugget-popup"><p>Target of downstream flows from upstream pumping and natural flow in the Bourne; measures upstream (pumping and use of the Purley Cross underpass as a balancing pond) were implemented to alleviate flows toward Purley Oaks. [IMG] (p35)</p></div><div class="nugget-popup"><p>Flooding from the balancing pond led to shallow inundation of the highway in the Purley Oaks area on 14 February 2014; the event triggered a multi&ndash;agency emergency response and local temporary defences. [IMG,MUL] (p36)</p></div><div class="nugget-popup"><p>Floodwater was pumped from the balancing pond at Purley Oaks into a separate drainage system as part of LFB operations to remove floodwater and reduce local flood risk. (p43)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>water level increased by approximately 9.2 m (19%) over a 63&ndash;day period (p24)</p></div><div class="nugget-popup quant"><p>one occasion (14 February 2014) [IMG,MUL] (p36)</p></div></div></body></div>`)[0];

                var html_2a38a6521298de343fc66f2e3e69a8df = $(`<div id="html_2a38a6521298de343fc66f2e3e69a8df" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kenley Treatment Works</h1><div class="nugget-popup"><p>Kenley Water Treatment Works was at significant risk from Caterham Bourne flows and rising groundwater; relief efforts concentrated on preventing high floodwaters reaching the works to avoid a shutdown (which would have had wider consequences). High&ndash;volume pumping and other measures were deployed to protect the works; the situation became critical during the incident and was a focus of multi&ndash;agency response. [MUL] (p7)</p></div><div class="nugget-popup"><p>The Waterworks was the focus of protection efforts during the flood: defences were erected and pumps installed to protect the asset; Thames Water assisted and attended sites of foul (sewer) flooding associated with the event. (p8)</p></div><div class="nugget-popup"><p>Heavy and prolonged rainfall threatened the Kenley Water Treatment Works; significant pumping was required to prevent its closure and to avoid property flooding. This pumping increased volumes entering the sewer system as routes were sought to remove water from the risk area. [TAB] (p23)</p></div><div class="nugget-popup"><p>High flows in the bourne caused the culverted watercourse to surcharge and flood the water treatment works in February 2014; floodwaters reached the main building and the works were threatened with shutdown. Emergency response included erection of demountable flood defences, sandbags and high&ndash;volume pumps, and pumping floodwater away from the site along Godstone Road to an open section at Purley Cross. Pumping was impeded by a wall constructed since the 2001 flood. [IMG] (p31)</p></div><div class="nugget-popup"><p>Water levels at the Waterworks reached critical levels on 14 February 2014, triggering the temporary commencement of the evacuation plan. [IMG] (p34)</p></div><div class="nugget-popup"><p>Water was pumped from Kenley WTW into an open section of the bourne north of the railway as an emergency management measure; this pumping directed water into the watercourse to help relieve downstream pressure during the flood response. [IMG] (p35)</p></div><div class="nugget-popup"><p>Rising floodwater in the Kenley area threatened to compromise the integrity of the Kenley Water Treatment Works. High&ndash;volume pumps were deployed to remove floodwater from the bourne around the WTW to a point downstream with greater capacity; water was also pumped from the balancing pond at Purley Oaks into a separate drainage system. Flood&ndash;fighting operations were maintained 24 hours a day to protect the WTW and local communities. (p43)</p></div><div class="nugget-popup"><p>Kenley Water Treatment Works experienced surcharging issues and flood risk; sandbags and demountable flood defences were provided and the site was monitored as 'stable' during the event. [TAB,MUL] (p54)</p></div><div class="nugget-popup"><p>Water levels rose above critical on 14 February causing pumping to run at maximum capacity; significant groundwater pumping was undertaken to lower the water table. Control was escalated to London Gold and evacuation plans (for up to 220 properties) were drawn up but later reversed. Environment Agency pumps later replaced LFB high&ndash;volume pumps and the site status was later recorded as 'Green'. [TAB,MUL] (p55)</p></div><div class="nugget-popup"><p>Flood water management required on site: pumping operations were deployed and coordinated, site status recorded as 'Green', and water levels reported stable during monitoring. [TAB,PAG] (p56)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 47,000 people; hundreds of properties [MUL] (p7)</p></div><div class="nugget-popup quant"><p>47,000 homes; 3 high&ndash;volume pumps [IMG] (p31)</p></div><div class="nugget-popup quant"><p>220 properties (evacuation planned); 9 properties evacuated [TAB,MUL] (p55)</p></div><div class="nugget-popup quant"><p>2 pumps [TAB,PAG] (p56)</p></div></div></body></div>`)[0];
