ollowing Gypsy Lane, causing surface&ndash;water flooding of the street. (p19)</p></div></div></body></div>`)[0];

                var html_1ce08b461e821b020f73893cac25219a = $(`<div id="html_1ce08b461e821b020f73893cac25219a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Gipsy Lane, Knebworth</h1><div class="nugget-popup"><p>Gypsy Lane is identified on the map bounding box near the blue&ndash;shaded flood area in southwest Knebworth; the map indicates streets in this vicinity were affected by flooding during the event. [IMG] (p8)</p></div><div class="nugget-popup"><p>Surface water runoff from adjacent farmland flooded the lane; water then flowed from the lane into rear gardens of Orchard Way and entered properties through rear doors. (p10)</p></div><div class="nugget-popup"><p>Runoff was funnelled toward the field adjacent to Gypsy Lane; highway drainage (including the single road gully at the rear of Orchard Way) was overwhelmed and unable to cope with the volume of water, contributing to local flooding. (p11)</p></div><div class="nugget-popup"><p>Highway drainage in Gypsy Lane was implicated in the flooding response; recommendation to CCTV&ndash;survey the drainage and remove blockages to restore performance following the flood event. [TAB] (p16)</p></div><div class="nugget-popup"><p>Surface water runoff entered Gypsy Lane during the event; drainage&ndash;related remediation carried out including cleaning soakaways and gullies, clearing the connection to Orchard Way, and re&ndash;digging ditches. (p18)</p></div><div class="nugget-popup"><p>Surface water runoff entered Gypsy Lane during the event, causing surface&ndash;water flooding of the street and contributing runoff downstream. (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 road gully (p11)</p></div></div></body></div>`)[0];

                var html_741f54677168abc24813491394d0368b = $(`<div id="html_741f54677168abc24813491394d0368b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Knebworth</h1><div class="nugget-popup"><p>Rural field inundated with standing water covering a significant area and partially submerging a footpath; a residential street was flooded across its full width with water extending into driveways and yards, surrounding parked cars and disrupting access to properties. (p1)</p></div><div class="nugget-popup"><p>Surface water runoff from saturated farmland overflowed onto an adjacent road and subsequently flooded properties. Eighteen properties were flooded internally and two properties suffered external flooding; floodwater affected properties in a further two streets. (p5)</p></div><div class="nugget-popup"><p>The western part of Knebworth (site east of Gypsy Lane) was affected by flooding on 7 February 2014, which resulted in internal flooding of residential properties in Orchard Way and Broom Grove. (p7)</p></div><div class="nugget-popup"><p>Southwestern part of Knebworth (near Park Lane and the railway line) was flooded. The mapped flood&ndash;affected area (red circle and blue shading) covers land west of the main settlement including areas adjacent to the Recreation Ground and nearby residential/public areas. [IMG] (p8)</p></div><div class="nugget-popup"><p>Parts of Knebworth (notably Orchard Way and Broom Grove) experienced surface water flooding affecting roads and external property areas and causing internal property flooding on 7 February 2014. [TAB,MUL] (p9)</p></div><div class="nugget-popup"><p>Heavy rainfall on saturated ground produced surface water runoff and overland flow across the catchment that flooded local streets and residential properties in the Knebworth area (flow route described from Gypsy Lane into Orchard Way and Broom Grove). (p10)</p></div><div class="nugget-popup"><p>Knebworth experienced a flooding event that prompted a Section 19 flood investigation by the Lead Local Flood Authority. (p13)</p></div><div class="nugget-popup"><p>Properties in Knebworth experienced internal flooding during the 2013&ndash;14 period and the area was the subject of a Section 19 investigation following the flood event on 7 February 2014. (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>18 properties; 2 properties; 2 streets (p5)</p></div><div class="nugget-popup quant"><p>20 properties flooded; 18 properties flooded internally (p10)</p></div></div></body></div>`)[0];
