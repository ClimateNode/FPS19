                var html_4ff5a35b34cf4562cd3660e891a5263e = $(`<div id="html_4ff5a35b34cf4562cd3660e891a5263e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Thornton College</h1><div class="nugget-popup"><p>Watercourse breach and converging overland flows (including from culverted and ordinary watercourses) led to inundation of properties clustered near Home Farm and the College. Flow routes from multiple breach/flow points directed water towards these buildings, causing internal and external flooding of properties and surrounding land; floodwaters later receded. [IMG] (p32)</p></div><div class="nugget-popup"><p>Flood water from the watercourse and surrounding school fields flowed onto playing fields and hardstanding and progressed to building thresholds, causing internal flooding and damage to carpets and floor tiles. [PAG] (p35)</p></div><div class="nugget-popup"><p>Floodwater from the watercourse and surrounding school fields inundated playing fields and areas of hardstanding and progressed to building thresholds, causing internal flooding in college buildings with damage to carpets and tiles and requiring clean&ndash;up/repairs. (p36)</p></div><div class="nugget-popup"><p>Flooding was observed around the school fields; exceedance of the School Fields culvert (theoretical capacity similar to estimated peak flow) was identified as a contributing factor to the flooding around the school fields. [IMG] (p38)</p></div><div class="nugget-popup"><p>The culvert at School Fields had limited conveyance and was overtopped, contributing to water backing up and overtopping of the watercourse at this location during the event. [TAB] (p39)</p></div><div class="nugget-popup"><p>Final culvert at Thornton College was on the watercourse route; overtopping and flows led to internal flooding at the College. (p57)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least seven residential properties (p57)</p></div></div></body></div>`)[0];

                var html_3ced222b6e2149cf6c3274d150b014f1 = $(`<div id="html_3ced222b6e2149cf6c3274d150b014f1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Thornborough Mill</h1><div class="nugget-popup"><p>The Thornborough Mill river&ndash;level gauge on the Great Ouse recorded elevated river levels following a series of November&ndash;December events. Levels rose on 22 December after rainfall on 21 December and then rose sharply in response to the 23 December storm, peaking shortly after the rainfall peaks and remaining elevated for an extended period (showing a lagged catchment response). [IMG,MUL] (p28)</p></div></div></body></div>`)[0];

                var html_47341d218c54a7ba9a3a23e7030d41f9 = $(`<div id="html_47341d218c54a7ba9a3a23e7030d41f9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Crossbridge</h1><div class="nugget-popup"><p>The Crossbridge area (approximately 1 km west of Thornton village) was affected by flooding driven by watercourse breaches and overland flow during the event. (p32)</p></div><div class="nugget-popup"><p>The watercourse draining fields around Crossbridge overtopped and spilled onto overland flow paths; overland/converged flows moved downstream toward Crossbridge Farm and cottages, resulting in flooding of properties and land in the Crossbridge area. [IMG,PAG] (p33)</p></div><div class="nugget-popup"><p>A property in the Crossbridge area (location 8) reported flood water seeping up through the floor; the property was surrounded by surface water from fields and roads and by overflows from the nearby watercourse. [PAG] (p34)</p></div><div class="nugget-popup"><p>Internal flooding reached the ground&ndash;floor of at least one property, damaging carpets and furniture and requiring a full clean&ndash;up. Outbuildings at another nearby property experienced flooding that necessitated removal of carpets (did not affect residential parts). (p37)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property experienced seepage through the floor (location 8) [PAG] (p34)</p></div><div class="nugget-popup quant"><p>at least one property flooded internally; internal flood depth 20mm; external water depths up to 50mm (p37)</p></div></div></body></div>`)[0];

                var html_39fbce4f24ef713cbde0f67700919138 = $(`<div id="html_39fbce4f24ef713cbde0f67700919138" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>College Lane, Thornton</h1><div class="nugget-popup"><p>Overtopping of the local watercourse in the village with an overland flow route that ran down College Lane (Location 2), carrying floodwater from the village along the lane during the event. [IMG] (p20)</p></div><div class="nugget-popup"><p>The channel is open adjacent to College Lane and water came down from the village onto College Lane (documented as location 2), causing flooding of the lane during the event. [PAG] (p33)</p></div><div class="nugget-popup"><p>Overflow from the nearby watercourse and converging overland flows travelled westwards along College Lane, inundating the lane surface, pooling at gates and impeding access; overland flow from rear fields at this location also caused internal flooding to properties on the main road. [PAG,IMG] (p35)</p></div><div class="nugget-popup"><p>Sediment deposits from the flood at the junction opposite this location created a hazard to traffic; the deposits were reported and later cleared (Feb 2021). (p37)</p></div><div class="nugget-popup"><p>Culvert overtopping and overland flows opened onto College Lane; road damage reported (potholes and large sediment deposits) and flows along the lane contributed to internal flooding of properties on the main village road. (p57)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 overtopping location (location 2) [PAG] (p33)</p></div><div class="nugget-popup quant"><p>20 mm internal flooding [PAG,IMG] (p35)</p></div></div></body></div>`)[0];

                var html_b5adaf110b4f47510f5bb3768366d833 = $(`<div id="html_b5adaf110b4f47510f5bb3768366d833" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Buckinghamshire</h1><div class="nugget-popup"><p>Flooding affected roads and properties in Thornton from surface water/ordinary watercourse on 23/12/2020; the Environment Agency issued a Flood Warning for the River Great Ouse and Padbury Brook on 23/12/2020 affecting the Great Ouse floodplain, and Buckinghamshire Council disseminated the warning via Twitter at 20:58. [TAB] (p31)</p></div></div></body></div>`)[0];

            var icon_59b367985689493f36cfe0e8fdf0dfdc = L.AwesomeMarkers.icon(

        var popup_205c23ed50c72bd6b84008ab5a2b4160 = L.popup({});

        
            
                var html_e4e4d381dc7c455f7d6ea43283cc25ef = $(`<div id="html_e4e4d381dc7c455f7d6ea43283cc25ef" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Thornton</h1><div class="nugget-popup"><p>During the 23 December 2020 storm the catchment was very sensitive due to saturated soils, and flows in the watercourses through the village were higher than normal (event rarity approx. 10&ndash;50 years). The report also notes few recorded historic flooding events affecting Thornton in 1917 and 2011. [MUL] (p5)</p></div><div class="nugget-popup"><p>Extreme rainfall and overtopping of local watercourses caused overland flow and channel overflow through the village, resulting in confirmed internal flooding of residential properties, resident displacement, loss of possessions and negative mental and physical health impacts. Channel edges showed slumping and erosion around culvert headwalls; lack of safe relief flow routes forced water onto roads. A culvert on Nash Road was later cleared on 5 February 2021. (p6)</p></div><div class="nugget-popup"><p>During the 23 December 2020 event the local watercourse overtopped its channel and forced water onto roads. Site inspection (June&ndash;July 2021) showed channel&ndash;edge slumping and erosion around culvert headwalls consistent with turbulent high flows and overtopping; lack of safe relief flow routes resulted in road inundation and properties being identified as at&ndash;risk of internal/external flooding. [TAB] (p7)</p></div><div class="nugget-popup"><p>Internal flooding to properties in the village, with at least seven properties experiencing internal flooding during the event. (p12)</p></div><div class="nugget-popup"><p>A flooding incident in Thornton was the subject of the Section 19 investigation. The report focused on understanding flood sources, pathways and receptors and the impacts on the community and local drainage infrastructure, using RoFSW/Flood Map for Planning, LiDAR, photographs, rainfall data, residents' questionnaires and information on drainage infrastructure. (p13)</p></div><div class="nugget-popup"><p>The unnamed ordinary watercourse that runs alongside the main road overtopped during the event, with runoff from the surrounding hills and fields flowing into the village. The watercourse is culverted at several points through Thornton and received highway drainage; overtopping and concentrated flows affected the village carriageway and low&ndash;lying areas adjacent to the watercourse. [PAG,IMG] (p17)</p></div><div class="nugget-popup"><p>Overland flow developed along the main road in the village during the event; an overland flow path and overtopping of an ordinary watercourse were reported in Thornton village (including location 2). The Coach Houses courtyard is noted as a point of interest exposed to overland flow. [PAG,IMG] (p19)</p></div><div class="nugget-popup"><p>During the event on 23rd December 2020 surface water formed an overland flow path down the village main road. A local ordinary watercourse overtopped in the village (location 2) and water flowed down College Lane; the Coach Houses courtyard was inundated. Roads and village property entrances were affected by the overland flow and overtopping. [PAG,IMG] (p21)</p></div><div class="nugget-popup"><p>The road acted as the flow pathway and conveyed floodwater into newly built properties adjacent to the road, resulting in those properties being inundated. [PAG] (p23)</p></div><div class="nugget-popup"><p>Overtopping of the local watercourse in the village (location shown in Figure 8&ndash;2) caused floodwater to flow down through the village and along lanes, inundating village roads and affecting properties/locations such as near the Coach Houses. Residents reported water coming down from the village and undertook drain clearing afterwards. [PAG,IMG] (p27)</p></div><div class="nugget-popup"><p>During the 23 December 2020 event the saturated Thornton catchment produced high flows on an unnamed ordinary watercourse. Based on observations there was sufficient flow to mobilise sand and gravel (up to large pebble size) and large amounts of debris were deposited on roads as the event receded. [IMG,TAB] (p29)</p></div><div class="nugget-popup"><p>Flooding affected roads and properties in the village from surface water / an ordinary watercourse; residents at the Coach Houses used sandbags and barriers to protect properties; floodwaters later receded; culvert on Nash Road required clearing (cleared 05/02/2021). [TAB] (p31)</p></div><div class="nugget-popup"><p>Thornton village centre experienced overtopping of the watercourse (location 2) and overland flow routes (including flow down College Lane) that caused flooding of properties in the village. Pathways included breaches of the watercourse, culverted and ordinary watercourses and converging overland flow. [IMG] (p32)</p></div><div class="nugget-popup"><p>The unnamed ordinary watercourse through the village rose rapidly and its banks overtopped at multiple points (locations 1, 2, 4 and 5), producing overbank flows into the village and flooding of streets/properties; overtopping at location 2 is documented by a photograph. [IMG] (p33)</p></div><div class="nugget-popup"><p>Hydrological analysis indicates groundwater levels were likely very high before the event, increasing rapid overland flow; groundwater may have risen above channel bed level and contributed to the high observed flows in the ordinary watercourse, thereby exacerbating flooding across Thornton during the event. [PAG] (p34)</p></div><div class="nugget-popup"><p>The village experienced widespread flooding on 23 December 2020: at least seven properties flooded internally due to overland flows and overflow from the nearby watercourse. Properties along the main road were internally flooded from rear field flows; Thornton College flooded internally, with carpets and tiles damaged. [PAG] (p35)</p></div><div class="nugget-popup"><p>Watercourse overtopping and converging overland flows were conveyed along roads and driveways (notably College Lane, the main road and shared driveways), causing internal flooding to properties across the village, flooding of roads and temporary loss of access. A blocked culvert upstream at Beachampton T&ndash;junction caused marginal highway flooding and access issues. Flooding affected village courtyard areas and outhouses and required clean&ndash;up and removal of carpets in some properties. [PAG] (p36)</p></div><div class="nugget-popup"><p>Flooding damaged roads (a large pothole developed on the main road through the village). Many roads around the village were temporarily unpassable. Sediment from floodwater accumulated on roads, creating hazards to traffic at multiple locations (including Beachampton Road junction opposite Village Farm Barn and College Lane); sediment was reported to Transport for Buckinghamshire and cleared in February 2021. [PAG,IMG] (p38)</p></div><div class="nugget-popup"><p>The local watercourse overtopped its banks consistently along its length during the 23 December 2020 event, indicating flows exceeded channel conveyance. Observations used in the assessment noted widespread overtopping rather than a single localized blockage. (p40)</p></div><div class="nugget-popup"><p>Village watercourse showed evidence of flow impacts: raised bed levels in places that squeeze flow, steep banks with some slumping/widening, and headwalls/modifications (blue pipe held in concrete) immediately upstream that present potential obstructions. There is space for water to spill out of the channel onto roads and grassed areas so relief flows are likely to follow roads and cause disruption during flood events. (p43)</p></div><div class="nugget-popup"><p>During the 23 December 2020 event the watercourse through Thornton overtopped its banks along its length, causing floodwater to back up and spread laterally limited by bank heights and culverts. Desk and site observations showed low siltation and vegetation cover (so channel capacity was not obviously reduced by dense growth), and evidence of moderate channel&ndash;edge collapse and local undermining/scour in places. (p46)</p></div><div class="nugget-popup"><p>Properties in Thornton were identified as being at risk of flooding during the event; the investigation recommends measures to increase property resilience. [TAB,PAG] (p50)</p></div><div class="nugget-popup"><p>Many village roads were rendered unpassable; roads sustained damage including potholes and large sediment deposits that created traffic hazards. (p57)</p></div><div class="nugget-popup"><p>Culverts were implicated in the flooding; recommended actions include CCTV inspection, checking for collapse, removal of obstructions and condition surveys to remediate culvert&ndash;related blockage or failures that contributed to flooding. [TAB] (p58)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>seven residential properties (p6)</p></div><div class="nugget-popup quant"><p>at least seven properties (p12)</p></div><div class="nugget-popup quant"><p>4 overtopping locations [IMG] (p33)</p></div><div class="nugget-popup quant"><p>2 properties affected (locations 1 and 3) (p34)</p></div><div class="nugget-popup quant"><p>at least seven properties; 20mm internal flooding (reported at a main&ndash;road property) [PAG] (p35)</p></div><div class="nugget-popup quant"><p>7 properties; 20 mm; 75 mm; 500 mm; 50 mm [PAG] (p36)</p></div><div class="nugget-popup quant"><p>at least seven residential properties (p57)</p></div></div></body></div>`)[0];
