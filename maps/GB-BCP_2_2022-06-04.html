                var html_996d49438c29b2e5e7ef8f2d883bcb43 = $(`<div id="html_996d49438c29b2e5e7ef8f2d883bcb43" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hamworthy</h1><div class="nugget-popup"><p>Experienced intense, short&ndash;duration surface water/urban flooding during the 4&ndash;5 June 2022 heavy rainfall event. The area was within the western sector where the heaviest rainfall and most flood reports were recorded; the event caused localized surface water inundation and contributed to internal flooding incidents in the western conurbation. (p5)</p></div><div class="nugget-popup"><p>Hamworthy experienced an intense convective rainfall event on the night of 4 June 2022 (heavy downpour starting around 23:15). Rainfall observations record approximately 22.6 mm between 23:00 and 00:00 on 4 June 2022, producing conditions associated with local surface&ndash;water/flash flooding and significant drainage stress in the Hamworthy area. [IMG] (p18)</p></div><div class="nugget-popup"><p>Surface water accumulated south of the railway and ponded at a low point on Blandford Road causing highway flooding. Water flowed into gullies and a nearby channel that discharges to Holes Bay; restricted channel capacity downstream (within the Holes Bay SSSI) limited discharge. Post&ndash;event works (desilting and reprofiling of outfall channels in late Oct 2022) were carried out to improve channel and outfall capacity. BCP Highways improved the local gully system and plan increased gully inspection frequency; Wessex Water plan to improve a pipe junction in a manhole near the Blandford Road low point to improve drainage. [IMG] (p22)</p></div><div class="nugget-popup"><p>Channels became clogged leading to local surface water flooding; channel clearance works were organised to alleviate drainage blockages. (p31)</p></div><div class="nugget-popup"><p>Part of the area affected by surface water flooding on 4&ndash;5 June 2022 (including Blandford Road); highlighted for further study and potential mitigation measures (SWMP, flood alleviation options). [TAB] (p33)</p></div></div></body></div>`)[0];
