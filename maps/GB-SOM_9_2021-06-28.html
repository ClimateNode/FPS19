priate drainage and flood mitigation schemes. (p35)</p></div></div></body></div>`)[0];

                var html_1e73ffa214c88612c5fb9c0ec6d64b87 = $(`<div id="html_1e73ffa214c88612c5fb9c0ec6d64b87" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1>Glynswood, Chard</h1><div class="nugget-popup"><p>Parts of Glynswood (within Furnham Road Industrial Estate area) were badly flooded during the 28 June 2021 event, reported as affected by the overland flow and heavy rainfall. (p10)</p></div><div class="nugget-popup"><p>Fluvial flooding at Glynswood. A stream flowing across the open area entered a culvert at the eastern end of Glynswood; the culvert (with a trash screen) was reported blinded by debris from the event and may have contributed to flooding downstream. Local drains were overwhelmed by the unusually high volumes of water. (p11)</p></div><div class="nugget-popup"><p>A culvert with a trash screen became blinded with debris during the storm, causing water to back up and flood part of the open space adjacent to the Academy and leisure centre; surface water also drained into this area from Elizabeth Way. [MUL] (p12)</p></div><div class="nugget-popup"><p>Pluvial/surface water flooding inundated sewers, causing blocked and backed&ndash;up sewerage systems; prompted Wessex Water response and follow&ndash;up works at affected properties. (p27)</p></div><div class="nugget-popup"><p>Pluvial flooding inundated sewers and led to sewer surcharge during the night of the event, overwhelming foul drainage in the area. (p32)</p></div><div class="nugget-popup"><p>A culvert and trash screen in the open area were identified for owner confirmation and inspection after the flood; they require checking for damage or blockage and repair/clearing as necessary. (p35)</p></div></div></body></div>`)[0];

                var html_42208cb4ab8212fb2d2caafcd3168b29 = $(`<div id="html_42208cb4ab8212fb2d2caafcd3168b29" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wadeford</h1><div class="nugget-popup"><p>Wadeford was explicitly stated to have been 'badly affected' by the 28 June 2021 heavy rainfall event, suffering severe flooding from the event (increased extent and depths versus a 1&ndash;in&ndash;100&ndash;year event); residents provided photographs showing flooding in progress. (p4)</p></div><div class="nugget-popup"><p>Flooded properties reported (red dots on map) and nearby road impacts associated with the 28 June 2021 flood event. [IMG] (p8)</p></div><div class="nugget-popup"><p>High&ndash;volume rainfall and resultant overland flows from Wadeford and Foxdon Hill ran down into Chard, feeding floodwater that accumulated in low points and travelled down past Park Cottages and Catchgate Lane. (p10)</p></div><div class="nugget-popup"><p>Runoff and surface water from the hills (Wadeford and Foxdon Hill) flowed down into Catchgate Lane and onward into residential streets, contributing to the flood flows and debris observed. (p12)</p></div><div class="nugget-popup"><p>Several houses were flooded (properties are at a topographical lowpoint) mainly from runoff across surrounding farmland. The road outside Goblin Hollow flooded; a culvert was reported partially blocked and gullies were reported damaged or buried. There was a sudden rise in water level in the village during the flood (allegations of links to breaching of recently constructed ponds). The Haymaker pub flooded when surface water came from the opposite field onto the road, down the eastern side into the pub car park and through gardens; surface water also entered the pub via the side entrance &mdash; a small drain under the road was functioning but exceeded capacity. (p14)</p></div><div class="nugget-popup"><p>Local watercourses were reported by residents as not being kept clear, reducing channel capacity and contributing to local flooding during the event; residents implicated these watercourses in causing inundation/overland flows in Wadeford. [TAB] (p24)</p></div><div class="nugget-popup"><p>Road (Court Mill Lane) in Wadeford was closed as impassable; area required highways response and clearance of debris/mud. (p26)</p></div><div class="nugget-popup"><p>High volumes of rainwater flowed down sloped roads, inundating roads and collecting in low points; local areas were threatened by rising levels in brooks through the village. (p32)</p></div><div class="nugget-popup"><p>A sudden rise in water level occurred in Wadeford during the event (possible containment breach alleged), with multiple local drainage assets (culverts, gullies, drains) reported near Goblin Hollow, between Burnside House and Coach House, and around the Haymaker Pub requiring inspection, clearing or repair. [PAG] (p35)</p></div><div class="nugget-popup"><p>Culvert and gullies near Goblin Hollow, a culvert between Burnside House and the Coach House, and other drainage features in Wadeford were identified in the post&ndash;event report as being relevant to the flooding on 2021&ndash;06&ndash;28. [PAG] (p36)</p></div></div></body></div>`)[0];

                var html_3b6e17ed088372e861e2133e868dff80 = $(`<div id="html_3b6e17ed088372e861e2133e868dff80" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Chard</h1><div class="nugget-popup"><p>Extensive flooding across the centre of town on 2021&ndash;06&ndash;28 with multiple flooded properties, road damage and flooded roads causing transport disruption. [PAG,IMG,MUL] (p8)</p></div><div class="nugget-popup"><p>Multiple parts of Chard were extensively flooded during the storm: the area around Furnham Road Industrial Estate, Beeching Close Industrial Estate and Chard reservoir saw extensive flooding; businesses in Furnham Road Industrial Estate were flooded internally (some units in Beeching Close also affected); local topography and overland flows from nearby residential areas (e.g. Coker Way) fed water into these locations. Additionally, parts of Glynswood (within Chard) experienced culvert blockage/backing up that flooded open space adjacent to the Academy and leisure centre, and a property reported about 2 feet of flooding against a back door and surcharging from a foul sewage manhole. (p12)</p></div><div class="nugget-popup"><p>On 28 June 2021 Chard experienced extremely intense rainfall (officers reported visibility down to ~5 yards). The central area was effectively blocked to emergency services, who set up control points on either side of the town to reach those affected. [IMG] (p20)</p></div><div class="nugget-popup"><p>Extensive surface water flooding across Chard and surrounding villages during the 28 June 2021 event. Intense local rainfall (95 mm in 2.5 hours recorded in Chard between 17:00&ndash;19:30 BST on 2021&ndash;06&ndash;28) produced flooding that was more extensive and deeper than shown on 1% (1&ndash;in&ndash;100 year) flood maps. [PAG] (p22)</p></div><div class="nugget-popup"><p>Heavy surface water (pluvial) flooding on 2021&ndash;06&ndash;28 concentrated in the town centre and low&ndash;lying areas due to overland flows from surrounding hills (a 'bowl' effect). Significant flooding of streets and property, flows in transit caused damage to roads and blocked drains. (p23)</p></div><div class="nugget-popup"><p>Saturated shallow groundwater and intense rainfall combined with surface runoff to generate significant overland flows that entered the Furnham Road industrial estate in Chard, causing flooding to the industrial area. [TAB] (p24)</p></div><div class="nugget-popup"><p>Considerable mud and debris on roads requiring deployment of sweepers and street cleaners; carriageways cleared of debris; arisings from road clearance were deposited temporarily at the Chipping landing on the nearby A30. (p26)</p></div><div class="nugget-popup"><p>Chard was heavily affected on 2021&ndash;06&ndash;28: roads could not be crossed safely, houses required pumping out with high&ndash;capacity pumps, sewers/piped drainage were overwhelmed, emergency services received many calls for help (prioritisation required), and parts of the town were managed from forward command points due to inaccessibility. (p28)</p></div><div class="nugget-popup"><p>Flooding occurred in the High Street and Furnham Road; water entered houses on the High Street (residents moved upstairs); the main route through town was closed. (p29)</p></div><div class="nugget-popup"><p>Surface water from surrounding farmland and slopes ran into the town, flowing through streets, gaining speed and debris, overwhelming gullies and drains and causing widespread street and property flooding across Chard. (p31)</p></div><div class="nugget-popup"><p>Modelling of flood flows corresponds with reported experience of water movement in the town during the event; flood flows moved along mapped directions and caused local inundation consistent with the rainfall event. (p32)</p></div><div class="nugget-popup"><p>During the 2021&ndash;06&ndash;28 event the centre of Chard became impassable &mdash; the town centre was not readily crossable, with roads cut by floodwater due to intense rainfall, constrained drainage capacity and local topography. (p34)</p></div></div></body></div>`)[0];
