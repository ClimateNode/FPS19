                var html_a6fb0e675bcb297876eda5b19ebb287c = $(`<div id="html_a6fb0e675bcb297876eda5b19ebb287c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Surrey</h1><div class="nugget-popup"><p>Exceptional rainfall in winter 2013/14 caused predominant surface water runoff and high groundwater levels, resulting in flooding across Surrey (including internal property flooding within the boundary of Epsom and Ewell). (p6)</p></div><div class="nugget-popup"><p>Widespread flooding across Surrey from a range of sources, including high groundwater levels; some areas exceeded previous groundwater flood records. [IMG,PAG] (p8)</p></div><div class="nugget-popup"><p>Surrey experienced widespread flooding during Winter 2013/14 from multiple sources, explicitly including groundwater flooding as groundwater levels rose very high; storm events during Dec 2013 contributed to sharp rises in river flows and flooding. [IMG,TAB] (p9)</p></div><div class="nugget-popup"><p>Widespread flooding occurred across the county during the winter 2013/14 event, prompting strategic actions and involvement from Risk Management Authorities (RMAs) described in the report. [PAG] (p12)</p></div><div class="nugget-popup"><p>Widespread flooding across the county in Winter 2013/14: roads were flood affected and in some places carriageway was extensively damaged and assessed for resurfacing (Project 400); roads were cleansed and re&ndash;opened; trees, debris and ditches were cleared to restore drainage; emergency pumping was used to remove flood waters to protect residents, property and infrastructure; call centre operated to handle residents' queries and grants/assistance were administered for those flooded. (p13)</p></div><div class="nugget-popup"><p>Widespread major flooding across the county caused by a combination of surface water and fluvial (river) sources; this led to internal property flooding in places (for example the ~10 incidents in Epsom and Ewell). Lack of maintenance of riparian watercourses/ditches contributed to the impact. (p18)</p></div><div class="nugget-popup"><p>Historic flooding across Surrey during the winter 2013/14 event; data on those flood incidents was gathered to highlight areas at risk, prioritise drainage maintenance and support business cases for major flood defence schemes. [PAG] (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 10 incidents of internal property flooding in Epsom and Ewell (p6)</p></div><div class="nugget-popup quant"><p>10 incidents of internal property flooding (in Epsom and Ewell) (p18)</p></div></div></body></div>`)[0];
