                var html_8219a52e17691bf227c5481839ff1630 = $(`<div id="html_8219a52e17691bf227c5481839ff1630" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Market Street, Wellingborough</h1><div class="nugget-popup"><p>Intense, short&ndash;duration heavy rainfall caused surface water drainage systems to be overwhelmed, resulting in excess surface water flowing to low points and entering buildings on Market Street. Five buildings in close proximity experienced internal flooding (water crossed the threshold and entered the buildings). (p6)</p></div><div class="nugget-popup"><p>Internal flooding of buildings: water crossed thresholds and entered premises on Market Street during the incident. (p8)</p></div><div class="nugget-popup"><p>Surface water from intense rainfall and runoff flowed along Market Street into premises. Multiple shops experienced internal flooding from front doors and entrances; water flowed through shops to rear egresses and pooled in central Market Street, preventing customer access and causing business disruption. [TAB,PAG] (p17)</p></div><div class="nugget-popup"><p>Multiple commercial and residential premises on Market Street experienced internal and external flooding as surface water flowed into the footway and across ground floors. Water pooled in central Market Street (&#8216;held like a lake&#8217;) and flowed from the north and from the rear of the library. Customers were often unable to enter shops because of a river of water in the footway; vehicle bow waves increased depths inside properties. Emergency pumping (FandR) and manual removal were required; some businesses could not reopen for days or weeks. (p18)</p></div><div class="nugget-popup"><p>Four properties on Market Street flooded internally. At a fifth property four people swept water away from the front door for several hours to prevent ingress. The road is relatively flat so water deepened along the entirety of the road and overtopped into Midland Road; external rear areas of properties are enclosed so water could not drain away effectively. (p20)</p></div><div class="nugget-popup"><p>External areas to the rear of properties were enclosed so water could not drain away effectively, causing flood depths to increase along Market Street; the relatively flat road profile allowed surface water to deepen. [PAG] (p21)</p></div><div class="nugget-popup"><p>Blocked/inoperable slot drains and a visibly broken carriageway channel led to standing water and large puddles on the pavement and carriageway, causing drainage failure and creating hazards for pedestrians, cyclists and vehicles during the flood event. [IMG,PAG] (p37)</p></div><div class="nugget-popup"><p>Inoperable slot drains and a broken carriageway channel on Market Street reduced drainage capacity and contributed to surface&ndash;water road flooding and local water accumulation during the event. [IMG,PAG] (p38)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>five buildings (p6)</p></div><div class="nugget-popup quant"><p>five buildings (p8)</p></div><div class="nugget-popup quant"><p>Reported internal flood depths across shops: 50 mm; 75 mm; 100 mm; 50&ndash;100 mm; 300 mm; 200 mm; 900 mm (in one shop); loss of electricity for up to 48 hours; internet loss (one shop) until 22/09/20; some businesses unable to reopen for days to weeks (reopened dates reported 21/09/20 and 15/09/20). [TAB,PAG] (p17)</p></div><div class="nugget-popup quant"><p>900mm depth; 300mm depth; 50mm depth; 200mm depth; external 400mm / internal 25mm (for affected property); lost electricity for 48 hours; unable to reopen business until 15/09/2020; reopened 21/09/2020; FandR pumped at approx. 18:00 on 16/08/2020; one report of ~1 hour to recede (p18)</p></div><div class="nugget-popup quant"><p>4 properties; four people at a fifth property (p20)</p></div></div></body></div>`)[0];

                var html_8dc21dee3a37929bae9d0618d495f389 = $(`<div id="html_8dc21dee3a37929bae9d0618d495f389" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cambridge Street, Wellingborough</h1><div class="nugget-popup"><p>Properties on Cambridge Street reported being flooded and were contacted as part of the investigation; flood report forms were hand&ndash;delivered and affected occupiers were visited by the investigating officer. (p8)</p></div><div class="nugget-popup"><p>Two StreetDoctor reports of blocked drains on Cambridge Street and observations of occasional gullies holding silt to surface level, impairing drainage during the flood event. (p15)</p></div><div class="nugget-popup"><p>Floodwater flowed from Cambridge Street toward Market Street, contributing to inundation of shop frontages; one respondent noted another property on Cambridge Street has historically flooded. [TAB] (p17)</p></div><div class="nugget-popup"><p>Described as the northern source area from which water flowed south down Glen Bank, contributing to the surface water runoff that caused property flooding at Glen Bank and Market Street. (p18)</p></div><div class="nugget-popup"><p>Six properties on Cambridge Street flooded internally. Water flowed southeast through gaps between buildings toward Glen Bank and deepened due to relatively flat local levels. (p20)</p></div><div class="nugget-popup"><p>Relatively flat areas of Cambridge Street caused surface water to deepen and acted as part of overland flow pathways contributing to flooding. (p21)</p></div><div class="nugget-popup"><p>A blocked road gully on Cambridge Street (debris observed in the drain) impeded drainage, causing localised surface&ndash;water ponding at a low point and contributing to road flooding at the Cambridge/Market Street area during the event. [IMG,PAG] (p38)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>two reports of blocked drains (p15)</p></div><div class="nugget-popup quant"><p>6 properties (p20)</p></div></div></body></div>`)[0];

                var html_a4a2408f3c6771b9d9de4d875c179760 = $(`<div id="html_a4a2408f3c6771b9d9de4d875c179760" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Midland Road, Wellingborough</h1><div class="nugget-popup"><p>Properties on Midland Road were identified in the vicinity of known flooding; flood report forms were hand&ndash;delivered and the investigating officer visited affected occupiers. (p8)</p></div><div class="nugget-popup"><p>Groundwater caused interior flooding of properties on Midland Road; flooding of the carriageway and footway due to lack of hydraulic capacity in the highway drain; a combined sewer blockage caused internal flooding to a property on Midland Road (recorded 12/07/15). [TAB,MUL] (p11)</p></div><div class="nugget-popup"><p>Runoff and deepening surface water entered premises from front and back doors and filled rear yard and basement. Basement flooded to a depth of 1600mm; rear entrance/yard 25mm; kitchen 25mm; counter/service area 15mm. Majority of Midland Road was flooded; road was temporarily closed by police and Fire & Rescue. Fire & Rescue pumped flood water from the basement (pump&ndash;out took around 5 hours). Premises were affected for about 3 days before reopening. [TAB] (p17)</p></div><div class="nugget-popup"><p>Majority of Midland Road flooded by surface water runoff; frontline runoff entered the front door of a commercial/residential property and flooded external areas and streets. Road was temporarily closed by police. Floodwater prevented access to the property fuse box and emergency crews (FandR) pumped flood water from a basement (response activity). Blocked gully on Midland Road was reported prior to the event. (p19)</p></div><div class="nugget-popup"><p>Two properties on Midland Road flooded internally. Surface water reached Midland Road from Market Square and the rear of the library; Market Street overtopped into Midland Road. (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Basement 1600mm; rear entrance/yard 25mm; kitchen 25mm; counter/service area 15mm; premises affected for 3 days; pump&ndash;out ~5 hours [TAB] (p17)</p></div><div class="nugget-popup quant"><p>Basement flooded to 1600mm; Kitchen flooded to 25mm; Rear entrance/yard flooded to 25mm; Counter/service area flooded to 15mm (p19)</p></div><div class="nugget-popup quant"><p>2 properties (p20)</p></div></div></body></div>`)[0];

                var html_21f20605f9eb15fdae7c8a9715433d03 = $(`<div id="html_21f20605f9eb15fdae7c8a9715433d03" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Glenbank, Wellingborough</h1><div class="nugget-popup"><p>Properties on Glen Bank (sic) were contacted as being in the vicinity of known flooding; flood report forms were hand&ndash;delivered and affected occupiers were visited as part of the investigation. (p8)</p></div><div class="nugget-popup"><p>Gullies collecting surface water from commercial car parks north of Glen Bank (sic) were inoperable due to heavy silting across the gratings, reducing drainage capacity and contributing to surface water flooding during the 16th August 2020 event. (p16)</p></div><div class="nugget-popup"><p>Surface water runoff from a supermarket car park and flow down from Cambridge Street overtopped a boundary wall and flowed to the rear and front of properties. External flooding reached 400mm at the rear; water entered dwellings via air bricks causing internal flooding of 25mm affecting bathroom and kitchen. At the front low point water accumulated to about 500mm. Fire & Rescue attended and assisted with deep water. [TAB,PAG] (p17)</p></div><div class="nugget-popup"><p>Runoff (reported from the supermarket car park at the northeast and from areas to the north) flowed down Glen Bank (sic) and accumulated at a low point in front of properties, entering buildings via doors and airbricks. Blocked gullies at the low point exacerbated accumulation. Fire and Rescue assisted with deep water. (p18)</p></div><div class="nugget-popup"><p>Strong flow of surface water down Glen Bank (sic) caused rapid deepening of water at the low point (described as lake&ndash;like depth) and this rush/deepening caused floodwater to enter rear and side doors of the affected property and flooded external areas and streets. (p19)</p></div><div class="nugget-popup"><p>Glen Bank (sic), being a low point, held and deepened surface water; water flowed to it via gaps between buildings from Cambridge Street and from commercial car parks which overtopped a retaining wall, causing localised inundation and standing water. (p20)</p></div><div class="nugget-popup"><p>The alley is documented as a low point where surface water ponds/accumulates; drainage channel/grating is present at the low point and was noted as relevant to drainage performance (risk of water accumulation at the low spot). [IMG] (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>400mm external depth; 25mm internal depth; 500mm at front low point [TAB,PAG] (p17)</p></div><div class="nugget-popup quant"><p>accumulation reached 500mm at the front of a property; external 400mm / internal 25mm reported for affected property (p18)</p></div><div class="nugget-popup quant"><p>2 gullies blocked (p19)</p></div></div></body></div>`)[0];

                var html_cc87eca84b7df282136ed30641c7e47a = $(`<div id="html_cc87eca84b7df282136ed30641c7e47a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wellingborough</h1><div class="nugget-popup"><p>The town experienced intense heavy rainfall on 16 August 2020. Surface water drainage systems were unable to convey the rainwater, causing excess surface water to flow over ground to low points around properties and leading to internal flooding of properties on Market Street. (p6)</p></div><div class="nugget-popup"><p>Location of the flood incident on Market Street where internal flooding of multiple buildings occurred. (p8)</p></div><div class="nugget-popup"><p>Surface water flooding affected parts of Wellingborough during the 16th August 2020 event. Private residential and commercial drainage in the area discharged to the surface water public sewer or unrecorded local systems (notably referenced in Market Street and Midland Road); no community&ndash; or property&ndash;level resilience facilities were reported to have been available to reduce surface water flood risk. (p16)</p></div><div class="nugget-popup"><p>Widespread surface water / urban flooding affected parts of the town (including Market Street and Glen Bank). Blocked storm drains and gullies were reported across the area; flows were reported as starting as far away as Broad Green and travelling into central streets, causing street ponding and property ingress. (p18)</p></div><div class="nugget-popup"><p>In this area of Wellingborough a total of 22 properties were reported to have flooded internally. (p20)</p></div><div class="nugget-popup"><p>Multiple areas of Wellingborough were affected by flooding: Fire and Rescue received emergency calls from areas of Wellingborough, crews attended properties and external areas where relatively deep flood water was held and pumped water to safe areas; follow&ndash;up clearing, rubbish collection and sandbag deliveries took place in the town centre and affected properties. (p21)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration rainfall caused surface water/flash flooding in parts of Wellingborough, inundating streets and properties. Local response teams (Wellingborough Norse and council staff) collected flood&ndash;related rubbish, sweepers cleared surfaces in the town centre, and sandbags were delivered to some properties. Drainage systems were cleared and flood debris removed by NH and AWS. The LLFA and Emergency Planning Team attended, liaised with risk management authorities and residents, recorded and mapped reports of flooding, and provided advice. [PAG] (p22)</p></div><div class="nugget-popup"><p>Intense heavy rainfall on 16th August 2020 overwhelmed surface water drainage across the catchment. Excess surface water flowed over ground to low points around properties; localised drainage systems were observed to be damaged or inoperable and some required maintenance/cleansing, reducing their ability to convey water. There are limited overland flow routes, so reliance on buried drainage contributed to flooding of properties and local infrastructure. No community&ndash; or property&ndash;level resilience measures were in place that could have been deployed. [PAG] (p23)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>five buildings (p6)</p></div><div class="nugget-popup quant"><p>five buildings (p8)</p></div><div class="nugget-popup quant"><p>22 properties (p20)</p></div><div class="nugget-popup quant"><p>82 separate formal and anecdotal reports of flooding across the county [PAG] (p22)</p></div></div></body></div>`)[0];
