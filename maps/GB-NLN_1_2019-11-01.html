                var html_db87840bcc9d098491a61dfd59678215 = $(`<div id="html_db87840bcc9d098491a61dfd59678215" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>North Lincolnshire</h1><div class="nugget-popup"><p>Fluvial, surface water, groundwater and sewer flooding caused internal and external flooding of residential and commercial properties; local highway and transport networks experienced disturbances due to elevated water levels. (p5)</p></div><div class="nugget-popup"><p>Heavy rainfall (notably the torrential downpour on 7 November 2019, with further rain on 9&ndash;10 November 2019) caused intense surface water runoff; overwhelmed adopted and private sewerage and highway drainage systems; raised the groundwater table and triggered springs; filled open watercourses so urban drainage could not discharge; and raised main river levels leading to overtopping in some areas. Reports of groundwater emergence and related issues were mainly received from Barton, Barrow, Kirton, Elsham and surrounding low&ndash;lying villages. [PAG,MUL] (p6)</p></div><div class="nugget-popup"><p>Heavy rainfall on 7 November 2019 and continued rain caused widespread surface water runoff, overwhelmed sewerage and highway drainage (adopted and private), raised the groundwater table and filled open watercourses so urban drainage could not discharge; main river levels rose leading to overtopping in some areas. The council received reports and followed up with affected residents and RMAs. (p7)</p></div><div class="nugget-popup"><p>Flooding occurrences were recorded in the town during the report event. [IMG] (p8)</p></div><div class="nugget-popup"><p>Following flood events in November 2019 affecting the area, the council indicated the LFRMS priority settlement list should be reviewed. The LFRMS identifies specific settlements within North Lincolnshire with estimated numbers of people and critical assets at local flood risk (local sources such as surface water, groundwater and ordinary watercourses). [PAG] (p25)</p></div><div class="nugget-popup"><p>The unitary authority coordinated emergency response to the November 2019 floods: a flood incident emergency room was established to organise and coordinate operations; North Lincolnshire Council staff, drainage improvement teams and neighbourhood services provided emergency flooding support; information was issued to the public and recovery activity followed the event. [PAG] (p27)</p></div><div class="nugget-popup"><p>Significant rainfall in November 2019 caused district&ndash;wide flooding: 54 properties reported internal flooding (including damage to homes) and 3 commercial/industrial businesses reported internal flooding; local highways experienced extensive flooding leading to multiple road closures and traffic disruption across the district. [PAG] (p30)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than 300 reports of flooding; 54 properties internally flooded; 3 commercial/industrial businesses internally flooded (p7)</p></div><div class="nugget-popup quant"><p>Approximately 100 members of Highways and Neighbourhood Services directly responded to the flooding incidents. [PAG] (p27)</p></div><div class="nugget-popup quant"><p>54 properties; 3 commercial/industrial businesses [PAG] (p30)</p></div></div></body></div>`)[0];
