                var html_127ef4cde6a017d6283b46f3d22c0154 = $(`<div id="html_127ef4cde6a017d6283b46f3d22c0154" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hoarwithy</h1><div class="nugget-popup"><p>Village centre and nearby buildings are shown within Flood Zone 3 on the flood map; the proximity of the River Wye places the central parts of Hoarwithy at high risk of river flooding during the event. [IMG] (p1)</p></div><div class="nugget-popup"><p>Seven properties experienced internal flooding arising from an overflowing watercourse (River Wye) with river water passing over the floodplain towards properties. One property (with areas raised above external ground level) flooded to between 2 ft and 3 ft. One basement flooding incident was reported. Flooding persisted for between 1 and 4 days. (p2)</p></div><div class="nugget-popup"><p>Wriggle Brook presents fluvial flood risk to properties in the village and causes nuisance/actual flooding of the highway. The brook's bed level may be impeding flow through the highway culvert (identified at site inspection), contributing to highway flooding. One listed (cultural heritage) property lies within the Flood Zone. [MUL] (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>7 properties; 1 property with raised&ndash;floor areas flooded (2&ndash;3 ft); 1 basement flooded; depths 1 ft to 5 ft; durations 1 to 4 days (p2)</p></div><div class="nugget-popup quant"><p>3 properties; 1 listed property [MUL] (p3)</p></div></div></body></div>`)[0];
