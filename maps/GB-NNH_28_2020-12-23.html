                var html_90e1d539dd745d459a496ec40524f3e8 = $(`<div id="html_90e1d539dd745d459a496ec40524f3e8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Newton Road, Geddington</h1><div class="nugget-popup"><p>Subject of a North Northamptonshire Council (LLFA) Section 19 flood investigation into flooding at Stamford Road/Newton Road, Geddington. (p2)</p></div><div class="nugget-popup"><p>Internal flooding occurred at properties on Newton Road; water entered buildings during the event. (p6)</p></div><div class="nugget-popup"><p>Flooding at Newton Road on 23rd December 2020 led to internal flooding of properties in the area and contributed to a formal S19 investigation being undertaken. (p8)</p></div><div class="nugget-popup"><p>Overland / surface water flooding inundated rear gardens and caused internal flooding in several properties (ground floor and an integral garage). One resident moved out for a period after internal flooding and has since installed their own flood barriers. (p15)</p></div><div class="nugget-popup"><p>Overland sheet flow and two distinct flow routes ran north&ndash;south through rear gardens leading to internal flooding of properties. Road gullies were reported lacking capacity, and a recently constructed property's bund on the northern boundary likely diverted and concentrated flows toward two other Newton Road properties. [PAG] (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Property 1 (north): external ~460mm; internal ~50&ndash;75mm. Property 2 (north): external ~150&ndash;200mm; internal ~25&ndash;45mm. Property 3 (north): external flooding (no depth given). Property 4 (north): external ~250mm (close to causing internal flooding). Property 5 (north): external ~25mm. Property 1 (south): internal flooding of integral garage ~200mm. Total: 3 properties internally flooded on Newton Road. (p15)</p></div><div class="nugget-popup quant"><p>3 properties (internally flooded) [PAG] (p16)</p></div></div></body></div>`)[0];
