                var html_0c24c43166affc6bd688eaf2f121f47a = $(`<div id="html_0c24c43166affc6bd688eaf2f121f47a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ginge Brook</h1><div class="nugget-popup"><p>Out&ndash;of&ndash;channel flows on the left bank (upstream of Church Lane) crossed fields and entered ordinary watercourses through the village; out&ndash;of&ndash;bank flow between Steventon and the A34 routed flows down a bridleway toward Milton Lane and into downstream watercourses. These actions contributed to internal flooding of properties and businesses within Steventon. [PAG] (p2)</p></div><div class="nugget-popup"><p>Ginge Brook produced flood spill locations and had reduced conveyance due to silt/obstructions; flood storage upstream of Steventon is proposed to reduce future flooding risk to the village and surrounding areas. [TAB] (p3)</p></div><div class="nugget-popup"><p>The Environment Agency mapping shows the highest flood risk (Flood Zone 3 and dark blue surface&ndash;water risk) confined around the channel boundary of Ginge Brook, indicating the brook is a focal location for river flooding that affects adjacent land and properties (and likely contributed to the January 2024 impacts). (p7)</p></div><div class="nugget-popup"><p>Ginge Brook broke its left bank during the flood event, producing out&ndash;of&ndash;channel flows that crossed fields into an ordinary watercourse; the main river caused flooding at multiple culverts and bridges (including under the railway and a public footbridge whose deck was observed at soffit level). [IMG] (p12)</p></div><div class="nugget-popup"><p>Ginge Brook produced overland flows during the flood event that entered Moor Ditch and conveyed water through a culvert under the A34; flows were reported to be up to 30 cm deep through the underpass during the event. (p15)</p></div><div class="nugget-popup"><p>Properties flooded from lack of capacity of culverts or open channel at multiple locations through Steventon, with water backing up at multiple culvert inlets. Channel siltation reduced cross&ndash;sectional area in sections (notably around the rail culvert by Stocks Lane and at the A34), contributing to the flooding. (p16)</p></div><div class="nugget-popup"><p>Overtopping on the left bank south of Mill Farm flooded adjacent farmland; flood flows crossed the farmland into a parallel ordinary watercourse, adding cross&ndash;catchment flows that, together with already high levels, led to internal flooding of a property on Vicarage Road and contributed to flooding through the centre of Steventon. [IMG,PAG] (p17)</p></div><div class="nugget-popup"><p>Overbank flooding from Ginge Brook occurred (furthest upstream location south of Mill Farm) causing left&ndash;bank inundation onto farmland; cross&ndash;catchment flows from this flooded area entered an ordinary watercourse running parallel to the main river, which, combined with already high levels, contributed to internal flooding of a property on Vicarage Road and raised water levels and flooding through the centre of Steventon. Additional flooded properties were reported adjacent to Ginge Brook around Castle Street and Stocks Lane; culvert siltation (including culverts owned by Network Rail) was reported to have reduced conveyance at those locations. [IMG] (p18)</p></div><div class="nugget-popup"><p>Ginge Brook backed up at a highway culvert (High Street) causing out&ndash;of&ndash;channel flows that passed through the rear of properties and along the road toward the village green and Milton Lane/The Causeway junction; these flows combined with flooding from ordinary watercourses and led to internal flooding of nearby properties and businesses. [IMG,PAG] (p19)</p></div><div class="nugget-popup"><p>High main&ndash;river levels limited discharge from ordinary watercourses into Ginge Brook, causing the brook to overtop the left bank around the A34 crossing and flood the bridleway between Steventon and Milton. Flood flows ran back toward Milton Lane and into other watercourses, contributing to flooding experienced by residents at the bottom end of Steventon; overtopping of the right bank also contributed to flooding of properties outside Steventon during the January event. [MUL] (p20)</p></div><div class="nugget-popup"><p>A roughly 350 m section of channel around its crossing under the A34 has reduced capacity and was observed to overtop the left bank, sending flow onto the adjacent bridleway between Steventon and Milton. These out&ndash;of&ndash;channel flows ran back towards Milton Lane and into other watercourses, contributing to property flooding in Steventon and to properties outside the village during the January 2024 event. The section is heavily silted and repeatedly flooded over the 2023/24 winter. [IMG,PAG] (p21)</p></div><div class="nugget-popup"><p>The modern river was realigned into a man&ndash;made channel (the cut for Milton Mill) which is heavily silted compared with the historical channel. The diversion from the original course and loss of a second channel reduced overall conveyance; siltation was observed at the downstream end of the culvert under the A34 and identified in the investigation as increasing the likelihood and severity of river flooding during the event. [PAG] (p22)</p></div><div class="nugget-popup"><p>The interface between Ginge Brook and Moor Ditch is linked to current overspill locations in flood on both left and right banks between Steventon and Milton; further investigation of this interface was recommended. (p25)</p></div><div class="nugget-popup"><p>Experienced out&ndash;of&ndash;channel overspill from the left bank upstream of Church Lane which crossed fields, entered an ordinary watercourse through the village and contributed to internal property flooding. Out&ndash;of&ndash;bank flows between Steventon and the A34 sent flows down a bridleway towards Milton Lane that entered downstream watercourses and caused them to back up. Siltation around the A34 reduced channel capacity. [PAG] (p26)</p></div><div class="nugget-popup"><p>Overtopping/spill from Ginge Brook upstream of Steventon contributed to localised river flooding during the event; report recommends upstream flood storage and gauge checks. [TAB] (p32)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 20 residential properties and businesses internally flooded [PAG] (p2)</p></div><div class="nugget-popup quant"><p>up to 30 cm depth through the underpass (p15)</p></div><div class="nugget-popup quant"><p>five distinct locations (p16)</p></div><div class="nugget-popup quant"><p>1 property [IMG,PAG] (p17)</p></div><div class="nugget-popup quant"><p>one property internally flooded on Vicarage Road; flooding reported over 60 cm at Castle Street and Stocks Lane [IMG] (p18)</p></div><div class="nugget-popup quant"><p>8 residential properties; 2 businesses [IMG,PAG] (p19)</p></div></div></body></div>`)[0];

                var html_7b4b510eda83e5f1fdee99f6daa51744 = $(`<div id="html_7b4b510eda83e5f1fdee99f6daa51744" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Moor Ditch</h1><div class="nugget-popup"><p>Moor Ditch is identified as having obstructions and silt affecting flow, with existing flood spill locations around the A34 that require further investigation &mdash; indicating it contributed to local flooding risk. [TAB] (p3)</p></div><div class="nugget-popup"><p>During the 4&ndash;5 Jan 2024 flood event, flows entered Moor Ditch approximately 150 m south of the offtake via overland flow from Ginge Brook and via a culvert under the A34; flows were reported to pass through a downstream underpass up to 30 cm deep. (p15)</p></div><div class="nugget-popup"><p>The main river offtake into Moor Ditch was blocked by silt and was not flowing during the flood event (and remained blocked in February); the inlet was inspected and silt was cleared on 16 April to restore flows into the upstream end of Moor Ditch. [PAG,MUL] (p23)</p></div><div class="nugget-popup"><p>The main river offtake feeding Moor Ditch was silted and not flowing during the flood event (4&ndash;5 Jan 2024) and again in February 2024. The offtake was inspected on 16 Apr 2024 and silt blocking the inlet was cleared, which restored flow into the upstream end of Moor Ditch. Photographs document silt build&ndash;up adjacent to the inlet before clearance and active flow after clearance. [IMG,PAG,MUL] (p24)</p></div><div class="nugget-popup"><p>Offtake inlet experienced silt build&ndash;up and required silt clearance; Moor Ditch was observed flowing after the offtake inlet clearance and contributed to overspill locations on both left and right banks between Steventon and Milton. [PAG] (p25)</p></div><div class="nugget-popup"><p>Out&ndash;of&ndash;channel/overspill flows adjacent to Moor Ditch contributed to flooding that affected Steventon and other communities; investigation of the interface between Ginge Brook and Moor Ditch and alternative routes for overspill flows is recommended. [PAG] (p26)</p></div><div class="nugget-popup"><p>Obstructions and high silt levels in Moor Ditch around the A34 were identified as restricting flow and causing/relating to flood spill locations; further investigation and clearance were recommended. [TAB] (p32)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>flow depth up to 30 cm; location ~150 m south of offtake (p15)</p></div></div></body></div>`)[0];

                var html_6b4126eee1b7a603915b92ab0fc57f0a = $(`<div id="html_6b4126eee1b7a603915b92ab0fc57f0a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Milton Lane, Steventon</h1><div class="nugget-popup"><p>Foul (sewer) flooding occurred at this location due to reported inundation of the Thames Water pumping station on Milton Lane; this was associated with out&ndash;of&ndash;bank flows from Ginge Brook that routed water down a bridleway towards Milton Lane and into downstream watercourses. (p2)</p></div><div class="nugget-popup"><p>Ordinary watercourse flooding at the Causeway/Milton Lane junction exacerbated by flows from the High Street culvert, contributing to local highway and junction flooding. (p14)</p></div><div class="nugget-popup"><p>Flood flows from Ginge Brook and ordinary watercourses reached the village green area around the Milton Lane/The Causeway junction, contributing to localised flooding at the junction area. [PAG] (p19)</p></div><div class="nugget-popup"><p>Foul (sewer) flooding was reported at the Thames Water pumping station at the bottom end of Milton Lane. In addition, flood flows from Ginge Brook and overland routes were seen running back towards Milton Lane and into other watercourses, contributing to flooding experienced by residents at the bottom end of the village. (p20)</p></div><div class="nugget-popup"><p>Foul (sewer) water flooding was reported by residents at this location; the operability of the sewer system and associated pumping station at Milton Lane requires further investigation. (p26)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 20 residential properties and businesses internally flooded (p2)</p></div></div></body></div>`)[0];

                var html_c77fd9c1c407f723b8b534babfe384bb = $(`<div id="html_c77fd9c1c407f723b8b534babfe384bb" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>The Causeway, Steventon</h1><div class="nugget-popup"><p>Roadside ditches and grips on The Causeway were identified for desilting and reprofiling to restore conveyance capacity and reduce future flooding risk to the highway and adjacent land. [TAB] (p3)</p></div><div class="nugget-popup"><p>Flows through and around properties on/near The Causeway continued from the High Street culvert backup and met flows from ordinary watercourses, contributing to surface water flooding along The Causeway and at its junction with Milton Lane. [PAG] (p19)</p></div><div class="nugget-popup"><p>Ordinary watercourses run along both sides of the Causeway and experienced overland flow and culvert blockages during the January event. Undersized or obstructed culverts, a makeshift vertical bar trash screen at a highway culvert inlet and obstructions at property access crossings led to backing up of water and contributed to flooding of highway and nearby properties. [PAG] (p20)</p></div><div class="nugget-popup"><p>Roadside ditch and grips on The Causeway were identified as silted/require desilting and reprofiling to restore flow capacity, contributing to local highway flooding risk during the event. [TAB] (p32)</p></div></div></body></div>`)[0];

                var html_9cd0f6aca129e86034c5bd1be7c8aa42 = $(`<div id="html_9cd0f6aca129e86034c5bd1be7c8aa42" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Castle Street, Steventon</h1><div class="nugget-popup"><p>A timber footbridge (public right of way) off Castle Street was identified for assessment and potential deck&ndash;level modification because of its flood risk exposure (deck likely affected by high flows). [TAB,PAG] (p3)</p></div><div class="nugget-popup"><p>Properties adjacent to Ginge Brook flooded at/around a bridge and culverts on Castle Street. Residents reported flood depths in this location of over 60 cm. Siltation of culverts (including Network Rail&ndash;owned culverts) was reported and identified as reducing conveyance and contributing to flooding at this location. (p18)</p></div><div class="nugget-popup"><p>The timber footbridge off Castle Street was identified as having a flood risk impact; evaluation and potential modification to deck level were recommended to address flood overtopping/risk. [TAB,PAG] (p32)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>flood depths over 60 cm (p18)</p></div></div></body></div>`)[0];

                var html_375432e66d01952035efcc4fc2b98d11 = $(`<div id="html_375432e66d01952035efcc4fc2b98d11" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Vicarage Road, Steventon</h1><div class="nugget-popup"><p>Properties on Vicarage Road were flooded; meetings with flooded residents were held in January. (p12)</p></div><div class="nugget-popup"><p>A property on Vicarage Road was flooded internally when high levels in the ordinary watercourse combined with cross&ndash;catchment flows from Ginge Brook. (p18)</p></div><div class="nugget-popup"><p>Overland flow from upstream agricultural land impacted the ordinary watercourses during the January flood; culverts at the junction of Vicarage Road and The Causeway were partially obstructed and desilting was recommended to reduce blockage and backing up of water. [PAG] (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property (p18)</p></div></div></body></div>`)[0];

                var html_48279b280f106dd980b026cf24e3caeb = $(`<div id="html_48279b280f106dd980b026cf24e3caeb" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>High Street, Steventon</h1><div class="nugget-popup"><p>The highway culvert under High Street (adjacent to Station Yard) was the final culvert within Steventon where flooding occurred during the January event. Flooding from this culvert affected residential properties and businesses, and flows down High Street added to ordinary watercourse flooding at the Causeway/Milton Lane junction. A tide mark of about 40 cm depth was observed in a rear garden following the event. [IMG] (p14)</p></div><div class="nugget-popup"><p>A highway culvert on High Street (B4017) backed up, producing out&ndash;of&ndash;channel flows through the rear of properties on the west side of the road; flows passed through/around properties and onto High Street, continuing toward the village green and meeting flows from ordinary watercourses, resulting in internal flooding. [IMG] (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8 residential properties; 2 businesses; 40 cm tide mark [IMG] (p14)</p></div><div class="nugget-popup quant"><p>8 residential properties; 2 businesses [IMG] (p19)</p></div></div></body></div>`)[0];

                var html_b542ff23d7aaef6c3efacd05e2d3d4b6 = $(`<div id="html_b542ff23d7aaef6c3efacd05e2d3d4b6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Stocks Lane, Steventon</h1><div class="nugget-popup"><p>A highway culvert on Stocks Lane was reported to have capacity issues during the January flood event; this location is the site of the Environment Agency river level gauge, and residents believed the gauge's maximum recorded level is lower than the actual peak river level during floods. (p13)</p></div><div class="nugget-popup"><p>The highway culvert on Stocks Lane was reported to be at or over capacity during the January event; near&ndash;90&ndash;degree bends either side of the culvert and the culvert under the rail line caused water to back up and flood properties upstream of the culvert. [PAG] (p14)</p></div><div class="nugget-popup"><p>Siltation and large deposits around the rail culvert by Stocks Lane caused a significant cross&ndash;sectional loss in the channel, reducing conveyance and contributing to increased flood risk and backing up at culvert inlets during the flood event; the report recommends reduction of silt levels at this location. (p16)</p></div><div class="nugget-popup"><p>Properties adjacent to Ginge Brook flooded at/around a bridge and culverts on Stocks Lane. Residents reported flood depths in this location of over 60 cm. Reported siltation of culverts at this location likely reduced conveyance and exacerbated flooding. (p18)</p></div><div class="nugget-popup"><p>Flooding occurred around a bridge and two culverts on Stocks Lane (and Castle Street), reported by residents as exceeding 60 cm; culvert siltation reduced conveyance and residents reported potential issues with the Stocks Lane river level gauge. [PAG] (p19)</p></div><div class="nugget-popup"><p>Reference to the operability of the Ginge Brook river gauge on Stocks Lane indicates Ginge Brook flooding impacted the area and monitoring/communication to residents about the gauge was recommended. [TAB] (p32)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>flood depths over 60 cm (p18)</p></div><div class="nugget-popup quant"><p>over 60 cm [PAG] (p19)</p></div></div></body></div>`)[0];

                var html_23c01904ded0306c8a1fa8ada306c573 = $(`<div id="html_23c01904ded0306c8a1fa8ada306c573" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>South Oxfordshire</h1><div class="nugget-popup"><p>Multiple locations within the district experienced internal property flooding associated with the heavy rainfall. (p10)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than 5 properties internally flooded (p10)</p></div></div></body></div>`)[0];

                var html_d991ba01cb129ad27a15f127da75aaa9 = $(`<div id="html_d991ba01cb129ad27a15f127da75aaa9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Steventon</h1><div class="nugget-popup"><p>Multiple locations within the village experienced internal flooding of residential properties and businesses. Flooding originated from the main river Ginge Brook (out&ndash;of&ndash;channel flows on the left bank upstream of Church Lane) and from a number of ordinary watercourses through the village; channel restrictions contributed to the event. Out&ndash;of&ndash;bank flows between Steventon and the A34 routed down a bridleway towards Milton Lane and into downstream watercourses; inundation of the pumping station on Milton Lane caused local foul water flooding at that location. [PAG] (p2)</p></div><div class="nugget-popup"><p>Flooding driven by Ginge Brook was identified as affecting Steventon; report recommends assessing upstream flood storage on Ginge Brook and investigating obstructions/silt to reduce local flood risk. [TAB] (p3)</p></div><div class="nugget-popup"><p>Many properties in the village were affected by flooding during the January 2024 event; many of the affected properties are located within Environment Agency Flood Zone 3 (high probability of river flooding). [IMG] (p7)</p></div><div class="nugget-popup"><p>Residential properties and local roads were flooded; flooding incidents in the village included property inundation and road closures during severe storms. [MUL] (p9)</p></div><div class="nugget-popup"><p>Properties and businesses were internally flooded; flooding caused damage to floors, cupboards and furnishings and inundated garden space and driveways. [PAG] (p10)</p></div><div class="nugget-popup"><p>Upstream of Steventon Ginge Brook breached its left bank; out&ndash;of&ndash;channel flows crossed an adjacent field and entered an ordinary watercourse that runs down to Vicarage Lane and The Causeway. Flooding occurred at multiple culverts and bridges through the village (including highway culverts, the rail crossing and a public footbridge). [IMG] (p12)</p></div><div class="nugget-popup"><p>Multiple highway culverts within Steventon reached capacity during the January event. The culvert under High Street (adjacent to Station Yard) produced flooding that affected residential and commercial properties and contributed flows to ordinary watercourse flooding around the Causeway/Milton Lane junction. Downstream, the bridleway alongside Ginge Brook showed flood levels up to 30 cm during a February site visit (over a month after the 4 Jan event). [MUL] (p14)</p></div><div class="nugget-popup"><p>Multiple ordinary watercourses through Steventon had relatively high baseflow at the February site visit; overland flows from Ginge Brook entered local channels (including Moor Ditch) during the January flood event and local paths such as a bridleway were observed flooded. (p15)</p></div><div class="nugget-popup"><p>Properties flooded due to lack of capacity in culverts or open channel in multiple locations through Steventon; flooding backed up at multiple culvert inlets and occurred at numerous culverts and crossings. [PAG] (p16)</p></div><div class="nugget-popup"><p>Raised river and watercourse levels contributed to flooding through the centre of Steventon; the central area experienced localised fluvial flooding driven by Ginge Brook and linked ordinary watercourse flows. [IMG] (p18)</p></div><div class="nugget-popup"><p>Backing up at the Ginge Brook culvert on High Street caused out&ndash;of&ndash;channel flows through the rear of properties on the west side of the road; flows then travelled down High Street toward the village green and the Milton Lane/The Causeway junction, meeting flows from ordinary watercourses. (p19)</p></div><div class="nugget-popup"><p>Ordinary watercourses through Steventon and constrained discharge to Ginge Brook (including a lower&ndash;capacity 350m section around the A34 crossing downstream) led to flooding out onto the bridleway between Steventon and Milton and backflows that contributed to property flooding in the village during the January event. Foul/sewer flooding was also reported at the bottom end of the village. [PAG] (p20)</p></div><div class="nugget-popup"><p>Properties at the bottom end of the village were flooded when out&ndash;of&ndash;channel flows from Ginge Brook overtopped its banks and ran along the bridleway back towards Milton Lane and into other watercourses. Flooding from these flows contributed to property flooding during the January 2024 event and was present repeatedly over the 2023/24 winter. [IMG,PAG] (p21)</p></div><div class="nugget-popup"><p>Flooding occurred within Steventon on 05 Jan 2024; local overspills from nearby watercourses (Ginge Brook and Moor Ditch) affected bank locations in the area. [PAG] (p25)</p></div><div class="nugget-popup"><p>Residential properties and businesses were internally flooded in multiple locations. Flooding originated from Ginge Brook and a number of ordinary watercourses through the village; out&ndash;of&ndash;channel flows on the left bank of Ginge Brook upstream of Church Lane crossed fields and entered an already at&ndash;capacity ordinary watercourse through the village, contributing to local inundation. Culvert restrictions and silt contributed to capacity issues and downstream flooding. [PAG] (p26)</p></div><div class="nugget-popup"><p>Flooding associated with Ginge Brook and blocked/silted highway drainage affected the village during the event; prompted recommendations for upstream flood storage on Ginge Brook, review of highway drainage maintenance, desilting of roadside ditches on The Causeway, and assessment of the deck level of the timber footbridge off Castle Street. The Ginge Brook river gauge on Stocks Lane was identified for operability information. [TAB] (p32)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 20 residential properties and businesses internally flooded [PAG] (p2)</p></div><div class="nugget-popup quant"><p>73 properties flooded [MUL] (p9)</p></div><div class="nugget-popup quant"><p>over 20 properties and businesses; up to 30cm of water depth [PAG] (p10)</p></div><div class="nugget-popup quant"><p>8 residential properties; 2 businesses; 30 cm depth on bridleway [MUL] (p14)</p></div><div class="nugget-popup quant"><p>30 cm depth observed on the bridleway (p15)</p></div><div class="nugget-popup quant"><p>five distinct locations [PAG] (p16)</p></div><div class="nugget-popup quant"><p>8 residential properties and 2 businesses flooded internally (p19)</p></div></div></body></div>`)[0];

                var html_7e5589d31a3d5d4e4d35293095817e5e = $(`<div id="html_7e5589d31a3d5d4e4d35293095817e5e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Milton</h1><div class="nugget-popup"><p>Flood flows were seen running back towards Milton Lane and into other watercourses, contributing to flooding experienced by residents at the bottom end of the village; residents reported foul water flooding at the Thames Water pumping station at the bottom end of Milton Lane. (p20)</p></div><div class="nugget-popup"><p>Overspill locations on both left and right banks between Steventon and Milton indicate flooding affected the Milton area; further investigation of the river interface was recommended. (p25)</p></div></div></body></div>`)[0];
