                var html_74bd045cb1178c2dd8b81a5567655e78 = $(`<div id="html_74bd045cb1178c2dd8b81a5567655e78" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Green Road, Mendlesham Green</h1><div class="nugget-popup"><p>During Storm Franklin (Feb 2022) surface water/overland flow cascaded down the road toward the pumping station, producing standing water outside properties (garden) and on a shared private driveway leading off the highway. Residents reported no internal flooding for at least one property, and concern that an extreme event could cause internal flooding at another property. [PAG,MUL] (p4)</p></div><div class="nugget-popup"><p>Surface water ran down Green Road toward the pumping station during Storm Franklin, causing standing water outside the nearby property; this section of Green Road has a historic record of road flooding (one report to the County Council in 2017). [MUL] (p5)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>10 properties consulted; 4 consultation responses; 2 properties reported flooding [PAG,MUL] (p4)</p></div><div class="nugget-popup quant"><p>1 report (2017) [MUL] (p5)</p></div></div></body></div>`)[0];

                var html_94c2901056445ecdeb94d1c18d2a69c2 = $(`<div id="html_94c2901056445ecdeb94d1c18d2a69c2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Mendlesham Green</h1><div class="nugget-popup"><p>Localised surface water/overland&ndash;flow flooding occurred on Green Road within Mendlesham Green during Storm Franklin (Feb 2022), causing standing water outside properties and on a shared private driveway; residents reported concern about potential internal flooding though one respondent reported no internal flooding from that event. [IMG,PAG,MUL] (p4)</p></div><div class="nugget-popup"><p>Multiple recorded surface&ndash;water flood incidents across Mendlesham Green: flooded roads/footways, a flooded garden/drive, a flooded non&ndash;residential property and a blocked/overflowing drain; incidents cluster along the main watercourse and adjacent roads and are shown on the pluvial (surface&ndash;water) risk map. [IMG,MUL] (p5)</p></div><div class="nugget-popup"><p>Repeated internal flooding of a property: floor coverings including floor tiles were lifted and had to be removed; ground&ndash;floor room floor and foundation level became water&ndash;saturated; evidence of water ingress at the base of the front door with staining and moisture damage to lower walls. (p9)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 consultation responses from 10 properties consulted; 2 properties reported flooding [IMG,PAG,MUL] (p4)</p></div><div class="nugget-popup quant"><p>4 historical incident records (15/12/2015; 25/07/2016; 19/12/2019; 21/10/2021) [IMG,MUL] (p5)</p></div></div></body></div>`)[0];
