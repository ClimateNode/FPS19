                var html_613f3c3d46cb7ae5e4ff68dbddcae4f1 = $(`<div id="html_613f3c3d46cb7ae5e4ff68dbddcae4f1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Manor Road, Grimscote</h1><div class="nugget-popup"><p>Intense short&ndash;duration rainfall onto a saturated catchment caused excess surface water to flow over ground to low points in the village and be drained via highway drainage. At least one property on Manor Road experienced internal flooding. (p5)</p></div><div class="nugget-popup"><p>Runoff from high ground during significant rainfall on 21 November 2012 flowed through properties toward and onto Manor Road, with at least one property on Manor Road flooded internally and other properties placed at high risk. [PAG] (p8)</p></div><div class="nugget-popup"><p>A large volume and high&ndash;velocity surface water flowed south across agricultural fields toward properties on the south of Manor Road, ponded at the rear of two residential properties, crossed boundaries and resulted in one residential property on Manor Road being flooded internally. (p11)</p></div><div class="nugget-popup"><p>A diverted historic culvert around a residential property on Manor Road includes multiple changes of direction and restricted access that restrict flow and has historically been a source of flooding. A large pond formed at the rear of two residential properties, deepened, overtopped property boundaries, flowed through the rear garden of one property and into the building. Temporary pipework and slab defences were installed and the gravel driveway was re&ndash;levelled to try to divert/protect the affected property. Ponding was also reported on the Manor Road carriageway which drained via the highway drainage system. [PAG] (p12)</p></div><div class="nugget-popup"><p>Temporary flood defences and pipework were installed behind a residential property on Manor Road. [IMG,PAG] (p35)</p></div><div class="nugget-popup"><p>Temporary flood defences (panels) and pipework were installed directly behind a residential property to prevent water ingress; barriers placed at ground level against the fence with an integrated pipe outlet to channel water away. [PAG] (p36)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property (p5)</p></div><div class="nugget-popup quant"><p>at least one property [PAG] (p8)</p></div><div class="nugget-popup quant"><p>one residential property (p11)</p></div><div class="nugget-popup quant"><p>two residential properties; one residential property [PAG] (p12)</p></div></div></body></div>`)[0];

                var html_1b4e046b26cffe45573b4962c8399b7c = $(`<div id="html_1b4e046b26cffe45573b4962c8399b7c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Litchborough Road, Grimscote</h1><div class="nugget-popup"><p>Runoff from agricultural land and from Litchborough Road's riparian ditch system (one ditch had been blocked by driveways to four dwellings) was carried north via pipes and gullies into the Manor Road drainage system, contributing to floodwater reaching properties on Manor Road. This runoff was a causal pathway in the event of 21 November 2012 when at least one property experienced internal flooding. [PAG] (p8)</p></div><div class="nugget-popup"><p>Surface water emanated from agricultural land south of Litchborough Road and from Litchborough Road itself; the riparian&ndash;owned ditch system and associated pipework on Litchborough Road had insufficient capacity and overtopped, producing overland flows. An agricultural access track on Litchborough Road produced considerable overland flow that ran east down Litchborough Road and discharged into the riparian ditch at the low point. [PAG] (p11)</p></div><div class="nugget-popup"><p>Blockage/closure of a historic riparian&ndash;owned ditch on the south side of Litchborough Road redirected a greater quantity of water to flow eastwards through the village of Grimscote, altering local flow routes and increasing flood risk through the village. (p12)</p></div><div class="nugget-popup"><p>Riparian&ndash;owned ditches on Litchborough Road are described as overgrown and silted&ndash;up, reducing drainage capacity and implicated in flooding impacts to nearby properties on the south side. [IMG,PAG] (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least one property; four dwellings [PAG] (p8)</p></div></div></body></div>`)[0];
                popup_fc09898077da23c9ef1fde9bbf7a9470.setContent(html_1b4e046b26cffe45573b4962c8399b7c);

                var html_98df15f47b75027ef656efa3935b4ae5 = $(`<div id="html_98df15f47b75027ef656efa3935b4ae5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Grimscote</h1><div class="nugget-popup"><p>Intense short&ndash;duration rainfall on a saturated catchment caused excess surface water to flow over ground to low points in the village; this resulted in internal flooding of property/properties and was aggravated by ineffective historic drainage systems. [PAG] (p6)</p></div><div class="nugget-popup"><p>A greater quantity of water was made to flow through the village (where it did not previously), increasing flood risk within Grimscote; ponding and drainage issues are described on Manor Road within the village. (p12)</p></div><div class="nugget-popup"><p>Ponding was reported on the carriageway of Manor Road; the surface water ponding drained via the highway drainage system. (p13)</p></div><div class="nugget-popup"><p>Intense rainfall on a saturated catchment caused existing drainage systems and watercourses to be unable to cope. Excessive flows overtopped systems and flowed to the low point in the village, with residential properties on the flow path being affected by the resulting surface water/flash flooding. (p16)</p></div><div class="nugget-popup"><p>Flows of water from higher ground overtopped drainage systems and flowed to the low point in the village, affecting residential properties; overspill of land drainage from watercourses impacted the public highway and private property. (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least one property [PAG] (p6)</p></div></div></body></div>`)[0];
