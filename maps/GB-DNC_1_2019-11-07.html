opped below 10.65mAOD by 18:00 on 8 Nov 2019 (p61)</p></div></div></body></div>`)[0];

                var html_04db2c68803e31348d4b97e547ed8ddf = $(`<div id="html_04db2c68803e31348d4b97e547ed8ddf" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kearsley Brook</h1><div class="nugget-popup"><p>Kearsley Brook produced notable flooding that affected Conisbrough. (p5)</p></div><div class="nugget-popup"><p>Kearsley Brook had a fairly rapid high&ndash;flow response to heavy rain on 7 November, causing flooding through the urban corridor (including New Hill/Low Road) and flooding to several properties; limited culvert capacity was noted as important to the risk. (p7)</p></div><div class="nugget-popup"><p>Flooding from the smaller watercourse (Kearsley Brook) caused notable flooding at Conisbrough. (p18)</p></div><div class="nugget-popup"><p>Kearsley Brook experienced a flood event on 7 November 2019 with a rapid rising limb and high turbulence; modelled and observed hydrographs indicate a peak flow judged at approximately 5 m3/s, corresponding to about a 2%&ndash;1% AEP (50&ndash;100 year) event, contributing to road flooding risk in the catchment. [IMG,PAG] (p106)</p></div><div class="nugget-popup"><p>Heavy rain across the Kearsley Brook catchment on 7 Nov caused a rapid response on the brook, producing flooding on New Hill and Low Road and a reported flood at the A630 crossing. [TAB] (p109)</p></div><div class="nugget-popup"><p>Debris collected on an upstream debris screen in November 2019, causing local bypass of the screen and continued downstream flow that affected downstream culverts and conveyed floodwater downstream. (p113)</p></div><div class="nugget-popup"><p>Rapid&ndash;onset fluvial flooding from Kearsley Brook contributed to flooding in Conisbrough; the brook is identified on the Environment Agency's Rapid Response Catchment register and modelled as having a short catchment lag, driving the need for bespoke warnings and a rapid response plan. [PAG] (p114)</p></div><div class="nugget-popup"><p>Flow through the Duftons Close site caused flood risk and prompted proposals for site protection and drainage backflow prevention following the November 2019 event. (p198)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>peak flow approximately 5 m3/s; 2% &ndash; 1% AEP (50 year &ndash; 100 year return period) [IMG,PAG] (p106)</p></div><div class="nugget-popup quant"><p>13 properties (recorded on New Hill / Low Rd) [TAB] (p109)</p></div></div></body></div>`)[0];

ng the stage 2 phase of the event. (p46)</p></div><div class="nugget-popup"><p>Flooding associated with the dyke required reconfiguration of flood defences to provide flood storage in the amenity area to the north and to give flood protection to Frank Road. (p198)</p></div></div></body></div>`)[0];

                var html_5929b72c1b4624248b72d8de07f745a6 = $(`<div id="html_5929b72c1b4624248b72d8de07f745a6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Doncaster</h1><div class="nugget-popup"><p>High flows on watercourses produced flooding along associated floodplains across the borough. River Don recorded record&ndash;high flows, riverside embankments overtopped at Bentley and downstream, the Bentley Flood Corridor storage area filled, extensive surface water flooding occurred near small watercourses and dykes. Consequences included almost 800 households flooded, many residents evacuated, extensive road closures and large numbers of businesses impacted. [MUL] (p5)</p></div><div class="nugget-popup"><p>River Don flows exceeded containment, overtopping the left Riverside Bank starting early on the morning of the 8th and then overtopping the secondary Barrier Bank; overtopping spread floodwater beyond normal banks to inundate low&ndash;lying agricultural land and communities. (p7)</p></div><div class="nugget-popup"><p>Widespread flooding from intense rainfall and river responses: households flooded, residents evacuated, extensive road closures and many businesses affected within the borough. (p11)</p></div><div class="nugget-popup"><p>Widespread flooding affected much of the Doncaster borough during the event; multiple communities across the borough were impacted and were grouped for sub&ndash;investigation. [PAG] (p15)</p></div><div class="nugget-popup"><p>Flooding occurred on floodplains and in areas of the town as high flows passed through Doncaster; the River Don at Doncaster recorded its highest flow on record during the event. [PAG] (p17)</p></div><div class="nugget-popup"><p>Flooding of land alongside the River Don and floodplain storage filling occurred across the borough. Large numbers of properties were flooded, residents evacuated and a major incident was declared. [PAG] (p18)</p></div><div class="nugget-popup"><p>Doncaster appears within the geographic scope of the Environment Agency flood map and the Humberhead Levels floodplain is shown to extend into parts of the Doncaster area, indicating parts of the borough were within the flood risk area and affected by flooding during the event. [IMG] (p24)</p></div><div class="nugget-popup"><p>Doncaster was at the centre of the intense rainfall band on 7 Nov 2019 and the River Don peak flow at Doncaster was reported as the highest on record for the November 2019 event, contributing to significant local flooding and surface&ndash;water issues where drainage capacity was challenged. [IMG] (p30)</p></div><div class="nugget-popup"><p>The Don at Doncaster flood produced overtopping of defences and resulted in residential flooding around Bentley (South) &mdash; including Riviera Parade, Hunt Lane, Yarborough Terrace, Frank Road and Conyers Road &mdash; and filling of the Bentley Flood Corridor; pumping operations (Environment Agency and Fire Service) were used to return flood water to the river. (p38)</p></div><div class="nugget-popup"><p>Doncaster Council recorded and managed the multi&ndash;agency flood emergency response for the 7&ndash;10 Nov 2019 event: maintaining an overview of weather/flood warnings, producing briefing notes, recording streets evacuated, maintaining a flood risk call log, operating the multi&ndash;agency flood plan, and using road closure and sandbag protocols; debrief feedback was produced afterwards. [PAG] (p41)</p></div><div class="nugget-popup"><p>The wider Doncaster area experienced flooding linked to the River Don overtopping and limited flood storage in local corridors; the report recommends catchment&ndash;scale hydraulic modelling and a review of River Don flood risk management following the November flooding. (p45)</p></div><div class="nugget-popup"><p>Significant floods occurred across Doncaster during 7&ndash;9 November 2019, causing widespread damage in the borough. [PAG] (p48)</p></div><div class="nugget-popup"><p>Significant flooding across the borough during 7&ndash;9 November 2019: river (River Don and tributaries including Ea Beck and Swaithe/North Swaithe Dyke) and surface&ndash;water flooding inundated urban areas and agricultural land, caused widespread damage and required emergency pumping and sandbagging. [IMG,PAG] (p49)</p></div><div class="nugget-popup"><p>Significant flooding occurred in South Yorkshire associated with a weather front on 7&ndash;8 November 2019; radar and the EA interim hydrology report show intense, persistent rainfall centred on Doncaster and the report focused on elevated river flows in the Don/Dearne/Rother catchments affecting the Doncaster area. (p57)</p></div><div class="nugget-popup"><p>River levels at the Doncaster gauge reached record highs during the event; the hydrograph rose above local embankment crest levels close to the gauge and remained above the 10.65mAOD threshold for much of 8 November before falling later that day. (p61)</p></div><div class="nugget-popup"><p>Significant floods on 7th, 8th and 9th November 2019 caused widespread damage across Doncaster Borough; local authorities monitored river levels and put contingency plans/major&ndash;incident responses in place. [IMG] (p70)</p></div><div class="nugget-popup"><p>Doncaster Council recorded and managed aspects of the flood incident, maintaining briefing notes, logs, lists of evacuated streets, a flood risk call log, multi&ndash;agency flood plan documentation and other response protocols as part of the emergency response to the flood. (p88)</p></div><div class="nugget-popup"><p>The River Don flood corridor through and downstream of Doncaster experienced peak flood extent during the November 2019 event (extent mapped between Doncaster and Fishlake). The corridor is described as benefitting from defences, but observed extents prompted recommendations to review modelled flood risk and consider catchment&ndash;level measures (additional upstream storage and potential river channel works) to reduce future impacts. [PAG] (p91)</p></div><div class="nugget-popup"><p>Flooding within Doncaster was linked to the capacity and alignment of the River Don channel through the town; the report recommends investigating channel widening/bed lowering to increase capacity and reduce flood risk. [PAG] (p92)</p></div><div class="nugget-popup"><p>River Don reached a recorded peak at Doncaster (near North Bridge Road), contributing to flooding of nearby communities (notably Fishlake). Properties in the village were inundated and remained flooded for over a week before pump&ndash;down activities reduced water levels. The report indicates that a reduced Barrier Bank crest (localised lowering/subsidence) likely allowed floodwater to escape containment, increasing the extent and duration of flooding affecting the area within Doncaster borough. (p93)</p></div><div class="nugget-popup"><p>Significant flooding occurred across the borough during 7&ndash;9 November 2019 causing widespread damage and prompting a Major Incident declaration and extensive monitoring and emergency response. [IMG] (p95)</p></div><div class="nugget-popup"><p>Doncaster was at the centre of the most intense rainfall during the 7&ndash;8 November 2019 weather event and is reported in the hydrology assessment as being affected by the significant South Yorkshire flooding. (p124)</p></div><div class="nugget-popup"><p>Flooding on Paper Mill Dyke (within Doncaster borough, at Tickhill) led to 22 properties being recorded flooded close to the channel. Doncaster's investment (Lindrick containment wall and automated sluice) implemented in 2019 is assessed to have reduced actual flooding during the event and is estimated to have protected around 17 properties that would otherwise have flooded. (p130)</p></div><div class="nugget-popup"><p>During 07&ndash;10 Nov 2019 surface water flooding affected the Intake area of Doncaster; an outlined residential area bounded by Westminster Crescent, Lothian Road and Marlow Road included six affected properties. [IMG] (p153)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>almost 800 households; River Don highest flow in a 43 year record; estimated return period 150&ndash;250 years [MUL] (p5)</p></div><div class="nugget-popup quant"><p>almost 800 households (p11)</p></div><div class="nugget-popup quant"><p>highest flow on a 43 year record; estimated return period 150&ndash;250 years (0.67% to 0.4% AEP) [PAG] (p17)</p></div><div class="nugget-popup quant"><p>773 properties recorded as affected in the borough; 692 properties adjacent to or within river/beck flood influence; 606 properties within River Don influence; 75 properties in surface water flood risk areas; 6 properties not identified on EA flood maps [PAG] (p18)</p></div><div class="nugget-popup quant"><p>peak flood level of 10.708mAOD recorded at the Don at Doncaster gauge (p38)</p></div><div class="nugget-popup quant"><p>peak level of 6.308m; peak flow of 395m3/s; highest recorded in a 43&ndash;year record; embankment crest recorded 10.54 &ndash; 10.71mAOD; flood level reached 10.65mAOD at 07:00 on 8 Nov and peaked at 12:45 before falling below 10.65mAOD at 18:00 (p61)</p></div><div class="nugget-popup quant"><p>peak flood level 6.867mAOD recorded at Fishlake (p91)</p></div><div class="nugget-popup quant"><p>peak flow 395 m3/s; peak level 6.308 m (p93)</p></div><div class="nugget-popup quant"><p>22 flooded properties; 17 properties protected (p130)</p></div><div class="nugget-popup quant"><p>6 properties [IMG] (p153)</p></div></div></body></div>`)[0];
                popup_7b9f7b6d6e5bb2111135b7b8dbf70512.setContent(html_5929b72c1b4624248b72d8de07f745a6);

                var html_731b2f5d588a1ca7fa0902fc5417b817 = $(`<div id="html_731b2f5d588a1ca7fa0902fc5417b817" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bentley Ings</h1><div class="nugget-popup"><p>Inundation and high water levels requiring pumping operations and management of flows; water was actively moved from Bentley Ings to Thorpe Marsh washland using pumps and spillway monitoring to create storage capacity. (p19)</p></div><div class="nugget-popup"><p>The Ings washlands held flood water; dikes discharged into the washlands and flood flows moved through local routes (including the railway tunnel underpass and along nearby car park); flooding observed on the morning of 8th with later deeper flows arriving via Swaith Dike. [TAB] (p34)</p></div><div class="nugget-popup"><p>The downstream (east) Bentley Flood Corridor at Bentley Ings was holding flood water. The Environment Agency were operating pumps at Bentley Ings pumping station to manage the flooding. [TAB,PAG] (p36)</p></div><div class="nugget-popup"><p>Bentley Ings pumping station was used in an Environment Agency pumping operation to remove/return floodwater to the river channel; the pumping operation was still in progress on 10 November 2019 and contributed to clearing floodwater by late on 10&ndash;11 November. [TAB] (p37)</p></div><div class="nugget-popup"><p>Bentley Ings Washland and associated low&ndash;lying Bentley Ings area were filled as downstream spillways and Ea Beck routed water into the flood corridor; the washland received flow from Thorpe Marsh Reservoir via Grumble Hirst and from Norwood Spillway, contributing to raised downstream levels that prevented drainage and reversed flows into Bentley (South). Environment Agency pumping operations were in progress and the discharge culvert was 'plugged' to limit backflow. [PAG] (p38)</p></div><div class="nugget-popup"><p>Washlands at Bentley Ings were inundated/held floodwater as the River Don overtopped into the Bentley Flood Corridor; area received routed discharge and showed raised water levels associated with the event. [TAB] (p40)</p></div><div class="nugget-popup"><p>Bentley Ings (downstream washlands) are identified as the intended receiver for overtopping floodwater; the report proposes encouraging overtopping to reach these washlands to bypass the Bentley Flood Corridor. (p44)</p></div><div class="nugget-popup"><p>Bentley Ings and its pumping infrastructure were a focus of flood response on 8 November 2019: temporary pumps were deployed at/near the Bentley Ings pumping station to pump North Swaithe Clyse into the Flood Corridor and the River Don. Operational notes indicate pumping was at risk of being out&ndash;paced by overtopping of the riverside barrier, limiting discharge and contributing to local inundation. [IMG,PAG] (p48)</p></div><div class="nugget-popup"><p>The Environment Agency gauge (Bentley Ings Screen) recorded rising water levels associated with the November 2019 event: levels rose on 7 Nov, passing 4.4mAOD by 17:00 on 7 Nov, continued to rise and reached a record peak of 4.46mAOD by 10 Nov, then fell below 4.4mAOD by 11 Nov and below 4.0mAOD by 12 Nov. (p61)</p></div><div class="nugget-popup"><p>The gauge recorded exceptionally high water levels during the event, indicating significant river flooding at Bentley Ings. (p64)</p></div><div class="nugget-popup"><p>Bentley Ings functioned as downstream washlands/flood corridor inundated during the 07 Nov 2019&ndash;10 Nov 2019 event; the report discusses pumping water from the Bentley Flood Corridor back into the Don, compartmentalisation of washlands, reshaping land to maximise storage, and rapid deployment of high&ndash;capacity pumping to reduce downstream water levels. [TAB] (p198)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>estimated flood level 6.9mAOD [TAB,PAG] (p36)</p></div><div class="nugget-popup quant"><p>Associated pumping station level estimates 6.1mAOD rising to approx 6.9mAOD on 9&ndash;10 Nov [TAB] (p40)</p></div><div class="nugget-popup quant"><p>passed 4.4mAOD on 07 Nov 2019; peak level 4.46mAOD on 10 Nov 2019; fell below 4.4mAOD by 11 Nov 2019; fell below 4.0mAOD by 12 Nov 2019 (p61)</p></div><div class="nugget-popup quant"><p>Peak recorded levels: 4.28mAOD on 7th Nov; 4.30mAOD on 8th Nov; 4.46mAOD on 10th Nov (highest on record). (p64)</p></div></div></body></div>`)[0];
                popup_67f16bbe74fb1e4b56fcf8d1746e9ec8.setContent(html_731b2f5d588a1ca7fa0902fc5417b817);

                var html_b432d71527fa30a7b87be2ea27091676 = $(`<div id="html_b432d71527fa30a7b87be2ea27091676" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Thorpe Marsh Nature Reserve</h1><div class="nugget-popup"><p>Part of the Bentley Flood Corridor (which stretches to Thorpe Marsh) filled as designed when the River Don flooded; flood storage in this corridor inundated from the south as embankments overtopped downstream of Bentley. (p18)</p></div><div class="nugget-popup"><p>Thorpe Marsh washland was used to receive pumped floodwater from Bentley Ings to create storage capacity at Bentley; pumping operations were consolidated at Thorpe Marsh on 10 Nov to assist drain&ndash;down. (p19)</p></div><div class="nugget-popup"><p>Identified as a location where the Ea Beck spillway could be exceeded, allowing floodwater into the Bentley Flood Corridor (i.e. a spill point for overtopping flows). [TAB,PAG] (p25)</p></div><div class="nugget-popup"><p>Aerial evidence shows significant overtopping downstream (including near Arksey Ings) and Norwood Spillway operating with Ea Beck filling the Bentley Flood Corridor via Thorpe Marsh Reservoir and Grumble Hirst spillway on 8th&ndash;10th, contributing to raised downstream levels that impeded drainage from Bentley and caused reverse flows into the residential area. (p38)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>20 Flood Warnings; 5 Severe Flood Warnings (p19)</p></div></div></body></div>`)[0];

                var html_00054d2a8ec16054866f7ecab270dc1a = $(`<div id="html_00054d2a8ec16054866f7ecab270dc1a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ea Beck</h1><div class="nugget-popup"><p>EA Beck at Adwick Le Street recorded exceptionally high water levels during the November 2019 event, contributing to high flows in local ditches and drainage channels and to floodplain inundation. (p5)</p></div><div class="nugget-popup"><p>Ea Beck filled the Bentley Flood Corridor from the south on the 8th, 9th and 10th, contributing to the second&ndash;stage flood condition that prevented drainage and caused reverse flows into Bentley (South) residential areas. (p6)</p></div><div class="nugget-popup"><p>Ea Beck at Adwick Le Street reached its highest recorded level during the event, indicating local river flooding. [PAG] (p17)</p></div><div class="nugget-popup"><p>Ea Beck at Adwick Le Street recorded its highest level on record (from a 19&ndash;year record) and contributed flow into the Bentley Flood Corridor (via the Norwood Spillway). [PAG] (p18)</p></div><div class="nugget-popup"><p>Described as a 'perched' watercourse that is most likely to spill at Thorpe Marsh, sending flows into the Bentley Flood Corridor and potentially causing backflow along local dykes. [TAB,PAG] (p25)</p></div><div class="nugget-popup"><p>Ea Beck filled the Bentley Flood Corridor from the south during the event, adding flow into the flood corridor and contributing to elevated downstream levels that impeded drainage and caused backflow into Bentley (South). (p38)</p></div><div class="nugget-popup"><p>Ea Beck overtopped at Norwood Spillway during the event, contributing water into the downstream Bentley Flood Corridor washlands; this contributed to flood storage in the corridor (but did not appear to directly flood Bentley North). (p40)</p></div><div class="nugget-popup"><p>Contributed to flood risk in North (and adjacent South) Bentley during the November 2019 event as a local watercourse feeding the drainage network that influenced inundation. [PAG] (p48)</p></div><div class="nugget-popup"><p>The EA Beck gauge at Adwick Le Street recorded its highest level on record during the event, indicating significant river flooding at that location. (p61)</p></div><div class="nugget-popup"><p>Ea Beck overtopped at Norwood Spillway and contributed additional water to the Bentley Flood Corridor at its downstream end during the November 2019 event. (p63)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>highest water level from a 19 year history (p5)</p></div><div class="nugget-popup quant"><p>highest level on record from a 19 year history [PAG] (p17)</p></div><div class="nugget-popup quant"><p>2.958m peak level recorded on 8 Nov 2019 (highest in 19&ndash;year record); equivalent to 8.378mAOD (p61)</p></div></div></body></div>`)[0];

                var html_d9f023129ef9951285a4c9c9715381ed = $(`<div id="html_d9f023129ef9951285a4c9c9715381ed" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Don</h1><div class="nugget-popup"><p>Recorded the highest flow rate in a 43&ndash;year record on 8 November 2019, causing floodplain inundation, overtopping of riverside embankments at Bentley and downstream and filling the Bentley Flood Corridor flood storage area. (p5)</p></div><div class="nugget-popup"><p>The Don exceeded defence design standards and overtopped in multiple places (notably at Willow Bridge and near Newton Farm), with overtopping at Willow Bridge for approximately 11 hours. Overtopping water travelled north below a railway underpass tunnel then spread north and east filling low&ndash;lying land, creating flow routes through residential areas (Riviera Parade, Hunt Lane, Yarborough Terrace, Frank Road) and contributing to filling the Bentley Flood Corridor; overtopping upstream/downstream of Stainforth Bridge also contributed to widespread inundation at Fishlake. (p6)</p></div><div class="nugget-popup"><p>River Don experienced flows and levels beyond design standards; water expanded beyond normal containment banks causing widespread inundation of low&ndash;lying ground and properties. [PAG] (p7)</p></div><div class="nugget-popup"><p>River flow and flood level exceeded current design standards of flood protection on the Lower Don, causing widespread flooding to roads and buildings across the Borough of Doncaster. [PAG] (p8)</p></div><div class="nugget-popup"><p>Very high flows on the River Don produced flooding along associated floodplains in Doncaster Borough; the river recorded its highest flow in the available 43&ndash;year record (03:00 on 8 Nov 2019). [PAG] (p17)</p></div><div class="nugget-popup"><p>Recorded the highest flow on record (Doncaster gauge: 03:00 on 8 Nov 2019). Overtopping of riverside embankments occurred at Bentley and at several downstream locations; Bentley Flood Corridor storage filled from the south; significant flooding occurred at Fishlake, Conisbrough and Kirk Bramwith. [PAG] (p18)</p></div><div class="nugget-popup"><p>Overbank flows from the River Don are described as contributing floodwater into the Bentley Flood Corridor, causing the corridor to manage/store flood water and resulting in the potential/subsequent submergence of in&ndash;corridor drainage infrastructure (e.g. Bentley Ings Drain and the Bentley Ings pumping station) when embankment standards are exceeded. [IMG,PAG] (p22)</p></div><div class="nugget-popup"><p>Overtopping of Don defences with flow routed toward low&ndash;lying ground and properties; flood routing along the Don valley including potential overtopping into the Bentley Flood Corridor and/or Ea Beck (exceeding the spillway at Thorpe Marsh). [TAB,PAG] (p25)</p></div><div class="nugget-popup"><p>The River Don was a focus of the Environment Agency assessment of flood flows associated with the weather front and persistent rainfall of 7&ndash;8 November 2019; the Don contributed to significant river flooding in the Doncaster area during the event. [PAG] (p27)</p></div><div class="nugget-popup"><p>The Environment Agency assessment reports significant peak flows on the River Don in November 2019, including the highest&ndash;on&ndash;record peaks at Doncaster (and other locations) and broadly widespread elevated flows across the Don catchment during the event. [PAG,IMG] (p30)</p></div><div class="nugget-popup"><p>A combination of two major rain events produced a major River Don flood that exceeded the design standard of the riverside barrier bank, contributing to two stages of flooding at Bentley (South) and filling the Bentley Flood Corridor from downstream sources. (p38)</p></div><div class="nugget-popup"><p>The River Don experienced a flood that exceeded the design standard of the riverside barrier bank; overtopping occurred at several locations and filled the Bentley Flood Corridor washlands (river flooding largely contained to the corridor). [TAB] (p40)</p></div><div class="nugget-popup"><p>The River Don's capacity and channel form were implicated in the flood mechanism; sections (particularly downstream of Fishlake) have reduced channel width compared with historic maps, and increasing channel capacity was proposed to help manage flood risk during the November event. (p45)</p></div><div class="nugget-popup"><p>Primary source of flooding to Bentley during the November 2019 event; contributed to overtopping threat of the riverside bank and to inundation across the Bentley area, prompting temporary pumping and flood&ndash;management actions. [IMG,PAG] (p48)</p></div><div class="nugget-popup"><p>The River Don to the south of North Bentley is identified as a flood source for the area; eastern parts of Bentley showed the highest estimated flood levels during the event, with levels rising on 9 November 2019. [IMG,PAG] (p49)</p></div><div class="nugget-popup"><p>The hydrology report focused on flood flows on the River Don during the 7&ndash;8 Nov 2019 event; high flows on the Don contributed to flooding in the catchment. (p57)</p></div><div class="nugget-popup"><p>The lower reaches of the Don experienced very high flows with modelled and measured flood levels at the Doncaster location approaching or matching local defended model nodes; measured peak levels near the embankment crest indicate the Lower Don was operating at extreme levels during the event. (p61)</p></div><div class="nugget-popup"><p>Riverside embankment design standard was exceeded and overtopping occurred at multiple locations, causing floodwater to fill the Bentley Flood Corridor. River flooding was generally confined to the Bentley Flood Corridor and did not directly flood Scawthorpe. [PAG] (p64)</p></div><div class="nugget-popup"><p>The River Don rose to its highest recorded levels, prompting multiple severe flood warnings and a major incident; this escalation led to widespread flood damage across Doncaster and close monitoring/response by the council and Environment Agency. [IMG] (p70)</p></div><div class="nugget-popup"><p>The River Don (a main river) is identified as the source of fluvial flood risk to Fishlake; large parts of Fishlake are shown as Flood Zone 3 and the report discusses defences (Riverside Bank / Barrier Bank) and their standard of protection in relation to river flooding. [IMG] (p73)</p></div><div class="nugget-popup"><p>Elevated river flows and river flooding associated with the South Yorkshire weather front (7&ndash;8 Nov 2019). The Environment Agency hydrology report focused on flood flows on the Don and assessed increased flows in the catchment upstream of Doncaster during the event. (p77)</p></div><div class="nugget-popup"><p>A major flood on the River Don exceeded the designed spillway upstream of Stainforth Bridge and caused overtopping of the left Riverside Bank upstream and downstream of Stainforth Bridge, routing water into Westfield and Fishlake and overtopping the Barrier Bank. (p86)</p></div><div class="nugget-popup"><p>The River Don overtopped/contained flows resulting in fluvial flooding through the corridor including inundation in Fishlake; photographed maximum flood extent in Fishlake (Nov 2019) matched the 1% AEP +50% climate change model extent, with observed levels exceeding some modelled scenarios. [PAG] (p91)</p></div><div class="nugget-popup"><p>The River Don has been heavily modified (straightened and re&ndash;routed) and some sections (particularly downstream of Fishlake) show reduced channel width compared with historic maps; these constraints were identified as contributing to flood conveyance problems and increased flood risk, and channel widening/bed lowering was proposed as a mitigation option. [PAG] (p92)</p></div><div class="nugget-popup"><p>High flows and levels on the River Don during 07&ndash;10 Nov 2019 contributed to the pressure on local defences (including the Barrier Bank) and were a primary driver of flooding in Doncaster and Fishlake. (p93)</p></div><div class="nugget-popup"><p>The River Don rose to record/high levels during the event, causing overtopping of the Riverside and Barrier banks, leading to flooding of adjacent agricultural land and Fishlake; the rise and overtopping prompted multiple severe flood warnings and deployment of temporary pumps. [IMG] (p95)</p></div><div class="nugget-popup"><p>River Don exceeded its banks and flooded lower ground in the north part of Conisbrough; flood extent mapped to around the former Castle public house on Minneymoor Hill; high Don levels influenced Kearsley Brook to some degree upstream; floodwaters receded on 9th and were dry by 10th. [TAB,PAG] (p109)</p></div><div class="nugget-popup"><p>The River Don was identified as a strong contributor to local flooding (including Conisbrough and Minneymoor Hill), influencing flood levels and risk to properties during the event. [PAG] (p113)</p></div><div class="nugget-popup"><p>River Don flooding is identified as a principal source of flood risk to areas such as Duftons Close (west side) and as a significant influence on flood risk at Minneymoor Hill. (p114)</p></div><div class="nugget-popup"><p>Significant flood flows in the River Don catchment associated with the weather front of 7&ndash;8 November 2019; the river was a primary focus of the Environment Agency interim hydrology assessment of the event. (p124)</p></div><div class="nugget-popup"><p>Identified as a source of fluvial risk to the Clay Lane community (Jefferson Avenue / Wilberforce Road / Moffat Gardens). The River Don is reported to have a slight tidal influence in this area and, together with Dodge Dike, is the fluvial source referenced in the assessment. Defences were noted to reduce the fluvial flood risk. [IMG] (p139)</p></div><div class="nugget-popup"><p>River Don was high during 07 Nov 2019 &ndash; 10 Nov 2019 and may have slightly influenced flooding by reducing surface water discharge capacity; it is not thought to have directly flooded the specific area under review. [IMG,PAG] (p140)</p></div><div class="nugget-popup"><p>River Don experienced high water levels during 07 Nov 2019 &ndash; 10 Nov 2019; it is not thought to have overtopped and flooded Don View but the elevated river levels likely reduced surface water discharge capacity and thereby contributed to local surface&ndash;water/sewer flooding issues. [IMG,PAG] (p141)</p></div><div class="nugget-popup"><p>High water on the River Don caused direct flooding that affected a terraced row; the report concludes the Don was the most likely source of inundation and that high river levels limited drainage capacity. [TAB,PAG] (p142)</p></div><div class="nugget-popup"><p>High flows on the River Don caused fluvial flooding to the adjacent natural flow route and contributed to inundation of land and properties at Doncaster Road/Denaby Main; area assessed as medium&ndash;high fluvial risk with Flood Zone 3 and no benefiting defences. [IMG] (p145)</p></div><div class="nugget-popup"><p>High water level on the River Don limited drainage capacity and contributed to surface water runoff from the south, which led to flooding affecting properties in the assessed area. [IMG] (p146)</p></div><div class="nugget-popup"><p>Raised River Don water levels were identified as the fluvial source contributing to flooding in Old Denaby; high river levels increased downstream drain levels and exacerbated surface water runoff, leading to property inundation at Ferry Boat Lane. [IMG] (p149)</p></div><div class="nugget-popup"><p>Flooding was reported as being direct from the River Don into the Old Denaby area; high water levels on the Don limited drainage capacity which, combined with surface water ponding and runoff from the south&ndash;west, contributed to inundation of properties. [IMG] (p150)</p></div><div class="nugget-popup"><p>Raised water levels in the River Don (including a noted small tidal influence) contributed to high downstream water levels that limited the capacity of the local drainage network and played a role in the localised flooding observed in Fieldside, Edenthorpe. [IMG] (p157)</p></div><div class="nugget-popup"><p>Elevated water levels on the River Don (including a small tidal influence) increased downstream water levels and contributed to reduced drainage capacity, exacerbating surface water flooding in adjacent areas. [IMG,PAG] (p158)</p></div><div class="nugget-popup"><p>Reported as the source of flooding that affected the assessment area. River Don flooding, possibly with interaction from a local surface&ndash;water flow route, contributed to inundation in the area around Lower Sprotbrough. [IMG] (p160)</p></div><div class="nugget-popup"><p>The Environment Agency reported flooding resulted from high flows in the River Don; these flows (with a noted small tidal contribution and potential interaction with a surface water flow route) caused inundation of nearby areas in Sprotbrough, contributing to property flooding. [IMG,PAG] (p161)</p></div><div class="nugget-popup"><p>High water levels on the River Don (and the receiving Swaithe Dyke) limited drainage from a local surface&ndash;water flow route, contributing to surface water flooding in the Sprotbrough area. [PAG] (p162)</p></div><div class="nugget-popup"><p>The River Don is identified as a primary source of fluvial risk to the area; its elevated levels (with a degree of tidal influence) contributed to flooding and influenced downstream drains, exacerbating inundation of low&ndash;lying land and affecting properties in Thorpe in Balne. [TAB] (p169)</p></div><div class="nugget-popup"><p>High water levels on the River Don during the event limited local drainage outfall capacity and therefore exacerbated surface water ponding and runoff in the nearby area. [TAB,PAG] (p170)</p></div><div class="nugget-popup"><p>High water level and tidal influence on the River Don limited local drainage outfall capacity, contributing to surface water ponding/runoff that led to flooding of a property in Askern. [IMG] (p171)</p></div><div class="nugget-popup"><p>High water level on the River Don (including a tidal influence) contributed to elevated downstream drain levels, which in turn contributed to surface water flooding that affected one property in the Mulberry Avenue area. [IMG] (p175)</p></div><div class="nugget-popup"><p>Tidal influence was present at this location and increased local water levels. The report states the Don was unlikely to be the direct source of the property flooding; the single property flood was instead attributed to a natural overland surface water flow route interacting with buildings, combined with high water levels in downstream drains and the local sewer/drain network. [PAG] (p176)</p></div><div class="nugget-popup"><p>Contributed to high fluvial flood risk in the area (property location shown as Flood Zone 3 on the EA map); raised river/drain levels were identified as influencing downstream drainage capacity and exacerbating local surface water ponding. [IMG] (p185)</p></div><div class="nugget-popup"><p>Acted as a primary source of floodwater during the event; high river levels (at the Don) limited drainage and contributed to localised surface water flooding at and near the confluence with the River Dearne. [TAB] (p186)</p></div><div class="nugget-popup"><p>The River Don produced medium fluvial flooding with a degree of tidal influence at Haggwood (Stainforth), contributing to inundation of the local area (Flood Zone 3) and affecting properties. No flood defences benefit the immediate area. [IMG] (p195)</p></div><div class="nugget-popup"><p>Elevated river/drain levels (and tidal influence at this location) likely compounded localised surface water ponding and reduced drainage outfall capacity, contributing to flooding in the nearby low&ndash;lying area. The report states flooding was unlikely to be direct from the River Don but that high water levels on downstream drains associated with the river likely compounded impacts. [IMG,PAG] (p196)</p></div><div class="nugget-popup"><p>Overtopping and high flows in the River Don caused fluvial flooding across the catchment during 07 Nov 2019&ndash;10 Nov 2019, prompting measures such as raised banks, upstream storage/channel improvements, relocation of overtopping points and use of downstream washlands (Bentley Ings) and pumping to manage floodwater. [TAB] (p198)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>highest flow rate out of a 43 year record; estimated return period of 150&ndash;250 years (p5)</p></div><div class="nugget-popup quant"><p>overtopping at Willow Bridge for approximately 11 hours (p6)</p></div><div class="nugget-popup quant"><p>43&ndash;year record; return period 150 &ndash; 250 years (0.67% &ndash; 0.4% AEP) [PAG] (p17)</p></div><div class="nugget-popup quant"><p>606 properties (p18)</p></div><div class="nugget-popup quant"><p>peak flood level of 10.708mAOD at the Don at Doncaster gauge (p38)</p></div><div class="nugget-popup quant"><p>Flood level estimates in adjacent area: 6.1mAOD rising to 6.5mAOD [IMG] (p49)</p></div><div class="nugget-popup quant"><p>measured peak at Doncaster translated to 10.708mAOD; EA model node peak levels 10.75, 10.93 and 11.53 mAOD for 1%, 0.5% and 0.1% AEP respectively; embankment crest close to gauge 10.54 &ndash; 10.71mAOD (p61)</p></div><div class="nugget-popup quant"><p>5 Severe Flood Warnings; 20 Flood Warnings [IMG] (p70)</p></div><div class="nugget-popup quant"><p>Peak flood level estimated 7.1mAOD at the overtopping point; flood level remained above 7.0mAOD for approximately 40 hours; overtopping occurred along several hundred metres (p86)</p></div><div class="nugget-popup quant"><p>peak flood level 6.867mAOD at Fishlake gauge; ~0.2m higher than the 2018 modelled level for comparable scenarios [PAG] (p91)</p></div><div class="nugget-popup quant"><p>5 Severe Flood Warnings; 20 Flood Warnings; overtopping continued for approximately 40 hours; four temporary pump locations [IMG] (p95)</p></div><div class="nugget-popup quant"><p>Peak flood level approximately 13.9mAOD [TAB,PAG] (p109)</p></div><div class="nugget-popup quant"><p>1 house [TAB,PAG] (p142)</p></div><div class="nugget-popup quant"><p>1 property [IMG] (p145)</p></div><div class="nugget-popup quant"><p>1 house [IMG] (p146)</p></div><div class="nugget-popup quant"><p>3 properties [IMG] (p149)</p></div><div class="nugget-popup quant"><p>three properties [IMG] (p150)</p></div><div class="nugget-popup quant"><p>2 properties [IMG,PAG] (p161)</p></div><div class="nugget-popup quant"><p>2 properties [PAG] (p162)</p></div><div class="nugget-popup quant"><p>1 property [TAB] (p169)</p></div><div class="nugget-popup quant"><p>1 property [TAB,PAG] (p170)</p></div><div class="nugget-popup quant"><p>1 property [IMG] (p175)</p></div><div class="nugget-popup quant"><p>2 properties [IMG] (p195)</p></div><div class="nugget-popup quant"><p>2 properties [IMG,PAG] (p196)</p></div></div></body></div>`)[0];
                popup_caebc2b6898c905de08e5e9b03150e17.setContent(html_d9f023129ef9951285a4c9c9715381ed);

                var html_753ac68881b8b34322d18354deb6dcd6 = $(`<div id="html_753ac68881b8b34322d18354deb6dcd6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Dearne</h1><div class="nugget-popup"><p>Very high flows recorded on the River Dearne associated with the event; gauge at Adwick recorded the second&ndash;highest flow in its 45&ndash;year record (12:00 on 8 Nov 2019). [PAG] (p17)</p></div><div class="nugget-popup"><p>The River Dearne was included in the assessment of flood flows for the South Yorkshire event of 7&ndash;8 November 2019 and contributed to significant river flooding affecting the Doncaster catchment. (p27)</p></div><div class="nugget-popup"><p>The hydrology report assessed flood flows on the River Dearne associated with the 7&ndash;8 Nov 2019 weather front, contributing to catchment flooding. (p57)</p></div><div class="nugget-popup"><p>Elevated river flows and river flooding associated with the South Yorkshire weather front (7&ndash;8 Nov 2019). The hydrology report included flood&ndash;flow assessment on the Dearne as part of the event analysis. (p77)</p></div><div class="nugget-popup"><p>The Environment Agency interim hydrology report focussed on flood flows on the Dearne (alongside the Don and Rother) for the 7&ndash;13 November 2019 South Yorkshire flood, indicating notable river flow/flooding activity in the Dearne catchment during the event. (p101)</p></div><div class="nugget-popup"><p>Significant flood flows in the River Dearne catchment during the 7&ndash;8 November 2019 weather front; included in the Environment Agency's assessment of flood flows for the event. (p124)</p></div><div class="nugget-popup"><p>Elevated levels on the River Dearne are identified as a key fluvial risk driver for the area; high water levels contributed to the reported high flood risk, increasing the likelihood of overbanking and interaction with local surface water flow routes leading to localised ponding and impacts to nearby buildings. [IMG,PAG] (p185)</p></div><div class="nugget-popup"><p>Identified alongside the River Don as the likely source of floodwater at their confluence; contributed to elevated river levels that limited drainage and led to localised surface water flooding in adjacent areas. [TAB] (p186)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>45&ndash;year record; return period 20 &ndash; 30 years (5% &ndash; 3.33% AEP) [PAG] (p17)</p></div></div></body></div>`)[0];

                var html_c693c80588710ac95b3cd576ce759a85 = $(`<div id="html_c693c80588710ac95b3cd576ce759a85" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Rother</h1><div class="nugget-popup"><p>The River Rother was identified as part of the area of intense rainfall and flood assessment (centred on Doncaster, Rotherham and Sheffield) for the 7&ndash;8 November 2019 event and contributed to river flooding in the Rotherham area. (p27)</p></div><div class="nugget-popup"><p>River levels were already elevated from the 25&ndash;26 October 2019 rainfall, particularly in the River Rother and lower River Don reaches, and the elevated Rother flows contributed to the combined peaks experienced on the River Don during the November 2019 event. [PAG] (p30)</p></div><div class="nugget-popup"><p>The hydrology report assessed flood flows on the River Rother during the 7&ndash;8 Nov 2019 event; these flows contributed to flooding in the catchment. (p57)</p></div><div class="nugget-popup"><p>Elevated river levels in the Rother catchments contributed to significant peak flows on the River Don as antecedent rainfall on 25&ndash;26 Oct 2019 left ground saturated prior to the November event. [PAG,MUL] (p61)</p></div><div class="nugget-popup"><p>Elevated river flows and river flooding associated with the South Yorkshire weather front (7&ndash;8 Nov 2019). The hydrology report included the Rother in its assessment of flood flows for the event. (p77)</p></div><div class="nugget-popup"><p>The Environment Agency interim hydrology report focussed on flood flows on the Don, Dearne and Rother associated with the persistent rainfall on 7&ndash;8 November 2019, indicating significant river flooding on the Rother catchment during this event. (p101)</p></div><div class="nugget-popup"><p>Significant flood flows in the River Rother catchment associated with the 7&ndash;8 November 2019 weather front; included in the Environment Agency interim hydrology report assessing flood flows for the event. (p124)</p></div></div></body></div>`)[0];

div><div class="nugget-popup quant"><p>adjacent barrier crest level 10.65mAOD at Willow Bridge; overtopping timeline began ~07:00 and peaked ~12:45 on 8th Nov (p38)</p></div></div></body></div>`)[0];

D for approximately 40 hours; Environment Agency asset crest records 7.33mAOD (upstream stretch downstream end) and 7.29mAOD (downstream stretch upstream end); survey crest ranges 6.98&ndash;7.2mAOD (upstream) and 6.84&ndash;7.02mAOD (downstream). [PAG] (p87)</p></div></div></body></div>`)[0];

es recorded on maps: 4.5mAOD; 4.2mAOD; 6.1&ndash;6.5mAOD [IMG] (p49)</p></div></div></body></div>`)[0];

urned water to the river. (p38)</p></div><div class="nugget-popup"><p>Properties on Frank Road were flooded by floodwater originating from Swaith Dike during the stage 2 phase of the event, causing property&ndash;level inundation and prompting proposals for defence walls to the rear of properties. (p46)</p></div><div class="nugget-popup"><p>Experienced flood risk/impact during the November 2019 event such that flood protection was proposed (via reconfiguration of Swaith Dike) to provide protection to the road. (p198)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>326 flooded properties (Bentley (South)) [TAB] (p33)</p></div><div class="nugget-popup quant"><p>7.13mAOD peak water level [TAB,PAG] (p34)</p></div></div></body></div>`)[0];

barriers were proposed. [PAG] (p134)</p></div><div class="nugget-popup"><p>The Lindrick flood wall overflowed onto Water Lane during the November 2019 event; measures are proposed to manage overflow (create a controlled overtopping point, prevent overtopping elsewhere, enlarge channel opening and use temporary barriers). [TAB] (p198)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>17 properties protected [PAG] (p130)</p></div></div></body></div>`)[0];

r return period); gauge readings became erratic at 11:00 on 07 Nov 2019 [PAG] (p106)</p></div><div class="nugget-popup quant"><p>13 properties [IMG,PAG] (p108)</p></div><div class="nugget-popup quant"><p>13 flooded properties recorded on New Hill / Low Rd [TAB] (p109)</p></div></div></body></div>`)[0];

                var html_516559d4029d143456199626e6a5d34d = $(`<div id="html_516559d4029d143456199626e6a5d34d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Auckley</h1><div class="nugget-popup"><p>Auckley experienced the effects of very high flows on the River Torne during the November 2019 event, with the River Torne recording a record high flow. (p5)</p></div><div class="nugget-popup"><p>The River Torne at Auckley recorded the highest flow on record during the event, indicating extreme river flooding at the location. (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>highest flow from a 45 year record (p5)</p></div><div class="nugget-popup quant"><p>highest flow on record from a 45 year history (p17)</p></div></div></body></div>`)[0];

                var html_03ee7479362c51382f776fd6e6bc4e17 = $(`<div id="html_03ee7479362c51382f776fd6e6bc4e17" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bentley</h1><div class="nugget-popup"><p>Riverside embankments of the River Don overtopped at Bentley, causing flooding and contributing to the filling of the Bentley Flood Corridor flood storage area. (p5)</p></div><div class="nugget-popup"><p>Riverside barrier bank overtopped allowing floodwater to spread north and east through residential areas (via railway underpass/tunnels and Swaith Dike) filling the Bentley Flood Corridor; a second stage of flooding occurred when downstream overtopping (Arksey Ings, Norwood Spillway, Ea Beck) caused the Flood Corridor to fill, reversing flow back into Bentley (South) via rear gardens of Frank Road and causing additional internal flooding to properties that had been spared earlier. Floodwater persisted until pumping late on the 10th/11th removed it. (p6)</p></div><div class="nugget-popup"><p>Bentley was one of the communities in Doncaster borough reported as being affected by widespread flooding during the event; it formed one of the separate sub&ndash;investigations due to locally shared flood causes/mechanisms. (p15)</p></div><div class="nugget-popup"><p>Riverside embankments overtopped at Bentley; the Bentley Flood Corridor storage area filled (from the south) and residents were evacuated as floodwaters affected the settlement. [PAG] (p18)</p></div><div class="nugget-popup"><p>Residents were evacuated from their homes late on 8 Nov and through 9 Nov. Pumping operations and engineered transfers were used to move water from Bentley Ings to Thorpe Marsh washland to create capacity at Bentley; monitoring of Grumble Hirst spillway supported these operations. Military aid was later sought to shore&ndash;up banks of drainage channels east of Bentley and council teams inspected/cleared trash screens and gullies and provided additional sandbags. [PAG] (p19)</p></div><div class="nugget-popup"><p>Bentley is shown on the map located near the southwestern edge of the Humberhead Levels floodplain; the annotation and analysis indicate Bentley was positioned close to areas at risk and therefore vulnerable to incoming flood water during the event. [IMG,PAG] (p24)</p></div><div class="nugget-popup"><p>Bentley is described as being within a level basin with low&ndash;lying land (notably alongside North Swaithe Dyke) susceptible to surface&ndash;water flooding; sewer flooding is linked to surface&ndash;water events (reliant on Yorkshire Water pumping stations and Bentley Ings pumping station downstream); groundwater susceptibility (0&ndash;50%) may also contribute to local flooding tied to River Don/Ea Beck baseflow. [TAB,PAG] (p25)</p></div><div class="nugget-popup"><p>Widespread flooding across Bentley (north and south) and along the North Swaithe Dyke and Swaith Dike corridors; video and council records show extensive local flooding in the south Bentley area and around nearby streets. [MUL] (p27)</p></div><div class="nugget-popup"><p>Widespread flooding in south Bentley during the November 2019 event, specifically affecting the Frank Road, Conyers Road, Cromwell Road, Yarborough Terrace and Hunt Lane area; streets were inundated as shown in video footage and recorded by the Environment Agency and Doncaster Council. [IMG] (p30)</p></div><div class="nugget-popup"><p>Residential areas in Bentley were inundated during the November 2019 event. Doncaster Council recorded 356 properties flooded in the Bentley ward (326 in Bentley South; 30 in Bentley North). Flood mapping and EA surveys identified high water levels across the settlement; Environment Agency gauge readings upstream of the Bentley Flood Corridor rose throughout 7&ndash;10 Nov, peaking at 4.46 mAOD on 10 Nov (highest on record). Local GPS wrack survey and mapping indicated peak surface water levels of about 7.3 mAOD at multiple streets (e.g. Yarborough Terrace, Ings Road, Frank Rd/Conyers Rd). [PAG] (p32)</p></div><div class="nugget-popup"><p>Widespread flooding occurred across the Bentley area: Bentley Flood Corridor held water; flood flows travelled through the railway underpass and along local routes; Bentley Ings pumping station area inundated and penstocks were operated to limit uncontrolled backflow; flood depths and extents were mapped and reduced in the wider residential area by the following day. [TAB] (p34)</p></div><div class="nugget-popup"><p>Overtopping of the River Don (from Willow Bridge and downstream locations) led to flood water entering Bentley (South). Initial overtopping late 7th/early 8th flowed north through the railway underpass and Centurion Europe's car park, then east across low&ndash;lying residential land (Riviera Parade, Hunt Lane, Yarborough Terrace, Frank Road, Conyers Road) into the Bentley Flood Corridor. A second stage from rising downstream levels (Norwood Spillway / Ea Beck filling Thorpe Marsh Reservoir and Bentley Ings Washland) caused the Bentley Flood Corridor to fill, preventing drainage and reversing flows back into Bentley (South) via Swaith Dike and rear gardens of Frank Road, combining with earlier floodwater. Pumping operations (Environment Agency temporary pumps; EA plugged culvert; Fire Service pumping at Frank Road) were used to return water to the river and largely cleared flood water by late 10th/11th. [PAG] (p38)</p></div><div class="nugget-popup"><p>Flooding affected the north part of Bentley on 8 November 2019. Resident reports indicate flooding began at about 15:30 on 8th Nov, rising to about 0.6 m deep by 17:00 and then subsiding rapidly later that day. A cluster of properties (east of the village, near the North Swaithe Dyke corridor) were flooded; aerial photos show the east Bentley Flood Corridor holding water. Flood levels were estimated from footage and photos (see Notes). [PAG] (p39)</p></div><div class="nugget-popup"><p>Residential flooding in Bentley (North): residents reported flooding beginning 15:30 on 8 Nov, rising to around 0.6 m depth by 17:00 and then subsiding later that day. Flooding affected properties close to North Swaithe Dyke where drainage was likely restricted while the Bentley Flood Corridor held water. [TAB] (p40)</p></div><div class="nugget-popup"><p>High downstream water levels combined with rainfall on the upstream catchment reduced drainage conveyance across Bentley, producing ponding and sewer backflows; Yorkshire Water's surface water pumping stations pumped to the Dyke and remained operational throughout the event. [PAG] (p41)</p></div><div class="nugget-popup"><p>The investigation describes flood embankment overtopping routing floodwater into the Bentley Flood Corridor through Bentley (South), causing flooding to private residential dwellings and forming the basis of the risk assessment and proposed management options. (p44)</p></div><div class="nugget-popup"><p>Properties and streets in the Bentley area were flooded during the November event; pumping was required to reduce flood levels in Bentley (South) and to provide drainage capacity for Bentley (North). The Bentley Flood Corridor showed little flood storage west of Bentley Road, contributing to local property flooding. [PAG] (p45)</p></div><div class="nugget-popup"><p>Bentley (South) experienced property flooding from Swaith Dike (stage 2). Bentley (North) experienced flooding linked to heavy local rainfall on low spots combined with high water/submergence of the Bentley Flood Corridor and high levels on North Swaithe Dyke, causing drainage/backflow issues and local inundation. (p46)</p></div><div class="nugget-popup"><p>Bentley (North and South) experienced significant flooding during the 7&ndash;9 November 2019 Doncaster floods driven by high River Don levels and high flows from Ea Beck/drainage network; local flood defences and drainage infrastructure were tested and temporary pumping was deployed to manage flows. [IMG,PAG] (p48)</p></div><div class="nugget-popup"><p>Bentley (North and South) experienced flooding during the November 2019 event: urban and agricultural areas were inundated as shown by mapped blue shaded flood extents; emergency actions (pumping, sandbagging) and subsequent recovery took place in the week following the peak flood. [IMG,PAG] (p49)</p></div><div class="nugget-popup"><p>Overtopping of the River Don occurred at several locations, filling the Bentley Flood Corridor; river flooding was generally confined to this corridor as intended, but the high downstream water levels limited drainage conveyance and caused ponding in low&ndash;lying areas within the Bentley area. [PAG] (p64)</p></div><div class="nugget-popup"><p>Area assessed for flood risk; the Bentley Flood Corridor was described as submerged which raised downstream water levels and reduced drainage capacity, affecting local drainage performance and influencing flooding in nearby Scawthorpe. Pumping and river&ndash;corridor management were recommended. (p67)</p></div><div class="nugget-popup"><p>River Don overtopped and floodwater affected the north part of the town and surrounding washlands; interventions proposed include raised banks on the right bank, use of Bentley Ings for pumping/drainage and reshaping the Bentley Flood Corridor to improve storage and connectivity. [TAB] (p198)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>20 Flood Warnings; 5 Severe Flood Warnings [PAG] (p19)</p></div><div class="nugget-popup quant"><p>1,500 people rendered homeless (historic recollection, 1932) [MUL] (p27)</p></div><div class="nugget-popup quant"><p>356 properties flooded; 326 properties within Bentley (South); 30 properties within Bentley (North); EA gauge peak 4.46mAOD; mapped peak levels ~7.3mAOD (7.35mAOD Yarborough Terrace; 7.39mAOD Ings Road; 7.13mAOD Frank Rd / Conyers Rd). [PAG] (p32)</p></div><div class="nugget-popup quant"><p>326 flooded properties in Bentley (South); mapped flood level of 7.3mAOD used for LiDAR&ndash;derived extents; 6.1mAOD at Bentley Ings Pumping Station; 4.2mAOD on Mill Dyke. [TAB] (p34)</p></div><div class="nugget-popup quant"><p>peak flood level of 10.708mAOD; adjacent barrier crest level 10.71mAOD; 10.65mAOD at Willow Bridge [PAG] (p38)</p></div><div class="nugget-popup quant"><p>20 properties; 9 properties; 0.6 m depth [PAG] (p39)</p></div><div class="nugget-popup quant"><p>20 flooded properties (cluster); 9 flooded properties (scattered); flood depth up to 0.6m [TAB] (p40)</p></div><div class="nugget-popup quant"><p>3 surface water pumping stations (Rostholme, Bentley Central, Piccadilly) operational throughout the event [PAG] (p41)</p></div><div class="nugget-popup quant"><p>Flood level estimates annotated at 4.2mAOD, 4.5mAOD and 6.1&ndash;6.5mAOD in different locations; main event dates 07&ndash;10 Nov 2019 [IMG,PAG] (p49)</p></div></div></body></div>`)[0];
                popup_4b963611d4cb2d1437ea8309dfcda998.setContent(html_03ee7479362c51382f776fd6e6bc4e17);

                var html_dc41de82bab5c6b0e772cd4852e81f8a = $(`<div id="html_dc41de82bab5c6b0e772cd4852e81f8a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Conisbrough</h1><div class="nugget-popup"><p>Notable flooding occurred at Conisbrough from the smaller watercourse Kearsley Brook. (p5)</p></div><div class="nugget-popup"><p>Lower ground in the north part of Conisbrough was inundated when River Don expanded beyond containment banks, flooding properties in that area. (p7)</p></div><div class="nugget-popup"><p>Conisbrough was identified as one of the communities impacted by flooding during the event and was investigated as a separate sub&ndash;report within the borough&ndash;wide investigation. (p15)</p></div><div class="nugget-popup"><p>Significant flooding from the River Don affected Conisbrough, and additional notable flooding occurred from a smaller watercourse (Kearsley Brook). (p18)</p></div><div class="nugget-popup"><p>Doncaster Council recorded 25 properties flooded in Conisbrough in November 2019; clusters of properties and roads experienced flood damage and disruption. [PAG] (p107)</p></div><div class="nugget-popup"><p>Flood extent from the River Don affected the town; properties flooded and flood level estimated at 12.6mAOD at Dufton's Close on 9th November after waters were receding. [IMG,PAG] (p108)</p></div><div class="nugget-popup"><p>River Don overtopped its banks and the floodplain in the north part of Conisbrough, expanding onto lower ground and causing flooding to properties in the northern area; floodwaters receded on 9th November and were dry by 10th November. [PAG] (p109)</p></div><div class="nugget-popup"><p>Properties (primarily private residential dwellings) were affected by flooding related to the River Don. The town had no direct flood protection other than existing flood storage areas on both banks, contributing to the impact during the event. (p113)</p></div><div class="nugget-popup"><p>Fluvial flooding affected properties in Conisbrough (notably the Low Road area). The report records affected properties and recommends property flood resilience surveys and a local flood response plan linked to Environment Agency warnings. (p114)</p></div><div class="nugget-popup"><p>Street&ndash;level flooding affected Duffers Close (Conisbrough) and adjoining areas; recommended works include raised and strengthened perimeter walls, an automatically deployed entrance barrier, protection from Kingfisher Drive flows and drainage backflow protection to prevent repeat flooding to properties. [TAB] (p198)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>25 properties [PAG] (p107)</p></div><div class="nugget-popup quant"><p>25 properties [IMG,PAG] (p108)</p></div><div class="nugget-popup quant"><p>10 properties; 13 properties [PAG] (p109)</p></div></div></body></div>`)[0];

                var html_b71bdf545f53335d9f4fc742f88ddb99 = $(`<div id="html_b71bdf545f53335d9f4fc742f88ddb99" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Tickhill</h1><div class="nugget-popup"><p>Notable flooding occurred in Tickhill caused by the smaller watercourse Paper Mill Dyke overflowing, resulting in local flooding of the community. (p5)</p></div><div class="nugget-popup"><p>A large flood response on Paper Mill Dyke affected the south part of Tickhill. Flood water exceeded bank levels at several places downstream of Worksop Road, altered normal flow paths (cutting the corner of the route through Mill Dam), and caused flows to come out of the channel along Lindrick. Flooding led to inundation of lower parts of the town and flooding of properties. (p7)</p></div><div class="nugget-popup"><p>Tickhill was flooded during the event with flood water driven primarily by Paper Mill Dyke and natural surface&ndash;water flow routes; the town lies outside the Don catchment and tidal influence so local watercourse and surface flow mechanisms caused inundation. (p15)</p></div><div class="nugget-popup"><p>Notable flooding occurred in Tickhill as a result of Paper Mill Dyke overtopping or high flows. (p18)</p></div><div class="nugget-popup"><p>Flooding in the village caused by Paper Mill Dyke inundating parts of Tickhill; the watercourse runs through rear gardens of properties and into Mill Dam, affecting the built area. [PAG] (p119)</p></div><div class="nugget-popup"><p>Paper Mill Dyke is identified as the main flood source affecting the town. A band of Flood Zone 3 follows the dike through Tickhill (areas upstream of main road crossings and the greenspace by Mill Dam are shown as medium&ndash;to&ndash;high river flood risk). The dike channel flows through rear gardens of properties on Lindrick, West Gate, Home Meadows and Dam Road before entering Mill Dam. [IMG,PAG] (p120)</p></div><div class="nugget-popup"><p>Flooding in the town during November 2019: Doncaster Council recorded 22 properties as having been flooded. [PAG] (p128)</p></div><div class="nugget-popup"><p>Flooding concentrated close to Paper Mill Dyke caused by overtopping of a containment wall and &#8216;corner cutting&#8217; flow paths. Residential areas were inundated; flood extent mapped from LiDAR and an estimated flood level of 16.0 mAOD was recorded from video evidence. [IMG,PAG] (p129)</p></div><div class="nugget-popup"><p>Paper Mill Dyke flooded following two major rain events; floodwater exceeded banks downstream of Worksop Road, cut the normal Mill Dam route, and overtopped/escaped via the Mill Dam/Lindrick route. Flooding in the Tickhill area resulted in 22 properties recorded as flooded close to Paper Mill Dyke. Operation of the Lindrick wall and automated sluice is credited with protecting additional properties (estimated 17 properties) that would otherwise have flooded. (p130)</p></div><div class="nugget-popup"><p>Residents experienced flooding impacts during the event; they reported limited assistance beforehand (only a few sandbags, which were reported ineffective), older residents relied on neighbours to deploy sandbags, some residents considered the pond sluice should have been opened in advance, and the council provided post&ndash;flood help and advice. (p133)</p></div><div class="nugget-popup"><p>Flooding associated with Paper Mill Dyke affected at&ndash;risk residents along the route through Tickhill; measures (upstream storage, warning/response) were proposed to reduce peak flows and give residents time to prepare. (p134)</p></div><div class="nugget-popup"><p>The community experienced localised surface water flooding during the event; one property in Tickhill (High Common Lane) was flooded. The area had very low fluvial and no tidal risk, but surface water risk ranged from very low to high due to natural flow routes and constrained drainage by high river levels. [IMG] (p187)</p></div><div class="nugget-popup"><p>The area was identified as a rapid&ndash;response catchment after the November event, prompting assessment of upstream flood storage as part of a distributed Natural Flood Management scheme and the recommendation to implement a community flood response plan and property&ndash;level resilience measures. [TAB] (p198)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>22 properties [PAG] (p128)</p></div><div class="nugget-popup quant"><p>22 properties [IMG,PAG] (p129)</p></div><div class="nugget-popup quant"><p>22 flooded properties; 17 properties protected (p130)</p></div><div class="nugget-popup quant"><p>1 property [IMG] (p187)</p></div></div></body></div>`)[0];

                var html_e90bb76b85fc25c1eb6290ae56a0cb7f = $(`<div id="html_e90bb76b85fc25c1eb6290ae56a0cb7f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Fishlake</h1><div class="nugget-popup"><p>Flooding affected Fishlake, with primary flood risk arising from the River Don combined with tidal influence. (p15)</p></div><div class="nugget-popup"><p>Significant flooding from the River Don occurred at Fishlake; residents were among those evacuated late on 8 November and through 9 November as river levels reached record highs. [PAG] (p18)</p></div><div class="nugget-popup"><p>Residents were evacuated late on 8 Nov and through 9 Nov. Fishlake was a focus for pumping operations (deployed and consolidated on 10 Nov) and additional pumping capacity was brought in on 15 Nov to accelerate drain&ndash;down. The clean&ndash;up operation continued through 17&ndash;18 Nov and beyond due to the quantity and extent of inundation. (p19)</p></div><div class="nugget-popup"><p>Village inundated by river flood following overtopping of the riverside embankment and failure/exceedance of the barrier bank. Residents reported flooding entering the village during the night of 8 November; floodwater flowed east along Trundle Lane and Pinfold Lane and through fields toward Fishlake Nab. By 9 November floodwater had exceeded the Barrier Bank and spread throughout much of the village down to Sour Lane pumping station. [TAB,PAG] (p83)</p></div><div class="nugget-popup"><p>Riverside embankment overtopped; floodwater exceeded the Barrier Bank and spread throughout much of the village, reaching as far as Sour Lane pumping station. Residents reported flooding entering the village during the night of 8th/early hours of 9th; emergency&ndash;services&ndash;led evacuations occurred. Flood flows moved east along Trundle Lane then Pinfold Lane and through fields between Trundle Lane and Fishlake Nab. [PAG] (p84)</p></div><div class="nugget-popup"><p>Overtopping of the left Riverside Bank routed floodwater into Fishlake producing widespread flooding of the village centre and surrounding fields; temporary pumps were deployed in the village; residential area mostly dry by 18th though fields remained flooded north and west of the village. [TAB,PAG] (p86)</p></div><div class="nugget-popup"><p>Flood water overtopping the Riverside Bank spread across agricultural fields and entered the village (residents reported water entering across fields east of Bunny Retreat Mill). Flood then routed onto Trundle Lane and spread east, north and north&ndash;west across the village. [PAG] (p87)</p></div><div class="nugget-popup"><p>River Don flooding affected the village: residents were evacuated; temporary pumping operations were deployed to remove floodwater; community and emergency services provided post&ndash;flood support; many residents reported no flood warning or clear communication prior to evacuation. [PAG] (p90)</p></div><div class="nugget-popup"><p>Fishlake village was inundated by the River Don during the November 2019 event. The measured peak at the Fishlake gauge (6.867mAOD) exceeded modelled levels and photographed maximum flood extent in the village matched the 1% AEP +50% climate change model scenario most closely. The event highlighted shortcomings in the existing model assumptions and led to recommendations to review modelling and consider additional upstream storage and other catchment&ndash;scale flood risk management measures. (p91)</p></div><div class="nugget-popup"><p>Significant flood storage and inundation occurred within and immediately upstream of Fishlake (map observation dated 9 November 2019). Floodwaters were concentrated inside the Fishlake boundary and in upstream low&ndash;lying areas, following river channels and causing the most severe inundation in and around Fishlake. [IMG,PAG] (p92)</p></div><div class="nugget-popup"><p>Properties in the village were flooded during the 07&ndash;10 Nov 2019 event and remained inundated for more than a week before pump&ndash;down activities removed sufficient water; prolonged duration reduced the likely effectiveness of property&ndash;level resilience measures. (p93)</p></div><div class="nugget-popup"><p>Floodwater from the River Don overtopped defences (Riverside and Barrier banks) and spread into low&ndash;lying parts of the village; residents reported flood water entering properties and were instructed to evacuate; temporary pumps were deployed nearby to assist flood management; widespread damage occurred to land and buildings. [IMG] (p95)</p></div><div class="nugget-popup"><p>Fluvial flooding associated with the River Don during the 07 Nov 2019&ndash;10 Nov 2019 event; the impacts at Fishlake informed the post&ndash;event review and led to a recommendation to implement a community flood response plan triggered by upstream flood level sensors. (p198)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>20 Flood Warnings; 5 Severe Flood Warnings (p19)</p></div><div class="nugget-popup quant"><p>173 properties [TAB,PAG] (p83)</p></div><div class="nugget-popup quant"><p>4.2 &ndash; 4.5mAOD by the windmill; 4.0 &ndash; 5.0mAOD (village&ndash;wide estimate) [PAG] (p84)</p></div><div class="nugget-popup quant"><p>173 flooded properties; temporary pumps installed at two locations [TAB,PAG] (p86)</p></div><div class="nugget-popup quant"><p>modelled peak water level 4.9mAOD near Bunny Retreat Mill; containment limit reached 4.5mAOD after 16 hours; identified overspill low point 4.37mAOD; model inflow 21m3/s for 40 hours. [PAG] (p87)</p></div><div class="nugget-popup quant"><p>39 pumps operating; 16 m3 of water per second removed [PAG] (p90)</p></div><div class="nugget-popup quant"><p>peak flood level 6.867mAOD; measured level ~0.2m higher than comparable 2018 modelled peak (p91)</p></div><div class="nugget-popup quant"><p>overtopping continued for approximately 40 hours; four temporary pump locations [IMG] (p95)</p></div></div></body></div>`)[0];

                var html_818e757dda37dbbf58016ce98ba12d59 = $(`<div id="html_818e757dda37dbbf58016ce98ba12d59" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Scawthorpe</h1><div class="nugget-popup"><p>Scawthorpe was reported as affected by flooding during the event and was included as a separate sub&ndash;report to examine locally similar flood causes and impacts. (p15)</p></div><div class="nugget-popup"><p>Residents were evacuated from their homes late on 8 Nov and through 9 Nov as flood warnings were issued for the River Don. (p19)</p></div><div class="nugget-popup"><p>Inferred inundation and flood impact in and around the settlement during the Doncaster Nov 2019 flood event, driven by runoff/downhill flow from higher ground and overflowing local watercourses (map and report context indicate Scawthorpe lies on the edge of the Humberhead Levels flood zone). [IMG,PAG] (p53)</p></div><div class="nugget-popup"><p>Residential streets and properties were flooded; residents reported floodwater arising from manholes in the road and road gulleys. Flooding began on 7 November and persisted through subsequent days, causing disruption to households and roads in the ward. (p62)</p></div><div class="nugget-popup"><p>Residential properties in the Scawthorpe ward were flooded; residents reported flood water arising from manholes in the road and road gulleys, with flooding starting on 7th November and not subsiding until the 8th&ndash;10th November 2019. [PAG] (p63)</p></div><div class="nugget-popup"><p>Although the River Don and Ea Beck did not appear to directly flood Scawthorpe, high water levels on North Swaithe Dyke combined with catchment rainfall and limited downstream drainage led to ponding in low&ndash;lying areas and sewer/network backflow; many residents reported flood water emanating from sewers and properties in low&ndash;lying clusters were affected. [PAG] (p64)</p></div><div class="nugget-popup"><p>Local low&ndash;lying areas in Scawthorpe flooded when heavy rain coincided with a high water level in North Swaithe Dyke, causing backflow into the surface water drainage network and overwhelming drainage capacity; reducing downstream water level (via high&ndash;capacity pumping to River Don or Bentley Flood Corridor) was identified as required to restore drainage continuity. (p67)</p></div><div class="nugget-popup"><p>Low spots and properties flooded when heavy local rainfall coincided with high/flooded levels on North Swaithe Dyke, leading to drainage network backflow and property&ndash;level flooding. The arrangement of affected houses limited the suitability of street&ndash;level mitigation; property flood resilience (PFR) was recommended. [PAG] (p68)</p></div><div class="nugget-popup"><p>Residential areas in Scawthorpe were flooded during the November 2019 event. Flooding was concentrated alongside drainage routes and North Swaithe Dyke; residents reported flood water arising from manholes and road gullies during the event, with floodwaters subsequently beginning to subside. The area is shown as high flood risk (Flood Zone 3) and has no local flood defences. [IMG] (p70)</p></div><div class="nugget-popup"><p>Drainage capacity was reduced when North Swaithe Dyke was high, creating a backflow risk from the fluvial system into the surface water drainage network. Actions recommended included rapid deployment of high&ndash;capacity pumping into the River Don and investigating the interaction between surface water and fluvial systems to prevent backflow to properties. [TAB] (p198)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>20 Flood Warnings; 5 Severe Flood Warnings (p19)</p></div><div class="nugget-popup quant"><p>56 properties (p62)</p></div><div class="nugget-popup quant"><p>56 properties [PAG] (p63)</p></div><div class="nugget-popup quant"><p>Ground generally higher than 5.3mAOD in the area; LiDAR&ndash;based flood level estimate ~6mAOD at the Clevedon Crescent flood cluster with worst&ndash;affected ground at 5.4mAOD. [PAG] (p64)</p></div></div></body></div>`)[0];
