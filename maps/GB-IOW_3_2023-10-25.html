                var html_45715845d9fa784ed88759ba1117fea1 = $(`<div id="html_45715845d9fa784ed88759ba1117fea1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Simeon Recreation Ground</h1><div class="nugget-popup"><p>Surface water was present outside the Recreation Ground's storage area; EA contractors installed two drop boards in each of the three openings to provide additional flood storage (as an initial measure), to reduce flood risk into the Recreation Ground while allowing some surface water flow. [TAB,MUL] (p18)</p></div><div class="nugget-popup"><p>Flowpaths on the map show water moving toward and converging around Simeon Recreation Ground; flood zones are concentrated there. The recreation ground was inundated as part of the event and is shown adjacent to clusters of internal property flooding, indicating it contributed to local inundation pathways. [IMG] (p20)</p></div><div class="nugget-popup"><p>Floodwater filled the flood alleviation scheme at the recreation ground and overtopped flood boards; water then flowed north, east and west from the recreation ground onto adjacent streets, causing property flooding around the ground. (p21)</p></div><div class="nugget-popup"><p>The recreation ground is almost entirely submerged; floodwater has inundated the open recreational area and spread into adjacent streets and lower levels of nearby buildings, surrounding residential blocks and partially submerging vehicles. [IMG] (p22)</p></div><div class="nugget-popup"><p>Reported cases of flooding occurred in the vicinity of the recreation ground (linked to Monktonmead Brook) during the October 2023 event. (p25)</p></div><div class="nugget-popup"><p>Significant pooling of surface water occurred at Simeon Recreation Ground due to surface water runoff. (p27)</p></div><div class="nugget-popup"><p>On the morning of 25 October 2023 fluvial floodwater overtopped Monktonmead Brook and filled the Simeon Recreation Ground; the area (a designated flood storage area surrounded by a 1.3 m high wall with three access points) was used to store floodwater and the EA instructed contractors to install two drop boards in each opening to provide initial storage while allowing surface water flows if needed. (p31)</p></div><div class="nugget-popup"><p>Drop boards (flood gates) were installed at access points; surface water was building up outside the park as boards were installed, and once locked in place they make it harder to remove them quickly to allow surface water to drain into the Recreation Ground. Surface&ndash;water flows from overloaded drainage (manholes/gullies) travel towards the lower&ndash;lying Recreation Ground. [MUL] (p37)</p></div><div class="nugget-popup"><p>Surface water was building up outside the recreation ground; drop boards had been installed at access points to hold back water. EA procedures indicate the river can fill the Recreation Ground up to the 2.3mAOD threshold of the access points in approximately 45 minutes; the two drop boards provided an additional 400 mm of defence height. (p38)</p></div><div class="nugget-popup"><p>Recreation ground extensively flooded; a small building/utility structure was partially submerged with water reaching several feet up its walls. Floodwater covered most of the visible ground and extended to the base of nearby multi&ndash;storey residential buildings, encroaching on residential areas. [IMG] (p39)</p></div><div class="nugget-popup"><p>Flood levels at Simeon Recreation Ground exceeded the top level of the two installed boards, indicating overtopping/exceedance of the protection at that location. (p40)</p></div></div></body></div>`)[0];

                var html_5b6f427285778fdd13deb9f7a19e690c = $(`<div id="html_5b6f427285778fdd13deb9f7a19e690c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Monktonmead Brook</h1><div class="nugget-popup"><p>Identified as a source of flooding contributing to the October 25, 2023 event in Ryde that led to internal property flooding. (p7)</p></div><div class="nugget-popup"><p>The Monktonmead Brook is the main river through the study area toward The Solent and is a focus of investigation (including the operation of the Monktonmead Flood Alleviation Scheme) in relation to the causes of the 25 October 2023 flooding in Ryde. (p9)</p></div><div class="nugget-popup"><p>Monktonmead Brook was a primary watercourse considered in the Section 19 addendum for the Ryde flooding of 25 October 2023 (Storm Babet); the report and follow&ndash;up investigation (including review of the Monktonmead Flood Alleviation Scheme) identify the brook as a key source/pathway for flooding that affected Monktonmead/Simeon Street and wider parts of Ryde. [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>Monktonmead Brook rose to threshold levels, impeding surface water drainage and contributing to flooding: flows pushed out of manholes and gullies towards lower&ndash;lying areas, triggered alarms and led to EA issuing Flood Alert/Warning and directing installation of drop boards at Simeon Recreation Ground. [TAB,MUL] (p18)</p></div><div class="nugget-popup"><p>Rivers in the catchment were rising rapidly and substantial volumes of water flowed down the catchment during the event, contributing to flooding in the area. (p19)</p></div><div class="nugget-popup"><p>Monktonmead Brook is identified on the map as the main watercourse where flood risk is concentrated; flowpaths and Flood Zone shading run along the brook and are associated with internal property flooding nearby. The brook acted as a source/pathway for flooding into adjacent low&ndash;lying areas in the Simeon Street area. [IMG] (p20)</p></div><div class="nugget-popup"><p>Fluvial floodwater exceeded the channel capacity (left bank), contributing to flooding that filled the Monktonmead Flood Alleviation Scheme at Simeon Recreation Ground. (p21)</p></div><div class="nugget-popup"><p>Reported cases of flooding were mostly in the vicinity of Monktonmead Brook; the brook's vicinity (and likely overflow) was a primary location for flooding during the event, contributing to local property flooding around the brook. (p25)</p></div><div class="nugget-popup"><p>On 25 October 2023 fluvial floodwater overtopped Monktonmead Brook and flowed into the Simeon Recreation Ground, contributing to flooding in Ryde. [IMG] (p31)</p></div><div class="nugget-popup"><p>As the main watercourse in the catchment, the brook would have collected runoff from tributaries during the intense 18&ndash;hour rainfall event and conveyed raised flows northward toward downstream areas, increasing flood risk to downstream urban locations. [IMG] (p34)</p></div><div class="nugget-popup"><p>River level reached 1.9mAOD, which impeded surface water drainage into Monktonmead Brook. This contributed to the drainage network overloading and flows emerging from manholes and gullies. (p37)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>107 properties (p7)</p></div></div></body></div>`)[0];

                var html_b8ee0230c0b33412173f6fe538060975 = $(`<div id="html_b8ee0230c0b33412173f6fe538060975" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Isle of Wight</h1><div class="nugget-popup"><p>Experienced heavy rain and associated flooding during Storm Babet (24&ndash;25 October 2023), causing localised surface water flooding and prompting emergency responses across the island. (p17)</p></div><div class="nugget-popup"><p>The documented flood event affected locations on the Isle of Wight (notably Ryde's Simeon Street area) where flowpaths, flood zones and internal property flooding were mapped; assets such as demountable and Marymead flood walls were present and provided some protection. [IMG] (p20)</p></div><div class="nugget-popup"><p>Parts of the Isle of Wight (notably Ryde) experienced combined fluvial and surface water flooding during the 25 October 2023 event; Ryde recorded over 1001 flooded properties. (p31)</p></div><div class="nugget-popup"><p>Much of the Isle of Wight received very high rainfall during the 18&ndash;hour flood event (up to ~91 mm), producing widespread surface&ndash;water runoff and heightened flood risk across the island. [IMG] (p34)</p></div><div class="nugget-popup"><p>Heavy rainfall across Hampshire and the Isle of Wight on 24&ndash;25 Oct 2023 contributed to surface water flooding and overloaded drainage in parts of the island (for example the Simeon Recreation Ground area). [TAB] (p37)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 1001 properties (p31)</p></div></div></body></div>`)[0];

                var html_2b524ce9d493b21664509810793909db = $(`<div id="html_2b524ce9d493b21664509810793909db" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ryde</h1><div class="nugget-popup"><p>Internal flooding of properties across the town; resident displacement, loss of possessions, negative mental and physical health impacts, road closures and damage to the railway line. (p7)</p></div><div class="nugget-popup"><p>Ryde experienced flooding events referenced in the report: it was affected by flooding in 2021 and by the event of 25 October 2023. Properties in Ryde were affected by the October 2023 flooding and may be eligible for Property Flood Resilience grants; the EA published an initial review (10 Nov 2023) and is undertaking a more detailed review into causes of the 25 Oct 2023 flood. [MUL] (p8)</p></div><div class="nugget-popup"><p>Widespread flooding across the town during Storm Babet; the Simeon Street area was disproportionately impacted during the 25 October 2023 event. (p9)</p></div><div class="nugget-popup"><p>Widespread flooding in the town during Storm Babet (25 October 2023). The Monktonmead study area covers a large proportion of Ryde and Simeon Street within Ryde was disproportionately impacted during the 25 October 2023 event; Monktonmead Brook (a main river running through Ryde) is implicated as a contributing watercourse. [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>High tide on the event day peaked at approximately 08:45 with a slower drop in tide level compared to other days; the report states this high tide level likely had an impact on flooding in Ryde. (p16)</p></div><div class="nugget-popup"><p>Intense rainfall associated with Storm Babet caused surface&ndash;water/urban flooding in Ryde that affected residents, prompted the Isle of Wight Council to establish an Information Hub (initially at Ryde Castle Hotel, later at Aspire) to provide advice, guidance and support, and triggered recovery activity with Ryde Town Council. The heavy rain/flooding also contributed to emergency service demand (large number of calls to HIWFRS on 25 October). [TAB,MUL] (p17)</p></div><div class="nugget-popup"><p>Heavy rainfall and raised river levels impeded surface water drainage in Ryde: flows emerged from manholes and gullies, travel along local roads, storage boxes containing drop boards were completely submerged, and areas/roads (route between Newport and Ryde) became impassable. Flood Alerts and Warnings were issued for St Johns/Ryde. [TAB,MUL] (p18)</p></div><div class="nugget-popup"><p>Surface water flooding during heavy rainfall: transport disruption (the road between Newport and Ryde became impassible due to floodwater) and on&ndash;site equipment was submerged (locked storage boxes containing drop boards were completely submerged, preventing installation of additional flood boards). (p19)</p></div><div class="nugget-popup"><p>Flood risk concentrated along Monktonmead Brook and adjacent low&ndash;lying areas within the Simeon Street area of Ryde; flowpaths converge toward the brook and Simeon Recreation Ground, with clusters of internal property flooding shown in central/northern parts of the study area. [IMG] (p20)</p></div><div class="nugget-popup"><p>At least 159 residential and commercial properties in Ryde experienced flooding on 25th October; the majority were internal floodings around Simeon Recreation Ground and neighbouring roads. Local businesses were heavily impacted &mdash; many closed for days, basements were swamped and there were reports of knee&ndash;high water causing significant internal damage and socio&ndash;economic impacts (loss of revenue, concern about damage costs and staff hours). (p21)</p></div><div class="nugget-popup"><p>At least 14 properties across Ryde were flooded during the event. (p22)</p></div><div class="nugget-popup"><p>Widespread flooding across the town during Storm Babet (October 2023) caused residents to move out of homes (temporary or permanent), loss of carpets, floorboards, furniture and other belongings from ground floors and basements, financial pressures on households, and loss of business for a number of local businesses. (p25)</p></div><div class="nugget-popup"><p>Flooding occurred in Ryde on 25 October 2023; properties in the town flooded from different sources and the event prompted the EA to publish an initial review and to undertake further investigation. (p26)</p></div><div class="nugget-popup"><p>Surface water runoff caused flooding that affected properties in Ryde. (p27)</p></div><div class="nugget-popup"><p>On 25 October 2023 intense rainfall and overtopping of Monktonmead Brook caused combined fluvial and surface water flooding in Ryde; over 1001 properties were flooded. [IMG] (p31)</p></div><div class="nugget-popup"><p>Floodwater had submerged the locked storage boxes containing additional drop boards in Ryde, preventing their installation; access was delayed because the road between Newport and Ryde became impassible and the contractor could not reach Ryde until 08:30. (p38)</p></div><div class="nugget-popup"><p>Unprecedented heavy rainfall caused rapid river rises and surface water flooding across Ryde; significant disruption to transport links and property flooding risk. EA did not fully install flood boards at 05:45 on 25.10.2023 which was a material decision related to maintaining a flood route through wall access points and influenced local flood response. (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>107 properties (p7)</p></div><div class="nugget-popup quant"><p>at least 159 properties; at least 80 internal; 8 external; 33 unknown (p21)</p></div><div class="nugget-popup quant"><p>14 properties (p22)</p></div><div class="nugget-popup quant"><p>Community Recovery Grant £500 (households); Business Recovery Grant up to £2,500 (eligible small&ndash;to&ndash;medium businesses); 100% council tax discount for a minimum of three months (flooded households); 100% Business Rate Relief for a minimum of three months (affected businesses) (p25)</p></div><div class="nugget-popup quant"><p>over 1001 properties [IMG] (p31)</p></div></div></body></div>`)[0];
