                var html_decd0a79c43907ef8f2bbc676f8b2c35 = $(`<div id="html_decd0a79c43907ef8f2bbc676f8b2c35" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Larkmead School</h1><div class="nugget-popup"><p>Flooding occurred at the school on 04&ndash;05 January 2024. [PAG] (p1)</p></div><div class="nugget-popup"><p>Floodwater from the Wildmore Brook overtopped its southern bank at three low spots and spread across the very flat northern school boundary into the site. Water entered buildings: the below&ndash;ground boiler room filled (water flowed down the steps and filled to a depth of approximately 1.5m), a heating and utility duct was inundated, the music department building and parts of the sports hall were flooded internally. Floodwater reached an underground power cable causing loss of power to half the school site and the inundation of boiler equipment caused loss of heating. The school closed for two weeks; recovery work continued as of March 2024. (p2)</p></div><div class="nugget-popup"><p>The school site and its critical infrastructure were flooded, triggering a Section 19 investigation because a school (critical infrastructure) was impacted. [PAG] (p6)</p></div><div class="nugget-popup"><p>The school site was flooded during the event; the flood met the threshold for a Section 19 investigation because a school (critical infrastructure) was flooded. [IMG] (p7)</p></div><div class="nugget-popup"><p>Rising watercourses flowing across the site impacted the school; surface water runoff from heavy rainfall also contributed though onsite pumps operated throughout the event. The school's extremely flat ground levels made it prone to inundation. (p15)</p></div><div class="nugget-popup"><p>During the 04 Jan 2024 &ndash; 05 Jan 2024 floods, floodwater from Wildmore Brook entered a low spot on the school site and inundated parts of the grounds; photographic/site&ndash;visit evidence shows the flooding impacted an underground electricity cable on site. (p17)</p></div><div class="nugget-popup"><p>Wildmore Brook overtopped onto the Larkmead School site during the heavy rainfall event of 03&ndash;04 Jan 2024 causing site flooding. Damage and required permanent remediation works recorded at the school include installation of new heating plant, new electrical switchgear and several sub&ndash;mains, renewal of several low&ndash;voltage electrical systems damaged by flooding/power surge, renewal of carpet and vinyl floor coverings where impacted, and provision of new timber structures (now lifted by several inches to improve flood resilience). [PAG] (p31)</p></div><div class="nugget-popup"><p>Wildmore Brook exceeded its capacity and flooded onto the school site during 04 Jan 2024 &ndash; 05 Jan 2024. Flooding was extensive across the school with internal flooding occurring at locations where building thresholds are lower. Debris and litter were observed against downstream culvert/grills adjacent to the site (reported as not increasing flood risk to the school). [PAG] (p32)</p></div><div class="nugget-popup"><p>Floodwater reached the top of the boiler room steps and affected the boiler room; other school buildings (music department, sports hall and additional buildings) were identified as having been impacted or vulnerable and recommended for flood resilience measures. Low&ndash;lying ground and the pump house wall along the school's northern boundary were inundated and recommended to be raised. (p33)</p></div><div class="nugget-popup"><p>Floodwater from Wildmore Brook affected the school site: water reached the boiler room access (recommendation to install a barrier at the top of the boiler room steps), and flood resilience measures were recommended for the music department building, sports hall and other buildings. Low areas of ground and the pump house wall along the northern boundary of the site were affected and are recommended for raising; the school is progressing flood recovery and resilience works. [TAB,PAG] (p34)</p></div><div class="nugget-popup"><p>The school premises were affected by flooding and required recovery support following the event; external recovery support was engaged to assist the school. (p37)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 points; approximately 1.5m (boiler room depth); half the school site (power loss); 2 weeks (school closure); planned recovery work in excess of £300k; total proposed resilience and recovery cost more than £1.2m (p2)</p></div></div></body></div>`)[0];

                var html_921b017c56c07e7a8727de33b263854a = $(`<div id="html_921b017c56c07e7a8727de33b263854a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>The Manor Preparatory School</h1><div class="nugget-popup"><p>The school site is described as having large areas shown at risk from surface water (mainly low risk) and the report states the mapped main river (Larkhill Stream) was not the source of flooding on 04&ndash;05 Jan 2024. The text indicates local drainage features (notably Wildmore Brook with disused bridges) and surface water are likely to have raised water levels adjacent to the school and contributed to the flooding that affected the school site during 04&ndash;05 Jan 2024. [IMG] (p9)</p></div><div class="nugget-popup"><p>Flooding on 04&ndash;05 Jan 2024 caused the school to close for two weeks; flood recovery work was still affecting the running of the school in March 2024. Planned remedial works include relocating the boiler room. [IMG] (p10)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>closure for 2 weeks; more than £1.2m estimated recovery/remedial cost [IMG] (p10)</p></div></div></body></div>`)[0];

                var html_648428b33d707ee4ee7a2df4b61a03b5 = $(`<div id="html_648428b33d707ee4ee7a2df4b61a03b5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Abingdon</h1><div class="nugget-popup"><p>Flooding affected the location on 04&ndash;05 January 2024. (p1)</p></div><div class="nugget-popup"><p>The River Ock at Abingdon gauge recorded exceptionally high river flows (average daily flows over 16 m3/s), far above the long&ndash;term average, indicating a significant river flood event affecting Abingdon around the 04&ndash;05 January 2024 period. [IMG,PAG] (p14)</p></div><div class="nugget-popup"><p>River Ock levels rose following intense rainfall and high catchment runoff, leading to flooding that impacted roads and properties in locations around Abingdon. [IMG,PAG] (p15)</p></div><div class="nugget-popup"><p>River Ock and watercourses flowing into it (including the Wildmore Brook) rose and inundated roads and properties in multiple locations within Abingdon. Larkmead School was specifically impacted by flooding from watercourses across the site and by surface water runoff from the school grounds; the school's surface water pumps continued to operate so the school's own runoff likely made only a small contribution. The site's extremely flat ground levels increase its susceptibility to flooding. [IMG] (p16)</p></div><div class="nugget-popup"><p>Flooding occurred in several parts of Abingdon during 04 Jan 2024 &ndash; 05 Jan 2024 following very heavy rainfall; Wildmore Brook and surface water contributed to inundation of low&ndash;lying areas including the Larkmead School site. (p32)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>average flows of over 16 m3/s on 05 and 06 January 2024 [IMG,PAG] (p14)</p></div><div class="nugget-popup quant"><p>average flows over 16 m3/s recorded at the River Ock at Abingdon gauge on 05 and 06 January 2024 [IMG,PAG] (p15)</p></div></div></body></div>`)[0];
