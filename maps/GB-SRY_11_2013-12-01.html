                var html_1a43e61ce62e8b616c87604bc9fb5932 = $(`<div id="html_1a43e61ce62e8b616c87604bc9fb5932" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Wey</h1><div class="nugget-popup"><p>The storm of 23 December 2013 caused flooding on the River Wey; high flows propagated downstream and produced major high water levels that inundated downstream communities (Godalming, Guildford and lower reaches such as Byfleet, Old Woking and Weybridge). [MUL] (p11)</p></div><div class="nugget-popup"><p>A storm on 23 December produced heavy runoff that caused flooding on the River Wey. River levels rose sharply through Christmas, reaching their highest in the Godalming and Guildford area in the early hours of Christmas Day and peaking on the lower reaches at Byfleet, Old Woking and Weybridge on Boxing Day. River levels rose substantially above normal winter levels and caused flooding of the Wey corridor. [TAB,PAG,MUL] (p12)</p></div><div class="nugget-popup"><p>The River Wey overtopped its banks during the event on 25&ndash;26 December 2013, causing fluvial flooding of adjacent residential properties (Bridge Close, High Road and Weyside Close). Floodwater entered properties from the rear via gardens and from the front/roadway; property flooding began around midday on 25 December and river levels peaked on 26 December 2013. [MUL] (p22)</p></div><div class="nugget-popup"><p>High flows on the River Wey prompted a flood warning for the River Wey at Byfleet; the EA issued a flood warning and deployed ambassadors during the event and subsequently adjusted the flood warning trigger level and began an assessment for larger flood defences. (p23)</p></div><div class="nugget-popup"><p>The River Wey overtopped its banks and was the initial cause of flooding that affected Sanway Road and Sanway Close on 25 December 2013. River water backed up highway drains at Sanway Close and contributed to floodwaters flowing through adjacent fields into the residential area. (p25)</p></div><div class="nugget-popup"><p>Flooding from the River Wey at Byfleet resulted in properties flooding almost immediately after a flood warning was issued. (p26)</p></div><div class="nugget-popup"><p>High river flows on the River Wey triggered a flood warning for the River Wey at Byfleet; evidence from the event led the Environment Agency to adjust the flood warning trigger level. (p27)</p></div><div class="nugget-popup"><p>River Wey levels rose and peaked (reported peak at 08:00 on 25 December 2013), flooded the southern fields (functional floodplain) and backed up the drainage network, contributing to surcharging of gullies and flooding onto the High Street. [PAG] (p28)</p></div><div class="nugget-popup"><p>River Wey experienced river (fluvial) flooding during winter 2013/14 at Guildford; the level observed at Guildford has an estimated return period of 20&ndash;30 years. (p29)</p></div><div class="nugget-popup"><p>High river levels on the River Wey at Old Woking triggered flood warnings during the winter 2013/14 incident and are being investigated as the source of a magnitude event that flooded the residential area, prompting consideration of a larger flood defence scheme. [MUL] (p30)</p></div><div class="nugget-popup"><p>The River Wey at Guildford experienced elevated flows during winter 2013/14; the level of flooding observed on the River Wey at Guildford for that event is estimated to have a return period of 20&ndash;30 years. (p32)</p></div></div></body></div>`)[0];

                var html_a42c928463b94e1102942421b2bab4b4 = $(`<div id="html_a42c928463b94e1102942421b2bab4b4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Blackhorse Road, Woking</h1><div class="nugget-popup"><p>Internal property flooding reported at multiple addresses; road closures recorded during Winter 2013&ndash;14. [TAB] (p2)</p></div><div class="nugget-popup"><p>The Blackhorse Road sub&ndash;area was identified in the report as one of the areas within Woking containing investigation sites that flooded during winter 2013/14 and so experienced flood impacts as part of the borough&ndash;wide event. [IMG] (p10)</p></div><div class="nugget-popup"><p>At the northern section the stream backing up at a culvert under the railway overtopped the bridge level and water flowed down the road under the railway bridge to the stream on the other side; the road was closed for safety. At the central section flooding occurred adjacent to properties caused by excessive rainfall and a blocked outfall in the ditch/pipe network; ditches were full of debris and required maintenance. [MUL] (p19)</p></div><div class="nugget-popup"><p>Local drainage outfall to the highway ditch was blocked by debris, causing drainage ditches to back up and contributing to local surface flooding and surcharge of the highway drainage system; a culvert under Blackhorse Road was identified for investigation to increase capacity. [MUL] (p20)</p></div><div class="nugget-popup"><p>Blackhorse Road was subject to temporary road closures during the winter 2013/14 flooding; there were concerns about a pipe at the north of Blackhorse Road becoming blocked by debris and plans were made to install a trash screen and investigate the culvert under the road to increase capacity or identify additional storage. [PAG] (p21)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Part of 25 sites across six sub&ndash;areas; part of approximately 40 incidents of internal property flooding in Woking [IMG] (p10)</p></div><div class="nugget-popup quant"><p>depth &gt;300mm [MUL] (p19)</p></div></div></body></div>`)[0];

                var html_2477cd874cfd2075646f1d508be5b76f = $(`<div id="html_2477cd874cfd2075646f1d508be5b76f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Woking District</h1><div class="nugget-popup"><p>Internal property flooding reported at multiple addresses; road closures recorded during Winter 2013&ndash;14. [TAB] (p2)</p></div><div class="nugget-popup"><p>Experienced widespread flooding during winter 2013/14 due to unprecedented rainfall: drainage systems and river channels were unable to cope, resulting in internal property flooding and disruption to transport and services. [PAG] (p7)</p></div><div class="nugget-popup"><p>25 sites within the borough were investigated as having flooded during the winter 2013/14 event; the borough experienced approximately 40 incidents of internal property flooding. [IMG] (p10)</p></div><div class="nugget-popup"><p>Flooding associated with the December 2013 (winter 2013/14) event affected parts of Woking (including Woking South). The event involved high flows on tributaries of the River Thames (notably the Hoe Stream and Wey) and resulted in river and localised surface water flooding in the area. [PAG] (p13)</p></div><div class="nugget-popup"><p>Identified as an area particularly affected by the winter 2013/14 flooding; formed a focus of the multi&ndash;agency investigation and response described. (p15)</p></div><div class="nugget-popup"><p>Hosted a high&ndash;capacity underground drainage pipe identified as a key drainage asset and added to the Flooding asset register by SCC as part of post&ndash;event flood risk management following the winter 2013/14 floods. [PAG] (p16)</p></div><div class="nugget-popup"><p>Properties in the Borough experienced internal flooding; sandbags were delivered and evacuations assisted; river levels were monitored; Property Level Protection measures were coordinated and installed to internally flooded properties; debris clearance, ditching and drainage works were undertaken to restore drainage function. (p17)</p></div><div class="nugget-popup"><p>The Hoe Stream at Woking experienced fluvial flooding during winter 2013/14; the event on the Hoe Stream is estimated to have a 5&ndash;15 year return period. [PAG] (p29)</p></div><div class="nugget-popup"><p>Experienced major flooding from fluvial, surface water and sewer sources during winter 2013/14; the River Wey was the main source of fluvial flooding affecting parts of the borough. (p34)</p></div><div class="nugget-popup"><p>Woking was affected by the winter 2013/14 flooding; SCC is undertaking detailed modelling to identify flood alleviation options in Woking (and neighbouring areas) as part of the Rive Catchment Appraisal in response to that event. (p35)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 40 incidents of internal property flooding [PAG] (p7)</p></div><div class="nugget-popup quant"><p>25 sites; 40 incidents of internal property flooding [IMG] (p10)</p></div><div class="nugget-popup quant"><p>20&ndash;30 year return period (recorded for a Guildford tributary) [PAG] (p13)</p></div><div class="nugget-popup quant"><p>40 incidents of internal property flooding (p34)</p></div></div></body></div>`)[0];

                var html_38012c53f4fc3baafb3fd8c0faecb13d = $(`<div id="html_38012c53f4fc3baafb3fd8c0faecb13d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Surrey</h1><div class="nugget-popup"><p>Widespread flooding occurred across the county during winter 2013/14, prompting multiple investigation reports. (p9)</p></div><div class="nugget-popup"><p>Widespread flooding across the county during winter 2013/14 from multiple sources. Groundwater levels in parts of the county rose to record or near&ndash;record levels causing groundwater flooding; river flooding occurred following consecutive storms and saturated ground. [TAB,PAG] (p11)</p></div><div class="nugget-popup"><p>Experienced flooding across the county during winter 2013/14; multi&ndash;agency response activities (EA, TW and others) were carried out across Surrey. [PAG] (p15)</p></div><div class="nugget-popup"><p>Affected by the Winter 2013/14 floods county&ndash;wide: roads were flood&ndash;damaged and assessed for repair under Project 400; Section 19 investigations/reports were produced; highways and drainage clearance (trees, debris, ditching) and sandbag distribution were carried out as part of the response and recovery. (p16)</p></div><div class="nugget-popup"><p>Temporary road closures within the sub area, including Wisley Lane, associated with the flood incident. (p26)</p></div><div class="nugget-popup"><p>A flood warning for the River Wey at Byfleet was issued to over 2,000 people on 25 December 2013; EA ambassadors visited Byfleet between Christmas and New Year and again during high flows in January; the Broad Ditch (a watercourse in the area) is classified as a Main River and was subject to investigation by WBC and the EA to address low bank spots and debris build&ndash;up; the EA completed an initial assessment for a larger flood defence scheme for Byfleet and Weybridge and adjusted the flood warning trigger level for the River Wey at Byfleet. Temporary road closures occurred within the sub area, including Wisley Lane. (p27)</p></div><div class="nugget-popup"><p>Widespread flooding across Surrey during winter 2013/14 due to exceptional rainfall, resulting in major fluvial, surface water and sewer flooding in the county. [PAG] (p34)</p></div><div class="nugget-popup"><p>The winter 2013/14 flood event caused widespread flooding across Surrey. Lack of maintenance of some riparian&ndash;owned ditches was identified as a contributing factor to the impacts of the flooding. [PAG] (p35)</p></div></div></body></div>`)[0];

diately following the warning. (p26)</p></div><div class="nugget-popup"><p>Byfleet received a flood warning for the River Wey; EA ambassadors visited the area between Christmas and New Year and again during high flows in January; recovery and investigation actions (including consideration of larger flood defences) followed. [MUL] (p27)</p></div><div class="nugget-popup"><p>Affected by fluvial flooding from the River Wey during the winter 2013/14 event. (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>part of 25 sites across Woking; contributed to approximately 40 incidents of internal property flooding in Woking [IMG] (p10)</p></div></div></body></div>`)[0];
