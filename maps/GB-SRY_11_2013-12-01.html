                var html_e830862019e987ab6f70f41dfa74fd20 = $(`<div id="html_e830862019e987ab6f70f41dfa74fd20" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Wey</h1><div class="nugget-popup"><p>The River Wey overtopped its banks during the event on 25&ndash;26 December 2013, causing fluvial flooding of adjacent residential properties (Bridge Close, High Road and Weyside Close). Floodwater entered properties from the rear via gardens and from the front/roadway; property flooding began around midday on 25 December and river levels peaked on 26 December 2013. [MUL] (p22)</p></div><div class="nugget-popup"><p>High flows on the River Wey prompted a flood warning for the River Wey at Byfleet; the EA issued a flood warning and deployed ambassadors during the event and subsequently adjusted the flood warning trigger level and began an assessment for larger flood defences. (p23)</p></div><div class="nugget-popup"><p>The River Wey overtopped its banks and was the initial cause of flooding that affected Sanway Road and Sanway Close on 25 December 2013. River water backed up highway drains at Sanway Close and contributed to floodwaters flowing through adjacent fields into the residential area. (p25)</p></div><div class="nugget-popup"><p>Flooding from the River Wey at Byfleet resulted in properties flooding almost immediately after a flood warning was issued. (p26)</p></div><div class="nugget-popup"><p>High river flows on the River Wey triggered a flood warning for the River Wey at Byfleet; evidence from the event led the Environment Agency to adjust the flood warning trigger level. (p27)</p></div><div class="nugget-popup"><p>River Wey levels rose and peaked (reported peak at 08:00 on 25 December 2013), flooded the southern fields (functional floodplain) and backed up the drainage network, contributing to surcharging of gullies and flooding onto the High Street. [PAG] (p28)</p></div><div class="nugget-popup"><p>River Wey experienced river (fluvial) flooding during winter 2013/14 at Guildford; the level observed at Guildford has an estimated return period of 20&ndash;30 years. (p29)</p></div><div class="nugget-popup"><p>High river levels on the River Wey at Old Woking triggered flood warnings during the winter 2013/14 incident and are being investigated as the source of a magnitude event that flooded the residential area, prompting consideration of a larger flood defence scheme. [MUL] (p30)</p></div><div class="nugget-popup"><p>The River Wey at Guildford experienced elevated flows during winter 2013/14; the level of flooding observed on the River Wey at Guildford for that event is estimated to have a return period of 20&ndash;30 years. (p32)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 2,000 people (issued with a flood warning) (p23)</p></div><div class="nugget-popup quant"><p>over 2,000 people (p27)</p></div></div></body></div>`)[0];

                var html_bd8ed6ab883b9f5ed1707687cbb5a8dd = $(`<div id="html_bd8ed6ab883b9f5ed1707687cbb5a8dd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Woking District</h1><div class="nugget-popup"><p>Internal property flooding reported at multiple addresses; road closures recorded during Winter 2013&ndash;14. [TAB] (p2)</p></div><div class="nugget-popup"><p>Experienced widespread flooding during winter 2013/14 due to unprecedented rainfall: drainage systems and river channels were unable to cope, resulting in internal property flooding and disruption to transport and services. [PAG] (p7)</p></div><div class="nugget-popup"><p>25 sites within the borough were investigated as having flooded during the winter 2013/14 event; the borough experienced approximately 40 incidents of internal property flooding. [IMG] (p10)</p></div><div class="nugget-popup"><p>Flooding associated with the December 2013 (winter 2013/14) event affected parts of Woking (including Woking South). The event involved high flows on tributaries of the River Thames (notably the Hoe Stream and Wey) and resulted in river and localised surface water flooding in the area. [PAG] (p13)</p></div><div class="nugget-popup"><p>Identified as an area particularly affected by the winter 2013/14 flooding; formed a focus of the multi&ndash;agency investigation and response described. (p15)</p></div><div class="nugget-popup"><p>Hosted a high&ndash;capacity underground drainage pipe identified as a key drainage asset and added to the Flooding asset register by SCC as part of post&ndash;event flood risk management following the winter 2013/14 floods. [PAG] (p16)</p></div><div class="nugget-popup"><p>Properties in the Borough experienced internal flooding; sandbags were delivered and evacuations assisted; river levels were monitored; Property Level Protection measures were coordinated and installed to internally flooded properties; debris clearance, ditching and drainage works were undertaken to restore drainage function. (p17)</p></div><div class="nugget-popup"><p>The Hoe Stream at Woking experienced fluvial flooding during winter 2013/14; the event on the Hoe Stream is estimated to have a 5&ndash;15 year return period. [PAG] (p29)</p></div><div class="nugget-popup"><p>Experienced major flooding from fluvial, surface water and sewer sources during winter 2013/14; the River Wey was the main source of fluvial flooding affecting parts of the borough. (p34)</p></div><div class="nugget-popup"><p>Woking was affected by the winter 2013/14 flooding; SCC is undertaking detailed modelling to identify flood alleviation options in Woking (and neighbouring areas) as part of the Rive Catchment Appraisal in response to that event. (p35)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 40 incidents of internal property flooding [PAG] (p7)</p></div><div class="nugget-popup quant"><p>25 sites; 40 incidents of internal property flooding [IMG] (p10)</p></div><div class="nugget-popup quant"><p>20&ndash;30 year return period (recorded for a Guildford tributary) [PAG] (p13)</p></div><div class="nugget-popup quant"><p>40 incidents of internal property flooding (p34)</p></div></div></body></div>`)[0];

ater and sewer flooding in the county. [PAG] (p34)</p></div><div class="nugget-popup"><p>The winter 2013/14 flood event caused widespread flooding across Surrey. Lack of maintenance of some riparian&ndash;owned ditches was identified as a contributing factor to the impacts of the flooding. [PAG] (p35)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 2,000 people (p27)</p></div></div></body></div>`)[0];

diately following the warning. (p26)</p></div><div class="nugget-popup"><p>Byfleet received a flood warning for the River Wey; EA ambassadors visited the area between Christmas and New Year and again during high flows in January; recovery and investigation actions (including consideration of larger flood defences) followed. [MUL] (p27)</p></div><div class="nugget-popup"><p>Affected by fluvial flooding from the River Wey during the winter 2013/14 event. (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>part of 25 sites across Woking; contributed to approximately 40 incidents of internal property flooding in Woking [IMG] (p10)</p></div><div class="nugget-popup quant"><p>over 2,000 people (issued with a flood warning) [MUL] (p23)</p></div><div class="nugget-popup quant"><p>over 2,000 people [MUL] (p27)</p></div></div></body></div>`)[0];
