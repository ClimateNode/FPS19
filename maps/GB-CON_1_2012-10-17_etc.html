                var html_7e995b03e586f2f88b74c5f4e4a6a8eb = $(`<div id="html_7e995b03e586f2f88b74c5f4e4a6a8eb" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cornwall</h1><div class="nugget-popup"><p>Heavy and prolonged rainfall, together with storm surge and large swell at times, caused surface water, fluvial and coastal/tidal flooding across the county. Roads and properties were flooded (properties specifically reported in Bugle, St Austell, Penzance, Camborne and Redruth); sea defences were badly damaged at Long Rock; coastal flooding affected Looe, Mevagissey, Fowey and other settlements; tidal flood gates were shut in places (e.g. Truro, Polperro). [MUL] (p1)</p></div><div class="nugget-popup"><p>Widespread flooding across the county: coastal overtopping and wave&ndash;driven flooding of properties on the south coast when spring tides coincided with low pressure and strong south&ndash;easterly winds; widespread river, surface water and groundwater&ndash;related flooding during the late&ndash;December rainfall event (starting 18 Dec and lasting ~2 weeks) affecting many of the same properties flooded in November. [PAG] (p2)</p></div><div class="nugget-popup"><p>Flooding occurred across Cornwall during the late&ndash;November 2012 event. [TAB,PAG] (p5)</p></div><div class="nugget-popup"><p>Widespread flooding occurred across Cornwall during the event; the report records internal flooding of properties in Hessenford as part of this event. [PAG] (p7)</p></div><div class="nugget-popup"><p>Widespread flooding occurred across Cornwall during the late&ndash;November 2012 event; the report states flooding occurred across Cornwall. [PAG] (p9)</p></div><div class="nugget-popup"><p>Widespread flooding occurred across Cornwall during the event; surface water runoff from hillsides and elevated river levels contributed to flooding in the county. [TAB,PAG] (p11)</p></div><div class="nugget-popup"><p>Flooding occurred across Cornwall during the November 2012 event; the incident in Newlyn formed part of this wider flooding. [TAB,PAG] (p13)</p></div><div class="nugget-popup"><p>Flooding occurred across Cornwall during the late&ndash;November 2012 event; widespread elevated river levels and saturated ground contributed to flooding in the area. [TAB,PAG] (p15)</p></div><div class="nugget-popup"><p>Flooding occurred across Cornwall during the event; at least six properties flooded internally. High groundwater, saturated soils and elevated river levels contributed to widespread flooding. [PAG] (p17)</p></div><div class="nugget-popup"><p>River water discharged from a culvert onto the road and then into rear gardens of a terrace of houses in Trenear, causing internal flooding of properties. [TAB,PAG] (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>260 properties [MUL] (p1)</p></div><div class="nugget-popup quant"><p>5 properties (1 commercial, 4 residential) [PAG] (p7)</p></div><div class="nugget-popup quant"><p>five or more properties flooded internally (in Millbrook) [TAB,PAG] (p11)</p></div><div class="nugget-popup quant"><p>five or more properties flooded internally (in Newlyn) [TAB,PAG] (p13)</p></div></div></body></div>`)[0];
