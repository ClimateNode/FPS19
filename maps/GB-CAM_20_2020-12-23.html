                var html_4de0881d149dcbe456eb65bf22edce36 = $(`<div id="html_4de0881d149dcbe456eb65bf22edce36" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Slade Dyke</h1><div class="nugget-popup"><p>Surface water flooding caused internal flooding in the Slade Dyke area, including Field Road and Slade Close; emergency pumping was used to protect properties. [PAG,IMG] (p13)</p></div><div class="nugget-popup"><p>Open section of the dyke exceeded channel capacity; blockages (fly&ndash;tipped waste, security/trash screen blockage and wild&ndash;seeded vegetation) reduced channel storage and caused water to flow overland following the culverted watercourse. This overland flow routed water along Field Road and Slade Close and was the source of downstream property flooding. (p14)</p></div><div class="nugget-popup"><p>Open section exceeded channel capacity due to high flows, culvert/screen blockage (from large volumes of fly&ndash;tipped material and vegetation) and inadequate conveyance, leading to overland flow along the culverted route and inundation of properties on Field Road and Slade Close; Fire Service attended and pumped to protect some properties. [PAG,IMG] (p15)</p></div><div class="nugget-popup"><p>Obstructions at the Slade Dyke trash screen and issues with vegetation, debris and siltation are reducing discharge efficiency into the culvert, causing drainage issues that contribute to local flooding risk and require riparian maintenance. [PAG] (p21)</p></div><div class="nugget-popup"><p>Fly tipping in Slade Dyke exacerbated the rapid&ndash;runoff surface water flooding, worsening flooding impacts in Ramsey. (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 46 properties [PAG,IMG] (p13)</p></div><div class="nugget-popup quant"><p>Approximately 46 properties internally flooded in the Slade Dyke area (area total). [PAG,IMG] (p15)</p></div></div></body></div>`)[0];

                var html_39b1b4be4ebe7b3aa9ce794932fbeb71 = $(`<div id="html_39b1b4be4ebe7b3aa9ce794932fbeb71" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ramsey</h1><div class="nugget-popup"><p>Large areas of Ramsey (north and south) are at risk from fluvial flooding from High Lode; surface water flooding also affects many areas of the town. During the extreme rainfall event on 23 December 2020 the already&ndash;saturated catchment caused flooding in and upstream of the Ramsey area, placing significant pressure on drainage systems and reducing the ability of watercourses, gullies and sewers to discharge. [PAG,IMG] (p8)</p></div><div class="nugget-popup"><p>Extreme rainfall on 23 December 2020 on an already saturated catchment put significant pressure on drainage systems in and upstream of the Ramsey area. Surface water drainage systems were unable to convey water, causing excess surface water to flow over ground and flood properties in areas at risk of surface water flooding; high groundwater also entered property basements. Some flooding occurred within the nearby fluvial flood plain where channel capacity was exceeded. (p9)</p></div><div class="nugget-popup"><p>Local community reported multiple flood incidents to the LLFA: internal and external property flooding across the town, including internal property flooding of residences and flooding of gardens, garages and outbuildings. (p11)</p></div><div class="nugget-popup"><p>Two key flood risk areas within the town (Slade Dyke inc. Field Road and Slade Close; High Street) experienced flooding, resulting in internal and external property flooding across the town. [PAG,IMG] (p13)</p></div><div class="nugget-popup"><p>Significant surface water flooding caused by rapid runoff from prolonged higher&ndash;than&ndash;average autumn rainfall followed by intense rainfall on 23 December 2020; flooding was exacerbated by fly tipping in Slade Dyke. The event prompted actions including highway drainage improvements, completion of new drainage systems, and upholding riparian maintenance responsibilities; Risk Management Authorities and the LLFA committed to ongoing projects and support for Land Drainage Consent applications. (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>26 flood reports; 11 properties reported flooded internally (p11)</p></div><div class="nugget-popup quant"><p>c.52 properties [PAG,IMG] (p13)</p></div></div></body></div>`)[0];
