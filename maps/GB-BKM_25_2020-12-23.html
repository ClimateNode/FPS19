                var html_18b8c2347020db2cf446053e1b6e6009 = $(`<div id="html_18b8c2347020db2cf446053e1b6e6009" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Townsend Pond</h1><div class="nugget-popup"><p>The embanked pond at the western end of the village overtopped on 23 December 2020 (figures in the report show flooding at 13:40 and further overtopping in the evening), discharging excess water via its outlet pipe into the downstream culvert and contributing to flooding in the village. [PAG,IMG] (p15)</p></div><div class="nugget-popup"><p>Townsend Pond overtopped (annotated as occurring at approximately 17:00 on 23 December 2020). The pond is embanked at its eastern end and discharges via a 300mm pipe into a 600mm culvert; the culvert was surcharged and its capacity exceeded during the event, contributing to downstream overland flow and flooding in the village. [PAG] (p34)</p></div><div class="nugget-popup"><p>Townsend Pond overtopped: water rose above the 300mm outlet pipe (visible by 13:40) and, by approximately 17:00, overtopped the overflow structure and the top of the embankment. The overtopping released additional water down Main Street, triggering a second rapid rise in water levels and causing internal flooding of nearby properties. Water levels fell rapidly later that night and flooding had dissipated by 02:00 on 24 December. (p36)</p></div><div class="nugget-popup"><p>Townsend Pond overtopped at approximately 17:00; water overtopped the overflow structure and the top of the embankment and additional water flowed down Main Street, coinciding with a second wave of rainfall and causing rapid rises in water levels that led to internal flooding of nearby properties. As pond levels fell below the embankment later in the event the culverted watercourse allowed the remaining floodwater on the road to drain relatively rapidly, with flooding largely dissipating by about 23:00 and no remaining flooding after 02:00 on 24 December. [IMG,PAG] (p37)</p></div><div class="nugget-popup"><p>A modelled scenario doubling the pond's storage capacity would not have prevented the culvert surcharging during the 23rd December 2020 event because flows from the west were too large. The pond could potentially overtop in extreme events and increased storage might worsen downstream impacts. Management changes (maintaining a clear small channel to the outlet pipe to reduce silt/debris) were agreed. (p44)</p></div><div class="nugget-popup"><p>During the 23 December 2020 event pond water rose above the 300mm outlet pipe and exceeded the overflow route into the 600mm culvert. This caused water to flow over the top of the embankment and down Main Street, contributing to downstream inundation. (p50)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>300mm pipe; 600mm culvert [PAG] (p34)</p></div><div class="nugget-popup quant"><p>doubled storage capacity (scenario tested) (p44)</p></div><div class="nugget-popup quant"><p>300mm outlet pipe (overtopped); 600mm culvert (overflowed) (p50)</p></div></div></body></div>`)[0];
                popup_45110c234fb3590e3be6f48f864db83c.setContent(html_18b8c2347020db2cf446053e1b6e6009);

                var html_d9bbcdda9462b2a812e745de4dd60f7b = $(`<div id="html_d9bbcdda9462b2a812e745de4dd60f7b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Main Street, Tingewick</h1><div class="nugget-popup"><p>A 600 mm culvert conveying discharge from Townsend Pond runs beneath the entire length of Main Street; during the 23 December 2020 event the pond overtopped and routed flows into this culvert and the village surface water system, making the culvert and highway corridor a pathway for floodwater. [PAG,IMG] (p17)</p></div><div class="nugget-popup"><p>Main Street is shown as having a high risk of surface water flooding and flood extents increase downstream of the Main Street culvert where the watercourse becomes open channel. Properties along Main Street experienced flooding during the December 2020 event, with reports that water rose through floors and that shallow groundwater/wells were present in rear gardens (south side of Main Street), suggesting both surface&ndash;water and groundwater pathways affected properties. [PAG] (p23)</p></div><div class="nugget-popup"><p>Manholes surcharged, causing water to flood onto the highway and into gardens. Sandbags were delivered to Main Street and an additional road closure at Main Street was requested by Thames Valley Police during the event. [TAB,PAG] (p32)</p></div><div class="nugget-popup"><p>Received delivered sandbags as part of the flood response, indicating direct exposure to flooding risk during the event. (p33)</p></div><div class="nugget-popup"><p>The 600mm culvert running under the entire length of Main Street was surcharged and its capacity exceeded. Several manholes along Main Street surcharged, blocked gullies prevented surface water draining to the sewer system, and surface water flow along Main Street led to internal property flooding adjacent to the Education Facility and other properties. [PAG,IMG] (p34)</p></div><div class="nugget-popup"><p>Highway gullies on Main Street (which connect to the culverted watercourse) were reported blocked during the event and, because the culvert was overwhelmed on 23 December 2020, the gullies could not drain freely. Water was observed close to the top of manholes in the highway and flows ran down the street from the western end toward the eastern end during the afternoon. (p35)</p></div><div class="nugget-popup"><p>Floodwaters pooled and flowed along Main Street after additional surface water from adjoining downhill roads (including West Well Lane) and after Townsend Pond overtopped. From about 17:00 the overtopping wave caused rapidly rising water that entered properties via front doors and, in some cases, through floors, causing internal flooding. Flooding dissipated later that night and had cleared by 02:00 on 24 December. [PAG] (p36)</p></div><div class="nugget-popup"><p>Significant highway flooding along Main Street; worst affected areas towards the western end of Main Street with deeper external flood depths. The highway flooding led to a road closure being ordered. [PAG] (p38)</p></div><div class="nugget-popup"><p>The culverted watercourse beneath Main Street was found mostly in good condition but had a vegetation blockage (35% obstruction) at its downstream end discharging to the open watercourse; this partial blockage is likely to have slowed discharge and exacerbated flooding during the 23rd December 2020 event. (p39)</p></div><div class="nugget-popup"><p>Surface water flooding occurred around Main Street and West Well Lane during the 23 December 2020 event. The West Well Lane surface water culvert had collapsed prior to the event, causing water to back up; the Main Street culvert (600mm diameter) was generally in good condition. The West Well Lane culvert was later restored and blockages/roots removed. [MUL] (p41)</p></div><div class="nugget-popup"><p>The surface water culvert beneath Main Street surcharged during the 23rd December 2020 event, causing flooding along the street. Modelling indicates that doubling culvert capacity and removing blockages would have reduced flood depths in that event but would not have completely prevented surcharging and consequent flooding; however the increased capacity would prevent surcharging in lower&ndash;order events up to the 1 in 20 annual chance event. (p43)</p></div><div class="nugget-popup"><p>Low property thresholds and several redundant dropped kerbs on Main Street provided flow routes for floodwater, exacerbating internal property flooding; raising kerb heights and removing/raising dropped kerbs is recommended to retain water in the highway and reduce property&ndash;level flooding. (p49)</p></div><div class="nugget-popup"><p>Floodwater flowed along Main Street from the western end during the afternoon of 23 December 2020 as culverts and drainage surcharged. Water from surcharged manholes and the overtopped pond embankment flowed down Main Street, causing pooling and leading to internal flooding of adjacent properties (water entering via rear doors and ground&ndash;floor rooms). The 600mm culvert beneath Main Street was surcharged and its capacity exceeded. (p50)</p></div><div class="nugget-popup"><p>Significant highway flooding along Main Street leading to a road closure being imposed by the Highway Authority. (p51)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>external flood depths 150 &ndash; 600mm; worst affected western end with some properties reporting internal depths up to 300 &ndash; 600mm; road closure implemented within 2&ndash;3 hours [PAG] (p38)</p></div><div class="nugget-popup quant"><p>35% blockage; 1 Grade 3 defect; 5 Grade 4 defects; 0 Grade 5 defects (p39)</p></div><div class="nugget-popup quant"><p>600mm culvert (surcharged and capacity exceeded); internal flood depths typically 75&ndash;200mm with some 300&ndash;600mm; external depths typically 150&ndash;600mm (p50)</p></div></div></body></div>`)[0];
                popup_0ae2a9627f8c5d548010470e5a3b7360.setContent(html_d9bbcdda9462b2a812e745de4dd60f7b);

                var html_a305d179f217e58e18863855f0a6ae58 = $(`<div id="html_a305d179f217e58e18863855f0a6ae58" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>West Well Lane, Tingewick</h1><div class="nugget-popup"><p>Surface water flowed down West Well Lane during the event; the surface water pipe below West Well Lane had collapsed causing a blockage that contributed to local flooding and overland flow. [PAG,IMG] (p34)</p></div><div class="nugget-popup"><p>Initial reports (around 13:00 on 23 December 2020) describe flooding from manholes in rear gardens of properties at the western end of Main Street and West Well Lane due to private drainage backing up from the surcharged culvert and surface water sewer. A collapse and blockage of the surface water sewer on West Well Lane (just upstream of the junction with Main Street) exacerbated flooding, and the street's downhill slope sent additional surface water flows toward Main Street. (p35)</p></div><div class="nugget-popup"><p>The surface water sewer along West Well Lane had a significant partial obstruction (masonry bricks and root growth) at its downstream end where it connects into the Main Street culvert; this obstruction was included in the baseline model to replicate the conditions during the 23rd December 2020 flooding and would have restricted flow, contributing to flooding. The loose bricks and root growth were subsequently removed and the sewer confirmed structurally sound. (p39)</p></div><div class="nugget-popup"><p>Surface water flooding occurred around Main Street and West Well Lane during the 23 December 2020 event. The West Well Lane surface water culvert had collapsed prior to the event, causing water to back up; the Main Street culvert (600mm diameter) was generally in good condition. The West Well Lane culvert was later restored and blockages/roots removed. [MUL] (p41)</p></div><div class="nugget-popup"><p>Private drainage connections surcharged, causing water to flood out from manholes and back up into rear gardens of properties along the western end of Main Street and West Well Lane. The surface water sewer along West Well Lane had collapsed (subsequently repaired), which likely exacerbated local flooding and contributed to internal and external flooding of nearby properties. (p50)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 20 properties; 1 commercial property; 19 residential properties; 6 properties with entire ground&ndash;floor flooded; internal flood depths typically 75&ndash;200 mm (some 300&ndash;600 mm); external depths typically 150&ndash;600 mm (p50)</p></div></div></body></div>`)[0];
                popup_9b2ddd1c453ca8b8c611ebd7247bcfbf.setContent(html_a305d179f217e58e18863855f0a6ae58);

            var icon_284f07b942de737e0a5ce543ff8aa4e8 = L.AwesomeMarkers.icon(

        var popup_4e7def25702f44262b32dfb6c6085f97 = L.popup({});

        
            
                var html_07600f0617c446df2cb0765af12e984c = $(`<div id="html_07600f0617c446df2cb0765af12e984c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Tingewick</h1><div class="nugget-popup"><p>Internal flooding of residential properties within the village. (p4)</p></div><div class="nugget-popup"><p>Internal flooding to residential properties (including basements) within the village; caused significant local impacts and triggered a Section 19 investigation by the Lead Local Flood Authority. [MUL] (p12)</p></div><div class="nugget-popup"><p>The village was affected by flooding during the reported event; the investigation collected mapping, historic flood datasets and sewer CCTV to understand the causes and impacts on the village. (p13)</p></div><div class="nugget-popup"><p>Townsend Pond overtopped on 23 December 2020 (photographic evidence cited at 13:40 and later the same evening), resulting in overflow from the pond. The pond discharges via a 300mm pipe into a 600mm culvert that runs beneath Main Street; overtopping of the pond was observed during the event. [PAG,IMG] (p15)</p></div><div class="nugget-popup"><p>Townsend Pond within the village flooded and overtopped on 23 December 2020; the pond discharges via a 300 mm pipe into a 600 mm culvert that conveys water under Main Street and acted as a pathway for surface water flooding through the village. [PAG,IMG] (p17)</p></div><div class="nugget-popup"><p>Townsend Pond at the western end of the village overtopped on 23 December 2020 (photographs referenced as Figure 8&ndash;2 and Figure 8&ndash;3). The pond discharges via a 300mm pipe into a culvert under Main Street, which is described in the report as part of the drainage route connected to the pond. [PAG,IMG] (p19)</p></div><div class="nugget-popup"><p>During the 23 December 2020 event properties in Tingewick experienced internal flooding with numerous reports of water rising through floors. Groundwater was identified as being shallow in large areas of the village (within 0.025&ndash;0.5 m and 0.5&ndash;5 m of the surface in places) and likely contributed to flooding alongside surface water from local watercourses and pond overtopping. [PAG,IMG] (p23)</p></div><div class="nugget-popup"><p>Tingewick experienced repeated surface&ndash;water flooding events over time, resulting in internal flooding to multiple properties (April 1998, July 2007, 2014). The investigation documents flooding associated with the 23 December 2020 event in the village (including documented pond flooding/overtopping on 23 December 2020). [PAG,IMG,TAB,MUL] (p24)</p></div><div class="nugget-popup"><p>The village was flooded on 23 December 2020; the event prompted the establishment of the Tingewick Flood Response Team and purchase of response equipment (pumps, hoses, dehumidifiers and sandbags) funded by a Buckinghamshire Council grant to support future responses. (p29)</p></div><div class="nugget-popup"><p>On 23 December 2020 intense rainfall over a saturated catchment produced a rapid catchment response; radar and gauge data show substantial rainfall (radar total ~48 mm; local gauge record nearby up to 52 mm) falling on soils with very low moisture deficit (0&ndash;10 mm), which led to rapid runoff and surface&ndash;water/flash flooding across the Tingewick catchment. [PAG] (p30)</p></div><div class="nugget-popup"><p>Flooding in the village on 23 December 2020 from heavy rainfall and rapid catchment response on already&ndash;saturated soils. Residents were affected and received assistance from Buckinghamshire Fire and Rescue Service and Transport for Buckinghamshire. A hydraulic model was used to recreate flood levels and extents; modelled flows implied an approximate return period of over 50 years. [TAB,PAG] (p31)</p></div><div class="nugget-popup"><p>Flood water emerged through manholes and flooded the highway and gardens; internal property flooding occurred (water rising through floors) affecting multiple properties; roads were closed during the event and remaining flood water receded overnight into 24 December. [TAB] (p32)</p></div><div class="nugget-popup"><p>Identified as a significant area of flooding; roads flooded and communities were cut off; local residents used pumps and sandbags to try to protect properties; the Parish Council formed a Tingewick Emergency Response Team and supplied sandbags, pumps and manhole keys for future events; a house fire occurred in Tingewick caused by electrical damage to a boiler directly resulting from the flooding. (p33)</p></div><div class="nugget-popup"><p>Intense rainfall on an already saturated catchment caused the ordinary watercourse to rise rapidly and widespread overland flow through the village. A culvert running under Main Street was surcharged and its capacity exceeded, several manholes along Main Street surcharged, blocked gullies and a collapsed surface water pipe (below West Well Lane) exacerbated flow. Surface water followed Main Street and West Well Lane, leading to internal property flooding (including properties adjacent to the Education Facility). [PAG] (p34)</p></div><div class="nugget-popup"><p>The ordinary watercourse through the village rose rapidly and Townsend Pond and the culverted watercourse were overwhelmed on 23 December 2020. The culvert under Main Street was surcharged and its capacity exceeded, preventing the pond and surface water drainage systems from draining. This led to surcharging of private drainage, manhole flooding in rear gardens, pooling of water in gardens and flows along Main Street from the western toward the eastern end of the village. (p35)</p></div><div class="nugget-popup"><p>Overtopping of Townsend Pond led to floodwater flowing down Main Street and extensive internal and external flooding across the village. At least 20 properties were flooded internally (including one commercial property, The Royal Oak, and 19 residential properties). Many residents were forced into temporary accommodation, reported insurance claims and financial burden, and experienced mental&ndash;health impacts and stress. Internal flooding entered properties through front doors and in some cases through floors; floodwater depths were worst towards the western end of Main Street. Flooding began after pond overtopping around 17:00 and dissipated rapidly from about 23:00, with no remaining flooding after 02:00 on 24 December as the pond level fell and the culverted watercourse drained the road. (p37)</p></div><div class="nugget-popup"><p>Internal and external flooding across the village: extensive internal flooding of properties (including whole&ndash;ground&ndash;floor inundation in worst cases), prolonged drying times for homes, damage to carpets/flooring/furniture, one property&#8217;s boiler damaged by flooding which subsequently caused a house fire. At least some households were displaced or lived on upper floors while repairs occurred. (p38)</p></div><div class="nugget-popup"><p>The culverted watercourse through Tingewick (along Main Street) and connecting surface water sewer were obstructed during the observed flood event, which slowed discharge to the downstream open watercourse. A 35% vegetation blockage was identified at the downstream end of the culvert and the downstream connection from the West Well Lane surface water sewer into the culvert was partially blocked by masonry bricks and root growth; these conditions were reproduced in the hydraulic baseline model for the 23 December 2020 flood. (p39)</p></div><div class="nugget-popup"><p>Surface water flooding affected the village on 23 December 2020; the surface water drainage system was overloaded (model baseline calibrated to reported flood depths for that date). A collapsed culvert on West Well Lane prior to the event caused backing up of water that contributed to the flooding. [PAG] (p41)</p></div><div class="nugget-popup"><p>Flooding from the ordinary watercourse affected the village; modelling of the 23 December 2020 event considered an upstream storage area to the west of the village which, in the model, operates online and captures water from the ordinary watercourse as a mitigation measure. (p42)</p></div><div class="nugget-popup"><p>The surface water/ordinary watercourse culvert through the village was at capacity and surcharged during the 23rd December 2020 event, causing flooding in the village. Modelled results indicate the culvert was overloaded above a 1 in 10 annual chance event and surcharging occurred; very large upstream storage (estimated 15,000&ndash;20,000 m3 for the December 2020 event, ~6,000 m3 for a 1% AEP design event) would have been required to reduce flows. (p44)</p></div><div class="nugget-popup"><p>The ordinary watercourse culvert upstream of the village was overloaded in the 23 December 2020 event, producing flood flows into the village. Floodwater entered many properties through doors and floors; a number of affected properties had suspended timber floors and low&ndash;level airbricks which contributed to internal entry. [PAG] (p45)</p></div><div class="nugget-popup"><p>During the December 2020 event water entered many properties in Tingewick via multiple points, including doors and through floors; many affected properties had suspended timber floors and ground&ndash;level airbricks which contributed to internal ingress and property flooding. (p46)</p></div><div class="nugget-popup"><p>The village experienced flooding on 23 December 2020; the severity was noted to be increased by blockage of highway gullies leading to surface water accumulation and added pressure on the village surface water culvert and receiving watercourse. Balancing ponds associated with the Tingewick Bypass were reviewed and concluded not to have been a significant factor in the village flooding (eastern pond discharges downstream of the village; the western pond was designed with capacity and an outfall limiting discharge). [TAB] (p48)</p></div><div class="nugget-popup"><p>The village experienced rapid flooding on 23 December 2020. The ordinary watercourse rose rapidly and a 600mm culvert beneath Main Street was surcharged, while private drainage connections and manholes surcharged causing water to flood out into rear gardens and back up into properties. At least 20 properties flooded internally (including residential and one commercial property) and a further two properties experienced external or outbuilding flooding. Internal flooding entered mainly via rear doors; many ground&ndash;floor rooms flooded and six properties reported the entire ground floor flooded. One property suffered a fire due to a boiler damaged by floodwater. (p50)</p></div><div class="nugget-popup"><p>Internal flooding affected properties in the village: at least 20 properties flooded internally (including one commercial property, The Royal Oak). Internal flooding was extensive&mdash;at least six properties reported flooding to the entire ground floor and the remainder had flooding to individual rooms on the ground floor. Internal flood depths were typically 75&ndash;200 mm (a small number 300&ndash;600 mm). External flood depths were typically 150&ndash;600 mm. One property suffered a boiler&ndash;related fire caused by flood damage. Highway flooding was significant and mental&ndash;health impacts and community concern about future flooding were reported. [TAB] (p51)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 20 properties (p4)</p></div><div class="nugget-popup quant"><p>at least 20 properties [MUL] (p12)</p></div><div class="nugget-popup quant"><p>at least three properties; at least 11 properties; at least 6 properties [PAG,IMG,TAB,MUL] (p24)</p></div><div class="nugget-popup quant"><p>at least 20 properties; 1 commercial property; 19 residential properties; at least 6 properties with whole ground floor flooded; internal flood depths typically 75&ndash;200 mm (some 300&ndash;600 mm); external flood depths typically 150&ndash;600 mm (p37)</p></div><div class="nugget-popup quant"><p>at least 20 properties flooded internally; 1 commercial property and 19 residential properties; at least six properties reported flooding to the entire ground floor; internal flood depths typically 75 &ndash; 200mm (some 300 &ndash; 600mm); external flood depths typically 150 &ndash; 600mm; internal flooding durations from a few hours to approximately 10 or 11 hours; at least four households moved into temporary accommodation; at least one household still repairing damage by May 2021 (p38)</p></div><div class="nugget-popup quant"><p>35% blockage (p39)</p></div><div class="nugget-popup quant"><p>15&ndash;20,000m3 of storage; 6,000m3 of storage (p44)</p></div><div class="nugget-popup quant"><p>15,000&ndash;20,000 m3; 6,000 m3 [PAG] (p45)</p></div><div class="nugget-popup quant"><p>at least 20 properties; 2 properties (external/outbuildings); 1 commercial property (The Royal Oak); 19 residential properties; 6 properties (entire ground floor flooded); internal flood depths 75&ndash;200mm (typical) with a small number 300&ndash;600mm; external depths typically 150&ndash;600mm (p50)</p></div><div class="nugget-popup quant"><p>at least 20 properties; 1 commercial property (The Royal Oak); 19 residential properties; at least 6 properties reporting flooding to the entire ground floor [TAB] (p51)</p></div></div></body></div>`)[0];
