                var html_ba15079049a7c12e69366a34e5aa59ee = $(`<div id="html_ba15079049a7c12e69366a34e5aa59ee" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Albert Road, Deal</h1><div class="nugget-popup"><p>Residential properties on Albert Road were damaged by the flood event. [IMG] (p1)</p></div><div class="nugget-popup"><p>Road and adjacent residential properties were flooded following heavy rainfall; internal flooding and property damage occurred and vehicles were damaged. [IMG] (p2)</p></div><div class="nugget-popup"><p>Foul sewers surcharged (due to Golf Road pumping station failure) and excess foul and rainwater discharged onto Albert Road; water could not escape quickly and the surface water sewer lacked capacity, resulting in inundation of the road; road drains were subsequently cleared of foul effluent. (p3)</p></div><div class="nugget-popup"><p>Identified as a low point where overland flow from the south is trapped by the railway embankment, creating local flood risk during the flood event; properties here are at risk from surface water/overland flow (noted that properties do not have basements). (p4)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>22 properties [IMG] (p1)</p></div><div class="nugget-popup quant"><p>22 properties flooded internally; approximately 30 cm deep floodwater on the road [IMG] (p2)</p></div></div></body></div>`)[0];
