                var html_bf90e61a19a37abb0bdf3698e189ec1e = $(`<div id="html_bf90e61a19a37abb0bdf3698e189ec1e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cranleigh Waters</h1><div class="nugget-popup"><p>Intense rainfall recorded at the Cranleigh Waters gauge on 23 December 2013 led to extensive flooding on the River Wey, contributing to high river levels that peaked around Christmas Day. (p12)</p></div><div class="nugget-popup"><p>Flood water originating from Cranleigh Waters caused flooding where Station Road crosses the watercourse and caused flooding at a property on Tannery Lane. (p22)</p></div><div class="nugget-popup"><p>Flooding on Cranleigh Waters led to Environment Agency flood warnings for Cranleigh and Shamley Green; property flooding was recorded and flood extents were captured by EA staff. [TAB,MUL] (p23)</p></div><div class="nugget-popup"><p>Fluvial flooding from Cranleigh Waters caused internal property flooding in the Elmbridge Road area. (p27)</p></div><div class="nugget-popup"><p>Rising river levels triggered flood warnings and led to property flooding; flood extents were recorded on the ground by EA staff. [TAB,MUL] (p28)</p></div></div></body></div>`)[0];

                var html_7ec6d96a177953975a66ef01c14c9015 = $(`<div id="html_7ec6d96a177953975a66ef01c14c9015" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Wey</h1><div class="nugget-popup"><p>Extensive river flooding occurred on the River Wey during the 23 December 2013 rainfall event; river levels rose substantially and contributed to flooding in downstream communities (Guildford and Godalming), peaking in the early hours of Christmas Day. (p12)</p></div><div class="nugget-popup"><p>Levels on the River Wey rose again around New Year's Day 2014; although they rose, they did not exceed the peaks reached over Christmas and widespread property flooding did not recur. The Environment Agency estimated the December 2013 peak on the Wey had an annual chance of about 1 in 15&ndash;20 at Godalming and 1 in 20&ndash;30 at Guildford. [MUL] (p13)</p></div><div class="nugget-popup"><p>The River Wey runs through the sub area and is associated with fluvial flooding in the locality; flooding around Elstead Bridge (on the Wey) led to internal flooding of a nearby restaurant and closure of roads during winter 2013/2014. (p29)</p></div><div class="nugget-popup"><p>Heavy rainfall on 23 December 2013 led to rising river levels that peaked in the early hours of 25 December, causing river (fluvial) flooding through central Godalming and contributing to internal flooding of properties; areas such as Catteshall Road and Meadrow were among the first affected. (p33)</p></div><div class="nugget-popup"><p>The Environment Agency issued flood warnings for the River Wey at Godalming, Peasmarsh and Shalford and adjusted the flood&ndash;warning trigger level during the event. [TAB,MUL] (p34)</p></div><div class="nugget-popup"><p>Flooding of the River Wey in the Tilford and Churt sub area during winter 2013/2014 resulted in road closures and internal property flooding in the sub area. (p37)</p></div><div class="nugget-popup"><p>River levels were significantly higher in December 2013; elevated River Wey levels contributed to flooding in the Tilford and Churt sub area. [TAB,PAG] (p38)</p></div><div class="nugget-popup"><p>The River Wey was the main source of fluvial flooding in the area, particularly affecting the Godalming area and resulting in internal property flooding and road closures. (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 restaurant (p29)</p></div><div class="nugget-popup quant"><p>approximately 120 incidents of internal property flooding in Waverley (p40)</p></div></div></body></div>`)[0];

                var html_27136bd51f69019aa2627a52930cccac = $(`<div id="html_27136bd51f69019aa2627a52930cccac" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Waverley</h1><div class="nugget-popup"><p>Internal property flooding at multiple addresses across the borough and road closures during the event. [TAB] (p2)</p></div><div class="nugget-popup"><p>Predominantly fluvial, ordinary watercourse and surface water flooding across the borough that caused internal property flooding; widespread local impacts on properties and communities during the winter 2013/14 event. [PAG] (p7)</p></div><div class="nugget-popup"><p>Sites across the borough flooded during the winter 2013/14 floods, including internal property flooding across the borough. [IMG] (p10)</p></div><div class="nugget-popup"><p>Area within the borough experienced elevated river levels on the River Wey during late December 2013&ndash;January 2014 and was subject to the cumulative effects of prolonged rainfall and rising groundwater that contributed to localised flooding and widespread hydrological stress in the catchment. (p13)</p></div><div class="nugget-popup"><p>The borough was particularly affected during the winter 2013/14 flooding; flood data recorders were sent to locations in the borough (Cranleigh, Elstead, Farnham, Tilford and Churt) to record conditions during the January 2014 floods and local flood risk management actions were undertaken. [MUL] (p16)</p></div><div class="nugget-popup"><p>Experienced flooding during winter 2013/14 leading to inspections and defect repairs of flood&ndash;damaged roads, inclusion of key drainage assets in the Flooding Asset Register, and targeted recovery/resurfacing assessments under Project 400; Thames Water undertook works in the area to reduce future sewer flooding risk. (p17)</p></div><div class="nugget-popup"><p>Waverley Borough Council cleared ditches with riparian owners, investigated and cleared culverts, undertook repairs to culverts, and carried out stream and river bank improvements; engaged in Local Levy funded projects (including Alfold) to reduce flood risk following the winter 2013/14 floods. (p18)</p></div><div class="nugget-popup"><p>Widespread flooding during winter 2013/14 resulted in internal property flooding and road closures across the borough. Notable incidents occurred in the Catteshall area of Godalming, Fisher Rowe Close (Bramley), Clappers Meadow (Alfold) and South Bridge (Chiddingfold). The River Wey was a main source of fluvial flooding, causing internal property floods and road closures in Godalming. (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 120 incidents of internal property flooding [PAG] (p7)</p></div><div class="nugget-popup quant"><p>66 sites; 8 sub areas; approximately 120 incidents of internal property flooding [IMG] (p10)</p></div><div class="nugget-popup quant"><p>approximately 120 incidents of internal property flooding (p40)</p></div></div></body></div>`)[0];

                var html_20d74d5c41aef58728df228a3dd5aadc = $(`<div id="html_20d74d5c41aef58728df228a3dd5aadc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Surrey</h1><div class="nugget-popup"><p>Widespread flooding during winter 2013/14 affected Waverley Borough: 66 sites flooded across 8 sub areas and there were internal property flooding incidents in the borough. (p9)</p></div><div class="nugget-popup"><p>Flooding was widespread across Surrey during the winter 2013/14 period, prompting multiple local investigations and reports. [IMG,PAG] (p10)</p></div><div class="nugget-popup"><p>Widespread flooding across Surrey during winter 2013/14 from a range of sources including groundwater and river flooding following the prolonged heavy rainfall and storm periods in December 2013&ndash;January 2014. (p11)</p></div><div class="nugget-popup"><p>The heaviest rainfall during the period was recorded across Surrey; places in Surrey had been badly affected over Christmas. Prolonged rainfall caused groundwater levels across South East England to rise dramatically, in some areas exceeding previous records and leading to groundwater flooding. (p13)</p></div><div class="nugget-popup"><p>Widespread flooding across the county during winter 2013/14 that required coordinated response: flood alerts/warnings operated, flood risk management assets operated, and mitigation works carried out. The Environment Agency cleared blockages and storm damage and recorded pollution incidents during the event. [PAG] (p16)</p></div><div class="nugget-popup"><p>County council (as LLFA and Highways Authority) inspected flood&ndash;affected roads following the winter 2013/14 floods, produced Section 19 reports for the county, added key drainage assets in Waverley to the Flooding Asset Register, and managed defect repairs and assessments for inclusion in Project 400 (targeted resurfacing and repair of roads damaged by the floods). (p17)</p></div><div class="nugget-popup"><p>Surrey County Council inspected flood&ndash;affected roads, cleansed and re&ndash;opened roads, carried out ditching and clearance of debris and trees, operated a call centre during the floods, attended resident engagement events, hired a Community Resilience Officer, and administered repair works and grants in response to the winter 2013/14 flooding. [PAG] (p18)</p></div><div class="nugget-popup"><p>Exceptional and unprecedented rainfall over December 2013 to February 2014 resulted in major flooding across Surrey from fluvial, surface&ndash;water, ordinary watercourses, sewer and groundwater sources. (p40)</p></div><div class="nugget-popup"><p>The county experienced widespread flooding during winter 2013/14. Lack of maintenance of riparian&ndash;owned ditches and watercourses across Surrey contributed to the impacts of the winter 2013/14 flood event; historic flood data from the event was collected to identify areas most at risk and to prioritise drainage maintenance and flood&ndash;defence scheme work. [PAG] (p41)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>66 sites; approximately 120 incidents of internal property flooding (p9)</p></div><div class="nugget-popup quant"><p>860 blockages and storm damage incidents cleared; 1087 pollution incidents reported; 125 flood Ambassadors visited 95 locations; 70 flood data recorders sent to more than 100 locations [PAG] (p16)</p></div></div></body></div>`)[0];

                var html_111d2fab779eb7e415bdf1d25d3e4478 = $(`<div id="html_111d2fab779eb7e415bdf1d25d3e4478" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Elstead</h1><div class="nugget-popup"><p>Internal property flooding at multiple addresses and road closures were reported in the village during the event. [TAB] (p2)</p></div><div class="nugget-popup"><p>Flood data recorders were deployed to Elstead during the January 2014 flooding. Surrey County Council removed obstructions and carried out repairs on an ordinary watercourse in Elstead and cleansed/restored the area from the highways system to the outfall on Milford Road Elstead. [MUL] (p7)</p></div><div class="nugget-popup"><p>Identified as one of the Waverley sub&ndash;areas addressed by this S19 report of flooding during winter 2013/14. Included among the borough&ndash;wide flooded sites investigated (part of the 66 sites across 8 sub&ndash;areas) and contributed to the overall Waverley total of approximately 120 incidents of internal property flooding. [IMG] (p10)</p></div><div class="nugget-popup"><p>Flood data recorders were sent to Elstead during the January 2014 flooding to record conditions and support response and investigation. (p16)</p></div><div class="nugget-popup"><p>During winter 2013/2014 the Elstead sub area was subject to flooding that resulted in road closures and internal property flooding. Extensive flooding around Elstead Bridge caused internal flooding to a nearby restaurant and led to multiple road closures in the area. Groundwater egress and localised surface water flooding have also occurred around parts of the sub area (notably Orchard Close). (p29)</p></div><div class="nugget-popup"><p>Received multiple flood warnings for the River Wey; temporary road closures occurred in the village (Fulbrook Lane, Upper Springfield Road, Farnham Road, Shackleford Road, Orchard Close, Hill Crest Road); EA sent Flood Data Recorders to verify river levels and record property flooding; SCC removed obstructions and carried out repairs to an ordinary watercourse and cleansed/restored highway drainage on Milford Road. [TAB,MUL] (p30)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>66 sites; 120 incidents of internal property flooding (borough&ndash;wide) [IMG] (p10)</p></div><div class="nugget-popup quant"><p>1 restaurant (p29)</p></div></div></body></div>`)[0];

e Road) were carried out to reduce future flood risk. (p42)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>part of 66 sites in Waverley; part of approximately 120 incidents of internal property flooding in Waverley [IMG] (p10)</p></div></div></body></div>`)[0];

                var html_f32edc057535b04424cc519207ec2cf4 = $(`<div id="html_f32edc057535b04424cc519207ec2cf4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Godalming</h1><div class="nugget-popup"><p>Internal property flooding at multiple addresses and road closures were reported in the town during the event. [TAB] (p2)</p></div><div class="nugget-popup"><p>Godalming North pumping station pumps failed during the event; Thames Water undertook enhancement work on 30 December 2013 and later carried out major repairs to address the failure and associated sewer flooding risk. (p7)</p></div><div class="nugget-popup"><p>Identified on the report map as a sub&ndash;area investigated by the S19 report; included among the Waverley flooded sites examined following the winter 2013/14 floods and contributing to the borough totals of investigated sites and property flooding incidents. [IMG] (p10)</p></div><div class="nugget-popup"><p>River flooding affected the Godalming area during the December 2013 event; gauge at Westbrook Mill (Godalming) recorded an elevated maximum river level in Dec 2013 and the town experienced river level peaks in the early hours of Christmas Day. [TAB] (p12)</p></div><div class="nugget-popup"><p>River Wey levels reached peaks in December 2013 with estimated return periods indicating significant river flood levels; river levels rose again around New Year's Day though did not exceed the Christmas peaks. [PAG] (p13)</p></div><div class="nugget-popup"><p>Godalming experienced pump failure at the Godalming North pumping station during the event; this required repairs on 30 December 2013 and further major repair works thereafter. (p16)</p></div><div class="nugget-popup"><p>Godalming North pumping station pumps failed on 30 December 2013 and Thames Water carried out repairs that day and subsequently completed further major repair works; TW also undertook extensive works on sewerage assets in the Godalming area to reduce the risk of future sewer flooding to properties. [PAG,MUL] (p17)</p></div><div class="nugget-popup"><p>Fluvial flooding of the River Wey through central Godalming caused internal flooding of a large number of properties. Catteshall Road and the Meadrow areas were the first affected. Sewer flooding also affected homes (including incidents prior to 25 December and on 30 December associated with a pump&ndash;station failure). Surface&ndash;water flow routes (e.g. from The Circle toward Wey Court) compounded the impacts of fluvial flooding. [PAG,MUL] (p33)</p></div><div class="nugget-popup"><p>Flood warnings were issued for the River Wey affecting Godalming; the initial river flood warning was issued at 20:48 on 24/12/2013 and the EA adjusted the flood warning trigger level in Godalming during the event. A groundwater flood alert affecting Godalming (and nearby areas) was issued in January 2014. [TAB,PAG,MUL] (p34)</p></div><div class="nugget-popup"><p>Experienced flooding in December 2013 associated with the River Wey; third&ndash;party operators gradually opened weirs in the lead&ndash;up to 24 December (final gate movements at Westbrook Mill on the morning of 25 December 2013); pumping&ndash;station pump failure in Godalming North was fixed by Thames Water on 30 December 2013 and has since been subject to enhancement works to reduce sewer&ndash;flooding risk. [PAG,MUL] (p35)</p></div><div class="nugget-popup"><p>Fluvial flooding from the River Wey caused internal property flooding and road closures in the Godalming area. (p40)</p></div><div class="nugget-popup"><p>Area experienced flooding during the winter 2013/14 event. Lack of maintenance of riparian ditches contributed to the impact. Thames Water reported pumps at Godalming North pumping station failed and undertook enhancement and major repair work (enhancement work on 30 December 2013). The Environment Agency cleared ditches and culverts in the area and is evaluating options for a scheme to reduce flood risk in Godlaming. [MUL] (p41)</p></div><div class="nugget-popup"><p>Area affected by pumping&ndash;station failure (Godalming North) on 30 December 2013 leading to enhancement and repair works; Environment Agency evaluating options for a scheme to reduce flood risk in Godalming. (p42)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>66 sites; 120 incidents of internal property flooding (borough&ndash;wide) [IMG] (p10)</p></div><div class="nugget-popup quant"><p>1 pumping station [PAG,MUL] (p35)</p></div><div class="nugget-popup quant"><p>approximately 120 incidents of internal property flooding in Waverley (area&ndash;wide) (p40)</p></div></div></body></div>`)[0];

ash;wide total of 66 flooded sites; part of approximately 120 incidents of internal property flooding in Waverley [IMG] (p10)</p></div><div class="nugget-popup quant"><p>8 properties (p27)</p></div></div></body></div>`)[0];
