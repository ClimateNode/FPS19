                var html_e374712e24a79968e6e6cef0ff6e53e0 = $(`<div id="html_e374712e24a79968e6e6cef0ff6e53e0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>The Maltings</h1><div class="nugget-popup"><p>The Maltings culvert was identified as a possible restriction and under&ndash;capacity during high flows; its siphon design encourages debris build&ndash;up immediately downstream, contributing to high water levels. EA Operations attended to remove debris; a local resident entered the culvert to remove debris, placing themselves in danger. Two downstream weirs and collected silt further impeded flow. [MUL] (p14)</p></div><div class="nugget-popup"><p>The culvert under The Maltings was partly restricted during the event, reducing conveyance and contributing to elevated local water levels and surface drainage not discharging freely into the river. [PAG] (p19)</p></div><div class="nugget-popup"><p>The culvert located under The Maltings had its flow partly restricted, which prevented rapid discharge of river water, caused backing up of flow at the culvert and reduced the drainage system's ability to convey additional flows, contributing to local flooding. [PAG] (p20)</p></div><div class="nugget-popup"><p>Culvert under The Maltings was partially restricted during high river levels, causing water to back up and impeding flow. (p23)</p></div><div class="nugget-popup"><p>Investigation found a partial flow restriction within the culvert underneath The Maltings which contributed to High Street and garden flooding; removal of an obstruction and subsequent jetting of the culvert substantially restored flow and reduced water levels, ending most of the flooding affecting the High Street. [TAB,MUL] (p24)</p></div><div class="nugget-popup"><p>The culvert under The Maltings was partially restricted, causing water to back up and contributing to local flooding. (p30)</p></div></div></body></div>`)[0];

                var html_fbace082359212692ecbb7be1f03b7e9 = $(`<div id="html_fbace082359212692ecbb7be1f03b7e9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Elephant and Castle</h1><div class="nugget-popup"><p>Basement/internal flooding occurred on and after 17 January 2014 when debris had lodged a flap valve open and river water backed up through a gully onto the High Street. The property was also affected by the more severe flood that began overnight 06&ndash;07 February 2014, with internal flooding continuing for several days. [MUL] (p21)</p></div></div></body></div>`)[0];

                var html_e5597e6c7bdf64510cc7088b8a3e8d9a = $(`<div id="html_e5597e6c7bdf64510cc7088b8a3e8d9a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Misbourne</h1><div class="nugget-popup"><p>River levels were raised by prolonged rainfall and exceptionally high groundwater; a culvert flow restriction caused the River Misbourne to back up and a riverbank collapse occurred, which led to property flooding. (p4)</p></div><div class="nugget-popup"><p>Flow through Old Amersham was physically impeded: the culvert beneath The Maltings had restricted flow and a bank collapse occurred near the Jaguar garage where the channels rejoin, affecting the channel alignment and conveyance through the town. [PAG] (p6)</p></div><div class="nugget-popup"><p>Within Old Amersham the river passes behind properties, through a series of culverts and splits into two channels east of the superstore before rejoining. A culvert beneath The Maltings had restricted flow (location A, SU 95599 97438) and there was a bank collapse near the Jaguar garage on the A355 (location B, SU 96533 96984). These issues are identified as key areas of concern along the River Misbourne through the town. [PAG] (p8)</p></div><div class="nugget-popup"><p>Culvert flow restrictions and bank collapse were identified in Old Amersham where the Misbourne is culverted through the town; these issues contributed to fluvial flooding risks and affected areas where the channel passes under the highway and adjacent properties. [PAG] (p9)</p></div><div class="nugget-popup"><p>Sections of the Misbourne in Old Amersham experienced culvert flow restriction and bank collapse that obstructed channel flow and contributed to local flooding of adjacent areas; the river is culverted through parts of the town and these failures affected flow conveyance. [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>Predicted surface&ndash;water flood depths and extents are concentrated along the river channel in the 1:100 and 1:1000 maps; the river corridor is associated with inundation of low&ndash;lying areas and the town centre and with property/basement flooding events recorded in winter 2000/01 and during the event described in this report. [PAG,MUL] (p12)</p></div><div class="nugget-popup"><p>The River Misbourne produced flows of river water that ran down the High Street, causing garden and property flooding in Old Amersham during multiple events (including winter 2000/1, March 2013, August 2013 and January&ndash;February 2014). [PAG,MUL] (p13)</p></div><div class="nugget-popup"><p>The River Misbourne experienced prolonged high water levels from November 2013 to mid&ndash;February 2014, with two particularly severe flooding events on/around 17 January and 06/07 February 2014. The high river levels and saturated catchment caused the river and highway drainage to be exceeded, contributed to surface and highway runoff, and a riverbank collapse occurred downstream of the Jaguar garage on 07 February 2014, allowing river water to flow into surrounding areas. Sedimentation and weirs downstream of The Maltings impeded flushing and exacerbated conveyance problems. [MUL] (p20)</p></div><div class="nugget-popup"><p>High river levels in the River Misbourne, combined with saturated catchment and large surface runoff, exceeded channel and highway drainage capacity. Riverbank collapse allowed river water to flow into surrounding areas; backing up through drainage gullies contributed to flooding of High Street and nearby properties. A partial culvert restriction reduced conveyance until cleared by the EA. [PAG,MUL] (p21)</p></div><div class="nugget-popup"><p>High river and groundwater levels led to elevated Misbourne flows; a tampered/damaged flap valve allowed river water to back up and flow east along the High Street, and high river levels prevented return flow through downstream valves. (p23)</p></div><div class="nugget-popup"><p>High river levels and a partial flow restriction within a culvert beneath The Maltings caused flooding of gardens and High Street properties in Old Amersham. Removal of an obstruction to a flap valve on 18 January ended the bulk of High Street flooding. A pump was installed on 06 February and jetting of the restricted culvert (11&ndash;12 February) reduced water levels substantially (300 mm drop on 11 Feb and a further 300 mm on 12 Feb) and restored most flow through the culvert. Downstream bank collapse near the Jaguar garage required emergency bank restoration and a boom to protect against pollution. Sandbags and FloodSax were distributed to affected properties. [TAB,PAG,MUL] (p24)</p></div><div class="nugget-popup"><p>Culvert flow restriction and obstructions on the River Misbourne caused flooding of Old Amersham High Street; removal of a flap valve obstruction ended the bulk of High Street flooding. A bank collapse downstream of the Jaguar garage required multi&ndash;agency repair and pollution control. A tree removal downstream lowered water levels and culvert jetting substantially reduced water levels and restored flow; EA planned repairs and later multi&ndash;agency meetings addressed culvert/weir removal to reduce future risk. [PAG,MUL] (p25)</p></div><div class="nugget-popup"><p>Weirs and culvert flow restrictions on the Misbourne were identified as contributing to increased flood risk; a multi&ndash;agency meeting (2 July 2014) led to agreement in principle (mid&ndash;July 2014) between the Environment Agency and riparian owners to remove weirs to reduce flooding risk. [TAB] (p26)</p></div><div class="nugget-popup"><p>The River Misbourne overtopped/caused flooding in winter 2013/14 (January&ndash;February 2014), flooding properties in Old Amersham and prompting recovery actions. The event led to requirements for culvert and gully inspections, clearance of vegetation and debris, installation of trash screens on culverts, and coordination between RMAs and riparian owners to reduce blockages and restore flow. [PAG] (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 residential properties; 5 business premises (p23)</p></div></div></body></div>`)[0];

                var html_340e8ded2d4b7da43363f6535da62fa8 = $(`<div id="html_340e8ded2d4b7da43363f6535da62fa8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Colne</h1><div class="nugget-popup"><p>Groundwater across the Colne catchment was reported as 'exceptionally high' during the flooding period, and saturated soils (SMD = 0 in February 2014) meant continued rainfall produced widespread runoff and elevated river levels across the catchment; the EA treated the three&ndash;month period leading up to 08 March 2014 as a single event because of groundwater influence. [PAG,MUL] (p19)</p></div></div></body></div>`)[0];

                var html_13a211abe6548eeabc630af0e4714752 = $(`<div id="html_13a211abe6548eeabc630af0e4714752" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>High Street, Old Amersham</h1><div class="nugget-popup"><p>A blockage of a drainage asset caused a secondary flow down the High Street, producing flooding of the street. (p4)</p></div><div class="nugget-popup"><p>Properties along the High Street were inundated by flows of river water. Several properties flooded in winter 2000/1; at least one of those properties was flooded internally again during the January&ndash;February 2014 event. A garden backing onto the Misbourne flooded on three occasions prior to 2014 (including March 2013 and August 2013). Two businesses reported that barriers installed after 2000/1 protected their premises during the January&ndash;February 2014 event. [PAG,MUL] (p13)</p></div><div class="nugget-popup"><p>Garden of a household backing onto the River Misbourne was flooded; flows of river water ran down the High Street from west to east during flood events, matching the flows witnessed in the main report event. [PAG,MUL] (p14)</p></div><div class="nugget-popup"><p>High Street gullies designed to discharge to the River Misbourne were partly blocked with sediment and were largely unable to discharge at full capacity because of high water levels in the Misbourne, reducing highway drainage capacity and contributing to surface water/urban flooding of the highway and surrounding area. (p20)</p></div><div class="nugget-popup"><p>On and after 17 January 2014 the High Street was flooded (road and above kerb line) when a flap valve was blocked, causing river water to back up through a nearby gully and flow eastward along the street; water entered basements (notably the Elephant and Castle pub). Parking and movement of temporary defences affected flow paths. The most severe event overnight 06&ndash;07 February 2014 caused internal flooding of properties along the High Street for several days. The primary cause included a partial culvert restriction under The Maltings; EA bypass pumping and culvert jetting (from 12 Feb 2014) removed the restriction and halted further flooding. [PAG,MUL] (p21)</p></div><div class="nugget-popup"><p>Water from the River Misbourne backed up and flowed eastward down the High Street; highway drainage was overwhelmed. Business activities were indirectly affected by impacts to parking and pavement use by customers. [PAG] (p23)</p></div><div class="nugget-popup"><p>The High Street experienced flooding driven by high river levels and a culvert/flap&ndash;valve obstruction; sandbags and FloodSax were distributed to protect at&ndash;risk properties; removal of the flap&ndash;valve obstruction on 18 January ended the bulk of the flooding; ATC cleared debris in a High Street property's garden and responders door&ndash;knocked to update residents. [TAB,PAG,MUL] (p24)</p></div><div class="nugget-popup"><p>High Street was flooded due to a culvert / flap&ndash;valve obstruction on the River Misbourne. Agencies removed the flap&ndash;valve obstruction which ended the bulk of the High Street flooding; pumps were installed to alleviate flooding; sandbags and FloodSax were distributed and residents door&ndash;knocked; debris in the garden of one High Street property was cleared. [PAG] (p25)</p></div><div class="nugget-popup"><p>Water from the River Misbourne backed up (after tampering/damage to a flap valve) and flowed eastward down the High Street; high river levels then prevented return flow through downstream valves, prolonging flooding on the High Street. (p30)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least one property; two businesses; three occasions [PAG,MUL] (p13)</p></div><div class="nugget-popup quant"><p>1 property (Elephant and Castle pub basement) [PAG,MUL] (p21)</p></div><div class="nugget-popup quant"><p>one property [TAB,PAG,MUL] (p24)</p></div><div class="nugget-popup quant"><p>200 sandbags; one High Street property [PAG] (p25)</p></div></div></body></div>`)[0];

                var html_f3af948715e59dd4b34c701703e73e13 = $(`<div id="html_f3af948715e59dd4b34c701703e73e13" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Mill Lane, Old Amersham</h1><div class="nugget-popup"><p>The culvert at Mill Lane was included among the TfB culverts implicated in flow restrictions during the flood event and is identified for continued inspection and maintenance to reduce future flood risk. [TAB,PAG] (p31)</p></div><div class="nugget-popup"><p>Culverts in the stretch from Mill Lane to the culvert under the A413 were implicated in the flooding response: they were identified for increased inspection and maintenance and for cleansing to remove blockages affecting highway drainage. Actions specified include inspections of culverts ≥900mm, jetting of drains and gullies and prioritised repair of detected flow restrictions to reduce recurrence. (p32)</p></div></div></body></div>`)[0];

                var html_132b7165c6e3e0ae197c51cd84a472e9 = $(`<div id="html_132b7165c6e3e0ae197c51cd84a472e9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Buckinghamshire</h1><div class="nugget-popup"><p>Old Amersham (in Buckinghamshire) experienced flooding during the January&ndash;February 2014 event; the report investigates that flooding and provides recommendations to Risk Management Agencies to prevent a repeat. [PAG] (p3)</p></div><div class="nugget-popup"><p>High river levels and a partial culvert flow restriction in Old Amersham caused flooding of the High Street and gardens; residents and businesses reported internal flooding of properties. Removal of an obstruction to a flap valve ended the bulk of High Street flooding. A bank collapsed downstream of the Jaguar garage and was restored in a multi&ndash;agency response. Emergency measures across the county included sandbag and FloodSax distribution, pump installation to alleviate culvert&ndash;caused flooding, culvert jetting to restore flow and multi&ndash;agency coordination. [TAB] (p24)</p></div><div class="nugget-popup"><p>Old Amersham (within Buckinghamshire) experienced High Street flooding caused by a partial culvert flow restriction under The Maltings and an obstructed flap valve. Properties and gardens were at risk and received sandbags/FloodSax and door&ndash;to&ndash;door updates; a pump was installed to relieve flooding; a bank collapse downstream of the Jaguar garage was repaired (restoration work to the river bank); a storm drain overflow blockage near the superstore was cleared; jetting of the culvert reduced water levels and restored flow. (p25)</p></div></div></body></div>`)[0];

                var html_10ed99975bca9f0b908ddcbac3dbb9a1 = $(`<div id="html_10ed99975bca9f0b908ddcbac3dbb9a1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hertfordshire</h1><div class="nugget-popup"><p>Hatfield Area Incident Room opened to respond to widespread flooding across the EA Hertfordshire and North London area; EA issued newsletters to residents informing of high river levels and investigations. (p24)</p></div></div></body></div>`)[0];

                var html_4751ede9d94aa470974a1647992cc5f5 = $(`<div id="html_4751ede9d94aa470974a1647992cc5f5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Old Amersham</h1><div class="nugget-popup"><p>Town experienced elevated river levels and backing up of the River Misbourne after prolonged above&ndash;average rainfall and exceptionally high groundwater levels. A culvert flow restriction caused the river to back up; a blockage of a drainage asset produced a secondary flow down the High Street; a riverbank collapse caused property flooding in the town. (p4)</p></div><div class="nugget-popup"><p>Internal flooding of business premises and flooding of residential properties within the Old Amersham area. [PAG] (p5)</p></div><div class="nugget-popup"><p>The River Misbourne runs west&ndash;east through Old Amersham; flood&ndash;related issues were recorded within the town including a restricted culvert under The Maltings and a bank collapse near the Jaguar garage that affected the river channel behind houses on the northern side of the High Street and along the southern edge of Barn Meadow Recreation Ground. [PAG] (p6)</p></div><div class="nugget-popup"><p>River Misbourne runs west&ndash;east through Old Amersham passing behind houses on the northern side of the High Street and along the southern edge of Barn Meadow. Within the town a culvert under The Maltings had a restricted flow (location A, SU 95599 97438) and there was a bank collapse near the Jaguar garage on the A355 (location B, SU 96533 96984). Highway gullies in Old Amersham connect to the surface water drainage system which discharges to the River Misbourne and the road drainage along the High Street flows into the river. [IMG,PAG] (p8)</p></div><div class="nugget-popup"><p>Culvert flow restrictions and bank collapse locations were recorded in the town; highway gullies and the surface water drainage network (owned by TfB) discharge to the Misbourne, linking surface water drainage failure to local flooding in Old Amersham. [PAG] (p9)</p></div><div class="nugget-popup"><p>Locations within Old Amersham suffered culvert flow restriction and a bank collapse that obstructed flow through culverted sections beneath the town and contributed to local flooding; highway gullies along the High Street drain into the Misbourne and are connected to surface water drainage that influenced flood routing. [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>Properties on the High Street were flooded; at least one property flooded internally during the event described in this report (January&ndash;February 2014). Basement flooding and flooding to the rear of St Mary's Church occurred in winter 2000/01. Two businesses reported that flood barriers installed after 2000/01 protected their premises during the later event. [IMG,PAG,MUL] (p12)</p></div><div class="nugget-popup"><p>The River Misbourne overtopped/flowed through Old Amersham causing floodwaters to run down the High Street (west to east). Several properties on the High Street were flooded in the winter 2000/01 event (including basement flooding and flooding to the rear of St Mary&#8217;s Church). During the January&ndash;February 2014 event at least one property on the High Street was flooded internally again; two businesses reported their post&ndash;2000/01 flood barriers protected their premises during the 2014 event. A household with a garden backing onto the river reported garden flooding on three prior occasions, including March 2013 and August 2013, with similar river flows down the High Street as observed in the 2014 event. [PAG,IMG,MUL] (p13)</p></div><div class="nugget-popup"><p>Properties in Old Amersham experienced flooding associated with elevated river levels during peaks on 07&ndash;08 February 2014. (p17)</p></div><div class="nugget-popup"><p>Prolonged flooding from November 2013 to mid&ndash;February 2014. Internal property flooding began around 17 January 2014 when a flap valve was lodged open by debris, causing river water to back up through a gully and flow down the High Street into basements (including the Elephant and Castle pub). The most severe event occurred overnight 06&ndash;07 February 2014, with several properties along the High Street flooded internally for days. A partial flow restriction in a culvert (under The Maltings) reduced conveyance; EA installed bypass pumping and jetted the culvert (12 February 2014) which stopped further flooding. [PAG,MUL] (p21)</p></div><div class="nugget-popup"><p>Old Amersham experienced flooding caused by a partial flow restriction in a culvert beneath The Maltings and high river levels on the River Misbourne; EA and CDC investigated and responded (sandbag/FloodSax distribution, pump installation, jetting to clear culvert); a bank collapse downstream of the Jaguar garage was repaired as a multi&ndash;agency action and a tree removal lowered water levels downstream. [TAB,PAG,MUL] (p24)</p></div><div class="nugget-popup"><p>Old Amersham experienced flooding caused by a partial flow restriction in a culvert under The Maltings on the River Misbourne. EA and CDC distributed sandbags and FloodSax to properties, door&ndash;knocking and resident newsletters informed of culvert restrictions and repair plans. Jetting of the restricted culvert reduced water levels (300 mm drop on 11/02 and a further 300 mm drop on 12/02) and by 12/02 EA estimated ~98% of flow was passing through the culvert. Pumps were installed to relieve flooding and multi&ndash;agency coordination and flood surgeries were held. [PAG] (p25)</p></div><div class="nugget-popup"><p>Prolonged high River Misbourne levels together with exceptionally high groundwater caused prolonged flooding in Old Amersham, including two severe flood events affecting the settlement. (p30)</p></div><div class="nugget-popup"><p>Old Amersham residents and businesses were affected by flooding from the River Misbourne; recommendations include distributing guidance to adjacent residents, offering Repair and Renew grant support and business recovery support, and establishing community flood&ndash;action coordination and maintenance of riparian responsibilities. [TAB,PAG] (p31)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>two or more business premises [PAG] (p5)</p></div><div class="nugget-popup quant"><p>two locations (culvert flow restriction at The Maltings; bank collapse near Jaguar garage) [IMG,PAG] (p8)</p></div><div class="nugget-popup quant"><p>at least one property; two businesses [IMG,PAG,MUL] (p12)</p></div><div class="nugget-popup quant"><p>at least 1 property flooded internally; 2 businesses protected by barriers; garden flooded on 3 occasions (including March 2013 and August 2013) [PAG,IMG,MUL] (p13)</p></div><div class="nugget-popup quant"><p>1 property (Elephant and Castle pub basement) [PAG,MUL] (p21)</p></div><div class="nugget-popup quant"><p>28 Hippo bags used to restore the river bank; tree removal lowered water levels by 100&ndash;150 mm; water level dropped ~300 mm on 11 February and a further ~300 mm on 12 February; 98% of flow restored through culvert after jetting [TAB,PAG,MUL] (p24)</p></div><div class="nugget-popup quant"><p>300 mm (drop on 11/02/2014); 300 mm (drop on 12/02/2014); 98% of flow through culvert after jetting; 200 sandbags [PAG] (p25)</p></div><div class="nugget-popup quant"><p>two severe flood events (p30)</p></div></div></body></div>`)[0];

                var html_334542dfc395ea8af733b7a07bc9cf57 = $(`<div id="html_334542dfc395ea8af733b7a07bc9cf57" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Amersham</h1><div class="nugget-popup"><p>Old Amersham experienced property flooding during the high&ndash;flow peaks on 07&ndash;08 February 2014. Local river levels in Amersham are strongly influenced by culverts, natural restrictions and blockages, so the upstream Little Missenden gauge (≈2.6 km upstream) only provides an indication of the local high water conditions that led to property flooding. [PAG,MUL] (p18)</p></div><div class="nugget-popup"><p>Old Amersham experienced a prolonged period of flooding (Nov 2013 to mid&ndash;Feb 2014) with particularly severe events on 17 Jan 2014 and 06&ndash;07 Feb 2014. Saturated catchment and heavy rainfall produced large runoff that, together with high River Misbourne levels, exceeded the capacity of the river and highway drainage. Local drainage assets were flow&ndash;restricted: the culvert under The Maltings was partly restricted; High Street gullies were partly blocked with sediment and largely unable to discharge because of high Misbourne levels; downstream weirs and sedimentation impeded flushing and contributed to backing up of water and reduced culvert outflow. A riverbank collapse on 07 Feb 2014 downstream of the Jaguar garage allowed river water to flow into surrounding areas. Overall the drainage infrastructure could not adequately convey additional surface and highway runoff. [MUL] (p20)</p></div></div></body></div>`)[0];

                var html_57f7c274e5be673ddad3d517acab6f08 = $(`<div id="html_57f7c274e5be673ddad3d517acab6f08" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Little Missenden</h1><div class="nugget-popup"><p>Telemetered river gauge at Little Missenden recorded exceptionally high river levels during the winter 2013&ndash;2014 event; the entire event is ranked number 1 of the top 10 recorded levels at this site. Peaks occurred on 07&ndash;08 February 2014 (coincident with much of the property flooding in the area) and the highest peak was recorded on 08 March 2014. [PAG,MUL] (p17)</p></div><div class="nugget-popup"><p>The Little Missenden gauge recorded exceptionally high river levels across the three&ndash;month event to March 2014; the record for the gauge lists the whole period as the site&#8217;s number 1 top&ndash;10 level event. Peaks occurred on 07&ndash;08 February 2014 when much property flooding occurred locally, and the highest recorded peak at the gauge was on 08 March 2014. [PAG,IMG,MUL] (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>number 1 of the top 10 recorded levels at the gauge [PAG,MUL] (p17)</p></div><div class="nugget-popup quant"><p>459 mm; 443 mm [PAG,IMG,MUL] (p19)</p></div></div></body></div>`)[0];
