                var html_c6815c32332e808f6b4a431687568f36 = $(`<div id="html_c6815c32332e808f6b4a431687568f36" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Woodborough</h1><div class="nugget-popup"><p>Flooding on 2 January 2024 caused by sustained rainfall over a saturated catchment. A peak water level of 1.048 m was recorded at Woodborough Brook (16:15). Consequent internal flooding of residential and commercial properties, with additional flooding to gardens, outbuildings and roads. [PAG] (p2)</p></div><div class="nugget-popup"><p>Central area of the village experienced surface water flooding; multiple residential streets were affected (Main Street, Smalls Croft, Shelt Hill, Pinfold Close). [IMG,PAG] (p3)</p></div><div class="nugget-popup"><p>Village experienced severe disruption from repeated exceedance of channel capacity leading to flows along Main Street; residents were cut off for many hours and properties were internally flooded during events. [PAG,MUL] (p4)</p></div><div class="nugget-popup"><p>Internal flooding affected residents and businesses in the village; officers visited sites to verify scale of internal flooding, offer advice and deliver sandbags. Flooding mechanisms recorded for the village include overtopping/impacts from the Woodborough Brook and sewer&ndash;related issues. [PAG] (p8)</p></div><div class="nugget-popup"><p>Village experienced flooding: sewer&ndash;related issues were reported; the culvert conveying the watercourse through Woodborough has been CCTV inspected and is being reviewed by the Environment Agency; debris screens at Church Yards and at 124 and 128 Main Street (in Woodborough) were identified for improvement; a natural flood management project is being delivered in the upper catchment to provide temporary storage and reduce flood risk. (p9)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>24 residential properties; one business; Main Street: 21 properties; Smalls Croft: 1 property; Shelt Hill: 2 properties; Pinfold Close: 1 property [PAG] (p2)</p></div><div class="nugget-popup quant"><p>20 residential properties and 1 business on Main Street; 1 property on Smalls Croft; 2 properties on Shelt Hill; 1 property on Pinfold Close [IMG,PAG] (p3)</p></div><div class="nugget-popup quant"><p>20 residential properties; 1 business [PAG,MUL] (p4)</p></div><div class="nugget-popup quant"><p>3 screens in Woodborough; 12 screen improvements in East Midlands programme (p9)</p></div></div></body></div>`)[0];
