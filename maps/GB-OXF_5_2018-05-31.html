                var html_dd87c9af894c25f5963a96e7a5a9350c = $(`<div id="html_dd87c9af894c25f5963a96e7a5a9350c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Didcot Parkway Station</h1><div class="nugget-popup"><p>The rail station was the subject of a flood incident investigation (document title identifies Didcot Rail Station as the location of the flood incident). (p1)</p></div><div class="nugget-popup"><p>Flooding at Didcot Railway Station on 31 May 2018 led to disruption at this transport interchange and required assistance to commuters and staff; the event prompted a formal investigation. [PAG,MUL] (p6)</p></div><div class="nugget-popup"><p>Internal flooding of the Parkway station building (Didcot Railway Station); water entered and flooded internal areas of the property adjacent to the rail track and station parking. [PAG] (p7)</p></div><div class="nugget-popup"><p>Flooding affected the busy transport interchange: the station main building, subway and station car park were flooded. Surface water sewer exceedance during severe rainfall, together with multiple blockages (including road cones lodged in pipework), debris at critical pipe locations and a grade 5 sewer defect, were identified as contributing factors. Network Rail removed blockages, reconnected sewer sections, improved connectivity to surface water storage tanks and cleared downstream ditches and debris. (p9)</p></div><div class="nugget-popup"><p>Site was the subject of a flood incident investigation indicating the station was affected by flooding. [PAG] (p19)</p></div><div class="nugget-popup"><p>A building on the railway station frontage experienced water ingress (map annotation &#8216;Flooding entered building here&#8217;), indicating the station precinct suffered flood entry at that location. [PAG] (p21)</p></div></div></body></div>`)[0];

                var html_131726f5abb9f8048ff9a476b1aeccdd = $(`<div id="html_131726f5abb9f8048ff9a476b1aeccdd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Didcot</h1><div class="nugget-popup"><p>Didcot is named as the location of the flood incident report (the flood incident occurred in Didcot, the town containing the affected rail station). (p1)</p></div><div class="nugget-popup"><p>Flooding affected the premises of Didcot Railway Station during the incident; the station was the subject of the Section 19 flood investigation. [PAG] (p3)</p></div><div class="nugget-popup"><p>The flood at The Parkway/Didcot Railway Station on 31 May 2018 impacted the town's rail interchange, disrupting commuters and requiring emergency assistance. [PAG,MUL] (p6)</p></div><div class="nugget-popup"><p>Flooding affected the area around Didcot Railway Station: downstream sewer blockage near the Cow Lane underpass (traffic cones wedged in sewer), debris collecting within two pipe sections causing serious flow restrictions close to surface water storage tanks and causing the drainage system to surcharge; downstream ditch base levels were raised above the main outfall sewer invert, reducing outfall capacity. [PAG] (p8)</p></div><div class="nugget-popup"><p>Flooding at Didcot Parkway station (within Didcot) disrupted a busy public transport interchange when surface water sewer exceedance during severe rainfall led to inundation of the station building, subway and car park; emergency services and station staff responded. [PAG] (p9)</p></div><div class="nugget-popup"><p>Didcot Railway Station was the subject of the flood incident: the station experienced flooding driven by surface water sewer exceedance during severe rainfall. Contributing factors cited include blockages in pipework (road cones wedged in the sewer and debris), a grade 5 sewer defect and interceptor maintenance. Network Rail removed blockages and made improvements to reduce the risk of recurrence. [PAG] (p10)</p></div><div class="nugget-popup"><p>Flooding affecting Didcot Railway Station and surrounding infrastructure on 31 May 2018. Impacts included overwhelmed surface water drainage, risk of foul&ndash;water backflow and compromised access/entrance to the station; adjacent car park drainage and downstream highway ditches/culverts were implicated, prompting recommendations for drain/sewer/culvert maintenance and entrance modifications to restrict floodwater access. [PAG] (p14)</p></div><div class="nugget-popup"><p>Flooding affected Didcot Railway Station and its immediate surroundings on 31st May 2018, with surface water and sewer runoff overwhelming drainage assets and prompting an investigation and recommendations to assess sewer capacity and highway drainage maintenance. [PAG] (p16)</p></div><div class="nugget-popup"><p>Flooding entered a building at the Didcot Parkway station frontage, demonstrating that part of Didcot was impacted by floodwater on the date shown. [IMG,PAG] (p21)</p></div></div></body></div>`)[0];
