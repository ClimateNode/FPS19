                var html_b991b34adc34be8b3da803480f65cd22 = $(`<div id="html_b991b34adc34be8b3da803480f65cd22" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Beccles Lido</h1><div class="nugget-popup"><p>Named in the Section 19 flood investigation as a location impacted by the flood event and the subject of LLFA investigation. (p1)</p></div><div class="nugget-popup"><p>Beccles Lido is included in the investigation area (Beccles Quay / Beccles) associated with a single flood incident that met the criterion of internal flooding of five properties; the source or responsibility for the flooding is noted as ambiguous. (p2)</p></div><div class="nugget-popup"><p>Internal flooding occurred at the Lido (Puddingmoor); the Lido closed as a result of the flooding (closure noted alongside several other commercial/industrial businesses). (p6)</p></div><div class="nugget-popup"><p>A private wall was damaged with a portion failing and allowing a flow of flood water from the river into the Beccles Lido area. (p7)</p></div><div class="nugget-popup"><p>A portion of a private flood wall failed, leaving a breach that allowed a flow of floodwater from the River Waveney into the Beccles Lido area; the collapse flooded the Lido and adjacent boatyard and compromised the connected flood defence system. [PAG,IMG] (p8)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 properties (p2)</p></div><div class="nugget-popup quant"><p>internal flooding was reported within at least 8 properties across Beccles (including The Maltings, Fen Lane, Bridge Street, the Quayside, the Northgate Road river frontage and the Lido); approximately 21 properties were reported to have been impacted in some form in Beccles. (p6)</p></div><div class="nugget-popup quant"><p>6&ndash;7m gap in private flood wall [PAG,IMG] (p8)</p></div></div></body></div>`)[0];

                var html_5671210760ee501d501a113f34f0d7cf = $(`<div id="html_5671210760ee501d501a113f34f0d7cf" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Fen Lane, Beccles</h1><div class="nugget-popup"><p>Fen Lane is within the Beccles Quay investigation area where internal flooding occurred during a single incident; the event met the criterion of internal flooding of five properties in one incident and there is ambiguity about the source/responsibility. (p2)</p></div><div class="nugget-popup"><p>Highway flooding was reported on Fen Lane; internal flooding was reported at The Maltings on Fen Lane. (p6)</p></div><div class="nugget-popup"><p>Surface water runoff that could not discharge to the river backed up through highway drains and gullies and flooded onto Fen Lane. (p9)</p></div><div class="nugget-popup"><p>Fen Lane is identified as a location where temporary pumps may need to be deployed to manage exceedance flows from the Anglian Water surface water sewer and associated overflow into the arterial watercourse; this indicates Fen Lane experiences flooding from sewer exceedance and increased main river flows. [TAB] (p10)</p></div><div class="nugget-popup"><p>Severe inundation of Fen Lane during the December 2020 event: floodwater covered the road and surrounding open areas, encroached on adjacent buildings and the quay, and affected moored boats. [IMG,PAG] (p13)</p></div><div class="nugget-popup"><p>Fen Lane was affected by the December 2020 flooding (river water backflow and surface&ndash;water/urban flooding). Penstocks at Fen Lane were inspected and cleaned to prevent backflow; flood wall and removable flood boards are in place protecting a car park; a temporary pump deployment procedure was established to help alleviate future flooding. [IMG,PAG] (p14)</p></div><div class="nugget-popup"><p>Fen Lane has an existing brick flood wall and flood boards; viable options include maintaining the wall and replacing flood boards with flood gates. A procedure is in place for deploying a temporary pump to help alleviate flooding at Fen Lane, to be coordinated with the community (volunteer flood wardens/flood group). [PAG] (p15)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 properties (p2)</p></div><div class="nugget-popup quant"><p>Floodwaters reached approximately 300 mm in depth in places (reported for some main highway routes in the area). (p6)</p></div><div class="nugget-popup quant"><p>5 properties (identified as not benefiting from current flood defences and requiring Property Flood Resilience measures) (p14)</p></div></div></body></div>`)[0];

                var html_71d570a00689f8f05d9ac9e7485f0a9c = $(`<div id="html_71d570a00689f8f05d9ac9e7485f0a9c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Northgate, Beccles</h1><div class="nugget-popup"><p>Internal flooding reported along the river frontage in the Northgate Road area; highway flooding made parts of main routes impassable for a period of time. High river/tide levels (tide locking) and closure of flap valves/penstocks prevented runoff discharging to the river, contributing to raised water levels and drainage failure. (p6)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 300 mm flood depth in places; internal flooding contributed to at least 8 properties being internally flooded and approximately 21 properties reported impacted in Beccles (these impacts occurred across The Maltings, Fen Lane, Bridge Street, the Quayside, the Northgate Road river frontage and the Lido). (p6)</p></div></div></body></div>`)[0];

                var html_65e6b8fd9205e9d280da6ecd20ed3c00 = $(`<div id="html_65e6b8fd9205e9d280da6ecd20ed3c00" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Suffolk</h1><div class="nugget-popup"><p>Beccles (within Suffolk) experienced flooding in December 2020 from multiple sources including the River Waveney and surface&ndash;water/backflow onto streets. This led to investigations, penstock and flap&ndash;valve maintenance, and review of flood warning thresholds. (p14)</p></div></div></body></div>`)[0];

                var html_21c1743f40e656090213d687661338a5 = $(`<div id="html_21c1743f40e656090213d687661338a5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Beccles</h1><div class="nugget-popup"><p>The town of Beccles (investigation area covering Beccles Quay, Fen Lane, Bridge Street and Beccles Lido) experienced a flood incident that resulted in internal flooding meeting the criterion of five properties internally flooded in a single incident; there is ambiguity regarding the flood source/responsibility. (p2)</p></div><div class="nugget-popup"><p>The majority of the northern part of Beccles (area between the River Waveney and the Beccles Town Drain) was impacted by floodwaters from multiple sources. Internal flooding occurred in properties; highway routes were impassable in places; high tide/tide locking raised river levels and contributed to flooding; flap valves and penstocks were closed (and one penstock reported infilled/non&ndash;functional), preventing surface water runoff discharging to the river. [PAG] (p6)</p></div><div class="nugget-popup"><p>Flooding from multiple sources (pluvial, fluvial/tidal, rising groundwater and backed&ndash;up highway drains) caused some main highway routes in this part of Beccles to be impassable. (p7)</p></div><div class="nugget-popup"><p>Anglian Water Services surface water sewer exceeded capacity and overflowed into the arterial watercourse (managed by BFCT); a nearby pumping station pumps out exceedance flows. Main river flooding increased the volume in the system, contributing to the above overflows and elevated flood risk in Beccles. These issues prompted recommendations such as deploying temporary pumps at Fen Lane, surveying watercourse and highway drainage assets, and producing an emergency flood plan. [TAB] (p10)</p></div><div class="nugget-popup"><p>Winter flooding in Beccles prompted emergency response and longer&ndash;term flood risk management work: an emergency flood plan was produced and circulated; a long&ndash;term project was started to investigate people and properties at risk; consideration of a permanent surface&ndash;water pump as part of the Beccles Flood Risk Management Project; asset surveys (jetting and CCTV) of highway drainage commissioned. (p11)</p></div><div class="nugget-popup"><p>Severe flooding in the town during the December 2020 event inundated streets, buildings, the quay and moored boats (notably at Fen Lane and the Quay). Floodwaters covered roads and open areas and encroached on buildings, demonstrating interaction of high river levels (River Waveney), overwhelmed surface water drainage and possible groundwater emergence. [IMG,PAG] (p13)</p></div><div class="nugget-popup"><p>Beccles experienced flooding in December 2020 at locations including Fen Lane and the Quay from multiple sources (the River Waveney and surface&ndash;water/backflow). The event prompted inspections and maintenance of penstocks and flap valves, establishment of a temporary pump procedure, review of flood warning thresholds, and consideration of longer&ndash;term flood risk management measures such as replacing flood boards with flood gates. [IMG,PAG] (p14)</p></div><div class="nugget-popup"><p>The December 2020 flood event affected residential and commercial properties in Beccles. Flood defences (including an existing flood wall) are present; proposals include replacing flood boards with flood gates. Five properties do not benefit from current defences and are identified as requiring Individual Property Flood Resilience (PFR) measures (e.g., waterproof external doors). [PAG] (p15)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 properties (p2)</p></div><div class="nugget-popup quant"><p>Internal flooding experienced within at least 8 properties; approximately 21 properties reported to have been impacted in some form; floodwaters reached approximately 300 mm in depth in places. [PAG] (p6)</p></div><div class="nugget-popup quant"><p>300 mm depth (in places) (p7)</p></div><div class="nugget-popup quant"><p>5 properties [IMG,PAG] (p14)</p></div><div class="nugget-popup quant"><p>22 properties; 5 properties [PAG] (p15)</p></div></div></body></div>`)[0];
