                var html_e184b297c432947d9448018a546cc941 = $(`<div id="html_e184b297c432947d9448018a546cc941" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Stockport Metropolitan District</h1><div class="nugget-popup"><p>Exceptional rainfall on 13 September 2016 exceeded the capacity of the urban drainage network causing public combined sewers and private drains to flood and back up (including foul flooding). No significant infrastructure damage was recorded for this event. (p3)</p></div><div class="nugget-popup"><p>The borough received a very large proportion of its monthly rainfall in one day which overloaded local drainage systems causing public combined sewer and private drain flooding across large parts of the borough; roads became impassable causing local traffic disruption. Heatons and Reddish communities were worst affected; worst affected wards included Davenport and Cale Green, Stepping Hill and Heatons North. Some of the same properties had also been flooded in June 2016. (p5)</p></div><div class="nugget-popup"><p>The September 13, 2016 flood event affected the town: a large number of residential properties and some commercial properties, together with critical services and infrastructure, were flooded. (p6)</p></div><div class="nugget-popup"><p>A major flood on 13th September 2016 affected the Stockport area: a large number of residential properties and some commercial properties, plus critical services and infrastructure, were impacted by flooding. [TAB,PAG] (p7)</p></div><div class="nugget-popup"><p>The borough experienced a flooding event on 13th September 2016 that prompted a Section 19 investigation; hydrological conditions and datasets were reviewed to characterise the impacts across Stockport. [PAG] (p8)</p></div><div class="nugget-popup"><p>On 13th September 2016 Stockport experienced intense convective downpours that delivered a significant proportion of the monthly rainfall over a short period, causing surface water/flash flooding and rapid responses in local watercourses (as identified from radar, rain gauge and river gauge data reviewed in the investigation). [PAG] (p9)</p></div><div class="nugget-popup"><p>Intense, localized torrential rainfall on 13 September 2016 (two downpours at ~15:15&ndash;15:45 and ~17:00&ndash;18:15) produced very high rainfall intensities centred over Stockport. Radar imagery shows the heaviest precipitation over Stockport, which generated rapid overland flow and surface&ndash;water/urban flooding across parts of the town during the event. [PAG,IMG] (p11)</p></div><div class="nugget-popup"><p>Two torrential downpours on 13 September 2016 affected the borough (western half hit by both downpours; eastern half by the second), overwhelming the urban drainage system in parts of the borough and causing surface water (pluvial) and public/private sewer flooding. [PAG] (p12)</p></div><div class="nugget-popup"><p>Short&ndash;duration, high&ndash;intensity rainfall overwhelmed the urban drainage/sewer system across the borough on 13th September 2016, resulting in widespread pluvial and sewer&ndash;related flooding. (p13)</p></div><div class="nugget-popup"><p>Widespread property flooding across the borough on 13 September 2016; urban drainage systems were overwhelmed by short&ndash;duration, high&ndash;intensity rainfall resulting in surface water and sewer&ndash;related flooding. [PAG,IMG] (p14)</p></div><div class="nugget-popup"><p>Widespread flooding across the borough on 13 September 2016: properties across all areas of Stockport were affected. Borough&ndash;wide impacts included many residential internal floods, a high proportion of basement&ndash;only internal flooding, and spatial clustering of higher impacts in the more urbanised western half of the borough. [PAG,IMG] (p15)</p></div><div class="nugget-popup"><p>Central Stockport experienced both internal and external flooding during the September 2016 event, affecting predominantly residential properties with some commercial premises also impacted. [IMG] (p16)</p></div><div class="nugget-popup"><p>A large number of mainly residential properties were internally flooded due to public combined sewers backing up after surface water drained into the network; most affected properties reported basement&ndash;only flooding and the sewer floodwater would have contained foul water. [IMG,PAG] (p17)</p></div><div class="nugget-popup"><p>Multiple flooding incidents across the borough during the storm on 13th September 2016 prompted emergency responses; incidents were distributed across area committees and included locations where electricity supplies were affected. [IMG] (p20)</p></div><div class="nugget-popup"><p>Flood alerts and warnings were issued for the borough during the event. Fluvial flooding occurred in the Cheadle area (Wilmslow Road / Micker Brook) and properties in areas covered by Chorlton Brook warnings experienced flooding that was mainly caused by sewer flooding. [TAB] (p22)</p></div><div class="nugget-popup"><p>Internal flooding of properties across the borough on 13 September 2016 caused mainly by sewer failure and surface water runoff; borough&ndash;wide immediate and post&ndash;event responses included highways debris clearance and cleaning of drainage gullies, and Council financial assistance (grant funding and council tax freezes) for flooded households. [TAB,PAG] (p23)</p></div><div class="nugget-popup"><p>Borough&ndash;wide flooding on 13th September 2016 that affected roads, parks, greenspaces, public rights of way, properties and businesses. Recovery actions included a Council&ndash;led Recovery Coordination Group, flood grants, extensive clean&ndash;up, inspection and repair planning for parks/greenspaces/PRoW, cleaning of highway gullies and debris removal, and sewer clearance and investigations by United Utilities; Environment Agency carried out door&ndash;to&ndash;door surveys in fluvial&ndash;flooded areas. [TAB] (p24)</p></div><div class="nugget-popup"><p>Exceptional rainfall on 13 September 2016 overwhelmed public combined sewers across the borough, causing widespread surface water and sewer flooding that affected communities throughout Stockport. [TAB] (p26)</p></div><div class="nugget-popup"><p>Multiple wards within the borough experienced property flooding: properties were internally and externally flooded due to sewer surcharging and local surface&ndash;water runoff during exceptional weather. [IMG] (p30)</p></div><div class="nugget-popup"><p>Central Stockport experienced multi&ndash;source property flooding across wards on the event date. Impacts include internal and external flooding of residential properties fed by multiple mechanisms (public combined sewers, surface water/pluvial runoff, private drains, river/fluvial flooding and groundwater). Exceptional weather was the primary recorded cause for the majority of flooded properties. [IMG] (p31)</p></div><div class="nugget-popup"><p>At the borough level the report records widespread property flooding across the Heatons and Reddish wards, driven chiefly by combined sewer surcharging during exceptional weather; some locations experienced fluvial and surface&ndash;water (pluvial) impacts and localized culvert collapse. [IMG] (p33)</p></div><div class="nugget-popup"><p>Widespread property flooding across the Stepping Hill Area Committee (within Stockport Borough) caused largely by sewer and surface&ndash;water system failure during exceptional weather: properties flooded internally and externally, sewer systems and some private drains and groundwater affected, and some incidents linked to watercourse blockage. [IMG] (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>660 properties affected on 13 September 2016; 365 more properties affected in September compared to June 2016; 82% of the total properties flooded were due to public combined sewers. (p3)</p></div><div class="nugget-popup quant"><p>660 properties (p5)</p></div><div class="nugget-popup quant"><p>660 properties (p13)</p></div><div class="nugget-popup quant"><p>660 properties [PAG,IMG] (p14)</p></div><div class="nugget-popup quant"><p>660 properties affected borough&ndash;wide; 92% of incidents were residential; 78% of reported incidents involved internal flooding; 80% of internally flooded residential properties were basement&ndash;only; 17 Council Wards had more than five properties flooded [PAG,IMG] (p15)</p></div><div class="nugget-popup quant"><p>139 properties internally flooded; 18 properties externally flooded; 147 residential properties and 10 commercial properties. [IMG] (p16)</p></div><div class="nugget-popup quant"><p>110 properties flooded by public combined sewers; 13 by public surface water sewers; 13 by groundwater; 10 by fluvial flooding; 6 by private drain; 6 unconfirmed [IMG,PAG] (p17)</p></div><div class="nugget-popup quant"><p>15 incidents across Stockport; some locations recorded 3 incidents [IMG] (p20)</p></div><div class="nugget-popup quant"><p>23 properties [TAB] (p22)</p></div><div class="nugget-popup quant"><p>90 properties flooded in three wards (total); 76 properties internally flooded; 14 properties externally flooded only; 88 properties affected by public combined sewer flooding; 1 property affected by private drain failure; 1 property affected by surface water (pluvial runoff); 88 properties attributed to exceptional weather. [IMG] (p30)</p></div><div class="nugget-popup quant"><p>157 properties flooded (total); 139 internal; 18 external; 110 properties from public combined sewers; 13 from public surface water sewers; 10 from private drains; 6 from pluvial runoff; 4 from fluvial sources; 13 from groundwater; 1 source unconfirmed; 119 properties attributed to exceptional weather; 15 properties due to watercourse blockage; 5 properties due to highway drain blockage; 1 due to public combined sewers blockage; 1 due to culvert condition; 1 due to debris screen blockage; 15 unconfirmed causes (cause table) [IMG] (p31)</p></div><div class="nugget-popup quant"><p>167 properties flooded across the four wards; 140 internal; 27 external; 151 properties flooded due to public combined sewers (borough total for these wards); 11 properties due to fluvial flooding; 1 property due to surface water (pluvial runoff); 4 properties affected by private drains; 8 properties where collapsed culvert was recorded as a cause; 151 properties attributed to exceptional weather. [IMG] (p33)</p></div><div class="nugget-popup quant"><p>113 properties flooded across the three wards (15 in Hazel Grove, 20 in Offerton, 78 in Stepping Hill); 85 internal floods (5 + 7 + 73) and 28 external&ndash;only floods (10 + 13 + 5); 89 properties affected by public combined sewers (12 + 7 + 70); 13 by public surface water sewers; 7 by private drains; 4 by groundwater; 6 associated with watercourse blockage [IMG] (p34)</p></div></div></body></div>`)[0];

                var html_48d92daf5a6666d6d75461cfd025ea05 = $(`<div id="html_48d92daf5a6666d6d75461cfd025ea05" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Stepping Hill</h1><div class="nugget-popup"><p>Reported property flooding in the ward during the event; listed among the worst&ndash;hit ward areas when exceptional rainfall overwhelmed the drainage network and public combined sewers. (p3)</p></div><div class="nugget-popup"><p>Public combined sewer and private drain flooding affecting properties in the Stepping Hill ward; contributed to local roads becoming impassable and traffic disruption. (p5)</p></div><div class="nugget-popup"><p>Stepping Hill ward was one of the worst&ndash;affected council wards on 13 September 2016, accounting for 12% of the reported property flood incidents; multiple roads in the ward were listed as key roads flooded. [PAG,IMG,TAB] (p15)</p></div><div class="nugget-popup"><p>Properties in the Stepping Hill ward experienced both internal and external flooding during the September 2016 event &mdash; internal flooding was the dominant impact and affected residential properties. [IMG,PAG] (p16)</p></div><div class="nugget-popup"><p>Properties were flooded due to combined sewer backups and surface water/highway drainage exceedance; private drain failures also contributed to property flooding. [IMG] (p17)</p></div><div class="nugget-popup"><p>Greater Manchester Fire and Rescue Service (GMFRS) responded to flooding incidents within the Stepping Hill area during the storm on 13th September 2016, providing emergency assistance and ensuring the safety of occupants where electricity supplies were affected by flooding. [IMG] (p20)</p></div><div class="nugget-popup"><p>Clean&ndash;up after flooding of Gower Avenue; silt deposited on the road has been removed. [TAB] (p25)</p></div><div class="nugget-popup"><p>Properties in Stepping Hill ward experienced internal and external flooding during the 13th September 2016 event. [TAB] (p28)</p></div><div class="nugget-popup"><p>Widespread property flooding across the Stepping Hill ward: 78 properties were affected (73 internally flooded, 5 external&ndash;only). The primary source was public combined sewers (70 properties); additional impacts from private drains (6 properties) and groundwater (2 properties). Causes recorded: exceptional weather (70 properties) and watercourse blockage (6 properties); 2 incidents unconfirmed. [IMG,TAB] (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>660 properties (borough&ndash;wide, including Stepping Hill) (p5)</p></div><div class="nugget-popup quant"><p>12% of reported property flood incidents [PAG,IMG,TAB] (p15)</p></div><div class="nugget-popup quant"><p>85 internally flooded properties; 28 externally flooded properties; 112 residential properties flooded; 0 commercial properties flooded [IMG,PAG] (p16)</p></div><div class="nugget-popup quant"><p>89 properties flooded by public combined sewers; 13 by public surface water sewers; 7 by private drains [IMG] (p17)</p></div><div class="nugget-popup quant"><p>15 incidents across Stockport (GMFRS call&ndash;outs on 13th September 2016); some locations in the borough experienced up to 3 incidents [IMG] (p20)</p></div><div class="nugget-popup quant"><p>73 internally flooded; 5 externally flooded; 78 total properties [TAB] (p28)</p></div><div class="nugget-popup quant"><p>78 properties; 73 internally flooded; 5 external only; 70 properties via public combined sewers; 6 properties via private drain; 2 properties via groundwater; 70 properties linked to exceptional weather; 6 properties linked to watercourse blockage; 2 unconfirmed incidents [IMG,TAB] (p34)</p></div></div></body></div>`)[0];

                var html_f23157c3904ce6b0a26308746e469fc5 = $(`<div id="html_f23157c3904ce6b0a26308746e469fc5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Four Heatons</h1><div class="nugget-popup"><p>Community recorded significant property flooding during the event; identified as one of the worst&ndash;affected communities where the majority of flooding arose from the urban drainage system and backing up of public combined sewers (foul flooding). (p3)</p></div><div class="nugget-popup"><p>Public combined sewer and private drain flooding in the Heatons community that flooded properties and contributed to local roads becoming impassable, causing traffic disruption. (p5)</p></div><div class="nugget-popup"><p>One of the worst&ndash;hit ward areas on 13th September 2016 with a large number of properties flooded; Heatons North recorded multiple road&ndash;level incidents (see street&ndash;level counts) and many residential internal and basement flood reports. [PAG,IMG,TAB] (p15)</p></div><div class="nugget-popup"><p>The Heatons (& Reddish) committee area recorded substantial internal and external flooding during the September 2016 event, with most incidents affecting residential properties and some commercial premises also impacted. [IMG,PAG] (p16)</p></div><div class="nugget-popup"><p>Properties flooded internally when public combined sewers backed up; flooding affected basements and contained foul water. [PAG,IMG] (p17)</p></div><div class="nugget-popup"><p>The GMFRS map shows incident markers distributed across the borough including the Heatons and Reddish area; GMFRS attended flooding incidents in Stockport on 13 September 2016 where electricity supplies were impacted and occupant safety was addressed. [IMG] (p20)</p></div><div class="nugget-popup"><p>Greater Manchester Fire and Rescue Service pumped out properties and provided safety assistance to properties affected by internal flooding during the September 2016 event. Flooding sources borough&ndash;wide included sewer and surface&ndash;water runoff. [TAB] (p23)</p></div><div class="nugget-popup"><p>CCTV survey of the culverted watercourse on Clifton Road identified a collapse which was subsequently repaired; one manhole was holding water and further investigation and cleaning of gullies/road were carried out as part of the flood response. [TAB] (p25)</p></div><div class="nugget-popup"><p>Heatons North was identified (via the Heaton Moor culvert review) as affected by flooding during the September 2016 event and recommended for investigation to reduce fluvial risk. [TAB] (p27)</p></div><div class="nugget-popup"><p>Properties in the Heatons (Heatons North and Heatons South wards) were flooded internally and externally during the September 2016 events. [TAB] (p28)</p></div><div class="nugget-popup"><p>Widespread property flooding across the Heatons area driven mainly by surcharging public combined sewers and some fluvial inundation; collapsed culvert failures were identified as a cause in the northern Heatons. [IMG,TAB] (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>25% of the reported property flooding (share recorded for Heatons and Reddish) (p3)</p></div><div class="nugget-popup quant"><p>660 properties (borough&ndash;wide, including Heatons) (p5)</p></div><div class="nugget-popup quant"><p>Part of the worst&ndash;hit wards accounting for 12% of reported property flood incidents (12% of 660 ≈ 79 properties); Buckingham Road West (30), Lynton Road (12), Clifton Road (8), Buckingham Road (8) [PAG,IMG,TAB] (p15)</p></div><div class="nugget-popup quant"><p>140 properties internally flooded; 27 properties externally flooded; 147 residential properties and 20 commercial properties. [IMG,PAG] (p16)</p></div><div class="nugget-popup quant"><p>151 properties flooded by public combined sewers [PAG,IMG] (p17)</p></div><div class="nugget-popup quant"><p>part of 15 GMFRS call&ndash;outs across Stockport on 13th September 2016 [IMG] (p20)</p></div><div class="nugget-popup quant"><p>six properties pumped out; four properties made safe (counts apply across the listed wards) [TAB] (p23)</p></div><div class="nugget-popup quant"><p>Heatons North: 60 properties internally flooded and 18 externally (78 total); Heatons South: 34 properties internally flooded and 5 externally (39 total); Combined Heatons: 94 properties internally flooded; 23 properties externally flooded; 117 properties affected in total [TAB] (p28)</p></div><div class="nugget-popup quant"><p>117 properties flooded; 94 internal; 23 external; 105 properties flooded due to public combined sewers; 11 properties flooded due to fluvial flooding; 1 property affected by private drain; 8 properties where collapsed culvert was recorded as a cause; 2 properties where culvert condition was noted; 104 properties attributed to exceptional weather. [IMG,TAB] (p33)</p></div></div></body></div>`)[0];

                var html_d2a42523b9c4ab180b6200217ca7ccce = $(`<div id="html_d2a42523b9c4ab180b6200217ca7ccce" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Gatley</h1><div class="nugget-popup"><p>Appeared on the radar sequence as being subject to intense, localized torrential downpours on 13 September 2016. The concentrated heavy rainfall would have produced rapid surface&ndash;water runoff and is associated with surface water / flash flooding impacts in the Gatley area during the event (timing: first downpour ~15:15&ndash;15:45 and second ~17:00&ndash;18:15). [IMG,PAG] (p11)</p></div><div class="nugget-popup"><p>Part of the Cheadle and Gatley ward affected during the September 2016 event; Network Rail closed and cleaned Gatley Station and emergency responders attended properties in the ward. [TAB] (p23)</p></div><div class="nugget-popup"><p>Area affected by fluvial flooding linked to Micker Brook Tributary; recommended actions include reviewing Park House culvert and considering measures to reduce fluvial flood risk. [TAB] (p27)</p></div><div class="nugget-popup"><p>Properties in the Cheadle and Gatley ward were flooded during the September 2016 event, with both internal and external flooding reported. [TAB] (p28)</p></div><div class="nugget-popup"><p>Property flooding in the ward with the largest source being fluvial (watercourse) flooding; additional impacts from public combined sewers and private drains. Causes recorded include watercourse blockage and debris screen blockage. [IMG] (p32)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>22 internally flooded; 13 externally flooded; 35 total properties [TAB] (p28)</p></div><div class="nugget-popup quant"><p>35 properties flooded; 22 internal; 13 external only; 23 properties affected by fluvial flooding; 6 properties affected by public combined sewers; 6 properties affected by private drains; 19 incidents attributed to watercourse blockage; 4 incidents attributed to debris screen blockage; 4 unconfirmed incidents; 8 incidents attributed to exceptional weather [IMG] (p32)</p></div></div></body></div>`)[0];

mmed for the Bramhall North area). [TAB] (p25)</p></div><div class="nugget-popup"><p>Properties in the Bramhall area experienced internal and external flooding during the September 2016 event. [TAB] (p28)</p></div><div class="nugget-popup"><p>Properties were flooded due to surcharging of the public combined sewer system during exceptional weather; internal and external flooding occurred to residences. [IMG,TAB] (p30)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>76 properties internally flooded; 14 properties externally flooded; 75 residential properties and 15 commercial properties (figures reported for Bramhall & Cheadle Hulme South, combined). [IMG] (p16)</p></div><div class="nugget-popup quant"><p>88 properties flooded in Bramhall & Cheadle Hulme South (combined area) [PAG,IMG] (p17)</p></div><div class="nugget-popup quant"><p>part of 15 GMFRS call&ndash;outs across Stockport on 13th September 2016 [IMG] (p20)</p></div><div class="nugget-popup quant"><p>six properties pumped out; four properties made safe (these totals are across the listed wards); over 80 flooding grants approved borough&ndash;wide [TAB] (p23)</p></div><div class="nugget-popup quant"><p>9 internally flooded; 5 externally flooded; 14 total [TAB] (p28)</p></div><div class="nugget-popup quant"><p>14 properties; 9 internally flooded; 5 externally flooded [IMG,TAB] (p30)</p></div></div></body></div>`)[0];

y and Cheadle Heath') [TAB] (p28)</p></div></div></body></div>`)[0];

xperienced internal and external flooding. Flooding sources recorded include river/fluvial flooding and public combined sewer failure; causes recorded include exceptional weather and watercourse blockages and debris screen blockage. [IMG,TAB,PAG] (p32)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>75 properties internally flooded; 57 properties externally flooded; 127 residential properties and 5 commercial properties. [IMG,PAG] (p16)</p></div><div class="nugget-popup quant"><p>102 properties flooded by public combined sewers; 24 by public surface water sewers; 6 unconfirmed [PAG,IMG] (p17)</p></div><div class="nugget-popup quant"><p>part of 15 GMFRS call&ndash;outs across Stockport on 13th September 2016 [IMG] (p20)</p></div><div class="nugget-popup quant"><p>23 properties [TAB] (p22)</p></div><div class="nugget-popup quant"><p>35 properties; 22 internally flooded; 13 external only; 23 properties from fluvial (river) flooding; 6 properties from public combined sewers; 6 properties from private drains; 8 properties attributed to exceptional weather; 19 properties due to watercourse blockage; 4 properties due to debris screen blockage; 4 properties unconfirmed [IMG,TAB,PAG] (p32)</p></div></div></body></div>`)[0];
