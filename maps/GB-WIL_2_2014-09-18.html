                var html_870f7657ef789d0c131afffdba96fb2a = $(`<div id="html_870f7657ef789d0c131afffdba96fb2a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hill Street Court</h1><div class="nugget-popup"><p>Flows collected in a sunken walkway from the carpark and access way, overwhelming soakaways; water collected to a depth of approximately 250 mm and worked through a wall into the bedroom/living room of the adjacent property. (p1)</p></div><div class="nugget-popup"><p>The courtyard of Hill St Court is listed within the extent of flooding. The management company cleared channels feeding the soakaways (which residents reported were in poor condition before the flood), indicating soakaway failure/contribution to local flooding of the courtyard. [PAG] (p3)</p></div><div class="nugget-popup"><p>Courtyard area at Hill St Court was flooded during the extreme event; channels feeding the soakaways were reported in poor condition prior to the flooding and have since been cleared by the building's management company. Highway drainage may have been surcharged due to silt build&ndash;up, contributing to local flooding; affected householders have been offered property&ndash;level protection. (p4)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approx. 250 mm; 1 property (p1)</p></div><div class="nugget-popup quant"><p>80+ properties; around 20+ businesses; 2+ schools (West Wilts event) [PAG] (p3)</p></div></div></body></div>`)[0];

                var html_ab860d4e3189276bc6473bb5bfbfe19a = $(`<div id="html_ab860d4e3189276bc6473bb5bfbfe19a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hill Street, Trowbridge</h1><div class="nugget-popup"><p>Intense rainfall caused the drainage system to surcharge, producing overland flow in the Hill Street area that entered local courtyards and flowed into properties. (p1)</p></div><div class="nugget-popup"><p>Hill Street and its highway drainage were implicated in the event: gullies on Hill St were connected into the foul (Wessex Water) culvert and were proven with dye; the highway courtyard area around Hill St was within the extent of flooding. Possible silt build&ndash;up in drains and blocked soakaway channels contributed to surface water exceeding highway/drainage capacity. [IMG,PAG] (p3)</p></div><div class="nugget-popup"><p>Highway drainage in the Hill St area surcharged during the event (silt build&ndash;up may have contributed), causing surface water/urban flooding in the local area including courtyards and properties associated with Hill St Court; jetting and CCTV surveying were carried out on the highway drainage afterwards. [PAG] (p4)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>80+ properties; around 20+ businesses; 2+ schools (West Wilts event) [IMG,PAG] (p3)</p></div></div></body></div>`)[0];
