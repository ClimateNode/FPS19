                var html_212b48fd83273aee6132b8606e57f287 = $(`<div id="html_212b48fd83273aee6132b8606e57f287" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Latimer Arts College</h1><div class="nugget-popup"><p>Sheets of surface water flowed over the asphalt courts towards Grosvenor Way; deposits of silt were present on the asphalt courts. Dished concrete channel drainage on the south boundary of the hockey courts had deposits of silt, leaves and concrete slabs, reducing capability for water to flow to underground systems and risking silt/debris being carried into pipework and causing blockages. [MUL] (p12)</p></div></div></body></div>`)[0];

                var html_207f5ac12fdc4b74598a4f3f0bb7d301 = $(`<div id="html_207f5ac12fdc4b74598a4f3f0bb7d301" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Grosvenor Way, Barton Seagrave</h1><div class="nugget-popup"><p>Heavy rainfall produced excess surface water that flowed over ground following natural contours to low points on the public highway and around private property; existing drainage on higher ground could not collect and convey the runoff, resulting in internal flooding of private property adjacent to the highway. [PAG] (p6)</p></div><div class="nugget-popup"><p>Heavy rainfall caused existing higher&ndash;ground drainage to be unable to collect and carry rainwater; excess surface water flowed over ground following natural contours to low points on the public highway and around private property, resulting in internal flooding of a property on Grosvenor Way. Flooding has occurred on more than one occasion in the five years prior to the investigation. [PAG,MUL] (p7)</p></div><div class="nugget-popup"><p>Internal flooding of a residential property at the north end of Grosvenor Way; repeated internal flooding incidents led to a formal investigation. [PAG,MUL] (p9)</p></div><div class="nugget-popup"><p>Internal flooding of a residential property on Grosvenor Way during heavy rainfall. Residents reported surface water runoff from the highway, private areas of Grosvenor Way, Latimer Community Arts College and Barton Seagrave Primary School flowing over the ground to the round turning area at the north of Grosvenor Way. Extent of internal flooding in August 2015 was mitigated due to alterations to the layout of rooms within the dwelling. [TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Road gullies and the public surface water sewer could not drain the volume of water; water levels rose in the carriageway forming ponding over the entire road and footway on the north side of the round turning area. Ponding became deep enough to spill over the back of the footway towards a residential property. Surface water entered the front door on the east elevation of a residential property and flowed through the house affecting multiple rooms; water also flowed around the north of the house into the rear garden and up to external walls on the north elevation. [PAG,MUL] (p12)</p></div><div class="nugget-popup"><p>Surface water from higher ground and private property ponded on Grosvenor Way when highway drainage and public sewers could not cope. Ponding increased in depth until water flowed over the footway and entered a dwelling (via the front door on the east elevation), flowed through the house affecting multiple rooms, and also flowed around the north of the house into the rear garden up to the north external walls. [PAG] (p13)</p></div><div class="nugget-popup"><p>Surface water from the hockey pitches behind a fence was reported by residents to have flowed into the residential round turning area on Grosvenor Way, crossing the carriageway and footway. Photographs taken during the investigation show water flow paths toward the turning area and the presence of a drainage grate and raised kerb at the carriageway/footway edge, indicating overland flow and localised inundation of the road and adjacent pedestrian area. [IMG,PAG] (p35)</p></div><div class="nugget-popup"><p>Residents reported flow of surface water from the hockey pitches behind the fence onto the round turning area and adjacent footpath on Grosvenor Way; images document the area where runoff has reached the path/carriageway. [IMG,PAG] (p36)</p></div><div class="nugget-popup"><p>Silt and fine sediment deposited across the asphalt sports courts immediately east of Grosvenor Way, indicating surface&ndash;water runoff/short&ndash;duration flooding of the court surfaces and contamination/covering of play areas. [IMG] (p37)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property [PAG] (p6)</p></div><div class="nugget-popup quant"><p>1 property [PAG,MUL] (p7)</p></div><div class="nugget-popup quant"><p>1 property [PAG,MUL] (p9)</p></div></div></body></div>`)[0];

                var html_220e96d5d3060c0b188a97bb31244443 = $(`<div id="html_220e96d5d3060c0b188a97bb31244443" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Barton Seagrave</h1><div class="nugget-popup"><p>Grosvenor Way in Barton Seagrave experienced flooding and was the subject of a Northamptonshire County Council (LLFA) flood investigation report. (p2)</p></div><div class="nugget-popup"><p>Area experienced heavy&ndash;rainfall&ndash;driven surface water runoff that flowed to low points on the public highway and around private property, causing internal flooding of at least one property in the settlement. [PAG] (p6)</p></div><div class="nugget-popup"><p>Location of the flood incident at Grosvenor Way: heavy rainfall and ineffective drainage on higher ground caused surface water to run to low points on the public highway and around private property, leading to internal flooding of at least one property within the village. [PAG,MUL] (p7)</p></div><div class="nugget-popup"><p>Contains Grosvenor Way where internal flooding of a residential property occurred; the affected area is shown to be at high risk of surface water flooding. [MUL] (p9)</p></div><div class="nugget-popup"><p>Residents and properties are described as being at risk of flooding; residents are advised to take protective actions such as implementing property&ndash;level protection and moving valuable items to higher ground. (p14)</p></div><div class="nugget-popup"><p>Area experienced flooding that prompted a Section 19 investigation by the Lead Local Flood Authority (NCC). (p16)</p></div><div class="nugget-popup"><p>August 2015 flood incident in Barton Seagrave involved surface water runoff from sports areas (reported from hockey pitches and an asphalt court), accumulation of debris at a low point of a playing field that would impede drainage, and issues identified with the surface water drainage system associated with a school extension within the outlined consultation area. [IMG] (p27)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property [PAG] (p6)</p></div><div class="nugget-popup quant"><p>1 property [PAG,MUL] (p7)</p></div><div class="nugget-popup quant"><p>1 property [MUL] (p9)</p></div></div></body></div>`)[0];
