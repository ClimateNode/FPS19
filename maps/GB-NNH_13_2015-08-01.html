                var html_5e558c61f395af35cae97a144ba790b6 = $(`<div id="html_5e558c61f395af35cae97a144ba790b6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Grosvenor Way, Barton Seagrave</h1><div class="nugget-popup"><p>Heavy rainfall produced excess surface water that flowed over ground following natural contours to low points on the public highway and around private property; existing drainage on higher ground could not collect and convey the runoff, resulting in internal flooding of private property adjacent to the highway. [PAG] (p6)</p></div><div class="nugget-popup"><p>Heavy rainfall caused existing higher&ndash;ground drainage to be unable to collect and carry rainwater; excess surface water flowed over ground following natural contours to low points on the public highway and around private property, resulting in internal flooding of a property on Grosvenor Way. Flooding has occurred on more than one occasion in the five years prior to the investigation. [PAG,MUL] (p7)</p></div><div class="nugget-popup"><p>Internal flooding of a residential property at the north end of Grosvenor Way; repeated internal flooding incidents led to a formal investigation. [PAG,MUL] (p9)</p></div><div class="nugget-popup"><p>Internal flooding of a residential property on Grosvenor Way during heavy rainfall. Residents reported surface water runoff from the highway, private areas of Grosvenor Way, Latimer Community Arts College and Barton Seagrave Primary School flowing over the ground to the round turning area at the north of Grosvenor Way. Extent of internal flooding in August 2015 was mitigated due to alterations to the layout of rooms within the dwelling. [TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Road gullies and the public surface water sewer could not drain the volume of water; water levels rose in the carriageway forming ponding over the entire road and footway on the north side of the round turning area. Ponding became deep enough to spill over the back of the footway towards a residential property. Surface water entered the front door on the east elevation of a residential property and flowed through the house affecting multiple rooms; water also flowed around the north of the house into the rear garden and up to external walls on the north elevation. [PAG,MUL] (p12)</p></div><div class="nugget-popup"><p>Surface water from higher ground and private property ponded on Grosvenor Way when highway drainage and public sewers could not cope. Ponding increased in depth until water flowed over the footway and entered a dwelling (via the front door on the east elevation), flowed through the house affecting multiple rooms, and also flowed around the north of the house into the rear garden up to the north external walls. [PAG] (p13)</p></div><div class="nugget-popup"><p>Residents reported flow of surface water from the hockey pitches behind the fence onto the round turning area and adjacent footpath on Grosvenor Way; images document the area where runoff has reached the path/carriageway. [IMG,PAG] (p36)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property [PAG] (p6)</p></div><div class="nugget-popup quant"><p>1 property [PAG,MUL] (p7)</p></div><div class="nugget-popup quant"><p>1 property [PAG,MUL] (p9)</p></div></div></body></div>`)[0];
