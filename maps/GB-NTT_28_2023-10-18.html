                var html_fde3cbaab17165cb8c33902895b97b07 = $(`<div id="html_fde3cbaab17165cb8c33902895b97b07" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Egmanton</h1><div class="nugget-popup"><p>Heavy rainfall (Storm Babet, 18&ndash;20 October 2023) on saturated ground led to flooding in the village, with roads and properties being flooded; local watercourses converge in the village centre and flow out along Weston Road, contributing to flooding behavior. (p1)</p></div><div class="nugget-popup"><p>During the event, properties in the village experienced surface water flooding: 11 residential properties suffered internal flooding; additional properties experienced flooding to gardens and outbuildings. [IMG,PAG] (p2)</p></div><div class="nugget-popup"><p>Internal flooding across the village driven primarily by watercourses bursting their banks; additional surface water flows entered the village from roads to the west, concentrating flooding in the central/west area (Main St, Kirton Rd) with a smaller separate cluster to the east (around Burnmoor Ln). [IMG,PAG] (p3)</p></div><div class="nugget-popup"><p>Flood Zone 3 (highest risk) and Flood Zone 2 are mapped along the main river that runs west&ndash;east through Egmanton; predicted surface water extents also place high/medium risk along the river and tributaries. These mapped extents correlate with the majority of flooding experienced during Storm Babet in the village. [IMG] (p4)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>11 residential properties [IMG,PAG] (p2)</p></div></div></body></div>`)[0];
