                var html_4c872684c014d12422b84be6127fe11d = $(`<div id="html_4c872684c014d12422b84be6127fe11d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lancashire</h1><div class="nugget-popup"><p>Significant flooding affected the county in December 2015, prompting actions by local risk management authorities and the development of district&ndash;level reports to inform and support affected communities. [PAG] (p3)</p></div><div class="nugget-popup"><p>Widespread flooding during December 2015 caused very large impacts across the county, including property flooding; the county experienced the highest river flows and exceptionally wet conditions in that month. [TAB] (p8)</p></div><div class="nugget-popup"><p>Extreme storms and rainfall in November&ndash;December 2015 caused flooding throughout December that flooded properties and damaged private gardens, garages and out&ndash;buildings, business premises, agricultural property and critical public infrastructure including roads, bridges and retaining walls, water treatment plants, power and communications installations, and community buildings such as schools, village and town halls. (p9)</p></div><div class="nugget-popup"><p>Multiple communities across Lancashire experienced flooding as a result of two major storm events in December 2015; this prompted a countywide Section 19 investigation to identify affected communities and recommend actions, and led to follow&ndash;up stage&ndash;two reporting by the LLFA and other risk management authorities. [PAG] (p10)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 2,500 properties flooded [TAB] (p8)</p></div><div class="nugget-popup quant"><p>over 2,500 properties (p9)</p></div></div></body></div>`)[0];
