                var html_8775751c955d905627a83511fc9125a9 = $(`<div id="html_8775751c955d905627a83511fc9125a9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Itchen</h1><div class="nugget-popup"><p>The River Itchen catchment recorded very high short&ndash;duration rainfall during 11&ndash;12 June 2023 consistent with a rare event (return period in the order of 50&ndash;75 years for short durations), representing a substantial short&ndash;term river/flash flood hazard to the river system and its catchment. [PAG] (p7)</p></div><div class="nugget-popup"><p>Intense, short&ndash;duration rainfall over the River Itchen to River Avon catchment produced very high runoff through the River Itchen catchment on 11th June 2023, contributing to rapid river flows and flooding that fed downstream impacts and risk of overwhelming downstream drainage and conveyance systems. [PAG,IMG] (p8)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>return period between 50 and 75 years [PAG,IMG] (p8)</p></div></div></body></div>`)[0];

                var html_1a9553177f97b804a24e514b2200be62 = $(`<div id="html_1a9553177f97b804a24e514b2200be62" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Shuckburgh Grove, Warwick</h1><div class="nugget-popup"><p>Location experienced flooding during the reported event. (p1)</p></div><div class="nugget-popup"><p>Internal flooding to residential properties caused by the localised heavy rainfall event. (p3)</p></div><div class="nugget-popup"><p>Flooding occurred on 11 June 2023 resulting in internal flooding of residential properties on Shuckburgh Grove; the event prompted a Section 19 investigation by the LLFA. (p4)</p></div><div class="nugget-popup"><p>Shuckburgh Grove is identified as the red&ndash;point location on rainfall radar and experienced the most intense rainfall in its local catchment between 19:00 and 22:00 on 11 June 2023; this intense convective rainfall is the proximate cause of the localised surface water / flash flooding examined in the investigation (some uncertainty remains whether all impacts were inundation rather than heavy runoff). [IMG] (p6)</p></div><div class="nugget-popup"><p>Although local monitored rainfall at Shuckburgh Grove was lower than surrounding areas, runoff from the wider, more intense rainfall in the catchment flowed toward lower&ndash;lying Shuckburgh Grove on 11th June 2023, potentially overwhelming drainage and contributing to surface water/urban flooding impacts downstream in the area. The local rainfall accumulation peaked in the early evening of 11th June 2023, coincident with the wider event. [PAG,IMG] (p8)</p></div><div class="nugget-popup"><p>Large volumes of surface water runoff travelled down Pound Lane, pooled at the junction of Loxley Way and flowed across a grass verge into the rear of properties on Shuckburgh Grove (properties sit lower than the highway), causing reports of flooding to properties. (p10)</p></div><div class="nugget-popup"><p>Property flooding occurred on Shuckburgh Grove during the event; highway and street drainage discharged into a culverted watercourse on Pound Lane Training Centre land, prompting investigation of the culvert which found it generally in good condition. [PAG] (p11)</p></div><div class="nugget-popup"><p>Following intense rainfall on 11th June 2023 surface water drainage became overwhelmed and water pooled towards the lower&ndash;elevation Shuckburgh Grove. Residential properties with minimal thresholds experienced internal flooding as surface water exceeded kerb heights and entered buildings. Blocked private drainage (guttering/downpipes) was noted and Warwick District Council arranged for a contractor (Axis) to jet and unblock drainage features around key areas, the car park and shared drying area following the event. [PAG] (p12)</p></div><div class="nugget-popup"><p>Surface water exceeded kerb heights and flowed from the highway and pathways into properties with minimal thresholds, entering gardens and causing internal flooding of residential properties. [PAG] (p13)</p></div><div class="nugget-popup"><p>Area experienced flooding associated with intense, high&ndash;intensity rainfall across the wider catchment. Drainage network investigations were undertaken and found to be operating as intended, but flooding nevertheless occurred due to the rainfall intensity. [PAG] (p14)</p></div><div class="nugget-popup"><p>Surface water runoff entered properties (via low thresholds, rear and front) causing internal flooding; private drains blocked by leaves and debris aided ingress. Properties that back onto Loxley Way and sit at lower elevation flooded internally. [PAG] (p15)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties on Shuckburgh Grove. (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>12 flood reports of internal flooding to residential properties; five or more residential properties internally flooded (threshold met) (p3)</p></div><div class="nugget-popup quant"><p>12 residential properties internally flooded (p4)</p></div><div class="nugget-popup quant"><p>12 flood reports (p10)</p></div><div class="nugget-popup quant"><p>12 properties confirmed internal flooding [PAG] (p13)</p></div><div class="nugget-popup quant"><p>12 properties internally flooded [PAG] (p15)</p></div><div class="nugget-popup quant"><p>12 properties (p16)</p></div></div></body></div>`)[0];

                var html_0f2ab2881d2441fcfdab64ccf1a9405c = $(`<div id="html_0f2ab2881d2441fcfdab64ccf1a9405c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Warwickshire</h1><div class="nugget-popup"><p>Localised heavy rainfall on the evening of 11 June 2023 caused surface water/urban flooding in parts of Warwickshire, resulting in internal flooding reports to residential properties (notably 12 reports in Shuckburgh Grove, Leamington Spa) and additional reports of residential and commercial flooding in North Warwickshire. (p3)</p></div><div class="nugget-popup"><p>Localized flooding on 11 June 2023 caused internal flooding of residential properties within Warwickshire (investigation area included Leamington Spa / Shuckburgh Grove); additional reports of residential and commercial flooding were received from North Warwickshire. [PAG] (p4)</p></div><div class="nugget-popup"><p>A band of heavy rainfall travelled across Warwickshire on the evening of 11 June 2023 (18:00&ndash;00:00), with the most intense rainfall between 19:00&ndash;22:00 in parts of the county; this intense rainfall formed the meteorological driver for the surface water flooding examined by the investigation. (p6)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>12 flood reports of internal flooding to residential properties; five or more residential properties internally flooded (threshold met) (p3)</p></div><div class="nugget-popup quant"><p>12 residential properties internally flooded [PAG] (p4)</p></div></div></body></div>`)[0];

                var html_a4ead4c44de74166c234a2b67811d061 = $(`<div id="html_a4ead4c44de74166c234a2b67811d061" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Leamington Spa</h1><div class="nugget-popup"><p>The town experienced flooding associated with the event on 11 June 2023 (affecting Shuckburgh Grove). (p1)</p></div><div class="nugget-popup"><p>Highly localised internal flooding occurred in parts of Leamington Spa (notably Shuckburgh Grove) during the evening of 11 June 2023. (p3)</p></div><div class="nugget-popup"><p>The Royal Leamington Spa catchment experienced intense, localized rainfall during the evening of 11 June 2023 (19:00&ndash;22:00) which contributed to surface&ndash;water / urban flooding in the Leamington Spa area; HydroMaster radar in the report shows the catchment received the most intense rainfall during that period and is the focus of the flood investigation. [IMG,PAG] (p6)</p></div><div class="nugget-popup"><p>Royal Leamington Spa recorded elevated short&ndash;duration rainfall on 11 June 2023 (recorded return period &gt;5 and <10 years for the town-scale observation), producing conditions likely to produce urban/surface water and flash‑flooding impacts in the town during the evening of 11 June. [IMG] (p7)</p></div><div class="nugget-popup"><p>Some reports of highway/standing water on highways were received for areas of Leamington during the 11 June 2023 event. (p10)</p></div><div class="nugget-popup"><p>The town experienced the flood event on 11th June 2023 affecting streets including Shuckburgh Grove; historic property flooding has also been recorded elsewhere in the town. (p11)</p></div><div class="nugget-popup"><p>Areas within Leamington Spa were affected by surface water flooding on 11th June 2023; notably Shuckburgh Grove experienced pooling and internal property flooding where thresholds were minimal and drainage was overwhelmed. (p12)</p></div><div class="nugget-popup"><p>Part of the town (Shuckburgh Grove area) experienced surface water flooding on 11 June 2023, with residential properties internally flooded due to intense localised rainfall and runoff. [PAG] (p15)</p></div><div class="nugget-popup"><p>Residential area experienced internal flooding centred on Shuckburgh Grove (internal flooding of homes). (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>12 flood reports of internal flooding to residential properties (p3)</p></div><div class="nugget-popup quant"><p>12 properties internally flooded (Shuckburgh Grove) [PAG] (p15)</p></div><div class="nugget-popup quant"><p>12 properties (p16)</p></div></div></body></div>`)[0];
