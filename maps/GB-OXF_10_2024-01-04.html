                var html_302899317048a0294a65ae5cc8566055 = $(`<div id="html_302899317048a0294a65ae5cc8566055" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Harriers Park</h1><div class="nugget-popup"><p>Flooding of the Harriers Park estate caused by hydraulic overload of the Moor Ditch catchment and connected main river (Moor Ditch). (p2)</p></div><div class="nugget-popup"><p>Commercial premises in Harriers Park are at risk from flooding related to the Moor Ditch; recommended actions include establishing a local flood group and signing up to the EA flood warning system; consideration of bank raising to defend commercial properties. (p5)</p></div><div class="nugget-popup"><p>Harriers Park was inundated during the January 2024 flood event following prolonged wet weather and especially heavy rainfall on 03&ndash;04 Jan 2024. High flows on the Ginge Brook (gauge near Steventon) and surface water runoff contributed to fluvial and surface&ndash;water flooding of the park/adjacent areas. [PAG] (p9)</p></div><div class="nugget-popup"><p>Commercial units and the estate access road were inundated after the Moor Ditch surcharged in the early hours of 05 January 2024. Business owners had no warning and were unable to deploy defensive measures, resulting in internal flooding of units and disruption to businesses. [PAG] (p15)</p></div><div class="nugget-popup"><p>Floodwater entered commercial units and the access road; internal floor levels and stored goods were inundated. Photographs taken on 5 January show water inside a business unit and across the estate access. [IMG,PAG] (p16)</p></div><div class="nugget-popup"><p>Flooding occurred when the Moor Ditch surcharged in the early hours of 05 Jan 2024; the large forecourt and south&ndash;side commercial area were inundated to an average peak depth of approximately 0.25 m. The site&#8217;s surface water drainage outfall was impeded by significant silt, and tree branches and silted banks were noted as reducing channel capacity, which would have affected drainage and may have exacerbated flooding. [PAG] (p17)</p></div><div class="nugget-popup"><p>Site inundated during the event with water reaching approximately 52.35 mAOD; bank at Moor Ditch alongside the park is at 52.14 m allowing water to enter the site. No blockage was recorded; observed inundation exceeded the Environment Agency modelled 1% and 0.1% levels at nearby nodes, suggesting higher flows into Moor Ditch than modelled. (p19)</p></div><div class="nugget-popup"><p>Commercial properties and the access road at Harriers Park were flooded when the Moor Ditch surcharged during exceptional, prolonged rainfall; this was the worst flooding at Harriers Park for 10 years. (p21)</p></div><div class="nugget-popup"><p>Commercial premises within Harriers Park experienced internal flooding risk/impacts. Recommendations note the need for property flood resilience measures, monitoring and maintenance of the surface water drainage system, setting up a flood group for Harriers Park, and signing up premises to EA flood warning systems to reduce future internal flooding of businesses. [TAB] (p27)</p></div><div class="nugget-popup"><p>Commercial premises at Harriers Park were flooded by overflow from the Moor Ditch, leading to proposals for bank raising, establishment of a local flood group and advice to sign up to EA flood warnings. [PAG] (p28)</p></div><div class="nugget-popup"><p>Units on the side of the estate directly behind the river/ditch bank would become quickly inundated when the Moor Ditch surcharges the lowest ground level; the estate is the first point of surcharge alongside the ditch so floodwater would enter premises rapidly. (p33)</p></div><div class="nugget-popup"><p>Harriers Park is shown on the survey with a surface water drainage outfall and an artificial spillway; the lowest ground adjacent to Harriers Park is identified as the first point of surcharge when the Moor Ditch overtops, leading to rapid inundation of the area behind the bank and affecting units on that side of the estate. [IMG,PAG] (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>peak flood depth of 0.25 m within business units and on the estate road; average peak flood level 0.25 m [PAG] (p15)</p></div><div class="nugget-popup quant"><p>0.25 m average peak flood level within units and the access road [IMG,PAG] (p16)</p></div><div class="nugget-popup quant"><p>0.25 m peak flood depth; 1 commercial property [PAG] (p17)</p></div><div class="nugget-popup quant"><p>approximate peak flood depth of 0.25 m; approximate area affected 3.5 ha; worst in 10 years (p21)</p></div></div></body></div>`)[0];

                var html_68d8ad6069b6d5c1a70b368431ac50c3 = $(`<div id="html_68d8ad6069b6d5c1a70b368431ac50c3" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ginge Brook</h1><div class="nugget-popup"><p>Ginge Brook surcharged its channel and likely produced exceedance flow that drained into the Moor Ditch, further overwhelming the system and contributing to flooding of Harriers Park and nearby areas. (p2)</p></div><div class="nugget-popup"><p>Elevated river levels recorded on Ginge Brook (gauge near Steventon) have been associated with historic flooding at Harriers Park; river&ndash;level data for July 2007, Dec 2013&ndash;Jan 2014 and Dec 2023&ndash;Jan 2024 were reviewed and linked to flooding at Harriers Park. [MUL] (p9)</p></div><div class="nugget-popup"><p>Elevated river levels on Ginge Brook during the Dec 2023&ndash;Jan 2024 period produced river flooding that resulted in flooding at Harriers Park. Historical gauge records reviewed (Jul 2007, Dec 2013&ndash;Jan 2014 and Dec 2023&ndash;Jan 2024) correspond to three flood events affecting the same area; historic peaks include 1.463 m on 20 Jul 2007 and a maximum of 1.32 m in the Dec 2013&ndash;Jan 2014 period. [IMG,PAG] (p10)</p></div><div class="nugget-popup"><p>River levels on Ginge Brook rose sharply, reaching a peak level of 1.439 m on 05 Jan 2024. This level was the highest recorded at the Steventon gauge since installation in 2006 except for 1.463 m on 20 Jul 2007, indicating a significant high&ndash;flow / river flooding event on and around 05 Jan 2024. [IMG] (p11)</p></div><div class="nugget-popup"><p>High levels in the Ginge Brook are identified as a possible contributing factor that increased flow paths into the Moor Ditch, exacerbating the surcharging and downstream flooding. (p21)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>three flood events [MUL] (p9)</p></div><div class="nugget-popup quant"><p>3 flood events [IMG,PAG] (p10)</p></div><div class="nugget-popup quant"><p>1.439 m (05 Jan 2024); 1.463 m (20 Jul 2007) [IMG] (p11)</p></div></div></body></div>`)[0];
                popup_a7bcfc44671b1fe2e26adf2dd35b511c.setContent(html_68d8ad6069b6d5c1a70b368431ac50c3);

                var html_e0b035e9437ffcc67e24ca6bcf4a7862 = $(`<div id="html_e0b035e9437ffcc67e24ca6bcf4a7862" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Moor Ditch</h1><div class="nugget-popup"><p>Moor Ditch, a main river, experienced hydraulic overload and was overwhelmed, causing flooding of Harriers Park and its access road (impassable to vehicles) and contributing to internal flooding of business premises. (p2)</p></div><div class="nugget-popup"><p>Channel obstruction and channel&ndash;form issues identified; monitoring and maintenance (removal of tree branches) recommended to restore the channel profile, and the area has been placed on a pipeline for re&ndash;modelling. Bank&ndash;raising either side of the Moor Ditch was suggested as a potential flood defence to protect nearby commercial properties. [PAG] (p5)</p></div><div class="nugget-popup"><p>The Moor Ditch surcharged its channel in the early hours of 05 January 2024 and overtopped/overflowed, causing floodwater to enter Harriers Park commercial units and the estate road. (p15)</p></div><div class="nugget-popup"><p>The ditch surcharged its channel along the northern bank between the downstream end of the access bridge and the Harriers Park land boundary, sending water onto Harriers Park and contributing to inundation of units and the access road. [PAG] (p16)</p></div><div class="nugget-popup"><p>The Moor Ditch surcharged its channel along the northern bank between the downstream end of the access bridge and the end of the Harriers Park land boundary, overtopping and contributing to flooding of adjacent commercial premises and Harriers Park. [PAG] (p17)</p></div><div class="nugget-popup"><p>Reduced channel capacity (tree branches, heavy siltation) and subsequent overtopping/overflow of Moor Ditch led to flooding of the adjacent commercial forecourt; parked vehicles were partially submerged (photograph dated 5 Jan 2024). The site also abstracts up to approximately 15,000 l/day from Moor Ditch for a cooling tower, indicating very large water volumes in the channel at the time. Hydraulic modelling and topographical survey were used to assess flood levels. [PAG] (p18)</p></div><div class="nugget-popup"><p>Moor Ditch overtopped/local water levels rose above bank levels during the event, resulting in inundation of adjacent areas (including Harriers Park and commercial areas on the south side). Observed flood extent reached approximately 52.35 mAOD, exceeding some modelled node levels and indicating greater inflows (from Ginge Brook) than predicted. [TAB,PAG] (p19)</p></div><div class="nugget-popup"><p>During the event on 4&ndash;5 Jan 2024 Moor Ditch experienced higher flows/levels than predicted by EA modelling, resulting in inundation that entered adjacent commercial sites. Observed inundation reached approximately 52.35 m, exceeding the lowest bank level along the commercial property boundary (52.08 m), allowing water to enter the commercial properties at Harriers Park, the commercial property on the south side of Moor Ditch, and the access road to Harriers Park. No blockage was recorded; investigation suggests additional inflows from Ginge Brook contributed to the higher volumes. [PAG] (p20)</p></div><div class="nugget-popup"><p>The Moor Ditch surcharged because runoff from prolonged heavy rainfall exceeded its capacity, causing extensive flooding onto adjacent commercial areas. [PAG] (p21)</p></div><div class="nugget-popup"><p>Moor Ditch was identified as contributing flood risk to adjacent commercial properties: recommendations call for monitoring and removal of tree branches/debris, ensuring channel profile is consistent, maintaining ordinary watercourses at rear/side of properties, consideration of bank raising on either side of Moor Ditch as flood defence, and placing the area on modelling/review pipelines to assess flood risk. [TAB,PAG] (p27)</p></div><div class="nugget-popup"><p>Overtopping/overflow from the Moor Ditch caused flooding affecting commercial premises in the Harriers Park area; prompted consideration of bank&ndash;raising on either side of the ditch as a flood defence. [PAG] (p28)</p></div><div class="nugget-popup"><p>The lowest bank level of Moor Ditch (52.08 m) is identified as the critical overflow point where the ditch will surcharge and allow floodwater to enter the adjacent commercial property. [IMG] (p35)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>14 business premises (p2)</p></div><div class="nugget-popup quant"><p>peak flood depth of 0.25 m within impacted business units and on the estate road (p15)</p></div><div class="nugget-popup quant"><p>1 commercial property flooded; 0.25 m peak flood depth in the forecourt [PAG] (p17)</p></div><div class="nugget-popup quant"><p>15000 l per day [PAG] (p18)</p></div><div class="nugget-popup quant"><p>0.1% (1:1,000 year) modelled level 52.02 m at node MD41; 1:100 year modelled level 51.88 m; observed inundation to approximately 52.35 m; lowest bank level along commercial property boundary 52.08 m. [PAG] (p20)</p></div><div class="nugget-popup quant"><p>surcharge led to approximate peak flood depth of 0.25 m across an approximate area of 3.5 ha [PAG] (p21)</p></div></div></body></div>`)[0];
