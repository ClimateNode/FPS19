                var html_aad5aa6bb49d4fbf80bcb4dda8091073 = $(`<div id="html_aad5aa6bb49d4fbf80bcb4dda8091073" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Thames</h1><div class="nugget-popup"><p>Internal property flooding at multiple addresses and road closures reported in Cobham during the winter 2013/14 event. [TAB] (p2)</p></div><div class="nugget-popup"><p>Identified as a main river source for the fluvial flooding in winter 2013/14 that contributed to internal property flooding across Elmbridge. (p7)</p></div><div class="nugget-popup"><p>Daily river flows at Kingston remained close to record levels for approximately two months during winter 2013&ndash;14; the duration and repetition of these high flows contributed to the overall scale of the winter 2013/14 flooding problems. (p11)</p></div><div class="nugget-popup"><p>The River Thames caused flooding in the winter 2013/14 event; flood&ndash;related impacts included debris washed onto and accumulating on weirs (removed by the EA) and shoals left in the river bed that were later surveyed and removed. EA actions (operation of the Jubilee River and Thames Barrier) reduced downstream flooding risk. [PAG,MUL] (p14)</p></div><div class="nugget-popup"><p>High flows during the December 2013&ndash;February 2014 floods washed debris onto weirs (over 200 tonnes removed), left shoals in the riverbed that were later removed, and prompted towpath tree works and other maintenance. [PAG,MUL] (p15)</p></div><div class="nugget-popup"><p>Flooding from the River Thames caused internal property flooding in Molesey (reported flooded properties). [MUL] (p21)</p></div><div class="nugget-popup"><p>EA issued River Thames flood warnings for Molesey in January and February 2014; high flows associated with the flood period caused bank erosion to the Lower Mole flood alleviation scheme, which EA subsequently repaired. [MUL] (p22)</p></div><div class="nugget-popup"><p>River Thames levels rose in the February 2014 event to the highest recorded since 1947, causing back&ndash;up into the River Wey and contributing to flooding that affected properties in the Weybridge/Walton sub area. (p24)</p></div><div class="nugget-popup"><p>Since the 2013/2014 flooding the EA carried out maintenance work along the River Thames, including asbestos surveys to EA weir sites and six&ndash;yearly electrical inspections to EA lock and weir sites (actions taken post&ndash;flooding). (p25)</p></div><div class="nugget-popup"><p>Acted as a main source of fluvial flooding in Walton&ndash;on&ndash;Thames and the wider Elmbridge area during the winter 2013/14 flood event, contributing to major fluvial flooding. (p27)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 100 incidents of internal property flooding in Elmbridge (p7)</p></div><div class="nugget-popup quant"><p>approximately two months (p11)</p></div><div class="nugget-popup quant"><p>more than 200 tonnes of debris [PAG,MUL] (p14)</p></div><div class="nugget-popup quant"><p>more than 200 tonnes of debris [PAG,MUL] (p15)</p></div><div class="nugget-popup quant"><p>1 property; 12 properties [MUL] (p21)</p></div><div class="nugget-popup quant"><p>1736 registered property owners (January 2014); 1770 registered property owners (February 2014) [MUL] (p22)</p></div><div class="nugget-popup quant"><p>33 properties (affected by flooding from either river or a combination) (p24)</p></div></div></body></div>`)[0];

                var html_22b2ce3c565aa08d4b301772b6fa1db9 = $(`<div id="html_22b2ce3c565aa08d4b301772b6fa1db9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Mole</h1><div class="nugget-popup"><p>Fluvial flooding from the River Mole caused inundation across floodplains in the lower Mole catchment (including Elmbridge), contributing to internal property flooding in the borough and forming one of the main flood sources considered in the investigation. [PAG,MUL] (p10)</p></div><div class="nugget-popup"><p>The River Mole experienced extreme instantaneous flows during the winter 2013&ndash;14 events, reaching a maximum peak instantaneous flow of 148 m³/s on 23&ndash;24 December 2013 (the highest in the gauge's 16&ndash;year record). The river exhibited multiple sharp rises and falls throughout the December&ndash;February period, contributing to the wider flooding issues. [IMG,PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>During winter 2013/2014 the River Mole within the Middle Mole catchment overtopped its banks, causing road closures and internal property flooding in the Cobham sub area. (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>47 sites; approximately 100 incidents of internal property flooding in Elmbridge [PAG,MUL] (p10)</p></div><div class="nugget-popup quant"><p>148 m³/s; 16&ndash;year gauge record; 1 in 150 year annual chance of occurrence; December 2013&ndash;February 2014 [IMG,PAG,MUL] (p11)</p></div></div></body></div>`)[0];

ding across the borough; River Wey and the River Thames were identified as the main fluvial sources affecting Weybridge and Walton&ndash;on&ndash;Thames. (p27)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 100 incidents of internal property flooding (p7)</p></div><div class="nugget-popup quant"><p>47 sites; approximately 100 incidents of internal property flooding [IMG] (p9)</p></div><div class="nugget-popup quant"><p>approximately 100 incidents of internal property flooding (p27)</p></div></div></body></div>`)[0];

                var html_c0eba37b6f0a5570e46a78d0c30c6b22 = $(`<div id="html_c0eba37b6f0a5570e46a78d0c30c6b22" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Surrey</h1><div class="nugget-popup"><p>Operated the Flood Alert and Flood Warning service for the affected area; deployed flood ambassadors and flood data recorders to areas affected by flooding; carried out maintenance along the River Thames in locations including parts of Spelthorne as part of the response to the winter 2013/14 floods. [PAG] (p8)</p></div><div class="nugget-popup"><p>Widespread flooding across the county during winter 2013/14 from a range of sources; groundwater levels rose very high and caused groundwater flooding in parts of the county. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>Widespread flooding across Surrey during winter 2013&ndash;14 from multiple sources (high groundwater, fluvial flooding and local pluvial/surface water). In the Elmbridge area this led to inundation across flood plains from the River Mole and internal property flooding reported to the council. [IMG] (p10)</p></div><div class="nugget-popup"><p>Widespread river flooding across the county during the winter 2013/14 event; major&ndash;incident coordination and flood risk management actions were carried out across Surrey to respond to the floods. [PAG] (p14)</p></div><div class="nugget-popup"><p>The December 2013&ndash;February 2014 floods prompted county&ndash;wide actions: the EA produced a major flood protocol covering Surrey and carried out debris removal, shoal clearance and towpath/tree works on the River Thames; Thames Water deployed barriers/sandbags, checked sites and attended internally flooded properties; forecasting and flood warning areas were updated. [PAG,MUL] (p15)</p></div><div class="nugget-popup"><p>County&ndash;wide impacts from the winter 2013/14 storms and flooding: roads and carriageways were damaged and assessed for repair (Project 400), roads were cleansed and re&ndash;opened, trees and debris were cleared and ditching carried out to restore drainage, Surrey Fire and Rescue Service pumped flood waters to protect residents and infrastructure, and coordination groups were convened to manage the response. [PAG] (p16)</p></div><div class="nugget-popup"><p>The county experienced major fluvial flooding during winter 2013/14 caused by exceptional rainfall; lack of maintenance of some riparian ditches contributed to increased impacts in places. (p27)</p></div><div class="nugget-popup"><p>Historic flooding occurred across Surrey during the winter 2013/14 event; a large amount of information on property and historic flooding was gathered as a result of the winter 2013/14 floods to help identify areas most at risk. [PAG] (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>47 sites; approximately 100 incidents of internal property flooding [IMG] (p10)</p></div><div class="nugget-popup quant"><p>more than 200 tonnes of debris [PAG,MUL] (p15)</p></div></div></body></div>`)[0];

                var html_65f10a04525fa426fd07012de73a44da = $(`<div id="html_65f10a04525fa426fd07012de73a44da" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cobham</h1><div class="nugget-popup"><p>Internal property flooding at multiple addresses; road closures reported in the area. [TAB] (p2)</p></div><div class="nugget-popup"><p>Cobham was one of the three sub&ndash;areas in Elmbridge containing sites that flooded during the winter 2013/14 event. Flooding in the borough was driven by multiple sources, including elevated groundwater levels, and formed part of the wider borough&ndash;wide internal property flooding recorded in Elmbridge. [IMG] (p9)</p></div><div class="nugget-popup"><p>During winter 2013/2014 flooding resulted in road closures and internal property flooding in the Cobham sub&ndash;area. (p19)</p></div><div class="nugget-popup"><p>Experienced flooding that prompted EA sluice operations and monitoring, deployment of EA Flood Ambassadors, installation of EA flood data recorders, issuance of flood warnings to nearby property owners and temporary road closures by the highway authority. [PAG,MUL] (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>47 S19 sites in Elmbridge; approximately 100 incidents of internal property flooding in Elmbridge (across the three sub areas including Cobham) [IMG] (p9)</p></div><div class="nugget-popup quant"><p>190 registered property owners warned (Dec 2013); 196 (Jan 2014); 199 (Feb 2014); 5 roads temporarily closed [PAG,MUL] (p20)</p></div></div></body></div>`)[0];

                var html_a55b568aca29c54b4379b86c16ad2fca = $(`<div id="html_a55b568aca29c54b4379b86c16ad2fca" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Esher</h1><div class="nugget-popup"><p>Internal property flooding at multiple addresses; road closures reported in the area. [TAB] (p2)</p></div><div class="nugget-popup"><p>Part of the 'Esher & East Molesey' sub&ndash;area investigated in this report; S19 investigation sites and property flooding occurred in this sub&ndash;area during winter 2013/14. [IMG] (p9)</p></div><div class="nugget-popup"><p>The River Mole at Esher showed a highly responsive (&#8216;flash&#8217;) behaviour with multiple sharp instantaneous flow peaks during winter 2013&ndash;14, including a record maximum instantaneous flow measured at the Esher gauge. These peaks (notably around 23&ndash;24 December 2013, 17 January 2014 and 1 February 2014) contributed to the local flood event severity. [IMG,MUL] (p11)</p></div><div class="nugget-popup"><p>The River Mole 2013/14 flood at Esher was recorded as having higher river water levels than in 1968 though the flood extent was less than in 2000 and 1968. (p19)</p></div><div class="nugget-popup"><p>The 2013/14 flood event was estimated at a 1 in 50 year annual chance at Esher; the winter 2013/2014 flooding in the Esher and East Molesey sub area resulted in road closures and internal property flooding affecting the sub area that includes Esher. (p21)</p></div><div class="nugget-popup"><p>EA had flood data recorders on site and EA Flood Ambassadors were present during the January 2014 flood event; local highway disruption occurred (temporary road closure on Woodstock Lane South during the flooding). [MUL] (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>148 m³/s; 16&ndash;year gauge record; 1 in 150 year annual chance; 23&ndash;24 December 2013; 17 January 2014; 1 February 2014 [IMG,MUL] (p11)</p></div><div class="nugget-popup quant"><p>1 in 50 year annual chance event (p19)</p></div><div class="nugget-popup quant"><p>1 in 50 year annual chance event (p21)</p></div></div></body></div>`)[0];

                var html_e52afb705d980ca6bef054a0b35fbc60 = $(`<div id="html_e52afb705d980ca6bef054a0b35fbc60" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Weybridge</h1><div class="nugget-popup"><p>Internal property flooding at multiple addresses; road closures reported in the area. [TAB] (p2)</p></div><div class="nugget-popup"><p>Part of the 'Weybridge & Walton&ndash;on&ndash;Thames' sub&ndash;area investigated in this report; S19 investigation sites and property flooding occurred in this sub&ndash;area during winter 2013/14. [IMG] (p9)</p></div><div class="nugget-popup"><p>During winter 2013/14 river levels rose causing road closures and internal property flooding in the sub&ndash;area. Levels in the River Wey rose on 25 December 2013, peaking on 26 December 2013. Property flooding started on the afternoon of 25 December 2013; three properties in the vicinity of Wey Road were worst affected. A later February 2014 Thames high&ndash;flow event caused backing up in the River Wey and contributed to wider property flooding in the sub&ndash;area. [MUL] (p24)</p></div><div class="nugget-popup"><p>EA Flood Ambassadors were on site for the December 2013 and January 2014 events; EA had flood data recorders on site for the January 2014 event; the EA issued flood warnings to registered property owners (see quant). Temporary road closures were implemented in Weybridge (Walton Lane, Jessamy Road) during the flooding. [MUL] (p25)</p></div><div class="nugget-popup"><p>Experienced fluvial flooding during the winter 2013/14 event, the River Wey being identified as the main source for Weybridge; this contributed to internal property flooding incidents across Elmbridge. (p27)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 properties; 33 properties [MUL] (p24)</p></div><div class="nugget-popup quant"><p>363 registered property owners (Dec 2013); 383 registered property owners (Feb 2014) [MUL] (p25)</p></div><div class="nugget-popup quant"><p>approximately 100 incidents of internal property flooding in Elmbridge (across the borough, including Weybridge and Walton&ndash;on&ndash;Thames) (p27)</p></div></div></body></div>`)[0];
