                var html_2a696d25d0290a1bf6b98d0dcc686494 = $(`<div id="html_2a696d25d0290a1bf6b98d0dcc686494" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Surrey</h1><div class="nugget-popup"><p>Operated the Flood Alert and Flood Warning service for the affected area; deployed flood ambassadors and flood data recorders to areas affected by flooding; carried out maintenance along the River Thames in locations including parts of Spelthorne as part of the response to the winter 2013/14 floods. [PAG] (p8)</p></div><div class="nugget-popup"><p>Widespread flooding across the county during winter 2013/14 from a range of sources; groundwater levels rose very high and caused groundwater flooding in parts of the county. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>Widespread flooding across Surrey during winter 2013&ndash;14 from multiple sources (high groundwater, fluvial flooding and local pluvial/surface water). In the Elmbridge area this led to inundation across flood plains from the River Mole and internal property flooding reported to the council. [IMG] (p10)</p></div><div class="nugget-popup"><p>County&ndash;wide impacts from the winter 2013/14 storms and flooding: roads and carriageways were damaged and assessed for repair (Project 400), roads were cleansed and re&ndash;opened, trees and debris were cleared and ditching carried out to restore drainage, Surrey Fire and Rescue Service pumped flood waters to protect residents and infrastructure, and coordination groups were convened to manage the response. [PAG] (p16)</p></div><div class="nugget-popup"><p>Historic flooding occurred across Surrey during the winter 2013/14 event; a large amount of information on property and historic flooding was gathered as a result of the winter 2013/14 floods to help identify areas most at risk. [PAG] (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>47 sites; approximately 100 incidents of internal property flooding [IMG] (p10)</p></div></div></body></div>`)[0];
