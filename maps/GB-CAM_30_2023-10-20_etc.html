                var html_a3483ee9aa6c27dd4228386520187825 = $(`<div id="html_a3483ee9aa6c27dd4228386520187825" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Meadowlands Park</h1><div class="nugget-popup"><p>A private piped drainage system from nearby properties connects to an inspection chamber on Meadowlands Park; the outfall and current configuration are unrecorded. The public open space's surface water system is to be CCTV surveyed and targeted for remedial/riparian works, implying it was implicated in the area's poor drainage during the flood events. [TAB,PAG,MUL] (p4)</p></div></div></body></div>`)[0];

                var html_08db82c37d06c62871f2ac851c11fbb8 = $(`<div id="html_08db82c37d06c62871f2ac851c11fbb8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bridge End, Earith</h1><div class="nugget-popup"><p>Properties on Bridge End and Vermuyden experienced surface water flooding that significantly affected external premises. One report included internal property flooding; sanitation and ability to use toilets were compromised. Some households deployed pumps to prevent internal flooding. [MUL] (p1)</p></div><div class="nugget-popup"><p>On 20th October 2023 surface water accumulated at the low point on Bridge End (reported depth ~230mm). Gardens and outbuildings were flooded with surface water that included foul elements (e.g. toilet paper). Residents reported the local Anglian Water pumping station threshold had an issue on that date, affecting pumping performance. [MUL] (p3)</p></div><div class="nugget-popup"><p>Intense, repeated rainfall overwhelmed the sewerage network and accumulated at topographic low points on Bridge End. Road gullies may have been partially silted, carriageway drainage was a focus for inspection, and previous installation of non&ndash;return valves to protect properties on Bridge End is being reviewed &mdash; indicating properties and the highway were affected by flooding during the events. [TAB,MUL] (p4)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 flood reports (October 2023); 1 report with internal property flooding; 3 properties deployed pumps; 5 properties reported further flooding (January 2024) [MUL] (p1)</p></div><div class="nugget-popup quant"><p>230mm depth [MUL] (p3)</p></div></div></body></div>`)[0];

                var html_2b64060fcae6b8517d3c1a7a7c9e32f9 = $(`<div id="html_2b64060fcae6b8517d3c1a7a7c9e32f9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Vermuyden, Earith</h1><div class="nugget-popup"><p>Properties on Bridge End and Vermuyden experienced surface water flooding that significantly affected external premises. One report included internal property flooding; sanitation and ability to use toilets were compromised. Some households deployed pumps to prevent internal flooding. [MUL] (p1)</p></div><div class="nugget-popup"><p>On 20th October 2023 surface water accumulated at the low point on Vermuyden (reported depth ~230mm). Foul inspection chambers on Vermuyden were overwhelmed by surface water ingress and were reported as surcharging; residents described the surcharging water as appearing &#8220;clean&#8221; (i.e. surface water ingress into foul chambers). [MUL] (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 flood reports (October 2023); 1 report with internal property flooding; 3 properties deployed pumps; 5 properties reported further flooding (January 2024) [MUL] (p1)</p></div><div class="nugget-popup quant"><p>230mm depth [MUL] (p3)</p></div></div></body></div>`)[0];

                var html_6aa8313ad43104a1add8f3e18ea78bad = $(`<div id="html_6aa8313ad43104a1add8f3e18ea78bad" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Earith</h1><div class="nugget-popup"><p>The village of Earith experienced surface water flooding concentrated in southern and central parts, with reported impacts to properties (external premises significantly affected) and compromised sanitation/toilet use. The map and report note a history of surface water flooding in this location. [IMG,TAB,MUL] (p1)</p></div><div class="nugget-popup"><p>Surface water flooding occurred in the Earith area during heavy rainfall (19&ndash;20 October 2023 and 3&ndash;5 January 2024). The affected area is low&ndash;lying with a distinct depression (shown in the LiDAR DTM), which led to water accumulation and higher&ndash;than&ndash;modelled incidence of flooding; residents were visited by the LLFA on 31 October 2023. The report notes that observed flooding exceeded the mapped surface&ndash;water risk and that some areas marked as high risk were less severely affected, indicating extremely localised factors influenced where flooding occurred. [PAG,MUL] (p2)</p></div><div class="nugget-popup"><p>High&ndash;intensity rainstorms caused surface water flooding in Earith, flooding at least four properties. Foul inspection chambers were reported surcharging with ingress of surface water (foul elements present in some flooded gardens/outbuildings), indicating interaction between surface water and the foul sewer network. [MUL] (p3)</p></div><div class="nugget-popup"><p>Intense, repeated rainfall on 20 October 2023 and 5 January 2024 overwhelmed the sewerage network and caused water to accumulate at topographic low points in Earith. Local carriageway drainage and gullies may have been compromised by silt/debris (last cleaned Sept 2023), there is a private piped drainage connection into an inspection chamber on Meadowlands Park whose outfall is unknown, and flooding is a recurring issue requiring further investigation (including non&ndash;return valve effectiveness on Bridge End). [TAB,MUL] (p4)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 flood reports (October 2023); 5 properties reported further flooding (January 2024); 1 report included internal property flooding; 3 properties deployed pumps [IMG,TAB,MUL] (p1)</p></div><div class="nugget-popup quant"><p>4 properties [MUL] (p3)</p></div></div></body></div>`)[0];
