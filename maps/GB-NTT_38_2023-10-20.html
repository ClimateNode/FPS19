                var html_fca9b6b7e37ce03e76fdc4f724da8bd6 = $(`<div id="html_fca9b6b7e37ce03e76fdc4f724da8bd6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>North Beck</h1><div class="nugget-popup"><p>Prolonged heavy rainfall caused North Beck water levels to rise and ultimately overwhelm the culvert under Dunham Road; the beck burst its banks, producing flows that overtopped and then ran down Dunham Road and that contributed to internal flooding of nearby properties. [IMG,PAG] (p3)</p></div><div class="nugget-popup"><p>Prolonged heavy rainfall caused North Beck to rise and overwhelm the culvert under Dunham Road; the beck overtopped its banks, sending water over and then down Dunham Road and along the road approaches (pushed by the bridge hump) and contributing to flow from fields onto the road and into adjacent fields. The breach/overflow directly caused internal flooding to nearby residential properties. [IMG,PAG] (p4)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>five residential properties [IMG,PAG] (p3)</p></div><div class="nugget-popup quant"><p>five residential properties [IMG,PAG] (p4)</p></div></div></body></div>`)[0];
