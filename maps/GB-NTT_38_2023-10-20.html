                var html_bef7ebc22f6419e25e20bc13e01e0ba6 = $(`<div id="html_bef7ebc22f6419e25e20bc13e01e0ba6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>North Beck</h1><div class="nugget-popup"><p>Prolonged heavy rainfall caused water levels in the North Beck to rise and overwhelm the culvert beneath Dunham Road. Water flowed out of bank and initially passed over the road and back into the beck and fields, then rose further and ran down Dunham Road (following the road profile caused by the bridge hump), sending flows north and south of the bridge and into adjacent fields. These flows, together with overland flow from fields west of Laneham Road, led to internal flooding of residential properties on Dunham Road. [IMG,PAG] (p3)</p></div><div class="nugget-popup"><p>Prolonged heavy rainfall caused water levels in the North Beck to rise and the beck to overtop/overwhelm the culvert under Dunham Road. Floodwater initially passed over the road and back into the beck and fields, then rose further and ran down the road (guided by the bridge hump), with additional significant flow from fields west of Laneham Road onto Dunham/Dunham Road and into adjacent fields. These flows directly caused internal flooding of nearby properties. [IMG,PAG] (p4)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 residential properties [IMG,PAG] (p3)</p></div><div class="nugget-popup quant"><p>five residential properties [IMG,PAG] (p4)</p></div></div></body></div>`)[0];
