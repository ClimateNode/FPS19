or England & Wales); more than 160,000 warning messages sent directly to homes and businesses [IMG] (p6)</p></div></div></body></div>`)[0];

                var html_aa0bdbb8b354720ddb30c37423d14d3f = $(`<div id="html_aa0bdbb8b354720ddb30c37423d14d3f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lincolnshire</h1><div class="nugget-popup"><p>A forecast&ndash;led coastal surge event in early December 2013 led to a large multi&ndash;agency emergency response in Lincolnshire; the surge caused overtopping and breaches of defences, evacuations, rescues of people isolated by floodwaters, and inundation of properties. [IMG] (p2)</p></div><div class="nugget-popup"><p>County&ndash;wide sea defences were severely tested protecting homes, businesses and 220,000 hectares; widespread standing water was managed by drainage and high&ndash;volume pumping; Boston (within the county) suffered the largest number of flooded residential properties. (p5)</p></div><div class="nugget-popup"><p>The event required multi&ndash;agency coordination in Lincolnshire: reliance on mutual aid and national specialist assets, prolonged deployments of responders, and targeted welfare, evacuation and medical support for vulnerable people. Recommendations were made to the Local Resilience Forum to improve planning, information&ndash;sharing and integration of community volunteers. (p6)</p></div><div class="nugget-popup"><p>Coastal surge and associated high tides/onshore winds can cause overtopping and defence breaches affecting Lincolnshire: mapped flood depth, velocity and extent have been developed for defence overtopping and defence breach scenarios. Reasonable worst&ndash;case (multiple breaches) impacts include large numbers of properties, infrastructure and casualties; overtopping&ndash;only scenarios (1:200 and 1:1000 annual chance tide levels) give quantified property and premise impacts. (p7)</p></div><div class="nugget-popup"><p>Flood defences were overtopped along 18&ndash;20 km of coastline, causing large areas of scour (e.g. Mablethorpe), four breach locations at Boston Haven, Gibraltar Point (Bull Dog Bank), Tetney Marsh and Friskney, inundation of extensive agricultural land, damage to industrial/commercial sites and local infrastructure, failure of ~90 m of floodwall at Skegness, and damage to pumps at Black Sluice Gate. (p12)</p></div><div class="nugget-popup"><p>Defence overtopping and flood damage to coastal visitor centres: Gibraltar Point Visitor Centre and the Wash Study Centre. Preventive action at Donna Nook allowed seals to seek refuge on higher ground in the dunes; reported seal mortalities were low. [PAG] (p14)</p></div><div class="nugget-popup"><p>Lincolnshire was placed under an anticipated Amber flood guidance level for the coastal/ tidal surge on 5 December 2013; multi&ndash;agency contingency planning, pre&ndash;deployment of assets and precautionary SCG arrangements were implemented across the county in response to the threat of spray, overtopping and a predicted River Haven surge. [PAG] (p16)</p></div><div class="nugget-popup"><p>The county faced a medium overall risk of significant coastal/tidal flooding (FGS raised to 'Amber'); Flood Alerts were issued for the Lincolnshire coastline, coastal floodgates were patrolled/closed and contingency planning and escalation arrangements (including opening the County Emergency Centre) were activated for the predicted high tides on 5&ndash;6 December 2013. [PAG] (p17)</p></div><div class="nugget-popup"><p>Environment Agency flood warnings ('be prepared') issued for waterside properties in and around Boston (waterside properties between Town Bridge and Haven Bridge, Grand Sluice and the Docks) and selected coastal areas from Gibraltar Point to Sutton Bridge; Boston identified as the focus for high tide periods; multi&ndash;agency evacuation planning authorised and surge task forces established (Boston and Louth) to respond to coastal flooding risk. [IMG,PAG] (p18)</p></div><div class="nugget-popup"><p>County subject to an elevated flood threat (FGS 'Amber'); tactical coordination included evacuation planning and multi&ndash;agency flood response. Internal Drainage Boards activated emergency pumping arrangements; an evacuation hub and forward base were identified (Princess Royal Sports Arena) and voluntary sector and health partners mobilised to support potential evacuations. Fire & Rescue Service identified flood rescue capacity to support large&ndash;scale rescues. [IMG,PAG] (p19)</p></div><div class="nugget-popup"><p>County&ndash;scale response to a coastal/tidal surge on 5 December 2013: evacuation planning for vulnerable areas (including planning for up to 600 properties), deployment of empty and filled sandbags to coastal towns (Skegness, Mablethorpe and strategic coastal locations), cancellation of shipping movements on The Haven, requests for Military Assistance to Civil Authorities to access PWOG for evacuation, mutual aid mobilised (police and FRS) and Highways dealing with storm/wind damage (fallen trees). [PAG] (p20)</p></div><div class="nugget-popup"><p>Area subject to highest (Red) coastal flood threat; large&ndash;scale evacuation planning and mobilisation across the county including establishment of surge task forces, opening of strategic evacuation centres, and deployment of rescue assets. (p21)</p></div><div class="nugget-popup"><p>Multiple flood impacts across the county: areas in Boston adjacent to the river were flooded mainly due to overtopping; damage to a low floodwall; River Haven burst its banks flooding neighbouring streets; evacuees transported from assembly points; impacts on water pumping stations and road closures; emergency services deployed including mutual aid requests and IDB pumping equipment sent to assist. (p24)</p></div><div class="nugget-popup"><p>County&ndash;wide impacts from the surge and breaches included a 40m breach at Slippery Gowt affecting local waste sites, flooding of agricultural land near Gibraltar Point, large&ndash;scale evacuation activity around Boston, and breaches/concerns at River Haven and secondary defences at Wyberton Marsh. (p27)</p></div><div class="nugget-popup"><p>Coastal flooding and damage to flood defences with ongoing pumping operations to remove standing water; community impact and flood&ndash;extent assessments carried out; door&ndash;to&ndash;door welfare checks and housing support provided to displaced or affected households; debris and property damage observed in affected towns (including Boston). (p29)</p></div><div class="nugget-popup"><p>Experienced a tidal surge on 5 December 2013 that led to multi&ndash;agency response and coordinated recovery. Impacts included damage and weaknesses to coastal/tidal flood defences (notably around Boston), and effects on households, businesses and infrastructure prompting structured recovery and investigation. (p33)</p></div><div class="nugget-popup"><p>The Lincolnshire coastline was hit by a coastal surge at high tide on the evening of 5th December 2013. (p34)</p></div><div class="nugget-popup"><p>Lincolnshire's coastline was affected by the tidal surge at high tide on 5th December 2013; county&ndash;level flood risk assessments rose from Low to High within 12 hours before the surge, concentrating flood impacts on the Boston FWAs which flooded to extents matching mapped areas. [IMG,PAG] (p35)</p></div><div class="nugget-popup"><p>Flooding associated with the tidal Trent and the coastal surge affected parts of the county; specifically, flooding impacted households in Susworth (West Lindsey), and the developing tidal/river flooding prompted multi&ndash;agency response and precautionary evacuation planning. [PAG] (p37)</p></div><div class="nugget-popup"><p>Communities within Lincolnshire were affected by flooding from the tidal River Trent (example: Susworth). (p38)</p></div><div class="nugget-popup"><p>County&ndash;level escalation and multi&ndash;agency response to a coastal surge threat: FGS level increased to Amber, strategic and tactical coordination structures activated, military liaison and voluntary sector coordination activated, and county command support functions mobilised at the County Emergency Centre. [PAG] (p39)</p></div><div class="nugget-popup"><p>East Coast coastal flooding on 5 Dec 2013 severely tested sea defences; defences protected large areas but some properties and businesses flooded. Multi&ndash;agency response implemented including pre&ndash;deployment, evacuation and flood rescue. (p43)</p></div><div class="nugget-popup"><p>Experienced a coastal surge on 5 December 2013 that required a coordinated multi&ndash;agency evacuation and response. Recovery planning was disrupted by the threat of secondary flooding from the Wyberton breach. (p45)</p></div><div class="nugget-popup"><p>Experienced a major coastal surge on 5th December 2013 that produced coastal/tidal flooding across the county and provided a significant test of multi&ndash;agency response and recovery capabilities; highlighted need for ongoing investment in defences and resilience. (p49)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than 720 residential and commercial properties inundated; 3 casualties [IMG] (p2)</p></div><div class="nugget-popup quant"><p>103,000 homes and businesses; 220,000 hectares of land (p5)</p></div><div class="nugget-popup quant"><p>80,500 properties at risk (reasonable worse&ndash;case, multiple breaches); 3 hospitals; 29 schools; 32 care homes; 1 prison; 20 fatalities; 300 casualties; 50,000 evacuees; Local infrastructure: 6 fire/police/ambulance stations; 176km of road; 30 bridges; 11.8km of rail; 6 major hazard sites; 32 electricity sub&ndash;stations; 63 water pumping; 15 sewage works; Overtopping&ndash;only 1:200: 4,383 residential properties at risk (of which approximately 900 &gt;0.5m flood depth); 229 commercial premises; 85 'socially vulnerable' premises; Total 4,697 properties; Overtopping&ndash;only 1:1000: 9,129 residential properties at risk; 431 commercial premises; 122 'socially vulnerable' premises; Total 9,682 properties (p7)</p></div><div class="nugget-popup quant"><p>18&ndash;20 km of flood defences overtopped; 4 breach locations; 1,700 hectares inundated; 100+ industrial/commercial sites damaged; 90 metres of floodwall failed; 3 of the 5 main pumps damaged (p12)</p></div><div class="nugget-popup quant"><p>30,300 properties [IMG,PAG] (p18)</p></div><div class="nugget-popup quant"><p>600 properties; 6,000 properties; 38,000 properties; 15% of affected households; 240 rescues an hour [IMG,PAG] (p19)</p></div><div class="nugget-popup quant"><p>up to 600 properties; 8 weather/wind related incidents; 5 mobile Beat Duty Units (25 staff each) &mdash; 3 deployed to Boston, 2 deployed to Louth [PAG] (p20)</p></div><div class="nugget-popup quant"><p>approx. 350 properties flooded; approximately 220 evacuees transported; 1 casualty (asthma attack); damage to the top 50 cm of a 10 metres low floodwall; Two IDB high&ndash;volume pumps deployed to Boston (unable to operate due to insufficient hose lengths/couplings). (p24)</p></div><div class="nugget-popup quant"><p>40m breach at Slippery Gowt; 500 acres of agricultural land flooded; 263 assisted evacuees (all from Boston area); 1,800 residential properties identified as potentially at risk (p27)</p></div><div class="nugget-popup quant"><p>529 residential properties; 50% uninsured; 114 families in need of alternative accommodation; 300 tonnes of waste collected; approx. 90 metre of floodwall failed at Skegness; 3 of the 5 main pumps at Black Sluice Gate damaged (p32)</p></div><div class="nugget-popup quant"><p>approx. 770 properties across BOS1A and BOS1B [IMG,PAG] (p35)</p></div><div class="nugget-popup quant"><p>4 households [PAG] (p37)</p></div><div class="nugget-popup quant"><p>4 households (p38)</p></div><div class="nugget-popup quant"><p>103,000 homes and businesses protected; 220,200 hectares of land protected; 720+ households and businesses suffered flooding; 203 people evacuated; 30,300 people received flood warnings direct from the EA (p43)</p></div></div></body></div>`)[0];

                var html_bc48139a935b0f4b19c9dbdd00e15872 = $(`<div id="html_bc48139a935b0f4b19c9dbdd00e15872" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Port of Boston</h1><div class="nugget-popup"><p>The port was threatened by floodwaters; protecting infrastructure included managing defences and addressing threats to the port. (p5)</p></div><div class="nugget-popup"><p>Cancelled shipping movements on The Haven during the evening high tide period (6&ndash;9pm) because of the tidal/coastal flood risk. (p20)</p></div><div class="nugget-popup"><p>Port managed continuing speed restrictions at high tides following the flooding event; shipping operations were affected and subsequently resumed. (p28)</p></div></div></body></div>`)[0];

                var html_5ccf0b3f83794266ce0a732e62e33fbf = $(`<div id="html_5ccf0b3f83794266ce0a732e62e33fbf" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Boston Dock</h1><div class="nugget-popup"><p>The docks lie within the BOS1A/B warning footprint and the report states the actual flooding closely matched those areas; the docks therefore experienced inundation, overtopping and increased breach risk during the tidal surge on 5 December 2013. [IMG] (p35)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approx. 770 properties (total in BOS1A and BOS1B) [IMG] (p35)</p></div></div></body></div>`)[0];

        var popup_179db65133f6edb108ecd46bfcacc600 = L.popup({});

        
            
                var html_6c8a8b20c0224346eb3297adaeb2bb69 = $(`<div id="html_6c8a8b20c0224346eb3297adaeb2bb69" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Boston</h1><div class="nugget-popup"><p>The town experienced flooding during the coastal surge; the majority of the 6,072 residential properties flooded in the county were located in Boston. (p4)</p></div><div class="nugget-popup"><p>Extensive flooding of residential properties (largest number of flooded homes in the county); standing water was dispersed within 48 hours by the drainage system and high&ndash;volume pumping; evacuations of at&ndash;risk properties (including assisted evacuation of people) and a structured community recovery were required. (p5)</p></div><div class="nugget-popup"><p>Residential properties and local streets were flooded; the majority of the 607 residential properties flooded across the county were located in Boston (together with Trusthorpe and Susworth). Businesses in the town were also affected as part of the county&ndash;wide business flooding. [IMG] (p13)</p></div><div class="nugget-popup"><p>Environment Agency reported pre&ndash;identified seepage through flood defences in Boston. (p15)</p></div><div class="nugget-popup"><p>Tidal flooding threat to Boston: concerns about seepage through ground and defences, Flood Alerts issued for the coastline, and contingency planning for possible overtopping or breach of defences. The Environment Agency identified approximately 500 properties at risk from seepage under the forecast scenario and used a worse&ndash;case breach model to identify a further 18,000 properties potentially at risk. (p17)</p></div><div class="nugget-popup"><p>Designated focus for high tide periods; evacuation planning authorised by the Strategic Coordinating Group; flood warnings ('be prepared') issued covering waterside areas including Grand Sluice and the Docks; multi&ndash;agency surge task force established to respond at Boston. (p18)</p></div><div class="nugget-popup"><p>Evacuation of known vulnerable people in a predicted flood zone; multi&ndash;agency surge task force established; Princess Royal Sports Arena opened as an evacuation processing hub; FRS deployed 6 type B flood rescue boat teams plus support rafts and 7 fire appliances to Boston; Nottinghamshire Underwater Search Unit (13 staff and boat) deployed to Boston; EMAS deployed a HART to Boston. (p21)</p></div><div class="nugget-popup"><p>Higher&ndash;than&ndash;expected tidal surge prompted EA advice to prepare for possible breaches to defences at the point of high tide; multi&ndash;agency evacuation process was fully under&ndash;way; FRS received the first call about flooding on Church Street and experienced a dramatic rise in calls lasting about 3 hours; FRS (supported by EMAS HART) carried out rescues and assisted residents isolated by floodwater; the surge task force/bronze relocated operations (Fen Road Depot) due to flood threat to Boston Fire station; evacuees were re&ndash;routed and a temporary alternative evacuation centre was used at Stickney. [PAG] (p22)</p></div><div class="nugget-popup"><p>High tide surge caused water to overtop barriers and flood urban streets and waterside residential properties; water entered business premises on Slippery Gowt Lane; emergency responders (police and FRS) were unable to reach some addresses due to depth and velocity of floodwater; NPAS helicopter deployed to provide overhead visual intelligence. [IMG,PAG] (p23)</p></div><div class="nugget-popup"><p>River Haven burst its banks and adjacent areas flooded mainly due to overtopping. Damage to the top 50 cm of a 10&ndash;metre low floodwall. Road closures and pumping operations (Fen Road). Approximately 220 evacuees transported from Princess Royal Sports Arena to alternative centres; one casualty (asthma attack) recorded. Two IDB high&ndash;volume pumps deployed but unable to operate due to insufficient hose lengths/couplings. [PAG] (p24)</p></div><div class="nugget-popup"><p>Areas of Boston adjacent to the River Haven were inundated when the river overtopped its banks. Flooding is reported across neighbouring streets; the top 50 cm of a 10 metre low floodwall was damaged. The river/bridge disruption led to road bridge closure during the morning high tide, evacuees were relocated to a consolidated centre, and emergency services were deployed to respond. [IMG,PAG] (p25)</p></div><div class="nugget-popup"><p>Experienced flooding that led to mass evacuation and recovery operations; flood response included pumping of floodwater, local recovery meetings and coordination. Local infrastructure impacts included breaches of defences affecting waste facilities and power failures. [IMG,PAG] (p26)</p></div><div class="nugget-popup"><p>Flooding in the Boston area led to an evacuation operation and support for affected residents; vulnerable residents relocated into care homes and casualties reported from the previous evening's flooding. [PAG] (p27)</p></div><div class="nugget-popup"><p>Residents were evacuated as a precaution and 20 evacuees from Boston sought alternative accommodation; home inspections and overnight hotel accommodation were arranged, with liaison between SCG, Boston Borough Council and health partners; port operations subject to speed restrictions at high tides. (p28)</p></div><div class="nugget-popup"><p>Coastal/ tidal flooding on 5th December 2013 inundated residential streets in Boston; extensive household property damage and large volumes of damaged furniture and debris placed along streets; community impact and flood extent assessments and door&ndash;to&ndash;door welfare checks conducted; waste collection and recovery operations mounted. [IMG,PAG] (p29)</p></div><div class="nugget-popup"><p>Flood defence failures and erosion led to widespread flooding of residential areas; garden wall collapse; clear&ndash;up and waste disposal operations required; some schools damaged or closed (Boston Grammar). [PAG] (p30)</p></div><div class="nugget-popup"><p>Sea&ndash;defence failures in Boston including a garden wall collapse and erosion of defences at Slippery Gowt Lane (Wyberton). Emergency response teams visited properties, waste&ndash;clearance and hygiene advice operations mobilised, and schools/local services disrupted (Boston Grammar remained closed); damage assessments and repair works initiated. [PAG] (p31)</p></div><div class="nugget-popup"><p>Residential properties flooded across the borough from the December surge events; large&ndash;scale recovery activity including alternative accommodation and waste clearance; damage to natural environment and agricultural land; concerns over compromised local flood defences (White Horse Lane area) and deployment of temporary demountable defences. [PAG] (p32)</p></div><div class="nugget-popup"><p>Boston was a focal area for the surge: previously damaged defences and identified weaknesses led to flood guidance and alerts, recovery activity and a multi&ndash;agency response. Localised tidal flood risk around Boston prompted assessment, revisits to properties and a formal recovery/de&ndash;brief process. (p33)</p></div><div class="nugget-popup"><p>Central Boston's river corridor and adjacent central/southern urban areas experienced flooding during the tidal surge on 5th December 2013; the mapped flooded zones corresponded to the FWAs and included waterside properties and nearby transport/civic infrastructure. [IMG] (p35)</p></div><div class="nugget-popup"><p>Local Resilience Forum deployed its main response efforts in Boston during the event based on EA predictions; partners used mapping to pre&ndash;identify vulnerable premises and assets (including care facilities and other infrastructure) and to prioritise preventive evacuation and protection of those premises. [IMG,PAG] (p36)</p></div><div class="nugget-popup"><p>Declaration of an Emergency at 11:05 on 5th December 2013 when probable impacts of the surge became clear; evacuation orders for 'at risk' areas in Boston were initiated (a delay in initiating the evacuation decision on the afternoon of 5th December required a one-off whole-room announcement to resolve confusion); business continuity planning for flooding affecting Boston Pilgrim Hospital and its A&amp;E were scoped and managed; mutual aid and local coordination for flood response were managed by Boston Borough Council. (p40)</p></div><div class="nugget-popup"><p>Parts of the town experienced coastal flooding that affected households and businesses and required preventive evacuations of properties at immediate risk. (p43)</p></div><div class="nugget-popup"><p>Hosted the initial evacuation hub at the Princess Royal Sports Arena to receive and assess evacuees as part of the flood evacuation operation. (p44)</p></div><div class="nugget-popup"><p>Coastal surge flooding led to evacuation of residents, homes being flooded and disrupted safe access. Evacuees were transported to view their flooded homes the following Friday; alternative accommodation (mainly hotel based) was provided where requested. Initial community recovery was started on the morning of 6th December but was deflected by the threat of secondary flooding from the Wyberton breach. [PAG] (p45)</p></div><div class="nugget-popup"><p>Areas and properties in Boston were identified as flooded following the coastal surge on 5th December 2013. Immediate priorities included assessment of critical structures (notably flood defences), clean up and salvage, detailed analysis and identification of flooded properties. Police&ndash;led street surveys and door&ndash;knocking with occupant questionnaires were used to establish priorities for assistance to affected households and businesses. (p46)</p></div><div class="nugget-popup"><p>The early December surge and subsequent flooding caused homes and businesses in Boston to flood, created immediate waste&ndash;management challenges (exacerbated by damage to the town's only waste disposal site), required door&ndash;to&ndash;door surveys and a large recovery operation to support affected households and businesses. [PAG] (p47)</p></div><div class="nugget-popup"><p>Boston experienced flooding and subsequent recovery activity; learning from Boston's recovery was proposed as a case study and used to inform a countywide Flood Victim Impact Assessment questionnaire and the Flood Victim Pack. (p51)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>majority of 6,072 residential properties (p4)</p></div><div class="nugget-popup quant"><p>203 people (p5)</p></div><div class="nugget-popup quant"><p>607 residential properties flooded (total in county; majority in Boston, Trusthorpe and Susworth); 121 businesses flooded (county total) [IMG] (p13)</p></div><div class="nugget-popup quant"><p>500 properties; 18,000 properties (p17)</p></div><div class="nugget-popup quant"><p>30,300 properties (EA flood warnings issued overall); 1 surge task force at Boston (p18)</p></div><div class="nugget-popup quant"><p>more than 50 flood&ndash;related incident calls [IMG,PAG] (p23)</p></div><div class="nugget-popup quant"><p>350 properties; top 50 cm of a 10 metres low floodwall; 220 evacuees; 1 casualty; 2 IDB high&ndash;volume pumps [PAG] (p24)</p></div><div class="nugget-popup quant"><p>approx. 350 properties flooded; top 50 cm of a 10 metres low floodwall damaged [IMG,PAG] (p25)</p></div><div class="nugget-popup quant"><p>263 assisted evacuees; 40 vulnerable persons relocated into care homes; 3 casualties (not serious); 322 properties affected by power failures; 40m breach of defences [IMG,PAG] (p26)</p></div><div class="nugget-popup quant"><p>263 assisted evacuees; 40 vulnerable persons relocated into care homes; 3 non&ndash;serious casualties [PAG] (p27)</p></div><div class="nugget-popup quant"><p>20 evacuees (p28)</p></div><div class="nugget-popup quant"><p>400 properties confirmed flooded; more than 700 properties visited; 2 defence failures; more than 300 white goods collected; 1 school (Boston Grammar) remained closed [PAG] (p30)</p></div><div class="nugget-popup quant"><p>700 properties visited; 400 properties confirmed flooded [PAG] (p31)</p></div><div class="nugget-popup quant"><p>529 residential properties flooded; 114 families in need of alternative accommodation; 300 tonnes of waste collected [PAG] (p32)</p></div><div class="nugget-popup quant"><p>approx. 770 properties across BOS1A and BOS1B [IMG] (p35)</p></div><div class="nugget-popup quant"><p>203 people evacuated; 720+ households and businesses flooded (p43)</p></div></div></body></div>`)[0];
