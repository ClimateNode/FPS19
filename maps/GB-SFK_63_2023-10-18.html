                var html_30ffad7e16473f2974d4548410527841 = $(`<div id="html_30ffad7e16473f2974d4548410527841" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Grinstead Barn</h1><div class="nugget-popup"><p>Fields to the east around Grinstead Barn directed overland flow into the town; a manhole at the entrance to the Grinstead Barn turnoff was surcharging and was a source of floodwater flowing onto Barking Road and towards Foxglove Avenue. Continued surcharging from this area was reported after the storm. (p15)</p></div><div class="nugget-popup"><p>A manhole at the entrance to the Grinstead Barn turnoff was observed surcharging, producing water that flowed north&ndash;east along Barking Road towards Foxglove Avenue and adding to floodwater on the road. An inspection chamber to the west of Barking Road was blocked and contributed additional water flowing along the road. Suffolk Highways carried out jetting and initial investigations and planned further action; reports indicate surcharging has persisted since Storm Babet. [IMG,PAG] (p16)</p></div><div class="nugget-popup"><p>Drainage problems reported below Barking Road near Grinstead Barn; recommended investigation to resolve flooding/drainage issues affecting this area. [TAB] (p35)</p></div><div class="nugget-popup"><p>Drainage problems below Barking Road near Grinstead Barn prompted a recommended CCTV survey and any required maintenance of the local culvert to restore drainage functionality and reduce flood risk. (p38)</p></div></div></body></div>`)[0];

                var html_c0538a15b2453ee130f0c5b7cf6798c6 = $(`<div id="html_c0538a15b2453ee130f0c5b7cf6798c6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Gipping</h1><div class="nugget-popup"><p>Main River channels (River Gipping) overtopped and, when combined with converging overland flow paths, contributed to internal flooding of properties, infrastructure and services in Needham Market. (p4)</p></div><div class="nugget-popup"><p>River level gauges on the River Gipping recorded peak water levels during the event (surpassing previous records from Feb 1979) and the river contributed to fluvial flooding in the area. [PAG,MUL] (p7)</p></div><div class="nugget-popup"><p>The main river Gipping was a primary fluvial influence contributing to fluvial flooding in Needham Market during Storm Babet, causing inundation of adjacent low&ndash;lying areas. [PAG] (p12)</p></div><div class="nugget-popup"><p>Overtopped its banks near Coddenham Road, causing floodwater to flow onto the road and flood nearby properties to the east. (p20)</p></div><div class="nugget-popup"><p>The main river Gipping experienced high flows during the October 2023 event which contributed to flood risk to adjacent areas; actions recommended include maintaining main river channel and investigating bunds/defences (e.g. between Pinecroft and Coddenham Road) to manage flooding from the Gipping. [TAB] (p35)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2&ndash;3 ft floodwater depth on Coddenham Road (p20)</p></div></div></body></div>`)[0];

                var html_8590891652504e06362852d3642b3d49 = $(`<div id="html_8590891652504e06362852d3642b3d49" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Orwell</h1><div class="nugget-popup"><p>The River Gipping experienced very high flows during Storm Babet; river level gauges recorded peak levels (recorded at Stowmarket on 20 October and Bramford on 21 October) and the River Gipping was included in flood alerts/warnings affecting Needham Market. [PAG,IMG,MUL] (p8)</p></div><div class="nugget-popup"><p>River gauge data show the River Gipping reached record peak water levels (surpassing the previous recorded maximum from Feb 1979) at Stowmarket (peak 22:58 GMT on 20 Oct) and at Bramford (peak 14:40 GMT on 21 Oct). The river peak contributed to flood warnings for Needham Market and downstream impacts as the flood peak travelled. (p9)</p></div><div class="nugget-popup"><p>River Gipping overtopped/acted as the main fluvial influence and contributed to fluvial flooding in Needham Market during Storm Babet, affecting low&ndash;lying central and eastern parts of the town. [PAG] (p11)</p></div><div class="nugget-popup"><p>The river overtopped its banks upstream of Hawks Mill; floodwater from the river merged with overland flows and inundated the floodplain, causing internal flooding to properties on High Street and adjacent roads. [PAG] (p21)</p></div><div class="nugget-popup"><p>Banks of the River Gipping overtopped upstream of Hawks Mill; floodwater from the river merged with overland flows and tributary flows, inundating much of the River Gipping floodplain which remained in flood for a considerable period. The Environment Agency&ndash;operated sluice gate upstream of Hawks Mill was opened fully and functioned throughout the event; the privately owned gate below the mill was also opened at full capacity. [PAG] (p22)</p></div><div class="nugget-popup"><p>Peak river levels reached in the early hours of 21 October; river flowed over the public footbridge, overtopped banks in multiple locations inundating the floodplain, rose close to overtopping the Crown Street floodwall, submerged outfalls and contributed fluvial flows into the highway drainage and onto Crown Street. [PAG] (p23)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 gauge locations recorded peak levels surpassing previous recorded maxima (p9)</p></div></div></body></div>`)[0];
                popup_3a8b33b7d83d9b6f6e440d9132509544.setContent(html_8590891652504e06362852d3642b3d49);

                var html_e2e06a73892c9e246f4a4a11391d5395 = $(`<div id="html_e2e06a73892c9e246f4a4a11391d5395" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Orchard Gate, Needham Market</h1><div class="nugget-popup"><p>The Orchard Gate watercourse exceeded its capacity and overtopped its banks during Storm Babet, contributing a fluvial element to internal flooding of properties in Needham Market. (p7)</p></div><div class="nugget-popup"><p>The Orchard Gate watercourse exceeded its capacity and overtopped its banks during Storm Babet, contributing to fluvial flooding of properties in Needham Market. [IMG,PAG] (p8)</p></div><div class="nugget-popup"><p>Orchard Gate acted as both a watercourse and a source of overland pluvial flow into Needham Market; it contributed to surface water and fluvial flooding in the town during Storm Babet. [PAG] (p11)</p></div><div class="nugget-popup"><p>The Orchard Gate watercourse is identified as a main fluvial influence and a source of overland/pluvial flow into Needham Market, contributing to the town's fluvial flood risk during Storm Babet. [PAG] (p12)</p></div><div class="nugget-popup"><p>The culvert carrying The Orchard Gate into Hawks Mill millpond (Mill Lades) was blocked with building material and debris, restricting flow and causing water to back up toward the railway embankment and the bottom of Victoria Gardens; witnesses reported significant flows through the culvert under the railway embankment. (p22)</p></div><div class="nugget-popup"><p>The Orchard Gate watercourse overtopped and/or was obstructed, causing internal flooding to properties on Highlands Close and John Swain Close. A culvert at the footbridge became blocked (trash screen/large debris), upstream vegetation impeded flow, and a tall brick headwall limited downstream capacity, all contributing to flooding and overtopping into gardens. (p24)</p></div><div class="nugget-popup"><p>Significant flows in the Orchard Gate watercourse from intense/prolonged rainfall led to overtopping of its banks and flow pathways into adjacent urban areas. Multiple constrictions (bridges, blocked culverts, overgrown vegetation) and a low spot in the southern bank contributed to floodwater overtopping into rear gardens on Highlands Close and John Swain Close and impeded conveyance downstream. (p25)</p></div><div class="nugget-popup"><p>Environment Agency completed maintenance on the full extent of the main river Orchard Gate watercourse (excluding the concrete channel NE of High Street into Luff Meadow and Network Rail land) as a pre&ndash; and post&ndash;Storm Babet intervention to manage conveyance and reduce flood risk. [TAB,PAG] (p35)</p></div><div class="nugget-popup"><p>Upper section of the Orchard Gate watercourse required a channel maintenance regime because it contributed to flooding; MSDC identified as landowner for this watercourse section. (p37)</p></div><div class="nugget-popup"><p>Orchard Gate watercourse was identified for topographic survey and hydraulic&ndash;modelling updates to improve understanding of flood flow through downstream residential streets, indicating it contributed to flooding risk during the event. (p39)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 45 properties (Needham Market) (p7)</p></div><div class="nugget-popup quant"><p>contributed to the majority of internal property flooding in Needham Market (over 45 properties townwide) [IMG,PAG] (p8)</p></div></div></body></div>`)[0];
                popup_36e4907a52cedea87c4a1956deeb7df0.setContent(html_e2e06a73892c9e246f4a4a11391d5395);

                var html_9e92d01cf596b754c1d618f485200a24 = $(`<div id="html_9e92d01cf596b754c1d618f485200a24" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Pinecroft Way, Needham Market</h1><div class="nugget-popup"><p>First signs of flooding were observed on Pinecroft Way on the morning of 20 October 2023; flooding was caused by water from the Lion Barn Drain rather than the River Gipping. [PAG] (p8)</p></div><div class="nugget-popup"><p>Pinecroft Way was affected by both pluvial (surface water) and fluvial (river/tributary) flooding during Storm Babet, experiencing inundation from surface&ndash;water run&ndash;off and river influence. [PAG] (p10)</p></div><div class="nugget-popup"><p>Pinecroft Way is a low&ndash;lying convergence area for overland flow and was affected by both surface water run&ndash;off and fluvial influences, flooding during Storm Babet. [PAG] (p11)</p></div><div class="nugget-popup"><p>Pinecroft Way is a low&ndash;lying street that experienced flooding during Storm Babet; it was identified as one of the worst affected areas due to converging overland flow paths and fluvial influence. [PAG] (p12)</p></div><div class="nugget-popup"><p>Internal flooding of properties caused by water rising up through road gullies. Floodwater travelled down the Lion Barn drain and backflowed into gullies (outfalls largely lacked non&ndash;return flaps), contributing to internal property flooding on the estate. [PAG] (p18)</p></div><div class="nugget-popup"><p>Water rose in the adjacent channel and initially surged up through road gullies; puddles formed from about 10:00 and water levels rose through the morning. Floodwater left the channel via multiple flowpaths (including historic infilled ditches), accumulated on the roadway and by early afternoon was impacting houses on both the northern and southern sides after bank overtopping. [IMG,PAG] (p19)</p></div><div class="nugget-popup"><p>Watercourse (Lion Barn Drain) overtopped its banks and left the channel; floodwater followed historic ditch/pond alignments across the estate, overtopping northern and southern banks and flooding properties on both sides of Pinecroft Way. Residents cut makeshift channels into the raised roadside bank to allow floodwater to escape onto Coddenham Road. [PAG] (p20)</p></div><div class="nugget-popup"><p>Floodwater routed via the Lion Barn drain and unflapped outfalls travelled onto Pinecroft Way, inundating road surfaces and affecting nearby properties. (p21)</p></div><div class="nugget-popup"><p>Flooding on Pinecroft Way caused by water emerging from a drainage gully and flow from the Lion Barn drain, leading to standing water on the carriageway and pavement. [PAG] (p27)</p></div><div class="nugget-popup"><p>Overflow from the Lion Barn drain inundated Pinecroft Way: floodwater covered a wooden footbridge, spread onto adjacent grass and residential frontages, and impeded pedestrian access. [IMG,PAG] (p28)</p></div><div class="nugget-popup"><p>Flooding from the Lion Barn Drain/main river and surface water affected Pinecroft Way; non&ndash;return flaps/valves on outfalls along the Lion Barn drain through Pinecroft Way are to be fitted (installation scheduled), and the area is targeted for topographic survey and hydraulic modelling to understand flood pathways. [TAB,PAG] (p35)</p></div><div class="nugget-popup"><p>Surface water flooding and backflow from the Lion Barn drain through Pinecroft Way caused local flooding; outfalls along the drain were identified for fitting non&ndash;return flaps to prevent future backflow. [PAG] (p36)</p></div><div class="nugget-popup"><p>Flooding occurred from blocked highway drainage and backflow along the Lion Barn drain through Pinecroft Way; non&ndash;return valve installation and drainage clearance/maintenance were scheduled to address the issue. (p37)</p></div><div class="nugget-popup"><p>Flooding through Pinecroft Way was investigated via hydraulic modelling; options for a bund between Pinecroft and Coddenham Road were proposed to enable estate drainage while maintaining defence from the River Gipping. (p39)</p></div><div class="nugget-popup"><p>Estate was affected by flood risk from the main river Gipping and local drainage issues. Investigations are required into a bund between Pinecroft and Coddenham Road to allow drainage from the estate while maintaining river flood defence. (p40)</p></div></div></body></div>`)[0];
                popup_a2e6b0c561d9108c14182b61a32a0925.setContent(html_9e92d01cf596b754c1d618f485200a24);

                var html_29451e7c67246180a4f60ecb36dbaf20 = $(`<div id="html_29451e7c67246180a4f60ecb36dbaf20" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Barking Road, Needham Market</h1><div class="nugget-popup"><p>Listed as part of Zone 1 of Needham Market which was affected during Storm Babet (20 October 2023); experienced flooding associated with the town&ndash;wide event (combination of fluvial and pluvial sources). (p8)</p></div><div class="nugget-popup"><p>Barking Road was affected by both pluvial (surface water) and fluvial (river/tributary) flooding during Storm Babet, resulting in inundation of the street during the event. [PAG] (p10)</p></div><div class="nugget-popup"><p>Identified in the report as being at significant risk of pluvial (surface water run&ndash;off) flooding and also shown at risk of fluvial flooding; the report states Barking Road was affected by flooding during Storm Babet (18 Oct 2023 &ndash; 21 Oct 2023). [PAG] (p11)</p></div><div class="nugget-popup"><p>Overland flow from fields around Grinstead Barn and from either side of Priestly Wood flowed along Barking Road into town; water pooled from about 09:00 and was observed entering a car park by 11:00. A surcharging manhole at the Grinstead Barn turnoff and a blocked inspection chamber in the adjacent field added to flood flows along the carriageway. Floodwater continued to surcharge in this area after Storm Babet and Suffolk Highways carried out jetting and initial investigations. Properties at the junction with Foxglove Avenue were flooded internally again in early January 2024 during Storm Henk. [PAG,MUL] (p15)</p></div><div class="nugget-popup"><p>Floodwater flowed along Barking Road fed by a surcharging manhole at the Grinstead Barn turnoff and a blocked inspection chamber in a field to the west, which added to floodwater moving along the road. Water flowed north&ndash;eastwards along Barking Road towards Foxglove Avenue; Suffolk Highways have undertaken jetting and investigations and further actions are planned. [IMG,PAG] (p16)</p></div><div class="nugget-popup"><p>Surface water on Barking Road converged with runoff from the fields and Foxglove Avenue, worsening flooding to nearby properties when highway drainage was overwhelmed. [IMG] (p17)</p></div><div class="nugget-popup"><p>Runoff from fields to the south and east travelled along Barking Road and converged with surface&ndash;water flow on Foxglove Avenue. The convergence, together with overwhelmed gullies, caused further flooding to nearby properties. [PAG] (p18)</p></div><div class="nugget-popup"><p>Floodwater covered the entire carriageway and extended onto the verge making the road impassable; traffic management (cones/signage) was present. Water overtopped a dropped kerb and flowed onto the adjacent pavement, creating a clear overland flowpath and presenting risk to pedestrians and nearby properties. [IMG] (p26)</p></div><div class="nugget-popup"><p>Blocked/compromised gullies and drains identified after Storm Babet; targeted reactive jetting of gullies and drains was completed in the months following the storm to restore drainage. [TAB] (p33)</p></div><div class="nugget-popup"><p>Highway drainage blockages and surface water flooding affecting the road; identified as a worst&ndash;affected area and recommended for cyclic drainage maintenance, investigation of drainage capacity and possible relocation/raising of a dropped kerb near Grinstead Barn. [TAB,PAG] (p35)</p></div><div class="nugget-popup"><p>Highway drainage blockages caused surface water flooding on the road during the event; listed as a key worst&ndash;affected area requiring removal of observed blockages and investigation of drainage capacity and condition. (p36)</p></div><div class="nugget-popup"><p>Road and adjacent drainage experienced surface water flooding and blocked highway drains/overland flow during the event. Actions recorded include removal of observed blockages, investigation of highway drainage capacity and condition, potential raising/moving of a dropped kerb, and investigation of drainage problems below Barking Road near Grinstead Barn. [PAG] (p37)</p></div><div class="nugget-popup"><p>Barking Road experienced drainage problems and overland flow risk that could be reduced by raising or relocating a dropped kerb and addressing drainage below the road; investigations and potential interventions were proposed to reduce runoff and prevent flooding to the road and adjacent properties. [PAG] (p38)</p></div></div></body></div>`)[0];

                var html_723c4a8f0dc98c4cf492ccec6011ca68 = $(`<div id="html_723c4a8f0dc98c4cf492ccec6011ca68" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Foxglove Avenue, Needham Market</h1><div class="nugget-popup"><p>Explicitly reported as having experienced flooding caused by surface water run&ndash;off during Storm Babet (20 October 2023); properties on the street were flooded. (p8)</p></div><div class="nugget-popup"><p>Foxglove Avenue experienced pluvial (surface water) flooding during Storm Babet; the report also identifies some areas of Foxglove Avenue at risk from fluvial flooding, and these were affected during the event. [PAG] (p10)</p></div><div class="nugget-popup"><p>Reported as being at risk of surface water (pluvial) flooding and with some areas shown at risk of fluvial flooding; the report states Foxglove Avenue was affected by flooding during Storm Babet (18 Oct 2023 &ndash; 21 Oct 2023). [PAG] (p11)</p></div><div class="nugget-popup"><p>Floodwater entered Foxglove Avenue from Barking Road via a low entry point (drop kerb) that allowed water to bypass a raised traffic&ndash;calming feature; properties near the junction were impacted with internal flooding (also recorded in early January 2024 during Storm Henk). [PAG,MUL] (p15)</p></div><div class="nugget-popup"><p>Properties were flooded by water entering Foxglove Avenue from Barking Road via a low drop kerb that allowed water to bypass a raised traffic&ndash;calming bump. Several properties also flooded at the rear from surface water runoff from fields to the west; runoff began in the early hours of 20 October (~03:00) and matched predicted surface water flow paths. Properties were also reported flooded internally during Storm Henk in early January 2024. [IMG,PAG,MUL] (p16)</p></div><div class="nugget-popup"><p>Surface water runoff from the fields to the west entered the rear of properties, causing internal and external flooding. Flows travelled through Foxglove Avenue, impacting properties in the flow path and then onto Hargrave Avenue; highway drainage gullies were overwhelmed, contributing to property flooding. [IMG,PAG,MUL] (p17)</p></div><div class="nugget-popup"><p>Floodwater from fields to the west flowed through Foxglove Avenue and inundated properties in the flow path. Surface water funnelled along the downhill highway flooded properties to the east of the estate and highway drainage gullies were overwhelmed. [PAG] (p18)</p></div><div class="nugget-popup"><p>Overland surface water/runoff affected Foxglove Avenue; report recommends investigation of NFM measures (vegetation strip/bund/ditch) to reduce field runoff onto properties and the road. [TAB] (p35)</p></div><div class="nugget-popup"><p>Identified as being affected by overland flow paths during the event; listed for investigation of natural flood management (NFM) measures to 'slow the flow' and attenuate water impacting the road/area. (p37)</p></div><div class="nugget-popup"><p>Field runoff from the west of Foxglove Avenue caused surface&ndash;water flooding risk to properties; actions proposed include vegetation strip/break, bund or ditch between the field and properties and installation of Property Flood Resilience (PFR) measures via grant schemes. (p39)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 occasions [IMG,PAG,MUL] (p17)</p></div></div></body></div>`)[0];

ctionality of the asset, addressing flooding risk at the culvert entrance. (p38)</p></div></div></body></div>`)[0];

                var html_5b639e50a7ebcaae9e4fd54b1912eb24 = $(`<div id="html_5b639e50a7ebcaae9e4fd54b1912eb24" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Limetree Close, Needham Market</h1><div class="nugget-popup"><p>Included in Zone 2 of Needham Market which the report identifies as affected during Storm Babet (20 October 2023); the majority of property flooding in the town included a fluvial element due to the Lion Barn Drain and Orchard Gate exceeding capacity, so Lime Tree Close was impacted as part of those fluvial flood pathways. (p8)</p></div><div class="nugget-popup"><p>Limetree Close was identified as at significant risk of pluvial (surface water) flooding and was affected by surface&ndash;water flooding during Storm Babet, resulting in overland inundation of the street. (p10)</p></div><div class="nugget-popup"><p>Limetree Close, identified as one of the lowest&ndash;lying locations in Needham Market, was among the worst affected by flooding during Storm Babet; the street experienced inundation from high river levels and converging overland/pluvial flows. [PAG] (p12)</p></div><div class="nugget-popup"><p>Internal flooding of properties; water came up through the road gullies connected to the Lion Barn drain, contributing to internal flooding on Lime Tree Close. (p18)</p></div><div class="nugget-popup"><p>Floodwater traveled along a historic infilled ditch pathway and flooded properties on Lime Tree Close after the watercourse overtopped and flow followed low spots in the landscape created by settled infill. [IMG,PAG] (p19)</p></div><div class="nugget-popup"><p>Historic ditch alignment and overtopping water from the Lion Barn Drain flooded properties on Limetree Close before flowing onto Lion Lane; properties on Limetree Close experienced internal flooding. [PAG] (p20)</p></div><div class="nugget-popup"><p>Floodwater from the Lion Barn drain flowed through Limetree Close onto the road and impacted properties due to the drain exceeding capacity and linked overland flow paths. (p21)</p></div><div class="nugget-popup"><p>Floodwater from the nearby Lion Barn drain inundated a residential yard on Limetree Close, with water reaching the base of a brick house and partially submerging a fence and trees. [IMG] (p27)</p></div></div></body></div>`)[0];

ue to flooding risk and potential constraints to conveyance. [TAB,PAG] (p35)</p></div><div class="nugget-popup"><p>Highway drainage blockages led to surface water flooding on Lion Lane during the event; identified among the worst&ndash;affected streets requiring drainage maintenance and blockage removal. [PAG] (p36)</p></div><div class="nugget-popup"><p>Highway drainage blockages and insufficient culvert capacity beneath Lion Lane / Coddenham Road led to inundation and overland flow onto the carriageway; investigation and possible de&ndash;silt/cleanse of the culvert and capacity assessment were recommended. [PAG] (p37)</p></div></div></body></div>`)[0];

ater surface water sewer assets on the Maitland Road industrial estate were recommended for investigation (condition and effectiveness) following flooding issues. [TAB,PAG] (p35)</p></div><div class="nugget-popup"><p>Observed blockages in highway drainage resulted in surface water flooding on Maitland Road; actions include removal of blockages and cyclic drainage maintenance. [PAG] (p37)</p></div><div class="nugget-popup"><p>Surface water sewer network and Anglian Water assets on the Maitland Road industrial estate were implicated; investigations are proposed to check asset condition and ensure effectiveness in removing surface water and preventing sewer&ndash;related flooding. (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 45 properties reported internal flooding (town&ndash;wide) (p8)</p></div></div></body></div>`)[0];

ions include investigation of culvert capacity, CCTV survey and de&ndash;silting/cleansing if required to restore drainage function and reduce road flooding. (p37)</p></div><div class="nugget-popup"><p>Area adjacent to Pinecroft where a bund is required to maintain defence from flooding from the main river Gipping; actions propose investigating bund options to balance estate drainage and river defence. (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 45 properties reported internal flooding (town&ndash;wide) (p8)</p></div><div class="nugget-popup quant"><p>2&ndash;3 ft deep on the road (p20)</p></div><div class="nugget-popup quant"><p>2&ndash;3 ft deep floodwater on the road [PAG] (p21)</p></div></div></body></div>`)[0];

d or impaired drainage contributing to flooding of the street. (p38)</p></div></div></body></div>`)[0];

lls into the main river channel were identified for investigation following the event; fitting non&ndash;return flaps on the outfalls was proposed as a post&ndash;event mitigation measure. [TAB] (p35)</p></div><div class="nugget-popup"><p>Outfalls from the main river channel at Crown Street were identified as causing backflow and contributing to flooding; recommendation to fit non&ndash;return flaps and ensure channel maintenance for the upper section to reduce reoccurrence. (p37)</p></div><div class="nugget-popup"><p>Main river outfalls on Crown Street were affected by silt and backflow risk. Actions proposed include de&ndash;silting/cleansing of the main river channel and fitting non&ndash;return flaps on outfalls to prevent river water backing into the drainage network. [PAG] (p38)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 45 properties reported internal flooding (town&ndash;wide) (p8)</p></div></div></body></div>`)[0];

                var html_306bbe9514069a0c2720b67cf5380d1f = $(`<div id="html_306bbe9514069a0c2720b67cf5380d1f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Suffolk</h1><div class="nugget-popup"><p>Storm Babet caused significant disruption to communities across Suffolk between 18&ndash;21 October 2023 (widespread disturbance reported across the county). [PAG] (p4)</p></div><div class="nugget-popup"><p>Experienced the heaviest rainfall across East Anglia during Storm Babet and preceding fronts (notably 11&ndash;13 Oct and 18&ndash;21 Oct 2023), resulting in saturated catchments, rapid river rises and significant flooding of roads and properties. The scale of impacts prompted a major incident declaration by the Suffolk Resilience Forum on 20 October 2023 and caused widespread disruption to road and rail networks. [PAG,MUL] (p6)</p></div><div class="nugget-popup"><p>On 20 October 2023 Storm Babet produced significant rainfall across Suffolk which caused internal flooding to residential and commercial properties across the county from various sources (fluvial and pluvial). (p7)</p></div><div class="nugget-popup"><p>The county experienced extreme rainfall during Storm Babet that produced widespread surface water and river flooding, with consequential high river levels and localised inundation in towns within the county. (p15)</p></div><div class="nugget-popup"><p>Parts of Suffolk (notably Needham Market) experienced intense/prolonged rainfall leading to excess surface water runoff from surrounding fields which caused property and highway flooding (examples: Foxglove Avenue, Hargrave Avenue, Pinecroft estate). (p18)</p></div></div></body></div>`)[0];

                var html_7af3c936734a6a5306b3fbbb1cd910fd = $(`<div id="html_7af3c936734a6a5306b3fbbb1cd910fd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Mid Suffolk</h1><div class="nugget-popup"><p>Needham Market (within Mid Suffolk) experienced major flooding on 20 October 2023 from fluvial and pluvial sources, including internal property flooding driven by watercourses exceeding capacity and surface water run&ndash;off on specific streets. (p7)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 45 properties (p7)</p></div></div></body></div>`)[0];

                var html_31eb15754c9221e2f57f9456f1b71d9f = $(`<div id="html_31eb15754c9221e2f57f9456f1b71d9f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Needham Market</h1><div class="nugget-popup"><p>Severely impacted by intense rainfall from Storm Babet: multiple overland pluvial flow paths entered the town, flowed through open and piped watercourses and converged with the River Gipping. This overwhelmed natural flow routes and drainage/watercourse capacity, causing overtopping of main river channels and resultant internal flooding of properties, infrastructure and services. (p4)</p></div><div class="nugget-popup"><p>Needham Market experienced major flooding on 20 October 2023 from both fluvial and pluvial sources. The Lion Barn drain and Orchard Gate watercourse exceeded capacity and overtopped their banks causing a fluvial element to most property flooding; surface water run&ndash;off caused flooding on Foxglove and Hargrave Avenue. Anecdotal evidence indicates initial flooding on Pinecroft Way from the Lion Barn Drain. [IMG] (p7)</p></div><div class="nugget-popup"><p>Major flooding on 20 October 2023 during Storm Babet caused internal flooding to residential and commercial properties. Flooding sources were fluvial (River Gipping catchment / local watercourses including Lion Barn Drain and Orchard Gate overtopping) and pluvial (surface water run&ndash;off affecting streets such as Foxglove Avenue and Hargrave Avenue). [PAG,IMG] (p8)</p></div><div class="nugget-popup"><p>Multiple residential streets across four investigation zones in Needham Market were affected by flooding during Storm Babet. Pinecroft Way experienced the first signs of flooding on the morning of 20 October caused by rapid runoff from the Lion Barn Drain. The River Gipping registered record peak water levels which contributed to flood warnings for the town and the downstream flood peak travel. [IMG,PAG,MUL] (p9)</p></div><div class="nugget-popup"><p>Significant parts of the town experienced both pluvial (surface water) and fluvial (river/tributary) flooding during the event. Multiple main flow paths enter the town leading to flooding on streets and low&ndash;lying areas adjacent to watercourses. [IMG,PAG] (p10)</p></div><div class="nugget-popup"><p>Needham Market experienced both pluvial (surface water) and fluvial (river/main watercourse) flooding during the event. Multiple overland flow paths delivered runoff into the town and flooding affected low&ndash;lying areas and streets. Specific impacts reported include surface water flooding on Barking Road, Foxglove Avenue, Hargrave Avenue, Pinecroft Way, Limetree Close, Hawks Mill Street, Crown Street and Highland Close, and fluvial influence from the River Gipping, the Lion Barn drain and the Orchard Gate watercourse affecting Hawks Mill area, Crown Street, Pinecroft Way, Maitland Road, Barking Road and parts of Foxglove Avenue. [IMG,PAG] (p11)</p></div><div class="nugget-popup"><p>Low&ndash;lying central areas of the town were inundated during Storm Babet; the town acted as temporary flood storage with overwhelmed drainage and watercourses. Low&ndash;lying streets such as Pinecroft Way and Lion Lane were identified among the worst affected. [IMG,PAG] (p12)</p></div><div class="nugget-popup"><p>Multiple overland pluvial flow paths flowed into Needham Market from higher ground (NW, W &ndash; Orchard Gate, SW &ndash; Barking Road), converging in the town's lower&ndash;lying areas (Pinecroft Way, Lion Lane). Low&ndash;lying land in the town acted as temporary flood storage, retaining excess flood water that slowly discharged into the River Gipping. Hawks Mill, Pinecroft Way, Limetree Close, Maitland Road and Lion Lane were identified as some of the worst affected areas following Storm Babet; overwhelmed infrastructure and watercourses were observed during the intense rainfall event. [PAG,IMG] (p13)</p></div><div class="nugget-popup"><p>Needham Market experienced surface water / urban flooding associated with extreme rainfall from Storm Babet. Low&ndash;lying topography, naturally high groundwater in floodplain alluvium and surrounding slowly&ndash;permeable loamy and clayey soils reduced infiltration so more runoff remained on the surface and flowed along multiple flow paths into the town. [IMG,PAG] (p14)</p></div><div class="nugget-popup"><p>On 20 October 2023 overland flows from surrounding fields and surcharging drainage entered the town, flowing along Barking Road into Foxglove Avenue; carriageways and private car parks were inundated and properties at the junction of Foxglove Avenue and Barking Road were flooded internally (also affected again during Storm Henk in January 2024). [PAG] (p15)</p></div><div class="nugget-popup"><p>Intense, prolonged rainfall produced excess surface&ndash;water runoff from fields to the west and south of Needham Market. Runoff overwhelmed highway drainage and some ordinary watercourses, causing surface water flooding across parts of the town and inundation of streets and properties. (p18)</p></div><div class="nugget-popup"><p>Intense/prolonged rainfall caused the Lion Barn drain to exceed capacity and overland flows and river overtopping (River Gipping) inundated the floodplain, entered roads and properties, overwhelmed highway drainage, and caused businesses and properties to flood; culvert constriction and a raised bund impeded drainage and increased local inundation. (p21)</p></div><div class="nugget-popup"><p>Residential and commercial properties on Crown Street were internally flooded. River levels rose close to overtopping the flood wall and the river flowed over the public footbridge. Highway drainage outfalls became submerged or were unflapped, allowing river water to enter the highway drainage and pond on the road behind the flood wall. (p23)</p></div><div class="nugget-popup"><p>Overtopping of the main River Gipping, Lion Barn Drain and Orchard Gate watercourse caused floodwater to enter streets and properties across Needham Market. Floodwater overtopped banks and outfalls flooding properties on the northern and southern sides of Pinecroft Way and Limetree Close, backed up onto Lion Lane and flowed into Maitland Road affecting buildings on the Lion Barn industrial estate, and flowed onto Coddenham Road (reported flood depths ~2&ndash;3 ft on the road). Repeated internal flooding of properties on Pinecroft Way and Limetree Close was reported over the winter between Storm Babet and Storm Henk. (p25)</p></div><div class="nugget-popup"><p>Overtopping of the Orchard Gate watercourse led to local flooding in Needham Market; makeshift defences were deployed against overtopping. [TAB] (p32)</p></div><div class="nugget-popup"><p>Properties within Needham Market flooded during Storm Babet (and were also reported to have flooded during Storm Henk). This prompted cyclic cleansing of highway drainage assets, main river and tributary maintenance, offers of Property Flood Resilience measures and the formation of a local flood group to improve community&ndash;level resilience. [TAB,PAG] (p33)</p></div><div class="nugget-popup"><p>The town experienced fluvial and surface&ndash;water flooding during the October 2023 event; multiple streets and watercourses were identified as worst&ndash;affected and targeted for maintenance, investigations and mitigation (highway drainage, culvert checks, PFR grants, NFM options and surveys). [TAB,PAG] (p35)</p></div><div class="nugget-popup"><p>Town experienced flooding driven by main river issues and blocked highway drainage during the event; highways and local watercourses were identified as worst&ndash;affected, prompting actions for main river maintenance, riparian responsibility enforcement and cyclic highway drainage maintenance to remove observed blockages. [PAG] (p36)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Over 45 residential and commercial properties were internally flooded (p4)</p></div><div class="nugget-popup quant"><p>over 45 properties [IMG] (p7)</p></div><div class="nugget-popup quant"><p>over 45 properties [PAG,IMG] (p8)</p></div><div class="nugget-popup quant"><p>9 properties (internal flooding reported in May 2012); 2 river gauge locations recorded peak levels surpassing previous recorded maxima [IMG,PAG,MUL] (p9)</p></div><div class="nugget-popup quant"><p>2&ndash;3 ft deep floodwater on the road (p21)</p></div></div></body></div>`)[0];
                popup_d2dd6998a6ca4cc03790d660941a6896.setContent(html_31eb15754c9221e2f57f9456f1b71d9f);
