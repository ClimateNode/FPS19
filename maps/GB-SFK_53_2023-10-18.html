                var html_f9f0f3a2b1b968542665d694a20b973d = $(`<div id="html_f9f0f3a2b1b968542665d694a20b973d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Mill Road, Worlingworth</h1><div class="nugget-popup"><p>Mill Road (within the West zone) was within an area identified as affected by floodwater during the October 2023 event. Floodwater sources in the area included pluvial runoff, overtopping watercourses and overwhelmed sewer/drainage systems, and properties on/near the road experienced internal flooding. (p7)</p></div><div class="nugget-popup"><p>Reports of flooding were received from the Mill Lane / Mill Road area; specific severity and detailed impacts were not provided in the text. (p14)</p></div><div class="nugget-popup"><p>Mill Road lies on mapped flow routes for overland water movement; during the event significant surface water flows and ponding affected highways, causing damage and debris on road verges and adjacent hedgerows/gardens. [IMG] (p15)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 30 properties across Worlingworth (total for the village) (p7)</p></div></div></body></div>`)[0];

                var html_00b57d686a71d60dfa96eae9587e04a2 = $(`<div id="html_00b57d686a71d60dfa96eae9587e04a2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Church Road, Worlingworth</h1><div class="nugget-popup"><p>Church Road (listed in both Central and East groupings) was identified within the investigation as experiencing floodwater during the October 2023 event. Floodwater entered the area from pluvial runoff, overtopping watercourses and overwhelmed sewers/drains, resulting in internal flooding to properties on or adjacent to the road. (p7)</p></div><div class="nugget-popup"><p>Homes on either side of Church Road were affected by floodwater as drainage networks became overwhelmed; floodwater cascaded down the street contributing to inundation of lower&ndash;lying areas and properties. (p16)</p></div><div class="nugget-popup"><p>Homes on either side of Church Road were affected by floodwater that entered from an overwhelmed drainage network and from overtopping watercourses that run around the rear of buildings and through gardens. A culverted section at the highway was quickly overwhelmed, causing overtopping that added to flood depths on the road and into properties. [IMG,PAG] (p17)</p></div><div class="nugget-popup"><p>A watercourse running along the south side of Church Road was quickly overwhelmed; water overtopped the banks and added to surface water on the road. Highway low spots pooled and water flowed into properties off the highway. Highway grips were unable to discharge effectively into the overwhelmed watercourse, indicating an overwhelmed drainage system rather than a local blockage. (p21)</p></div><div class="nugget-popup"><p>High volumes of surface water overwhelmed highway drainage. A piped section on the south side of Church Road (between the river and the AW pumping station) was identified as a possible contributor to poor conveyance during the event; LLFA recommended the landowner investigate reinstating an open channel to improve flow. [IMG] (p22)</p></div><div class="nugget-popup"><p>Areas around Church Road (including a piped/open watercourse south of Church Road and land north of Church Road east of Willow Green) were implicated in flow routes; investigation and potential reinstatement of watercourse/channel and other measures were recommended to reduce flooding. [TAB] (p31)</p></div><div class="nugget-popup"><p>Surface water flooding affected the area around Church Road during the 18 Oct 2023 &ndash; 21 Oct 2023 event. Land north of Church Road was identified for possible attenuation and investigations were recommended to reinstate an open channel between the AW pumping station and the watercourse to the east to manage flows. [PAG] (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 30 properties across Worlingworth (total for the village) (p7)</p></div></div></body></div>`)[0];

                var html_c9dc43119746190855e58a6e7535429c = $(`<div id="html_c9dc43119746190855e58a6e7535429c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Shop Street, Worlingworth</h1><div class="nugget-popup"><p>Shop Street (within the Central zone) experienced floodwater during the October 2023 event. Flood sources reported in the investigation include pluvial runoff from fields, overtopping of local watercourses and overwhelmed sewer/drainage systems, and properties on Shop Street suffered internal flooding. (p7)</p></div><div class="nugget-popup"><p>Shop Street experienced manhole surcharging and reported manhole flooding during high rainfall; surcharging on Shop Street is noted and may be related to surface water infiltration or a sewer leak. Anglian Water investigations into the sewer issue are ongoing. These issues occurred during the storm event. [PAG] (p8)</p></div><div class="nugget-popup"><p>Shop Street is shown on the flow&ndash;route map around Newtown and was affected by overland surface water flows and ponding, with consequent damage and debris on the highway and adjacent gardens/hedgerows. [IMG] (p15)</p></div><div class="nugget-popup"><p>During Storm Babet Shop Street experienced flooding from both overwhelmed drainage infrastructure and overtopping watercourses; continuous rain caused rapid overflow of the drainage network, with floodwater deepening and affecting homes and the highway (including manhole surcharging). [PAG] (p16)</p></div><div class="nugget-popup"><p>Prolonged rain and overwhelmed drainage caused floodwater to rise on Shop Street. Floodwater cascaded downhill from Shop Street and Church Road, entered homes set along Shop Street, and contributed to downstream flooding toward Willow Green. [PAG] (p17)</p></div><div class="nugget-popup"><p>Suspected blocked piped section of an ordinary watercourse under the highway; investigation recommended to check blockage and confirm outfall after flooding affected the highway area. [TAB] (p31)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 30 properties across Worlingworth (total for the village) (p7)</p></div></div></body></div>`)[0];

                var html_9a0fafcc0ce390a748788eec0748f83a = $(`<div id="html_9a0fafcc0ce390a748788eec0748f83a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Church Street, Worlingworth</h1><div class="nugget-popup"><p>Properties on Church Street (East zone) reported flooding from surface water runoff and overtopping watercourses, with drainage/sewer systems overwhelmed leading to internal property flooding. (p7)</p></div><div class="nugget-popup"><p>Church Street is identified in the eastern zone as being affected by surface water flooding during the event as flood flows moved east through the settlement. [IMG,PAG] (p8)</p></div><div class="nugget-popup"><p>Surface water runoff from surrounding fields flowed down a watercourse that pooled, overtopped and then flowed south through gardens and outbuildings; runoff pooled at the lowest point of the highway (Church Street) and then entered properties off the highway. Local highway drainage assets were inspected and found working, so they were likely overwhelmed by rainfall. (p20)</p></div><div class="nugget-popup"><p>Properties on the north side were predominantly affected by water flowing off the highway due to overland surface water flow and overtopping watercourses. Some residential properties experienced internal flooding to significant depths (some residents had to move out for several months); other properties had flooding across gardens and outbuildings without internal inundation. (p21)</p></div><div class="nugget-popup"><p>Surface water runoff was routed through the area; LLFA suggested a potential NFM feature on land south of Church Street to reduce surface water runoff, indicating the area experienced problematic runoff and contributed to localised flows during the event. (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>part of the &gt;30 properties in Worlingworth reporting internal flooding (p7)</p></div></div></body></div>`)[0];

                var html_11b89b3c81117275b0a37232fe9fad02 = $(`<div id="html_11b89b3c81117275b0a37232fe9fad02" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Suffolk</h1><div class="nugget-popup"><p>Storm Babet caused significant disruption to communities across Suffolk between 18th&ndash;21st October 2023. Intense rainfall led to widespread pluvial flooding and some fluvial impacts as flow routes and drainage were overwhelmed. [PAG] (p4)</p></div><div class="nugget-popup"><p>Experienced the heaviest rainfall in East Anglia during the event, producing saturated land and rivers rising close to or exceeding record levels; significant and rapid flooding affected roads and properties and caused disruption to road and rail networks; a major incident was declared on 20 Oct 2023. (p6)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 30 properties (in Worlingworth) [PAG] (p4)</p></div></div></body></div>`)[0];

                var html_f94ef8afd724b3a8d5e176fb8abcb3cb = $(`<div id="html_f94ef8afd724b3a8d5e176fb8abcb3cb" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>East Anglia</h1><div class="nugget-popup"><p>During Storm Babet (18&ndash;21 Oct 2023) East Anglia experienced extreme rainfall that produced rapid river rises and widespread, fast&ndash;developing flooding. Roads and properties were significantly flooded, river systems rose across whole catchments with several gauging stations recording flows close to or exceeding highest on record, and there was major disruption to road and rail networks. [IMG] (p6)</p></div></div></body></div>`)[0];

                var html_2bc03d9536e77d8a93d38465ad9735a8 = $(`<div id="html_2bc03d9536e77d8a93d38465ad9735a8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Worlingworth</h1><div class="nugget-popup"><p>Severely impacted by intense rainfall from Storm Babet: natural flow routes and watercourse/drainage capacity were overwhelmed. Overland flow paths converged through the village, causing internal flooding of properties and disruption to infrastructure and services. (p4)</p></div><div class="nugget-popup"><p>Internal flooding of residential and commercial properties caused by multiple sources: surface water runoff from surrounding fields (pluvial), overtopping of local watercourses (fluvial) and overwhelmed sewerage/drainage systems. Flow paths affected multiple streets and zones within the village (West, Central and East). [IMG,PAG] (p7)</p></div><div class="nugget-popup"><p>Central Worlingworth experienced surface water flooding during the event (flood flows follow a west&ndash;to&ndash;east surface water flow path through the village). Highway drainage was overwhelmed in the village centre causing highway flooding; the foul sewer network has a history of manhole surcharging during heavy rainfall. A previous internal property flood is recorded in 2012. [IMG,PAG,MUL] (p8)</p></div><div class="nugget-popup"><p>Significant surface&ndash;water flow path runs west&ndash;east through the village; most of the properties affected in central Worlingworth lie within high&ndash;risk surface&ndash;water zones. Localised high&ndash; and medium&ndash;risk surface&ndash;water areas to the west of the catchment concurred with flooding experienced during Storm Babet. Fluvial risk is present but less significant and largely isolated to the east of the catchment (adjacent floodplain). [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>Saturated, clayey soils and low infiltration led to extensive overland runoff during the storm period, resulting in surface water flooding/overland runoff affecting the village as reported in relation to Storm Babet. [IMG] (p12)</p></div><div class="nugget-popup"><p>Western part of the village experienced overland runoff and local watercourse/pond overtopping. Newtown suffered internal flooding to properties; blocked/poorly maintained channels, debris and fallen trees caused backups and overtopping that routed water to lowest points (houses). Ponds with reduced capacity due to siltation likely exacerbated impacts. (p14)</p></div><div class="nugget-popup"><p>Significant rainfall onto already&ndash;saturated ground produced high levels of overland surface&ndash;water flow across west Worlingworth (around Newtown), causing ponding in low spots and internal flooding of residential properties. Several houses experienced internal flooding with damage to furniture, flooring and personal effects; overland flows also damaged hedgerows, gardens and highways and deposited debris. [IMG] (p15)</p></div><div class="nugget-popup"><p>Central Worlingworth experienced widespread flooding: at least 23 properties suffered internal flooding with damage to furniture, flooring and personal effects; overland surface water flows caused ponding in low spots and damaged/deposited debris in hedgerows, gardens and adjacent highways. Manholes surcharged and overtopped watercourses spilled into properties and onto the highway. (p16)</p></div><div class="nugget-popup"><p>The village experienced significant flooding concentrated around Shop Street and Willow Green. Heavy, continuous rain caused the drainage network and a culverted watercourse to be overwhelmed; ordinary watercourses between the recreation ground and Willow Tree Yard overtopped, producing the first significant flooding. Floodwater cascaded down Shop Street into Willow Green and properties in the Close, with highway flooding from both surface water and overtopping channels. [IMG] (p17)</p></div><div class="nugget-popup"><p>Significant overland flow from surrounding fields and from local watercourses overwhelmed channels, ponds and drainage at pinch points in the village centre. Watercourses exceeded bank, causing pooling near the community centre and flow around the backs of properties on Church Road and Willow Green. Highways and Anglian Water assets were overwhelmed (water forced back up manhole covers). Internal flooding affected residential homes and businesses (internal depths reached 37 cm); some properties remained uninhabitable for an extended period after the event. [PAG] (p18)</p></div><div class="nugget-popup"><p>Significant rainfall and saturated ground generated high levels of overland flow toward the village centre, overwhelming water management features and spilling out at pinch points near the community centre. Local watercourses exceeded capacity and overtopped their banks, contributing to overland flows that converged around the Recreation Ground and The White Cottage. Highway drainage and foul sewer networks were overwhelmed, with water forced back up manhole covers and adding foul/surcharged sewer water to the surface flooding. [IMG,PAG] (p19)</p></div><div class="nugget-popup"><p>The eastern end of the village experienced overland runoff and watercourse&ndash;related flooding: a small number of properties were flooded internally and several properties had gardens and outbuildings flooded as runoff and watercourse flows pooled and overtopped. [IMG] (p20)</p></div><div class="nugget-popup"><p>Residential properties experienced internal flooding to significant depths; some residents were forced to move out of their properties for several months. Other properties had water flowing across gardens and into outbuildings but without internal property flooding. Watercourses overtopped and local low spots rapidly filled due to intense rainfall and overland flow; highways drainage assets were overwhelmed. [IMG] (p22)</p></div><div class="nugget-popup"><p>Residential yard and adjacent agricultural field were inundated by floodwater during the event in East Worlingworth; water levels in the yard reached nearly to the top of a garden gate and breached property boundaries. Residents were identified for property flood resilience measures (grant&ndash;funded PFR). [IMG,PAG] (p23)</p></div><div class="nugget-popup"><p>A residential backyard in East Worlingworth was inundated by muddy floodwater during the event. Floodwater covered the garden area, submerging garden features and reaching the bases of the garden shed and hedges. Water encroached onto a wooden deck and threatened outdoor belongings. [IMG,PAG] (p24)</p></div><div class="nugget-popup"><p>Floodwater breached the threshold of a residential property in East Worlingworth and entered the interior, covering floors; outdoor furniture and garden items were partially submerged in muddy water, indicating contamination and likely property damage and internal clean&ndash;up/repairs. [IMG,PAG] (p25)</p></div><div class="nugget-popup"><p>Severe surface&ndash;water/urban flooding inundated a residential area in central Worlingworth, with water covering streets, reaching up onto front lawns and threatening houses; vehicles were partially submerged and access along the street was impeded. [PAG] (p27)</p></div><div class="nugget-popup"><p>Surface water and watercourse flooding affected the eastern area of Worlingworth during the investigation. Blocked/insufficient highway drainage (gully at junction with Newtown) and suspected blocked piped sections under Shop Street contributed to flows across roads and into low&ndash;lying areas (near the church and AW pumping station). Areas were identified for attenuation and maintenance to reduce future flood risk. [TAB] (p31)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 30 properties suffering internal flooding (p4)</p></div><div class="nugget-popup quant"><p>over 30 properties [IMG,PAG] (p7)</p></div><div class="nugget-popup quant"><p>at least 23 properties (p16)</p></div><div class="nugget-popup quant"><p>internal flooding reached 37 cm; residents displaced for 6 months [PAG] (p18)</p></div><div class="nugget-popup quant"><p>2 wheelie bins at risk; 1 garden shed with water at its base [IMG,PAG] (p24)</p></div><div class="nugget-popup quant"><p>2 vehicles [PAG] (p27)</p></div></div></body></div>`)[0];
