                var html_c1e0a66084e63e483ac097ebc4cb54f2 = $(`<div id="html_c1e0a66084e63e483ac097ebc4cb54f2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Yalding</h1><div class="nugget-popup"><p>Intense rainfall on 20 July 2021 caused surface water runoff from surrounding land that overwhelmed highway surface water and sewerage drainage infrastructure, resulting in property flooding in Yalding. (p1)</p></div><div class="nugget-popup"><p>The village experienced multiple instances of property flooding reported on specific streets (internal and external flooding across the village as summarised in the table). [TAB] (p2)</p></div><div class="nugget-popup"><p>Intense rainfall on 20th July 2021 produced rapid overland flow across the southern parts of Yalding (where soils are slowly permeable with high groundwater), causing surface water flooding that inundated properties. The locations of affected properties align with High Street, Kenward Road and Vicarage Road in the southern area of the village. (p4)</p></div><div class="nugget-popup"><p>Yalding experienced the intense rainfall on 20 July 2021 that formed the July flood event. The Event Rarity Calculator assessed the whole event at Yalding as approximately a 1 in 49&ndash;year event, and the intense 15:00&ndash;15:30 burst as approximately a 1 in 108&ndash;year event. The heavy, short&ndash;duration rainfall contributed to flooding in Yalding and its history of surface&ndash;water incidents. (p5)</p></div><div class="nugget-popup"><p>Short, intense rainfall overwhelmed the highway surface water system and caused overland flow from adjacent fields onto the High Street, Vicarage Road and Yalding Hill; gullies and sewers surcharged with foul debris; fire service attended two property flooding incidents on the High Street and police implemented a road closure on Vicarage Road. (p7)</p></div><div class="nugget-popup"><p>A short, very intense period of rainfall overwhelmed local surface&ndash;water drainage, causing flooding of properties and disruption to local roads. (p8)</p></div><div class="nugget-popup"><p>Multiple reported flood incidents across central and eastern residential areas of Yalding, affecting streets labelled on the map: Oast Court, High Street, Mount Avenue, Blunden Lane and Vicarage Road; flooding clustered near main streets and close to the River Beult. [IMG] (p11)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>15 properties; 13 properties flooded internally; 2 properties flooded externally (p1)</p></div><div class="nugget-popup quant"><p>10 properties (High Street internal) ; 2 properties (Vicarage Road internal) ; 1 property (Oast Court internal) ; 2 properties external (Mount Avenue and Blunden Lane) [TAB] (p2)</p></div><div class="nugget-popup quant"><p>two flooding incidents; one road closure (p7)</p></div><div class="nugget-popup quant"><p>15 properties (p8)</p></div></div></body></div>`)[0];
