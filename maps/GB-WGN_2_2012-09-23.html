                var html_b178c42f34b8e9431bc30cd11beed21f = $(`<div id="html_b178c42f34b8e9431bc30cd11beed21f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Eleanor Street, Wigan Metropolitan District</h1><div class="nugget-popup"><p>Road inundated with water reaching up to the doorsteps of terraced houses; pavement partially submerged to the top of the curb; sandbags placed at some doorways indicating attempts to prevent water ingress; visual evidence of several inches of standing water across the street causing residential disruption. (p1)</p></div><div class="nugget-popup"><p>Severe prolonged rainfall caused predominant surface water flooding which overloaded the combined sewer and prevented the highway drainage from discharging. Highway drainage was also prevented from discharging where it outfalls to the River Douglas due to elevated river levels. Eight residential properties and one commercial property were flooded internally. (p4)</p></div><div class="nugget-popup"><p>A localized flood affected central and southern portions of Eleanor Street, inundating both sides of the street and adjacent lots. Properties along the street flooded internally; sandbags and pumps were deployed to limit damage. [PAG,IMG] (p7)</p></div><div class="nugget-popup"><p>Severe rainfall caused the United Utilities combined sewer to surcharge, which prevented the highway drainage system on Eleanor Street from discharging into it, resulting in surface water inundation of the highway drainage on Eleanor Street. (p9)</p></div><div class="nugget-popup"><p>Listed as one of the areas protected by the attenuation tank installed after the Sep 2012 flood to reduce future surface&ndash;water flooding. (p14)</p></div><div class="nugget-popup"><p>The Eleanor Street area was affected by the September 2012 flooding. Mitigation works (installation of two new gullies and connection of four lowest existing gullies to the new pumped road drainage) were implemented to reduce surface water entering the United Utilities combined sewer; residential properties in the Eleanor Street area were identified for removal from Flood Zone 3 into an Area Benefitting from Defence. (p16)</p></div><div class="nugget-popup"><p>Surface water inundated the street, covering the carriageway and reaching the front steps and doorways of terraced houses. Floodwater entered properties causing internal flooding; access to homes and the road was obstructed. Sandbags were deployed at property entrances. [IMG,PAG] (p18)</p></div><div class="nugget-popup"><p>Surface water floodwater covered the full width of the road, reaching up to the wheels of parked cars, floating debris and tipping a green wheelie bin. Floodwater entered adjacent properties causing internal flooding of ground&ndash;floor interiors &mdash; murky water covering floors to the base of walls and submerging mats, leading to contamination and property damage. [IMG,PAG] (p19)</p></div><div class="nugget-popup"><p>Internal flooding of a property on Eleanor Street: water covered interior tiled floors and a bathroom floor, partially submerging the base of the toilet and the bathtub panel. Personal items and fittings were displaced or partially submerged; water appeared dark and likely contaminated, rendering rooms unusable and requiring cleanup and repairs. [PAG] (p20)</p></div><div class="nugget-popup"><p>Outdoor areas and a construction/storage yard were inundated with standing water, partially submerging stacked construction materials and reducing site accessibility; risk to material integrity documented. [IMG,PAG] (p21)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8 residential properties; 1 commercial property (p4)</p></div><div class="nugget-popup quant"><p>8 residential properties; 1 commercial property; flood depths 300 mm&ndash;750 mm [PAG,IMG] (p7)</p></div></div></body></div>`)[0];

s inundated with floodwater covering the road and forecourts, impeding access and movement; pedestrians and vehicles were affected and barriers were partially submerged. [IMG] (p24)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8 residential properties; 1 commercial property (p4)</p></div></div></body></div>`)[0];
