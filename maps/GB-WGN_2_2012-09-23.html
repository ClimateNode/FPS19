                var html_2ebc1a54751e7ffb9b5ac5e1d302e587 = $(`<div id="html_2ebc1a54751e7ffb9b5ac5e1d302e587" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Douglas</h1><div class="nugget-popup"><p>River levels rose significantly and historically have overtopped. During the event river levels rose above the highway drain outfall pipe, preventing the highway drainage system from discharging into the river and contributing to surface water flooding in the Wallgate/Eleanor Street area. (p4)</p></div><div class="nugget-popup"><p>Prolonged/severe rainfall caused River Douglas levels to rise significantly above the highway drain level, producing backflow into the highway drainage system, compounding surface water flooding of the highway and nearby commercial and residential properties and contributing to inundation and surcharge of the combined sewer system. (p9)</p></div></div></body></div>`)[0];

                var html_a97344e5bfcbb30b60d017772fb27066 = $(`<div id="html_a97344e5bfcbb30b60d017772fb27066" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Eleanor Street, Wigan Metropolitan District</h1><div class="nugget-popup"><p>Road inundated with water reaching up to the doorsteps of terraced houses; pavement partially submerged to the top of the curb; sandbags placed at some doorways indicating attempts to prevent water ingress; visual evidence of several inches of standing water across the street causing residential disruption. (p1)</p></div><div class="nugget-popup"><p>Severe prolonged rainfall caused predominant surface water flooding which overloaded the combined sewer and prevented the highway drainage from discharging. Highway drainage was also prevented from discharging where it outfalls to the River Douglas due to elevated river levels. Eight residential properties and one commercial property were flooded internally. (p4)</p></div><div class="nugget-popup"><p>A localized flood affected central and southern portions of Eleanor Street, inundating both sides of the street and adjacent lots. Properties along the street flooded internally; sandbags and pumps were deployed to limit damage. [PAG,IMG] (p7)</p></div><div class="nugget-popup"><p>Severe rainfall caused the United Utilities combined sewer to surcharge, which prevented the highway drainage system on Eleanor Street from discharging into it, resulting in surface water inundation of the highway drainage on Eleanor Street. (p9)</p></div><div class="nugget-popup"><p>Listed as one of the areas protected by the attenuation tank installed after the Sep 2012 flood to reduce future surface&ndash;water flooding. (p14)</p></div><div class="nugget-popup"><p>The Eleanor Street area was affected by the September 2012 flooding. Mitigation works (installation of two new gullies and connection of four lowest existing gullies to the new pumped road drainage) were implemented to reduce surface water entering the United Utilities combined sewer; residential properties in the Eleanor Street area were identified for removal from Flood Zone 3 into an Area Benefitting from Defence. (p16)</p></div><div class="nugget-popup"><p>Surface water inundated the street, covering the carriageway and reaching the front steps and doorways of terraced houses. Floodwater entered properties causing internal flooding; access to homes and the road was obstructed. Sandbags were deployed at property entrances. [IMG,PAG] (p18)</p></div><div class="nugget-popup"><p>Surface water floodwater covered the full width of the road, reaching up to the wheels of parked cars, floating debris and tipping a green wheelie bin. Floodwater entered adjacent properties causing internal flooding of ground&ndash;floor interiors &mdash; murky water covering floors to the base of walls and submerging mats, leading to contamination and property damage. [IMG,PAG] (p19)</p></div><div class="nugget-popup"><p>Internal flooding of a property on Eleanor Street: water covered interior tiled floors and a bathroom floor, partially submerging the base of the toilet and the bathtub panel. Personal items and fittings were displaced or partially submerged; water appeared dark and likely contaminated, rendering rooms unusable and requiring cleanup and repairs. [PAG] (p20)</p></div><div class="nugget-popup"><p>Outdoor areas and a construction/storage yard were inundated with standing water, partially submerging stacked construction materials and reducing site accessibility; risk to material integrity documented. [IMG,PAG] (p21)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8 residential properties; 1 commercial property (p4)</p></div><div class="nugget-popup quant"><p>8 residential properties; 1 commercial property; flood depths 300 mm&ndash;750 mm [PAG,IMG] (p7)</p></div></div></body></div>`)[0];

                var html_2a5b3d18624b4016eb9cddc42e547f9f = $(`<div id="html_2a5b3d18624b4016eb9cddc42e547f9f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Saddle Junction, Wigan Metropolitan District</h1><div class="nugget-popup"><p>Historically affected by fluvial flooding due to the River Douglas overtopping; more recent flood events in the area have been attributed to pluvial (surface water) flooding. (p4)</p></div><div class="nugget-popup"><p>Area inundated during the September 2012 event when United Utilities sewer and the highway drainage system were at capacity, resulting in local flooding tied to sewer infrastructure and low&ndash;lying ground. [IMG] (p8)</p></div><div class="nugget-popup"><p>Severe rainfall overloaded the combined sewer so gullies at the Saddle Junction could not discharge, causing predominantly surface water flooding of the highway and contributing to flooding of surrounding commercial and residential properties; rising River Douglas levels also likely flowed back up the highway drainage, compounding the flooding. [PAG] (p9)</p></div><div class="nugget-popup"><p>Area identified as being protected by the newly installed attenuation tank to reduce surface&ndash;water flooding risk following the Sep 2012 event. (p14)</p></div><div class="nugget-popup"><p>The road at Saddle Junction was flooded such that water covered the carriageway, rendering the road impassable; vehicles were stopped before the flooded section and normal traffic flow was disrupted. [IMG] (p23)</p></div></div></body></div>`)[0];

s inundated with floodwater covering the road and forecourts, impeding access and movement; pedestrians and vehicles were affected and barriers were partially submerged. [IMG] (p24)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8 residential properties; 1 commercial property (p4)</p></div></div></body></div>`)[0];

                var html_aceecda8025fb813256f6a8706d4bf22 = $(`<div id="html_aceecda8025fb813256f6a8706d4bf22" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Melverley Street, Wigan Metropolitan District</h1><div class="nugget-popup"><p>The surcharged United Utilities combined sewer prevented the highway drainage system on Melverley Street from discharging, contributing to surface water inundation of the highway drainage on Melverley Street. (p9)</p></div><div class="nugget-popup"><p>Surface water flooding affected the Melverley Street / Eleanor Street area during the September 2012 event. Highway gullies were prevented from discharging due to sewer and local flooding, causing surface water to accumulate and impact residential properties and nearby commercial businesses. Subsequent mitigation (Saddle relief road works and pumped drainage) was proposed to reduce future risk and to reclassify the area out of Flood Zone 3. (p16)</p></div></div></body></div>`)[0];
