                var html_3aabd8572ebbcee32b014079a98da745 = $(`<div id="html_3aabd8572ebbcee32b014079a98da745" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Harrias House Residential Care Home</h1><div class="nugget-popup"><p>Access to the care home was impeded because Hedgerley Lane was flooded by contaminated foul sewer water (a broken foul sewer and closed Pyebush Lane pumping station caused the foul sewer to surcharge). Staff required off&ndash;road transport to reach the building. (p11)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>9&ndash;12 inches (p11)</p></div></div></body></div>`)[0];

                var html_4a497ceb60b735ad5e6695f6ff6bd8bd = $(`<div id="html_4a497ceb60b735ad5e6695f6ff6bd8bd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hedgerley Lane, Beaconsfield</h1><div class="nugget-popup"><p>Carriageway heavily waterlogged with multiple large puddles and standing water; potholes and muddy, uneven surface indicating drainage failure and impaired road usability. (p1)</p></div><div class="nugget-popup"><p>Thames Water sewers surcharged (after Pyebush Lane pumping station was turned off and groundwater infiltrated pipes), discharging contaminated water from manholes onto Hedgerley Lane. The road became impassible to vehicles and on foot, creating environmental and public health risks and cutting off access to nearby properties including a care home and a nursery. (p4)</p></div><div class="nugget-popup"><p>Surface water inundation affected Hedgerley Lane (predicted to flood in a 1 in 30 year event); the January 2014 flood (beginning of January) was the worst on record at this location and is described as probably a combination of surface water flooding and foul sewer surcharge. Further floods occurred in February and March 2014. [PAG,MUL] (p9)</p></div><div class="nugget-popup"><p>The foul sewer surcharged and contaminated floodwater covered the road, making it impassable. Contractors tankered the water day and night until tankering stopped on 14 Jan 2014, after which contaminated water collected on the road. Thames Water cleared the floodwater on 16 Jan 2014 and completed road decontamination the following week. [PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Foul sewer on Hedgerley Lane surcharged (due to extreme/prolonged rainfall combined with the closure of the Pyebush Lane pumping station), flooding the lane with contaminated (sewage) water; the road was covered, access to cut&ndash;off properties was made almost impossible, and the event posed an environmental and public health risk. Report states properties were not flooded internally. [TAB] (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>9&ndash;12 inches (flood depth) [PAG,MUL] (p11)</p></div></div></body></div>`)[0];

                var html_56a636389e32d4b4a7bcf17f541f208f = $(`<div id="html_56a636389e32d4b4a7bcf17f541f208f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Pyebush Lane, Beaconsfield</h1><div class="nugget-popup"><p>The Pyebush Lane pumping station was turned off for a period, which prevented normal removal of flows. This contributed to Thames Water pipes being overwhelmed (with groundwater infiltration noted), leading to surcharging out of manholes and contaminated floodwater on Hedgerley Lane that made the road impassable and posed environmental and public health risks, cutting off access to properties including a care home and a nursery. (p4)</p></div><div class="nugget-popup"><p>The Pyebush Lane pumping station was closed (from 31 Dec 2013) because of the broken sewer and associated flows; tankers were used to manage flows at the pumping station but capacity was exceeded due to groundwater and surface water infiltration, contributing to sewer surcharge elsewhere. [PAG,MUL] (p11)</p></div></div></body></div>`)[0];

                var html_0405ec7e8f5e0244dd12f9d188389152 = $(`<div id="html_0405ec7e8f5e0244dd12f9d188389152" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Beaconsfield</h1><div class="nugget-popup"><p>Surface water flooding affected a road in Beaconsfield (Hedgerley Lane), resulting in standing water and waterlogged road conditions. (p1)</p></div><div class="nugget-popup"><p>Flooding on Hedgerley Lane within Beaconsfield caused by pumping station closure and groundwater infiltration led to surcharging of sewers and contaminated discharge onto the road, making it impassible, creating environmental and public health risks, and isolating properties (including a care home and nursery). (p4)</p></div><div class="nugget-popup"><p>Local area (including Hedgerley Lane) experienced surface water flooding combined with foul sewer surcharge; the early January 2014 event was described as the worst on record and led to repeated flooding at the location afterwards. [PAG,IMG] (p9)</p></div><div class="nugget-popup"><p>Within Beaconsfield a broken foul sewer and the closure of the Pyebush Lane pumping station led to contaminated sewer floodwater covering Hedgerley Lane and making routes impassable. Local impacts included assistance required to access Harrias House care home (4 Jan 2014) and the closure of a nursery on 16 Jan 2014 to avoid children walking through contaminated water. Road decontamination was completed the week after 16 Jan 2014. [MUL] (p11)</p></div><div class="nugget-popup"><p>Contaminated flood water in the area led South Bucks District Council environmental health to close a nursery on 16 January 2014 to prevent children walking through contaminated water and bringing it into buildings; SBDC staff were on site throughout the flooding to provide advice. (p12)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>9&ndash;12 inches (flood depth) [MUL] (p11)</p></div></div></body></div>`)[0];
