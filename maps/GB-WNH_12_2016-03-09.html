                var html_371fa2a136d42be6074dae410f5ad8b4 = $(`<div id="html_371fa2a136d42be6074dae410f5ad8b4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Danes Way, Crick</h1><div class="nugget-popup"><p>Surface water flooding impaired drainage and affected critical infrastructure at Danes Way; flooding persisted and affected critical infrastructure for a period in excess of three hours from the onset of flooding. (p7)</p></div><div class="nugget-popup"><p>Heavy rainfall on a saturated catchment overwhelmed drainage systems and watercourses at Danes Way (DIRFT East), causing water levels to rise and flooding of the area. Pumping operations and the installation of a larger culvert for Crick Brook (over&ndash;pumping during works at the northern end of Danes Way/A5 roundabout) may have altered flow, affecting the volume and direction of overland flooding. [PAG] (p15)</p></div><div class="nugget-popup"><p>The plan labels an &#8220;Approximate catchment area contributing to Danes Way Watercourse&#8221;, indicating runoff routed to the Danes Way watercourse and its role in the flooding around Crick on 9th March 2016. [IMG] (p32)</p></div><div class="nugget-popup"><p>Overland flow routes converged toward Danes Way during the incident; schematic areas of flooding are shown adjacent to the road. Water was pumped from a watercourse onto Danes Way. Culvert replacement works (Q1, Q2, Q3) were identified along Danes Way and nearby watercourses and an attenuation pond is located to manage excess water. [IMG] (p33)</p></div><div class="nugget-popup"><p>Road surface showed pooling and standing water, producing a wet reflective carriageway that could impede vehicle movement and indicates drainage was overwhelmed at this location. [IMG,PAG] (p48)</p></div><div class="nugget-popup"><p>Paved pedestrian walkways and the adjoining road were flooded: standing water pooled along walkways adjacent to a fenced industrial/commercial site and water flowed over a sloped footpath toward gates and drains. Pedestrian access was made impassable or difficult and water encroached onto the carriageway, prompting on&ndash;site personnel and roadwork/traffic management activity. [IMG,PAG] (p49)</p></div><div class="nugget-popup"><p>Surface&ndash;water flooding caused ponding and water pooling on the paved access and roadway at Danes Way, obstructing pedestrian and vehicular access and creating a safety hazard; caption notes water being pumped/over&ndash;pumped from a nearby watercourse onto the road. [IMG,PAG] (p50)</p></div><div class="nugget-popup"><p>Danes Way was heavily flooded with water covering both lanes and extending onto the pavement, rendering the road impassable. Emergency response used pumps and sandbags and deployed a blue barrier to manage and redirect floodwater. [IMG,PAG] (p51)</p></div><div class="nugget-popup"><p>Roadway and adjacent sidewalk were inundated; vehicular traffic was affected (truck driving through floodwater); flood warning signage was deployed and personnel in high&ndash;visibility clothing were present, indicating an official response/monitoring. [IMG,PAG] (p52)</p></div><div class="nugget-popup"><p>Road surface covered by standing water across both lanes, making the road hazardous or potentially impassable and disrupting normal travel; vehicles seen halted or proceeding with difficulty. [IMG] (p56)</p></div><div class="nugget-popup"><p>Floodwater covered the carriageway, extending across both lanes and making the road hazardous or impassable; vehicles were observed driving through standing water and emergency responders in high&ndash;visibility clothing were present managing the situation. [IMG] (p61)</p></div><div class="nugget-popup"><p>Surface water flooding affected Danes Way and the adjacent business park area, leaving the carriageway and site areas wet/partially inundated and prompting on&ndash;site inspection checks during the incident. [IMG,PAG] (p65)</p></div><div class="nugget-popup"><p>Roadway was inundated by water from a nearby watercourse overflow; vehicles were driving through standing/flowing water and emergency pumping operations were in place discharging muddy water onto the carriageway to manage levels. [IMG,PAG] (p72)</p></div><div class="nugget-popup"><p>Pathway and roadside adjacent to Danes Way were inundated: the pathway was almost completely submerged and rendered impassable; floodwater encroached onto the grass verge and partially covered the carriageway, requiring a warning sign and staff presence and forcing vehicles to drive through standing water. [IMG,PAG] (p73)</p></div><div class="nugget-popup"><p>Danes Way was completely submerged by floodwater, with the road surface and curbs obscured; the street was impassable to vehicles and pedestrians and water encroached onto pavements. [IMG,PAG] (p74)</p></div><div class="nugget-popup"><p>Discharge headwall and culvert entry under Danes Way (including underground attenuation outlet) were documented as conveying runoff during the event. The headwall and culvert outlet were partially filled with water and discharging to a reinforced channel; stone rip&ndash;rap and vegetation were present at the outlet for erosion control. [PAG] (p80)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 culvert replacement sites (Q1, Q2, Q3); 1 location where water was pumped from the watercourse onto Danes Way; 1 attenuation pond [IMG] (p33)</p></div></div></body></div>`)[0];
