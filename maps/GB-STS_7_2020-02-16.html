                var html_230ac9ef342f55d82111e77a98883742 = $(`<div id="html_230ac9ef342f55d82111e77a98883742" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Dove</h1><div class="nugget-popup"><p>High flows on the River Dove at the confluence with Rolleston Brook are implicated in the mapped flood location; River Dove flows and its confluence contributed to flooding observed adjacent to Rolleston&ndash;on&ndash;Dove. [PAG,IMG] (p19)</p></div><div class="nugget-popup"><p>The River Dove influenced the extent of flooding in the area and contributed to inundation of nearby residential areas; its proximity to Brookside is linked to properties there being flooded during the event on 16 February 2020. [IMG,PAG] (p23)</p></div><div class="nugget-popup"><p>High flows in the River Dove prompted the operation/closure of nearby control gates during the flood response. Two control gates under the railway were closed during the weekend of 16&ndash;17 February 2020, and the Tutbury sluice gate was closed on the morning of 17 February 2020 to prevent River Dove flood flows moving through culverts or down the Tutbury Mill Fleam. The report concluded these gates do not have capacity to divert significant volumes and were unlikely to have caused the flooding experienced at Brookside. [MUL] (p34)</p></div><div class="nugget-popup"><p>Identified as influencing flooding of the Rolleston Brook; the modelling study will assess the River Dove's influence and joint probability of events with Rolleston Brook to understand flood mechanisms and impacts on properties. (p35)</p></div></div></body></div>`)[0];

                var html_119eb6108d504c8c0aeef37e499a9caa = $(`<div id="html_119eb6108d504c8c0aeef37e499a9caa" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Brook Side, Rolleston-On-Dove</h1><div class="nugget-popup"><p>Flooding associated with Storm Dennis internally affected properties on Brookside; internal property flooding was reported and investigated to determine likely cause (surface water, river, sewer, or highway drainage). (p5)</p></div><div class="nugget-popup"><p>Brookside, Rolleston is the focus of this Section 19 investigation; flooding there resulted from the Storm Dennis event in February 2020. (p6)</p></div><div class="nugget-popup"><p>A flood event occurred at Brookside on 16 February 2020; the event at this location is the subject of the report and was investigated using anecdotal evidence from local residents and consultation with Risk Management Authorities. (p15)</p></div><div class="nugget-popup"><p>Map and figure in the report mark Brookside as the flood location during the February 2020 event. The residential road adjacent to Rolleston Brook was inundated during the heavy persistent rainfall associated with Storm Dennis (15&ndash;16 Feb 2020), affecting the street and immediate surrounding residential area and potentially restricting access. [IMG] (p18)</p></div><div class="nugget-popup"><p>The brook emerges on the southern side of Brookside and a mapped flood location lies nearby; flooding from Rolleston Brook affected the immediate Brookside area (including crossings/ford locations and properties adjacent to the channel). [PAG] (p20)</p></div><div class="nugget-popup"><p>Flooding from the Rolleston Brook affected Brookside; the report records historical flooding at Brookside and identifies flooding experienced during the February 16, 2020 event. [PAG] (p21)</p></div><div class="nugget-popup"><p>Water from Rolleston Brook flowed across the highway towards properties on Brookside, resulting in significant internal damage to properties. [PAG,MUL] (p22)</p></div><div class="nugget-popup"><p>On 16 February 2020 multiple properties on Brookside reported they had experienced flooding. The highway and several properties along Brookside are mapped within RoFSW (1 in 30, 1 in 100 and 1 in 1000 year outlines), indicating surface water flooding affecting the road and adjacent homes; flooding extent is shown adjacent to the River Dove. [IMG,PAG] (p23)</p></div><div class="nugget-popup"><p>On 16 February 2020 multiple properties on Brookside experienced internal flooding. Records indicate 6 properties experienced internal flooding according to East Staffordshire Borough Council, and 12 properties reported internal flooding to the Environment Agency. Property owners reported flood depths inside dwellings of 2 to 16 inches, with significant damage to interior decoration, carpets and flooring and many items beyond salvage. Flood gates on some properties proved ineffective. Many residents were unable to leave their properties for several hours. Outbuildings, gardens, driveways and the highway were also flooded. Floodwater contained mud and silt likely from upstream fields. [IMG,PAG] (p24)</p></div><div class="nugget-popup"><p>Multiple residential properties on Brookside experienced internal flooding from Rolleston Brook. Flood depths inside dwellings were reported between 2 and 16 inches causing significant damage to interior decoration, carpets and flooring; many household items were beyond salvage. Flooding also affected outbuildings, gardens, driveways and the highway; residents were unable to leave for several hours. Installed flood gates on some properties proved ineffective. Floodwater contained mud and silt likely from upstream agricultural runoff. [IMG,PAG] (p25)</p></div><div class="nugget-popup"><p>Brookside experienced flooding during the 16th February 2020 event; the location is an ongoing flood issue and the flood on 16 Feb 2020 prompted SCC LLFA and other Risk Management Authorities to collect data and undertake investigations to understand the flooding mechanisms and identify potential solutions. (p27)</p></div><div class="nugget-popup"><p>Brookside experienced flooding during the Storm Dennis event on 15&ndash;16 February 2020. The flood at Brookside is an ongoing issue; the February 16th event prompted SCC LLFA and other Risk Management Authorities to collect data and undertake investigations to understand the flooding mechanisms and identify potential mitigation measures. [IMG,PAG] (p28)</p></div><div class="nugget-popup"><p>Brookside experienced river flooding on 16 February 2020. Intense rainfall on already saturated ground caused river levels to rise and led to a flooding event at Brookside. [IMG,PAG] (p29)</p></div><div class="nugget-popup"><p>Rolleston Brook overtopped its banks during the Storm Dennis rainfall on 16th February 2020. Floodwater followed multiple observed flow routes into the Brookside residential area, spilling onto both left and right banks, flowing via the footbridge adjacent to the former Brook House Hotel and inundating areas and properties along the left and right banks and along the footbridge linking to Station Road. [IMG,PAG] (p30)</p></div><div class="nugget-popup"><p>Properties in Brookside were reported by residents to have been inundated during the event driven by the rapid rise of Rolleston Brook and the constrained downstream floodplain. (p31)</p></div><div class="nugget-popup"><p>Properties on Brookside were flooded in February 2020 as a direct result of overflow from Rolleston Brook. Residents reported properties were inundated for approximately two hours; by the time the River Dove later peaked, floodwater was already receding from these properties. (p32)</p></div><div class="nugget-popup"><p>Properties in Brookside were inundated as Rolleston Brook exceeded channel capacity due to rapid runoff; channel constraints (vegetation, debris and significant silt at the sharp bend) contributed to water spilling into the village. Residents reported properties inundated for about two hours before water receded. The ford at the lower end is now impassable due to deep silt build&ndash;up. [PAG] (p33)</p></div><div class="nugget-popup"><p>Properties along Brookside were flooded when Rolleston Brook overtopped its channel during the 16 February 2020 event. (p34)</p></div><div class="nugget-popup"><p>Lower parts of the Rolleston Brook at Brookside have high silt deposits reducing channel capacity; Environment Agency Asset Performance Team programmed de&ndash;silting works at the downstream end of Brookside to address these issues. (p35)</p></div><div class="nugget-popup"><p>Experienced river flooding from the Rolleston Brook as an exceedance event on 16th February 2020. Sediment (silt) mobilised from upstream (Brook Hollows) reduced channel capacity and contributed to the downstream flood impact at Brookside. [PAG] (p36)</p></div><div class="nugget-popup"><p>River flooding from the Rolleston Brook inundated surrounding land and properties along Brookside. [PAG] (p37)</p></div><div class="nugget-popup"><p>Flooding of surrounding land and properties along Brookside due to rapid rise in flows in Rolleston Brook. [TAB,PAG] (p38)</p></div><div class="nugget-popup"><p>Flooding from the Rolleston Brook overtopped the channel and flowed towards properties on Brookside, causing internal flooding to residences and flooding of gardens, driveways and the highway. (p41)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>6 properties; 12 properties; 2 to 16 inches [IMG,PAG] (p24)</p></div><div class="nugget-popup quant"><p>6 properties; 12 properties [IMG,PAG] (p25)</p></div><div class="nugget-popup quant"><p>properties inundated for approximately two hours (p32)</p></div><div class="nugget-popup quant"><p>12 residential properties (p41)</p></div></div></body></div>`)[0];

                var html_caf8307578ec3e50e14fba4e7cb4a9b9 = $(`<div id="html_caf8307578ec3e50e14fba4e7cb4a9b9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Staffordshire</h1><div class="nugget-popup"><p>Storm Dennis (16 February 2020) caused widespread flooding to highways and properties across Staffordshire; SCC undertook investigations in affected areas. (p6)</p></div><div class="nugget-popup"><p>Storm Dennis produced heavy persistent rainfall over Staffordshire on 15&ndash;16 February 2020 that resulted in flooding in parts of the county, including the flood marked at Brookside in Rolleston&ndash;on&ndash;Dove. [PAG,IMG] (p18)</p></div><div class="nugget-popup"><p>The intense rainfall and saturated antecedent conditions produced significant volumes of surface water flooding across the county and elevated flows in multiple watercourses, contributing to flood incidents on 16 February 2020. [PAG] (p30)</p></div></div></body></div>`)[0];

                var html_8e9c8fc0277ea97580a2ab8618096742 = $(`<div id="html_8e9c8fc0277ea97580a2ab8618096742" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Staffordshire</h1><div class="nugget-popup"><p>Experienced exceptionally high rainfall and very low soil moisture deficit leading up to and during Storm Dennis; river flows were exceptionally high in February 2020, producing flood conditions that included the Brookside, Rolleston&ndash;on&ndash;Dove flood event on 16 February 2020. (p15)</p></div><div class="nugget-popup"><p>Storm Dennis swept across Staffordshire on 15&ndash;16 February 2020 bringing heavy, sustained rainfall that led to exceptionally high river flows in February and contributed to local flooding, including the event at Brookside, Rolleston&ndash;on&ndash;Dove. [PAG] (p17)</p></div><div class="nugget-popup"><p>Parts of Staffordshire County experienced flooding associated with the Storm Dennis weather system on 15&ndash;16 February 2020; the report specifically maps a flood at Brookside, Rolleston&ndash;on&ndash;Dove within the county boundary. [IMG] (p18)</p></div><div class="nugget-popup"><p>Widespread flooding incidents occurred across the county on 16 February 2020 driven by an intense period of rainfall on saturated ground; significant volumes of surface water flooding occurred and several watercourses were elevated (antecedent high flows from Storm Ciara the previous week worsened conditions). [IMG] (p29)</p></div></div></body></div>`)[0];

                var html_c4b422a49bef49f1ccd310459fa65f1e = $(`<div id="html_c4b422a49bef49f1ccd310459fa65f1e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Rolleston-On-Dove</h1><div class="nugget-popup"><p>Internally affected properties in the Brookside area experienced flooding during the Storm Dennis event. [PAG] (p5)</p></div><div class="nugget-popup"><p>Storm Dennis (16 Feb 2020) caused flooding in the Rolleston&ndash;On&ndash;Dove area, affecting highways and properties. The Brookside area of Rolleston was flooded and is the focus of this investigation. (p6)</p></div><div class="nugget-popup"><p>Flooding affected Rolleston&ndash;On&ndash;Dove on 16 February 2020 (the report focuses on the event at Brookside within Rolleston&ndash;On&ndash;Dove); the event has been assessed via resident accounts and RMA consultation. (p15)</p></div><div class="nugget-popup"><p>Flooding occurred at Brookside, a residential road in Rolleston&ndash;on&ndash;Dove (location marked on the report map). The event inundated the road and caused local disruption within the village (access and local activity affected). Attribution to Rolleston Brook/overland runoff is plausible from the map context but not explicitly confirmed in the text. [IMG,PAG] (p18)</p></div><div class="nugget-popup"><p>Flooding occurred in the vicinity of Rolleston&ndash;on&ndash;Dove associated with high flows on Rolleston Brook and the nearby River Dove; the mapped flood location is adjacent to the village (near Brookside/Burnside), indicating local inundation/overbanking affecting parts of the village. [IMG] (p19)</p></div><div class="nugget-popup"><p>Flooding associated with Rolleston Brook affected the village area (notably the Brookside corridor). A flood location is shown on the report map upstream of the village near a road crossing; the brook flows through culverts and artificial channels in the village and there are no formal flood defences at this location. [IMG] (p20)</p></div><div class="nugget-popup"><p>Brookside in Rolleston&ndash;on&ndash;Dove was flooded by the Rolleston Brook. The Environment Agency inspected the watercourse after the event and reported there are no main river flood defences on the brook; the EA conducts visual channel inspections and undertakes debris/tree&ndash;vegetation clearance and maintenance of the channel. [PAG] (p21)</p></div><div class="nugget-popup"><p>Rolleston&ndash;on&ndash;Dove has a documented history of flooding along Brookside with recorded flood events (July 1983; 06/11/2000; 2007; July 2012; 25/11/2012; March 2018; November 2019; and 16/02/2020) that have affected properties in flood&ndash;prone parts of the village. [PAG,MUL] (p22)</p></div><div class="nugget-popup"><p>Rolleston&ndash;on&ndash;Dove (the village) was affected by main&ndash;river flooding from Rolleston Brook. Properties on Brookside experienced internal flooding, with contaminated water, silt deposition and damage to interiors. A flood warning for Rolleston was issued at 02:24 on 16 February 2020. (p25)</p></div><div class="nugget-popup"><p>The wider village of Rolleston&ndash;on&ndash;Dove experienced flooding associated with the 16th February 2020 event; investigations have been undertaken to better understand flooding mechanisms and identify solutions for the village following that event. (p27)</p></div><div class="nugget-popup"><p>The wider village of Rolleston&ndash;on&ndash;Dove was affected by the Storm Dennis rainfall on 15&ndash;16 February 2020; flooding at Brookside and elsewhere in the village was significant enough to trigger multi&ndash;agency investigations to understand causes and identify solutions. [IMG] (p28)</p></div><div class="nugget-popup"><p>Flooding at Brookside originated from Rolleston Brook overtopping its banks during the event. Water left the channel by the footbridge adjacent to the former Brook House Hotel, spilling onto left and right banks and following topography towards properties along the left bank and across the footbridge connecting to Station Road. [IMG] (p30)</p></div><div class="nugget-popup"><p>The village experienced rapid river flooding associated with the Rolleston Brook peak on 16th February 2020; properties were inundated and Environment Agency gauge data and warnings were used to inform response for Rolleston&ndash;on&ndash;Dove and surrounding villages. [IMG,PAG] (p31)</p></div><div class="nugget-popup"><p>During the 16 February 2020 event, Rolleston experienced river flooding where Rolleston Brook overtopped and flooded properties along Brookside. Separately, Chapel Lane in Rolleston experienced surface water flooding due to a collapsed surface water sewer; this surface water flooding is not reported to have resulted in internal property flooding. [PAG] (p34)</p></div><div class="nugget-popup"><p>Rolleston&ndash;on&ndash;Dove residents experienced flooding from the Rolleston Brook during the 16 February 2020 event; ongoing flooding issues prompted hydraulic modelling, site visits and investigations to identify flood&ndash;reduction options. (p35)</p></div><div class="nugget-popup"><p>Flooding from the Rolleston Brook affected the area of Rolleston&ndash;on&ndash;Dove, including inundation at Brookside and surrounding land. (p37)</p></div><div class="nugget-popup"><p>Increase in flows in Rolleston Brook (response to rainfall on 15&ndash;16 Feb 2020) caused flooding to surrounding land and properties within Rolleston&ndash;on&ndash;Dove (including Brookside). [TAB,PAG] (p38)</p></div><div class="nugget-popup"><p>Rolleston&ndash;on&ndash;Dove experienced flooding driven by high flows in the Rolleston Brook which spilled from the channel and impacted properties and the local community, including internal flooding at Brookside. [PAG] (p41)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>6 properties; 12 properties (p25)</p></div><div class="nugget-popup quant"><p>12 residential properties [PAG] (p41)</p></div></div></body></div>`)[0];
