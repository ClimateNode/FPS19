                var html_37aae4e5be2c6167a994c91b355cd71f = $(`<div id="html_37aae4e5be2c6167a994c91b355cd71f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>West Kingsdown</h1><div class="nugget-popup"><p>Around a dozen properties in the West Kingsdown area were flooded by surface water; many of those properties were affected internally. (p1)</p></div><div class="nugget-popup"><p>Multiple locations across the town experienced overland/surface water flooding (overland flow from adjacent farmland and runoff from a business park). Impacts included internal flooding to residential and at least one commercial property, external flooding, a conservatory wall collapse, and at least one evacuation. [IMG] (p2)</p></div><div class="nugget-popup"><p>A heavy, approximately 1&ndash;in&ndash;100&ndash;year storm overwhelmed drainage, producing overland flows from the rural catchment and urban area that collected at local low points and flow paths and caused flooding to properties in the vicinity. Highway drainage was overwhelmed but drained once rainfall ceased. (p7)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>around a dozen properties (p1)</p></div><div class="nugget-popup quant"><p>A20 London Road: 1 residential property flooded; 1 commercial property internally flooded; Ash Tree Close/Drive: 5 properties internally flooded; Southfields Road: 1 property; Neal Road: 2 properties internally flooded and 1 property externally flooded; Heaver Wood Road: 1 property; Phelps Close: 1 property; Botsom Lane: 1 property; Primmett Close: 1 property; Warland Road: 1 property; Evacuations: 1 resident; Conservatory wall collapse: 1 [IMG] (p2)</p></div><div class="nugget-popup quant"><p>1 report of flooding received during the event (p7)</p></div></div></body></div>`)[0];
