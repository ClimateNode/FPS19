                var html_be8c84a998dc2a9d38e8c24f7775cbcb = $(`<div id="html_be8c84a998dc2a9d38e8c24f7775cbcb" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Aquarius Development</h1><div class="nugget-popup"><p>Floodplain connectivity downstream of the Aquarius site is restricted by ground levels in adjacent fields and the site's perimeter ditch, meaning modelled flood flows (1 in 20 and 1 in 100 year events) would not pass through to the downstream floodplain as the 2014 model suggests. Recommendation to investigate modifying/diverting the site perimeter ditch to increase flow capacity. [TAB,PAG,MUL] (p3)</p></div><div class="nugget-popup"><p>The perimeter ditch of the Aquarius site is identified as a feature that could be modified or diverted to increase flow capacity and reduce flood risk on the downstream reach of the River Windrush. [PAG] (p4)</p></div><div class="nugget-popup"><p>Lidar and field levels indicate poor floodplain connectivity downstream of the Aquarius site during the December 2020 event &mdash; flood flows south of the Aquarius site and east of the eastern channel of the Windrush would not easily fill and pass through to the downstream floodplain, altering expected flow routes. (p21)</p></div><div class="nugget-popup"><p>The perimeter ditch at the Aquarius site was identified as constraining flow capacity during flood events; report recommends investigating whether the ditch can be modified or diverted to increase flow capacity to reduce flooding. [TAB,PAG] (p27)</p></div><div class="nugget-popup"><p>The perimeter ditch at the Aquarius site was identified as having insufficient flow capacity during the December 23&ndash;24, 2020 flood and is proposed to be modified or diverted to increase conveyance and reduce local flooding risk. (p28)</p></div><div class="nugget-popup"><p>The perimeter ditch at the Aquarius site was identified as having insufficient conveyance capacity; it was recommended that the ditch be modified or diverted to increase flow capacity to reduce flood risk to the site and surrounding area. (p32)</p></div></div></body></div>`)[0];

                var html_149086370dd87a58d7d93a768c186c03 = $(`<div id="html_149086370dd87a58d7d93a768c186c03" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Langel Common</h1><div class="nugget-popup"><p>A raised footpath/embankment at Langel Common (levels 79.72&ndash;80.10m AOD) is higher than the modelled 1 in 100 year level (79.68m AOD in the 2014 model), confirming the embankment prevents floodplain connectivity and that not all flows would spill back to the river as the model suggests. Recommendations include improving flows through the footpath to restore connectivity and installing gauge boards. [TAB,PAG] (p3)</p></div><div class="nugget-popup"><p>The footpath at Langel Common and its floodplain connectivity are affected by flooding; actions propose improving flows through the Langel Common footpath to ensure floodplain connectivity during flood events and installing gauge boards from Woodford Mill to Langel Common. [PAG] (p4)</p></div><div class="nugget-popup"><p>A raised footpath in Langel Common (Lidar levels reported between 79.72m and 80.10m AOD) forms a continuous raised structure that disconnects the floodplain upstream and downstream. This restricts out&ndash;of&ndash;bank flows from filling and passing through the floodplain and therefore alters flood routing during high River Windrush levels (noted during the flooding on 23&ndash;24 Dec 2020). (p13)</p></div><div class="nugget-popup"><p>A raised footpath in Langel Common was observed impounding floodplain flows and overtopping during the event, producing a noticeable difference in water level upstream and downstream. [PAG] (p14)</p></div><div class="nugget-popup"><p>Low&ndash;lying areas of the common experienced flooding; a continuous raised footpath through the common acted as a barrier, causing impoundment of floodplain flows and localised overtopping across the path. [IMG,PAG] (p15)</p></div><div class="nugget-popup"><p>Identified as a low&ndash;lying area with significant surface&ndash;water flood risk; the continuous raised footpath across Langel Common was noted as potentially acting as a barrier to flood waters and causing accessibility issues; investigation proposed to replace raised footpath with a continuous bridge. [IMG,PAG] (p16)</p></div><div class="nugget-popup"><p>Model outputs indicate excess flows spill onto the floodplain and re&ndash;join the river before the raised footpath at Langel Common. The modelling suggests the footpath there is overtopped in the modelled 1 in 100 year event. (p17)</p></div><div class="nugget-popup"><p>Reported flooding issues in the area around Langel Common during the December 2020 event; highlighted for further analysis in updated flood modelling for Witney. (p19)</p></div><div class="nugget-popup"><p>The raised footpath/embankment at Langel Common restricted floodplain connectivity during the December 2020 event; the embankment crest was higher than the modelled 1 in 100 year flood level, preventing flows passing onto the floodplain as the 2014 model had suggested. (p21)</p></div><div class="nugget-popup"><p>Footpath and floodplain connectivity were affected by flood flows; recommendations to improve flows through the Langel Common footpath, install gauge boards through to Langel Common and update models to reflect levels affecting this area. [TAB] (p27)</p></div><div class="nugget-popup"><p>Flows through the Langel Common footpath and floodplain connectivity were impaired during the 23&ndash;24 December 2020 flood; actions include improving flow connectivity and installing gauge boards to monitor levels between Woodford Mill and Langel Common. (p28)</p></div><div class="nugget-popup"><p>Flooding affected the footpath and floodplain connectivity at Langel Common during the event; the report calls for improvements to flows and floodplain connectivity and installation of gauge boards at this location. (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>79.68m AOD (modelled 1 in 100 footpath flood level) (p17)</p></div></div></body></div>`)[0];

                var html_eced985d5854d093d20093de4b82daa6 = $(`<div id="html_eced985d5854d093d20093de4b82daa6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Windrush</h1><div class="nugget-popup"><p>The River Windrush through and downstream of Witney shows reduced flow capacity and poor condition (due to lack of maintenance), causing floodplain connectivity issues and contributing to higher flood levels upstream. The report recommends increased EA/riparian maintenance, potential river modification to increase flow capacity, and an updated river model incorporating December 2020 flood data. [TAB,PAG,MUL] (p3)</p></div><div class="nugget-popup"><p>River Windrush overtopping/limited channel capacity through and downstream of Witney contributed to flooding risk along the town and downstream reaches; recommendations target riparian maintenance, channel modification and increased floodplain connectivity between New Bridge Street and the footpath at Langel Common and upstream storage to reduce peak flows. (p4)</p></div><div class="nugget-popup"><p>Upstream catchment flows reached Witney causing river flooding on 24/12/2020; contributed to river levels peaking (river flooding) and to internal and external flooding across Witney. (p11)</p></div><div class="nugget-popup"><p>Exceptional river flows recorded on the River Windrush during the December 2020 event, producing high river levels that fed the flooding recorded in Witney (peak river level at Riverside Gardens of 81.45 m AOD on 25/12/2020). [PAG] (p12)</p></div><div class="nugget-popup"><p>River Windrush contributed to flooding in Witney: gauge boards on the Windrush (at Bridge Street) were submerged during floods; channel obstructions (fallen tree at Blanket Hall and the Bridge Street bridge alignment) restricted peak flows and generated a bow wave when levels were high on the evening of 24 December 2020. [PAG] (p13)</p></div><div class="nugget-popup"><p>The River Windrush generated high flows during the event: the peak flow recorded at Worsham on 24/12/2020 compared to the modelled 1 in 100 year plus 20% event, and recorded peak flood level at Riverside Gardens exceeded the 1 in 100 year flood level, causing river inundation of low&ndash;lying areas. (p16)</p></div><div class="nugget-popup"><p>Rapid rise in the River Windrush on 23&ndash;24 Dec 2020 contributed to flooding in Witney, triggering a late flood warning and prompting changes to warning thresholds and development of updated flood&ndash;risk modelling. (p19)</p></div><div class="nugget-popup"><p>The River Windrush produced flows in December 2020 greater than the existing EA modelled 1 in 100 year event (comparable to the modelled 1 in 100 year plus 20% peak flow), causing flooding through the town. Poor channel condition and lack of significant maintenance upstream contributed to the severity of flooding. (p21)</p></div><div class="nugget-popup"><p>The River Windrush is described as the channel through and downstream of Witney requiring increased EA/riparian maintenance and potential channel modification to increase flow capacity during severe conditions; it is the source of the river flooding affecting Witney. [TAB] (p27)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>modelled 1 in 20 year event; modelled 1 in 100 year event; raised footpath levels 79.72&ndash;80.10m AOD compared with modelled 79.68m AOD [TAB,PAG,MUL] (p3)</p></div><div class="nugget-popup quant"><p>30.348 m3/s peak flow (recorded at Worsham gauge on 24/12/2020); exceeded July 2007 flow of 29.26 m3/s. [PAG] (p12)</p></div><div class="nugget-popup quant"><p>greater than modelled 1 in 100 year; similar to modelled 1 in 100 year plus 20% event (p21)</p></div></div></body></div>`)[0];

                var html_c88282704708d5599f6ed33125c85015 = $(`<div id="html_c88282704708d5599f6ed33125c85015" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bridge Street Bridge</h1><div class="nugget-popup"><p>Sediment/debris under and upstream of the bridge was identified as restricting flow and contributing to flooding risk; the bridge to be checked regularly and de&ndash;silting (including upstream) investigated to reduce flood impacts. (p5)</p></div><div class="nugget-popup"><p>On the night of 24 Dec 2020 the bridge was observed to restrict peak river flows and produce a bow&ndash;wave/turbulent flow upstream; water levels were close to the top of the bridge parapet with a risk of overtopping. [IMG] (p14)</p></div><div class="nugget-popup"><p>The EA model shows all modelled flows, including up to the 1 in 100 year plus 70% climate change event, passing through the Bridge Street Bridge. The bridge is on the main flow path and modelling suggests it may be associated with raised upstream flood levels. (p17)</p></div><div class="nugget-popup"><p>Siltation and debris under Bridge Street Bridge contributed to flow blockages during the December 2020 river flooding; recommendations include regular checks and investigation of de&ndash;silting to reduce flood risk. [TAB] (p27)</p></div><div class="nugget-popup"><p>Bridge Street bridge experienced siltation/obstruction issues related to the flooding; recommendation to check regularly and investigate de&ndash;silting both under and upstream of the bridge to reduce blockages during high flows. (p29)</p></div><div class="nugget-popup"><p>Bridge Street bridge was identified as requiring regular checks and investigation into de&ndash;silting, indicating silt/blockage at the bridge reduced conveyance and contributed to local flooding risk that affected the town during the December 2020 event. (p31)</p></div><div class="nugget-popup"><p>High river flows observed beneath the bridge with water occupying the channel upstream of the structure; vegetation at the banks adjacent to the bridge is shown in contact with floodwater. [IMG] (p40)</p></div></div></body></div>`)[0];

dition due to little maintenance, exacerbating flood impacts. (p21)</p></div><div class="nugget-popup"><p>The report identifies issues with river levels upstream of Bridge Street during the event that contributed to localised flooding concerns and require investigation and modelling updates. (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>modelled 1 in 100 year; modelled 1 in 100 year plus 20%; raised footpath levels 79.72m&ndash;80.1m AOD vs modelled 79.68m AOD (p21)</p></div></div></body></div>`)[0];

                var html_fb4801323a83bf1caac4cd0d3ae6d31b = $(`<div id="html_fb4801323a83bf1caac4cd0d3ae6d31b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>West Oxfordshire</h1><div class="nugget-popup"><p>Flooding in the district (including the Witney event) exposed issues with flood warning provision and triggered recommendations to improve alerts and community response across West Oxfordshire. (p33)</p></div></div></body></div>`)[0];

                var html_6eb9afa95f2f58c9c63df518270fc289 = $(`<div id="html_6eb9afa95f2f58c9c63df518270fc289" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Witney</h1><div class="nugget-popup"><p>Surface water flooding of roads began on 23 December 2020 as highway drainage was overwhelmed; followed by river flooding on 24 December 2020 when upstream flows reached Witney. At least 54 residential and business properties were confirmed as flooding internally across the event; some properties (including care home and riverside accommodation) were evacuated. River levels peaked just after midnight on 25 December 2020. [MUL] (p2)</p></div><div class="nugget-popup"><p>Flooding associated with the River Windrush affected Witney and its infrastructure (river channel, ordinary watercourses and highway drainage). Actions recommended include riparian maintenance, investigation of channel modifications, checking/de&ndash;silting of Bridge Street bridge and prioritising checks of affected areas. [PAG] (p4)</p></div><div class="nugget-popup"><p>Areas of Witney (highways and locations near Bridge Street bridge) experienced flood&ndash;related issues requiring checks, de&ndash;silting and drainage maintenance to mitigate surface water flooding. (p5)</p></div><div class="nugget-popup"><p>Flooding occurred in Witney between 23 Dec 2020 and 24 Dec 2020, prompting a Section 19 investigation by West Oxfordshire District Council (WODC) in conjunction with Oxfordshire County Council (OCC). (p7)</p></div><div class="nugget-popup"><p>Multiple properties in the town reported internal flooding, prompting a formal Section 19 investigation. [PAG] (p10)</p></div><div class="nugget-popup"><p>Widespread internal and external flooding across the town. At least 54 residential and business properties were confirmed as flooding internally on 23&ndash;24 December 2020. Surface water flooding occurred on 23 December 2020 (overwhelming drainage) followed by river flooding on 24 December 2020 as upstream flows reached Witney; river levels peaked just after midnight on 25 December 2020. Multiple streets and areas were affected including Woodford Mill, Riverside Gardens, Bridge Street, West End (including Industrial Estate), Millers Mews, Newland (near Madley Brook) and Eastfield Road. [PAG] (p11)</p></div><div class="nugget-popup"><p>River Windrush experienced very high flows that led to elevated river levels in Witney: the Worsham gauge recorded a peak flow that contributed to the December 2020 flood peak recorded at Riverside Gardens. [IMG,MUL] (p12)</p></div><div class="nugget-popup"><p>Witney experienced river flooding during the event on 23&ndash;24 December 2020; the report documents high river levels on the Windrush that caused localised flood impacts around central Witney (including submerged gauge boards at Bridge Street and hydraulic effects at local structures that exacerbated high flows). [PAG] (p13)</p></div><div class="nugget-popup"><p>The town experienced river flooding during the event on 23&ndash;24 Dec 2020, evidenced by high water at Bridge Street Bridge (nearly level with the parapet) and impounded floodplain flows at Langel Common affecting nearby residents. [IMG,PAG] (p14)</p></div><div class="nugget-popup"><p>Multiple locations in the town were affected by flooding: sewer flooding occurred at Bridge Street Mills; businesses and properties were flooded; Riverside House/Gardens residents were evacuated and homes flooded; business insurance losses reported. [IMG,PAG] (p16)</p></div><div class="nugget-popup"><p>River levels rose rapidly on 23&ndash;24 December 2020 causing inundation of the river corridor and adjacent low&ndash;lying urban areas in central Witney. The EA modelled a 1&ndash;in&ndash;100 year flood extent that follows the river and floodplain through central Witney (affecting nearby districts such as Woodgreen and Newland). The EA issued a flood warning (issued late during the event) and deployed crews to investigate blockages and support residents. [IMG,PAG] (p18)</p></div><div class="nugget-popup"><p>Rapid rise in river levels during 23&ndash;24 Dec 2020 caused flooding in the town and led to a late flood warning; prompted reviews and changes to warning thresholds and further flood&ndash;risk modelling for the town. [PAG] (p19)</p></div><div class="nugget-popup"><p>The December 23&ndash;24, 2020 river flood in Witney exceeded the EA's modelled 1&ndash;in&ndash;100 year event; flows were similar to the modelled 1&ndash;in&ndash;100 year plus 20% peak, indicating an unusually large river flooding event affecting the town. [PAG] (p20)</p></div><div class="nugget-popup"><p>Witney experienced flooding during 23&ndash;24 December 2020 that exceeded the modelled 1 in 100 year flood. Floodplain connectivity problems near the Aquarius site and the raised footpath at Langel Common altered flow routes across the floodplain, contributing to larger&ndash;than&ndash;modelled flood levels in parts of the town. [PAG] (p21)</p></div><div class="nugget-popup"><p>Surface water flooding impacted Witney on 23 Dec 2020 &ndash; 24 Dec 2020. The investigation found there is minimal information on private and highway drainage systems across the town, so further investigations are required to fully understand existing drainage arrangements and any issues contributing to the flooding. [PAG] (p22)</p></div><div class="nugget-popup"><p>Flooding occurred through and downstream of Witney caused by the River Windrush, prompting recommendations for model updates, increased riparian/EA maintenance, investigation of river modifications, flood storage opportunities upstream, property flood resilience measures and community preparedness actions. [TAB] (p27)</p></div><div class="nugget-popup"><p>Witney experienced flooding during 23&ndash;24 December 2020 that reduced floodplain connectivity and prompted actions including investigating upstream flood storage and nature&ndash;based solutions, promoting property flood resilience, checking and maintaining ordinary watercourses (WODC), highway drainage checks (OCC), and investigation of Bridge Street bridge de&ndash;silting and sewer connectivity/capacity. [PAG] (p28)</p></div><div class="nugget-popup"><p>Witney experienced flooding on 23&ndash;24 December 2020 that affected ordinary watercourses, highway drainage, and sewer/drainage connectivity; affected areas are to be prioritised for checks and remedial works. (p29)</p></div><div class="nugget-popup"><p>Witney experienced flooding during the December 2020 event (23 Dec 2020 &ndash; 24 Dec 2020), which affected properties and highway infrastructure and prompted the Section 19 investigation and subsequent actions. [PAG] (p31)</p></div><div class="nugget-popup"><p>River Windrush flooding through and downstream of the town during the 23&ndash;24 Dec 2020 event, causing town&ndash;wide flood impacts that prompted the Section 19 investigation, recommendations for property&ndash;level protection, updates to modelling and improvements to flood warnings and community support. [PAG] (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>At least 54 residential and business properties [MUL] (p2)</p></div><div class="nugget-popup quant"><p>54 properties [PAG] (p11)</p></div><div class="nugget-popup quant"><p>30.348 m3/s (Worsham peak on 24/12/2020); 81.45 m AOD (Riverside Gardens peak on 25/12/2020); July 2007 comparator 29.26 m3/s [IMG,MUL] (p12)</p></div><div class="nugget-popup quant"><p>1 property with a £40,000 insurance bill; c£300,000 estimated total insurance bill for affected businesses; 13 residents evacuated from Riverside House/Gardens; 4 homes flooded; 9 residents evacuated from Mill House Care Home [IMG,PAG] (p16)</p></div><div class="nugget-popup quant"><p>greater than modelled 1 in 100 year; similar to modelled 1 in 100 year plus 20% event [PAG] (p21)</p></div></div></body></div>`)[0];
                popup_959cf9380b88238bcfbd26a9a4431221.setContent(html_6eb9afa95f2f58c9c63df518270fc289);

                var html_1c1138e28199bf4f196608100c85edf7 = $(`<div id="html_1c1138e28199bf4f196608100c85edf7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Crawley</h1><div class="nugget-popup"><p>The report identifies opportunities for flood storage and increased floodplain capacity upstream of Witney and Crawley to manage flows and reduce flooding risk. [TAB] (p27)</p></div><div class="nugget-popup"><p>Crawley was identified as an area upstream/adjacent to Witney for which opportunities for additional flood storage and nature&ndash;based solutions were recommended following the 23&ndash;24 December 2020 flood to help manage flows and reduce downstream impacts. (p28)</p></div><div class="nugget-popup"><p>Crawley (upstream of Witney) was identified in the report as an area where additional flood storage and increased flood plain capacity should be investigated, indicating it was affected by river flooding during the incident. (p33)</p></div></div></body></div>`)[0];
