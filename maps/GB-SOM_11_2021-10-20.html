                var html_d52cd731cc7970f29773bb5fd14aa553 = $(`<div id="html_d52cd731cc7970f29773bb5fd14aa553" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Holway House Park</h1><div class="nugget-popup"><p>Park home site was particularly impacted by flooding during the event on 2021&ndash;10&ndash;20; park homes and site areas were inundated as local watercourses (Slape Stream culverted beneath the development) and overland surface water flows inundated the site. (p13)</p></div><div class="nugget-popup"><p>Flooding began at about 01:00&ndash;01:30 with very rapid onset and peak depths reached within 20&ndash;25 minutes. Fire and Rescue began rescuing people from the park home development (Holway House Park) at about 02:00. (p16)</p></div><div class="nugget-popup"><p>One of the worst&ndash;affected areas with water depths up to 1.25 m; around 19 park homes flooded internally and nine were damaged beyond repair. Floodwater flowed down the lane next to Holway House into the park. (p21)</p></div><div class="nugget-popup"><p>Residents gave testimony that Holway Park was flooded during the investigated event. (p29)</p></div><div class="nugget-popup"><p>Floodwater flowed across Station Road into Holway House Park where it became trapped by the low bank around the park, causing ponding within the park and affecting adjacent houses. (p41)</p></div><div class="nugget-popup"><p>Caravan/park homes development where the river appears to have burst its banks; emergency services performed boat rescues (specialist boat rescue of 10 people reported) and multiple people were evacuated from park homes; floodwaters mixed with sewage from a septic tank at the site. [TAB] (p44)</p></div></div></body></div>`)[0];

                var html_c1ce66ddd30822980bcad884baae0839 = $(`<div id="html_c1ce66ddd30822980bcad884baae0839" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Rose Mills Industrial Estate</h1><div class="nugget-popup"><p>Three commercial properties were flooded; building damage indicated water depths of up to about 10 centimetres. (p21)</p></div><div class="nugget-popup"><p>Fluvial floodwater from the River Isle entered and affected the Rose Mill Industrial estate after the river bypassed Environment Agency defences upstream of Hort Bridge. [TAB] (p37)</p></div></div></body></div>`)[0];

                var html_b98f09b2abe4bceec074296962bf6179 = $(`<div id="html_b98f09b2abe4bceec074296962bf6179" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Tesco</h1><div class="nugget-popup"><p>The culvert that runs under the Tesco petrol station was overwhelmed by the volume of water from the Shudrick Stream; this contributed to surface water flooding emerging in Abbots Close and compounded flooding on Ditton Street. The culvert (600mm diameter) was noted as comparatively undersized for the catchment it serves. (p16)</p></div><div class="nugget-popup"><p>The culvert carrying the Shudrick Stream beneath the Tesco filling station was reported to have become partially blinded with debris during the night, adding to local flooding issues at the site. (p26)</p></div></div></body></div>`)[0];

                var html_55f72b135a04b2fdd9c01397ff9e0415 = $(`<div id="html_55f72b135a04b2fdd9c01397ff9e0415" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Shudrick Stream</h1><div class="nugget-popup"><p>The Shudrick Stream spilled water (high flows) and the volume entering the stream and culvert overwhelmed the 600mm culvert feeding under Tesco, causing water to escape the channel/culvert and contribute to rapid surface water flooding at Ditton Street and surrounding areas. (p16)</p></div><div class="nugget-popup"><p>The Shudrick Stream spilled and produced very high flows into the culvert at Shudrick Lane on 2021&ndash;10&ndash;20; the volume overwhelmed the culvert, fed the large drain under the Tesco petrol station, emerged in Abbots Close and compounded surface&ndash;water flooding on Ditton Street. [PAG,IMG] (p17)</p></div><div class="nugget-popup"><p>High flows moved through the culverted reach beneath Ditton Street and Wharf Lane, then through an open channel and into the storage feature upstream of Station Road, contributing to inundation of that storage area and to flooding of Ditton Street and nearby homes and shops. [PAG] (p18)</p></div><div class="nugget-popup"><p>The Shudrick Stream flows in a culvert under Ditton Street and Wharf Lane and in open channel through housing; its course and the town culvert are described in the context of surface water and culvert&ndash;related flooding that contributed to roadway and property inundation. [PAG] (p19)</p></div><div class="nugget-popup"><p>Received large volumes of runoff from fields uphill of the eastern end of town carrying soil and debris; this caused the stream to flood and contributed to local flooding. The stream flows through a culvert beneath the Tesco filling station, which was reported to have become partially blinded with debris during the night, exacerbating the flooding. (p26)</p></div><div class="nugget-popup"><p>Flooding occurred in the low&ndash;lying area around the Shudrick Stream as overland flows accumulated and moved downhill; these flows contributed to damage to roads and property and carried debris that blocked drains. [TAB] (p34)</p></div><div class="nugget-popup"><p>The Shudrick Stream came out of its banks on 2021&ndash;10&ndash;20 and added to the floodwater collecting at the low point by Ditton Street and Shudrick Lane. The stream overflow was possibly linked to the culvert under Ditton Street becoming blinded with debris or overwhelmed by the large quantity of water, increasing local overtopping and contributing debris to the flood. (p42)</p></div><div class="nugget-popup"><p>Shudrick Stream and the Shudrick Valley are identified as contributors to local flood flows on 20 October 2021; the stream/valley is proposed for Natural Flood Management investigation and will be added into the catchment fluvial model to better understand and mitigate its role in flooding. (p46)</p></div></div></body></div>`)[0];

                var html_a242c719e91d8b5cdc13777e3585ed24 = $(`<div id="html_a242c719e91d8b5cdc13777e3585ed24" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Isle</h1><div class="nugget-popup"><p>Flooding from the River Isle (and connected Dowlish Brook) produced an area of inundation in the catchment near Uphill / northeast of Ilminster, spanning the main road and adjacent buildings and contributing to flood extent shown on the report maps. [IMG] (p6)</p></div><div class="nugget-popup"><p>Experienced one of the highest water levels in 30 years of gauge history; flows were the highest recorded, causing the river to come out of its banks and flood areas to the west of Ilminster on 2021&ndash;10&ndash;20. [PAG,IMG,TAB] (p13)</p></div><div class="nugget-popup"><p>Experienced one of the highest water levels in 30 years of gauge record; flows were the highest recorded. The river overtopped its banks, causing flooding of areas to the west of Ilminster. (p14)</p></div><div class="nugget-popup"><p>The River Isle burst its banks due to high rainfall and saturated ground, causing severe flooding at the western edge of Ilminster and triggering evacuations. River levels rose rapidly (peaks recorded at nearby gauges during the night of 20&ndash;21 October 2021). (p15)</p></div><div class="nugget-popup"><p>The River Isle was reported to have burst its banks during the event, contributing to local flooding and prompting rescue activity. (p16)</p></div><div class="nugget-popup"><p>The River Isle overflowed into nearby park home developments, Rose Mill Industrial Estate and the Station Road area; defences upstream of Hort Bridge were outflanked at the upstream end (first time since the 1970s), increasing flows into adjacent areas. (p21)</p></div><div class="nugget-popup"><p>The river Isle recorded its highest level on the Donyatt gauge in its 30&ndash;year history on 2021&ndash;10&ndash;20. This high river level is used by the Environment Agency to predict and issue flood warnings for Ilminster. [TAB] (p34)</p></div><div class="nugget-popup"><p>A flood warning was issued at about 22:20 for the River Isle (from Chard Reservoir to Hambridge) as levels continued to rise, peaking around 23:30. The river apparently burst its banks and mixed with sewage from a septic tank in the area where park homes/caravan park flooding occurred. [TAB] (p44)</p></div><div class="nugget-popup"><p>The river reportedly burst its banks and mixed with sewage from a septic tank, leading to flooding of a residential park homes development; Fire and Rescue deployed boats and rescued people (8 people reported rescued), with evacuees transferred to hotel accommodation and prolonged loss of electricity at the residential parks delaying reoccupation and drying&ndash;out efforts. [PAG] (p45)</p></div><div class="nugget-popup"><p>The River Isle is implicated in the catchment flood flows affecting Ilminster; it is identified for inclusion in updated fluvial modelling and as a location where Natural Flood Management measures should be investigated to reduce future fluvial flooding. [PAG] (p46)</p></div></div></body></div>`)[0];
