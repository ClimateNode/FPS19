                var html_02a39929c7368334a6f33713940e3183 = $(`<div id="html_02a39929c7368334a6f33713940e3183" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Idle</h1><div class="nugget-popup"><p>The River Idle rose in response to sustained heavy rainfall, reaching a new record river level at the Ordsall gauge and contributing to riverbank overtopping and flooding of nearby areas. [PAG,MUL] (p3)</p></div><div class="nugget-popup"><p>The River Idle rose in response to sustained heavy rainfall, producing additional flood flows that contributed to inundation of adjacent land and internal flooding of properties (notably on Darrel Road and Victoria Road). The River Level gauge at Ordsall recorded a new record high. [IMG,PAG,MUL] (p4)</p></div><div class="nugget-popup"><p>Additional flood flows from the River Idle, combined with high water in the Carr Dyke, raised local water levels and contributed to internal flooding of properties (notably on Darrel Road and Victoria Road). [PAG] (p5)</p></div><div class="nugget-popup"><p>Sustained heavy rainfall caused river levels to rise and the River Idle to overtop its banks, leading to fluvial flooding of the adjacent Thrumpton residential area. Overtopping also caused a section of flood wall to fail and contributed to highway drainage being unable to outfall, allowing river water to inundate streets and properties. (p8)</p></div><div class="nugget-popup"><p>River levels rose due to sustained heavy rainfall and came out of their banks, filling adjacent lakes and contributing to internal flooding of nearby properties. (p10)</p></div><div class="nugget-popup"><p>Sustained heavy rainfall caused the River Idle to rise and overtop its banks; the overtopping filled adjacent lakes and contributed to internal flooding of a nearby business property. [IMG,PAG] (p11)</p></div><div class="nugget-popup"><p>Burst its banks following sustained heavy rainfall (Storm Babet), causing overbank flooding that inundated nearby roads (Wharf Road, Chancery Lane) and led to flooding reaching West Street. (p12)</p></div><div class="nugget-popup"><p>River levels prompted a Flood Alert (19/10/2023) and a Flood Warning for West Retford and Ordsall (21/10/2023), triggering patrols, blockage clearance, installation of flood gates at Ordsall, pumping operations and evacuations in adjacent communities. [MUL] (p16)</p></div><div class="nugget-popup"><p>Flooding from the River Idle during Storm Babet (20 October 2023) inundated parts of Retford and Ordsall, caused conveyance issues through the town centre and downstream, and triggered recovery actions including planned de&ndash;silting, conveyance and tree works and investigation of upstream storage to reduce future flooding. (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1.79 m record river level (Ordsall) [PAG,MUL] (p3)</p></div><div class="nugget-popup quant"><p>peak river level 1.79m [IMG,PAG,MUL] (p4)</p></div><div class="nugget-popup quant"><p>25 residential properties internally flooded on Darrel Road; 2 residential properties internally flooded on Victoria Road [PAG] (p5)</p></div><div class="nugget-popup quant"><p>66 properties internally flooded; 1 section of flood wall damaged (on Poulter View) (p8)</p></div><div class="nugget-popup quant"><p>1 business property (internal flooding on Hallcroft Road) (p10)</p></div><div class="nugget-popup quant"><p>1 business property [IMG,PAG] (p11)</p></div><div class="nugget-popup quant"><p>399,120 m3 pumped [MUL] (p16)</p></div></div></body></div>`)[0];

                var html_eb0e3d0abe5dfbc7ecb358f647a4e53a = $(`<div id="html_eb0e3d0abe5dfbc7ecb358f647a4e53a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Retford</h1><div class="nugget-popup"><p>Sustained heavy rainfall during Storm Babet caused surface water / urban flooding in Retford. Roads flooded and properties were affected, with internal flooding to homes and businesses and additional flooding to gardens and outbuildings. (p1)</p></div><div class="nugget-popup"><p>Multiple residential streets in the town experienced internal flooding of properties after intense rainfall; affected streets (with internally flooded property counts) include Blackstope Lane (12), Claters Close (2), Darrel Road (25), Grove Lane (10), Hallcroft Road (1), Leverton Road (5), Maun Close (10), Meden Way (26), Poulter View (5), Station Terrace (1), Sunningdale (3), Thrumpton Close (15), Victoria Road (2), West Street (1) and Whitehall Court (9). [PAG] (p2)</p></div><div class="nugget-popup"><p>Multiple streets in Retford experienced flooding during the event: Blackstope Lane, Claters Close, Darrel Road, Grove Lane, Hallcroft Road, Leverton Road, Maun Close, Meden Way, Poulter View, Station Terrace, Sunningdale, Thrumpton Close, Victoria Road, West Street and Whitehall Court. Flooding included internal flooding of properties and flooding of gardens/outbuildings in affected areas. [IMG,PAG] (p3)</p></div><div class="nugget-popup"><p>Multiple locations in Retford experienced flooding: watercourses and culverts were overwhelmed during heavy rainfall leading to internal and external flooding of properties and flooded lanes (including Darrel Road, Victoria Road, Blackstope Lane and Grove Lane). [IMG,PAG] (p5)</p></div><div class="nugget-popup"><p>The eastern edge of Retford (Blackstope Lane and Grove Lane) experienced rapid rises in local watercourses during Storm Babet that overwhelmed culverts and led to internal flooding of properties in these streets. (p6)</p></div><div class="nugget-popup"><p>Parts of central and eastern Retford experienced fluvial flooding associated with the River Idle rising; the Thrumpton area of Retford had internal flooding of residential properties as listed in the report. [IMG,MUL] (p7)</p></div><div class="nugget-popup"><p>Parts of Retford experienced fluvial flooding (River Idle overtopping and damaging a flood wall on Poulter View, causing internal flooding) and surface water flooding (highways conveying surface water into properties, e.g. Claters Close and Leverton Road). [PAG,IMG] (p9)</p></div><div class="nugget-popup"><p>Parts of Retford (north east and north) experienced surface water flooding that ran down highways into residential properties (Claters Close and Leverton Road) and fluvial flooding from the River Idle that overtopped banks and flooded adjacent areas including a business on Hallcroft Road. [IMG,PAG] (p10)</p></div><div class="nugget-popup"><p>The River Idle burst its banks after sustained heavy rainfall associated with Storm Babet and flooded onto Wharf Road and Chancery Lane; floodwaters reached and flowed onto West Street, causing internal flooding to at least one business property. [IMG] (p13)</p></div><div class="nugget-popup"><p>Received Flood Alert and Flood Warning for the River Idle; residents evacuated as conditions worsened; a rest centre was provided at Retford Leisure Centre; temporary accommodation and rehousing support were provided to affected residents and council tenants; community resilience stores and distribution of sandbags/aquasacs were used to support vulnerable premises and residents. [MUL] (p16)</p></div><div class="nugget-popup"><p>Flooding from the River Idle affected Retford (town centre and downstream areas), prompting planned recovery works including River Idle de&ndash;silting through the town centre and downstream, conveyance and tree works, Retford Beck culvert renewal/replacement for Grove Lane and Blackstope Lane, and a review of the town's pumping strategy. (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>123 residential properties; 4 businesses (p1)</p></div><div class="nugget-popup quant"><p>127 properties internally flooded [PAG] (p2)</p></div><div class="nugget-popup quant"><p>127 properties internally flooded [IMG,PAG] (p3)</p></div><div class="nugget-popup quant"><p>25 residential properties internally flooded on Darrel Road; 2 residential properties internally flooded on Victoria Road; 12 residential properties internally flooded on Blackstope Lane; 8 residential and 2 business properties internally flooded on Grove Lane [IMG,PAG] (p5)</p></div><div class="nugget-popup quant"><p>20 residential properties; 2 business properties internally flooded across Blackstope Lane and Grove Lane (p6)</p></div><div class="nugget-popup quant"><p>66 properties (sum of internally flooded properties reported in Thrumpton area) [IMG,MUL] (p7)</p></div><div class="nugget-popup quant"><p>two residential properties; five residential properties [PAG,IMG] (p9)</p></div><div class="nugget-popup quant"><p>2 residential properties on Claters Close; 5 residential properties on Leverton Road; 1 business property on Hallcroft Road [IMG,PAG] (p10)</p></div><div class="nugget-popup quant"><p>1 business property [IMG] (p13)</p></div></div></body></div>`)[0];
