h location where traffic entering the village from the west reduces speed from 50 to 20 mph. Post&ndash;event work included the adjacent landowner clearing the receiving ditch; removal of an obstructing willow tree was recommended to reduce flood risk. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>B4009 in Chinnor was inundated with floodwater covering the full carriageway (verge&ndash;to&ndash;verge), partially submerging road markings, signs and bollards, rendering the road impassable or hazardous to traffic and disrupting normal use of the highway. [IMG,PAG] (p10)</p></div><div class="nugget-popup"><p>Blocked ditch and a tree in a channel off the B4009 at the east end of Chinnor required clearance following flooding; drainage blockage identified as a cause/contributor and recommended for remediation. [TAB] (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>two locations [IMG,PAG] (p9)</p></div></div></body></div>`)[0];
