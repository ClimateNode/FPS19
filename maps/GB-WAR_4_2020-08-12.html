                var html_4bb43ebb1ff9cf47fc0405be077e9019 = $(`<div id="html_4bb43ebb1ff9cf47fc0405be077e9019" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Warwick</h1><div class="nugget-popup"><p>Flooding affected the town. (p1)</p></div><div class="nugget-popup"><p>Internal property flooding to commercial and residential properties within Warwick (internal flooding reported to properties). (p3)</p></div><div class="nugget-popup"><p>The Warwick area experienced flooding on 12 August 2020 which prompted a Section 19 investigation by the Lead Local Flood Authority. (p4)</p></div><div class="nugget-popup"><p>Internal flooding of properties within the town during the event on 12 August 2020; highway flooding reported in the town. Flooding affected commercial frontages and streets in the investigation area. [IMG] (p7)</p></div><div class="nugget-popup"><p>Intense rainfall caused surface water to overwhelm highway and surface water drainage so flows followed surface water routes across the urban area. Surface water exceeded kerb heights and entered commercial and residential properties with level thresholds (internal flooding). Flow paths transported silt onto footpaths and into highway and sewer systems across Warwick on 12th August 2020. [PAG] (p10)</p></div><div class="nugget-popup"><p>The flooding event in Warwick produced surface&ndash;water flow paths across public highways and urban areas (for example flow from Priory Park onto the highway and a surcharged surface water sewer in Priory Road that damaged a manhole cover). [PAG,IMG] (p11)</p></div><div class="nugget-popup"><p>Surface water sewer systems surcharged in locations (notably Priory Road), damaging a manhole cover and surrounding highway. Highway drainage was overwhelmed in places, causing street flooding. Intense, wind&ndash;driven thunderstorm rain caused water ingress into some properties through poorly sealed windows and doors. (p12)</p></div><div class="nugget-popup"><p>Surface&ndash;water and sewer&ndash;related flooding inundated parts of Warwick (including the town centre and St John's Brook catchment), causing internal flooding of residential and business premises and surface&ndash;water ingress where finished floor levels were at footway level; highways and gullies were affected, and sewer infrastructure (Smith Street / Priory Road areas) required further investigation. (p13)</p></div><div class="nugget-popup"><p>Planning applications in the town centre were identified as connecting to the surface water sewer system upstream of the location where flooding occurred; the LLFA requires reduced surface water discharge rates (minimum 50% reduction where greenfield rates cannot be achieved) to reduce pressure on the sewer system that contributed to the August 2020 surface water flooding. [TAB,PAG] (p14)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>9 reports of internal flooding; 5 commercial premises; 4 residential properties (p3)</p></div><div class="nugget-popup quant"><p>5 commercial premises; 4 residential properties [IMG] (p7)</p></div><div class="nugget-popup quant"><p>28 responses; 3 residential properties confirmed flooded; 1 residential property reported on site (p12)</p></div><div class="nugget-popup quant"><p>4 residential properties (p13)</p></div></div></body></div>`)[0];
