                var html_0ac26ac0bb3107820b4b97bd390c382c = $(`<div id="html_0ac26ac0bb3107820b4b97bd390c382c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Woodgate Valley Country Park</h1><div class="nugget-popup"><p>Runoff from the Country Park flowed through the western residential area en route to Bourn Brook and, in the central area, received overland flows that then joined the Bourne/Bourn Brook; park&ndash;adjacent runoff contributed to flooding of properties. (p72)</p></div><div class="nugget-popup"><p>During the heavy storm on 16th June 2016, overland flow, overwhelmed highway drainage and sewer infrastructure caused ponding and overtopping of kerbs that entered properties across Woodgate Valley. Floodwaters routed from adjacent Country Park and a silted unnamed watercourse passed through residential streets (see West, Central and East areas), ponded in low&ndash;lying streets (including Sommerfield Road, Rushy Piece, Upper Close, Gravel Bank) and entered homes; waters later receded via gullies as capacity returned. [IMG] (p73)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>38 properties [IMG] (p73)</p></div></div></body></div>`)[0];

 Third Avenue and Fourth Avenue. [PAG] (p70)</p></div><div class="nugget-popup"><p>Overland flows from residential areas and the Country Park routed towards and joined the Bourn/Bourne Brook, indicating increased flows in the watercourse associated with the storm event. (p72)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>33 flooded properties (total reported in the area on 16 June 2016) [IMG,PAG] (p38)</p></div><div class="nugget-popup quant"><p>33 properties [IMG,PAG] (p69)</p></div><div class="nugget-popup quant"><p>33 properties (across Pershore Road, Riverside Drive, St John's Road, Third Avenue and Fourth Avenue) [PAG] (p70)</p></div></div></body></div>`)[0];
