 Third Avenue and Fourth Avenue. [PAG] (p70)</p></div><div class="nugget-popup"><p>Overland flows from residential areas and the Country Park routed towards and joined the Bourn/Bourne Brook, indicating increased flows in the watercourse associated with the storm event. (p72)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>33 flooded properties (total reported in the area on 16 June 2016) [IMG,PAG] (p38)</p></div><div class="nugget-popup quant"><p>33 properties [IMG,PAG] (p69)</p></div><div class="nugget-popup quant"><p>33 properties (across Pershore Road, Riverside Drive, St John's Road, Third Avenue and Fourth Avenue) [PAG] (p70)</p></div></div></body></div>`)[0];
