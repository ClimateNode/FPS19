                var html_9229e279a768c1ba993b1322e4c200cf = $(`<div id="html_9229e279a768c1ba993b1322e4c200cf" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Langer Road, Felixstowe</h1><div class="nugget-popup"><p>Site of a flood event that prompted a Section 19 flood investigation by the Lead Local Flood Authority (Suffolk County Council). (p1)</p></div><div class="nugget-popup"><p>Internal flooding of domestic properties (main living areas, garages and gardens). Public highway partially flooded for approximately 50 m to an approximate depth of 200 mm. The Anglian Water surface water drainage system surcharged at this location. (p2)</p></div><div class="nugget-popup"><p>Area under Langer Road experienced high water table and surface/groundwater flooding; properties in the area flooded internally (main living areas, garages and gardens) to around 150 mm depth; local drainage systems (SCC Highway and Anglian Water) may have exceeded capacity or been blocked. [PAG] (p3)</p></div><div class="nugget-popup"><p>Surface water and groundwater flooding affected the Langer Rd area: properties are located within an area mapped as at risk of pluvial (surface water) flooding; high water table under the Langer Rd area contributed to groundwater risk; possible exceedance of the SCC highway surface water drainage and Anglian Water surface water system and blockages of drainage assets are cited as causes of flooding in the Langer Rd corridor (Undercliff Rd West to Beach Station Rd and side roads). [PAG] (p4)</p></div><div class="nugget-popup"><p>The Langer Road area has a high minor aquifer presenting groundwater flood risk; surface&ndash;water drainage capacity on Langer Rd was reviewed and maintenance/survey/remedial works were programmed to address surface&ndash;water flooding risks. Property&ndash;level resilience was recommended to mitigate groundwater flood risk. (p5)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 domestic properties; approx. 50 m of public highway; approx. 200 mm depth (p2)</p></div><div class="nugget-popup quant"><p>4 domestic properties; depth ~150 mm [PAG] (p3)</p></div></div></body></div>`)[0];
