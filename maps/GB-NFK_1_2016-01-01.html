                var html_b9f355675c47f5d15e2221ba3e27bb9e = $(`<div id="html_b9f355675c47f5d15e2221ba3e27bb9e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Overstrand Road, Cromer</h1><div class="nugget-popup"><p>Drainage system overload, surcharging and blockages combined with surface run&ndash;off from the road (including vehicle wash&ndash;off) led to flood water reaching and entering properties adjacent to the road. (p3)</p></div><div class="nugget-popup"><p>One property on Overstrand Road was internally flooded; residents were visited afterwards by agencies to offer advice and gather information. [TAB] (p8)</p></div><div class="nugget-popup"><p>Run&ndash;off from significant rainfall was directed towards the surface water drainage network which was already overloaded; the drainage system was also partially obstructed by debris/silt, reducing its efficiency and directing flood water towards affected properties. [TAB] (p11)</p></div><div class="nugget-popup"><p>Flooding occurred on Overstrand Road on 08/08/2017 and affected the road and nearby properties. (p12)</p></div><div class="nugget-popup"><p>The surface water drainage system was partially obstructed by debris or silt, causing the ditch/watercourse to overflow and flood into nearby properties. [IMG] (p13)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 properties (internal flooding across the listed locations) (p3)</p></div><div class="nugget-popup quant"><p>1 property [TAB] (p8)</p></div></div></body></div>`)[0];

                var html_8c7843dbb085afa1363f86bd23aa1722 = $(`<div id="html_8c7843dbb085afa1363f86bd23aa1722" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>North Norfolk</h1><div class="nugget-popup"><p>The properties affected by the reported incidents were concentrated within the North Norfolk catchment; flooding across these catchments was caused by obstructed or overloaded surface water drainage and increased surface run&ndash;off which resulted in internal and external property flooding. (p3)</p></div><div class="nugget-popup"><p>North Norfolk District Council was recommended to assess the use of permissive powers under the Land Drainage Act 1991 to maintain a watercourse in relation to Cromwell Road following the flooding. [IMG,PAG] (p5)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>17 properties affected; 5 internal; 12 external (p3)</p></div></div></body></div>`)[0];

                var html_356a687fdd252d25e6ccc0cde6dc8486 = $(`<div id="html_356a687fdd252d25e6ccc0cde6dc8486" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cromer</h1><div class="nugget-popup"><p>Urban surface water flooding and associated contamination in parts of the town; prompted emergency response and mitigation activities documented in images. (p1)</p></div><div class="nugget-popup"><p>Between 1 January 2016 and 31 December 2017 there were 17 reported flooding incidents for Cromer which led to internal flooding of 5 properties (plus 2 further unconfirmed internal reports). Flooding causes reported included overloaded or surcharging drainage systems, drainage/outfall blockages, surface water washed off public highways by vehicles, and surface run&ndash;off from roads; flood water entered properties via unprotected building features (low thresholds, unprotected air bricks and service conduits). (p3)</p></div><div class="nugget-popup"><p>Significant flooding affected the town, impacting people, property and infrastructure and triggering a Section 19 investigation. [IMG] (p5)</p></div><div class="nugget-popup"><p>Multiple residential properties and multiple commercial properties in Cromer were internally flooded. [PAG] (p6)</p></div><div class="nugget-popup"><p>Flood reports (both external and internal) were clustered mainly in the central and northern parts of Cromer during the event, particularly along the central flow line. Reported incidents were concentrated near key infrastructure (hospital and schools) and in more densely populated urban areas. [IMG,PAG] (p7)</p></div><div class="nugget-popup"><p>Internal flooding of properties within Cromer (Cromwell Road, Church Street, Overstrand Road) during the reported incidents. [TAB,MUL] (p8)</p></div><div class="nugget-popup"><p>Parts of Cromer experienced surface water/urban flooding: properties on Church Street and Overstrand Road were flooded on 08/08/2017 due to highway run&ndash;off, obstructed/overloaded surface water drains and low thresholds allowing entry; a property on Cromwell Road was flooded on 23/06/2016 when heavy rainfall caused the local ditch/watercourse to surcharge. [TAB,MUL] (p11)</p></div><div class="nugget-popup"><p>Parts of Cromer were affected by flooding during events on 23/06/2016 and 08/08/2017, including impacts on streets listed (Church Street, Overstrand Road and Cromwell Road). [MUL] (p12)</p></div><div class="nugget-popup"><p>Flood reports aggregate around the town centre and more built&ndash;up areas of Cromer; watercourses and low&ndash;lying zones near the town are shown in 1&ndash;in&ndash;100 flood risk areas. Main roads and bridges through the town intersect flood&ndash;prone areas, indicating local infrastructure vulnerability. [IMG,PAG] (p14)</p></div><div class="nugget-popup"><p>An internal flood affected a property in Cromer (on Brownshill). [TAB] (p15)</p></div><div class="nugget-popup"><p>The Brownshill area of Cromer experienced flooding on 23/06/2016 when significant rainfall overwhelmed the combined drainage network and caused foul&ndash;system surcharge, resulting in internal property flooding (water entering through toilets and sinks). [TAB] (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>17 reports; 5 internal properties; 2 unconfirmed internal instances (p3)</p></div><div class="nugget-popup quant"><p>3 properties [TAB,MUL] (p8)</p></div><div class="nugget-popup quant"><p>1 property [TAB] (p15)</p></div></div></body></div>`)[0];
