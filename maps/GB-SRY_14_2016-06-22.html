                var html_173a99a01f6c82215eda2eb88380dbfe = $(`<div id="html_173a99a01f6c82215eda2eb88380dbfe" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hengest Avenue, Hinchley Wood</h1><div class="nugget-popup"><p>Watercourses in the Hengest Avenue area reached capacity during the storm, resulting in flooding of roads and properties and internal flooding of houses. (p4)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties on Hengest Avenue. (p5)</p></div><div class="nugget-popup"><p>Rear gardens of properties on Hengest Road (sic) were flooded when a blocked trash grille adjacent to a footpath caused water to back up, run onto the footpath and under the fence into gardens. (p10)</p></div><div class="nugget-popup"><p>High rainfall on 22&ndash;23 June 2016 caused the local drainage network to reach capacity, resulting in external and internal flooding of properties and road flooding on Hengest Avenue. Blocked ditch/trash screen and a blocked twin pipe system were identified contributors. Post&ndash;event works included clearing the trash screen, digging out a ditch section, and maintenance of ordinary watercourse and culverts to improve capacity. (p12)</p></div><div class="nugget-popup"><p>The silted southern boundary ditch overflowed, causing water to flow down Hengest Avenue and resulting in flooding to the front of properties on Hengest Avenue. Blocked watercourse features nearby also caused backing up of water that affected nearby gardens (rear of Hengest Road properties). [PAG,IMG] (p18)</p></div><div class="nugget-popup"><p>High localised rainfall combined with restricted ditch capacity (silted southern boundary ditch) caused water to spill out of the banks and flow down Hengest Avenue, resulting in flooding to the front of properties. Ditch clearance works were later carried out west of Hengest Avenue to restore capacity. [PAG,IMG] (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>10 internally flooded houses (p4)</p></div><div class="nugget-popup quant"><p>10 houses (p5)</p></div><div class="nugget-popup quant"><p>ditch width reduced to approximately one third of the upstream width [PAG,IMG] (p19)</p></div></div></body></div>`)[0];

                var html_5d9f0f584394ff190d03e1bebec5b63e = $(`<div id="html_5d9f0f584394ff190d03e1bebec5b63e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Elmbridge</h1><div class="nugget-popup"><p>A storm event on 22&ndash;23 June caused localised flooding throughout the borough. (p4)</p></div><div class="nugget-popup"><p>Localised surface water flooding occurred across the borough during intense rainfall on 22&ndash;23 June 2016. The event produced only a small response in the river telemetry network and no fluvial flood alerts were issued. [PAG] (p7)</p></div><div class="nugget-popup"><p>Elmbridge Borough Council was contacted by residents during recovery. Modelled and mapped evidence and the report note concentrations of external property flooding roads and historic flood outlines within the Elmbridge area; the borough also has a recorded historic ordinary watercourse capacity exceedance in Autumn 1968. The June 2016 event resulted in surface water/ordinary watercourse flooding affecting parts of the borough (including Hinchley Wood). [IMG,MUL] (p18)</p></div></div></body></div>`)[0];

                var html_1dbec66f88d4d9f829f3e5ddb9b00dc3 = $(`<div id="html_1dbec66f88d4d9f829f3e5ddb9b00dc3" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Surrey</h1><div class="nugget-popup"><p>Localized surface water and ordinary watercourse flooding on 22&ndash;23 June 2016. Internal property flooding and carriageway flooding were reported. Flooding occurred down Hengest Avenue after the southern boundary ditch was silted and reduced to about one third of upstream width, causing water to spill from banks and flood property fronts. A blocked trash grille at a watercourse/culvert junction backed water up and caused flooding to rear gardens of Hengest Road properties. A partial blockage in one pipe of a twin&ndash;pipe culvert at the northern section reduced culvert capacity and caused gardens along Claygate Lane to flood. Run&ndash;off from Surbiton Golf Course ditches could not be accepted by the watercourse during the high rainfall event. [IMG] (p19)</p></div></div></body></div>`)[0];

                var html_95426ad8477ab20f40e0510009ec181a = $(`<div id="html_95426ad8477ab20f40e0510009ec181a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hinchley Wood</h1><div class="nugget-popup"><p>The storm centred on a catchment around Hinchley Wood; localised flooding in the Hengest Avenue and Clay Lane area resulted from watercourses reaching capacity, causing flooding of roads and property. (p4)</p></div><div class="nugget-popup"><p>Surface water flooding in Hinchley Wood led to internal flooding of residential properties on Hengest Avenue. [IMG] (p5)</p></div><div class="nugget-popup"><p>Hinchley Wood was the focus of the intense rainfall and experienced localised surface water flooding; surface water flow routes are described east of The Rythe with runoff directed north towards the A309. The area sustained the majority of the storm accumulation during the event. [PAG,MUL] (p7)</p></div><div class="nugget-popup"><p>Localised surface water and ordinary watercourse flooding occurred on 22 June 2016 &ndash; 23 June 2016; watercourse maintenance was carried out following the incident. A previous historic event in Autumn 1968 is recorded for the area where the ordinary watercourse channel capacity was exceeded. [MUL] (p9)</p></div><div class="nugget-popup"><p>High localised rainfall combined with two areas of restricted ditch capacity caused flooding across the Hingchley Wood estate. A silted southern boundary ditch reduced conveyance to about one third of upstream width, causing water to spill out of banks and flow down Hengest Avenue, flooding the front of properties. A blocked trash grille caused backing up and flooding to the rear gardens of Hengest Road properties. [PAG] (p10)</p></div><div class="nugget-popup"><p>Combination of very high localised rainfall and two areas of restricted ditch capacity caused flooding of the Hinchley Wood estate. The southern boundary ditch was heavily silted (reduced to ~one third of upstream width) causing water to spill out of banks and flow down Hengest Avenue, flooding the fronts of properties. A blocked trash grille caused water to back up and run onto a footpath and under a fence into rear gardens. A blockage in one pipe of a twin&ndash;pipe culvert at the northern section reduced culvert capacity and caused garden flooding along Claygate Lane. Runoff from Surbiton Golf Course ditches also could not be accepted by the watercourse during the high rainfall event and contributed to flooding. [PAG] (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>10 internally flooded houses (p4)</p></div><div class="nugget-popup quant"><p>10 houses [IMG] (p5)</p></div></div></body></div>`)[0];
