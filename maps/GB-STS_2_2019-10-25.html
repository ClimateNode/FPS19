                var html_6ce7f4a0480ea09afb7149d3956be5f2 = $(`<div id="html_6ce7f4a0480ea09afb7149d3956be5f2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Sandyford Brook</h1><div class="nugget-popup"><p>Sandyford Brook (a Main River) contributed to flooding of Sandon Road / Peel Terrace / Freeman Street in Stafford. [TAB,PAG] (p21)</p></div><div class="nugget-popup"><p>Designated as Main River and listed in the post&ndash;event investigations; identified as the Environment Agency's responsibility and implicated in local flooding risk following the October 2019 event. (p22)</p></div><div class="nugget-popup"><p>Water levels in the Sandyford Brook rose significantly during 25&ndash;26 October 2019 and the brook did not convey flow effectively (insufficient gradient / backing up). This back&ndash;up, combined with compromised highway drainage and sewerage, led to inundation of properties and multiple internal flooding incidents. [IMG] (p24)</p></div><div class="nugget-popup"><p>The brook failed to convey flows effectively (insufficient fall/gradient), causing water to back up and contribute to inundation of properties in the adjacent Sandon Road area. [TAB,PAG,MUL] (p25)</p></div><div class="nugget-popup"><p>Observed high flow during the October 2019 storm: an observed peak total flow of about 2.11 m3/s (ReFH2 hydrograph). The event&#8217;s magnitude places its return period between a 1 in 5 and 1 in 10 year event (approximately 10&ndash;20% annual probability), indicating a notable river flow event on the Sandyford Brook during the storm. [PAG] (p32)</p></div><div class="nugget-popup"><p>Observed an elevated flow event during the October 2019 storm: the measured peak flow at the Sandyford Brook location reached ~2.11 m3/s, exceeding the 1 in 5 year design flow (2.08 m3/s) and below the 1 in 10 year design flow (~2.44 m3/s), indicating a hydrological event with an estimated return period between 1 in 5 and 1 in 10 years. [PAG,IMG] (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>37 properties [TAB,PAG] (p21)</p></div><div class="nugget-popup quant"><p>observed peak flow 2.113 m3/s; 1 in 5 year design flow 2.08 m3/s; 1 in 10 year design flow ~2.44 m3/s; estimated event probability 10%&ndash;20% in that year [PAG] (p32)</p></div><div class="nugget-popup quant"><p>peak flow 2.11 m3/s; 1 in 5 year design flow 2.08 m3/s; 1 in 10 year design flow ~2.44 m3/s [PAG,IMG] (p33)</p></div></div></body></div>`)[0];
