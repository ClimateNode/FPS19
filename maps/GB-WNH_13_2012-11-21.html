                var html_8d5d2ab906f2d97a339dc5d57a7b80a4 = $(`<div id="html_8d5d2ab906f2d97a339dc5d57a7b80a4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Harts Lane, East Farndon</h1><div class="nugget-popup"><p>Excess surface water from intense, short&ndash;duration rainfall flowed over ground following natural contours and entered properties on Harts Lane, causing internal flooding. [PAG] (p5)</p></div><div class="nugget-popup"><p>Excess surface water from intense, short&ndash;duration rainfall on a saturated catchment flowed over ground following natural contours and entered properties around Harts Lane, causing internal flooding. (p6)</p></div><div class="nugget-popup"><p>Overtopping of drainage ditches and an ordinary watercourse caused water to flow across open land into the Harts Lane property courtyard. Two properties experienced internal flooding to ground&ndash;floor living areas; other properties had external areas flooded. The Fire Service attended and pumped water from properties. (p8)</p></div><div class="nugget-popup"><p>Surface water runoff from the highway and reduced ditch capacity caused runoff to enter private properties. Obstructions (fencing) over an ordinary watercourse and accumulated debris/silt restricted flow, contributing to overland flow from the carriageway onto properties. (p16)</p></div><div class="nugget-popup"><p>Surface water from the highway and adjacent fields flowed along the road edge and verges after a ditch overtopped; water accumulated on the road/verge and flowed towards properties. [IMG,PAG] (p46)</p></div><div class="nugget-popup"><p>A roadside ditch at Harts Lane overtopped and caused surface water to flow across a gated field and towards nearby residential properties. Land drainage pipework was discharging into the ditch, contributing flow into the ditch system. A watercourse south of the properties was observed close to overtopping, increasing the risk of inundation to the adjacent houses. [IMG] (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 properties [PAG] (p5)</p></div><div class="nugget-popup quant"><p>2 properties (p6)</p></div><div class="nugget-popup quant"><p>2 properties (p8)</p></div></div></body></div>`)[0];

                var html_c604d44d20465f20fb48e83efb1c57b8 = $(`<div id="html_c604d44d20465f20fb48e83efb1c57b8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Marston Trussell Road, East Farndon</h1><div class="nugget-popup"><p>Drainage ditches on Marston Trussell Road overtopped during the rainfall event, producing overland flow across open land that reached several properties and contributed to flooding. (p8)</p></div><div class="nugget-popup"><p>Ditches on Marston Trussell Road became full and overtopped at two known locations, causing surface water to flow south and west towards nearby properties. Runoff from fields and a considerable flow from the road (commencing at a high point in East Farndon) joined other flows and routed water toward the east flank of properties, where it collected and deepened, leading to properties being deluged. A separate flow ran along the main access road to the south flank of the properties and narrowly avoided entering a garage before joining the ordinary watercourse. [PAG] (p10)</p></div><div class="nugget-popup"><p>The land and carriageway drainage on Marston Trussell Road had points without capacity for heavy storm flows; variable repair and maintenance and unusual sections forcing water to one side of the road caused overloads in the drainage system, contributing to flooding in the event. (p14)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>two known locations; one garage narrowly avoided [PAG] (p10)</p></div></div></body></div>`)[0];

                var html_7ab8581e0fb3436f4e65fc9bd582140d = $(`<div id="html_7ab8581e0fb3436f4e65fc9bd582140d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>East Farndon</h1><div class="nugget-popup"><p>Flooding at Harts Lane, East Farndon was the subject of a formal Flood Investigation Report prepared for Northamptonshire County Council. [PAG] (p1)</p></div><div class="nugget-popup"><p>Intense rainfall on a saturated catchment produced excess surface water that flowed into properties in and around Harts Lane in East Farndon, producing internal flooding of properties. [PAG] (p5)</p></div><div class="nugget-popup"><p>Intense rainfall on a saturated catchment produced excess surface water that flowed over land into properties in and around Harts Lane in East Farndon, resulting in internal flooding. The same properties had experienced internal flooding on more than one occasion in the preceding five years. [PAG] (p6)</p></div><div class="nugget-popup"><p>Significant rainfall caused drainage ditches on Marston Trussell Road and an ordinary watercourse in the East Farndon catchment to overtop, contributing to overland flows that led to flooding of property external areas and internal flooding of two properties at Harts Lane. (p8)</p></div><div class="nugget-popup"><p>Significant rainfall on 21 November 2012 produced surface water overland flows: ditches overtopped, an ordinary watercourse overtopped approximately 200 metres south of the area, and flows routed from fields and the road collected at the east flank of properties, becoming deep and deluging properties. A garage was narrowly avoided; an adjacent landowner excavated a channel to reduce flows. (p10)</p></div><div class="nugget-popup"><p>Properties in East Farndon were flooded when intense rainfall on a saturated catchment overwhelmed existing drainage systems and watercourses, causing water to flow into areas and drainage systems that could not manage the volume and resulting in inundation of properties. (p14)</p></div><div class="nugget-popup"><p>Overspill of land and highway drainage, and restricted/culverted ditch capacity, caused flooding risk and inundation affecting areas of the village including highways and property; historic altered piped sections and blocked watercourses contributed to the flooding risk. A recently constructed pond and routes of land drainage were identified as features to investigate as possible contributors to altered flow paths. (p15)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 properties [PAG] (p5)</p></div><div class="nugget-popup quant"><p>2 properties [PAG] (p6)</p></div><div class="nugget-popup quant"><p>2 properties (p8)</p></div><div class="nugget-popup quant"><p>one property; two locations (p10)</p></div></div></body></div>`)[0];
