                var html_36dea476a37d111fcbdbae83a3f05049 = $(`<div id="html_36dea476a37d111fcbdbae83a3f05049" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Nottinghamshire</h1><div class="nugget-popup"><p>Provided short&ndash;term recovery aid for internal (property) flooding via a Community Flood Recovery Grant; visited flood&ndash;affected residents and businesses to establish sources/mechanisms and severity of flooding; delivered sandbags to affected areas; closed 77 roads across the county to promote road safety and avoid additional flood damage; provided 24&ndash;hour emergency planning support; led the Section 19 flood investigation and collated/published verified flood impact data on Resilience Direct; led procurement and delivery of DEFRA Property Flood Resilience Repair Grant Scheme. (p6)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>77 roads (p6)</p></div></div></body></div>`)[0];

                var html_277289131cc05ed259dd39e83d35dda6 = $(`<div id="html_277289131cc05ed259dd39e83d35dda6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kirklington</h1><div class="nugget-popup"><p>Sustained heavy rainfall during Storm Babet caused surface water flooding in Kirklington; saturated ground led to rapid flooding of roads and properties. (p1)</p></div><div class="nugget-popup"><p>Internal property flooding occurred across areas of Kirklington, affecting properties on multiple streets (listed below). [PAG] (p2)</p></div><div class="nugget-popup"><p>The village centre and routes through Kirklington were affected by surface water flooding during the storm; Main Street (A617) experienced flows overtopping the highway and internal property flooding, and the Environment Agency mapping shows the highest surface&ndash;water flood risk following the river corridor through the centre of Kirklington. [IMG] (p3)</p></div><div class="nugget-popup"><p>The village experienced surface&ndash;water flows along the A617/Main Street and overtopping of local watercourses (Northern Drain, Southern Drain, Edingley Beck, River Greet) which led to internal property flooding at multiple locations within Kirklington. [PAG] (p4)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 properties on Main Street; 1 property on Church Lane; 3 properties on Southwell Road; 2 properties in The Crops [PAG] (p2)</p></div><div class="nugget-popup quant"><p>1 property (Northern Drain); 2 properties (Southern Drain); 2 properties (Edingley Beck); 1 property (River Greet); 6 properties total reported from watercourse overtopping [PAG] (p4)</p></div></div></body></div>`)[0];
