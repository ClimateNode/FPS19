                var html_d89ff9791fea7a72158bba26ed23bbbd = $(`<div id="html_d89ff9791fea7a72158bba26ed23bbbd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Oxfordshire</h1><div class="nugget-popup"><p>As Lead Local Flood Authority/highway authority, OCC was involved in response; its highway drainage assets in the area were overwhelmed and require increased maintenance/cleansing per the Highway Maintenance Programme. [TAB,MUL] (p2)</p></div></div></body></div>`)[0];

                var html_27cfeb5e5ef74c65d76cbe7f753d7118 = $(`<div id="html_27cfeb5e5ef74c65d76cbe7f753d7118" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>South Oxfordshire</h1><div class="nugget-popup"><p>Sections of ordinary watercourse and culverts were identified as requiring de&ndash;silting; SODC (as the land drainage authority) may use powers to ensure riparian owners carry out maintenance to reduce surface water runoff that contributed to flooding. [TAB,MUL] (p2)</p></div></div></body></div>`)[0];

                var html_c70bcfa53cfee02ad5c3100289ccea04 = $(`<div id="html_c70bcfa53cfee02ad5c3100289ccea04" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Nuneham Courtenay</h1><div class="nugget-popup"><p>The settlement experienced flooding (inundation) during the reported events. [PAG,MUL] (p1)</p></div><div class="nugget-popup"><p>Exceptionally heavy rainfall (04&ndash;05 Jan 2024 and 18 Feb 2024) caused overland flow from fields to the west to overwhelm the village surface water drainage system, causing surcharging at several locations. Surface water also overloaded foul sewers with reports of foul (sewer) flooding. The event was one of the worst in recent times (worst since 2006). [TAB,MUL] (p2)</p></div><div class="nugget-popup"><p>Surface water flows affected parts of the village. Areas to the north&ndash;west and east of Nuneham Courtenay lie within a surface&ndash;water flow path which, during the 04/01/2024&ndash;05/01/2024 incident, allowed flow through the village. [IMG] (p5)</p></div><div class="nugget-popup"><p>Internal flooding of ground&ndash;floor areas of properties from surcharging drainage and overland flows from fields to the west; surface water entering foul drainage and overwhelming pump station capacity; gardens flooded by surface water. [PAG,MUL] (p9)</p></div><div class="nugget-popup"><p>Overland flows from fields to the west flowed onto the road leading to Nuneham Estate and into the village; a gully on that road discharged to the Victorian Culvert contributing to flood flow into the settlement. The village experienced flooding on 04 Jan 2024 &ndash; 05 Jan 2024 and again on 18 Feb 2024. On 18 Feb 2024, Oxfordshire Fire and Rescue conducted focused pumping at the north end of the village which helped to alleviate the flooding. [PAG,MUL] (p10)</p></div><div class="nugget-popup"><p>The local watercourse and drainage system conveyed high runoff into the village; the pond acted as the only natural storage and was brought into use when inflows exceeded the discharge capacity of the 300 mm outfall pipe. Downstream the culvert system bifurcates and conveys flows via a 600 mm stone culvert through the rear gardens of properties (Nos.29&ndash;40) and to the rear of No.29, with sections of the culvert running beneath or immediately adjacent to cottages. [PAG] (p11)</p></div><div class="nugget-popup"><p>The village was the subject of the Section 19 investigation for the flood event of 04&ndash;05 Jan 2024. Flooding involved the local highway drainage and the Victorian culvert network, prompting a hydraulic assessment and CCTV survey to check culvert condition and potential flow restrictions. [PAG] (p12)</p></div><div class="nugget-popup"><p>Overland flow from fields to the west overwhelmed the village surface water systems, causing surcharging at multiple locations and flooding of properties; properties with floor levels below ground level were particularly affected. [PAG,MUL] (p14)</p></div><div class="nugget-popup"><p>Observed flow paths during the event routed water from higher ground toward the main watercourses and across the village main street, indicating surface&ndash;water inundation of streets and low&ndash;lying areas where flows converged toward the watercourses. [IMG,PAG] (p25)</p></div><div class="nugget-popup"><p>CCTV survey of the local drainage network recorded multiple sections of pipe and adjacent ditches as 'under water' or 'ditch full', and survey progress was abandoned at several manholes due to submerged or blocked conditions. These observations indicate local inundation of drains/ditches within the village and blockages impairing conveyance. [IMG] (p26)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>10 properties; 2 properties [PAG,MUL] (p9)</p></div><div class="nugget-popup quant"><p>42 hectares (catchment area); 225 mm culvert; 300 mm outfall pipe; 600 mm stone culvert; 12 properties (Nos.29&ndash;40) [PAG] (p11)</p></div><div class="nugget-popup quant"><p>8 survey points (S1, S1A, S1B, S2, S3, S4, S5, S6) noted on the map where flow conditions or access problems were recorded [IMG] (p26)</p></div></div></body></div>`)[0];
