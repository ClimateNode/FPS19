                var html_4ef12d81cdfc72ec1046cfb7f3166b0e = $(`<div id="html_4ef12d81cdfc72ec1046cfb7f3166b0e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ashcroft Road, Ipswich</h1><div class="nugget-popup"><p>Identified in the Section 19 investigation as being within/adjacent to mapped flood risk zones. Suffolk County Council (LLFA) carried out an investigation into a flood event affecting Ashcroft Road; the map supplied with the report shows flood risk shading intersecting local streets and residential areas in the same urban area. (p1)</p></div><div class="nugget-popup"><p>Intense localised rainfall overwhelmed drainage on Ashcroft Road causing surface water / urban flooding that led to internal flooding of properties on the southern side of the road. [MUL] (p3)</p></div><div class="nugget-popup"><p>Surface water (pluvial) and sewer&ndash;related flooding occurred on Ashcroft Road. Floodwaters overwhelmed drains and manholes lifted in the highway, causing flooding of the carriageway and surrounding properties on the southern side of the road. Multiple properties (referred to as Property A, Property B and Property C) experienced internal flooding; the road itself flooded to depths reported around 35cm in September 2023 and other events caused smaller depths and sewage&ndash;contaminated runoff. [PAG,MUL] (p4)</p></div><div class="nugget-popup"><p>Surface water flowed down and overwhelmed highway gullies and the combined (surface water and foul) sewer network. Manhole covers lifted and floodwater from the sewers combined with surface water to flood nearby driveways, gardens and properties. Properties on the south&ndash;eastern side of Ashcroft Road were impacted more severely due to falling ground levels toward the properties. Significant damage occurred to properties, including internal flooding; the highway was blocked and loosened manhole covers became displaced, creating hazards. Further property damage was caused by vehicles driving through the floodwaters creating bow waves. (p5)</p></div><div class="nugget-popup"><p>Surface&ndash;water flow route identified across the carriageway (pluvial flooding). The map shows a high&ndash;risk surface&ndash;water flow route on Ashcroft Road that matches residents' reports; flow could move along the road and into rear gardens where a separate flow path is indicated. (p6)</p></div><div class="nugget-popup"><p>Intense, localised rainfall exceeded the capacity of highway drainage on Ashcroft Road, producing large volumes of surface water that accumulated in front gardens/driveways and caused internal property flooding. Property A, located at the lowest topographic point on Ashcroft Road, received excess runoff when gullies could not accommodate flows. Combined sewers nearby were under pressure, with reports of access chamber covers lifting and sewage mixing with surface water; household drains backed up, causing additional internal flooding. Properties on Ashcroft Road lacked sufficient property&ndash;level flood resilience. (p7)</p></div><div class="nugget-popup"><p>Intense, localised rainfall overwhelmed highway drainage and gullies on Ashcroft Road causing large volumes of surface water to accumulate on the road, front gardens and driveways and resulting in internal flooding of properties. Property A is at the lowest topographic point on Ashcroft Road and was inundated (yellow line on wall marks maximum inundation). Flood water on Ashcroft Road flowed into the back garden of property B. Vehicles on the street were partially submerged. Combined sewers in the area added pressure to the drainage system, contributing to manhole/access chamber lifting, sewage mixing with surface water and household drains backing up, exacerbating internal property flooding. Properties on Ashcroft Road lack adequate property&ndash;level flood resilience. [IMG,PAG] (p8)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 properties (Property A, Property B, Property C) [MUL] (p3)</p></div><div class="nugget-popup quant"><p>11 flooding events (Property B since 2002); road flooded to around 35cm (September 2023); up to 30cm of water entered garage/outbuildings (Property B, September 2023); internal flooding depths up to 30cm (Property C, May and September 2023); driveway flooded to 10&ndash;15cm (Property A, June 2016 and June 2017) [PAG,MUL] (p4)</p></div></div></body></div>`)[0];

                var html_346fe1690062da3cdb1c90ca247b2ea5 = $(`<div id="html_346fe1690062da3cdb1c90ca247b2ea5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Larchcroft Road, Ipswich</h1><div class="nugget-popup"><p>During and shortly after an intense downpour significant volumes of surface water flowed down Larchcroft Road and overwhelmed highway gullies and the combined sewer network. Manhole covers lifted due to system pressure, and floodwater (including sewage) combined with surface water to flood nearby driveways, gardens and properties. The highway was blocked for a significant period and displaced manhole covers created a secondary hazard for pedestrians and drivers. (p5)</p></div><div class="nugget-popup"><p>Surface&ndash;water flow route identified across the carriageway (pluvial flooding). The map shows a high&ndash;risk surface&ndash;water flow route on Larchcroft Road that correlates with residents' reports; flows were indicated on the highway and separately in rear gardens. (p6)</p></div><div class="nugget-popup"><p>Intense, localised rainfall overwhelmed the highway drainage/gullies on Larchcroft Road, causing large volumes of surface water to accumulate in front gardens and driveways and resulting in internal flooding of properties. Combined sewers in the area were under pressure; anecdotal evidence reports access chamber covers lifting and sewage mixing with surface water on the road and household drains backing up, causing further internal property flooding. (p7)</p></div><div class="nugget-popup"><p>Manholes/access chamber covers in Larchcroft Road were lifted during the flood event due to pressure in the combined sewer network. Sewage mixed with surface water runoff in the road and the elevated sewer pressure led to household drains backing up, contributing to internal flooding of properties in the vicinity. The highway drainage/gullies were overwhelmed by the intense rainfall. [IMG,PAG] (p8)</p></div></div></body></div>`)[0];
