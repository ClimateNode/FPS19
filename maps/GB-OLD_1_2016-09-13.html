gget-popup"><p>Internal property flooding from surface water. [TAB,PAG] (p15)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>79 incidents of internal property flooding; 34 incidents of flood water entering gardens and/or outbuildings (p4)</p></div><div class="nugget-popup quant"><p>12 borough wards; 2 wards (Failsworth East and Hollinwood) reported the most incidents [IMG,PAG] (p13)</p></div><div class="nugget-popup quant"><p>1 property flooded internally from surface water. [TAB,PAG] (p15)</p></div></div></body></div>`)[0];
