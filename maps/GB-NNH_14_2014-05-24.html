                var html_9de44918f41e5e9bdd61762204ab6f00 = $(`<div id="html_9de44918f41e5e9bdd61762204ab6f00" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lyveden Brook</h1><div class="nugget-popup"><p>The tributary of Lyveden Brook immediately east of Lytham Park was implicated in surface water/runoff drainage problems; lack of clear ownership/maintenance of sections of this watercourse was identified as contributing to surface water collecting at low points and requiring confirmation of riparian responsibilities and maintenance to reduce flooding risk. (p18)</p></div><div class="nugget-popup"><p>Tributary (start of a culverted section) was implicated in the flood incident; the culvert entrance on the tributary was the focus of drainage works carried out during the investigation. [IMG] (p47)</p></div></div></body></div>`)[0];

                var html_2d93b7125c10385e97e8bf5eded992e9 = $(`<div id="html_2d93b7125c10385e97e8bf5eded992e9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Benefield Road, Oundle</h1><div class="nugget-popup"><p>Intense short&ndash;duration rainfall and inadequate drainage caused excess surface water to flow over ground and follow contours to low points around private property on Benefield Road, resulting in internal flooding of at least one property; local kerb/footway levels and surface features exacerbated the flow. [PAG,MUL] (p6)</p></div><div class="nugget-popup"><p>Intense, short&ndash;duration rainfall caused excess surface water to flow over ground following natural contours to low points around private property. The existing drainage could not cope and flow was exacerbated by the layout and levels of kerbs, footways and other localised surface features, resulting in internal flooding of property. [PAG] (p7)</p></div><div class="nugget-popup"><p>Internal flooding of a residential property at/near the junction of Benefield Road and Lytham Park; water crossed the property threshold causing internal damage. [PAG] (p9)</p></div><div class="nugget-popup"><p>Surface water flowed down the carriageway channel from east and west to a low point adjacent to a culverted watercourse and flowed over front gardens into residential property on Benefield Road. [TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Surface water flowed down the carriageway channel from east and west to a low point adjacent to a culverted watercourse. A shallow wave of surface water flowed from the carriageway channel, across the footway and front garden and steps to a property, entering the front doorway and internal hallway. The lack of an upstand on a length of kerbing at the low point contributed to flow across the footway. The resident was able to reduce the impact by sweeping and diverting water. (p12)</p></div><div class="nugget-popup"><p>Heavy rainfall combined with carriageway, kerb and footway levels caused surface water to collect at the lowest point on Benefield Road and the layout and levels of the front approach and steps at a property channelled surface water towards the front doorway threshold, resulting in flooding at the property. (p17)</p></div><div class="nugget-popup"><p>The low point on Benefield Road was adjacent to the flood incident and experienced highway/low&ndash;point flooding; led to recommended highway works (full&ndash;height kerbing and re&ndash;levelled footway) and review of developer drainage works. (p20)</p></div><div class="nugget-popup"><p>Surface water ponded at a low point on Benefield Road during the flood incident; a roadside ditch was observed in&ndash;filled with small aggregate, restricting drainage and contributing to water ponding over the carriageway. [IMG] (p43)</p></div><div class="nugget-popup"><p>Benefield Road has a low point with road gullies and flush kerbs/backward&ndash;sloping footway; gullies were noted at the low point and construction/works were present&mdash;conditions consistent with surface water accumulation and urban flooding at this location during the event. [IMG,PAG] (p45)</p></div><div class="nugget-popup"><p>Location of a flood incident investigated on site. Drainage works and excavation were carried out at the pavement and gullies; sandbags were placed at the entrance to a house to prevent ingress. The low point on Benefield Road (flush kerbs and a backward&ndash;sloping footway) and road gullies are shown where water ponded. The start of a culverted section of a tributary of the Lyveden Brook is located on the north side of Benefield Road (downstream view) and was involved in the drainage works during the investigation. [IMG,PAG] (p46)</p></div><div class="nugget-popup"><p>The north side of Benefield Road (downstream of the culvert) is identified as the location of the flood incident; drainage works were being carried out there during the investigation. [IMG] (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property [PAG,MUL] (p6)</p></div><div class="nugget-popup quant"><p>one property [PAG] (p7)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p9)</p></div></div></body></div>`)[0];

                var html_71865f35c717378288b5dffe564b9e8d = $(`<div id="html_71865f35c717378288b5dffe564b9e8d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lytham Park, Oundle</h1><div class="nugget-popup"><p>Internal flooding of a residential property within the Lytham Park development; the property experienced internal flooding on 24th May 2014 and has been flooded on more than one occasion in the previous five years (including a prior incident in October 2013). The flood incident was reported near the junction of Benefield Road and Lytham Park. [MUL] (p9)</p></div><div class="nugget-popup"><p>A property adjacent to the Lytham Park development was flooded by surface water runoff from the highway/drainage catchment; localised drainage works were installed by the developer (including a new ACO channel at the back of the footway) to collect highway runoff and reduce the risk of recurrence. [PAG] (p10)</p></div><div class="nugget-popup"><p>Surface water from the carriageway of Benefield Road flowed over front gardens into residential property on the Benefield Road / Lytham Park development. [TAB,MUL] (p11)</p></div><div class="nugget-popup"><p>A property on Benefield Road/Lytham Park received a shallow wave of surface water that flowed across the front garden and steps and into the front doorway, flooding the internal hallway. The resident swept and diverted water to reduce internal impact; laminate flooring in the hallway aided cleanup while other rooms were carpeted. (p12)</p></div><div class="nugget-popup"><p>Localised drainage and watercourse works associated with the Lytham Park housing development were being carried out at the time of the investigation following flooding on 24 May 2014; deficiencies or changes to drainage/watercourses at the development were identified as contributing to surface water runoff/overland flow affecting nearby properties. (p21)</p></div><div class="nugget-popup"><p>An overgrown and in&ndash;filled ditch immediately west of Lytham Park was observed obstructing conveyance; vegetation and in&ndash;fill material reduced ditch capacity, contributing to surface water runoff and local ponding at the low point during the flood investigation. [IMG] (p45)</p></div><div class="nugget-popup"><p>The route of a watercourse culverted as part of the Lytham Park development (south of Benefield Road, east of Lytham Park) was associated with the flood incident; the culverted route and the point where the culverted watercourse discharges to open channel east of Lytham Park were inspected and noted during the investigation. [IMG,PAG] (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property [MUL] (p9)</p></div></div></body></div>`)[0];

                var html_6a6533a1fd8ff4fc40e5477e63387f98 = $(`<div id="html_6a6533a1fd8ff4fc40e5477e63387f98" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Northamptonshire</h1><div class="nugget-popup"><p>Within Northamptonshire (LLFA area) an event of intense short&ndash;duration rainfall produced surface water runoff that caused flooding at Benefield Road, Oundle, including internal flooding of a property; the event prompted a formal Section 19 investigation by the Northamptonshire LLFA. (p6)</p></div><div class="nugget-popup"><p>A formal Section 19 investigation was carried out into a flood incident on Benefield Road, Oundle (within Northamptonshire) where internal flooding of at least one property occurred. (p8)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property (p6)</p></div><div class="nugget-popup quant"><p>one property (p8)</p></div></div></body></div>`)[0];

                var html_d521cab58b107bb551808011761c9a12 = $(`<div id="html_d521cab58b107bb551808011761c9a12" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Oundle</h1><div class="nugget-popup"><p>Benefield Road in Oundle was the subject of a Northamptonshire County Council Section 19 flood investigation, indicating flooding affected the location. (p2)</p></div><div class="nugget-popup"><p>Flood incidents occurred in Oundle (specifically at Benefield Road) when intense short&ndash;duration rainfall generated excess surface water that flowed to low points around private property, causing internal flooding of property. [PAG] (p7)</p></div><div class="nugget-popup"><p>Internal flooding of one property on 24 May 2014; the same property has experienced internal flooding on more than one occasion in the previous five years (including an earlier incident reported in October 2013). [MUL] (p9)</p></div><div class="nugget-popup"><p>Surface water flooding events (05/08/2013; 22/05/2014; 24/05/2014) where carriageway runoff entered properties around Benefield Road/Lytham Park; and an October 2013 event where excessive flows in Lyveden Brook caused bank overtopping and affected adjoining property. [MUL] (p11)</p></div><div class="nugget-popup"><p>Reported routes of surface water were mapped through the town during the event; Incident Plans recorded surface water flow paths across Oundle. (p13)</p></div><div class="nugget-popup"><p>Flooding occurred in Oundle at Benefield Road on 24th May 2014: heavy rainfall and local carriageway/kerb/footway/layout caused surface water to collect and be channelled towards a property doorway; limited effectiveness of highway drainage contributed to increased surface water accumulation at the low point. (p17)</p></div><div class="nugget-popup"><p>Surface water flooding in the town associated with ineffective drainage (notably on Benefield Road) requiring community&ndash;scale actions and a Community Flood Plan to reduce runoff and manage drainage. (p18)</p></div><div class="nugget-popup"><p>The town experienced flooding driven by surface water runoff and drainage failures; the incident prompted recommendations for ditch re&ndash;excavation, culvert repair, watercourse maintenance and highway drainage improvements. (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property [PAG] (p7)</p></div><div class="nugget-popup quant"><p>1 property [MUL] (p9)</p></div></div></body></div>`)[0];
