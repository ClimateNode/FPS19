                var html_0b52bdc86dee92b9a81eb8ede64a4c20 = $(`<div id="html_0b52bdc86dee92b9a81eb8ede64a4c20" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lyveden Brook</h1><div class="nugget-popup"><p>The watercourse (and its tributary immediately east of Lytham Park) was identified as contributing to surface water runoff and flooding within the local area; the report recommends confirming ownership and maintenance responsibilities for sections of this tributary to reduce future surface water collection and conveyance issues. (p18)</p></div><div class="nugget-popup"><p>The tributary of Lyveden Brook (start of a culverted section) was the location of a flood incident; drainage works were carried out at the culvert inlet on the north side of Benefield Road during the investigation and the culverted section connects downstream to open water east of Lytham Park. [IMG] (p47)</p></div></div></body></div>`)[0];

                var html_f402553d2ce16c50efbf36d77d3a4a22 = $(`<div id="html_f402553d2ce16c50efbf36d77d3a4a22" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Benefield Road, Oundle</h1><div class="nugget-popup"><p>Intense short&ndash;duration rainfall and inadequate drainage caused excess surface water to flow over ground and follow contours to low points around private property on Benefield Road, resulting in internal flooding of at least one property; local kerb/footway levels and surface features exacerbated the flow. [PAG,MUL] (p6)</p></div><div class="nugget-popup"><p>Internal flooding of a residential property (water crossed the threshold). Flooding was reported near the junction of Benefield Road and Lytham Park and has occurred on more than one occasion. [PAG,MUL] (p9)</p></div><div class="nugget-popup"><p>Surface water from the carriageway flowed down the carriageway channel into the low point adjacent to a culverted watercourse and then over front gardens into residential property on the Benefield Road/Lytham Park development. [TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Surface water flowed down the carriageway channel from east and west to a low point on the south side adjacent to a culverted watercourse; a shallow wave of surface water moved from the carriageway across the footway and toward nearby properties, entering at least one property's front doorway. The resident took measures to sweep flood water back to the door and divert flows to lower areas to the east; kerbing at the low point was laid flush with the footway which contributed to flow across the footway. (p12)</p></div><div class="nugget-popup"><p>Heavy rainfall combined with the layout and levels of the carriageway, kerb and footway, and the layout/levels of the property's front approach and steps, channelled surface water toward the property's front doorway threshold. Highway drainage effectiveness and inability to discharge satisfactorily contributed to increased accumulation of surface water at the lowest point of Benefield Road. (p17)</p></div><div class="nugget-popup"><p>A flood incident occurred at the low point of Benefield Road (adjacent to the flood incident), indicating highway drainage failure/insufficient capacity; this prompted recommendations for highway works including full height kerbing, re&ndash;levelled footway and review of developer&ndash;implemented highway works. (p20)</p></div><div class="nugget-popup"><p>Surface water ponded at a low point on Benefield Road during the flood incident; a roadside ditch was observed in&ndash;filled with small aggregate, restricting drainage and contributing to water ponding over the carriageway. [IMG] (p43)</p></div><div class="nugget-popup"><p>Road gullies located at the low point, together with flush kerbs and a backward&ndash;sloping footway, concentrated runoff and reduced drainage effectiveness. These features were recorded as causing surface water to pond at the low point during the 24 May 2014 event. [IMG,PAG] (p45)</p></div><div class="nugget-popup"><p>Surface water ponding occurred at a low point on Benefield Road. Drainage works and excavation were carried out at the location during the investigation; sandbags were placed at the entrance to a nearby residential property to prevent water ingress. Road gullies and the flush&ndash;kerb/backward&ndash;sloping footway at the low point are recorded as features at the flood location. The start of a culverted section of a tributary of Lyveden Brook is located on the north side of Benefield Road (downstream) and was investigated in relation to the incident. [IMG,PAG] (p46)</p></div><div class="nugget-popup"><p>Flooding occurred at the north side of Benefield Road where the culvert entrance of the tributary is located; drainage works were undertaken at this spot during the flood investigation. [IMG] (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property [PAG,MUL] (p6)</p></div><div class="nugget-popup quant"><p>one property [PAG,MUL] (p9)</p></div></div></body></div>`)[0];

                var html_51ea90f785d78cda5c9a9df4108a28af = $(`<div id="html_51ea90f785d78cda5c9a9df4108a28af" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lytham Park, Oundle</h1><div class="nugget-popup"><p>Internal flooding affected a residential property near the junction of Benefield Road and Lytham Park; the area was the focus of a formal flood investigation following the incident and residents reported previous flood occurrences. [MUL] (p9)</p></div><div class="nugget-popup"><p>A property adjacent to the Lytham Park development was flooded by surface water runoff from the highway/drainage catchment; localised drainage works were installed by the developer (including a new ACO channel at the back of the footway) to collect highway runoff and reduce the risk of recurrence. [PAG] (p10)</p></div><div class="nugget-popup"><p>Residential property within the Benefield Road / Lytham Park development was flooded when surface water from the Benefield Road carriageway flowed over front gardens into properties. [TAB,MUL] (p11)</p></div><div class="nugget-popup"><p>A shallow wave of surface water flowed from Benefield Road across the footway, across the front garden and steps to a property on Benefield Road/Lytham Park and into the property's front doorway and internal hallway; the resident swept and diverted water to reduce internal impact, aided by wooden laminate flooring in the hallway which eased clean&ndash;up. (p12)</p></div><div class="nugget-popup"><p>Areas immediately east of Lytham Park (the location of the Lyveden Brook tributary) were implicated in surface water/runoff problems during the event; the report recommends confirming ownership and maintenance of the watercourse there to address flooding and surface water collection. (p18)</p></div><div class="nugget-popup"><p>Localised drainage works were being carried out on the Lytham Park housing development at the time of the investigation because surface water runoff/overland flow from or around the development had contributed to flooding; ENC was asked to review whether watercourse works and other measures were satisfactorily designed and implemented during construction. (p21)</p></div><div class="nugget-popup"><p>Ditch immediately west of Lytham Park was observed in&ndash;filled with small aggregate and overgrown, restricting conveyance. The obstructed ditch and outlet arrangement contributed to localised surface water pooling at the low point during the 24 May 2014 event. [IMG] (p45)</p></div><div class="nugget-popup"><p>The route of a culverted watercourse installed as part of the Lytham Park development (south of Benefield Road, east of Lytham Park) was involved in the flood incident; drainage works were recorded along the culverted route and where the culvert discharges to open water east of Lytham Park. [IMG,PAG] (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property [MUL] (p9)</p></div></div></body></div>`)[0];

                var html_cb3d9acaaabd6adee9ccb5e96b31f799 = $(`<div id="html_cb3d9acaaabd6adee9ccb5e96b31f799" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Northamptonshire</h1><div class="nugget-popup"><p>Within Northamptonshire (LLFA area) an event of intense short&ndash;duration rainfall produced surface water runoff that caused flooding at Benefield Road, Oundle, including internal flooding of a property; the event prompted a formal Section 19 investigation by the Northamptonshire LLFA. (p6)</p></div><div class="nugget-popup"><p>Surface water flooding affected Benefield Road, Oundle. Heavy rainfall combined with the layout and levels of the carriageway, kerb and footway adjacent to the property, and the layout/levels of the property's front approach and steps, channelled surface water towards the front doorway threshold causing the property to flood. (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property (p6)</p></div></div></body></div>`)[0];

                var html_c32a983d737adcbcad43d813045aec98 = $(`<div id="html_c32a983d737adcbcad43d813045aec98" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Oundle</h1><div class="nugget-popup"><p>Benefield Road in Oundle was the subject of a Northamptonshire County Council Section 19 flood investigation, indicating flooding affected the location. (p2)</p></div><div class="nugget-popup"><p>Flooding in Oundle included an incident on Benefield Road where one property experienced internal flooding; residents were spoken to about the 24th May 2014 event and previous incidents. [MUL] (p9)</p></div><div class="nugget-popup"><p>Lyveden Brook experienced excessive flows that overtopped banks and affected adjoining properties in October 2013 (river flooding). Separately, surface water flowing along Benefield Road inundated front gardens and residential properties in the Oundle area on 05/08/2013, 22/05/2014 and 24/05/2014. [MUL] (p11)</p></div><div class="nugget-popup"><p>Reported routes of surface water were recorded during the event; surface water flowed along those reported routes causing flooding in Oundle during the incident. (p13)</p></div><div class="nugget-popup"><p>Parts of Oundle (specifically Benefield Road) experienced surface water flooding on 24th May 2014 due to heavy rainfall and local carriageway/kerb/footway levels that channelled water towards property thresholds; highway drainage discharge issues increased surface water collection at the lowest point. (p17)</p></div><div class="nugget-popup"><p>Surface water collected on highway and low&ndash;lying parts of the town linked to ineffective highway drainage and runoff, prompting a community flood planning response and recommendations for property&ndash;level and community&ndash;wide measures. (p18)</p></div><div class="nugget-popup"><p>Surface water run&ndash;off and inadequacies in historic drainage/watercourse capacity caused flooding in the town, prompting town&ndash;wide measures: re&ndash;excavation of ditches, repair/replacement of piped/culvert sections, dredging/trimming of watercourses, replacement of structures and vegetation clearance; community&ndash;level response actions (flood warden and village flood plan) were recommended. (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property [MUL] (p9)</p></div></div></body></div>`)[0];
