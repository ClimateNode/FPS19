                var html_3d7569ec2ae52a8588e8006d0e78e07a = $(`<div id="html_3d7569ec2ae52a8588e8006d0e78e07a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>West Sussex</h1><div class="nugget-popup"><p>An extreme rainfall event on 10&ndash;12 June 2012 caused widespread flooding across parts of the county. Almost 800 properties across West Sussex were affected by flooding from a variety of sources; the worst affected areas included the Manhood Peninsula, Bognor Regis, Littlehampton and Worthing. The Bognor Regis conurbation (including Middleton on Sea, Elmer and Felpham) had reports of properties flooded primarily by surface water. (p3)</p></div><div class="nugget-popup"><p>The county experienced unprecedented summer 2012 rainfall (notably 10&ndash;12 June 2012) that overloaded local drainage networks across the coastal plain. Flood water generally dissipated over 2&ndash;3 days with no significant infrastructure damage, but the event caused widespread surface water flooding. (p5)</p></div><div class="nugget-popup"><p>Widespread surface water flooding during the June 2012 event; flooding patterns closely matched the county's Areas Susceptible to Surface Water Flooding maps. Prolonged heavy rainfall (some locations received large totals in 12&ndash;24 hours) generated excess runoff and caused inundation across parts of the county. (p13)</p></div><div class="nugget-popup"><p>West Sussex experienced very high short&ndash;duration rainfall that generated excess runoff and led to surface water flooding in the county. [PAG] (p14)</p></div><div class="nugget-popup"><p>Numerous extreme rainfall observations were recorded across West Sussex during the event (Met Office and other networks). The report notes multiple very large local totals in the county and describes highly localised convective cells, indicating the county experienced intense rainfall that increased the likelihood of significant disruption and potential flooding in parts of West Sussex. (p15)</p></div><div class="nugget-popup"><p>Extremely high, localised rainfall across West Sussex produced widespread surface water flooding (the majority of property flooding on 10&ndash;12 June) and some river&ndash;linked flooding; the Environment Agency issued Flood Alerts and Flood Warnings for multiple rivers and watercourses in the county. [PAG] (p16)</p></div><div class="nugget-popup"><p>Widespread extreme rainfall in June 2012 caused extensive surface water flooding across the county (main event 10&ndash;12 June 2012). Some property flooding occurred; river levels in parts of the county (notably Aldingbourne Rife and the Manhood Peninsula rife network) remained high for days after the rain. [PAG,IMG] (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>almost 800 properties; up to 370 properties (p3)</p></div><div class="nugget-popup quant"><p>780 properties (p5)</p></div></div></body></div>`)[0];

                var html_64661ddc738c4994751e0f94271f0c08 = $(`<div id="html_64661ddc738c4994751e0f94271f0c08" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bognor Regis</h1><div class="nugget-popup"><p>Bognor Regis conurbation was among the worst affected in the 10&ndash;12 June 2012 event; properties flooded and the conurbation is thought to have been flooded primarily by surface water. (p3)</p></div><div class="nugget-popup"><p>The Bognor to Chichester area recorded the highest rainfall during the 10&ndash;12 June 2012 event; the intense rainfall overloaded local drainage leading to surface water/urban flooding in low&ndash;lying parts of the area. (p5)</p></div><div class="nugget-popup"><p>Extreme, highly localised rainfall was recorded in Bognor Regis during the event. The Environment Agency rain gauge at Bognor Regis recorded 114mm over the whole event &mdash; the highest 24&ndash;hour total recorded at Bognor since EA records began in 1974 &mdash; and the report characterises this as approximately a 1&ndash;in&ndash;200&ndash;year (0.5% annual chance) rainfall event. A separate town council gauge and other local gauges reported substantially higher totals at nearby locations, indicating an exceptionally intense, localised storm over the Bognor area and implying a high potential for disruption. [PAG] (p15)</p></div><div class="nugget-popup"><p>Extremely intense, localized rainfall during the June 2012 event (recorded as one of the highest totals in the EA network) contributed to surface water flooding; properties in the area were flooded during the main event. [PAG,IMG] (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>up to 370 properties (Bognor Regis conurbation incl. Middleton on Sea, Elmer and Felpham) (p3)</p></div></div></body></div>`)[0];
