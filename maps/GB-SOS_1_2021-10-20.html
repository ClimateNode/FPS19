                var html_22ba56e090f16aae5e6cfe6e9c4a636b = $(`<div id="html_22ba56e090f16aae5e6cfe6e9c4a636b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Southend-On-Sea Unitary Authority</h1><div class="nugget-popup"><p>Southend&ndash;on&ndash;Sea experienced a flood event on 20th October 2021 that affected the Victoria Road area (report subject). (p1)</p></div><div class="nugget-popup"><p>Repeated internal property flooding occurred within the area surrounding Victoria Road between Manilla Road and Shaftesbury Avenue. [PAG] (p3)</p></div><div class="nugget-popup"><p>The report identifies that the properties impacted by the investigated flooding event are located entirely within the City of Southend&ndash;on&ndash;Sea; the low&ndash;lying area around Victoria Road and surrounding junctions was affected by surface water/urban flooding on 20th October 2021. [IMG] (p4)</p></div><div class="nugget-popup"><p>Victoria Road area (City of Southend) experienced surface water flows and sewer surcharging on 20th October 2021: foul&ndash;contaminated flows discharged from Manilla Road east to the junction of Victoria Road and Shaftesbury Avenue, pooling at the low point between Collier Way and Shaftesbury Avenue. Water depths reached approximately 200&ndash;250 mm; flooding persisted ~2&ndash;3 hours (receding by ~02:00 on 21st October). Significant contaminated silt deposits remained for several days and were cleared by SCC and Anglian Water. Historical SCC LFRMS records also show internal flooding in the Victoria Road area on 24th August 2013 and 19th September 2014. [MUL] (p8)</p></div><div class="nugget-popup"><p>The Victoria Road area of Southend&ndash;on&ndash;Sea experienced intense rainfall on 20 October 2021 that overwhelmed highway drainage and sewer systems, causing surface water runoff and sewer surcharging that impacted streets and properties in the local area. [PAG,IMG,TAB] (p10)</p></div><div class="nugget-popup"><p>Urban/ surface water flooding affected streets in Southend&ndash;on&ndash;Sea, including Victoria Road, with vehicles partially submerged and evidence of post&ndash;flood debris and disruption to local streets. [IMG] (p17)</p></div><div class="nugget-popup"><p>The Victoria Road area of Southend&ndash;on&ndash;Sea experienced surface water/urban flooding with mud, silt and debris deposited along residential streets and pavements, as documented in post&ndash;flood photographs. [IMG] (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8 properties; 2 properties; at least 1 property [MUL] (p8)</p></div></div></body></div>`)[0];

                var html_ebffce24d09f39dff694c8d759127982 = $(`<div id="html_ebffce24d09f39dff694c8d759127982" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Victoria Road, Southend-On-Sea Unitary Authority</h1><div class="nugget-popup"><p>Victoria Road area experienced flooding during the flood event on 20th October 2021 (subject of this investigation). (p1)</p></div><div class="nugget-popup"><p>Victoria Road and its immediate junctions with Manilla Road, Northumberland Crescent, Jetty Mews, Retort Close and Shaftesbury Avenue were within the area affected by the 20 October 2021 flood event and were investigated for flooding impacts (roadway and adjacent properties impacted). [PAG] (p4)</p></div><div class="nugget-popup"><p>Internal flooding to properties (including at least one property during the 20 October 2021 event). Widespread flooding of carriageways and footways gathering at the local low point between Collier Way and Shaftesbury Avenue. Floodwaters reached the localised low point and deposited contaminated silt which persisted for several days until cleared by SCC and Anglian Water. Flooding persisted for approximately 2&ndash;3 hours and receded by around 02:00 on 21 October 2021. [TAB,PAG,MUL] (p8)</p></div><div class="nugget-popup"><p>Surface water from higher ground flowed along road surfaces to Victoria Road; flows mixed with foul effluent surcharging from the Manilla Road area, moved south along Victoria Road and accumulated at the localised low point between Collier Way and Shaftesbury Avenue, impacting areas along Victoria Road. (p9)</p></div><div class="nugget-popup"><p>Surface water from surrounding higher ground flowed along road surfaces toward Victoria Road. Surface water mixed with foul effluent surcharged from the Manilla Road area, flowed east to Victoria Road and then south, affecting stretches of Victoria Road and junctions at Northumberland Crescent, Collier Way, Jetty Mews and Shaftesbury Avenue. Flows collected at the local low point on Victoria Road between Collier Way and Shaftesbury Avenue, producing the mapped flood extent and flow routes. [PAG,IMG,TAB] (p10)</p></div><div class="nugget-popup"><p>Floodwater covered the road surface at the Victoria Road and Collier Way junction, reaching up to vehicle wheel wells and partially submerging parked cars; floating debris and stagnant water indicate impaired drainage at the street. [IMG,PAG] (p15)</p></div><div class="nugget-popup"><p>Nighttime flooding at the Victoria Road and Collier Way junction with water covering the carriageway, reaching up to parked vehicles and encroaching on the bases/entrances of terraced houses; disruption to residential access and risk of property inundation. [IMG,PAG] (p16)</p></div><div class="nugget-popup"><p>Street&ndash;level flooding at the Victoria Road (including the junction with Collier Way) that partially submerged parked vehicles; floodwater reached above the bottom of car doors and above wheel rims, creating hazards to vehicles and contributing to post&ndash;flood debris on the street. [IMG,PAG] (p17)</p></div><div class="nugget-popup"><p>Post&ndash;flood deposition of mud, silt and debris across the carriageway and pavements; visible surface damage to road and footway requiring clean&ndash;up and likely repairs; obstruction of the highway in a residential terraced street. [IMG] (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 1 property; water levels approximately 200&ndash;250 mm at the low point; flooding persisted for 2&ndash;3 hours; contaminated silt deposits remained for several days [TAB,PAG,MUL] (p8)</p></div></div></body></div>`)[0];
