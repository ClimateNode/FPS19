                var html_a2f7e78d8b19f94f865c1e6ca8be8e76 = $(`<div id="html_a2f7e78d8b19f94f865c1e6ca8be8e76" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Solihull Metropolitan District</h1><div class="nugget-popup"><p>Rapid increase in surface water and associated river flooding across Solihull on 27 May 2018, resulting in flooding that affected properties in the area. [PAG] (p4)</p></div><div class="nugget-popup"><p>On 27 May 2018 rapid, high&ndash;intensity rainfall in Solihull caused a large volume of surface water and associated river flooding. Properties suffered internal flooding (some to depths forcing evacuation), garages were flooded and destroyed possessions, gardens/external areas were flooded, and the local road network became impassable in places. (p5)</p></div><div class="nugget-popup"><p>Flooding on 27 May 2018 affected multiple locations across the borough; the Lead Local Flood Authority (Solihull Council Flood Risk Management Team) carried out investigations at 11 locations. (p7)</p></div><div class="nugget-popup"><p>The borough experienced very high intensity rainfall on 27 May 2018 that caused widespread surface water/urban flooding; properties were flooded across the borough and investigation work was carried out at 11 locations to identify causes and plan remedial actions. (p8)</p></div><div class="nugget-popup"><p>Overtopping of the canal and associated runoff were reported within Solihull following intense rainfall, causing localised flooding of adjacent areas and prompting inspections, CCTV surveys and follow&ndash;up flood&ndash;risk work by the council and partners. [TAB] (p45)</p></div><div class="nugget-popup"><p>Overtopping along the side of the canal was reported within Solihull and properties experienced internal flooding during the 27 May 2018 event; borough&ndash;wide inspections and follow&ndash;up work were carried out after the flooding. [TAB] (p48)</p></div><div class="nugget-popup"><p>Areas within the Solihull borough experienced flooding on 27 May 2018 affecting ordinary watercourses and sections of the River Blythe and Mount Brook. This led to CCTV and other inspections of culverted watercourses and attenuation features, gully cleansing, pipework inspections and works orders for repairs, and the submission of proposals for funding and feasibility assessments for future mitigation schemes. (p57)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 300 properties [PAG] (p4)</p></div><div class="nugget-popup quant"><p>178 properties (internal property flooding); 75 properties (water entering garages); 63 properties (garden/external flooding) (p5)</p></div><div class="nugget-popup quant"><p>11 locations (p7)</p></div><div class="nugget-popup quant"><p>over 300 reports of flooding to property (p8)</p></div></div></body></div>`)[0];

                var html_3560bba3ee39bd8d485c01e3c9d3f558 = $(`<div id="html_3560bba3ee39bd8d485c01e3c9d3f558" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Blythe</h1><div class="nugget-popup"><p>Small watercourses that feed into the River Blythe quickly became overwhelmed and broke their banks, with flood waters affecting one community and then continuing downstream to affect another. (p5)</p></div><div class="nugget-popup"><p>Small watercourses feeding into the River Blythe quickly became overwhelmed and broke their banks; the River Blythe contributed water that inundated the Earlswood Lakes feeder and drove a surge along the canal, causing overtopping and additional property flooding downstream. [PAG] (p6)</p></div><div class="nugget-popup"><p>Blythe ward received property flood reports during the 27 May 2018 event; residents were among those affected and some were forced to leave their homes and live in alternative accommodation. (p8)</p></div><div class="nugget-popup"><p>On 27 May 2018 the River Blythe overtopped its channel (flooding out of its normal channel), producing a wave of water that caused internal and external flooding of properties along Tanworth Lane and Coppice Walk, flooded a property south of Tanworth Lane, and made the highway impassable at locations downstream. [IMG,TAB] (p23)</p></div><div class="nugget-popup"><p>Intense rainfall overwhelmed feeder systems and the canal feeder, causing canal overtopping adjacent to the River Blythe culvert and a surge of water entering the River Blythe; this surge contributed to overtopping of structures (including a bridge) and downstream flooding. The River Blythe (a Main River and SSSI) is being inspected/managed by the Environment Agency. [TAB] (p25)</p></div><div class="nugget-popup"><p>Experienced additional high flows on 27th May 2018 associated with flooding of the Stratford&ndash;upon&ndash;Avon Canal at Lady Lane; these increased flows were part of the wider catchment flooding that affected downstream watercourses. [TAB] (p29)</p></div><div class="nugget-popup"><p>Water from the overwhelmed feeder system and overtopped canal passed into the canal south of Lady Lane and then entered the River Blythe (rather than the River Cole), contributing to flooding within the Solihull area. [TAB] (p45)</p></div><div class="nugget-popup"><p>Canal overtopping (from the feeder system to Earlswood Lakes/main canal) passed water into the River Blythe, increasing river flows and contributing to flooding within the borough during the event. [TAB] (p48)</p></div><div class="nugget-popup"><p>Experienced river flooding on 27th May 2018 that required inspection by the Environment Agency as part of the post&ndash;event response. (p56)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Part of 178 properties (total across Blythe, Shirley West, Hockley Heath and Olton) reported internal property flooding; part of the same overall totals of 75 properties with garage flooding and 63 properties with garden/external flooding. (p5)</p></div><div class="nugget-popup quant"><p>part of over 300 reports of flooding to property (p8)</p></div><div class="nugget-popup quant"><p>1 property flooded to the south of Tanworth Lane [IMG,TAB] (p23)</p></div></div></body></div>`)[0];

                var html_4d73854b5cd96586c5ccca320358733e = $(`<div id="html_4d73854b5cd96586c5ccca320358733e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Cole</h1><div class="nugget-popup"><p>Small watercourses that feed into the River Cole quickly became overwhelmed and broke their banks, contributing to flood waters moving downstream and affecting communities. (p5)</p></div><div class="nugget-popup"><p>The River Cole overtopped/was constrained at the aqueduct, causing floodwater to spread across open spaces and roads (notably Aqueduct Road and areas east/west of it), contributing to open&ndash;space flooding in front of the Berry Maud development, making Aqueduct Road impassable and causing internal and garage flooding in nearby properties on 27 May 2018. A tributary to the Cole also ran out of bank north of the aqueduct. [IMG,TAB] (p43)</p></div><div class="nugget-popup"><p>The River Cole overtopped/flowed beneath/over infrastructure in the area and caused fluvial flooding documented with photographic and video evidence; the river flooding is cited as the source of flooding that affected nearby properties and highway. [IMG,TAB,PAG] (p46)</p></div><div class="nugget-popup"><p>The River Cole experienced high flows on 27 May 2018 from multiple tributaries (including Peter Brook and an unnamed tributary) and interacted with overland/surface water, producing waves of water and causing internal flooding to properties (many flooded for the first time) in the area around Aqueduct Road, Colebrook Road and Nethercote Gardens. [TAB] (p48)</p></div><div class="nugget-popup"><p>The River Cole is identified as having risk along the western edge of Tidbury Green and is reported to have breached its banks further downstream on 27 May 2018, contributing to flooding conditions in the local drainage network and nearby properties. [IMG,TAB] (p52)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 properties internally flooded; 2 garages flooded; 12 reports of internal property flooding in Corley Close; 2 instances of garage flooding in Corley Close; (area totals reported: 19 properties internally flooded; 7 properties externally flooded; 7 garages flooded) [IMG,TAB] (p43)</p></div><div class="nugget-popup quant"><p>29 properties flooded; 4 properties internally flooded on the northern side of Colebrook Road (attributed to River Cole flooding) [IMG,TAB,PAG] (p46)</p></div></div></body></div>`)[0];

gget-popup quant"><p>4 properties [PAG] (p47)</p></div></div></body></div>`)[0];

                var html_22979184f5913830397eeec3b7654f88 = $(`<div id="html_22979184f5913830397eeec3b7654f88" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Tythe Barn Lane, Dickens Heath</h1><div class="nugget-popup"><p>Named in the LLFA's Appendix E (Tythe Barn Lane Area) and investigated following the flooding on 27 May 2018, indicating direct impact from that event. (p7)</p></div><div class="nugget-popup"><p>Surface water and overland flow plus an overloaded/blocked local sewer network led to internal flooding of properties on Tythe Barn Lane. A nearby ordinary watercourse was out of bank and surrounding land flooded; the highway became impassable. At the eastern end, the sewer outfall into the Stratford&ndash;Upon&ndash;Avon Canal was restricted (canal level likely higher than normal), contributing to internal property flooding. [TAB,PAG] (p32)</p></div><div class="nugget-popup"><p>Internal flooding to properties caused by an overloaded highway drainage and foul sewer network; sewer outfall to the Stratford&ndash;Upon&ndash;Avon Canal was likely restricted by higher&ndash;than&ndash;normal canal water level, contributing to sewer surcharge and ingress into properties. [IMG,PAG] (p33)</p></div><div class="nugget-popup"><p>Blocked highway drains and limited culvert capacity contributed to surface water discharging at the eastern end of Tythe Barn Lane and local flooding during the event on 27 May 2018; the council carried out additional gully cleansing and CCTV surveys of drainage assets after the flood. [TAB] (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 properties internally flooded; 1 garage flooded [TAB,PAG] (p32)</p></div></div></body></div>`)[0];

ng land and overflow from an adjacent watercourse; the highway was rendered impassable. [IMG,TAB,PAG] (p52)</p></div><div class="nugget-popup"><p>Properties on Norton Lane were flooded from the front; the adjacent highway was flooded. A local watercourse breached its banks, overflowing into properties and the road in the Fulford Hall Road / Rumbush Lane area (Tidbury Green). [IMG,PAG] (p53)</p></div><div class="nugget-popup"><p>Drainage and sewer&ndash;related assets on Rumbush Lane were implicated in the May 2018 flooding; a foul&ndash;water pumping station on Rumbush Lane forms part of the conveyance infrastructure involved during the flood event. [TAB] (p54)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>26 properties internally flooded; 1 property externally flooded; 10 garages flooded (area total) [IMG,TAB,PAG] (p52)</p></div></div></body></div>`)[0];

                var html_2a9bd32c7c6f6077b18052a22e433923 = $(`<div id="html_2a9bd32c7c6f6077b18052a22e433923" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Stratford Upon Avon Canal</h1><div class="nugget-popup"><p>Flooding of the canal at Lady Lane is reported as a possible source of additional flows into the River Blythe and may have contributed to a wave of water arriving after the initial rainfall. [TAB] (p23)</p></div><div class="nugget-popup"><p>Flooding of the Stratford&ndash;Upon&ndash;Avon Canal at Lady Lane is reported as a possible cause of additional flows into the River Blythe that contributed to a wave of water reaching properties in the Coppice Walk area. This linkage is reported as possible rather than confirmed. [IMG,PAG] (p24)</p></div><div class="nugget-popup"><p>Canal embankment/dam was damaged by water flowing down Malt House Lane and spilling down the slope to Valley Road; two land slips occurred on the embankment and were covered with tarpaulin to protect the integrity of the dam. The Canal & River Trust confirmed the lakes did not overtop/flood, but the embankment damage posed risk to the structure. (p26)</p></div><div class="nugget-popup"><p>The Stratford Upon Avon Canal flooded outside Waters Edge and Waterside, causing internal flooding to multiple properties; canal flooding at Lady Lane may have contributed to additional flows in the River Blythe. [TAB] (p29)</p></div><div class="nugget-popup"><p>The Stratford&ndash;upon&ndash;Avon Canal flooded/over&ndash;topped outside Waters Edge and Waterside, causing internal flooding to multiple properties and likely contributing to increased flows in the River Blythe (noted at Lady Lane). [IMG,PAG] (p30)</p></div><div class="nugget-popup"><p>Intense rainfall in the Blythe catchment overwhelmed a feeder to Earlswood Lakes; this overflow entered the Stratford&ndash;Upon&ndash;Avon Canal, causing a surge through the canal system. A culvert under the canal was identified as blocked/insufficient capacity and a section of bank adjacent to Waterside Heights had reduced freeboard, contributing to the canal overtopping risk. [TAB] (p31)</p></div><div class="nugget-popup"><p>Canal water level was reported higher than normal on 27th May 2018 and is understood to have restricted the outfall from the local sewer/highway drainage network. This restriction contributed to internal flooding of properties on Tythe Barn Lane when the sewer network overloaded and the canal level impeded discharge. [IMG,TAB,PAG] (p32)</p></div><div class="nugget-popup"><p>Elevated canal water levels during the 27 May 2018 flood are understood to have submerged the outfall from Tythe Barn Lane, preventing discharge and contributing to local flooding; further assessment was identified as required. [TAB] (p34)</p></div><div class="nugget-popup"><p>The Stratford&ndash;upon&ndash;Avon Canal was reported as a source of flooding: canal&ndash;related flooding led to internal flooding at the rear of properties (notably those in Hollywood Works Close). [TAB] (p43)</p></div><div class="nugget-popup"><p>Overtopping of the canal at a low point in the southern canal bank (south of Lady Lane) adjacent to the River Blythe Culvert allowed water into the River Blythe and contributed to flooding in the local area; further overtopping along the canal within Solihull was also reported. [TAB] (p45)</p></div><div class="nugget-popup"><p>Flood water from surface water/overland flow and overloaded sewers reached the Stratford Upon Avon Canal as the flood progressed through Pear Tree Crescent. (p49)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>100 properties [IMG,PAG] (p30)</p></div><div class="nugget-popup quant"><p>surge of up to 1m [TAB] (p31)</p></div><div class="nugget-popup quant"><p>5 properties internally flooded; 1 garage flooded [IMG,TAB,PAG] (p32)</p></div></div></body></div>`)[0];

                var html_3ce80dd54dc1ad33646d617ac0c58f6a = $(`<div id="html_3ce80dd54dc1ad33646d617ac0c58f6a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Shirley</h1><div class="nugget-popup"><p>Internal property flooding reported (some properties flooded internally, with some residents forced to evacuate or live upstairs). Key routes in and out of Shirley were restricted or impassable while flood waters remained. (p5)</p></div><div class="nugget-popup"><p>Shirley (including Shirley West) experienced property flooding as part of the 27 May 2018 event; properties were affected and some residents had to relocate temporarily. [PAG] (p8)</p></div><div class="nugget-popup"><p>Shirley (the area containing Aqueduct Road, Corley Close and Green Lane) was the subject location for a Section 19 flood investigation after flooding on 27 May 2018. [TAB] (p42)</p></div><div class="nugget-popup"><p>The Shirley area covering Aqueduct Road, Corley Close and Green Lane experienced widespread flooding: internal property flooding, external property/garage flooding and impassable roads. Flooding also affected areas from the Stratford&ndash;upon&ndash;Avon Canal (Hollywood Works Close). [PAG] (p43)</p></div><div class="nugget-popup"><p>Parts of Shirley (areas including Corley Close and Green Lane) experienced internal property flooding and some garage flooding during the event; local watercourse was reported out of bank and blocked drains were raised as a concern. [IMG] (p44)</p></div><div class="nugget-popup"><p>The Colebrook Road and Nethercote Gardens area of Shirley was the subject of a Section 19 investigation following flooding on 27 May 2018; local roads and properties in the area were impacted and drainage/sewer systems were overwhelmed. [TAB] (p45)</p></div><div class="nugget-popup"><p>Parts of Shirley (notably the Colebrook Road and Nethercote Gardens area) experienced fluvial flooding from the River Cole, surface&ndash;water overland flow and local sewer flooding; highways and multiple residential properties were flooded. [PAG] (p46)</p></div><div class="nugget-popup"><p>An area of Shirley (Colebrook Road / Nethercote Gardens area) experienced fluvial flooding from the River Cole, with internal property flooding and highway flooding reported across the area. (p47)</p></div><div class="nugget-popup"><p>The Yardley Wood Road / Pear Tree Crescent area of Shirley experienced surface&ndash;water&ndash;driven and sewer&ndash;related flooding on 27 May 2018 resulting in internal flooding of residential properties, external property and garage flooding, and carriageway flooding in parts of Yardley Wood Road. [IMG,PAG] (p49)</p></div><div class="nugget-popup"><p>Area&ndash;level impact: residential properties in the Yardley Wood Road / Pear Tree Crescent area of Shirley experienced internal flooding on the southern side of Yardley Wood Road when surface water could not enter the sewer network; blocked drains were raised as a concern. (p50)</p></div><div class="nugget-popup"><p>The Yardley Wood Road and Pear Tree Crescent area in Shirley experienced flooding during the May 2018 event; response actions in Shirley included council gully cleansing and Severn Trent sewer cleanses and CCTV, and an attenuation tank discharge caused local overland flooding. [TAB] (p51)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Part of 178 properties (total across Blythe, Shirley West, Hockley Heath and Olton) reported internal property flooding; part of the same overall totals of 75 properties with garage flooding and 63 properties with garden/external flooding. (p5)</p></div><div class="nugget-popup quant"><p>part of over 300 reports of flooding to property [PAG] (p8)</p></div><div class="nugget-popup quant"><p>19 properties internally flooded; 7 properties externally flooded; 7 garages flooded [PAG] (p43)</p></div><div class="nugget-popup quant"><p>12 reports of internal property flooding in Corley Close; 2 instances of garage flooding (Corley Close) [IMG] (p44)</p></div><div class="nugget-popup quant"><p>42 properties internally flooded; 1 property externally flooded; 2 garages flooded [PAG] (p46)</p></div><div class="nugget-popup quant"><p>29 properties; 8 properties (p47)</p></div><div class="nugget-popup quant"><p>24 properties internally flooded; 4 properties externally flooded; 2 garages flooded [IMG,PAG] (p49)</p></div></div></body></div>`)[0];

                var html_42d04aea4e3d9e9601af9dfbbb085067 = $(`<div id="html_42d04aea4e3d9e9601af9dfbbb085067" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Olton</h1><div class="nugget-popup"><p>Internal property flooding reported; some residents were forced to evacuate or live upstairs as flood waters rose. (p5)</p></div><div class="nugget-popup"><p>Properties in the Olton area were flooded; some residents were forced to leave their homes and live in alternative accommodation. Local streets in Olton (Swanswell Road, Langley Hall Road, Brook Lane) were investigated by the Council following the event. [PAG] (p8)</p></div><div class="nugget-popup"><p>The Olton area (Brook Lane, Langley Hall Road and Swanswell Road) experienced surface water and sewer&ndash;related flooding leading to internal and external property flooding and flooded garages across the area. [TAB,PAG] (p40)</p></div><div class="nugget-popup"><p>Area&ndash;level surface water / sewer network failures on 27 May 2018 led to multiple properties on Brook Lane, Langley Hall Road and Swanswell Road suffering internal, garage and external flooding. (p41)</p></div><div class="nugget-popup"><p>Severn Trent Water carried out visits to cleanse, CCTV and map the main sewer network assets in the Olton area following the flood on 27 May 2018. [TAB] (p42)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Part of 178 properties (total across Blythe, Shirley West, Hockley Heath and Olton) reported internal property flooding; part of the same overall totals of 75 properties with garage flooding and 63 properties with garden/external flooding. (p5)</p></div><div class="nugget-popup quant"><p>Over 300 reports of flooding to property were received borough&ndash;wide, mainly across Blythe, Shirley West, Dorridge and Hockley Heath and Olton wards [PAG] (p8)</p></div><div class="nugget-popup quant"><p>16 properties internally flooded; 8 properties externally flooded; 5 garages flooded [TAB,PAG] (p40)</p></div><div class="nugget-popup quant"><p>7 properties (internal) on Brook Lane; 3 garages on Brook Lane; 8 properties (external) on Brook Lane; 1 property (garage) on Langley Hall Road; 9 properties (internal) on Swanswell Road; 1 property (garage) on Swanswell Road (p41)</p></div></div></body></div>`)[0];

                var html_cc3184719ec9b2f55a8387d4c5d86a54 = $(`<div id="html_cc3184719ec9b2f55a8387d4c5d86a54" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cheswick Green</h1><div class="nugget-popup"><p>Key routes in and out of Cheswick Green were impassable, restricting movement until flood waters subsided. (p5)</p></div><div class="nugget-popup"><p>On 27 May 2018 flooding from the River Blythe and overland surface water caused internal and external flooding across the village, with multiple properties affected around Coppice Walk and Tanworth Lane. Highways were made impassable in places and back gardens were reported underwater. [IMG,TAB,PAG] (p23)</p></div><div class="nugget-popup"><p>River Blythe overtopped its normal channel in the Coppice Walk area: a single property flooded to the south of Tanworth Lane and internal and external flooding of multiple properties was reported along Coppice Walk and Tanworth Lane. Residents reported a wave of water arriving after the rainfall stopped (possibly linked to the canal). Mount Brook flooding caused external flooding of back gardens on Saxon Wood Road and Willow Drive and internal property flooding east of the Coppice Walk road bridge. The highway was flooded/impassable at locations described. [IMG] (p24)</p></div><div class="nugget-popup"><p>Properties in Coppice Walk (Cheswick Green) were flooded when intense rainfall and elevated flows in the Mount Brook / River Blythe system caused attenuation basins to overtop and river levels to rise, sending water into the residential area. [TAB] (p25)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>12 properties internally flooded; 10 properties externally flooded; 1 garage flooded [IMG,TAB,PAG] (p23)</p></div><div class="nugget-popup quant"><p>1 property [IMG] (p24)</p></div></div></body></div>`)[0];

                var html_7e412fcc5d8de3acfafa1441998cf5f4 = $(`<div id="html_7e412fcc5d8de3acfafa1441998cf5f4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Dickens Heath</h1><div class="nugget-popup"><p>Key routes in and out of Dickens Heath were impassable, restricting movement until flood waters subsided. (p5)</p></div><div class="nugget-popup"><p>Area was the subject of a Section 19 investigation by the Lead Local Flood Authority following the flooding event on 27 May 2018. (p7)</p></div><div class="nugget-popup"><p>The village area (Beech Lane and Rumbush Lane) was affected by flooding on 27 May 2018 and is the subject of a Section 19 investigation. [TAB] (p25)</p></div><div class="nugget-popup"><p>Surface water and overland flows and overloaded/blocked sewers caused flooding across the Beech Lane / Rumbush Lane area of Dickens Heath on 27 May 2018. Reports described flooding to the fronts of properties (including properties overlooking Dickens Heath Road and on Rumbush Lane) and flooding of the highway. Balancing ponds were observed at or near capacity; some land slips and embankment damage to the canal were reported elsewhere in the area. Overall internal flooding affected residential properties and garages. [IMG,TAB,PAG] (p26)</p></div><div class="nugget-popup"><p>Properties and highways in the Dickens Heath area were affected &mdash; properties overlooking Dickens Heath Road had flooding at their fronts and the highway was flooded; properties on Rumbush Lane also had floodwater at their fronts. [IMG,PAG] (p27)</p></div><div class="nugget-popup"><p>The Beech Lane / Rumbush Lane area experienced surface water/urban flooding on 27 May 2018, causing blocked highway gullies and prompting cleansing, CCTV inspection of highway drainage assets and mapping updates by the highway authority. [TAB] (p28)</p></div><div class="nugget-popup"><p>The Dickens Heath area experienced multiple flood impacts across the village: internal flooding to properties, external flooding, flooded highways (including Mereways and Cornwood Lane), watercourses overtopping and canal&ndash;related flooding affecting properties. The attenuation feature was inspected and reported not to have flooded. [IMG,TAB,PAG] (p29)</p></div><div class="nugget-popup"><p>Area experienced surface water flooding in the carriageway (Mereways and Cornwood Lane) and canal&ndash;related flooding (Stratford&ndash;upon&ndash;Avon Canal overtopping near Waters Edge/Waterside) that caused internal property flooding and contributed additional flows in the River Blythe; blocked drains were raised as a local concern. [IMG,PAG] (p30)</p></div><div class="nugget-popup"><p>Dickens Heath and the surrounding area experienced flooding during the May 2018 event (blocked drains, sewer surcharge and canal surge effects). In response, modelling of the area has been commissioned and inspections of local watercourses have been carried out to identify remedial options and potential additional attenuation. [TAB,PAG] (p31)</p></div><div class="nugget-popup"><p>The Tythe Barn Lane area of Dickens Heath experienced flooding from surface water/overland flow, an over&ndash;loaded sewer/highway drainage system and an out&ndash;of&ndash;bank ordinary watercourse. Multiple properties were internally flooded and local land and highway were inundated. [IMG,PAG] (p32)</p></div><div class="nugget-popup"><p>Area&ndash;level impacts around Tythe Barn Lane where highway drainage and foul sewer surcharge caused internal property flooding; canal water level may have restricted sewer outfall, worsening local flooding. [IMG] (p33)</p></div><div class="nugget-popup"><p>Surface water at the eastern end of Tythe Barn Lane discharged into the Stratford Upon Avon Canal; the canal&#8217;s elevated water level during the flood may have submerged the outfall, contributing to local flooding. The culvert under Tythe Barn Lane has been identified for capacity assessment. [TAB] (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>9 properties internally flooded; 4 garages flooded [IMG,TAB,PAG] (p26)</p></div><div class="nugget-popup quant"><p>13 properties internally flooded; 4 properties externally flooded; 1 garage flooded [IMG,TAB,PAG] (p29)</p></div><div class="nugget-popup quant"><p>100 properties [IMG,PAG] (p30)</p></div><div class="nugget-popup quant"><p>5 properties internally flooded; 1 garage flooded [IMG,PAG] (p32)</p></div></div></body></div>`)[0];

n to protect dam integrity. [TAB] (p45)</p></div><div class="nugget-popup"><p>Although the lakes themselves did not flood, intense runoff overwhelmed feeder systems; embankment was damaged by water flowing down Malt House Lane spilling to Valley Road, causing two landslips on the embankment that were covered with tarpaulin to protect dam integrity. [TAB] (p48)</p></div></div></body></div>`)[0];
