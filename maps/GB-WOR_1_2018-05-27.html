                var html_223b8c99ad23ea392f9e2b3eb780147d = $(`<div id="html_223b8c99ad23ea392f9e2b3eb780147d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hollywood</h1><div class="nugget-popup"><p>Surface water and watercourse flooding inundated residential areas and local businesses; infrastructure suffered relatively minor impacts while homes and businesses experienced severe damage and disruption. [PAG] (p3)</p></div><div class="nugget-popup"><p>An extremely intense rainfall event on 27th May 2018 produced surface water/flash flooding across Hollywood (part of the wider Wythall parish), triggering a multi&ndash;agency response and recovery effort. [PAG] (p6)</p></div><div class="nugget-popup"><p>On 27th May 2018 extremely intense rainfall overwhelmed highway drains and sewer infrastructure; roads became surface&ndash;water flow paths with deep pooling in low spots. Local watercourses were quickly overwhelmed, overtopped and backed up where culverts, fences or garages restricted flow. In most locations water levels fell quickly but in a small number of locations water remained high for an extended period, indicating drainage issues. [IMG] (p7)</p></div><div class="nugget-popup"><p>The settlement experienced flooding that required establishment of an emergency response phone line, on&ndash;site advice/support (including at the Wythall Hub), assistance with removal of damaged goods, repair of damaged highways and sweeping of footways, and extensive inspection and surveying of drainage, sewers and local watercourses as part of the recovery and investigation. (p10)</p></div><div class="nugget-popup"><p>Settlement affected by the flood which prompted watercourse inspections and clearance, sewer and highway drainage responses, removal of a collapsed wall from Hollywood Brook, and subsequent drainage/highway remedial works. (p11)</p></div><div class="nugget-popup"><p>Surface water flooding affected the village on 27 May 2018, impacting local drainage and communities and prompting the investigation and recommendations (including investigation of upstream attenuation and installation of monitors). [TAB] (p13)</p></div><div class="nugget-popup"><p>Flooding associated with the Hollywood Brook and surface water runoff affected the community in Hollywood on 27th May 2018, causing property flooding, community disruption and resident health/welfare concerns that prompted recommendations for attenuation areas, monitoring, culvert/trash&ndash;screen improvements and property flood resilience measures. [PAG] (p14)</p></div><div class="nugget-popup"><p>An unprecedented short&ndash;duration rain storm on 27 May 2018 overwhelmed drainage and local watercourses, causing severe surface water / flash flooding that was described as extremely significant and devastating to the community. Residential drainage and watercourse infrastructure, although generally in good order, were overwhelmed; the lack of adequate space for water in period residential developments contributed to the scale of impact. Emergency response and ongoing recovery were reported as good and speedy. [PAG] (p16)</p></div><div class="nugget-popup"><p>Flood flow routes concentrated through the central and eastern residential core of Hollywood. Multiple overland flow entry and exit points were identified at the settlement periphery; water routed from higher ground in the north and east toward lower&ndash;lying south and west, causing surface water to flow through residential streets and along major/minor roads. [IMG] (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than 300 residential properties and businesses (combined across Hollywood and parts of Wythall) [PAG] (p3)</p></div><div class="nugget-popup quant"><p>over 1,000 topographic levels surveyed; two advice and support drop&ndash;in sessions organised (p10)</p></div><div class="nugget-popup quant"><p>in excess of fifteen million pounds [PAG] (p16)</p></div></div></body></div>`)[0];
                popup_f0d5af075c7f0c1b2ef8d86a8460a9ae.setContent(html_223b8c99ad23ea392f9e2b3eb780147d);

                var html_eb0f73a622382652c424dd8cf44348d7 = $(`<div id="html_eb0f73a622382652c424dd8cf44348d7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wythall</h1><div class="nugget-popup"><p>Parts of the wider Wythall parish experienced surface water and watercourse flooding causing severe impacts to residential properties and businesses and disruption to the community; some infrastructure experienced relatively minor impacts. [PAG] (p3)</p></div><div class="nugget-popup"><p>Parts of the wider Wythall parish were affected on 27th May 2018 when intense rainfall overwhelmed drains and sewers, producing surface&ndash;water flow along roads and causing local watercourses to come out of bank and back up; some locations experienced prolonged high water indicating local drainage constraints. [IMG] (p7)</p></div><div class="nugget-popup"><p>The wider Wythall parish was struck by the same unprecedented short&ndash;duration rain storm on 27 May 2018; drainage and watercourse networks were overwhelmed causing surface water / flash flooding across the parish. The absence of adequate space for water in residential developments in the area contributed to the extent of flooding. Recovery efforts and agency response were reported positively. (p16)</p></div><div class="nugget-popup"><p>Local community support and recovery activities were activated (hub staffed, sandbags deployed, properties/households visited by officers and councillors) in response to flooding impacts. [TAB,MUL] (p20)</p></div><div class="nugget-popup"><p>A local response hub in Wythall was established and staffed (hub staffed until Saturday 2 June) to support residents affected by the flooding from the 27 May 2018 event. (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than 300 residential properties and businesses (combined across Hollywood and parts of Wythall) [PAG] (p3)</p></div><div class="nugget-popup quant"><p>in excess of fifteen million pounds (p16)</p></div></div></body></div>`)[0];
