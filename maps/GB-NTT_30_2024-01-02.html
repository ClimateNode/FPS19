                var html_c28c721bafacb23887f9febbd7017ba7 = $(`<div id="html_c28c721bafacb23887f9febbd7017ba7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Newark and Sherwood</h1><div class="nugget-popup"><p>Contains the village of Farndon, which is the subject of this Section 19 investigation following flooding associated with Storm Henk on 2 January 2024. (p1)</p></div><div class="nugget-popup"><p>An area of Newark within the Newark and Sherwood district suffered internal flooding (internal property flooding). The report notes this adjacent area is relevant to nearby Farndon and to wider mitigation considerations. (p5)</p></div><div class="nugget-popup"><p>Communities in the district experienced flooding that required evacuation support, delivery of flood protection equipment (aqua sacs), provision of emergency accommodation, in&ndash;person visits to at&ndash;risk communities, and post&ndash;flood cleanup of roads, paths and removal of bulky waste from flooded homes. Council staff visited affected individuals to identify humanitarian needs and arrange assistance. (p7)</p></div></div></body></div>`)[0];

                var html_5d30f5af0b30c5dcbdafec386d431e7c = $(`<div id="html_5d30f5af0b30c5dcbdafec386d431e7c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Farndon</h1><div class="nugget-popup"><p>Subject of a Section 19 investigation into flooding associated with Storm Henk; the report context links the village to the heavy rain and countywide flooding on 2 January 2024. [PAG] (p1)</p></div><div class="nugget-popup"><p>Farndon village was the subject of the Section 19 investigation into the flood event on 2 January 2024; the village experienced flooding linked to heavy rainfall from Storm Henk (maps and risk outputs for Farndon are presented in the report). [IMG,PAG] (p2)</p></div><div class="nugget-popup"><p>Predicted river (fluvial) flood risk concentrated along the River Trent extending into northern and western parts of Farndon; most of the village lies in Flood Zone 2 (moderate risk). Surface water flood mapping also shows medium&ndash;high surface water risk affecting built&ndash;up areas and roads. Figure 5 is stated to show areas affected by internal flooding within the area. [IMG] (p3)</p></div><div class="nugget-popup"><p>Internal flooding occurred in parts of the village; properties, open spaces and public highways were flooded. Flooding was concentrated in two residential clusters (northwest and southeast) as shown on the map. [IMG,PAG] (p4)</p></div><div class="nugget-popup"><p>Riverside properties in Farndon were at risk from River Trent flooding. Staff visited impacted communities and vulnerable individuals; many residents were helped to evacuate their homes, were provided emergency accommodation when necessary, and aqua sacs were delivered. The council carried out cleanup of roads/paths and removal of bulky waste as the event moved from surface water risk to continued river flooding risk. (p7)</p></div><div class="nugget-popup"><p>Community affected by flooding associated with the River Trent; local authority coordinated in&ndash;person visits to high&ndash;risk communities and has supported restocking of community aqua sac stores following the flood. Severn Trent Water investigations for the area indicate River Trent floodwater entered and overwhelmed the sewer network. (p8)</p></div></div></body></div>`)[0];
