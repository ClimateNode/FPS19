                var html_3e76a19157ecda54c08d46cf7d10ac0c = $(`<div id="html_3e76a19157ecda54c08d46cf7d10ac0c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>A37 at Wraxall</h1><div class="nugget-popup"><p>Flood water on the A37 carriageway. SCC and landowners cleared the culvert inlet and outlet and SCC removed up to 450 mm of silt from the culvert build&ndash;up, which improved water flow through the culvert and provided relief to flood water on the highway, reducing the threat of flooding to nearby property. SCC also removed a willow tree above the culvert's inlet at the Lye Lane junction with the A37. Ditches adjacent to the A37 (north and south bound) between the property known as Coppits and the junction for Stone required considerable clearing and an annual maintenance programme was recommended. A 150 mm pipe running under the north&ndash;bound carriageway (approx. 70 m south of Leighbridge Lodge) was suspected by residents to be blocked; SCC arranged CCTV survey and jetting (works to be completed in 2016/17). (p14)</p></div></div></body></div>`)[0];

                var html_6d1df54a3b5e0d7b010af2a335279dfe = $(`<div id="html_6d1df54a3b5e0d7b010af2a335279dfe" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1>Lye Lane, East Pennard</h1><div class="nugget-popup"><p>The flood event originated at the A37 junction with Lye Lane; surface water flooding from this location was central to the incident which directly affected four properties and prompted local correspondence and concern. [PAG,IMG] (p8)</p></div><div class="nugget-popup"><p>The culvert at the A37 / Lye Lane junction acted as a pinch point during heavy rainfall: inlet/outlet obscured by dense vegetation and ~300mm silt build&ndash;up (≈25% capacity reduction), impeding flow and contributing to highway flooding and risk to nearby properties during the event. Subsequent clearance of vegetation, silt (up to 450mm cleared) and removal of a willow reduced flood threat and improved flow. [PAG] (p13)</p></div></div></body></div>`)[0];

                var html_d4c9757f59bb25683495134864e27747 = $(`<div id="html_d4c9757f59bb25683495134864e27747" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wraxall</h1><div class="nugget-popup"><p>Area south of Wraxall: four properties were internally flooded to depths up to 300 mm; the highway was flooded to depths up to 400 mm. (p4)</p></div><div class="nugget-popup"><p>The A37 at the junction with Kilkenny Lane (in Wraxall) is described as a low point where catchment flows combine and cross the road. Highway drainage in South Wraxall is noted as susceptible to flooding and is scheduled for gully cleansing according to flood susceptibility. [PAG,IMG] (p9)</p></div><div class="nugget-popup"><p>Part of the area affected by the exceptional rainfall event on 2016&ndash;06&ndash;17; residents cooperated with the investigation and experienced flooding from rapid intense rainfall on saturated ground. (p13)</p></div></div></body></div>`)[0];
