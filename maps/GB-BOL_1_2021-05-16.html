                var html_1c9854f0250f1dc361d53ace281baacb = $(`<div id="html_1c9854f0250f1dc361d53ace281baacb" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Horwich Golf Club</h1><div class="nugget-popup"><p>Surface water / overland flows were observed across the approximately 10&ndash;hectare catchment, draining to a privately owned culvert inlet at the rear of St John&#8217;s Church and then conveyed in a culvert southwest under private property, Chorley New Road and the Horwich Loco Works site to connect to the Nellies Clough watercourse. [IMG] (p24)</p></div><div class="nugget-popup"><p>The Horwich Golf Course west catchment produced significant overland flows during the event; runoff issued from the golf course onto Victoria Road when culvert capacity was exceeded, contributing to downstream internal flooding. [IMG] (p25)</p></div><div class="nugget-popup"><p>Overland flow from the golf course catchment and an overwhelmed culvert inlet (at the rear of St Johns Church on the course) contributed to increased overland flow and downstream internal flooding. [PAG] (p26)</p></div><div class="nugget-popup"><p>Surface water overland flows were observed originating within the Horwich Golf Club East catchment; runoff drained to a privately owned culvert inlet at the rear of Middlewich Close and entered a culverted watercourse that conveys flow southwest toward Nellies Clough. [IMG] (p27)</p></div><div class="nugget-popup"><p>Significant water flows were observed issuing from the Golf Course site onto neighbouring land, initiating overland flow paths that entered the College Drive development, affected the rear of properties on Middlewich Close, reached Victoria Road and contributed to downstream highway damage (Abernethey Street) and property flooding at Chorley New Road. [IMG] (p28)</p></div><div class="nugget-popup"><p>Drainage infrastructure on their land (including culvert inlets) must be adequately maintained and constructed to current best practice so that drainage is operational and to reduce the risk of local flooding. (p65)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>12 commercial premises; 1 school building [IMG,PAG] (p25)</p></div><div class="nugget-popup quant"><p>12 commercial premises (including 1 school building) [PAG] (p26)</p></div><div class="nugget-popup quant"><p>12 properties; 3 commercial premises; 1 school building [IMG] (p28)</p></div></div></body></div>`)[0];

                var html_0b86b458b43ad75a95bc084048a54c83 = $(`<div id="html_0b86b458b43ad75a95bc084048a54c83" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Loco Works</h1><div class="nugget-popup"><p>The culverted watercourse that drains the Horwich Golf Course West catchment runs southwest and connects to Nellies Clough within the Loco Works / industrial estate. The published plan shows predicted surface water flooding and the route of observed overland flows reaching the Loco Works / Horwich Loco Industrial Estate, indicating the estate was on the flow route and affected by surface water/river&ndash;related flooding during the event. [IMG] (p24)</p></div><div class="nugget-popup"><p>A partial blockage of a culvert was identified on land at the former Horwich Locomotive works site caused by debris from the storm; the Environment Agency undertook works to partially relieve this blockage. (p58)</p></div></div></body></div>`)[0];

                var html_3109921c274c7a5fef646a7710260075 = $(`<div id="html_3109921c274c7a5fef646a7710260075" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Chorley New Road Primary School</h1><div class="nugget-popup"><p>School received major internal flooding during the intense thunderstorm. (p10)</p></div><div class="nugget-popup"><p>Extensive flooding to the ground floor caused considerable damage. A significant component was backflow from the combined sewer in Chorley New Road into the school via toilets; overland flow on the road outside also converged on the school and may have entered via doorways. No anti&ndash;flood valve was fitted to the foul connection between the school and the main sewer. (p29)</p></div><div class="nugget-popup"><p>Backflow from the combined foul&ndash;and&ndash;surface sewer rose through the school&#8217;s foul connection and caused internal flooding. Overland flow on the road outside converged near the school and may have entered via doorways, contributing to the flooding. No anti&ndash;flood valve was fitted on the school&#8217;s foul connection. (p30)</p></div><div class="nugget-popup"><p>Sewer flows contributed to flooding at Chorley New Road Primary School and Medway Drive as intense surface water overland flows overwhelmed drainage; the report recommends drainage improvements at the junction of Chorley New Road and Haslam Hall Mews to reduce highway flooding and prevent overflows reaching downstream properties. (p53)</p></div><div class="nugget-popup"><p>Highway drainage on Chorley New Road outside the school was identified as having insufficient capacity during the event, creating overland/surface water flows that interacted with the sewer network and exposed the school to the risk of sewer flooding. The school was advised to install an anti&ndash;flood valve on the foul sewer connection to reduce this sewer flooding risk. [TAB] (p61)</p></div><div class="nugget-popup"><p>Risk of sewer (foul) flooding associated with the foul sewer connection was identified; owners are advised to install an anti&ndash;flood valve to reduce this risk. (p65)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 commercial property with major internal flooding (p10)</p></div></div></body></div>`)[0];

                var html_bb4505ad187c0f7fc88de84c7cf171d2 = $(`<div id="html_bb4505ad187c0f7fc88de84c7cf171d2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Chorley New Road, Horwich</h1><div class="nugget-popup"><p>Large overland flows through the urban area parallel to the north east of Chorley New Road overwhelmed culverted watercourses and caused flooding to properties. (p3)</p></div><div class="nugget-popup"><p>Road flooded to depths that prevented vehicle passage, causing traffic disruption. (p10)</p></div><div class="nugget-popup"><p>Sections of Chorley New Road experienced concentrated surface&ndash;water / flash flooding during the intense thunderstorms on 16 May 2021, with high&ndash;risk zones shown on the map and flooding reported on main carriageways and junctions. [IMG] (p17)</p></div><div class="nugget-popup"><p>Overland flow from the overwhelmed culvert and upstream catchment pooled on the flatter land at Chorley New Road; downstream of this area the overland flow contributed to internal flooding of commercial and residential properties. (p25)</p></div><div class="nugget-popup"><p>Flows pooled on the flatter land at Chorley New Road where they merged with other flows, resulting in property flooding downstream. (p28)</p></div><div class="nugget-popup"><p>Overland flow reached Chorley New Road and a limited&ndash;capacity combined sewer in Chorley New Road rose during the event, contributing to backflow and flooding impacts in the vicinity (including into the nearby school). (p29)</p></div><div class="nugget-popup"><p>Overland flow passed across Chorley New Road and across the adjacent primary school site, contributing to downstream property flooding. (p32)</p></div><div class="nugget-popup"><p>Culverts from the Cedar Avenue catchments run beneath or along Chorley New Road and the mapped/observed overland flow routes follow road corridors; during the 16th May 2021 event overland flows were routed along/adjacent to this road corridor and conveyed via culverts toward Moor Platt Clough (some uncertainty in the text as flooding on the road is indicated by mapped flow routes rather than an explicit statement). (p37)</p></div><div class="nugget-popup"><p>Overland flow from blocked channels and culverts pooled on Chorley New Road and contributed to internal flooding of nearby industrial premises. (p38)</p></div><div class="nugget-popup"><p>Overland flow from Austins Lane ran onto Chorley New Road and contributed to the flooding of numerous industrial premises along the route. (p42)</p></div><div class="nugget-popup"><p>External flooding occurred in the Chorley New Road area; a post&ndash;event CCTV inspection indicated tree roots and other faults in a section of a privately owned watercourse contributed to the flooding. (p48)</p></div><div class="nugget-popup"><p>Junction (Chorley New Road and Haslam Hall Mews) identified for drainage improvements to reduce highway flooding and to prevent large overflows that could result in flooding to properties immediately downstream. (p52)</p></div><div class="nugget-popup"><p>Drainage failures at the junction leading to highway flooding; recommendation to make improvements to drainage at the junction to reduce flood risk to the highway and nearby properties. [TAB] (p61)</p></div><div class="nugget-popup"><p>Highway drainage on Chorley New Road (between Telford Street and Victoria Road) had insufficient capacity during the 16th May 2021 event, causing highway surface water flooding outside the school and resulting in highway drainage flows entering the sewer network; report recommends increasing drainage capacity and removing highway drainage from the sewer. (p62)</p></div><div class="nugget-popup"><p>Floodwater covered the entire road surface at the junction, with fast&ndash;moving, turbulent flow making the junction impassable and creating hazardous conditions for vehicles and pedestrians. Buildings and parked vehicles at the junction were partially submerged and access was disrupted. [IMG] (p79)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>around 0.4 m deep (p10)</p></div><div class="nugget-popup quant"><p>12 commercial premises; 1 school building; 3 residential properties (p25)</p></div></div></body></div>`)[0];

                var html_923629c86111a1ab51d8bc65d9e6718c = $(`<div id="html_923629c86111a1ab51d8bc65d9e6718c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lostock Lane, Horwich</h1><div class="nugget-popup"><p>Properties at these locations experienced significant inundation during the event, with floodwater entering buildings to substantial depth. (p3)</p></div><div class="nugget-popup"><p>Observed overland flows and predicted surface&ndash;water flooding affected Lostock Lane as part of the mapped overland flow route through the developed catchment. (p44)</p></div><div class="nugget-popup"><p>Surcharging of the sewer and surface water flows (combined with sewage) caused internal flooding to properties and gardens; manhole overflows were observed (water spouting from manholes). Sewer surcharge forced water under the carriageway causing severe highway damage and closure of the road until emergency/temporary carriageway repairs were made. [IMG,PAG] (p45)</p></div><div class="nugget-popup"><p>Sewer capacity was exceeded causing surcharge and manholes to spout; water forced under the carriageway causing severe highway damage and closure of the road for several days until temporary carriageway repairs. Internal flooding to properties and external flooding to garages; at a few properties flooding reached up to 1 metre deep. Two properties were rendered uninhabitable and residents displaced. (p46)</p></div><div class="nugget-popup"><p>Flooding occurred from overland surface water and contributions from sewer flows. A gully inspection at Alexandra Road/Lostock Lane found 7 of 19 gullies full of debris, which reduced water entering the sewer and contributed to increased overland/highway flooding. [PAG] (p53)</p></div><div class="nugget-popup"><p>Gullies on the highway were obstructed (7 of 19 gullies full of debris), reducing flow into the sewer and contributing to increased overland flow on the road; the sag point in the highway had only a single gully, limiting drainage capacity and increasing highway flooding. (p54)</p></div><div class="nugget-popup"><p>Lostock Lane was identified as a high surface&ndash;water&ndash;risk location where highway and property flooding occurred/was a concern during the event; recommendations include reviewing sewer network capacity and making highway drainage improvements to reduce highway and property flooding risk. [TAB] (p61)</p></div><div class="nugget-popup"><p>High surface&ndash;water flood risk on the highway with potential to cause highway and property flooding; recommended highway drainage improvements to reduce risk. (p62)</p></div><div class="nugget-popup"><p>External and internal flooding incidents occurred at Lostock Lane associated with limitations in sewer pipework capacity. (p64)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>around 1 metre depth in some properties (p3)</p></div><div class="nugget-popup quant"><p>5 properties; road closed 2 days [IMG,PAG] (p45)</p></div><div class="nugget-popup quant"><p>5 properties; 2 properties; up to 1 metre deep (p46)</p></div></div></body></div>`)[0];

                var html_54d57effae75f9969f0e71ba62d9be67 = $(`<div id="html_54d57effae75f9969f0e71ba62d9be67" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Horwich</h1><div class="nugget-popup"><p>Flooding occurred at Horwich and Lostock. (p1)</p></div><div class="nugget-popup"><p>The eastern side of Horwich was heavily impacted by a thunderstorm on 16th May 2021 causing significant flash/surface&ndash;water flooding, traffic disruption and internal and external property flooding. The affected area (eastern Horwich / western Lostock) accounted for a total of 105 properties with some internal flooding. (p10)</p></div><div class="nugget-popup"><p>Local roads were inundated: Chorley New Road was flooded to around 0.4 m in places preventing vehicle passage. De Havilland Way at its junction with Mansell Way was flooded to around 0.75 metres, preventing vehicle passage and resulting in the northbound carriageway being closed for 24 hours due to deposits of debris. [IMG] (p11)</p></div><div class="nugget-popup"><p>Residential properties experienced internal flooding: some properties suffered major flooding (complete inundation of the whole ground floor) and others experienced minor internal flooding. Flooding affected an area of approximately 4 square kilometres with spatial clustering of affected properties (notably a cluster in the southwest). (p12)</p></div><div class="nugget-popup"><p>Area recorded lightning activity (1730&ndash;1745 BST) and experienced extremely intense rainfall and hail on 16 May 2021; associated flood damage and debris fields were observed within the area shaded as receiving the most intense rainfall. [PAG,IMG] (p18)</p></div><div class="nugget-popup"><p>Intense, highly localised rainfall on 16 May 2021 produced observed flood damage and debris fields in parts of Horwich (public photographs and video evidence). Radar and witness data indicate the area to the south&ndash;east of Horwich town centre received the heaviest rainfall, producing rapid surface water/flash flooding and associated damage. [PAG] (p19)</p></div><div class="nugget-popup"><p>Intense, localized heavy rainfall occurred to the south&ndash;east of Horwich town centre during the 6&ndash;hour period to 22:15 GMT on 16 May 2021 (radar shows a white/high accumulation area in that location). This intense rainfall is part of the meteorological conditions associated with the 16 May 2021 flood event affecting Horwich and Lostock. [IMG] (p20)</p></div><div class="nugget-popup"><p>Intense, localised rainfall and overwhelmed culverts caused overland flows that flooded properties and highways within the town as debris&ndash;blocked culverts forced water out of the drainage network. [IMG] (p22)</p></div><div class="nugget-popup"><p>Parts of Horwich experienced overland surface water flows derived from the Horwich Golf Course west catchment; impacts included overwhelmed culvert inlets, highway damage on Telford Street, pooling at Chorley New Road and downstream internal flooding to commercial and residential premises. [IMG,PAG] (p25)</p></div><div class="nugget-popup"><p>Surface water overland flows from the Horwich Golf Club East catchment entered a culverted watercourse and travelled southwest through residential and industrial areas (via Middlewich Close, under Chorley New Road and through the Horwich Loco Works site) into Nellies Clough, contributing to local urban flooding impacts. [IMG] (p27)</p></div><div class="nugget-popup"><p>Residents of Oakfield Close and Claypool Road (riparian owners) were advised to clear and improve the small watercourse at the rear of their properties to remove constraints to flow and ensure it remains free&ndash;flowing, indicating the watercourse caused or threatened localised flooding to rear gardens/properties. [IMG,PAG] (p40)</p></div><div class="nugget-popup"><p>Surface water and overland flooding on 16th May 2021 affected the Horwich area: observed overland flow routes converged toward the town centre and outlet, and predicted 1&ndash;in&ndash;100&ndash;year surface water flood zones extend into residential and business districts within Horwich. [IMG] (p41)</p></div><div class="nugget-popup"><p>The catchment within Horwich (approx. 33 hectares, predominantly developed with sewer drainage) produced overland flows and predicted surface&ndash;water flooding; the report highlights culvert inlet and debris&ndash;screen issues (St Leonard&#8217;s Avenue) and recommends inspection/maintenance and upstream structure monitoring to reduce debris during flood events. [IMG] (p44)</p></div><div class="nugget-popup"><p>Parts of Horwich (notably Lostock Lane within the catchment) experienced surface water and sewer flooding that led to internal flooding of properties and severe highway damage with road closure for repairs. [IMG] (p45)</p></div><div class="nugget-popup"><p>Area where multiple flooding incidents were reported and where a Forward Incident Officer was deployed on 16 May; subsequent clearance works (culvert inlets, gullies, highway debris) and inspections were carried out in the days after the event. (p56)</p></div><div class="nugget-popup"><p>Sites in Horwich experienced flooding during the 16 May 2021 event; the EA conducted topographical surveys to record flood levels at individual properties, visited affected streets (e.g. Sudbury Drive, Ashridge Close) to gather information, and CCTV inspection of Nellies Clough culvert identified a partial blockage on land at the former Horwich Locomotive works which EA partially relieved. Further culvert surveys were planned. (p58)</p></div><div class="nugget-popup"><p>On 16th May 2021 very intense rainfall produced rapid runoff from undeveloped land to the north&ndash;west of Horwich that overwhelmed existing drainage capacity. Transitions between open watercourses and piped drainage had inlet debris screens quickly blocked by washed&ndash;in debris, resulting in large overland flows from culvert inlets which entered properties and flooded roads. United Utilities attended properties that reported flooding in the days following the event and carried out CCTV inspections, finding no significant operational blockages that could have caused or contributed to the flooding. (p60)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>105 properties (p10)</p></div><div class="nugget-popup quant"><p>approximately 4 square kilometres; 3 properties (purple dots); 1 property (orange dot) (p12)</p></div><div class="nugget-popup quant"><p>12 commercial premises; 1 school building; 3 residential properties [IMG,PAG] (p25)</p></div><div class="nugget-popup quant"><p>5 properties; road closed 2 days [IMG] (p45)</p></div></div></body></div>`)[0];
                popup_a89d72ecfdc3b7c472100fd0cf8585f5.setContent(html_54d57effae75f9969f0e71ba62d9be67);

                var html_68557901e8deac1e1a4afc5d7b57d947 = $(`<div id="html_68557901e8deac1e1a4afc5d7b57d947" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lostock</h1><div class="nugget-popup"><p>Flooding occurred at Horwich and Lostock. (p1)</p></div><div class="nugget-popup"><p>The western side of Lostock was heavily impacted by the thunderstorm on 16th May 2021 producing significant flash/surface&ndash;water flooding, traffic disruption and reports of internal and external property flooding as part of the same affected area (eastern Horwich / western Lostock). (p10)</p></div><div class="nugget-popup"><p>The main area of flooding covered approximately 4 square kilometres. Properties experienced internal flooding, with locations mapped showing complete ground&ndash;floor inundation in some cases (major internal flooding) and minor internal flooding in others. (p11)</p></div><div class="nugget-popup"><p>Residential properties in Lostock were affected by flooding, shown on the plan of impacted properties. (p12)</p></div><div class="nugget-popup"><p>The Lostock area experienced extremely intense rainfall and associated surface&ndash;water / flash flooding on 16 May 2021. The reproduced surface&ndash;water risk plans and the rainfall analysis show medium to high risk zones across parts of Lostock, with flooding concentrated along low&ndash;lying streets and corridors (notably near Chorley New Road and De Havilland Way), affecting residential streets and local infrastructure. [IMG,PAG] (p17)</p></div><div class="nugget-popup"><p>Extremely intense convective rainfall (with hail) produced localized flash / surface&ndash;water flooding; post&ndash;event observations recorded flood damage and debris fields and photographic/video evidence locating the most intensely affected area within the red&ndash;shaded zone on the plan. [PAG] (p18)</p></div><div class="nugget-popup"><p>Parts of the Horwich and Lostock area experienced very intense, localised rainfall on 16 May 2021 (e.g. up to 38 mm in 60 minutes in the Horwich area), resulting in localized surface water and flash flooding and observed flood damage in the area. (p19)</p></div><div class="nugget-popup"><p>A sudden thunderstorm produced a large volume of runoff that overwhelmed multiple culvert inlets; debris&ndash;blocked culverts caused flow to bypass the drainage system and continue overland, resulting in flooding across the urban area including properties and highways. (p22)</p></div><div class="nugget-popup"><p>Overland flow routes and surface water flood extents in the Moor Platt Clough catchment converged through this area (the culvert inlet is at the junction in Lostock), indicating the locality experienced significant surface water/overland flooding during the storm. (p41)</p></div><div class="nugget-popup"><p>Flooding from Bessy Brook in the Lostock area (including Sudbury Drive / Ashridge Close) resulted in internal flooding to residential properties; additional external flooding occurred in the Chorley New Road / Links Road area, with CCTV evidence showing tree roots and faults in a privately owned watercourse contributed. [PAG] (p48)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>105 properties (p10)</p></div><div class="nugget-popup quant"><p>11 residential properties [PAG] (p48)</p></div></div></body></div>`)[0];
