                var html_177a5828a2f7f574f0addabc7eb04c53 = $(`<div id="html_177a5828a2f7f574f0addabc7eb04c53" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Sheerstone, Iwade</h1><div class="nugget-popup"><p>Internal flooding to residential properties; vehicles damaged and written off; Environment Agency carried out overpumping from the nearby watercourse as part of the response. [TAB] (p7)</p></div><div class="nugget-popup"><p>The river at the Sheerstone Road gauge reached a depth of 1.6 m (recorded at c.12:50), causing the Iwade Stream to flow out of bank through adjacent gardens and onto the road; properties on Sheerstone Road experienced internal flooding as part of the event. (p14)</p></div><div class="nugget-popup"><p>Water began to overwhelm the road culvert at Sheerstone; screen was inspected (found little debris) and a 6" pump was used to overpump from one side of the culvert to the other to manage flows. Photographs show muddy water and a partially blocked bar screen; images also show flooding to the front and rear of a property on Sheerstone Road. (p15)</p></div><div class="nugget-popup"><p>Floodwater inundated the front and rear of properties and the street; muddy water covered the carriageway and encroached onto driveways and patios, partially submerging vehicles and rendering the road impassable. (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8 properties; 3 cars [TAB] (p7)</p></div><div class="nugget-popup quant"><p>11 properties (across Sheerstone Road, Springvale and The Waterway); 1.6 m depth recorded at Sheerstone Road (p14)</p></div><div class="nugget-popup quant"><p>1 property (front and rear flooded) (p15)</p></div></div></body></div>`)[0];

way drainage network. (p35)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>13 properties (p29)</p></div></div></body></div>`)[0];

me locations. These works were performed as part of the response and recovery after the May 2018 flooding. [TAB] (p35)</p></div><div class="nugget-popup"><p>Intense rainfall and rapid runoff overwhelmed local drainage and watercourses causing flooding of properties and highways in Sittingbourne; the storm extremity at Sittingbourne was around a 1 in 55 year event. (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>18 properties (p21)</p></div><div class="nugget-popup quant"><p>6 reported occasions (see KCC records) [MUL] (p24)</p></div></div></body></div>`)[0];

                var html_54e9c281872ea0cee022a4f04fdb6742 = $(`<div id="html_54e9c281872ea0cee022a4f04fdb6742" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Iwade</h1><div class="nugget-popup"><p>Fluvial (river) flooding from the Iwade Stream caused internal flooding of properties in the village. High river levels rose rapidly during the storm, contributing to out&ndash;of&ndash;bank flow through gardens and onto roads and resulting in internal flooding of properties on Sheerstone Road, Springvale and The Waterway. [IMG] (p14)</p></div><div class="nugget-popup"><p>Road travel was made difficult by flooding (notably on the A2) with the public diverted onto country lanes; local culverts began to be overwhelmed requiring operational intervention (pumping and screen checks). (p15)</p></div><div class="nugget-popup"><p>Parts of the village lie within Flood Zone 3 adjacent to the main river and were exposed to flooding when very heavy rainfall in the Iwade catchment on 29 May 2018 generated high flows in the stream that exceeded capacity, causing inundation risk to residential and farmland areas along the watercourse. [IMG] (p18)</p></div><div class="nugget-popup"><p>Village inundated when the Iwade Stream flooded on 29 May 2018; local channel and culvert capacity within the village was exceeded and residents were affected, triggering local reporting and concern. [IMG] (p19)</p></div><div class="nugget-popup"><p>Parts of Iwade experienced surface water flooding linked to heavy rainfall and high flows in the Iwade Stream; Meadow Brown View and Purple Emperor Grove are given as affected locations within Iwade. (p21)</p></div><div class="nugget-popup"><p>Overland surface water flow from adjacent fields affected Meadow Brown View and breached a drainage planning condition; the outfall from the Wienerberger site lacked a required flow gauge (later installed in October 2018). (p38)</p></div><div class="nugget-popup"><p>Iwade experienced flooding from the intense storm runoff that overwhelmed drainage; the Environment Agency and KCC will explore flood risk management opportunities for Iwade. (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>11 properties; river level rose by approximately 2.0 m; peak 2.18 m [IMG] (p14)</p></div></div></body></div>`)[0];
