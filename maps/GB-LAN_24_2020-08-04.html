                var html_6ade9052dc7a155d333003e67e28e65d = $(`<div id="html_6ade9052dc7a155d333003e67e28e65d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Burrow Beck</h1><div class="nugget-popup"><p>Flows in Burrow Beck increased rapidly during heavy overnight rainfall and, aided by a series of channel obstructions, the river overflowed its banks. The overflow carried water onto Lentworth Road and into nearby homes. (p3)</p></div><div class="nugget-popup"><p>Overflowed its banks near Lancaster (reported as due to an obstruction), causing a localised flooding incident close to Hala. Multiple properties were flooded and emergency services evacuated residents and undertook pumping to reduce water levels; road closures were put in place. (p5)</p></div><div class="nugget-popup"><p>The main river Burrow Beck was carrying high volumes of storm water and its channel was obstructed by excessive debris downstream of a local pedestrian footbridge. The river flowed out of bank, across open grass and onto Lentworth Drive before entering nearby residential premises. (p6)</p></div><div class="nugget-popup"><p>On the night of 4&ndash;5 August 2020 an extremely heavy deluge overwhelmed the capacity of Burrow Beck. The river's channel capacity had been temporarily reduced by a collection of loose debris and, combined with very high flows, the river overflowed its banks and discharged into Lentworth Drive, causing flooding to nearby residential properties. Obstructions were urgently removed to restore flow. (p9)</p></div><div class="nugget-popup"><p>The watercourse at the location of the flooding incident; its conveyance function and maintenance were central to the event. The report highlights the need to respect channel capacity and avoid obstruction by loose debris, and describes Environment Agency maintenance activity on the channel in the reach involved in the incident. (p10)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 multi&ndash;storey residential properties; 10 domestic properties; around 50 people (p5)</p></div><div class="nugget-popup quant"><p>10 residential internal properties; 3 residential external properties (p6)</p></div><div class="nugget-popup quant"><p>2.6 km maintained section (p10)</p></div></div></body></div>`)[0];

                var html_50b94d978b46ae3c5f8907124cafea89 = $(`<div id="html_50b94d978b46ae3c5f8907124cafea89" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lentworth Drive, Bailrigg</h1><div class="nugget-popup"><p>Lentworth Drive in Lancaster was impacted by the flooding of 4/5 August 2020 and is the subject location of the Section 19 investigation. (p1)</p></div><div class="nugget-popup"><p>Following the river overflow, a temporary bund was installed along the boundary between the Lentworth Drive carriageway and the adjacent open land to provide a buffer against further river flooding; a permanent bund was later installed by the Environment Agency (2023). (p3)</p></div><div class="nugget-popup"><p>Homes on Lentworth Drive were flooded overnight as a result of intense rainfall on 4&ndash;5 August 2020. (p4)</p></div><div class="nugget-popup"><p>Burrow Beck overtopped/overflowed in the area between Newlands Avenue, Lentworth Drive and Whinfell Drive, causing localised inundation of nearby properties. Firefighters assisted moving ground&ndash;floor residents to safety and pumping efforts were undertaken; evacuations included residents from a care home to a temporary rest centre. Road closures were put in place and multi&ndash;agency response worked on reducing water levels; no injuries reported. (p5)</p></div><div class="nugget-popup"><p>Floodwater from Burrow Beck flowed out of bank and across open ground onto Lentworth Drive and then entered nearby residential premises. (p6)</p></div><div class="nugget-popup"><p>Burrow Beck overtopped its banks after an extreme deluge and, with channel capacity reduced by accumulated debris, flooded into residential properties on Lenthworth Drive; properties showed water marks and some subsidence and a temporary evacuation of residents was required. [IMG] (p8)</p></div><div class="nugget-popup"><p>Floodwaters from Burrow Beck overflowed into Lentworth Drive on the night of 4&ndash;5 August 2020 and entered local residential properties, resulting in the temporary evacuation of residents. Afterwards, obstructions were removed and a permanent bund was constructed east of Lentworth Drive to provide future protection. [IMG] (p9)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 multi&ndash;storey residential properties; 10 domestic properties; 50 people (p5)</p></div><div class="nugget-popup quant"><p>29 residents evacuated [IMG] (p8)</p></div></div></body></div>`)[0];
