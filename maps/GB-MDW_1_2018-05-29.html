                var html_e44cfc1be0bcbc11fc426e5afd3f41d2 = $(`<div id="html_e44cfc1be0bcbc11fc426e5afd3f41d2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Nelson Terrace, Chatham</h1><div class="nugget-popup"><p>The most extensive flooding occurred at Nelson Terrace, causing internal flooding to properties and resulting in displacement of residents from their homes. (p10)</p></div><div class="nugget-popup"><p>Nelson Terrace experienced flooding during the event; gullies were reported blocked (inspected 27 Feb 2018 but could not all be cleaned due to parked vehicles) and flooding at Nelson Terrace was driven by overland flow from Capstone Road. Subsequent cleaning of two out of four gullies was carried out in August 2018. (p12)</p></div><div class="nugget-popup"><p>Flooding at Nelson Terrace was caused by overland flow from Capstone Road; the historic valley watercourses are now part of an underground sewerage system that was not designed to convey surrounding land drainage, contributing to flooding and surcharge of the foul system. [PAG] (p13)</p></div><div class="nugget-popup"><p>A major surface water flood incident occurred at Nelson Terrace: council officers visited to establish causes and extent; a Community Impact Assessment was undertaken; follow&ndash;up site meetings with impacted residents were delayed because residents were unable to return to the properties for approximately six months. [PAG] (p14)</p></div><div class="nugget-popup"><p>Major surface water flood incident: properties were flooded, officers visited to establish causes and extent, a Community Impact Assessment was undertaken, residents were unable to return to properties for approximately 6 months; sandbags were provided and a rest centre put on standby; follow&ndash;up site meetings and advice on property&ndash;level protection measures were provided during recovery. [PAG] (p15)</p></div><div class="nugget-popup"><p>A flood incident at Nelson Terrace escalated to emergency status; communication failures meant the council was not immediately informed and partners responded according to their own internal procedures rather than a coordinated response. (p17)</p></div><div class="nugget-popup"><p>Highway flooding causing inundation of Nelson Terrace carriageway. [TAB] (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 6 months (residents unable to return) [PAG] (p14)</p></div></div></body></div>`)[0];

                var html_a0f6c09901dc6e24d40b37639c2423bf = $(`<div id="html_a0f6c09901dc6e24d40b37639c2423bf" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Capstone Road, Chatham</h1><div class="nugget-popup"><p>Overland flow from Capstone Road was observed to cause flooding at lower&ndash;lying Nelson Terrace. Hydraulic overloading occurred in the Capstone Road area causing water to be released laterally through the highway construction which lifted the road; ingress of surface water into the foul system caused the foul system to surcharge. [PAG] (p12)</p></div><div class="nugget-popup"><p>Hydraulic overloading of the sewer system in Capstone Road caused water pressure to be released laterally through the highway construction, lifting the road. Ingress of surface water into the foul sewer contributed to surcharge of the system. [PAG] (p13)</p></div><div class="nugget-popup"><p>Emergency survey of highways drainage infrastructure was carried out at Capstone Road after the flood event. A carriageway repair was undertaken. Southern Water CCTV surveys at Capstone Road identified a lining repair requirement at the junction with Hopewell Drive (works completed Oct&ndash;Nov 2018). Gully inspections were also carried out following the event. [TAB,PAG] (p15)</p></div><div class="nugget-popup"><p>Emergency survey of highways drainage infrastructure following the flooding event; carriageway repair carried out at Capstone Road; CCTV survey of several lengths of sewer identified a need for lining repair at the junction of Capstone Road and Hopewell Drive (another pipe constructed too close to the soffit, not causing obstruction to flow); lining works completed Oct&ndash;Nov 2018; less serious defects (e.g. cracking on pipe crown) recorded in Southern Water's asset database for future AMP planning. [PAG] (p16)</p></div><div class="nugget-popup"><p>Internal and external property flooding affecting properties on Capstone Road. [TAB] (p22)</p></div></div></body></div>`)[0];
