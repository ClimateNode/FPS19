                var html_4bd725c58a5d145c4760e7b62f96343a = $(`<div id="html_4bd725c58a5d145c4760e7b62f96343a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Grafton Road, Grafton Underwood</h1><div class="nugget-popup"><p>Flooding occurred at the junctions on Grafton Road (south at Warkton Road and north at Geddington Road). Water backed up at the junction with Geddington Road, causing road junction flooding; reverse flow flooded the rear garden and patio of a property (did not reach dwelling threshold); culvert blockages and inability of run&ndash;off to enter Alledge Brook led to manhole cover overtopping on the highway. (p10)</p></div><div class="nugget-popup"><p>Highway sections on Grafton Road were flooded at junctions with Geddington Road and with Warkton Road (junction with Geddington Road flooded to an unspecified depth; junction with Warkton Road flooded to an unknown depth). (p11)</p></div><div class="nugget-popup"><p>The highway drainage system and the culverts beneath the highway serving Alledge Brook at the junction of Grafton Road and Geddington Road did not operate satisfactorily, causing the road junction to flood. (p15)</p></div></div></body></div>`)[0];

                var html_a3c60c48e7e613947965512708fd5115 = $(`<div id="html_a3c60c48e7e613947965512708fd5115" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Grafton Underwood</h1><div class="nugget-popup"><p>Internal flooding of residential properties caused by overland flow of excess surface water following intense rainfall on a saturated catchment; drainage systems ineffective so water flowed over ground following natural contours into properties. [PAG,MUL] (p5)</p></div><div class="nugget-popup"><p>Intense, short&ndash;duration rainfall on a saturated catchment caused excess surface water to flow overland following natural contours into properties, resulting in internal flooding. Flooding was reported to have caused internal flooding of properties and had occurred on more than one occasion in the previous five years. [PAG] (p6)</p></div><div class="nugget-popup"><p>Internal flooding of properties: two properties had ground&ndash;floor internal living areas flooded by surface water overland flows; one property experienced a back&ndash;up of effluent into a ground&ndash;floor toilet (sewer/back&ndash;up). [MUL] (p8)</p></div><div class="nugget-popup"><p>Surface water run&ndash;off from agricultural land to the east flowed into rear gardens and into properties. Run&ndash;off from fields overtopped drainage ditches and flowed onto the highway at the junction of Warkton Road and Grafton Road. Water backed up at the junction of Grafton Road and Geddington Road causing flooding of the road junction and failure/damage to the tarmac footway. Reverse flow flooded the rear garden and patio of a property at the northeast of the village (did not reach the dwelling threshold). Culvert blockages in the highway at the junction were evidenced and culverts beneath Geddington Road operated unsatisfactorily, allowing water onto the highway. A property at the east had its conservatory flooded to a shallow depth and water flowed to the kitchen; works (trench, driveway reshaping) were carried out to divert flows. A property at the southeast experienced approximately 50mm of water in the kitchen (groundwater emergence) and temporary rear patio inundation; another southeast property had a ground&ndash;floor toilet flooded. [PAG] (p10)</p></div><div class="nugget-popup"><p>Residential properties in the southeast of the village were flooded: one property had groundwater emerge through weaknesses in the floor slab causing approximately 50mm of water in the kitchen and surface water runoff from fields to the east temporarily flooded the rear patio; another property experienced water backing up and flooding a ground floor toilet; the garden and patio of the property referenced in 3.3.2 flooded to a depth of approximately 4. [PAG] (p11)</p></div><div class="nugget-popup"><p>Properties in Grafton Underwood were flooded after intense, short&ndash;duration rainfall on a saturated catchment. Existing drainage systems and watercourses were unable to cope, causing water to flow into other areas and overwhelm local drainage infrastructure, resulting in flooding of properties. [PAG] (p14)</p></div><div class="nugget-popup"><p>Properties in the village were flooded after intense short&ndash;duration rainfall on a saturated catchment. Existing drainage systems and watercourses were unable to cope, causing water to flow into other areas and into properties; surface water and emergence of groundwater occurred within dwellings. (p15)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 properties [PAG,MUL] (p5)</p></div><div class="nugget-popup quant"><p>3 properties [PAG] (p6)</p></div><div class="nugget-popup quant"><p>three properties; two properties; one property [MUL] (p8)</p></div><div class="nugget-popup quant"><p>at least two residential properties; approximately 50mm of water in the kitchen of one property [PAG] (p10)</p></div><div class="nugget-popup quant"><p>approximately 50mm of water in the kitchen; approximately 4 (depth) for garden and patio [PAG] (p11)</p></div></div></body></div>`)[0];
