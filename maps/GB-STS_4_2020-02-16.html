                var html_3ec417105d10b7082c815f1c5c2b5a90 = $(`<div id="html_3ec417105d10b7082c815f1c5c2b5a90" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Full Brook</h1><div class="nugget-popup"><p>Overtopping and overland flows associated with the brook were reported: first reported overtopping at a footbridge; accumulation of flows behind a culvert (Wales Lane) that discharged as overland flow across Wales Lane; overland flow reaching Church Lane and Potters Way; flows accumulating at St James' Road culvert entrance and south of Church Lane; open channel overtopping of the left bank; impact noted at Efflinch Lane. (p4)</p></div><div class="nugget-popup"><p>Flooding from the Full Brook contributed to internal flooding of residential properties in Barton&ndash;under&ndash;Needwood on 16th February 2020; it is named among the brooks responsible for the approximately 69 internally flooded homes and for flooding of external garages, sheds and driveways. (p24)</p></div><div class="nugget-popup"><p>Flows rising and overtopping from Full Brook were identified as a primary driver of the flooding in Barton&ndash;under&ndash;Needwood on 16th February 2020, contributing to ingress into highway drainage and to property and highway flooding. (p25)</p></div><div class="nugget-popup"><p>Overtopping of the Full Brook resulted in flows overwhelming local culverts and producing flooding on Mill Lane and Mill Crescent on 16/02/2020, with runoff collecting in open land to the east of Mill Crescent. [PAG,IMG] (p32)</p></div><div class="nugget-popup"><p>Full Brook overtopped on 16 February 2020 following Storm Dennis rainfall. In&ndash;bank flows were unable to pass through the culvert beneath Efflinch Lane/Mill Lane (partially blocked), causing the brook to overtop its banks, flow across Efflinch Lane and drives of properties on Mill Lane, and direct flows southeast along Mill Lane toward Mill Crescent and adjacent open land. Overtopping and in&ndash;channel blockages contributed to surface water entering the local sewer network. [PAG,IMG] (p33)</p></div><div class="nugget-popup"><p>The Full Brook experienced out&ndash;of&ndash;bank flows that overtopped the channel and footpath, joined with out&ndash;of&ndash;bank flows from an unnamed tributary, and contributed to collection of floodwater behind Mill Crescent and to property flooding. Limited conveyance (including a 400mm siphonic culvert under the canal) caused water to back up into open space between Mill Crescent and the canal and contributed to property flooding at Lichfield Road where back&ndash;up occurred beneath the A38. (p34)</p></div><div class="nugget-popup"><p>Full Brook exceeded channel capacity and flowed out of bank, causing highway inundation, increasing surface water extent around Mill Lane/Mill Crescent and contributing to sewer system surcharge and internal property flooding. (p35)</p></div><div class="nugget-popup"><p>High flows (modelled peak) and reduced capacity at culverts and in&ndash;channel blockages likely caused out&ndash;of&ndash;bank flows that were routed along highways into properties; backing up of Full Brook flows may have exacerbated overtopping and directed water to low points. Ingress of Full Brook flows into the sewer system is reported as under investigation. (p37)</p></div><div class="nugget-popup"><p>Full Brook was identified in the investigation as having culvert capacity issues and being associated with sewer flooding problems; actions were recommended to address sewer flooding around Mill Lane and Mill Crescent following the February 2020 incident. [TAB,PAG] (p39)</p></div><div class="nugget-popup"><p>Sewer flooding problems were associated with the Full Brook, contributing to local sewer/sewerage flooding issues and prompting investigation of sewer capacity and potential sewer flooding. (p40)</p></div><div class="nugget-popup"><p>Full Brook (ordinary watercourse) experienced high flows; culvert impacts and potential backing&ndash;up from very high River Trent levels impeded discharge, contributing to out&ndash;of&ndash;bank flooding and internal flooding of nearby residential properties. (p42)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>69 residential properties (collective across the three brooks) (p24)</p></div><div class="nugget-popup quant"><p>2&ndash;year to 5&ndash;year peak flow (modelled); 2 culvert locations overwhelmed [PAG,IMG] (p33)</p></div><div class="nugget-popup quant"><p>69 residential properties (collective) (p42)</p></div></div></body></div>`)[0];

                var html_0f3bf9b1583fb8b929418ad6a32bd86d = $(`<div id="html_0f3bf9b1583fb8b929418ad6a32bd86d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Barton Brook</h1><div class="nugget-popup"><p>Flooding from Barton Brook contributed to internal flooding of residential properties in Barton&ndash;under&ndash;Needwood on 16th February 2020; it was one of the watercourses cited as causing the approximately 69 internally flooded homes and also led to flooding of external garages, sheds and driveways. (p24)</p></div><div class="nugget-popup"><p>Flows in the Barton Brook rose and overtopped, acting as a primary driver of flooding; culvert sections by the A38 required clearing to address the blockage/flow issues. (p25)</p></div><div class="nugget-popup"><p>Modelled rapid rise in Barton Brook flows during Storm Dennis (14&ndash;19 Feb 2020) with levels responding quickly then receding. Event magnitude was likely under&ndash;represented in the model because the catchment was already extremely saturated and baseflows were high. (p27)</p></div><div class="nugget-popup"><p>High flows in Barton Brook overtopped the channel as it entered Barton&ndash;under&ndash;Needwood around Park Road on 16/02/2020. Once out of bank, flows moved eastward through gardens, accumulated behind the Wales Lane culvert entrance and contributed to damage to garden fences and a front gate and to internal flooding of properties on Brookside Road. [IMG] (p28)</p></div><div class="nugget-popup"><p>Barton Brook overtopped at a footbridge on 16 February 2020 following Storm Dennis; out&ndash;of&ndash;bank flows moved eastward through gardens and across roads, caused internal flooding of properties (first reported at the footbridge between Fallowfield Drive and Brookside Road), knocked over fence panels, accumulated behind culvert entrances (notably Wales Lane) and discharged as overland flow across roads and into gardens. High Barton Brook levels were reported where it discharges into Barton&ndash;under&ndash;Needwood around Park Road. [PAG,IMG] (p29)</p></div><div class="nugget-popup"><p>Barton Brook flows exceeded channel and culvert capacity at multiple locations (including under Efflinch Lane, St James' Road, Wales Lane and Collinson Road), causing bank overtopping, overland flow across highways and accumulation of surface water at culvert entrances leading to local flooding. [IMG] (p30)</p></div><div class="nugget-popup"><p>Culvert geometry (two ~90&deg; bends) and restricted outlet reduced conveyance; losses at bends and restricted outlet forced floodwaters to mount banks at the culvert entrance, causing overtopping and directing flows toward nearby properties (including observed internal flooding of surrounding properties). Channel constrictions and potential blockages of multiple culverts contributed to impaired discharge. [PAG] (p31)</p></div><div class="nugget-popup"><p>Barton Brook overtopped and/or exceeded culvert capacity on 16/02/2020. Flows exceeded the culvert under Efflinch Lane (levels above the crown), caused overland flow across the highway, internally inundated properties on Efflinch Lane and to the south of Meadow Rise, knocked over a dwarf garage wall, caused floodwater on Potters Way and adjacent sports fields, and led to overflowing of the local fishing pond. Flows also overflowed the channel at the footbridge between Brookside Road and Fallowfield Drive and accumulated at St James' Road culvert entrance and south of Church Lane; culverts at Wales Lane, Collinson Road, St James' Road and Efflinch Lane may have been blocked or exceeded capacity. [PAG] (p32)</p></div><div class="nugget-popup"><p>Out&ndash;of&ndash;bank Barton Brook flows exceeded channel capacity, flowed across highways, reduced capacity for drainage discharge, and likely entered sewer assets causing surcharges that contributed to internal property flooding. (p35)</p></div><div class="nugget-popup"><p>The heavily culverted Barton Brook had limited capacity and experienced exceedance of culverts (downstream of Park Road); temporary blockages and very high River Trent levels prevented outfall, causing flows to back up and overtop the channel. Overtopping at culvert entrances and before footbridges produced overland flows across highways and through gardens, leading to internal flooding of properties. (p37)</p></div><div class="nugget-popup"><p>Barton Brook caused river flooding in central Barton; culvert capacity and sharp bends were identified as insufficient to convey Barton Brook flows and were highlighted as contributors to the February 2020 flooding. [TAB] (p39)</p></div><div class="nugget-popup"><p>High flows in the main river (Barton Brook) overtopped the channel and contributed to out&ndash;of&ndash;bank flooding that led to internal flooding of residential properties in Barton&ndash;under&ndash;Needwood; modelled peak flows and downstream impediment from high River Trent levels were identified as factors. (p42)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>69 residential properties (collective across the three brooks) (p24)</p></div><div class="nugget-popup quant"><p>approximately 450mm floodwater depth observed at the Wales Lane culvert entrance [PAG] (p31)</p></div><div class="nugget-popup quant"><p>69 residential properties (collective) (p42)</p></div></div></body></div>`)[0];

                var html_19f52d8ae38c2e91a16024ded6132c81 = $(`<div id="html_19f52d8ae38c2e91a16024ded6132c81" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Church Lane, Barton-Under-Needwood</h1><div class="nugget-popup"><p>Overland flow reached up to Church Lane (and Potters Way); flows accumulated south of Church Lane and at the St James' Road culvert entrance. The DRN record also notes a discrepancy involving Church Lane. (p4)</p></div><div class="nugget-popup"><p>Map and image description indicate observed surface water flow routes and reported sewer flooding concentrated near Church Lane during the same event, marking it as an area affected by surface water and reported sewer flooding. [PAG,IMG] (p29)</p></div><div class="nugget-popup"><p>Flows accumulated south of Church Lane at the culvert entrance and the adjacent open channel experienced left&ndash;bank overtopping, producing out&ndash;of&ndash;bank/overland flows into the area south of Church Lane. [IMG] (p30)</p></div><div class="nugget-popup"><p>Flood flows from Barton Brook overtopped/left the channel and were directed into gardens and properties on Church Lane, causing internal flooding of properties (some properties recorded internal flooding for the first time since 1961). (p31)</p></div></div></body></div>`)[0];

                var html_7ca3a9651f3be628fce5735a34edc97c = $(`<div id="html_7ca3a9651f3be628fce5735a34edc97c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wales Lane, Barton-Under-Needwood</h1><div class="nugget-popup"><p>Flows accumulated behind the Wales Lane culvert and discharged as overland flow across Wales Lane. (p4)</p></div><div class="nugget-popup"><p>Highway drainage on Wales Lane was overwhelmed by ingress of flows from Barton Brook and Full Brook and associated river flooding, resulting in flooded highway on 16th February 2020. (p25)</p></div><div class="nugget-popup"><p>Out&ndash;of&ndash;bank flows accumulated behind the Wales Lane culvert entrance, damaging garden fence panels and a front gate before discharging. (p28)</p></div><div class="nugget-popup"><p>Flows accumulated behind the Wales Lane culvert entrance and discharged as overland flow across Wales Lane, damaging garden fence panels and a front gate and causing internal flooding to properties on Wales Lane (depths described but specific values not given in the text). [PAG,IMG] (p29)</p></div><div class="nugget-popup"><p>The box culvert under Wales Lane is noted as a location that may have experienced blockage or exceeded capacity (it turns ~90&deg; twice), which could have restricted flow, caused backing up and contributed to spill/out&ndash;of&ndash;bank flows during the event &mdash; this is reported as a possible impact rather than a confirmed blockage. (p30)</p></div><div class="nugget-popup"><p>Box culvert geometry (two 90&deg; bends) and restricted outlet caused losses and banks to be mounted at the culvert entrance; observed floodwater depths of approximately 450 mm at the Wales Lane culvert entrance that internally affected surrounding properties. [PAG] (p31)</p></div><div class="nugget-popup"><p>Reported internal property flooding due to sewer floodwaters onto Mill Lane and adjacent properties. [PAG,IMG] (p33)</p></div><div class="nugget-popup"><p>Possible groundwater flooding from a raised water table may have contributed to the incident on Efflinch Lane; residents also reported potential internal sewer flooding (surcharge) affecting properties on Efflinch Lane. (p35)</p></div><div class="nugget-popup"><p>Combined sewer network surcharge caused a manhole to 'fountain' and discharge onto property drives on the east side of Efflinch Lane; additional sewer flooding further south potentially impacted properties. (p36)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 dwarf garage wall [IMG] (p30)</p></div></div></body></div>`)[0];

ll Lane; recommendations call for investigations and actions to reduce the possibility of sewer flooding in this location. [TAB] (p39)</p></div><div class="nugget-popup"><p>Reported sewer flooding occurred around Mill Lane; investigations and actions were recommended to reduce the possibility of further sewer flooding. (p40)</p></div><div class="nugget-popup"><p>Residential properties along Mill Lane were internally flooded when flows from overtopping watercourses (Barton Brook, Full Brook, Knoll Brook), combined with surface water and sewer flooding, flowed into low&ndash;lying areas and culvert entrances, causing internal property flooding. (p42)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 culvert locations overwhelmed [PAG,IMG] (p33)</p></div><div class="nugget-popup quant"><p>69 residential properties internally flooded across Barton&ndash;under&ndash;Needwood (including properties along Mill Lane, Mill Crescent, Lichfield Road and Rise) (p42)</p></div></div></body></div>`)[0];

n Mill Crescent were internally flooded as a result of out&ndash;of&ndash;bank flows from local watercourses and concurrent surface water/sewer flooding, with flows concentrating in low ground and at culverts. (p42)</p></div><div class="nugget-popup"><p>Flooding from sewer systems was reported around Mill Crescent; these sewer flooding incidents most likely resulted from ingress of river flows into sewers during the flood event. (p43)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>69 residential properties internally flooded across Barton&ndash;under&ndash;Needwood (including properties along Mill Lane, Mill Crescent, Lichfield Road and Rise) (p42)</p></div></div></body></div>`)[0];

ooding from the Knoll Brook during the February 2020 event; a reduction scheme was not operational during that flood. (p43)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 properties; one property (p35)</p></div></div></body></div>`)[0];

                var html_da3dfdcba4a5dea4e4b790e4e06bb000 = $(`<div id="html_da3dfdcba4a5dea4e4b790e4e06bb000" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Staffordshire</h1><div class="nugget-popup"><p>Across Staffordshire the existing public sewer and highway drainage networks (including combined, surface water and foul sewers) may be overwhelmed during large or prolonged storm events. Older sewers built to earlier, lower design standards can be unable to cope, leading to restricted flows or backing&ndash;up, surcharging to surface via manholes or drainage points, and surface water flooding affecting highways and properties. (p11)</p></div><div class="nugget-popup"><p>Highway drainage (gullies, channels and underground sewers/culverts) can be overwhelmed during heavy or prolonged rainfall or when blocked. When the carriageway cannot contain flows water can pond on the highway, overtop kerbs and spill onto adjacent land, entering properties that are at or below road level. Historic variations in sewer design and capacity mean some parts of the drainage network surcharge or are unable to accept highway runoff, contributing to property and highway flooding. [PAG] (p12)</p></div><div class="nugget-popup"><p>Widespread intense rainfall across the catchment on 15&ndash;16 February 2020 caused elevated river levels and contributed to flooding across the county, with soils already saturated and rivers high from Storm Ciara. [PAG] (p26)</p></div><div class="nugget-popup"><p>During Storm Dennis on 16 February 2020 a significant number of flooding incidents to properties and highways were recorded and reported to Staffordshire County Council, including the Barton&ndash;under&ndash;Needwood event where 69 residential properties were internally flooded. [PAG] (p42)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>69 residential properties [PAG] (p42)</p></div></div></body></div>`)[0];

                var html_8324830f34046559a616751feda99b9d = $(`<div id="html_8324830f34046559a616751feda99b9d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>East Staffordshire</h1><div class="nugget-popup"><p>Storm Dennis (16 February 2020) caused widespread flooding to properties and highways across East Staffordshire. The flooding generated 130 applications for grant support from residential and business properties and multiple areas experienced incidents in which five or more properties were internally flooded, meeting the criteria for a Section 19 investigation. (p6)</p></div><div class="nugget-popup"><p>Flooding across the borough on 16th February 2020: ESBC collected information from flooded residents to process Flooded Property Claims and administer grants. The DEFRA Property Flood Resilience grant scheme and ESBC provided grants to support property repairs following the February 2020 event. (p25)</p></div><div class="nugget-popup"><p>An exceedance event on 16 Feb 2020 caused river flooding from Barton Brook, Full Brook and Knoll Brook, together with surface water flooding and overwhelmed sewer drainage affecting Barton&ndash;under&ndash;Needwood within the district. (p37)</p></div><div class="nugget-popup"><p>Flooding incidents to properties and highways were recorded in the district; Barton&ndash;under&ndash;Needwood experienced internal flooding of residential properties following Storm Dennis and antecedent saturation from preceding storms. (p42)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>130 applications for grant support; five or more properties internally flooded (in multiple areas) (p6)</p></div><div class="nugget-popup quant"><p>130 applications; 86 properties; £370,840 (p25)</p></div><div class="nugget-popup quant"><p>69 residential properties (p42)</p></div></div></body></div>`)[0];

                var html_86c6406a73bf6fb2ada4f0c48f2dba14 = $(`<div id="html_86c6406a73bf6fb2ada4f0c48f2dba14" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Barton-Under-Needwood</h1><div class="nugget-popup"><p>Properties in Barton&ndash;under&ndash;Needwood experienced internal (property) flooding associated with Storm Dennis; the investigation focuses on flood extent, flow routes and causes for these internal flooding incidents. (p5)</p></div><div class="nugget-popup"><p>Flooding occurred in Barton&ndash;under&ndash;Needwood as a result of Storm Dennis; Staffordshire County Council investigated the identified extent, reported flow routes and potential causes of the event. (p6)</p></div><div class="nugget-popup"><p>The town centre of Barton experienced flooding on 16 February 2020; the event inundated the centre of Barton following heavy, persistent rainfall associated with Storm Dennis. (p16)</p></div><div class="nugget-popup"><p>The village experienced a flood incident referenced in the report (the February 2020 flood). [PAG] (p21)</p></div><div class="nugget-popup"><p>The village experienced multiple flood events: 50 properties flooded in August 1987; properties on Main Street were flooded by Knoll Brook (flood incident when the local mitigation was not fully operational); Barton Brook flooding in January 2013 and February 2014 impacted St Luke's Road; Full Brook overtopped in 2013 flooding gardens and drives; foul sewer flooding in the 2013 incident affected rear gardens on Mill Lane and Mill Crescent and entered properties via airbricks. [PAG,MUL] (p22)</p></div><div class="nugget-popup"><p>Multiple properties in Barton&ndash;under&ndash;Needwood reported internal flooding on 16 February 2020. The village has a history of notable flooding, including an event affecting 50 properties in August 1987. [PAG,IMG,MUL] (p23)</p></div><div class="nugget-popup"><p>Multiple properties in the village experienced internal flooding on 16th February 2020 from a combination of river flooding, surface water and overwhelmed sewer infrastructure. Garages, sheds and driveways were also flooded; floodwater reached just below the thresholds of additional properties. Some households had to move out because of flood damage and loss of electricity to ground floors. No commercial properties or critical infrastructure were inundated. [PAG] (p24)</p></div><div class="nugget-popup"><p>Included within the Barton&ndash;under&ndash;Needwood area that experienced river flooding from Barton Brook and Full Brook, surface water flooding and sewer&ndash;related flooding during the event. (p25)</p></div><div class="nugget-popup"><p>Intense, concentrated rainfall on 15&ndash;16 February 2020 (following saturated soils and high river levels from Storm Ciara) contributed to a flood event affecting Barton&ndash;under&ndash;Needwood, producing flood conditions in the village on/around 16 February 2020. [IMG,PAG] (p26)</p></div><div class="nugget-popup"><p>In Barton&ndash;under&ndash;Needwood rainfall from Storm Dennis increased Barton Brook watercourse levels and flows during 14&ndash;19 Feb 2020; modelled peak flow for the catchment occurred on 16 Feb and the event was exacerbated by an already saturated catchment and high baseflows. [IMG,PAG] (p27)</p></div><div class="nugget-popup"><p>High Barton Brook levels were reported where the brook first discharged into Barton&ndash;under&ndash;Needwood around Park Road on 16/02/2020; the brook overtopped and flows progressed downstream, contributing to internal flooding of Brookside Road properties. [IMG] (p28)</p></div><div class="nugget-popup"><p>Once Barton Brook went out of bank, prevailing topography directed flows into gardens and properties in the town; some properties experienced recorded internal flooding (noted as first time since 1961). [PAG] (p31)</p></div><div class="nugget-popup"><p>Areas of Barton (including Mill Lane, Mill Crescent and Lichfield Road) were affected by flooding associated with the Full Brook and an unnamed tributary, resulting in property flooding, overtopping of channels and remedial/ volunteer response actions. (p34)</p></div><div class="nugget-popup"><p>Multiple flood mechanisms affected Barton. Knoll Brook caused flooding along Main Street resulting in internal flooding of properties. Overland runoff from agricultural land northwest of Barton&ndash;under&ndash;Needwood caused internal flooding to one property on Main Street. Out&ndash;of&ndash;bank flows from Barton Brook and Full Brook exceeded channel capacity, flowed across highways and reduced the ability of drainage systems to discharge; this contributed to surface water and highway drainage impacts. Groundwater from a raised water table may also have contributed to flooding on Efflinch Lane. Ingress of brook flows into sewer systems is reported to have caused surcharging and internal sewer flooding in parts of the area. (p35)</p></div><div class="nugget-popup"><p>Flows from the overtopping Barton Brook (exceeding culverts downstream of Park Road) and surface water routed across highways and through gardens internally flooded properties in central Barton&ndash;under&ndash;Needwood. High River Trent levels caused Barton Brook to back up, worsening overtopping. Reports indicate sewer flooding occurred due to ingress of brook flows into the sewage system (under investigation by Severn Trent Water). (p37)</p></div><div class="nugget-popup"><p>Properties in Barton&ndash;under&ndash;Needwood (notably on Main Street) experienced internal flooding and local highway inundation when drainage and watercourse capacity were exceeded. [PAG] (p38)</p></div><div class="nugget-popup"><p>Central Barton&ndash;under&ndash;Needwood experienced river flooding caused by the Barton Brook during the 16 February 2020 flood incident. [TAB] (p39)</p></div><div class="nugget-popup"><p>Reported sewer flooding elsewhere in Barton&ndash;under&ndash;Needwood (localised sewer flooding incidents across the settlement were noted and investigations recommended). (p40)</p></div><div class="nugget-popup"><p>On 16 February 2020, high flows in Barton Brook, Full Brook and Knoll Brook, together with surface&ndash;water and sewer flooding following Storm Dennis, led to overtopping and flows that followed local topography into low&ndash;lying areas. Residential properties were flooded internally and properties along Rise, Mill Lane, Mill Crescent and Lichfield Road were affected. Culvert blockages and backwater effects from very high levels in the River Trent exacerbated out&ndash;of&ndash;bank flooding. (p42)</p></div><div class="nugget-popup"><p>Out&ndash;of&ndash;bank (river) flows were reported across Barton&ndash;under&ndash;Needwood; prevailing topography exacerbated flooding in the area. (p43)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>50 properties [PAG,MUL] (p22)</p></div><div class="nugget-popup quant"><p>50 properties (August 1987) [PAG,IMG,MUL] (p23)</p></div><div class="nugget-popup quant"><p>69 residential properties (internally flooded, collective figure for the village) [PAG] (p24)</p></div><div class="nugget-popup quant"><p>5 properties; 1 property (p35)</p></div><div class="nugget-popup quant"><p>69 residential properties (p42)</p></div></div></body></div>`)[0];
