ey Road, Kingswood Road and Hollinwell Avenue) [PAG] (p6)</p></div><div class="nugget-popup quant"><p>Part of 11 properties that experienced internal flooding on 17 June 2020. [PAG] (p7)</p></div><div class="nugget-popup quant"><p>11 properties flooded internally (across Sydney Road, Kingswood Road and Hollinwell Avenue) (p11)</p></div><div class="nugget-popup quant"><p>11 residential properties (across Sydney Road, Kingswood Road and Hollinwell Avenue) (p14)</p></div></div></body></div>`)[0];
