                var html_e71f826c8a9eee8cbdbe6d6748799090 = $(`<div id="html_e71f826c8a9eee8cbdbe6d6748799090" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Rotherham Metropolitan District</h1><div class="nugget-popup"><p>Heavy rainfall associated with Storm Babet led to raised river levels and surface water runoff across the borough. Council&ndash;monitored mobile pumps were used on 19&ndash;20 October and intermittently thereafter to control surface water levels, preventing surface water flooding on roads and impacts to drives and homes; Council staff and Fire & Rescue advised residents to evacuate as levels peaked. [PAG] (p11)</p></div><div class="nugget-popup"><p>Extensive surface water flooding across the borough affecting roads and properties; the Council operated 24/7 during the event to support residents, deliver sandbags, pump out properties, and clear blocked gullies and sewers. (p14)</p></div><div class="nugget-popup"><p>River levels were forecast to rise on the River Rother between Killamarsh and Rotherham, with flooding of low&ndash;lying land near the watercourse described as likely on 20/10/2023. (p45)</p></div><div class="nugget-popup"><p>Months of very wet weather left the catchment saturated, increasing overland flow and raising the water table. During 19 Oct 2023 &ndash; 21 Oct 2023 rivers over&ndash;topped their banks and groundwater reached the surface, causing flooding in the Rotherham area and triggering flood warnings. [IMG,PAG] (p63)</p></div><div class="nugget-popup"><p>Surface water flooding from Storm Babet caused internal flooding to a property in Kiveton Park (within Rotherham borough) due to a saturated catchment and excess surface water runoff. [IMG] (p90)</p></div><div class="nugget-popup"><p>The borough was heavily affected by internal flooding to properties and businesses. Internal flooding affected properties across the catchment, including concentrated impacts in the Catcliffe and Treeton area. (p129)</p></div><div class="nugget-popup"><p>Residential properties across the Rotherham area reported internal flooding during the event, including addresses in Catcliffe, Treeton, Kimberworth Park, Stone, Kiveton Park, Ravenfield and Laughton Common/Dinnington. [PAG] (p135)</p></div><div class="nugget-popup"><p>Multiple residential properties across the Rotherham borough (addresses listed on the page) experienced internal flooding. [PAG] (p136)</p></div><div class="nugget-popup"><p>Storm Babet and saturated catchments produced excess surface water runoff that overwhelmed drainage and watercourses across Rotherham, resulting in internal flooding of properties across the borough. [PAG] (p137)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 550 resident reports of flooding; over 5000 sandbags distributed; over 4 million litres of surface water over&ndash;pumped from Catcliffe (p14)</p></div><div class="nugget-popup quant"><p>1 property [IMG] (p90)</p></div><div class="nugget-popup quant"><p>182 properties; 9 businesses; 148 properties (Catcliffe and Treeton area) (p129)</p></div><div class="nugget-popup quant"><p>182 homes; 9 businesses [PAG] (p137)</p></div></div></body></div>`)[0];

                var html_174f1212eecccf0372d760dc727187cf = $(`<div id="html_174f1212eecccf0372d760dc727187cf" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Rother</h1><div class="nugget-popup"><p>High river flows produced seepage through vertical slots in the metal sheet piling at Catcliffe, led to water ponding on Orgreave Road and created a risk of the River Rother overtopping the defence wall; this made surface&ndash;water pumps ineffective at the site. [PAG] (p7)</p></div><div class="nugget-popup"><p>Water seeped through vertical slots in metal sheet piling at Catcliffe, ponding on Orgreave Road and causing surface water flooding; created a risk of overtopping the defence wall; river peak flow remained at its highest level late on 21 October 2023. [PAG,MUL] (p8)</p></div><div class="nugget-popup"><p>High river levels drive flood risk locally; a proposed pumping station will over&ndash;pump surface water into the River Rother when gravity discharge is not possible, but the scheme will not reduce the River Rother flood risk itself. (p10)</p></div><div class="nugget-popup"><p>The River Rother overtopped the existing sheet&ndash;piled flood defence (metal capping) and caused floodwater to spread across Orgreave Road and into nearby communities, leading to widespread property flooding in the River Rother corridor. (p12)</p></div><div class="nugget-popup"><p>Peak flows on the River Rother contributed to flooding risk during Storm Babet; alignment of River Rother peaks with the River Don could cause severe flooding in Rotherham centre and downstream into Doncaster. Post&ndash;event modelling indicated that even with all regulators operating the River Rother still contributed to flooding impacting Catcliffe and Treeton. [PAG] (p13)</p></div><div class="nugget-popup"><p>Began seeping through flood defences and then overtopped, contributing to surface&ndash;water/river flooding that prompted warnings and multi&ndash;agency response and evacuations. [TAB] (p17)</p></div><div class="nugget-popup"><p>The River Rother is identified as the source of flood risk to downstream areas (Catcliffe and Treeton). Options to manage the hazard include upstream storage/NFM to reduce peak flows (anticipated to have minimal effect downstream), raising and extending defences along the river, and improving conveyance (including addressing restrictions at the Treeton Lane bridge). [PAG] (p24)</p></div><div class="nugget-popup"><p>The river's conveyance is constrained by the Treeton Lane bridge (studied for restriction of flow). The River Rother is also the receptor for surface water pumped from streets/properties when gravity drainage failed, contributing to local flood risk. [PAG] (p26)</p></div><div class="nugget-popup"><p>The River Rother overtopped during Storm Babet (Oct 2023), leading to internal flooding that affected properties in Catcliffe and Treeton Villages. (p29)</p></div><div class="nugget-popup"><p>The Rother area (upper Rother) experienced heavier short&ndash;duration rainfall during Storm Babet which contributed to flooding across the catchment and to the observed flood extent affecting places such as Catcliffe and Treeton Village during 19&ndash;21 Oct 2023. (p32)</p></div><div class="nugget-popup"><p>The upper Rother area received substantially more short&ndash;duration rainfall during the October 2023 flood than in November 2019 (noted especially for durations up to 12 hours), concentrating runoff in the upper catchment and increasing flood risk in the upper Rother. [PAG,MUL] (p33)</p></div><div class="nugget-popup"><p>River levels in the Rother during 19&ndash;21 Oct 2023 were the highest on record for the monitored sites in the catchment, exceeding previous peaks from 2007 and 2019. [IMG,TAB,PAG] (p36)</p></div><div class="nugget-popup"><p>October 2023 produced the most exceptional flows mainly in the upper Rother, causing extreme river flows upstream of regulated areas and making the Rother a primary location of flooding impacts during the event. [TAB,PAG] (p37)</p></div><div class="nugget-popup"><p>Localised storms in October 2023 delivered significant flows and volumes into the River Rother, producing high river levels and elevated flood flows in the Rother catchment. [PAG] (p38)</p></div><div class="nugget-popup"><p>River levels rose between Killamarsh and Rotherham due to heavy rainfall, prompting a Flood Alert (Lower River Rother Alert issued 20/10/2023) and subsequent Flood Warnings at Catcliffe and Treeton; low&ndash;lying land near the watercourse was reported likely to flood. (p45)</p></div><div class="nugget-popup"><p>River levels peaked upstream of Catcliffe after heavy rain, producing high water levels that drained into the Catcliffe area and contributed to the flooding risk affecting Treeton and Mill Lane. [PAG] (p46)</p></div><div class="nugget-popup"><p>During Storm Babet river flows on the River Rother were between the 1% and 0.5% Annual Exceedance Probability which led to the Catcliffe flood defence (the sheet&ndash;piled wall along Orgreave Road) being overtopped. The Environment Agency modelling assessing Meadowgate Regulator being non&ndash;operational showed a slight increase in flood depths and extents in Catcliffe and Treeton for the 2%, 1.3% and 1% AEP scenarios but concluded this did not lead to any additional properties being impacted; for the 0.5% AEP scenario the modelling showed a decrease in flood depths and extents when Meadowgate Regulator was not operational. (p50)</p></div><div class="nugget-popup"><p>During Storm Babet river flows were between the 1% and 0.5% Annual Exceedance Probabilities; modelling indicates that Meadowgate being out of operation slightly increased flood depths and extents in Catcliffe and Treeton for some AEP scenarios, though no additional properties were affected. [PAG] (p51)</p></div><div class="nugget-popup"><p>The Rother catchment experienced very large peak rainfall accumulations during Storm Babet (19&ndash;21 Oct 2023), with short&ndash;duration totals substantially greater than comparable June 2007 events; this produced an increased likelihood of surface water and river flooding across the catchment. [TAB,PAG] (p133)</p></div><div class="nugget-popup"><p>Localised storms during 19&ndash;21 Oct 2023 produced significant flows and volumes in the River Rother that caused flooding. The event's flooding resulted in internal flooding of residential properties and affected businesses across the impacted area. (p139)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>140 residential properties; 5 businesses; 8 properties; 3 connecting roads (p12)</p></div><div class="nugget-popup quant"><p>148 properties (combined Catcliffe and Treeton Villages) (p29)</p></div><div class="nugget-popup quant"><p>Upper Rother flows with return periods exceeding 100 years (locations upstream); Sheepbridge 67.2 m3/s; Whittington 137 m3/s (2023 flows cited) [TAB,PAG] (p37)</p></div><div class="nugget-popup quant"><p>1 in 75; 1.3% Annual Exceedance Probability; flows between 1% and 0.5% Annual Probability Events; 0 additional properties (p50)</p></div><div class="nugget-popup quant"><p>between the 1% and 0.5% Annual Exceedance Probabilities; no additional properties affected [PAG] (p51)</p></div><div class="nugget-popup quant"><p>182 residential properties; 9 businesses (p139)</p></div></div></body></div>`)[0];
                popup_bbecacd633aa9fbd0084aad0fc34d550.setContent(html_174f1212eecccf0372d760dc727187cf);

                var html_f19485602297978481c4f7ec57c50ee6 = $(`<div id="html_f19485602297978481c4f7ec57c50ee6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Yorkshire</h1><div class="nugget-popup"><p>Maps for November 2019 and October 2023 show that heavy, concentrated rainfall occurred in southern/south&ndash;western Yorkshire (notably the Sheffield&ndash;Doncaster area). Those high rainfall totals coincided with the flood events and therefore indicate that southern Yorkshire experienced flooding driven by intense rainfall during both events. The remainder of Yorkshire (north and north&ndash;east) received much lower totals and was less affected in these events. [IMG,MUL] (p34)</p></div><div class="nugget-popup"><p>During Storm Babet (19 Oct 2023 &ndash; 21 Oct 2023) peak river levels in Yorkshire were very high in the southern part of the region. Monitoring locations around Sheffield and Doncaster recorded some of the highest ranked peaks in the period of record, indicating significant river&ndash;level flooding impacts in southern Yorkshire compared with other events. [IMG] (p35)</p></div><div class="nugget-popup"><p>Region experienced severe flooding during the event and recorded its wettest three&ndash;day period on record; part of the area where homes were flooded. (p129)</p></div></div></body></div>`)[0];

                var html_2be28c6c9545bfc93eb8f90afaa32da7 = $(`<div id="html_2be28c6c9545bfc93eb8f90afaa32da7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>South Yorkshire</h1><div class="nugget-popup"><p>A Multi&ndash;Agency Major Incident was declared for South Yorkshire in response to the flooding event following Storm Babet; agencies monitored river levels and undertook pumping and other response activities for the area. (p7)</p></div><div class="nugget-popup"><p>Map and annotations indicate active flood warnings concentrated along river corridors across South Yorkshire, with dense clusters in urban and peri&ndash;urban river valleys; multiple communities along main rivers were subject to warnings and elevated flood risk during the event. [IMG] (p63)</p></div></div></body></div>`)[0];

                var html_230e6300abfa829ab6558d7a62b49e19 = $(`<div id="html_230e6300abfa829ab6558d7a62b49e19" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Catcliffe</h1><div class="nugget-popup"><p>River water seeped through vertical slots in the metal sheet piling of the flood defence at Catcliffe and began to pond on Orgreave Road. Surface&ndash;water pumps deployed for surface&ndash;water flooding were rendered ineffective when river water encroached; officers raised the alarm and properties in the area were at risk and advised by the Council and Fire and Rescue. (p7)</p></div><div class="nugget-popup"><p>Identified as an area affected by flooding (Storm Babet); Council committed to investigate options to reduce future flood risk including funding three option appraisals, desktop analyses, and subsequent feasibility studies and surveys. [PAG] (p9)</p></div><div class="nugget-popup"><p>Catcliffe is identified as an area requiring an increased standard of protection defences to reduce flood risk from the River Rother; planning of defence upgrades is proposed. (p10)</p></div><div class="nugget-popup"><p>Mobile pumping operations were implemented to redirect water from the surface water system into pumping chambers and back to the river, controlling surface water levels and preventing surface water flooding on roads, drives and homes initially. Council staff witnessed river water seeping under metal capping near the top of the flood defence and ponding on Orgreave Road at around 02:15 on 21 October 2023; residents were advised to evacuate. (p11)</p></div><div class="nugget-popup"><p>The River Rother overtopped the capping of the sheet&ndash;piled flood defence, leading to water spreading across Orgreave Road and towards properties. As a result properties were flooded and residents were advised to evacuate; emergency services and council officers carried out evacuations and pumps were moved to higher ground. [MUL] (p12)</p></div><div class="nugget-popup"><p>Storm Babet produced flows/intensity above the 1&ndash;in&ndash;75 return period that exceeded the Catcliffe flood defence wall, indicating the defence was overtopped/exceeded and Catcliffe experienced flooding as a result. (p13)</p></div><div class="nugget-popup"><p>Surface water from the catchment was overpumped to remove floodwater; pumps were deployed to move surface water away from the area during the response. [PAG] (p14)</p></div><div class="nugget-popup"><p>Pumps were set up in Catcliffe to overpump surface water from the catchment; pumping operations removed flood water from the area. [PAG] (p15)</p></div><div class="nugget-popup"><p>Homes were affected by flooding such that sandbags were deployed to properties and residents required evacuation; immediate housing support was provided and residents used a rest centre set up because of the flooding. [TAB] (p22)</p></div><div class="nugget-popup"><p>Residential properties in Catcliffe experienced surface water flooding; the Council currently relies on a portable pumping arrangement to lift surface water into the River Rother when gravity drainage fails. The Catcliffe Pumping Station scheme is being developed to reduce this risk. (p26)</p></div><div class="nugget-popup"><p>The EA carried out a full review of the flood warnings offered to Catcliffe, collecting post&ndash;incident data, identifying any missed warnings and validating warning quality following flood warnings being issued. (p27)</p></div><div class="nugget-popup"><p>River Rother overtopped during Storm Babet (Oct 2023), causing internal flooding of properties in Catcliffe (part of the combined total for Catcliffe and Treeton Villages). (p29)</p></div><div class="nugget-popup"><p>Modelled October 2023 flooding produced deep inundation on the central and eastern floodplain adjacent to the local watercourse, with significant inundation extending into residential areas; shallower flooding affected peripheral streets and green spaces. [IMG] (p31)</p></div><div class="nugget-popup"><p>Flood Warning issued for Catcliffe (River Rother at Catcliffe) advising that flooding to properties was expected; residents were advised to take action to protect property. (p45)</p></div><div class="nugget-popup"><p>Accumulated water in the Catcliffe area remained high as it drained away after the river peaked; Catcliffe (and the Catcliffe Flash) was implicated as the location where water accumulated and then overflowed, contributing to flood flows toward Treeton Lane and Mill Lane. (p46)</p></div><div class="nugget-popup"><p>The Catcliffe flood defence (sheet piled wall along Orgreave Road) was overtopped during the event when river flows were between the 1% and 0.5% AEP. Modelling shows slight increases in flood depths and extents in Catcliffe when the Meadowgate Regulator was not operational, but this did not cause additional properties to be affected in the modelling scenarios. [PAG] (p50)</p></div><div class="nugget-popup"><p>Environment Agency modelling for Storm Babet showed a slight increase in flood depths and extents in Catcliffe when the Meadowgate Regulator was not operational, but the Catcliffe flood defence (sheet piled wall along Orgreave Road) kept river flows in the River Rother and the modelling indicated this did not result in any additional properties being impacted. [PAG] (p51)</p></div><div class="nugget-popup"><p>Internal flooding affected properties in the Catcliffe and Treeton area during the storm, contributing to the wider borough impacts. (p129)</p></div><div class="nugget-popup"><p>Multiple residential addresses in Catcliffe experienced internal flooding (addresses in the report include Southview Terrace, The Croft, Orgreave Road, California Drive, Waverley View, Willan Drive, Railway Avenue, Sheffield Lane, Chapel Walk). [PAG] (p135)</p></div><div class="nugget-popup"><p>Surface water flooding associated with Storm Babet caused internal flooding of properties in Catcliffe (including streets referenced in the report). (p137)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>140 residential properties; 5 businesses [MUL] (p12)</p></div><div class="nugget-popup quant"><p>148 properties (combined Catcliffe and Treeton Villages) (p29)</p></div><div class="nugget-popup quant"><p>148 properties (combined with Treeton) (p129)</p></div></div></body></div>`)[0];

                var html_8233bcdf356e3abec4a5074e5f696e66 = $(`<div id="html_8233bcdf356e3abec4a5074e5f696e66" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Treeton</h1><div class="nugget-popup"><p>Treeton Village is identified for increased standard of protection defences to reduce flood risk from the River Rother; upgrade works are proposed. (p10)</p></div><div class="nugget-popup"><p>All three connecting roads in Treeton were submerged by surface water flooding at points. Flood water from the River Rother spread further up Mill Lane towards properties; council employees fulfilled sandbag requests. Eight properties in Treeton were flooded from the River Rother. (p12)</p></div><div class="nugget-popup"><p>Post&ndash;event modelling demonstrated that flooding occurred in Treeton during Storm Babet and that having all three Rother regulators operating would not have prevented flooding there. (p13)</p></div><div class="nugget-popup"><p>Properties in (and east of) Treeton experienced flooding from surface water during Storm Babet; this flooding was separate to river flooding and caused internal property flooding in the eastern part of the village. (p14)</p></div><div class="nugget-popup"><p>Homes received sandbags in response to flooding and residents were provided immediate housing support as part of the response. [TAB] (p22)</p></div><div class="nugget-popup"><p>Communities in Treeton (and nearby Catcliffe) are at risk from flooding of the River Rother. Proposed responses include raising and extending flood defences on both sides of the Rother and improving conveyance (including alterations to the bridge on Treeton Lane). Upstream storage/NFM measures may reduce downstream peak flows but are described as providing only a minimal reduction in risk at Catcliffe and Treeton. (p24)</p></div><div class="nugget-popup"><p>The EA reviewed and validated flood warnings for Treeton following flood warnings being issued; changes were made to the Treeton flood warning (triggers and/or area covered) as a result of the review. (p27)</p></div><div class="nugget-popup"><p>River Rother overtopping during Storm Babet caused internal flooding of properties in the villages; properties in Treeton Villages experienced internal (household) flooding. (p29)</p></div><div class="nugget-popup"><p>Modelled October 2023 flooding shows inundation concentrated along the central watercourse with shallower flooding radiating into adjacent residential streets and open spaces in Treeton Village. [IMG] (p31)</p></div><div class="nugget-popup"><p>Flood Warning issued for Treeton (River Rother at Treeton) advising that flooding to properties was expected; residents were advised to take action to protect property. (p45)</p></div><div class="nugget-popup"><p>The 'River Rother at Treeton' Flood Warning (issued 10:56 on 21/10/23) covered Treeton and stated that flooding to properties was expected; the warning noted multiple mechanisms including potential overflow from Catcliffe Flash onto Treeton Lane and movement up to Mill Lane. [PAG] (p46)</p></div><div class="nugget-popup"><p>Environment Agency modelling for Storm Babet showed a slight increase in flood depths and extents in Treeton when the Meadowgate Regulator was not operational; the modelling indicated this increase did not lead to any additional properties being impacted. (p51)</p></div><div class="nugget-popup"><p>Area&ndash;wide surface water flooding during Storm Babet: extremely heavy rainfall and saturated greenspace produced excess surface water runoff, raising watercourse levels which overtopped and affected residential and community areas near the central watercourse. [IMG] (p84)</p></div><div class="nugget-popup"><p>Internal flooding affected properties in the Catcliffe and Treeton area during the storm, contributing to the wider borough impacts. (p129)</p></div><div class="nugget-popup"><p>Parts of the village (including Shorland Drive and Mill Lane) experienced internal flooding of residential properties. (p135)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8 properties (p12)</p></div><div class="nugget-popup quant"><p>148 properties (combined total for Catcliffe and Treeton Villages) (p29)</p></div><div class="nugget-popup quant"><p>2 properties [IMG] (p84)</p></div><div class="nugget-popup quant"><p>148 properties (combined with Catcliffe) (p129)</p></div></div></body></div>`)[0];

                var html_287bf19cfeae2bad01cd7705082e0e1c = $(`<div id="html_287bf19cfeae2bad01cd7705082e0e1c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Meadowgate Regulator</h1><div class="nugget-popup"><p>The Meadowgate regulator was not operational and its river level was not recorded during the 19&ndash;21 Oct 2023 event (it was under refurbishment). Its non&ndash;operation meant no flows were held back at Meadowgate during the event, which contributed to lower river levels recorded at Killamarsh compared with 2007 and 2019. (p36)</p></div><div class="nugget-popup"><p>The Meadowgate Regulator was not operational during Storm Babet; modelling comparing operational vs non&ndash;operational scenarios shows that when not operational there were slight increases in flood depths and extents in Catcliffe and Treeton for some AEPs (but no additional properties affected in those scenarios). During the event river flows lay between the 1% and 0.5% AEP. [PAG] (p50)</p></div><div class="nugget-popup"><p>Meadowgate Regulator was out of operation from the start of the refurbishment works (beginning of September) and remained non&ndash;operational during Storm Babet; modelling with the gate out of operation showed slight increases in flood depths and extents in nearby settlements for some AEP scenarios. The regulator being unavailable during the storm delayed installation works and removed its control function for the event. (p51)</p></div><div class="nugget-popup"><p>The Meadowgate regulator was out of operation during the event; its non&ndash;operational state changed flood extents and depths in modelling for a 1% AEP event. Contingency arrangements required the other two regulators (Canklow and Woodhouse Mill) to be operated. Maps show different flood extents/depths when Meadowgate is operational versus non&ndash;operational, indicating the regulator&#8217;s status materially affected flooding in the area. [PAG] (p52)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2%, 1.3%, 1%, 0.5% AEP; no additional properties affected (p51)</p></div></div></body></div>`)[0];
