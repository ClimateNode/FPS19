                var html_ac8f9a61e6df1a46ed28dfb5e2babc37 = $(`<div id="html_ac8f9a61e6df1a46ed28dfb5e2babc37" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Mill Lane, Monks Risborough</h1><div class="nugget-popup"><p>Surface water flow path ran southwards along Crowbrook Road to Mill Lane during the February 2014 event, forming a key route for floodwater into the village; mapping suggests this route was prone to inundation and may be more extensive than shown due to railway representation. [PAG] (p10)</p></div><div class="nugget-popup"><p>Drainage and culvert structures in the Mill Lane / Crow Brook area were blocked, silted and vegetated; standing water was observed beneath the Mill Lane railway bridge and conveyance was reduced, producing local flooding and drainage failure in this area during the February rainfall event. [PAG,IMG] (p15)</p></div><div class="nugget-popup"><p>Mill Lane suffered extensive flooding due to restricted capacity in the Mill Brook culvert and road drainage under the railway bridge; flooding caused internal inundation to at least floorboard level in nearby properties, garden flooding and obstruction of the road. Emergency services assisted with removal of a vehicle from floodwaters on 7 Feb. [PAG] (p17)</p></div><div class="nugget-popup"><p>West of the railway at Kingsmead and Mill Lane experienced surface water runoff (likely combined with excess flow from the Crow Brook) causing internal flooding to at least the height of floorboards, flooding of gardens and flooding of Kingsmead and Mill Lane roads. Residents reported floodwater contaminated with sewage and surcharging of the sewer in the field between Kingsmead and the railway. Local mitigation (bailing, sandbags, trenches) reduced more extensive internal flooding. (p18)</p></div><div class="nugget-popup"><p>Surface&ndash;water and groundwater flows (including runoff from Molins sports ground) flowed onto Crowbrook Road and down to the junction with Mill Lane, flowing in and around properties and along the roads. The culvert beneath the railway in Crowbrook Road was reported blocked during the flood and the refurbished/nearby culvert was considered unlikely to have capacity for the additional road&ndash;derived flow, concentrating water on the road. Residents in Mill Lane/Crowbrook reported problems with the sewer system and surcharging during the event, contributing to contaminated/sanitary&ndash;related flood impacts. (p19)</p></div><div class="nugget-popup"><p>Flooding on Mill Lane required a car to be recovered from flood water, prompted delivery of sandbags and led to closure of Mill Lane at the railway bridge under a Temporary Traffic Regulation Order. [TAB,MUL] (p20)</p></div><div class="nugget-popup"><p>Surface water was unable to drain away from under the Mill Road railway bridge due to a blockage or insufficient drainage capacity, causing flooding at that location. (p24)</p></div><div class="nugget-popup"><p>Standing water covered fields adjacent to Mill Lane (views north from Mill Lane and west of the railway), with floodwater occupying large areas of field close to houses and infrastructure near the lane. [IMG,PAG] (p32)</p></div><div class="nugget-popup"><p>Standing water pooled across the full width of the lane west of the railway, with water covering the road surface, pooling on verges and reflecting hedges and trees. A narrow channel of water flowed through a gap in a hedge, indicating water breaching the hedge line and pooling on the near side. [IMG,PAG] (p33)</p></div><div class="nugget-popup"><p>Surface water flooded the carriageway at the junction of Kingsmead and Mill Lane in February 2014. Water pooled on the tarmac and flowed from the road onto the grassy verges, causing localized road flooding and standing water at the junction. [IMG] (p34)</p></div><div class="nugget-popup"><p>Standing surface water inundated much of the carriageway (particularly the left lane) and encroached onto verges; floodwater reached residential frontages and driveways adjacent to the road, inundating property access and stranding at least one vehicle. [IMG,PAG] (p35)</p></div><div class="nugget-popup"><p>A rural road section was partially flooded with water flowing across the carriageway; traffic cones were placed to warn drivers and traffic remained cautious but passable. [IMG,PAG] (p36)</p></div><div class="nugget-popup"><p>Road partially submerged with water erupting and bubbling up through the tarmac; multiple jets of water emerging from the carriageway, flooding the lane and impeding normal traffic. Visual evidence indicates pressurised water at/under the road surface, consistent with damage or failure of underground drainage or water infrastructure. [IMG,PAG] (p37)</p></div><div class="nugget-popup"><p>Surface water from an overwhelmed roadside drainage outlet and runoff from an adjacent field flowed onto and across the road, overtopping a hedge gap and causing localised road flooding and obstruction. [IMG,PAG] (p38)</p></div><div class="nugget-popup"><p>Floodwater covered the left side of the rural road, making the lane partially impassable and forcing vehicles and pedestrians to use the remaining dry area; water was encroaching into adjacent vegetation and a nearby field/pond and reached close to a house garden, threatening nearby property. [IMG,PAG] (p39)</p></div><div class="nugget-popup"><p>Standing surface water beneath the railway bridge formed a large puddle occupying much of the carriageway; localised road flooding and drainage blockage affecting the highway under the bridge. [IMG,PAG] (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>between 3&#8220; (0.07m) and 5&#8221; (0.13m) in rear gardens; at least one property lost power supply [PAG] (p18)</p></div><div class="nugget-popup quant"><p>1 property (driveway and front yard) flooded [IMG,PAG] (p35)</p></div></div></body></div>`)[0];

                var html_c9ddc64a3c5ededb1be33bbdbff004b7 = $(`<div id="html_c9ddc64a3c5ededb1be33bbdbff004b7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Crowbrook Road, Monks Risborough</h1><div class="nugget-popup"><p>Surface water flow path ran southwards along Crowbrook Road to Mill Lane during the February 2014 event, forming a key route for floodwater into the village; mapping suggests this route was prone to inundation and may be more extensive than shown due to railway representation. [PAG] (p10)</p></div><div class="nugget-popup"><p>Crow Brook culvert and drainage under the railway at Crowbrook Road had recent works and were identified as having reduced capacity/obstructions; the Crow Brook watercourse running parallel to the railway was an exception to freely flowing channels and contributed to local flood impacts around the railway and Crowbrook Road. (p14)</p></div><div class="nugget-popup"><p>Crowbrook Road was extensively flooded when excess water (unable to pass the railway culvert) flowed down the road to Mill Lane; flood depths were reported as substantial (noted as 'knee deep' in accounts) and conditions were worse beneath the railway bridge. [PAG] (p17)</p></div><div class="nugget-popup"><p>Runoff and groundwater flooded into the rear gardens and garages of properties on Crowbrook Road; water levels came close to causing internal flooding of residential properties. Residents reported rear garden flood depths at the junction with Mill Lane. (p18)</p></div><div class="nugget-popup"><p>Surface water flowed onto Crowbrook Road and then down to the junction with Mill Lane; the culvert beneath the railway in Crowbrook Road was reported blocked at the time of the flood and the refurbished culvert is unlikely to have had capacity for the additional flow, causing road flooding and flows into nearby properties. [PAG] (p19)</p></div><div class="nugget-popup"><p>Surface water flowing from Askett and surrounding land reached Crowbrook Road; once on the road there was little opportunity for it to re&ndash;enter the adjacent watercourse. The refurbished railway culvert under the railway near the station was unlikely to have capacity for the additional flow, so water conveyed along Crowbrook Road down to the junction with Mill Lane. (p20)</p></div><div class="nugget-popup"><p>Surface water that could not pass beneath the railway flowed down Crowbrook Road and accumulated at the lowest point beneath the railway bridge, causing local flooding of the road. [TAB] (p24)</p></div><div class="nugget-popup"><p>Road flooding related to backflow at the station culvert under the railway; recommendations include studying options to force water back into the watercourse and enlarging the culvert under the railway station to maintain design capacity. (p25)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>between 3&#8220; (0.07m) and 5&#8221; (0.13m) in rear gardens; at least one property lost power supply (p18)</p></div></div></body></div>`)[0];

                var html_8ba3bf814efbd14105f3c57c4333618c = $(`<div id="html_8ba3bf814efbd14105f3c57c4333618c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kingsmead, Monks Risborough</h1><div class="nugget-popup"><p>Surface water runoff (and possibly excess flow from nearby watercourses) caused waterlogging of the field west of the railway and contributed to internal flooding to at least floorboard height in nearby properties, flooding of gardens and flooding of Kingsmead and Mill Lane roads; mitigations (bailing, sandbags, trenches) reduced worse impacts. (p17)</p></div><div class="nugget-popup"><p>West of the railway at Kingsmead and Mill Lane experienced surface water runoff (likely combined with excess flow from the Crow Brook) causing internal flooding to at least the height of floorboards, flooding of gardens and flooding of Kingsmead and Mill Lane roads. Residents reported floodwater contaminated with sewage and surcharging of the sewer in the field between Kingsmead and the railway. Local mitigation (bailing, sandbags, trenches) reduced more extensive internal flooding. (p18)</p></div><div class="nugget-popup"><p>Floodwater flowed through the area and around properties; residents reported sewer surcharging and that floodwater was contaminated with sewage. Flooding in Kingsmead rose and fell very rapidly (within an hour). Surface water flows towards Kingsmead with no defined drainage, causing water to flow in and around properties and along roads. (p19)</p></div><div class="nugget-popup"><p>A large area of land drained toward Kingsmead where, in the absence of defined watercourses, surface water made its way around and under properties in Kingsmead and flowed on to Mill Lane. [PAG] (p20)</p></div><div class="nugget-popup"><p>Surface water runoff flowed across fields onto Kingsmead, flooding the road and likely entering properties below floorboards; infiltration into foul sewers caused surcharging in Kingsmead, impairing sewer use. [TAB] (p24)</p></div><div class="nugget-popup"><p>Flows affected properties in the Kingsmead area; a drainage study was recommended to divert flow away from properties to reduce flooding. (p25)</p></div><div class="nugget-popup"><p>Floodwater covered grassland in the view west towards Kingsmead and extended towards nearby houses, with water levels appearing high and close to residential buildings. [IMG] (p32)</p></div><div class="nugget-popup"><p>Localised surface&ndash;water flooding at the junction with visible pooling and runoff across the tarmac and onto verges, affecting the junction carriageway. [IMG] (p34)</p></div><div class="nugget-popup"><p>The junction of Kingsmead with Mill Lane was inundated by standing floodwater, covering much of the junction carriageway and encroaching on adjacent verges and properties. [IMG,PAG] (p35)</p></div><div class="nugget-popup"><p>Floodwater covered the driveway of a residential property and reached the base of the house, showing water accumulation at the property entrance and inundation of the driveway. [IMG,PAG] (p36)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 residential property driveway [IMG,PAG] (p36)</p></div></div></body></div>`)[0];

                var html_8c3fa5d841ac7a16232586b12405ab55 = $(`<div id="html_8c3fa5d841ac7a16232586b12405ab55" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Peters Lane, Monks Risborough</h1><div class="nugget-popup"><p>Surface water flowed down Peters Lane; flow passed the local church, which was reported to be close to internal flooding. [PAG] (p18)</p></div><div class="nugget-popup"><p>Surface water flowed down St Peters Road (sic) towards the church; although local measures prevented internal flooding of church properties, the road experienced overland flow. (p24)</p></div><div class="nugget-popup"><p>Flow path problems causing flooding through Peters Lane (and nearby Burton Lane and church grounds) were noted; actions recommended to improve and maintain the flow path to reduce flooding. (p25)</p></div></div></body></div>`)[0];

                var html_ebf60853b1764548b20413e38cd0cf27 = $(`<div id="html_ebf60853b1764548b20413e38cd0cf27" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Monks Risborough Station</h1><div class="nugget-popup"><p>The report identifies the railway station as one of two locations where springs/flows are constrained to pass beneath the railway embankment (the other being Mill Lane). This constraint is linked to localised surface water/stream flooding at the station area and nearby stream crossing. [PAG,IMG] (p9)</p></div><div class="nugget-popup"><p>The culvert beneath the railway at the station restricted flow on the Crow Brook, causing water to back up and spill over into Crowbrook Road and Mill Lane; flood depths were reported as considerably deeper beneath the railway bridge. (p17)</p></div><div class="nugget-popup"><p>The culvert under the railway station was partially restricted and unable to accommodate runoff, contributing to surface water being forced down towards Crowbrook Road and accumulating beneath the railway bridge. (p24)</p></div></div></body></div>`)[0];

                var html_b470fca76a48bd9f4270f7b3e23f2c14 = $(`<div id="html_b470fca76a48bd9f4270f7b3e23f2c14" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Monks Risborough</h1><div class="nugget-popup"><p>Following a prolonged period of above&ndash;average rainfall groundwater levels rose and surrounding land became saturated. Subsequent rainfall caused flood flows that were unable to pass through restricted culverts and drains and caused direct runoff from land with no defined watercourse, resulting in flooding across Monks Risborough and affecting local watercourses, culverts and the piped drainage system. (p4)</p></div><div class="nugget-popup"><p>Prolonged above&ndash;average rainfall raised groundwater levels and saturated land. Subsequent rainfall caused flooding where flow could not pass through restricted culverts and drains and from direct runoff from land with no defined watercourse. A transport link (Class C highway) was rendered totally impassable for 10 hours or more. [PAG] (p5)</p></div><div class="nugget-popup"><p>A local Class C highway (transport link) was rendered totally impassable for 10 hours or more, prompting a formal flood investigation. [PAG] (p6)</p></div><div class="nugget-popup"><p>Surface water flooding affected the village area (report highlights large areas prone to flooding on the surface water flood map). Local springs feed small, deeply incised ordinary watercourses that are constrained to pass beneath the railway at two locations (Mill Lane and the railway station); these flow restrictions are identified in the report as a mechanism contributing to localised flooding in and around the village. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>Areas of the village experienced surface water flooding during the February 2014 event; flood extents on surface water mapping closely match the flooding that occurred. Springs and small watercourses in the village produced flow paths constrained beneath the railway (notably at Mill Lane and the railway station), concentrating flows through the settlement and contributing to inundation. [IMG,PAG] (p10)</p></div><div class="nugget-popup"><p>Surface water flood flow path from Askett southwards along Crowbrook Road to Mill Lane was observed / mapped; surface water flood extent on the EA map closely matches the flooding experienced in the village during the February 2014 event. Residential streets and properties along the central and southern corridors were intersected by mapped surface water flood zones. [PAG] (p11)</p></div><div class="nugget-popup"><p>The village experienced flooding consistent with the February 2014 event: surface water flooding extent closely matched the February 2014 flood and groundwater emerged at the surface via springs at the Chalk/Upper Greensand junction, contributing to local flooding and drainage problems. [PAG,IMG] (p12)</p></div><div class="nugget-popup"><p>Flooding arose from the rainfall on 6 February and persisted for approximately three weeks; local watercourses were affected (notably Crow Brook and the Mill Stream), causing reduced drainage capacity and local inundation across parts of the village. (p15)</p></div><div class="nugget-popup"><p>Village experienced widespread flooding driven by high groundwater, springs and surface water runoff after heavy rain (start taken as 6 Feb). Roads were closed (road closed on 7 Feb, reopened 17 Feb). Areas west of the railway (Kingsmead and Molins sports / adjacent fields) and streets (Crowbrook Road, Mill Lane) were waterlogged and internally flooded; gardens and roads were inundated. [PAG] (p17)</p></div><div class="nugget-popup"><p>Exceptional January&ndash;February groundwater and saturated soils caused springs, widespread seepage and surface runoff. Restrictions at culverts beneath the railway and under the Mill Road bridge caused excess water to back up, producing extensive flooding of Mill Lane and Crowbrook Road (flood depths on Crowbrook Road reported as 'knee deep' and considerably deeper under the railway). Runoff from Molins sports ground flooded rear gardens and garages of properties in Mill Lane (east of the railway) and Crowbrook Road; internal flooding to at least floorboard height occurred in Kingsmead and Mill Lane without mitigation. Residents reported sewer surcharging and sewage&ndash;contaminated floodwater in Kingsmead. The Buckinghamshire Fire & Rescue Service assisted in removing a vehicle from floodwaters on 7 Feb. At least one property lost power; the local church was reported close to internal flooding. [IMG] (p18)</p></div><div class="nugget-popup"><p>Surface water flow paths (including flows originating in Askett) crossed the railway and reached Crowbrook Road and Mill Lane; surface water drained across land into the Kingsmead area, flowed around and under properties in Kingsmead and continued onto Mill Lane, contributing to road flooding, property inundation routes and the need for local response actions. (p20)</p></div><div class="nugget-popup"><p>Prolonged flooding in the village in February 2014 driven by above&ndash;average rainfall and exceptionally high groundwater; high water levels in local watercourses, infiltration into foul sewers causing surcharging and widespread drainage failure. [TAB,PAG] (p24)</p></div><div class="nugget-popup"><p>Standing floodwater covered grassland and extended toward residential properties; water reached close to houses, indicating residential areas were threatened and water encroached on property curtilages. [IMG] (p32)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3&#8220; (0.07 m) to 5&#8221; (0.13 m) flood depths in rear gardens at the junction of Crowbrook Road and Mill Lane; one vehicle removed from floodwater (7 Feb); one property lost power [IMG] (p18)</p></div></div></body></div>`)[0];
                popup_56c9ec935834b0f06a4c6c113f863766.setContent(html_b470fca76a48bd9f4270f7b3e23f2c14);
