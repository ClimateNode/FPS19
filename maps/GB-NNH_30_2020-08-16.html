                var html_2a16329ecf002000db70097296002c67 = $(`<div id="html_2a16329ecf002000db70097296002c67" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kettering Rugby Club</h1><div class="nugget-popup"><p>Surface water runoff from the rugby club grounds was reported to have flowed toward Waverley Road and contributed to overtopping of the kerb and subsequent flooding of properties on Waverley Road. (p17)</p></div><div class="nugget-popup"><p>The low point at the junction with the Rugby Club entrance experienced overtopping; the manhole cover to the East Brook culvert just inside the Rugby Club entrance was surcharged and was discharging floodwater to surface. (p18)</p></div><div class="nugget-popup"><p>The gully/ surface water connection at the Rugby Club entrance was not connected into the Anglian Water system (it abutted externally to the 300mm system) and had been damaged; this restriction prevented free discharge of surface water into the main sewer and contributed to drainage problems. The connection has since been repaired. [PAG] (p19)</p></div><div class="nugget-popup"><p>The Rugby Club's surface water connection had been damaged (restricting discharge into the main surface water sewer) and the club entrance was included in the area where blocked gullies contributed to flooding; the damaged connection was investigated and subsequently repaired following coordination between AWS and Local Authorities. (p20)</p></div><div class="nugget-popup"><p>Surcharge flooding from an East Brook manhole at the Rugby Club entrance far exceeded system capacity, overwhelming the surface water drainage. The gully connection from the Rugby Club was not connected to a suitable discharge system and was unable to convey surface water effectively; overtopping occurred over dropped kerbs and the footpath at the entrance. (p21)</p></div><div class="nugget-popup"><p>Surface water reached the club entrance/driveway area; photographs show water on the paved entrance and nearby manhole covers, indicating the entrance was affected by the flooding and access was likely impeded. [IMG,PAG] (p36)</p></div><div class="nugget-popup"><p>The vehicle entrance/manhole within the Rugby Club showed significant surface damage, cracking and vertical displacement around the manhole with water pooling on the surface, indicating inundation and structural damage to the entrance associated with drainage/culvert failure. [IMG,PAG] (p37)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>300mm surface water system (adjacent) [PAG] (p19)</p></div><div class="nugget-popup quant"><p>3 gullies (p20)</p></div></div></body></div>`)[0];

                var html_aa5a95335784932c19b1b4f3c1490c66 = $(`<div id="html_aa5a95335784932c19b1b4f3c1490c66" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Waverley Road, Kettering</h1><div class="nugget-popup"><p>Intense, short&ndash;duration rainfall overwhelmed surface water drainage, causing excess surface water to flow over ground to low points around properties on Waverley Road. This led to internal flooding of a garage that is integral to the main occupied building; the garage has experienced internal flooding on more than one occasion in the last five years. (p6)</p></div><div class="nugget-popup"><p>Internal flooding to a garage that is integral to the main occupied building; the garage has flooded on multiple occasions (including the incident that triggered this investigation). (p8)</p></div><div class="nugget-popup"><p>Relief culvert under Waverley Road has unclear ownership; a 225mm diameter surface water public sewer runs beneath Waverley Road and was implicated in the incident when the adjacent 300mm pipe was severed and connected to East Brook, altering the drainage connection in the Waverley Road corridor. [PAG] (p15)</p></div><div class="nugget-popup"><p>Surface water from intense rainfall overwhelmed a road gully and exceeded the dropped kerb, flowing across the footpath and into an integral garage. One property on Waverley Road flooded internally and other properties experienced flooding to their rear gardens. (p17)</p></div><div class="nugget-popup"><p>Surface water flowed over dropped kerbs and down through the integral garage at 52 Waverley Road, then into the rear garden where depth increased and water spread northwards into neighbouring rear gardens and properties. (p18)</p></div><div class="nugget-popup"><p>Properties at the rear of Waverley Road were affected by the surcharging East Brook culvert; the severed/misconnected surface water sewer discharges directly into the culvert, and lids on the relief culvert have been observed to blow off on Waverley Road when the East Brook is surcharged. [PAG] (p19)</p></div><div class="nugget-popup"><p>The road flooded when intense heavy rainfall exceeded surface water drainage capacity. The East Brook culvert in Waverley Road surcharged and flooded out at locations where the culvert cross&ndash;sectional area reduced, causing manholes to surcharge and water to flow over ground into low points around nearby properties. (p21)</p></div><div class="nugget-popup"><p>Surface water was present on the carriageway and adjacent driveway as documented in photographs; the wet pavement at the street entrance indicates Waverley Road was affected by surface water/urban flooding. [IMG,PAG] (p36)</p></div><div class="nugget-popup"><p>Surface water from a failed/blocked drainage route pooled at the road end and was associated with a collapsed area adjacent to inspection covers and a gully, indicating drainage failure and local inundation affecting the carriageway/entrance area. [IMG,PAG] (p37)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than one occasion in the last five years (p6)</p></div><div class="nugget-popup quant"><p>1 garage (p8)</p></div><div class="nugget-popup quant"><p>225mm diameter surface water public sewer; 225mm diameter foul water public sewer; 300mm diameter pipe severed [PAG] (p15)</p></div><div class="nugget-popup quant"><p>1 property flooded internally (p17)</p></div><div class="nugget-popup quant"><p>1 integral garage flooded (p18)</p></div><div class="nugget-popup quant"><p>300mm surface water sewer [PAG] (p19)</p></div></div></body></div>`)[0];

                var html_4b6b892051889afe3d1cff8bbc72db09 = $(`<div id="html_4b6b892051889afe3d1cff8bbc72db09" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kettering</h1><div class="nugget-popup"><p>A surface water flood incident occurred in Kettering (at Waverley Road) on 16 August 2020 when intense heavy rainfall and ineffective surface water drainage caused excess water to flow to low points around properties, triggering a formal Section 19 investigation. (p6)</p></div><div class="nugget-popup"><p>Contained a flood incident on Waverley Road (16 August 2020) that caused internal flooding to an integral garage at a property on Waverley Road. (p8)</p></div><div class="nugget-popup"><p>The flood&ndash;risk map for the urban area of Kettering shows a corridor of surface&ndash;water flood extent running through the town; a specific area is highlighted (red circle) where high/medium surface&ndash;water flood extent intersects residential streets and a playing field. [IMG] (p12)</p></div><div class="nugget-popup"><p>Parts of Kettering (notably Waverley Road) experienced surface water flooding when intense heavy rainfall overwhelmed local drainage systems, resulting in excess surface water flowing over ground to low points around properties. (p21)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 garage (p8)</p></div></div></body></div>`)[0];
