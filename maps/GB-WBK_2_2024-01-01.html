                var html_37c74a104ed057ba0401ec8c1ebfc8f0 = $(`<div id="html_37c74a104ed057ba0401ec8c1ebfc8f0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Thames Valley</h1><div class="nugget-popup"><p>Flooding occurred in the local area during January 2024 driven by repeated heavy rainfall (notably Storm Stork Henk), saturated soils and high groundwater levels, causing local inundation and increased flood risk. The Environment Agency has been investigating the Thames Valley Flood Scheme to identify storage and natural flood management locations to reduce such flood risk. (p186)</p></div><div class="nugget-popup"><p>Flooding in the wider Thames Valley area was attributed to saturated soils, repeated/deluge rainfall and high groundwater levels contributing to surface water and groundwater&ndash;driven flooding in the locality. (p214)</p></div></div></body></div>`)[0];

                var html_751ec18d2dd3ea38ef392458912a8bb6 = $(`<div id="html_751ec18d2dd3ea38ef392458912a8bb6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Burghfield Road Bridge</h1><div class="nugget-popup"><p>The report records flooding affecting Burghfield Bridge (a dedicated Table 5&ndash;1: 'Summary of Flooding in Burghfield Bridge' is listed), indicating the settlement was impacted by the flood event. (p8)</p></div><div class="nugget-popup"><p>Identified as one of the areas that experienced the most severe flooding during the West Berkshire 2024 flood event and therefore investigated in the report. Flooding formed part of the wider event driven by heavy rainfall and high groundwater; the report indicates multiple sources (fluvial, groundwater, surface water, sewer) contributed across the catchment. (p15)</p></div><div class="nugget-popup"><p>Listed as a location under investigation following the January 2024 storms; the report links these investigations to flooding that led to internal and external property flooding and road closures. (p17)</p></div><div class="nugget-popup"><p>Flooding following the storms caused residential properties to flood and local road disruption: 15 properties flooded in total, of which 10 were internally flooded and 5 externally flooded; one road closure was recorded. [TAB] (p19)</p></div><div class="nugget-popup"><p>Developed areas south of the Kennet and Avon Canal were flooded when the canal overtopped. Elevated groundwater during the wet winter of 2023/24 contributed to flooding (notably along Pingewood Close), and septic tank drainage fields located below the water table led to raw sewage emerging above ground. [PAG,MUL] (p34)</p></div><div class="nugget-popup"><p>During the 2024 flood event there was concern that canal boats could break loose from moorings and block flow downstream under Burghfield Road bridge, creating a flood risk and potential flow obstruction. (p35)</p></div><div class="nugget-popup"><p>Six properties in Burghfield Bridge were reported flooded during the 2024 event: two properties flooded internally and four properties flooded externally. (p36)</p></div><div class="nugget-popup"><p>Area investigated as part of the 2024 flood event; riparian maintenance advice given to ensure ditches allow free passage of water during flood events. (p37)</p></div><div class="nugget-popup"><p>The area around Burghfield Bridge experienced increased flood risk during the event due to frequent overtopping and high peak flows from the River Kennet; residents raised concerns that land use changes/land raising may have increased flood risk locally. (p38)</p></div><div class="nugget-popup"><p>Fluvial (river) and groundwater flooding in Burghfield Bridge during the event caused internal and external property flooding and road closures; West Berkshire Council attended to monitor and enforce closures. [TAB,PAG] (p39)</p></div><div class="nugget-popup"><p>Road flooding occurred adjacent to Burghfield Bridge; water flow routes and ditches/culverts route water toward the bridge, placing the structure and immediate road approaches at flood risk. [IMG] (p138)</p></div><div class="nugget-popup"><p>Groundwater infiltration and surface&ndash;water inundation/river bank overtopping affected the Burghfield Bridge area, increasing blockages and reactive activity on assets. Thames Water reports these wet&ndash;weather related issues impact assets here but states there are currently no assets broken or requiring repair. (p224)</p></div><div class="nugget-popup"><p>The Burghfield Bridge area is specifically named in the investigation list and was impacted by flooding in January 2024; it is included in the Section 19 investigation and information on response actions has been requested. (p225)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>15 properties flooded; 10 properties internally flooded; 5 properties externally flooded; 1 road closure [TAB] (p19)</p></div><div class="nugget-popup quant"><p>6 properties; 2 internally flooded; 4 externally flooded (p36)</p></div><div class="nugget-popup quant"><p>15 properties; 10 properties flooded internally; 5 properties flooded externally; 2 road closures [TAB,PAG] (p39)</p></div></div></body></div>`)[0];

                var html_691700decfc70471cc474f1ecac0cdf6 = $(`<div id="html_691700decfc70471cc474f1ecac0cdf6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Thames</h1><div class="nugget-popup"><p>Elevated river levels and flows associated with Storm Henk contributed to flooding in adjacent settlements; the report assesses levels and flows linked to the event. (p24)</p></div><div class="nugget-popup"><p>The River Thames is described as a fluvial source that contributed to flooding in Pangbourne during the January 2024 event (first signs 04/01/2024). (p100)</p></div><div class="nugget-popup"><p>High river levels from the River Thames contributed to fluvial flooding in Pangbourne during early January 2024, causing overland flows and influencing groundwater flooding at least at one property. [PAG,IMG] (p101)</p></div><div class="nugget-popup"><p>The River Thames overtopped its banks, causing flooding of adjacent areas: it flooded a commercial property's car park and contributed to internal flooding of properties, and it backed up into the River Pang causing overtopping at the Wharf. The high river levels also directly flooded a medical surgery car park. (p102)</p></div><div class="nugget-popup"><p>Levels rose above typical range in January 2024, causing the River Thames to overtop its banks and back up the River Pang; this overtopping contributed to flooding in Pangbourne. [PAG] (p103)</p></div><div class="nugget-popup"><p>High river levels on the River Thames led to debris accumulation on a weir (debris was cleared after the first high levels) and the river caused fluvial flooding in Pangbourne, resulting in internal flooding of some properties and external flooding of others. [PAG] (p105)</p></div><div class="nugget-popup"><p>Fluvial flooding from the River Thames contributed to the flooding in Purley (Lower Purley) during the early&ndash;2024 event. (p109)</p></div><div class="nugget-popup"><p>Fluvial flooding from the River Thames (followed by groundwater and sewer impacts) inundated large areas of Lower Purley. Approximately 75 properties experienced external and/or internal flooding (all 75 had garden flooding; 41 had garage flooding). About 25 properties flooded internally. Internal flood depths in affected properties ranged from approximately 250 mm to 1.3 m; external flooding reached depths up to about 1.5 m. Internal flooding persisted for up to two weeks in some properties; many residents were unable to use wastewater facilities effectively. [IMG] (p110)</p></div><div class="nugget-popup"><p>River Thames overflow / fluvial flooding was a primary cause of flooding affecting riverside properties (notably River Gardens) and contributed to road flooding in the area. (p111)</p></div><div class="nugget-popup"><p>River Thames levels spiked and overtopped banks, enabling flooding of low&ndash;lying areas in Purley on Thames; peak levels were reported well above normal summer levels. [PAG] (p112)</p></div><div class="nugget-popup"><p>River levels rose above the Blount's Meadow bund, causing fluvial flooding that led to internal, garage and garden flooding of properties along Wintringham Way and road flooding in Purley on Thames. (p113)</p></div><div class="nugget-popup"><p>High river levels and debris on weirs affected river operations; the Environment Agency cleared debris after the first high river levels but were unable to clear further debris later due to health and safety risks. River Thames fluvial flooding caused property flooding in Purley on Thames. (p114)</p></div><div class="nugget-popup"><p>Fluvial (river) flooding from the Thames contributed to flooding in Purley on Thames during the storms, contributing to property flooding and road closures. [TAB,PAG] (p116)</p></div><div class="nugget-popup"><p>The River Thames overtopped its banks between Cleeve Lock and Goring Lock, causing fluvial flooding and contributing to groundwater emergence (springs) and surface&ndash;water impacts in adjacent agricultural and developed areas. [IMG] (p118)</p></div><div class="nugget-popup"><p>Elevated river levels caused by prolonged high groundwater and significant rainfall led the River Thames to overtop its banks and flood the low&ndash;lying area of Cleeve Court and nearby properties in Streatley. [PAG] (p119)</p></div><div class="nugget-popup"><p>During January the River Thames experienced significantly elevated levels that overtopped banks and caused flooding of adjacent low&ndash;lying land (notably Cleeve Court in Streatley). Debris and accumulation of dead trees along approximately 6 m of the Oxford side were noted to be affecting flow capacity. (p120)</p></div><div class="nugget-popup"><p>The River Thames rose during the named storms of early 2024, contributing to fluvial flooding; debris build&ndash;up at Goring Lock led to internal flooding of one property in Streatley. Weirs were operated and partially closed/reopened during the events, and a flood alert was in force for part of the period. (p122)</p></div><div class="nugget-popup"><p>Floodwaters from the River Thames were the source of flow routes into the adjacent residential area, initiating primary flow paths from the river into the neighbourhood. [IMG] (p156)</p></div><div class="nugget-popup"><p>A River Thames flood warning for Purley Village was in force from 03/01/2024 to 13/01/2024. Historic flood outlines for this location were recorded for 1947, 1977, 2000, 2002/3, 2007 and 2008; an extract of properties affected for Purley was provided by the Environment Agency. (p208)</p></div><div class="nugget-popup"><p>This winter's high flows contributed to widespread and prolonged flooding of the Thames floodplain in the area; EA operated weirs (opening them in high flows) and confirmed no specific capacity constraints at this location. (p209)</p></div><div class="nugget-popup"><p>The River Thames experienced elevated levels during the named storms in early January 2024; this led to operation of local locks and weirs (part&ndash;closure, reopening) and periods where the Thames operated as a natural river when weirs were fully drawn. [PAG] (p211)</p></div><div class="nugget-popup"><p>Environment Agency issued a flood alert for the River Thames and its tributaries from Days Lock to above Pangbourne that was in force 31/12/2023&ndash;15/01/2024 (covering part of the Thames reach within West Berkshire). [PAG] (p212)</p></div><div class="nugget-popup"><p>Localised river flooding occurred in the River Thames corridor where debris at Goring Lock / Rymer weir led to water swirling into a residential property; EA records indicate no specific capacity constraints for the river here and that flooding was driven by saturated soils, repeated heavy rain and high groundwater. (p213)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 properties (internal); 2 residential and 2 commercial; 1 residential property also experienced external fluvial flooding (internal groundwater flooding of ~75 mm affected the same property) [PAG,IMG] (p101)</p></div><div class="nugget-popup quant"><p>commercial property flood depths 200 mm&ndash;1 m (early Jan); residential internal depths ~200 mm (peak ~12/13 Jan); flood depth ~50 cm by 06 Jan (p102)</p></div><div class="nugget-popup quant"><p>five reports of flooding across Pangbourne; 2 properties internal fluvial flooding; 3 properties external fluvial flooding [PAG] (p105)</p></div><div class="nugget-popup quant"><p>75 properties; 25 properties flooded internally; 41 properties experienced garage flooding; internal depths ~250 mm to 1.3 m; external depths up to ~1.5 m; internal flooding up to two weeks. [IMG] (p110)</p></div><div class="nugget-popup quant"><p>peak flood levels approximately 2 m above normal summer level [PAG] (p112)</p></div><div class="nugget-popup quant"><p>2 properties; 10 properties; 12 properties (p113)</p></div><div class="nugget-popup quant"><p>12 reports of flooding across Purley on Thames; 2 properties affected by internal fluvial flooding; 2 properties affected by external fluvial flooding (p114)</p></div><div class="nugget-popup quant"><p>75 properties (total flooded in Purley) [TAB,PAG] (p116)</p></div><div class="nugget-popup quant"><p>approximately 6 properties flooded internally; approximately 4 properties affected by internal groundwater flooding [IMG] (p118)</p></div><div class="nugget-popup quant"><p>11 properties; 3 properties [PAG] (p119)</p></div><div class="nugget-popup quant"><p>approximately 6 m (dead trees/debris along Oxford side of channel) (p120)</p></div><div class="nugget-popup quant"><p>1 property (p122)</p></div><div class="nugget-popup quant"><p>6 recorded flood outlines (1947, 1977, 2000, 2002/3, 2007, 2008) (p208)</p></div><div class="nugget-popup quant"><p>10&ndash;20% (estimated flood&ndash;mitigation contribution of local weirs) (p211)</p></div><div class="nugget-popup quant"><p>1 residential property; 1 report (p213)</p></div></div></body></div>`)[0];
                popup_df23da590a89b9506318fd27964f6b13.setContent(html_691700decfc70471cc474f1ecac0cdf6);

                var html_8acc153754adb639e4672dbf45a8e44d = $(`<div id="html_8acc153754adb639e4672dbf45a8e44d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Kennet</h1><div class="nugget-popup"><p>Described as a fluvial source contributing to flooding in Burghfield Bridge (early 2024) and to the winter 2013/14 event; contributed to internal and external property flooding in the village. [MUL] (p32)</p></div><div class="nugget-popup"><p>The River Kennet was a fluvial source contributing to the Burghfield Bridge flooding; fluvial flows (from the River Kennet and the Kennet & Avon Canal) were identified as sources of flooding during the event. [PAG] (p33)</p></div><div class="nugget-popup"><p>Approximately 400 m east of Burghfield Road bridge, during the 2024 flood event only six of seven sluice gates were fully operational, which reduced the flow of water discharging to lakes to the south and to a separate branch of the River Kennet. (p35)</p></div><div class="nugget-popup"><p>The investigation indicates potential capacity or condition issues with the River Kennet, with frequent overtopping occurring during the flood event; this contributed to high peak volumes affecting Burghfield Bridge and increased local flood risk. (p38)</p></div><div class="nugget-popup"><p>The River Kennet was a fluvial source contributing to flooding and, together with the Kennet and Avon Canal and overtopped lakes, led to inundation at Pingewood in early 2024. [IMG,PAG] (p40)</p></div><div class="nugget-popup"><p>The River Kennet was identified as a fluvial source that caused flooding in Sheffield Bottom and across Burghfield during the January 2024 event. (p48)</p></div><div class="nugget-popup"><p>The River Kennet overtopped its banks in early January 2024. Excess water from the Kennet flowed into local lakes (Fishing Lake 1 then into Woolwich Green Lake) and contributed to downstream overtopping and flows between connected lakes. (p49)</p></div><div class="nugget-popup"><p>The River Kennet exceeded its capacity during exceptional rainfall (storms Henk, Isha and Jocelyn), contributing&mdash;together with high groundwater and DOBS exceeding capacity&mdash;to fluvial flooding in Sheffield Bottom and nearby roads during January 2024. (p50)</p></div><div class="nugget-popup"><p>The River Kennet (and associated canal) influenced flooding in Newbury South during the January 2024 event; fluvial factors from the river contributed to local inundation. (p80)</p></div><div class="nugget-popup"><p>The River Kennet did not overtop the flood wall during the January 2024 event but is described as a likely influence on raised groundwater levels that contributed to above&ndash;ground and internal flooding at adjacent properties (for example on Northcroft Lane). [PAG,IMG] (p81)</p></div><div class="nugget-popup"><p>Fluvial flooding from the River Kennet contributed to flooding of the island between the River Kennet and the Kennet and Avon Canal and to external flooding in the Northcroft area (including Northcroft Terrace properties and the gravel car park). The gravel car park (river side of the flood wall) flooded with reported flood depths of approximately 1.2 m. (p82)</p></div><div class="nugget-popup"><p>High flows in the River Kennet submerged road drainage outfalls, allowing river water to back up road drainage and cause road gullies to surcharge; this surcharging was reported to continue for around one week after the rain ceased. (p83)</p></div><div class="nugget-popup"><p>High river levels threatened fluvial flooding of the Northcroft area during January 2024. A flood wall along the north bank (from The Lock, Stock and Barrel pub to Northcroft Field) contained river levels and was not exceeded during the 01 Jan 2024 &ndash; 31 Jan 2024 event. (p84)</p></div><div class="nugget-popup"><p>The River Kennet contributed fluvial flooding across the south of Newbury during the January 2024 event; reports of external fluvial flooding to properties (Ampere Road) were received in association with the river. (p85)</p></div><div class="nugget-popup"><p>Fluvial flooding from the River Kennet contributed to flood risk on the island between the river and the Kennet and Avon Canal and threatened the rear of properties on Northcroft Lane; the report recommends a flood alleviation scheme for the island and review of a 2013 flood defence wall for potential pathways beneath the wall. (p87)</p></div><div class="nugget-popup"><p>Identified as the believed source of flooding affecting Crookham Hill and Avenell's Cottages during the January 2024 events. (p134)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 18 properties flooded internally; approximately 4 properties flooded externally [MUL] (p32)</p></div><div class="nugget-popup quant"><p>six out of seven sluice gates (p35)</p></div><div class="nugget-popup quant"><p>flood depth of approximately 1.2 m in the gravel car park (p82)</p></div><div class="nugget-popup quant"><p>approximately one week (p83)</p></div><div class="nugget-popup quant"><p>3 properties (p85)</p></div></div></body></div>`)[0];

                var html_a355468e3ec272044922e276a2997739 = $(`<div id="html_a355468e3ec272044922e276a2997739" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Lambourn</h1><div class="nugget-popup"><p>Surcharged manholes caused raw sewage to discharge into the winterbourne stream and subsequently into the River Lambourn; the river was involved in the fluvial component of the January 2024 flooding in Great Shefford and contributed to disruption of local wastewater facilities. [PAG,IMG] (p64)</p></div><div class="nugget-popup"><p>Fluvial flooding from the River Lambourn contributed to flooding across the north of Newbury during the January 2024 event. [PAG] (p95)</p></div><div class="nugget-popup"><p>Flow routes converge toward the River Lambourn and a blocked spout drain near the southern site boundary, producing road flooding concentrated near river crossings and low&ndash;lying central areas of the mapped Pangbourne site. The river&ndash;associated flooding increased risk to nearby infrastructure and assets including the A339, Shaw Road, Kiln Road, Trinity School, St Mary&#8217;s Church, The Castle and The Chequers Hotel. [IMG] (p152)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 properties internal flooding; 10 properties external flooding; 20 properties affected by wastewater disruption [PAG,IMG] (p64)</p></div></div></body></div>`)[0];

                var html_c51f11fa46db6245d2d85daa682a82ca = $(`<div id="html_c51f11fa46db6245d2d85daa682a82ca" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wantage Road, Lambourn</h1><div class="nugget-popup"><p>Flooding occurred on Wantage Road (document caption: 'Flooding at Wantage Road'). (p9)</p></div><div class="nugget-popup"><p>Manholes surcharged outside properties along Wantage Road as the sewer system reached capacity and surcharged. Surface water ran off surrounding hills and pooled on the road and adjacent property areas, causing localised flooding (photograph shows standing water in a passage adjacent to a house). A potentially collapsed drain in front of Downside House on Wantage Road was reported and may have further reduced sewer capacity. [IMG] (p66)</p></div><div class="nugget-popup"><p>Flooding occurred at Wantage Road during the early 2024 event (referenced in the report as 'Flooding at Wantage Road'), consistent with local reports that parts of Lambourn flooded from river, groundwater, surface water and sewer sources. [PAG] (p72)</p></div><div class="nugget-popup"><p>Floodwaters reached approximately 200mm depth and made the road impassable, cutting this route into/out of the village. [PAG] (p73)</p></div><div class="nugget-popup"><p>Roadside flooding occurred adjacent to a watercourse; temporary flood mitigation (sandbags, a plastic barrier and a floating boom) was deployed at the carriageway edge to prevent water entering the road. Water level in the channel was high and close to the pavement; lack of road drainage and limited ditch capacity created a flow path of water into the village and prolonged surface water inundation. [PAG,IMG] (p74)</p></div><div class="nugget-popup"><p>Closed on 5 January 2024 due to the January 2024 flooding event. (p76)</p></div><div class="nugget-popup"><p>Surface water inundation on the road during the early&ndash;2024 Lambourn flooding, including flows from Sheepdrove Road when the Sheepdrove culvert could not accept runoff, causing Wantage Road to become inundated and prompting recommendation for hydraulic modelling and additional drainage. (p78)</p></div><div class="nugget-popup"><p>Wantage Road was closed due to flooding; road closure enforced during the event. [TAB] (p79)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 200mm deep; impassable for approximately eight weeks [PAG] (p73)</p></div><div class="nugget-popup quant"><p>1 road closure [TAB] (p79)</p></div></div></body></div>`)[0];

 [PAG] (p119)</p></div></div></body></div>`)[0];

                var html_d35d432e73a4fd0ed134c382573cd3a5 = $(`<div id="html_d35d432e73a4fd0ed134c382573cd3a5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Winterbourne Lane, Winterbourne</h1><div class="nugget-popup"><p>Flooding occurred at Winterbourne Lane (document figure: &#8220;Figure 16&ndash;2 Flooding at Winterbourne Lane&#8221;). (p10)</p></div><div class="nugget-popup"><p>The main road through Winterbourne was affected by fluvial flooding from 4 Jan 2024 and again from 28 Mar 2024. Flood depths along the road varied with a reported maximum of approximately 300mm. The road was closed during these events, disrupting businesses and school bus routes that required access via the road. [PAG,MUL] (p127)</p></div><div class="nugget-popup"><p>Winterbourne Stream overtopped its banks north of Pebble Lane and flowed into Winterbourne Lane, covering the road surface and causing the road to be closed/managed (traffic cones shown in image). Floodwater encroached onto grassy verges either side of the road. [PAG] (p128)</p></div><div class="nugget-popup"><p>Floodwater from the overtopping Winterbourne Stream flowed into and inundated Winterbourne Lane. [PAG] (p129)</p></div><div class="nugget-popup"><p>Winterbourne Lane was closed due to flooding. (p130)</p></div><div class="nugget-popup"><p>Water from Winterbourne Stream backed up the highway drainage and flooded Winterbourne Lane. Bridges over the stream at properties created obstructions to flow during high stream levels and became unsafe to use; road drainage was overwhelmed and the carriageway flooded. (p131)</p></div><div class="nugget-popup"><p>Winterbourne Lane was closed due to flooding during the event; the lane is identified as having high surface&ndash;water flood risk and was affected by fluvial/surface water during the January 2024 incidents. [TAB] (p132)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>maximum flood depth ≈300mm [PAG,MUL] (p127)</p></div><div class="nugget-popup quant"><p>1 road closure (p130)</p></div><div class="nugget-popup quant"><p>1 road closure (Winterbourne Lane) [TAB] (p132)</p></div></div></body></div>`)[0];

                var html_44203844f01b8b3545f4ddcc9ff17d69 = $(`<div id="html_44203844f01b8b3545f4ddcc9ff17d69" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>West Berkshire</h1><div class="nugget-popup"><p>The investigation covers multiple locations across West Berkshire and reports flooding associated with the rainfall/storm event; radar and gauge data were assessed across the district to characterise the event. [PAG] (p8)</p></div><div class="nugget-popup"><p>Widespread flooding across the district impacted villages and properties: combined fluvial, groundwater, sewer and surface&ndash;water processes caused inundation; areas remained inundated for varying lengths of time during the event. [PAG,MUL] (p15)</p></div><div class="nugget-popup"><p>Storms in January 2024 caused flooding across West Berkshire, leading to internal and external property flooding to residents and businesses and road closures. [PAG,MUL] (p17)</p></div><div class="nugget-popup"><p>Multiple locations across West Berkshire experienced flooding following the January 2024 storms, resulting in internal and external property flooding and road closures; the locations investigated are listed in Table 1&ndash;1 and Figure 1&ndash;1. [PAG,IMG,MUL] (p18)</p></div><div class="nugget-popup"><p>The unitary authority area experienced flooding associated with Storm Henk (heavy rainfall and elevated river flows). Multiple locations across West Berkshire were affected and have been assessed in this report. [TAB,PAG] (p24)</p></div><div class="nugget-popup"><p>Multiple locations across West Berkshire were affected by flooding associated with an intense, spatially&ndash;localised rainfall event between 4&ndash;5 January; radar 1×1 km grid data were used to assess the rainfall and its annual exceedance probability (AEP). [PAG] (p25)</p></div><div class="nugget-popup"><p>The West Berkshire unitary area experienced a significant rainfall event across 4&ndash;5 January 2024 with heavy rainfall recorded across the region; central and northern areas had the highest totals. The event is described across the report as the main flood event affecting the authority. [PAG,IMG] (p27)</p></div><div class="nugget-popup"><p>January 2024 peak river flows and high groundwater levels across the district were often the highest on record, demonstrating unprecedented fluvial flooding in parts of the district and known groundwater flooding in some areas. [PAG] (p29)</p></div><div class="nugget-popup"><p>High river flows during Storm Henk led to flooding across many areas of West Berkshire. The impact was exacerbated by unprecedented groundwater levels which reduced the catchment's ability to absorb rainfall, increased runoff into watercourses, and resulted in river flows and levels taking an extended time to return to normal. [PAG] (p30)</p></div><div class="nugget-popup"><p>Across Burghfield (the wider parish containing Sheffield Bottom) flooding during the 2024 event was driven by fluvial sources from the River Kennet and the Kennet and Avon Canal and by overtopping of nearby lakes. Historic flooding (winter 2013/14) affected the same area. [PAG,MUL] (p48)</p></div><div class="nugget-popup"><p>Roads were inundated by a combination of surface water, fluvial floodwater and elevated groundwater. Station Road, Deans Copse Road, Hose Hill and Hagnar Road experienced flood depths that made roads impassable for cars and affected safe access and egress for AWE employees. Sheffield Bottom experienced prolonged standing floodwater (longer dissipation than 2013/14). [PAG] (p50)</p></div><div class="nugget-popup"><p>Across West Berkshire the exceptionally wet winter elevated groundwater, producing springs at topographical lows and contributing to river and surface&ndash;water flooding. Exceptional rainfall during storms Henk, Isha and Jocelyn caused the River Lambourn and Great Shefford Stream to exceed capacity. Manholes were reported surcharging outside properties along Wantage Road; a potentially collapsed drain in front of Downside House on Wantage Road may have reduced sewer capacity. One property experienced external surface&ndash;water flooding on 04 Jan (floodwater reached ~150 mm; occupants used a pump for about an hour to prevent internal flooding). Approximately two properties experienced internal fluvial flooding from the River Lambourn following Storm Henk. [PAG] (p65)</p></div><div class="nugget-popup"><p>Lambourn experienced flooding in early January 2024. Local wardens and residents reported flooding resulted from multiple sources: fluvial flooding associated with the River Lambourn (the river flowed continuously through autumn/winter 2023/24), groundwater emergence, surface water runoff, and sewer flooding. Flooding occurred in areas mapped as Flood Zone 2 and areas of high surface&ndash;water flood risk. A photograph in the report (Figure 10&ndash;2) shows flooding at Wantage Road. The early&ndash;2024 event was reported as more prolonged but less severe than the winter 2013/14 event. [PAG,IMG] (p72)</p></div><div class="nugget-popup"><p>The winter of 2023/24 was one of the wettest on record across West Berkshire, raising groundwater levels for prolonged periods and increasing flood risk. Significant rainfall during storms in January exacerbated flooding across the district, including groundwater&ndash;related and surface water incidents. [PAG] (p74)</p></div><div class="nugget-popup"><p>Surface water runoff and blocked/insufficient road drainage causing surface water to flow along the carriageway; recommendations for hydraulic modelling and additional road drainage (gullies or SuDS) to reduce flood risk. [PAG] (p78)</p></div><div class="nugget-popup"><p>Parts of the West Berkshire area (notably Newbury South) were affected by flooding in January 2024, with groundwater inundation, sewer surcharging and fluvial factors contributing to local flooding impacts. [PAG] (p80)</p></div><div class="nugget-popup"><p>Winter 2023/24 was one of the wettest on record across West Berkshire, elevating groundwater levels for prolonged periods. January storms (including Henk, Isha and Jocelyn) produced significant rainfall that exacerbated high groundwater and likely increased groundwater infiltration to sewers, contributing to sewer inundation and surcharging in locations such as Northcroft and to river&ndash;related drainage backflow. [PAG] (p83)</p></div><div class="nugget-popup"><p>Parts of West Berkshire (notably north Newbury) experienced internal and external flooding beginning around 5 January 2024 when the River Lambourn rose and breached in several places; flooding sources included fluvial, groundwater and sewer. [PAG] (p89)</p></div><div class="nugget-popup"><p>West Berkshire experienced one of the wettest winters (2023/24) with elevated groundwater across the area; storms in January raised river levels (notably the River Lambourn) causing bank overtopping and flooding in parts of the district. [PAG] (p93)</p></div><div class="nugget-popup"><p>Areas of West Berkshire experienced prolonged elevated groundwater levels during the winter of 2023/24, contributing to local flooding when combined with heavy January rainfall and river overtopping. [PAG] (p103)</p></div><div class="nugget-popup"><p>The winter of 2023/24 and intense January storms elevated groundwater across areas of West Berkshire for prolonged periods; this, together with high river levels and sewer infiltration/overload, contributed to flooding in the district (notably Purley on Thames). [PAG] (p112)</p></div><div class="nugget-popup"><p>Road closure due to flooding reported by local flood wardens. [PAG] (p115)</p></div><div class="nugget-popup"><p>High groundwater across West Berkshire, together with significant January rainfall, caused River Thames levels to spike and overtop banks, resulting in flooding of low&ndash;lying areas (notably Streatley/Cleeve Court). Floodwaters receded slowly with areas of perched water persisting due to high groundwater and surface water runoff; river channel debris and dead trees (approximately 6 m) reduced flow capacity. [PAG] (p120)</p></div><div class="nugget-popup"><p>The winter of 2023/24 was one of the wettest on record in West Berkshire, elevating groundwater levels for prolonged periods and contributing to fluvial flooding (e.g., raised Winterbourne Stream levels that led to overtopping at Winterbourne). [PAG] (p128)</p></div><div class="nugget-popup"><p>Extensive flooding across the district during January 2024. Majority of flooding occurred on 05 Jan 2024, with further inundation from subsequent storms; areas remained inundated for varying lengths of time. Flooding caused road closures and internal and external property flooding. Peak river levels in January 2024 were the highest or second highest on record at analysed sites; peak flows at multiple gauges were within the top four on record; peak groundwater levels were within the top five on record. [PAG] (p135)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8 1 x 1 radar grid squares assessed [PAG] (p8)</p></div><div class="nugget-popup quant"><p>approximately 210 properties; approximately 77 properties experienced internal flooding; approximately 133 properties experienced external flooding [PAG,MUL] (p15)</p></div><div class="nugget-popup quant"><p>Reported impacts by location from Table 1&ndash;1 include: Burghfield &mdash; 15 properties flooded (10 internally, 5 externally); Pingewood &mdash; 4 properties flooded (1 internally, 3 externally); Sheffield Bottom &mdash; 10 properties flooded (7 internally, 3 externally); Eastbury &mdash; 9 properties flooded (6 internally, 3 externally); Great Shefford &mdash; 10 properties flooded (3 internally, 7 externally); Lambourn &mdash; 5 properties flooded (3 internally, 2 externally); Newbury (South) &mdash; 10 properties flooded (7 internally, 3 externally); Newbury (North) &mdash; 51 properties flooded (4 internally, 47 externally); Pangbourne &mdash; 4 properties flooded (4 internally, external unknown); Purley on Thames &mdash; 75 properties flooded (25 internally, 50 externally); Streatley &mdash; 21 properties flooded (6 internally, 15 externally); Winterbourne &mdash; 11 properties flooded (2 internally, 9 externally). [PAG,IMG,MUL] (p18)</p></div><div class="nugget-popup quant"><p>Rainfall AEP range 1 in 4&ndash;year to 1 in 10&ndash;year across assessed radar grids; highest rainfall polygons 35&ndash;37.5 mm in central areas [PAG,IMG] (p27)</p></div><div class="nugget-popup quant"><p>13 groundwater gauges analysed; 7 gauges discounted; 6 gauges taken forward for analysis; 3 gauges recorded the highest groundwater levels on record [PAG] (p29)</p></div><div class="nugget-popup quant"><p>approximately 18 properties flooded internally; approximately 4 properties flooded externally [PAG,MUL] (p48)</p></div><div class="nugget-popup quant"><p>approximately 150 mm flood depths on Station Road, Deans Copse Road, Hose Hill and Hagnar Road [PAG] (p50)</p></div><div class="nugget-popup quant"><p>1 property; 2 properties; 10 properties [PAG] (p65)</p></div><div class="nugget-popup quant"><p>approximately 6 m (dead trees/debris along river channel) [PAG] (p120)</p></div><div class="nugget-popup quant"><p>8 analysed sites; 5 gauges; peak groundwater levels within top five on record [PAG] (p135)</p></div></div></body></div>`)[0];
                popup_25c61d125987834754571bdee1d9ca9d.setContent(html_44203844f01b8b3545f4ddcc9ff17d69);

                var html_e14c37c448cb6faaca0f1c1a8525083b = $(`<div id="html_e14c37c448cb6faaca0f1c1a8525083b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kennet and Avon Canal</h1><div class="nugget-popup"><p>The Kennet and Avon Canal exceeded its capacity and overtopped; high canal water levels flowed south from the canal into the developed area at Burghfield Bridge when the north bank overtopped. [PAG,MUL] (p34)</p></div><div class="nugget-popup"><p>During the 2024 flood event the Kennet and Avon Canal overtopped its south bank and flowed south into the developed area of Burghfield Bridge. The south banks were noted as being significantly weakened in places from mooring canal boats and lack of management, and there was concern that canal boats could break loose and block flow downstream under Burghfield Road bridge. (p35)</p></div><div class="nugget-popup"><p>Unstable banks along the Kennet and Avon Canal (particularly the south bank) were highlighted, likely from erosion by mooring boats; the condition reduces canal capacity and risks overtopping during high flows, prompting recommendations for remedial works and bank strengthening to prevent further overtopping. [PAG] (p38)</p></div><div class="nugget-popup"><p>Unstable and eroded banks (notably the south bank) on the Kennet and Avon Canal were identified; reduced capacity and overtopping risk were noted and recommended for restoration to prevent further overtopping during flood events. [PAG] (p39)</p></div><div class="nugget-popup"><p>The Kennet and Avon Canal is described as a fluvial source and as a barrier to floodwater escape; it contributed to the flooding and trapping of water at Pingewood during early 2024 when lakes overtopped. [IMG,PAG] (p40)</p></div><div class="nugget-popup"><p>The Kennet and Avon Canal contributed to fluvial flooding in the area (noted as part of the flood sources affecting Sheffield Bottom) and its overflow/overtopping was linked to local inundation during the January 2024 event. (p48)</p></div><div class="nugget-popup"><p>During high flows a large volume of flows passed below Station Road and the Canal/canal infrastructure was used to move floodwaters away from Sheffield Bottom (hatches opened by the Canal and River Trust to allow canal flow to move floodwater). (p49)</p></div><div class="nugget-popup"><p>Locks along the Kennet and Avon Canal were operated in response to high flows; residents consider lock operation (or closure) may have influenced downstream flow and contributed to flooding in Sheffield Bottom during January 2024. (p50)</p></div><div class="nugget-popup"><p>The island between the River Kennet and the Kennet and Avon Canal is believed to have had additional properties affected by flooding, though the flood extent and specific impacts are not reported. (p82)</p></div><div class="nugget-popup"><p>The Kennet and Avon Canal (adjacent to the River Kennet) is part of the flooding scenario affecting the island between the two watercourses; a flood alleviation scheme is recommended to reduce risk to the island and nearby properties. (p87)</p></div></div></body></div>`)[0];

                var html_6cf0774240b153b42034aa3b213f407b = $(`<div id="html_6cf0774240b153b42034aa3b213f407b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Winterbourne</h1><div class="nugget-popup"><p>The report contains a dedicated 'FLOODING' section for Winterbourne (Section 16.2), indicating the settlement was affected by flooding during the documented storm event. (p8)</p></div><div class="nugget-popup"><p>Internal and external property flooding to residents and businesses and road closures were reported in Winterbourne during the January 2024 storms. [MUL] (p17)</p></div><div class="nugget-popup"><p>Flooding following the storms caused 11 properties to flood in Winterbourne, of which 2 were internally flooded and 9 externally flooded; one road closure was recorded. [TAB] (p19)</p></div><div class="nugget-popup"><p>Flow routes and the main river (Winterbourne) run through the centre of the village. Flooding risk is concentrated where the river crosses the main road, causing road flooding and directing water through the village and towards property clusters within the site boundary. [IMG] (p160)</p></div><div class="nugget-popup"><p>Subject of a Section 19 flood investigation for flooding in January 2024. The Environment Agency response describes the Winterbourne flood alleviation scheme (realignment of the Winterbourne Stream and construction of a flood defence bund and control structures) intended to intercept fluvial and rainfall flows affecting the village. [TAB] (p215)</p></div><div class="nugget-popup"><p>Flooding at Winterbourne was included in the Section 19 investigation following the January 2024 storms (Storm Henk 02/01/2024; Storm Isha 21&ndash;22/01/2024; Storm Jocelyn 23&ndash;24/01/2024). (p223)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>11 properties flooded; 2 properties internally flooded; 9 properties externally flooded; 1 road closure [TAB] (p19)</p></div></div></body></div>`)[0];

                var html_607788a4d82eabde435a4d0f7e2ffe7f = $(`<div id="html_607788a4d82eabde435a4d0f7e2ffe7f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Newbury</h1><div class="nugget-popup"><p>Flooding affected locations within Newbury as shown by multiple figures in the report (examples include Swan Court, Northcroft Park and Shooters Hill). (p10)</p></div><div class="nugget-popup"><p>Flooding following the storms affected both parts of Newbury: Newbury (South) reported 10 properties flooded (7 internally, 3 externally) with 2 road closures; Newbury (North) reported 51 properties flooded (4 internally, 47 externally) with 2 road closures. [TAB] (p19)</p></div><div class="nugget-popup"><p>Affected by flooding associated with Storm Henk (heavy rainfall and raised flows) and included in the report's assessment of impacted areas. [PAG] (p24)</p></div><div class="nugget-popup"><p>The Newbury area is cited as one of the affected flooded areas during the rainfall event (the nearest rain gauge to Newbury was 6.6 km away, so radar data were used to better represent the localised rainfall that caused flooding there). (p25)</p></div><div class="nugget-popup"><p>Identified as one of the eight main affected locations assessed in the January 2024 flood investigation; a 1 x 1 km radar grid was purchased and assessed at this location. Newbury experienced significant rainfall during the 4&ndash;5 January 2024 event that formed part of the flood event and was therefore investigated. [PAG,IMG] (p27)</p></div><div class="nugget-popup"><p>Newbury (south), including Northcroft and West Mills, experienced flooding beginning 4 January 2024. Flooding was caused by groundwater inundation, sewer surcharging and fluvial (river) factors, resulting in inundation of streets and properties in the Newbury South area. [PAG] (p80)</p></div><div class="nugget-popup"><p>Parts of Newbury (South) &mdash; including Northcroft and West Mills &mdash; experienced flooding that began on 4 January 2024. Flooding sources reported for the area during the January 2024 event included groundwater inundation, sewer surcharging and fluvial influence; properties experienced both internal and external flooding, and flooding occurred in areas mapped as Flood Zone 3. [PAG,IMG] (p81)</p></div><div class="nugget-popup"><p>High groundwater in and around Newbury during winter 2023/24, combined with heavy rainfall from January storms, caused groundwater emergence and infiltration into the sewer network. The sewer system in Northcroft was inundated and surcharged into roads. River Kennet levels submerged road drainage outfalls, enabling river water to back up road gullies; road drainage continued to surcharge for approximately one week after rainfall ceased. (p83)</p></div><div class="nugget-popup"><p>Flood wardens reported road flooding in south Newbury in January 2024. Wardens believed Thames Water may have cleared a sewer blockage, after which no further road flooding was reported. (p84)</p></div><div class="nugget-popup"><p>Flooding across the south of Newbury during January 2024 from fluvial sources (River Kennet) and groundwater; external fluvial flooding was reported to properties in Ampere Road; Northcroft Lane (south Newbury) was closed from 10 Jan 2024 to 14 Jan 2024 due to flooding. [PAG] (p85)</p></div><div class="nugget-popup"><p>Newbury was affected by the January 2024 flooding: Northcroft Lane in the southern part of Newbury was closed (10 Jan&ndash;14 Jan 2024) and Royal Berkshire Fire and Rescue Service attended one flood&ndash;related incident in Newbury during Storm Henk. (p86)</p></div><div class="nugget-popup"><p>Areas in the south of Newbury (including Northcroft and Northcroft Lane) were affected by flooding during the event: highway drainage overwhelmed/insufficient, sewer inundation and surcharging occurred, and fluvial flooding threatened properties (notably the rear of properties on Northcroft Lane). Recommendations include CCTV surveys, drainage maintenance, and review of flood defence walls. (p87)</p></div><div class="nugget-popup"><p>Flooding in south Newbury: 10 properties flooded (7 internally, 3 externally). Two road closures affecting Northcroft Lane and West Street. Sources recorded as fluvial, groundwater and sewer. [TAB,PAG] (p88)</p></div><div class="nugget-popup"><p>Beginning around 5 January 2024 the River Lambourn rose and breached in several places, resulting in internal and external flooding across north Newbury. Flooding sources reported were fluvial (river), groundwater and sewer. [PAG] (p89)</p></div><div class="nugget-popup"><p>River Lambourn levels rose and breached in several places causing internal and external flooding across Newbury (north). Flooding was driven by fluvial, groundwater and sewer sources; River Lambourn peak level reached 2.06 m. First signs of flooding began around 5 January 2024 (site visit 22 March 2024 confirmed impacts). [PAG,IMG] (p90)</p></div><div class="nugget-popup"><p>Multiple locations in and north of Newbury were affected by fluvial (River Lambourn) and groundwater flooding, with concurrent sewer and surface&ndash;water issues. Approximately 24 properties along Newport Road experienced external fluvial or groundwater flooding; groundwater flooding persisted for months. Around four properties on Doveton Way experienced a mixture of external fluvial, groundwater, surface water and sewer flooding. Foul sewer flooding began on 4 December 2023 and persisted into the 2024 event; approximately eight properties on Newport Road experienced external sewer flooding. Drains were surcharging foul water on Pike Street and Trout Walk. Debris&ndash;filled fluvial floodwaters from Newport Road reached Lambourn Court Care Home and Walton Way/Trout Walk; the care home had significantly deep external groundwater and fluvial flooding (no internal flooding reported). Garages along Trout Walk are reported to have experienced external flooding. (p91)</p></div><div class="nugget-popup"><p>Areas of Newbury experienced internal and external flooding caused by elevated groundwater, the River Lambourn overtopping its banks, and sewer impacts; some properties remained inundated at the time of the site visit in early January. [PAG] (p92)</p></div><div class="nugget-popup"><p>Newbury experienced flooding driven by elevated groundwater, overtopping of the River Lambourn following heavy January storms, and surcharging of the sewer network; resulted in internal and external flooding of properties and repeated inundation through January&ndash;February 2024. (p93)</p></div><div class="nugget-popup"><p>Northern Newbury experienced flooding (photo evidence shows water reaching the edge of a residential building north of Coachman's Court). The town has embankment&ndash;style flood defences in the north that vary in maintenance; some areas were protected by Shaw Flood Alleviation Scheme. [PAG] (p94)</p></div><div class="nugget-popup"><p>Multiple reports of flooding across Newbury during the January 2024 flood event, including groundwater flooding, sewer flooding and fluvial flooding from the River Lambourn across the north of Newbury. The Environment Agency visited a property affected by internal groundwater flooding on Church Road on seven occasions. Community Information Officers visited the area between 04 Jan and 12 Jan 2024 to provide advice and gather information. [PAG] (p95)</p></div><div class="nugget-popup"><p>Flooding in the north area of Newbury led to the closure of Pike Street and Walton Way. Royal Berkshire Fire and Rescue Service attended one incident in Newbury during Storm Henk. (p96)</p></div><div class="nugget-popup"><p>Residents in Newbury were affected by flooding related to multiple interacting sources. During the site visit residents reported that Environment Agency flood alerts/warnings were issued too late. A blocked trash screen on Spout Ditch was observed obstructing flow and causing upstream backing that contributed to local inundation risk. Drains at Glebefields car park were reported unmaintained and may have reduced local drainage capacity. (p97)</p></div><div class="nugget-popup"><p>Fluvial and groundwater flooding affected areas mapped as Flood Zone 2 and 3; significant sewer flooding occurred in high surface water flood risk areas. Flooding affected critical drainage areas including River Walk and Walton Way, causing property flooding and road closures. [PAG] (p98)</p></div><div class="nugget-popup"><p>Multiple flood sources (fluvial, groundwater and sewer) caused flooding in the Newbury (North) area; authorities attended and road closures were enforced. [TAB] (p99)</p></div><div class="nugget-popup"><p>Road closures in Newbury during the event: Milkhouse Road (closure recorded 10th January 2024) and Two Rivers Way (closure recorded 5th January 2024). [TAB] (p133)</p></div><div class="nugget-popup"><p>Properties in Newbury were flooded; the Environment Agency holds a Property_flooding_log for Newbury recording properties confirmed as affected. EA Community Information Officers attended Newbury (and nearby Shaw) between 04/01/2024 and 12/01/2024 to provide advice and gather intelligence about property flooding. The EA did not deploy operational resources to the location. [PAG] (p200)</p></div><div class="nugget-popup"><p>Royal Berkshire Fire and Rescue Service (RBFRS) attended one flooding incident in Newbury during Storm Henk; RBFRS response was the only flooding incident called in and responded to by RBFRS within the specified target locations and storm dates. (p219)</p></div><div class="nugget-popup"><p>Flooding occurred in Newbury associated with Storm Henk (02/01/2024), Storm Isha (21/01/2024&ndash;22/01/2024), and Storm Jocelyn (23/01/2024&ndash;24/01/2024); the event is the subject of a Section 19 flood investigation. [MUL] (p220)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Newbury (South): 10 properties flooded; 7 properties internally flooded; 3 properties externally flooded; 2 road closures; Newbury (North): 51 properties flooded; 4 properties internally flooded; 47 properties externally flooded; 2 road closures [TAB] (p19)</p></div><div class="nugget-popup quant"><p>3 properties on Northcroft Lane; 2 further properties on Northcroft Lane; 2 properties on West Mills; 250 mm peak flood depth (Northcroft Lane) [PAG,IMG] (p81)</p></div><div class="nugget-popup quant"><p>3 properties [PAG] (p85)</p></div><div class="nugget-popup quant"><p>1 incident; 1 street closure (Northcroft Lane) (p86)</p></div><div class="nugget-popup quant"><p>10 properties flooded; 7 properties flooded internally; 3 properties flooded externally; 2 road closures [TAB,PAG] (p88)</p></div><div class="nugget-popup quant"><p>approximately 24 properties (Newport Road); approximately 4 properties (Doveton Way); approximately 8 properties (external sewer flooding on Newport Road); 1 property (internal sewer flooding after Storm Henk, persisted 11 weeks until Thames Water cleared a blockage) (p91)</p></div><div class="nugget-popup quant"><p>2 residents; 1 property; 600mm [PAG] (p92)</p></div><div class="nugget-popup quant"><p>7 visits by the Environment Agency to a Church Road property [PAG] (p95)</p></div><div class="nugget-popup quant"><p>one incident; 2 streets closed (p96)</p></div><div class="nugget-popup quant"><p>51 properties flooded; 4 properties flooded internally; 47 properties flooded externally; 2 road closures [PAG] (p98)</p></div><div class="nugget-popup quant"><p>51 properties flooded; 4 properties flooded internally; 47 properties flooded externally; 2 road closures [TAB] (p99)</p></div><div class="nugget-popup quant"><p>one incident (p219)</p></div></div></body></div>`)[0];

                var html_b1be2e15c54b0845f17949c7094e668a = $(`<div id="html_b1be2e15c54b0845f17949c7094e668a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Pingewood</h1><div class="nugget-popup"><p>Identified as one of the areas that experienced the most severe flooding during the West Berkshire 2024 flood event and investigated in the Section 19 report; flooding occurred as part of the wider event influenced by heavy rainfall and high groundwater. (p15)</p></div><div class="nugget-popup"><p>Listed as a location under investigation following the January 2024 storms; the report links these investigations to flooding that led to internal and external property flooding and road closures. (p17)</p></div><div class="nugget-popup"><p>Following Storms Henk, Isha and Jocelyn, 4 properties in Pingewood were reported flooded: 1 property internally flooded and 3 properties externally flooded. Road closures reported: 2. [TAB] (p19)</p></div><div class="nugget-popup"><p>Pingewood, a topographic low with interconnected fishing lakes and ditches, was inundated when fluvial flows from the River Kennet and Kennet and Avon Canal and overtopping of the lakes to the north caused floodwater to be trapped (barriers such as the canal, railway and M4 prevented escape), resulting in flooding in early 2024. [IMG,PAG] (p40)</p></div><div class="nugget-popup"><p>Fluvial (river) flooding in early January 2024 affected areas of Pingewood (areas in Flood Zone 2 and 3). Internal fluvial flooding affected one residential property on Kirtons Farm Road; external fluvial flooding affected another residential property on Kirtons Farm Road and an angling club. The Cottage Lane Ditch backed up and overtopped, sending water along Cottage Lane into Kirtons Farm Road and down to Berrys Lane; water then flowed into Pingewood Lagoon and Englefield Lagoon via grips. A SSE substation on Cottage Lane was reported to have flooded but not to a degree that caused loss of power. Flooding began in early January following Storm Henk and continued for approximately one month. [PAG] (p41)</p></div><div class="nugget-popup"><p>Blocked/partially blocked culverts beneath the Reading&ndash;Basingstoke railway and dense ditch vegetation caused flows to back up into the northern lakes and southwards; backed&ndash;up flows and a partly blocked southern culvert caused flooding of Cottage Lane and surrounding low&ndash;lying areas in early 2024. [PAG] (p42)</p></div><div class="nugget-popup"><p>Blocked culverts and restricted flows caused water to back up into the northern lakes and altered flow patterns through Pingewood, increasing local flood risk and contributing to downstream flooding (notably affecting Cottage Lane). [PAG] (p43)</p></div><div class="nugget-popup"><p>Local flooding issues were associated with blocked/poorly maintained drainage (including a blocked northern railway culvert and silted downstream ditch). The situation prompted recommendations to investigate clearing the culvert and to confirm and enforce ditch/culvert maintenance to improve conveyance and reduce flood risk upstream and downstream. (p46)</p></div><div class="nugget-popup"><p>Fluvial flooding occurred in areas mapped as Flood Zone 2 and Flood Zone 3. Four properties were flooded (one internally and three externally). Flooding led to road closures at Kirtons Farm Road and Berrys Lane. The flooding is reported as resulting from Storms Henk, Isha and Jocelyn. [TAB] (p47)</p></div><div class="nugget-popup"><p>The locality of Pingewood lies within the mapped site boundary; the map shows floodwater entering from the north, flowing southward, and converging in central/southern parts of the site, placing Pingewood within the identified zone at risk and on predicted flood routes. Blocked culverts are noted as likely contributors to increased inflow. [IMG] (p140)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 properties; 1 internally flooded; 3 externally flooded; 2 road closures [TAB] (p19)</p></div><div class="nugget-popup quant"><p>approximately three properties; one residential property (internal flooding); one residential property (external flooding); one angling club; maximum flood depth of approximately 0.5 m in the angling club carpark; one SSE substation (reported may have flooded) [PAG] (p41)</p></div><div class="nugget-popup quant"><p>two culverts; southern culvert approximately 30% blocked [PAG] (p42)</p></div><div class="nugget-popup quant"><p>one northern culvert considered blocked; one additional culvert east of the railway reported blocked [PAG] (p43)</p></div><div class="nugget-popup quant"><p>4 properties; 1 property flooded internally; 3 properties flooded externally; 2 road closures [TAB] (p47)</p></div></div></body></div>`)[0];
                popup_efe19fee723b877481fec9a93919bdff.setContent(html_b1be2e15c54b0845f17949c7094e668a);

                var html_a9cbe9168b1e1df4b88cbff3c1ecea12 = $(`<div id="html_a9cbe9168b1e1df4b88cbff3c1ecea12" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Sheffield Bottom</h1><div class="nugget-popup"><p>Recorded in the report (as Sheffield Bottom) as one of the locations that experienced the most severe flooding during the West Berkshire 2024 event and investigated; affected as part of the wider catchment flood event driven by heavy rainfall and high groundwater. (p15)</p></div><div class="nugget-popup"><p>Internal and external property flooding to residents and businesses and road closures were reported in the location listed as Sheffield (Sheffield Bottom) during the January 2024 storms. [MUL] (p17)</p></div><div class="nugget-popup"><p>Flooding following the storms affected Sheffield Bottom (represented here as 'Sheffield'): 10 properties flooded in total, including 7 internally flooded and 3 externally flooded; two road closures were recorded. [TAB] (p19)</p></div><div class="nugget-popup"><p>The Sheffield Bottom area was inundated during the January 2024 flood event by fluvial sources (River Kennet and the Kennet and Avon Canal) and by overtopping of the lakes to the west. The site sits in a topographic low so surface water runoff from Hose Hill and Bottom Lane concentrated flows into the village, exacerbating flooding. [IMG,PAG] (p48)</p></div><div class="nugget-popup"><p>Area experienced fluvial, groundwater and surface&ndash;water flooding in January 2024. Approximately seven properties experienced internal flooding and approximately ten properties experienced external flooding. Specific local impacts included: 2 properties on Hose Hill with internal surface&ndash;water flooding (those 2 and a third property also had external surface&ndash;water flooding); 3 properties on Station Road with internal fluvial flooding (12 Jan 2024) and a further Station Road property with external fluvial flooding; 1 commercial property on Deans Copse Road with external fluvial flooding; 2 industrial properties on Arrowhead Road with internal fluvial flooding. Roads (Station Road, Deans Copse Road, Hose Hill, Hagnar Road) were flooded (flood depths ~150mm in places), made impassable to cars and affected safe access and egress. (p49)</p></div><div class="nugget-popup"><p>High groundwater levels and the River Kennet (and DOBS) exceeding capacity during storms Henk, Isha and Jocelyn caused flooding in the area; floodwater reportedly took longer to dissipate than during the 2013/14 event. No local flood defences were identified by WSP. (p50)</p></div><div class="nugget-popup"><p>Local residents and flood wardens reported that the Environment Agency completed a site visit to Sheffield Bottom in response to flooding during the January 2024 event. [PAG] (p51)</p></div><div class="nugget-popup"><p>Site visits were carried out in the Sheffield Bottom area during the January 2024 event. The investigation identified local drainage and watercourse issues and led to road closures on nearby roads; riparian owners were advised to clear watercourses and maintain ditches to enable free passage of water. (p52)</p></div><div class="nugget-popup"><p>Sheffield Bottom experienced fluvial (river) flooding and surface water flooding associated with Storms Henk, Isha and Jocelyn during the January 2024 event. Flooding occurred mainly in areas mapped as Flood Zone 3 and some Flood Zone 2. WSP noted the southern area would benefit from increased flood warden coverage to aid local communication and response. [PAG] (p53)</p></div><div class="nugget-popup"><p>Fluvial (river) and groundwater flooding affected the village: properties and roads flooded. A total of 10 properties were flooded (7 internally and 3 externally). Two roads (Deans Copse Road and Hagnar Road) were closed due to the flooding. [TAB] (p54)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>10 properties flooded; 7 properties internally flooded; 3 properties externally flooded; 2 road closures [TAB] (p19)</p></div><div class="nugget-popup quant"><p>approximately 7 properties (internal); approximately 10 properties (external); 2 properties (internal surface&ndash;water at Hose Hill); 3 properties (internal fluvial at Station Road); 1 property (external at Station Road); 1 commercial property (external at Deans Copse Road); 2 industrial properties (internal at Arrowhead Road); flood depths of approximately 150mm on affected roads (p49)</p></div><div class="nugget-popup quant"><p>Road closures on Deans Copse Road (5 Jan 2024 &ndash; 12 Jan 2024) and Hangar Road (8 Jan 2024 &ndash; 12 Jan 2024) (p52)</p></div><div class="nugget-popup quant"><p>10 properties; 7 properties; 3 properties; 2 road closures [TAB] (p54)</p></div></div></body></div>`)[0];

                var html_474e926454ac912399f5abec77c18257 = $(`<div id="html_474e926454ac912399f5abec77c18257" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Eastbury</h1><div class="nugget-popup"><p>Identified in the report as one of the locations that experienced the most severe flooding during the West Berkshire 2024 flood event and investigated; part of the wider event influenced by heavy rainfall and elevated groundwater. (p15)</p></div><div class="nugget-popup"><p>Following Storms Henk, Isha and Jocelyn, 9 properties in Eastbury were reported flooded: 6 properties internally flooded and 3 properties externally flooded. Road closures reported: 2. [TAB] (p19)</p></div><div class="nugget-popup"><p>Affected by flooding associated with Storm Henk (heavy rainfall and raised flows) and included in the report's assessment of impacted areas. (p24)</p></div><div class="nugget-popup"><p>Local river gauge recorded a high peak water level during the January 2024 event, indicating significant elevated river levels during the storm. [IMG,PAG] (p27)</p></div><div class="nugget-popup"><p>The Eastbury water&ndash;level gauge recorded a peak water level of 2.852 m AOD on 4 January 2024, ranking 1 of 8 in its AMAX record, demonstrating unprecedented fluvial flooding at that location. [TAB] (p28)</p></div><div class="nugget-popup"><p>River Lambourn overtopped its banks after Storms Henk, Isha and Jocelyn, causing fluvial flooding that affected Back Street and Lambourn Valley Road and inundated drives and gardens of properties along Back Street. Flooding was also reported from sewer and groundwater sources. [PAG] (p55)</p></div><div class="nugget-popup"><p>The River Lambourn overtopped, causing fluvial flooding to Back Street and Lambourn Valley Road and flooding drives and gardens. Groundwater emergence led to internal flooding of properties (started 5 January 2024) despite property&ndash;level protection. Sewer surcharging (two manholes) on Lambourn Valley Road / Eastbury Newtown caused sewer flooding and a partial road closure. A spring appeared on Lambourn Valley Road between The Hermitage and Station Lane and eroded the road, causing a road closure. [IMG,PAG] (p56)</p></div><div class="nugget-popup"><p>Some properties in the village experienced internal groundwater flooding linked to elevated groundwater levels and sustained River Lambourn flows following unusually wet conditions in 2023. [IMG] (p57)</p></div><div class="nugget-popup"><p>Internal groundwater flooding affected some properties within the village; high River Lambourn flows contributed to road flooding in some reaches. [PAG] (p58)</p></div><div class="nugget-popup"><p>The Eastbury flood alleviation scheme held back significant volumes of fluvial floodwater during the January 2024 event but Eastbury still experienced flooding in early 2024. Flood wardens reported that, without the scheme, levels would probably have been much worse. Debris collected at the base of the scheme during the event, restricting flow, and wardens were regularly clearing it to maintain efficiency. (p59)</p></div><div class="nugget-popup"><p>External fluvial flooding from the River Lambourn affected the village (reports of external fluvial flooding). (p60)</p></div><div class="nugget-popup"><p>Flood alleviation scheme upstream of Eastbury was degraded by debris build&ndash;up reducing its effectiveness; the downstream river&ndash;level gauge on the scheme was reading splashes rather than true levels (giving inaccurate level information to residents); properties experienced high groundwater impacts prompting use of non&ndash;return valves and sump pumps. [PAG] (p61)</p></div><div class="nugget-popup"><p>Fluvial, groundwater and sewer flooding affected the village. A total of 9 properties were flooded (6 internally, 3 externally) and two roads were closed (Back Street and Lambourn Valley Road). [TAB,PAG] (p62)</p></div><div class="nugget-popup"><p>Properties in Eastbury were recorded as flooded during the January 2024 storms. A Property flooding log held by the Environment Agency lists affected properties and EA Community Information Officers visited Eastbury to gather information and provide advice. (p189)</p></div><div class="nugget-popup"><p>Flooding occurred in Eastbury associated with Storm Henk (02/01/2024), Storm Isha (21/01/2024&ndash;22/01/2024), and Storm Jocelyn (23/01/2024&ndash;24/01/2024); the event is the subject of a Section 19 flood investigation. [MUL] (p220)</p></div><div class="nugget-popup"><p>Affected by groundwater infiltration and surface&ndash;water inundation/river bank overtopping that impacts assets; issues create increased reactive activity though Thames Water reports no assets currently broken or needing repair in the area. (p224)</p></div><div class="nugget-popup"><p>Eastbury is listed among sites for which a Section 19 investigation is being carried out into flooding that occurred in January 2024. (p225)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>9 properties; 6 internally flooded; 3 externally flooded; 2 road closures [TAB] (p19)</p></div><div class="nugget-popup quant"><p>2.852 m AOD (peak water level) on 4 January 2024; AMAX rank 1 of 8 [IMG,PAG] (p27)</p></div><div class="nugget-popup quant"><p>2.852 m AOD (4 January 2024); ranked 1 of 8 [TAB] (p28)</p></div><div class="nugget-popup quant"><p>flood depths of approximately 140 mm on Back Street; two surcharging manholes [IMG,PAG] (p56)</p></div><div class="nugget-popup quant"><p>two reports of external fluvial flooding (p60)</p></div><div class="nugget-popup quant"><p>9 properties; 6 properties flooded internally; 3 properties flooded externally; 2 road closures (Back Street; Lambourn Valley Road) [TAB,PAG] (p62)</p></div></div></body></div>`)[0];

                var html_9c3916863d81fbc710949ab1a21122b5 = $(`<div id="html_9c3916863d81fbc710949ab1a21122b5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Great Shefford</h1><div class="nugget-popup"><p>Named in the Section 19 report as one of the areas experiencing the most severe flooding in the West Berkshire 2024 event and included in the investigation; affected as part of the combined rainfall and high groundwater event. (p15)</p></div><div class="nugget-popup"><p>Following Storms Henk, Isha and Jocelyn, 10 properties in Great Shefford were reported flooded: 3 properties internally flooded and 7 properties externally flooded. Road closures reported: 1. [TAB] (p19)</p></div><div class="nugget-popup"><p>Affected by flooding associated with Storm Henk; the event and resulting levels/flows at this location were assessed in the report. (p24)</p></div><div class="nugget-popup"><p>Identified as one of the eight 1x1 km radar grid squares across West Berkshire that recorded elevated rainfall during the January flood/rainfall event. [TAB] (p26)</p></div><div class="nugget-popup"><p>The local groundwater gauge recorded very high groundwater levels in January 2024; this reflects high groundwater conditions in the village that likely contributed to groundwater flooding impacts. [TAB] (p29)</p></div><div class="nugget-popup"><p>January 2024 flooding affected the village from multiple sources (sewer, groundwater, fluvial and surface water). Properties experienced internal and external flooding and widespread disruption to wastewater facilities; some properties remained unable to use wastewater facilities when observed by WSP on 28 March. [PAG] (p63)</p></div><div class="nugget-popup"><p>January 2024 flooding affected the village from multiple sources. Surcharged sewer manholes caused external sewer flooding and raw sewage to enter the winterbourne stream and the River Lambourn. Groundwater flooded one property internally (recurring incidents after initial event). External surface&ndash;water flooding affected at least one property&#8217;s rear garden (4 Jan) and was pumped to prevent internal inundation. [PAG,IMG] (p64)</p></div><div class="nugget-popup"><p>In the Great Shefford area, high groundwater and fluvial flooding led to external flooding of residential gardens. Flooding was reported to have started on 09 Jan and remained evident during the site visit. [IMG] (p65)</p></div><div class="nugget-popup"><p>Heavy rainfall on already saturated ground caused surface water runoff from surrounding hills into Great Shefford. The sewer system was overrun, resulting in manholes surcharging outside properties along Wantage Road; a potentially collapsed drain in front of Downside House may have exacerbated sewer capacity issues. (p66)</p></div><div class="nugget-popup"><p>Village was affected by groundwater and fluvial (river) flooding across roads and pavements during the January 2024 event; temporary pumping plans were referenced and no permanent flood defences were present. (p67)</p></div><div class="nugget-popup"><p>Groundwater and fluvial (river) flooding across roads and pavements in the village, reported to the Environment Agency on 4 January 2024. (p68)</p></div><div class="nugget-popup"><p>Multiple flood sources (fluvial, groundwater, sewer and surface water) caused inundation across the village: properties and the local road network were flooded. West Berkshire Council attended to monitor the situation and enforce road closures; Thames Water attended to carry out remedial works; the Environment Agency had flood management responsibility. [TAB] (p69)</p></div><div class="nugget-popup"><p>The annual maximum groundwater level for Jan 2024 is recorded among the highest in the monitoring record (bar chart), indicating an elevated groundwater event at Great Shefford during January 2024; the Jan 2024 maximum nearly matches the previous peak in 2012. [IMG] (p180)</p></div><div class="nugget-popup"><p>A temporary flood barrier plan for the village was judged unsafe and could not be deployed; instead the Environment Agency deployed a pumping plan in winter 2023/2024 to reduce flood risk to properties in Great Shefford. There are no permanent flood defence assets in this area. (p191)</p></div><div class="nugget-popup"><p>Great Shefford is specifically named in the document as a location now being investigated for flooding that occurred during the January 2024 storm period (Section 19 investigation requested of Thames Water). (p223)</p></div><div class="nugget-popup"><p>Subject of a Section 19 flood investigation following flooding at the location; Thames Water/WSP were asked for records of actions taken in response to the flooding. (p225)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>10 properties; 3 internally flooded; 7 externally flooded; 1 road closure [TAB] (p19)</p></div><div class="nugget-popup quant"><p>106.647 mAOD (water level); AMAX rank 2 of 23 [TAB] (p29)</p></div><div class="nugget-popup quant"><p>3 properties internal; 10 properties external; 20 properties with wastewater disruption [PAG] (p63)</p></div><div class="nugget-popup quant"><p>3 properties internal flooding; 10 properties external flooding; 20 properties affected by disruption to wastewater facilities; 1 property internal groundwater flooding; 1 property external surface&ndash;water incident (150 mm depth) [PAG,IMG] (p64)</p></div><div class="nugget-popup quant"><p>10 properties [IMG] (p65)</p></div><div class="nugget-popup quant"><p>one report (4 Jan 2024) (p67)</p></div><div class="nugget-popup quant"><p>10 properties; 3 properties flooded internally; 7 properties flooded externally; 1 road closure (Newbury Road) [TAB] (p69)</p></div><div class="nugget-popup quant"><p>Jan 2024 annual maximum groundwater level ≈106.4 mAOD; notable high years include 2002, 2006, 2012 and 2019 [IMG] (p180)</p></div></div></body></div>`)[0];
