all caused substantial surface water runoff overwhelming drainage; properties flooded from road and roof drainage, low&ndash;lying rear courtyards and basements, and internal sewer/manhole backup; some properties experienced power cuts as a result of flooding. [PAG,MUL] (p18)</p></div><div class="nugget-popup"><p>Central Exeter (notably Cowick Street) experienced surface water / sewer&ndash;related flooding impacts requiring partnership work to ensure highway drainage and the sewer network operate efficiently and to identify any system issues. (p45)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>272 properties (238 residential and 34 commercial) across Devon (p1)</p></div><div class="nugget-popup quant"><p>>40 properties [IMG,PAG] (p2)</p></div><div class="nugget-popup quant"><p>47 properties [TAB] (p3)</p></div><div class="nugget-popup quant"><p>96 properties; 47 properties [PAG] (p14)</p></div><div class="nugget-popup quant"><p>47 properties [PAG] (p15)</p></div><div class="nugget-popup quant"><p>2 properties; 4 properties; 69 properties; 49 properties (37 residential, 12 commercial) [PAG,MUL] (p18)</p></div></div></body></div>`)[0];

                var html_c7182039f13b89593e28084ded1e61d2 = $(`<div id="html_c7182039f13b89593e28084ded1e61d2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kenton</h1><div class="nugget-popup"><p>Significant flooding from overtopping watercourses and overwhelmed drainage systems leading to internal flooding of properties in the area. (p1)</p></div><div class="nugget-popup"><p>Surface water and ordinary watercourse flooding inundated properties in Kenton. [TAB] (p3)</p></div><div class="nugget-popup"><p>Surface water flooding impacted the A379 at/near Kenton causing the road to be impassable/major closure. (p6)</p></div><div class="nugget-popup"><p>Kenton required clean&ndash;up assistance; Teignbridge provided additional sandbags and skips for disposal of damaged goods as part of recovery operations following surface water flooding. (p7)</p></div><div class="nugget-popup"><p>On 17 September 2023 intense rainfall caused overwhelming runoff and the local watercourse to exceed capacity, producing flood flows that internally flooded properties across the village. Floodwater swept through Mamhead Road, down Church Road and into the Triangle, crossed Fore Street (A379) and affected properties at the lower end of the village (Bramley Close). Downstream on the River Kenn a further four properties on Powderham Estate were flooded and one property outside Kenton at Chiverstone was flooded. The flood depths reached up to 1 m in places; the force of the water ripped tall garden gates off their hinges and sent them into a school building. (p25)</p></div><div class="nugget-popup"><p>Intense rainfall caused the watercourse to exceed culvert capacity and burst its banks upstream of Mamhead Road; overland flows (around 13:00&ndash;13:30) inundated areas of the village &mdash; flowing through the school toward the car park and Fore Street &mdash; collapsing walls and causing widespread damage to river walls, gabions, gardens and the public footpath. (p27)</p></div><div class="nugget-popup"><p>Following the event temporary works were installed on the watercourse to support a footpath and maintain flow in the brook; the Environment Agency Land Management Team surveyed the catchment and identified areas for land management and Natural Flood Management improvements. Ongoing liaison with Devon County Council, district/parish councils and landowners to identify measures. [PAG] (p28)</p></div><div class="nugget-popup"><p>Kenton was affected by flooding prompting LLFA&ndash;led investigations and consideration of hydraulic modelling and other options to reduce flood risk and increase resilience. (p46)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>272 properties (238 residential and 34 commercial) across Devon (p1)</p></div><div class="nugget-popup quant"><p>32 properties [TAB] (p3)</p></div><div class="nugget-popup quant"><p>32 properties; depths of up to 1 m; four properties; one property (p25)</p></div><div class="nugget-popup quant"><p>depths of up to 1m (p27)</p></div><div class="nugget-popup quant"><p>20 October 2021: 4 properties on Mamhead Road flooded and the school flooded; 19 September 2014: 2 properties flooded; 9 June 2009: at least 1 property known to flood internally; 30 May 2008: 4 properties along Mamhead Road and the school flooded (up to 12 in total affected); 22 June 2007: Local School and another property flooded; 24 October 2006: 1 property flooded; 7 December 2000: 4 properties flooded. [PAG] (p28)</p></div></div></body></div>`)[0];

                var html_2193958cd7e3d9cef401261c480324c6 = $(`<div id="html_2193958cd7e3d9cef401261c480324c6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Topsham</h1><div class="nugget-popup"><p>Significant flooding from overtopping watercourses and overwhelmed drainage systems leading to internal flooding of properties in the area. (p1)</p></div><div class="nugget-popup"><p>Surface water flooding inundated properties in Topsham. [TAB] (p3)</p></div><div class="nugget-popup"><p>Highway drainage systems struggled to cope with drastically increased flows in Topsham, sometimes causing drainage to overflow onto the highway. (p6)</p></div><div class="nugget-popup"><p>Residents were affected by the flood event; a community 'drop&ndash;in' event was held to gather information from affected residents and provide help and advice during recovery. (p7)</p></div><div class="nugget-popup"><p>Area affected by the intense rainfall event on 17 September 2023 with localised surface water runoff and overwhelmed drainage leading to flooding impacts on properties and roads. [PAG] (p14)</p></div><div class="nugget-popup"><p>Location referenced as the area between which one property was flooded internally (property flooded between Countess Wear Roundabout and Topsham). (p17)</p></div><div class="nugget-popup"><p>Heavy rainfall (approx. 2&ndash;3pm on 17 Sept 2023) caused rapid surface water runoff that overwhelmed local drainage. Water entered properties from roads and roof drainage, flooded low&ndash;lying rear courtyards and basements via seepage, and caused highway drainage/sewer manholes to back up inside properties. Floodwaters entered properties on main streets, exacerbated by bow waves from diverted traffic. [PAG] (p19)</p></div><div class="nugget-popup"><p>Surface water flooding affected areas across Topsham on 17 September 2023; floodwater followed known flow paths through the town and entered streets and properties (see The Strand). [PAG] (p20)</p></div><div class="nugget-popup"><p>Surface water flooded The Strand street on 17 September, entered properties via rear access and up through internal drainage systems; roof water also drained directly into property courtyards. Street water reported as 'knee deep'. [PAG] (p21)</p></div><div class="nugget-popup"><p>High Street area: six properties were internally flooded, including two commercial properties; road flooding was significant and cut off traffic, and some ingress was caused by bow waves from passing vehicles. Basements in the area were affected and holiday&ndash;lets may also have been impacted. Fore Street: eight properties were internally flooded, including three commercial properties; mostly basements, with water highest for 2&ndash;3 hours before receding. Riverside Road: one isolated property flooded internally with manholes lifting in the road. Ferry Road: roof drainage in addition to flows from the road were reported as main sources, with sewage backing up inside properties and causing damage. (p23)</p></div><div class="nugget-popup"><p>Internal flooding of properties in the High Street / Fore Street area (mostly basements). Water was at its highest for 2&ndash;3 hours before receding; three commercial properties were among those affected. [PAG,MUL] (p24)</p></div><div class="nugget-popup"><p>Topsham experienced flooding that affected local drainage and properties (actions include investigating pumping station performance at Ferry Road, clearing silted gullies and raising awareness through the Topsham Flood Group). [TAB,PAG] (p44)</p></div><div class="nugget-popup"><p>Flooding in Topsham on 17th September 2023 caused drainage and sewer problems across the town: the Ferry Road pumping station performance was investigated, gullies were found silted and cleared, and properties on Monmouth Street were affected. (p45)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>272 properties (238 residential and 34 commercial) across Devon (p1)</p></div><div class="nugget-popup quant"><p>48 properties [TAB] (p3)</p></div><div class="nugget-popup quant"><p>one property (p17)</p></div><div class="nugget-popup quant"><p>49 properties; 37 residential properties; 12 commercial properties [PAG] (p19)</p></div><div class="nugget-popup quant"><p>8 residential properties [PAG] (p20)</p></div><div class="nugget-popup quant"><p>8 residential properties [PAG] (p21)</p></div><div class="nugget-popup quant"><p>6 properties; 2 commercial properties; 8 properties; 3 commercial properties; 1 property (p23)</p></div><div class="nugget-popup quant"><p>eight properties; three commercial properties; 1 property (30 December 2015); 1 property (21 November 2016); 1 property (27 November 2018); 1 property (23 November 2019) [PAG,MUL] (p24)</p></div></div></body></div>`)[0];

                var html_94405715540ea75fe7f7c64ab72143f8 = $(`<div id="html_94405715540ea75fe7f7c64ab72143f8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Harberton</h1><div class="nugget-popup"><p>Significant flooding from overtopping watercourses and overwhelmed drainage systems leading to internal flooding of properties in the area. (p1)</p></div><div class="nugget-popup"><p>Properties flooded due to surface water and ordinary watercourse flooding. [TAB,PAG] (p3)</p></div><div class="nugget-popup"><p>Community was affected by the flooding; South Hams supported Harberton (and Harbertonford) with clearing debris and recovery assistance. A flood 'drop&ndash;in' event was held for affected residents. (p7)</p></div><div class="nugget-popup"><p>Internal flooding of properties from surface water and flows from an ordinary watercourse; large volumes of mud, straw and other debris deposited throughout the village; flood flows crossed the orchard and entered Harberton near Ashbrook Cottage. [PAG] (p31)</p></div><div class="nugget-popup"><p>Overland flood flows tracked from north to south across Screw Lane (between Mill Cross and Gill's Cross), making the road impassable and depositing high levels of mud. Flows crossed the orchard and entered the village near Ashbrook Cottage. [PAG] (p32)</p></div><div class="nugget-popup"><p>Multiple properties in the village were flooded: two properties on Vicarage Ball (one from surface water and one due to an ordinary watercourse entering Harberton from the north east) and one property on Fore Street. Muddy flood deposits were observed on the orchard field below Screw Lane. [PAG] (p33)</p></div><div class="nugget-popup"><p>A culvert was overwhelmed by excessive surface runoff during the event, causing significant surface water flooding in the village; surface water entered the front of a property on Vicarage Ball from the highway, isolating that property from the majority of affected properties. A culvert screen became blocked (subsequently cleared). [PAG] (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>272 properties (238 residential and 34 commercial) across Devon (p1)</p></div><div class="nugget-popup quant"><p>24 properties [TAB,PAG] (p3)</p></div><div class="nugget-popup quant"><p>24 properties [PAG] (p31)</p></div><div class="nugget-popup quant"><p>3 properties (2 on Vicarage Ball; 1 on Fore Street) [PAG] (p33)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p34)</p></div></div></body></div>`)[0];

                var html_3e6e4529facfda9f91f14180b0310f56 = $(`<div id="html_3e6e4529facfda9f91f14180b0310f56" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Clyst St Mary</h1><div class="nugget-popup"><p>Surface&ndash;water flooding affected the settlement, with multiple properties reported flooded. [TAB] (p3)</p></div><div class="nugget-popup"><p>Surface water flooding affected the area adjacent to Clyst St Mary as part of the A376 flooding. (p6)</p></div><div class="nugget-popup"><p>Flooding carried debris onto the highway network; roads were mainly affected and East Devon Street Scene carried out clean&ndash;up operations. (p7)</p></div><div class="nugget-popup"><p>Heavy rainfall on 17 September caused surface water flooding affecting properties (standing water remained for days). High River Clyst levels during and after the event likely prevented surface water discharging to the river. The local road was flooded, access to the village was cut off, and issues with the local pumping station affected residents' toilets for a few days. [PAG] (p8)</p></div><div class="nugget-popup"><p>On 17 September 2023 large amounts of mud and silt were deposited on Frog Street (no properties on that street were flooded); DCC Highways carried out clearance works. The Environment Agency Land Management Team surveyed the area to identify problems and provide land management advice and seasonal monitoring. Historic impacts recorded for the settlement include properties flooded on 7 December 2000, 21 November 2012 (tidal surge) and 09 January 2016 (surface water). [MUL] (p9)</p></div><div class="nugget-popup"><p>Multiple past flood incidents affecting properties: historic and recent flooding events recorded from different sources (unknown source, tidal surge, and surface water). Two of the properties affected in the most recent occasion have previously flooded in the 1970s from the River Clyst (not from surface water). [MUL] (p10)</p></div><div class="nugget-popup"><p>Flooding in Clyst St Mary cut off the route, forcing traffic to divert through Topsham and contributing to bow waves that entered properties in Topsham. (p19)</p></div><div class="nugget-popup"><p>Pumping station performance during the 17th September 2023 flood was questioned; inspections requested and evidence of performance during the flood event to be provided. Follow&ndash;up land management surveys recommended for surrounding catchment. [TAB] (p44)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 properties [TAB] (p3)</p></div><div class="nugget-popup quant"><p>three properties (one commercial and two residential) [PAG] (p8)</p></div><div class="nugget-popup quant"><p>0 properties flooded on Frog Street (17 September 2023); 1 property (7 December 2000); 5 properties (21 November 2012); 1 property (09 January 2016) [MUL] (p9)</p></div><div class="nugget-popup quant"><p>1 property (7 December 2000); 5 properties (21 November 2012); 1 property (09 January 2016); 4 properties (21 November 2016); 1 property (26 December 2017); 2 properties (1970s) [MUL] (p10)</p></div></div></body></div>`)[0];
