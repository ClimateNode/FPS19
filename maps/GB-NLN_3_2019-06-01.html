                var html_b67508fa6dd950dd72d96c33ddb09c3f = $(`<div id="html_b67508fa6dd950dd72d96c33ddb09c3f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wainfleet All Saints</h1><div class="nugget-popup"><p>Floodwaters inundated roads, yards, agricultural fields and parts of the residential settlement. Water reached up to the bottom of building windows and partially submerged fences and entrances, disrupting transportation and access. A levee/embankment breach allowed forceful flow into adjacent land; sandbags were deployed in attempts to control the breach. (p1)</p></div><div class="nugget-popup"><p>Wainfleet was flooded during June 2019. The investigation references a breach in the relief channel that contributed to flooding of the town and led to recommendations for embankment assessment and other mitigation measures. (p5)</p></div><div class="nugget-popup"><p>Wainfleet was flooded in June 2019 as a result of high flows in the Steeping River and its relief channel, triggering a Section 19 investigation and subsequent recommendations to RMAs. [PAG] (p6)</p></div><div class="nugget-popup"><p>Wainfleet experienced a flood incident in June 2019 that formed part of the catchment&ndash;wide flooding response; properties suffered internal flooding and Risk Management Authorities mounted a collective response to the incident. (p9)</p></div><div class="nugget-popup"><p>Multiple properties in Wainfleet experienced internal flooding from fluvial sources; multi&ndash;agency response included evacuation coordination, Fire and Rescue pumping properties out, RAF dropping sandbags to seal a breach, and Environment Agency repair/reinforcement of the breached bank. [TAB,PAG] (p10)</p></div><div class="nugget-popup"><p>Concentration of internal property flooding in the town; properties reported internal flooding caused by main river overtopping and surface&ndash;water runoff, with multiple&ndash;source flooding incidents in the lower catchment near the town. [IMG] (p12)</p></div><div class="nugget-popup"><p>Wainfleet experienced the most intense rainfall in the catchment during 10&ndash;11 June 2019 (record daily totals) which contributed to flooding in the town during the June 2019 event. [TAB] (p13)</p></div><div class="nugget-popup"><p>Multiple streets in Wainfleet experienced internal flooding from fluvial (river) sources and some surface&ndash;water/other sources. Fire and Rescue Service responded: pumped out properties, visited affected residents to offer advice and gathered information, and carried out measures to minimise flood impacts. A multi&ndash;agency group (Environment Agency, Lincolnshire County Council, East Lindsey District Council, Lincolnshire Police) coordinated evacuations of Wainfleet. The RAF dropped sandbags to seal a breach. The Environment Agency repaired and reinforced the bank at the breach site. Witham Fourth District IDB and Lindsey Marsh IDB worked together to pump water away from the breached area. [IMG] (p14)</p></div><div class="nugget-popup"><p>Internal flooding of properties concentrated in central and southern Wainfleet All Saints. The majority of internally flooded properties are attributed to the main river (Steeping River); additional properties were flooded by surface water and by multiple/undetermined sources. Flooding is clustered along main roads and adjacent to watercourses. [IMG] (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>88 incidents of internal flooding (p9)</p></div><div class="nugget-popup quant"><p>12 properties on Matt Pitts Lane; 11 properties on Brewster Lane; 12 properties on Spilsby Road (10 fluvial, 1 multiple sources, 1 unknown); 3 properties on Havenside; 1 property on Crows Bridge; 1 property on Liam's Way; 1 property on Collison Gate; 1 property on Wainfleet Bank; 1 property on Mill Lane; 1 property on Hastings Drive; 1 property on Low Road [TAB,PAG] (p10)</p></div><div class="nugget-popup quant"><p>12 properties on Matt Pitts Lane; 11 properties on Brewster Lane; 12 properties on Spilsby Road (10 fluvial, 1 multiple sources, 1 unknown); 3 properties on Havenside; 1 property on Crows Bridge; 1 on Liam's Way; 1 on Collison Gate; 1 on Wainfleet Bank; 1 on Mill Lane; 1 on Hastings Drive; 1 on Low Road (total 45 properties internally flooded in Wainfleet) [IMG] (p14)</p></div></div></body></div>`)[0];
