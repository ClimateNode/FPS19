 impacts. (p8)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>17 reported incidents of internal property flooding [IMG] (p2)</p></div><div class="nugget-popup quant"><p>17 reported incidents of internal property flooding [PAG] (p3)</p></div></div></body></div>`)[0];
