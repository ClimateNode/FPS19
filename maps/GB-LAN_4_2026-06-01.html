                var html_b5d1edf7d71ef2ddd5cf7b066d380e98 = $(`<div id="html_b5d1edf7d71ef2ddd5cf7b066d380e98" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lancashire</h1><div class="nugget-popup"><p>Between June and September 2012 Lancashire experienced a number of significant flooding events: several river levels and rainfall gauging stations hit record highs, monthly&ndash;average September rainfall fell in 2 days in parts of the region, and there was extensive localised and internal property flooding across the county. [PAG] (p3)</p></div><div class="nugget-popup"><p>Internal property flooding occurred in various places across the county during the summer 2012 flood events; heavy rainfall on 22/23 June 2012 led to rapid river level rises across Lancashire. (p9)</p></div><div class="nugget-popup"><p>Severe flooding in June affected multiple communities (Croston, Whalley, Leyland, parts of Rossendale and Darwen). Causes recorded included river (Yarrow) overtopping, tributary exceedance and surface water blocking drainage; sewer overloads also caused property flooding. Post&ndash;event repair and flood&ndash;alleviation works were initiated. (p11)</p></div><div class="nugget-popup"><p>Widespread flooding across the county and multiple district areas prompted multi&ndash;agency emergency response and strategic debriefing. The report records property flooding including 7 properties flooded in Sunnyside Terrace. [PAG] (p15)</p></div><div class="nugget-popup"><p>County&ndash;wide response to the June 2012 floods: proactive use of pumping stations to increase watercourse storage capacity in advance of the event; organisation and promotion of community drop&ndash;in facilities to inform and support residents; convening multi&ndash;agency coordination through the Lancashire Resilience Forum debrief (25 July) and Lancashire County Council internal debrief (16 July); actions to improve notification and coordination of rest centres and evacuations; review and follow&ndash;up of flood warning/signup, contact information, trigger levels in LRF plans, teleconferencing and community messaging (including sandbag provision). [PAG] (p17)</p></div><div class="nugget-popup"><p>Flooding in June 2012 across the county prompted county and multi&ndash;agency response, an LCC internal debrief on 16 July 2012 and additional Making Space for Water meetings; actions were allocated to agencies to improve warnings, communications and operational response. [PAG] (p18)</p></div><div class="nugget-popup"><p>Properties within the county were flooded: West Lancashire experienced properties flooded by both river and surface water flooding in September 2012; areas of Rossendale had properties flooded (70 properties in Rossendale were identified as flooded). [PAG] (p25)</p></div><div class="nugget-popup"><p>Lancashire was affected by the September 2012 event, with the primary property&ndash;flooding impact occurring in West Lancashire (within the county). (p26)</p></div><div class="nugget-popup"><p>County&ndash;wide impact from the 2012 floods that tested flood response and risk&ndash;management arrangements; triggered strategic&ndash;level investigations and operational responses in various districts (including investigations into highway drainage performance and rectification responsibilities for field flooding in West Lancashire); use of district 'Making Space for Water' partnership meetings to agree responsibilities, share investigation findings and identify actions; learning and changes to practice by risk management authorities and emergency services. [PAG] (p29)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Up to 72 properties in Croston identified as having suffered some degree of flooding; UU sample contacts in Lancashire districts include 86 (South Ribble), 58 (Chorley) and 21 (Rossendale). (p11)</p></div><div class="nugget-popup quant"><p>7 properties [PAG] (p15)</p></div><div class="nugget-popup quant"><p>70 properties [PAG] (p25)</p></div><div class="nugget-popup quant"><p>19 properties flooded (in and around Ormskirk, West Lancashire) (p26)</p></div></div></body></div>`)[0];

                var html_50775dd1f5201258f6ea32c5c1181593 = $(`<div id="html_50775dd1f5201258f6ea32c5c1181593" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>West Lancashire</h1><div class="nugget-popup"><p>Most severe property flooding in the September event occurred in the borough. Internal flooding of properties resulted from exceptionally intense/localised rainfall, surface water and greenfield runoff, and ordinary watercourse culvert surcharges; extensive field flooding was also reported. (p14)</p></div><div class="nugget-popup"><p>West Lancashire suffered property flooding during the September 2012 event caused by a combination of surface water, ordinary watercourse and main river issues; community meetings and partner agency meetings were held to develop mitigation proposals and the EA led interest in community flood action groups. (p26)</p></div><div class="nugget-popup"><p>Surface&ndash;water / culvert&ndash;related flooding affected communities and properties within the district (locations described include Ormskirk/Altys Lane and Halsall/Plex Lane). (p27)</p></div><div class="nugget-popup"><p>Multiple locations in West Lancashire were flooded during 2012: Plex Lane (Halsall) experienced flooding driven by greenfield runoff, highway surface water and ordinary watercourse/culvert performance problems; Westhead village flooded from surface water and ordinary watercourse overtopping; Southport Road, Ormskirk flooded from a combination of surface water and overtopping of Hurlston Brook (main river) and ordinary watercourses. Authorities carried out gully/ditch clearance and investigated culvert and drainage capacity. (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Up to 18 residential properties; 2 commercial properties (p14)</p></div><div class="nugget-popup quant"><p>19 properties flooded in and
