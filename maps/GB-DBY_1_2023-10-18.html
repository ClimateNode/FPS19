                var html_d81d032f30968ebf26b3e22bdaf0bc7c = $(`<div id="html_d81d032f30968ebf26b3e22bdaf0bc7c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Derbyshire</h1><div class="nugget-popup"><p>Between 18 and 21 October 2023 Derbyshire experienced extensive property flooding. Watercourse overtopping was the main cause of property flooding at most communities; surface water flooding was the main cause at some communities and a contributing cause at many; some sewer network flooding occurred where pumping stations were overwhelmed by other sources of flooding. The worst affected communities included Chesterfield, Sandiacre and Long Eaton, with higher concentrations of flooded properties in the Don and Rother, Derwent Lower, and Erewash catchments (east of the county). [PAG] (p3)</p></div><div class="nugget-popup"><p>Widespread flooding across the county during Storm Babet. A total of 1,647 properties were internally flooded across all eight districts and boroughs. Infrastructure damage recorded included bridge scouring, damage to an electricity substation, and a footbridge washed away. Several roads became impassable causing local traffic disruption. The borough of Chesterfield (within Derbyshire) was especially badly affected, with one resident killed and a large number of properties flooded. [PAG] (p5)</p></div><div class="nugget-popup"><p>Widespread internal flooding of residential properties across the county; communities investigated where five or more residential properties were internally flooded. [PAG] (p6)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1,647 properties internally flooded; 1,251 residential; 396 non&ndash;residential; 35 communities investigated encompassing 1,284 of the internally flooded properties [PAG] (p3)</p></div><div class="nugget-popup quant"><p>1,647 properties; 1 fatality; more than 400 properties (Chesterfield) [PAG] (p5)</p></div><div class="nugget-popup quant"><p>1,647 internally flooded residential properties; 35 communities identified containing five or more flooded properties; 1,284 of the flooded properties are within the investigated communities [PAG] (p6)</p></div></div></body></div>`)[0];
