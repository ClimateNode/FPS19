ckages of drainage features on Church Street requiring riparian owners or the relevant highways authority to carry out repairs; drainage failures contributed to localised flooding and triggered maintenance works. (p35)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 vehicle partially submerged [IMG] (p32)</p></div></div></body></div>`)[0];

                var html_d0601c0b3ea1f03adbda9e670d4a1f23 = $(`<div id="html_d0601c0b3ea1f03adbda9e670d4a1f23" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Suffolk</h1><div class="nugget-popup"><p>Significant disruption to communities across the county during the 18&ndash;21 October 2023 event as intense rainfall and overwhelmed drainage/watercourse capacity produced widespread fluvial and pluvial flooding. [PAG] (p4)</p></div><div class="nugget-popup"><p>During Storm Babet (18&ndash;21 October 2023) Suffolk experienced the heaviest rainfall across East Anglia, leading to saturated land, rapid rises in river systems and significant flooding of roads and properties across the county; the situation led to a major incident being declared on 20 October 2023. [PAG,MUL] (p6)</p></div><div class="nugget-popup"><p>Central Wetheringsett and Brockford Street experienced fluvial (river) and pluvial (surface water) flooding during the 18&ndash;21 October 2023 event. Low&ndash;lying ground and converging flow paths caused inundation through Brockford Street and central Wetheringsett; floodwaters were reported entering properties via airbricks and gaps beneath floors. Station Road and Wetherup Street were identified as surface&ndash;water flow paths contributing to local flooding. A Flood Alert for the River Waveney/Dove area was issued on 20 October 2023 (11:44) and remained in force thereafter. [PAG,IMG] (p13)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one major incident declared [PAG,MUL] (p6)</p></div></div></body></div>`)[0];

                var html_1a0356d1a28825edfaa66cdf352b6565 = $(`<div id="html_1a0356d1a28825edfaa66cdf352b6565" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wetheringsett-Cum-Brockford</h1><div class="nugget-popup"><p>Wetheringsett&ndash;cum&ndash;Brockford was severely impacted: intense rainfall and converging overland flow paths overwhelmed watercourses and drainage capacity, causing internal flooding of properties and disruption to infrastructure and services. (p4)</p></div><div class="nugget-popup"><p>Wetheringsett was a main affected area during the event with significant internal flooding to properties and local infrastructure; flooding sources reported for the parish included surface water (pluvial), overtopping of watercourses (fluvial) and overwhelmed drainage/sewage systems. [IMG,PAG] (p8)</p></div><div class="nugget-popup"><p>Internal flooding reported in the village of Wetheringsett (village core and surroundings); localised flow paths and overtopping/drainage failure contributed to internal property flooding. [PAG,IMG] (p9)</p></div><div class="nugget-popup"><p>Significant internal flooding to properties and local infrastructure across the parish during Storm Babet; floodwater sources included surface water runoff, overtopping watercourses and overwhelmed sewage/drainage systems. (p10)</p></div><div class="nugget-popup"><p>Central Wetheringsett is mapped as being at significant fluvial flood risk from local watercourses (which discharge to the River Dove) and at risk from pluvial flow paths; specific streets identified at risk include Station Road and Wetherup Street. The wider catchment flood alert was in force (issued 20 Oct 2023). [PAG,IMG] (p13)</p></div><div class="nugget-popup"><p>During the Oct 18&ndash;21, 2023 event (reports collected during Storm Babet) the area experienced significant surface water runoff and limited infiltration. Mapping and the investigation identify central Wetheringsett as a low&ndash;lying convergence point for flow paths and at risk of flooding from both pluvial (surface water) and fluvial sources; this contributed to flooding impacts in central village locations and along the local watercourse before it discharges to the River Dove. The report notes water is likely to enter properties via airbricks or gaps under floors where flooding occurs. [PAG,IMG] (p14)</p></div><div class="nugget-popup"><p>Significant flooding of residential properties, roads and local infrastructure caused by saturated catchment conditions and high river/overland flows during Storm Babet. [PAG,IMG] (p15)</p></div><div class="nugget-popup"><p>The village experienced overtopping of the local watercourse and extensive surface water runoff from a large rural catchment. The watercourse was quickly overwhelmed (exacerbated by constrictions &mdash; a weir, two small brick&ndash;arch bridges, a culvert under the old mill, and a sharp engineered turn), causing water to force around/over these restrictions and enter the highway and surrounding properties. Torrents of water travelled down steep southern and western access roads, inundating the central low point in the village. A culvert at the entrance to the primary school overtopped and contributed flows onto the highway. Sections of the watercourse leaving the village were reported to require maintenance, which may have reduced channel capacity during the event. (p23)</p></div><div class="nugget-popup"><p>The village centre (junction serving routes from south, west and north) experienced converging torrents of fast&ndash;moving surface water from steep access roads and surrounding fields; an eastern watercourse overtopped at a culvert leading to highway inundation and flows several metres up the road. Flood waters pooled in the low spot in the centre of the village, and properties on Hockey Hill, Church Street and Cedars Hill had flood water entering from the highway. A blocked/collapsed drainage pipe on Church Street caused rapid highway backup and overtopping into houses. [IMG] (p24)</p></div><div class="nugget-popup"><p>Surface water from a large surrounding catchment overwhelmed the village watercourse and highway drainage; the foul sewer system and village pumping station were overwhelmed (the pumping station was submerged during the event), causing sewer overflows that discharged raw sewage into gardens and highways; internal property flooding occurred across the village. (p25)</p></div><div class="nugget-popup"><p>East Wetheringsett experienced flooding during the event, including inundation of Church Street by the parish church; community movement was disrupted and small boats were used to traverse flooded streets. [IMG,PAG] (p29)</p></div><div class="nugget-popup"><p>Residential gardens experienced sewage escape following Storm Babet; drainage issues within the village were identified (including repairs to drainage features on Church Street) and increased watercourse maintenance/inspection was recommended across the parish. [TAB,PAG] (p34)</p></div><div class="nugget-popup"><p>Drainage and watercourse capacity issues in Wetheringsett prompted investigations into clearance, raising&ndash;capacity works and natural flood management measures to reduce flood risk following the event. (p35)</p></div><div class="nugget-popup"><p>Surface water flooding affected the village, prompting recommendations to improve the local watercourse network and install Natural Flood Management measures to attenuate and slow flood water. (p36)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 20 properties (p4)</p></div><div class="nugget-popup quant"><p>over 20 properties (parish&ndash;wide) [PAG,IMG] (p9)</p></div><div class="nugget-popup quant"><p>over 20 properties (p10)</p></div><div class="nugget-popup quant"><p>at least 10 properties; internal depths up to 500 mm (p23)</p></div><div class="nugget-popup quant"><p>over 10 properties; internal flood depths up to 500mm (p25)</p></div></div></body></div>`)[0];

                var html_67ba19465245718dd9740250c5fd9069 = $(`<div id="html_67ba19465245718dd9740250c5fd9069" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Brockford Street</h1><div class="nugget-popup"><p>Brockford Street is identified as one of the main affected zones where the river Dove runs through the community; properties and infrastructure experienced internal flooding during the event. [PAG] (p8)</p></div><div class="nugget-popup"><p>Significant internal flooding to properties and local infrastructure in Brockford Street; floodwater sources reported as overtopping/overtopped river (River Dove), surface&ndash;water runoff from surrounding land and overwhelmed drainage/sewer systems. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>Brockford Street was a main affected area; the River Dove runs through the community and contributed to flooding (overtopping) alongside surface water and overwhelmed drainage, causing internal property flooding. [PAG,MUL] (p10)</p></div><div class="nugget-popup"><p>Area identified as low&ndash;lying where flow paths converge; mapping shows significant fluvial and pluvial flood risk to central Brockford Street (including the southern end of Brockford Road) with watercourses and surface runoff expected to inundate low spots during the event. Flood alert for the wider catchment was issued on 20 Oct 2023. [PAG,IMG] (p13)</p></div><div class="nugget-popup"><p>Identified as a low&ndash;lying flow path where flood flow converges; the report maps significant fluvial and pluvial flood risk through Brockford Street and notes that Storm Babet produced significant surface&ndash;water runoff consistent with the local geology, suggesting Brockford Street experienced surface&ndash;water inundation and overland flow with potential for water to enter buildings via airbricks or gaps beneath floors. [PAG,IMG] (p14)</p></div><div class="nugget-popup"><p>Severe flooding of the street area with floodwater overtopping from the River Dove and surface water runoff from the A140 and surrounding fields; overwhelmed watercourses and drainage caused water to enter properties and flow onto the highway. (p16)</p></div><div class="nugget-popup"><p>Water from the River Dove flowed out of the channel upstream of the small bridge and flooded onto Brockford Street and surrounding properties on the west side of the A140. [IMG] (p19)</p></div><div class="nugget-popup"><p>During the event (Storm Babet) Brockford Street experienced surface water flooding and additional water from overtopping of the River Dove; floodwater was reported to contain sewage. At least 13 properties in the area reported internal flooding and the A140 was closed and impassable for a period. [IMG,PAG] (p21)</p></div><div class="nugget-popup"><p>Properties south of the bridge experienced internal flooding caused by significant surface water runoff from surrounding fields and by overtopping of the River Dove; possible infilling/loss of watercourse features reduced drainage egress. Private sewerage works in the area were affected by high water levels in the months following the event. [IMG] (p22)</p></div><div class="nugget-popup"><p>Private sewerage systems in Brockford Street were identified for inspection and maintenance following reports of sewage escape; landowners were asked to carry out required maintenance to ensure systems function correctly. Anglian Water carried out works to the rising main in response to reported sewage escape since Storm Babet. [TAB] (p34)</p></div><div class="nugget-popup"><p>Private sewerage systems in Brockford Street require maintenance and inspection by landowners to ensure correct functioning after flood impacts; longer&ndash;term/planned actions and potential funding are identified to address these sewer/drainage&ndash;related issues. (p35)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 20 properties (parish&ndash;wide) [IMG,PAG] (p9)</p></div><div class="nugget-popup quant"><p>8 properties (11 Oct 2023 &ndash; 15 Oct 2023) [PAG,MUL] (p10)</p></div><div class="nugget-popup quant"><p>13 properties (p16)</p></div><div class="nugget-popup quant"><p>At least 13 properties; A140 road closure [IMG,PAG] (p21)</p></div><div class="nugget-popup quant"><p>13 properties [IMG] (p22)</p></div></div></body></div>`)[0];
