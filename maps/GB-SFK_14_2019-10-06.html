                var html_e5e61f376873089f87706e752cbe68b9 = $(`<div id="html_e5e61f376873089f87706e752cbe68b9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kirkley Stream</h1><div class="nugget-popup"><p>Fluvial capacity of Kirkley Stream was exceeded during the intense storm and contributed to the exceedance of the drainage system, leading to internal flooding of properties and highway inundation. [MUL] (p3)</p></div><div class="nugget-popup"><p>Kirkley Stream's capacity was exceeded during the intense storm, causing it to overtop banks adjacent to Velda Close/Aldwyck Way and to flood gardens along Long Road and Birds Lane. The stream caused fluvial locking of the stormwater outfalls (reverse flow into Aldwyck Way) and experienced a partial blockage upstream of Blackheath Crossroad (large fallen branch and washed&ndash;in waste). Anglian Water deployed screw pumps and inspected/cleared trash screens as part of the response. [PAG] (p4)</p></div><div class="nugget-popup"><p>Kirkley Stream carried excess water during the event and is identified as a source of fluvial/pluvial flood risk in the area; the report notes there is no evidence that the flood storage area failed to take excess water from the stream during the event, and recommends continued maintenance and consideration of additional attenuation to reduce future impacts. [TAB,PAG] (p6)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Contributed to flooding reported for 18 domestic properties (see site report). [MUL] (p3)</p></div><div class="nugget-popup quant"><p>Two screw pumps utilised on 6 Oct for approx. 12 hrs; Anglian Water on site from 9am on 6 Oct and remained for almost 24 hours [PAG] (p4)</p></div></div></body></div>`)[0];

                var html_5953c187b241fd22abd46d36b091cc04 = $(`<div id="html_5953c187b241fd22abd46d36b091cc04" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Aldwyck Way, Lowestoft</h1><div class="nugget-popup"><p>Subject of a Suffolk County Council Section 19 investigation into a flood event (document focuses on Aldwyck Way as one of the affected streets). (p1)</p></div><div class="nugget-popup"><p>Highway flooding for approximately 100 m with an approximate maximum depth of 450 mm at the lowest point; internal flooding of domestic properties in the area (part of the total 18 properties). Anglian Water stormwater sewer and highway drainage system both surcharged. [PAG] (p2)</p></div><div class="nugget-popup"><p>Kirkley Stream overtopped adjacent to Aldwyck Way and the local Anglian Water stormwater outfall at bed level suffered fluvial locking (reverse flow/surcharging), causing river water to push out of gullies and manholes and preventing positive discharge of surface water runoff. (p4)</p></div><div class="nugget-popup"><p>The Velda/Aldwyck Way reach is subject to flood risk from both fluvial (Kirkley Stream) and pluvial (surface water) sources during the documented event; interventions were recommended because the reach requires a higher standard of protection and pumps were reviewed to draw down upstream water levels. [TAB,PAG] (p6)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Approx. 100 m of highway flooded; max depth approx. 450 mm at lowest point; 18 domestic properties (total across Velda Close and Aldwyck Way); total affected area 0.7Ha (7000m2) [PAG] (p2)</p></div><div class="nugget-popup quant"><p>1:100yr (target standard of protection) [TAB,PAG] (p6)</p></div></div></body></div>`)[0];

                var html_42a852f7cd8733588e3ff337f52f2f15 = $(`<div id="html_42a852f7cd8733588e3ff337f52f2f15" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kirkley</h1><div class="nugget-popup"><p>Residential area experienced internal flooding of properties (up to 400mm deep) and inundation of outbuildings and gardens. The public highway (Aldwyck Way) flooded for approx. 100m with a maximum depth of about 450mm. Anglian Water stormwater sewer and highway drainage were surcharged, giving a total affected area of about 0.7 ha (7000 m2). [IMG,MUL] (p3)</p></div><div class="nugget-popup"><p>Kirkley Stream rose and overtopped its western bank, flooding a wider area including Velda Close, Aldwyck Way and gardens along Long Road and Birds Lane. Fluvial locking/surcharging of the local stormwater/public sewer outfalls caused reverse flow into Aldwyck Way, drowned out gullies and manholes, and prevented positive discharge, exacerbating localised flooding; properties in the area (an existing Flood Zone 3/pluvial risk area) were flooded. [PAG] (p4)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>18 domestic properties; 100m of highway flooded (Aldwyck Way); 450mm maximum highway flood depth; 400mm internal property flood depth; 0.7Ha (7000m2) total affected area [IMG,MUL] (p3)</p></div></div></body></div>`)[0];
