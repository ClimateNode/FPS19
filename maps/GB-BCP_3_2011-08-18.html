                var html_819817de620c578421084e0a6a6a133b = $(`<div id="html_819817de620c578421084e0a6a6a133b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bournemouth</h1><div class="nugget-popup"><p>Heavy surface&ndash;water flooding inundated urban streets and a public park, with water covering road surfaces and reaching up to the top of a park fence. Traffic was disrupted with buses and other vehicles driving through deep water; street furniture and shopfront frontages were partially submerged and debris was floating in the floodwater. (p1)</p></div><div class="nugget-popup"><p>Intense convective rainfall on 18 August 2011 caused widespread surface water/urban flooding across the borough: significant property damage in localised areas, considerable disruption to the local transport system, and some residents were unable to return to their properties for at least six months while homes dried out. A major clean&ndash;up operation was required after the event. [PAG] (p3)</p></div><div class="nugget-popup"><p>A significant, highly localised storm centred on the Town Centre produced intense rainfall (epicentre moved N/NE over Winton and Charminster) that caused surface water/urban flooding across Bournemouth; the borough was affected more severely than neighbouring Poole and Weymouth. (p5)</p></div><div class="nugget-popup"><p>Widespread heavy rain produced surface&ndash;water/urban flooding across Bournemouth: roads were gridlocked or impassable (e.g. Wallisdown Road A3049 between Boundary Road and the University; Castle Lane East and West; access to Bournemouth Hospital via the Cooper Dean Roundabout), and emergency services and the council received very large numbers of flood&ndash;related calls. [PAG] (p12)</p></div><div class="nugget-popup"><p>Rapid&ndash;onset surface water/urban flooding across the town: major roads (e.g. Castle Lane A3060 east and west, Wessex Way A338, Pier Approach Flyover) were closed, impassable or gridlocked (access to/from Bournemouth Hospital via Cooper Dean Roundabout affected). The sewerage system was overwhelmed causing manholes to surcharge foul sewage, manhole covers to be blown off, and road surfaces to lift; highway gullies blocked with debris. A small retaining wall collapsed in Exeter Road. Flooding to properties occurred within about 15 minutes of the heavy rainfall and subsided quickly. [PAG] (p13)</p></div><div class="nugget-popup"><p>Very localised but intense rainfall on 18th August 2011 caused significant local surface water flooding across Bournemouth; the town's urban nature and topography increased its vulnerability to this type of flooding. (p17)</p></div><div class="nugget-popup"><p>Multiple urban areas within Bournemouth were flooded during the storm; the council identified five significant localised areas for further study and assessed its own properties to identify high&ndash;risk properties for potential protection measures. (p18)</p></div><div class="nugget-popup"><p>The coastal fringe shows clusters of external flood points, indicating the coastline and immediate coastal urban area experienced flooding on 18th August 2011. [IMG] (p26)</p></div><div class="nugget-popup"><p>Widespread flooding on 18th August 2011 concentrated in low&ndash;lying coastal and estuarine areas and along river valleys. Flooded locations clustered near the coast and river mouths, with events scattered across multiple administrative areas. [IMG] (p27)</p></div><div class="nugget-popup"><p>The intense, short&ndash;lived storm on 18 August 2011 caused widespread surface water/urban flooding: lower gardens, Boscombe Chine (emergency access for the Air Show) and other areas were affected; roads were closed (including Copper Dean Roundabout); contaminated public open spaces required fencing off; large clean&ndash;up effort enabled the Air Show to open the next day; Ask Bournemouth received nearly 1,000 calls in a short period. (p31)</p></div><div class="nugget-popup"><p>On 18 August 2011 intense surface&ndash;water/urban runoff flooding caused internal flooding of properties across Bournemouth. Council records cited about 250 properties flooded internally during the event; localised flooding also led to road closures (for example Castle Lane West), restricting access to the hospital. [TAB] (p37)</p></div><div class="nugget-popup"><p>On 18 August 2011 the area experienced localised surface&ndash;water/urban flooding that caused internal flooding of domestic properties and disrupted access (Castle Lane West was closed restricting access to the hospital). Local response and cleanup were required. (p38)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>270 reported or observed incidents of flooding; at least 157 properties flooded internally [PAG] (p3)</p></div><div class="nugget-popup quant"><p>33 calls to Wessex Water; over 80 incidents logged by Bournemouth BC; about 800 additional calls reported [PAG] (p12)</p></div><div class="nugget-popup quant"><p>nearly 1000 calls (p31)</p></div><div class="nugget-popup quant"><p>250 properties [TAB] (p37)</p></div><div class="nugget-popup quant"><p>250 properties flooded internally (p38)</p></div></div></body></div>`)[0];
