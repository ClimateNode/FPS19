                var html_bf152b53ad37f5a59d9ade8085178ea4 = $(`<div id="html_bf152b53ad37f5a59d9ade8085178ea4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Derbyshire</h1><div class="nugget-popup"><p>Within Derbyshire 26 Flood Alerts, 99 Flood Warnings and 1 Severe Flood Warning were issued during Storm Babet. Across 35 investigated communities a total of 1,284 properties were flooded internally. The internally flooded properties were distributed by WFD catchment as: Derwent Derbyshire 267; Don and Rother 514; Dove 23; Idle and Torne 15; Trent and Lower Erewash 465. 38% of internally flooded properties were in the Don and Rother catchment. Worst&ndash;affected communities included Breaston and Sandiacre (more than 100 residential properties flooded in each) and Chesterfield (over 400 residential properties flooded, including areas such as Tapton Terrace and Brampton). [TAB,PAG] (p8)</p></div><div class="nugget-popup"><p>Widespread internal property flooding across the county during the Storm Babet event: 1,284 properties flooded internally across 35 investigated communities; flooding was associated with river systems (e.g. River Erewash and River Derwent) and prompted multiple Flood Alerts, Flood Warnings and a Severe Flood Warning for the River Derwent at Racecourse Park, Chaddesden (no properties reported flooded at that Severe Flood Warning location). The Don and Rother catchment accounted for 38% of internally flooded properties, with Breaston, Sandiacre and several Chesterfield communities heavily affected. [PAG,IMG] (p10)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>26 Flood Alerts; 99 Flood Warnings; 1 Severe Flood Warning; 1,284 internally flooded properties; 267 (Derwent Derbyshire); 514 (Don and Rother); 23 (Dove); 15 (Idle and Torne); 465 (Trent and Lower Erewash); &gt;100 properties in Breaston; &gt;100 in Sandiacre; &gt;400 in Chesterfield. [TAB,PAG] (p8)</p></div><div class="nugget-popup quant"><p>1,284 internally flooded properties; 35 communities investigated; 19 of 26 areas with a Flood Alert had property flooding; 56 of 99 areas with a Flood Warning had property flooding; catchment totals &mdash; Derwent Derbyshire: 267; Don and Rother: 514; Dove: 23; Idle and Torne: 15; Trent and Lower Erewash: 465. [PAG,IMG] (p10)</p></div></div></body></div>`)[0];
