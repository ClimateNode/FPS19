                var html_a8738556d95e5fd6832a75633701553c = $(`<div id="html_a8738556d95e5fd6832a75633701553c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Halton Unitary Authority</h1><div class="nugget-popup"><p>The administrative area in which the incident occurred; event included a major road closure at A557 Watkinson Way / Cranshaw Hall Bridge due to debris&ndash;blocked highway ditch causing flooding. [PAG] (p5)</p></div><div class="nugget-popup"><p>Flooding occurred in the area on 25&ndash;26 Sep 2017 due to blocked ditches/watercourses, high field drainage levels and likely high groundwater; signs were erected warning of flooding and a road was later closed following a road traffic collision; emergency maintenance works were carried out post&ndash;event to resolve the drainage blockage. [PAG] (p30)</p></div><div class="nugget-popup"><p>The flood incident occurred within the Halton administrative area (at Watkinson Way); local flood investigation and coordination of RMAs and stakeholders were undertaken by the local authority. (p34)</p></div><div class="nugget-popup"><p>Flooding occurred across the borough during 25 Sep 2017 &ndash; 26 Sep 2017, prompting a Section 19 investigation and leading to an action plan to identify watercourses, inspect and maintain drainage assets and improve communications. [TAB,PAG] (p35)</p></div></div></body></div>`)[0];

                var html_20acff24a256a02388d05312d448ca1d = $(`<div id="html_20acff24a256a02388d05312d448ca1d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cranshaw Hall Bridge</h1><div class="nugget-popup"><p>Location at/near the bridge was part of the reported incident and associated road closure; incident attributed to debris in the highway ditch leading to flooding impacts on the carriageway. [TAB] (p5)</p></div><div class="nugget-popup"><p>Flooding occurred on the A557 near Cranshaw Hall Bridge with cascading water across the southbound carriageway; a siltation/blockage at the head of the Cranshaw Bridge Culvert was identified and cleared, the road was closed overnight and reopened on the afternoon of 26 September; a single&ndash;vehicle aquaplaning RTC occurred as a result of the flooded road. [IMG,PAG] (p21)</p></div><div class="nugget-popup"><p>Flooding occurred on the A557 near Cranshaw Hall Bridge with cascading water across the southbound carriageway that contributed to road closure and traffic disruption. (p22)</p></div><div class="nugget-popup"><p>Culvert crossings under the carriageway were blocked by litter/debris, causing surface water to cascade across the A557 carriageway and flood the road; contractors jet&ndash;cleared the culvert blockages and cleared ditch approaches to restore flow. [TAB] (p23)</p></div><div class="nugget-popup"><p>Blocked culvert crossings under the road at Cranshaw Bridge caused the carriageway to flood; jetting was carried out to clear the blockages. Flooding had subsided from the carriageway but high water remained in the adjoining ditch; contractor works and ditch clearance were undertaken to mitigate the problem. (p25)</p></div><div class="nugget-popup"><p>A blocked culvert at the end of a ditch carrying land drainage adjacent to Cranshaw Bridge formed the southernmost flood location and contributed to a highway closure; the blockage was cleared and silt, litter and vegetation were removed. (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one road closure (A557 southbound) (p22)</p></div></div></body></div>`)[0];

                var html_cf419d8fa649d8132b5e0bdee0382e60 = $(`<div id="html_cf419d8fa649d8132b5e0bdee0382e60" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Watkinson Way, Widnes</h1><div class="nugget-popup"><p>Major road closure on the A557 at this location caused by flooding associated with debris blocking the highway ditch. [TAB] (p5)</p></div><div class="nugget-popup"><p>Flooding from a culvert/ditch blockage caused water to flow onto the carriageway, leading to a vehicle skidding and colliding with the barrier and the subsequent closure of the road; the road remained closed while remedial works were carried out. (p8)</p></div><div class="nugget-popup"><p>Carriageway flooded causing a road closure; debris and litter in ditches required clearing; nearby field flooding was inspected and fixed during the emergency visit. (p9)</p></div><div class="nugget-popup"><p>Surface water from blocked ditches/culverts cascaded across the carriageway causing road flooding; a vehicle aquaplaned, lanes were closed, the A557 southbound was notified/part&ndash;closed, diversion and overnight closure were implemented, and works were carried out to clear the blockages before reopening with one lane. [TAB] (p23)</p></div><div class="nugget-popup"><p>Carriageway inundated when ditch/culvert blockage within the highway verge caused excess levels in the watercourse to exceed bank level and flood the road. (p27)</p></div><div class="nugget-popup"><p>Highway drainage blockages (one at a manhole receiving a watercourse from a farmer's field and one at a culvert head in a ditch parallel to the road) led to flooding that caused the road to be closed; once blockages were cleared water levels subsided and further clearance works were carried out. [IMG] (p28)</p></div><div class="nugget-popup"><p>Surface water affected the carriageway during the incident, creating a traffic safety issue and prompting a recommendation to install a temporary physical barrier (chicane) to slow traffic. [TAB] (p32)</p></div><div class="nugget-popup"><p>Site of the reported flooding incident on 25/09/2017&ndash;26/09/2017 that required responses from Risk Management Authorities. Flooding affected the carriageway and traffic management was raised as an issue (recommendation that a chicane should have been considered to slow traffic). The incident prompted recommendations on drainage/culvert inspection and maintenance. [PAG] (p33)</p></div><div class="nugget-popup"><p>Roadway was affected by flooding during the incident, prompting warning signs and a subsequent road closure; blocked watercourse/ditch systems at the location were cleared to alleviate flooding. (p34)</p></div></div></body></div>`)[0];
