                var html_effb17b040cb73659d0bfad871e4edca = $(`<div id="html_effb17b040cb73659d0bfad871e4edca" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Swavesey</h1><div class="nugget-popup"><p>Significant surface&ndash;water flooding occurred in Swavesey on 23 December 2020. The intense short&ndash;duration rainfall on that day, combined with a prolonged period of above&ndash;average rainfall that saturated the ground (very high water table / low SMD), produced very high runoff and significant flooding. Flooding is worsened by generally low land levels and can be exacerbated if the Webbs Hole sluice is closed, preventing discharge to the River Great Ouse. (p4)</p></div><div class="nugget-popup"><p>Five residential properties were flooded internally; additional flooding occurred in some roads and gardens. The LLFA received five flood reports and identified three key risk areas within the village. (p7)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties (internal property flooding reported by LLFA); additional flooding of some roads and gardens. Three key risk areas were identified where internal property flooding was reported: Middle Watch, Ramper Road and Boxworth End. [PAG,IMG] (p8)</p></div><div class="nugget-popup"><p>The village experienced reported flooding during the December 2020 event; LLFA and RMAs carried out site walkovers, residents known to have flooded were contacted, gully cleansing was ordered and Anglian Water attended to remove foul sewer blockages; discussions opened about highway gully maintenance and sewer network capacity. [TAB] (p11)</p></div><div class="nugget-popup"><p>The village of Swavesey experienced surface water flooding (noted at Middle Watch, Ramper Road and Boxworth End) and had sewer&ndash;related issues requiring removal of blockages and capacity discussions; actions are ongoing to maintain drainage and reduce future flooding. (p15)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 residential properties; 5 flood reports (p7)</p></div><div class="nugget-popup quant"><p>5 residential properties; 5 flood reports [PAG,IMG] (p8)</p></div></div></body></div>`)[0];
