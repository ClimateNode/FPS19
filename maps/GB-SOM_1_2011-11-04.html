                var html_165f4006890221a5ffa3b6b7f3daa69f = $(`<div id="html_165f4006890221a5ffa3b6b7f3daa69f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>The Pastures</h1><div class="nugget-popup"><p>Floodwater flowing down the A359 reached the junction of the Bellways Development; because of the carriageway profile the water left the road and entered the new access to the development, conveying significant volumes of surface water into the site after highway drainage was overwhelmed. [PAG] (p9)</p></div><div class="nugget-popup"><p>Surface water from the A359 overwhelmed highway drainage and flowed down the carriageway into the new access to The Pastures. Estate road drainage captured water until the attenuation tank filled and then overflowed, adding to overland flow across the development's open space and directing water toward properties in Eastfield. Deposits of gravel from damaged pathways corroborate local accounts of this overland flow. (p10)</p></div><div class="nugget-popup"><p>The Pastures housing development's adopted surface water drainage system and attenuation tanks were overwhelmed by runoff originating outside the site during the 2011&ndash;11&ndash;04 event, resulting in flooding impacts to the development and its properties. (p12)</p></div></div></body></div>`)[0];

                var html_7c8f529a6033cb85cf2b5896d2d926f3 = $(`<div id="html_7c8f529a6033cb85cf2b5896d2d926f3" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cuckoo Hill, Bruton</h1><div class="nugget-popup"><p>Described as the origin of the flood event that affected properties in Bruton; the event originated at Cuckoo Hill and led to flooding impacts on local properties. (p5)</p></div><div class="nugget-popup"><p>A significant volume of surface water travelled down Cuckoo Hill during the event and entered The Pastures development via the new junction. The flow overwhelmed road drainage, ran over the development amenity space and into properties in Eastfield, contributing to flooding of residential properties. (p7)</p></div><div class="nugget-popup"><p>Highways surface&ndash;water run&ndash;off from Cuckoo Hill contributed additional significant volume to the flood flows reaching the A359, increasing local roadway/urban flooding. (p8)</p></div><div class="nugget-popup"><p>Area experienced flooding caused by overland surface water runoff associated with the unusual rainfall on 2011&ndash;11&ndash;04 and land management practices (maize stubble). (p13)</p></div><div class="nugget-popup"><p>Agricultural surface runoff from adjacent fields overtopped the field ditch and outfall where it meets road drains at Cuckoo Hill; the ditch had insufficient capacity so overtopping contributed to flooding reaching the road drainage system and contributed to flooding of the garden of an adjoining property. [TAB] (p17)</p></div><div class="nugget-popup"><p>A reception ditch and diversion culvert at Cuckoo Hill were unable to cope with agricultural field runoff. The diversion pipe entrance is only ~10 in (25 cm) diameter, providing limited capacity to discharge the volumes that collected in the reception ditch. The immediate sub&ndash;catchment draining to the ditch was estimated at 8 ha (within a 32 ha forage&ndash;maize field). For a 12&ndash;hour 30 mm event the intercepted rainfall was estimated at 2,400 m³, with ~70% absorption leaving an estimated 1,680 m³ of captured field runoff; if 50% of that required drainage the discharge pipe would need an average capacity of ~70 m³/hour. The report therefore identifies the culvert/pipe and reception ditch at Cuckoo Hill as being overwhelmed by surface&ndash;water/field&ndash;runoff during the event and requiring greater discharge capacity or diversion works. (p22)</p></div></div></body></div>`)[0];
                popup_51db81d6a0fa332e78dad3fc01facf96.setContent(html_7c8f529a6033cb85cf2b5896d2d926f3);

                var html_f214177a7f598e0efe25aeec9fd3830b = $(`<div id="html_f214177a7f598e0efe25aeec9fd3830b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Eastfield, Bruton</h1><div class="nugget-popup"><p>Properties in Eastfield were flooded when surface water from Cuckoo Hill passed through The Pastures; sheltered housing (operated by Yarlington Homes) required evacuation of a number of vulnerable elderly residents. Between 10 and 15 homes across The Pastures and Eastfield were affected. (p7)</p></div><div class="nugget-popup"><p>Surface water travelled overland from The Pastures across open space and down roads, continuing through Eastfield and flooding residential properties; pathway surfaces were damaged with gravel deposits from the flood. (p10)</p></div><div class="nugget-popup"><p>Surface water flowed through Eastfield (from The Pastures open space and via Brue Avenue), entering the residential area and flooding houses. [PAG,IMG] (p11)</p></div><div class="nugget-popup"><p>Private surface water runoff reached the highway drainage in Eastfield in volumes significantly in excess of the system's design capacity; highway drainage was overwhelmed and ditch clearance and drainage investigations were planned. (p12)</p></div><div class="nugget-popup"><p>Experienced surface water / overland flow flooding during the event on 2011&ndash;11&ndash;04 resulting from an unusual rainfall pattern combined with land management factors; identified for further drainage and mitigation actions. (p13)</p></div><div class="nugget-popup"><p>A localised flooding event occurred at Eastfield (near Bruton) that was investigated as being influenced by surface runoff from adjacent agricultural land (Whaddon Farm fields). (p18)</p></div></div></body></div>`)[0];

                var html_c435d0c9d462dd7718f9ad6a89921ee3 = $(`<div id="html_c435d0c9d462dd7718f9ad6a89921ee3" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Whaddon Hill, Bruton</h1><div class="nugget-popup"><p>Fields to the east of Whaddon Hill drained in a south&ndash;westerly direction into a headland ditch area between fields 1 and 2. Post&ndash;harvest maize stubbles and silty loam soils produced waterlogged headland areas with standing water and poor drainage, producing surface runoff that contributed to a localised flooding event at Eastfield (near Bruton). (p18)</p></div></div></body></div>`)[0];

                var html_bd72d740c0b72336d6d32381755844ac = $(`<div id="html_bd72d740c0b72336d6d32381755844ac" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bruton</h1><div class="nugget-popup"><p>Affected by the flood event originating at Cuckoo Hill; the event affected a significant number of properties in Bruton and generated substantial correspondence and local concern. (p5)</p></div><div class="nugget-popup"><p>Surface water travelling down Cuckoo Hill entered The Pastures development and flowed into Eastfield, flooding properties in Bruton and causing evacuation of vulnerable residents; between 10 and 15 homes across the affected area were flooded. [PAG] (p7)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration downpours and saturated ground produced surface&ndash;water flooding in Bruton. Surface water and an overwhelmed field ditch ran overland onto the A359; between 10 and 15 homes in Bruton were flooded to varying degrees. Sheltered housing in Eastfield (Yarlington Homes) required evacuation of vulnerable elderly residents. [PAG] (p8)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration rainfall and saturated ground produced large surface water run&ndash;off from agricultural land (maize stubble) which overwhelmed a field ditch and then the highway drainage on the A359. Turbid runoff covered the carriageway of the A359 at Bruton, impeding traffic and requiring an emergency/response presence; highway drainage was completely overwhelmed by flows originating off&ndash;field and from Cuckoo Hill. [PAG,IMG] (p9)</p></div><div class="nugget-popup"><p>On 2011&ndash;11&ndash;04 North Bruton experienced surface water flooding driven by an unusual rainfall pattern and runoff from farmland (notably maize stubble) north of the A359. Overland flows and overwhelmed highway/local drainage led to floodwater entering residential areas (including Cuckoo Hill, The Pastures and Eastfield) and caused damage to property; local drainage defects (blocked watercourse opposite the cemetery and a low headwall) exacerbated the flooding. (p13)</p></div></div></body></div>`)[0];
