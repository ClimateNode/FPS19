                var html_c1f5eb9808d93a7fc814bafce3f32689 = $(`<div id="html_c1f5eb9808d93a7fc814bafce3f32689" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hawkley Brook</h1><div class="nugget-popup"><p>Hawkley Brook levels rose during the event so discharge from the public sewers to the brook was not possible. The brook overtopped (to the rear of 47 Atholl Grove) and its high levels caused sewers to back up and surcharge through manholes, and overtopping led to flooding of nearby properties (including 14 and 16 Atholl Grove) with damage to furniture and fittings. (p4)</p></div><div class="nugget-popup"><p>Overtopping of Hawkley Brook previously caused garden flooding at 47 Atholl Grove; the brook is also identified as a primary source of flood risk (in combination with the public sewer system) for the 14 June 2016 event. [PAG,MUL] (p5)</p></div><div class="nugget-popup"><p>High water levels in Hawkley Brook on 14 June 2016 prevented discharge from the surface water sewer, causing sewer backup and surcharging through manholes; sandbags and pumps were deployed to site to limit property damage. [IMG] (p6)</p></div><div class="nugget-popup"><p>High levels in Hawkley Brook on 14 June 2016 prevented discharge from the surface water sewer, causing water to back up in the sewer system and surcharge through manholes; Hawkley Brook has also overtopped to the rear of 47 Atholl Grove, causing garden flooding on three prior occasions. [PAG] (p7)</p></div><div class="nugget-popup"><p>Overbanking from Hawkley Brook spilled floodwater onto Atholl Grove; limited capacity of the culvert immediately downstream was identified as a likely main driver of flood risk. The EA investigated a raised flood wall/fence and use of opposite&ndash;bank woodland for additional flood storage but found existing hydraulic model lacked required detail to confidently justify a scheme. (p10)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 properties (47, 14 and 16 Atholl Grove) (p4)</p></div><div class="nugget-popup quant"><p>1 garden [PAG,MUL] (p5)</p></div><div class="nugget-popup quant"><p>3 occasions [PAG] (p7)</p></div><div class="nugget-popup quant"><p>1 in 50 and 1 in 100 year flood (p10)</p></div></div></body></div>`)[0];
