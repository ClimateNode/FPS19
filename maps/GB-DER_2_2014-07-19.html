                var html_6894ce54a245cb87807e681e75217da1 = $(`<div id="html_6894ce54a245cb87807e681e75217da1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Derby</h1><div class="nugget-popup"><p>Areas within Derby (notably Oakwood/Bishops Drive) experienced intense short&ndash;duration rainfall causing surface water flooding that led to internal property flooding and widespread highway and garden flooding. (p3)</p></div><div class="nugget-popup"><p>The urban surface water sewer network in the Oakwood area of Derby discharges to Oakwood Brook. During the intense rainfall of 19th July 2014 the network capacity would be exceeded and large volumes of runoff from paved urban areas were focused rapidly toward the sewer outfall and the brook, increasing downstream surface water flood risk and concentrating flow toward the base of the local valleys. [IMG,PAG] (p7)</p></div><div class="nugget-popup"><p>Part of the city (Oakwood) was impacted by a short&ndash;duration, high&ndash;intensity storm that produced rapid surface water runoff and caused the public surface water sewer serving a large urban catchment to be overwhelmed. This led to internal flooding of residential properties in Oakwood and widespread external flooding of gardens and highways in the affected neighbourhoods. [PAG,IMG] (p12)</p></div><div class="nugget-popup"><p>Intense, short&ndash;duration rainfall overwhelmed drainage and produced rapid runoff and overland flow toward Wood Brook and Oakwood Brook, causing significant surface water flooding of properties and highways across large areas of the east of Derby (including Oakwood). A cluster of streets between Bishops Drive and Wood Brook was particularly affected. [PAG] (p17)</p></div><div class="nugget-popup"><p>Surface water flooding occurred across many areas when highway drainage capacity was exceeded by a combination of highway and private surface water during the intense, isolated storm on the afternoon of 19th July 2014 (Oakwood was specifically affected). (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 10 properties (p3)</p></div><div class="nugget-popup quant"><p>at least 10 homes [PAG,IMG] (p12)</p></div><div class="nugget-popup quant"><p>at least 10 properties [PAG] (p17)</p></div></div></body></div>`)[0];

                var html_79e3b202fa51b91e1ecf4d968373b873 = $(`<div id="html_79e3b202fa51b91e1ecf4d968373b873" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bishops Drive, Derby</h1><div class="nugget-popup"><p>Experienced internal flooding to properties, severe highway flooding and external (garden) flooding; further extensive external flooding and possible additional internal flooding was reported on Bishops Drive. (p3)</p></div><div class="nugget-popup"><p>Cluster of reported internal and external property flooding in the Bishops Drive area and highway flooding. [IMG] (p5)</p></div><div class="nugget-popup"><p>Homes on the street experienced internal flooding; highways and gardens in the area suffered severe external property flooding, in some cases close to entering ground&ndash;floor living areas. (p11)</p></div><div class="nugget-popup"><p>Surface water runoff from an extreme short&ndash;duration storm overwhelmed the urban drainage (road gullies and public surface water sewer), producing overland flows and accumulation in low spots across the Bishops Drive area that led to internal flooding of properties and damage to ground&ndash;floor living areas. (p13)</p></div><div class="nugget-popup"><p>Accumulation of surface water on the highway and reports of one or more surface water sewer manholes surcharging on Bishops Drive, producing increased overland flow downslope toward neighbouring streets and properties. (p14)</p></div><div class="nugget-popup"><p>Significant highway surface water flooding occurred near the junction with Earls Crescent; wash of soil and sediment from the adjacent recreation ground onto the road was observed; reports indicate up to ten properties in the Bishops Drive area were flooded internally by surface water (reported/unconfirmed). Foul sewer surcharging and evidence of foul&ndash;water flooding were observed in the area shortly after the event. [PAG,IMG] (p15)</p></div><div class="nugget-popup"><p>Flooding at the Earls Crescent junction &mdash; the road and junction were inundated during the intense rainfall on 19th July 2014, shown in a resident's photograph of the event. (p16)</p></div><div class="nugget-popup"><p>Flooding was concentrated in the cluster of streets between Bishops Drive and Wood Brook, with properties and the highway affected by surface water and overland flow from the intense storm. [PAG] (p17)</p></div><div class="nugget-popup"><p>The local surface water sewer network that serves the Bishops Drive area was considered likely to have been overwhelmed by the intense rainfall, contributing to surface water and sewer&ndash;related flooding in the area. (p18)</p></div><div class="nugget-popup"><p>Residents reported flooding of properties during the storm on 19th July 2014; foul water (sewer) flooding incidents were reported to City Council officers and referenced in Severn Trent Water records. (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 10 properties (p3)</p></div><div class="nugget-popup quant"><p>At least 10 homes affected internally across the six listed streets (collectively). (p11)</p></div><div class="nugget-popup quant"><p>at least 10 properties (across the affected Bishops Drive area) (p13)</p></div><div class="nugget-popup quant"><p>Up to 10 properties [PAG,IMG] (p15)</p></div><div class="nugget-popup quant"><p>at least 10 properties [PAG] (p17)</p></div></div></body></div>`)[0];

. (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 9 residential properties (across Saffron Drive, Columbine Close, Santolina Drive, Morefern Drive and Bryony Close) (p4)</p></div><div class="nugget-popup quant"><p>At least 10 homes affected internally across the six listed streets (collectively). (p11)</p></div><div class="nugget-popup quant"><p>at least 10 properties (internally flooded across the affected area) (p13)</p></div><div class="nugget-popup quant"><p>4 properties; 230 mm depth [PAG] (p14)</p></div><div class="nugget-popup quant"><p>4 properties; internal flood depth up to 230 mm [PAG] (p15)</p></div></div></body></div>`)[0];

                var html_86c0401086205393e71a5e2397b99186 = $(`<div id="html_86c0401086205393e71a5e2397b99186" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Santolina Drive, Derby</h1><div class="nugget-popup"><p>Severe highway and external garden flooding on the street during the event. (p3)</p></div><div class="nugget-popup"><p>Residential properties on Santolina Drive experienced internal flooding (internal water ingress to homes) as part of the Oakwood flood. (p4)</p></div><div class="nugget-popup"><p>Homes on the street experienced internal flooding; highways and gardens in the area suffered severe external property flooding, in some cases close to entering ground&ndash;floor living areas. (p11)</p></div><div class="nugget-popup"><p>Located at the base of the Wood Brook valley and listed among the worst&ndash;affected streets; drainage exceedance and overland flows caused surface&ndash;water flooding to the street and properties during the event. (p13)</p></div><div class="nugget-popup"><p>Santolina Drive acted as a conduit for surface water that exceeded the drainage network; multiple manholes and gullies surcharged within the highway, producing significant highway flooding and local accumulations. At least 6 properties experienced external garden flooding. Fluvial flooding from the nearby watercourse (Wood Brookmay) was also believed to have contributed; residents cited fly&ndash;tipped refuse in the watercourse as a factor. (p14)</p></div><div class="nugget-popup"><p>Residents reported flooding of properties during the storm on 19th July 2014; foul (sewer) water flooding incidents were reported to City Council officers and are referenced in STW records. (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>internal flood damage of at least 10 properties (across the affected area including this street) (p3)</p></div><div class="nugget-popup quant"><p>at least 9 residential properties (across Saffron Drive, Columbine Close, Santolina Drive, Morefern Drive and Bryony Close) (p4)</p></div><div class="nugget-popup quant"><p>At least 10 homes affected internally across the six listed streets (collectively). (p11)</p></div><div class="nugget-popup quant"><p>at least 10 properties (across the affected Bishops Drive area) (p13)</p></div><div class="nugget-popup quant"><p>6 properties (p14)</p></div></div></body></div>`)[0];

ial properties (across Saffron Drive, Columbine Close, Santolina Drive, Morefern Drive and Bryony Close) (p4)</p></div><div class="nugget-popup quant"><p>At least 10 homes affected internally across the six listed streets (collectively). (p11)</p></div><div class="nugget-popup quant"><p>1 property internally flooded; 4 properties affected by significant flooding [PAG] (p13)</p></div><div class="nugget-popup quant"><p>at least one property (p14)</p></div></div></body></div>`)[0];

                var html_2954091b76d915179fd8afd436f39364 = $(`<div id="html_2954091b76d915179fd8afd436f39364" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Derbyshire</h1><div class="nugget-popup"><p>19th July 2014: Intense local thunderstorms produced surface water/urban flooding in the Oakwood area of Derby. At the peak (around 15:30) internal flooding was reported in residential properties on Bishops Drive, Saffron Drive, Columbine Close, Santolina Drive, Morefern Drive and Bryony Close; highways and gardens in these areas also suffered severe external flooding, in some cases approaching ground&ndash;floor living areas. 6th July 2012: A separate storm caused external property flooding to a single property on Foxglove Drive; this was attributed to surface water runoff from adjacent fields and there was no internal flooding reported. [IMG,MUL] (p10)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 10 homes; 1 property [IMG,MUL] (p10)</p></div></div></body></div>`)[0];

                var html_eb13d97477c53913c31eea2f66f7ff3a = $(`<div id="html_eb13d97477c53913c31eea2f66f7ff3a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Oakwood</h1><div class="nugget-popup"><p>Experienced intense rainfall&ndash;driven surface water flooding: a cluster of properties in the Bishops Drive area suffered internal flooding and there were further isolated cases of internal and external (highway and garden) flooding elsewhere in Oakwood. (p3)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties: at least nine homes in the streets Saffron Drive, Columbine Close, Santolina Drive, Morefern Drive and Bryony Close were internally flooded, prompting a formal Section 19 investigation. [PAG] (p4)</p></div><div class="nugget-popup"><p>The Oakwood area of Derby City was affected by the 19 July 2014 flood event. At least nine residential properties were internally flooded (Saffron Drive, Columbine Close, Santolina Drive, Morefern Drive and Bryony Close). The City Council identified a significant cluster of reported internal and external property flooding from a number of sources and highway flooding in the Bishops Drive area. [PAG] (p5)</p></div><div class="nugget-popup"><p>Many areas of Oakwood were affected by the 19 July 2014 flood, including internal and external property flooding and highway flooding. The City Council identified a significant cluster of reported internal and external property flooding from multiple sources and highway flooding concentrated in the Bishops Drive area. Flooding was associated with rapid concentration of surface water to the public surface water sewer outfall to local watercourses. [PAG] (p6)</p></div><div class="nugget-popup"><p>Internal property flooding was reported for the first time in Oakwood during the event; accounts from residents and City Council site visits recorded internal flooding of properties following heavy thundery rainfall. [PAG] (p9)</p></div><div class="nugget-popup"><p>Localized surface&ndash;water and urban flooding on 19th July 2014 caused internal property flooding in Oakwood (Derby). Peak impacts occurred around 15:30 when at least 10 homes were internally flooded on Bishops Drive, Saffron Drive, Columbine Close, Santolina Drive, Morefern Drive and Bryony Close. Highways and gardens in these areas also suffered severe external flooding, in some cases close to entering ground&ndash;floor living areas. Separately, a storm on 6th July 2012 caused external flooding to a single property on Foxglove Drive from surface water run&ndash;off from adjacent fields. [PAG,IMG,MUL] (p10)</p></div><div class="nugget-popup"><p>In the late afternoon of 19 July 2014 (peak around 3:30pm) at least 10 homes in the Oakwood area were affected by internal flooding. Properties on Bishops Drive, Saffron Drive, Columbine Close, Santolina Drive, Morefern Drive and Bryony Close experienced internal flooding; an undetermined number of properties in these streets also suffered severe external flooding to highways and gardens, with floodwater in some cases close to entering ground&ndash;floor living areas. [PAG] (p11)</p></div><div class="nugget-popup"><p>An intense, highly localised storm on 19 July 2014 caused rapid surface water generation and exceedance of the public surface water sewer system. Floodwaters propagated along local overland flow routes toward the Wood Brook and Oakwood Brook valleys. At least 10 homes were flooded internally on Bishops Drive, Saffron Drive, Columbine Close, Santolina Drive, Morefern Drive and Bryony Close. An undetermined number of properties suffered severe external flooding to highways and gardens, with some external inundation close to entering ground&ndash;floor living areas. [PAG,IMG] (p12)</p></div><div class="nugget-popup"><p>Surface water flooding focused on a cluster of streets between Bishops Drive and Wood Brook; intense runoff and exceeded drainage caused significant flooding to properties and highways in Oakwood. The council carried out formal Section 19 investigations into the impacts. (p17)</p></div><div class="nugget-popup"><p>An intense thunderstorm hit Oakwood on the afternoon of 19 July 2014 and caused surface water flooding when highway and private surface water exceeded drainage capacity. (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 10 properties (p3)</p></div><div class="nugget-popup quant"><p>9 residential properties [PAG] (p4)</p></div><div class="nugget-popup quant"><p>at least 9 residential properties internally flooded [PAG] (p5)</p></div><div class="nugget-popup quant"><p>at least 10 homes internally flooded; 1 property externally flooded (Foxglove Drive, 6th July 2012) [PAG,IMG,MUL] (p10)</p></div><div class="nugget-popup quant"><p>at least 10 homes [PAG] (p11)</p></div><div class="nugget-popup quant"><p>at least 10 homes [PAG,IMG] (p12)</p></div><div class="nugget-popup quant"><p>at least 10 properties (p17)</p></div></div></body></div>`)[0];

                var html_34cf2e100cc97c5bea32efe611139a39 = $(`<div id="html_34cf2e100cc97c5bea32efe611139a39" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Chaddesden</h1><div class="nugget-popup"><p>Tributaries in the Chaddesden area (Wood Brook and Oakwood Brook feeding the Chaddesden Brook) received concentrated sewer and overland flows when the surface water sewer capacity was exceeded during the intense rainfall on 19th July 2014. Properties and streets at the base of the brooks' valleys (notably Morefern Drive, Santolina Drive, Saffron Drive and Columbine Close) are indicated as being susceptible to flow&ndash;path inundation or surface water accumulation. [PAG,IMG] (p7)</p></div></div></body></div>`)[0];
