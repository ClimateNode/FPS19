                var html_780c000aa06bce1c08b91b06124f47d7 = $(`<div id="html_780c000aa06bce1c08b91b06124f47d7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Stonelea Road, Sywell</h1><div class="nugget-popup"><p>Heavy rainfall on a saturated catchment, together with insufficient or absent drainage, caused excess surface water to flow over ground following natural contours to low points around private property. This resulted in internal flooding of a property on Stonelea Road; internal flooding of one property has been experienced on more than one occasion in the last five years. (p7)</p></div><div class="nugget-popup"><p>Internal flooding of a property (water entered the building). The incident on 9th March 2016 caused internal flooding of one property; the same property has experienced internal flooding on more than one occasion in the previous five years. (p9)</p></div><div class="nugget-popup"><p>The area is identified on NCC Flood Toolkit as being within an area of varying surface water flood risk; the street (residential area including later housing on Palmer Grove) was within the scope of the local flood investigation relating to the 9th March 2016 event. (p10)</p></div><div class="nugget-popup"><p>Surface water runoff from agricultural fields to the north flowed under the rear garden fence across the rear garden into the house and garage, causing internal flooding of a property. [TAB,PAG,MUL] (p12)</p></div><div class="nugget-popup"><p>Surface water from agricultural fields flowed under the rear garden fence across the garden towards the house and garage, ponded at the rear of the building and entered air bricks. Water flowed under the ground floor (audible from inside), rose over the rear door threshold causing damage to the door frame and flooring, and caused internal flooding of the garage. Floodwaters later receded by continuing to flow into the airbricks. (p13)</p></div><div class="nugget-popup"><p>Surface water flooding associated with inadequate or ineffective surface water drainage from recent developments affected properties on Stonelea Road, creating flood risk to those properties. (p22)</p></div><div class="nugget-popup"><p>Overland surface water flow converged from the west and southwest toward a central low point adjacent to Stonelea Road, producing a schematic flood area on the map. Historic ditches and possible outlet pipes connected to the area but were indicated as insufficient during the incident, contributing to localized inundation at/near Stonelea Road. [IMG] (p30)</p></div><div class="nugget-popup"><p>Floodwater pooled and flowed along the side and rear of a residential property, entering the garden and reaching the house threshold; water encroached onto the patio and interior threshold, outdoor furniture was submerged and a submersible pump was deployed to remove water. [IMG] (p38)</p></div><div class="nugget-popup"><p>Field at the rear of Stonelea Road experienced waterlogging and soil compaction that damaged crop growth; photographed areas show large bare or thinly vegetated patches consistent with localized pooling/runoff adjacent to residential properties. [IMG,PAG] (p46)</p></div><div class="nugget-popup"><p>Rear garden of an affected residential property was saturated; air brick located just below the door threshold and a linear drainage channel present directly in front of the rear door on the patio, indicating water accumulation at the base of the property. [IMG,PAG] (p48)</p></div><div class="nugget-popup"><p>Rear entrance/patio area of a residential property on Stonelea Road showed water staining and evidence of surface water affecting external thresholds and drainage features (air brick and drain noted at rear of the affected property). [IMG,PAG] (p49)</p></div><div class="nugget-popup"><p>Saturated ground at the rear of a garden of an affected property on Stonelea Road, indicating soil saturation and shallow inundation of garden area. [IMG,PAG] (p50)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property (p7)</p></div><div class="nugget-popup quant"><p>one property (p9)</p></div><div class="nugget-popup quant"><p>one property [TAB,PAG,MUL] (p12)</p></div><div class="nugget-popup quant"><p>1 residential property [IMG] (p38)</p></div></div></body></div>`)[0];

                var html_4be3b7a598b83249ea0de4ff309622ff = $(`<div id="html_4be3b7a598b83249ea0de4ff309622ff" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Sywell</h1><div class="nugget-popup"><p>At Stonelea Road in Sywell, heavy rainfall on a saturated catchment with insufficient drainage led to excess surface water flowing to low points around private property and caused internal flooding of at least one property in the village. (p7)</p></div><div class="nugget-popup"><p>Residents in the village were affected by the flooding incident on 9th March 2016; affected residents and a parish representative were interviewed as part of a Flood Incident Investigation on 14th June 2016. [PAG] (p10)</p></div><div class="nugget-popup"><p>Heavy rainfall on a saturated catchment caused excess surface water to flow overland from agricultural fields to low points around private properties in the village. Several properties backing onto the fields experienced garden and garage flooding, including the affected property on Stonelea Road. [PAG] (p13)</p></div><div class="nugget-popup"><p>The investigation map locates a schematic flood area within Sywell where multiple overland flow routes and historic drainage features converged, indicating localized surface water flooding in the village (central low point near Stonelea Road) during the incident. [IMG] (p30)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property (p7)</p></div></div></body></div>`)[0];
