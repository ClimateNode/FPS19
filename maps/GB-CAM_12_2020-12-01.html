                var html_5e3a154985a0c6ffa42486b7c139704d = $(`<div id="html_5e3a154985a0c6ffa42486b7c139704d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Alconbury Brook</h1><div class="nugget-popup"><p>Identified as a source of flooding in the catchment and contributed to flooding of downstream settlements (feeding into the Great Ouse system) during the reported event. (p5)</p></div><div class="nugget-popup"><p>Rising river levels in Alconbury Brook were identified as the primary driver of flooding in the Hamerton Road/Spires End area and caused sewer flooding in the Hamerton Road area. (p12)</p></div><div class="nugget-popup"><p>Rising river levels in Alconbury Brook caused river flooding that contributed to sewer and internal property flooding in nearby areas (notably North Road and High Street). (p13)</p></div><div class="nugget-popup"><p>Alconbury Brook was implicated in the December 2020 flooding of the catchment; flood flows caused erosion of the brook bank beneath the A1 flyover along High Street (work to stabilise the eroded bank has been discussed). The brook has since been the focus of desilting, bank vegetation works and installation of Natural Flood Management structures to reduce future flood risk. (p16)</p></div><div class="nugget-popup"><p>Alconbury Brook had insufficient conveyance during the December 2020 flood, prompting flood&ndash;alleviation actions and planned hydraulic modelling to increase its ability to convey water during flood events. [PAG] (p21)</p></div><div class="nugget-popup"><p>Alconbury Brook was associated with flood&ndash;related RMA operational issues noted in the report, indicating it contributed to flooding impacts that required authority action. [TAB] (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>7 residential properties (North Road); 8 residential properties (High Street) (p13)</p></div></div></body></div>`)[0];

                var html_7fc2d4318cd8b9874a71317c1bfba5b0 = $(`<div id="html_7fc2d4318cd8b9874a71317c1bfba5b0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cambridgeshire</h1><div class="nugget-popup"><p>Intense rainfall on 23 December 2020, following a prolonged wet period and saturated ground, produced very high runoff and high river levels and caused significant flooding in Alconbury and nearby Alconbury Weston. Properties were inundated internally and gardens/outbuildings damaged. [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>Pumps identified as a Cambridgeshire Highways asset at Rusts Lane failed during the December 2020 event; the asset failure contributed to the inability to convey surface water and to the overall flooding in Alconbury. (p14)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>95 properties; 59 properties in Alconbury; 36 properties in Alconbury Weston; 46 residential properties flooded internally in Alconbury; 32 residential properties flooded internally in Alconbury Weston; 13 properties with outbuilding/garage/garden damage in Alconbury; 4 properties with outbuilding/garage/garden damage in Alconbury Weston [PAG,IMG] (p10)</p></div></div></body></div>`)[0];

                var html_125ff43f67062c9253f9f085d196671f = $(`<div id="html_125ff43f67062c9253f9f085d196671f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Alconbury</h1><div class="nugget-popup"><p>Floodwaters from Alconbury Brook and overland/surface&ndash;water runoff entered the settlement from surrounding agricultural fields, causing inundation of the settlement; flooding was exacerbated by saturated ground and the impermeable Oxford Clay. (p5)</p></div><div class="nugget-popup"><p>Significant flooding occurred in the settlement. [PAG,IMG] (p7)</p></div><div class="nugget-popup"><p>Significant flooding occurred on 23rd December 2020 in Alconbury; flooding arose from both high river levels and surface water due to very high runoff following intense rainfall and saturated ground conditions. (p8)</p></div><div class="nugget-popup"><p>Significant flooding from both river and surface water following very high runoff and rising river levels; internal flooding of residential properties and damage to outbuildings/garages/gardens. [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>Residential and other properties experienced internal flooding; additional damage to outbuildings, garages and gardens. [IMG,PAG] (p11)</p></div><div class="nugget-popup"><p>Rising Alconbury Brook levels caused river flooding and sewer flooding in conjunction with surface water run&ndash;off from fields; 17 residential properties flooded internally to about 1200mm, with additional outbuilding and garden flooding. Residents reported having to leave their homes for periods of over six months. [TAB,PAG] (p12)</p></div><div class="nugget-popup"><p>Multiple areas of Alconbury experienced flooding: High Street (Alconbury Weston) &mdash; 8 residential properties flooded internally to c.1200mm with outbuilding and garden flooding, residents displaced for periods over 6 months; Brookside / Splash Lane / Mill Road / Globe Lane / Ford End &mdash; 24 residential properties flooded internally to c.550mm with outbuilding and garden flooding, residents displaced for periods over 6 months; High Street / Frumetty Lane / Coulson Close / Rusts Lane area &mdash; 22 residential properties flooded internally to c.750mm with outbuilding and garden flooding, residents displaced for periods over 6 months. [TAB] (p14)</p></div><div class="nugget-popup"><p>Area&ndash;wide surface water flooding during the December 2020 event, including internal flooding of residential properties (notably 22 properties on High Street & Rusts Lane and 2 properties on Hill Field / School Lane). Local highway drainage and pumps (Rusts Lane) were unable to convey runoff, contributing to the overall flooding. [TAB,PAG] (p15)</p></div><div class="nugget-popup"><p>Alconbury experienced flooding during December 2020 as part of the wider catchment event; residents were impacted and required community&ndash;level inspections and resilience activities afterwards. Residents reported being forced to leave their homes for prolonged periods following the flooding. [PAG] (p16)</p></div><div class="nugget-popup"><p>Areas of Alconbury (including High Street and Rusts Lane) experienced flooding during the December 2020 event, leading to local flood&ndash;alleviation actions, community support and planned hydraulic modelling. [PAG] (p21)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>59 properties; 46 residential properties flooded internally; 13 properties with damage to outbuildings/garages/gardens [PAG,IMG] (p10)</p></div><div class="nugget-popup quant"><p>59 properties affected; 46 residential properties flooded internally; 13 properties damaged (outbuildings/garages/gardens). [IMG,PAG] (p11)</p></div><div class="nugget-popup quant"><p>17 residential properties [TAB,PAG] (p12)</p></div><div class="nugget-popup quant"><p>8 residential properties; 24 residential properties; 22 residential properties [TAB] (p14)</p></div><div class="nugget-popup quant"><p>22 residential properties; 2 residential properties; depth c.750mm; depth c.600mm [TAB,PAG] (p15)</p></div></div></body></div>`)[0];

                var html_1bf55063faab9261511366cc244a54c1 = $(`<div id="html_1bf55063faab9261511366cc244a54c1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Alconbury Weston</h1><div class="nugget-popup"><p>Floodwater entered the settlements from surrounding agricultural fields and overland/surface runoff as a result of saturated ground and increased runoff velocity; settlements experienced flooding during the reported event. (p5)</p></div><div class="nugget-popup"><p>Significant flooding affected the settlement of Alconbury on 23 December 2020. [PAG,IMG] (p7)</p></div><div class="nugget-popup"><p>Flooding from river and surface water led to internal flooding of residential properties and damage to outbuildings/garages/gardens. [PAG] (p10)</p></div><div class="nugget-popup"><p>Combined reports from the LLFA and the Alconbury Brook Flood Group indicate widespread localised flooding across the two villages. A total of 95 properties were affected (59 in Alconbury; 36 in Alconbury Weston). Internal residential flooding occurred in multiple locations (46 residential properties internally flooded in Alconbury; 32 residential properties internally flooded in Alconbury Weston). Additional damage was noted to outbuildings, garages and gardens (13 properties in Alconbury; 4 properties in Alconbury Weston). The report groups impacted streets into seven key risk areas (Vinegar Hill, Hamerton Road, North Road, High Street (Alconbury Weston), Brookside, High Street and Rusts Lane, Hill Field and School Lane). [IMG] (p11)</p></div><div class="nugget-popup"><p>Parts of Alconbury Weston (including Hamerton Road, North Road and High Street) experienced internal residential flooding, outbuilding and garden flooding, and prolonged displacement of residents (periods &gt;6 months) due to river&ndash;driven and associated sewer flooding. [TAB] (p13)</p></div><div class="nugget-popup"><p>Residential areas experienced flooding during December 2020; residents were identified as 'impacted by flooding' and visited by the LLFA. Flooding also caused erosion of the brook bank beneath the A1 flyover on High Street requiring discussion of stabilisation works. [PAG] (p16)</p></div><div class="nugget-popup"><p>Alconbury Brook's limited conveyance caused flooding in Alconbury and Alconbury Weston during the December 2020 event. Partners have undertaken and plan further actions (including hydraulic modelling) and the Environment Agency and the local Flood Group are working to improve conveyance; the LLFA is supporting residents and community flood action measures are being delivered in 2021&ndash;22. (p21)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>36 properties; 32 residential properties flooded internally; 4 properties with damage to outbuildings/garages/gardens [PAG] (p10)</p></div><div class="nugget-popup quant"><p>95 properties; 59 properties; 36 properties; 46 residential properties; 32 residential properties; 13 properties; 4 properties [IMG] (p11)</p></div><div class="nugget-popup quant"><p>17 residential properties (Hamerton Road); 7 residential properties (North Road); 8 residential properties (High Street); displacement periods &gt;6 months [TAB] (p13)</p></div></div></body></div>`)[0];
