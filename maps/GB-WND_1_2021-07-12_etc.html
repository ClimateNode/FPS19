                var html_72979ecb96f727742b72bbf65902fb73 = $(`<div id="html_72979ecb96f727742b72bbf65902fb73" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Putney Common</h1><div class="nugget-popup"><p>Flooding on 12th July 2021 was focused around an area near Putney Common. Intense rainfall and surface water entering the drainage/sewer network contributed to localised inundation in the vicinity. [PAG] (p3)</p></div><div class="nugget-popup"><p>Properties in the area near Putney Common experienced internal flooding; seven properties in this area were internally flooded on 12th July 2021. [TAB] (p21)</p></div><div class="nugget-popup"><p>Cluster of internal flooding incidents (internal property flooding) reported within the Putney Common area; incidents concentrated in the northern and central mapped area on the 12th July 2021. [IMG,PAG] (p22)</p></div><div class="nugget-popup"><p>Reported internal and external flood incidents in the Putney Common area on 12th July 2021; streets and properties north of Lower Richmond Road experienced surface&ndash;water / combined&ndash;sewer related flooding as shown on the local drainage map. [PAG,IMG] (p23)</p></div><div class="nugget-popup"><p>Reported flooding incidents were located in the low&ndash;elevation area incorporating Putney Common; limited elevation change in this area encouraged flows to collect and pond during the intense rainfall events. [PAG,MUL] (p24)</p></div><div class="nugget-popup"><p>The area around Putney Common experienced surface&ndash;water flooding that led to internal flooding of adjacent residential properties on nearby streets (Festing Road, Sefton Street, Rotherwood Road, Lower Richmond Road). [PAG,IMG] (p25)</p></div><div class="nugget-popup"><p>Internal (property) flooding incidents are marked clustered in the central and northern part of the mapped area which coincide with areas of ≥75% susceptibility to groundwater emergence, indicating groundwater emergence contributed to internal flooding at Putney Common on the map dated 12th July 2021. [PAG] (p28)</p></div><div class="nugget-popup"><p>The area near Putney Common experienced surface&ndash;water and/or sewer flooding during the 12th July 2021 event, prompting investigations and requests for increased sewer cleansing. [TAB] (p29)</p></div><div class="nugget-popup"><p>Area near Putney Common experienced sewer surcharge on 12th July 2021: residents reported lifted manhole covers, discharge from combined sewers and foul water within property boundaries. (p30)</p></div><div class="nugget-popup"><p>A cluster of flooding incidents occurred in the area near Putney Common during the 12th July 2021 extreme rainfall event; sewer capacity was reported to have been overwhelmed in locations with high concentrations of incidents, contributing to the flooding. (p44)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>7 properties [TAB] (p21)</p></div><div class="nugget-popup quant"><p>7 properties [PAG,IMG] (p25)</p></div><div class="nugget-popup quant"><p>5 reports of flooding (cluster on 12th July 2021) (p44)</p></div></div></body></div>`)[0];

                var html_2643bd584b92781da72d2c061d0e0d29 = $(`<div id="html_2643bd584b92781da72d2c061d0e0d29" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Diamond Estate</h1><div class="nugget-popup"><p>Surface&ndash;water flooding concentrated in the Diamond Estate area during the 25th July 2021 event when intense rainfall and an overwhelmed drainage network caused inundation in the area; prompted investigations and recommendations for drainage dataset updates and increased permeable surfacing to reduce repeated flooding. [PAG] (p3)</p></div><div class="nugget-popup"><p>Intense rainfall on 25th July 2021 caused internal flooding of homes across the Diamond Estate area. Flooding was concentrated on Gambetta Street and Montefiore Street and led to multiple properties being internally flooded. [TAB,PAG] (p32)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties and highway flooding occurred within the estate during the 25 July 2021 event. [TAB,PAG] (p33)</p></div><div class="nugget-popup"><p>Localized internal flooding of residential properties across the Diamond Estate area during the 25 July 2021 intense rainfall. Flooded addresses were concentrated on Gambetta Street and Montefiore Street with additional incidents on Prairie Street and nearby Elsley Road and Eversleigh Road (these two were treated as within the Diamond Estate area for the report). Homes experienced internal inundation; nearby Shaftesbury Gate (on Elsley Road) also experienced sewer surcharge into its carpark, filling it with contaminated water and causing damage to homes and communal areas (Shaftsbury Gate incident was reported after the evidence&ndash;gathering deadline but is described in the report). [IMG,PAG] (p34)</p></div><div class="nugget-popup"><p>The majority of internal flooding in Wandsworth during the 25 July 2021 event occurred in the Diamond Estate area; residential properties experienced internal flooding concentrated on Gambetta Street and Montefiore Street. The incident triggered a Section 19 investigation threshold being exceeded. [IMG,PAG] (p35)</p></div><div class="nugget-popup"><p>Surface water driven along local topography collects and ponds across the Diamond Estate plateau; flows follow Silverthorne Road / Thackeray Road to a local low point and pond on the estate, producing actual surface&ndash;water flooding during the July 2021 rainfall. The eastern edge of the estate (near the Silverthorne Road / Thackeray Road junction) is identified as a high&ndash;risk area and roads across the estate experienced reported flooding during the event. [PAG] (p37)</p></div><div class="nugget-popup"><p>Sewer network capacity was exceeded on 25th July 2021 causing sewer surcharge and ponding. Foul water entered properties in the Diamond Estate area; surface water flows from Wandsworth Road contributed to ponding at the junction of Thackeray Road and Silverthorne Road and flooding along Robertson Street (low point mid&ndash;street). Gullies were unable to drain, exacerbating local flooding. [TAB,PAG] (p41)</p></div><div class="nugget-popup"><p>The sewer network was likely overwhelmed during the 25th July 2021 event, causing sewer surcharge and foul water within properties; surface water flows and local topography caused ponding at low points (notably near the junction of Thackeray Road and Silverthorne Road) and contributed to repeated flooding across the area. [PAG] (p42)</p></div><div class="nugget-popup"><p>Diamond Estate experienced repeated surface&ndash;water/urban flooding; actions recommended include drainage network studies, feasibility studies for flood alleviation schemes, and ongoing resident communication. [MUL] (p45)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>22 properties; 8 properties (Gambetta Street); 7 properties (Montefiore Street); 1 property (Prairie Street) [TAB,PAG] (p32)</p></div><div class="nugget-popup quant"><p>4 properties [TAB,PAG] (p33)</p></div><div class="nugget-popup quant"><p>22 properties [IMG,PAG] (p34)</p></div><div class="nugget-popup quant"><p>22 properties flooded internally; Gambetta Street: 8 properties; Montefiore Street: 7 properties; Prairie Street: 1 property [IMG,PAG] (p35)</p></div></div></body></div>`)[0];

                var html_58829d395f23a8f2f1c20fcc73742855 = $(`<div id="html_58829d395f23a8f2f1c20fcc73742855" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Beverley Brook</h1><div class="nugget-popup"><p>The presence of main rivers/ordinary watercourses (including Beverley Brook) is noted as possibly contributing to the observed internal flooding incidents in the central/northern mapped area; the river may have exacerbated flooding seen on the 12th July 2021 map. (p28)</p></div></div></body></div>`)[0];

                var html_a65d12a7a0df1027dbbb4ce1bf3bc925 = $(`<div id="html_a65d12a7a0df1027dbbb4ce1bf3bc925" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Borough of Wandsworth</h1><div class="nugget-popup"><p>Parts of the Wandsworth administrative area experienced surface water flooding on 12th and 25th July 2021. The distribution of incidents matched the varying rainfall intensity (west&ndash;focused on 12 July; east&ndash;focused on 25 July) and the sewer network was likely overwhelmed in affected locations. [PAG,MUL] (p3)</p></div><div class="nugget-popup"><p>Areas within the borough experienced surface water/urban flooding during the documented events, prompting borough&ndash;level investigation and policy actions such as exploring increased permeable surfacing and SuDS to attenuate surface water runoff. [PAG,MUL] (p5)</p></div><div class="nugget-popup"><p>Localised surface water and urban flooding across parts of the borough associated with intense rainfall; the report contains sections describing affected locations, local drainage network failures and flood mechanisms for events on the dates below. [PAG,MUL] (p7)</p></div><div class="nugget-popup"><p>Two intense rainfall events (12 July 2021 and 25 July 2021) produced surface&ndash;water/urban flooding across Wandsworth, causing internal and highway flooding reports across the area. [PAG,MUL] (p10)</p></div><div class="nugget-popup"><p>The borough experienced flooding during intense rainfall events, prompting data collection, mapping, site visits and an investigation by RMAs and the council. [TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Intense July 2021 rainfall caused flooding in the borough; the area of Wandsworth was affected by flooding on 12 July 2021 and 25 July 2021. [PAG,MUL] (p13)</p></div><div class="nugget-popup"><p>Wandsworth experienced intense convective rainfall that produced clustered reported flooding incidents across the borough. The 12 July 2021 event (and a further event on 25 July 2021) produced high local rainfall return periods in parts of west Wandsworth and led to surface water / urban flooding across the borough as shown by the incident clusters on the report map. [IMG,PAG,MUL] (p14)</p></div><div class="nugget-popup"><p>Intense summer rainfall on 12th July 2021 and 25th July 2021 caused surface&ndash;water / urban flooding across the borough; the west of the borough experienced the most intense rainfall and associated flooding. [PAG,MUL] (p15)</p></div><div class="nugget-popup"><p>The borough experienced highly localised intense hourly rainfall on 12 July 2021 (sharp spike recorded at Putney Village) and a larger&ndash;area heavy rainfall event on 25 July 2021. These events produced conditions associated with urban surface&ndash;water and flash flooding in parts of Wandsworth, with the 12 July event concentrated in the west of the borough and the 25 July event concentrated to the north&ndash;east. [PAG,MUL] (p16)</p></div><div class="nugget-popup"><p>The borough received reports of flooding following intense hourly rainfall. Reports were classified as internal (property) flooding and highway flooding across the borough. [PAG,IMG,MUL] (p17)</p></div><div class="nugget-popup"><p>The borough recorded 15 reports of flooding during the two heavy rainfall events: 5 reports on 12 July 2021 and 10 reports on 25 July 2021. Of these, 12 incidents were internal flooding affecting 33 properties (5 internal incidents occurred on 12 July; 7 internal incidents occurred on 25 July). Flooding was spatially concentrated (12 July incidents in the W01 Putney catchment; most 25 July incidents in the W07 Clapham Common catchment). [PAG,MUL] (p18)</p></div><div class="nugget-popup"><p>Across the borough there were 15 reports of flooding associated with the two intense rainfall events (five reports on 12 July 2021 and ten reports on 25 July 2021). Of these, 12 reported incidents were internal flooding affecting buildings and basements, covering a total of 33 properties. Flooding reports included highway flooding as well as internal flooding, with spatial clustering in the north&ndash;east of the borough and a smaller cluster in the west. [PAG,MUL] (p19)</p></div><div class="nugget-popup"><p>The borough experienced intense rainfall events on 12 July 2021 and 25 July 2021 that produced multiple flooding incidents across the area, resulting in internal flooding to residential properties and highway flooding reports. [PAG,MUL] (p20)</p></div><div class="nugget-popup"><p>Five reported flooding incidents in the borough resulting in internal flooding to properties in the west of the borough; incidents concentrated near Putney Common (seven properties) and on Cambalt Road (three properties). [PAG] (p21)</p></div><div class="nugget-popup"><p>Multiple internal flooding incidents occurred within the London Borough of Wandsworth (Putney Common area and Cambalt Road) on 12 July 2021, triggering a Section 19 investigation by the local authority. [IMG,PAG] (p22)</p></div><div class="nugget-popup"><p>The west of the borough experienced intense rainfall and surface&ndash;water flooding; recorded incidents on 12th July included internal flooding concentrated in the west (notably near Putney Common) and further flooding was associated with the July events. [PAG,IMG,MUL] (p25)</p></div><div class="nugget-popup"><p>Intense rainfall on 12 July 2021 caused surface&ndash;water/urban flooding in the west of the borough, producing internal flooding at multiple addresses near Putney Common and on Cambalt Road; incidents triggered the council investigation. [PAG,IMG] (p26)</p></div><div class="nugget-popup"><p>Multiple internal flooding incidents were reported within the borough on 12 July 2021 (notably clustered in the Putney Common/Cambalt Road part of the borough). Intense rainfall led to surface water ponding and overland flow, with sewer surcharging and areas of high groundwater susceptibility contributing to internal flooding. [IMG,PAG] (p28)</p></div><div class="nugget-popup"><p>Parts of the London Borough of Wandsworth (including areas such as Cambalt Road, Gwendolen Avenue, Commondale and near Putney Common) were affected by combined&ndash;sewer surcharge and surface&ndash;water flooding during the 12th July 2021 event. [TAB,PAG] (p29)</p></div><div class="nugget-popup"><p>Areas of the borough (near Putney Common, Sefton Street, Cambalt Road and surrounding streets) experienced sewer surcharge and surface&ndash;water ponding during the storm, with lifted manhole covers, combined sewage discharge and foul water entering property boundaries and surface&ndash;water ponding flowing into enclosed lower areas and properties. [TAB,PAG] (p30)</p></div><div class="nugget-popup"><p>The borough experienced intense rainfall and widespread surface&ndash;water/urban flooding on 25 July 2021, with the heaviest rainfall focused in the north&ndash;east of the borough and multiple internal property flood reports recorded. [PAG] (p31)</p></div><div class="nugget-popup"><p>Intense rainfall on 25th July 2021 produced widespread surface water/urban flooding in the north&ndash;east of the borough, producing rainfall with return periods between 1 in 2 and 1 in 30 years and generating multiple internal property flood incidents. [PAG] (p32)</p></div><div class="nugget-popup"><p>Flooding affected parts of the borough on 25 July 2021, including internal flooding of residential properties and highway flooding within the Diamond Estate area. [PAG] (p33)</p></div><div class="nugget-popup"><p>On 25 July 2021 intense rainfall produced widespread flooding in parts of the borough. Wandsworth Council received ten reports related to that event, with 23 properties flooded internally across the borough (the majority in the Diamond Estate area). One isolated internal flooding report occurred on Fairfield Drive. The report also notes sewer surcharge affecting the Shaftesbury Gate development (Elsley Road) where the carpark filled with contaminated water, damaging homes and communal areas (this particular incident was reported after the evidence deadline). [PAG] (p34)</p></div><div class="nugget-popup"><p>On 25 July 2021 intense rainfall caused internal flooding across the borough, principally concentrated in the Diamond Estate area. Wandsworth Council received 10 reports of flooding related to the event resulting in 23 properties flooded internally (22 within the Diamond Estate area and 1 on Fairfield Drive). Shaftesbury Gate (Elsley Road) experienced sewer surcharge into the carpark with contaminated water that damaged homes and communal areas. [IMG,PAG] (p35)</p></div><div class="nugget-popup"><p>Reported surface water and internal flooding across parts of the borough during the 25th July 2021 rainfall event: ponding on the plateau around the Diamond Estate area, surface water flowing down local flow paths (e.g. Silverthorne Road / Thackeray Road) to local low points, and at least one internal flooding incident on Fairfield Drive. [PAG,IMG] (p36)</p></div><div class="nugget-popup"><p>On 25th July 2021 surface water travelled downhill along Silverthorne Road toward its junction with Thackeray Road, collecting at the local low point and producing reported flooding incidents and ponding of water that inundated the road and affected nearby properties in the Diamond Estate area. [PAG] (p37)</p></div><div class="nugget-popup"><p>The Diamond Estate area of the borough experienced surface&ndash;water/urban flooding during the intense rainfall (map of incidents dated 25th July 2021). Local combined sewers in the Diamond Estate (notably the 1140mm sewer on Queenstown Road and the 300mm sewer in Robertson Street) are reported as likely to have been surcharged by the event and to have contributed to local flooding of roads and properties in the central/eastern part of the borough. [PAG,IMG] (p39)</p></div><div class="nugget-popup"><p>Within the borough (notably the Diamond Estate / Robertson Street area) the sewer network was likely overwhelmed on 25th July 2021, resulting in foul water entering properties, ponding on roads (e.g. Robertson Street) and reports of sewer surcharge. The council received reports and carried out post&ndash;incident actions and debriefs. [PAG] (p41)</p></div><div class="nugget-popup"><p>Extreme rainfall on 12th and 25th July 2021 produced clusters and isolated flood incidents across the borough. Sewer capacity was overwhelmed in certain locations, which combined with surface water runoff (exacerbated by topography) to increase the extent of flooding across multiple areas investigated. [PAG,MUL] (p44)</p></div><div class="nugget-popup"><p>Multiple locations across the borough (including Putney Common, Cambalt Road, Diamond Estate, Gideon Road, Fairfield Drive, Tonsley Road and Shaftsbury Gate) experienced repeated surface water / urban flooding that led to recurrent flooding of streets and properties and prompted drainage dataset updates and mitigation investigations. [PAG,MUL] (p45)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>15 incidents; 14 internal flooding incidents; 1 highway flooding [PAG,MUL] (p3)</p></div><div class="nugget-popup quant"><p>15 reports; 5 reports on 12th July 2021; 10 reports on 25th July 2021; 12 reports of internal flooding; 2 reports of internal and highway flooding; 1 report of highway&ndash;only flooding; 33 properties affected; 15 roads affected [PAG,MUL] (p10)</p></div><div class="nugget-popup quant"><p>15 reports of flooding; five on 12th July 2021; ten on 25th July 2021 [PAG,IMG,MUL] (p17)</p></div><div class="nugget-popup quant"><p>15 reports; 12 internal incidents; 33 properties; 5 reports on 12 July 2021; 10 reports on 25 July 2021; 5 internal on 12 July; 7 internal on 25 July [PAG,MUL] (p18)</p></div><div class="nugget-popup quant"><p>15 reports of flooding; 5 reports on 12 July 2021; 10 reports on 25 July 2021; 12 internal flooding incidents; 33 properties; 5 internal incidents on 12 July 2021; 7 internal incidents on 25 July 2021 [PAG,MUL] (p19)</p></div><div class="nugget-popup quant"><p>15 reports of flooding (five on 12 July 2021; ten on 25 July 2021); 12 reported internal flooding incidents covering 33 properties (five internal reports on 12 July; seven internal reports on 25 July) [PAG,MUL] (p20)</p></div><div class="nugget-popup quant"><p>five reports; ten properties; seven properties; three properties [PAG] (p21)</p></div><div class="nugget-popup quant"><p>10 properties [PAG,IMG,MUL] (p25)</p></div><div class="nugget-popup quant"><p>10 properties; 5 reports; Festing Road: 4 properties; Sefton Street: 1 property; Rotherwood Road: 1 property; Lower Richmond Road: 1 property; Cambalt Road: 3 properties [PAG,IMG] (p26)</p></div><div class="nugget-popup quant"><p>ten reports of flooding; 23 properties flooded internally [PAG] (p31)</p></div><div class="nugget-popup quant"><p>23 properties [PAG] (p32)</p></div><div class="nugget-popup quant"><p>4 properties across Diamond Estate (Robertson Street, Tennyson Street, Thackeray Road) [PAG] (p33)</p></div><div class="nugget-popup quant"><p>10 reports; 23 properties [PAG] (p34)</p></div><div class="nugget-popup quant"><p>10 reports; 23 properties flooded internally; 22 properties in the Diamond Estate area; Gambetta Street: 8 properties; Montefiore Street: 7 properties; Prairie Street: 1 property; Elsley Road: 1 property; Eversleigh Road: 1 property; Fairfield Drive: 1 property [IMG,PAG] (p35)</p></div><div class="nugget-popup quant"><p>a single internal flooding incident on Fairfield Drive [PAG,IMG] (p36)</p></div><div class="nugget-popup quant"><p>15 reports of flooding; five reports on 12th July 2021; ten reports on 25th July 2021 [PAG,MUL] (p44)</p></div></div></body></div>`)[0];

                var html_1e4f7b1c1db3c491d353996da1cfe383 = $(`<div id="html_1e4f7b1c1db3c491d353996da1cfe383" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Region</h1><div class="nugget-popup"><p>Central and west London experienced extreme convective rainfall on 12 July 2021 (and further rainfall on 25 July 2021) that produced high rainfall return periods and caused widespread surface water / urban flooding across multiple boroughs, with reported incident clusters concentrated in the higher return&ndash;period areas. [IMG,PAG,MUL] (p14)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration rainfall on 12 July 2021 and 25 July 2021 caused surface&ndash;water/urban flooding across London boroughs (including Wandsworth), producing localized flooding during both events. [PAG,IMG,MUL] (p15)</p></div><div class="nugget-popup"><p>The two convective storm events (12 July 2021 and 25 July 2021) produced intense, short&ndash;duration rainfall across London that led to clustered reports of surface&ndash;water/urban flooding in central and southwest boroughs. The map and gauge data show these storms coincided with numerous reported flooding incidents across parts of Greater London. [PAG,IMG,MUL] (p17)</p></div><div class="nugget-popup"><p>Large parts of London were affected by intense rainfall on 12th July 2021, resulting in widespread flooding. [PAG] (p21)</p></div><div class="nugget-popup"><p>Large parts of London experienced intense rainfall on 12th July 2021 and 25th July 2021 that produced widespread surface&ndash;water/urban flooding across multiple boroughs (Met Office yellow warnings; numerous borough&ndash;scale impacts reported). [PAG,IMG,MUL] (p25)</p></div><div class="nugget-popup"><p>Widespread intense rainfall events on 12 July 2021 (and a further event on 25 July 2021) caused surface water flooding across multiple boroughs, including areas of Wandsworth where internal property flooding occurred. [PAG,IMG,MUL] (p26)</p></div><div class="nugget-popup"><p>Flooding in London prompted major&ndash;incident coordination and led to widespread demand on utilities and council contact centres. [TAB,PAG,MUL] (p30)</p></div><div class="nugget-popup"><p>On 25 July 2021 London experienced intense, widespread rainfall that resulted in flooding across parts of the city; the event affected multiple boroughs including Wandsworth where internal property flooding was reported. [PAG,IMG] (p35)</p></div></div></body></div>`)[0];

                var html_2ed8bdda2fe1eadf50cb0b737776746f = $(`<div id="html_2ed8bdda2fe1eadf50cb0b737776746f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cambalt Road, Putney</h1><div class="nugget-popup"><p>Cambalt Road experienced focused flooding on 12th July 2021 associated with intense rainfall and an overwhelmed surface water/sewer network. The report recommends updates to drainage data and opportunities to increase permeable surfacing to reduce future risk. [PAG] (p3)</p></div><div class="nugget-popup"><p>Three properties on Cambalt Road experienced internal flooding on 12th July 2021. [TAB] (p21)</p></div><div class="nugget-popup"><p>Reported internal flooding of properties on Cambalt Road on 12 July 2021 (incidents are mapped in Figure 4&ndash;1 and Figure 4&ndash;3). [IMG,PAG] (p22)</p></div><div class="nugget-popup"><p>Clusters of internal and external flooding incidents were reported along Cambalt Road during the event on 12th July 2021, indicating local surface&ndash;water and combined&ndash;sewer flood impacts to the road and adjacent properties. [PAG,IMG] (p23)</p></div><div class="nugget-popup"><p>Ponding occurred on Cambalt Road caused by surface water flowing toward the west end and high existing sewer water levels; the road is slightly raised above adjacent properties so flow from the road into properties could have resulted in internal flooding. [PAG,MUL] (p24)</p></div><div class="nugget-popup"><p>Internal flooding of properties on Cambalt Road during the 12 July 2021 intense rainfall event. [PAG,IMG] (p26)</p></div><div class="nugget-popup"><p>An overwhelmed combined sewer network plus topographical flows caused ponding along Cambalt Road. Surface water could not enter the surcharged drainage, flowed into the lower enclosed area accessed by ramps on the northern side of the road, ponded there and entered properties. (p30)</p></div><div class="nugget-popup"><p>Cambalt Road experienced flooding (noted as having been affected on 12th July), likely caused by a lack of capacity in the drainage/sewer network combined with topography. (p42)</p></div><div class="nugget-popup"><p>Cambalt Road was an isolated location that experienced flooding during the 12th July 2021 event. The investigation recommends updating drainage datasets and increasing permeable surfacing and SuDS uphill of the area to alleviate flood risk to nearby properties. [PAG] (p44)</p></div><div class="nugget-popup"><p>Surface water flooding affected properties to the north of Cambalt Road; prompted investigation of permeable surfacing and SuDS to alleviate flood risk. [MUL] (p45)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 properties [TAB] (p21)</p></div><div class="nugget-popup quant"><p>3 properties [PAG,IMG] (p26)</p></div></div></body></div>`)[0];
