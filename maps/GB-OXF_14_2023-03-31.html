                var html_8bd456d416ba7c57397d23d2dd1ed549 = $(`<div id="html_8bd456d416ba7c57397d23d2dd1ed549" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Sunningwell Road, Sunningwell</h1><div class="nugget-popup"><p>Overland flow from surrounding hills and an overwhelmed watercourse sent water through gardens, garages and properties; properties on Sunningwell Road were affected. Surface water during the event also overloaded foul sewers (reports of foul flooding). Silted channels and restricted culverts increased pressure on the watercourse through properties on Sunningwell Road. [TAB,MUL] (p2)</p></div><div class="nugget-popup"><p>Flow along the watercourse through/adjacent to Sunningwell Road placed pressure on properties; measures such as a bypass/overflow channel and increased pond capacity are proposed to reduce that flood pressure. (p3)</p></div><div class="nugget-popup"><p>Location at the Penn Lane / Sunningwell Road junction near which a property experienced sewer backflow. (p4)</p></div><div class="nugget-popup"><p>Floodwater flowed along Sunningwell Road where it enters the village from the north; in parts flow reached knee depth. Pond overflow and overland flow caused water to run along the road and back through properties' gardens and garages. (p11)</p></div><div class="nugget-popup"><p>A 600mm diameter culvert carrying the watercourse under Sunningwell Road was reported as being blocked during the event; this reported blockage prompted inspection. The inspection found no capacity concerns with the culvert, but the reported blockage indicates it contributed to local flow restriction during the flood. (p16)</p></div><div class="nugget-popup"><p>Flow from the watercourse passed under Sunningwell Road through culverts, contributed to overland flows into properties and gardens, and the nearby foul sewer network overloaded causing internal flooding in the area. A downstream 900mm culvert running from the village pond into rear gardens was heavily silted, reducing hydraulic capacity and contributing to local flooding and flow restrictions. [PAG] (p18)</p></div><div class="nugget-popup"><p>Area around the Penn Lane / Sunningwell Road junction experienced foul (sewer) flooding when surface water entered the foul sewer network during the 31 Mar&ndash;1 Apr 2023 event, contributing to capacity failure and property flooding in the vicinity. [PAG] (p19)</p></div><div class="nugget-popup"><p>Surface water flow was connecting under the main road via a 375mm culvert from a field ditch to the east, contributing to local flood risk; proposals include increasing storage in the field ditch and modelling the drainage to reduce flows under the road. [PAG] (p27)</p></div><div class="nugget-popup"><p>Muddy, swollen watercourse running through the back garden with visibly high water levels reaching the garden steps; evidence of recent flooding that poses flood risk to the property and garden area. [IMG] (p41)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property (p4)</p></div></div></body></div>`)[0];

                var html_c91616804c7d55869c03bf972720ad00 = $(`<div id="html_c91616804c7d55869c03bf972720ad00" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Pen Lane, Sunningwell</h1><div class="nugget-popup"><p>Backflow from the foul sewer into a property close to the Penn Lane / Sunningwell Road junction; Thames Water to reinstall a non&ndash;return valve to prevent further backflow. [TAB] (p2)</p></div><div class="nugget-popup"><p>Location near the Penn Lane / Sunningwell Road junction where a property experienced backflow from the sewer system. (p4)</p></div><div class="nugget-popup"><p>Foul sewer backed up at the Sunningwell Road / Penn Lane (sic) junction causing flooding of a nearby garden and an adjacent property due to hydraulic overload of the foul sewer. (p11)</p></div><div class="nugget-popup"><p>The foul sewer network overloaded during the rainfall event causing flooding within the village, particularly affecting the Penn Lane / Sunningwell Road area. A non&ndash;return valve intended to protect a property close to the Penn Lane / Sunningwell Road junction was installed in the wrong chamber and did not provide the intended protection. [PAG] (p18)</p></div><div class="nugget-popup"><p>Foul sewers overloaded during the 31 Mar&ndash;1 Apr 2023 rainfall, causing foul (sewer) flooding in the Penn Lane / Sunningwell Road area. A non&ndash;return valve intended to protect a property close to the Penn Lane / Sunningwell Road junction was installed in the wrong chamber and will not provide the intended protection unless repositioned. [PAG] (p19)</p></div><div class="nugget-popup"><p>A property close to the Penn Lane / Sunningwell Road junction experienced backflow; a non&ndash;return valve is to be reinstalled to prevent further ingress of sewage/foul water into the property. (p27)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property [TAB] (p2)</p></div><div class="nugget-popup quant"><p>1 property (p4)</p></div><div class="nugget-popup quant"><p>1 garden; 1 property (p11)</p></div></div></body></div>`)[0];

                var html_2127d2c59aa63938bdb58b12d7c8a1f0 = $(`<div id="html_2127d2c59aa63938bdb58b12d7c8a1f0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bullsmead, Sunningwell</h1><div class="nugget-popup"><p>Bullsmead was affected by floodwater from the pond overflow and overland flow; foul drains in Bullsmead were overwhelmed, causing foul&ndash;water contamination of the floodwater and problems with ground&ndash;floor appliances in homes. (p11)</p></div><div class="nugget-popup"><p>The foul sewer network was overloaded during the event, causing flooding in the Bullsmead area of the village. (p18)</p></div></div></body></div>`)[0];

                var html_f3358f1afb2a8422422be8386fb44b20 = $(`<div id="html_f3358f1afb2a8422422be8386fb44b20" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Oxfordshire</h1><div class="nugget-popup"><p>Highway drainage was overwhelmed and grips/gullies were full of silt; highway flooding was reported (including a later highway&ndash;only event on 13 October 2023). The highway authority carried out cleansing and desilted drainage assets (including the main twin 600mm diameter sewers linking to the village green) to restore capacity. [TAB,MUL] (p2)</p></div><div class="nugget-popup"><p>Oxfordshire Highways arranged inspection and clearance of silt from culverts under Sunningwell Road following the flood; works were targeted at culverts that contributed to restricted flow. (p18)</p></div></div></body></div>`)[0];

                var html_0fe07329866dcd962227e96a2c295523 = $(`<div id="html_0fe07329866dcd962227e96a2c295523" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Sunningwell</h1><div class="nugget-popup"><p>Exceptionally heavy rainfall on 31 March&ndash;1 April 2023 caused overland flow from surrounding hills that overwhelmed the watercourse through the village. Water passed through gardens, garages and properties toward the watercourse. Surface&ndash;water runoff also overloaded foul sewers leading to reports of foul flooding in properties. The event extent was reported worse than July 2007. Highway&ndash;only flooding was also reported on 13 October 2023. [TAB,MUL] (p2)</p></div><div class="nugget-popup"><p>Environment Agency surface&ndash;water flood maps show much of the village is at high risk (>3.3% annual chance). A small watercourse runs through the village centre (culverted under some property accesses); two main carrier drains convey flows through the centre to a small pond on land owned by the Parish Council. Springs where Lower Greensand sandstone meets clay feed these watercourses, channelling runoff towards the Bayworth / Sunningwell area. [IMG,PAG] (p8)</p></div><div class="nugget-popup"><p>The village experienced river and overland flooding when the brook burst its banks and the village pond overflowed on 31 March&ndash;1 April 2023. Floodwater flowed along Sunningwell Road, through gardens and garages, and surrounded several properties. Foul drains were overwhelmed in parts of the village, causing foul&ndash;water contamination of floodwater and hydraulic overload of sewers in some locations. (p11)</p></div><div class="nugget-popup"><p>Overland flow paths and ordinary watercourses converge toward the village and the village pond catchment, directing runoff into low&ndash;lying parts of Sunningwell and increasing local surface water flood risk. The existing watercourse through the village was surveyed as part of the investigation. [IMG] (p14)</p></div><div class="nugget-popup"><p>The catchment draining to Sunningwell Brook received the event rainfall used in the hydrology modelling. This produced an estimated total rainfall volume of 65,243 m3 across the catchment and a modeled peak flow in the watercourse of around 0.83 m3/s during the 31 Mar 2023&ndash;01 Apr 2023 event. [IMG,PAG] (p15)</p></div><div class="nugget-popup"><p>Sunningwell experienced multiple flood mechanisms during 31 Mar 2023 &ndash; 01 Apr 2023. Open channel reaches and culverts through the village were heavily silted, reducing conveyance capacity and contributing to overbanking and garden/property flooding. Oxfordshire Highways inspected and cleared silt from culverts under Sunningwell Road. A 900mm diameter culvert running to the rear gardens of Sunningwell Road was approximately 50% silted, reducing its capacity and restricting flow. Significant overland flow from the surrounding hillside passed through and around several properties, increasing peak flows. Overloaded foul sewers in the village (Thames Water's network) caused internal flooding, notably in the Penn Lane / Sunningwell Road and Bullsmead areas. Thames Water are investigating and identified a non&ndash;return valve near the Penn Lane / Sunningwell Road junction that was installed in the wrong chamber and does not provide intended protection. [PAG] (p18)</p></div><div class="nugget-popup"><p>On 31 Mar&ndash;1 Apr 2023 exceptionally heavy rainfall and saturated soils produced significant overland flow from surrounding hillsides, which overwhelmed the watercourse through the centre of the village and caused water to pass through gardens, garages and properties. The event also overloaded foul sewers, producing reports of foul (sewer) flooding. Local gullies and grips were observed filled with silt and some culverted sections of the watercourse were restricting flow, exacerbating flood impacts. [PAG] (p19)</p></div><div class="nugget-popup"><p>The village experienced surface water flooding during the event, prompting a Section 19 investigation and recommendations for property&ndash;level protection, highway drainage assessment and community flood planning. (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>12 properties affected by internal flooding; 6 properties with ground&ndash;floor internal flooding; 2 cellars flooded; 5 properties with internal garage flooding; up to 30cm water depth in some properties (p11)</p></div></div></body></div>`)[0];
