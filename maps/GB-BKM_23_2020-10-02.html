                var html_0a6304ee32256f38ee518f4f530e0965 = $(`<div id="html_0a6304ee32256f38ee518f4f530e0965" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Church Road, Ickford</h1><div class="nugget-popup"><p>Flooding affected roads at the Church Road / Worminghall Road / Sheldon Road junction; Thames Water operated a tanker pumping from the foul sewer at this junction. (p6)</p></div><div class="nugget-popup"><p>Sheldon Road experienced surface water flooding with flood water and sewage emerging from a manhole outside the school (photograph dated October 2020). Church Road is shown/reported with drainage/ditch capacity exceeded (photograph dated January 2021) and is identified in the report as a location at risk and affected by drainage exceedance. [PAG] (p23)</p></div><div class="nugget-popup"><p>Church Road has been directly affected by flooding: Winter 2001 the backed&ndash;up ditch (linked to high River Thame levels) flooded properties on Church Road; during 02&ndash;04 Oct 2020 the channel/drainage at Church Road exceeded capacity and overtopped onto the road; in January 2021 the drainage ditch overtopped onto Church Road and surface water flowed from the Worminghall Road junction. [PAG,TAB,MUL] (p24)</p></div><div class="nugget-popup"><p>Drainage ditch at Church Road overtopped onto the road; surface water flowed down from the Worminghall Road junction due to exceedance of channel capacity. (p25)</p></div><div class="nugget-popup"><p>Capacity of the Church Road roadside ditch was exceeded leading to overland flow; sewage and flood water emerged from a manhole on Sheldon Road outside the school (photographed October 2020). CCTV and investigations were carried out in the sewer network nearby. [PAG] (p30)</p></div><div class="nugget-popup"><p>A foul&ndash;sewer monitor at the far west end of Church Road recorded high levels; inspections and further CCTV work were carried out in the network linked to Church Road as part of the sewer&ndash;flooding investigation. (p31)</p></div><div class="nugget-popup"><p>Thames Water deployed a tanker to pump water from the foul sewer at the Church Road/Worminghall Road/Sheldon Road junction; groundwater entered at least one nearby property (sandbags were supplied) and internal flooding later receded. [TAB] (p35)</p></div><div class="nugget-popup"><p>Surface water flowed along Church Road and along Sheldon Road; the highway drainage was overwhelmed in these locations, leading to flooding, ponding and instances of drainage surcharge from gullies and manholes. (p39)</p></div><div class="nugget-popup"><p>Sewage was observed bubbling out of manholes at Church Road and combining with surface water; Thames Water stationed a tanker at the Church Road junction to remove water from the foul system for an extended period during the October 2020 event. A resident reported a private manhole lifting during heavy rain, indicating flooding ingress to private pipework. (p41)</p></div><div class="nugget-popup"><p>A private manhole at the Church Road junction was observed lifted during heavy rain, allowing surface water and/or sewage to enter and escape the foul network; a tanker operated at the Church Road junction to remove foul sewage for an extended period, disrupting the immediate area. [PAG] (p42)</p></div><div class="nugget-popup"><p>Church Road was flooded; the Thames Water pumping station on Church Road was overwhelmed and the foul sewer system surcharged and spilled onto Church Road (and Sheldon Road). At least one property on Church Road was unable to flush downstairs toilets during the event. (p43)</p></div><div class="nugget-popup"><p>The foul sewer in Ickford became overloaded and surcharged during the 02 Oct 2020 &ndash; 04 Oct 2020 flood. A sewer level monitor had been installed at Church Road (the far west end) but was not working during the event. Subsequent CCTV (Spring 2022) found surface water inundation, groundwater infiltration and surface water misconnections entering the foul sewer, all contributing to the surcharging of the foul system. (p46)</p></div><div class="nugget-popup"><p>Foul sewer is likely to surcharge on Sheldon Road and Church Road, causing sewer flooding and reducing the effectiveness of surface&ndash;water drainage measures; highway runoff can also overwhelm gullies, increasing local road flooding (explicitly cited for Church Road). (p48)</p></div><div class="nugget-popup"><p>Channel capacity was exceeded and river water overtopped onto Church Road; floodwaters flowed from the Worminghall Road / Ickford Road junction toward Church Road. The foul and surface water sewer systems along Church Road were overwhelmed during the event. (p55)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property [TAB] (p35)</p></div><div class="nugget-popup quant"><p>1 property (p43)</p></div></div></body></div>`)[0];

                var html_ff3804d8c27d422cc8493496611d212e = $(`<div id="html_ff3804d8c27d422cc8493496611d212e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Worminghall Road, Ickford</h1><div class="nugget-popup"><p>Flooding affected roads at the Church Road / Worminghall Road / Sheldon Road junction; this location was the focus of sewer pumping operations during the event. (p6)</p></div><div class="nugget-popup"><p>Flooding occurred on Worminghall Road during the October 2020 event (photographs and map annotations show inundation and specific flooding at the junction with Ickford Road), blocking or disrupting the road and contributing to potential isolation of the village. [PAG] (p22)</p></div><div class="nugget-popup"><p>Surface water flooding observed on Worminghall Road during the October 2020 event. Photographs in the report (October 2020) show standing/tidal surface water on Worminghall Road (including views north towards the Rising Sun) and flooding at the junction with Ickford Road. [PAG] (p23)</p></div><div class="nugget-popup"><p>Surface water flooding made the junction of Worminghall Road and Ickford Road impassable to regular vehicles. Sheldon Road experienced surface water together with foul/sewer flooding (sewage emerging from manholes) during the October 2020 heavy rainfall event. [PAG,TAB] (p24)</p></div><div class="nugget-popup"><p>Road inundation from fluvial overflow and surface water; recorded flooding along Worminghall Road and Golders Close. (p25)</p></div><div class="nugget-popup"><p>Worminghall Road was inundated during the October 2020 event (photographs show flooding looking north toward local landmarks and flooding at the Worminghall Road / Ickford Road junction). Thames Water recorded high sewer levels in the network at Worminghall Road, installed monitoring there as part of an investigation, and later upgraded manhole covers after the October 2020 incident. [PAG] (p30)</p></div><div class="nugget-popup"><p>A foul&ndash;sewer monitor was installed at Worminghall Road and recorded high sewage levels as part of Thames Water's investigation, indicating sewer flooding/overload in the local network and prompting further inspections. (p31)</p></div><div class="nugget-popup"><p>Thames Water operated a tanker at the Church Road/Worminghall Road/Sheldon Road junction to remove water from the foul sewer; groundwater entered at least one nearby property (sandbags were provided) and internal floodwater later receded. [TAB] (p35)</p></div><div class="nugget-popup"><p>Worminghall Road was flooded by surface water during the October 2020 event, including flooding around the junction with Ickford Road that rendered the junction impassable for regular vehicles. [PAG,IMG] (p36)</p></div><div class="nugget-popup"><p>High groundwater in the floodplain caused groundwater ponding in nearby fields (to the west of Worminghall Road). There is an unconfirmed report that groundwater came up through the floor of a property on Worminghall Road. (p37)</p></div><div class="nugget-popup"><p>Surface water flowed down and ponded along Worminghall Road; the lower part flooded (reported to flood before river water reached the northern junction). Highway drainage was overwhelmed and gullies surcharged, producing road flooding and hazardous conditions. [PAG] (p39)</p></div><div class="nugget-popup"><p>Surface water flowed down and ponded along Worminghall Road; the highway drainage system was overwhelmed and water ponded above kerb level. Surface water backed up through the drainage network and surcharged from gullies and manholes, with sewage observed combining with surface water in nearby locations. Fluvial floodwater also reached the junction at the northern end of the road during the event. [PAG] (p40)</p></div><div class="nugget-popup"><p>Sheldon Road was flooded; foul sewer system surcharged and spilled onto Sheldon Road (combined sewer/sewer impacts reported). (p43)</p></div><div class="nugget-popup"><p>The foul sewer in Ickford became overloaded and surcharged during the 02 Oct 2020 &ndash; 04 Oct 2020 flood. A sewer level monitor had been installed at Worminghall Road but was not working during the event. Subsequent CCTV (Spring 2022) found surface water inundation, groundwater infiltration and surface water misconnections entering the foul sewer, all contributing to the surcharging of the foul system. (p46)</p></div><div class="nugget-popup"><p>River water can reach and inundate Worminghall Road in larger flood events, overwhelming small&ndash;scale SuDS (e.g. raingardens) and causing highway flooding. (p48)</p></div><div class="nugget-popup"><p>Surface water flowed down Worminghall Road and ponded; the lower part reportedly flooded from surface water before river floodwater reached the junction. Floodwaters from surrounding brooks inundated the Worminghall Road and Ickford Road junction and then flowed south along Worminghall Road toward Church Road. Foul and surface water sewers were overwhelmed in the area with sewage observed bubbling. (p55)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property [TAB] (p35)</p></div><div class="nugget-popup quant"><p>20 cm deep [PAG] (p39)</p></div><div class="nugget-popup quant"><p>20cm deep [PAG] (p40)</p></div><div class="nugget-popup quant"><p>1 property flooded internally (p55)</p></div></div></body></div>`)[0];
                popup_be974b182205e2349f71f2176639606d.setContent(html_ff3804d8c27d422cc8493496611d212e);

                var html_f51796a3676c0e9ad1f2b12396b1a64f = $(`<div id="html_f51796a3676c0e9ad1f2b12396b1a64f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Sheldon Road, Ickford</h1><div class="nugget-popup"><p>Flooding affected roads at the Church Road / Worminghall Road / Sheldon Road junction; Thames Water conducted extended tanker pumping from the foul sewer at this junction. (p6)</p></div><div class="nugget-popup"><p>Floodwater and sewage emerged from a manhole on Sheldon Road, causing contaminated surface flooding on the road (photo dated October 2020). [PAG,IMG] (p17)</p></div><div class="nugget-popup"><p>Flood water and sewage were observed emerging from a manhole on Sheldon Road outside the school (photograph taken during October 2020), indicating combined sewer/sewer surcharge and surface water flooding at this location. [PAG,IMG] (p20)</p></div><div class="nugget-popup"><p>Floodwater and sewage emerged from a manhole outside the school (photo taken October 2020), indicating combined sewer overflow and surface&ndash;water inundation on Sheldon Road that would affect the highway and immediate surroundings. [PAG] (p22)</p></div><div class="nugget-popup"><p>Sheldon Road experienced surface water flooding with flood water and sewage emerging from a manhole outside the school (photograph dated October 2020). Church Road is shown/reported with drainage/ditch capacity exceeded (photograph dated January 2021) and is identified in the report as a location at risk and affected by drainage exceedance. [PAG] (p23)</p></div><div class="nugget-popup"><p>Surface water flooding made the junction of Worminghall Road and Ickford Road impassable to regular vehicles. Sheldon Road experienced surface water together with foul/sewer flooding (sewage emerging from manholes) during the October 2020 heavy rainfall event. [PAG,TAB] (p24)</p></div><div class="nugget-popup"><p>Flooding along Worminghall Road and Sheldon Road; surface water (and foul) flooding on Sheldon Road with water in places exceeding the kerb height. (p25)</p></div><div class="nugget-popup"><p>Capacity of the Church Road roadside ditch was exceeded leading to overland flow; sewage and flood water emerged from a manhole on Sheldon Road outside the school (photographed October 2020). CCTV and investigations were carried out in the sewer network nearby. [PAG] (p30)</p></div><div class="nugget-popup"><p>Additional CCTV inspections identified clear water sources in the foul&ndash;sewer network extending to Sheldon Road, implicating the area in the sewer&ndash;flooding issue. (p31)</p></div><div class="nugget-popup"><p>Thames Water pumped water from the foul sewer at the junction with Church Road and Worminghall Road; groundwater entered at least one nearby property (sandbags were delivered) and internal water receded later on 04/10/2020. [TAB] (p35)</p></div><div class="nugget-popup"><p>During 2&ndash;4 Oct 2020 Sheldon Road experienced surface water flooding and foul/sewer flooding; sewage emerged from a manhole outside the school and surface water affected the road and nearby properties. [PAG,IMG] (p36)</p></div><div class="nugget-popup"><p>High groundwater to the south of Sheldon Road was identified as one of the main sources of flooding; groundwater flooding is thought to have caused one property to flood internally during the event. (p37)</p></div><div class="nugget-popup"><p>Surface water flowed along Church Road and along Sheldon Road; the highway drainage was overwhelmed in these locations, leading to flooding, ponding and instances of drainage surcharge from gullies and manholes. (p39)</p></div><div class="nugget-popup"><p>Both Church Road and Sheldon Road experienced combined sewer and surface water issues in October 2020, with sewage bubbling from manholes and mixing with surface runoff along these roads. (p41)</p></div><div class="nugget-popup"><p>Flood water and foul sewage emerged from a manhole outside the school, causing roadway inundation and standing contaminated water over the carriageway and manhole cover. (p42)</p></div><div class="nugget-popup"><p>Sheldon Road was flooded and access was cut off in places; the foul sewer system surcharged and spilled onto Sheldon Road during the event. (p43)</p></div><div class="nugget-popup"><p>CCTV survey covering the route from Bulls Lane to Sheldon Road identified surface water inundation, groundwater infiltration and misconnections entering the foul sewer; these flows are likely contributors to foul&ndash;system surcharging observed during the October 2020 event. (p47)</p></div><div class="nugget-popup"><p>Foul sewer is likely to surcharge on Sheldon Road and Church Road, causing sewer flooding and reducing the effectiveness of surface&ndash;water drainage measures; highway runoff can also overwhelm gullies, increasing local road flooding (explicitly cited for Church Road). (p48)</p></div><div class="nugget-popup"><p>One property on Sheldon Road flooded internally (residents report initial flooding from rising groundwater at ~04:00 on 4 October 2020, receding by ~20:00 the same day). Surface water ponded/flowed along Sheldon Road and foul/surface sewers were overwhelmed with sewage bubbling and combining with floodwater. (p55)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property [TAB] (p35)</p></div><div class="nugget-popup quant"><p>one property (p37)</p></div><div class="nugget-popup quant"><p>1 property (unable to flush downstairs toilets reported) (p43)</p></div><div class="nugget-popup quant"><p>1 property flooded internally (p55)</p></div></div></body></div>`)[0];
                popup_d4f607c4641452405c6765600f3cc976.setContent(html_f51796a3676c0e9ad1f2b12396b1a64f);

                var html_06a73a62bca5cfbe24f4330f922c207c = $(`<div id="html_06a73a62bca5cfbe24f4330f922c207c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Little Ickford, Ickford</h1><div class="nugget-popup"><p>The pond at the junction of Sheldon Road and Little Ickford discharges via a culvert and re&ndash;emerges as an ordinary watercourse to the south of the village before joining the River Thame; during the October 2020 event nearby ordinary watercourses and ditches exceeded capacity, contributing to local surface water flooding and sewer surcharging (Sheldon Road manhole surcharging and other local road/ditch flooding). [PAG,IMG] (p17)</p></div><div class="nugget-popup"><p>Ickford experienced surface water flooding during 2&ndash;4 October 2020 affecting local access routes and streets (including Worminghall Road, Church Road and Sheldon Road) and with local ditches/channels exceeding capacity in places. Little Ickford is shown on groundwater flood mapping as being at high risk, but no specific internal flooding of Little Ickford during the October 2020 event is explicitly recorded in the report. [PAG,IMG] (p24)</p></div><div class="nugget-popup"><p>Surface water inundation and local groundwater/ditch ponding caused road flooding (e.g. Worminghall Road and junctions) and capacity exceedance of the Church Road drainage ditch; sewage and floodwater emerged from a manhole on Sheldon Road outside the school. Thames Water recorded high sewer levels and subsequently installed monitors and replaced manhole covers after the October 2020 incident. [PAG,IMG] (p30)</p></div><div class="nugget-popup"><p>Surface water runoff flowed down the road towards Little Ickford during the October 2020 event, indicating roads/access in the Little Ickford area were affected by pluvial flooding. (p39)</p></div><div class="nugget-popup"><p>Flooding occurred at Little Ickford and contributed to access being cut off on roads in and out of the village for several days in places. (p43)</p></div></div></body></div>`)[0];

                var html_2aba61886ac77e89a537447c7a3f3983 = $(`<div id="html_2aba61886ac77e89a537447c7a3f3983" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ickford Road, Ickford</h1><div class="nugget-popup"><p>Flooding occurred at the junction with Worminghall Road (photo caption: flooding at the junction of Worminghall Road and Ickford Road) causing inundation of the carriageway and interrupting the main access route into the village. [PAG] (p22)</p></div><div class="nugget-popup"><p>Flooding at the junction made the junction impassable for regular vehicles. (p25)</p></div><div class="nugget-popup"><p>Surface water flooding at the junction of Ickford Road and Worminghall Road during 2&ndash;4 Oct 2020 made the junction impassable for regular vehicles. There is potential fluvial contribution from Worminghall/Peppershill Brooks but the exact extent of fluvial flooding at the junction during the October 2020 event is not known. [PAG] (p36)</p></div><div class="nugget-popup"><p>Floodwater from the Lappingford/Worminghall and Pepperhill Brooks flowed across fields to the junction at Worminghall Road and Ickford Road; some of this water then flowed down Worminghall Road towards the village. [PAG] (p39)</p></div><div class="nugget-popup"><p>Ickford Road was flooded, contributing to routes in and out of the village being cut off for several days in some locations. (p43)</p></div><div class="nugget-popup"><p>Floodwater from surrounding brooks inundated the Worminghall Road / Ickford Road junction; floodwaters then flowed south along Worminghall Road towards Church Road. The lower part of Worminghall Road flooded from surface water before river floodwater reached the junction. Foul and surface water sewers along the roads were overwhelmed, with sewage observed bubbling from manholes and combining with surface water. (p55)</p></div></div></body></div>`)[0];

                var html_1726b62bd19c6f93c1a600bf4661b3ac = $(`<div id="html_1726b62bd19c6f93c1a600bf4661b3ac" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ickford</h1><div class="nugget-popup"><p>Internal flooding to at least one property during the October 2020 flood event; repeated flooding of highways/roads causing disruption to access and egress (recorded floods to roads in June 2008, January 2020 and January 2021). [MUL] (p5)</p></div><div class="nugget-popup"><p>Internal flooding to at least one property, garden flooding, roads flooded causing problems with access and egress, overwhelmed sewer system and associated mental health impacts on residents. (p6)</p></div><div class="nugget-popup"><p>During the 02 Oct 2020 &ndash; 04 Oct 2020 event Ickford experienced flooding. Properties suffered internal flooding; groundwater ingress into the foul sewer network contributed to sewer flooding and reduced sewer capacity; surface water and exceedance of channels/highway drainage flooded roads and affected access and egress. These impacts drove recommendations for sewer monitoring/CCTV, a groundwater&ndash;impacted system management plan, property flood resilience, and community flood preparedness. [TAB] (p7)</p></div><div class="nugget-popup"><p>Between 02 Oct 2020 and 04 Oct 2020 the village experienced flooding that caused internal flooding to at least one residential property. Several properties experienced external flooding. Highways in the village flooded, causing disruption to access and egress; the village has a recorded history of highway flooding (at least four events in the previous three years). (p13)</p></div><div class="nugget-popup"><p>Flooding affected the village located on the edge of the River Thame floodplain; properties were flooded and roads were subject to closure during the event. Photographs, observations and flooded property information were collected as part of the event record. (p14)</p></div><div class="nugget-popup"><p>During the October 2020 event, surface water and groundwater ponding occurred in and around Ickford; a manhole on Sheldon Road surcharged, with flood water and sewage emerging outside the school; the capacity of the Church Road ditch was exceeded causing overtopping along Church Road; flooding occurred at the junction of Worminghall Road and Ickford Road; waterlogging affected the Worminghall Road development site (42 Worminghall Road). These impacts affected highways, drainage assets (culverts/ditches) and local properties/sites. [PAG,IMG,MUL] (p17)</p></div><div class="nugget-popup"><p>The village experienced surface water flooding and sewer&ndash;related incidents during the October 2020 event: highway gullies and surface water pipes routed large runoff toward Church Road (low&ndash;lying area) and there were recorded incidents of flooded roads (e.g. Worminghall Road) and sewage emerging from a manhole on Sheldon Road. Thames Water&#8217;s foul sewer system and pumping at Ickford Pumping Station were identified as potential contributors requiring investigation. [PAG,IMG] (p20)</p></div><div class="nugget-popup"><p>The village experienced flooding associated with intense rainfall and runoff that affected low&ndash;lying areas (notably the southern part of the village). Flooding included surface water inundation and failures/overloads within drainage and sewer systems (images and timeline in the report reference flooding in Ickford during October 2020). [PAG,IMG] (p21)</p></div><div class="nugget-popup"><p>Access routes into the village flooded during the event (roads via Worminghall Road/Ickford Road, Sheldon Road/Ickford Road and Bridge Road are shown as flood&ndash;prone), creating risk of the village becoming isolated and affecting movement to/from the settlement. [PAG,IMG] (p22)</p></div><div class="nugget-popup"><p>Surface water flooding affected key access routes into Ickford (Worminghall Road, Church Road, Sheldon Road) during the 2&ndash;4 October 2020 event. Flooding on these roads (including sewage emergence on Sheldon Road) reduced normal access and threatened village connectivity. [PAG,IMG] (p23)</p></div><div class="nugget-popup"><p>During 02 Oct 2020 &ndash; 04 Oct 2020 heavy rainfall caused surface water flooding in and around Ickford: the junction of Worminghall Road and Ickford Road was flooded and made impassable to regular vehicles; surface water and foul flooding occurred along Sheldon Road; the drainage channel at Church Road exceeded capacity and overtopped. [PAG,IMG,TAB] (p24)</p></div><div class="nugget-popup"><p>Fluvial (river) flooding affected parts of the village located on the River Thame floodplain during the event; local ditches and small watercourses contributed to localised inundation of the village edges. (p29)</p></div><div class="nugget-popup"><p>Intense rainfall on 2&ndash;4 October 2020 led to surface&ndash;water inundation across the village and surcharge of the foul sewer network. Sewage and floodwater were observed emerging from manholes (e.g. Sheldon Road) and highway flooding occurred on roads through the village. Thames Water subsequently installed sewer monitors and later replaced vulnerable manhole covers following the October 2020 incident. [PAG,IMG] (p30)</p></div><div class="nugget-popup"><p>Intense rainfall from 02 Oct 2020 to 04 Oct 2020 caused widespread local flooding in Ickford. Surface water and urban flooding occurred, with Church Road ditch capacity exceeded leading to flooding along Church Road; groundwater ponding was observed in the field west of Worminghall Road; flooding occurred at the junction of Worminghall Road and Ickford Road; Worminghall Road flooded (including areas near the Rising Sun and the Deanfield development site); and sewage and floodwater emerged from a manhole on Sheldon Road outside the school. At least one property on Church Road installed property flood resilience measures (bunds, pumps and barriers). [PAG] (p32)</p></div><div class="nugget-popup"><p>Intense, localised rainfall over the Ickford catchment during 2&ndash;4 Oct 2020 produced a very large rainfall input to the catchment (HYRAD 81 mm over the 58&ndash;hour event; pronounced peak at 20:45 on 3 Oct) and is the meteorological driver for the flood investigated. The rainfall was highly localised and of high intensity (red/pink on HYRAD indicating &gt;32 mm/hr at the time of peak), contributing to rainfall&ndash;driven (surface water/flash) flooding across the catchment. [IMG,TAB] (p33)</p></div><div class="nugget-popup"><p>During the October 2&ndash;4, 2020 event, intense rainfall caused surface water flooding across the village and high groundwater was observed in large areas. Localised sewer/foul flooding also occurred in parts of the village (e.g. Sheldon Road). Nuisance/highway flooding is reported regularly in the village. [PAG,IMG] (p36)</p></div><div class="nugget-popup"><p>Intense rainfall together with rising river levels and high groundwater caused flooding across the village and surrounding fields. Groundwater ponding was observed (notably west of Worminghall Road and south of Sheldon Road). Groundwater to the south of Sheldon Road is cited as a main source of internal flooding for one property; there is an unconfirmed report of groundwater entering a property on Worminghall Road. Flooding was largely contained to agricultural land in places but resulted in at least one internally flooded property. [PAG] (p37)</p></div><div class="nugget-popup"><p>Floodwater (surface&ndash;water and river&ndash;derived) moved into and through the village via roads such as Worminghall Road, causing road flooding, ponding and access impacts within the settlement. [PAG] (p39)</p></div><div class="nugget-popup"><p>Intense rainfall caused widespread surface water flooding across the village, with highway drainage overwhelmed in multiple locations and surface water ponding on roads (Worminghall Road, Church Road, Sheldon Road). Large areas of the village reported high groundwater levels and groundwater emergence during the October 2020 event. [PAG,IMG] (p40)</p></div><div class="nugget-popup"><p>The village experienced sewer&ndash;related flooding in October 2020: surcharging foul sewers released sewage that combined with surface water across roads where there is no separate surface water system, leading to localised road and drainage flooding. (p41)</p></div><div class="nugget-popup"><p>During the 2&ndash;4 Oct 2020 event the foul sewer system in Ickford became overloaded and was surcharging because of multiple inflows (surface water inundation, groundwater infiltration and misconnections), contributing to local flooding and sewer performance failure. [PAG] (p46)</p></div><div class="nugget-popup"><p>During 02 Oct 2020 &ndash; 04 Oct 2020 the local foul sewer became overloaded and surcharged. Surface water inundation, groundwater infiltration and surface&ndash;water misconnections were identified as entering the foul sewer and contributing to sewer surcharging. The condition and unknown operating rate of Ickford Pumping Station was identified as linked to local flood risk. Thames Water's pre&ndash;installed sewer level monitors were not working during the event, limiting monitoring of the surcharge. (p47)</p></div><div class="nugget-popup"><p>Fluvial (river) and surface water inundation affected properties and could ingress into foul sewers via private manholes and gullies; access and egress issues for vulnerable residents during the flood; damage/loss to household belongings and property prompted community resilience actions (sandbagging, advice on reducing ingress, development of a Flood Action Group and Flood Plan). (p49)</p></div><div class="nugget-popup"><p>The village experienced flooding in October 2020. The report identifies fluvial flooding in the lower reaches around Ickford influenced by the very flat floodplain and River Thame water levels, and also notes problems with surface water and sewer flooding in the village that would not be mitigated by upstream NFM measures. (p52)</p></div><div class="nugget-popup"><p>Fluvial floodwaters surrounded the village during the event, severely restricting access and egress for residents and emergency services; residents also reported foul flooding on Church Lane caused by groundwater ingress into the sewer network. (p53)</p></div><div class="nugget-popup"><p>The village experienced surface water flooding on roads, river flooding from surrounding watercourses and floodplains, and groundwater flooding in alluvial gravels. High water levels and backing up from the River Thame caused channels to exceed capacity and overtop onto roads; fields adjacent to Ickford were inundated. Highways flooding caused disruption to access and egress. (p55)</p></div><div class="nugget-popup"><p>Flooding in Ickford during 02 Oct 2020 &ndash; 04 Oct 2020 included fluvial (main river) and surface water inundation, groundwater ingress into the foul sewer network leading to sewer flooding and reduced sewer capacity, and internal property flooding and issues with access/egress. [TAB,PAG] (p56)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 1 property; at least 4 events in the last 3 years [MUL] (p5)</p></div><div class="nugget-popup quant"><p>1 property (p6)</p></div><div class="nugget-popup quant"><p>1 property; 4 events (p13)</p></div><div class="nugget-popup quant"><p>at least one property on Church Road [PAG] (p32)</p></div><div class="nugget-popup quant"><p>four events reported by residents in the last three years [PAG,IMG] (p36)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p37)</p></div><div class="nugget-popup quant"><p>1 property flooded internally; at least 4 flooding events in the last three years (p55)</p></div></div></body></div>`)[0];

                var html_bccfd2417982a2318c41ad9f889b66d9 = $(`<div id="html_bccfd2417982a2318c41ad9f889b66d9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Worminghall</h1><div class="nugget-popup"><p>Photographs referenced in the report (Figures 8&ndash;4 and 8&ndash;5) show flooding affecting Worminghall Road and adjacent areas in October 2020, inundating the highway and impacting local access. [PAG,IMG] (p21)</p></div><div class="nugget-popup"><p>Surface&ndash;water flooding affected Worminghall Road (photos dated October 2020), inundating the road corridor and threatening access between Ickford and surrounding areas. [PAG] (p22)</p></div><div class="nugget-popup"><p>Surface&ndash;water and fluvial incidents have impacted the Worminghall area on multiple occasions. Relevant reported impacts include: 3 June 2008 when Worminghall Brook exceeded channel capacity and flowed across fields towards Worminghall Road and down to Church Road causing property flooding; July 2019 surface&ndash;water flooding along Worminghall Road and Golders Close; and the 02&ndash;04 Oct 2020 event which flooded the junction of Worminghall Road and Ickford Road, making the junction impassable to regular vehicles. [PAG,TAB,MUL] (p24)</p></div><div class="nugget-popup"><p>Areas around Worminghall experienced road and surface&ndash;water flooding during the October 2020 event (photographic evidence of flooding on Worminghall Road and at its junctions). Local watercourses in the Worminghall/Lappingford area are noted in the report as being outside the EA annual maintenance programme, contributing to local vulnerability. [PAG] (p30)</p></div><div class="nugget-popup"><p>The area experienced surface water runoff and ponding along roads and verges; high groundwater levels and groundwater ponding were reported in fields adjacent to Worminghall Road; foul sewer surcharging occurred in nearby streets, combining sewage with surface water. [PAG,IMG] (p40)</p></div><div class="nugget-popup"><p>Roads in and out of the village towards Worminghall were cut off by floodwater, heavily impacting access and egress to the village for several days. (p43)</p></div></div></body></div>`)[0];
