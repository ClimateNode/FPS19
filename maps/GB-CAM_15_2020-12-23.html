                var html_73f24b7772f7d4cbd17c81c34d778b91 = $(`<div id="html_73f24b7772f7d4cbd17c81c34d778b91" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Buckden</h1><div class="nugget-popup"><p>LLFA received 15 flood reports for Buckden; community reported eight properties flooded internally and additional external flooding to gardens/garages/outbuildings; Parish and District Council communications indicate more widespread flooding across the parish. (p8)</p></div><div class="nugget-popup"><p>Town&ndash;wide impacts from surface water when watercourses exceeded capacity and from overwhelmed sewer infrastructure (foul water backup); road and transport disruption including a flooded northern underpass beneath the A1 and the A1 being impassable for several hours; loss of access/egress for some flood&ndash;resilient properties (e.g., near Buckden Marina); flooding of amenity land and high water at an attenuation pond. [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>Surface water flooding occurred when watercourses exceeded channel capacity; Anglian Water assets were overwhelmed with floodwater entering sewers causing foul backups; the northern underpass beneath the A1 was flooded and the road between Buckden Marina and the level crossing was flooded, cutting off an exit from the village; the A1 flooded and was impassable for some hours. [TAB,PAG] (p11)</p></div><div class="nugget-popup"><p>Buckden experienced flooding driven by surface&ndash;water runoff, including from an underpass and contributions from the A1 carriageway. This prompted community engagement and interventions (gully cleansing, highway drainage improvements at High Street, riparian and watercourse maintenance) aimed at alleviation. The report notes no reports of residents needing to leave their properties. (p12)</p></div><div class="nugget-popup"><p>On 23 December 2020 a prolonged period of higher&ndash;than&ndash;average rainfall across Autumn 2020 followed by intense rainfall produced rapid runoff that caused significant overland surface water flooding and flooding from drainage systems which exceeded capacity. Flooding overwhelmed highway drainage and prompted actions including highway surface water drainage improvements (installation commenced February 2022) and measures to uphold riparian maintenance; further upstream flood&ndash;alleviation options near Taylor's Lane are being considered. (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>15 flood reports; 8 properties (internal) (p8)</p></div><div class="nugget-popup quant"><p>c.23 properties (total reported in parish table) [PAG,IMG] (p10)</p></div><div class="nugget-popup quant"><p>Properties internally up to a depth of 60cm (Taylors Lane and High Street); Gardens up to a depth of 91cm (Taylors Lane); 1 northern underpass flooded [TAB,PAG] (p11)</p></div></div></body></div>`)[0];
