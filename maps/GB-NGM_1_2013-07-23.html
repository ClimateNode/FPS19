                var html_611f1fc5e5666d016a35bd4f075368f6 = $(`<div id="html_611f1fc5e5666d016a35bd4f075368f6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Nottingham Unitary Authority</h1><div class="nugget-popup"><p>Nottingham (administrative area containing Bulwell and Bestwood Road) included the location of the 23 July 2013 flooding; the report maps the affected local streets within the city boundary. (p1)</p></div><div class="nugget-popup"><p>An intense thunderstorm on the evening of 23 July 2013 caused flooding across the city, resulting in residential properties being flooded. (p3)</p></div><div class="nugget-popup"><p>Residential properties within Nottingham (specifically on Bestwood Road) experienced external flooding during the rainfall event on 23rd July 2013; a resident reported external flooding in 2011 at the same location. [PAG,MUL] (p7)</p></div><div class="nugget-popup"><p>A series of heavy rainfall events saturated the ground and overwhelmed available storage in underground drainage networks across the city, resulting in internal flooding of properties (notably 6 properties on Bestwood Road). [PAG] (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 100 residential properties (p3)</p></div><div class="nugget-popup quant"><p>6 properties [PAG] (p18)</p></div></div></body></div>`)[0];

                var html_7f8f6f14b5b463c67306651a748ab0c2 = $(`<div id="html_7f8f6f14b5b463c67306651a748ab0c2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bestwood Road, Bulwell</h1><div class="nugget-popup"><p>Flooding occurred on the Bestwood Road corridor during the 23 July 2013 event; the Section 19 report map identifies water features adjacent to the road and surrounding residential streets that were relevant to the event. [IMG] (p1)</p></div><div class="nugget-popup"><p>Internal flooding occurred to residential properties on Bestwood Road during the same storm event. (p3)</p></div><div class="nugget-popup"><p>Internal (over the doorstep) flooding of residential properties on Bestwood Road. [PAG] (p5)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties on Bestwood Road. [IMG,PAG] (p6)</p></div><div class="nugget-popup"><p>Residential properties on Bestwood Road experienced external flooding caused by rainfall; sewer and surface water drainage were implicated in the event. A resident also reported external flooding at properties on Bestwood Road in 2011. [PAG,MUL] (p7)</p></div><div class="nugget-popup"><p>Properties on Bestwood Road were externally flooded during the event on 23rd July 2013. Anecdotal evidence indicates the flooding on 23 July was more widespread than predicted by the Flood Map for Surface Water. A resident also reported that properties on Bestwood Road flooded externally in 2011. [PAG,MUL] (p8)</p></div><div class="nugget-popup"><p>Properties on Bestwood Road were flooded during the intense storm on 23 July 2013; the flood event started during the storm at 17:00 on 23rd July 2013. (p9)</p></div><div class="nugget-popup"><p>Properties on Bestwood Road were flooded during and after the intense rainfall on 23rd July 2013 with water reported entering from both the front and rear of properties. Roadways acted as conduits channeling rapid overland flow to the low point in the landscape. Highway gullies and private rear surface water drains were unable to drain, contributing to ponding and flood volumes; raised levels in the River Leen likely restricted outfall and may have tide&ndash;locked outfalls during/after the storm. (p10)</p></div><div class="nugget-popup"><p>Surface water rapidly flowed along road surfaces and pooled at the lowest point on Bestwood Road. Water entered properties (front and rear) and pooled because highway gullies and private rear drains were unable to drain; the adjacent railway embankment prevented water from continuing to the River Leen, increasing local flood depths. [IMG,PAG] (p11)</p></div><div class="nugget-popup"><p>Rapid surface water flow along road surfaces pooled at the lowest point on Bestwood Road because the railway embankment prevented flow to the River Leen. Highway gullies were overwhelmed, water breached kerbs and entered properties through front and back doors; vehicles driving through floodwater generated bow waves that pushed water into properties. [PAG] (p12)</p></div><div class="nugget-popup"><p>High flows overwhelmed highway gullies and breached the kerb, allowing surface water to pool (aided by local topography and an adjacent railway embankment) and enter properties via low front and rear thresholds. Vehicles driving through the flood created bow waves that pushed water into buildings. This resulted in downstairs internal and external flooding and damage to stairs, floorboards, doors, walls and furniture. A resident reported sewage&ndash;contaminated floodwater, indicating the public foul sewer was at capacity during the storm. [IMG,TAB] (p13)</p></div><div class="nugget-popup"><p>Intense rainfall produced large volumes of surface water that flowed down Bestwood Road, overwhelming highway drainage that connects to the public sewer. Surface water ponded on the road and was unable to drain into the sewer network (which was at capacity), causing road flooding and external flooding to adjacent properties. Reported damage included external damage to stairs, floorboards, doors, walls and furniture. (p14)</p></div><div class="nugget-popup"><p>Surface water was unable to drain into the highway drainage system at Bestwood Road, increasing surface water volumes; the public sewer network near Bestwood Road was identified for CCTV investigation and the road gullies were placed on a Targeted Gully Cleansing Regime for more frequent cleaning to reduce future flood risk. [PAG] (p15)</p></div><div class="nugget-popup"><p>Properties on Bestwood Road experienced internal flooding (including during the 23 July 2013 event); gullies on the road were placed on a Targeted Gully Cleansing Regime for more frequent maintenance. [TAB] (p16)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties located predominantly in low&ndash;lying areas; flooding resulted from heavy rainfall that saturated the ground and filled underground drainage networks. (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>6 properties (p3)</p></div><div class="nugget-popup quant"><p>6 properties [PAG] (p5)</p></div><div class="nugget-popup quant"><p>6 properties [IMG,PAG] (p6)</p></div><div class="nugget-popup quant"><p>6 properties (of which 6 are private); internal flood depths up to 250 mm; external flood depths up to 900 mm. [IMG,TAB] (p13)</p></div><div class="nugget-popup quant"><p>6 properties (p18)</p></div></div></body></div>`)[0];

                var html_bd4fa755b253e4e766c0e153a8bb9439 = $(`<div id="html_bd4fa755b253e4e766c0e153a8bb9439" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hucknall Road, Bulwell</h1><div class="nugget-popup"><p>Surface water flowed down Hucknall Road during the intense rainfall and was likely channelled into Bestwood Road, increasing flood volumes at the low point; highway gullies were unable to drain, exacerbating surface water accumulation. (p10)</p></div><div class="nugget-popup"><p>Surface water was conveyed along the main trunk of Hucknall Road during the storm and was channelled into Bestwood Road at the junction, acting as a flow route that contributed to the flooding on Bestwood Road. (p11)</p></div></div></body></div>`)[0];

                var html_647b964a726e866f05b5e04283a09a31 = $(`<div id="html_647b964a726e866f05b5e04283a09a31" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bulwell</h1><div class="nugget-popup"><p>Bulwell (the locality containing Bestwood Road) was the area impacted by the 23 July 2013 flood event; the report map and descriptions focus on water features and residential areas in this locality. (p1)</p></div><div class="nugget-popup"><p>Part of the north of the city affected by the intense storm; Bestwood Road in Bulwell experienced internal flooding to residential properties. (p3)</p></div><div class="nugget-popup"><p>Areas of green open space in the wider Bulwell area were saturated in the 24 hours before and during the intense rainfall, contributing to rapid overland flow and surface water ponding that fed runoff toward Bestwood Road. (p10)</p></div><div class="nugget-popup"><p>Road gullies and highway drains in the Bulwell area were likely overwhelmed by high volumes and flow of surface water (flowing down Bestwood Road), contributing to ponding and inability of surface water to drain into the public sewer network. (p14)</p></div><div class="nugget-popup"><p>Areas adjacent to the river corridor in Bulwell lie within mapped flood zones; the river corridor floodplain runs through residential areas and alongside River Park, placing those parts of Bulwell at risk and recorded as flood&ndash;affected in the report for the 23 July 2013 event. [IMG] (p23)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>6 properties (p3)</p></div></div></body></div>`)[0];
