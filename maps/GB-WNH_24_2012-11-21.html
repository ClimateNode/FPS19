ded [PAG] (p12)</p></div></div></body></div>`)[0];

ooding experienced on more than one occasion in the last 5 years [PAG] (p5)</p></div><div class="nugget-popup quant"><p>at least one property [PAG,MUL] (p6)</p></div><div class="nugget-popup quant"><p>1 property (p8)</p></div></div></body></div>`)[0];
