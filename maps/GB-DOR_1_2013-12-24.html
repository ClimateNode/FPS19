                var html_8bc25827200ee40c0cb5a77a5712a80b = $(`<div id="html_8bc25827200ee40c0cb5a77a5712a80b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Gladelands Park</h1><div class="nugget-popup"><p>A number of residential park homes on the Gladelands site were flooded. (p5)</p></div><div class="nugget-popup"><p>A significant part of the Gladelands site was inundated when overland flows from two directions joined in lower areas of the site, flooding properties and prompting an emergency evacuation of residents. (p8)</p></div><div class="nugget-popup"><p>Photographs show the Gladelands site was flooded during the event; photographic analysis was used to assess extent and levels at the site. (p9)</p></div><div class="nugget-popup"><p>Site experienced flooding on 24 December 2013. Hydraulic modelling concluded the only viable explanation that matched the observed flood at Gladelands was elevated water levels in the Uddens Water downstream of the A31/Palmersford Roundabout; debris in the Uddens Water was also reported at the time of the event. (p10)</p></div><div class="nugget-popup"><p>Floodwaters entered the Gladelands site after upstream water levels rose due to downstream elevated levels on the Uddens; the 600mm culvert crossing the site and an upstream box culvert were drowned out, allowing floodwater from the Palmersford roundabout and the A31 to inundate land to the west of the site and the site itself. [PAG] (p11)</p></div><div class="nugget-popup"><p>Floodwaters entered the Gladelands site after downstream water levels (>= 12.80mAOD) surcharged the A31 Palmersford Road culvert and backed up the open channel of the Uddens; the site's 600mm culvert and an upstream box culvert were drowned, allowing floodwater from the Palmersford roundabout and adjacent land west of the site to inundate the site. [PAG] (p12)</p></div><div class="nugget-popup"><p>Floodwater from overland flows (entering from the A348 to the east and from the north west) collected in the low areas of the Gladelands site, flooding residential park homes and prompting an emergency evacuation of residents. (p14)</p></div><div class="nugget-popup"><p>Park and adjacent access areas were inundated: water covered roads, pathways and grassed areas; signage and fencing partially submerged; buildings/park homes visible behind the waterline and access rendered impassable. [IMG] (p21)</p></div></div></body></div>`)[0];

                var html_e2952faa1bc28e6bb9d48e94e94df002 = $(`<div id="html_e2952faa1bc28e6bb9d48e94e94df002" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Uddens Water</h1><div class="nugget-popup"><p>Water levels in the Uddens rose above bank/above ground, producing overbank/overland flows that entered the Gladelands site from the north&ndash;west and contributed to the flooding; downstream level at the culvert was estimated from photographs. [PAG] (p8)</p></div><div class="nugget-popup"><p>Elevated river levels downstream of the A31 Palmersford Roundabout culvert; photographic evidence and pumping&ndash;station telemetry show peak levels during the event and debris accumulation in the channel. [PAG] (p9)</p></div><div class="nugget-popup"><p>Contemporary reports during the 24th December 2013 flood of tree, wood and other debris building up in the channel; debris accumulation was present at the time of the flood event. [PAG] (p10)</p></div><div class="nugget-popup"><p>Downstream water levels on the Uddens rose (reaching at least 12.80mAOD during the event), which surcharged culverts and backed up the open channel, drowning smaller culverts and causing flow restrictions that forced upstream water levels to rise and produce flooding upstream. (p11)</p></div><div class="nugget-popup"><p>Uddens Water was identified as having elevated water levels (subject of modelling) that contributed to surcharging downstream culverts and backing up flow, producing upstream flooding that affected Palmersford roundabout and Gladelands. (p12)</p></div><div class="nugget-popup"><p>Elevated downstream water levels in the Uddens Water caused overbanking; floodwater entered the Gladelands site, joined other flows in low areas and flooded residential park homes, prompting an emergency evacuation of residents. (p14)</p></div><div class="nugget-popup"><p>High river levels with raised flow; river water partially submerged a riverside fence and extended into adjacent vegetation, indicating river&ndash;bank inundation. [IMG] (p23)</p></div></div></body></div>`)[0];

                var html_5edc763980779b22218f81874bb9104c = $(`<div id="html_5edc763980779b22218f81874bb9104c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Palmersford Roundabout</h1><div class="nugget-popup"><p>Part of the Palmersford Roundabout on the A31 was flooded; parts of the adjacent road network were inundated during the event. [PAG] (p7)</p></div><div class="nugget-popup"><p>Part of the Palmersford Roundabout on the A31 was flooded during the event; it was a source/direction of overland flow entering the Gladelands site. [PAG] (p8)</p></div><div class="nugget-popup"><p>Flooding observed on the A31 at the Palmersford Roundabout; photographic evidence used to estimate peak water level on the roundabout during the event. [PAG] (p9)</p></div><div class="nugget-popup"><p>The roundabout was flooded first as upstream water levels rose due to downstream controls; floodwaters from the roundabout then entered the adjacent Gladelands site. (p11)</p></div><div class="nugget-popup"><p>The Palmersford roundabout was flooded as upstream water levels rose following surcharge of the downstream A31 culvert and backing up of the Uddens; floodwaters from the roundabout then entered the adjacent Gladelands site. [PAG] (p12)</p></div><div class="nugget-popup"><p>The large culvert beneath the A31 Palmersford roundabout was identified as a critical drainage asset to manage flood risk; it was recommended that the culvert be cleared and desilted regularly to reduce blockages that contributed to the December 2013 flooding. (p15)</p></div><div class="nugget-popup"><p>Roundabout and approaching carriageway were heavily flooded; water covered the full width of the road making the junction/roundabout impassable to vehicles and creating a transport hazard. [PAG] (p21)</p></div><div class="nugget-popup"><p>Carriageway and roundabout area submerged by standing surface water making the road impassable; traffic management in place (road closed sign, cones) and police attendance. [IMG,PAG] (p22)</p></div></div></body></div>`)[0];
