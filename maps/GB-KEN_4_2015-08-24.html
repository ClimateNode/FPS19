                var html_d63e8847aad07ba3f47d9bd7f7e94106 = $(`<div id="html_d63e8847aad07ba3f47d9bd7f7e94106" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Tunbridge Wells Station</h1><div class="nugget-popup"><p>Railway track flooded from overflowing drainage, causing closure of the Tonbridge to Hastings line until flooding subsided. [TAB,PAG] (p7)</p></div><div class="nugget-popup"><p>Track bed flooded to an approximate depth of 0.15m due to an overflowing manhole, causing a temporary closure of the Tonbridge to Hastings rail line. (p26)</p></div><div class="nugget-popup"><p>Flooding entered the railway cutting and inundated the track bed (caused by an overflowing manhole), disrupting operations and forcing a temporary closure of the Tonbridge to Hastings rail line. [PAG] (p27)</p></div><div class="nugget-popup"><p>Surcharging of the combined sewer caused flooding of the track bed where the line passes beneath the railway, resulting in disruption to train services. [MUL] (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>0.15m depth (p26)</p></div><div class="nugget-popup quant"><p>approximately 0.15 m flood depth to the track bed; Tonbridge to Hastings line temporarily closed [PAG] (p27)</p></div><div class="nugget-popup quant"><p>7 flooding incidents reported on specific dates [MUL] (p28)</p></div></div></body></div>`)[0];

                var html_bd25a57b14c4f7791ec43532fa22ffce = $(`<div id="html_bd25a57b14c4f7791ec43532fa22ffce" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Grom</h1><div class="nugget-popup"><p>Identified on the map (sluice noted) and listed among locations of flooding under investigation for the event on 24th August 2015. [IMG] (p8)</p></div><div class="nugget-popup"><p>The River Grom overflowed the culvert entrance, causing internal flooding to one property, flooding of adjacent private gardens and damage to the culvert headwall's trash screen. (p21)</p></div><div class="nugget-popup"><p>The culverted section of the River Grom (identified as a public surface water sewer) was implicated in the locality's drainage arrangements; investigation recommends using this culvert to accept highway surface water flows and assessing trash screen/entrance arrangements to reduce flood risk. (p29)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property; gardens flooded to a depth in excess of 1 m (p21)</p></div></div></body></div>`)[0];

                var html_b31e3bc352fbe7a79e735177b1e02df1 = $(`<div id="html_b31e3bc352fbe7a79e735177b1e02df1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Nevill Street, Tunbridge Wells</h1><div class="nugget-popup"><p>Highway flooded and impassable by cars; fire service pumped out water from properties. [TAB,PAG] (p7)</p></div><div class="nugget-popup"><p>Flooding was reported on Nevill Street (shown on Figure 1) and is included in the set of central Tunbridge Wells locations under investigation for impacts on 24 August 2015. [IMG] (p8)</p></div><div class="nugget-popup"><p>Surface water ponding in excess of 0.5 m depth inundated the road between the junctions with London Road and Market Street, reaching the base of buildings and storefronts; water encroached on sidewalks and storefronts and the floodwaters drained within two hours of rainfall ceasing. [IMG,PAG] (p15)</p></div><div class="nugget-popup"><p>The junction of Nevill Street (with The Pantiles and Warwick Park) lies in a low point and is within the area identified as affected by surface water flooding; buildings in the affected area (including properties with basements below street level) were impacted by floodwater during the event. (p16)</p></div><div class="nugget-popup"><p>Combined sewer network surcharged during intense rainfall, causing drains to back up into properties; surface water accumulating in low points also entered properties. [MUL] (p17)</p></div><div class="nugget-popup"><p>Highway drainage blockages were reported on Nevill Street following resurfacing works (12&ndash;17 August 2015) where tarmac entered drains, and a drain near Nevill Street was recorded as having damaged pipework. These issues may have contributed to higher surface water flows toward the low point at Nevill Street during the 24 August 2015 heavy rainfall and related flooding. [PAG,MUL] (p18)</p></div><div class="nugget-popup"><p>During the 24th August 2015 flood and subsequent clean&ndash;up, highway gullies on the western side of Nevill Street (adjacent to the Pantiles) were found to contain small deposits of tarmac in their sumps; these deposits were not significant and did not block outlet pipes. A nearby manhole contained a build&ndash;up of silt (access to a non&ndash;return valve) but this did not block the drainage network and the non&ndash;return valve was later confirmed working. Resurfacing works carried out 12&ndash;17 August 2015 on Nevill Street (and the adjacent roundabout on London Road) were reported to have caused tarmac ingress to highway drainage and may have contributed to higher surface water flows toward low points on Nevill Street during the heavy rainfall. [PAG] (p19)</p></div><div class="nugget-popup"><p>Properties required pumping out following flooding; drains were cleared (with KFRS assistance) and KCC carried out CCTV survey of the publicly maintainable drainage to assess layout and inform future flood risk management; maintenance frequency of highway drains to be increased. (p20)</p></div><div class="nugget-popup"><p>Highway/surface water flooding affecting Nevill Street during the event; recommendation made to consider direct drainage of highway runoff to the culverted River Grom to improve resilience and free capacity in the public combined sewer. (p29)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 fire engines; 2 properties [TAB,PAG] (p7)</p></div><div class="nugget-popup quant"><p>over 0.5 m depth [IMG,PAG] (p15)</p></div></div></body></div>`)[0];

                var html_117f2b51224334e15417754b6a626650 = $(`<div id="html_117f2b51224334e15417754b6a626650" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Market Street, Tunbridge Wells</h1><div class="nugget-popup"><p>Commercial properties internally flooded; fire engines pumped out water from two properties; the highway was flooded and impassable. [TAB,PAG] (p7)</p></div><div class="nugget-popup"><p>Flooding was reported on Market Street (shown on Figure 1) and is included in the list of locations under investigation for impacts from 24 August 2015. [IMG] (p8)</p></div><div class="nugget-popup"><p>Surface water accumulated at a low point in Market Street, causing flooding and resulting in internal flooding of properties at that low point. [PAG] (p15)</p></div><div class="nugget-popup"><p>Market Street is identified as a low point (approximately 81mAOD) within the affected area and is shown on the surface&ndash;water flood map as being at high risk; properties in this area (including those with basements) were affected by floodwater during the event. (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 fire engines; 2 properties [TAB,PAG] (p7)</p></div><div class="nugget-popup quant"><p>2 properties [PAG] (p15)</p></div></div></body></div>`)[0];

                var html_c2cb25661f89e22e77c471f16e2f1c21 = $(`<div id="html_c2cb25661f89e22e77c471f16e2f1c21" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Warwick Park, Tunbridge Wells</h1><div class="nugget-popup"><p>Residential basements and gardens were flooded; one property flooded internally; gardens flooded due to an overflowing watercourse; culvert headwall was damaged by flow. Fire service pumped out water using a light portable pump. [TAB,PAG] (p7)</p></div><div class="nugget-popup"><p>Central shopping and pedestrian areas (Nevill Street, The Pantiles, Cumberland Walk, Warwick Park, Market Street) experienced localised flooding and inundation during the event, affecting public spaces and streets. (p8)</p></div><div class="nugget-popup"><p>Localised flooding occurred in Warwick Park adjacent to Nevill Street as part of the wider surface water inundation in the Pantiles area. [PAG] (p15)</p></div><div class="nugget-popup"><p>Warwick Park lies at a low point within the affected area; it is within the area shown as high risk of surface water flooding and the culverted River Grom runs beneath it. The Tunbridge Wells Surface Water Management Plan records prior instances of foul and surface&ndash;water flooding here due to hydraulic overload of sewers. The park and nearby properties were impacted by floodwater during the event. [PAG,MUL] (p16)</p></div><div class="nugget-popup"><p>Drainage hydraulic overload and a blockage in the combined sewer system (lead to surcharging of the network feeding a submersible pump at Warwick Park) during heavy rainfall, causing surface water and sewer&ndash;related flooding that affected the block of properties served by the pump (between Cumberland Walk, Nevill Park and Warwick Park); surface water also accumulated in low points reaching depths sufficient to enter properties in some locations. [PAG,MUL] (p17)</p></div><div class="nugget-popup"><p>A piece of concrete was recovered from a combined sewer lateral pipe leading to a submersible pump at Warwick Park; this blockage is linked to increasing the extent of flooding during the 24 August 2015 event and is a contributory factor in repeat internal flooding reported on 13 Aug, 16 Sep and 21 Sep. Reports of blocked highway drains along Warwick Park were received and noted during a site walkover; a drain near Nevill Street had pipework damaged and local drain access for cleaning has been problematic. [PAG,MUL] (p18)</p></div><div class="nugget-popup"><p>The River Grom overflowed the culvert entrance during heavy rainfall causing internal flooding to one property; water collected in several gardens to a depth in excess of 1 m; high flows and debris damaged the culvert headwall's trash screen. KCC later programmed drainage cleansing for Warwick Park and reported one damaged drain for repair; four drains remained requiring further work after cleansing. [PAG] (p20)</p></div><div class="nugget-popup"><p>River Grom overflowed the culvert entrance in Warwick Park during heavy rainfall, causing internal flooding to one property; water collected in several gardens to depths in excess of 1 m; high flows and debris damaged the culvert headwall's trash screen. (p21)</p></div><div class="nugget-popup"><p>Identified as an area requiring gulley cleaning following the 24 August 2015 event to address surface water/highway flooding and reduce future local flood depths. (p29)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 fire engine; 1 property [TAB,PAG] (p7)</p></div><div class="nugget-popup quant"><p>1 property; 4 drains [PAG] (p20)</p></div><div class="nugget-popup quant"><p>one property; gardens flooded to &gt;1 m depth (p21)</p></div></div></body></div>`)[0];

                var html_07b2e509212bc5acc1eefcf83aca5016 = $(`<div id="html_07b2e509212bc5acc1eefcf83aca5016" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Tunbridge Wells</h1><div class="nugget-popup"><p>The Tunbridge Wells area was affected by flooding (report heading states a flood event impacted the area). [PAG] (p1)</p></div><div class="nugget-popup"><p>Significant flooding on 24 August 2015 that inundated properties and caused disruption to traffic and transportation. (p5)</p></div><div class="nugget-popup"><p>Widespread flooding reported across the Tunbridge Wells area on 24 August 2015: highways and pedestrian areas flooded and impassable; multiple residential and commercial properties internally flooded; railway track flooded and closed until flooding subsided. [TAB,PAG] (p7)</p></div><div class="nugget-popup"><p>Multiple localised incidents of flooding occurred across central Tunbridge Wells on the date of the event, affecting streets, public spaces and transport access in the town centre. [IMG] (p8)</p></div><div class="nugget-popup"><p>Localised, intense summer storm produced heavy rainfall over Tunbridge Wells, coinciding with the first reports of flooding received at 17:34 on the day; this caused surface water / flash flooding in the Tunbridge Wells area. [IMG] (p9)</p></div><div class="nugget-popup"><p>Central Royal Tunbridge Wells (notably the Pantiles/Nevill Street/Warwick Park area) experienced surface&ndash;water flooding on 24 August 2015, reported in local media with photographs. The area includes low points (e.g. Nevill Street, The Pantiles, Warwick Park, Market Street, Sussex Mews) where floodwater accumulated, and many buildings affected have basements below street level. The uFMfSW map shows these locations as high risk for surface&ndash;water flooding. Existing drainage discharges to the public combined sewer and the area has a history of sewer hydraulic overload (reported at Warwick Park in 2009 and 2012), contributing to flood impacts. [IMG] (p16)</p></div><div class="nugget-popup"><p>Public combined sewer capacity was exceeded during the 24 August 2015 event, causing flooding across the town; a concrete blockage in a combined sewer lateral (recovered from the pipe) likely increased the extent of flooding. Internal flooding of properties in the area between Cumberland Walk, Nevill Park and Warwick Park was reported on 13 Aug, 16 Sep and 21 Sep (subsequent events). [MUL] (p18)</p></div><div class="nugget-popup"><p>The central area of Royal Tunbridge Wells (area of interest) experienced surface water flooding risk and localized surface water flooding during the event, with impacts concentrated around London Road and Castle Street. [IMG] (p24)</p></div><div class="nugget-popup"><p>Flooding of the railway track bed caused by an overflowing manhole; required temporary closure of the Tonbridge to Hastings rail line. [IMG] (p27)</p></div><div class="nugget-popup"><p>On 24/08/2015 intense rainfall exceeded drainage capacity across Tunbridge Wells, causing surface water to collect in topographical low points and reach depths sufficient to enter property; combined sewer surcharging occurred at the railway station causing flooding to the track bed and disruption to train services. [PAG] (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 properties (Nevill Street); 2 properties (Market Street); 1 property (Warwick Park); 1 property (Sussex Mews); at least 2 properties (London Road); 1 commercial property (Castle Street); 1 commercial property (Mount Pleasant Road) [TAB,PAG] (p7)</p></div><div class="nugget-popup quant"><p>one residential property; two commercial properties [MUL] (p18)</p></div><div class="nugget-popup quant"><p>0.15 m (depth of floodwater on the station track bed) [IMG] (p27)</p></div></div></body></div>`)[0];
