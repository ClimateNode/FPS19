                var html_d170e5580f088bf1b191bae75c15c327 = $(`<div id="html_d170e5580f088bf1b191bae75c15c327" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Tunbridge Wells Station</h1><div class="nugget-popup"><p>Railway track flooded from overflowing drainage, causing closure of the Tonbridge to Hastings line until flooding subsided. [TAB,PAG] (p7)</p></div><div class="nugget-popup"><p>Internal flooding to a commercial property on Mount Pleasant Road and highway flooding. At Tunbridge Wells Railway Station the railway track flooded from overflowing drainage, causing closure of the Tonbridge to Hastings line until flooding subsided. [PAG] (p8)</p></div><div class="nugget-popup"><p>Track bed flooded due to an overflowing manhole, causing inundation of the tracks and a temporary closure of the Tonbridge to Hastings rail line. [IMG] (p26)</p></div><div class="nugget-popup"><p>Track bed flooded due to an overflowing manhole, causing interruption to rail operations and a temporary closure of the Tonbridge to Hastings line. [PAG] (p27)</p></div><div class="nugget-popup"><p>Surcharging of the combined sewer was reported to have caused flooding to the track bed where it passes beneath the railway, resulting in disruption to train services. [MUL] (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 commercial property [PAG] (p8)</p></div><div class="nugget-popup quant"><p>0.15 m depth [IMG] (p26)</p></div><div class="nugget-popup quant"><p>0.15 m track bed depth; temporary closure of one rail service (Tonbridge to Hastings line) [PAG] (p27)</p></div></div></body></div>`)[0];

                var html_245992bf59d8ff5779d14203fc2f63fa = $(`<div id="html_245992bf59d8ff5779d14203fc2f63fa" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Nevill Street, Tunbridge Wells</h1><div class="nugget-popup"><p>Highway flooded and impassable by cars; fire service pumped out water from properties. [TAB,PAG] (p7)</p></div><div class="nugget-popup"><p>Two properties required pumping out by fire crews; the highway was flooded and impassable to cars. [PAG,IMG] (p8)</p></div><div class="nugget-popup"><p>Surface water ponding in excess of 0.5 m depth along Nevill Street between the junctions with London Road and Market Street; floodwater reached shop doorsteps and affected vehicles; floodwaters had deposited silt and gravel on the carriageway and sidewalks; the road had drained within two hours of rainfall ceasing. [IMG,PAG] (p15)</p></div><div class="nugget-popup"><p>Surface water / urban flooding at the low&ndash;lying junction with The Pantiles and Warwick Park (approx. 80.3mAOD). Flow routes converged in this low point, leading to inundation at street level and contributing to basement flooding of nearby buildings. Local media published photographs of flooding at this junction on the event date. (p16)</p></div><div class="nugget-popup"><p>Combined sewer network surcharged during intense rainfall causing drains to back up into properties; surface water could not enter the sewer network quickly enough and accumulated in low points, reaching depths sufficient to enter properties in some locations. [MUL] (p17)</p></div><div class="nugget-popup"><p>Highway drainage blockages caused by road resurfacing works (12&ndash;17 August 2015) and damaged drainage pipework near Nevill Street contributed to blocked drains and increased surface water flows toward low points, raising flood risk and contributing to internal flooding at nearby properties. [PAG,MUL] (p18)</p></div><div class="nugget-popup"><p>Surface water flooding during the 24 August 2015 event with highway gullies on the western side of Nevill Street (adjacent to the Pantiles) found during clean&ndash;up to contain some tarmac in their sumps; these deposits were not significant and did not block outlet pipes. A nearby manhole showed a build&ndash;up of silt at an access to a non&ndash;return valve but this was not causing a blockage; CCTV showed the non&ndash;return valve to be in full working order. Damaged pipework near Warwick Park (close to Nevill Street) from utility works was noted and may have contributed to higher surface water flows towards low points on Nevill Street. Small amounts of solid debris were recovered during maintenance/clean&ndash;up. [PAG] (p19)</p></div><div class="nugget-popup"><p>Internal flooding of properties requiring pumping out; drains were cleared by responders and CCTV survey of public drainage adjacent to Nevill Street was carried out to assess the system. (p20)</p></div><div class="nugget-popup"><p>Highway surface water flooding occurred in the Nevill Street/Warwick Park area during the intense rainfall on 24 August 2015, contributing to highway flooding and use of combined sewer capacity; investigation recommended directing highway drainage to the culverted River Grom to improve resilience and free up combined sewer capacity. (p29)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 properties; 2 fire engines [TAB,PAG] (p7)</p></div><div class="nugget-popup quant"><p>2 properties; 2 fire engines [PAG,IMG] (p8)</p></div><div class="nugget-popup quant"><p>0.5 m depth [IMG,PAG] (p15)</p></div></div></body></div>`)[0];

                var html_f9276b17989cc0788b9dfc144f9f968b = $(`<div id="html_f9276b17989cc0788b9dfc144f9f968b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Warwick Park, Tunbridge Wells</h1><div class="nugget-popup"><p>Flooded residential basements and gardens pumped out by fire service. One property internally flooded and gardens flooded due to an overflowing watercourse. Culvert headwall damaged by water flow. [TAB,PAG] (p7)</p></div><div class="nugget-popup"><p>One property experienced internal flooding (lower ground floor); gardens flooded due to an overflowing watercourse; a culvert headwall was damaged. Fire crews pumped out flooded residential basements and gardens using a light portable pump. [PAG,IMG] (p8)</p></div><div class="nugget-popup"><p>Warwick Park was reported flooded local to Nevill Street as part of the Pantiles area impact during the event; surface water ponding affected the park area. [PAG] (p15)</p></div><div class="nugget-popup"><p>Surface water / urban flooding affected Warwick Park during the event; the park lies at a low point adjacent to The Pantiles and Nevill Street so flow convergence caused inundation. Separately, Southern Water reported instances of foul and surface water flooding at Warwick Park due to hydraulic overload of sewers in 2009 and 2012. [PAG,MUL] (p16)</p></div><div class="nugget-popup"><p>Experienced hydraulic overload of foul and surface water sewers and flooding following intense rainfall; surface water accumulated in local low points and in some locations entered properties. The public sewer network serving Warwick Park was identified as having a blockage that reduced drainage capacity. [PAG,MUL] (p17)</p></div><div class="nugget-popup"><p>A piece of concrete blocked a combined sewer lateral feeding a submersible pump at Warwick Park, reducing drainage capacity and likely increasing the extent of flooding during the 24 August event; blocked highway drains and damaged pipework in the area also contributed to higher surface water flows toward low points and repeat internal flooding of nearby properties. [PAG,MUL] (p18)</p></div><div class="nugget-popup"><p>The River Grom overflowed the culvert entrance causing internal flooding to one property; gardens were inundated to depths in excess of 1 m; high flows and debris damaged the culvert headwall trash screen; drainage infrastructure was damaged and required repair; grit and stone accumulation affected the local submersible pumping station. [PAG] (p20)</p></div><div class="nugget-popup"><p>River Grom overflowed the culvert entrance during heavy rainfall, causing internal flooding of one property; floodwater collected in gardens to depths in excess of 1 m; high flows and debris damaged the culvert headwall trash screen and impeded flow. (p21)</p></div><div class="nugget-popup"><p>Surface water/highway flooding affected low spots in the Warwick Park area during the 24 August 2015 event; recommendation made for gulley cleaning to reduce future flood risk. (p29)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property; 1 fire engine [TAB,PAG] (p7)</p></div><div class="nugget-popup quant"><p>1 property; 1 fire engine [PAG,IMG] (p8)</p></div><div class="nugget-popup quant"><p>1 residential property; 2 commercial properties [PAG,MUL] (p18)</p></div><div class="nugget-popup quant"><p>one property; four drains [PAG] (p20)</p></div><div class="nugget-popup quant"><p>one property (p21)</p></div></div></body></div>`)[0];

                var html_3827052d55a1b415a9e524f29c7caf4f = $(`<div id="html_3827052d55a1b415a9e524f29c7caf4f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cumberland Walk, Tunbridge Wells</h1><div class="nugget-popup"><p>Nevill Street: two properties were pumped out by fire crews and the highway was flooded and impassable to cars. The Pantiles: commercial properties were internally flooded and the pedestrian area was flooded and impassable, with drains overwhelmed. Market Street: properties were pumped out and the highway was flooded and impassable. Warwick Park: residential basements and gardens flooded due to an overflowing watercourse, one property internally flooded and a culvert headwall was damaged by flow. [PAG] (p8)</p></div><div class="nugget-popup"><p>Listed as part of the Pantiles area affected by surface water ponding during the 24 August 2015 flooding event. (p15)</p></div><div class="nugget-popup"><p>A blockage caused by a piece of concrete was found in the public combined sewer leading from Cumberland Walk to a submersible pump at Warwick Park. This blocked lateral contributed to sewer surcharge and to flooding of the adjacent block of properties between Cumberland Walk, Nevill Park and Warwick Park during the event. (p17)</p></div><div class="nugget-popup"><p>The public sewer on Cumberland Walk is served by a submersible pump; Southern Water will assess the pump capacity and survey the sewer because pumping/sewer capacity issues contributed to sewer surcharging/flooding during the 24 August 2015 event. (p29)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 properties (Nevill Street); 2 fire engines (Nevill Street); 2 properties (Market Street); 1 property (Warwick Park) [PAG] (p8)</p></div></div></body></div>`)[0];

                var html_edc66a9d013422d58135aaeeadd27157 = $(`<div id="html_edc66a9d013422d58135aaeeadd27157" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Tunbridge Wells</h1><div class="nugget-popup"><p>Significant flooding in parts of Tunbridge Wells on 24 August 2015: several properties were inundated and there was disruption to traffic and transportation; the flooding was widespread across parts of the town. (p5)</p></div><div class="nugget-popup"><p>Tunbridge Wells experienced surface&ndash;water/urban flooding on 24 August 2015 that caused internal flooding to commercial and residential properties, flooded highways and pedestrian areas making them impassable, damage to drainage/culvert infrastructure and flooding of the railway track leading to line closure. [TAB,PAG] (p7)</p></div><div class="nugget-popup"><p>Central Tunbridge Wells locations (including The Pantiles, Nevill Street, Market Street, London Road, Castle Street and Mount Pleasant Road) experienced internal flooding of commercial and residential properties, impassable pedestrian and highway areas and localised transport disruption. [IMG] (p8)</p></div><div class="nugget-popup"><p>Widespread flooding across the town on 24 August 2015: commercial and residential properties internally flooded; highways and pedestrian areas flooded and impassable; railway track flooded causing closure of the Tonbridge&ndash;Hastings line; local watercourse/culvert damage (culvert headwall damaged). Emergency services pumped water from properties and basements. [IMG] (p9)</p></div><div class="nugget-popup"><p>Central Royal Tunbridge Wells (the Pantiles area) experienced surface&ndash;water/flash flooding concentrated at low points (junction of Nevill Street, The Pantiles and Warwick Park; Market Street; Sussex Mews). Floodwaters converged along flow routes with limited overland drainage; many buildings in the area (including those with basements below street level) were affected by flooding. The town has also experienced localised foul and surface&ndash;water sewer flooding in the Warwick Park area in earlier events. [IMG,MUL] (p16)</p></div><div class="nugget-popup"><p>Heavy rainfall and exceedance of public sewer capacity caused surface water and sewer&ndash;related flooding in the Tunbridge Wells area, including internal flooding of properties in the Cumberland Walk / Nevill Park / Warwick Park block. [MUL] (p18)</p></div><div class="nugget-popup"><p>Overflow of the River Grom at the entrance to a culvert in Warwick Park caused internal flooding to one private property; floodwater collected in several gardens to a depth in excess of 1 m. High flows and debris damaged the culvert headwall's trash screen and impeded flow, and the trash screen was unsafe to maintain during the high flows. [IMG] (p21)</p></div><div class="nugget-popup"><p>Tunbridge Wells Railway Station (within the town) had its track bed flooded when an overflowing manhole released water into the railway cutting, causing a temporary closure of the Tonbridge to Hastings line. [IMG] (p27)</p></div><div class="nugget-popup"><p>Intense rainfall on 24/08/2015 exceeded drainage capacity causing surface water to collect in topographic low points across Tunbridge Wells; flood depths reached levels that entered property. Combined sewer surcharge at Tunbridge Wells railway station caused flooding of the track bed. [PAG] (p28)</p></div><div class="nugget-popup"><p>Intense rainfall on 24 August 2015 caused surface water/urban flooding across Tunbridge Wells. Floodwater collected in topographical low points, producing highway and localised urban flooding throughout the town. [PAG] (p29)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 properties pumped out at Nevill Street; 2 properties pumped out at Market Street; 1 property internally flooded at Warwick Park; at least 2 properties externally affected on London Road; internal flooding to 1 commercial property at Castle Street; internal flooding to 1 commercial property at Mount Pleasant Road. [TAB,PAG] (p7)</p></div><div class="nugget-popup quant"><p>2 properties pumped out by 2 fire engines (Nevill Street); 2 properties pumped out by 2 fire engines (Market Street); 1 residential property internally flooded (Warwick Park); 1 lower&ndash;ground&ndash;floor property internally flooded (Sussex Mews); at least 2 properties affected externally (London Road); 1 commercial property internally flooded (Castle Street); 1 commercial property internally flooded (Mount Pleasant Road) [IMG] (p9)</p></div><div class="nugget-popup quant"><p>1 residential property; 2 commercial properties [MUL] (p18)</p></div><div class="nugget-popup quant"><p>one property; gardens flooded to a depth in excess of 1m [IMG] (p21)</p></div><div class="nugget-popup quant"><p>0.15 m depth to track bed [IMG] (p27)</p></div></div></body></div>`)[0];
