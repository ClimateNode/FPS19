                var html_6ef20e3235e0a883ad97cbf58e79b1fc = $(`<div id="html_6ef20e3235e0a883ad97cbf58e79b1fc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hills Meadow</h1><div class="nugget-popup"><p>Identified as part of the floodplain; subject to inundation during flood events and drained by Christchurch Ditch as part of the floodplain drainage network. (p7)</p></div><div class="nugget-popup"><p>Culvert at the eastern end of Hills Meadow was heavily blocked by a dense accumulation of woody debris and other materials, preventing normal outflow. Water pooled behind the blockage, restricting drainage and contributing to local flooding/ponding within the meadow and raising downstream flood risk until the obstruction was cleared. [IMG] (p36)</p></div><div class="nugget-popup"><p>Eastern end of Hills Meadow experienced flood&ndash;related issues: partial culvert blockage by woody debris and a tree growing into the footbridge, discarded/failed sandbags on the southern bank and muddy, waterlogged ground indicating recent inundation and erosion. [IMG,PAG] (p39)</p></div><div class="nugget-popup"><p>Christchurch Ditch within Hills Meadow contained woody debris, litter and vegetation that obstructed flow; a tree was growing against and deforming a brick wall/footbridge, causing visible structural damage. These obstructions and damaged structure were recorded after the flood and would have reduced conveyance and contributed to local flooding/flow restrictions. [PAG] (p40)</p></div><div class="nugget-popup"><p>Partial blockage of a culvert by woody debris and a tree growing into a footbridge at the eastern end of Hills Meadow (Lower Caversham), restricting channel conveyance and contributing to localised flooding/backwater during the 05 Jan 2024 &ndash; 07 Jan 2024 event. [PAG] (p41)</p></div><div class="nugget-popup"><p>Tree debris, vegetation and accumulated litter were present in Christchurch Ditch as it flows through Hills Meadow, with banks covered by weed and debris that obstruct the channel. [PAG] (p42)</p></div><div class="nugget-popup"><p>Identified on the Lower Caversham model and indicated as being within the modelled inundation and flow path area for the 1&ndash;in&ndash;30&ndash;year event, implying predicted inundation of the meadow area by overland/flow&ndash;path flooding. [IMG] (p48)</p></div></div></body></div>`)[0];

                var html_b1351dc44c4b97c70c0fb4b62b022af5 = $(`<div id="html_b1351dc44c4b97c70c0fb4b62b022af5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Reading Unitary Authority</h1><div class="nugget-popup"><p>Properties within Reading were affected by flooding. Flooding was exacerbated by localised surface water drainage problems and potentially raised groundwater within the river gravels; nearby brooks (including Dannalls Brook) and reaches of the River Thames and River Kennet within the borough are referenced as relevant watercourses. [PAG] (p6)</p></div><div class="nugget-popup"><p>River levels in Reading reached their highest level since 1947 in early January 2024, indicating significant river flooding of the borough during the event. (p10)</p></div><div class="nugget-popup"><p>River flooding from the River Thames (and high flows on the River Kennet) caused inundation of low&ndash;lying land in Reading and created conditions for property flooding; elevated river levels exceeded established thresholds and produced an extended period of above&ndash;normal river levels through January 2024. [PAG,IMG] (p12)</p></div><div class="nugget-popup"><p>Modelled fluvial inundation affected low&ndash;lying riverbanks and meadows in Lower Caversham (notably Christchurch Meadows and King's Meadow) and extends into adjacent urban areas. The modelled extents indicate schools and urban infrastructure in parts of Reading lie within the inundation envelopes for 1 in 20 to 1 in 1000 year events; the map suggests these areas were at risk during the reported flood event. It is unclear from this page alone which specific properties were observed flooded during 05&ndash;07 Jan 2024, as the figure shows modelled extents rather than confirmed property&ndash;level observations. [IMG,PAG] (p49)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>River Thames at Reading: exceeded property&ndash;flood threshold of 7.25m AD on 5 Jan 2024 (recorded 7.26m AD) and peaked at 7.54m AD on 7 Jan 2024; returned to consistently below 7.00m AD on 11 Jan 2024. River Kennet at Theale: exceeded normal range (1.05m AD) on 1 Jan 2024 and peaked at 1.78m AD on 6 Jan 2024; Kennet remained above normal from 1&ndash;27 Jan 2024. Event estimated at between a 1 in 30 and 1 in 50 year (2%&ndash;3.3% annual probability). [PAG,IMG] (p12)</p></div><div class="nugget-popup quant"><p>1 in 20 to 1 in 1000 year flood extents (including a 1 in 30 year medium&ndash;blue extent shown) [IMG,PAG] (p49)</p></div></div></body></div>`)[0];

                var html_113c5a024d25e6168d7dacc41086440f = $(`<div id="html_113c5a024d25e6168d7dacc41086440f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Kennet</h1><div class="nugget-popup"><p>River Kennet levels rose above the normal range and produced sustained high flows through January, contributing to elevated river levels upstream of Reading. [PAG] (p11)</p></div><div class="nugget-popup"><p>River levels at the Theale gauge exceeded the normal range and rose to a notable peak, indicating the Kennet was in flood and contributed to elevated river levels and mapped flood extents through Reading. [PAG,IMG] (p12)</p></div><div class="nugget-popup"><p>Water accumulating in the River Kennet floodplain flowed back northwards towards Circuit Lane (via under the railway bridge), causing backflows that contributed to internal property flooding; the River Kennet area was also the subject of Flood Alerts/Warnings during the period. [PAG] (p16)</p></div><div class="nugget-popup"><p>Flooding from the River Kennet inundated its floodplain and flowed northwards beneath Briscoe's Bridge. (p29)</p></div><div class="nugget-popup"><p>Backflow floodwater was present on the River Kennet floodplain north of Briscoe&#8217;s Bridge, inundating wooded floodplain areas with standing/backwater and causing saturated ground and fallen tree debris. [IMG] (p39)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1.78m AD peak on 06 Jan 2024; normal range top 1.05m AD; levels remained above normal from 01 Jan &ndash; 27 Jan 2024 [PAG] (p11)</p></div><div class="nugget-popup quant"><p>Maximum recorded level 1.78m AD on 6th January 2024; levels remained above the normal range from 1st &ndash; 27th January 2024. [PAG,IMG] (p12)</p></div></div></body></div>`)[0];

                var html_e7f9f6024db85443f192f600993950c2 = $(`<div id="html_e7f9f6024db85443f192f600993950c2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Circuit Lane, Reading Unitary Authority</h1><div class="nugget-popup"><p>Internal flooding of residential properties caused by backflow from the River Kennet floodplain via the area under the railway bridge and exceedance/blockage of the local ditch network (including a blocked culvert and woody debris). Duration of internal flooding is unknown. [PAG] (p16)</p></div><div class="nugget-popup"><p>Resident reports describe ditches and watercourses to the south of Circuit Lane being impacted by recent and previous flood events; blocked culverts and debris in the downstream channel impaired drainage and contributed to local flooding during the 05&ndash;07 Jan 2024 event. (p27)</p></div><div class="nugget-popup"><p>Roadway at the southern end was flooded across its full width, covering the road and adjacent grassy verge and rendering it impassable. [IMG,PAG] (p28)</p></div><div class="nugget-popup"><p>Ditch immediately south of Circuit Lane was recently cleared and contains standing water; excavation debris and a cleared channel were documented, indicating recent channel flow and maintenance to restore conveyance and reduce waterlogging/flooding risk to the adjacent road. [IMG] (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 residential properties (combined total for Circuit Lane and Sylvan Walk) [PAG] (p16)</p></div></div></body></div>`)[0];

="nugget-popup quant"><p>approx 1cm clearance under ground floor; back garden approx 3m away; garden areas passable (p26)</p></div></div></body></div>`)[0];

 from northwest, west and northeast and multiple flow paths affecting a broad area; community infrastructure (schools, churches) is shown within the modelled flood zone. [IMG,PAG] (p48)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Event estimated between a 1 in 30 and 1 in 50 year (2% &ndash; 3.3% annual probability) flood event. [IMG,PAG] (p12)</p></div></div></body></div>`)[0];

d western plots and inundated paths within the site. [IMG] (p35)</p></div><div class="nugget-popup"><p>Photograph and caption show a temporary bund under Briscoe's Bridge holding back water from the floodplain, demonstrating that floodwater reached the floodplain and was being retained by the bund to prevent further encroachment onto adjacent land. [IMG] (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 residential properties [IMG,PAG] (p16)</p></div></div></body></div>`)[0];
