                var html_1749e8e5088a83f9c4772511140f54bd = $(`<div id="html_1749e8e5088a83f9c4772511140f54bd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hills Meadow</h1><div class="nugget-popup"><p>Identified as part of the floodplain; subject to inundation during flood events and drained by Christchurch Ditch as part of the floodplain drainage network. (p7)</p></div><div class="nugget-popup"><p>A tree growing adjacent to and through the wingwall of the culvert at the eastern end of Hills Meadow was felled; the culvert and wingwall were inspected/identified for potential repair due to their role in conveying flows during the flood. [PAG] (p18)</p></div><div class="nugget-popup"><p>The footbridge at the eastern end provides access to the closed culvert section that was affected by the January 2024 flood; recommendations include reviewing/repairing the footbridge, wingwalls and damaged banks and installing a trash screen and gauge. (p19)</p></div><div class="nugget-popup"><p>Overflow from Christchurch Ditch reached the area by the blue benches in Hills Meadow and flowed into the Thames; footpaths and adjacent areas affected by ditch overflow. [TAB] (p23)</p></div><div class="nugget-popup"><p>Ditch overflowed from an adjacent path to the blue benches by Hills Meadow, inundating that area and contributing flow into the Thames. (p24)</p></div><div class="nugget-popup"><p>Culvert at the eastern end of Hills Meadow was heavily blocked by a dense accumulation of woody debris and other materials, preventing normal outflow. Water pooled behind the blockage, restricting drainage and contributing to local flooding/ponding within the meadow and raising downstream flood risk until the obstruction was cleared. [IMG] (p36)</p></div><div class="nugget-popup"><p>Eastern end of Hills Meadow experienced flood&ndash;related issues: partial culvert blockage by woody debris and a tree growing into the footbridge, discarded/failed sandbags on the southern bank and muddy, waterlogged ground indicating recent inundation and erosion. [IMG,PAG] (p39)</p></div><div class="nugget-popup"><p>Christchurch Ditch within Hills Meadow contained woody debris, litter and vegetation that obstructed flow; a tree was growing against and deforming a brick wall/footbridge, causing visible structural damage. These obstructions and damaged structure were recorded after the flood and would have reduced conveyance and contributed to local flooding/flow restrictions. [PAG] (p40)</p></div><div class="nugget-popup"><p>Partial blockage of a culvert by woody debris and a tree growing into a footbridge at the eastern end of Hills Meadow (Lower Caversham), restricting channel conveyance and contributing to localised flooding/backwater during the 05 Jan 2024 &ndash; 07 Jan 2024 event. [PAG] (p41)</p></div><div class="nugget-popup"><p>Tree debris, vegetation and accumulated litter were present in Christchurch Ditch as it flows through Hills Meadow, with banks covered by weed and debris that obstruct the channel. [PAG] (p42)</p></div><div class="nugget-popup"><p>Identified on the Lower Caversham model and indicated as being within the modelled inundation and flow path area for the 1&ndash;in&ndash;30&ndash;year event, implying predicted inundation of the meadow area by overland/flow&ndash;path flooding. [IMG] (p48)</p></div></div></body></div>`)[0];

                var html_3c5df3c8886f2f6fc8235fce9160bd92 = $(`<div id="html_3c5df3c8886f2f6fc8235fce9160bd92" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Linear Park</h1><div class="nugget-popup"><p>Culverted and open channels within Linear Park (on land owned by RBC) were implicated in the flooding: a ditch immediately south of Circuit Lane was blocked by woody debris and a culvert at the northern end was found blocked by sheet piling/partially collapsed, significantly reducing flows and contributing to local backflow and property flooding. (p16)</p></div></div></body></div>`)[0];

                var html_e1db3408c01720661c4c23c21edbd08f = $(`<div id="html_e1db3408c01720661c4c23c21edbd08f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Heron Island</h1><div class="nugget-popup"><p>The side&ndash;channel/pond area where Christchurch Ditch outfalls at Heron Island was reported as choked with trees and vegetation and the nearby marina had silt build&ndash;up, reducing capacity to receive and convey floodwater during the January 2024 event. (p13)</p></div><div class="nugget-popup"><p>The side&ndash;channel/pond where Christchurch Ditch outfalls at Heron Island had become choked with trees and vegetation, and residents raised concerns about silt build&ndash;up in the marina area to the west of Heron Island. Debris carried by floodwaters accumulated in Christchurch Ditch and partly blocked culverts. A boat stuck on the Caversham weir downstream of Heron Island was not removed for several weeks and may have impeded flows during the flood event. [PAG] (p14)</p></div><div class="nugget-popup"><p>Public footpath adjacent to residential properties at Heron Island bordered the cleared section of Christchurch Ditch; outfall structure at Heron Island is overgrown and the closed culvert outfall cannot currently be viewed, indicating obstruction issues addressed as part of post&ndash;flood works. [PAG] (p18)</p></div><div class="nugget-popup"><p>The Christchurch Ditch outfall at Heron Island was overgrown and could not be inspected as part of post&ndash;flood investigations; included in recommended CCTV survey and repair actions following the January 2024 flood. (p19)</p></div><div class="nugget-popup"><p>The outfall location at Heron Island was blocked by thick vegetation, preventing access to the ditch outfall during the flood investigation on 7 Jan 2024 and likely hindering inspection or maintenance actions during the flood period. [IMG] (p31)</p></div><div class="nugget-popup"><p>A closed section of culvert at Heron Island and accumulation of excessive woody debris along the channel leading to the culvert entry were observed; these obstructions contributed to restricted flow and localised flooding issues. (p43)</p></div></div></body></div>`)[0];
                popup_1751b5cf9844a18adb286559458d70e7.setContent(html_e1db3408c01720661c4c23c21edbd08f);

                var html_b65e72722c8bbc9263b04dadd41c130d = $(`<div id="html_b65e72722c8bbc9263b04dadd41c130d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Holy Brook</h1><div class="nugget-popup"><p>Exceedance of the capacity of the local network of ditches connected to Holy Brook contributed to flooding of nearby properties through backflow and reduced conveyance capacity. (p16)</p></div><div class="nugget-popup"><p>Collapse of bank and damage to adjacent footpath north of the railway line; flood damage to ditch and river banks and adjacent footpaths recorded; allotment holders adjacent to the Holy Brook were unable to access plots due to flooding. (p17)</p></div><div class="nugget-popup"><p>Bank and footpath repairs were undertaken to the Holy Brook east of Briscoe's Bridge as a response to flood damage affecting the watercourse corridor. (p18)</p></div><div class="nugget-popup"><p>Flooding of the Holy Brook and connected ditch network during the January 2024 event caused damage to banks and adjacent footpaths, and led to obstructed flow in associated ditches and culverts requiring clearance or repair. The event prompted temporary measures (e.g. clay bunds to reduce backflows), and recommendations to install a level gauge and establish a regular checking/maintenance schedule. (p19)</p></div><div class="nugget-popup"><p>Holy Brook was identified as an associated watercourse in the January 2024 flood event and is targeted for further monitoring and mitigation (installation of a water level gauge) following internal property flooding across the borough. (p21)</p></div><div class="nugget-popup"><p>Holy Brook and its associated culverts had debris and blockages (including near Briscoe's Bridge and the Network Rail culvert), reducing conveyance and contributing to localised flooding and drainage failure observed around 05 Jan 2024. [IMG] (p27)</p></div><div class="nugget-popup"><p>Flooding damaged the river banks west of Briscoe's Bridge; temporary repairs were carried out to the damaged banks as post&ndash;flood works. (p45)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>21 residential properties; 3 commercial properties (p21)</p></div></div></body></div>`)[0];

                var html_ef1b75bab0ae6f24e664ecba9bcdde3f = $(`<div id="html_ef1b75bab0ae6f24e664ecba9bcdde3f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Reading Unitary Authority</h1><div class="nugget-popup"><p>Properties within Reading were affected by flooding. Flooding was exacerbated by localised surface water drainage problems and potentially raised groundwater within the river gravels; nearby brooks (including Dannalls Brook) and reaches of the River Thames and River Kennet within the borough are referenced as relevant watercourses. [PAG] (p6)</p></div><div class="nugget-popup"><p>River levels in Reading reached their highest level since 1947 in early January 2024, indicating significant river flooding of the borough during the event. (p10)</p></div><div class="nugget-popup"><p>River flooding from the River Thames (and high flows on the River Kennet) caused inundation of low&ndash;lying land in Reading and created conditions for property flooding; elevated river levels exceeded established thresholds and produced an extended period of above&ndash;normal river levels through January 2024. [PAG,IMG] (p12)</p></div><div class="nugget-popup"><p>Residents across Reading borough were affected by flooding arising from the rivers and associated watercourses; internal flooding of properties was reported and required local authority investigation and response. [PAG] (p21)</p></div><div class="nugget-popup"><p>Modelled fluvial inundation affected low&ndash;lying riverbanks and meadows in Lower Caversham (notably Christchurch Meadows and King's Meadow) and extends into adjacent urban areas. The modelled extents indicate schools and urban infrastructure in parts of Reading lie within the inundation envelopes for 1 in 20 to 1 in 1000 year events; the map suggests these areas were at risk during the reported flood event. It is unclear from this page alone which specific properties were observed flooded during 05&ndash;07 Jan 2024, as the figure shows modelled extents rather than confirmed property&ndash;level observations. [IMG,PAG] (p49)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>River Thames at Reading: exceeded property&ndash;flood threshold of 7.25m AD on 5 Jan 2024 (recorded 7.26m AD) and peaked at 7.54m AD on 7 Jan 2024; returned to consistently below 7.00m AD on 11 Jan 2024. River Kennet at Theale: exceeded normal range (1.05m AD) on 1 Jan 2024 and peaked at 1.78m AD on 6 Jan 2024; Kennet remained above normal from 1&ndash;27 Jan 2024. Event estimated at between a 1 in 30 and 1 in 50 year (2%&ndash;3.3% annual probability). [PAG,IMG] (p12)</p></div><div class="nugget-popup quant"><p>21 residential properties; 3 commercial properties; internal flooding reported between 05 Jan 2024 &ndash; 07 Jan 2024 and persisted for up to 10 days [PAG] (p21)</p></div><div class="nugget-popup quant"><p>1 in 20 to 1 in 1000 year flood extents (including a 1 in 30 year medium&ndash;blue extent shown) [IMG,PAG] (p49)</p></div></div></body></div>`)[0];
                popup_04df43b320f1e6decedd7377b6652c11.setContent(html_ef1b75bab0ae6f24e664ecba9bcdde3f);

                var html_5564b7adbd506ab814a9012a997fc13a = $(`<div id="html_5564b7adbd506ab814a9012a997fc13a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Thames</h1><div class="nugget-popup"><p>River levels in Reading exceeded the property&ndash;flooding threshold and reached their highest measured levels since 1947, causing flooding of low&ndash;lying land and creating conditions for property flooding in the borough. [IMG] (p11)</p></div><div class="nugget-popup"><p>Elevated Thames river levels threatened direct flooding of the area; a raised/bunded area south of Christchurch Ditch prevented direct Thames flooding but also impeded drainage back to the Thames as levels fell during the January 2024 event. (p13)</p></div><div class="nugget-popup"><p>High River Thames levels prompted a Flood Alert (31 Dec 2023) for the reach between Mapledurham and Sonning and a Flood Warning (5 Jan 2024) for properties from Scours Lane to Caversham Lakes. River flooding contributed to overtopping and impeded drainage in Lower Caversham, resulting in exterior and basement flooding at the eastern end of Queens Road from the evening of 5 Jan and internal ground&ndash;floor flooding of properties on 7 Jan. Basement water levels had fully receded by 15 Jan (basement inundation lasted 10 days). The raised/bunded ground south of Christchurch Ditch protected from direct Thames inundation but slowed drainage back to the Thames as levels receded. [PAG] (p14)</p></div><div class="nugget-popup"><p>High River Thames flows and out&ndash;of&ndash;bank conditions contributed to fluvial water entering local drainage (Christchurch Ditch) and driving floodwater into Lower Caversham. This fluvial influence formed part of the cause of internal and external flooding in Queens Road and neighbouring streets. [IMG] (p15)</p></div><div class="nugget-popup"><p>Flooding of land adjacent to the River Thames made the Thames Path, public green spaces and play areas temporarily unavailable. (p17)</p></div><div class="nugget-popup"><p>River Thames flooding during the January 2024 event caused internal flooding to residential properties in Reading borough and was the primary source of the flood event affecting the area. [PAG] (p20)</p></div><div class="nugget-popup"><p>High river levels on the River Thames exceeded channel and floodplain capacity and were a primary cause of the January 2024 flooding that led to internal flooding of properties in Reading borough. [PAG] (p21)</p></div><div class="nugget-popup"><p>River levels rose to record/near&ndash;record heights, flooding the Thames Path, Christchurch Meadow and the metal path under Reading Bridge; high river level contributed to Christchurch Ditch filling and downstream overflow into gardens and paths. [TAB] (p23)</p></div><div class="nugget-popup"><p>Elevated river levels (exceeding previous record) were reported and the Thames received overflow from local channels/ditch, contributing to backwater and riverside flooding impacting adjacent paths and properties. (p24)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>7.26m AD (threshold exceeded on 05 Jan 2024); 7.54m AD peak on 07 Jan 2024; property&ndash;flooding threshold 7.25m AD [IMG] (p11)</p></div><div class="nugget-popup quant"><p>10 days [PAG] (p14)</p></div><div class="nugget-popup quant"><p>16 residential properties reported internal flooding; 3 commercial properties reported internal flooding; an additional 33 residential properties reported garden/outbuilding flooding; 1 additional commercial property reported external flooding; 2 properties reported loss of electricity; flood duration (for basements) 10 days [IMG] (p15)</p></div><div class="nugget-popup quant"><p>21 residential properties [PAG] (p20)</p></div><div class="nugget-popup quant"><p>21 residential properties; 3 commercial properties [PAG] (p21)</p></div><div class="nugget-popup quant"><p>Reading river level observed at ~7.2 m (rise), 7.38 m (06/01/2024 11:09), and observed exceeding previous record 7.41 m, reaching 7.44 m (06/01/2024 18:20). [TAB] (p23)</p></div></div></body></div>`)[0];

                var html_6cb639cf6b9a19e29ab70dd637c057d0 = $(`<div id="html_6cb639cf6b9a19e29ab70dd637c057d0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Kennet</h1><div class="nugget-popup"><p>River Kennet levels rose above the normal range and produced sustained high flows through January, contributing to elevated river levels upstream of Reading. [PAG] (p11)</p></div><div class="nugget-popup"><p>River levels at the Theale gauge exceeded the normal range and rose to a notable peak, indicating the Kennet was in flood and contributed to elevated river levels and mapped flood extents through Reading. [PAG,IMG] (p12)</p></div><div class="nugget-popup"><p>Residents in Southcote reported that sluice gates on the River Kennet may have been deployed, releasing water into the adjacent floodplain and contributing to unusually rapid local flooding and overtopping of ditches/culverts. (p13)</p></div><div class="nugget-popup"><p>Overbank flooding associated with the River Kennet prompted Flood Alerts and was linked to flooding risk for properties adjacent to the river; the River Kennet / Holy Brook flooding is the context for reported residential flooding in the downstream Reading/Southcote area. (p15)</p></div><div class="nugget-popup"><p>Water accumulating in the River Kennet floodplain flowed back northwards towards Circuit Lane (via under the railway bridge), causing backflows that contributed to internal property flooding; the River Kennet area was also the subject of Flood Alerts/Warnings during the period. [PAG] (p16)</p></div><div class="nugget-popup"><p>Flooding caused damage to river banks and adjacent footpaths in Katesgrove; areas adjacent to the River Kennet were recorded as flooded and contributed to temporary unavailability of nearby recreational facilities. (p17)</p></div><div class="nugget-popup"><p>Flooding of the River Kennet contributed to bank and footpath damage adjacent to Katesgrove; the affected section is designated as part of the Kennet and Avon Canal and falls under CRT responsibility. (p18)</p></div><div class="nugget-popup"><p>High river levels on the River Kennet, together with the River Thames and associated watercourses, contributed to flooding that affected residents and properties in Reading borough. (p21)</p></div><div class="nugget-popup"><p>Flooding from the River Kennet inundated its floodplain and flowed northwards beneath Briscoe's Bridge. (p29)</p></div><div class="nugget-popup"><p>Backflow floodwater was present on the River Kennet floodplain north of Briscoe&#8217;s Bridge, inundating wooded floodplain areas with standing/backwater and causing saturated ground and fallen tree debris. [IMG] (p39)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1.78m AD peak on 06 Jan 2024; normal range top 1.05m AD; levels remained above normal from 01 Jan &ndash; 27 Jan 2024 [PAG] (p11)</p></div><div class="nugget-popup quant"><p>Maximum recorded level 1.78m AD on 6th January 2024; levels remained above the normal range from 1st &ndash; 27th January 2024. [PAG,IMG] (p12)</p></div><div class="nugget-popup quant"><p>21 residential properties; 3 commercial properties (p21)</p></div></div></body></div>`)[0];

                var html_32612663f9434c8785ac162e3c89225d = $(`<div id="html_32612663f9434c8785ac162e3c89225d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Circuit Lane, Reading Unitary Authority</h1><div class="nugget-popup"><p>Local ditches and culverts around Circuit Lane were reported as poorly maintained and carrying accumulated debris, which reduced channel capacity and led to overtopping of the local ditch network during the January 2024 flood event. (p13)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties caused by backflow from the River Kennet floodplain via the area under the railway bridge and exceedance/blockage of the local ditch network (including a blocked culvert and woody debris). Duration of internal flooding is unknown. [PAG] (p16)</p></div><div class="nugget-popup"><p>Internal (ground&ndash;floor) flooding of residential properties reported during the January 2024 event. (p17)</p></div><div class="nugget-popup"><p>The ditch immediately south of Circuit Lane was cleared; sheet piling discovered in the channel (on private land) was blocking the downstream face of the culvert and the culvert was also blocked by material upstream, reducing the ditch's capacity to convey flood flows and requiring further investigation. (p18)</p></div><div class="nugget-popup"><p>Circuit Lane was at risk from backflow from the floodplain during the January 2024 flood; temporary clay bunding reduced backflow and reinstatement of culvert flow (including discussion of sheet piling removal) was recommended. (p19)</p></div><div class="nugget-popup"><p>Resident reports describe ditches and watercourses to the south of Circuit Lane being impacted by recent and previous flood events; blocked culverts and debris in the downstream channel impaired drainage and contributed to local flooding during the 05&ndash;07 Jan 2024 event. (p27)</p></div><div class="nugget-popup"><p>Roadway at the southern end was flooded across its full width, covering the road and adjacent grassy verge and rendering it impassable. [IMG,PAG] (p28)</p></div><div class="nugget-popup"><p>Ditch immediately south of Circuit Lane was recently cleared and contains standing water; excavation debris and a cleared channel were documented, indicating recent channel flow and maintenance to restore conveyance and reduce waterlogging/flooding risk to the adjacent road. [IMG] (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 residential properties (combined total for Circuit Lane and Sylvan Walk) [PAG] (p16)</p></div><div class="nugget-popup quant"><p>4 residential properties (across Circuit Lane and Sylvan Walk) (p17)</p></div></div></body></div>`)[0];

                var html_876307e10ad69b6e0209af422d3c2c16 = $(`<div id="html_876307e10ad69b6e0209af422d3c2c16" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Queens Road, Caversham</h1><div class="nugget-popup"><p>Exterior and basement flooding began late evening 5 January; internal ground&ndash;floor flooding of several properties occurred on 7 January. Floodwaters flowed via residential gardens, public footpaths and roads into Queens Road and then extended to adjacent streets. Basement water levels had fully receded by 15 January, giving a total flood duration of 10 days. (p14)</p></div><div class="nugget-popup"><p>Properties at the eastern end experienced exterior and basement flooding beginning late evening 5 Jan, with internal ground&ndash;floor flooding of multiple properties on 7 Jan. Floodwater reached fronts of properties due to exceedance of surface water drainage causing street pooling. Sandbags and airbrick covers were provided by RBC on 7 Jan to mitigate rising water. Residents reported basement flooding potentially linked to rising groundwater through river gravels; basements receded by 15 Jan. [PAG] (p15)</p></div><div class="nugget-popup"><p>Local surface water drainage network in Queens Road was checked and cleared by the RBC Highways Team as a post&ndash;flood intervention to restore drainage capacity following the flood event. (p18)</p></div><div class="nugget-popup"><p>A Queen's Road resident reported observed flow of floodwater from Christchurch Ditch northwards into Lower Caversham. The resident recorded water levels in and around their property and provided a timeline of flooding that affected their property and adjacent properties between 5th and 15th January 2024. [IMG] (p22)</p></div><div class="nugget-popup"><p>Back gardens and access paths flooded by overflow from Christchurch Ditch; basement flooding in multiple properties (rising to and above ground&ndash;floor level in some cases), outbuildings flooded to skirting/damp&ndash;course level, water reached front doors and flooded cycle path and pavements. Electrical issues/partial loss of electricity at some properties; residents required pumping and bailing; sandbags provided by council; fire brigade attended and advised turning off ground&ndash;floor electricity. [TAB] (p23)</p></div><div class="nugget-popup"><p>Back gardens and access paths filled and continued to rise; water from gardens and a nearby apartment block car park flooded the cycle path and overflowed into Queen's Road gardens; cycle path and pavements flooded, water flowed across fronts of houses at the eastern end, reached front doors and flooded beyond parking bay lines; footpaths behind Queen's Road filled from Ditch overflow; an outbuilding was surrounded and flooded up to below its damp course; water rose to the gate level of one property; one property experienced a partial loss of electricity; basement level conditions reported for one property. [PAG] (p24)</p></div><div class="nugget-popup"><p>Basements and gardens at the eastern end flooded: water from an apartment block car park overflowed into a Queens Road garden and gardens filled rapidly. Multiple basements experienced rising floodwater (including one basement reaching ground floor level), kitchens began to flood, residents used bailing and pumping to try to mitigate levels, RBC placed sandbags at the front of houses and airbrick covers were applied, outbuilding flooded up to seat level, back gardens flooded to approximately 1m from the houses, and Fire Brigade attended and advised isolating ground&ndash;floor electricity. [PAG] (p25)</p></div><div class="nugget-popup"><p>Floodwater at the eastern end of Queens Road flooded in front of properties. Basement flood levels rose then began to drop; clearance under ground floor later recorded at approximately 1 cm. Front&ndash;of&ndash;property water reached the gutter; back garden floodwater came within about 3 m of houses. Garden areas were passable with wellies as levels receded. (p26)</p></div><div class="nugget-popup"><p>Floodwater overflowed onto the road and pavement at the entrance to Queens Road (opposite Coldicutt Street), partially submerging the carriageway and making passage difficult or impossible for vehicles and pedestrians. [IMG,PAG] (p32)</p></div><div class="nugget-popup"><p>Pavement and part of the carriageway were flooded, blocking pedestrian access and partially encroaching onto the road. The flooding made the street impassable for pedestrians and reduced vehicle access; water was observed reflecting houses and reaching close to property entrances. [IMG,PAG] (p33)</p></div><div class="nugget-popup"><p>Floodwater covered part of the carriageway and pavement at the eastern end of Queens Road (opposite Coldicutt Street), inundating the road and pedestrian areas and affecting parked vehicles and access to properties. [IMG,PAG] (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>10 days (p14)</p></div><div class="nugget-popup quant"><p>6 inches (basement flooding on 07/01/2024); 25 cm gap between floodwater and ground floor (0937 on 07/01/2024); 30 cm gap from top of floodwater to ground floor (1040 on 07/01/2024); 20 cm gap (1155 on 07/01/2024); back garden flood approx. 1 m from house (1153 on 07/01/2024); basement ~38 cm deep (10/01/2024); garden shed in 50 cm of water (08/01/2024); approx. 1 cm clearance under ground floor as water receded (23:09&ndash;23:11 on 06/01/2024); approx. 3 m (back garden distance to water at 09:03 on 08/01/2024); two properties pumping; two properties bailing [TAB] (p23)</p></div><div class="nugget-popup quant"><p>one property (partial electricity loss); one property's gate level reached; one outbuilding flooded; one basement referenced with a 25cm gap to ground&ndash;floor level [PAG] (p24)</p></div><div class="nugget-popup quant"><p>one property with 30cm gap; one property with 20cm gap; approx 1cm gap; one property with 16cm gap; kitchen flood levels 2&ndash;3cm; back garden approx 1m from house; two properties bailing; basement reached ground floor level [PAG] (p25)</p></div><div class="nugget-popup quant"><p>approx 1cm clearance under ground floor; back garden approx 3m away; garden areas passable (p26)</p></div></div></body></div>`)[0];

                var html_5d2e849205e52473d4445ef139b308f3 = $(`<div id="html_5d2e849205e52473d4445ef139b308f3" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lower Caversham</h1><div class="nugget-popup"><p>Mapped flood extents show inundation of low&ndash;lying areas adjacent to the river in Lower Caversham during the January 2024 event; public consultation was held for affected residents indicating the area experienced flood impacts. [IMG,PAG] (p12)</p></div><div class="nugget-popup"><p>Rapid onset flooding in January 2024 gave residents little time to prepare. Surface water drainage capacity was exceeded in parts of the area. Sandbags were provided on 7 January 2024 which helped prevent water entering the front of properties but were too late to prevent flooding of gardens and outbuildings that had already begun. Late or no flood warnings were reported by some residents. (p13)</p></div><div class="nugget-popup"><p>Residential properties at the eastern end of Queens Road experienced exterior and basement flooding from late evening 5 Jan; internal ground&ndash;floor flooding of several properties occurred on 7 Jan. Basement water levels fully receded by 15 Jan (total flood duration 10 days). Flooding arose from exceedance of Christchurch Ditch capacity and culvert blockages by debris, with floodwater flowing via gardens, footpaths and roads into Queens Road and then to Mill Road, Coldicutt Street, Champion Road, Piggott's Road and Mill Green. Sandbags provided on 7 Jan reduced front&ndash;of&ndash;property inundation but were too late to prevent gardens/outbuildings already flooding. A raised bund to the south of Christchurch Ditch slowed drainage back to the Thames, prolonging inundation. A boat stuck on Caversham weir downstream of Heron Island was reported and may have impeded flows during the event. [PAG] (p14)</p></div><div class="nugget-popup"><p>Floodwater from Christchurch Ditch and the River Thames entered the area via residential gardens, footpaths and roads causing internal and external flooding. Basements and ground floors were flooded; front gardens and outbuildings were also inundated. Stantec modelling and a resident sketch show converging flow paths across Lower Caversham during the event. Basement water levels had fully receded by 15 Jan (total reported flood duration of ~10 days). [IMG,PAG] (p15)</p></div><div class="nugget-popup"><p>Area was included within the scope of River Thames flood alerts and reviews following the January 2024 River Thames flood event affecting Reading borough. (p20)</p></div><div class="nugget-popup"><p>Floodwaters, including flow from Christchurch Ditch northwards, affected Lower Caversham; RBC cleared debris and blockages in ditches within this area as part of the response. [PAG] (p21)</p></div><div class="nugget-popup"><p>Lower Caversham received floodwater flowing northwards from Christchurch Ditch, resulting in inundation of the low&ndash;lying area and impacts to nearby properties as reported by residents. (p22)</p></div><div class="nugget-popup"><p>Surface water flooding affected roads and pavements in Lower Caversham (notably Queens Road at the entrance opposite Coldicutt Street), impeding vehicular and pedestrian movement in the residential area. [IMG,PAG] (p32)</p></div><div class="nugget-popup"><p>Residential streets in the area were inundated: roads and pavements (notably Queens Road and the Queens Road/Mill Road junction) were submerged, front gardens were reached by floodwater and routes were rendered impassable for pedestrians and vehicles. [IMG,PAG] (p33)</p></div><div class="nugget-popup"><p>Residential streets in Lower Caversham (including Queens Road and Mill Green) experienced flooding. Inundation extended into Caversham Meadow and Christchurch Ditch (photo from Reading Bridge documents extent), impacting roads, pavements, parked vehicles and local access. [IMG,PAG] (p34)</p></div><div class="nugget-popup"><p>Modelled 1&ndash;in&ndash;30&ndash;year flood flow paths and present&ndash;day modelled 1&ndash;in&ndash;20 to 1&ndash;in&ndash;1000 year extents indicate predicted inundation across central and southern Lower Caversham, with flow converging from northwest, west and northeast and multiple flow paths affecting a broad area; community infrastructure (schools, churches) is shown within the modelled flood zone. [IMG,PAG] (p48)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Event estimated between a 1 in 30 and 1 in 50 year (2% &ndash; 3.3% annual probability) flood event. [IMG,PAG] (p12)</p></div><div class="nugget-popup quant"><p>10 days [PAG] (p14)</p></div><div class="nugget-popup quant"><p>Sixteen residential properties (internal flooding); three commercial properties (internal flooding on Amersham Road); an additional thirty&ndash;three residential properties (gardens/outbuildings flooded); one additional commercial property (external flooding); two properties (loss of electricity supply) [IMG,PAG] (p15)</p></div></div></body></div>`)[0];
                popup_6f373349db39737852966ed3f81ef186.setContent(html_5d2e849205e52473d4445ef139b308f3);

                var html_1e04c134c39b72ca695179e5faf5da08 = $(`<div id="html_1e04c134c39b72ca695179e5faf5da08" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Southcote</h1><div class="nugget-popup"><p>Residential properties flooded at the south end of Circuit Lane and Sylvan Walk, reported in the Southcote / Holy Brook &ndash; River Kennet flood investigation section. (p15)</p></div><div class="nugget-popup"><p>Backflow of water from the River Kennet floodplain and exceedance of local ditch/channel capacity (including culverted and open channels in Linear Park) caused floodwater to flow northwards under the railway towards residential areas. Blocked ditches (woody debris) and a blocked/partially collapsed culvert reduced conveyance, contributing to internal flooding of houses on Circuit Lane and Sylvan Walk. [IMG,PAG] (p16)</p></div><div class="nugget-popup"><p>Debris build&ndash;up was observed north of the railway bridge (Briscoe's Bridge) in Southcote on 05 Jan 2024; debris and bridge/culvert issues impeded flow and contributed to localised flooding risk. [PAG] (p27)</p></div><div class="nugget-popup"><p>Areas in Southcote experienced flooding: debris and water accumulation north of Briscoe's Bridge (river overbank flow from the River Kennet floodplain) and surface water flooding at the southern end of Circuit Lane making the lane impassable. [IMG,PAG] (p28)</p></div><div class="nugget-popup"><p>Damage to post&ndash;2014 bank works and path repairs near Holybrook overbridge was reported; a muddy, partially flooded path with standing water leading to a brick&ndash;arch underpass was photographed. [PAG] (p29)</p></div><div class="nugget-popup"><p>Local flooding eroded a repaired river bank and damaged an adjacent footpath near Holybrook Overbridge; damage was recorded by a resident and photographed. [PAG] (p30)</p></div><div class="nugget-popup"><p>An allotment site south of Brunel Road was flooded: standing water covered plots and adjacent areas, with sheds and greenhouses partially submerged. Flooding was concentrated on the northern and western plots and inundated paths within the site. [IMG] (p35)</p></div><div class="nugget-popup"><p>Photograph and caption show a temporary bund under Briscoe's Bridge holding back water from the floodplain, demonstrating that floodwater reached the floodplain and was being retained by the bund to prevent further encroachment onto adjacent land. [IMG] (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 residential properties [IMG,PAG] (p16)</p></div></div></body></div>`)[0];
                popup_99273df0ab411e5194485caae2bb3385.setContent(html_1e04c134c39b72ca695179e5faf5da08);
            
        

        marker_45ab9fe0e4836d5ea2fc0203188b742b.bindPopup(popup_99273df0ab411e5194485caae2bb3385)
