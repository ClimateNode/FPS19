                var html_909e91c96281d798f4159a439c2ef9d5 = $(`<div id="html_909e91c96281d798f4159a439c2ef9d5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Alder Stream</h1><div class="nugget-popup"><p>River levels rose quickly and overtopped the riverbanks; this overtopping contributed to overbank and overland flow into Five Oak Green, causing flooding of properties. (p1)</p></div><div class="nugget-popup"><p>Rapid rise in flows in the Alder Stream during intense rainfall on 9 February 2020, causing localised flooding in the Five Oak Green catchment. Peak flow on the Alder Stream was reported earlier (approximately 18:30&ndash;19:30) than peaks recorded on nearby gauged rivers. (p5)</p></div><div class="nugget-popup"><p>The Alder Stream was the locus of fluvial flood risk in Five Oak Green; areas adjacent to the stream (including along Alders Road and through the centre of Five Oak Green) experienced flooding consistent with reported properties affected during Storm Ciara. Flows are noted as being well contained within the watercourse upstream of Capel, but surface water flow paths and local depressions also contributed to flooding in the village. (p8)</p></div><div class="nugget-popup"><p>High flows in the Alder Stream overtopped banks during the flood event and contributed to flooding that affected the nearby settlement of Five Oak Green. [IMG,PAG] (p11)</p></div><div class="nugget-popup"><p>During Storm Ciara (9th February 2020) intense evening rainfall caused flows in Alder Stream to overtop its banks. Overtopping occurred upstream of the culvert under Five Oak Green Road; peak flows overtopped the channel and contributed to floodwater entering the locality while highway drainage and the local sewer network became overwhelmed and could not discharge to the stream. [IMG,PAG] (p12)</p></div><div class="nugget-popup"><p>Alder Stream overtopped its banks upstream of the culvert beneath Five Oak Green Road (overtopping reported at approximately 20:00). The overtopping caused the local surface water drainage system to be unable to discharge to the watercourse, leading to surcharging of drains and surface water flooding of roads and properties in central Five Oak Green. [IMG,PAG] (p13)</p></div><div class="nugget-popup"><p>Overtopped its banks during Storm Ciara (9 Feb 2020), producing high river levels that contributed to local drainage systems surcharging and to flooding in downstream areas. (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 40 properties (p1)</p></div><div class="nugget-popup quant"><p>flood depths up to approximately 30 cm internally (reported in main area of Five Oak Green) [IMG,PAG] (p13)</p></div></div></body></div>`)[0];

                var html_7886d94d641571ba9a8d4d914efe5ea0 = $(`<div id="html_7886d94d641571ba9a8d4d914efe5ea0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Five Oak Green</h1><div class="nugget-popup"><p>A concentrated cluster of reported flood incidents (map shows majority clustered in and around Five Oak Green) &mdash; residents were surveyed in September 2020 to collate information about the flood extents and impacts in the area. [IMG] (p2)</p></div><div class="nugget-popup"><p>Localised flooding in Five Oak Green caused by rapid response of the Alder Stream to intense, locally exceptional rainfall during Storm Ciara. Flooding of this magnitude was restricted to Five Oak Green within the county. [PAG] (p5)</p></div><div class="nugget-popup"><p>During Storm Ciara the village experienced flooding driven by surface water runoff and fluvial overflow of the Alder Stream. Flood extents in the village matched high&ndash;risk areas on Environment Agency maps and locations of reported properties affected by the Storm Ciara event. (p8)</p></div><div class="nugget-popup"><p>Five Oak Green has experienced fluvial flooding associated with the River Medway. The report records multiple historic flood events affecting the settlement and indicates it was affected by the flood event on 9 February 2020. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>The settlement experienced river (fluvial) flooding associated with the Alder Stream during the event; properties in the village were affected by overtopping flows. [IMG] (p11)</p></div><div class="nugget-popup"><p>On 9th February 2020 (Storm Ciara) intense rainfall led to Alder Stream overtopping through the centre of Five Oak Green and, concurrently, highway drainage and the local sewer network were overwhelmed and unable to discharge into the stream. Properties located along Alders Road were affected by the resulting flooding. Local natural flood management measures in the catchment were operating but were limited in extent and not considered likely to have significantly reduced flooding at Five Oak Green. [PAG] (p12)</p></div><div class="nugget-popup"><p>Surface water drainage in the main area of Five Oak Green surcharged and ponded because the watercourse overtopped, resulting in surface water flooding of local roads and internal flooding of properties (water entered properties and ponded around them). Fire and rescue attended multiple streets but could not pump properties because there was nowhere for surplus water to be discharged; the police implemented a road closure on Five Oak Road. [IMG,PAG] (p13)</p></div><div class="nugget-popup"><p>Experienced flooding during Storm Ciara (9 Feb 2020). Highway drains and the local combined sewer network were unable to cope; the culvert beneath Five Oak Green may have contributed to the flooding (potential surcharging of the culvert). (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>flood depths up to approximately 30 cm internally [IMG,PAG] (p13)</p></div></div></body></div>`)[0];
                popup_8b413f949968952efa746dc5fdb7f799.setContent(html_7886d94d641571ba9a8d4d914efe5ea0);
