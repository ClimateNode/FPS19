                var html_8081d43d6392cfbd728763511219c031 = $(`<div id="html_8081d43d6392cfbd728763511219c031" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Knowle Hill, Hurley</h1><div class="nugget-popup"><p>During the 11th June 2023 event this area generated a high volume of flood reports indicating localised flooding within Knowle Hill. (p8)</p></div><div class="nugget-popup"><p>Knowle Hill lies within the central Hurley investigation focus and received reported flooding during the event; impacts are recorded as part of the Hurley flood investigation. [IMG] (p9)</p></div><div class="nugget-popup"><p>Surface water flowed down the road creating exceedance routes that carried water over footways into properties; water entered properties via front doors and airbricks. Rear flooding and internal flooding were reported due to groundwater/hydrostatic pressure. Surcharging of the Severn Trent combined sewer network and overwhelmed WCC highway drains contributed to garden and internal flooding. [IMG] (p11)</p></div><div class="nugget-popup"><p>The highway drainage network reached capacity causing surface water to collect on the road and route towards adjacent properties, resulting in property flooding; combined sewer system surcharge (surcharged manholes) worsened flood volumes. WCC Highways cleared debris (jetting) and identified a parallel ditch and culvert constraints; further culvert enlargement and maintenance works have been planned. (p13)</p></div><div class="nugget-popup"><p>Highway and network reached capacity so water pooled on the carriageway, overtopped kerbs and flowed downhill into several properties which flooded internally and externally. Previously fitted Property Flood Resilience measures (after 2020) did not prevent ingress via brickwork, air vents and floors. [MUL] (p16)</p></div></div></body></div>`)[0];

                var html_b8e906115c74f65b608eff7c68c9843e = $(`<div id="html_b8e906115c74f65b608eff7c68c9843e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kings Close, Hurley</h1><div class="nugget-popup"><p>During the 11th June 2023 event this area generated a high volume of flood reports indicating localised flooding within Kings Close. [PAG] (p8)</p></div><div class="nugget-popup"><p>King's Close lies within the central investigation focus in Hurley and was included in the LLFA's investigation of flooding from the event on 11 June 2023. (p9)</p></div><div class="nugget-popup"><p>The road's angled decline on 11th June 2023 caused exceedance surface water flows to route between properties and into rear gardens; restricted drainage capacity prevented rapid entry to the drainage network, leading to internal and garden flooding and flows reaching property fronts. (p10)</p></div><div class="nugget-popup"><p>Drainage within the street is unadopted (developer/management company responsibility); the development outfalls to the Severn Trent surface water sewer. During the heavy rainfall surface water was not drained away quickly enough, creating exceedance routes and contributing to local flooding where the artificial drainage was restricted or reached capacity. [PAG] (p11)</p></div><div class="nugget-popup"><p>The combined drainage system in Hurley reached capacity, surcharging and discharging via manholes which contributed to surface&ndash;water flooding affecting the Kings Close development and properties there. Drainage condition and maintenance were identified as contributing factors. (p12)</p></div><div class="nugget-popup"><p>Properties at a lower level were inundated when flows were funnelled down the decline of the road; floodwater entered through front doors and back gardens. The drainage within Kings Close is private; a CCTV survey has been organised by WCC FRM to investigate. (p16)</p></div></div></body></div>`)[0];
                popup_04722477bf792fad6e298d6697d575b7.setContent(html_b8e906115c74f65b608eff7c68c9843e);

                var html_6575da56f6cb6f6ac7d9710ff8452c15 = $(`<div id="html_6575da56f6cb6f6ac7d9710ff8452c15" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Queens Way, Hurley</h1><div class="nugget-popup"><p>Highway drainage reached capacity during intense rainfall on 11th June 2023, causing large amounts of surface water ponding on the highway and creating flow routes that channelled water towards adjacent properties and into residential areas. (p10)</p></div><div class="nugget-popup"><p>EA surface water extent mapping and narrative indicate flood routes were present on Queensway during the storm, with surface water flowing along the main road and contributing to local flooding in the area. [IMG] (p11)</p></div><div class="nugget-popup"><p>Surface&ndash;water flood routes ran along Queensway and were exacerbated during the storm, increasing runoff and causing flooding along the street (surface water flow paths shown on EA mapping). [PAG] (p12)</p></div><div class="nugget-popup"><p>Surcharge and surface water runoff from Queensway contributed additional flow into the local drainage and into neighbouring low&ndash;lying properties (including Kings Close), exacerbating flooding. (p16)</p></div></div></body></div>`)[0];

                var html_bc7f8580f289e6e02dfc0a1f788c5157 = $(`<div id="html_bc7f8580f289e6e02dfc0a1f788c5157" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Elm Grove, Hurley</h1><div class="nugget-popup"><p>Severn Trent Water jetted the sewer network in Elm Grove after the flood event because significant debris was reported in the sewers; investigation work noted that surface water and surcharged combined sewers contributed to highway flooding which can route towards properties. (p13)</p></div></div></body></div>`)[0];

                var html_8cb479077a63bebe77477190fa632d29 = $(`<div id="html_8cb479077a63bebe77477190fa632d29" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Warwickshire</h1><div class="nugget-popup"><p>Internal flooding to properties and businesses across the county; the event met the threshold for formal investigation by the Lead Local Flood Authority (WCC). (p3)</p></div><div class="nugget-popup"><p>Flooding on 11 June 2023 affected locations within the county (Hurley and Atherstone), resulting in internal flooding of residential properties and triggering a county&ndash;led Section 19 investigation and recovery actions. [PAG] (p4)</p></div><div class="nugget-popup"><p>On 11th June 2023 intense, localized heavy rainfall crossed the county (notably between 18:00&ndash;20:00). Flood Alerts were issued by the Environment Agency for rivers across the county and the Flood Forecasting Centre warned of isolated surface&ndash;water flooding. A band of very high rainfall passed over Hurley around 19:00, creating conditions that would produce surface&ndash;water inundation and cause river responses in parts of the county. (p6)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>9 properties (confirmed in Hurley) (p3)</p></div><div class="nugget-popup quant"><p>9 properties [PAG] (p4)</p></div></div></body></div>`)[0];

                var html_6bee8724885c66ab1e849db8ac50677c = $(`<div id="html_6bee8724885c66ab1e849db8ac50677c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hurley</h1><div class="nugget-popup"><p>At least nine properties experienced internal flooding due to surface water; businesses were also affected. (p3)</p></div><div class="nugget-popup"><p>Flooding on 11 June 2023 led to internal flooding of residential properties in the locality; partners and WCC undertook remedial works to local drainage infrastructure and engaged with residents to provide advice and identify impacts. [PAG] (p4)</p></div><div class="nugget-popup"><p>A concentrated band of very high&ndash;intensity rainfall passed over Hurley on 11 June 2023 (peak between c.19:00&ndash;20:00). Hydromaster pinpoint data show intense, short&ndash;duration rainfall at the village during the event, consistent with conditions that produce surface&ndash;water (flash) flooding in the locality. [IMG,PAG] (p6)</p></div><div class="nugget-popup"><p>A band of intense, short&ndash;duration rainfall passed directly over Hurley on the evening of 11 June 2023, producing extreme surface water/flash&ndash;flooding conditions in the village (rapid accumulation of runoff and high local flood risk). [PAG,IMG] (p7)</p></div><div class="nugget-popup"><p>On 11th June 2023 intense, highly localised rainfall caused highway flooding, external flooding of gardens and garages, and internal flooding of properties in the village; anecdotal and resident reports indicated multiple flood reports with hotspots at Knowle Hill and Kings Close. [PAG] (p8)</p></div><div class="nugget-popup"><p>The village experienced flooding during the event on 11 June 2023. The LLFA investigation focused on the central residential area (the green&ndash;circle area on the map) where flood reports were concentrated. [IMG] (p9)</p></div><div class="nugget-popup"><p>Short&ndash;duration, high&ndash;intensity rainfall on 11th June 2023 produced widespread surface water flows and ponding on highways, inundation of artificial drainage networks (including sewers), and exceedance flow routing through the built environment that channelled water towards properties. [PAG] (p10)</p></div><div class="nugget-popup"><p>Environment Agency surface water extent mapping shows concentrated surface water flooding along the main road through Hurley, with flood routes along Knowle Hill and Queensway and extensive surface water spread in the southwest quadrant of the village affecting built&ndash;up and open areas. [IMG,PAG] (p11)</p></div><div class="nugget-popup"><p>Surface water flooding affected the village during the storm on 11th June 2023. EA surface water mapping shows flood routes through the village (notably along Queensway and Knowle Hill); combined system surcharging and manhole discharge contributed to flood levels and to flooding of properties. [PAG] (p12)</p></div><div class="nugget-popup"><p>Across the village, the combined drainage network reached capacity causing surface water to collect on highways (e.g. Knowle Hill) and route toward properties resulting in property flooding. Sewers surcharging (surcharged manholes) worsened flood volumes. Investigations and remedial actions (jetting, spot repairs, PFR installations in previous events, planned culvert works and additional gulleys) have been undertaken or proposed to reduce future impacts. (p13)</p></div><div class="nugget-popup"><p>On 11 June 2023 heavy rainfall caused surface water runoff and surcharge of the combined sewer network so flows could not be captured. Surface water pooled, overtopped kerbs and flowed into properties and highways. Both internal and external property flooding occurred across the village; private/blocked drainage and highway runoff worsened impacts. [PAG,MUL] (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>9 properties (p3)</p></div><div class="nugget-popup quant"><p>9 properties [PAG] (p4)</p></div><div class="nugget-popup quant"><p>9 residential properties internally flooded; 1 commercial property internally flooded; 5 properties externally flooded [PAG,MUL] (p16)</p></div></div></body></div>`)[0];

                var html_801fa39702f6ae4c2a89d5ad69c3c5cf = $(`<div id="html_801fa39702f6ae4c2a89d5ad69c3c5cf" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Atherstone</h1><div class="nugget-popup"><p>Flooding on 11 June 2023 affected the Atherstone area, with internal flooding of residential properties confirmed and recovery actions (including drainage remedial works and resident liaison) carried out by WCC and partner authorities. (p4)</p></div><div class="nugget-popup"><p>Hurley (within the Atherstone area) has a history of flooding including internal and external property flooding in 2020; the sewer/network experienced significant root ingress that was rectified after the 2020 flooding. As part of the Section 19 investigation into the 11th June 2023 event, properties were reported internally flooded and actions have been recommended (gully cleansing, ditch repairs, PFR installation, and highway drainage/kerb alterations) to reduce future risk. [IMG,MUL] (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>9 properties (p4)</p></div></div></body></div>`)[0];

                var html_a82719c416c9e84700c6c5035a1e0c0f = $(`<div id="html_a82719c416c9e84700c6c5035a1e0c0f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Redditch</h1><div class="nugget-popup"><p>A localized band of very high rainfall passed over Hurley at around 19:00 on 11 June 2023 (Hydromaster data). The report links this intense, short&ndash;duration rainfall to conditions that would cause surface water flooding in the affected location. The report does not explicitly list flooded properties or infrastructure in Hurley but identifies Hurley as being under the peak rainfall band during the event. [IMG] (p6)</p></div></div></body></div>`)[0];
