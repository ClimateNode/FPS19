                var html_07d56da3cf8cbe041375def3556c43a2 = $(`<div id="html_07d56da3cf8cbe041375def3556c43a2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Whipps Cross Hospital</h1><div class="nugget-popup"><p>Whipps Cross Hospital is explicitly listed among the establishments impacted by the flooding that occurred during and following the torrential rainfall on 25 July 2021 (and subsequent rainfall on 7&ndash;8 August 2021). [MUL] (p6)</p></div><div class="nugget-popup"><p>Sustained significant flood and water damage including to electrical systems, causing power outages, immediate loss of bed capacity and operating theatres, and widespread cancellation of planned surgeries and outpatient appointments. (p26)</p></div><div class="nugget-popup"><p>Localised flooding at the hospital led to a major incident declaration, patient relocations to other Barts Health sites and cancellation of planned operations and outpatient appointments the next day; emergency services (LFB) attended to provide support. (p29)</p></div><div class="nugget-popup"><p>Major incident declared after flood water entered a basement housing a main power supply. Barts Trust requested EA assistance to pump the basement. Pumping commenced and continued through the night; evacuations were carried out due to the threat to power supply. [MUL] (p30)</p></div><div class="nugget-popup"><p>Declared a major incident due to flooding; required pumping assistance provided by the Environment Agency in collaboration with the London Fire Brigade. (p35)</p></div><div class="nugget-popup"><p>Whipps Cross Hospital is included in proposed pipeline flood mitigation schemes to reduce flood risk to the hospital following the summer flood events. [TAB,MUL] (p37)</p></div><div class="nugget-popup"><p>Hospital declared a major incident and experienced severe disruption to its services due to flooding. [MUL] (p40)</p></div><div class="nugget-popup"><p>Map shows the flood corridor passing near or through the hospital grounds and its access roads; floodwater therefore likely threatened access to the hospital site and adjacent facilities. [IMG,MUL] (p69)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>168 beds; 12 surgical theatres; 582 planned surgeries (p26)</p></div><div class="nugget-popup quant"><p>100 patients evacuated; up to 800 patients potentially at risk of evacuation if power supply failed [MUL] (p30)</p></div></div></body></div>`)[0];

                var html_a5a06e169ef8b9eb12f7203d9ff294f8 = $(`<div id="html_a5a06e169ef8b9eb12f7203d9ff294f8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>St Marys CE School</h1><div class="nugget-popup"><p>Internal flooding reached 70cm within two hours, causing significant structural damage; the school was forced to close, extensive remedial works are required (repair works expected to take up to 12 months), and classes have been taught in temporary portacabins while repairs take place. [PAG] (p27)</p></div><div class="nugget-popup"><p>St Mary's Church of England Primary School suffered by far the largest school building damage in the event; structural repair work estimated at £7,700,000 and a minimum of a further £500,000 for temporary classrooms/accommodation while repairs are carried out. [TAB] (p28)</p></div><div class="nugget-popup"><p>Flood damage required structural repairs to school buildings; pupils are being taught in temporary portacabins while repairs are completed. [MUL] (p40)</p></div><div class="nugget-popup"><p>Explicitly reported flooding of the school caused extended disruption to school/nursery runs and required pupils/parents to use alternative nearby provision. [MUL] (p74)</p></div><div class="nugget-popup"><p>The school and its nursery were flooded in the July 2021 event. The nursery sustained extensive damage and was closed; children were relocated to an alternative site. Repair works have been required across the site, with many pupils taught in temporary units, dining in a marquee, and the gym closed, reducing available playground space. [PAG] (p78)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>70cm internal flood depth; 12 months repair period; over £7.7m structural damage; £500,000 estimated temporary costs [PAG] (p27)</p></div><div class="nugget-popup quant"><p>10 schools suffering building damage; Total known repair costs to date £8,251,477; Thorpe Hall Primary: £150,000; Gwyn Jones Primary: £20,000; Henry Maynard Primary: £134,314; Mission Grove Primary: £12,500; Newport Primary: £5,000; Woodside Primary: TBC; St Marys CE Primary: £7,700,000; Kelmscott Secondary: £70,663; Leytonstone Secondary: £78,000; Holy Family Secondary: £81,000; Estimated additional temporary costs for St Marys CE Primary: £500,000 (minimum). [TAB,MUL] (p28)</p></div></div></body></div>`)[0];

L] (p87)</p></div><div class="nugget-popup"><p>Flooding destroyed personal possessions of multiple residents; a restaurant had to close due to heavy flooding, resulting in loss of regular customers and significant loss of income. [MUL] (p88)</p></div><div class="nugget-popup"><p>Basement flooding that brought raw sewage on a second occasion; loss of household possessions due to water damage. [MUL] (p89)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>69 roads cleaned in the ward [MUL] (p32)</p></div><div class="nugget-popup quant"><p>10 roads on 25th July 2021; 3 roads on 7th August 2021 [TAB,MUL] (p47)</p></div><div class="nugget-popup quant"><p>22 residential (25th July 2021) [TAB] (p51)</p></div><div class="nugget-popup quant"><p>22 residential properties [TAB,PAG,MUL] (p52)</p></div><div class="nugget-popup quant"><p>part of 21 Floodline calls recorded across the listed wards on 25 July 2021 [TAB] (p55)</p></div><div class="nugget-popup quant"><p>48 families rehoused; 1 company car written off [MUL] (p87)</p></div></div></body></div>`)[0];

                var html_a38e49454ea0da15e71f2069aea9486a = $(`<div id="html_a38e49454ea0da15e71f2069aea9486a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Borough of Waltham Forest</h1><div class="nugget-popup"><p>Borough&ndash;wide flooding investigation following intense rainfall on 25 July 2021 and 7&ndash;8 August 2021. The report examines surface water / urban flooding impacts across the borough. [MUL] (p1)</p></div><div class="nugget-popup"><p>On 25 July 2021 intense torrential rainfall caused widespread flooding across the borough (most affected areas included Walthamstow, Wood Street, Leyton and Leytonstone, focused on the Fillebrook catchment). Water entered homes, schools and businesses, and affected Whipps Cross Hospital; eyewitness reports in worst&ndash;hit areas indicated water levels up to 700mm, vehicles were submerged and there was widespread loss of power. Subsequent rainfall on 7 and 8 August 2021 triggered further flooding in these areas. [MUL] (p6)</p></div><div class="nugget-popup"><p>Intense rainfall on 25 July 2021 far exceeded the design capacity of the borough drainage system and acted as the underlying catalyst for widespread flooding across the borough; the report identifies specific areas of the borough as particularly sensitive and prone to flooding, amplified by a Victorian&ndash;era drainage system. [PAG] (p7)</p></div><div class="nugget-popup"><p>Flooding occurred across Waltham Forest during the events of 25 July 2021 and 7&ndash;8 August 2021; the report summarises the extent, impacts and mechanisms and identifies a need for increased surface water network capacity and other mitigation measures (for example SUDS and sewer upgrades). [MUL] (p8)</p></div><div class="nugget-popup"><p>On 25 July intense rainfall overwhelmed the surface water sewer network in many places, inundating areas with flood water and causing widespread surface water and property flooding across the borough. Further storms on 7&ndash;8 August produced additional widespread surface water and property flooding. [MUL] (p21)</p></div><div class="nugget-popup"><p>Widespread surface water and property flooding across the borough during the storm events, with the worst impacts in the south and east of the borough and numerous incidents concentrated around the path of the Fillebrook. [MUL] (p23)</p></div><div class="nugget-popup"><p>The borough experienced widespread surface water and urban flooding when highway gullies and the surface water sewer system reached capacity, causing surcharging and increased overland flows that concentrated at topographical low points and resulted in significant damage and extreme disruption across many locations. [MUL] (p25)</p></div><div class="nugget-popup"><p>Surface water exceeded the capacity of the existing surface drainage network across the borough; multiple reports of localised flooding were received and areas along the Fillebrooke catchment were affected. [PAG] (p30)</p></div><div class="nugget-popup"><p>Experienced storm&ndash;related surface water/urban flooding on 25 July with numerous sites across the borough attended by the Highways Service and contractors; borough&ndash;wide post&ndash;storm actions included gully cleansing (including Wood Street area), sandbag deployment at the Town Hall on Forest Road and issuance of additional visitor/trader permits to affected properties. [MUL] (p31)</p></div><div class="nugget-popup"><p>The borough experienced intense rainfall and surface water ingress that caused sewer&ndash;related impacts; properties showed signs of sewer flooding and required clean&ndash;up visits. Local highways and cleansing operations were reviewed to reduce future risk. [MUL] (p33)</p></div><div class="nugget-popup"><p>London Borough of Waltham Forest mobilised its Highways Service and officers on 25 July 2021, suspended routine gully cleaning on 26 July and diverted resources to affected areas; it engaged RMAs and prepared a longer&ndash;term action plan in response to widespread surface water flooding across the borough. [MUL] (p34)</p></div><div class="nugget-popup"><p>Surface water flooding was reported across the borough during the July event (reports concentrated in historically flood&ndash;prone areas and the Fillebrooke catchment). Whipps Cross Hospital declared a major incident and received pumping assistance from the EA in collaboration with the LFB; properties showed signs of sewer flooding requiring Thames Water visits. [MUL] (p35)</p></div><div class="nugget-popup"><p>Communities in the borough (including Walthamstow) experienced surface water / urban flooding on 25 July 2021 and 7 August 2021; prompted post&ndash;event desktop analysis to update surface water mapping, engagement with flood action groups and promotion of EA flood&ndash;warning registration and property resilience measures. [TAB,MUL] (p36)</p></div><div class="nugget-popup"><p>Residents, businesses and communities in the borough experienced surface&ndash;water / urban flooding from intense downpours; the council (LBWF) is acting as the LLFA, offering Property Flood Resilience measures to affected properties, pursuing capital drainage and mitigation scheme options (including CDAs) and working with TWU and the EA to reduce future flood risk. [MUL] (p39)</p></div><div class="nugget-popup"><p>Sudden, intense rainfall across the borough overwhelmed the surface water and sewer network, causing numerous properties, businesses, schools and roads to be flooded; major financial, social, economic and welfare impacts across a wide area; some residents remain unable to return while repairs are undertaken. [MUL] (p40)</p></div><div class="nugget-popup"><p>Heavy rainfall events in July and August 2021 produced surface water/urban flooding across parts of the borough and prompted multiple planned and concept&ndash;stage mitigation projects (SuDS, storage and attenuation) to be proposed at identified sites. [IMG,MUL] (p92)</p></div><div class="nugget-popup"><p>Widespread surface water and property flooding across the borough on multiple streets and locations; property flooding reported following an extreme storm. [PAG] (p106)</p></div><div class="nugget-popup"><p>Widespread surface water and property flooding across multiple locations in the borough; severe disruption to the highway network; multiple incidents of internal and external property flooding. [MUL] (p107)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>in excess of 200 homes; 28 local schools; water levels up to 700mm [MUL] (p6)</p></div><div class="nugget-popup quant"><p>over 23 Floodline calls located within the borough [PAG] (p30)</p></div><div class="nugget-popup quant"><p>over 400 reports; over 90 pieces of correspondence; 213 additional free of charge visitor permits [MUL] (p31)</p></div><div class="nugget-popup quant"><p>200 residential properties; 13 commercial properties; 28 schools; 19 residential properties; 6 commercial properties [MUL] (p34)</p></div><div class="nugget-popup quant"><p>over 100 Floodline calls on 25th July 2021; 10 post flooding clean up visits [MUL] (p35)</p></div></div></body></div>`)[0];

                var html_884e14363df2d2753a023e825d56f57b = $(`<div id="html_884e14363df2d2753a023e825d56f57b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Region</h1><div class="nugget-popup"><p>Intense, localized thunderstorms on 25 July 2021 overwhelmed the surface water sewer network in parts of the borough, resulting in inundation of streets and property flooding. Reports of flooding in July and August 2021 were concentrated in the centre and south of the borough and along River Lea and Dagenham Brook catchments. [PAG,MUL] (p20)</p></div><div class="nugget-popup"><p>Interior of an industrial facility (warehouse/factory) was inundated with floodwater covering the entire visible floor. Equipment, control panels, barrels and stored materials were immersed or surrounded by water, creating risk of damage to plant, stock and electrical/chemical hazards and disrupting operations. [IMG,MUL] (p81)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 14 locations [PAG,MUL] (p20)</p></div></div></body></div>`)[0];

                var html_21b62f3a53baedfca1fe5c86110b42c0 = $(`<div id="html_21b62f3a53baedfca1fe5c86110b42c0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wood Street, Walthamstow</h1><div class="nugget-popup"><p>Identified as one of the most affected parts of the borough during the intense rainfall on 25 July 2021 (with further flooding on 7&ndash;8 August 2021); flooding was focused on the Fillebrook catchment. Eyewitness accounts in worst&ndash;hit areas reported water depths up to 700mm, submerged vehicles and widespread power loss. [MUL] (p6)</p></div><div class="nugget-popup"><p>Flooding on 25th July 2021 (area listed among the worst affected). Nearby St David's Court (at the junction of Forest Road and Wood Street) experienced flooding with an electrical power failure; residents were relocated while power and habitability were restored. (p26)</p></div><div class="nugget-popup"><p>The Wood Street area was identified as a high&ndash;risk area with a number of initial flood reports; Highways Service prioritised attendance there and gulleys were cleaned on 26 July as part of the immediate recovery; once rainfall ceased and sewer capacity returned most surface water drained away. [MUL] (p31)</p></div><div class="nugget-popup"><p>Roads associated with Wood Street were recorded flooded, including Chestnut Avenue South and Chestnut Avenue North; Brooke Road and Elphinstone Road are also recorded in the same ward list. [TAB,MUL] (p48)</p></div><div class="nugget-popup"><p>Wood Street experienced flooding affecting commercial, residential and school premises as recorded in the investigation. [TAB,PAG] (p50)</p></div><div class="nugget-popup"><p>Surface&ndash;water flooding inundated properties in the Wood Street ward, affecting residential properties, commercial premises and schools. [TAB,PAG,MUL] (p51)</p></div><div class="nugget-popup"><p>Multiple roads and alleyways within the Wood Street ward (including Wood Street itself, Addison Road, Albion Road, Avon Road, Barclay Path/Road, Barrett Road, Beulah Path, Bisterne Avenue, Brandon Road, Brooke Road, Brookfield Avenue, Brunswick Street, Buck Walk, Butterfields, Buxton Drive, Chestnut Avenue North/South, College Place, Comely Bank Road, Corbett Road, Cromwell Road, Cuthbert Road, Dean Gardens, Dukes Passage, Eastern Road, Elm Road, Evelyn Road, Ferndale Avenue, Fernhill Court, Forest Rise, Foresters Drive, Fyfield Road, Greenacres Gardens, Greenway Avenue, Greville Road, Havant Road, Hempstead Road, Hillside Gardens, Hylands Road, Linford Road, Lucerne Grove, Marlowe Road, Maynard Path/Road, Morgan Avenue, Nagle Close, Oakhurst Close/Gardens, Oliver Road, Orchard Street, Alleyway between Shernhall Street and Raglan Road, Elphinstone Road, Raglan Road, Turner Road) were affected by flooding and required waste removal/clearance. [TAB,MUL] (p53)</p></div><div class="nugget-popup"><p>Named in the Section 19 report as an affected location; recorded as impacted by flooding during the events. [TAB,PAG,MUL] (p54)</p></div><div class="nugget-popup"><p>Environment Agency Floodline calls were received reporting surface water flooding at Vallentin Road, Turner Road and Barrett Road in the Wood Street ward; Turner Road is also documented in a photograph dated 7th August showing flooding. [TAB,MUL] (p55)</p></div><div class="nugget-popup"><p>Residential properties experienced internal flooding: standing water several inches deep covered floors and partially submerged furniture and personal belongings; lower sections of walls were water&ndash;damaged and floorboards were removed as part of remediation works. [MUL] (p60)</p></div><div class="nugget-popup"><p>Residents from Wood Street South (represented by the Wood Street South Flood Action Group) reported flooding of their homes on Brooke Road, Oliver Road, Chestnut Avenue South, Raglan Road, Granville Road and Shernhall Street; a public meeting was held with Risk Management Authorities to address local flood impacts and concerns and photographic records and case details were provided to the council. [IMG,PAG,MUL] (p67)</p></div><div class="nugget-popup"><p>Experienced surface&ndash;level flooding and escape of foul water from the sewer network; homes in the local drainage area were flooded during major events. [IMG,MUL] (p68)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>water levels up to 700mm [MUL] (p6)</p></div><div class="nugget-popup quant"><p>46 households (p26)</p></div><div class="nugget-popup quant"><p>10 commercial; 10 residential; 3 school; 5 commercial; 141 residential [TAB,PAG] (p50)</p></div><div class="nugget-popup quant"><p>141 residential (25th July 2021); 10 commercial (25th July 2021); 3 school (25th July 2021); 10 residential (7th/8th August 2021); 5 commercial (7th/8th August 2021) [TAB,PAG,MUL] (p51)</p></div><div class="nugget-popup quant"><p>29 reports; 6 streets represented by the Flood Action Group [IMG,PAG,MUL] (p67)</p></div></div></body></div>`)[0];

                var html_2a46147874bd7b668466c5d0acba4f72 = $(`<div id="html_2a46147874bd7b668466c5d0acba4f72" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Brooke Road, Wood Street</h1><div class="nugget-popup"><p>Severe flooding during the storm events resulting from surface water/runoff concentrated around the Fillebrook corridor, impacting the street and properties. [MUL] (p23)</p></div><div class="nugget-popup"><p>Properties experienced significant internal flooding and water damage; residents displaced for many months while properties were dried out and remedial works undertaken; photographic evidence included in the report showing severity of flooding. (p27)</p></div><div class="nugget-popup"><p>Highways Service prioritised attendance at Brooke Road following initial reports; gully cleaning was carried out in the Wood Street area on 26 July as part of the response; the Council issued additional free visitor permits including to every house in Brooke Road as an immediate support measure. (p31)</p></div><div class="nugget-popup"><p>The Brooke Road pumping station was operated during both intense rainfall events (25 July and 7/8 August 2021); Thames Water provided a breakdown of how the pumping station operated during these events (see Appendix L). [MUL] (p34)</p></div><div class="nugget-popup"><p>Brooke Road and adjacent properties were affected by the summer 2021 flooding, leading to planned mitigation measures cited in the report (including proposed Brooke Road SuDS), sewer inspections and follow&ndash;up actions by Thames Water and RMAs. [TAB,MUL] (p37)</p></div><div class="nugget-popup"><p>Experienced sudden, intense rainfall (equating to over a 1&ndash;in&ndash;170&ndash;year event) that contributed to surface water flooding when the sewer network was overwhelmed, resulting in flooding of local properties/roads. [MUL] (p40)</p></div><div class="nugget-popup"><p>Recorded by RMAs as being flooded during the investigation; the street experienced surface&ndash;water inundation affecting the carriageway and local access. [TAB] (p48)</p></div><div class="nugget-popup"><p>Affected by surface water flooding on 7th August 2021; carriageway/footway inundated and subsequently required waste removal. [TAB] (p53)</p></div><div class="nugget-popup"><p>Street flooded with surface water covering the road and partially submerging parked vehicles; flooding reached property boundaries and disrupted normal access along the residential street. [IMG,PAG] (p56)</p></div><div class="nugget-popup"><p>Street&ndash;level flooding covered the entire roadway and encroached on the lower portions and doorsteps of adjacent residential houses; debris present in standing water; vehicles partially submerged or impeded; residential properties threatened by floodwater. [IMG,PAG] (p57)</p></div><div class="nugget-popup"><p>Residential street heavily flooded; water reached above the wheel arches of parked cars, rendering vehicles partially submerged and immobile. Floodwater encroached onto front gardens and the street was deep enough for kayak navigation, indicating significant disruption to transport and intrusion onto properties. [IMG] (p61)</p></div><div class="nugget-popup"><p>Listed as the borough road with the highest number of drainage/flood reports (top 14 roads list) &mdash; residents submitted multiple drainage/flood reports for this road during the period of intense July&ndash;August 2021 rainfall. [MUL] (p64)</p></div><div class="nugget-popup"><p>Highest number of flood reports from ward councillors indicating road flooding and disruption to the carriageway and local access in Brook Road. [PAG,MUL] (p65)</p></div><div class="nugget-popup"><p>Residential properties on Brooke Road were flooded during the July&ndash;August 2021 flood events; residents reported impacts to their homes, held a public meeting with RMAs and provided photographic evidence and a presentation to LB Waltham Forest. [MUL] (p67)</p></div><div class="nugget-popup"><p>Repeated flooding of the street and adjacent homes during major 2021 incidents; surface water inundation and foul water observed discharging from the drainage network/manholes during autumn 2021 maintenance period. [IMG,MUL] (p68)</p></div><div class="nugget-popup"><p>Flooding from overwhelmed local drainage/tributary affected properties on Brooke Road; a children's nursery on Brooke Road was relocated nearly 2 miles away because of the floods and residents experience ongoing daily disruption, fear and need to remain at home during heavy rain. [MUL] (p76)</p></div><div class="nugget-popup"><p>Surface water flowing from the rear access (notably down from Greenway Avenue) ran through gardens into Brook Road properties. Residents reported garden flooding that threatened to enter houses, attempts to block air bricks, collective neighbour efforts to stem flows, the need to pump water out, and persistent garden damage and mud following the event. (p77)</p></div><div class="nugget-popup"><p>An overflowing drain and heavy runoff created a torrent down the back access road, flowing through gardens and into houses. Residents attempted to block air bricks and use buckets/brushes to prevent ingress; water nevertheless entered properties causing subsequent rising damp and threatening outbuildings. (p78)</p></div><div class="nugget-popup"><p>Brooke Road has a history of flooding. During the recent flooding events gully capacity and gully volume issues were highlighted, contributing to localised flooding and reduced drainage performance on the road. [TAB,MUL] (p91)</p></div><div class="nugget-popup"><p>Brooke Road has a history of flooding and gully capacity and volume issues were particularly highlighted during the July/August 2021 flooding events; this led to proposals for gully/network upgrades, SuDS measures and community resilience actions to increase overall network capacity. [IMG,MUL] (p92)</p></div><div class="nugget-popup"><p>Experienced surface water flooding associated with the storm events, contributing to internal and external property flooding and severe disruption to the highway network. [MUL] (p107)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>45&ndash;70 cm internal flood depths inside properties (p27)</p></div><div class="nugget-popup quant"><p>213 additional free of charge visitor permits (including every house in Brooke Road and Oliver Road) (p31)</p></div></div></body></div>`)[0];

and created stagnant, debris&ndash;laden water affecting the residential street. [IMG] (p57)</p></div><div class="nugget-popup"><p>Street surface covered with mud, dirt and debris left by floodwaters; sediment and organic material deposited along curbs; evidence that floodwaters flowed across the full carriageway and then receded, leaving debris that would have impeded access and required cleanup. [IMG,PAG] (p58)</p></div><div class="nugget-popup"><p>Residential properties on Oliver Road were flooded during the July&ndash;August 2021 flood events; residents reported impacts to their homes, participated in a public meeting with RMAs and submitted photographic evidence and a presentation to LB Waltham Forest. [MUL] (p67)</p></div><div class="nugget-popup"><p>Included in the Fillebrook drainage area that experienced repeated surface water inundation and foul sewer discharge during the 2021 flood incidents, contributing to flooding of nearby properties. [IMG,MUL] (p68)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>213 additional free of charge visitor permits (including every house in Brooke Road and Oliver Road) (p31)</p></div></div></body></div>`)[0];

<div class="nugget-popup"><p>Severe street and private&ndash;property flooding: water covered the roadway, gardens and vehicles with levels high enough to submerge car wheels and inundate garden surfaces. Photographs show widespread inundation along the road and a subsequent photo sequence (dated 25/07/21) showing water subsiding and drains discharging. [IMG] (p70)</p></div><div class="nugget-popup"><p>Emergency gully cleaning and removal of debris from road gullies carried out after street flooding; cleanup activity documented with photographs. [IMG] (p71)</p></div><div class="nugget-popup"><p>Experienced surface water flooding associated with the storm events, contributing to internal and external property flooding and severe disruption to the highway network. [MUL] (p107)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>part of 21 Floodline calls recorded across the listed wards on 25 July 2021 [TAB,PAG] (p55)</p></div></div></body></div>`)[0];

                var html_86752e6ea451ac9fcd62b447e91403e7 = $(`<div id="html_86752e6ea451ac9fcd62b447e91403e7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Greenway Avenue, Wood Street</h1><div class="nugget-popup"><p>Reported highway flooding on the street with subsequent waste/debris left on the carriageway requiring removal. [TAB,MUL] (p53)</p></div><div class="nugget-popup"><p>Householders experienced severe surface&ndash;water/urban flooding risk during intense downpours and had to organise collectively to stave off floodwater entering properties; residents report heightened anxiety and disruption to daily routines (including school/nursery runs) following the events. [MUL] (p74)</p></div><div class="nugget-popup"><p>Manholes and drains in the back lane behind Greenway Avenue were at capacity and overflowed, with water 'exploding' out of a manhole and a torrent running through rear gardens. Residents had to bucket water out for around three hours until a pump arrived; gardens flooded on 25 July and again (smaller) on 7 August, causing distress and ongoing fear of repeat flooding. [MUL] (p75)</p></div><div class="nugget-popup"><p>Residents report the Thames Water drain in the back lane overflows, the back lane is a tributary to the Brooke Road underground river, and overwhelmed drainage has caused local flooding risk and impacts to properties; community campaigning for improved drainage to protect properties and downstream areas. [MUL] (p76)</p></div><div class="nugget-popup"><p>Heavy rainfall and an overflowing drain produced a concentrated flow of water running down the back of Greenway Avenue into Brook Road. Surface water overwhelmed gardens and drainage, threatened house thresholds and required residents to deploy sandbags and pumps to prevent water entering properties. Gardens became waterlogged/mud baths and residents reported ongoing anxiety and disruption to daily life. (p77)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>20&ndash;25 neighbours [MUL] (p75)</p></div><div class="nugget-popup quant"><p>over £600 (resident expenditure on flood&ndash;defence equipment); 2 occasions (residents reported having to pump water since the summer) (p77)</p></div></div></body></div>`)[0];

                var html_54d4289c811534439392b8e2733a684e = $(`<div id="html_54d4289c811534439392b8e2733a684e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Leytonstone</h1><div class="nugget-popup"><p>Leytonstone was one of the most affected parts of the borough during and following torrential rainfall on 25 July 2021 (and further rainfall on 7&ndash;8 August 2021). Flooding was focused on the alignment of the Fillebrook catchment; eyewitness reports in the worst&ndash;hit areas indicated water levels up to 700mm, with vehicles submerged and widespread loss of power. Properties and local schools were affected as part of the wider borough impacts. [MUL] (p6)</p></div><div class="nugget-popup"><p>Numerous surface&ndash;water and property&ndash;flooding incidents occurred during the storm events, with many incidents concentrated around the path of the culverted Fillebrook that runs through Leytonstone. [MUL] (p23)</p></div><div class="nugget-popup"><p>Severe flooding (notably 25th July 2021) that contributed to widespread internal property flooding, damage and disruption to local homes, businesses and schools. [MUL] (p26)</p></div><div class="nugget-popup"><p>One of the three main wards affected by flooding along the Fillebrook; comprehensive street cleaning completed (80 roads) and gully&ndash;cleansing frequency under review to reduce future flood risk. [MUL] (p32)</p></div><div class="nugget-popup"><p>Leytonstone is recorded in the investigation as having flooded properties (residential and commercial) during the August event. [TAB,PAG] (p50)</p></div><div class="nugget-popup"><p>Residential and commercial properties flooded: 26 residential and 2 commercial properties flooded on 25th July 2021; 1 residential property flooded on 7th/8th August 2021. [TAB,PAG,MUL] (p51)</p></div><div class="nugget-popup"><p>District&ndash;level listing in the draft Section 19 report and in Environment Agency Floodline calls identifying multiple streets in Leytonstone as affected by flooding on 7th/8th August 2021. [TAB,PAG] (p54)</p></div><div class="nugget-popup"><p>Environment Agency Floodline calls recorded flooding across multiple streets in Leytonstone (Kings Road near Kings Passage, Drayton Road, Wadley Road, Vallentin Road) on 25 July. [TAB,PAG] (p55)</p></div><div class="nugget-popup"><p>Area&ndash;wide impacts during July and August 2021 with widespread surface water inundation of homes (including depths reported in the timeline), repeated re&ndash;flooding of properties, and foul water observed from manholes during subsequent events/maintenance. [IMG,MUL] (p68)</p></div><div class="nugget-popup"><p>A sewer running through back gardens (Bedford Road) discharged raw sewage, flooding gardens on two occasions. Separate flooding entered properties via air bricks into the subfloor, flooding property interiors; two vehicles (resident's and son's) were very badly flooded and are being assessed. Industrial drying equipment was installed to dry the subfloor. [MUL] (p88)</p></div><div class="nugget-popup"><p>Repeated rainfall&ndash;related pavement subsidence (a crater) that prevents pavement use and is causing progressive weakening of underground structure and risk to adjacent wall structures. [MUL] (p89)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>water entering in excess of 200 homes; 28 local schools (borough&ndash;wide) [MUL] (p6)</p></div><div class="nugget-popup quant"><p>80 roads [MUL] (p32)</p></div><div class="nugget-popup quant"><p>26 residential; 1 residential; 2 commercial [TAB,PAG] (p50)</p></div><div class="nugget-popup quant"><p>26 residential; 2 commercial; 1 residential [TAB,PAG,MUL] (p51)</p></div><div class="nugget-popup quant"><p>4 streets (Kings Road near Kings Passage; Drayton Road; Wadley Road; Vallentin Road) [TAB,PAG] (p55)</p></div><div class="nugget-popup
