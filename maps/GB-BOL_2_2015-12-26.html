                var html_ba98cf10f941969f8261a9172f1e7a14 = $(`<div id="html_ba98cf10f941969f8261a9172f1e7a14" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Pioneer Mill</h1><div class="nugget-popup"><p>The River Irwell at Pioneer Mills experienced exceptionally high peak levels during the Boxing Day event (26 December 2015), contributing to river flooding recorded at this station. (p16)</p></div><div class="nugget-popup"><p>Properties at Pioneer Mill experienced internal flooding from main river flooding during the event. [TAB,PAG] (p17)</p></div><div class="nugget-popup"><p>Pioneer Mill is listed among areas affected by the 26 December 2015 flooding; river level at Pioneer Mills reached 5.33m (noted as 0.9m higher than any other reading in five years). [PAG] (p56)</p></div><div class="nugget-popup"><p>River Irwell levels at Pioneer Mills rose to very high levels; the river gauge at Pioneer Mills was washed away at midday on 26th December 2015 and the site experienced significant flooding. [PAG] (p57)</p></div><div class="nugget-popup"><p>High river levels were recorded at Pioneer Mill (downstream of Radcliffe and Redvales) during the event; flood&ndash;related sediment build&ndash;up was recorded and repairs to gauging&ndash;station equipment at Pioneer Mills were scheduled as part of the recovery programme. (p63)</p></div><div class="nugget-popup"><p>River Irwell overtopped, flooding the mill from three sides. Maximum flood depth above ground level 1.76m. Nineteen individual industrial units were flooded; businesses lost power for several weeks. Milltown Street footbridge (direct access) was damaged beyond repair. Post&ndash;event issues included security (break&ndash;ins), environmental health problems (waste and fly&ndash;tipping), and concerns about building structure. [IMG,PAG] (p64)</p></div><div class="nugget-popup"><p>Pioneer Mill was flooded when the River Irwell overtopped and inundated the mill on three sides. Flooding caused structural damage, widespread loss and contamination of stored goods, loss of power to businesses for weeks, damage to access (Milltown Street footbridge was destroyed), post&ndash;flood security problems (break&ndash;ins) and environmental health issues (waste and fly&ndash;tipping). [IMG,PAG] (p65)</p></div><div class="nugget-popup"><p>The River Irwell overtopped at a meander and flooded the Mill from three sides. Maximum flood depth above ground was 1.76 m. Nineteen individual industrial units within the mill were flooded. Businesses lost power for several weeks. Flooding caused structural damage, created waste and fly&ndash;tipping that presented environmental health risks, and led Building Control to require demolition of some outlying, immediately dangerous sections. Security issues (break&ndash;ins) increased after the event. [PAG,MUL] (p66)</p></div><div class="nugget-popup"><p>River Irwell levels at Pioneer Mill on 26 December 2015 were recorded as extremely high (comparable to levels at Bury), contributing to local river flooding. (p70)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>19 properties [TAB,PAG] (p17)</p></div><div class="nugget-popup quant"><p>5.33m river level (62.97m AOD) [PAG] (p57)</p></div><div class="nugget-popup quant"><p>19 units flooded; 1.76m maximum flood depth above ground level [IMG,PAG] (p64)</p></div><div class="nugget-popup quant"><p>19 units flooded; 1.76 m maximum flood depth above ground; flooded from 3 sides [IMG,PAG] (p65)</p></div><div class="nugget-popup quant"><p>19 units flooded; maximum flood depth 1.76 m [PAG,MUL] (p66)</p></div></div></body></div>`)[0];

                var html_c777f8efc84cb30cf030780ed78e9246 = $(`<div id="html_c777f8efc84cb30cf030780ed78e9246" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Rochdale Borough Council Office</h1><div class="nugget-popup"><p>Flooding of Rochdale Council's town centre office affected computer servers, which hindered communications and coordination of flood recovery. (p22)</p></div><div class="nugget-popup"><p>The council's new office (Number One Riverside) experienced internal flooding during the event; the building was later largely operational but the ground&ndash;floor library remained closed after the flood. (p121)</p></div><div class="nugget-popup"><p>Number One Riverside (the Council Offices) flooded &mdash; the ground floor library was affected and computer servers in the cellar were flooded; repair work was required and the building was substantially operational from 4 January 2016 while the library remained closed at the time of the report. (p123)</p></div><div class="nugget-popup"><p>The recently built Council Offices at Number One Riverside in the town centre flooded: the ground&ndash;floor library was affected and computer servers in the cellar were flooded, complicating recovery. Repairs were underway and the building was substantially operational from 4 January 2016, though the ground&ndash;floor library remained closed. [IMG] (p124)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one council office building (Number One Riverside) [IMG] (p124)</p></div></div></body></div>`)[0];

                var html_b3334b569f6d9944e359052d7c2c8838 = $(`<div id="html_b3334b569f6d9944e359052d7c2c8838" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bury Wastewater Treatment Works</h1><div class="nugget-popup"><p>The Bury wastewater treatment works was flooded; a number of treatment processes were affected, reducing treatment effectiveness. A recovery plan was agreed with the Environment Agency to return the works to normal operation. The reduced treatment led to discharges that were more dilute than usual due to high volumes of storm water in the system. [PAG] (p24)</p></div><div class="nugget-popup"><p>The treatment works was damaged by the high river levels/flooding and, after the flood, discharged effluent to the river that did not meet full treatment standards for several weeks. (p29)</p></div><div class="nugget-popup"><p>The treatment works flooded on Boxing Day and discharged treated sewage into the River Irwell. The discharge water did not meet full treatment standards for several weeks due to damage sustained on 26th December 2015. (p58)</p></div></div></body></div>`)[0];

                var html_921c0bd8ec6ee39f67a5fbc97130b903 = $(`<div id="html_921c0bd8ec6ee39f67a5fbc97130b903" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ringley Bridges</h1><div class="nugget-popup"><p>Flood flows displaced sand and gravel around Ringley Old Bridge and the nearby island, producing scour and sediment build&ndash;up that required post&ndash;flood actions (movement of sand, use of gravel to fill scour, and planned gravel removal as part of recovery). The arches and flow through the bridge openings were affected by sediment movement. [PAG] (p44)</p></div><div class="nugget-popup"><p>River channel and bridge openings experienced sediment deposition and scour requiring recovery works: sand on the river bank upstream and downstream of Ringley Old Bridge was moved to smooth flow through the arched bridge openings; gravel from the island downstream of Ringley Old Bridge was used to fill in scour on the right bank. (p45)</p></div></div></body></div>`)[0];

                var html_759d80013e346fed141fb301caeb0d94 = $(`<div id="html_759d80013e346fed141fb301caeb0d94" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Rochdale</h1><div class="nugget-popup"><p>Town&ndash;centre street and the ground floors of multiple businesses were inundated; water reached up to doors and windows of shopfronts and partially submerged street furniture (traffic lights and pedestrian posts), disrupting access to the commercial area. [IMG] (p1)</p></div><div class="nugget-popup"><p>Severe river flooding with water depths so great in parts of Rochdale that some residents were evacuated by boat; flooding described as the worst in living memory in some areas; rapid onset and subsequently began to recede by Boxing Day evening. (p13)</p></div><div class="nugget-popup"><p>Rochdale experienced widespread internal property flooding, predominantly from main river flooding with additional surface&ndash;water impacts across the town and vicinity. [TAB,PAG] (p17)</p></div><div class="nugget-popup"><p>Flooding affected Rochdale (specifically Littleborough and Rochdale), inundating properties; a scheme has been proposed to assess options for reducing flood risk in the area. [IMG] (p20)</p></div><div class="nugget-popup"><p>Extensive flooding in Rochdale led to major electricity supply impacts and direct asset damage: two sub&ndash;stations in Rochdale were damaged by floodwater. A control room at a Rochdale substation was inundated to about 1.5m, causing extensive equipment damage (repair estimate ~£7M). A hydroelectric plant adjacent to Rochdale bus station was damaged (~£80,000 repair). [TAB] (p21)</p></div><div class="nugget-popup"><p>Flooding closed the transport interchange (tram and bus terminus) in Rochdale town centre on Boxing Day (reopened the next day), disrupted tram and bus services, caused loss of power affecting many traffic signals, and flooded Rochdale Council's town centre office (affecting computer servers and communications). Rochdale wastewater works suffered flooding (damage described as minimal) and local pumping infrastructure was affected. (p22)</p></div><div class="nugget-popup"><p>Flooding affected local wastewater treatment (Rochdale WWTW suffered flooding, damage reported as minimal) and flooded Rochdale Council's town centre office, damaging computer servers and disrupting communications and coordination for recovery; a functional operations base was established at Rochdale Town Hall. [PAG] (p23)</p></div><div class="nugget-popup"><p>Flooding from main rivers (River Roch and Hey Brook) on 26 December 2015 led to direct flood warnings being issued to properties; a number of properties in Rochdale benefited from defences/operational protection. [TAB] (p26)</p></div><div class="nugget-popup"><p>Flooding of the River Roch caused damage to flood walls and embankments in the Rochdale/Littleborough area. Minor repairs on walls/embankments are programmed. A flood wall completely failed at a residential care home next to the River Roch at Littleborough. [PAG] (p27)</p></div><div class="nugget-popup"><p>River Roch flood defences (walls/embankments) were damaged and sandbagged as an immediate short&ndash;term measure. Wall rebuilding was included in an emergency repair programme; work started on site 14 March 2016 with completion due mid&ndash;June 2016. Minor repairs on other walls/embankments on the River Roch at Rochdale were also programmed. (p28)</p></div><div class="nugget-popup"><p>Rochdale Town Centre and its vicinity experienced flooding during the Boxing Day event, resulting in property flooding and local evacuations. (p29)</p></div><div class="nugget-popup"><p>Widespread internal flooding of properties across the borough from multiple sources (rivers, surface water, groundwater and sewers); extent of damage to habitable spaces and businesses being assessed; many cellar floods noted. [IMG,PAG] (p113)</p></div><div class="nugget-popup"><p>Widespread flooding across the borough on 26 December 2015 from multiple sources (primarily rivers but also surface water, groundwater and sewers) causing internal flooding, infrastructure impacts and service disruption. [IMG,PAG] (p114)</p></div><div class="nugget-popup"><p>Rochdale borough experienced significant impacts from the 26th December 2015 flooding: large&ndash;scale power loss and communications disruption beyond immediate flooded areas; flooding at Rochdale Wastewater Treatment Works causing some impacts to treatment; tram services were unable to reach the town centre and the new bus station sustained flood damage and power loss; a Strategic Command and Control Centre was established at Rochdale Town Hall and rest centres were opened with volunteer support; council&ndash;led recovery included payments, grants and ongoing support, plus infrastructure inspections, maintenance (de&ndash;silting, gully cleaning) and river works including de&ndash;culverting. [PAG] (p115)</p></div><div class="nugget-popup"><p>Flows in the River Roch exceeded the capacity of a culvert entrance next to the new bus station causing river water to flood the town centre. Floodwater flowed along Smith Street and South Parade and re&ndash;entered the river downstream. Most businesses on Smith Street, South Parade, The Butts and The Walk were flooded; the new Council office at Number One Riverside was flooded (ground&ndash;floor library remained closed after reopening); the town centre bus station and tram terminus sustained flood damage; power loss affected many homes and businesses; substantial cellar flooding affected business operations on South Parade and Yorkshire Street; two cellars and a yard at a piling contractor's depot flooded from the River Spodden near its confluence with the River Roch; downstream the Asda superstore, adjacent Curry's PC World and Sixth Form College suffered internal flood damage and St Mary's Gate subway was damaged. [IMG,PAG] (p120)</p></div><div class="nugget-popup"><p>Flooding in Rochdale on 26 December 2015 inundated the recently built Council Offices at Number One Riverside; the ground floor library was flooded and computer servers in the cellar were affected. The flood extent was broadly similar to, or slightly beyond, Flood Zone 3. (p123)</p></div><div class="nugget-popup"><p>Properties adjacent to the River Roch flooded internally (water entered properties). Nearby electrical substations were flooded causing loss of power supply to properties. Allotments on Kellet Street were flooded. Some cellars flooded from groundwater seepage or surface water. (p126)</p></div><div class="nugget-popup"><p>Rochdale Metropolitan Borough Council led investigations into surface&ndash;water flooding in its area; raised river levels and surface&ndash;water runoff caused flooding that inundated properties and allowed floodwater to enter domestic and commercial premises within the borough. [IMG,PAG] (p131)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>288 properties (main river); 34 properties (surface water); 324 properties (total) [TAB,PAG] (p17)</p></div><div class="nugget-popup quant"><p>275 properties flooded [IMG] (p20)</p></div><div class="nugget-popup quant"><p>18,550 properties without power in Rochdale; 2 sub&ndash;stations damaged; control room flooded to a depth of 1.5m [TAB] (p21)</p></div><div class="nugget-popup quant"><p>541 properties (River Roch in Rochdale) received flood warnings; 25 properties (Hey Brook) received flood warnings; 697 properties (River Roch at Littleborough) received flood warnings; 367 properties protected (by defences) [TAB] (p26)</p></div><div class="nugget-popup quant"><p>one wall [PAG] (p27)</p></div><div class="nugget-popup quant"><p>54 properties (p29)</p></div><div class="nugget-popup quant"><p>324 properties [IMG,PAG] (p113)</p></div><div class="nugget-popup quant"><p>324 properties flooded internally (excludes cellars unless habitable); Littleborough 174 properties (up to 1.2 m deep); Wardleworth and Hey Brook 36 properties; Rochdale town centre 54 properties (up to 1.5 m deep); Hooley Bridge 20 properties; power loss to 20,000 properties initially (reduced to 5,500 later on Boxing Day); some properties without power for up to 4 days [IMG,PAG] (p114)</p></div><div class="nugget-popup quant"><p>20,000 properties without power initially; 5,500 properties without power later on Boxing Day; some properties without power for up to 4 days; ␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀; ␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀; £500 Community Recovery payments available; Business Recovery Grant and Property Level Resilience Grant up to £5,000 per property [PAG] (p115)</p></div><div class="nugget-popup quant"><p>54 properties flooded; up to 1.5 metres flood depth measured at The Butts; two cellars; Asda flooded up to 50mm [IMG,PAG] (p120)</p></div><div class="nugget-popup quant"><p>541 properties (p123)</p></div><div class="nugget-popup quant"><p>25 properties; up to 400mm (internal flood depth) (p126)</p></div><div class="nugget-popup quant"><p>9 properties [IMG,PAG] (p131)</p></div></div></body></div>`)[0];
                popup_b4255ca6f74fbf41b9ac2887726e41ed.setContent(html_759d80013e346fed141fb301caeb0d94);

                var html_f25322c7454382bb5a3f49416e3f8d90 = $(`<div id="html_f25322c7454382bb5a3f49416e3f8d90" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Salford</h1><div class="nugget-popup"><p>Severe river flooding with water depths so great in parts of Salford that some residents were evacuated by boat; flooding described as the worst in living memory in some areas; rapid onset and subsequently began to recede by Boxing Day evening. (p13)</p></div><div class="nugget-popup"><p>River Irwell reached an unprecedented peak at the Manchester Racecourse gauge in Salford, producing river flooding in the Salford area on Boxing Day 26 December 2015. [TAB] (p15)</p></div><div class="nugget-popup"><p>Main&ndash;river flooding caused internal flooding to residential and other properties (ground&ndash;floor/internal flooding). 750 properties were flooded in Salford/Lower Broughton. [TAB,PAG] (p17)</p></div><div class="nugget-popup"><p>Delph and Salford experienced power outages caused by flooding; the report gives local property counts and the overall total for Greater Manchester outages. (p21)</p></div><div class="nugget-popup"><p>Severe electrical damage to an Environment Agency river gauging station at Lower Broughton (in Salford) as a result of the flood, affecting local flood&ndash;warning data availability. (p22)</p></div><div class="nugget-popup"><p>Erosion of the Manchester Ship Canal bank adjacent to a COMAH facility immediately downstream of Mode Wheel locks; site operator emptied oil tanks nearest the canal as a precaution to mitigate a potential environmental incident if undermining had occurred. [PAG] (p23)</p></div><div class="nugget-popup"><p>Salford was affected by the Boxing Day flooding; RMAs held three local drop&ndash;in events and carried out visual inspections of flood&ndash;risk assets in the aftermath. (p27)</p></div><div class="nugget-popup"><p>Salford was one of the most heavily affected areas in the Boxing Day flood; around 750 properties flooded and homes were evacuated. The area suffered flood&ndash;related infrastructure damage and widespread disruption. (p29)</p></div><div class="nugget-popup"><p>A larger area of properties in Salford (west of the main river, including parts of Broughton and Cheetham Hill) were shown flooded during the event. [IMG] (p82)</p></div><div class="nugget-popup"><p>High rainfall caused the River Irwell to overtop raised defences and natural banks and exceed surface water network capacity. River levels at Salford reached a record 5.67m (29.83 AOD), contributing to flooding in the nearby Cheetham Hill area and prompting an Environment Agency investigation. [IMG] (p83)</p></div><div class="nugget-popup"><p>Flooding from the River Irwell affected Salford with record river levels; a Flood Warning was issued for the Salford (Area B) reach. Properties flooded above ground floor are referenced as being within Flood Zone 2 and Flood Zone 3. [PAG] (p84)</p></div><div class="nugget-popup"><p>Widespread impacts across Salford: around 750 properties in Lower Broughton were internally flooded; a further 164 properties were affected by power loss and access restrictions; Agecroft cemetery experienced flooding; internal properties accumulated silt and contamination; large amounts of debris were deposited along river reaches and at Media City requiring specialist barges for removal. (p139)</p></div><div class="nugget-popup"><p>River Irwell levels at Salford rose sharply on 26 December 2015, exceeding warning thresholds; a Flood Warning was issued for the River Irwell (Area B) and river flooding caused inundation and flood impacts in Salford. Flood debris was surveyed after waters receded and used to support mapping of flood extents. [IMG,PAG] (p144)</p></div><div class="nugget-popup"><p>High river levels and flooding on 26th December 2015 affected areas of Salford (including Lower Broughton). Responses included opening rest centres, provision of sandbags to residents, structural assessments of bridges due to high river levels, large&ndash;scale waste collection and disposal and multi&ndash;day clean&ndash;up operations, mapping of flood extent, and protection measures for council apparatus at Salford Quays; property&ndash;level flood resilience measures and targeted funding were provided to affected parties. [PAG] (p145)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>peak river gauge level 5.668 m; peak flow 500.0 m³/s; Rank 1 (highest recorded); annual probability ~150 years [TAB] (p15)</p></div><div class="nugget-popup quant"><p>750 properties [TAB,PAG] (p17)</p></div><div class="nugget-popup quant"><p>950 properties without power in Delph; 250 properties without power in Salford; 31,200 properties without power (Greater Manchester total) (p21)</p></div><div class="nugget-popup quant"><p>750 properties (p29)</p></div><div class="nugget-popup quant"><p>up to 47 non&ndash;residential properties within the overall area affected; 27 non&ndash;residential properties flooded internally; river level 5.67m (record; 1.3m higher than any other reading in 75 years) [IMG] (p83)</p></div><div class="nugget-popup quant"><p>around 750 properties; 164 properties (p139)</p></div></div></body></div>`)[0];
                popup_60df9a59108e453b97448c4d1653a743.setContent(html_f25322c7454382bb5a3f49416e3f8d90);

                var html_e0a17264f796a71902827461302bed45 = $(`<div id="html_e0a17264f796a71902827461302bed45" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bury</h1><div class="nugget-popup"><p>River gauges in the Bury area recorded record or very high peak levels on Boxing Day (affecting locations within the Bury area), indicating river flooding in the Bury catchment. [TAB,PAG] (p15)</p></div><div class="nugget-popup"><p>Extensive internal flooding to properties during the event; flooding was predominantly from main rivers with some surface&ndash;water and ordinary watercourse contribution. [TAB,PAG] (p17)</p></div><div class="nugget-popup"><p>Two bridges in Bury (at Milltown Street and Lomax Street) that carried cables were destroyed by the floods; temporary supply restoration implemented and permanent repairs planned. (p21)</p></div><div class="nugget-popup"><p>Bury wastewater treatment works was flooded and several treatment processes were affected; additionally, standing water was reported on the M66 near Bury which temporarily closed a lane and the hard shoulder. (p22)</p></div><div class="nugget-popup"><p>Bury was affected by the Boxing Day flooding; RMAs held a local drop&ndash;in event and carried out visual inspections of flood&ndash;risk assets in the aftermath. (p27)</p></div><div class="nugget-popup"><p>Flooding caused damage to the wastewater treatment works leading to effluent being discharged to the river after the flood that did not meet full treatment standards for several weeks. (p29)</p></div><div class="nugget-popup"><p>Across Bury borough a total of 804 properties were affected by the 26 December 2015 flood event; affected locations included Radcliffe and Redvales, Pioneer Mill, industrial properties near Bury town centre and other named settlements. [IMG,PAG] (p56)</p></div><div class="nugget-popup"><p>Flooding affected industrial properties close to Bury town centre and caused residential and commercial property flooding in the town; river levels at nearby gauges exceeded reference thresholds during the event. [IMG,PAG] (p57)</p></div><div class="nugget-popup"><p>The borough experienced widespread flooding on 26th December 2015: hundreds of residential and commercial properties and highways flooded (disrupting access), damage to drainage systems causing ongoing flooding, severe impacts to recreational grounds and parks, infrastructure failures (bridge collapses/damage), treated sewage discharge from the flooded wastewater works, and power outages affecting properties in the borough. (p58)</p></div><div class="nugget-popup"><p>Flooding affected the town: temporary road and bridge closures to protect significant bridges over the river; emergency sandbags were distributed; a rest centre was opened; clean&ndash;up operations (including free skips) were carried out; Bury wastewater treatment works was flooded and treatment processes were affected requiring a recovery plan with the Environment Agency; United Utilities reported sewer flooding of properties in the area. (p63)</p></div><div class="nugget-popup"><p>River levels at Bury reached extreme levels associated with the same event (Environment Agency estimated levels with an approximate 1 in 120&ndash;180 year likelihood), contributing to flooding in the local area and prompting review of the River Irwell at Pioneer Mills and Parkside Close Flood Warning Area and local recovery actions. (p66)</p></div><div class="nugget-popup"><p>Multiple flood impacts across Bury on 26 December 2015: six industrial properties at Chamberhall flooded (initially by surface&ndash;water drains, then by the River Irwell overtopping a boundary wall); all flooded units experienced inundation to depths of about 0.6&ndash;1.0 m. Residential properties in Redvales and Fairfield were also affected by surface&ndash;water runoff and by flooding related to culverted watercourses and blocked drains; one flood&ndash;proofed property flooded when water backed up through drains and leaked through walls. Ongoing investigations by Bury Council and the Environment Agency were recorded. [IMG,PAG,MUL] (p68)</p></div><div class="nugget-popup"><p>On 26 December 2015 high River Irwell levels affected Bury (estimated as an unusually rare event), with properties in Flood Zones 2 and 3 flooded. A number of locations experienced surface water run&ndash;off and culvert&ndash;related flooding (notably the Lakeland Crescent area). Safety inspections were required on the day, several key structures were closed until detailed inspections could be completed, and residents were offered evacuation to a rest centre. (p70)</p></div><div class="nugget-popup"><p>Commercial properties within Bury Council's area (including the affected industrial/business park) were flooded; the event led to local community actions such as a Heap Bridge Residents Committee meeting regularly. (p81)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Pioneer Mills 5.331 m; Ramsbottom 3.385 m; Bury Grounds peak flow 284.0 m³/s and gauge 2.178 m; Rank 1 at listed stations [TAB,PAG] (p15)</p></div><div class="nugget-popup quant"><p>800 properties; 726 properties flooded by main river; 15 by ordinary watercourse; 59 by surface water [TAB,PAG] (p17)</p></div><div class="nugget-popup quant"><p>2 bridges destroyed (p21)</p></div><div class="nugget-popup quant"><p>804 properties [IMG,PAG] (p56)</p></div><div class="nugget-popup quant"><p>3,200 properties (p58)</p></div><div class="nugget-popup quant"><p>19 properties flooded from sewers (p63)</p></div><div class="nugget-popup quant"><p>6 industrial properties; depth 0.6&ndash;1.0 m [IMG,PAG,MUL] (p68)</p></div></div></body></div>`)[0];
                popup_e8336cfb9b8e006cde2380aceaed1165.setContent(html_e0a17264f796a71902827461302bed45);

                var html_68d4910ce870587ea8e497c6fed2004d = $(`<div id="html_68d4910ce870587ea8e497c6fed2004d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wigan</h1><div class="nugget-popup"><p>Flooding across the borough from multiple sources (main river, ordinary watercourses, sewers and surface water) caused internal flooding to properties. [TAB,PAG] (p17)</p></div><div class="nugget-popup"><p>Wigan was affected by the Boxing Day flooding; RMAs held a local drop&ndash;in event and conducted visual inspections of flood&ndash;risk assets following the event. (p27)</p></div><div class="nugget-popup"><p>Flooding occurred around Wigan on 26 December 2015; homes were evacuated by emergency services as part of the response and the local area contributed to the wider travel disruption and infrastructure impacts noted after the event. (p29)</p></div><div class="nugget-popup"><p>A total of 93 properties in Wigan borough experienced internal flooding from multiple sources. Worst&ndash;affected areas included Platt Bridge (18 properties flooded from Hey Brook), Bickershaw and Abram (15 properties flooded from Hey Brook/main river and ordinary watercourse), Worsley Mesnes (9 properties flooded from sewer), Aspull (4 properties flooded from surface water and/or sewers), Standish (6 properties flooded from River Douglas, Frodshams Brook, surface water and sewer) and Hindley (5 properties flooded from combined sources including surface water, sewers and main river). [IMG,PAG] (p146)</p></div><div class="nugget-popup"><p>A total of 93 properties in the Wigan borough experienced internal flooding on 26 December 2015. Worst&ndash;affected locations and primary sources recorded were: Platt Bridge (18 properties flooded from Hey Brook), Bickershaw and Abram (15 properties flooded from Hey Brook and an ordinary watercourse), Worsley Mesnes (9 properties flooded from sewers), Aspull (4 properties flooded from surface water and/or sewers), Standish (6 properties flooded from River Douglas, Frodshams Brook, surface water and sewer), and Hindley (5 properties flooded from combined sources including surface water and sewers). [IMG,PAG] (p147)</p></div><div class="nugget-popup"><p>In this location a total of 9 properties were flooded &mdash; 8 from surface water (direct standing water or from drains unable to discharge due to high levels in Smithy Brook) and 1 from sewer flooding. (p159)</p></div><div class="nugget-popup"><p>Five properties were flooded when high river levels caused Borsdane Brook to overtop its left bank and flow along Platt Lane into Prescott Street, through Aughton Street and Meadows Close before returning to the brook; other affected locations included Atherton Road and Lord Street. Two properties were reported flooded from sewers. Silt deposits and watermarks were observed on Lord Street and Aughton Street. Wigan Metropolitan Borough Council sandbagged a large number of properties as an immediate response. [PAG,MUL] (p162)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>93 properties [TAB,PAG] (p17)</p></div><div class="nugget-popup quant"><p>Around 2,250 properties flooded internally across Greater Manchester (figure applies to multiple affected areas including Wigan); homes were evacuated in several locations including Wigan. (p29)</p></div><div class="nugget-popup quant"><p>93 properties; 18 properties; 15 properties; 9 properties; 4 properties; 6 properties; 5 properties [IMG,PAG] (p146)</p></div><div class="nugget-popup quant"><p>93 properties; 18 properties; 15 properties; 9 properties; 4 properties; 6 properties; 5 properties [IMG,PAG] (p147)</p></div><div class="nugget-popup quant"><p>9 properties; 8 properties; 1 property (p159)</p></div><div class="nugget-popup quant"><p>5 properties; 2 properties [PAG,MUL] (p162)</p></div></div></body></div>`)[0];

                var html_ea3666c61bdd778999b36b600a21859b = $(`<div id="html_ea3666c61bdd778999b36b600a21859b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bolton</h1><div class="nugget-popup"><p>Severe river flooding with water depths so great in parts of Bolton that some residents were evacuated by boat; flooding described as the worst in living memory in some areas; rapid onset and subsequently began to recede by Boxing Day evening. (p13)</p></div><div class="nugget-popup"><p>Internal flooding to properties' ground floors (including attached garages/outbuildings) caused by main river flooding, surface&ndash;water flooding, ordinary watercourse and sewer flooding. [TAB] (p17)</p></div><div class="nugget-popup"><p>Flooding caused power outages in both Bolton and Littleborough and damaged at least one electrical sub&ndash;station in Littleborough. Temporary rerouting and overhead lines were used to restore supply where bridges carrying cables were affected. (p21)</p></div><div class="nugget-popup"><p>Environment Agency river gauging station at Prestolee (near Bolton, on the River Irwell) was completely destroyed by the flood; pumping stations at Prestolee were also affected. (p22)</p></div><div class="nugget-popup"><p>Flooding caused damage to debris screens around Bolton; these screens require repair following the floods. Risk Management Authorities visited the area and held two local drop&ndash;in events to engage the community after the flooding. [PAG] (p27)</p></div><div class="nugget-popup"><p>Debris screens around Bolton were damaged by the floods and require repair; operational recovery work on these screens was programmed to be completed by Autumn 2016. The Dean Brook culvert collapse occurred at Smithills near Bolton (reported after the flooding). (p28)</p></div><div class="nugget-popup"><p>Internal flooding of properties across the borough; properties experienced internal inundation from flooding on 26 December 2015. [IMG] (p41)</p></div><div class="nugget-popup"><p>As part of recovery works upstream of Bolton Metropolitan Borough Council, occupiers of properties on Riverside Drive (a cul&ndash;de&ndash;sac) were temporarily trapped by floodwater (though not flooded); the area around Bolton was included in strategic assessments and flood&ndash;warning reviews after very high river levels were recorded. (p45)</p></div><div class="nugget-popup"><p>Flooding caused damage to local transport and riverside infrastructure (bridges and footpaths), with areas closed for health and safety and inspections underway. (p53)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>116 properties total; 87 properties from main river; 4 properties from ordinary watercourse; 6 properties from sewer; 19 properties from surface water [TAB] (p17)</p></div><div class="nugget-popup quant"><p>1,000 properties without power in Bolton; 1,000 properties without power in Littleborough; 1 sub&ndash;station damaged in Littleborough (p21)</p></div><div class="nugget-popup quant"><p>116 properties [IMG] (p41)</p></div><div class="nugget-popup quant"><p>67 properties; 1.6m higher (p45)</p></div><div class="nugget-popup quant"><p>13 bridges; 300m of riverside footpaths (p53)</p></div></div></body></div>`)[0];

                var html_bd119fccbbb6e9e5c57f6a66bdbc0dcc = $(`<div id="html_bd119fccbbb6e9e5c57f6a66bdbc0dcc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>East Lancashire Railway</h1><div class="nugget-popup"><p>The railway line was closed due to flooding during the event. (p72)</p></div></div></body></div>`)[0];

                var html_ebd3c4be6e34e4551dc19ac2014c16f0 = $(`<div id="html_ebd3c4be6e34e4551dc19ac2014c16f0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Roch</h1><div class="nugget-popup"><p>Areas of Roch (associated with River Roch monitoring locations) experienced very high river levels on 26 December 2015, contributing to river flooding in the town. (p16)</p></div><div class="nugget-popup"><p>River levels in these catchments reached record highs, contributing to flooding across the catchments and exceeding defence design levels. (p20)</p></div><div class="nugget-popup"><p>High flows in the River Roch during the 26 December 2015 event caused damage to flood defence walls and embankments at Rochdale and Littleborough, including the complete collapse of a wall beside a residential care home; minor repairs and rebuilding of affected walls were programmed. (p27)</p></div><div class="nugget-popup"><p>The River Roch overtopped its right bank above a hydropower unit at the weir and flowed down into the industrial / J2 Business Park, causing flooding of commercial units and their accesses. Floodwater was fast, sudden, muddy and polluted. Debris accumulated in the channel and on structures (photo shows debris on a metal structure); a disused footbridge had its 3rd arch blocked and required clearance by riparian landowners. [IMG,PAG] (p80)</p></div><div class="nugget-popup"><p>The River Roch overtopped its right bank above a hydropower unit at the weir and flowed down into an industrial/business park, causing fast, sudden, muddy and polluted flooding that inundated business units and blocked accesses (shutters and doors). Riparian debris blocking (including a blocked 3rd arch on a disused footbridge) was observed and cleared after the event. [PAG] (p81)</p></div><div class="nugget-popup"><p>Named as a primary source of flooding that caused internal property flooding across the borough, including in Rochdale town centre and Wardleworth. [PAG] (p113)</p></div><div class="nugget-popup"><p>The River Roch rose to extreme levels on 26 December 2015 and was identified as a primary source of flooding across Rochdale borough, contributing to internal flooding of properties and record river levels at Blackford Bridge. [IMG,PAG] (p114)</p></div><div class="nugget-popup"><p>Flooding of the River Roch contributed to flood risk between Littleborough and Rochdale town centre on 26th December 2015. This river flooding was a driver for subsequent works and investigations (Environment Agency proposals and a de&ndash;culverting project) to reduce future flood risk. (p115)</p></div><div class="nugget-popup"><p>Overtopping of raised defences and natural banks caused widespread flooding of nearby properties and damage to infrastructure. Contributed to flooding of Greenvale Business Park via overtopping and interaction with the flood relief channel. Infrastructure damage linked to the event included culvert damage at Calderbrook Road, Todmorden Road and Halifax Road, and gully blockage and damage to paths. [PAG] (p117)</p></div><div class="nugget-popup"><p>The River Roch at Littleborough reached record high levels during the event; high river flows caused surface water to pond against a defence wall (which subsequently collapsed) and prevented surface water from draining away, contributing to flooding in the area. A flood warning was issued for the River Roch at Littleborough. [PAG] (p118)</p></div><div class="nugget-popup"><p>Flows in the River Roch through Roch town centre exceeded the capacity of a culvert next to the new bus station, causing river water to flood the town centre. Floodwater travelled along Smith Street and South Parade and re&ndash;entered the river downstream; businesses on Smith Street, South Parade, The Butts and The Walk were flooded; Number One Riverside council office was flooded (ground&ndash;floor library remained closed after reopening); the town centre bus station and tram terminus sustained flood damage; power loss affected many homes and businesses; the town hall narrowly avoided flooding. Downstream, the Asda superstore, adjacent Curry's PC World and the Sixth Form College suffered internal flood damage and St Mary&#8217;s Gate subway was damaged. (p121)</p></div><div class="nugget-popup"><p>High river flows on the River Roch caused flooding in Rochdale; a formal flood warning area was active and the river gauge at Albert recorded the highest level in 22 years. (p123)</p></div><div class="nugget-popup"><p>River Roch was the main river source for flooding in the area: properties close to the River Roch were flooded internally (to depths up to 400 mm) and a large portion of the reported flooded properties (35 of 36) were attributed to the main river (River Roch and Hey/Buckley Brook). Cellars adjacent to the River Roch flooded from surface water/groundwater when the brook reached high levels. (p125)</p></div><div class="nugget-popup"><p>Very high river levels on 26 December 2015 (the gauge at Albert Royds Street recorded its highest level in 22 years) caused flooding of properties adjacent to the River Roch (internal flooding reported, cellars flooded from groundwater/surface water) and contributed to wider flood extent in Rochdale/Wardleworth. Local interventions (assessments, gravel removal and proposals to reduce risk) were initiated after the event. [PAG] (p126)</p></div><div class="nugget-popup"><p>Flooding from the River Roch (and its drains) caused rear yard drains of residential properties to fill and then river water entered properties. Flow was gradual at first then became fast; muddy, polluted water flowed into properties to depths of about 600 to 900 mm. Riparian debris (a blocked third arch of a disused footbridge) was identified and subsequently cleared by riparian landowners. (p128)</p></div><div class="nugget-popup"><p>Exceptional flows in the River Roch on 26th December 2015 generated flooding in the Heap Bridge area and on Bury Road. Saturated ground increased runoff and contributed to the severity of flooding; nearby gauging (Rochdale Wastewater Treatment Works) recorded unusually high levels during the event. (p129)</p></div><div class="nugget-popup"><p>River levels on the Roch rose to a very large event (highest gauge reading in 22 years at the gauge location) and caused flooding of properties (including 20 properties at Hooley Bridge Industrial Estate). [TAB] (p134)</p></div><div class="nugget-popup"><p>River levels reached their highest in 22 years at Albert Royds Street (between Belfield and the town centre), producing significant river flooding that led to properties being flooded, including some properties outside Flood Zone 3. (p137)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>37 of 44 river level gauges in the River Irwell, Roch and Croal catchments recorded their highest ever levels (p20)</p></div><div class="nugget-popup quant"><p>one wall completely failed (p27)</p></div><div class="nugget-popup quant"><p>10 business properties flooded; depths 0.3 m to 1.5 m (typical 0.5 m); one industrial unit where cars floated; 3rd arch blocked [IMG,PAG] (p80)</p></div><div class="nugget-popup quant"><p>324 properties flooded internally (borough total); Blackford Bridge level 3.362 m; 1.1 m higher than any previous reading [IMG,PAG] (p114)</p></div><div class="nugget-popup quant"><p>158 properties flooded above ground floor level (shared with Greenvale Brook) [PAG] (p117)</p></div><div class="nugget-popup quant"><p>over 690 properties [PAG] (p118)</p></div><div class="nugget-popup quant"><p>54 properties flooded; properties flooded up to 1.5 metres deep (measured at The Butts); Asda flooded up to 50 mm; two cellars flooded (p121)</p></div><div class="nugget-popup quant"><p>541 properties; highest gauge in 22 years; 400 mm higher than previous recorded high (p123)</p></div><div class="nugget-popup quant"><p>35 properties flooded due to main river (River Roch and Hey/Buckley/Buckley Brook); up to 400mm internal depth (p125)</p></div><div class="nugget-popup quant"><p>10 properties; 600 to 900 mm (p128)</p></div><div class="nugget-popup quant"><p>20 properties [TAB] (p134)</p></div></div></body></div>`)[0];
                popup_03a531046203db35c452c8c8ccfcabad.setContent(html_ebd3c4be6e34e4551dc19ac2014c16f0);

                var html_b536431536d79fd0ff2faa6d5c2867f2 = $(`<div id="html_b536431536d79fd0ff2faa6d5c2867f2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Croal</h1><div class="nugget-popup"><p>River levels in these catchments reached record highs, contributing to flooding across the catchments and exceeding defence design levels. (p20)</p></div><div class="nugget-popup"><p>The Croal catchment recorded exceptionally high river levels and contributed to main&ndash;river flooding and associated damage to river&ndash;related assets and property flooding in the wider area. (p29)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>37 of 44 river level gauges in the River Irwell, Roch and Croal catchments recorded their highest ever levels (p20)</p></div><div class="nugget-popup quant"><p>Part of the River Irwell, Roch and Croal catchments where 37 of 44 gauges recorded their highest ever levels; contributed to the around 2,250 internally flooded properties across the catchments (p29)</p></div></div></body></div>`)[0];

                var html_fa465adc9452aaf02f943c616b8907cb = $(`<div id="html_fa465adc9452aaf02f943c616b8907cb" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Irwell</h1><div class="nugget-popup"><p>River levels in the Upper Irwell rose rapidly in response to heavy, long&ndash;duration rainfall on saturated ground, producing fast&ndash;onset, widespread flooding across the Upper Irwell catchment and contributing to devastating flooding in Greater Manchester (depths in parts of the area were reported as so great that residents had to be evacuated by boat). [PAG] (p13)</p></div><div class="nugget-popup"><p>On 26th December 2015 river levels in the Irwell catchment rose very rapidly and reached exceptionally high peak levels (many sites recorded their highest&ndash;ever Boxing Day levels), producing fluvial flooding across downstream parts of the Irwell catchment in Greater Manchester and overwhelming planned pre&ndash;emptive actions and communications. (p14)</p></div><div class="nugget-popup"><p>Multiple gauging stations on the River Irwell across Greater Manchester recorded their highest&ndash;ever levels on Boxing Day, producing widespread river flooding along the Irwell corridor (examples include 6.330 m at Kearsley Ultrasonic and 5.668 m at Manchester Racecourse). [TAB,PAG] (p15)</p></div><div class="nugget-popup"><p>River Irwell catchment experienced exceptionally high river levels contributing to widespread flooding across the catchment area; record gauge readings correlate with flooded properties in nearby areas. [IMG] (p20)</p></div><div class="nugget-popup"><p>The River Irwell catchment was a primary focus of the heavy rainfall and recorded very high/record river levels, causing major river flooding, damage to river channel retaining walls, culverts and bridges, mobilisation of large volumes of gravel downstream, and contributing to extensive internal property flooding. (p29)</p></div><div class="nugget-popup"><p>High flows in the River Irwell caused flooding in the local area; the river inundated Prestolee properties resulting in internal flooding of homes (see Prestolee impacts). [PAG] (p41)</p></div><div class="nugget-popup"><p>The River Irwell rose to exceptionally high levels at Kearsley (6.33m, a 13&ndash;year record), with river level peaks driven by intense rainfall in the catchment. High river levels were associated with infrastructure damage including the collapse of a United Utilities pipe bridge at Kearsley and damage to Prestolee pumping station. [IMG] (p42)</p></div><div class="nugget-popup"><p>The River Irwell overtopped natural banks and caused river flooding that entered properties. Floodwaters from the Irwell internally flooded multiple properties and at least one business; floodwaters affected riverside streets and residential blocks in the local area. [PAG] (p44)</p></div><div class="nugget-popup"><p>The River Irwell reached exceptionally high levels at multiple gauging stations and caused flooding that inundated properties (notably in Radcliffe and Redvales). Recorded high water levels coincided with property flooding in the Bury area. [PAG] (p56)</p></div><div class="nugget-popup"><p>High River Irwell levels caused residential and commercial property flooding in the catchment; the Waterside Restaurant in Summerseat collapsed into the river causing partial collapse and closure of the associated masonry arch bridge; flood&ndash;related infrastructure failures (including the Lomax Street footbridge collapse, gas main rupture and sewage discharge) occurred along the river. [IMG,PAG] (p57)</p></div><div class="nugget-popup"><p>The River Irwell reached extremely high levels (estimated rare event) and overtopped/breached banks causing flooding at Bury, Radcliffe and Redvales; flood sedimentation and damage to river monitoring equipment led to scheduled gravel removal and gauging&ndash;station repairs; flood warning areas (GM41/GM42) and thresholds were reviewed following the event. (p63)</p></div><div class="nugget-popup"><p>The River Irwell overtopped its banks and caused flooding at Pioneer Mill, inundating the mill from three sides. (p65)</p></div><div class="nugget-popup"><p>The River Irwell overtopped at Chamberhall, flooding adjacent roads and industrial properties; water also seeped under a raised boundary wall and emerged behind it, and debris and significant inundation were observed at Chamberhall. [IMG,PAG] (p69)</p></div><div class="nugget-popup"><p>Extremely high River Irwell levels on 26 December 2015 (reported at Bury and Pioneer Mill) caused river flooding &mdash; the raised wall delayed onset but was not a formal flood defence, and river water seeped beneath a boundary wall and emerged behind it. (p70)</p></div><div class="nugget-popup"><p>Exceptionally high river levels caused main&ndash;river flooding on 26 December 2015, prevented surface water drainage outfalls, contributed to inundation of culverts and overland flows that combined with river flooding in low&ndash;lying areas; this contributed to property and business flooding and to damage at culverts (notably at Crow Lane/Bridge Street). (p72)</p></div><div class="nugget-popup"><p>The River Irwell reached extreme levels that overtopped/approached defences, caused flooding of adjacent open spaces (cricket and football grounds), damaged river channel walls at Nuttall Park, and damaged the weir and canoe pass just upstream of Peel Brow. Bridges were temporarily closed and inspected; gravel removal and channel repairs were part of recovery works. (p74)</p></div><div class="nugget-popup"><p>High river levels in the River Irwell overtopped raised defences and natural banks at Cheetham Hill and caused flooding which exceeded the capacity of the surface water network; non&ndash;residential properties in the area were inundated. [IMG] (p83)</p></div><div class="nugget-popup"><p>River levels at Salford reached a record high of 5.67 m (29.83 AOD), 1.3 m higher than any previous reading in 75 years; a Flood Warning was issued for the River Irwell (Salford Area B). [PAG] (p84)</p></div><div class="nugget-popup"><p>River Irwell overtopped raised defences and natural banks after high rainfall. Raised water levels (partly attributed to debris caught beneath Hough Lane footbridge) led to overtopping between Wallness Bridge and Hough Lane Bridge, causing flows into Lower Broughton, damage to river walls and walkways at the rear of the Soapworks site, erosion to a footbridge abutment in Clifton Country Park, and deposition of large amounts of debris along river banks and at Media City (requiring specialist removal). The overtopping and exceedance of the surface water network capacity resulted in widespread internal property flooding in Lower Broughton. [PAG] (p139)</p></div><div class="nugget-popup"><p>High water levels in the River Irwell rose close to or onto its banks, producing fast&ndash;flowing, muddy water with debris and threatening nearby riverside areas and residential properties. The elevated river levels contributed to overtopping and inundation of adjacent roads and paths. [IMG] (p140)</p></div><div class="nugget-popup"><p>River Irwell overtopped its banks, with river water breaching containment and inundating adjacent pedestrian areas (pavement and tree bases) at Heath Lane. [IMG,PAG] (p142)</p></div><div class="nugget-popup"><p>Recorded an extreme, record&ndash;high river level (5.67 m / 29.83 AOD), 1.3 m higher than any previous reading in 75 years, representing a rare (estimated 100&ndash;150 year) event and causing river flooding in the catchment that contributed to flooding downstream. [PAG] (p143)</p></div><div class="nugget-popup"><p>The River Irwell responded to intense rainfall with a large rise in level, peaking on 26 December 2015 above critical/warning thresholds; high flows triggered a Flood Warning for Area B and led to inundation (including of the Castle Irwell basin) and urban flood impacts around Salford. [IMG,PAG] (p144)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>peaks including 6.330 m (Kearsley Ultrasonic) and 5.668 m (Manchester Racecourse); flows up to 500.0 m³/s [TAB,PAG] (p15)</p></div><div class="nugget-popup quant"><p>37 of 44 river level gauges recorded their highest ever levels [IMG] (p20)</p></div><div class="nugget-popup quant"><p>Particularly high levels in the Irwell catchment within the 37 of 44 gauges recording their highest ever levels; contributed to the total of around 2,250 properties flooded internally (p29)</p></div><div class="nugget-popup quant"><p>57 homes (at Prestolee); flood depths up to 1.5 metres (at Prestolee) [PAG] (p41)</p></div><div class="nugget-popup quant"><p>6.33m river level; 1.6m above previous record [IMG] (p42)</p></div><div class="nugget-popup quant"><p>57 properties internally flooded; 1 business flooded [PAG] (p44)</p></div><div class="nugget-popup quant"><p>671 properties; river levels recorded: 5.33 m at Pioneer Mills (Radcliffe), 3.39 m at Ramsbottom, 3.36 m at Blackford Bridge, 2.18 m at Bury Grounds [PAG] (p56)</p></div><div class="nugget-popup quant"><p>1 restaurant collapsed; 1 footbridge collapsed [IMG,PAG] (p57)</p></div><div class="nugget-popup quant"><p>River levels at Bury estimated 1 in 120 to 180 years; 0.6 to 0.8m general flood depth (Radcliffe and Redvales); maximum 1.45m at Parkside Close (p63)</p></div><div class="nugget-popup quant"><p>flooded Pioneer Mill from 3 sides (p65)</p></div><div class="nugget-popup quant"><p>6 industrial properties [IMG,PAG] (p69)</p></div><div class="nugget-popup quant"><p>47 properties (p72)</p></div><div class="nugget-popup quant"><p>26 properties (p74)</p></div><div class="nugget-popup quant"><p>47 non&ndash;residential properties within the overall area affected; 27 non&ndash;residential properties flooded internally [IMG] (p83)</p></div><div class="nugget-popup quant"><p>river level of 5.67 m (29.83 AOD); 1.3 m higher than any other reading in 75 years; estimated likelihood once in 100 to 150 years [PAG] (p84)</p></div><div class="nugget-popup quant"><p>around 750 properties; 164 properties; three distinct flow routes [PAG] (p139)</p></div><div class="nugget-popup quant"><p>5.67 m river level; 29.83 AOD; 1.3 m higher than previous maximum; 75 years of record; estimated return period 100&ndash;150 years [PAG] (p143)</p></div></div></body></div>`)[0];
                popup_4d3cc97ddfc13a799f689f99d8ce1be7.setContent(html_fa465adc9452aaf02f943c616b8907cb);

                var html_e45c013b440b0432ebeb896b1f17385a = $(`<div id="html_e45c013b440b0432ebeb896b1f17385a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Tame</h1><div class="nugget-popup"><p>River Tame overtopped its natural banks causing internal flooding to properties; surface water and surcharging road gullies and ordinary watercourses also contributed to flooding across the area. (p92)</p></div><div class="nugget-popup"><p>The River Tame overflowed and caused river flooding that inundated riverside residential buildings; floodwater reached and covered the lower/ground&ndash;floor windows of a stone house adjacent to the river. [IMG] (p100)</p></div><div class="nugget-popup"><p>High flows/overflow of the River Tame were described as adjacent to affected properties and are implicated in the flooding of the balcony and house at Wright Mill. [IMG,PAG] (p111)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>42 properties; 7 businesses; 35 residential properties; 16 properties (River Tame); 9 properties (ordinary watercourses); 17 properties (surface water) (p92)</p></div></div></body></div>`)[0];

                var html_a7c2d2ade109f99eda96c8b63723218c = $(`<div id="html_a7c2d2ade109f99eda96c8b63723218c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Spodden</h1><div class="nugget-popup"><p>The River Spodden was identified as one of the primary watercourses causing flooding in Rochdale borough, contributing to internal flooding of properties on 26 December 2015. (p113)</p></div><div class="nugget-popup"><p>Flooding from the River Spodden inundated two cellars and the yard at a piling contractor's depot near its confluence with the River Roch. (p121)</p></div><div class="nugget-popup"><p>The River Spodden catchment experienced very high rainfall producing significant surface flows down moorland above Littleborough and elsewhere, contributing to the overall flood event. (p123)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>two cellars (p121)</p></div></div></body></div>`)[0];

                var html_96f072010a178cfb1961250132c1e81c = $(`<div id="html_96f072010a178cfb1961250132c1e81c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>St Elizabeth's Road, Aspull</h1><div class="nugget-popup"><p>A culvert collapsed at this location during the flooding event and repairs were carried out. (p156)</p></div></div></body></div>`)[0];

                var html_5966037a8e9f1f6af0650317a20a0ebb = $(`<div id="html_5966037a8e9f1f6af0650317a20a0ebb" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Greater Manchester</h1><div class="nugget-popup"><p>Widespread flooding across Greater Manchester resulted from intense, prolonged rainfall on saturated catchments. The event produced very high river levels (many rivers at their highest recorded levels) and caused significant impacts to communities, businesses, transport infrastructure and the environment. (p6)</p></div><div class="nugget-popup"><p>Widespread flooding on 26 December 2015 that flooded homes and businesses across the area. Addresses of flooded homes and businesses were collected and verified; people claimed the £500 Community Recovery payment; road closures occurred and emergency services recorded call&ndash;outs and responses. (p8)</p></div><div class="nugget-popup"><p>Storm Eva (Christmas Day and Boxing Day 2015) brought the heaviest rain over Pennine areas north of Manchester; soils were saturated beforehand and close to capacity, producing high runoff and elevated flood risk across the Greater Manchester area during the 25&ndash;26 December 2015 event. [PAG] (p12)</p></div><div class="nugget-popup"><p>Widespread and rapid flooding occurred across Greater Manchester due to heavy rainfall on saturated ground. Rivers (notably the Irwell, Roch and Glaze) rose rapidly producing deep inundation in places; parts of Bolton, Salford and Rochdale experienced such depths that residents were evacuated by boat. A Major Incident was declared and recovery operations followed as levels receded by Boxing Day evening. (p13)</p></div><div class="nugget-popup"><p>Widespread flooding across the county on 26 December 2015: many river gauges recorded their highest&ndash;ever levels (Rank 1) and major reaches of the Irwell catchment experienced extreme river levels and flows leading to river flooding of communities and infrastructure. (p15)</p></div><div class="nugget-popup"><p>The Greater Manchester area experienced widespread internal property flooding during the event; the report provides an overview map of flooding across the area. (p19)</p></div><div class="nugget-popup"><p>Widespread flooding across the metropolitan area caused internal flooding of properties, issued direct flood warnings to residents, and prompted investment and mitigation planning. [IMG,PAG] (p20)</p></div><div class="nugget-popup"><p>Widespread river and surface&ndash;water flooding across the Irwell, Roch and Croal catchments: 37 of 44 river&ndash;level gauges recorded their highest&ndash;ever levels. Flooding exceeded defence levels used for infrastructure resilience. Large&ndash;scale electricity supply loss across the conurbation (see local breakdowns); six electrical sub&ndash;stations were flooded or damaged, mobile generators were mobilised. Multiple bridges were damaged or displaced; some required extensive permanent repairs. [PAG] (p21)</p></div><div class="nugget-popup"><p>Widespread flooding across the region caused transport disruption (tram services suspended on several routes; major rail services disrupted and route checks required; road closures, diversions and impassable roads), damage to Environment Agency assets and river defences (including destruction/damage of river gauging stations), and flooding at wastewater treatment works and pumping stations which affected treatment processes and recovery operations. Local authority offices in town centres were flooded, affecting servers and slowing recovery coordination. (p22)</p></div><div class="nugget-popup"><p>Widespread flood impacts across the county included inundation and operational disruption of wastewater treatment works (Bury flooded; Rochdale and Urmston affected), combined sewer overflow discharges and polluted runoff affecting water quality, mobilisation and deposition of large quantities of gravel and masonry rubble altering channels and increasing local flood or erosion risk, habitat damage and potential spread of invasive species, and local slope failures beside watercourses due to waterlogged ground. (p23)</p></div><div class="nugget-popup"><p>A major incident was declared and a multi&ndash;agency response operated across the area. Rest centres were opened for displaced people. Significant repair works were required to highways, cycle paths, footpaths, river channels, retaining walls and drainage systems. An extensive cleanup operation collected and disposed of waste and debris. Electricity substations were inundated and defences overtopped causing power losses; Distribution Network Operators undertook emergency repairs. United Utilities saw a large increase in wastewater incidents and attended many sites; properties were flooded from sewers. A Recovery Coordinating Group was formed to manage recovery activity. [PAG] (p25)</p></div><div class="nugget-popup"><p>River flooding from main rivers on 26 December 2015 affected the area; many properties received direct flood warnings and others benefited from defences and operational protection; some parts that flooded did not receive a flood warning and are subject to review. (p26)</p></div><div class="nugget-popup"><p>River flooding on 26 December 2015 affected multiple boroughs; Environment Agency and other RMAs carried out visual inspections of flood defence assets, recorded damage to assets and programmed emergency and minor repairs to walls and embankments in locations including Rochdale and Littleborough. (p27)</p></div><div class="nugget-popup"><p>Largest recorded flood across the area with record high river levels in the Irwell, Roch and Croal catchments; widespread internal property flooding and damage to river channels, retaining walls, culverts and bridges; local wastewater treatment plant performance affected causing effluent discharge to rivers. (p29)</p></div><div class="nugget-popup"><p>Greater Manchester experienced extreme rainfall and widespread flooding on Boxing Day that devastated many communities across the area; flooding mechanisms were complex with the majority caused by main rivers and further properties affected by surface water, ordinary watercourse and groundwater flooding. RMAs have continued work across the area on inspections, repairs and community engagement. [PAG] (p30)</p></div><div class="nugget-popup"><p>Widespread flooding affected communities across the metropolitan area; risk management authorities (RMAs) and responders worked together in incident response and recovery to support affected communities and have produced a joint flood investigation report with recommendations and next steps. [PAG] (p31)</p></div><div class="nugget-popup"><p>Widespread flooding across Greater Manchester on 26th December 2015 that caused damage to infrastructure and local flood defences, flooding of communities across multiple boroughs and prompted multi&ndash;agency recovery, investigations and repair works (including collapsed river retaining walls, damaged channel walls and collapsed lengths of flood defence in specific locations). [TAB,PAG] (p32)</p></div><div class="nugget-popup"><p>Widespread flooding on 26 December 2015 affected communities across Greater Manchester (including Abram, Platt Bridge and Hindley). The event prompted an investigation and led to recommendations and planned actions to improve flood protection&mdash;specifically investigation of improvements at Hindley and consideration of natural measures to slow flows into Borsdane Brook upstream of Hindley&mdash;and coordinated work by Risk Management Authorities to prioritise and take forward measures subject to funding. (p37)</p></div><div class="nugget-popup"><p>Parts of Greater Manchester were affected by the 26 December 2015 floods; within Bury borough (part of Greater Manchester) a total of 804 properties were affected and map data show hotspots of high property impact in central Bury and southern areas near Prestwich and Manchester. [IMG] (p56)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2,200 properties flooded internally; 63 communities; 7 Local Authority districts; tens of thousands of properties disrupted by power loss and road closures (p6)</p></div><div class="nugget-popup quant"><p>Multiple gauging stations recorded Rank 1 (highest&ndash;ever) peaks; e.g. Irwell Vale peak flow 177.0 m³/s, Kearsley Ultrasonic peak flow 500.0 m³/s, Manchester Racecourse peak flow 500.0 m³/s (p15)</p></div><div class="nugget-popup quant"><p>over 2,200 properties flooded internally (p19)</p></div><div class="nugget-popup quant"><p>Over 2,200 properties flooded internally; 5,718 properties received a direct flood warning; Over £22 million investment planned from 2015/16 to 2020/21 to protect approximately 6,000 households [IMG,PAG] (p20)</p></div><div class="nugget-popup quant"><p>37 of 44 river level gauges; 31,200 properties without power; 6 sub&ndash;stations damaged; 30 mobile generators mobilised; 2 bridges destroyed [PAG] (p21)</p></div><div class="nugget-popup quant"><p>2 gauging stations destroyed; 1 gauging station with severe electrical damage (p23)</p></div><div class="nugget-popup quant"><p>over 5,700 properties received a direct flood warning; United Utilities staff attended over 344 sites; 6 properties reported internal sewer flooding to United Utilities; 45 properties reported external flooding from sewers to United Utilities; Local Authorities reported a further 18 properties flooded internally from sewers [PAG] (p25)</p></div><div class="nugget-popup quant"><p>5,718 properties received a direct flood warning; 2,454 properties benefited from protection (p26)</p></div><div class="nugget-popup quant"><p>nearly 4,000 assets inspected; 24 formal flood defence assets recorded as having some damage; one flood wall completely failed (p27)</p></div><div class="nugget-popup quant"><p>37 of 44 gauges in the River Irwell, Roch and Croal catchments recorded their highest ever levels; around 2,250 properties flooded internally across the affected area; approximately 2,450 properties were protected by defences; 25 properties reported internal sewer flooding; inspections of approximately 4,000 river assets/structures (p29)</p></div><div class="nugget-popup quant"><p>approximately 4,000 assets/structures inspected across the area; Nearly £2 million allocated to repairing structures on main rivers and removing gravel; 36 affected communities visited within three days [PAG] (p30)</p></div><div class="nugget-popup quant"><p>804 properties; hotspots with 251&ndash;500 properties per 1 km x 1 km grid square (map legend indicated) [IMG] (p56)</p></div></div></body></div>`)[0];

                var html_7ae4bfc46667e9f08464e1c47d59fc75 = $(`<div id="html_7ae4bfc46667e9f08464e1c47d59fc75" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lower Broughton</h1><div class="nugget-popup"><p>Extensive internal flooding to properties caused by main river flooding in the Lower Broughton area of Salford. [TAB,PAG] (p17)</p></div><div class="nugget-popup"><p>The area was listed among locations with significant flooding during the 26 December 2015 event; streets and properties were flooded and local authorities responded to incidents in the area. (p18)</p></div><div class="nugget-popup"><p>Properties flooded internally as part of the December 2015 flooding; area included in the ~750 properties flooded across Lower Kersal, Lower Broughton and Cheetham Hill. Flood storage works were under construction to reduce future risk (protecting up to 1,900 homes/businesses). [IMG] (p20)</p></div><div class="nugget-popup"><p>Environment Agency river gauging station at Lower Broughton suffered severe electrical damage, degrading the station that provides data used to trigger flood warnings for nearby properties. (p22)</p></div><div class="nugget-popup"><p>The River Irwell overtopped raised defences and natural banks and high rainfall exceeded the capacity of the surface water network, causing properties in the Lower Broughton area to flood. Flooded properties are mapped on both the Salford (majority, west of the river) and Manchester (smaller contiguous zone east of the river) sides of the river. [IMG] (p138)</p></div><div class="nugget-popup"><p>Floodwater entered the area via three flow routes after River Irwell overtopped, causing internal flooding of residential properties (including silt deposition inside homes), widespread disruption to access and power, and significant property damage and displacement. [IMG] (p139)</p></div><div class="nugget-popup"><p>Internal property flooding deposited silt across the floor of at least one dwelling, disrupting living conditions. Streets in the area were inundated, with at least one vehicle becoming stuck and requiring multiple responders to push it free. [IMG] (p141)</p></div><div class="nugget-popup"><p>Floodwater covered residential streets in the area (e.g., Lyra Place), impeding passage and requiring residents to wade through water; vehicles were partially submerged and residents were displaced/evacuated from properties. [IMG] (p143)</p></div><div class="nugget-popup"><p>Area experienced flooding prompting a separate detailed investigation by Salford City Council; United Utilities received reports of sewer flooding to external grounds in the Lower Broughton area. (p145)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>750 properties [TAB,PAG] (p17)</p></div><div class="nugget-popup quant"><p>Approximately 750 properties (across Lower Kersal, Lower Broughton and Cheetham Hill) [IMG] (p20)</p></div><div class="nugget-popup quant"><p>around 750 properties; 164 properties [IMG] (p139)</p></div><div class="nugget-popup quant"><p>2 properties (p145)</p></div></div></body></div>`)[0];

pup quant"><p>5 properties flooded [TAB,PAG] (p17)</p></div><div class="nugget-popup quant"><p>5 properties [IMG,PAG] (p146)</p></div><div class="nugget-popup quant"><p>5 properties [PAG] (p147)</p></div><div class="nugget-popup quant"><p>5 properties; 8 properties; 1 property [IMG] (p160)</p></div><div class="nugget-popup quant"><p>5 properties flooded; 2 properties reported as flooded from sewers (p162)</p></div></div></body></div>`)[0];

                var html_fded03b75fbc48ff6e833670d2bace26 = $(`<div id="html_fded03b75fbc48ff6e833670d2bace26" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Delph</h1><div class="nugget-popup"><p>On 26th December 2015 Delph was identified as an exception within the Mersey catchment where flooding did occur despite generally modest rainfall across the Mersey catchment. (p14)</p></div><div class="nugget-popup"><p>Internal flooding to properties from main river, ordinary watercourse and surface water. [TAB] (p17)</p></div><div class="nugget-popup"><p>Delph and Salford experienced power outages caused by flooding; the report gives local property counts and the overall total for Greater Manchester outages. (p21)</p></div><div class="nugget-popup"><p>Delph was one of the worst affected locations; 42 properties were internally flooded. River Tame at Delph rose in response to the rainfall. [PAG] (p88)</p></div><div class="nugget-popup"><p>The River Tame at Delph rose sharply in response to intense rainfall on 26&ndash;27 December 2015; river level exceeded the bankful threshold and approached the flood threshold, producing a pronounced peak in river levels and elevated flood risk along the channel. [IMG] (p89)</p></div><div class="nugget-popup"><p>Clusters of reported property flooding caused by the main river, ordinary watercourses and surface water. The largest main&ndash;river cluster southeast of Delph corresponded to 49&ndash;60 properties affected; additional main&ndash;river clusters of 25&ndash;36, 13&ndash;24 and 1&ndash;12 properties are shown along the river corridor. Ordinary watercourse flooding included a cluster of up to 4 properties near the southeast of Delph. Surface&ndash;water clusters include one of 8&ndash;9 properties northwest of Delph and smaller scattered clusters. Map points indicate clusters of reported property flooding (not exact property outlines). [IMG] (p91)</p></div><div class="nugget-popup"><p>Internal property flooding and local infrastructure impacts caused by the River Tame overtopping and by surcharging ordinary watercourses and surface water. Flooding was exacerbated where a bridge on High Street restricted flow, and where a culvert under industrial units on Delph New Road became restricted causing backup onto the road. Hull Brook also overtopped its banks causing garden flooding. Surface water from over&ndash;capacity road gullies affected the area. [IMG,PAG] (p92)</p></div><div class="nugget-popup"><p>Flooding at the confluence of Hull Brook and the River Tame inundated parts of Delph, with floodwaters surrounding buildings and industrial units; properties adjacent to the watercourse were threatened or flooded. [IMG,PAG] (p94)</p></div><div class="nugget-popup"><p>The village experienced significant flooding on 26 December 2015 with streets inundated (High Street/King Street), bridge/channel overtopping with debris marking the extent, and at least one property (Green Ash) suffering internal water ingress. [IMG,PAG] (p95)</p></div><div class="nugget-popup"><p>Flooding from the River Tame affected the centre of Delph (High Street / King Street toward Brookside Terrace); properties lying in Flood Zone 3 were flooded from the main river. [PAG] (p96)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>42 properties [TAB] (p17)</p></div><div class="nugget-popup quant"><p>950 properties without power in Delph; 250 properties without power in Salford; 31,200 properties without power (Greater Manchester total) (p21)</p></div><div class="nugget-popup quant"><p>42 properties [PAG] (p88)</p></div><div class="nugget-popup quant"><p>exceeded bankful (1.000 m) [IMG] (p89)</p></div><div class="nugget-popup quant"><p>49&ndash;60 properties; 25&ndash;36 properties; 13&ndash;24 properties; 1&ndash;12 properties; 4 properties; 8&ndash;9 properties [IMG] (p91)</p></div><div class="nugget-popup quant"><p>42 properties; 7 businesses; 35 residential properties; 16 properties flooded from the River Tame; 9 properties flooded from ordinary watercourses; 17 properties flooded due to surface water [IMG,PAG] (p92)</p></div></div></body></div>`)[0];
