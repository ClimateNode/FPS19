                var html_a2ef6a9eeaeafe12b85be947c1002c25 = $(`<div id="html_a2ef6a9eeaeafe12b85be947c1002c25" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Snodland</h1><div class="nugget-popup"><p>Around 20 properties were flooded by surface water; many of those were affected internally. (p1)</p></div><div class="nugget-popup"><p>Flooding across the town caused internal flooding to numerous properties, internal flooding at a retail depot, damage to vehicles at Lakeside, and internal flooding at St Katherine&#8217;s School (21 classrooms) which led to the school being closed for 2 days. Several roads experienced highway flooding. [IMG] (p2)</p></div><div class="nugget-popup"><p>Drainage network and watercourse infrastructure in Snodland were observed with blockages and reduced conveyance after the 10 June 2019 event: culvert inlets (e.g. at Paddlesworth Lake and Birling Road) had debris/litter lodged against security bars, a security screen at Saltings Way had significant debris accumulation, and standing water was observed in the open channel between Salting Road and the A228, indicating impaired drainage and local surface water pooling. (p4)</p></div><div class="nugget-popup"><p>Parts of the town experienced surface water flooding on the routes shown by the Environment Agency surface water flood map; locations of flooded properties correspond to the watercourse route through the town. The town's impermeable urban surfaces and local drainage arrangements contributed to surface water run&ndash;off and flooding of properties. [IMG] (p5)</p></div><div class="nugget-popup"><p>Widespread surface water flooding following intense rainfall: overland flows from built areas drained toward the culverted watercourse and collected in topographical low points across the town. Deep surface water flooding occurred on Recreational Avenue, Rectory Lane and Saltings Road. Earlier blocked drainage contributed to road and external property flooding locally, and more widespread flooding developed after the intense hour of rain following 21:30. [TAB] (p8)</p></div><div class="nugget-popup"><p>Prolonged and intense rainfall on saturated ground caused widespread surface&ndash;water and overland flow across Snodland. Drainage capacity was exceeded and water accumulated in topographical low points, flooding multiple roads (Pridmore Road, Robert Road, Birling Road, Recreational Avenue, Rectory Close Oxford Street, Saltings Road) and entering buildings. At the school on St Katherines Lane overland flow entered the buildings affecting classrooms; sections of flat roof collapsed and the private rising main surcharged within the main building causing extensive damage. KFRS attended internal flooding at a property on St Katherines Lane; KCC Highways deployed a tanker at Lakeside to control floodwater. (p9)</p></div><div class="nugget-popup"><p>A heavy rainstorm (10 June 2019) produced extensive flooding from overland flows and overwhelmed drainage. Deep surface water collected at local low points and above the culverted watercourse, causing flooding to properties as water could not discharge quickly enough through the surface water sewer; floodwater drained away after the rainfall ceased. (p10)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>around 20 properties (p1)</p></div><div class="nugget-popup quant"><p>28 properties affected (aggregate); 21 classrooms affected at St Katherine&#8217;s School; 6 properties at Lakeside; multiple highway flooding incidents (roads named separately) [IMG] (p2)</p></div><div class="nugget-popup quant"><p>18 classrooms; one property; 6 inches (water depth reported at one property) (p9)</p></div></div></body></div>`)[0];
