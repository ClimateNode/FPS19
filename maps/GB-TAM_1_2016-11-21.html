                var html_d65da4eb9d93c3ed6a5189ab770baaa3 = $(`<div id="html_d65da4eb9d93c3ed6a5189ab770baaa3" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Tameside Metropolitan District</h1><div class="nugget-popup"><p>Localised flooding following intense rainfall on 21 November 2016. The east of Tameside was worst affected: properties in Hollingworth, Mossley and Stalybridge were flooded internally and externally; three roads (Huddersfield Road, Stalybridge; Turner Lane, Ashton&ndash;under&ndash;Lyne; Underwood Road, Hyde) were impassable and closed for a period of time. [PAG] (p7)</p></div><div class="nugget-popup"><p>The 21 November 2016 intense rainfall caused large volumes of surface water runoff across the east of the borough, resulting in internal and external flooding to properties and impacts to critical infrastructure; the event is classed as 'significant' for the borough. (p8)</p></div><div class="nugget-popup"><p>Multiple areas across the east of Tameside (including Demesne Drive, Highfield Gardens, Huddersfield Road, Micklehurst Road, Tame Close and the town centre around Wild Bank Hill) experienced flooding of properties during the storm on 21st November 2016. [IMG] (p11)</p></div><div class="nugget-popup"><p>Parts of Tameside (notably Hollingworth Highfield Gardens area) were affected by surface water/urban flooding when an upland watercourse and culvert inlet were overwhelmed, resulting in residential flooding. (p20)</p></div><div class="nugget-popup"><p>Within Tameside, Huddersfield Road experienced overflow from a blocked culvert at Walkerwood Reservoir during heavy rainfall, resulting in surface water flowing into low&ndash;lying properties, extensive internal damage and displacement of residents. (p22)</p></div><div class="nugget-popup"><p>Flows of water from Gallowsclough Road and Demesne Drive combined and continued over highways into the town centre; knock&ndash;on effect of flood waters from Mottram Road and Huddersfield Road flowed over ground towards the River Tame, resulting in internal flooding of commercial properties in the town centre. (p29)</p></div><div class="nugget-popup"><p>Intense rainfall produced runoff that caused localised flooding in the east of the borough, affecting homes and transport. Roads were closed in Ashton&ndash;under&ndash;Lyne, Stalybridge and Hattersley. (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>three roads [PAG] (p7)</p></div><div class="nugget-popup quant"><p>80 properties (across affected areas) (p8)</p></div><div class="nugget-popup quant"><p>16 properties; 8 internally affected; 2 residents displaced (on Arrowscroft Way) (p20)</p></div><div class="nugget-popup quant"><p>2 properties (p22)</p></div><div class="nugget-popup quant"><p>four commercial properties (p29)</p></div><div class="nugget-popup quant"><p>80 properties (p34)</p></div></div></body></div>`)[0];

                var html_a0dfd038ab59f57af17d144878384f3c = $(`<div id="html_a0dfd038ab59f57af17d144878384f3c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Stalybridge</h1><div class="nugget-popup"><p>Stalybridge experienced localised surface water flooding (areas cited include Demesne Drive, Tame Close and the Town Centre) with properties flooded internally and externally and roads rendered impassable. (p8)</p></div><div class="nugget-popup"><p>Multiple areas within Stalybridge (including the town centre, Demesne Drive, Huddersfield Road and Tame Close) experienced flooding of properties during the storm on 21st November 2016. [IMG] (p11)</p></div><div class="nugget-popup"><p>Multiple locations within Stalybridge (including Demesne Drive, Huddersfield Road, Tame Close and the Town Centre area) experienced property flooding. [TAB,PAG] (p12)</p></div><div class="nugget-popup"><p>Intense rainfall across Stalybridge on 21st November 2016 accompanied a sharp rise in river levels at the nearby Tame Street gauge (peak 2.4 m), indicating river flooding risk and surface&ndash;water runoff impacts in the town. [PAG] (p16)</p></div><div class="nugget-popup"><p>A gauge at Waggon Road (Mossley) within the Stalybridge/Tameside area recorded a rapid river level rise on 21 November 2016, from 0.783m at 08:30 to a peak of 3.011m at 20:30, indicating river flooding in the locality. [PAG] (p17)</p></div><div class="nugget-popup"><p>The Demesne Drive area of Stalybridge was affected by flooding from Stocks Brook/culvert failure, resulting in multiple internal and external property floods and displaced residents. (p18)</p></div><div class="nugget-popup"><p>The area of Stalybridge at Huddersfield Road (junction with Grove Road, known as Ditchcroft) was affected by overflow from a blocked culvert beneath Walkerwood Reservoir, causing surface water to flow onto the road and internally flood properties; residents were displaced and properties suffered extensive damage. (p22)</p></div><div class="nugget-popup"><p>Floodwaters flowing from Gallowsclough Road, Demesne Drive, Mottram Road and Huddersfield Road ran over highways into the town centre and caused internal flooding of commercial properties. (p29)</p></div><div class="nugget-popup"><p>Shown on the plan of flow of water and listed under 'Infrastructure Impacts' as a location impacted by the flooding event (town centre junction and nearby civic/transport facilities affected by flow of water). [IMG] (p30)</p></div><div class="nugget-popup"><p>Surface water and urban flooding caused road closures and required emergency/repair works on multiple routes in Stalybridge (including Huddersfield Road, Hobson Moor Road / Dewsnap Lane, Gallowsclough Road) and footpath closures (Grafton Street to Hartley Street). [TAB,PAG] (p31)</p></div><div class="nugget-popup"><p>Footpath between Grafton Street and Hartley Street was closed pending resurfacing following the flood. (p32)</p></div><div class="nugget-popup"><p>Localised flooding from runoff off Wild Bank Hill that affected properties and led to road closures in Stalybridge. (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>80 properties (across Hollingworth, Mossley and Stalybridge); three roads impassable and closed for a period (p8)</p></div><div class="nugget-popup quant"><p>32 properties flooded internally and externally; 5 properties flooded externally only. [TAB,PAG] (p12)</p></div><div class="nugget-popup quant"><p>river level 2.4 m at Tame Street on 21st November 2016 [PAG] (p16)</p></div><div class="nugget-popup quant"><p>0.783m; 3.011m peak [PAG] (p17)</p></div><div class="nugget-popup quant"><p>21 properties flooded internally; 5 properties flooded externally; 4 sets of residents displaced (p18)</p></div><div class="nugget-popup quant"><p>2 properties (p22)</p></div><div class="nugget-popup quant"><p>four commercial properties; three on Melbourne Street; one on Trinity Street (p29)</p></div><div class="nugget-popup quant"><p>c£500,000+ (total estimated cost to restore the listed routes) (p32)</p></div><div class="nugget-popup quant"><p>80 properties (total across Hollingworth, Stalybridge and Mossley) (p34)</p></div></div></body></div>`)[0];
