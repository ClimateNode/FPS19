                var html_23eeef91be5dce4775c1ad93716ad9d6 = $(`<div id="html_23eeef91be5dce4775c1ad93716ad9d6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Purley Cross</h1><div class="nugget-popup"><p>Pedestrian underpass and approaching footpaths flooded after the highway drainage network at the roundabout was overwhelmed and surcharged; underpass flooding was exacerbated by failure of the pumping system. [TAB,PAG] (p12)</p></div><div class="nugget-popup"><p>The Purley Cross area (central intersection and surrounding roads) experienced surface water flooding during the event; area identified as a topographic depression where surface water flowed overland when drainage capacity was exceeded, contributing to widespread urban flooding and travel disruption around the junction. [IMG] (p13)</p></div><div class="nugget-popup"><p>High intensity rainfall exceeded gully and drain capacity causing overland surface water flows. The downstream sewer network backed up, surcharged and flooded to significant depths in low&ndash;lying areas. The pedestrian underpass flooded when its pump failed. Transport for London drainage assets on the A22/A23 and the pedestrian underpass were among the most affected. [PAG] (p14)</p></div><div class="nugget-popup"><p>Surface water exceeded highway drainage capacity and flowed overland causing flooding at Purley Cross including the underpass; pumps and tanker operations were used to remove floodwater, pump control panel was at risk/submerged and sandbags were placed, cleanup of silt/debris undertaken and pump repairs/upgrade works planned. [TAB,PAG,MUL] (p17)</p></div><div class="nugget-popup"><p>Suffered surface&ndash;water flooding on 24 August 2015; drainage engineers removed flood water by tanker and repaired pumps as part of the immediate response. (p18)</p></div><div class="nugget-popup"><p>Drainage network upstream and downstream of the pump station did not have sufficient capacity to manage the rainfall; TfL&ndash;operated pumps at the pedestrian underpass failed due to flooding of the pump control box, exacerbating flooding at this location. [PAG] (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximate underpass flood depth 2.4 m (reported as ~1 ft (0.3 m) below underside of bridge with 2.7 m clearance) [TAB,PAG] (p12)</p></div></div></body></div>`)[0];

                var html_08a07968e179f680c12e40e8eb2df941 = $(`<div id="html_08a07968e179f680c12e40e8eb2df941" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Croydon</h1><div class="nugget-popup"><p>Severe surface water flooding in August 2015 affected multiple locations across the Borough, impacting commercial and residential properties and major transport routes. (p6)</p></div><div class="nugget-popup"><p>Widespread surface water flooding across the borough in August 2015; a significant number of calls were placed to emergency services by the public about risks to properties. The report identifies pump failure and surcharge of surface water sewers as contributing factors increasing flood risk in affected sites. [PAG] (p7)</p></div><div class="nugget-popup"><p>The borough has experienced high&ndash;intensity surface water / flash flood events. On 24 August 2015 the Borough received a short, high&ndash;intensity rainfall event across Croydon that produced a high risk of surface water flooding. Separately, the most significant recent recorded surface water flood affecting the Borough occurred on 20 July 2007 when intense rainfall caused flash floods across numerous locations in the Borough; Purley town centre experienced significant flooding to property and the transport network. [MUL] (p10)</p></div><div class="nugget-popup"><p>Short, intense rainfall on 24 August 2015 caused significant surface&ndash;water flooding across the Borough. High rainfall intensity exceeded the capacity of road gullies and drain gratings, producing runoff that ponded in low&ndash;lying areas. The road drainage network was put under pressure, resulting in lifting of sewer manhole covers. Pump failure at the Purley Cross Underpass caused flooding within the underpass and led to backing up of the sewer system. [TAB,PAG] (p11)</p></div><div class="nugget-popup"><p>Widespread surface&ndash;water and urban flooding across the borough during the August 2015 event: highway drainage was overwhelmed, drainage systems surcharged and manhole covers lifted, causing rapid onset of surface&ndash;water flooding at multiple locations (including roundabouts, underpasses and roads). [TAB,PAG] (p12)</p></div><div class="nugget-popup"><p>Intense, high&ndash;intensity rainfall across the urbanised borough overwhelmed highway drainage and sewer networks causing widespread surface water flooding and sewer surcharge. Pump failure in a pedestrian underpass caused additional local ponding. Impacts included five commercial properties flooded at Purley Oaks Road; temporary closure of roads and pedestrian access (including access to Purley Oaks train station); nuisance flooding of roads and footpaths borough&ndash;wide; and some external residential property flooding (garages and driveways) reported by the London Fire Brigade. [IMG,PAG] (p15)</p></div><div class="nugget-popup"><p>During the intense August 2015 rainfall the borough experienced multiple localised surface&ndash;water flooding incidents: nuisance flooding of roads and footpaths, pooling on residential streets (photographed at Harewood Gardens and Warren Road), some external residential property flooding (garages and driveways), and surcharge/backing&ndash;up of highway drainage where gullies and drains were blocked. [IMG,PAG] (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 commercial properties [IMG,PAG] (p15)</p></div></div></body></div>`)[0];

                var html_83878fc18087132169edadd657785913 = $(`<div id="html_83878fc18087132169edadd657785913" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Sutton</h1><div class="nugget-popup"><p>The River Wandle was reported by the Environment Agency to have burst its banks in some locations during the 24 August 2015 event. The river flows from an open section in Wandle Park into a culvert and then into the London Borough of Sutton, and the reported bank bursts (outside Croydon) indicate high fluvial levels and local fluvial flooding in areas downstream. [TAB] (p11)</p></div></div></body></div>`)[0];

                var html_5cb35fe82907b2242f5ad3112decd08a = $(`<div id="html_5cb35fe82907b2242f5ad3112decd08a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Purley Oaks Station</h1><div class="nugget-popup"><p>High intensity rainfall overwhelmed the highway drainage so a manhole at the bottom of the road surcharged. Floodwater entered commercial properties and covered the road and pavements, requiring temporary closure of the road and pedestrian access to Purley Oaks rail station. [IMG,PAG] (p14)</p></div><div class="nugget-popup"><p>Drainage mechanisms at Purley Oaks (including the underpass pump and interaction with the sewer network at Purley Oaks station) were affected during the 24 August 2015 surface&ndash;water floods; TfL proposed relocating the underpass pump control cabinet after it was at risk of submersion. (p18)</p></div><div class="nugget-popup"><p>Flooding at Purley Oaks station prompted recommendations for further engagement with the sewer company (TWUL) to review drainage mechanisms and interaction with the sewer network and to review soakaway outfall pipe size to enhance drainage capacity. [PAG] (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 commercial properties; 1 manhole surcharged [IMG,PAG] (p14)</p></div></div></body></div>`)[0];

ial properties; 1 manhole [IMG,PAG] (p14)</p></div><div class="nugget-popup quant"><p>five commercial properties [PAG] (p15)</p></div></div></body></div>`)[0];

                var html_89404e44db9d03df2fc1cdcaace194c8 = $(`<div id="html_89404e44db9d03df2fc1cdcaace194c8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Purley Underpass</h1><div class="nugget-popup"><p>Experienced severe surface water flooding during torrential rain in August 2015; contributed to transport disruption (underpass flooding) and localised impacts on infrastructure. (p6)</p></div><div class="nugget-popup"><p>Pump failure at the Purley Cross Underpass during the event led to flooding of the underpass and caused backing up of the sewer system; short, intense rainfall also put pressure on the road drainage network leading to lifting of sewer manhole covers. [TAB] (p11)</p></div><div class="nugget-popup"><p>The underpass was inundated with surface water and required pumping and gully&ndash;suctioning to remove floodwater and silt; the pump control panel was submerged and later sandbagged. Repairs/alterations to the underpass pump were planned following the event. [TAB,MUL] (p17)</p></div></div></body></div>`)[0];

                var html_609429febc76dd4ead2959080e11e843 = $(`<div id="html_609429febc76dd4ead2959080e11e843" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Purley</h1><div class="nugget-popup"><p>Experienced localised highway and surface water flooding during the torrential rain in August 2015, contributing to transport and property impacts noted in the report. (p6)</p></div><div class="nugget-popup"><p>Multiple locations in Purley experienced flooding during August 2015: highway flooding on the northern and western sides of the roundabout; manhole surcharge on Purley Oaks Road (Station Approach) with subsequent flooding of commercial premises; residential flooding reported at Brancaster Lane (including garage flooding at 46 Brancaster Lane); highway flooding on Sunnydene Road and multiple&ndash;source flooding (manhole surcharge, sewer and highway) on Old Lodge Lane. [TAB,PAG] (p12)</p></div><div class="nugget-popup"><p>Heavy rainfall overwhelmed the highway drainage at Purley Cross roundabout causing the drainage system to surcharge and lift manhole covers. Surface water flooded across the roundabout and the pedestrian underpass beneath the roundabout became rapidly inundated. The underpass flooding was exacerbated by a pumping system failure. Flooding on surrounding roads (including northern and western sections of the roundabout) caused travel disruption. [IMG] (p13)</p></div><div class="nugget-popup"><p>Localised surface&ndash;water flooding was reported at multiple locations in Purley (examples in the report include Lower Barn Road and Warren Road), causing road and footpath inundation and instances of external residential flooding (garages/driveways) where reported. [IMG,PAG] (p15)</p></div><div class="nugget-popup"><p>Localised surface water flooding from high intensity rainfall that exceeded highway drainage capacity. Reported impacts include nuisance flooding of roads and footpaths, and some external residential property flooding (garages and driveways). Flooding was exacerbated in locations by blocked gullies and drainage bottlenecks (notably issues identified on Purley Oaks Road). [IMG,PAG] (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>five properties (commercial) flooded (Purley Oaks Road) [TAB,PAG] (p12)</p></div><div class="nugget-popup quant"><p>approximate depth of 2.4m in the pedestrian underpass [IMG] (p13)</p></div></div></body></div>`)[0];
