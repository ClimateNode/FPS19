                var html_61e6179a8f9075fa5214ef0eb47e4403 = $(`<div id="html_61e6179a8f9075fa5214ef0eb47e4403" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kingston Upon Thames</h1><div class="nugget-popup"><p>The local authority carried out emergency response to flooding at the underpass and carried out Section 19 investigations into the July 2013 and June 2019 events. [MUL] (p3)</p></div><div class="nugget-popup"><p>Kingston experienced flooding during the investigated incidents, with surface&ndash;water and sewer&ndash;related flooding affecting streets, properties and infrastructure; incidents led to investigation and post&ndash;2013 mitigation measures. [MUL] (p5)</p></div><div class="nugget-popup"><p>Experienced two flooding incidents in July 2013 which triggered a Section 19 investigation by the local authority. [PAG] (p7)</p></div><div class="nugget-popup"><p>Urban flooding occurred at the Kingston underpass within the town, causing local road inundation and traffic disruption on 10 June 2019. [IMG,PAG] (p11)</p></div><div class="nugget-popup"><p>The hydrological catchment and RoFSW mapping show parts of Kingston Upon Thames at risk of surface water flooding; the report states previous flood events in July 2013 were attributed to surface water flooding affecting the area. [IMG] (p13)</p></div><div class="nugget-popup"><p>A Flood Alert and Flood Guidance Statement on 10 June 2019 identified the Beverly Brook area of Kingston upon Thames as at risk, stating flooding of highways and land was possible and urban areas were at risk, with associated transport disruption predicted. [TAB,PAG] (p19)</p></div><div class="nugget-popup"><p>Flooding at the Kingsgate Road railway bridge/underpass in Kingston led to closure/traffic diversions and prompted the 2013 Kingsgate Road Railway Bridge Flood Investigation Report and subsequent measures (diversions, signage, alarms reviewed). [PAG] (p25)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>two flooding incidents [PAG] (p7)</p></div><div class="nugget-popup quant"><p>1 underpass affected [IMG,PAG] (p11)</p></div></div></body></div>`)[0];

                var html_d4e81188cc5074c54d51d8568819a424 = $(`<div id="html_d4e81188cc5074c54d51d8568819a424" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kingsgate Road Railway Bridge</h1><div class="nugget-popup"><p>The underpass was flooded during reported events; required emergency response and removal of water (TWUL attended to restart pumps and remove water). [MUL] (p3)</p></div><div class="nugget-popup"><p>The Kingston underpass (section of Kingsgate Road beneath the railway bridge) flooded on multiple occasions, affecting a critical transport route. Flooding under the bridge made the highway infrastructure impassable and prompted Section 19 investigations. [IMG,MUL] (p8)</p></div><div class="nugget-popup"><p>The Kingston underpass (A308 carriageway running under the railway) is the subject of the flood incident investigation &mdash; site where road underpass was inundated and investigated as a flood location. [TAB,PAG,MUL] (p9)</p></div><div class="nugget-popup"><p>Underpass inundated with deep standing water that covered the road at the lowest point, rendering the underpass impassable; traffic lights and road signage were partially submerged and traffic was disrupted. [IMG,PAG] (p11)</p></div><div class="nugget-popup"><p>Surface water accumulation affected the underpass; the report links previous July 2013 flood events at the site to surface water flooding (site is within the underpass hydrological catchment shown on the map). [IMG] (p13)</p></div><div class="nugget-popup"><p>Rainwater ponded in the underpass during the June 2019 intense rainfall; the underpass flooded due to its position at a local topographical low and experienced greater severity of ponding than would be expected from the recorded TBR rainfall totals. [PAG] (p18)</p></div><div class="nugget-popup"><p>Identified in the 2013 Kingsgate Road Railway Bridge Flood Investigation Report as being affected during the 2013 flood when the nearby TWUL pumping station failed, contributing to flooding at the railway bridge. (p21)</p></div><div class="nugget-popup"><p>Multiple flooding reports affected the Kingston underpass and prompted a flood risk investigation; the underpass experienced flooding related to drainage failure requiring response actions. [PAG,MUL] (p22)</p></div><div class="nugget-popup"><p>The underpass was inundated by surface water and sewer&ndash;related flooding. Flooding was exacerbated by proximity to the primary flow path and by failure of the nearby TWUL pumping station; pumps had to be re&ndash;started and water removed. [PAG,MUL] (p23)</p></div><div class="nugget-popup"><p>The FEH (Flood Estimation Handbook) analysis prepared for the Kingston Underpass shows short&ndash;duration extreme rainfall and return&ndash;period estimates used to assess the June 2019 event; the assessment concludes the June 2019 event at the underpass is approximately under a 1&ndash;in&ndash;5&ndash;year return period, indicating a surface&ndash;water flooding impact at the underpass for that event. [TAB] (p26)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 flood incidents (July 2013); 1 flood report (July 2019) [IMG,MUL] (p8)</p></div><div class="nugget-popup quant"><p>1 underpass [IMG,PAG] (p11)</p></div></div></body></div>`)[0];
