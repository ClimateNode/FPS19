                var html_d48e43c0c6556828e43a2a3db6c7ecf2 = $(`<div id="html_d48e43c0c6556828e43a2a3db6c7ecf2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Willow Brook</h1><div class="nugget-popup"><p>Heavy rainfall increased flows in the watercourse (Willow Brook). Restriction at the flow control culvert/weir caused upstream water levels to rise and water to spill sideways into the balancing ponds; when pond capacity continued to rise flows were routed downstream via the emergency spillway toward Pen Green Lane and the railway aqueduct. The aqueduct and its spillways were at risk of being exceeded, threatening conveyance to the railway drainage at track level. (p15)</p></div><div class="nugget-popup"><p>The tributary of the Willow Brook at the location of the Corby flood incident was the watercourse involved in the flooding; it is classified as a Main River. (p24)</p></div></div></body></div>`)[0];

                var html_ae19543196691bb8d11403ce64d9294e = $(`<div id="html_ae19543196691bb8d11403ce64d9294e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Corby Tunnel</h1><div class="nugget-popup"><p>Floodwater ran down the cutting, increased in depth around the railway tracks and flowed north toward Corby Tunnel on 13 June 2019; standing water reached depths that would affect the safe operation of trains and a landslip occurred onto the tracks. (p17)</p></div><div class="nugget-popup"><p>Water flowing from the cutting and overtopping ponds increased water depth on and around the railway tracks and through Corby Tunnel, affecting safe train operation. A land slip from the cutting slope occurred onto the tracks (around 16:00), disabling a stopped southbound passenger train. Passengers were ultimately escorted off the railway on foot and evacuated by coach; emergency services assisted and Network Rail cleared the landslip and drained water via railway drainage. (p18)</p></div></div></body></div>`)[0];

                var html_9fd43f740a033103469133db7c9182da = $(`<div id="html_9fd43f740a033103469133db7c9182da" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Pen Green Lane, Corby</h1><div class="nugget-popup"><p>Excess surface water from unmanaged overflow flowed over ground to localised low points, flooding the railway adjacent to Pen Green Lane. The railway (critical infrastructure) was affected by flooding for more than three hours from the onset of flooding. (p5)</p></div><div class="nugget-popup"><p>A short access culvert beneath Pen Green Lane was reported to be almost completely blocked at the time of the flood incident, restricting flow and contributing to the flood event affecting downstream conveyance. [PAG] (p14)</p></div><div class="nugget-popup"><p>Overtopping from Pond 2 flowed across Pen Green Lane on 13 June 2019, conveying floodwater east across disused land to the top of the railway cutting. (p17)</p></div><div class="nugget-popup"><p>The culvert under Pen Green Lane was reported almost completely blocked. The blockage diverted excess flow to off&ndash;line balancing ponds, causing the ponds to fill and contributing to downstream overtopping and flow onto the railway cutting. (p18)</p></div><div class="nugget-popup"><p>Water spilled over the low point on Pen Green Lane from Pond 2, causing overtopping of the carriageway. [IMG,PAG] (p33)</p></div><div class="nugget-popup"><p>Water from Pond 2 spilled over at a low point on Pen Green Lane, inundating the road. [IMG,PAG] (p34)</p></div></div></body></div>`)[0];

                var html_b931f35c3a4c9cbbd352922e0c15e8d0 = $(`<div id="html_b931f35c3a4c9cbbd352922e0c15e8d0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Corby</h1><div class="nugget-popup"><p>Relatively heavy rainfall and poorly maintained watercourses/control structures caused an unmanaged overflow; excess surface water flowed to localised low points in Corby, including flooding the railway adjacent to Pen Green Lane. Critical infrastructure (the railway) was affected for more than three hours. (p5)</p></div><div class="nugget-popup"><p>Flooding affected the railway adjacent to Pen Green Lane in Corby, constituting an impact on critical infrastructure within the town. (p7)</p></div><div class="nugget-popup"><p>Intense, concentrated rainfall over 10&ndash;13 June 2019 led to surface&ndash;water/flash flooding in Corby on 13 June 2019. Local river levels in the wider Nene/Witham area had been notably/exceptionally high in the week prior (5&ndash;11 June), preceding the event. The Corby weather station recorded a marked concentration of the week&#8217;s rainfall in the days immediately before and including 13 June, coincident with the flood event. (p9)</p></div><div class="nugget-popup"><p>A flood incident occurred in the north of Corby, affecting land on and adjacent to the Midland Main Line railway. (p10)</p></div><div class="nugget-popup"><p>The flood incident occurred in the immediate locality within Corby where the tributary/main river flows; blocked culverts and poor maintenance caused raised upstream water levels, spillway flows and filling of balancing ponds, contributing to localised flooding. (p14)</p></div><div class="nugget-popup"><p>Parts of Corby experienced surface water/urban flooding during heavy rainfall when surface water sewers outfell to the tributary and balancing ponds. The flow control culvert/weir and balancing ponds were overwhelmed/compromised by restricted flows and poor maintenance, producing pond overflow and downstream flood routing toward Pen Green Lane and the railway cutting. (p15)</p></div><div class="nugget-popup"><p>Localized flooding on 13 June 2019 driven by overtopping of Pond 2 and subsequent overland flow across Pen Green Lane and down a railway cutting, causing a landslip onto the railway and standing water that affected safe operation of trains. (p17)</p></div><div class="nugget-popup"><p>The area around the railway cutting south of Corby Tunnel experienced runoff, standing water on tracks and a landslip onto the railway. Railway operations were disrupted, emergency response was required on site, and Network Rail carried out clearance works. (p18)</p></div></div></body></div>`)[0];
