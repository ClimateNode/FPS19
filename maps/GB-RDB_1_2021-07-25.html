                var html_4187dda652759a3b4a35fcb5b8c4554f = $(`<div id="html_4187dda652759a3b4a35fcb5b8c4554f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cran Brook</h1><div class="nugget-popup"><p>The stream (Cran Brook) is shown traversing the catchment and the map and accompanying analysis associate reported flooding incidents with streams; this indicates Cran Brook is linked to local flooding impacts and likely contributed to flooding along stream corridors and adjacent highways. [IMG] (p79)</p></div></div></body></div>`)[0];

                var html_2258a7d2e9a8d38346918646c5a767b4 = $(`<div id="html_2258a7d2e9a8d38346918646c5a767b4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Fullwell Cross</h1><div class="nugget-popup"><p>Hotspot with a notable cluster of reported flooding incidents during the 25 July 2021 storm; hotspots denote areas with clusters of incidents or severe highway flooding. [IMG] (p3)</p></div><div class="nugget-popup"><p>Flooding concerns linked to the design of the drain in Craven Gardens within the Fulwell Cross area; Redbridge recommended investigating the drain design as part of flood mitigation. (p4)</p></div><div class="nugget-popup"><p>Identified hotspot with a concentration of reported flood incidents during the 25 July 2021 event. The area is associated with clustered reports of internal, external and highway flooding within the Fairlop&ndash;Cranbrook catchment. [IMG] (p66)</p></div><div class="nugget-popup"><p>Flooding in the Fulwell Cross hotspot during the 25 July 2021 rainfall event included ponding due to gullies unable to cope, reports of internal and external property flooding, highway flooding, and at least one instance of sewage surcharging onto school grounds. (p72)</p></div><div class="nugget-popup"><p>Mapped as the Fullwell Cross hotspot (shaded area) with a concentration of reported external, highways and internal flooding incidents. Overland flow routes converge toward Fullwell/Fullwell Cross contributing to flooding in the area, affecting nearby streets such as Kingsley Road and Neville Road. [IMG] (p73)</p></div><div class="nugget-popup"><p>Fullwell Cross hotspot experienced concentrated reports of surface&ndash;water flooding and overland flow during the event; reported incidents include external, highways and internal flooding clustered within/near the hotspot. [IMG] (p74)</p></div><div class="nugget-popup"><p>The Fullwell Cross hotspot experienced clustered reported flooding during the event, with the highest RoFSW (surface water) risk concentrated at the centre; local sewer capacity is believed to have been exceeded and contributed to the incident. [IMG,PAG] (p75)</p></div><div class="nugget-popup"><p>Hotspot area lies within high susceptibility classes for groundwater; a reported flooded cellar in nearby Auckland Road indicates groundwater flooding may have contributed to internal flooding within the hotspot. (p80)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>65 reports in Fairlop&ndash;Cranbrook catchment (11 internally flooded properties; 28 externally flooded properties; 26 cases of highway flooding) &mdash; many reports clustered around Cranbrook and Fullwell Cross [IMG] (p66)</p></div><div class="nugget-popup quant"><p>2 reports of internal flooding; 10 reports of external flooding; 5 cases of flooding of highways; 1 incident of sewage surcharging at Ilford Jewish Primary School (p72)</p></div></div></body></div>`)[0];

                var html_d09626aacb2f4d6eee5a575e1fda0703 = $(`<div id="html_d09626aacb2f4d6eee5a575e1fda0703" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Borough of Redbridge</h1><div class="nugget-popup"><p>Widespread flooding across the borough from heavy showers and thunderstorms: internal, external and highway flooding reported; emergency planning response deployed; rest centre opened (but not required); borough cleared gullies on reported roads and worked with TWUL and emergency services to assist residents. [IMG,PAG] (p3)</p></div><div class="nugget-popup"><p>Surface water flooding across multiple hotspots overwhelmed the surface water sewer network in the borough, prompting deployment of emergency planning/response arrangements, gully checks and clearing, and hotspot investigations and remedial recommendations. [PAG] (p4)</p></div><div class="nugget-popup"><p>The borough experienced severe flooding during the 25th July event; surface water entered the sewer network in large volumes causing widespread urban/surface&ndash;water flooding and sewer network overwhelm. Multiple hotspots within the borough (e.g. Luxborough, North Circular Road, Clayhall) are identified in the report. [PAG] (p6)</p></div><div class="nugget-popup"><p>The report documents multiple location&ndash;wide flood incidents and identifies hotspots within the borough (examples listed in the contents: Luxborough; North Circular Road; Clayhall; Woodford Bridge; Cranbrook; Fulwell Cross). These locations are described as flooded in the investigation report. [PAG] (p7)</p></div><div class="nugget-popup"><p>Report for the London Borough of Redbridge records flood incidents and assesses surface water, ordinary watercourse/fluvial, groundwater and sewer flood risks across catchments and hotspots within Redbridge. [PAG] (p8)</p></div><div class="nugget-popup"><p>Locations within the borough experienced flooding; the investigation documents flooded sites (photos and historic flood records) and identifies hydrological catchments and overland flow routes relevant to those flood incidents. [TAB,PAG] (p13)</p></div><div class="nugget-popup"><p>Widespread flash/surface water flooding across the borough causing disruption: emergency planning arrangements were deployed and response collaborated with TWUL and emergency services; a rest centre was opened (briefly) to shelter displaced residents. [PAG] (p16)</p></div><div class="nugget-popup"><p>During and after the rainfall on 25th July 2021 residents reported that properties and roads within the borough were flooded. [IMG,PAG] (p18)</p></div><div class="nugget-popup"><p>During the intense afternoon rainfall on 25th July 2021 properties and roads across the borough were flooded. Reports included internal flooding (inside buildings, including basements), external flooding (within property boundaries such as gardens and driveways) and highways flooding (roads and pavements). Most reported flooding appeared to be associated with surcharging gullies and insufficient capacity in the surface water sewer network. [PAG] (p19)</p></div><div class="nugget-popup"><p>Area&ndash;wide surface water flooding caused by surcharging gullies and insufficient capacity in the surface water sewer network affected multiple streets and properties across Redbridge as reported in Table 3.2. (p20)</p></div><div class="nugget-popup"><p>Clusters of internal property flooding across the borough were recorded; ten hotspots were identified where multiple internal flooding incidents and nearby external/highways flooding occurred. In some hotspots highways flooding stopped traffic. Four hydrological catchment areas were defined to analyse incident linkages; four flood incidents were identified as falling outside those main catchments. [PAG] (p25)</p></div><div class="nugget-popup"><p>Across Redbridge there were clusters of internal flooding and locations of external and highways flooding; these incidents led to the identification of ten borough hotspots for further analysis. [IMG,PAG] (p26)</p></div><div class="nugget-popup"><p>Within the West Roding catchment in the borough residents reported internal, external and highway flooding: internally flooded properties, externally flooded properties and flooding to the highway were recorded across the catchment. [IMG,PAG] (p27)</p></div><div class="nugget-popup"><p>Within the London Borough of Redbridge the report records surface water flooding mechanisms active during the 25th July 2021 event. The Luxborough area (Buckhurst Road / Cherry Tree Rise intersection) experienced surface water pooling and runoff into properties, with internal flooding reported. [PAG] (p30)</p></div><div class="nugget-popup"><p>Four reports of internal flooding across the hotspot (affecting Lorne Gardens and Deynecourt Gardens); external and highways flooding reported in nearby streets; drains and gullies blocked and/or surcharging with surface water breaching kerbing and flowing into properties and gardens. [PAG] (p43)</p></div><div class="nugget-popup"><p>Responded to reports from residents after the 25 July 2021 rainfall by collating incidents, sending letters to affected residents, forwarding reports to TWUL, carrying out gully inspections and clearing blocked gullies, and undertaking a site visit (6 Oct 2021) which noted low&ndash;lying properties and paths sloping to back gardens. [TAB,PAG] (p52)</p></div><div class="nugget-popup"><p>Reported flooding within the borough included the East Roding Catchment (17 internally flooded properties, 8 externally flooded properties and 14 highway flooding cases, 39 reports) and multiple internal flooding reports in the West Roding Catchment streets. [PAG] (p53)</p></div><div class="nugget-popup"><p>Multiple reports of flooding across the borough during the event, including the East Roding catchment where residents reported internal, external and highway flooding. Flooding affected properties and the highway network in parts of the borough. [IMG,PAG] (p54)</p></div><div class="nugget-popup"><p>Redbridge (the borough) contained hotspot areas impacted by the 25th July 2021 event, including Clayhall where internal property flooding, surcharging gullies and overwhelmed surface water/sewer networks occurred. [IMG,PAG] (p55)</p></div><div class="nugget-popup"><p>Surface water runoff within the Clayhall hotspot ponded at a topographic low (around Peel Place and Coburg Gardens), resulting in flooding of residential properties and clustered reports of external/highways/internal flooding in the hotspot. [IMG,PAG] (p56)</p></div><div class="nugget-popup"><p>The Woodford Bridge hotspot within the London Borough of Redbridge experienced clustered reported flooding (external, highways and internal) along main stream courses and low&ndash;lying streets (e.g. Roding Avenue, Waltham Road). [IMG,PAG] (p62)</p></div><div class="nugget-popup"><p>Within the Fairlop&ndash;Cranbrook catchment (inside the borough) residents reported internal and external property flooding and flooding to the highway; three hotspots were identified and assessed. [PAG] (p65)</p></div><div class="nugget-popup"><p>Reports from the Fairlop&ndash;Cranbrook catchment within Redbridge recorded 11 internally flooded properties, 28 externally flooded properties and 26 highway flooding incidents (65 reports total). [IMG,PAG] (p66)</p></div><div class="nugget-popup"><p>The borough area contains the Cranbrook hotspot where three incidents of internal flooding were reported following the rainfall on 25 July 2021 (see Cranbrook entry for details). [PAG] (p67)</p></div><div class="nugget-popup"><p>The London Borough of Redbridge contains the Cranbrook hotspot where surface&ndash;water and urban flooding were reported; the borough therefore experienced localised surface&ndash;water/urban flooding impacts in the Cranbrook catchment during the event. [IMG,PAG] (p69)</p></div><div class="nugget-popup"><p>Within the London Borough of Redbridge the Cranbrook hotspot experienced surface&ndash;water flooding on 25 July 2021, resulting in reported internal flooding incidents in the local area (including properties on Northbrook Road and Endsleigh Gardens) and evidence of sewer network surcharging during the event. [IMG,PAG] (p70)</p></div><div class="nugget-popup"><p>During the 25 July 2021 rainfall event the Fulwell Cross area of Redbridge experienced ponding and drainage failure: blocked/slow&ndash;draining gullies prevented runoff from draining away and caused flooding. Two reports of internal flooding were recorded (Neville Road and Kingsley Road); there were ten reports of external flooding and five cases of highway flooding. Ilford Jewish Primary School reported sewage surcharging from a manhole on the school grounds. [PAG] (p72)</p></div><div class="nugget-popup"><p>The Fullwell Cross catchment within Redbridge recorded clustered reports of surface&ndash;water and overland flooding during the investigated event, affecting local streets and properties. [IMG,PAG] (p74)</p></div><div class="nugget-popup"><p>Surface water flooding affected the Fullwell Cross hotspot on 25 July 2021; properties reported internal/external/highways flooding clustered in the central hotspot and along major roads. The local surface water sewer network was unable to cope in Aintree Crescent leading to flooding attributed to sewer surcharge; gullies in Neville Road and Coburg Gardens were surcharging during the event. Key community infrastructure (schools and sports centres) lie within or adjacent to the surface&ndash;water risk extents, indicating potential exposure. [IMG,PAG] (p75)</p></div><div class="nugget-popup"><p>Reported flooding incidents within the Ilford hotspot of the borough during the event, including internal, external and highways flooding clustered around sewer line intersections; incidents were mapped against the TWUL sewer network and overland flow routes. [IMG,PAG] (p78)</p></div><div class="nugget-popup"><p>Parts of the borough contained the Ilford hotspot where multiple flooding reports were recorded during the event; incidents were clustered in the Ilford catchment and affected highways and properties. [IMG,PAG] (p79)</p></div><div class="nugget-popup"><p>The London Borough of Redbridge contains the Ilford hotspot where the severe rainfall event caused surface water and sewer&ndash;related flooding and at least one instance of groundwater&ndash;related flooding (flooded cellar). Local highway and property flooding were reported within the borough. [IMG,PAG] (p80)</p></div><div class="nugget-popup"><p>Within the Ilford South catchment (in Redbridge) residents reported internal and external property flooding and highway flooding; internal flooding was reported in Grosvenor Road. [PAG] (p82)</p></div><div class="nugget-popup"><p>Multiple localised flood incidents reported across the borough during the 25 July 2021 rainfall: internal basement flooding at a property on Grosvenor Road; external flooding on Henley Road and Vicarage Road; and highway flooding on Grange Road and Littlemore Road. [IMG,PAG] (p84)</p></div><div class="nugget-popup"><p>Properties within the borough reported internal flooding during the 25 July 2021 storm. [PAG] (p88)</p></div><div class="nugget-popup"><p>Extensive flooding on 25th July 2021 caused numerous internal property flooding incidents and severe highway flooding. Flooding was concentrated at topographical low points and primary flow paths across the borough; the investigation identified sites at varying risk primarily from surface water and sewer flooding with some groundwater impacts. [PAG] (p89)</p></div><div class="nugget-popup"><p>Surface water / urban flooding reported in Redbridge on 25th July 2021, associated with overloaded drainage and sewer capacity issues; prompted recommendations to investigate SuDS, sewer inspections, cleaning and capacity upgrades to reduce runoff and customer sewer problems. [PAG] (p90)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>54 reports of internal flooding; 55 reports of external flooding; 70 reports of flooded highways; incidents across 130 streets; 4 flood clean&ndash;ups recorded by TWUL [IMG,PAG] (p3)</p></div><div class="nugget-popup quant"><p>54 properties [PAG] (p16)</p></div><div class="nugget-popup quant"><p>179 flooding reports; 130 different streets [PAG] (p19)</p></div><div class="nugget-popup quant"><p>12 reported flooded locations (p20)</p></div><div class="nugget-popup quant"><p>ten hotspots; four hydrological catchment areas; four flood incidents outside the main catchments [PAG] (p25)</p></div><div class="nugget-popup quant"><p>24 internally flooded properties; 13 externally flooded properties; 24 cases of flooding to the highway; 61 reports total [IMG,PAG] (p27)</p></div><div class="nugget-popup quant"><p>flood depths between 0.15m and 0.60m [PAG] (p30)</p></div><div class="nugget-popup quant"><p>4 reports of internal flooding [PAG] (p43)</p></div><div class="nugget-popup quant"><p>17 internally flooded properties; 8 externally flooded properties; 14 cases of highway flooding; 39 reports [PAG] (p53)</p></div><div class="nugget-popup quant"><p>17 internally flooded properties; 8 externally flooded properties; 14 cases of flooding to the highway; 39 reports [IMG,PAG] (p54)</p></div><div class="nugget-popup quant"><p>predicted depths between 0.15m and 0.60m (for south of Roding Avenue) [IMG,PAG] (p62)</p></div><div class="nugget-popup quant"><p>11 internally flooded properties; 28 externally flooded properties; 26 cases of flooding to the highway; 65 reports [PAG] (p65)</p></div><div class="nugget-popup quant"><p>11 internally flooded properties; 28 externally flooded properties; 26 cases of flooding to the highway; 65 reports [IMG,PAG] (p66)</p></div><div class="nugget-popup quant"><p>3 incidents [PAG] (p67)</p></div><div class="nugget-popup quant"><p>1 flooded basement [IMG,PAG] (p70)</p></div><div class="nugget-popup quant"><p>2 reports of internal flooding; 10 reports of external flooding; 5 cases of flooding of highways; 1 incident of sewage surcharging at Ilford Jewish Primary School [PAG] (p72)</p></div><div class="nugget-popup quant"><p>predicted depths of 0.15m to 0.60m for some properties in Kingsley Road; predicted depths of 0.15m to 0.30m for properties that reported flooding in Neville Road and Craven Gardens [IMG,PAG] (p75)</p></div><div class="nugget-popup quant"><p>1 property (Melbourne Road); 1 flooded cellar (Auckland Road) [IMG,PAG] (p80)</p></div><div class="nugget-popup quant"><p>2 internally flooded properties; 4 externally flooded properties; 4 cases of highway flooding; 10 reports [PAG] (p82)</p></div><div class="nugget-popup quant"><p>1 property; 2 external locations; 2 highways [IMG,PAG] (p84)</p></div></div></body></div>`)[0];
                popup_3807922a16023f6562d03ad8b425d617.setContent(html_d09626aacb2f4d6eee5a575e1fda0703);

he railway underpass; reported flooding incidents are clustered near this hotspot and along local streams, indicating surface&ndash;water / highways flooding affected the area. [IMG,PAG] (p35)</p></div><div class="nugget-popup"><p>Surface water was predicted to flow from the North Circular Road and neighbouring roads into the railway underpass, contributing to flooding of the underpass and surrounding highway; the railway underpass and Charlie Brown's roundabout were identified as high risk of surface water flooding. [IMG,PAG] (p36)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Two properties internally flooded. [PAG] (p33)</p></div><div class="nugget-popup quant"><p>flood depths 0.15m to over 1.2m; at risk in 1 in 30 year, 1 in 100 year and 1 in 1000 year events [IMG,PAG] (p36)</p></div></div></body></div>`)[0];

er runoff during the 25th July 2021 rainfall; gullies in the road surcharged and tree root blockages were found in the sewer. A property on Hermitage Walk was at a lower level than the pavement and water reportedly entered the driveway during the event. [TAB,PAG] (p42)</p></div><div class="nugget-popup"><p>TWUL carried out works to clear a major blockage of tree roots from within their surface water sewer located in Hermitage Walk (remedial work following the flooding incidents). [TAB] (p43)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property; 1 garage [PAG] (p38)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p39)</p></div><div class="nugget-popup quant"><p>1 property (internal flooding); predicted depths between 0.15m and 0.60m [PAG] (p40)</p></div><div class="nugget-popup quant"><p>1 property [IMG,PAG] (p41)</p></div></div></body></div>`)[0];

and required attendance. TWUL organised a clean&ndash;up on 26th July 2021 and attended the pumping station on 27th July 2021 following the flood. [TAB] (p60)</p></div><div class="nugget-popup"><p>Surface water and foul water flooding occurred rapidly, with floodwater reaching approximately 1 m inside properties. (p87)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 internal report; 1 highways report [TAB] (p23)</p></div><div class="nugget-popup quant"><p>predicted flood depths over 1.2m (p57)</p></div><div class="nugget-popup quant"><p>predicted flood depths over 1.2m [PAG] (p58)</p></div><div class="nugget-popup quant"><p>approximately 1 m inside properties (p87)</p></div></div></body></div>`)[0];

                var html_aa8b814f8b4f82d780ff494aa8db2d49 = $(`<div id="html_aa8b814f8b4f82d780ff494aa8db2d49" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Melbourne Road, Gants Hill</h1><div class="nugget-popup"><p>Internal flooding was reported at Melbourne Road. [TAB] (p23)</p></div><div class="nugget-popup"><p>A resident reported internal flooding to a basement and that a newly installed gully was blocked and causing flooding to the road and her basement during the rainfall event. [PAG] (p77)</p></div><div class="nugget-popup"><p>A property in Melbourne (on/adjacent to Melbourne Road) was reported flooded due to overland surface water flow from the local sub&ndash;catchment primary flow paths; the property lies close to these flow paths. [PAG] (p78)</p></div><div class="nugget-popup"><p>A property on Melbourne Road was flooded/affected and is located close to overland flow paths; modelling shows it sits just outside the 1&ndash;in&ndash;1000&ndash;year surface water extent with predicted flood depths of between 0.15m and 0.30m. (p79)</p></div><div class="nugget-popup"><p>A property flooded in Melbourne Road. RoFSW modelling shows predicted depths in the vicinity of 0.15m&ndash;0.30m for the 1 in 1000 year event, and anecdotal evidence indicates the surface water sewer network lacked capacity during the severe rainfall, so sewer surcharge/surface water contributed to the property flooding. [PAG] (p80)</p></div><div class="nugget-popup"><p>Surface water runoff exceeded the capacity of the surface water sewer network causing flooding that affected the road and nearby properties. Properties on Melbourne Road lack drains between the road and their sloping driveways, which contributed to inundation of driveways/properties. A blocked gully opposite 34 Melbourne Road was identified (a new gully pot was installed prior to the event) and the new gully was later found to be free&ndash;flowing on 15 September 2021. [TAB,PAG] (p81)</p></div><div class="nugget-popup"><p>A property on Melbourne Road is described in the report as a flooded property; RoFSW modelled depths in the vicinity are reported at 0.15&ndash;0.30 m and the property is noted relative to the 1 in 1000 year surface&ndash;water extent. (p84)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 internal report [TAB] (p23)</p></div><div class="nugget-popup quant"><p>1 basement flooded; 1 newly installed gully reported blocked [PAG] (p77)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p78)</p></div><div class="nugget-popup quant"><p>predicted depths between 0.15m and 0.30m (p79)</p></div><div class="nugget-popup quant"><p>predicted depths between 0.15m and 0.30m [PAG] (p80)</p></div></div></body></div>`)[0];

                var html_cf943dc3a32f3bfec252d8a3aeb70b48 = $(`<div id="html_cf943dc3a32f3bfec252d8a3aeb70b48" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Roding Valley</h1><div class="nugget-popup"><p>Roding Valley is shown as a hotspot on the flood map and the AI image description notes concentrations of reported flooding in the Roding catchments during the 25 July 2021 storms, indicating clusters of external/highway/internal flooding in this area. [IMG] (p3)</p></div><div class="nugget-popup"><p>A slow&ndash;draining gully in front of 40 Lorne Gardens in the Roding Valley hotspot was identified for investigation, indicating surface water drainage issues that contributed to local flooding. (p4)</p></div><div class="nugget-popup"><p>Four reports of internal flooding in the hotspot area (between Lorne Gardens and Deynecourt Gardens). External and highways flooding were also reported nearby (including Elmcroft Avenue and Longcourt Mews). Drains and gullies were reported as blocked and/or surcharging due to high volumes of surface water, with surface water breaching kerbing and flowing into properties and gardens. (p43)</p></div><div class="nugget-popup"><p>The Roding Valley hotspot contained multiple reported flooding locations (external, highways and internal) during the event; surface water and overland flow followed the mapped primary flow paths through the catchment, concentrating runoff in and around the recreation ground and allotments and into the hotspot area. [IMG] (p45)</p></div><div class="nugget-popup"><p>The Roding Valley hotspot experienced surface water flooding during the 25 July 2021 event. RoFSW shows surface water flowing northeasterly across Lorne Gardens and Deynecourt Gardens towards the Recreation Grounds and allotments, with accumulation between properties, at the Foxton Gardens intersection, and in the Recreation Grounds and allotments. The ordinary watercourse ~200 m to the south was not the source, and groundwater was not identified as the cause. Some neighbouring streets (Lorne Gardens, Elmcroft Avenue, Foxglove Gardens, Merino Close) had flooding attributed to sewer surcharge, while Deynecourt Gardens flooding was not linked to surcharging gullies. [IMG] (p46)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 reports of internal flooding (p43)</p></div><div class="nugget-popup quant"><p>predicted depths in hotspot 0.15 m to 1.2 m [IMG] (p46)</p></div></div></body></div>`)[0];

ction of Hermon Hill and Wellesley Road. Properties on Wellington Road reported flooding during the event. Gullies in Wellington Road were reported overwhelmed, indicating insufficient sewer/drainage capacity; the incident is attributed to sewer/surface&ndash;water sources. The hotspot is assessed as high risk of surface water flooding. [IMG] (p51)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Three reports of internal flooding; 1 flooded basement (p48)</p></div><div class="nugget-popup quant"><p>predicted depths between 0.15m and 0.6m (Wellington Road properties); predicted depths between 0.3m and 0.9m (Hermon Hill property) [IMG,PAG] (p50)</p></div><div class="nugget-popup quant"><p>properties on Wellington Road at predicted depths ranging between 0.15 m and 0.6 m; Hermon Hill property at predicted depths ranging between 0.3 m and 0.9 m; predicted risk levels: 1 in 30 year, 1 in 100 year and 1 in 1000 year (Wellington Road); 1 in 1000 year (Hermon Hill) [IMG] (p51)</p></div></div></body></div>`)[0];

                var html_a0033ece6902343a9cb7f9477dd8e6e2 = $(`<div id="html_a0033ece6902343a9cb7f9477dd8e6e2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Woodford Bridge</h1><div class="nugget-popup"><p>Woodford Bridge is identified as a hotspot on the map and is indicated in the AI image description as an area with reported flooding incidents during the 25 July 2021 heavy showers (clusters of external/highway/internal reports shown in hotspot polygons). [IMG] (p3)</p></div><div class="nugget-popup"><p>Flooding affected properties in the Woodford Bridge area; recommendations include raising kerb levels in front of flooded properties on Waltham Road and regular gully checks on Gaynes Hill Road. (p4)</p></div><div class="nugget-popup"><p>Woodford Bridge is treated as a hotspot in the report with a location&ndash;wide flood incidents section and assessments of local drainage, flood mechanisms and risks (surface water, ordinary watercourse/fluvial, groundwater, sewer). (p8)</p></div><div class="nugget-popup"><p>Identified in the report map legend as one of ten borough 'hotspots' for the 25 July 2021 flood event. As a hotspot it was associated with clusters of internal property flooding reports and highways flooding (locations chosen where internal incidents clustered within a small area or where highways flooding had stopped traffic). Woodford Bridge is within the West Roding hydrological catchment, which the report links to the event. [IMG] (p26)</p></div><div class="nugget-popup"><p>Identified as one of two hotspots within the East Roding catchment with clusters of reported internal, external and highway flooding concentrated in and around this hotspot during the event. [IMG] (p54)</p></div><div class="nugget-popup"><p>Three reports of internal flooding were received in the hotspot following the rainfall event; surface water runoff and drainage issues caused flooding to properties in Waltham Road, Morgan Way and Roding Avenue, and blocked/private drains contributed to property and garden flooding. (p60)</p></div><div class="nugget-popup"><p>Reported external, highways and internal flooding clustered within the Woodford Bridge hotspot. LiDAR and watershed analysis identify flooded properties on Waltham Road and Roding Avenue that lie on topographical low points where surface water and overland flow concentrate. The local TWUL surface water and combined sewer network conveys runoff through the hotspot (pipes up to 1200mm) and discharges towards the River Roding, contributing to sewer&ndash;related flooding in the area. [IMG] (p61)</p></div><div class="nugget-popup"><p>Properties in the hotspot (specifically on Roding Avenue and Waltham Road) experienced internal flooding as surface water routed along primary overland flow paths and collected in topographical low points within the Woodford Bridge hotspot. [IMG,PAG] (p62)</p></div><div class="nugget-popup"><p>The Woodford Bridge hotspot experienced surface water flooding during the 25th July 2021 event. Fluvial (ordinary watercourses) and groundwater sources were ruled out for this incident. [IMG] (p63)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Part of the West Roding catchment that reported 24 internally flooded properties; 13 externally flooded properties; 24 highway flooding reports; 61 reports total (catchment&ndash;wide) [IMG] (p26)</p></div><div class="nugget-popup quant"><p>Three reports of internal flooding (p60)</p></div><div class="nugget-popup quant"><p>predicted surface water depths between 0.15m and 0.60m for the south of Roding Avenue [IMG,PAG] (p62)</p></div></div></body></div>`)[0];

                var html_950db2d73861e277e0001be6f04ee984 = $(`<div id="html_950db2d73861e277e0001be6f04ee984" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ilford</h1><div class="nugget-popup"><p>Identified hotspot with a notable cluster of reported flooding incidents during the 25 July 2021 storm (map shows hotspot clustering of external, highway and internal reports across the borough). [IMG] (p3)</p></div><div class="nugget-popup"><p>Surface&ndash;water flooding reported within Ilford South: external flooding reports on St Albans Road and highways flooding on Staines Road. [TAB] (p23)</p></div><div class="nugget-popup"><p>External flooding reported within Ilford (at Vicarage Lane). [TAB] (p24)</p></div><div class="nugget-popup"><p>Identified as a hotspot within the Fairlop&ndash;Cranbrook catchment. The report and catchment map show clusters of reported internal, external and highway flooding incidents concentrated near Ilford/Cranbrook, indicating localised urban/surface&ndash;water flooding affecting properties and highways on 25 July 2021. [IMG,PAG] (p66)</p></div><div class="nugget-popup"><p>Within the Ilford hotspot residents reported internal (cellar/basement) flooding and road flooding. Blocked gullies and tree roots in gullies were reported; a newly installed gully was reported blocked and blamed for flooding to the road and a basement. (p77)</p></div><div class="nugget-popup"><p>Reported external, highway and internal flooding across the Ilford hotspot on 25th July 2021. Flood locations are scattered through the hotspot and show clustering near intersections of the sewer network. A property in Melbourne (Melbourne Road) is identified as being in close proximity to an overland flow path and was among the properties reported as flooded. [IMG,PAG] (p78)</p></div><div class="nugget-popup"><p>The Ilford hotspot recorded multiple reported flooding incidents (external, highways and internal) clustered within the local catchment, particularly along streams and highways. [IMG,PAG] (p79)</p></div><div class="nugget-popup"><p>Multiple reported flooding incidents within the Ilford hotspot during the severe rainfall event: internal and external property flooding and highway flooding. A property on Melbourne Road was flooded and a cellar on Auckland Road was reported flooded. Anecdotal evidence indicates the surface water sewer network in Melbourne Road and Auckland Road lacked capacity, contributing to the incident. [IMG,PAG] (p80)</p></div><div class="nugget-popup"><p>The Ilford hotspot area (which includes Auckland Road, Melbourne Road and nearby streets) experienced reported surface water/sewer&ndash;related flooding during the severe rainfall on 25th July 2021; site visits and gully inspections were carried out subsequently as part of the Section 19 investigation. (p81)</p></div><div class="nugget-popup"><p>Multiple reports of surface&ndash;water related flooding across the catchment: internal property flooding, external property flooding and flooding of highways affecting residents across Ilford South. [IMG] (p83)</p></div><div class="nugget-popup"><p>The Ilford area lies within the Ilford South RoFSW map showing surface water flood extents and reported external, highways and internal flooding incidents associated with the investigated event. [IMG] (p85)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 external reports on St Albans Road; 1 highways report on Staines Road [TAB] (p23)</p></div><div class="nugget-popup quant"><p>1 external flooding report [TAB] (p24)</p></div><div class="nugget-popup quant"><p>2 reports of internal flooding (p77)</p></div><div class="nugget-popup quant"><p>1 property (Melbourne Road); 1 flooded cellar (Auckland Road) [IMG,PAG] (p80)</p></div><div class="nugget-popup quant"><p>10 reports; 2 internally flooded properties; 4 externally flooded properties; 4 cases of flooding to the highway [IMG] (p83)</p></div></div></body></div>`)[0];

                var html_a076b7bdae9cd145232b35a04503d3ba = $(`<div id="html_a076b7bdae9cd145232b35a04503d3ba" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Clayhall</h1><div class="nugget-popup"><p>Hotspot polygon on the borough map indicating a localised cluster of reported flooding incidents associated with the 25 July 2021 event. [IMG] (p3)</p></div><div class="nugget-popup"><p>Identified as a hotspot where reported flooding incidents were concentrated during the event; clusters of internal, external and highway flooding reports occurred in and around Clayhall. [IMG,PAG] (p54)</p></div><div class="nugget-popup"><p>The Clayhall hotspot was one of the areas most impacted by flooding during the 25th July 2021 rainfall event. Multiple roads in the neighbourhood reported internal flooding, surcharging gullies and manholes, and sewers being overwhelmed as surface water entered the drainage network. [PAG] (p55)</p></div><div class="nugget-popup"><p>The Clayhall hotspot experienced ponding and property flooding located on a topographic low near Peel Place and Coburg Gardens. Reported impacts in the hotspot included external, highways and internal flooding concentrated around the main sewer lines; the Glade reported foul water flooding. [IMG,PAG] (p56)</p></div><div class="nugget-popup"><p>Properties within the Clayhall hotspot experienced surface water inundation, with internal flooding reported. Flooding concentrated on a topographic low causing surface water to pond near Peel Place and Coburg Gardens; primary overland flow paths converge through the hotspot. [IMG,PAG] (p57)</p></div><div class="nugget-popup"><p>The Clayhall hotspot experienced surface water flooding during the 25 July 2021 event: RoFSW/Ea data show reported locations fall within the predicted surface water flood extents and depths. Modelled/predicted depths reached over 1.2 m in Peel Place and Coburg Gardens and ranged from 0.15 m to 0.9 m in other roads. Resident reports indicate the surface water sewer network (Peel Place, Coburg Gardens and upstream roads) was unable to accommodate flows, with gullies and manholes surcharging. Foul (sewer) water flooding was reported in The Glade and at the intersection with Atherton Road, and the evidence indicates insufficient capacity in the surface sewer network for a rainfall event of this magnitude. [IMG] (p58)</p></div><div class="nugget-popup"><p>Clayhall hotspot experienced flooding attributed to sewer sources; anecdotal resident reports and observations indicate insufficient capacity in the surface sewer network for the rainfall magnitude, with gullies and manholes surcharging and local streets (e.g. Peel Place, Coburg Gardens) affected. [TAB] (p59)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>>1.2 m predicted depths in Peel Place and Coburg Gardens; 0.15 m to 0.9 m predicted depths in other roads [IMG] (p58)</p></div></div></body></div>`)[0];

                var html_8bf3c734a33cc4670308d5094dc300e7 = $(`<div id="html_8bf3c734a33cc4670308d5094dc300e7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cranbrook</h1><div class="nugget-popup"><p>Marked hotspot on the map indicating a cluster of reported flood incidents during the 25 July 2021 storm. [IMG] (p3)</p></div><div class="nugget-popup"><p>A gully with sunken tarmac in The Drive (Cranbrook) was linked to flooding issues; Redbridge recommended investigation. (p4)</p></div><div class="nugget-popup"><p>Identified hotspot with a concentration of reported flood incidents during the 25 July 2021 event. The area is associated with multiple reported internal, external and highway flooding incidents within the Fairlop&ndash;Cranbrook catchment, indicating localized urban/surface&ndash;water flood impacts. [IMG,PAG] (p66)</p></div><div class="nugget-popup"><p>Following heavy rainfall on 25 July 2021 three incidents of internal flooding were reported in the Cranbrook hotspot: gullies surcharged and caused internal flooding to a property on The Drive; a basement flooded in Endsleigh Gardens; and water flowed from the road into a property on Northbrook Road. (p67)</p></div><div class="nugget-popup"><p>Internal flooding of properties within the Cranbrook hotspot. Properties on Northbrook Road experienced ponding at a topographic low that led to internal flooding; a property in Endsleigh Gardens was also flooded. Surface water runoff followed primary overland flow paths toward the culverted Cran Brook and River Roding; the mapped TWUL sewer network is adjacent to locations of reported internal flooding and may be associated with the incidents. [IMG,PAG] (p68)</p></div><div class="nugget-popup"><p>The Cranbrook hotspot/catchment is identified with reported flooding incidents across the area: external flooding, highways flooding and internal flooding are marked in the hotspot; these incidents are distributed across several residential blocks and are shown on the hotspot map. Streams traverse the catchment and intersect zones where flooding reports cluster. [IMG,PAG] (p69)</p></div><div class="nugget-popup"><p>Surface&ndash;water flooding on 25 July 2021 caused internal flooding incidents within the Cranbrook hotspot. Water flowed along roads (notably Northbrook Road) onto properties; gullies in The Drive were reported to be surcharging during the rainfall event suggesting sewer/network contribution; a flooded basement was reported in Endsleigh Gardens, so groundwater flooding cannot be discounted for that instance. [IMG] (p70)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>65 reports in Fairlop&ndash;Cranbrook catchment (11 internally flooded properties; 28 externally flooded properties; 26 cases of highway flooding) &mdash; many reports clustered around Cranbrook and Fullwell Cross [IMG,PAG] (p66)</p></div><div class="nugget-popup quant"><p>3 incidents (p67)</p></div><div class="nugget-popup quant"><p>1 flooded basement; 1 gully surcharging [IMG] (p70)</p></div></div></body></div>`)[0];
