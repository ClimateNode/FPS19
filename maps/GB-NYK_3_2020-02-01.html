                var html_d68d22f92d7d124b38e4bda598e38b69 = $(`<div id="html_d68d22f92d7d124b38e4bda598e38b69" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Aire</h1><div class="nugget-popup"><p>Flooding from the main River Aire caused inundation of the lower Aire and its washlands; the event was widespread across multiple authority areas and has prompted an Environment Agency review of flows and washland capacity. [PAG] (p2)</p></div><div class="nugget-popup"><p>The River Aire and its associated washlands were involved in the February 2020 flood events; this has prompted the Environment Agency to undertake a review and further assessment of flows and washland capacity (work noted as already in progress since the February 2020 events). (p3)</p></div><div class="nugget-popup"><p>Consecutive storms and saturated floodplain caused washlands around Hirst Courtney to reach capacity; River Aire overtopped into the communities of West Bank and Hirst Courtney, and high river levels prevented Black Drain from draining to the river, causing flooding along the Hirst Road corridor between the A19 and Carlton. (p8)</p></div><div class="nugget-popup"><p>The Lower Aire area was identified as an exception to otherwise isolated incidents and described as a worst&ndash;affected area: flooding concentrated along the Hirst Road corridor from the A19 at Chapel Haddlesey to Carlton Bridge in Selby District. (p11)</p></div><div class="nugget-popup"><p>Fluvial flooding associated with the River Aire affected low&ndash;lying land to the south of Chapel Haddlesey and contributed to flood risk/observed flow paths for Chapel Haddlesey and nearby settlements (Hirst Courtney, West Bank, Carlton Chapel Haddlesey). The presence of the weir/old lock influences upstream headwater levels and the flood behaviour at the village. (p18)</p></div><div class="nugget-popup"><p>The Aire catchment experienced extreme rainfall in February 2020, producing very high river flows and causing river flooding across the catchment during the period. [PAG] (p23)</p></div><div class="nugget-popup"><p>Experienced exceptionally high monthly rainfall in February 2020 and intense short&ndash;term rainfall during Storm Ciara and other periods; locations in the Aire catchment recorded 106% to 128% of the February LTA in 48 hours. Persistent rainfall occurred throughout the month and during named storms. [PAG] (p24)</p></div><div class="nugget-popup"><p>The Aire catchment (Thornton Moor and Upper Aire locations) experienced persistent rainfall and elevated river flows during February, with sustained runoff particularly around 21 February that increased catchment saturation and contributed to flow peaks. [IMG] (p26)</p></div><div class="nugget-popup"><p>Multiple monitoring sites on the Aire recorded significant and, at some sites, record&ndash;high peaks during February storm and rainfall events (levels rose during Storm Ciara, rose further during Storm Dennis, and reached monthly/record peaks on 25 Feb). [PAG] (p28)</p></div><div class="nugget-popup"><p>During February the River Aire recorded significant and sustained high flows and water levels driven by successive storms (Ciara, Dennis, Jorge) and saturated catchments. Monitoring sites along the Aire recorded major peaks (including monthly peaks on 25 February) and prolonged elevated levels through the month. [IMG] (p29)</p></div><div class="nugget-popup"><p>The River Aire and its catchments experienced widespread flood alerts and flood warnings throughout February 2020 (flood alert for the upper and middle Aire on 8 February; flood warnings for the Aire at Crosshills, Hirst Marsh and West Haddesley on 10 February; warnings for Allerton Ings, Hirst Courtney, Gowdall, Kellington, Hensall, Temple Hirst and repeated alerts for lower/middle/upper Aire catchments across mid&ndash; to late&ndash;February), indicating significant river flooding risk across the Aire catchment during 01 Feb 2020 &ndash; 29 Feb 2020. (p30)</p></div><div class="nugget-popup"><p>The River Aire flooded its floodplain, inundating agricultural land and encroaching on infrastructure; flooding contributed to failure/damage of floodbank at Temple Hirst (requiring emergency repairs) and impacted transport routes and assets in the vicinity. [IMG] (p34)</p></div><div class="nugget-popup"><p>The middle and Lower Aire experienced sustained high water levels and successive peaks during the late&ndash;February 2020 rainfall period; washlands did not empty between peaks and tidal/low&ndash;tide elevations within the channel caused rising baseline levels and a noted 'surge' in water levels. (p42)</p></div><div class="nugget-popup"><p>Floodplain filling of the River Aire over several days raised river levels and contributed to the high levels and flooding observed at Snaith (culminating in high levels on 25 Feb 2020). Flood peaks also passed through Leeds on several February dates. [PAG] (p43)</p></div><div class="nugget-popup"><p>Operation of the Leeds Flood Alleviation Scheme (weirs) and the high flows during the February 2020 event increased downstream flows and water levels on the River Aire. The most notable modeled increase was at Thwaite's Mill; downstream water level increases reduced with distance and washlands overtopped at Chapel Haddlesey producing flat&ndash;topped gauge peaks. (p44)</p></div><div class="nugget-popup"><p>Hydrographs across multiple monitoring sites on the River Aire show episodic surges and multiple flood pulses between 9&ndash;27 Feb 2020. Those river stage peaks correspond with recorded flooding incidents across communities in western and southern parts of North Yorkshire during February 2020. [IMG] (p48)</p></div><div class="nugget-popup"><p>Consecutive storms and prolonged rain caused the River Aire to be very high; washlands around Hirst Courtney reached capacity and there was overtopping of the river into the communities of West Bank and Hirst Courtney on 25th February. (p49)</p></div><div class="nugget-popup"><p>High flows on the River Aire during February 2020 caused inundation of its washlands and contributed to raised water levels downstream, prompting further assessment of flows and washland capacity. (p50)</p></div><div class="nugget-popup"><p>Flood peaks on the River Aire passed through Leeds during the February 2020 heavy rainfall, producing distinct flood peaks in the city. (p53)</p></div><div class="nugget-popup"><p>The River Aire had flood peaks passing through Leeds and its floodplains filled over several days, contributing to the high levels observed at Snaith; the Leeds FAS weirs on the Aire were operated during the event. [IMG,PAG] (p54)</p></div><div class="nugget-popup"><p>The River Aire propagated elevated flows downstream during the event; water&ndash;level changes at Leeds propagated to downstream gauges (approx. 5 hours to Castleford) and the main flood peak was recorded further downstream at Snaith. [IMG] (p55)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>27 properties internally flooded (Selby District), mostly along the Hirst Road corridor between the A19 and Carlton (p8)</p></div><div class="nugget-popup quant"><p>320% to 375% of the monthly long term average (LTA) rainfall; 106% to 128% of the February LTA recorded in 48 hours [PAG] (p24)</p></div><div class="nugget-popup quant"><p>Chapel Haddesely 3.43 m on 25/02/2020; Beal Weir 4.10 m on 25/02/2020; Birkin Westholme Washalnds 5.40 m on 25/02/2020; Roal Dyke 5.95 m (monthly peak); West Bank pond 3.38 m (highest on record); Wheelan Dyke 4.59 m (highest on record) [PAG] (p28)</p></div><div class="nugget-popup quant"><p>Chapel Haddesely peak 3.43 m (25/02/2020); Beal Weir (Beal Weir bridge) peak 4.10 m (25/02/2020); Birkin West Holme Washlands peak 5.40 m (25/02/2020); Roall Dyke 5.95 m; West Bank Pond 3.38 m (highest on record); Wheelan Dyke 4.59 m (highest on record). [IMG] (p29)</p></div><div class="nugget-popup quant"><p>Peak stage at Carlton Bridge recorded 6.052 m AOD (early Feb) and 6.228 m AOD (25 Feb); Chapel Haddlesey peaks 3.436 m and 3.437 m [TAB,PAG] (p42)</p></div><div class="nugget-popup quant"><p>over 26 separate communities; Harrogate Borough Council recorded 44 incidents; Selby recorded 27 properties; Craven recorded 25 properties [IMG] (p48)</p></div></div></body></div>`)[0];
                popup_2ae591ebfa26a316592932367461ca51.setContent(html_d68d22f92d7d124b38e4bda598e38b69);

                var html_44f81c1fb40b7dd33e660c73a36c56f1 = $(`<div id="html_44f81c1fb40b7dd33e660c73a36c56f1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Nidd</h1><div class="nugget-popup"><p>The River Nidd's catchment received very high rainfall in February 2020, contributing to elevated flows within the Pennine catchments that fed the flood event. (p8)</p></div><div class="nugget-popup"><p>The Nidd catchment experienced extreme rainfall in February 2020, producing very high river flows and causing river flooding across the catchment during the period. [PAG] (p23)</p></div><div class="nugget-popup"><p>Upper Nidd catchment recorded intense short&ndash;duration rainfall within the month (notably during Storm Ciara), and the Nidd catchment as a whole received exceptionally high monthly totals in February 2020. Persistent heavy rainfall occurred throughout the month and during named storms. [PAG] (p24)</p></div><div class="nugget-popup"><p>River Nidd experienced elevated runoff and increased river levels during the February storms (notably around the 8&ndash;9 February and subsequent events), reflecting strong catchment response and contributing to county&ndash;wide river flow peaks through the month. [IMG] (p26)</p></div><div class="nugget-popup"><p>River Nidd recorded extreme peaks in February 2020: at Pateley Bridge the Nidd reached a highest&ndash;ever peak of 3.93 m on 9 February (Storm Ciara), and at Knaresborough it peaked at 2.1 m on the same day. (p27)</p></div><div class="nugget-popup"><p>A severe flood warning was issued for the Nidd at Pateley Bridge on 9 February 2020; flood warnings were issued for the Nidd at Knaresborough and for Knaresborough caravan park on multiple dates in February, and alerts remained in place for the upper and lower Nidd. (p30)</p></div><div class="nugget-popup"><p>Upper catchment experienced very high river flows during Storms Ciara and Denis in February 2020, contributing to localised river flooding in the Nidd catchment. (p49)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>320% to 375% of the monthly long term average (LTA) rainfall; 106% to 128% of the February LTA recorded in 48 hours (upper Nidd) [PAG] (p24)</p></div></div></body></div>`)[0];

                var html_f41b678bcb9fe27363aae0db7e48e991 = $(`<div id="html_f41b678bcb9fe27363aae0db7e48e991" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Wharfe</h1><div class="nugget-popup"><p>The River Wharfe recorded a highest&ndash;ever peak (3.91 m at Netherside Hall) on 9 February 2020; the high river levels contributed to flooding of properties in the Settle, Gargrave and Skipton areas and elsewhere in the catchment (including Pateley Bridge, Masham and Boroughbridge). (p8)</p></div><div class="nugget-popup"><p>Exceptional rainfall during February 2020 across the Wharfe/Aire/Swinney catchments caused river flooding within the catchment, impacting communities and infrastructure in the area. (p23)</p></div><div class="nugget-popup"><p>Catchment received exceptionally high cumulative rainfall during February 2020 (wettest February on record for the area) with persistent rainfall and intense bands during the named storms across the Pennine ridge. [PAG] (p24)</p></div><div class="nugget-popup"><p>Prolonged and repeated rainfall through February produced four significant high&ndash;flow peaks on the River Wharfe corresponding with Storms Ciara, Dennis and Jorge and the intense 21 February rainfall, resulting in elevated river levels and high flows across the Wharfe catchment. (p26)</p></div><div class="nugget-popup"><p>The Wharfe recorded very high peaks during February storms. The Wharfe at Netherside Hall recorded a highest&ndash;ever peak of 3.91 m on 9 Feb, and the Wharfe at Kettlewell peaked at 2.39 m on 10 Feb; the river showed four significant peaks corresponding to the named storms and the 21 Feb rainfall event. [IMG] (p27)</p></div><div class="nugget-popup"><p>The Environment Agency reported that incidents on Friday night and Saturday morning were predominantly on the River Wharfe (part of the February flooding incidents across the county). (p30)</p></div><div class="nugget-popup"><p>Storms Ciara and Denis produced intense rainfall in the Wharfe's upper catchment, contributing to localised flooding during the February 2020 events. (p49)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>up to 25 properties internally flooded (Craven District); 44 properties internally flooded (reported to Harrogate Borough Council) (p8)</p></div></div></body></div>`)[0];

                var html_810d17a6b331ad86af71cf99f12fcb35 = $(`<div id="html_810d17a6b331ad86af71cf99f12fcb35" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Selby District</h1><div class="nugget-popup"><p>Selby district was affected by the February 2020 flooding events described in the report. (p1)</p></div><div class="nugget-popup"><p>The Lower Aire area within Selby District experienced river flooding during February 2020; flooding affected the Hirst Road corridor between the A19 at Chapel Haddlesey and Carlton Bridge, impacting the local transport corridor and communities. [IMG] (p11)</p></div><div class="nugget-popup"><p>The River Aire running through Selby district showed significant peaks during February 2020; monitoring sites within the district recorded monthly or record highs (examples: Chapel Haddesely 3.43 m, Beal Weir 4.1 m, Birkin Westholme Washlands 5.4 m on 25 Feb), contributing to elevated flood conditions across the district. (p28)</p></div><div class="nugget-popup"><p>Internal flooding to residential properties (18 properties recorded) concentrated around Hirst Courtney, Carlton and Acaster; widespread flooding affected farming assets, roads and bridges; collapse/damage to a flood bank at Temple Hirst requiring immediate EA emergency repairs on 20 Feb; railway embankment damage at Hirst Courtney/West Banks caused single&ndash;track operations and risk to fuel deliveries to Drax Power Station; emergency services responded to vehicle rescues and pumping operations. (p33)</p></div><div class="nugget-popup"><p>Properties in the Selby district were flooded during February 2020. (p49)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>18 properties (p33)</p></div><div class="nugget-popup quant"><p>27 properties (p49)</p></div></div></body></div>`)[0];

                var html_183d27c51891d3c1a0cd760e2d4d1327 = $(`<div id="html_183d27c51891d3c1a0cd760e2d4d1327" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>North Yorkshire</h1><div class="nugget-popup"><p>Multiple river flooding impacts across the county including: properties flooded in Settle, Gargrave, Skipton, Pateley Bridge, Masham and Boroughbridge; washlands around Hirst Courtney reached capacity and overtopped causing flooding to West Bank and Hirst Courtney; Black Drain could not discharge to the River Aire because of high river levels, contributing to flooding; properties flooded mostly along the Hirst Road corridor between the A19 and Carlton. [MUL] (p8)</p></div><div class="nugget-popup"><p>Flooding incidents were recorded across the county during February 2020, affecting communities in the western and southern parts of North Yorkshire. Incidents ranged from isolated property flooding to larger corridor flooding (notably the Lower Aire area). (p11)</p></div><div class="nugget-popup"><p>Prolonged and repeated rainfall throughout February led to many catchments across the county receiving well above the February long&ndash;term average, producing multiple high&ndash;flow peaks on most rivers and raising flood risk countywide. [IMG] (p26)</p></div><div class="nugget-popup"><p>Across North Yorkshire multiple rivers recorded significant storm&ndash;driven peaks during February 2020: River Nidd at Pateley Bridge reached a highest&ndash;ever 3.93 m (9 Feb), Bedale Beck at Leeming peaked 4.63 m (9 Feb), River Wiske at Romanby 1.99 m (16 Feb), River Aire sites recorded record or monthly peaks (Roall Dyke 5.95 m; Birkin Westholme 5.4 m; West Bank pond 3.38 m highest on record; Wheelan Dyke 4.59 m highest on record), and Ure and Nidd sites showed pronounced peaks&mdash;these measurements reflect widespread river&ndash;flood impacts across the county during the storm sequence. (p28)</p></div><div class="nugget-popup"><p>County&ndash;wide flooding during February 2020: nearly every district reported flooding at some level; repeated and prolonged road closures across the month. [PAG] (p30)</p></div><div class="nugget-popup"><p>Flooding incidents were recorded across the western and southern parts of the county in February 2020, with isolated incidents linked to Storms Ciara and Denis and to intense rainfall later in the month; localised flood impacts included overwhelmed ordinary watercourses, exceeded beck capacity and overtopping of the River Aire washlands. (p49)</p></div><div class="nugget-popup"><p>The report refers to February 2020 flooding across the area (including recommendations to monitor Swinney Beck in Masham and for the Environment Agency to review River Aire flows and washlands), indicating the county experienced river flooding during the February 2020 events and that follow&ndash;up assessments and resilience works were required. (p51)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>up to 25 properties internally flooded (Craven District Council reported); 44 properties internally flooded (Harrogate Borough Council reported); 27 properties internally flooded (Selby District Council reported, mostly along the Hirst Road corridor) [MUL] (p8)</p></div><div class="nugget-popup quant"><p>over 26 separate communities (p11)</p></div><div class="nugget-popup quant"><p>3.93 m (River Nidd, Pateley Bridge, 9 Feb); 4.63 m (Bedale Beck Leeming, 9 Feb); 1.99 m (River Wiske Romanby, 16 Feb); 5.95 m (Roall/Roal Dyke); 5.4 m (Birkin Westholme); 3.38 m (West Bank pond, highest on record); 4.59 m (Wheelan Dyke, highest on record) (p28)</p></div><div class="nugget-popup quant"><p>52 roads [PAG] (p30)</p></div><div class="nugget-popup quant"><p>over 26 communities (p49)</p></div></div></body></div>`)[0];

highway drains on the flow route and inspected the Oaks box culvert. (p40)</p></div><div class="nugget-popup"><p>Swinney Beck capacity was exceeded due to high river flows; NYCC&ndash;owned structures were inspected and no significant defects or obstructions were found. The exceeded capacity led to flooding in Masham. (p49)</p></div><div class="nugget-popup"><p>The town experienced flooding associated with Swinney Beck during February 2020, prompting monitoring and responsive actions by authorities. (p50)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>44 properties reported to Harrogate Borough Council (affecting Pateley Bridge, Masham, Boroughbridge) (p8)</p></div><div class="nugget-popup quant"><p>170mm silt in The Oaks box culvert; box culvert depth 1200mm (p40)</p></div></div></body></div>`)[0];

>Overtopping of the River Aire into the West Bank community on 25 February 2020 after washlands reached capacity, causing flooding of the area. [PAG,MUL] (p49)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3.38 m peak (highest on record); typical range 0.27&ndash;1.00 m [PAG] (p28)</p></div><div class="nugget-popup quant"><p>Peak depth 3.38 m (highest level on record; recorded during February 2020) [IMG,PAG] (p29)</p></div></div></body></div>`)[0];

<div class="nugget-popup"><p>Stage at Chapel Haddlesey rose notably during the 9&ndash;27 Feb 2020 period, indicating river flood pulses on the River Aire during the February 2020 event that were associated with local flooding incidents. [IMG] (p48)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3.436 m; 3.37 m; 3.437 m (recorded peak stages) [TAB,PAG] (p42)</p></div></div></body></div>`)[0];
