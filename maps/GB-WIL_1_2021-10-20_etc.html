                var html_71443e42d2d7c675293a1ea828b0d7e8 = $(`<div id="html_71443e42d2d7c675293a1ea828b0d7e8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Nadder</h1><div class="nugget-popup"><p>The River Nadder reached its highest recorded level during the 20&ndash;21 October 2021 event; it flowed at bank capacity and, when combined with intense localised pluvial runoff, came out of bank and caused fluvial flooding through the parish, threatening riverside properties including the old mills. [PAG,MUL] (p1)</p></div><div class="nugget-popup"><p>The Nadder came out of bank during the event; river&ndash;based flooding followed the EA Flood Zone 3 extents. The river was driven to bank capacity by the base heavy storm rainfall and, with local intense rainfall flowing overland into the Nadder, produced out&ndash;of&ndash;bank flows that contributed to flooding in the area. (p2)</p></div></div></body></div>`)[0];

                var html_2117a49d01a396a327221708e379344e = $(`<div id="html_2117a49d01a396a327221708e379344e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Donhead St Andrew</h1><div class="nugget-popup"><p>Multiple properties in the village were flooded by a combination of fluvial flooding from the River Nadder (river overtopping bank capacity) and localised pluvial/surface water runoff; old mill properties adjacent to the Nadder were directly threatened by river flooding. The Nadder reached its highest recorded level on the 20&ndash;21 October event and surveyed levels behind Court Street matched a 150&ndash;year return period model, supporting significant river overtopping. [MUL] (p1)</p></div><div class="nugget-popup"><p>Properties in the parish experienced pluvial (surface water) flooding caused by local high&ndash;intensity rainfall; combined with the Nadder coming out of bank, this produced property and highway flooding. Surface water from higher land flowed onto and along the highway (using it as a conduit) and overwhelmed the highway drainage system. A programme of repairs and improvements to aid highway safety is underway. [MUL] (p2)</p></div></div></body></div>`)[0];
