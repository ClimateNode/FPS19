                var html_e74f1f7b9bcbe1d70ff45dcdcc1b6fcc = $(`<div id="html_e74f1f7b9bcbe1d70ff45dcdcc1b6fcc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Alnmouth Road, Alnwick</h1><div class="nugget-popup"><p>Surface water runoff from higher ground at Alnmouth Road/A1068 was channelled down toward Royal Oak Gardens; the map and report place the A1068 within the mapped flood&ndash;affected area and show roads affected by surface water flow. [IMG,PAG] (p1)</p></div><div class="nugget-popup"><p>Surface water accumulated on higher ground at Alnmouth Road and was channelled down a footpath into Royal Oak Gardens, contributing to the flooding there. Gullies on Alnmouth Road were cleaned (post 28th June) as part of the response. [TAB] (p2)</p></div></div></body></div>`)[0];

                var html_1640ff24e69357599533470a86ed27fd = $(`<div id="html_1640ff24e69357599533470a86ed27fd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Royal Oak Gardens, Alnwick</h1><div class="nugget-popup"><p>Royal Oak Gardens was flooded by surface water runoff when intensive rainfall exceeded drainage capacity. Runoff arrived from fields to the north, adjoining higher streets, and&mdash;most significantly&mdash;by overtopping at a depression in South Road which allowed water to flow through back gardens into properties on Royal Oak Gardens. [PAG] (p1)</p></div><div class="nugget-popup"><p>Surface water from higher ground (Alnmouth Road) was channelled via a footpath into Royal Oak Gardens. The volume of water overwhelmed the sewer network, causing flooding of properties and a sewage backup affecting one property. Reports note gullies not connecting properly to the main sewer network and reduced network efficiency. This area has experienced similar flooding previously (third time in circa 20 years; similar event in 1994). [MUL] (p2)</p></div><div class="nugget-popup"><p>Surface water overtopped garden boundaries and flowed through rear gardens of properties on Royal Oak Gardens, with visible pooling, submerged lawns and displaced garden furniture. Flow paths shown on the aerial map direct runoff along the main road into these residential gardens. [IMG] (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8 residential properties [PAG] (p1)</p></div><div class="nugget-popup quant"><p>one property; three incidents (including a similar event in 1994) [MUL] (p2)</p></div></div></body></div>`)[0];

                var html_45fa0f57fb52d9ee797a0902670ff451 = $(`<div id="html_45fa0f57fb52d9ee797a0902670ff451" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Northumberland</h1><div class="nugget-popup"><p>Surface water runoff on 28 June 2012 caused flooding in the east of Alnwick (notably Royal Oak Gardens). Runoff from fields north of Royal Oak Gardens, from higher adjoining streets and from a depression in South Road flowed into and through back gardens into Royal Oak Gardens; the local drainage system lacked capacity and water entered properties and roadways. [IMG] (p1)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8 residential properties flooded; 3 roads affected [IMG] (p1)</p></div></div></body></div>`)[0];
