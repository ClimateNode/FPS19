                var html_5ce46af043cd2aaf2cabb1cc12cf0a67 = $(`<div id="html_5ce46af043cd2aaf2cabb1cc12cf0a67" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Well Road, East Cowes</h1><div class="nugget-popup"><p>Well Road experienced flooding on 25 October 2023 and is located within the tidal extent of Flood Zones 2 and 3, indicating the flood was associated with tidal inundation. (p17)</p></div><div class="nugget-popup"><p>Included among the most affected areas in East Cowes during the October 2023 flood. Flooding was driven by extreme rainfall, tide locking of outfalls to the Medina Estuary and hydraulic overloading of watercourses and local drainage; clogged road drains and overloaded combined sewers (with overspill and burst manholes) contributed to flooding of the road and nearby properties. (p33)</p></div><div class="nugget-popup"><p>Street level flooding with water covering the road surface as viewed looking towards the ferry terminal; built environment and access along Well Road affected by standing floodwater. (p36)</p></div><div class="nugget-popup"><p>The majority of the flooding impacted the area in the vicinity of Well Road; roads and nearby properties experienced flooding, with some properties reporting internal flooding. [MUL] (p38)</p></div></div></body></div>`)[0];

                var html_25e6db9a57803d559f8dd8b3b442c047 = $(`<div id="html_25e6db9a57803d559f8dd8b3b442c047" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Castle Street, East Cowes</h1><div class="nugget-popup"><p>Experienced flooding during the event on 25 October 2023; the street lies within the tidal extent of Flood Zones 2 and 3 (subject to tidal flooding from the Medina Estuary/The Solent). (p17)</p></div><div class="nugget-popup"><p>Identified as a low&ndash;lying area that received a large amount of rainwater/runoff from Spring Hill during the event, leading to surface water flooding of the area on the main event date. (p27)</p></div><div class="nugget-popup"><p>Reported flooding in the vicinity of Castle Street as part of the town&ndash;centre flood incidents. [PAG] (p32)</p></div><div class="nugget-popup"><p>Identified among areas with significant flood impacts in East Cowes during the October 2023 event. Flooding was driven by extreme rainfall with tide locking and hydraulic overloading of drainage and the Church Path watercourse, causing blocked drains, sewer overload with overspill and burst manhole covers and resulting in flooding of roads and surrounding properties. (p33)</p></div><div class="nugget-popup"><p>Manholes in Castle Street surcharged and flooded the road; floodwater followed local topography causing internal flooding of commercial buildings and residential dwellings on Castle Street. Residential properties were heavily affected, with residents displaced to alternative accommodation and loss of carpets, floorboards, furniture and other ground&ndash;floor belongings. Local businesses on Castle Street closed and suffered loss of income; residents experienced stress and anxiety. (p34)</p></div><div class="nugget-popup"><p>Manholes in Castle Street surcharged, causing road flooding and internal flooding of commercial buildings and residential dwellings. Residents were displaced (temporary or permanent moves), lost ground&ndash;floor carpets, floorboards, furniture and other belongings; local businesses closed, lost income and made insurance claims. [IMG] (p35)</p></div><div class="nugget-popup"><p>Floodwater covers the full width of the street, reaching up to shopfronts and building entrances; sandbags placed at some doorways indicating attempts to prevent water ingress and disruption to businesses and pedestrian access. (p36)</p></div><div class="nugget-popup"><p>Low kerb levels were noted on Castle Street and during the event flood water encroached onto properties causing internal flooding. (p51)</p></div></div></body></div>`)[0];

                var html_202ea080e003a26278500166386efcd7 = $(`<div id="html_202ea080e003a26278500166386efcd7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>York Avenue, East Cowes</h1><div class="nugget-popup"><p>Experienced flooding during the event on 25 October 2023; the avenue lies within the tidal extent of Flood Zones 2 and 3 (subject to tidal flooding from the Medina Estuary/The Solent). (p17)</p></div><div class="nugget-popup"><p>Rainwater originating on Spring Hill flowed into this low&ndash;lying street during the event, causing surface water flooding and internal flooding of properties. (p27)</p></div><div class="nugget-popup"><p>Reported flooding in the vicinity of York Avenue as part of the town&ndash;centre flood incidents. [PAG] (p32)</p></div><div class="nugget-popup"><p>Listed among areas with the most significant flood impacts in East Cowes during the October 2023 event. Flooding was caused by extreme rainfall combined with tide locking and hydraulic overloading of the local watercourse and drainage, leading to blocked drains and backup of water. The East Cowes combined sewer catchment was overloaded, with reports of sewage overspill and burst manhole covers contributing to road and property flooding. (p33)</p></div><div class="nugget-popup"><p>Residential properties on York Avenue were heavily internally flooded on the morning of 25 October 2023. Residents were forced to move into alternative accommodation (temporary or permanent), lost carpets, floorboards, furniture and other ground&ndash;floor belongings, and experienced stress and anxiety. There were wider economic impacts from business disruption reported in the affected area. (p34)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties; residents were heavily affected on the morning of 25 October 2023, with displacement into alternative accommodation and loss of carpets, floorboards, furniture and other ground&ndash;floor belongings; stress and anxiety reported. [IMG] (p35)</p></div><div class="nugget-popup"><p>Flooding evident on the avenue with water extending along the street and reaching the bases of buildings; access and entry to premises affected, consistent with images showing inundated streets and sandbags. (p36)</p></div><div class="nugget-popup"><p>Gully blockages and impeded drainage have been reported on York Avenue; low kerb levels were noted and during the event flood water encroached onto properties causing internal flooding. (p51)</p></div><div class="nugget-popup"><p>Majority of reported cases of flooding were in the vicinity of York Avenue; local drainage problems (blockages, storm pump failure) and sewer system overload contributed, with high tide levels also a factor. [MUL] (p53)</p></div></div></body></div>`)[0];

                var html_ebd9c64f2880a2f17311856f79e6be85 = $(`<div id="html_ebd9c64f2880a2f17311856f79e6be85" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Red Funnel Terminal</h1><div class="nugget-popup"><p>Areas adjacent to the Red Funnel Ferry Terminal were among the worst&ndash;hit parts of East Cowes during the flood on 25 October 2023 and were affected again on the night of 8 April 2024; drainage proposals for proposed development at the terminal were reviewed to understand implications for flood risk to East Cowes. [MUL] (p9)</p></div><div class="nugget-popup"><p>Areas immediately adjacent to the ferry terminal were affected by surface water (pluvial) flooding during the October 2023 event; surface water runoff and inundation occurred on surrounding roads and low&ndash;lying areas near the terminal. (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>22 properties (10 residential, 12 commercial) internally flooded in East Cowes during the event(s) affecting the terminal vicinity. [MUL] (p9)</p></div></div></body></div>`)[0];

                var html_64a658d115858f3b6caba532378dcc3c = $(`<div id="html_64a658d115858f3b6caba532378dcc3c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>East Cowes</h1><div class="nugget-popup"><p>Reported flooding incidents occurred in East Cowes following the 25 October 2023 event; photographs in the report document flooding in the town. (p7)</p></div><div class="nugget-popup"><p>Internal flooding to properties in the town centre and areas near the ferry terminal; investigation finds flooding was caused by a combination of extreme rainfall and tide locking. [MUL] (p9)</p></div><div class="nugget-popup"><p>Internal flooding of properties during the October 2023 event (and flooding again during the night of 8 April 2024) affecting areas in the vicinity of the ferry terminal; worst&ndash;hit areas from October correspond to areas affected in April 2024. [MUL] (p11)</p></div><div class="nugget-popup"><p>Flooding occurred in East Cowes such that a Section 19 investigation was carried out; the investigation area focused on the north&ndash;east tip of the island along the east bank of the River Medina and Medina Estuary. (p12)</p></div><div class="nugget-popup"><p>Parts of East Cowes experienced flooding on 25 October 2023; affected areas (for example Well Road, Castle Street and York Avenue) lie within the tidal extent of Flood Zones 2 and 3 indicating tidal inundation risk from the estuary/sea. (p17)</p></div><div class="nugget-popup"><p>Narrow corridors and streets in East Cowes (particularly around the Ferry Terminal) are shown at high risk of surface water flooding; streets named in the report (Dover Road, Well Road/Castle Street, Marsh Road and Link Road) correspond to areas impacted in the October 2023 event. [IMG] (p18)</p></div><div class="nugget-popup"><p>Surface water (pluvial) runoff concentrated into topographic low points and along the estuary shoreline, causing flooding in and around the Ferry Terminal area and central East Cowes. Roads identified as being impacted by the October 2023 event include Dover Road, Well Road, Castle Street, Marsh Road and Link Road; the Well Road roundabout and central discharge points for watercourses/surface water routes were also affected. [IMG] (p19)</p></div><div class="nugget-popup"><p>Affected by the storm on 24&ndash;25 October 2023; the majority of internal flooding incidents in the area occurred on 25 October 2023 associated with heavy rainfall and elevated river/tide levels. [MUL] (p27)</p></div><div class="nugget-popup"><p>Flooding on 25 October 2023 prompted East Cowes council and the fire service to contact Southern Water requesting the storm pumps at the Albany Road Pumping Station be switched on to alleviate capacity issues in the combined sewer network. (p29)</p></div><div class="nugget-popup"><p>Residential properties in East Cowes experienced internal flooding; sandbags were placed at property doors and on drains; storm pumps were deployed at Well Road roundabout to extract flood water; emergency services were called and a councillor attended flooded properties. [TAB] (p30)</p></div><div class="nugget-popup"><p>Reported flooding incidents across the town centre, affecting streets and properties; main concentration in the northwest of the town and town centre vicinity. [IMG] (p32)</p></div><div class="nugget-popup"><p>During the October 2023 flood event East Cowes experienced a combination of extreme rainfall and tide&ndash;locking/hydraulic overloading. The Sandown New Sewer Catchment (combined sewer system) experienced overload: floodwater overspilt and manhole covers burst; residents reported downstairs toilets bubbling; road drains were clogged, resulting in flooding of surrounding properties. Tide locking of discharge into the Medina Estuary contributed to overtopping/backing up of drainage. (p33)</p></div><div class="nugget-popup"><p>Internal flooding of commercial buildings and residential dwellings (including properties on Castle Street, York Avenue, Church Path, Albany Road and Esplanade). Manholes in Castle Street, Well Road and Church Path surcharged, sending a significant volume of water onto roads and into properties. Residents were displaced to alternative accommodation (temporary or permanent), vulnerable residents unable to remain in their homes while repairs proceeded, loss of carpets, floorboards, furniture and ground&ndash;floor belongings, business closures with loss of income and insurance claims, and reported adverse effects on mental health (stress and anxiety). [IMG] (p35)</p></div><div class="nugget-popup"><p>East Cowes experienced flooding on 25 October 2023; local residents and a councillor provided assistance during the event, indicating community&ndash;level impacts and need for local flood resilience measures. (p50)</p></div><div class="nugget-popup"><p>Surface water flooding affected properties in East Cowes, with internal flooding of properties reported and uptake of Property Flood Resilience (PFR) measures at some residential properties. (p51)</p></div><div class="nugget-popup"><p>Surface water and urban flooding affected roads and the town centre, with floodwater reaching road surfaces and threatening property thresholds. Traffic driving through floodwater exacerbated the situation. The town centre drainage is influenced by tidal levels, increasing flood risk and contributing to surface water reaching properties. (p52)</p></div><div class="nugget-popup"><p>Internal flooding to properties (residential and commercial); disruption to normal life with residents moved to alternative accommodation (temporary or permanent); loss of carpets, floorboards, furniture and ground&ndash;floor belongings; businesses closed with loss of income and insurance claims; emergency services overwhelmed; mental health impacts (anxiety, depression, loss of sleep). [MUL] (p53)</p></div><div class="nugget-popup"><p>Community experienced flooding issues prompting recommendations to replace or improve the tidal outfall, increase surface water drainage capacity, and increase capacity of the Church Path watercourse to reduce future flood risk. (p55)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>22 properties (10 residential, 12 commercial) [MUL] (p9)</p></div><div class="nugget-popup quant"><p>at least 22 properties (10 residential, 12 commercial) [MUL] (p11)</p></div><div class="nugget-popup quant"><p>8 residential properties [TAB] (p30)</p></div><div class="nugget-popup quant"><p>22 properties (10 residential, 12 commercial) [MUL] (p53)</p></div></div></body></div>`)[0];
