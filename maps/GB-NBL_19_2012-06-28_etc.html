                var html_fc0f8f3deeb445b1c9d0e8897e4fa9ee = $(`<div id="html_fc0f8f3deeb445b1c9d0e8897e4fa9ee" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Leaside, Halton Lea Gate</h1><div class="nugget-popup"><p>Blocked inlet to a culvert on the ordinary watercourse caused water levels to rise and the watercourse to come out of bank; flood waters passed through some gardens in Leaside and onto the road. Surface water runoff from fields at the rear of northern properties led to flooding of gardens and contributed to flooding within the roads. A green area in Leaside is frequently very wet due to groundwater flooding (possibly linked to historical mining), contributing to local wetness. (p2)</p></div><div class="nugget-popup"><p>A blocked inlet immediately west of Leaside is documented with pooling visible at the obstruction, restricting flow and causing localised water accumulation adjacent to fencing and nearby outbuildings. [IMG] (p3)</p></div></div></body></div>`)[0];

                var html_b12987839d130c9e1f4a41c8ba2c14e4 = $(`<div id="html_b12987839d130c9e1f4a41c8ba2c14e4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Halton Lea Gate</h1><div class="nugget-popup"><p>Flooding concentrated in two clusters along the main road through the village. Residential properties experienced internal/external flooding and three roads through the village were affected. Surface water flow from higher ground converged toward the central village area. No businesses, other buildings or critical infrastructure were reported as impacted. [IMG,PAG] (p1)</p></div><div class="nugget-popup"><p>On 28 June flooding affected two main areas of the village. In the Leaside area the inlet to a culvert under the A689 became blocked, causing the ordinary watercourse to rise, go out of bank and flow through gardens and onto the road; surface water runoff from fields at the rear of northern properties of Leaside also flooded gardens and contributed to road flooding. A green area in Leaside is frequently very wet due to groundwater flooding (possibly linked to historical mining). At the eastern end of Pennine Road (A689) water funnelled down the cycle&ndash;path access and into gardens and properties; five properties on Pennine Road were flooded. (p2)</p></div><div class="nugget-popup"><p>Surface water flow directions on the map show runoff from the south/southwest converging toward the settlement and the A689, indicating areas of water accumulation and flood risk across the village area. [IMG] (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>7 residential properties; 3 roads [IMG,PAG] (p1)</p></div><div class="nugget-popup quant"><p>5 properties; two main areas of the village (p2)</p></div></div></body></div>`)[0];
