                var html_e88e220060050e09bb3240bf1da20074 = $(`<div id="html_e88e220060050e09bb3240bf1da20074" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Mole</h1><div class="nugget-popup"><p>Fluvial flooding from the River Mole and its tributaries caused inundation across river floodplains in Surrey during the winter 2013&ndash;14 storms, contributing to local flood impacts in the Reigate and Banstead area. (p10)</p></div><div class="nugget-popup"><p>The River Mole experienced very high flows during winter 2013&ndash;14 that produced fluvial flooding and inundation across river floodplains in Surrey. Peak flows were driven by the 23&ndash;24 December 2013 storm (largest recorded), with further significant peaks around 17 January 2014 and 1 February 2014. Gauging stations in the middle Mole (Dorking and Leatherhead) exceeded their capacity during the December/January peaks so peak flows were not fully recorded at those sites. [IMG,TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>The middle Mole experienced extreme river levels during the 23&ndash;24 December 2013 storm that exceeded the capacity of gauging stations (Dorking and Leatherhead). The river exhibited flash behaviour &mdash; levels rose rapidly and returned to normal about 10 hours after peak. Significant high flows were also recorded in the middle Mole area on 17 January 2014 and 1 February 2014. [MUL] (p12)</p></div><div class="nugget-popup"><p>High flows in the River Mole caused flooding across Horley and the catchment, contributing to road closures and internal property flooding; river levels in Horley reached record highs. [TAB,MUL] (p21)</p></div><div class="nugget-popup"><p>Extremely high river flows at the Horley gauge during December 2013&ndash;February 2014; river levels in Horley were the highest since EA records began (approximately 1985). [TAB] (p22)</p></div></div></body></div>`)[0];

s; 10 m3/s was exceeded 26 times during the winter; highest instantaneous flow just above 60 m3/s around 23&ndash;Dec&ndash;2013 [IMG,MUL] (p11)</p></div><div class="nugget-popup quant"><p>Maximum over any consecutive 4 weeks (February 2014) had a 121&ndash;year return period; maximum over any consecutive 4 weeks (January 2014) had an 80&ndash;year return period; maximum over any consecutive 14&ndash;days (February 2014) had a 73&ndash;year return period; maximum over any consecutive 14&ndash;days (December 2013) had a 20&ndash;year return period; maximum over any consecutive 14&ndash;days (January 2014) had a 15&ndash;year return period; maximum over any consecutive 4 weeks (December 2013) had a 5&ndash;year return period. [TAB] (p22)</p></div></div></body></div>`)[0];
