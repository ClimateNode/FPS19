                var html_9600a5cedd31bce94098aa573886a1ee = $(`<div id="html_9600a5cedd31bce94098aa573886a1ee" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Camelford Court</h1><div class="nugget-popup"><p>Subject to overland flow and surface flooding caused by intense rainfall and sewer surcharge; formed part of a network of streets where flows synchronised and roads channelled water, increasing local flood depths. (p61)</p></div><div class="nugget-popup"><p>Flooding reported at this location on 12th July 2021. Basement properties were affected by overland flows that collected at basement level and by sewer water backing up through toilets, sinks and drains into basements. [TAB] (p65)</p></div><div class="nugget-popup"><p>At least one property was flooded; the street is in an area of high hydrological connectivity (increasing susceptibility to surface water flooding). [TAB] (p75)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 1 property [TAB] (p75)</p></div></div></body></div>`)[0];

                var html_3b23a851de61d853e1b8aaf21ade6d12 = $(`<div id="html_3b23a851de61d853e1b8aaf21ade6d12" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London</h1><div class="nugget-popup"><p>Surface water and sewer flooding affected properties and local infrastructure across London boroughs, prompting multi&ndash;agency response and follow&ndash;up actions (reviews of Critical Drainage Areas, updates to the Multi&ndash;Agency Flood Plan, consideration of property&ndash;level resilience measures, gully cleaning frequency and sharing of sewer forecasts). [TAB] (p7)</p></div><div class="nugget-popup"><p>Experienced intense rainfall on 12 July 2021 that led to surface&ndash;water/urban flooding in parts of the city (first reports of property flooding around 15:00, majority around 17:00). Emergency services and utilities were heavily engaged &mdash; London Fire Brigade took &gt;1,000 calls and Thames Water received nearly 4,000 calls (and ~7,000 online contacts) as customers sought help during the flooding. [PAG] (p56)</p></div><div class="nugget-popup"><p>A pump at Hammersmith Pumping Station failed and remained offline throughout the event, reducing the station's maximum capacity by 3.2 m3/s, affecting pumping capacity during the flood. (p57)</p></div><div class="nugget-popup"><p>Intense rainfall on 12 July 2021 caused surface water flooding and synchronized overland flows in dense urban streets; roads acted as channels conveying floodwater across Notting Hill and northern/central parts of the Royal Borough. Surcharged sewers produced fountains at manholes (reported at the junction of St Marks Road and Lancaster Road, and at Cornwall Crescent). Floodwater collected in basements and internal parts of properties, damaging interiors and business stock; Sloane Square Station experienced internal flooding. Heatmapping of flooded properties shows the highest concentrations in northern and central RBKC (Notting Hill area). [PAG,IMG] (p63)</p></div><div class="nugget-popup"><p>Parts of London, including Kensington and Chelsea, experienced intense surface&ndash;water/flash flooding on 12 July 2021 that led to streets and properties being internally flooded and businesses damaged. (p73)</p></div><div class="nugget-popup"><p>On 12 July 2021 numerous flooding incidents occurred across the city. London Fire Brigade and Thames Water deployed teams city&ndash;wide; London Fire Brigade declared a major incident and worked through the night to remove floodwater and provide resources such as pumps and sandbags. Emergency services were heavily tasked and resources were stretched across multiple boroughs. (p105)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>first flooding reports around 15:00; majority of reports around 17:00; more than 1,000 calls to London Fire Brigade; nearly 4,000 calls to Thames Water; nearly 7,000 online contacts to Thames Water [PAG] (p56)</p></div></div></body></div>`)[0];

coming up from internal drains/toilets, causing interior damage. (p68)</p></div><div class="nugget-popup"><p>Sewers surcharged and manholes came up, causing heavy inundation; large volumes collected in basements and multiple properties were flooded internally, in some cases by more than a metre. Addisland Court was particularly badly affected with basements and ground floor inundated, car park flooded, building pumps overwhelmed and electrical/boiler services damaged, rendering flats uninhabitable and forcing temporary rehousing. [TAB] (p79)</p></div><div class="nugget-popup"><p>Drains and sewers were overloaded and (in one case) inadequate roof drainage led to very deep internal flooding of properties, including basement flooding. (p80)</p></div><div class="nugget-popup"><p>Recorded as having one of the largest maximum internal flood depths; inferred to have experienced internal flooding associated with sewer overflow events in the area. [TAB] (p85)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>13 properties [TAB] (p64)</p></div><div class="nugget-popup quant"><p>13 properties flooded; average internal depth 105 cm; maximum internal depth 300 cm; Addisland Court flood depths up to 3 m [TAB] (p79)</p></div><div class="nugget-popup quant"><p>maximum internal depth 100 cm; average internal depth 80 cm (p80)</p></div></div></body></div>`)[0];

div><div class="nugget-popup"><p>Sewer flooding rose through shower drains and toilets and caused internal flooding and property damage (Figure 9&ndash;7 top left). Flooding included sewage contamination that stained walls/flooring and required replacement, posing health risks. [PAG] (p70)</p></div><div class="nugget-popup"><p>The street experienced sewer surcharging and surface water collecting downhill; residents experienced sewer flooding coming up from basement toilets, roof/ceiling water ingress, and water entering properties. [TAB] (p77)</p></div><div class="nugget-popup"><p>Drains overflowed as sewers surcharged, causing floodwater to flow along the street into properties. Reports include sewage rising from toilets in basement flats, water entering from roofs/ceilings in at least one case, and Holland Park Station being flooded; the street&#8217;s downhill position caused water to collect. (p78)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>21 properties [TAB] (p64)</p></div><div class="nugget-popup quant"><p>one of 76 streets reported flooded [TAB] (p65)</p></div><div class="nugget-popup quant"><p>21 properties [TAB] (p77)</p></div><div class="nugget-popup quant"><p>5 properties flooded internally (across affected properties in this report); average internal depth 30 cm; maximum internal depth 30 cm (p78)</p></div></div></body></div>`)[0];

gget-popup"><p>Experienced very large internal flood depths caused by overloaded drains and sewers; properties suffered internal and basement flooding. (p80)</p></div><div class="nugget-popup"><p>Many properties were flooded internally: sewage backed up through toilets in basements and the majority were flooded by overflowing drains and manholes which collected in basements. One resident pumped out a very large volume; flooding persisted for about two hours before the water suddenly drained away. [TAB] (p84)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>17 properties [TAB] (p64)</p></div><div class="nugget-popup quant"><p>1 property (4 Royal Crescent) (p68)</p></div><div class="nugget-popup quant"><p>maximum internal depth 100 cm; average internal depth 80 cm (p80)</p></div><div class="nugget-popup quant"><p>17 properties flooded internally; average internal depth 60 cm; maximum internal depth 300 cm; 130 m³ pumped out by one resident; internal flooding up to 3 m; flooding lasted ~2 hours for several residents [TAB] (p84)</p></div></div></body></div>`)[0];

 sewer levels lowered. [TAB] (p81)</p></div><div class="nugget-popup"><p>Intense rainfall and surcharged drains produced a large volume of water flowing down the road, flooding several businesses and inundating basements. Sewer flooding occurred with sewage overflowing through manholes in the street and coming up through toilets in properties&#8217; basements. Gullies were blocked and vehicles created bow waves that further inundated properties; the water then drained away suddenly after about two hours. There was considerable variation in impact between properties depending on floor level, and insurance premiums for many properties increased. (p83)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one of 76 streets reported flooded [TAB] (p65)</p></div><div class="nugget-popup quant"><p>3 properties; average internal depth 140 cm; maximum internal depth 150 cm [TAB] (p81)</p></div></div></body></div>`)[0];

                var html_038486f51a35129983536eaa21e8a9af = $(`<div id="html_038486f51a35129983536eaa21e8a9af" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ladbroke Road, Notting Hill</h1><div class="nugget-popup"><p>Internal flooding of properties on Ladbroke Road with substantial inundation of internal spaces reported by residents; ground&ndash;floor areas were flooded during the 12 July 2021 event. [PAG,IMG] (p90)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>average internal flood depth 62 cm [PAG,IMG] (p90)</p></div></div></body></div>`)[0];

                var html_e8af9298fae2b5d77c957daf9270f573 = $(`<div id="html_e8af9298fae2b5d77c957daf9270f573" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kensington and Chelsea</h1><div class="nugget-popup"><p>Extreme rainfall on 12 July 2021 caused internal flooding across the borough, resulting in flooded properties and overland flows that overwhelmed local drainage. (p5)</p></div><div class="nugget-popup"><p>On 12 July 2021 the borough experienced flooding that led to properties being flooded and road closures. Residents submitted photographs and reports of flooded properties which were used to document impacts. (p16)</p></div><div class="nugget-popup"><p>Council officers undertook site visits to the worst&ndash;affected areas of the borough following flooding. (p18)</p></div><div class="nugget-popup"><p>During the intense rainfall event on 12 July 2021 the borough experienced combined sewer and surface water flooding. The combined sewer system reached capacity, causing sewers to surcharge and stormwater to overflow via manholes onto roads, with roads then conveying water downhill according to local topography. The report identifies sewer and surface water flooding as the main cause of flooding in the July 2021 event. [PAG,IMG] (p22)</p></div><div class="nugget-popup"><p>During the 12 July 2021 event, sewer and surface&ndash;water flooding occurred across the borough: combined sewers reached capacity and surcharged, causing overflows via manholes and overland flow along roads; sewer flow was pushed up into properties (including basement properties) through toilets, sinks and shower drains as sewers backed up. (p23)</p></div><div class="nugget-popup"><p>During the intense rainfall on 12 July 2021 the borough experienced widespread surface water ponding and sewer surcharging. Sewers and drains reached capacity causing surcharges through manholes onto roads (roads acted as conveyance pathways) and floodwater entering properties, with basement properties particularly affected by backflow through toilets, sinks and shower drains. [PAG,IMG] (p27)</p></div><div class="nugget-popup"><p>Basements of properties were flooded; reports of basement flooding in the borough following the event. (p30)</p></div><div class="nugget-popup"><p>Surface water (urban) flooding occurred during the intense rainfall event on 12 July 2021. The Tidal Thames defences were reported as operating normally during the event (no overtopping or breach of tidal defences). (p36)</p></div><div class="nugget-popup"><p>Parts of the borough experienced surface water / urban flooding during the 12 July 2021 intense rainfall event; streets within the borough were listed as having been flooded in the report. [TAB] (p37)</p></div><div class="nugget-popup"><p>Surface water / urban flooding during the event on 12 July 2021 caused inundation of multiple streets in the borough; the streets listed in Table 6&ndash;1 (Stafford Terrace, Holland Road, Queensdale Road, Warwick Road, Holland Villas Road and Royal Crescent) were flooded. [PAG] (p38)</p></div><div class="nugget-popup"><p>On 12 July 2021 the borough experienced surface&ndash;water and sewer (urban) flooding: sewers surcharged, causing sewage and floodwater to back up into basements and via shower/toilet drains, manholes/fountains formed where sewers were surcharged, roads conveyed floodwater, floodwater collected in basements and internal flooding damaged business stock (including flooding inside Sloane Square station). [PAG,IMG] (p41)</p></div><div class="nugget-popup"><p>Intense convective rainfall on 12 July 2021 caused surface&ndash;water and sewer&ndash;related flooding across parts of the borough. The event prompted hydrological analysis (radar and gauge data) to quantify rainfall totals and understand the surface&ndash;water flooding response in the borough. [PAG,IMG] (p47)</p></div><div class="nugget-popup"><p>An intense band of rain formed rapidly over central London and produced high rainfall totals over the Royal Borough of Kensington and Chelsea between 15:00&ndash;18:00 on 12 July 2021. The heavy, concentrated rainfall caused surface&ndash;water/urban flooding in the borough and triggered the Section 19 flood investigation. [PAG,IMG] (p52)</p></div><div class="nugget-popup"><p>Intense convective rainfall on 12 July 2021 produced very high local rainfall totals across the borough (15:00&ndash;18:00), which led to surface water flooding across streets and public areas and caused sewer surcharge (fountains at manholes and internal sewer flooding) and internal flooding of properties and businesses. [PAG,IMG] (p53)</p></div><div class="nugget-popup"><p>Intense, short&ndash;duration rainfall on 12 July 2021 (starting around 15:00) produced surface water/urban flooding across the borough. Areas experienced highly variable return periods (southern parts <1 in 2 years; locations of heaviest rainfall in the borough up to around a 1 in 185‑year storm). A high Thames tide at Chelsea (15:45, 3.80mAOD) coincided with the heavy rainfall on 12 July. (p55)</p></div><div class="nugget-popup"><p>Interceptor and local sewers surcharged, causing flooding at street level; tide&ndash;locking impeded sewer discharge and increased manhole depths; operational failures at pumping stations contributed to borough&ndash;wide flooding. (p60)</p></div><div class="nugget-popup"><p>Intense rainfall and surcharged sewers produced overland flow across the borough. Roads acted as channels conveying floodwater (examples given: A3220, A40, Portobello Road). Surcharging sewers caused fountains at manholes (photographed at the junction of St Marks Road and Lancaster Road, and at Cornwall Crescent). High urban and hydrological connectivity synchronised flows across streets in the Notting Hill area and adjacent neighbourhoods&mdash;Portobello Road, Arundel Gardens, Elgin Crescent, Blenheim Crescent, Lower Clarendon Walk, St Marks Road, Camelford Court, Clarendon Road&mdash;and a wider corridor including Royal Crescent, Holland Villas Road, Bramley Road, St Anns Road, Stoneleigh Street, St Anns Villas, St James's Gardens, Norland Square, Queensdale Road, Princedale Road, Holland Park Avenue, Addison Road, Warwick Road, Napier Road, Edwardes Square, Cope Place and Scarsdale Villas, all of which contributed to and experienced surface water/sewer&ndash;driven flooding on 12 July 2021. [PAG,IMG] (p63)</p></div><div class="nugget-popup"><p>Properties recorded as flooded; floodwater entered properties via backflow through property drains into basement flats (through toilets, sinks and drains). [TAB,PAG] (p64)</p></div><div class="nugget-popup"><p>Flooding across the borough affected properties and basements: surface water and sewage&ndash;contaminated water entered properties (including basements and bathrooms), causing internal flooding, sewage contamination and damage to fixtures, finishes and fittings on multiple streets. [PAG] (p69)</p></div><div class="nugget-popup"><p>Council&ndash;owned properties were internally flooded with sewage and overland floodwater; sewage staining required replacement of walls and flooring and posed health risks. The Council incurred substantial costs responding and repairing flood&ndash;damaged properties and providing temporary accommodation. [PAG] (p70)</p></div><div class="nugget-popup"><p>Within the Royal Borough of Kensington and Chelsea, 76 streets were reported to have flooded on 12 July 2021; properties were internally flooded (receptors), business stock was damaged (e.g. Portobello Road), and three primary schools (Colville Primary, Thomas Jones Primary, Avondale Park Primary) experienced internal flooding. The borough&#8217;s records note that many flooded streets had at least one FLIP installed yet some properties still flooded. (p73)</p></div><div class="nugget-popup"><p>Widespread intense rainfall caused surface water and combined sewer systems to exceed capacity across the borough, leading to sewers surcharging, manhole overflows and multiple basement and ground&ndash;floor property inundations on several streets. [TAB] (p79)</p></div><div class="nugget-popup"><p>Widespread internal flooding across the borough during the intense rainfall on 12th July 2021. Multiple streets and properties experienced internal flooding; sewer surcharge and surface&ndash;water flow pathways contributed to internal property flooding and sewer&ndash;related issues. [PAG] (p90)</p></div><div class="nugget-popup"><p>Widespread flooding across the borough on 12 July 2021: 76 streets were reported to have flooded, with internal flooding of properties (including basements), sewer surcharging (manhole fountains and sewage entering buildings) and roads acting as channels conveying floodwater. Businesses suffered internal flooding and stock damage (for example reported at Portobello Road) and Sloane Square Station experienced internal flooding. Many flooded streets had FLIPs installed but some of those properties still experienced internal flooding. [PAG,IMG] (p91)</p></div><div class="nugget-popup"><p>The borough experienced intense surface&ndash;water/urban flooding on 12 July 2021 that triggered the Section 19 investigation and ongoing engagement with Thames Water over sewer and asset performance; RBKC has been actively engaged with Thames Water's independent review on behalf of residents. (p92)</p></div><div class="nugget-popup"><p>Surface water / urban flooding on 12 July 2021 produced very short warning lead times for the borough, affected properties and local emergency decision&ndash;making, and led to recommendations that the borough seeks funding for Property Flood Resilience (PFR) schemes, develops local surface&ndash;water forecasting, and coordinates with other Risk Management Authorities. [PAG] (p95)</p></div><div class="nugget-popup"><p>The borough collected reports of internal property flooding following the 12 July 2021 event and ran the Section 19 investigation questionnaire; over 300 responses were submitted to the RBKC questionnaire. Initial reports of flooding within the borough were received by local teams during the event. (p96)</p></div><div class="nugget-popup"><p>As the local authority, RBKC was required to update and consolidate three existing Multi&ndash;Agency Flood Plans into a single Multi&ndash;Agency Flood Plan, to review it annually and after events, and to introduce a training and exercising framework. RBKC is also tasked with supporting London&ndash;wide actions on rest centre standards and ensuring critical infrastructure sites (points of contact, contingency plans, protection resources and business continuity arrangements) are included in the MAFP. (p100)</p></div><div class="nugget-popup"><p>The area experienced intense rainfall on 12 July 2021 that produced overland flows and caused sewer surcharge, leading to internal property flooding (including basement inundation) and surface flooding of streets. Borough authorities undertook Section 19 investigation and coordinated response and recovery actions. (p105)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 340 properties (p5)</p></div><div class="nugget-popup quant"><p>less than 10 reports of basement flooding (p30)</p></div><div class="nugget-popup quant"><p>manhole depths increased by 0.5m; fountains at surcharged manholes rose to over 1m (p60)</p></div><div class="nugget-popup quant"><p>5 properties [TAB,PAG] (p64)</p></div><div class="nugget-popup quant"><p>76 streets reported flooded; around 65% of flooded streets had at least one FLIP installed; highest average internal flood depth reported on a street ~140 cm. [PAG] (p90)</p></div><div class="nugget-popup quant"><p>at least 76 streets; over 340 properties (p105)</p></div></div></body></div>`)[0];

                var html_b78674655b47bfb67cd09a9e4c24a849 = $(`<div id="html_b78674655b47bfb67cd09a9e4c24a849" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Notting Hill</h1><div class="nugget-popup"><p>Area experienced the heaviest rainfall during the 12 July 2021 storm; this extreme rainfall is described in the report as likely to have caused the observed flooding in the borough. (p5)</p></div><div class="nugget-popup"><p>Radar&ndash;derived estimates show Notting Hill (radar grid square 152) received the heaviest rainfall in RBKC during the 12 July 2021 storm, an intensity estimated up to a 1&ndash;in&ndash;185&ndash;year event, producing intense short&ndash;duration runoff and surface water flooding in the areas that experienced the heaviest rainfall. (p55)</p></div><div class="nugget-popup"><p>Intense rainfall combined with surcharged sewers produced overland flow across the Notting Hill area; roads acted as channels conveying floodwater and sewers discharged at manholes, increasing local water levels and causing urban flooding. (p61)</p></div><div class="nugget-popup"><p>Intense rainfall and surcharging of sewers produced overland flow through the Notting Hill area. Roads (including Portobello Road and Ladbroke Grove) acted as channels conveying water, synchronising flows from neighbouring streets and increasing water levels. Specific streets in the Notting Hill area reported overland flow and property flooding: Arundel Gardens, Elgin Crescent, Blenheim Crescent, Lower Clarendon Walk, St Marks Road (junction with Lancaster Road reported manhole fountains), Camelford Court and Clarendon Road. Flooded properties are concentrated in this area as shown in the report heatmap. [IMG] (p63)</p></div><div class="nugget-popup"><p>Internal flooding affected businesses on Portobello Road (photograph reproduced from My London shows internal flooding damaging stock). The area also shows a high concentration of FLIPs in the borough FLIP heatmap, indicating properties in this area were subject to flood risk and some properties with FLIPs suffered flooding during the event. [PAG,IMG] (p91)</p></div><div class="nugget-popup"><p>Notting Hill experienced the heaviest rainfall during the storm on 12 July 2021 (the maximum local return period was estimated up to 1 in 185 years), contributing to local surface water and urban flooding across the area. (p105)</p></div></div></body></div>`)[0];

                var html_50d08d547822d9e767e332b02f1f8d83 = $(`<div id="html_50d08d547822d9e767e332b02f1f8d83" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Holland Park</h1><div class="nugget-popup"><p>Council officers carried out site visits and met residents from Holland Park who were affected by flooding on 12 July 2021; residents gave first&ndash;hand accounts and described continuing impacts on individuals and the community from floodwater inundation of properties and streets. (p19)</p></div><div class="nugget-popup"><p>Flooding was reported on 12th July 2021. Basement properties were flooded by overland flows that collected at basement level and by sewer water backing up through toilets, sinks and drains into basements. [TAB] (p65)</p></div><div class="nugget-popup"><p>Drains overflowed as sewers surcharged, causing floodwater to flow along the street and into properties. [TAB] (p77)</p></div><div class="nugget-popup"><p>Multiple properties were flooded, particularly basement and lower&ndash;ground flats, due to surcharging local sewers and surface water entering properties. (p78)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one of 76 streets reported flooded [TAB] (p65)</p></div><div class="nugget-popup quant"><p>1 property [TAB] (p77)</p></div><div class="nugget-popup quant"><p>5 properties flooded internally (across affected properties in this report); average internal depth 30 cm; maximum internal depth 30 cm (p78)</p></div></div></body></div>`)[0];

                var html_e51e4cc0d9c176b4223e51276f2dac8d = $(`<div id="html_e51e4cc0d9c176b4223e51276f2dac8d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kensington</h1><div class="nugget-popup"><p>Area was identified among the worst affected during the 12 July 2021 event; council officers conducted site visits, met residents who gave first&ndash;hand accounts of flooding and observed continuing impacts on individuals and the community. [PAG] (p19)</p></div><div class="nugget-popup"><p>Area identified as a Critical Drainage Area with complex interaction of surface water and sewer flooding during the July 2021 event; sewers surcharged and overland flow conveyed along roads, with risk of internal sewer flooding to properties (notably basements) as sewers reached capacity. [PAG] (p23)</p></div><div class="nugget-popup"><p>Identified in the report as a Critical Drainage Area where complex interactions of surface water and sewer flooding occur; therefore Kensington was susceptible to pooling and sewer surcharge during the intense rainfall on 12 July 2021, contributing to local flooding and impacts on properties (including basements) in the area. [PAG,IMG] (p27)</p></div><div class="nugget-popup"><p>Kensington (within the Royal Borough) was within the area over which an intense, fast&ndash;moving band of rain passed on 12 July 2021 (15:00&ndash;18:00). This produced high local rainfall totals and contributed to surface&ndash;water/urban flooding in the area investigated by the Section 19 report. [PAG,IMG] (p52)</p></div><div class="nugget-popup"><p>The Holland Park / Kensington area (Holland Park PS catchment / grid square 120) experienced the most intense rainfall during 15:00&ndash;18:00 on 12 July 2021, producing very high HYRAD pixel totals within the catchment and contributing to localized surface water flooding and rapid runoff that overwhelmed drainage and sewers. [IMG,PAG] (p53)</p></div><div class="nugget-popup"><p>Kensington experienced widespread surface&ndash;water and sewer&ndash;surcharge driven overland flooding on 12 July 2021. Dense urban connectivity caused flows from neighbouring streets to synchronise, increasing water levels and causing many streets and properties (including basements) to flood; manholes were observed fountain­ing as sewers surcharged and roads conveyed large volumes of water. [IMG] (p62)</p></div><div class="nugget-popup"><p>Local area experienced intense rainfall&ndash;driven flooding: streets and buildings (including schools, community facilities and residences) were affected by surface water and sewer surcharging, with sewage surfacing and entering properties. [TAB] (p86)</p></div><div class="nugget-popup"><p>Areas of central and northern Kensington are shown to have high concentrations of FLIPs and the report notes that there are properties with FLIPs that nevertheless suffered internal flooding during the 12 July 2021 event; this indicates parts of Kensington experienced internal and sewer&ndash;related flooding on that date (specific streets and property counts for Kensington not given). [PAG,IMG] (p91)</p></div></div></body></div>`)[0];

                var html_33c9808e70d0edfa11df01d94497d30b = $(`<div id="html_33c9808e70d0edfa11df01d94497d30b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Chelsea</h1><div class="nugget-popup"><p>Experienced sewer surcharge and surface&ndash;water flooding during the 12 July 2021 event: sewers surcharged and overflowed via manholes and onto roads causing overland flows and internal flooding of transport infrastructure and properties (for example, flooding reported inside Sloane Square Station). [PAG,IMG] (p22)</p></div><div class="nugget-popup"><p>Identified as a Critical Drainage Area in the borough and therefore susceptible to the sewer surcharge and surface water ponding described in the report. During the July 2021 event sewers reached capacity and surcharged, causing manhole overflows onto roads and overland flow along roads; basement&ndash;level properties experienced internal flooding via toilets, sinks and shower drains. [PAG,IMG] (p27)</p></div><div class="nugget-popup"><p>The Chelsea tide gauge recorded a high tide at 15:45 on 12 July 2021 (3.80 mAOD) which coincided with the heavy rainfall that afternoon, a coincidence that increased flood risk and contributed to flooding pressures in adjacent urban areas. (p55)</p></div><div class="nugget-popup"><p>Flooding occurred inside Sloane Square station (Figure 9&ndash;9). The FLIP heatmap also shows clusters in the southern part of Chelsea, consistent with local flood&ndash;affected properties and sewer/surface&ndash;water impacts during the event. [PAG,IMG] (p91)</p></div></div></body></div>`)[0];
