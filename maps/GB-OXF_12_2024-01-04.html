                var html_e75fc7f71c7e141e5d05a7f629087005 = $(`<div id="html_e75fc7f71c7e141e5d05a7f629087005" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Milton Park</h1><div class="nugget-popup"><p>Flooding of three business units where the park's surface water drainage system was unable to discharge to Moor Ditch because of high river water levels. (p2)</p></div><div class="nugget-popup"><p>Businesses in Milton Park were affected by flooding associated with the event (meeting held with flooded businesses on 27 February to discuss impacts and flood&ndash;flow mechanisms). (p10)</p></div><div class="nugget-popup"><p>High Moor Ditch water levels prevented discharge of the Business Park's surface water drainage, causing surface water to back up and leading to internal flooding of units within Milton Park. (p19)</p></div><div class="nugget-popup"><p>Surface water drainage in Milton Park could not discharge to the Moor Ditch because the river level was elevated, leading to flooding within Milton Park. (p21)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 business units (p2)</p></div></div></body></div>`)[0];

                var html_45c1fb691bc86e0cf451763b1377c3a0 = $(`<div id="html_45c1fb691bc86e0cf451763b1377c3a0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Moor Ditch</h1><div class="nugget-popup"><p>Hydraulic overload within Moor Ditch, combined with surcharge from Ginge Brook, caused flooding of nearby private properties and raised river levels that prevented surface water drainage from discharging to the river, contributing to flooding within Milton Park. [TAB] (p2)</p></div><div class="nugget-popup"><p>Received elevated flows routed from Ginge Brook toward Milton during the event; implicated in conveying floodwater through the Milton area (specific overtopping or inundation of the channel not separately quantified in the text). (p9)</p></div><div class="nugget-popup"><p>Received overland flows and flows via a culvert from Ginge Brook during the flood event; flows were entering Moor Ditch approx. 150 m south of the offtake and Moor Ditch levels through Milton were observed at the soffits of highway culverts. [PAG] (p10)</p></div><div class="nugget-popup"><p>The Moor Ditch offtake was 100% blocked by silt build&ndash;up during the January and February flooding, preventing flow through the 100 mm diameter culvert; as a result flows entered Moor Ditch via farmland and an alternate culvert under the A34 ~100 m to the south. Clearance in April restored base flow to the upstream end of Moor Ditch and would have marginally reduced levels in Ginge Brook prior to the flood peaks. [PAG,MUL] (p15)</p></div><div class="nugget-popup"><p>The Moor Ditch offtake was 100% blocked by silt at the time of the January and February flooding, preventing baseflow through the 100 mm culvert. Flows nevertheless entered Moor Ditch via farmland and a culvert under the A34 ~100 m to the south; clearance of the offtake restored visible flow in the channel and would have marginally reduced upstream levels in Ginge Brook prior to Ginge Brook overspilling into adjacent farmland and the bridleway between Milton and Steventon. [IMG,PAG] (p16)</p></div><div class="nugget-popup"><p>Silt build&ndash;up adjacent to the Moor Ditch offtake reduced conveyance at the offtake inlet; after silt clearance Moor Ditch was observed flowing. Moor Ditch interaction with Ginge Brook is linked to current overspill locations on both banks. [PAG] (p17)</p></div><div class="nugget-popup"><p>Elevated water levels in Moor Ditch during winter and the January event caused properties to flood in Milton (High Street and Pembroke Lane). High river levels also prevented discharge of site surface water drainage in Milton Park, resulting in internal flooding at multiple business units. [IMG,PAG,MUL] (p19)</p></div><div class="nugget-popup"><p>High river levels in Moor Ditch prevented the discharge of surface water drainage systems that outfall to the river, causing surface water to back up and leading to internal flooding of business units within the adjoining business park. [PAG] (p20)</p></div><div class="nugget-popup"><p>Severe flooding along the Moor Ditch reached businesses either side of the channel at Harriers Park Industrial Estate; flooding also occurred at multiple locations through Milton where the culverted channel was overwhelmed. [PAG] (p21)</p></div><div class="nugget-popup"><p>The Moor Ditch offtake is the downstream connection point referenced in relation to overspill from Ginge Brook; desilting upstream of this offtake was recommended to reduce flood overspill onto nearby farmland and paths. [TAB] (p27)</p></div><div class="nugget-popup"><p>Described as interacting with Ginge Brook with obstructions and overspill locations that contributed to flooding between Steventon and Milton; recommended for further investigation of flow routes and bank levels. (p30)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>10 private residential properties; 3 business units [TAB] (p2)</p></div><div class="nugget-popup quant"><p>approximately 150m (location of inflow south of offtake); up to 30cm deep (reported flow through an underpass during the flood event) [PAG] (p10)</p></div><div class="nugget-popup quant"><p>100% blocked; 100 mm diameter culvert [PAG,MUL] (p15)</p></div><div class="nugget-popup quant"><p>100% blocked [IMG,PAG] (p16)</p></div><div class="nugget-popup quant"><p>approximate peak flood depth of 0.3 m; approximate flooded area of 3.5 ha affecting businesses [PAG] (p21)</p></div></div></body></div>`)[0];

                var html_f144e49da79bdca362686dd56ba04483 = $(`<div id="html_f144e49da79bdca362686dd56ba04483" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ginge Brook</h1><div class="nugget-popup"><p>Surcharge flows from Ginge Brook entered Moor Ditch over farmland, contributing to hydraulic overload of Moor Ditch and causing flood overspill onto farmland toward Milton and the bridleway to Steventon and contributing to property flooding. [TAB] (p2)</p></div><div class="nugget-popup"><p>Flood flows on the left bank downstream of the A34 are a concern; the report recommends modelling an alternative exceedance flow route for flood flows on the left bank of Ginge Brook and undertaking desilting at a recommended location to reduce flood risk. (p3)</p></div><div class="nugget-popup"><p>The downstream section overtopped its banks, with a greater volume discharging out of the right bank into farmland and towards Moor Ditch and Milton; site inspection in February found flood levels on the bridleway and adjacent fields up to 30 cm. (p9)</p></div><div class="nugget-popup"><p>Overbank flows from Ginge Brook occurred around its crossing under the A34, with lower channel capacity in a ~350 m section causing continuous out&ndash;of&ndash;channel flooding onto the right&ndash;bank farmland and onto the bridleway; water flowed towards Moor Ditch and Milton. [PAG] (p10)</p></div><div class="nugget-popup"><p>Lower channel capacity in a 350m section around the A34 crossing caused Ginge Brook to flood out of its right bank onto adjacent farmland; out&ndash;of&ndash;channel flows were present continuously during winter and at the peak of the January event these flows crossed under the A34 (via a culvert and an underpass), contributing to flooding of farmland and sending flows down towards Steventon and the Bridleway. [IMG,PAG] (p11)</p></div><div class="nugget-popup"><p>Right&ndash;bank out&ndash;of&ndash;channel flow from Ginge Brook overtopped the raised earth bank and ran overland southeast across fields and infrastructure, with flow running back towards Steventon down the bridleway and into ordinary watercourses. A low&ndash;gradient, heavily silted reach of approximately 350m either side of the A34 has reduced channel capacity and contributed to recurring flooding through winter 2023/24, including the January event. [IMG,PAG] (p12)</p></div><div class="nugget-popup"><p>Ginge Brook overspilled during the January/February flooding, discharging onto adjacent farmland and onto the bridleway between Milton and Steventon. (p15)</p></div><div class="nugget-popup"><p>Ginge Brook contributed to overspill flooding on both left and right banks between Steventon and Milton. Downstream of the Moor Ditch offtake the channel runs faster and was observed to be within&ndash;bank in places, while upstream of Drayton Park Golf Course a double&ndash;stepped weir (formerly a mill) and a downstream brick&ndash;arch culvert were present during high flows; the culvert was observed at full capacity on site (raising collapse risk that could exacerbate flooding). [IMG] (p17)</p></div><div class="nugget-popup"><p>Overbanking/elevated flows in Ginge Brook contributed to flooding of adjacent land during the January event and added to elevated flows in the Moor Ditch catchment, driving flooding impacts downstream (including the golf course and Moor Ditch). (p19)</p></div><div class="nugget-popup"><p>Overtopped its right bank between Steventon and Milton around the A34, producing out&ndash;of&ndash;channel flows across farmland and entering Moor Ditch via a culverted watercourse under the A34 and its underpass. These out&ndash;of&ndash;channel flows contributed to hydraulic overload and flooding at multiple locations in Milton and nearby communities. (p21)</p></div><div class="nugget-popup"><p>Overbank flooding/overspill from Ginge Brook onto adjacent farmland towards Milton and onto a bridleway to Steventon; desilting was recommended to reduce this overspill. [TAB] (p27)</p></div><div class="nugget-popup"><p>Interactions with Moor Ditch (obstructions, overspill locations and altered flow routes) contributed to overspill and flooding in the corridor between Steventon and Milton; recommended further investigation of obstructions, overspill locations and bank levels. (p30)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>10 private residential properties [TAB] (p2)</p></div><div class="nugget-popup quant"><p>30 cm flood depth on bridleway (p9)</p></div><div class="nugget-popup quant"><p>350m section (reduced channel capacity area); as deep as 30cm in places on the bridleway during a February site visit [PAG] (p10)</p></div><div class="nugget-popup quant"><p>350m section; two locations where out&ndash;of&ndash;channel flows crossed under the A34 [IMG,PAG] (p11)</p></div><div class="nugget-popup quant"><p>approximate 350m section; around 100m downstream of the A34 [IMG,PAG] (p12)</p></div><div class="nugget-popup quant"><p>6ft weir [IMG] (p17)</p></div><div class="nugget-popup quant"><p>350m section [TAB] (p27)</p></div></div></body></div>`)[0];
                popup_22da05a51dbe9831e9c1ead785adf338.setContent(html_f144e49da79bdca362686dd56ba04483);

                var html_cb373ba9e892538df7219bb3c02788f9 = $(`<div id="html_cb373ba9e892538df7219bb3c02788f9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Milton</h1><div class="nugget-popup"><p>Flooding of ten private residential properties in the village caused by hydraulic overload within the Environment Agency designated main river (Moor Ditch), combined with surcharge from Ginge Brook entering Moor Ditch. [TAB,PAG] (p2)</p></div><div class="nugget-popup"><p>Parts of the village experienced flooding on 4 January 2024. Some properties that flooded were outside Environment Agency Flood Zone 3 (i.e. lie in Flood Zone 1) and for some it was their first recorded flood in over 40 years. [IMG,PAG] (p7)</p></div><div class="nugget-popup"><p>Properties in the village experienced flooding during the 4 January 2024 event; for some properties this was the first flooding in over 40 years and some properties inside the Environment Agency designated Flood Zone 1 recorded flooding for the first time. (p8)</p></div><div class="nugget-popup"><p>Downstream flows from Ginge Brook discharged toward Moor Ditch and Milton; inspections around the A34 and downstream section showed floodwater affecting adjacent fields and bridleway, indicating flooding reached areas affecting Milton. (p9)</p></div><div class="nugget-popup"><p>Flood flows from Ginge Brook and associated flows via Moor Ditch affected areas around Milton; residents reported flooding and a meeting with flooded residents was held. Moor Ditch levels through Milton were observed at the soffits of highway culverts, indicating high river/water levels affecting the settlement. [PAG] (p10)</p></div><div class="nugget-popup"><p>The bridleway between Milton and Steventon and nearby farmland around the A34 were flooded from out&ndash;of&ndash;channel flows from Ginge Brook during the January event, affecting access and adjacent land near Milton. [PAG] (p11)</p></div><div class="nugget-popup"><p>Milton is identified as being affected by overspill/flooding from Ginge Brook and Moor Ditch; the report discusses flood risk consequences to Milton and potential alternative flow routes to reduce flooding on the left bank of Ginge Brook downstream of the A34. (p17)</p></div><div class="nugget-popup"><p>Properties in the village flooded during winter events: specifically properties on High Street and Pembroke Lane were flooded in the January event and some also in the February event. Elevated river levels in Moor Ditch affected local drainage and business units in Milton Park. [MUL] (p19)</p></div><div class="nugget-popup"><p>Backing up of site surface water drainage (because outfall to Moor Ditch could not discharge due to high river levels) led to internal flooding at multiple units within the business park. [PAG] (p20)</p></div><div class="nugget-popup"><p>Hydraulic overload within the Moor Ditch catchment caused flooding at multiple locations on the culverted channel through Milton. Surface water drainage in Milton Park could not discharge to Moor Ditch because of elevated river levels, leading to flooding there. [PAG] (p21)</p></div><div class="nugget-popup"><p>Farmland towards Milton experienced flood overspill originating from Ginge Brook. [TAB] (p27)</p></div><div class="nugget-popup"><p>Flooding in Milton was linked to overspill and constrained flow from nearby main rivers (Ginge Brook and Moor Ditch). The weir at Milton Mill was identified as a feature affecting flows. Highway drainage capacity through Milton was also noted as contributing to runoff and flood risk to properties. [PAG] (p29)</p></div><div class="nugget-popup"><p>Subject to overspill and flooding related to the interface of Ginge Brook and Moor Ditch; recommended actions include modelling, maintenance of main river assets, and creating upstream flood storage/increasing floodplain capacity. (p30)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>10 properties [TAB,PAG] (p2)</p></div><div class="nugget-popup quant"><p>30 cm flood depth on bridleway (p9)</p></div></div></body></div>`)[0];
                popup_8c8bdbb45a919e7c7638ceaddc0d9fe7.setContent(html_cb373ba9e892538df7219bb3c02788f9);

                var html_fe82cb98511cd1478c03ad767a7eb649 = $(`<div id="html_fe82cb98511cd1478c03ad767a7eb649" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Steventon</h1><div class="nugget-popup"><p>Residents in the village were reported as flooded; a meeting with flooded residents and a full river walkover (upstream of Steventon along Ginge Brook) was held on 22 February following the flood event. (p9)</p></div><div class="nugget-popup"><p>Lower channel capacity in a ~350 m section around Ginge Brook's crossing under the A34 caused out&ndash;of&ndash;bank flows from the right bank onto adjacent farmland and onto the bridleway between Milton and Steventon. The bridleway and farmland were inundated, restricting access. [PAG] (p10)</p></div><div class="nugget-popup"><p>Left&ndash;bank flooding from Ginge Brook during the January event contributed to flows down the Bridleway and into ordinary watercourses, which in turn caused flooding to properties in Steventon. [PAG] (p11)</p></div><div class="nugget-popup"><p>Properties in Steventon were flooded when water ran out of Ginge Brook's left bank and flowed back towards the village along the bridleway and into ordinary watercourses. Resident repairs to low spots on the brook bank were insufficient to prevent erosion and continued out&ndash;of&ndash;channel flow. [PAG] (p12)</p></div><div class="nugget-popup"><p>Steventon is identified as being affected by overspill/flood risk from the interaction of Ginge Brook and Moor Ditch, with flood risk consequences reported for the village. (p17)</p></div><div class="nugget-popup"><p>Out&ndash;of&ndash;channel flows from Ginge Brook led to flows across farmland near Steventon and contributed to flooding affecting the community and downstream catchments. (p21)</p></div><div class="nugget-popup"><p>A bridleway to Steventon was subject to flood overspill from Ginge Brook. [TAB] (p27)</p></div><div class="nugget-popup"><p>Experienced overspill and altered flow routes from the interface of Ginge Brook and Moor Ditch leading to flooding in the area; identified as a location for further investigation and potential upstream flood storage/nature&ndash;based solutions. (p30)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>flows up to 30 cm deep [PAG] (p10)</p></div></div></body></div>`)[0];
                popup_7d91d4fe942d6f44b5a71b8cf2d440df.setContent(html_fe82cb98511cd1478c03ad767a7eb649);
