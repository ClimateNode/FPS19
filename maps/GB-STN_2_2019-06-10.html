                var html_b0d37062e6eb01df9feb5a8ba7be08cc = $(`<div id="html_b0d37062e6eb01df9feb5a8ba7be08cc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Borough of Sutton</h1><div class="nugget-popup"><p>Internal flooding of properties within the borough (specifically on Watermead Lane) affecting residents and properties. [PAG] (p9)</p></div><div class="nugget-popup"><p>The borough contained the flood incident on 10 June 2019 and was involved in data collection and historic records used in the investigation relating to Watermead Lane and surrounding areas. [PAG] (p11)</p></div><div class="nugget-popup"><p>A flood alert was issued for the Sutton area on 10 June 2019; heavy and prolonged rainfall and rising river levels caused flooding of roads and farmland and led to internal property flooding (e.g. Watermead Lane). [PAG] (p12)</p></div><div class="nugget-popup"><p>Backflow through sewer pipes contributed to flooding in Sutton when two defective flap valves failed to prevent reverse flow; the River Wandle was also reported as a potential contributing factor. [PAG] (p13)</p></div><div class="nugget-popup"><p>Localized flooding occurred within Sutton at Watermead Lane on 10 June 2019; at least one resident reported being flooded. [PAG] (p15)</p></div><div class="nugget-popup"><p>Areas within the borough (notably Watermead Lane) experienced highway flooding on 10th June 2019 when defective flap valves allowed river water to enter the surface water/combined sewer network and flow onto the highway; this contributed to the June 2019 flood incidents investigated in the report. [PAG] (p25)</p></div><div class="nugget-popup"><p>On 10 June 2019 Watermead Lane in Sutton was flooded after defective flap valves allowed river water to flow through sewer pipes onto the highway, contributing to road and localised surface water flooding. [PAG] (p26)</p></div><div class="nugget-popup"><p>A reported rainfall event produced localized flooding within the borough on 10th June 2019; the event was assessed using data from the Beddington rain gauge and resulted in flooding at a site inside the borough boundary. [PAG] (p29)</p></div><div class="nugget-popup"><p>Post&ndash;event response to surface water flooding on 10th June 2019: liaised with stakeholders (London Borough of Merton, EA, SES Water) to determine cause, sent letters to residents in July 2019 to communicate with those impacted, and carried out gully cleansing after the heavy rainfall event. [PAG] (p34)</p></div><div class="nugget-popup"><p>Recorded as a contributing authority to the Watermead Lane flood incident and is partial owner of Watermead Lane; carried out actions in response to the incident (actions referenced in report). [PAG] (p36)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8 properties [PAG] (p9)</p></div><div class="nugget-popup quant"><p>1 resident [PAG] (p15)</p></div></div></body></div>`)[0];

                var html_b1c268276cef63d4259cf6ed546ec1bc = $(`<div id="html_b1c268276cef63d4259cf6ed546ec1bc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Wandle</h1><div class="nugget-popup"><p>River water levels rose during the heavy rainfall, contributing to the combined fluvial/surface water/sewer flood event and placing adjacent Watermead Lane at risk of fluvial&ndash;influenced flooding; primary surface water flow path outflows into the River Wandle. (p3)</p></div><div class="nugget-popup"><p>River Wandle levels rose following heavy/prolonged rainfall and were implicated in flooding of adjacent roads and farmland and in the internal flooding of properties on Watermead Lane on 10th June 2019. The Environment Agency mobilised staff to check and clear blockages and debris on the river. (p12)</p></div><div class="nugget-popup"><p>Rising River Wandle levels, driven by surface water and overland flow from the defined catchment, contributed to flooding risk adjacent to Watermead Lane; the report identifies the river as a source of fluvial&ndash;influenced flooding and notes two faulty flap valves may have worsened the effect. (p16)</p></div><div class="nugget-popup"><p>Contributed to flooding on 10 June 2019 via outfalls into which two defective flap valves were reported; this likely reduced discharge capacity and significantly increased flood levels along Watermead Lane. (p30)</p></div><div class="nugget-popup"><p>The River Wandle was implicated in the event; incident response staff were checking and clearing blockages on the River Wandle which contributed to flooding at nearby locations. (p32)</p></div><div class="nugget-popup"><p>The June 2019 hydrological review covered the event across the River Wandle catchment, indicating the river/catchment was implicated in the June 10, 2019 flooding event; the report concluded the rainfall was significant and that flooding from watercourses in locations within the catchment was possible. (p33)</p></div><div class="nugget-popup"><p>Fluvial influence from the River Wandle contributed to flooding at Watermead Lane on 10 June 2019; proximity to the river and lack/failure of drainage backflow protection allowed river water to flow into the road and is linked to internal flooding of properties on Watermead Lane. (p37)</p></div></div></body></div>`)[0];

                var html_d82e996e89b5e89c05b2560f82770258 = $(`<div id="html_d82e996e89b5e89c05b2560f82770258" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Watermead Lane, Hackbridge</h1><div class="nugget-popup"><p>Internal flooding of residential properties on Watermead Lane during the June 2019 event; flood risk exacerbated by local topography, poor maintenance of private sewer assets and proximity to the River Wandle, with surface water flowing toward the river. [PAG] (p3)</p></div><div class="nugget-popup"><p>Properties on Watermead Lane are identified as at&ndash;risk and are targeted for property&ndash;level protection; consideration of flood defence schemes along the lane and retrofit SuDS to increase resilience; review of local sewer network capacity and ownership to address sewer&ndash;related flood risk. [PAG] (p4)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties on Watermead Lane resulting in properties being flooded internally. [PAG] (p9)</p></div><div class="nugget-popup"><p>Reported flooding at Watermead Lane prompted the London Borough of Sutton to open a Section 19 flood investigation into the incident; the site is located adjacent to the River Wandle. [IMG,PAG] (p10)</p></div><div class="nugget-popup"><p>Overland surface water flows reached Watermead Lane during the 10 June 2019 event, causing surface water flooding on the street; the location was the subject of the Section 19 flood investigation to establish overland flow routes and flood mechanisms. [PAG] (p11)</p></div><div class="nugget-popup"><p>Internal flooding of properties on 10 June 2019; residents reported that floodwater entered properties, and two defective flap valves on outfalls to the River Wandle were reported as a potential contributing factor allowing backflow. (p12)</p></div><div class="nugget-popup"><p>A local resident reported experiencing flooding on Watermead Lane. The report is anecdotal and the document also shows a broken flap valve (which, when not working, can allow sewer backflow), so the flooding appears to be sewer backflow affecting Watermead Lane. [PAG,IMG] (p14)</p></div><div class="nugget-popup"><p>A local resident experienced flooding on Watermead Lane. The resident reported that removal of trees and bushes from the River Wandle riverbank may have increased runoff into the river and contributed to the flooding; surface water from Middleton Road also flowed toward Watermead Lane (reported as having a minimal impact). [PAG] (p15)</p></div><div class="nugget-popup"><p>Surface water runoff and rising River Wandle levels placed Watermead Lane at risk of flooding and could lead to ponding across the lane; the report notes the actual impact of the runoff on Watermead Lane was likely to be minimal. [PAG] (p16)</p></div><div class="nugget-popup"><p>River water is believed to have flowed through defective sewer valves into the private surface water sewer and discharged onto the highway, causing flooding of the carriageway on Watermead Lane and contributing to the June 2019 flood incident. (p24)</p></div><div class="nugget-popup"><p>Reported flooding occurred at the site associated with Watermead Lane as a result of the intense rainfall on 10th June 2019 (inferred from the gauge location ~2 km east and the text stating the rainfall produced flooding at the site). [PAG,IMG] (p29)</p></div><div class="nugget-popup"><p>Experienced an extreme level of flooding on 10th June 2019; the street was inundated as a result of the event, with flooding severity described as significant in the investigation. [PAG] (p30)</p></div><div class="nugget-popup"><p>Flooding at the site during the 10th June 2019 event was caused by fluvial (river) sources. [PAG] (p32)</p></div><div class="nugget-popup"><p>Residents at Watermead Lane were affected by flooding; the EA visited in the two days after the incident to speak to affected residents and investigate the source. Residents reported that drainage assets were not maintained properly, implicating drainage failure in the flooding. (p33)</p></div><div class="nugget-popup"><p>Affected by flooding associated with the heavy rainfall event on 10th June 2019; investigation identified that the flood risk sources at Watermead Lane were not from TWUL foul sewer sources. (p34)</p></div><div class="nugget-popup"><p>Flooding on Watermead Lane was associated with failure/defects in the private surface water sewer network (defective/broken flap valves at the outfall). SES Water replaced the broken flap valves after the event and is investigating outfall alignment. [PAG] (p35)</p></div><div class="nugget-popup"><p>Internal flooding affected properties on Watermead Lane during the rainfall event; firefighters attended with sandbags to assist residents and mitigate internal flooding; two elderly residents were aided and taken to a safe place. [PAG] (p36)</p></div><div class="nugget-popup"><p>Multiple properties on Watermead Lane experienced internal flooding on the event date. Flooding was driven by a combination of fluvial (River Wandle), surface water overland flow and sewer&ndash;influence; the site is topographically low, adjacent to the River Wandle and within Flood Zone 2/3. Local drainage issues (lack of operational back&ndash;flow protection and damaged flap return valves), nearby land alterations and increased urbanisation exacerbated flooding to the road and properties. (p37)</p></div><div class="nugget-popup"><p>Surface&ndash;water and sewer&ndash;related flooding affected Watermead Lane on 10 June 2019. Drainage assets were found to be defective; two flap valves were identified as defective and subsequently replaced. Properties on the street were identified as at&ndash;risk and recommended for property&ndash;level protection and other resilience measures. (p38)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8 properties [PAG] (p3)</p></div><div class="nugget-popup quant"><p>8 properties [PAG] (p9)</p></div><div class="nugget-popup quant"><p>8 properties; two elderly residents; between two to six inches of internal flooding [PAG] (p36)</p></div></div></body></div>`)[0];
