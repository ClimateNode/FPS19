                var html_844ee6991af68d93f48cfa9ebbbc07bc = $(`<div id="html_844ee6991af68d93f48cfa9ebbbc07bc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Denford</h1><div class="nugget-popup"><p>Intense rainfall falling on a saturated catchment caused excess surface water to flow overland following natural contours, resulting in internal flooding of property/properties in Denford (areas in and around Duck End, Chapel Lane and Freeman's Lane were affected). [PAG,MUL] (p5)</p></div><div class="nugget-popup"><p>Intense rainfall onto a saturated catchment caused excess surface water to flow over ground following natural contours into areas in and around Duck End (Denford). Internal flooding of at least one property at Duck End was reported; this property had experienced internal flooding four times in one year. [PAG] (p6)</p></div><div class="nugget-popup"><p>Significant rainfall on the Denford catchment on 21 November 2012 produced high volumes of surface water that flowed into parts of the village and resulted in internal flooding at Duck End (within Denford). (p8)</p></div><div class="nugget-popup"><p>Flooding across the village: rear gardens of properties and the highway (High Street) were affected; ponding occurred in Duck End and Chapel Lane; rear gardens of properties on Freeman's Lane were affected; agricultural fields south of Spinney Rise were submerged; foul water from the public sewer was present in flood water at Duck End. (p11)</p></div><div class="nugget-popup"><p>Flooding occurred in Denford; NCC can suggest possible causes and make recommendations to mitigate flood risk but lacks the mandate or funding under the FandWMA to tackle all identified causes. [PAG] (p12)</p></div><div class="nugget-popup"><p>Intense, short&ndash;duration rainfall on a saturated catchment overwhelmed existing drainage systems and watercourses in Denford, causing water to pond, flow into areas and drainage systems unable to manage the additional water, and resulting in localised flooding across the village. (p14)</p></div><div class="nugget-popup"><p>Intense rainfall onto a saturated catchment and insufficient drainage/ordinary watercourse capacity led to overtopping of the ordinary watercourse east of the village. Overtopping produced a high&ndash;velocity flow into Denford that spanned the full highway width; existing drainage systems and watercourses were unable to cope, causing ponding and flood flows into other areas. (p15)</p></div><div class="nugget-popup"><p>Overspill of land drainage led to flooding of neighbouring properties, the public highway and the public sewerage system; flows from high ground contributed to properties being affected. (p16)</p></div><div class="nugget-popup"><p>Properties adjacent to the River Nene in Denford are affected by flood risk from the main river; the report recommends the Environment Agency consider flood defence works at the River Nene to reduce the likelihood of flooding and recommends documents to residents affected by surface water runoff from neighbouring land and emergence of groundwater. (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>internal flooding of at least one property; internal flooding experienced four times in one year [PAG,MUL] (p5)</p></div><div class="nugget-popup quant"><p>at least one property; four times in one year [PAG] (p6)</p></div><div class="nugget-popup quant"><p>1 property; 2 properties (p8)</p></div></div></body></div>`)[0];
