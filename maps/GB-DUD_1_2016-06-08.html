tercourse incidents and internal property flooding. [PAG] (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than 300 requests for support; in the order of 75 internal flooding incidents of residential properties [IMG] (p1)</p></div><div class="nugget-popup quant"><p>more than 300 requests for support; 75 internal residential properties flooded [PAG] (p16)</p></div></div></body></div>`)[0];
