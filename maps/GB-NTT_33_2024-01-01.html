                var html_64121a85d41b66b1c5ebf1e4821793cd = $(`<div id="html_64121a85d41b66b1c5ebf1e4821793cd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Trent</h1><div class="nugget-popup"><p>The River Trent forms the southern boundary of Gunthorpe and was implicated in the January 2024 flood event affecting the village. [PAG] (p1)</p></div><div class="nugget-popup"><p>Surcharging of the River Trent during the event causes backwater effects that prevent tributaries from draining, contributing to tributary and surface&ndash;water flooding in nearby settlements (including Gunthorpe). [IMG,PAG] (p2)</p></div><div class="nugget-popup"><p>The River Trent surcharged and flooded out of bank (during Storm Henk), preventing its tributaries from discharging and directly causing the village to be cut off; one property reported internal flooding from the river. (p3)</p></div><div class="nugget-popup"><p>Experienced predicted extreme levels that created a continued risk of river flooding, prompting coordinated in&ndash;person visits to high&ndash;risk communities and influencing preparedness and evacuation actions. (p6)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property (p3)</p></div></div></body></div>`)[0];

                var html_b5ec2b72a95e53a007fafccef308e909 = $(`<div id="html_b5ec2b72a95e53a007fafccef308e909" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Gunthorpe</h1><div class="nugget-popup"><p>The village was affected by flooding during Storm Henk (January 2024). The River Trent forms the southern boundary of Gunthorpe and tributaries including the Cocker Beck run through the village; the flooding in the village prompted a Section 19 investigation into which RMAs had relevant functions and responses. [PAG] (p1)</p></div><div class="nugget-popup"><p>When the River Trent surges it prevents tributaries from discharging, causing those tributaries to surcharge and other surface&ndash;water drainage assets in the village to be unable to function effectively; Gunthorpe is described as having a significant history of flooding and is at high flood risk during the event. [IMG,PAG] (p2)</p></div><div class="nugget-popup"><p>Village was cut off when the River Trent flooded out of bank; Trent surcharge prevented tributaries discharging so other surface water assets in the village could not function. One property experienced internal flooding from the river; ten properties experienced internal flooding attributed to rising groundwater (residents reported water coming up through floors). Affected areas lie within Flood Zone 3. [IMG] (p3)</p></div><div class="nugget-popup"><p>Community experienced flooding leading to public meetings and a community drop&ndash;in; residents were helped to evacuate homes, aqua sacs were delivered, emergency accommodation provided where necessary; cleanup actions (roads/paths and bulky waste removal) and visits to vulnerable individuals were carried out as part of the response. [PAG] (p6)</p></div><div class="nugget-popup"><p>Residents experienced sewer&ndash;related issues and local flooding associated with the event; community required support leading to a drop&ndash;in session and direct contact from authorities. [PAG] (p7)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property; 10 properties [IMG] (p3)</p></div></div></body></div>`)[0];
