 incident (part of 4 incidents in Horsmonden) (p11)</p></div></div></body></div>`)[0];

                var html_aa3444a77ffc43df4700fe229757ca59 = $(`<div id="html_aa3444a77ffc43df4700fe229757ca59" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Horsmonden</h1><div class="nugget-popup"><p>Multiple streets within Horsmonden reported internal and external property flooding and carriageway flooding during the event (see listed roads in Table 1). (p2)</p></div><div class="nugget-popup"><p>Properties in the village experienced internal and external flooding and local carriageway flooding; KFRS pumped floodwater from four properties and made one property safe. (p3)</p></div><div class="nugget-popup"><p>Areas of Horsmonden are indicated to be at high risk of surface&ndash;water flooding, mainly associated with the unnamed tributaries of the River Teise. Local loamy/clayey soils with impeded drainage promote overland runoff, causing accumulation in depressions that is consistent with the locations of reported properties affected during the flood event. (p4)</p></div><div class="nugget-popup"><p>The village and surrounding areas have flooded on a number of historic occasions associated with the River Teise, ordinary watercourses, surface water runoff and blocked drains. [IMG,TAB] (p5)</p></div><div class="nugget-popup"><p>Affected properties in Horsmonden were associated with the flood event on 25 July 2021; rainfall recorded at the nearby Horsmonden gauge and radar across the local catchment were used in the analysis of the event. (p8)</p></div><div class="nugget-popup"><p>A flood event in the village affected properties (recorded flooded properties are referenced). The radar&ndash;derived rainfall distribution and catchment analysis were used specifically because the radar grid squares covered the recorded flooded properties in Horsmonden; the most intense hourly rainfall occurred between 11:00&ndash;12:00 during the event. (p9)</p></div><div class="nugget-popup"><p>Residents reported flooding between 13:00 and 14:00 when intense rainfall and surface runoff overwhelmed drainage and sewer systems, causing carriageway flooding and flooding of properties within Horsmonden. [IMG] (p10)</p></div><div class="nugget-popup"><p>On 25 July 2021 Horsmonden experienced multiple flooding incidents where watercourse blockages and culvert overtopping affected residential streets (Brenchley Road, Furnace Lane, Marle Place Road and Olivers Court). (p11)</p></div><div class="nugget-popup"><p>The report states it is possible that the Hormonden area was impacted by a more intensive, localised rainfall event (on 25 July 2021) that was not accurately recorded by gauges/radar and which may have contributed to the level of flooding experienced. (p12)</p></div><div class="nugget-popup"><p>Flooding occurred at multiple locations within the village (red&ndash;dotted points), concentrated along main roads and at entry/junction points, creating vulnerability to transport access and local movement. [IMG] (p13)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 properties flooded internally (Furnace Lane); 2 properties flooded externally (Furnace Lane); 2 properties internal (Spout Lane); 1 property internal (Olivers Court); KFRS pumped floodwater from 10 properties (Olivers Court) and from 4 properties (Furnace Lane); 1 property internal (Marle Place Road); carriageway flooding reported at Lamberhurst Road, Lamberts Place and Oast View; depths reported: 30 cm &ndash; 100 cm (Furnace Lane); up to 25 cm (Spout Lane); 8 &ndash; 10 cm (Marle Place Road) (p2)</p></div><div class="nugget-popup quant"><p>1 property (Brenchley Road internal); 4 properties (pumped by KFRS); 1 property (Green Road internal); 1 property (Fromandez Drive external); 1 property (Orchard Close internal); 1 property (Kirkins Close flooding, internal unknown); 1 property (Back Lane flooding, internal unknown) (p3)</p></div><div class="nugget-popup quant"><p>4 flooding incidents (p11)</p></div><div class="nugget-popup quant"><p>20 properties flooded internally; 4 properties flooded externally (p12)</p></div></div></body></div>`)[0];
