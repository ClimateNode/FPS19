                var html_f40207151d3feb5051c2754614d182c0 = $(`<div id="html_f40207151d3feb5051c2754614d182c0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Whittle Burn</h1><div class="nugget-popup"><p>Localised flooding issues around the Whittle Burn prompted RMAs to investigate the watercourse and to propose provision of a localised flood warning system; actions also included investigating whether live reservoir (Whittle Dene Reservoir) levels could be provided to residents. [TAB] (p2)</p></div></div></body></div>`)[0];

                var html_2b007cd1d156c4277afc96c118d2d845 = $(`<div id="html_2b007cd1d156c4277afc96c118d2d845" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Tyne</h1><div class="nugget-popup"><p>The River Tyne swelled and overtopped its banks/defences during Storm Desmond, causing flooding in areas adjacent to the river (concentrated around Ovingham Bridge and the central part of the village). Flooding and river action contributed to heavy damage to Ovingham Bridge which required closure and repairs. (p1)</p></div><div class="nugget-popup"><p>The interaction between the River Tyne and the Whittle Burn was identified for further investigation; the EA will update the Tyne model to include recommendations on investigating this interaction and its implications for flooding. [TAB] (p2)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>12 dwellings; 4 businesses; Ovingham Bridge heavy damage requiring closure (p1)</p></div></div></body></div>`)[0];

                var html_d6b6cc2c3df104c4866d9e00f5747b5d = $(`<div id="html_d6b6cc2c3df104c4866d9e00f5747b5d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ovingham Bridge</h1><div class="nugget-popup"><p>The bridge sustained heavy damage during the winter 2015&ndash;16 flood events and was closed; repairs (debris removal, scaffolding and foundation repairs) and studies of the river bed and foundations were carried out. [IMG,MUL] (p1)</p></div><div class="nugget-popup"><p>Bridge was damaged by flood&ndash;related debris and high flows; debris removed, temporary scaffolding and foundations repaired, fallen/unstable trees removed upstream. A study assessed damage to the river bed and bridge foundations and hydraulic&ndash;modelling scenario runs were completed for the bridge and temporary scaffolding. [TAB] (p2)</p></div><div class="nugget-popup"><p>Extensive physical damage to the bridge: supports and railings visibly damaged, with large piles of debris (branches, wood, metal fencing) lodged against the structure, indicating strong flood flows and likely structural compromise requiring repair and cleanup. [IMG] (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 bridge [IMG,MUL] (p1)</p></div></div></body></div>`)[0];
