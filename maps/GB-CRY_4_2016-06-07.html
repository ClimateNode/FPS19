                var html_75710afedacad2daa0ac5906e35f7bdf = $(`<div id="html_75710afedacad2daa0ac5906e35f7bdf" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Coulsdon Common</h1><div class="nugget-popup"><p>Surface water flow pathways from Coulsdon Common fed into the main flowpath to Caterham Drive and contributed to the surface water flooding seen on 7th June 2016. (p12)</p></div><div class="nugget-popup"><p>Identified on the RoFSW map as part of a major flow pathway on 7 June 2016 conveying surface water northwards toward Caterham Drive; acted as a route for runoff contributing to flooding at Caterham Drive. (p15)</p></div><div class="nugget-popup"><p>The main storm drain from Coulsdon Common terminates in a soakaway on the Common; that soakaway has been observed to surcharge during heavy rainfall, lifting a manhole cover and allowing water to flow down the grass verge onto Stites Hill Road and via a drainage ditch through Rydon's wood onto Caterham Drive. The constraint and surcharging at this soakaway may have contributed to the severity of downstream flooding on Caterham Drive. (p16)</p></div><div class="nugget-popup"><p>A soakaway at Coulsdon Common is identified as being prone to surcharge; the report recommends this be investigated further as part of addressing local surface water drainage problems that contributed to flooding. [TAB] (p20)</p></div><div class="nugget-popup"><p>During the 7 June 2016 event surface water runoff overwhelmed or threatened the capacity of the existing surface water sewer and drainage infrastructure at Coulsdon Common (adjacent to the Tandridge/Croydon boundary). This led to concern about drainage capacity and prompted recommendation to assess sewer capacity and consider upstream SuDS/land interventions to reduce overland flow. [TAB] (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 soakaway surcharged (Soakaway A); 1 manhole cover lifted (p16)</p></div></div></body></div>`)[0];

                var html_e85d558404d04619067e90edad3c3840 = $(`<div id="html_e85d558404d04619067e90edad3c3840" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Croydon</h1><div class="nugget-popup"><p>The London Borough of Croydon was particularly affected on 7 June 2016 by localised deep, fast&ndash;flowing water which submerged/floated vehicles and entered properties at several locations. (p5)</p></div><div class="nugget-popup"><p>Multiple surface water and groundwater flood events impacted areas within the borough: Purley town centre suffered significant property flooding and disruption to the local transport network during the intense flash floods of 20 July 2007; Kenley and Purley experienced extensive groundwater&ndash;related flooding in winter 2013&ndash;14; intense rainfall in 2015 caused deep surface water flooding in areas of Purley; properties in the Caterham Drive area flooded on 7 June 2016, located in a topographic low where surface water flow paths accumulate. [MUL] (p9)</p></div><div class="nugget-popup"><p>Croydon borough experienced flooding on 7 June 2016: residents reported flooding to the council, prompting follow&ndash;up and advice on property&ndash;level protection. The event exposed issues with surface water drainage capacity and unrecorded sewer connections (including a sewer between Stites Hill Road and Caterham Drive), and led to actions to investigate mis&ndash;connections and internal sewer flooding risks. [TAB,PAG] (p22)</p></div></div></body></div>`)[0];

                var html_7d2742c9a0ac2b3e9a090c5980eb7161 = $(`<div id="html_7d2742c9a0ac2b3e9a090c5980eb7161" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Caterham Drive, Croydon</h1><div class="nugget-popup"><p>Properties located in the topographic low along Caterham Drive flooded when surface water runoff accumulated and formed prominent flow paths; local residents provided photographic evidence of flooding in 2007 and 2015. [PAG,MUL] (p9)</p></div><div class="nugget-popup"><p>Surface water runoff accumulates in a topographic low along Caterham Drive, forming prominent flow paths that led to properties being flooded. The local topography directs runoff along the road from southeast to northwest, causing inundation of properties located in the low point. [PAG,IMG,MUL] (p10)</p></div><div class="nugget-popup"><p>Surface water / urban runoff flowed from the vicinity of Caterham&ndash;on&ndash;the&ndash;Hill onto Caterham Drive during the 7 June 2016 event. Properties adjacent to the flow path reported flooding on 7 June 2016 and are located within areas the Environment Agency maps as 'high' risk (annual probability &gt;3.3%). Numerous soakaways along Caterham Drive were identified and several local soakaways were inspected (site visit 05/08/2016; condition assessments by Flowline in Appendix B); soakaway condition (siltation/blocking) affects the ability to drain runoff and is relevant to the flooding experienced on Caterham Drive. [IMG,PAG] (p11)</p></div><div class="nugget-popup"><p>Properties on and adjacent to Caterham Drive reported flooding during the 7th June 2016 event caused by overland surface water flow routed from higher ground and by surcharging foul sewers following heavy rainfall; these properties lie adjacent to RoFSW 'high' risk flow paths. [PAG] (p12)</p></div><div class="nugget-popup"><p>Surface water runoff (likely originating from Rydon's Lane) propagated north down the road, producing fast&ndash;flowing floodwater along Caterham Drive and causing property flooding at both the northern and southern ends of the road. Properties experienced complete ground&ndash;floor and garden inundation, partial ground&ndash;floor flooding/damp creep, and internal flooding; at least one resident had to move out while a house dried. [TAB,PAG] (p13)</p></div><div class="nugget-popup"><p>Caterham Drive experienced flooding from surface water and from sewers during the event on 7 June 2016. The report identifies surface water and sewer sources as the reported causes of flooding at this location. [TAB,PAG] (p14)</p></div><div class="nugget-popup"><p>On 7 June 2016 the surface water drainage and soakaway network failed to drain the intense rainfall, causing rapid onset of surface water flooding across roads and into surrounding properties. Properties A and B experienced the deepest flooding (water reached thresholds and inundated the ground floor). Residents observed the foul sewer surcharging with lifted manhole covers, indicating surface water entry to the combined sewer. A CCTV survey found blocked gullies (9 and 10) opposite the severely flooded properties. (p15)</p></div><div class="nugget-popup"><p>Surface water/overland flow from intense rainfall overwhelmed drainage on Caterham Drive. Gullies were found blocked (gullies 9 and 10) and some gullies had suspected collapsed outlet pipes (gullies 4 and 10), reducing drainage capacity. Two properties (A and B) experienced severe internal flooding. A manhole on the carriageway was surcharging and there was physical damage to the carriageway around the manhole cover; video shows runoff from Rydon's Lane onto Caterham Drive. The drainage network was later inspected/cleaned after the event. [PAG] (p16)</p></div><div class="nugget-popup"><p>Surface water runoff from Rydon's Lane flowed onto Caterham Drive during the 7 June 2016 event, causing damage to the carriageway around a manhole cover and depositing flood debris on a recently tarmacked pathway leading onto Caterham Drive. [IMG] (p17)</p></div><div class="nugget-popup"><p>Road and adjacent properties flooded; surface water entered and hydraulically overloaded the foul sewer causing sewer surcharge and foul sewage to enter properties; standing water and debris on the carriageway; sandbags were delivered to affected residents; remedial works undertaken including gully cleaning, CCTV surveys and repair of identified defects. (p18)</p></div><div class="nugget-popup"><p>Surface water overwhelmed the drainage and entered the foul sewer, hydraulically overloading the sewer network and causing flooding into properties on Caterham Drive. Flood depths exceeded 900mm in places. Residents at the northern end (properties A&ndash;D) used personal property protection; at the southern end properties E&ndash;F were affected and attended by the fire service. A builder removed an earth bund on 7 June which subsequently allowed surface water to flow off the road into woodland in the following days. [TAB,PAG] (p19)</p></div><div class="nugget-popup"><p>On 7th June 2016 Caterham Drive experienced flooding that prompted resident complaints. Lanes for Drains were deployed to pump, suck and sweep floodwater and debris. Subsequent CCTV inspections of drains identified blockages and collapsed pipes that may have been caused by the flooding. The sewer network surcharged during the extreme event as surface water entered the system. [TAB,PAG] (p20)</p></div><div class="nugget-popup"><p>Flooding occurred on Caterham Drive during the event on 7th June 2016; residents reported incidents and provided photographic and video evidence of flooding, and blockages were noted as contributing factors to the flooding. (p21)</p></div><div class="nugget-popup"><p>The report describes overland surface water flooding affecting the northern end of Caterham Drive during the 7 June 2016 event. It recommends enhancing nearby land (Dollypers Hill) and installing a brow ditch or interceptor drain to intercept runoff from steep slopes and reduce the volume of overland flooding reaching Caterham Drive. [TAB,PAG] (p22)</p></div><div class="nugget-popup"><p>Experienced overland / surface&ndash;water flooding on 7th June 2016 when runoff from adjacent steep slopes reached the road; the report identifies this as the Caterham Drive flood event and proposes mitigation (brow ditch/interceptor drain, SuDS upslope) to reduce overland flows into the street. [PAG] (p23)</p></div><div class="nugget-popup"><p>Caterham Drive was the subject of a flood investigation and a Flowline CCTV survey following flood impacts in June 2016; the report headings indicate the road experienced flooding during the June 2016 event. (p26)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>6 properties; up to 1m in some areas; two foot of fast&ndash;flowing water reported along the road [TAB,PAG] (p13)</p></div><div class="nugget-popup quant"><p>2 properties (A and B) inundated; water depth approx 900 mm (p15)</p></div><div class="nugget-popup quant"><p>2 properties flooded (A and B); 2 gullies blocked (9 and 10); 2 gullies with suspected collapsed outlet pipes (4 and 10); 1 surcharging manhole; damage to carriageway around 1 manhole [PAG] (p16)</p></div><div class="nugget-popup quant"><p>flooding in excess of 900mm deep; two collapsed gullies (p18)</p></div><div class="nugget-popup quant"><p>flooding in excess of 900mm deep; 4 properties (A&ndash;D); 2 properties (E&ndash;F) [TAB,PAG] (p19)</p></div></div></body></div>`)[0];

                var html_0acbe3929eacf693f8568945302b72e7 = $(`<div id="html_0acbe3929eacf693f8568945302b72e7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Rydon's Lane, Croydon</h1><div class="nugget-popup"><p>Surface water runoff originating from Rydon's Lane during the intense storm flowed downhill and is reported to have influenced flooding of properties to the south of Caterham Drive. (p13)</p></div><div class="nugget-popup"><p>Surface water runoff flowed from Rydon's Lane onto Caterham Drive during the intense rainfall, forming part of the major flow path and contributing to rapid surface water flooding on 7 June 2016. (p15)</p></div><div class="nugget-popup"><p>Surface water runoff was conveyed through Rydon's wood (and along Rydon's Lane) onto Caterham Drive; video footage shows runoff from Rydon's Lane contributing to flooding downstream. [PAG] (p16)</p></div><div class="nugget-popup"><p>Surface water runoff originated on Rydon's Lane and flowed onto Caterham Drive during the 7 June 2016 event; this runoff is recorded on video. (p17)</p></div><div class="nugget-popup"><p>Flash flooding on 7th June 2016 prompted residents to contact emergency services; calls were received from residents on Caterham Drive and the adjoining Rydon's Lane and the London Fire Brigade were alerted and took action to mitigate floodwater impacts. (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>three calls (from Caterham Drive and adjoining Rydon's Lane) (p19)</p></div></div></body></div>`)[0];

                var html_4d30bf5a6096e92fd4b80e284469003c = $(`<div id="html_4d30bf5a6096e92fd4b80e284469003c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Stites Hill Road, Croydon</h1><div class="nugget-popup"><p>Surface water runoff from Stites Hill Road flowed onto Caterham Drive, forming a major flow path that contributed to rapid surface water flooding during the intense rainfall on 7 June 2016. (p15)</p></div><div class="nugget-popup"><p>Water from a surcharging soakaway on Coulsdon Common lifted a manhole cover and flowed down the grass verge onto Stites Hill Road, flooding the carriageway. (p16)</p></div><div class="nugget-popup"><p>Surface water flowed onto Stites Hill Road (adjacent to the park) during the 7 June 2016 event. (p17)</p></div><div class="nugget-popup"><p>Evidence of surface water flowing onto Stites Hill Road adjacent to City of London Park was recorded. A previously unrecorded sewer was identified connecting Stites Hill Road (in Tandridge) to Caterham Drive, which may have carried significant extra flow to Caterham Drive during the event. [PAG] (p18)</p></div><div class="nugget-popup"><p>Soakaways along Stites Hill Road have previously surcharged; the report identifies two soakaways that have surcharged and recommends further investigation as part of addressing the surface&ndash;water drainage failures linked to the event. [TAB] (p20)</p></div><div class="nugget-popup"><p>An unrecorded sewer connection between Stites Hill Road and Caterham Drive is specifically highlighted for further exploration as part of the flood investigation, indicating sewer infrastructure linked to flooding at the time of the event. RMAs were advised to detect unknown pipelines/infrastructure that may have contributed to flooding. [TAB] (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 soakaways [TAB] (p20)</p></div></div></body></div>`)[0];

                var html_d941b4fa9f165356e99f5fbdda51279a = $(`<div id="html_d941b4fa9f165356e99f5fbdda51279a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Caterham</h1><div class="nugget-popup"><p>A surface water flow path is described as originating in the vicinity of Caterham&ndash;on&ndash;the&ndash;Hill and routed northwest onto Caterham Drive, contributing overland runoff that led to surface water flooding downslope during the 7th June 2016 event. [PAG] (p12)</p></div><div class="nugget-popup"><p>Intense local storm on 7 June 2016 caused surface water runoff and overland flow from steep slopes and Rydon's Lane, plus surcharging foul sewers, which propagated down Caterham Drive. Six properties (labelled A&ndash;F) were flooded: complete ground floor and garden flooding at properties A and B (up to 1 m in places), complete garden flooding and partial ground&ndash;floor flooding/damp at properties C and D, and internal flooding at properties E and F (one resident had to move out while the house dried). Bus drivers reported fast&ndash;flowing water (about two foot) along Caterham Drive and traffic diversions were put in place. Over 80 calls relating to flooding in the area were received by Thames Water Utilities on 7&ndash;8 June. [TAB,PAG] (p13)</p></div><div class="nugget-popup"><p>Surface water runoff overloaded the sewer network in Caterham on the Hill, causing hydraulic overload, sewer surcharge and flooding with reports of foul sewage entering properties. (p18)</p></div><div class="nugget-popup"><p>The Caterham area was affected by overland surface water and sewer&ndash;related flooding (event of 7th June 2016). Specific local impacts included flooding on/near Caterham Drive and Stites Hill Road, identification of an unrecorded sewer connection between Stites Hill Road and Caterham Drive, and community&ndash;level response including formation of the Caterham and Old Coulsdon Flood Action Group. Mitigation options were proposed for land at the northern end of Caterham Drive (Dollypers Hill) to reduce overland runoff to the area. [TAB,PAG] (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Over 80 calls; 6 properties (A&ndash;F) flooded (4 properties in the north, 2 in the south); up to 1 m flood depth in some areas; ~2 foot of fast&ndash;flowing water reported by bus drivers. [TAB,PAG] (p13)</p></div><div class="nugget-popup quant"><p>flooding in excess of 900mm deep (p18)</p></div></div></body></div>`)[0];
