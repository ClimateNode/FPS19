                var html_35206f81ecab711ba6edd3a9e7c8f494 = $(`<div id="html_35206f81ecab711ba6edd3a9e7c8f494" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Stourton</h1><div class="nugget-popup"><p>Identified as one of the district sub&ndash;areas affected by the main river fluvial flood event of 25&ndash;29 Dec 2015. (p16)</p></div><div class="nugget-popup"><p>Flooding affected commercial properties and surroundings with recorded internal and external commercial flooding incidents in Stourton. [TAB] (p29)</p></div><div class="nugget-popup"><p>Localised flooding occurred in low&ndash;lying areas due to record high River Aire levels. Surface water drainage systems discharging to the river, including the syphon beneath the canal and the nearby pumping station, were rendered inoperable until river levels subsided. [PAG] (p73)</p></div><div class="nugget-popup"><p>Low&ndash;lying areas under the influence of the River Aire experienced localised flooding; surface water drainage systems draining to the river (including the syphon and pumping station) were rendered inoperable until river levels dropped and gravity discharge resumed. [IMG] (p74)</p></div><div class="nugget-popup"><p>Extensive fluvial flooding (from the River Aire) within Flood Zone 3 caused property flooding in Stourton: commercial premises flooded internally and externally; high&ndash;rise and multi&ndash;occupancy accommodation were noted as affected where present. [TAB,PAG] (p75)</p></div><div class="nugget-popup"><p>Internal and external property flooding concentrated within Flood Zone 3 close to the River Aire; flood flow routes mapped through the area and incidents clustered in central Stourton affecting industrial and commercial zones. [IMG,PAG] (p76)</p></div><div class="nugget-popup"><p>Industrial estate and multiple buildings were inundated by floodwaters routed from the River Aire and the adjacent canal (canal surcharge/overflow). Flood flow routes and wrack lines are mapped across the estate; water reached entrances and partially submerged modular structures and yards, disrupting operations. [IMG] (p77)</p></div><div class="nugget-popup"><p>Fluvial flooding across Stourton resulting from the River Aire and the surcharged Aire & Calder Navigation Canal. Floodwaters flowed into low&ndash;lying areas and properties in Stourton, following the canal overtopping and breach at Knostrop. (p79)</p></div><div class="nugget-popup"><p>Stourton was included in a severe flood warning and was affected by river overtopping and surcharging of surface water drainage during the flood event. [PAG] (p81)</p></div><div class="nugget-popup"><p>Fluvial (main river) identified as the source of flooding affecting Stourton during the 25 Dec 2015&ndash;29 Dec 2015 event. [TAB] (p82)</p></div><div class="nugget-popup"><p>Location of the Knostrop by&ndash;wash embankment collapse (at Knostrop Lock); the failure led to surcharging of the Aire & Calder Navigation and contributed to overtopping and local inundation. (p86)</p></div><div class="nugget-popup"><p>Flooding affected businesses along parts of the River Aire in Stourton, causing visual amenity damage and contributing to reduced trade and inward investment for those businesses. (p292)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>0 internal residential flooding; 0 external residential flooding; 36 internal commercial flooding; 4 external commercial flooding; total 40 incidents [TAB] (p29)</p></div><div class="nugget-popup quant"><p>36 internal commercial properties; 4 external commercial properties; 40 properties total [TAB,PAG] (p75)</p></div><div class="nugget-popup quant"><p>Incidents per 250m grid squares include categories up to 206&ndash;592 properties in the largest grid square; other grid&ndash;square ranges shown: 1&ndash;12, 18&ndash;46, 47&ndash;121, 122&ndash;205 [IMG,PAG] (p76)</p></div><div class="nugget-popup quant"><p>wrack line/recorded flood levels on buildings 21.617 m, 21.630 m, 21.635 m, 21.644 m, 21.667 m [IMG] (p77)</p></div><div class="nugget-popup quant"><p>1 structural embankment collapse (p86)</p></div></div></body></div>`)[0];
                popup_d2b786f4e9f164964456d7c046c52833.setContent(html_35206f81ecab711ba6edd3a9e7c8f494);

                var html_8d9c91407fcf04bd686404236a7c5574 = $(`<div id="html_8d9c91407fcf04bd686404236a7c5574" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Otley</h1><div class="nugget-popup"><p>Otley is identified as a Wharfe&ndash;focused sub&ndash;area; it was affected by fluvial flooding associated with the River Wharfe during the 25&ndash;29 Dec 2015 event. [IMG,PAG] (p17)</p></div><div class="nugget-popup"><p>The River Wharfe flooded Otley during the Nov/Dec 2015 events; photographs document streets and town centre inundation, with the Billams Hill / Farnley Lane area shown extensively flooded. [IMG] (p20)</p></div><div class="nugget-popup"><p>Properties in Otley experienced internal and external flooding: internal residential flooding to 54 properties; external residential flooding to 14 properties; internal commercial flooding to 5 properties; external commercial flooding to 1 property. Total 74 properties affected. [TAB] (p29)</p></div><div class="nugget-popup"><p>Otley is included under the River Wharfe catchment section with headings for internal/external residential and commercial flooding, indicating properties were internally and/or externally flooded. (p30)</p></div><div class="nugget-popup"><p>Overtopping of the River Wharfe caused inundation of flood plains, old gravel pits and streets in Otley (for example Farnley Lane was heavily inundated on 26 Dec 2015), flooding properties on the left bank and causing significant disruption and risk to property and safety. [PAG] (p105)</p></div><div class="nugget-popup"><p>Town centre and surrounding streets and properties were inundated during the December 2015 events. Record&ndash;high River Wharfe levels overtopped and inundated flood plains and adjacent areas, leading to widespread inundation of streets, pavements and properties; surface water drainage toward the river was rendered inoperable causing local surcharge/backing up until river levels dropped. Photographic evidence from 2015 shows streets, street furniture and property frontages submerged and strong flow across urban streets. [IMG] (p106)</p></div><div class="nugget-popup"><p>Extensive fluvial flooding from the River Wharfe within flood zone 3 led to internal and external residential and commercial flooding across Otley. Surface water drainage became inoperable while river levels were high (including issues at the Kell Beck outfall), and fluvial backwater caused surcharge and localised surface water flooding until river levels fell and drainage could discharge by gravity. Streets, low&ndash;lying areas and the Wharfe flood plains were affected. [TAB,PAG] (p107)</p></div><div class="nugget-popup"><p>The River Wharfe overtopped and inundated floodplains and low&ndash;lying areas in and around central and northern Otley, causing internal and external flooding of properties, submerging public spaces (including a playground) and flooding streets (notably around the bridge and adjacent low&ndash;lying areas). Flooding incidents were spatially clustered near the river and within Flood Zone 3. [IMG,PAG] (p108)</p></div><div class="nugget-popup"><p>Fluvial flooding from the River Wharfe overtopped its banks and inundated adjacent floodplains, low&ndash;lying properties and amenity areas (including a play area off Farnley Lane almost entirely submerged). Gravel pits to the west filled and fluvial water flowed overland across fields flooding the old cattle market site. The B6451 Farnley Lane at Billams Hill was closed for several hours; homes were completely surrounded by deep, fast&ndash;flowing water. Localised surface&ndash;water flooding also occurred from Ordinary watercourses where channel capacity was exceeded or culverts were blocked. Otley Bridge acted as a throttle point restricting flows upstream. [IMG,PAG] (p109)</p></div><div class="nugget-popup"><p>Fluvial flooding from the River Wharfe overtopped its channel and inundated adjacent flood plains, low&ndash;lying properties and amenity areas. Overland flows from filled gravel pits flooded the old cattle market site. Floodwaters flowed across and along streets, surrounding homes with deep, fast&ndash;flowing water and causing road closures (including the B6451 at Billams Hill). Smaller ordinary watercourses and blocked culverts caused localised surface water flooding in parts of the town. [PAG] (p110)</p></div><div class="nugget-popup"><p>Fluvial flooding from the River Wharfe overtopped channel capacity during the 25&ndash;29 Dec 2015 event; Otley experienced very rapid river rise (Boxing Day) with the Lower Wharfe reaching its highest recorded levels. Flooding was exacerbated by high river levels surcharging surface water drainage, backing up via gullies and manholes. Otley Bridge acted as a 'throttle point' restricting flows upstream. The town has 300 properties considered at risk of flooding (187 of which were registered to receive Environment Agency flood warnings). [PAG] (p111)</p></div><div class="nugget-popup"><p>Otley experienced river flooding associated with the River Wharfe (highest recorded flows in December 2015) and surface water flooding on highways. Flooding exceeded current and historic drainage design standards for drainage infrastructure in the area. [TAB] (p112)</p></div><div class="nugget-popup"><p>Otley was among the communities affected by the highest ever recorded flood levels on the Lower River Wharfe during the Boxing Day period, resulting from rapid river rise and overtopping of river channels. (p120)</p></div><div class="nugget-popup"><p>Otley experienced fluvial flooding as part of the Lower River Wharfe event; flood levels on Boxing Day were the highest ever recorded for the Lower River Wharfe and affected the community. (p127)</p></div><div class="nugget-popup"><p>Otley was affected by fluvial flooding when the Lower River Wharfe reached record&ndash;high flood levels and overtopped, resulting in flooding of the community. (p134)</p></div><div class="nugget-popup"><p>The town was significantly affected by flooding during Storm Eva. [TAB] (p137)</p></div><div class="nugget-popup"><p>Otley was significantly affected by river flooding associated with Storm Eva. (p138)</p></div><div class="nugget-popup"><p>Otley experienced two floods (November and December 2015); residents formed Otley Residents Flood Group to address and implement flood defences and to develop a Flood Day Action Plan, liaising with LCC service areas and the Environment Agency. [MUL] (p290)</p></div><div class="nugget-popup"><p>Otley was specifically highlighted as a community for which recommendations and further flood&ndash;protection study work were to be produced, following the flooding in late December 2015. (p294)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>54 internal residential; 14 external residential; 5 internal commercial; 1 external commercial (total 74). [TAB] (p29)</p></div><div class="nugget-popup quant"><p>54 internal residential; 14 external residential; 5 internal commercial; 1 external commercial; 74 properties total [TAB,PAG] (p107)</p></div><div class="nugget-popup quant"><p>Flood&ndash;incident categories per 250m grid square: 2&ndash;17; 18&ndash;46; 47&ndash;121; 122&ndash;205; 206&ndash;592 (largest clusters near the river and central Otley). [IMG,PAG] (p108)</p></div><div class="nugget-popup quant"><p>flood depths up to 1000&ndash;2000 mm (reported range) [IMG,PAG] (p109)</p></div><div class="nugget-popup quant"><p>300 properties considered at risk of flooding; 187 properties registered to receive the Environment Agency's flood warnings; flood depths thought to be up to 1000 mm to 2000 mm [PAG] (p110)</p></div><div class="nugget-popup quant"><p>300 properties; 187 properties registered to receive flood warnings [PAG] (p111)</p></div></div></body></div>`)[0];
                popup_12c0a8498597632e9eaf7bcff176b033.setContent(html_8d9c91407fcf04bd686404236a7c5574);

                var html_57ce955f1febf54dd7133d4e79e008de = $(`<div id="html_57ce955f1febf54dd7133d4e79e008de" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hunslet</h1><div class="nugget-popup"><p>Flooding affected residential and commercial properties: internal residential flooding, external residential flooding, internal commercial flooding and external commercial flooding within Thwaite Gate and Hunslet as reported in the River Aire catchment dataset. [TAB] (p29)</p></div><div class="nugget-popup"><p>Low&ndash;lying parts of Hunslet experienced localised flooding driven by record high River Aire levels. Surface water drainage systems draining to the river (and the nearby pumping station) were inoperable until river levels fell; surcharge/back pressures from high river levels likely caused further localised surface water flooding. Flooding reduced once river levels permitted gravity discharge. [PAG] (p67)</p></div><div class="nugget-popup"><p>Extensive fluvial flooding within the River Aire flood zone causing internal and external residential and commercial property flooding. High river levels caused surface water drainage surcharge/backwater and temporary inoperability of drainage and pumping, with flooding reducing when river levels dropped. [PAG] (p68)</p></div><div class="nugget-popup"><p>Property flooding (internal and external incidents mapped in the Hunslet area), with incidents located within or adjacent to the blue flood extent along the river corridor during the event. [IMG] (p69)</p></div><div class="nugget-popup"><p>Hunslet experienced fluvial&ndash;driven flooding with mapped overland flow routes; internal flooding at Hunslet Trading Estate was verified with substantial depth. [IMG,PAG] (p70)</p></div><div class="nugget-popup"><p>Hunslet experienced fluvial flooding from main rivers; flood routes routed water through the area, with overtopping of river channels and surcharge of surface water drainage contributing to inundation. [PAG] (p71)</p></div><div class="nugget-popup"><p>Fluvial (Main River) flooding affected Hunslet (part of the reported Thwaite Gate and Hunslet area) as river levels overtopped, with drainage systems surcharged and backing up through highway gullies and manholes. [TAB] (p72)</p></div><div class="nugget-popup"><p>Flooding affected businesses along parts of the River Aire in Hunslet, producing visual amenity impacts to premises and contributing to negative effects on trade and inward investment for local businesses. (p292)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>60 internal residential flooding; 1051 external residential flooding; 49 internal commercial flooding; 10 external commercial flooding; total 1170 incidents (Thwaite Gate and Hunslet combined) [TAB] (p29)</p></div><div class="nugget-popup quant"><p>60 internal residential; 1051 external residential; 49 internal commercial; 10 external commercial; 1170 total properties (these totals are for Thwaite Gate and Hunslet combined) [PAG] (p68)</p></div><div class="nugget-popup quant"><p>1350 mm depth of internal flooding [IMG,PAG] (p70)</p></div></div></body></div>`)[0];

                var html_285b79a047311c2cb3f227ffbbadf68e = $(`<div id="html_285b79a047311c2cb3f227ffbbadf68e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Mickletown</h1><div class="nugget-popup"><p>Flooding incidents were reported for Methley and Mickletown combined, affecting residential properties (internal and external) in the combined area. [TAB] (p29)</p></div><div class="nugget-popup"><p>Report headings include Mickletown under the heading 'Methley and Mickletown' with internal and external residential and commercial flooding categories, indicating residential and commercial flooding occurred. (p30)</p></div><div class="nugget-popup"><p>Lower Mickletown was inundated during the December 2015 event &mdash; photographic evidence (28 Dec 2015, 08:48) shows standing water covering a residential street with water encroaching from the river side. Mickletown Ings held a large volume of water and, once filled, drains via gravity outfalls; anecdotal evidence suggests the Ings did not drain fully following decommissioning of a 'syphon', potentially prolonging local inundation. High river levels and backwater effects also made surface water drainage systems inoperable. [IMG,PAG] (p88)</p></div><div class="nugget-popup"><p>Localised flooding occurred in low&ndash;lying parts of Mickletown during the event (25 Dec 2015 &ndash; 29 Dec 2015) as record&ndash;high river levels on the River Aire/Calder rendered conventional surface water drainage systems inoperable and caused surcharge/backpressure. Mickletown Ings filled with a large volume of water and drained slowly (anecdotal reports attribute slower drainage to the decommissioning of the 'syphon'), affecting operational and farm land and a Site of Special Scientific Interest within the Ings. [IMG,PAG] (p89)</p></div><div class="nugget-popup"><p>Mickletown Ings held a large volume of floodwater during high river flows and drained via gravity outfalls; anecdotal reports indicate not all water drained after the syphon was decommissioned, contributing to prolonged inundation and localised flooding and potential surcharge of surface water systems. [PAG] (p90)</p></div><div class="nugget-popup"><p>Mickletown Ings and associated washlands acted as temporary flood storage during the extreme event. St Aidan&#8217;s operation reduced peak river levels at Mickletown by around 500mm, reducing the risk of severe inundation; this action contributed to the modeled estimate of properties saved in the wider Woodlesford&ndash;Castleford area. [PAG] (p91)</p></div><div class="nugget-popup"><p>Extensive fluvial (river) flooding from the River Aire and Calder within Flood Zone 3 causing residential flooding (internal and external). Lower Mickletown and Mill Lane are listed among worst&ndash;affected streets/areas. The St Aidan's temporary storage/washlands were tested and operated, reducing flood levels in the area. [TAB,PAG] (p92)</p></div><div class="nugget-popup"><p>Residential properties in Mickletown experienced internal and external flooding during the event. Flood incidents clustered adjacent to watercourses and within designated flood zones; listed worst&ndash;affected streets are within this area. [IMG,PAG] (p93)</p></div><div class="nugget-popup"><p>Fluvial flooding concentrated in Mickletown: River Aire and River Calder overtopped into Mickletown Ings flood storage areas, producing overland flow routes that inundated built&ndash;up areas. Property flooding incidents were clustered in central and eastern Mickletown, with isolated properties on the fringes of the washland flooded. [IMG,PAG] (p94)</p></div><div class="nugget-popup"><p>Fluvial flooding from the Rivers Aire and Calder overtopping into adjacent flood storage areas and floodplain, causing isolated properties on the fringes of the washland to be flooded and exacerbation by surcharged surface water drainage. [PAG] (p95)</p></div><div class="nugget-popup"><p>Fluvial (main river) flooding affected the settlement during the December 2015 flood event. [TAB] (p96)</p></div><div class="nugget-popup"><p>Residents formed a flood action group following flooding to organise local response and resilience work, with support links to Garforth Flood Action Group. (p289)</p></div><div class="nugget-popup"><p>Mickletown was affected by flooding during Storm Eva and has been identified for Flood Protection works (including a Pit Lane barrier) in subsequent planning. (p294)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Combined (Methley and Mickletown): 4 internal residential flooding; 32 external residential flooding; 0 internal commercial flooding; 0 external commercial flooding; combined total 36 incidents [TAB] (p29)</p></div><div class="nugget-popup quant"><p>around 500mm reduction in peak river level; 1289 properties potentially saved (modelled total across Woodlesford&ndash;Castleford) [PAG] (p91)</p></div><div class="nugget-popup quant"><p>Combined Methley and Mickletown: 4 internal residential properties; 32 external residential properties; 0 internal commercial properties; 0 external commercial properties; 36 properties total [TAB,PAG] (p92)</p></div><div class="nugget-popup quant"><p>4 internal residential; 32 external residential; 0 internal commercial; 0 external commercial; total 36 (combined total for Methley and Mickletown) [IMG,PAG] (p93)</p></div><div class="nugget-popup quant"><p>Over 206 properties affected in a single central grid square (highest concentration); 793 properties considered to be at risk across Methley and Mickletown; 137 properties registered to receive Environment Agency flood warnings (combined figures) [IMG,PAG] (p94)</p></div></div></body></div>`)[0];

                var html_c78548562edb2bdc541f6927c2080c8f = $(`<div id="html_c78548562edb2bdc541f6927c2080c8f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Methley</h1><div class="nugget-popup"><p>Flooding incidents were reported for Methley and Mickletown combined, affecting residential properties (internal and external) in the combined area. [TAB] (p29)</p></div><div class="nugget-popup"><p>Report headings list internal residential, external residential, internal commercial and external commercial flooding for Methley; residential and commercial properties experienced internal and/or external flooding. (p30)</p></div><div class="nugget-popup"><p>Parts of Methley (located between the Rivers Aire and Calder) were badly flooded in 1960 with homes inundated; the area has also experienced significant flooding from the Aire and Calder in 1978, 1982, 1995, 2000, 2007, 2008 and 2012. During the December 2015 event record&ndash;high river levels caused localised flooding, rendered conventional surface water drainage systems draining to the rivers inoperable and produced fluvial backwater/surcharge effects contributing to localised inundation. [IMG,PAG,MUL] (p88)</p></div><div class="nugget-popup"><p>Methley&#8217;s washlands and nearby flood storage areas were part of the system used to hold high river flows; flood banks and attenuation measures reduced property impacts, while washlands temporarily stored floodwater during the high river levels. [PAG] (p90)</p></div><div class="nugget-popup"><p>Methley&#8217;s washlands were used as temporary storage during the extreme flood event and St Aidan&#8217;s operation reduced peak river levels at Methley by around 500mm, helping to prevent severe inundation of properties. Models indicate the influence of St Aidan&#8217;s and the washlands during this event could have contributed to as many as 1289 properties being saved across the area between Woodlesford and Castleford. [PAG] (p91)</p></div><div class="nugget-popup"><p>Extensive fluvial (river) flooding from the River Aire and Calder within Flood Zone 3 caused residential flooding (internal and external). Worst&ndash;affected streets/areas reported in the locality include Mill Lane, Wilson's Row and Green Lane. The St Aidan's temporary storage/washlands were tested and operated, reducing flood levels in the area. [TAB,PAG] (p92)</p></div><div class="nugget-popup"><p>Residential properties in Methley experienced internal and external flooding during the event. Flood incidents were concentrated near watercourses and within high flood&ndash;risk zones; high&ndash;rise and multi&ndash;occupancy accommodation were included where affected. [IMG,PAG] (p93)</p></div><div class="nugget-popup"><p>Fluvial flooding affected Methley: internal and external property flooding documented. Floodwaters originated from the River Aire and River Calder overtopping into adjacent Mickletown Ings flood storage areas and spreading into the flood washland, flooding properties on the extreme fringes. [IMG,PAG] (p94)</p></div><div class="nugget-popup"><p>Fluvial flooding from the Rivers Aire and Calder overtopping their channels; floodplain inundation led to isolated property flooding on the extreme fringes of the washland and surface&ndash;water drainage surcharge causing backing up through road gullies and manholes. [PAG] (p95)</p></div><div class="nugget-popup"><p>Fluvial (main river) flooding affected the settlement during the December 2015 flood event. [TAB] (p96)</p></div><div class="nugget-popup"><p>The Methley washlands filled with floodwater during the extreme event of 25 Dec 2015 &ndash; 29 Dec 2015, interacting with St Aidan's storage to hold excess river flows and protect properties at Methley from more severe inundation. [PAG] (p99)</p></div><div class="nugget-popup"><p>Mapping of the event records flooding incidents in the Methley area during the event; incidents are spatially associated with the River Aire floodplain and Flood Zone 3 on the council's incident maps. [IMG] (p102)</p></div><div class="nugget-popup"><p>Community experienced flooding and residents formed a flood action group to coordinate post&ndash;flood response and resilience activities, linking with Garforth Flood Action Group for help and advice. (p289)</p></div><div class="nugget-popup"><p>Methley was identified as a location requiring flood protection works following the December 2015 flood event; the Lower River Aire Catchment Model is being used to identify suitable flood protection measures for Methley. (p294)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Combined (Methley and Mickletown): 4 internal residential flooding; 32 external residential flooding; 0 internal commercial flooding; 0 external commercial flooding; combined total 36 incidents [TAB] (p29)</p></div><div class="nugget-popup quant"><p>homes under up to 4 metres of water (1960) [IMG,PAG,MUL] (p88)</p></div><div class="nugget-popup quant"><p>around 500mm reduction in peak river level; 1289 properties potentially saved (modelled total across Woodlesford&ndash;Castleford) [PAG] (p91)</p></div><div class="nugget-popup quant"><p>Combined Methley and Mickletown: 4 internal residential properties; 32 external residential properties; 0 internal commercial properties; 0 external commercial properties; 36 properties total [TAB,PAG] (p92)</p></div><div class="nugget-popup quant"><p>4 internal residential; 32 external residential; 0 internal commercial; 0 external commercial; total 36 (combined total for Methley and Mickletown) [IMG,PAG] (p93)</p></div><div class="nugget-popup quant"><p>793 properties considered to be at risk across Methley and Mickletown; 137 properties registered to receive Environment Agency flood warnings (figures refer to Methley and Mickletown combined) [IMG,PAG] (p94)</p></div><div class="nugget-popup quant"><p>1289 properties [PAG] (p99)</p></div></div></body></div>`)[0];

                var html_7ad12363143b5defec5e66310ad71323 = $(`<div id="html_7ad12363143b5defec5e66310ad71323" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Woodlesford</h1><div class="nugget-popup"><p>Flooding affected residential properties and some commercial/outbuilding areas in Woodlesford. [TAB,PAG] (p29)</p></div><div class="nugget-popup"><p>Low&ndash;lying areas were inundated by standing floodwater caused by record&ndash;high River Aire levels and fluvial backwater; surface water drainage systems draining to the river were rendered inoperable until river levels fell. Industrial units, buildings and storage tanks were submerged and Trans Pennine Trail signage and recreational routes were inundated (photograph dated 27 December 2015 shows submerged industrial area). The recently completed low&ndash;level embankment flood defences provided protection to residential properties during the event. [IMG,PAG] (p83)</p></div><div class="nugget-popup"><p>Extensive fluvial flooding within Flood Zone 3 of the River Aire affected Woodlesford. Flooding included internal residential flooding, external residential flooding and external commercial flooding; high&ndash;rise and multi&ndash;occupancy accommodation were also affected. [IMG,TAB] (p84)</p></div><div class="nugget-popup"><p>River Aire overtopped into adjacent floodplains and inundated the Aire & Calder Navigation; the canal also surcharged and overtopped (exacerbated by upstream structural collapse at Knostrop), leading to flooding of low&ndash;lying properties and commercial units in Woodlesford. Photographs (27 Dec) show flooded commercial units and The Locks residential area; transport was affected in vicinity. [IMG,PAG] (p85)</p></div><div class="nugget-popup"><p>Flooding in Woodlesford was caused primarily by the River Aire overtopping into adjacent floodplains and inundating the Aire & Calder Navigation canal, which then exceeded its channel capacity and overtopped. Canal breaches and river overtopping routes spread floodwater across low&ndash;lying areas, affecting farmland, infrastructure and low&ndash;lying properties in the Woodlesford area. [IMG] (p86)</p></div><div class="nugget-popup"><p>Main River (fluvial) flooding overtopped channel capacity during the 25&ndash;29 Dec 2015 event. High river levels surcharged conventional surface water drainage, preventing discharge and causing back&ndash;up through road gullies, manhole chambers and private drainage systems in Woodlesford. [TAB] (p87)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 internal residential flooding; 4 external residential flooding; 0 internal commercial flooding; 1 external commercial flooding; total 6 incidents [TAB,PAG] (p29)</p></div><div class="nugget-popup quant"><p>1 internal residential flooding; 4 external residential flooding; 0 internal commercial flooding; 1 external commercial flooding; Woodlesford total 6 properties flooded [IMG,TAB] (p84)</p></div></div></body></div>`)[0];
