                var html_99a0a266cc0e8b67a502e6e41fafe536 = $(`<div id="html_99a0a266cc0e8b67a502e6e41fafe536" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Wharfe</h1><div class="nugget-popup"><p>Highest river levels in parts of the Wharfe catchment contributed to devastating effects on local communities, businesses, homes and local infrastructure. (p7)</p></div><div class="nugget-popup"><p>Flooding from the River Wharfe was identified as one of the predominant causes of flooding across the metropolitan district of Leeds during the Storm Eva event, contributing to widespread inundation of properties and urban impacts (including internal flooding, disruption to access and utilities, stranded vehicles in basement car parks and incapacitated lifts in multi&ndash;occupancy/high&ndash;rise buildings). [PAG] (p9)</p></div><div class="nugget-popup"><p>Contributed to widespread and significant flooding across the Leeds district; flow routes from the river caused overtopping or bypassing of defences and widespread flooding of properties. (p10)</p></div><div class="nugget-popup"><p>The River Wharfe is one of the Main Rivers and contributed to fluvial flooding that affected settlements along its corridor (notably Otley and Wetherby). [PAG] (p16)</p></div><div class="nugget-popup"><p>Identified as one of the main rivers in the district and as contributing to the main river fluvial flooding during the 25&ndash;29 Dec 2015 event; the Wharfe corridor flooding affected adjacent settlements (for example Collingham and Thorpe Arch). [IMG] (p17)</p></div><div class="nugget-popup"><p>Named alongside the Rivers Aire as a predominant source of the property flooding reported in the Leeds metropolitan district for the event. (p27)</p></div><div class="nugget-popup"><p>The Wharfe catchment experienced prolonged rainfall and saturation prior to the event, and further heavy rainfall over Christmas caused rapid river rises and widespread fluvial flooding. High river levels associated with the Wharfe contributed to surcharging of surface water drainage in the urban area, backing up through gullies, manholes and private drainage systems. (p43)</p></div><div class="nugget-popup"><p>Catchment experienced heavy, prolonged rainfall leading to saturated ground and rapid runoff; river levels rose rapidly with many stations recording highest levels ever, resulting in Main River overtopping and widespread fluvial flooding that surcharged surface water drainage and backed up through gullies, manholes and private drains. (p49)</p></div><div class="nugget-popup"><p>River Wharfe catchment experienced heavy, prolonged rainfall on saturated ground leading to rapid runoff and river levels that overtopped channels; this caused widespread fluvial flooding and contributed to surcharging of surface water drainage, resulting in backups through gullies, manholes and private drains. (p57)</p></div><div class="nugget-popup"><p>The River Wharfe catchment, following heavy and prolonged rainfall on saturated ground during 25&ndash;29 December 2015, produced rapid river rises and contributed to fluvial flooding in Burley. High river levels led to overtopping of channels and exacerbated surface water drainage surcharging and backup. (p65)</p></div><div class="nugget-popup"><p>The Wharfe catchment experienced heavy and prolonged rainfall prior to and during 25&ndash;29 December 2015, contributing to saturated catchments and rapid river rises. This contributed to widespread fluvial flooding from main rivers that overtopped their channels, surcharged surface water drainage (backing up through gullies and manholes) and exacerbated flooding in downstream areas such as Thwaite Gate, Hunslet and Hunslet Trading Estate. (p71)</p></div><div class="nugget-popup"><p>Catchment experienced heavy prolonged rainfall prior to and over the 25&ndash;29 December event, producing saturated ground and rapid runoff; contributed to very high river levels and overtopping leading to fluvial flooding that exacerbated surface water surcharge in the area. (p81)</p></div><div class="nugget-popup"><p>The Wharfe catchment had also experienced heavy and prolonged rainfall prior to and during 25&ndash;29 Dec 2015, producing saturated catchments and contributing to rapid river rises and flooding during the event. (p86)</p></div><div class="nugget-popup"><p>Overtopping of the River Wharfe was the main source of floodwater that inundated adjacent flood plains, old gravel pits and contributed to property flooding in Otley; tributaries (Kell Beck and Holbeck) also contributed locally. (p105)</p></div><div class="nugget-popup"><p>The River Wharfe overtopped its banks during the event and was identified as the main source of floodwater that inundated flood plains and old gravel pits adjacent to the river. Overtopping and fluvial backwater effects caused inundation of left&ndash;bank properties and prevented surface water systems discharging to the river (rendering them inoperable), contributing to localised flooding and surcharge at outfalls such as Kell Beck. [PAG] (p106)</p></div><div class="nugget-popup"><p>Record high river levels in the River Wharfe caused extensive fluvial flooding within flood zone 3 in Otley. High river levels created backwater and surcharge effects that rendered surface water drainage systems draining to the river inoperable (including the Kell Beck outfall upstream of Otley Bridge), contributing to localised flooding across the town and resulting in internal and external property flooding. [TAB,PAG] (p107)</p></div><div class="nugget-popup"><p>The River Wharfe came out of channel, overtopping and inundating adjacent floodplains, amenity areas and low&ndash;lying properties. Overtopping led to flow into gravel pits and across fields, flooding the old cattle market site, crossing the B6451 Farnley Lane and isolating homes with deep, fast&ndash;flowing water; floodwaters rejoined the river at the Holbeck tributary downstream of the weir. [PAG] (p109)</p></div><div class="nugget-popup"><p>The River Wharfe came out of channel, overtopping and inundating adjacent flood plains, low&ndash;lying properties and amenity areas; flows filled nearby gravel pits and produced overland flow across fields into built&ndash;up areas. (p110)</p></div><div class="nugget-popup"><p>The River Wharfe experienced its highest flow levels on record in December 2015. A mid&ndash;catchment intense rainfall event (Storm Eva/Boxing Day) produced very rapid runoff, producing a 1 in 100 year event in the Lower Wharfe that overtopped channels and caused flooding across communities within the Leeds boundary (including Otley). Flooding exceeded drainage design standards and surcharged surface water systems. (p111)</p></div><div class="nugget-popup"><p>Record high river levels in the River Wharfe produced fluvial backwater effects that contributed to localised flooding in Collingham (rendering drainage systems and pumping stations inoperable and causing surcharge into surface water systems). [PAG] (p113)</p></div><div class="nugget-popup"><p>Record high river levels on the River Wharfe produced extensive fluvial flooding and fluvial backwater effects that rendered surface water drainage and pumping stations inoperable, contributing to localised flooding in low&ndash;lying areas until levels dropped. [TAB,PAG] (p115)</p></div><div class="nugget-popup"><p>The River Wharfe (referred to as River Wharf in figures) came out of channel and breached local flood defences in Collingham, overtopping embankments and inundating adjacent flood plains, low&ndash;lying properties and amenity areas; embankment breach events allowed flow onto residential streets. [IMG,PAG] (p116)</p></div><div class="nugget-popup"><p>The River Wharfe came out of its channel, overtopped and breached flood defences, inundating adjacent floodplains, low&ndash;lying properties, gardens and amenity areas in Collingham (including flow routes into streets and across fields); contributed to isolated internal property flooding at Linton Ings and Church Lane and caused major damage to Linton Bridge. [IMG] (p117)</p></div><div class="nugget-popup"><p>Catchment experienced heavy rainfall on already saturated ground causing almost instant runoff and rapid river rise; river level stations recorded their highest levels ever and the rapid rise contributed to flooding in the catchment. (p119)</p></div><div class="nugget-popup"><p>Overtopped its banks in Wetherby, causing floodwater to submerge riverside structures and inundate the riverbank area. [IMG] (p122)</p></div><div class="nugget-popup"><p>Record high river levels in the River Wharfe caused extensive fluvial flooding (flood zone 3) that inundated low&ndash;lying areas in Wetherby and rendered surface water drainage systems inoperable; fluvial backwater produced surcharge/back pressure on surface water systems, contributing to localised flooding. [TAB,PAG] (p123)</p></div><div class="nugget-popup"><p>The River Wharfe overtopped/rose and is shown as the primary source correlated with the distribution of internal and external property flooding along its banks in Wetherby and downstream areas; riverside properties and nearby floodplain (sports fields, Linton Ings) were inundated. [IMG] (p124)</p></div><div class="nugget-popup"><p>The river came out of its channel, overtopped its banks and inundated adjacent flood plains, low&ndash;lying properties and amenity areas; this fluvial (river) flooding led to internal property flooding and wide overland flow routes through central Wetherby. [IMG] (p126)</p></div><div class="nugget-popup"><p>River Wharfe overtopped its channel and inundated adjacent flood plains, low&ndash;lying properties and amenity areas; extensive fluvial flooding occurred across the catchment. [PAG] (p127)</p></div><div class="nugget-popup"><p>The River Wharfe overtopped its banks on 26 December 2015 and caused inundation of adjacent residential areas and land at Thorp Arch (flooding of roads, gardens and lower parts of houses). [IMG] (p129)</p></div><div class="nugget-popup"><p>Record high river levels in the River Wharfe produced extensive fluvial flooding (flood zone 3) and backwater effects that rendered surface water drainage inoperable and caused surcharge/backpressure into drainage systems, contributing to localised inundation of adjacent communities (Thorp Arch and Boston Spa). [TAB,PAG] (p130)</p></div><div class="nugget-popup"><p>The River Wharfe came out of its channel, overtopping and inundating adjacent flood plains and low&ndash;lying properties, causing internal inundation of residential buildings and widespread surface inundation of streets and gardens. [PAG] (p133)</p></div><div class="nugget-popup"><p>Flooding from the River Wharfe affected communities along its course during Storm Eva; associated damage included significant impacts to Otley and severe damage to Linton Bridge. [TAB] (p137)</p></div><div class="nugget-popup"><p>Flooding from the River Wharfe affected communities along its course during Storm Eva, contributing to significant local impacts including damage at Linton Bridge and substantial effects in Otley. [PAG] (p138)</p></div><div class="nugget-popup"><p>Severe flooding in December 2015 that caused damage to Linton Bridge and triggered stabilisation works. (p255)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4712 flooding incidents across the metropolitan district of Leeds (final DEFRA figure, Sept 2016, combined); 2826 properties affected by internal flooding; 3368 properties reported to central Government under the DCLG EVA scheme (June 2016) [PAG] (p9)</p></div><div class="nugget-popup quant"><p>54 internal residential; 14 external residential; 5 internal commercial; 1 external commercial; 74 properties total [TAB,PAG] (p107)</p></div><div class="nugget-popup quant"><p>flood depths up to 1000&ndash;2000 mm (reported range) [PAG] (p109)</p></div><div class="nugget-popup quant"><p>flood depths thought to be up to 1000 mm to 2000 mm (p110)</p></div><div class="nugget-popup quant"><p>internal flood depths in some properties in excess of 2 m [IMG,PAG] (p116)</p></div><div class="nugget-popup quant"><p>internal flood depths in some cases in excess of 2 m; south supporting pier settlement 200 mm; 4 miles vehicle diversion [IMG] (p117)</p></div><div class="nugget-popup quant"><p>1 riverside pavilion partially submerged [IMG] (p122)</p></div><div class="nugget-popup quant"><p>26 properties flooded in Wetherby (see Wetherby totals) [TAB,PAG] (p123)</p></div><div class="nugget-popup quant"><p>Incidents per 250m grid square recorded in the map legend: 2&ndash;17; 18&ndash;46; 47&ndash;121; 122&ndash;205; 206&ndash;392 (graduated circles showing number of flooded properties/multi&ndash;occupancy incidents) [IMG] (p124)</p></div><div class="nugget-popup quant"><p>flood depths in excess of 2 m; internal property flooding depths of 800 mm; 1 flood warning covering Wetherby; 66 properties considered at risk (44 registered to receive EA warnings) [IMG] (p126)</p></div><div class="nugget-popup quant"><p>flood depths in excess of 2m; internal property flooding depth of 800mm [PAG] (p127)</p></div><div class="nugget-popup quant"><p>32 properties flooded in Thorp Arch and Boston Spa total (7 internal residential; 25 external residential; 0 internal commercial; 0 external commercial). [TAB,PAG] (p130)</p></div><div class="nugget-popup quant"><p>internal flood depths 500mm to 1500mm [PAG] (p133)</p></div></div></body></div>`)[0];

                var html_9b90bd8b26367b98494bf93f7fb2031f = $(`<div id="html_9b90bd8b26367b98494bf93f7fb2031f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kirkstall Road, Burley</h1><div class="nugget-popup"><p>Floodwater from the River Aire/channels flowed out approximately 0.8 miles upstream of Armley flow gauge and travelled down Kirkstall Road toward the city centre; listed as a major transport route that was flooded and disrupted during the event. (p8)</p></div><div class="nugget-popup"><p>Rapid inundation with deep, fast&ndash;flowing flood water from the River Aire into the city centre; presented a danger to life and caused significant disruption to the area. (p10)</p></div><div class="nugget-popup"><p>Location of the Liberty Park complex which experienced internal flooding (flooded power room and reception), loss of mains power and deployment of temporary generators; surrounding courtyard areas were inundated. [MUL] (p35)</p></div><div class="nugget-popup"><p>The A65 (Kirkstall Road) became inundated as fluvial exceedance flows from the overtopped River Aire flowed southeast into the city; surfacing water covered the entire road carriageway with visible current and turbulence, submerging road signs and disrupting transport. [IMG] (p41)</p></div><div class="nugget-popup"><p>Kirkstall Road is shown completely submerged under floodwater, rendering the road impassable as floodwaters look to extend towards the city centre. [IMG] (p42)</p></div><div class="nugget-popup"><p>The A65 Kirkstall Road (a major route into the city) was flooded, causing major transport disruption. (p52)</p></div><div class="nugget-popup"><p>Low&ndash;lying properties between the River Aire and Kirkstall Road were inundated when the river overtopped and breached private defences; properties experienced internal flooding and damage to fixtures, fittings, building fabric and vehicles. (p55)</p></div><div class="nugget-popup"><p>The River Aire spilled onto the A65 Kirkstall Road at the meander opposite Woodside View; the A65 was shown flooded in photographic and aerial evidence (road submerged, water encroaching into adjacent properties and streets). [IMG,PAG] (p63)</p></div><div class="nugget-popup"><p>Kirkstall Road experienced inundation where River Aire overtopping spilled onto the road corridor and onto several side roads downstream, contributing to the flow path into Leeds city centre. [IMG,PAG] (p64)</p></div><div class="nugget-popup"><p>Severe urban/ surface water flooding at night with the road inundated; a vehicle was partially submerged and at least one person was wading through knee&ndash;deep water, causing transport disruption and safety risk in the commercial area. [IMG] (p237)</p></div><div class="nugget-popup"><p>Floodwater from the River Aire ran down Kirkstall Road and flowed towards Wellington Street, contributing to rising water levels and downstream flooding of city&ndash;centre streets and West Point. (p242)</p></div><div class="nugget-popup"><p>Basement utilities in flooded properties were affected; a proposal was progressed to move utilities out of basements for 26 properties on Kirkstall Road to reduce future flood impacts. (p288)</p></div><div class="nugget-popup"><p>Location of a high&ndash;profile business (Thyssen Krupp) that closed as a result of the flooding. (p292)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>564 student rooms; 7 kitchens; 5 temporary generators; 5 elevators out of commission [MUL] (p35)</p></div><div class="nugget-popup quant"><p>26 properties; £130,000 (proposed cost for utilities work) (p288)</p></div></div></body></div>`)[0];

oducing flooding of the street and surrounding area. (p120)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>12 properties [IMG] (p114)</p></div><div class="nugget-popup quant"><p>12 properties (protected by the Avenue flood defence) [PAG] (p115)</p></div><div class="nugget-popup quant"><p>14 properties; 3 days (p119)</p></div></div></body></div>`)[0];

                var html_0d04624016e28018e55b4db60fa3ab56 = $(`<div id="html_0d04624016e28018e55b4db60fa3ab56" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Yorkshire</h1><div class="nugget-popup"><p>Months of rainfall produced one of the wettest winters on record and further Christmas/Boxing Day rainfall led to devastating flooding across the region, causing severe impacts on local communities, businesses, homes and critical/local infrastructure. (p7)</p></div><div class="nugget-popup"><p>The 25&ndash;29 December 2015 flood event was among the most significant in Yorkshire since records began; record river levels were produced by saturated ground, mid&ndash;catchment loss of storage and high antecedent river levels, producing severe flooding impacts in the county. (p26)</p></div><div class="nugget-popup"><p>The Yorkshire distribution/service area experienced flooding from Storm Eva, producing multiple network incidents and customer supply interruptions. [TAB] (p223)</p></div><div class="nugget-popup"><p>River Aire flooding across the region prevented safe access to sites (notably Kirkstall), caused road closures and several bridges to collapse or be at risk of collapse, displaced large numbers of customers, and generated widespread power network incidents requiring coordinated emergency response and recovery. [IMG,PAG] (p228)</p></div><div class="nugget-popup"><p>The Northern Powergrid (Yorkshire) distribution area across Yorkshire was affected by the flood event, producing large&ndash;scale customer supply interruptions and damage to network equipment within the region. [IMG,PAG] (p229)</p></div><div class="nugget-popup"><p>Flooding across the region led to widespread impacts on communities and infrastructure, including power supply interruptions reported by Northern Powergrid (Yorkshire). [TAB,PAG] (p230)</p></div><div class="nugget-popup"><p>Flooding affected electrical infrastructure across the region, with substations and a bulk supply point suffering inundation and HV/EHV faults leading to power outages. [TAB,PAG] (p231)</p></div><div class="nugget-popup"><p>The Yorkshire region experienced flooding that impacted the electricity distribution network, causing multiple substation faults, equipment flooding and widespread customer interruptions requiring DNO response. [IMG,TAB,PAG] (p232)</p></div><div class="nugget-popup"><p>Floodwater damaged an RTU at Kirkstall on the evening of 26 December 2015, preventing alarms from being received into Yorkshire Control's Network Management System (NMS); remote telemetry mitigated some diagnostic/response impacts. [PAG,MUL] (p233)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>42 HV event related incidents in a 24&ndash;hour period; 49 EHV/HV incidents; 13 LV incidents; in excess of 35,000 customers affected; 62 separate faults [TAB] (p223)</p></div><div class="nugget-popup quant"><p>roads and several bridges collapsed or were at risk of collapsing; large numbers of customers displaced; approximately 35,000 customers affected in the Northern Powergrid (Yorkshire) distribution area [IMG,PAG] (p228)</p></div><div class="nugget-popup quant"><p>approximately 35,000 customers affected [IMG,PAG] (p229)</p></div><div class="nugget-popup quant"><p>35,842 customers [TAB,PAG] (p230)</p></div><div class="nugget-popup quant"><p>See DNO totals: 62 flooded assets; 49 HV incidents; 13 LV incidents; large volumes of customer contacts and abandoned calls as recorded above. [IMG,TAB,PAG] (p232)</p></div><div class="nugget-popup quant"><p>1 RTU communication failure [PAG,MUL] (p233)</p></div></div></body></div>`)[0];

                var html_066ab910b624c0a33ea4cc1b8408f630 = $(`<div id="html_066ab910b624c0a33ea4cc1b8408f630" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>West Yorkshire</h1><div class="nugget-popup"><p>Across the county catchments were saturated and further heavy rainfall over 25&ndash;29 December led to rapid river rises and widespread flooding; emergency responders pumped out streets (e.g. The Avenue) after defences overtopped and properties flooded. [IMG] (p119)</p></div><div class="nugget-popup"><p>Flooding from the River Wharfe affected areas within West Yorkshire, including Wetherby and adjacent floodplain sites (e.g. Linton Ings and sports fields), causing internal and external property flooding in those localities. [IMG] (p124)</p></div><div class="nugget-popup"><p>Torrential rain and flooding across the West Yorkshire region led to widespread supply interruptions and numerous faults on the electrical distribution network. (p223)</p></div><div class="nugget-popup"><p>Widespread flooding caused road closures, bridge collapses or bridges at risk of collapse, large&ndash;scale displacement of customers and a region&ndash;wide service recovery programme of electricity supply following flood damage. (p227)</p></div><div class="nugget-popup"><p>Flood response teams in West Yorkshire were mobilised to respond to flooding&ndash;related network faults and customer interruptions; recorded staffing levels were 45 (26 Dec), 47 (27 Dec) and 49 (28 Dec) during the event. [TAB,PAG] (p232)</p></div><div class="nugget-popup"><p>Flooding during the event led to deployment of 'Flood response West Yorkshire' resources and affected local assets within the region. [PAG] (p233)</p></div><div class="nugget-popup"><p>Widespread river and surface&ndash;water flooding across the county during 25 Dec 2015 &ndash; 29 Dec 2015 affected multiple towns (including Mytholmroyd and Baildon), causing inundation of properties and damage to transport and local infrastructure. [PAG] (p238)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>14 properties [IMG] (p119)</p></div><div class="nugget-popup quant"><p>Incidents per 250m grid square recorded in the map legend: 2&ndash;17; 18&ndash;46; 47&ndash;121; 122&ndash;205; 206&ndash;392 (graduated circles showing number of flooded properties/multi&ndash;occupancy incidents) [IMG] (p124)</p></div><div class="nugget-popup quant"><p>In excess of 35,000 customers affected; 62 separate faults; 49 EHV/HV incidents (p223)</p></div><div class="nugget-popup quant"><p>3,285 properties inspected; 284 service termination cut&ndash;outs replaced; 190 services renewed; 53 properties disconnected on safety grounds (p227)</p></div></div></body></div>`)[0];

                var html_f89688bd20d8a4913caf1216fa0df49b = $(`<div id="html_f89688bd20d8a4913caf1216fa0df49b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cumbria</h1><div class="nugget-popup"><p>Suffered severe flooding for much of December 2015. Antecedent November/early&ndash;December storms left grounds saturated and reduced mid&ndash;catchment storage; combined with high river levels and further rainfall this produced record river levels and widespread, repeated river flooding leading up to the 25&ndash;29 December 2015 (Boxing Day) event. [MUL] (p26)</p></div></div></body></div>`)[0];

                var html_24a92ed4754cc55178e7747cf4e76cb2 = $(`<div id="html_24a92ed4754cc55178e7747cf4e76cb2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Linton Bridge</h1><div class="nugget-popup"><p>Named among the major transport links that were flooded during the event; the bridge linking Collingham to Linton and Wetherby was impacted by the flooding, causing disruption to that route. (p8)</p></div><div class="nugget-popup"><p>Floodwaters from the River Wharfe overtopped defences and inundated the area around the school; Linton Bridge suffered major flood damage with the south supporting pier settling and structural displacement, leading to bridge closure for safety and assessment. [IMG] (p117)</p></div><div class="nugget-popup"><p>Flooding caused major structural damage to the bridge: visible displacement of an arch and settlement of the south supporting pier. The bridge was closed on 27 December 2015 for safety and structural assessment, severing the link between Collingham and Linton and forcing a major vehicle diversion with no pedestrian alternative. Repairs are required. [IMG] (p118)</p></div><div class="nugget-popup"><p>The bridge was badly damaged by flooding during Storm Eva; repair works are underway (complex due to listed status) with a projected completion of Summer 2017. [TAB] (p137)</p></div><div class="nugget-popup"><p>Linton Bridge was badly damaged by flooding during Storm Eva; repair works are complex (listed structure), underway and projected to complete Summer 2017. (p138)</p></div><div class="nugget-popup"><p>Suffered structural damage during severe River Wharfe flooding on 26 December 2015: the south pier settled 200mm overnight and experienced significant scour on its northern side with loose and dislodged foundation stones. The settlement and rotation reduced thrust in the south span toward zero so that a central section (about 5m long, ~150 tonnes) is being held by mortar tension and secondary load paths; failure of the mortar could lead to that section dropping out and a domino collapse of the whole bridge. Monitoring showed movement halted after about a week. Urgent temporary support or controlled demolition and measures to restore and protect the foundation (scour protection) were recommended. [PAG] (p254)</p></div><div class="nugget-popup"><p>Suffered damage due to severe flooding in December 2015: obvious settlement at the south pier, significant transverse cracking in the south and centre span arch barrels; bridge considered relatively unstable and access above and below was restricted until stabilising measures were implemented. (p255)</p></div><div class="nugget-popup"><p>Structural damage to the bridge attributable to scour at the south pier foundation: cracking in the arches and evidence of load redistribution as the pier is bearing predominantly on one side. The foundation undermining is the primary cause of the bridge damage and requires stabilisation to prevent progressive failure. [IMG] (p263)</p></div><div class="nugget-popup"><p>Sustained damage during the December 2015 event that required repairs; progress on repairs was reported as part of recovery activity. (p287)</p></div><div class="nugget-popup"><p>Bridge was closed for repair as part of the post&ndash;flooding response, causing transport disruption and prompting a subsidised shuttle bus between Linton, Collingham and Wetherby during closure. (p290)</p></div><div class="nugget-popup"><p>Sustained damage during the flood event requiring strengthening works; a complex temporary arch support is being installed so repairs can proceed beneath the bridge, with reopening scheduled for summer 2017. (p293)</p></div><div class="nugget-popup"><p>Sustained flood&ndash;related damage requiring ongoing repairs; residents surrounding Linton Bridge were given targeted communications about the repairs and alternative travel arrangements. (p294)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>internal flood depths in excess of 2 m; 200 mm settlement of south supporting pier; 4 miles vehicular diversion; £4.3 million estimated repair cost; 12 months estimated repair duration [IMG] (p117)</p></div></div></body></div>`)[0];

                var html_7e9020c29e1a3517e98a4d5392a8df7d = $(`<div id="html_7e9020c29e1a3517e98a4d5392a8df7d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Aire and Calder Canal</h1><div class="nugget-popup"><p>The canal was swollen by record flows in the adjacent River Aire, exceeded its channel capacity, and overtopped &mdash; flooding low&ndash;lying properties adjacent to the canal (including Hunslet Trading Estate). (p71)</p></div><div class="nugget-popup"><p>Inundation of the Aire Calder Navigation canal caused by the River Aire overtopping its banks; canal inundated as river levels exceeded channel capacity and drainage systems were surcharged. (p72)</p></div><div class="nugget-popup"><p>A syphon beneath the canal that discharges into the River Aire was rendered inoperable when record high River Aire levels occurred during 25 Dec 2015 &ndash; 29 Dec 2015, compromising surface&ndash;water drainage that drains towards the river until levels fell. (p73)</p></div><div class="nugget-popup"><p>The Aire and Calder Navigation canal was surcharged following the structural collapse at the Knostrop by&ndash;wash; water level rose above normal (normal 20.325m) to the wrack line (21.630m), exceeded channel capacity and overtopped, sending floodwater into adjacent low&ndash;lying areas including Haigh Park Road Industrial Estate and Thwaite Mill Industrial Museum. [IMG,PAG] (p78)</p></div><div class="nugget-popup"><p>The canal was surcharged after the structural collapse of the Knostrop by&ndash;wash channel embankment. The canal swelled beyond capacity and overtopped, sending floodwater into adjacent low&ndash;lying land and properties, including Thwaite Mill Industrial Museum and Haigh Park Road Industrial Estate. (p79)</p></div><div class="nugget-popup"><p>The Aire and Calder Navigation (running parallel to the River Aire) was implicated in the high water situation during 25 Dec 2015 &ndash; 29 Dec 2015; raised water levels contributed to fluvial backwater effects, preventing gravity discharge from surface water systems and contributing to localised flooding in low&ndash;lying areas of Woodlesford. (p83)</p></div><div class="nugget-popup"><p>The Aire & Calder Navigation became inundated and exceeded channel capacity (overtopped), surcharged by flows and contributed to flooding of low&ndash;lying properties adjacent to the canal; surcharging was also linked to an upstream structural collapse of the Knostrop by&ndash;wash embankment. [IMG,PAG] (p85)</p></div><div class="nugget-popup"><p>The Aire & Calder Navigation canal was inundated by the overtopping River Aire, exceeded its channel capacity, became surcharged (linked to upstream structural collapse at Knostrop) and overtopped, causing breaches and flooding of adjacent low&ndash;lying properties and land. (p86)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>normal water level 20.325m; wrack line 21.630m; surge height 1.305m; canal swollen by over 1300mm [IMG,PAG] (p78)</p></div><div class="nugget-popup quant"><p>over 1300mm [IMG] (p79)</p></div></div></body></div>`)[0];

                var html_e489b5b1da7ad949e0d5e9dacc55abb1 = $(`<div id="html_e489b5b1da7ad949e0d5e9dacc55abb1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Armley</h1><div class="nugget-popup"><p>Armley experienced the highest ever recorded flow in the River Aire on 27 December 2015, resulting in flood levels substantially above previous records. (p8)</p></div><div class="nugget-popup"><p>Armley experienced the highest ever recorded flow of the River Aire on 27 December 2015, producing flood levels around 1.2 m higher than the previous record. (p24)</p></div><div class="nugget-popup"><p>Urban flooding inundated the A65 in the Armley/Armley Mills area (photo evidence shows the A65 submerged and impassable), indicating significant transport disruption and floodwater reaching road and adjacent property levels. [IMG] (p62)</p></div><div class="nugget-popup"><p>Mapped overtopping flowpaths from the River Aire entered Armley during the event, indicating direct fluvial inundation of the area. [IMG] (p64)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 1.2m higher than the previous record (p8)</p></div><div class="nugget-popup quant"><p>approximately 1.2 m higher than the previous record; in excess of 0.5% (1 in 200) AEP (p24)</p></div><div class="nugget-popup quant"><p>1&ndash;18 properties (mapped as a smaller incident cluster); A65 road inundation (photo dated within the event period) [IMG] (p62)</p></div></div></body></div>`)[0];
                popup_9915af51f50b1a23ba9154ad7ab85240.setContent(html_e489b5b1da7ad949e0d5e9dacc55abb1);

                var html_1e9d3ef7f95ba033a0e2a6dc4b6e6439 = $(`<div id="html_1e9d3ef7f95ba033a0e2a6dc4b6e6439" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Collingham</h1><div class="nugget-popup"><p>The link between Collingham and Linton was affected when Linton Bridge (which links these places and to Wetherby) was flooded, disrupting connectivity on this route. (p8)</p></div><div class="nugget-popup"><p>Settlement on the River Wharfe named in the report as one of the communities affected by the main&ndash;river fluvial flood event. [PAG] (p16)</p></div><div class="nugget-popup"><p>Listed as one of the 13 focus areas (Wharfe, Collingham) and identified as among the worst&ndash;affected communities during the main river fluvial event; experienced flooding associated with the River Wharfe during the event. [PAG] (p17)</p></div><div class="nugget-popup"><p>Properties in Collingham experienced internal and external residential flooding: internal residential flooding to 15 properties; external residential flooding to 38 properties. Total 53 properties affected. [TAB] (p29)</p></div><div class="nugget-popup"><p>Sustained fluvial flooding from the Lower River Wharfe during the 25&ndash;29 Dec 2015 event (Boxing Day peak), with record river levels overtopping channels and inundating the community and local drainage infrastructure. (p111)</p></div><div class="nugget-popup"><p>Record high River Wharfe and elevated Collingham Beck levels caused localised flooding of low&ndash;lying areas in the village; surface water drainage systems and the local pumping station(s) (The Avenue) were rendered inoperable until river levels dropped, and fluvial backwater and surcharge from high river/beck levels contributed to localised inundation. [PAG] (p113)</p></div><div class="nugget-popup"><p>Localised flooding of low&ndash;lying areas due to record&ndash;high River Wharfe and beck levels; surface water drainage systems and the pumping station at The Avenue were rendered inoperable until river levels subsided. Fluvial backwater and surcharge from high river/beck levels contributed to localised inundation. [IMG] (p114)</p></div><div class="nugget-popup"><p>Extensive fluvial (river) flooding within Flood Zone 3 of the River Wharfe caused internal and external residential flooding across the village, affecting homes including high&ndash;rise and multi&ndash;occupancy accommodation where present. [IMG,TAB,PAG] (p115)</p></div><div class="nugget-popup"><p>The River Wharfe came out of channel and breached flood defences, inundating adjacent floodplains, low&ndash;lying properties and amenity areas. Internal property flooding occurred (internal flood depths in some cases in excess of 2 m). Extensive garden flooding occurred; Millbeck Green reportedly narrowly avoided internal property flooding. [IMG,PAG] (p116)</p></div><div class="nugget-popup"><p>The River Wharfe came out of channel and breached/ overtopped flood defences, inundating adjacent flood plains, low&ndash;lying properties and amenity areas within Collingham. Internal flood depths in some properties exceeded 2 m. Linton Bridge (linking Collingham with Linton) suffered major flood damage: the south supporting pier settled by 200 mm, the bridge was closed to all users on 27 December 2015 (causing a 4 mile diversion for vehicles and no pedestrian diversion), and repair costs were estimated at about £4.3 million with repairs possibly taking 12 months. [IMG,PAG] (p117)</p></div><div class="nugget-popup"><p>Flood defences overtopped on The Avenue causing properties to flood; floodwater remained in the street until pumped out by the Fire Service. A flood warning was not issued to properties on Boxing Day because upstream alarms/telemetry did not trigger. [IMG,PAG] (p118)</p></div><div class="nugget-popup"><p>Flooding occurred in the village when river defences overtopped on The Avenue; floodwater persisted in the street and affected properties until pumped out by the Fire Service. (p119)</p></div><div class="nugget-popup"><p>Fluvial flooding from the River Wharfe overtopped channel capacity and exceeded local drainage standards, causing river levels to inundate the community; flood defences were overwhelmed by the event. [TAB,PAG] (p120)</p></div><div class="nugget-popup"><p>Collingham was affected by flooding in December 2015 (25 Dec 2015 &ndash; 29 Dec 2015), an event that led to multiple risk management authorities (including Leeds City Council, the Environment Agency and highways authorities) having flood risk management responsibilities for the area. [TAB,PAG] (p121)</p></div><div class="nugget-popup"><p>Fluvial flooding from the Lower River Wharfe overtopped the channel and inundated adjacent low&ndash;lying properties and amenity areas; the event produced the highest river levels on record and caused internal property flooding. (p127)</p></div><div class="nugget-popup"><p>During the 25&ndash;29 Dec 2015 event (Boxing Day) the Lower River Wharfe experienced its highest recorded levels, producing fluvial flooding in Collingham. Main river overtopping and very high river levels also surcharged surface water networks, causing drainage backup and local inundation beyond design capacity. (p134)</p></div><div class="nugget-popup"><p>Community experienced flooding prompting parish&ndash;level post&ndash;flood activity, promotion of help and support to victims, and liaison with the Environment Agency. (p290)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>15 internal residential; 38 external residential (total 53). [TAB] (p29)</p></div><div class="nugget-popup quant"><p>15 internal residential properties; 38 external residential properties; total 53 properties flooded [IMG,TAB,PAG] (p115)</p></div><div class="nugget-popup quant"><p>internal flood depths in excess of 2 m [IMG,PAG] (p116)</p></div><div class="nugget-popup quant"><p>internal flood depths in excess of 2 m; Linton Bridge south pier settled 200 mm; 4 mile vehicle diversion; estimated repair cost £4.3 million; repair duration estimate 12 months [IMG,PAG] (p117)</p></div><div class="nugget-popup quant"><p>14 properties flooded on The Avenue; floodwater remained in the street for 3 days [IMG,PAG] (p118)</p></div><div class="nugget-popup quant"><p>14 properties; 3 days (p119)</p></div><div class="nugget-popup quant"><p>1 in 50 standard of protection (local defences); highest ever recorded river levels [TAB,PAG] (p120)</p></div><div class="nugget-popup quant"><p>flood depths in some cases in excess of 2m; internal property flooding depths of 800mm recorded (p127)</p></div><div class="nugget-popup quant"><p>1 in 100 year event (1% AEP) affecting the Lower River Wharfe; highest recorded flood levels (p134)</p></div></div></body></div>`)[0];
                popup_110b2b9fb12d35ae84e8dc2461c8bd05.setContent(html_1e9d3ef7f95ba033a0e2a6dc4b6e6439);

                var html_dc6ee57162d37677ae2423e78371f518 = $(`<div id="html_dc6ee57162d37677ae2423e78371f518" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Linton</h1><div class="nugget-popup"><p>The link between Collingham and Linton was affected when Linton Bridge (which links these places and to Wetherby) was flooded, disrupting connectivity on this route. (p8)</p></div><div class="nugget-popup"><p>Isolated cases of internal property flooding and extensive garden flooding were reported in Linton Ings and Church Lane. [IMG,PAG] (p116)</p></div><div class="nugget-popup"><p>Communities were affected by the flood damage to Linton Bridge, which was closed for safety and assessment, disrupting access between Collingham and Linton and causing major vehicle diversions. (p118)</p></div><div class="nugget-popup"><p>Linton Bridge was badly damaged by river flooding during Storm Eva, affecting local connectivity and communities along the River Wharfe. [TAB] (p137)</p></div><div class="nugget-popup"><p>Infrastructure impact from flooding: Linton Bridge was closed for repair following the floods; a subsidised shuttle service was provided between Linton, Collingham and Wetherby while repairs continued. (p290)</p></div></div></body></div>`)[0];

                var html_7f813b76598187a99a5675fc11667762 = $(`<div id="html_7f813b76598187a99a5675fc11667762" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wetherby</h1><div class="nugget-popup"><p>Listed as part of the route connected by Linton Bridge, which was flooded; the flooding of that transport link affected connectivity to/from Wetherby during the event. (p8)</p></div><div class="nugget-popup"><p>Town adjacent to the River Wharfe that was affected by the main&ndash;river fluvial flooding during the reported event; identified as one of the worst&ndash;affected sub&ndash;areas (Wharfe, Wetherby). [PAG] (p16)</p></div><div class="nugget-popup"><p>Wetherby is listed as a Wharfe&ndash;focused sub&ndash;area and was impacted by fluvial flooding from the River Wharfe during the 25&ndash;29 Dec 2015 event. [IMG,PAG] (p17)</p></div><div class="nugget-popup"><p>Properties in Wetherby experienced internal and external flooding: internal residential flooding to 18 properties; external residential flooding to 2 properties; internal commercial flooding to 5 properties; external commercial flooding to 1 property. Total 26 properties affected. [TAB] (p29)</p></div><div class="nugget-popup"><p>Experienced fluvial flooding when the Lower River Wharfe reached its highest recorded levels on Boxing Day within the 25&ndash;29 Dec 2015 event, causing inundation and exceeding drainage design standards. (p111)</p></div><div class="nugget-popup"><p>Subject to highest recorded river levels that caused Main River overtopping and significant fluvial flooding; surface water drainage was surcharged by high river levels, worsening local flooding and causing drainage backup. (p120)</p></div><div class="nugget-popup"><p>River Wharfe overtopped its banks in the town centre; riverside pavilion (bandstand) was partially submerged and floodwater covered the riverbank area visible from the town. [IMG] (p122)</p></div><div class="nugget-popup"><p>Extensive river (fluvial) flooding within flood zone 3 led to internal and external residential and commercial flooding; high river levels stopped gravity discharge from surface water drains, causing localised inundation until river levels fell. [TAB,PAG] (p123)</p></div><div class="nugget-popup"><p>Internal and external property flooding concentrated adjacent to the River Wharfe in the town centre and downstream. Clusters of flooded properties were recorded near the river crossing, the sports field/Linton Ings area and along riverside streets; both internal (buildings) and external property flooding occurred. [IMG,PAG] (p124)</p></div><div class="nugget-popup"><p>The River Wharfe overtopped its channel and inundated adjacent floodplains, low&ndash;lying properties and amenity areas in Wetherby. Flood depths exceeded 2 m in places; internal property flood depths of 800 mm were recorded (and may have been greater for some households). The main flow routes were fluvial, inundating parks and built areas. [IMG,PAG] (p125)</p></div><div class="nugget-popup"><p>River Wharfe overtopped its channel and inundated adjacent flood plains, low&ndash;lying properties and amenity areas. Internal property flooding was recorded (water ingress up to 800 mm) and external flood depths in some locations exceeded 2 m. Significant debris and building&ndash;material removal occurred. [IMG,PAG] (p126)</p></div><div class="nugget-popup"><p>Wetherby experienced fluvial flooding from the River Wharfe; main flow routes inundated and low&ndash;lying properties and amenity areas were flooded. [PAG] (p127)</p></div><div class="nugget-popup"><p>River Wharfe overtopped causing river flooding in Wetherby; flood levels on Boxing Day (26 Dec 2015) were among the highest recorded and flooding exceeded existing drainage design standards. [TAB,PAG] (p128)</p></div><div class="nugget-popup"><p>Subject of December 2015 flooding (document references RMAs having responsibilities in Wetherby as a result of the December 2015 floods), indicating the town was affected by river flooding during the event. [PAG] (p129)</p></div><div class="nugget-popup"><p>On Boxing Day in the 25&ndash;29 Dec 2015 event the Lower River Wharfe reached record&ndash;high flows causing fluvial flooding in Wetherby. River overtopping and surcharging of surface water drainage led to backups via gullies and manholes and flooding that exceeded historical and design standards. (p134)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>18 internal residential; 2 external residential; 5 internal commercial; 1 external commercial (total 26). [TAB] (p29)</p></div><div class="nugget-popup quant"><p>1 riverside pavilion partially submerged [IMG] (p122)</p></div><div class="nugget-popup quant"><p>18 internal residential flooded; 2 external residential flooded; 5 internal commercial flooded; 1 external commercial flooded; total 26 properties flooded [TAB,PAG] (p123)</p></div><div class="nugget-popup quant"><p>Incidents per 250m grid square recorded in the map legend: 2&ndash;17; 18&ndash;46; 47&ndash;121; 122&ndash;205; 206&ndash;392 (graduated circles showing number of flooded properties/multi&ndash;occupancy incidents) [IMG,PAG] (p124)</p></div><div class="nugget-popup quant"><p>flood depths in excess of 2 m; internal property flooding depth of 800 mm [IMG,PAG] (p125)</p></div><div class="nugget-popup quant"><p>800 mm internal flood depth; flood depths in some locations &gt;2 m; 66 properties considered at risk; 44 properties registered to receive EA flood warnings [IMG,PAG] (p126)</p></div><div class="nugget-popup quant"><p>flood depths in excess of 2m; internal property flooding depth of 800mm [PAG] (p127)</p></div><div class="nugget-popup quant"><p>1 in 100 year event (1% AEP) affecting the Lower River Wharfe; highest recorded flood levels (p134)</p></div></div></body></div>`)[0];

                var html_f7e18527341e98df33cd2c87a97a7048 = $(`<div id="html_f7e18527341e98df33cd2c87a97a7048" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kirkstall</h1><div class="nugget-popup"><p>High River Aire flows and water that came out of channel upstream caused floodwater to flow down Kirkstall Road; flooding at Kirkstall disrupted rail lines (Airedale, Wharfedale and Leeds to Bradford Forster Square) and inundated electricity substations. [MUL] (p8)</p></div><div class="nugget-popup"><p>Named as a worst&ndash;affected sub&ndash;area (Aire, Kirkstall); experienced fluvial/main&ndash;river flooding impacting the local community and properties during 25&ndash;29 Dec 2015. (p16)</p></div><div class="nugget-popup"><p>Kirkstall experienced external residential flooding and internal/external commercial flooding recorded in the study. [TAB] (p29)</p></div><div class="nugget-popup"><p>Flooding caused disruption to major transport links &mdash; the A65 (Kirkstall / Wellington Street) was flooded, contributing to widespread transport disruption in Leeds city centre. (p32)</p></div><div class="nugget-popup"><p>A65 Kirkstall corridor experienced fluvial exceedance flows and acted as a pathway for aggregated overland flows. Onset of flooding to the A65 Kirkstall corridor began as early as 15:00 on 26/12. Prior to River Aire overtopping, properties were flooded by surcharging surface water drains and by groundwater rising through floors due to prolonged high river levels. (p40)</p></div><div class="nugget-popup"><p>Overtopping of the River Aire started in Kirkstall (upstream) and initiated the overland flow path into the city. Prior to overtopping, properties in the area were also flooded from surcharging surface water drains and from groundwater rising through floors due to sustained high river levels and back pressure. [IMG,PAG] (p41)</p></div><div class="nugget-popup"><p>Very high River Aire levels prevented free discharge from the surface water drainage, causing fluvial backwater and surcharge back pressures that produced extensive surface water flooding. A Yorkshire Water 1100 mm un&ndash;flapped surface water sewer contributed large volumes of floodwater onto Savins Mill Way. Photographic evidence shows severe nighttime flooding inundating the street in front of Kirkstall Bridge Shopping Park (Bridge Road), making the area inaccessible. [IMG] (p50)</p></div><div class="nugget-popup"><p>Extensive fluvial flooding (River Aire, flood zone 3) causing internal and external property flooding across Kirkstall, and widespread disruption to transport links and critical infrastructure (A65 Kirkstall Road, Airedale Line). Flooding also affected electricity substations contributing to loss of supply in the event area. [TAB,PAG] (p52)</p></div><div class="nugget-popup"><p>At least 96 properties in Kirkstall experienced internal flooding during the 25&ndash;29 December 2015 event; internal flood depths varied and are reported up to around 1500 mm. Photographs and map points show severe internal water ingress, mud and debris, and disrupted access within properties. [IMG] (p53)</p></div><div class="nugget-popup"><p>River Aire overtopped and breached private flood defences in multiple locations in Kirkstall, flooding the floodplain, inundating low&ndash;lying properties between the river and Kirkstall Road, flooding the Network Rail line, Morrison's supermarket car park, The Bridge Inn, Leeds rugby academy facility and St Ann's Mills. Flooding caused internal and external property damage to fixtures, fittings, furniture, building fabric, vehicles, lifts/elevators and utility supplies, with refurbishment taking months. [IMG,PAG] (p54)</p></div><div class="nugget-popup"><p>The River Aire came out of channel, overtopped banks and breached private defences. Floodwaters spilled into floodplains and across the Kirkstall area, inundating low&ndash;lying properties, the Kirkstall Bridge retail/Bridge Road area, and other local assets listed below, causing internal property damage to buildings, fixtures, fittings and contents. [IMG,PAG] (p55)</p></div><div class="nugget-popup"><p>The River Aire overtopped its banks and breached private flood defences in Kirkstall. Floodwater spilled into flood plains and onto the Network Rail line, directly inundating The Bridge Inn, the Leeds rugby academy facility, Morrison's supermarket car park, St Ann's Mills and low&ndash;lying properties between the river and Kirkstall Road. [IMG,PAG] (p56)</p></div><div class="nugget-popup"><p>Kirkstall was covered by a flood warning during the event with high risk of flooding; flooding arose from main river exceedance and surcharged surface water drainage leading to backup into drainage networks affecting properties. [PAG] (p57)</p></div><div class="nugget-popup"><p>Substantial fluvial (main river) flooding occurred in Kirkstall during the December 2015 event; the main river is identified as the source of flooding and Risk Management Authorities (LLFA, EA, WC) have flood risk management responsibilities for the area. [TAB,PAG] (p58)</p></div><div class="nugget-popup"><p>Urban/industrial areas (Kirkstall Industrial Park / Industrial Estate) were inundated &mdash; vehicles partially submerged and pedestrians wading through deep water &mdash; indicating severe urban flooding impacting businesses and transport within the industrial estate. [IMG,PAG] (p59)</p></div><div class="nugget-popup"><p>District experienced widespread disruption and flooding affecting transport links, leisure facilities, and residential and commercial properties associated with the fluvial event. (p60)</p></div><div class="nugget-popup"><p>Retaining wall collapse on the riverbank in Kirkstall. Two retaining walls alongside the river were recorded (one steel sheet&ndash;piled wall beneath a walkway and one stone/concrete wall); a collapsed retaining wall is noted in the Kirkstall section of the report in connection with the December 2015 river levels. (p213)</p></div><div class="nugget-popup"><p>Flooding from the River Aire inundated the electrical compound at Kirkstall, preventing safe access until pumping began on 28 Dec 2015; access was enabled on 29 Dec 2015 to allow electrical repair work. Flood water and debris contaminated switchgear, cable terminations, busbars and housings, and protection control and relay panels required replacement on all feeders. Road and bridge damage in the area severely hampered restoration and many customers were displaced. (p227)</p></div><div class="nugget-popup"><p>Flood water at Kirkstall on the evening of 26 December 2015 caused damage to a Remote Terminal Unit, producing a communications failure that prevented alarms reaching Yorkshire Control's NMS. (p233)</p></div><div class="nugget-popup"><p>Commercial premises in Kirkstall were flooded; volunteer groups carried out repeated clean&ndash;ups of the River Aire banks and supported recovery activities. Flooding limited access by some flooded premises to certain grant schemes because they were commercial properties. (p290)</p></div><div class="nugget-popup"><p>Flooding in this area affected businesses on the flood plain &mdash; notably the closure of Thyssen Krupp Woodhead on Kirkstall Road &mdash; damaging commercial premises, undermining investment confidence and contributing to business closure and job losses. (p292)</p></div><div class="nugget-popup"><p>Flooding along the River Aire affected businesses in parts of Kirkstall, causing visual amenity issues that reduced trade and harmed inward investment prospects; targeted river clean&ndash;up activity and recovery grants were proposed for these businesses. [PAG] (p293)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>27,000 properties [MUL] (p8)</p></div><div class="nugget-popup quant"><p>0 internal residential; 45 external residential; 36 internal commercial; 15 external commercial; total 96. [TAB] (p29)</p></div><div class="nugget-popup quant"><p>96 properties; 0 internal residential; 45 external residential; 36 internal commercial; 15 external commercial; flood depths up to 1500mm; 27,000 properties loss of electricity (area&ndash;wide) [TAB,PAG] (p52)</p></div><div class="nugget-popup quant"><p>96 properties; up to 1500 mm internal flood depth [IMG] (p53)</p></div><div class="nugget-popup quant"><p>Flooding incidents concentrated in Kirkstall with the largest 250m grid squares falling in the 206&ndash;592 incidents bin (map legend ranges) [IMG,PAG] (p54)</p></div><div class="nugget-popup quant"><p>1 flood warning covering Kirkstall; 1337 properties considered at risk; 181 properties registered to receive Environment Agency direct flood warnings [PAG] (p57)</p></div><div class="nugget-popup quant"><p>20 EHV/HV incidents (p227)</p></div><div class="nugget-popup quant"><p>1 business closure; 93 skilled engineering jobs lost (p292)</p></div></div></body></div>`)[0];

                var html_6dc51976ed1fe975e3e73f521a878d53 = $(`<div id="html_6dc51976ed1fe975e3e73f521a878d53" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Thorp Arch</h1><div class="nugget-popup"><p>Thorp Arch (on the River Wharfe) is included in the report's affected areas (listed in sub&ndash;area 'Wharfe, Thorp Arch and Boston Spa') and was impacted by the Main River fluvial flooding associated with the 25&ndash;29 Dec 2015 event. (p16)</p></div><div class="nugget-popup"><p>Named within focus area 13 ('Wharfe, Thorp Arch and Boston Spa') and identified as one of the worst&ndash;affected communities during the main river fluvial event; experienced flooding associated with the River Wharfe during the event. (p17)</p></div><div class="nugget-popup"><p>Thorpe Arch is reported in a combined entry with Boston Spa: combined impacts for Thorpe Arch and Boston Spa are 7 internal residential floodings and 25 external residential floodings (no commercial floodings reported), total 32 properties affected across the combined area. [TAB] (p29)</p></div><div class="nugget-popup"><p>Impacted by fluvial flooding from the Lower River Wharfe during the 25&ndash;29 Dec 2015 event (Boxing Day), with record&ndash;high river levels overtopping banks and affecting the locality and drainage systems. (p111)</p></div><div class="nugget-popup"><p>Impacted by highest&ndash;ever river levels on the Lower River Wharfe causing Main River overtopping and fluvial flooding; surface water drainage was surcharged, contributing to local flooding and drainage failures. (p120)</p></div><div class="nugget-popup"><p>Fluvial flooding from the Lower River Wharfe overtopped the channel and inundated adjacent low&ndash;lying properties and amenity areas; the community was affected by the highest recorded river levels causing inundation and internal flooding. (p127)</p></div><div class="nugget-popup"><p>The River Wharfe overtopped its banks on 26 December 2015, inundating residential areas, roads, gardens and lower levels of houses in Thorp Arch; trees and lamp posts were partially submerged, causing significant disruption and property flooding. [IMG] (p129)</p></div><div class="nugget-popup"><p>Extensive fluvial flooding from the River Wharfe affected flood zone 3 locations in the village, leading to internal and external residential inundation and contributing to localised surcharge of surface water drainage. [TAB,PAG] (p130)</p></div><div class="nugget-popup"><p>River Wharfe overtopped its channel, inundating adjacent floodplain and low&ndash;lying properties in Thorp Arch, causing internal flooding of properties. [IMG,PAG] (p131)</p></div><div class="nugget-popup"><p>The River Wharfe came out of its channel, overtopping and inundating adjacent flood plains and low&ndash;lying properties in Thorp Arch. Properties experienced verified internal flooding with substantial internal damage; household items were removed from buildings during recovery. [IMG,PAG] (p132)</p></div><div class="nugget-popup"><p>Floodwaters from the River Wharfe overtopped its channel and inundated adjacent flood plains and low&ndash;lying residential areas in Thorp Arch. Streets, gardens and garages were submerged and water approached or entered houses; residential access was impeded and properties suffered internal inundation. [PAG] (p133)</p></div><div class="nugget-popup"><p>On Boxing Day as part of the 25&ndash;29 Dec 2015 event the Lower River Wharfe reached its highest recorded levels and caused fluvial flooding in Thorp Arch. Main river overtopping and surcharged surface water drainage produced backups through gullies and manholes and inundation that exceeded drainage design standards. [TAB,PAG] (p134)</p></div><div class="nugget-popup"><p>Experienced flooding during 25&ndash;29 December 2015; the December 2015 event led to flood risk management responsibilities being allocated to multiple RMAs for Thorp Arch. [PAG] (p135)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>7 internal residential; 25 external residential (Thorpe Arch and Boston Spa combined; total 32). [TAB] (p29)</p></div><div class="nugget-popup quant"><p>flood depths in some cases in excess of 2m; internal property flooding depths of 800mm recorded (p127)</p></div><div class="nugget-popup quant"><p>Part of the Thorp Arch and Boston Spa total of 32 properties flooded (7 internal residential; 25 external residential; 0 internal commercial; 0 external commercial). [TAB,PAG] (p130)</p></div><div class="nugget-popup quant"><p>verified internal flood depths 500mm to 1500mm [IMG,PAG] (p131)</p></div><div class="nugget-popup quant"><p>internal flood depths 500 mm to 1500 mm; interior water mark approx 300&ndash;400 mm [IMG,PAG] (p132)</p></div><div class="nugget-popup quant"><p>internal flood depths 500mm to 1500mm [PAG] (p133)</p></div><div class="nugget-popup quant"><p>1 in 100 year event (1% AEP) affecting the Lower River Wharfe; highest recorded flood levels [TAB,PAG] (p134)</p></div></div></body></div>`)[0];

                var html_b9d779cdbf4c3593755962cde5d2a14b = $(`<div id="html_b9d779cdbf4c3593755962cde5d2a14b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Allerton Bywater</h1><div class="nugget-popup"><p>Listed as one of the 13 sub&ndash;areas representing the worst&ndash;affected communities; affected by fluvial (Main River) flooding associated with the River Aire during the flood event of 25 to 29 Dec 2015. (p16)</p></div><div class="nugget-popup"><p>Flooding affected both residential and commercial properties in Allerton Bywater, with internal and external residential flooding and internal commercial flooding recorded. [TAB] (p29)</p></div><div class="nugget-popup"><p>Section heading for Allerton Bywater lists categories for internal and external residential and commercial flooding, indicating properties in the settlement experienced internal/external flooding. (p30)</p></div><div class="nugget-popup"><p>Allerton Ings (washlands at Allerton Bywater) acted as temporary flood storage, holding floodwater from high river flows and then emptying as river levels fell, thereby interacting with other storage areas during the event. [PAG] (p90)</p></div><div class="nugget-popup"><p>Experienced high river/flood levels during the event but benefited from St Aidan's and associated washlands; St Aidan's operation reduced flood levels (modelled) by around 500 mm at Allerton Bywater, lowering risk of severe inundation. (p91)</p></div><div class="nugget-popup"><p>Station Road was submerged and rendered impassable on 28 December 2015; Barnsdale Road area routinely floods when the River Aire spills into Allerton Ings. Floodwater reached and partially inundated road signs and extended close to residential buildings. Recent embankments and attenuation measures have reduced the number of properties directly affected over time. [IMG] (p97)</p></div><div class="nugget-popup"><p>Allerton Ings at Allerton Bywater acted as temporary flood storage during 25 Dec 2015 &ndash; 29 Dec 2015, reducing the extent of inundation to the village; the combined effect of St Aidan's and the washlands is modelled to have prevented large&ndash;scale property flooding downstream. [PAG] (p99)</p></div><div class="nugget-popup"><p>Extensive fluvial flooding within flood zone 3 from the Rivers Aire and Calder caused property flooding in Allerton Bywater, including internal and external residential flooding and internal commercial flooding; high&ndash;rise and multi&ndash;occupancy accommodation were affected where present. [TAB,PAG] (p101)</p></div><div class="nugget-popup"><p>Fluvial (river) flooding during 25 Dec 2015 &ndash; 29 Dec 2015. The River Aire and River Calder overtopped their channels into St Aidan's and associated washland flood storage areas, leading to internal and external property flooding concentrated in the Flood Zone 3 area around Allerton Bywater (clusters of property&ndash;flooding incidents recorded). [IMG,PAG] (p102)</p></div><div class="nugget-popup"><p>Fluvial flooding affected Allerton Bywater: the River Aire and River Calder overtopped and produced overland flow routes that inundated low&ndash;lying areas and caused isolated properties to flood (notably properties along Barnsdale Road). [IMG] (p103)</p></div><div class="nugget-popup"><p>Main River (fluvial) flooding overtopped channel capacity and caused fluvial flooding in Allerton Bywater. High river levels also surcharged conventional surface water drainage, preventing free discharge and causing backing up through road gullies, manhole chambers and private drainage systems. [TAB] (p104)</p></div><div class="nugget-popup"><p>Community is planning to launch a flood action group in response to flooding and is receiving support and advice from Garforth Flood Action Group to improve resilience. (p289)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 internal residential flooding; 2 external residential flooding; 7 internal commercial flooding; 0 external commercial flooding; total 11 incidents [TAB] (p29)</p></div><div class="nugget-popup quant"><p>around 500 mm reduction in flood level at Allerton Bywater; 1289 properties saved (modelled estimate for combined effect across Woodlesford&ndash;Castleford) (p91)</p></div><div class="nugget-popup quant"><p>1289 properties [PAG] (p99)</p></div><div class="nugget-popup quant"><p>2 internal residential properties; 2 external residential properties; 7 internal commercial properties; 0 external commercial properties; 11 properties total [TAB,PAG] (p101)</p></div></div></body></div>`)[0];

d external residential flooding and preventing gravity discharge of local surface water drainage until river levels fell. [TAB,PAG] (p130)</p></div><div class="nugget-popup"><p>Affected by River Wharfe leaving channel and inundating the floodplain; properties in Boston Spa suffered internal flooding. [IMG,PAG] (p131)</p></div><div class="nugget-popup"><p>The River Wharfe overtopped and produced overland flow routes through Boston Spa, inundating low&ndash;lying properties and adjacent floodplain areas; internal flooding and collateral damage to properties were recorded. [IMG,PAG] (p132)</p></div><div class="nugget-popup"><p>Floodwaters from the River Wharfe overtopped and inundated adjacent flood plains and low&ndash;lying residential areas in Boston Spa. Streets, gardens and garages were submerged; water reached up to house entrances and caused internal flooding of properties. [PAG] (p133)</p></div><div class="nugget-popup"><p>Fluvial (main river) flooding is identified as a source of flooding for Boston Spa/Thorp Arch during the December event; main river overtopping and surcharged drainage contributed to flooding in Boston Spa. [TAB] (p134)</p></div><div class="nugget-popup"><p>Experienced flooding during 25&ndash;29 December 2015; the December 2015 event led to flood risk management responsibilities being allocated to multiple RMAs for Boston Spa. [PAG] (p135)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>7 internal residential; 25 external residential (Thorpe Arch and Boston Spa combined; total 32). [TAB] (p29)</p></div><div class="nugget-popup quant"><p>flood depths in some cases in excess of 2m; internal property flooding depths of 800mm recorded (p127)</p></div><div class="nugget-popup quant"><p>Part of the Thorp Arch and Boston Spa total of 32 properties flooded (7 internal residential; 25 external residential; 0 internal commercial; 0 external commercial). [TAB,PAG] (p130)</p></div><div class="nugget-popup quant"><p>verified internal flood depths 500mm to 1500mm [IMG,PAG] (p131)</p></div><div class="nugget-popup quant"><p>internal flood depths 500 mm to 1500 mm [IMG,PAG] (p132)</p></div><div class="nugget-popup quant"><p>internal flood depths 500mm to 1500mm [PAG] (p133)</p></div><div class="nugget-popup quant"><p>1 in 100 year event (1% AEP) affecting the Lower River Wharfe; highest recorded flood levels [TAB,PAG] (p134)</p></div></div></body></div>`)[0];

                var html_993d8658df5423240c1bdb3470c911d3 = $(`<div id="html_993d8658df5423240c1bdb3470c911d3" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Newlay</h1><div class="nugget-popup"><p>Listed as one of the worst&ndash;affected sub&ndash;areas (Aire, Newlay) in the Leeds investigation; experienced fluvial/main&ndash;river related flooding during the 25&ndash;29 Dec 2015 event that affected communities and properties. (p16)</p></div><div class="nugget-popup"><p>Newlay experienced internal and external residential flooding and internal commercial flooding according to the table. [TAB] (p29)</p></div><div class="nugget-popup"><p>The River Aire came out of channel, overtopped and inundated adjacent residential properties in Newlay, producing internal flooding and flood damage to properties. Verified internal flood depths vary from 800 mm to 1100 mm. The local flood warning area covers 47 properties considered to be at risk. [PAG] (p48)</p></div><div class="nugget-popup"><p>For Newlay (Horsforth) the source table identifies Fluvial (Main River) flooding. Main River overtopping occurred as channel capacity was exceeded; high river levels surcharged conventional surface water drainage preventing free discharge and causing backup through road gullies, manhole chambers and private drainage systems. [TAB] (p49)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 internal residential; 4 external residential; 1 internal commercial; 0 external commercial; total 10. [TAB] (p29)</p></div><div class="nugget-popup quant"><p>47 properties; 7 properties registered to receive flood warnings; internal flood depths 800 mm to 1100 mm [PAG] (p48)</p></div></div></body></div>`)[0];

                var html_fffa5b85d8aa3094aa7466876c0b82f2 = $(`<div id="html_fffa5b85d8aa3094aa7466876c0b82f2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Burley</h1><div class="nugget-popup"><p>Listed as a worst&ndash;affected sub&ndash;area (Aire, Burley); subject to fluvial/main&ndash;river flooding during the 25&ndash;29 Dec 2015 event that affected properties and urban areas. (p16)</p></div><div class="nugget-popup"><p>Burley sustained internal residential flooding and substantial internal commercial flooding as reported. [TAB] (p29)</p></div><div class="nugget-popup"><p>Widespread flooding and disruption in the Burley district associated with the River Aire flood event, including impacts to transport links and critical infrastructure. (p52)</p></div><div class="nugget-popup"><p>High (record) River Aire levels prevented free discharge from the surface water drainage system and produced fluvial backwater. This caused surcharge/back pressure in surface water systems and led to extensive flooding in the area; use of flap valves was noted as a possible mitigant. (p59)</p></div><div class="nugget-popup"><p>Extensive fluvial (River Aire) flooding and associated surface&ndash;water/area flooding caused internal and external flooding of residential and commercial properties; constrained surface water drainage due to record high river levels and fluvial backwater/surcharge increased area flooding; verified internal flood depths of 840mm to 1540mm. [TAB,PAG] (p60)</p></div><div class="nugget-popup"><p>Extensive internal property flooding: at least 303 properties in Burley were flood&ndash;affected during the event, including indirect impacts to high&ndash;rise accommodation. Verified internal flood depths recorded in properties ranged from 840 mm to 1,540 mm; area flooding remote to properties is reported to have been even deeper. [IMG,PAG] (p61)</p></div><div class="nugget-popup"><p>River Aire overtopped and breached informal private flood defences in Burley, spilling onto the A65 (Kirkstall Road) and adjacent side roads. This caused internal and external property flooding with major damage to fixtures, fittings, furniture, building fabric, vehicles, lifts/elevators and utility supplies; properties required months of refurbishment. [IMG,PAG] (p62)</p></div><div class="nugget-popup"><p>Fluvial flooding caused by the River Aire overtopping and breaching informal private defences, resulting in inundation across Burley; floodwaters spilled onto the A65 (Kirkstall Road) and into side streets, with aggregated flow continuing towards Leeds city centre. [PAG] (p63)</p></div><div class="nugget-popup"><p>Burley was affected by overtopping flows from the River Aire; flood flow routes and overtopped fluvial flows are shown concentrated in the Burley corridor, and a severe flood warning was issued for the area (Cardigan Fields Leisure Park and Kirkstall Works between Viaduct Road and City Gate). [IMG,PAG] (p64)</p></div><div class="nugget-popup"><p>Burley was the subject of a severe flood warning issued at 10:16 on 26 December 2015; the report lists local sources of flooding as fluvial (main river and ordinary watercourse), surface water (including on the highway), groundwater and sewer flooding. [PAG] (p65)</p></div><div class="nugget-popup"><p>Main&ndash;river (fluvial) flooding affected the Burley area during the December 2015 event; Burley is identified as having been impacted by fluvial (main river) flooding. [TAB] (p66)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8 internal residential; 0 external residential; 279 internal commercial; 16 external commercial; total 303. [TAB] (p29)</p></div><div class="nugget-popup quant"><p>303 properties total; 8 internal residential properties; 0 external residential; 279 internal commercial properties; 16 external commercial properties; verified internal flood depths 840mm to 1540mm. [TAB,PAG] (p60)</p></div><div class="nugget-popup quant"><p>303 properties; internal flood depths 840 mm, 970 mm, 1540 mm [IMG,PAG] (p61)</p></div><div class="nugget-popup quant"><p>1&ndash;18 properties (mapped as a smaller incident cluster) [IMG,PAG] (p62)</p></div></div></body></div>`)[0];

                var html_9dab509358c4659780fc8de667234111 = $(`<div id="html_9dab509358c4659780fc8de667234111" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Thwaite Gate</h1><div class="nugget-popup"><p>Part of the sub&ndash;area 'Aire, Thwaite Gate and Hunslet' identified as among the worst affected; experienced fluvial/main&ndash;river related flooding during 25&ndash;29 Dec 2015 impacting communities and properties. (p16)</p></div><div class="nugget-popup"><p>Thwaite Gate (presented together with Hunslet) experienced large numbers of external residential flood incidents plus internal residential and commercial flooding. [TAB] (p29)</p></div><div class="nugget-popup"><p>Localised flooding occurred in low&ndash;lying areas influenced by record high River Aire levels. Surface water drainage systems draining toward the river (including the nearby pumping station) were rendered inoperable until river levels subsided; surface water systems may also have suffered surcharge/backpressure contributing to localised flooding. Flooding subsided once river levels dropped and gravity discharge was restored. [PAG] (p67)</p></div><div class="nugget-popup"><p>Extensive fluvial flooding causing internal and external residential and commercial property flooding. Record&ndash;high River Aire levels produced backwater/surcharge on surface water drainage (and nearby pumping station), rendering systems inoperable until river levels fell; flooding subsided once gravity discharge was restored. [PAG] (p68)</p></div><div class="nugget-popup"><p>Internal and external property flooding within the mapped flood extent during the event; incidents clustered adjacent to the river and within the Flood Zone 3 floodplain. [IMG] (p69)</p></div><div class="nugget-popup"><p>Flooding in Thwaite Gate was driven primarily by fluvial sources with overland flow routes mapped (figure 83), causing inundation along the identified flow paths. [PAG] (p70)</p></div><div class="nugget-popup"><p>Fluvial flooding affected Thwaite Gate as part of the main flow routes in the area; rivers overtopped and high river levels surcharged drainage systems causing floodwater to inundate low&ndash;lying areas. [PAG] (p71)</p></div><div class="nugget-popup"><p>Fluvial flooding from Main Rivers (River Aire) overtopped channel capacity in the Thwaite Gate area, exacerbating surface water drainage surcharge and causing backups into road gullies, manholes and private drainage systems. [TAB] (p72)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>60 internal residential; 1051 external residential; 49 internal commercial; 10 external commercial; total 1170. [TAB] (p29)</p></div><div class="nugget-popup quant"><p>60 internal residential; 1051 external residential; 49 internal commercial; 10 external commercial; 1170 total properties (these totals are for Thwaite Gate and Hunslet combined) [PAG] (p68)</p></div></div></body></div>`)[0];
