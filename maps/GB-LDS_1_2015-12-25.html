                var html_30d344a82bdd36c4f6440bcb8a399c02 = $(`<div id="html_30d344a82bdd36c4f6440bcb8a399c02" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Haigh Park Road Industrial Estate</h1><div class="nugget-popup"><p>Severe flooding on 27 December 2015 inundated the industrial estate road, with floodwater covering the entire road and reaching approximately waist height for a person, disrupting business operations and affecting industrial property. [IMG,MUL] (p73)</p></div><div class="nugget-popup"><p>Extensive fluvial (River Aire) flooding inundated commercial/industrial premises in this estate; area identified among the worst affected in Stourton. (p75)</p></div><div class="nugget-popup"><p>Floodwater from the surcharged Aire and Calder Navigation canal overtopped and flowed into the low&ndash;lying industrial estate, flooding properties and units within the estate. [IMG,PAG] (p78)</p></div><div class="nugget-popup"><p>Flooding from the Aire Calder Navigation canal overtopping (after the Knostrop by&ndash;wash embankment collapse) inundated low&ndash;lying areas of Haigh Park Road Industrial Estate. [PAG] (p79)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>36 internal commercial floods; 4 external commercial floods; 40 properties total (Stourton) (p75)</p></div><div class="nugget-popup quant"><p>surge height 1.305m; canal swollen by over 1300mm [IMG,PAG] (p78)</p></div></div></body></div>`)[0];

                var html_9d983f08e6fc45528eeef56cf5a3288c = $(`<div id="html_9d983f08e6fc45528eeef56cf5a3288c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>UK</h1><div class="nugget-popup"><p>Many locations in the north and northwest recorded highest&ndash;ever river flood levels on the Rivers Aire, Wharfe and Calder. The River Aire at Armley recorded its highest&ndash;ever flow on 27 December 2015, producing flood levels in some locations approximately 1.2 m higher than the previous record (autumn 2000). The event was estimated to exceed a 0.5% (1 in 200) AEP based on river flow. [PAG,MUL] (p24)</p></div></div></body></div>`)[0];

                var html_e8fc0840c98c00e8984f19424f283b48 = $(`<div id="html_e8fc0840c98c00e8984f19424f283b48" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Pottery Field</h1><div class="nugget-popup"><p>Property flooding (internal and external) affected properties adjacent to the river corridor at and immediately north of Pottery Field; incidents cluster within the Flood Zone 3 extent and form one of the largest concentrations of flooded properties in the mapped area. [IMG] (p69)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>206&ndash;592 properties [IMG] (p69)</p></div></div></body></div>`)[0];

                var html_a61edbde9e5f4f9ccd8fc205d7ab4931 = $(`<div id="html_a61edbde9e5f4f9ccd8fc205d7ab4931" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Allerton Ings</h1><div class="nugget-popup"><p>Allerton Ings functions as a flood storage area designed to hold water back during high flows; during record high river levels the Ings would have stored and routed floodwater via designed spillways to reduce flood impact on properties. [IMG] (p89)</p></div><div class="nugget-popup"><p>Functioned as natural floodplain storage during the event, holding water at times of high River Calder flow and helping to reduce downstream flood levels as part of the washlands system. (p91)</p></div><div class="nugget-popup"><p>Allerton Ings at Allerton Bywater filled as a washland during the extreme flood of 25 Dec 2015 &ndash; 29 Dec 2015, acting as temporary storage and contributing to reduced flooding of Allerton Bywater and downstream areas. (p99)</p></div><div class="nugget-popup"><p>Allerton Ings came into operation as floodplain storage during fluvial flooding, inundating the low&ndash;lying area and contributing to inundation of Barnsdale Road and nearby areas (acting under River Aire flows and when backed up by River Calder). [PAG] (p101)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1289 properties saved (modelled estimate for combined effect of St Aidan's and associated washlands between Woodlesford and Castleford) (p91)</p></div><div class="nugget-popup quant"><p>1289 properties (p99)</p></div></div></body></div>`)[0];

                var html_1f15d7d987584764eed7cfeb7dd93ff8 = $(`<div id="html_1f15d7d987584764eed7cfeb7dd93ff8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Linton Ings</h1><div class="nugget-popup"><p>Isolated cases of internal property flooding were reported and extensive garden flooding occurred in the Linton Ings area due to overbank flows from the River Wharfe. (p117)</p></div><div class="nugget-popup"><p>Flooding from the River Wharfe caused clusters of internal and external property flooding adjacent to Linton Ings. The map shows the largest number of flooded properties occurring in grid squares next to Linton Ings and the nearby sports field, indicating heavy riverside inundation of properties and land. [IMG] (p124)</p></div></div></body></div>`)[0];

                var html_107a431445b6590232ec85359f0d5b6a = $(`<div id="html_107a431445b6590232ec85359f0d5b6a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Leeds Metropolitan District</h1><div class="nugget-popup"><p>Widespread inundation of urban areas: streets, parking lots and building perimeters in both residential neighborhoods and industrial/commercial zones, with visible flooding around a church/spired building; transportation routes and access within the photographed area were disrupted. [MUL] (p1)</p></div><div class="nugget-popup"><p>The city was hit by devastating, unprecedented flooding causing considerable damage across Leeds, affecting road networks, power supplies and residents' properties and possessions and prompting major recovery efforts. (p4)</p></div><div class="nugget-popup"><p>Unprecedented flooding across the Leeds district (25&ndash;29 December 2015) had devastating consequences for residents, businesses and communities; some homeowners/tenants remained unable to return while repair works continued, and the flooding had a major impact on businesses and jobs with some businesses moving operations out of the area and out of the UK. [PAG] (p7)</p></div><div class="nugget-popup"><p>Widespread flooding across the district during the event causing significant disruption to residents, businesses and communities; major transport links and critical infrastructure were flooded or disrupted (including A65 Kirkstall Road, Linton Bridge, Network Rail lines at Kirkstall, Northern Power Grid substations and IT/data centres). [PAG] (p8)</p></div><div class="nugget-popup"><p>Leeds city (located on the River Aire and affected by the River Calder and tributaries) experienced river and urban flooding during Storm Eva; Leeds city centre and neighbouring areas were particularly vulnerable and suffered severe impacts including inundation of communities and disruption to transport and key sites. High&ndash;rise and multi&ndash;occupancy buildings in the city suffered indirect impacts (stranded cars in basements, disabled lifts, power outages) that caused severe inconvenience and loss to residents and businesses. [PAG] (p9)</p></div><div class="nugget-popup"><p>Widespread flooding across the metropolitan district: 4,712 reported flooding incidents (internal and external), including 2,826 affected by internal flooding; property damage to homes and businesses, some buildings left empty or undergoing remediation; indirect impacts to high&ndash;rise/multiple&ndash;occupancy buildings (e.g. cars stranded in basement car parks, lifts incapacitated, power outages); businesses ruined and many homeowners displaced into temporary accommodation. [PAG] (p10)</p></div><div class="nugget-popup"><p>Severe flooding affected the wider Leeds district. (p11)</p></div><div class="nugget-popup"><p>Leeds city centre and other parts of the city were affected by fluvial flooding driven by Main Rivers (notably the River Aire) during the event. [PAG] (p16)</p></div><div class="nugget-popup"><p>Areas adjacent to the River Aire in Leeds City Centre were affected by fluvial flooding during the 25&ndash;29 Dec 2015 event; Leeds City Centre is listed as an Aire&ndash;focused sub&ndash;area in the Section 19 report. [PAG] (p17)</p></div><div class="nugget-popup"><p>Affected by the Boxing Day floods (downstream impacts from extreme rainfall and saturated ground); included among communities impacted by the Boxing Day/late&ndash;December 2015 flooding. (p25)</p></div><div class="nugget-popup"><p>Metropolitan district extensively impacted by flooding attributed predominantly to the Rivers Aire and Wharfe. Impacts included internal and external flooding of properties, indirect impacts to high&ndash;rise multi&ndash;occupancy buildings (e.g. basement car parks flooded leaving cars stranded, access/utility failures such as lifts incapacitated and power outages), and buildings remaining empty or undergoing remediation. (p27)</p></div><div class="nugget-popup"><p>Verified property flooding across the 13 study areas in the Leeds Metropolitan District: 2,826 properties suffered internal flooding and 1,886 properties suffered external flooding. Table 3a summarizes impacts by use: total flooded 673 properties, 2,212 properties affected, 483 severely affected, total properties impacted 3,368. Breakdowns include residential total 2,683 (298 flooded, 1,902 affected, 483 severely affected), houses total 367 (242 flooded, 125 affected), flats total 2,316 (56 flooded, 1,777 affected, 483 severely affected), commercial total 678 (371 flooded, 307 affected), other (churches, allotments, sports clubs) total 7 (4 flooded, 3 affected). [TAB] (p28)</p></div><div class="nugget-popup"><p>Properties in Leeds City Centre experienced internal residential flooding and both external residential and internal/external commercial flooding as recorded in the study. [TAB] (p29)</p></div><div class="nugget-popup"><p>Significant flooding from the afternoon of 26 December into 27 December 2015 causing widespread disruption; major transport links were flooded (including the A65 Kirkstall / Wellington Street); critical infrastructure including electricity substations and IT, communications and data centres were affected; surface water drainage could not discharge to the river leading to surcharge/back pressures and area flooding which subsided once river levels dropped. (p32)</p></div><div class="nugget-popup"><p>Extensive fluvial (river) flooding and constrained surface water drainage caused widespread internal and external flooding of residential and commercial properties; deep 'area flooding' occurred when surface water could not discharge to the river, and subsided only when river levels dropped. Roads and rail exits were cut off, trapping office workers in the city centre. [TAB,PAG] (p33)</p></div><div class="nugget-popup"><p>Widespread property flooding across the city centre during Storm Eva caused major damage to internal fixtures, fittings, building fabric, vehicles, lifts/elevators and utility supplies; flooding incidents were concentrated along the River Aire and in Flood Zone 3, with major disruption and lengthy refurbishment required for affected properties. [IMG,PAG] (p35)</p></div><div class="nugget-popup"><p>Fluvial flooding from the River Aire overtopping its channel across central Leeds. River overtopping produced overland flow routes and directly flooded multiple locations in the city centre (examples listed in the report): Little Neville Street (Direct Line Group offices and nearby high&ndash;rise apartments), Bridge End/Meadow Lane (offices, Navigation Walk, Dock Street), Turlow Court (residential areas), Neptune Street (residential and commercial properties), Clarence Road (Leeds Assisted Living, nearby commercial properties and Armouries Drive) and low&ndash;lying properties along Sovereign Street. The event rendered offices and residential properties inaccessible and caused significant property inundation. [IMG] (p36)</p></div><div class="nugget-popup"><p>Roads acted as pathways for fluvial exceedance flows from remote river escapes upstream of the city centre; these aggregated flows caused urban flooding across the centre and contributed to property and road flooding. (p40)</p></div><div class="nugget-popup"><p>Fluvial exceedance flows from the River Aire overtopping in Kirkstall flowed southeast into Leeds city centre, inundating large parts of the central area and flooding thousands of properties, with people&#8217;s lives put at risk. [IMG,PAG] (p41)</p></div><div class="nugget-popup"><p>Leeds City Centre was inundated by the fluvial exceedance flow from the River Aire, flooding streets and thousands of properties and placing life at risk. [PAG] (p42)</p></div><div class="nugget-popup"><p>Leeds city centre experienced widespread fluvial flooding from main rivers overtopping due to exceeded channel capacity; high river levels surcharged conventional surface water drainage systems, preventing free discharge and causing backing up through road gullies, manhole chambers and private drainage. Specific flooded locations in the city centre are referenced (e.g. Northern St flooded 28/12 09:43; Wellington Place shown flooded in social media image). [PAG] (p43)</p></div><div class="nugget-popup"><p>Extensive fluvial flooding from the River Aire (flood zone 3) caused widespread disruption across Leeds districts (notably Kirkstall and Burley), flooding major transport links and critical infrastructure and leading to property flooding. (p52)</p></div><div class="nugget-popup"><p>Electrical supply disruption associated with the storm/flood event: loss of electricity supply to 27,000 properties from 20:11 on 26 December 2015 linked to Northern Power Grid sub&ndash;station issues reported in the context of the event. [IMG] (p53)</p></div><div class="nugget-popup"><p>Flooding concentrated along the River Aire within the Leeds extent &mdash; notably Kirkstall &mdash; resulting in numerous property flood incidents, inundation of transport infrastructure (Network Rail tracks) and damage to commercial premises and residences. [IMG,PAG] (p54)</p></div><div class="nugget-popup"><p>The River Aire overtopped its banks and breached private flood defences in Kirkstall, causing overland fluvial flow into floodplains and infrastructure. Floodwaters spilled onto the Network Rail line and directly inundated The Bridge Inn, Leeds rugby academy facility, Morrison's Supermarket car park, St Ann's Mills and low&ndash;lying properties between the river and Kirkstall Road; the Kirkstall Bridge retail area (Bridge Road) was also heavily flooded, with vehicles and buildings submerged and major property damage to internal fixtures, fittings, furniture, vehicles and utility supplies reported. [IMG] (p55)</p></div><div class="nugget-popup"><p>Parts of the Leeds district (notably Kirkstall) were affected by river flooding when the River Aire overtopped banks and breached private defences, causing inundation of local infrastructure and properties as described for Kirkstall. [IMG,PAG] (p56)</p></div><div class="nugget-popup"><p>Widespread fluvial flooding from Main Rivers across the Leeds area during the event, with river channels overtopping and high river levels surcharging surface water drainage systems causing backup through gullies, manholes and private drainage. (p57)</p></div><div class="nugget-popup"><p>Leeds city centre and districts experienced major fluvial and area flooding; high river levels limited surface water drainage causing area flooding and indirect impacts to high&ndash;rise/multi&ndash;occupancy accommodation and commercial premises. [PAG] (p60)</p></div><div class="nugget-popup"><p>Central Leeds experienced concentrated flood incidents along the River Aire during the event, with internal property flooding the dominant incident type and clusters of incidents (including Burley and Botany Bay) shown on the incident distribution map. [IMG,PAG] (p61)</p></div><div class="nugget-popup"><p>Aggregated flood flow from the River Aire travelled downstream into Leeds city centre, inundating streets and properties. Major property damage is described (internal flooding, damage to fixtures/fittings, vehicles, lifts and utilities) and the map shows the highest concentrations of flooded properties in the city centre. [IMG] (p62)</p></div><div class="nugget-popup"><p>Aggregated flood flow from the River Aire proceeded into Leeds city centre, flooding streets and areas in its path. (p63)</p></div><div class="nugget-popup"><p>Aggregated flood flows from the River Aire moved rapidly into Leeds city centre, flooding roads, industrial and commercial properties along the main flow path (notably around the A65 Kirkstall Road corridor) as documented in aerial imagery. [IMG,PAG] (p64)</p></div><div class="nugget-popup"><p>Widespread fluvial flooding from main rivers overtopped due to heavy rainfall on saturated catchments; high river levels surcharged surface water drainage systems causing backup through road gullies, manholes and private drains. Nine severe flood warnings were in force across Leeds on 26 December 2015. (p65)</p></div><div class="nugget-popup"><p>Clusters of property flooding occurred within Leeds during the event, particularly along the river corridor north of Pottery Field and near the Discovery Centre; incidents are concentrated inside the Flood Zone 3 area. [IMG] (p69)</p></div><div class="nugget-popup"><p>Fluvial (river) overtopping and associated overland flows affected the Hunslet / Thwaite Gate area of Leeds. Surface water flowed from an adjacent car park onto George Mann Way and flooded the street, extending to George Mann Road (photographs dated 26 Dec 2015 at 23:15 and 23:30). Hunslet Trading Estate experienced verified internal flooding to a depth of 1350 mm. [IMG] (p70)</p></div><div class="nugget-popup"><p>Widespread fluvial flooding across Leeds from main rivers that overtopped due to record river rises; high river levels also surcharged surface water systems, causing backup through gullies, manholes and private drainage and increasing urban inundation. (p71)</p></div><div class="nugget-popup"><p>Widespread flood incidents during the event, concentrated in Flood Zone 3 along the River Aire with clusters of property flooding across the mapped area. [IMG] (p76)</p></div><div class="nugget-popup"><p>Part of the City of Leeds (the Stourton area) experienced flooding from river overtopping and canal surcharge that inundated industrial premises and infrastructure within the Leeds administrative area. [IMG] (p77)</p></div><div class="nugget-popup"><p>Widespread fluvial flooding from Main Rivers overtopped channel capacity across the city. High river levels surcharged conventional surface water drainage, causing backup through road gullies, manhole chambers and private drainage systems and resulting in urban inundation. Severe flood warnings were in force. (p81)</p></div><div class="nugget-popup"><p>Recorded major river flooding during the same events in December 2015 that affected nearby settlements; high river levels in Leeds are referenced as the major flooding incident which disrupted areas upstream/downstream. [PAG] (p83)</p></div><div class="nugget-popup"><p>The Woodlesford area of Leeds experienced extensive fluvial flooding within Flood Zone 3 from the River Aire. High river levels caused backwater effects that rendered surface&ndash;water drainage inoperable, contributing to localised flooding until river levels fell. [IMG,PAG] (p84)</p></div><div class="nugget-popup"><p>The Leeds area experienced river and canal&ndash;related flooding during the event; properties were flooded along the River Aire and adjacent waterways, with incidents concentrated along river and canal corridors in the Leeds area. The report records multiple severe flood warnings affecting the Leeds inner urban area during the event period. [IMG,PAG] (p85)</p></div><div class="nugget-popup"><p>River Aire overtopped into adjacent floodplains and inundated the Aire & Calder Navigation; the canal then exceeded capacity (surcharged/overtopped) and flooded low&ndash;lying properties in the Woodlesford area of Leeds. [IMG] (p86)</p></div><div class="nugget-popup"><p>Residential properties in the Methley and Mickletown area experienced internal and external flooding. Flooding incidents were clustered adjacent to watercourses and within high&ndash;risk flood zones; worst affected streets were Mill Lane, Lower Mickletown, Wilson's Row and Green Lane. [IMG] (p93)</p></div><div class="nugget-popup"><p>Areas within the Leeds district (notably Allerton Bywater and surrounding low&ndash;lying settlements) experienced fluvial/river flooding during the event, with internal and external property flooding concentrated close to the River Aire floodplain. [IMG] (p102)</p></div><div class="nugget-popup"><p>Extensive fluvial flooding from the River Wharfe within Flood Zone 3 affecting Otley (part of Leeds). Flooding caused surface water drainage to be inoperable (backwater/surcharge effects) until river levels subsided. Properties and streets were inundated; worst&ndash;affected streets and areas included A660, A659, Old Pool Road, Moor Drive, Meagill Rise, Weston Drive, Newall Carr Road, St Richards Road, Wrenbeck Drive, Farnley Lane, Billams Hill, Bridge Avenue, Old Cattle Market site and the Wharfe flood plains. [IMG] (p107)</p></div><div class="nugget-popup"><p>Flood incidents during the event occurred within the Leeds Metropolitan District boundary (Otley is inside Leeds), with mapped Flood Zone 3 areas and property flooding shown in the Otley area. [IMG] (p108)</p></div><div class="nugget-popup"><p>Flooding in the Collingham area of the Leeds district resulted from River Wharfe overtopping and breaching defences, causing property and garden flooding and infrastructure damage (notably Linton Bridge). [IMG] (p117)</p></div><div class="nugget-popup"><p>Administrative area containing the Thorp Arch and Boston Spa flood incidents; fluvial flooding from the River Wharfe inundated parts of the Leeds district covered in the report. [IMG] (p131)</p></div><div class="nugget-popup"><p>Widespread flooding during Storm Eva (26&ndash;27 Dec 2015) caused extensive damage across the city, triggered a citywide Strategic Recovery Plan and recovery actions by Leeds City Council, and led to commitments for further investment in river flood alleviation (notably the River Aire Flood Alleviation Scheme). [PAG] (p136)</p></div><div class="nugget-popup"><p>Leeds experienced widespread river flooding during Storm Eva (26&ndash;27 December 2015), described as devastation not seen since 1866; flooding extent closely matched EA flood zones and the absence of formal defences along the River Aire left the city at significant risk. [TAB,PAG] (p137)</p></div><div class="nugget-popup"><p>Leeds experienced widespread flooding from rivers overtopping their channels; areas of the city suffered significant damage and remain at risk in the absence of formal defences along the River Aire. [PAG] (p138)</p></div><div class="nugget-popup"><p>Communities in Leeds were impacted by flooding associated with Storm Eva &mdash; Otley is cited as being significantly affected and Linton Bridge (a listed structure) was badly damaged; repair works are underway and funding/mitigation measures are being pursued to protect communities along the River Wharfe. [PAG] (p139)</p></div><div class="nugget-popup"><p>Flooding (from the River Aire) prevented safe access to the Kirkstall electrical compound until 28 Dec; electrical repair work began 29 Dec after waters cleared. Floods caused road closures and bridge collapses or instability that hampered restoration; many customers were displaced. Extensive post&ndash;flood inspections and recovery work were carried out in the Leeds area. (p227)</p></div><div class="nugget-popup"><p>Flooding at the Kirkstall C bulk supply point on the evening of 26 December 2015 caused RTU (Remote Terminal Unit) water damage and communication failure, contributed to EHV/HV faults on local substations and triggered customer power interruptions; the power cuts at this time coincided with very high call volumes and abandoned calls to the supplier. [IMG] (p232)</p></div><div class="nugget-popup"><p>Urban flooding affected parts of Leeds during the event, including severe inundation on Kirkstall Road that disrupted transport and required emergency response. [IMG] (p237)</p></div><div class="nugget-popup"><p>On 27 December 2015 the River Aire burst its banks; floodwater ran down Kirkstall Road onto Wellington Street and into Northern Street, which was already flooded. (p241)</p></div><div class="nugget-popup"><p>Residential properties and businesses in Leeds were flooded; recovery and resilience work has been required, including Council&ndash;administered grants and targeted interventions to support those unable to return home and businesses not yet fully operational. [PAG] (p285)</p></div><div class="nugget-popup"><p>Widespread flooding affected residents, businesses and local infrastructure across the city; recovery and support actions were implemented for those impacted and some householders remain unable to return to their homes. (p287)</p></div><div class="nugget-popup"><p>Widespread residential flooding response and recovery activity organised by the council and partners: upfront payments to owners, targeting of flooded properties by letter and officer visits, support for group residential schemes, council tax relief for properties vacated due to flooding, grant funding and community support activity across the city. (p289)</p></div><div class="nugget-popup"><p>Flooding associated with Storm Eva in late December 2015 affected businesses and properties across Leeds. Recovery actions included business support, property resilience measures, business rate relief and grant funding to support affected businesses. (p290)</p></div><div class="nugget-popup"><p>Leeds as a city experienced business and property impacts from the Storm Eva floods; businesses in the city received grant assistance and business rate relief as part of the recovery effort, and there has been at least one high&ndash;profile business closure linked to the event. (p291)</p></div><div class="nugget-popup"><p>Widespread business disruption and longer&ndash;term economic impacts across floodplain employment areas: business closures, downgraded presences/relocations, reduced investment confidence and difficulties obtaining flood insurance. [PAG] (p292)</p></div><div class="nugget-popup"><p>River flooding associated with Storm Eva in late December 2015 affected the city, prompting immediate recovery activity and the commissioning of a catchment&ndash;wide feasibility study (River Aire Flood Alleviation Scheme). Flood impacts required infrastructure repairs (for example Linton Bridge) and targeted communications to affected businesses and residents. [PAG] (p294)</p></div><div class="nugget-popup"><p>Experienced flooding during Storm Eva that affected residents and businesses, prompted community engagement and recovery actions, and led to infrastructure impacts such as repairs and alternative travel arrangements around Linton Bridge. [PAG] (p295)</p></div><div class="nugget-popup"><p>Storm Eva flooding in Leeds on 26 December 2015 flooded industrial/office premises occupied by businesses (example: Company A). Three of four industrial/office units were flooded, leading to loss of two months' production and significant damage to essential production machinery, work in progress and business stock. The business submitted a multi&ndash;million pound insurance claim and faced a large increase in future flood insurance costs (reported as a 460% premium increase), prompting consideration of relocation out of the floodplain. (p310)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>27,000 properties [PAG] (p8)</p></div><div class="nugget-popup quant"><p>4,712 properties; 2,826 properties with internal flooding; 3,368 properties reported under the DCLG EVA scheme (finalised June 2016) [PAG] (p9)</p></div><div class="nugget-popup quant"><p>4,712 incidents; 2,826 affected by internal flooding [PAG] (p10)</p></div><div class="nugget-popup quant"><p>3368 properties; 4712 properties; 2826 properties (p27)</p></div><div class="nugget-popup quant"><p>2,826 properties (internal flooding); 1,886 properties (external flooding); 673 properties flooded; 2,212 affected; 483 severely affected; 3,368 total; residential total 2,683; houses total 367; flats total 2,316; commercial total 678; other total 7; residential flooded 298; residential affected 1,902; residential severely affected 483; houses flooded 242; houses affected 125; flats flooded 56; flats affected 1,777; flats severely affected 483; commercial flooded 371; commercial affected 307; other flooded 4; other affected 3 [TAB] (p28)</p></div><div class="nugget-popup quant"><p>1938 internal residential; 566 external residential; 296 internal commercial; 55 external commercial; total 2855. [TAB] (p29)</p></div><div class="nugget-popup quant"><p>27,000 properties (p32)</p></div><div class="nugget-popup quant"><p>1,938 internal residential properties; 566 external residential properties; 296 internal commercial properties; 55 external commercial properties; 2,855 properties total affected in Leeds City Centre; internal flood depths 1 m to in excess of 2 m; direct economic impact £60.3 million; ~27,000 office workers trapped [TAB,PAG] (p33)</p></div><div class="nugget-popup quant"><p>thousands of properties [IMG,PAG] (p41)</p></div><div class="nugget-popup quant"><p>thousands of properties [PAG] (p42)</p></div><div class="nugget-popup quant"><p>96 properties flooded in Kirkstall; loss of electricity supply to 27,000 properties (p52)</p></div><div class="nugget-popup quant"><p>27,000 properties [IMG] (p53)</p></div><div class="nugget-popup quant"><p>Multiple properties flooded across Kirkstall; largest 250m grid squares fall in the 206&ndash;592 incidents bin (map legend ranges) [IMG,PAG] (p54)</p></div><div class="nugget-popup quant"><p>122&ndash;395 properties (largest incident clusters mapped near the city centre) [IMG] (p62)</p></div><div class="nugget-popup quant"><p>206&ndash;592 properties (largest 250m grid&ndash;square cluster shown on Figure 80) [IMG] (p69)</p></div><div class="nugget-popup quant"><p>1350 mm depth of internal flooding [IMG] (p70)</p></div><div class="nugget-popup quant"><p>Largest cluster shown as 206&ndash;592 properties in a 250m grid square (map legend and distribution figures) [IMG] (p76)</p></div><div class="nugget-popup quant"><p>1 internal residential flooding; 4 external residential flooding; 0 internal commercial flooding; 1 external commercial flooding; Woodlesford total 6 properties [IMG,PAG] (p84)</p></div><div class="nugget-popup quant"><p>4 internal residential; 32 external residential; 0 internal commercial; 0 external commercial; total 36 properties [IMG] (p93)</p></div><div class="nugget-popup quant"><p>54 internal residential properties; 14 external residential properties; 5 internal commercial properties; 1 external commercial property; 74 properties in total [IMG] (p107)</p></div><div class="nugget-popup quant"><p>internal flood depths in some cases in excess of 2 m; south supporting pier settlement 200 mm; 4 miles vehicle diversion; estimated repair cost £4.3 million [IMG] (p117)</p></div><div class="nugget-popup quant"><p>verified internal flood depths 500mm to 1500mm (within affected localities) [IMG] (p131)</p></div><div class="nugget-popup quant"><p>20 EHV/HV incidents recorded at the Kirkstall site; 219 'at risk' substation inspections (Calder Valley and Leeds combined); 18 substations required replacement; 14 required maintenance; 49 required cleaning; 3,285 properties inspected in the West Yorkshire service recovery programme; 284 service termination cut&ndash;outs replaced; 190 services renewed; 53 properties disconnected on safety grounds (later reconnected) (p227)</p></div><div class="nugget-popup quant"><p>1 RTU communication failure at Kirkstall due to flood water damage (evening 26 Dec 2015); 1,540 calls abandoned between 20:00 and 23:45 on 26 Dec 2015 when power cuts began affecting customers [IMG] (p232)</p></div><div class="nugget-popup quant"><p>673 properties flooded; 2212 properties affected; 483 properties severely affected; 3368 properties in total affected; 2683 residential properties affected (242 houses flooded; 56 flats flooded); 371 commercial properties flooded; 4 other properties flooded (p287)</p></div><div class="nugget-popup quant"><p>£105,562 of council tax relief offered; 7 properties still receiving relief as of Oct 1; Leeds Community Foundation raised approximately £300,000 and given/committed just under £260,000; 25 organisations funded; 47 individual homeowner grants of £250 or £500; proposed support for 8 city&ndash;centre flat complexes (£160,000); proposed utility relocation in 26 properties on Kirkstall Road (£130,000) (p289)</p></div><div class="nugget-popup quant"><p>14 Leeds businesses included in 43 LEP Flood Recovery Grant approvals; council provided over £1.1m rates relief to affected Leeds businesses; one high&ndash;profile business closure (Thyssen Krupp) reported (p291)</p></div></div></body></div>`)[0];

                var html_dfea8f6521a6e8e8cb254d7e7dfa4767 = $(`<div id="html_dfea8f6521a6e8e8cb254d7e7dfa4767" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>RSPB St Aidan's</h1><div class="nugget-popup"><p>Extensive inundation of St Aidan&#8217;s former opencast and adjacent washlands used as temporary flood storage; industrial facilities, tanks and a marina were shown submerged in aerial imagery. [IMG] (p90)</p></div><div class="nugget-popup"><p>The St Aidan's temporary storage reservoir and spillways were tested by the extreme flood (first time since completion). Its operation, together with associated washlands, reduced downstream flood severity (modelled ~500 mm reduction at Allerton Bywater, Castleford, Methley and Mickletown) and almost certainly prevented severe inundation of properties between Woodlesford and Castleford. [PAG] (p91)</p></div><div class="nugget-popup"><p>The St Aidan's temporary storage reservoir and washlands were tested and operated during the extreme flood, reducing peak river flood levels and preventing severe inundation; modelled to reduce a 1% AEP flood by around 500mm at Allerton Bywater, Castleford, Methley and Mickletown, and its operation is credited with almost certainly preventing severe flooding of many properties in the corridor between Woodlesford and Castleford. [PAG] (p92)</p></div><div class="nugget-popup"><p>The former opencast area acted as a temporary storage reservoir during the extreme flood event, filling with floodwater and reducing downstream flood levels. The St Aidan spillways and reservoir were tested for the first time and together with associated washlands substantially reduced inundation downstream between Woodlesford and Castleford. [IMG,PAG] (p99)</p></div><div class="nugget-popup"><p>St Aidan's washland flood storage areas were inundated by overtopping from the River Aire and River Calder, receiving floodwater and forming part of the flow routes that led to flooding of isolated properties (e.g. on Barnsdale Road). (p103)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>around 500 mm reduction in flood level at Allerton Bywater, Castleford, Methley and Mickletown; 1289 properties saved (modelled estimate for combined effect of St Aidan's and associated washlands between Woodlesford and Castleford) [PAG] (p91)</p></div><div class="nugget-popup quant"><p>1289 properties saved; 500mm reduction in flood level at Allerton Bywater, Castleford, Methley and Mickletown [PAG] (p92)</p></div><div class="nugget-popup quant"><p>7 million cubic metres capacity; models indicate up to 1289 properties saved (combined with associated washlands) [IMG,PAG] (p99)</p></div></div></body></div>`)[0];

                var html_1b04238dc47ba0812d1f04da6f74ff8e = $(`<div id="html_1b04238dc47ba0812d1f04da6f74ff8e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kell Beck</h1><div class="nugget-popup"><p>Runs along the west side of Otley and then into a culverted system; the report notes Kell Beck may contribute to flooding of properties on the left bank when the River Wharfe overtops, contributing to flood impacts in the Otley area during the December 2015 events. (p105)</p></div><div class="nugget-popup"><p>The Kell Beck outfall (just upstream of Otley Bridge) became ineffective during record&ndash;high River Wharfe levels; fluvial backwater and surcharge prevented gravity drainage, causing localised flooding where the outfall and connected surface water systems could not discharge to the river. (p106)</p></div></div></body></div>`)[0];

                var html_49247e72948bb138f85054ac8795ce5d = $(`<div id="html_49247e72948bb138f85054ac8795ce5d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Collingham Beck</h1><div class="nugget-popup"><p>Collingham Beck, a steep rapid&ndash;response watercourse, rose to high levels during the event and contributed surcharge/back&ndash;pressure to surface water systems and localised flooding in Collingham. [PAG] (p113)</p></div><div class="nugget-popup"><p>Collingham Beck caused flooding in 2007 (which led to construction of an EA floodwall). During the 25&ndash;29 Dec 2015 event, high beck levels contributed to fluvial backwater and surcharge on surface water systems, worsening localised flooding. [MUL] (p114)</p></div><div class="nugget-popup"><p>Collingham Beck overtopped/produced overland flows that led to extensive and deep garden flooding adjacent to Beck Lane and Church Lane. [IMG] (p117)</p></div></div></body></div>`)[0];

                var html_78488edd03aa3e6936321f103ce725c1 = $(`<div id="html_78488edd03aa3e6936321f103ce725c1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Aire</h1><div class="nugget-popup"><p>Further rainfall over Christmas and Boxing Day produced the highest river levels ever seen in many places along the River Aire catchment, contributing to widespread flooding of communities, homes and businesses. (p7)</p></div><div class="nugget-popup"><p>Record high flows in the River Aire (at Armley) produced very high flood levels that were the main cause of widespread flooding; water also came out of channel approximately 0.8 miles upstream of the Armley flow gauge and flowed down Kirkstall Road towards the city centre. [PAG] (p8)</p></div><div class="nugget-popup"><p>The River Aire is identified as a dominant feature and a principal cause of flooding to Leeds and adjacent communities. Its steep profile, rapid response to rainfall and many tributaries contributed to river flooding of Leeds city centre and surrounding areas during Storm Eva. [PAG] (p9)</p></div><div class="nugget-popup"><p>Source of deep, fast&ndash;flowing flood water that rapidly inundated streets (including Kirkstall Road and Wellington Street) and carried floodwater over a distance into the heart of the city; formal and informal defences were on occasion overtopped or bypassed. (p10)</p></div><div class="nugget-popup"><p>Flooding originated from the River Aire (a Main River) and is identified in the report as a source of Main River flooding affecting Leeds; the report references flood alleviation measures (River Aire Flood Alleviation Scheme). [PAG] (p12)</p></div><div class="nugget-popup"><p>Identified as one of the District's Main Rivers and a major characteristic of Leeds City Centre; the report states the 25&ndash;29 Dec 2015 flooding was almost exclusively a Main River fluvial event, implicating the River Aire as a principal source of fluvial flooding that affected communities along its corridor. [PAG] (p16)</p></div><div class="nugget-popup"><p>A Main River fluvial event on 25&ndash;29 Dec 2015 along the River Aire caused flooding of areas adjacent to the river and contributed to widespread inundation across Leeds MDC (including multiple Aire&ndash;focused sub&ndash;areas). [IMG] (p17)</p></div><div class="nugget-popup"><p>Photographs and captions document River Aire flooding in December 2015 in the Leeds area, showing urban streets, industrial/commercial areas and city streets submerged (water reaching street furniture and the base of buildings). [IMG,PAG] (p20)</p></div><div class="nugget-popup"><p>Flow in the River Aire at Armley on 27 December 2015 was the highest ever recorded, producing flood levels approximately 1.2 m higher than the previous record from autumn 2000. (p24)</p></div><div class="nugget-popup"><p>High flows from the River Aire's source (Malham Cove) following extreme rainfall contributed to downstream flooding; this was a precursor to the Boxing Day floods that affected communities including Leeds. [MUL] (p25)</p></div><div class="nugget-popup"><p>Identified in the report as one of the predominant causes of property flooding in Leeds and nearby areas during the event; contributed to the internal and external property flooding counts reported for the metropolitan district. (p27)</p></div><div class="nugget-popup"><p>Flooding in proximity to the River Aire affected properties across multiple study areas. Reported impacts by area include Leeds City Centre (1938 internal residential; 566 external residential; 296 internal commercial; 55 external commercial), Newlay (5 internal residential; 4 external residential; 1 internal commercial), Kirkstall (0 internal residential; 45 external residential; 36 internal commercial; 15 external commercial), Burley (8 internal residential; 0 external residential; 279 internal commercial; 16 external commercial), Thwaite Gate and Hunslet (60 internal residential; 1051 external residential; 49 internal commercial; 10 external commercial), Stourton (0 internal residential; 0 external residential; 36 internal commercial; 4 external commercial), Woodlesford (1 internal residential; 4 external residential; 0 internal commercial; 1 external commercial), Methley and Mickletown (4 internal residential; 32 external residential), and Allerton Bywater (2 internal residential; 2 external residential; 7 internal commercial). [TAB] (p29)</p></div><div class="nugget-popup"><p>High/record river levels, steep profile and rapid response to rainfall contributed to flooding in Leeds; elevated river levels prevented surface water drainage systems from discharging and caused fluvial backwater effects that led to surcharge of surface water systems and extensive flooding. [PAG] (p32)</p></div><div class="nugget-popup"><p>Record&ndash;high river levels in the River Aire produced extensive fluvial flooding within flood zone 3, caused fluvial backwater effects that prevented free discharge from the surface water drainage system and led to surcharge/back pressures that produced additional area and surface&ndash;water flooding in the city centre. [TAB] (p33)</p></div><div class="nugget-popup"><p>The River Aire and its tributaries are shown as the principal loci of flooding, with incidents highly concentrated along the river and largest clusters of flooded properties occurring adjacent to its banks, driving widespread property inundation in central Leeds and riverside neighbourhoods. [IMG] (p35)</p></div><div class="nugget-popup"><p>Came out of channel and overtopped its banks at multiple locations in Leeds City Centre (including Little Neville Street, Bridge End/Meadow Lane, Turlow Court, Neptune Street, Clarence Road and Sovereign Street), causing direct flooding of offices, residential properties, assisted living and other commercial areas. [IMG] (p36)</p></div><div class="nugget-popup"><p>The River Aire overtopped its channel in multiple locations in Leeds City Centre, causing primary fluvial flooding that directly inundated Little Neville Street (flooding Direct Line Group offices and nearby high&ndash;rise apartments), Bridge End/Meadow Lane (offices, Navigation Walk and Dock Street), Turlow Court (residential areas), Neptune Street (residential and commercial properties), Clarence Road (Leeds Assisted Living, nearby commercial properties and Armouries Drive) and low&ndash;lying properties along Sovereign Street. [IMG,PAG] (p37)</p></div><div class="nugget-popup"><p>Overtopping of the River Aire caused flooding of adjacent urban streets and properties (images and captions link overtopping to inundation at Dock Street, Neptune Street, Bridge End and Meadow Lane). [IMG,PAG] (p38)</p></div><div class="nugget-popup"><p>The River Aire overtopped its banks (overtopping at Meadow Lane) and raised river levels so high that surface water drainage could not discharge freely for long periods (lasting in some areas for days). These high river levels produced backwater effects and surcharge/back pressures on surface water and sewer systems, which in turn caused flooding of Northern Street, East Street, Sovereign Street, Concordia Street and properties along Whitehall Road as a precursor to later overland fluvial flows. Sewer surcharge related to the high river levels caused roads to become impassable (example: East Street reported impassable after surcharge). [IMG,PAG,MUL] (p39)</p></div><div class="nugget-popup"><p>High River Aire levels caused sewer surcharge at downstream locations (notably East Street) and contributed to overland fluvial exceedance flows and urban flooding in Leeds, making roads impassable in places. [PAG] (p40)</p></div><div class="nugget-popup"><p>The River Aire overtopped upstream in Kirkstall and produced overland fluvial exceedance flows that travelled approximately 2.7 km (over a mile) downstream into Leeds city centre, causing widespread inundation and putting life at risk. [IMG,PAG] (p41)</p></div><div class="nugget-popup"><p>The River Aire overtopped about 2.7 km upstream in Kirkstall, sending a south&ndash;easterly fluvial exceedance flow into Leeds City Centre that flooded properties along its path and put life at risk. [PAG] (p42)</p></div><div class="nugget-popup"><p>Rapid runoff and river rise led to the River Aire overtopping its channel capacity, producing widespread fluvial flooding that surcharged surface water drainage and caused backup into gullies, manholes and private drainage. (p43)</p></div><div class="nugget-popup"><p>Extensive fluvial flooding from the River Aire (within flood zone 3) which caused property flooding and disruption in adjacent districts (including Kirkstall and Burley). [TAB] (p52)</p></div><div class="nugget-popup"><p>The River Aire overtopped/caused flooding along its Kirkstall corridor during 25&ndash;29 Dec 2015, producing internal and external flooding of built properties (mud and debris evident) and severe internal water ingress in some buildings. [IMG] (p53)</p></div><div class="nugget-popup"><p>Overtopped its banks and breached private flood defences in Kirkstall, spilling onto floodplains and directly flooding areas including The Bridge Inn, Leeds rugby academy facility, Morrison's supermarket car park, St Ann's Mills and low&ndash;lying properties between the river and Kirkstall Road. [IMG,PAG] (p54)</p></div><div class="nugget-popup"><p>The River Aire overtopped its banks and breached private flood defence assets, spilling into floodplains and onto land in Kirkstall. Floodwaters inundated the Network Rail line and directly flooded The Bridge Inn, Leeds rugby academy facility, Morrison's Supermarket car park, St Ann's Mills and low&ndash;lying properties between the river and Kirkstall Road. [IMG] (p55)</p></div><div class="nugget-popup"><p>Record&ndash;high river levels on the River Aire produced fluvial backwater that constrained free discharge from the surface water drainage system and caused surcharge/back pressures, which in turn led to extensive surface water/urban flooding in Burley and nearby areas. (p59)</p></div><div class="nugget-popup"><p>Experienced extensive fluvial flooding within flood zone 3; record high river levels constrained free discharge from surface water systems, caused fluvial backwater and surcharge that contributed to widespread area and property flooding in adjacent districts (e.g., Burley). [TAB] (p60)</p></div><div class="nugget-popup"><p>Overbank flooding from the River Aire produced the majority of recorded incidents along the river corridor, causing internal flooding to nearby properties (notably in Burley) and area/amenity flooding along the floodplain. [IMG] (p61)</p></div><div class="nugget-popup"><p>The River Aire overtopped its banks at multiple locations, breached informal private flood defences and spilled onto adjacent roads (including the A65), producing aggregated flood flows that travelled rapidly downstream into Leeds city centre and caused widespread property flooding and damage. [IMG,PAG] (p62)</p></div><div class="nugget-popup"><p>The River Aire overtopped its channel and banks, breached private informal flood defences and spilled onto the A65 Kirkstall Road (opposite Woodside View). Flood flows travelled downstream into side roads and then continued rapidly into Leeds city centre, inundating streets and properties along the route. [IMG,PAG] (p63)</p></div><div class="nugget-popup"><p>The River Aire overtopped its banks at several locations, breached private informal flood defence assets, and spilled onto the A65 Kirkstall Road (at the meander opposite Woodside View) and downstream side roads; these overtopping flows aggregated and proceeded into Leeds city centre, flooding areas along the flow path. [IMG,PAG] (p64)</p></div><div class="nugget-popup"><p>Record high River Aire levels caused fluvial backwater effects that rendered surface water drainage systems draining toward the river inoperable and generated surcharge/back pressures that contributed to localised flooding in adjacent low&ndash;lying areas (notably Thwaite Gate and Hunslet). (p67)</p></div><div class="nugget-popup"><p>Record high river levels caused extensive fluvial flooding within Flood Zone 3. High river levels produced backwater/surcharge effects that rendered surface water drainage (including the nearby pumping station) inoperable until levels fell, contributing to localised flooding; when river levels dropped gravity discharge resumed and local flooding subsided. [PAG] (p68)</p></div><div class="nugget-popup"><p>Record high flows in the River Aire led to swollen adjacent waterways and overtopping of channels, producing widespread fluvial flooding and contributing to the inundation of low&ndash;lying areas and properties. (p71)</p></div><div class="nugget-popup"><p>Main River fluvial flooding: the River Aire overtopped and exceeded channel capacity, causing widespread fluvial flooding that surcharged surface water drainage, preventing free discharge and causing backups through gullies, manholes and private drainage. [PAG] (p72)</p></div><div class="nugget-popup"><p>Record high River Aire levels during 25 Dec 2015 &ndash; 29 Dec 2015 caused localised flooding influence in low&ndash;lying areas of Stourton. Elevated river levels rendered surface&ndash;water drainage systems discharging to the river (including the syphon beneath the canal and the nearby pumping station) inoperable until river levels subsided. [PAG] (p73)</p></div><div class="nugget-popup"><p>Record high river levels produced fluvial backwater effects that prevented gravity discharge of local surface water systems, contributing to localised flooding in low&ndash;lying areas. [IMG] (p74)</p></div><div class="nugget-popup"><p>The River Aire produced extensive fluvial flooding within Flood Zone 3 that inundated Stourton and caused property flooding (commercial and external commercial) in the area. [TAB] (p75)</p></div><div class="nugget-popup"><p>The River Aire and its watercourses are shown as the primary focus of mapped flood zones and are spatially associated with overbanking/flow routes that led to internal and external property flooding in adjacent Stourton. [IMG] (p76)</p></div><div class="nugget-popup"><p>The River Aire overtopped footpaths and contributed overland fluvial flows into the adjacent industrial estate; its interaction with the canal and overtopping routes is mapped as a primary source of inundation. [IMG] (p77)</p></div><div class="nugget-popup"><p>Structural collapse of the Knostrop by&ndash;wash embankment allowed River Aire waters to enter the canal system, surcharging the Aire and Calder Navigation and contributing to overtopping and downstream flooding. [IMG,PAG] (p78)</p></div><div class="nugget-popup"><p>River Aire waters breached the by&ndash;wash embankment at Knostrop and inundated the Aire & Calder Navigation canal, contributing to overtopping and flooding of nearby land and properties. [IMG,PAG] (p79)</p></div><div class="nugget-popup"><p>River Aire overtopped/flowed through the breached Knostrop Lock structure, inundating the adjacent canal and causing significant water flow into the canal system. [IMG] (p80)</p></div><div class="nugget-popup"><p>Record high River Aire levels during 25 Dec 2015 &ndash; 29 Dec 2015 caused fluvial backwater that rendered surface water drainage systems draining to the river inoperable, produced surcharge/back pressures in surface water systems and led to localised flooding in Woodlesford; standing floodwater inundated industrial units and signage (photograph dated 27 Dec 2015). (p83)</p></div><div class="nugget-popup"><p>Record&ndash;high river levels on the River Aire caused extensive fluvial flooding within Flood Zone 3, rendered surface water drainage systems inoperable (backwater effects and surcharge), and produced localised flooding until river levels subsided. [TAB,PAG] (p84)</p></div><div class="nugget-popup"><p>The river overtopped its channel, spilling onto adjacent floodplains and driving the inundation of the Aire & Calder Navigation; this fluvial overflow was described as the primary cause of flooding that led to low&ndash;lying properties and waterside areas being flooded around Woodlesford/Oulton/Swillington. [IMG,PAG] (p85)</p></div><div class="nugget-popup"><p>The River Aire came out of its channel, overtopping into adjacent floodplains. This overtopping inundated the Aire & Calder Navigation canal and contributed to downstream canal surcharging, breaches and flooding of nearby low&ndash;lying properties and land. [IMG] (p86)</p></div><div class="nugget-popup"><p>Record&ndash;high River Aire levels in late December 2015 caused conventional surface water drainage systems draining toward the river to become inoperable, contributing to localised fluvial flooding in low&ndash;lying areas. Photographic evidence documents standing floodwater on a residential street in Lower Mickletown on 28 December 2015, with water encroaching from the river side onto the road and affecting accessibility. [PAG,MUL] (p88)</p></div><div class="nugget-popup"><p>Record&ndash;high River Aire levels generated fluvial backwater and made surface water drainage systems discharging to the river inoperable, causing localised flooding and surcharge/back&ndash;pressure of surface water systems in low&ndash;lying areas. [PAG] (p90)</p></div><div class="nugget-popup"><p>The River Aire produced extensive fluvial flooding within flood zone 3 during the event, contributing to inundation of adjacent settlements (including areas referenced such as Methley, Mickletown and Castleford). [TAB] (p92)</p></div><div class="nugget-popup"><p>The River Aire overtopped its banks and contributed to fluvial inundation of the adjacent Mickletown Ings flood storage area; overtopping and overland flows from the river drove floodwaters into low&ndash;lying adjacent areas and contributed to property flooding on the fringes of the flood washland. [IMG,PAG] (p94)</p></div><div class="nugget-popup"><p>The River Aire spills into Allerton Ings and causes flooding of the Barnsdale Road area; it is identified as the source of significant historical flooding affecting Allerton Bywater and contributed to the December 2015 inundation (Station Road submerged). (p97)</p></div><div class="nugget-popup"><p>The River Aire was the primary influence for extensive fluvial flooding in flood zone 3, driving inundation of Allerton Ings, Barnsdale Road and properties in Allerton Bywater during the event. [TAB] (p101)</p></div><div class="nugget-popup"><p>The River Aire overtopped its channel and flowed into St Aidan's and associated washland flood storage areas; this overtopping and release of water contributed to inundation that flooded isolated properties along Barnsdale Road in Allerton Bywater. [IMG,PAG] (p102)</p></div><div class="nugget-popup"><p>The River Aire came out of channel and overtopped into St Aidan's and associated washland flood storage areas, driving overland flows and contributing to inundation of adjacent low&ndash;lying land and property flooding (including along Barnsdale Road). [IMG] (p103)</p></div><div class="nugget-popup"><p>The River Aire overtopped its channel during Storm Eva (26&ndash;27 December 2015), driving river flooding across Leeds; the report states there are no formal flood defences along the River Aire, leaving the city exposed to that flooding source. [TAB,PAG] (p137)</p></div><div class="nugget-popup"><p>Main river (River Aire) came out of channel during the event, causing flooding across Leeds; there were no formal flood defences along the River Aire so the city was particularly affected and remains at risk until defences are provided. (p138)</p></div><div class="nugget-popup"><p>River Aire levels caused flooding that inundated the Kirkstall compound, prevented safe site access until 28 Dec 2015 and delayed electrical repair works until flood waters were cleared on 29 Dec 2015. (p227)</p></div><div class="nugget-popup"><p>The river burst its banks on 27.12.15 and was the source of floodwater that ran down Kirkstall Road, onto Wellington Street and into Northern Street, initiating the urban/basement flooding described. (p242)</p></div><div class="nugget-popup"><p>Flooding of the river banks and adjacent premises in Kirkstall led to volunteer and corporate clean&ndash;ups of the River Aire's banks and contributed to commercial premises being flooded. (p290)</p></div><div class="nugget-popup"><p>Flooding of the River Aire affected businesses along its banks in Kirkstall, Hunslet and Stourton; the river&ndash;related flooding caused visual amenity damage to premises and contributed to reduced trade and inward investment for those flood&ndash;affected businesses. (p292)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 1.2m higher than the previous record; approximately 0.8 miles (out&ndash;of&ndash;channel flow origin) [PAG] (p8)</p></div><div class="nugget-popup quant"><p>approximately 1.2 m higher than the previous record; in excess of 0.5% (1 in 200) AEP (p24)</p></div><div class="nugget-popup quant"><p>Leeds City Centre: 1938 internal residential; 566 external residential; 296 internal commercial; 55 external commercial (total 2855). Newlay: 5 internal residential; 4 external residential; 1 internal commercial (total 10). Kirkstall: 0 internal residential; 45 external residential; 36 internal commercial; 15 external commercial (total 96). Burley: 8 internal residential; 0 external residential; 279 internal commercial; 16 external commercial (total 303). Thwaite Gate and Hunslet: 60 internal residential; 1051 external residential; 49 internal commercial; 10 external commercial (total 1170). Stourton: 0 internal residential; 0 external residential; 36 internal commercial; 4 external commercial (total 40). Woodlesford: 1 internal residential; 4 external residential; 0 internal commercial; 1 external commercial (total 6). Methley and Mickletown: 4 internal residential; 32 external residential (total 36). Allerton Bywater: 2 internal residential; 2 external residential; 7 internal commercial (total 11). [TAB] (p29)</p></div><div class="nugget-popup quant"><p>2,855 properties in Leeds City Centre reported flood&ndash;affected during the event; internal flood depths 1 m to in excess of 2 m; direct economic impact £60.3 million [TAB] (p33)</p></div><div class="nugget-popup quant"><p>Map analysis notes largest incident clusters located along the river and in Flood Zone 3; grid&ndash;square incident categories include ranges up to 205&ndash;392 properties. [IMG] (p35)</p></div><div class="nugget-popup quant"><p>thousands of properties [IMG,PAG] (p41)</p></div><div class="nugget-popup quant"><p>thousands of properties [PAG] (p42)</p></div><div class="nugget-popup quant"><p>96 properties flooded in Kirkstall; flood depths up to 1500mm (reported in Kirkstall) [TAB] (p52)</p></div><div class="nugget-popup quant"><p>96 properties; up to 1500mm internal flood depths [IMG] (p53)</p></div><div class="nugget-popup quant"><p>Contributed to flooding that affected at least 303 properties in Burley. [TAB] (p60)</p></div><div class="nugget-popup quant"><p>at least 303 properties (in Burley); internal flood depths 840 mm to 1540 mm [IMG] (p61)</p></div><div class="nugget-popup quant"><p>60 internal residential properties; 1,051 external residential properties; 49 internal commercial properties; 10 external commercial properties; total 1,170 properties flooded (Thwaite Gate and Hunslet) [PAG] (p68)</p></div><div class="nugget-popup quant"><p>36 internal commercial properties; 4 external commercial properties; 40 properties total [TAB] (p75)</p></div><div class="nugget-popup quant"><p>over 206 properties flooded in a central Mickletown grid square (map category 206&ndash;592) [IMG,PAG] (p94)</p></div><div class="nugget-popup quant"><p>Contributed to 11 properties flooded in Allerton Bywater; contributed to Barnsdale Road being modelled ~1.5 m under water in a 1 in 5 year event [TAB] (p101)</p></div></div></body></div>`)[0];
                popup_901bb09beb97cafeb9e791c430ea026e.setContent(html_78488edd03aa3e6936321f103ce725c1);

                var html_fe7edf78c43219798ae74c106ed75d27 = $(`<div id="html_fe7edf78c43219798ae74c106ed75d27" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Calder</h1><div class="nugget-popup"><p>Highest river levels ever seen in many places of the Calder catchment contributed to devastating effects on local communities, businesses, individual homes and critical/local infrastructure. (p7)</p></div><div class="nugget-popup"><p>Leeds experiences flooding from the River Calder; the river contributed to flooding in the district during the 25&ndash;29 December 2015 event. (p8)</p></div><div class="nugget-popup"><p>Described as a Main River forming the district's southern boundary and therefore part of the main river network implicated in the fluvial flooding during the event; linked hydrologically to the River Aire at the confluence near Castleford. [IMG] (p17)</p></div><div class="nugget-popup"><p>Catchment saturation and further heavy rainfall led to almost instant runoff and rapid river rise in the Calder catchment, resulting in widespread fluvial flooding from main rivers. High river levels from the Calder contributed to overtopping and surcharging of conventional surface water drainage systems in Leeds, preventing free discharge and causing backups through road gullies, manholes and private drainage. (p43)</p></div><div class="nugget-popup"><p>Catchment experienced heavy, prolonged rainfall leading to saturated ground and rapid runoff; river levels rose rapidly with many stations recording highest levels ever, resulting in Main River overtopping and widespread fluvial flooding that surcharged surface water drainage and backed up through gullies, manholes and private drains. (p49)</p></div><div class="nugget-popup"><p>River Calder catchment experienced heavy, prolonged rainfall leading to saturated ground and rapid runoff; main&ndash;river flooding occurred with channels overtopping, causing widespread fluvial flooding and surcharging of surface water drainage systems that backed up through road gullies, manholes and private drainage. (p57)</p></div><div class="nugget-popup"><p>The River Calder catchment experienced heavy and prolonged rainfall on already saturated ground during 25&ndash;29 December 2015, producing almost&ndash;instant runoff and rapid river rises that caused fluvial flooding in Burley. Channels were overtopped, contributing to widespread river flooding and surcharging of surface water drainage (backing up via road gullies, manholes and private drains). (p65)</p></div><div class="nugget-popup"><p>The Calder catchment experienced heavy and prolonged rainfall prior to and during 25&ndash;29 Dec 2015 leading to saturated ground and very rapid runoff. Record/high river flows contributed to overtopping and widespread fluvial flooding from main rivers, which also surcharged surface water drainage and caused backing up through gullies and manholes. (p71)</p></div><div class="nugget-popup"><p>Catchment experienced heavy prolonged rainfall before and over 25&ndash;29 December causing saturated ground and very rapid runoff; resulted in river levels reaching record highs and widespread fluvial flooding from the Calder overtopping channels and surcharging surface water systems in the catchment. (p81)</p></div><div class="nugget-popup"><p>The Calder catchment experienced heavy, prolonged rainfall prior to and during 25&ndash;29 Dec 2015 that left soils saturated and contributed to rapid river rises and periodic flooding in the catchment, increasing flood risk during the 25&ndash;29 Dec event. [IMG] (p86)</p></div><div class="nugget-popup"><p>Record&ndash;high River Calder levels in late December 2015 contributed to localised flooding in low&ndash;lying areas between the Aire and Calder by rendering surface water drainage inoperable and producing fluvial backwater effects that caused surcharge of unprotected surface water systems. Historically, the River Calder caused severe flooding at Methley in 1960, with homes reported to have been under up to 4 metres of water. [IMG,PAG,MUL] (p88)</p></div><div class="nugget-popup"><p>Record&ndash;high River Calder levels contributed to fluvial backwater effects, which would have caused localised flooding in low&ndash;lying areas and prevented surface water drainage systems from discharging to the river. [PAG] (p90)</p></div><div class="nugget-popup"><p>High flows on the River Calder caused washlands (including Allerton Ings and Lowther Washlands) to fill and act as temporary storage during the extreme flood, driving the need for the storage function. (p91)</p></div><div class="nugget-popup"><p>The River Calder contributed to the extensive fluvial flooding within flood zone 3 during the event, alongside the River Aire. [TAB] (p92)</p></div><div class="nugget-popup"><p>The River Calder overtopped and, together with the River Aire, discharged into Mickletown Ings flood storage areas; this contributed to overland flows that inundated adjacent low&ndash;lying land and led to isolated property flooding on the extreme fringes of the washland. [IMG] (p94)</p></div><div class="nugget-popup"><p>River came out of channel and overtopped into adjacent Mickletown Ings flood storage areas, contributing to inundation of floodplain and flooding of isolated properties on the extreme fringes of the washland. (p95)</p></div><div class="nugget-popup"><p>Washlands on the River Calder at Whitwood Mere acted as temporary storage during the extreme event, holding floodwater as part of the downstream flood management system. (p99)</p></div><div class="nugget-popup"><p>High flows in the River Calder forced water into and back up the River Aire at the confluence, which contributed to Allerton Ings operating and caused flooding of the Barnsdale Road/Allerton Bywater area. [TAB] (p101)</p></div><div class="nugget-popup"><p>The River Calder overtopped into St Aidan's and the washland flood storage areas, contributing to overland flood flows and flooding of low&ndash;lying areas and properties near the rivers. [IMG] (p103)</p></div><div class="nugget-popup"><p>The River Calder catchment experienced prolonged heavy rainfall in November&ndash;December 2015 contributing to saturated catchments and rapid runoff during the 25&ndash;29 Dec 2015 event, leading to rapid river rises and fluvial flooding where Main Rivers overtopped their channels; surface water drainage surcharge also occurred. (p111)</p></div><div class="nugget-popup"><p>The Calder catchment experienced prolonged November&ndash;December rainfall leading to saturated ground; further heavy rainfall over Christmas caused rapid runoff and fast river rise in the catchment, contributing to record high river levels and downstream flooding. (p119)</p></div><div class="nugget-popup"><p>The Calder catchment experienced heavy, prolonged rainfall leading to saturated catchments and contributed to widespread fluvial flooding and overtopping of main rivers. (p127)</p></div><div class="nugget-popup"><p>The River Calder catchment experienced heavy and prolonged rainfall prior to the event, producing saturated ground and periodic flooding; this saturation contributed to rapid river rises and flooding during the Christmas period. (p133)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>homes under up to 4 metres of water [IMG,PAG,MUL] (p88)</p></div><div class="nugget-popup quant"><p>over 206 properties flooded in a central Mickletown grid square (map category 206&ndash;592) [IMG] (p94)</p></div><div class="nugget-popup quant"><p>Contributed to 11 properties flooded in Allerton Bywater (p101)</p></div></div></body></div>`)[0];
                popup_54ff1d636717255df4434d4d6b1ce7be.setContent(html_fe7edf78c43219798ae74c106ed75d27);
