                var html_7ef1df064fd4308f573dbdfeaa9d9b65 = $(`<div id="html_7ef1df064fd4308f573dbdfeaa9d9b65" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Harper's Brook</h1><div class="nugget-popup"><p>An ordinary tributary of Harper's Brook that forms the western boundary of an affected property overflowed and caused internal flooding to that property. The tributary discharges to Harper's Brook through a headwall with a 300mm pipe and flap valve, which is described in connection with the flooding. (p14)</p></div><div class="nugget-popup"><p>Harper's Brook was at or exceeding bank capacity in places and caused minor flooding to rear gardens behind properties, contributing limited flooding impacts separate from the culvert overtopping at Mill Hill. (p16)</p></div><div class="nugget-popup"><p>Higher&ndash;than&ndash;normal water levels in the brook deepened downstream of the culvert, which likely closed the flap valve in the headwall, producing a surcharged outfall and limiting the culvert/watercourse's ability to discharge&mdash;contributing to local flooding. (p17)</p></div><div class="nugget-popup"><p>High water levels in Harper's Brook during the event may have restricted downstream flow and contributed to the culverted watercourse exceeding capacity, worsening flooding on Mill Hill and to nearby properties on 23rd December 2020. (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property (p14)</p></div><div class="nugget-popup quant"><p>2 properties experienced limited rear&ndash;garden flooding from Harper's Brook (p16)</p></div></div></body></div>`)[0];

                var html_d6549f39ae606ac35be84982266d5d8d = $(`<div id="html_d6549f39ae606ac35be84982266d5d8d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Mill Hill, Great Oakley</h1><div class="nugget-popup"><p>Flooding occurring on the carriageway of Mill Hill near an affected property; this was associated with internal flooding to one property and flooding of external areas of other properties nearby. [PAG] (p10)</p></div><div class="nugget-popup"><p>Carriageway flooding reported frequently near the affected property. [PAG] (p11)</p></div><div class="nugget-popup"><p>Flows in the watercourse north of Mill Hill exceeded the capacity of the culvert beneath the road, causing the watercourse to overtop and flood the road. Floodwater depth on the carriageway increased and flowed toward an adjacent property, resulting in internal flooding of that property. [PAG] (p15)</p></div><div class="nugget-popup"><p>Flows in the upstream watercourse exceeded the capacity of the culvert under Mill Hill, overtopped the watercourse and flooded the carriageway. As water depth increased on the road it flowed east toward properties causing internal flooding of one property and external flooding to an adjacent property (south) and two properties on the north side. Blocked highway gullies to the east likely increased ponding at the low spot near the watercourse. [PAG] (p16)</p></div><div class="nugget-popup"><p>Standing water collected on the carriageway to depths that impeded use and reached nearby property. Highway drainage east of the property was blocked which likely increased flood volume at the low spot; culvert capacity was exceeded causing surcharged outfall and limiting discharge into the downstream watercourse. (p17)</p></div><div class="nugget-popup"><p>Water overtopped onto Mill Hill Road (sic) during the heavy rainfall on 23rd December
