                var html_a4832bc05d7244be5457e7fbefca2013 = $(`<div id="html_a4832bc05d7244be5457e7fbefca2013" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>The Square, Earls Barton</h1><div class="nugget-popup"><p>Location identified as the subject of the Flood Investigation Report &mdash; the Square in Earls Barton was investigated for flooding. (p1)</p></div><div class="nugget-popup"><p>Moderate rainfall overwhelmed drainage so excess surface water flowed over ground and along the carriageway and kerbs into low points on the public highway and around private property, causing internal flooding to at least one property. [PAG] (p6)</p></div><div class="nugget-popup"><p>Drainage systems could not collect and carry rainwater, causing excess surface water to flow over ground and along the carriageway/kerbs/footways toward low points on the public highway and around private property, resulting in internal flooding of a property. [PAG] (p7)</p></div><div class="nugget-popup"><p>Internal flooding crossed the threshold of a property located at The Square; the property experienced internal flooding during the incident and has experienced internal flooding on more than one occasion in the last five years. [PAG] (p9)</p></div><div class="nugget-popup"><p>Identified as a low point receiving surface water sewers from High Street and West Street; investigation noted road gullies on approaches and carriageway/footway thresholds that influence water behaviour. These factors were associated with surface water flooding observed during the incident. [PAG] (p10)</p></div><div class="nugget-popup"><p>Surface water inundation of the highway and external flooding of private property caused by insufficient highway drain capacity (undated). On 16/09/2015 surface water from High Street and West Way overtopped kerbs at the corner of Station Road and The Square; water entered the doorway of a property on The Square and flowed into several rooms, nearly reaching the electrical cupboard. [TAB,PAG] (p11)</p></div><div class="nugget-popup"><p>Surface water built up at the corner of Station Road and Broad Street and flowed into the doorway of a property at The Square; internal flooding reached approximately 25 mm depth through rooms, required cleaning up and temporarily affected the business. (p12)</p></div><div class="nugget-popup"><p>Arrangement of kerbs and levels allowed surface water flowing off the carriageway to reach the footway and enter doorways of properties, making areas vulnerable to surface water flooding during the event. (p13)</p></div><div class="nugget-popup"><p>Floodwater overflowed onto the pavement and street area in front of a stone building; sandbags were placed at the building base to protect against ingress; debris and displaced paving material concentrated near the building entrance; construction materials and a traffic cone were affected by the floodwater. [IMG,PAG] (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property [PAG] (p6)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p7)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p9)</p></div><div class="nugget-popup quant"><p>1 property; 25 mm depth of water (p12)</p></div></div></body></div>`)[0];

                var html_40268fc097db265a37247c1d39583446 = $(`<div id="html_40268fc097db265a37247c1d39583446" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Broad Street, Earls Barton</h1><div class="nugget-popup"><p>Described as the low point where surface water sewers discharge and identified on flood mapping as high risk; several road gullies on Broad Street were seen to be blocked with leaves and silt during the flood investigation, implicating Broad Street in the surface water flooding observed. [PAG] (p10)</p></div><div class="nugget-popup"><p>Surface water continued east along Broad Street to the low point opposite Churchill Road, with water reported flowing out of road gullies at low areas; overtopping of kerbs at the low point flooded the footway and the road and footways at low points of Broad Street were flooded. (p12)</p></div><div class="nugget-popup"><p>Arrangement of kerbs and levels allowed surface water flowing off the carriageway to reach the footway and enter doorways of properties, making areas vulnerable to surface water flooding during the event. (p13)</p></div><div class="nugget-popup"><p>Floodwater covered the road and intersection, extended onto sidewalks and up to residential doorsteps on the south side of Broad Street, impeding vehicle movement and pedestrian access; parked vehicles were partially in standing floodwater. [IMG,PAG] (p37)</p></div><div class="nugget-popup"><p>Water emerging from a kerbside (offlet) gully and flowing onto the road and pavement, causing localised surface water flooding that pooled along the pavement and extended into the carriageway, affecting pedestrian movement and vehicle passage and posing a hazard. [IMG,PAG] (p38)</p></div><div class="nugget-popup"><p>Localised footway flooding on the south side of Broad Street opposite Churchill Road, with water pooling around a drain and wet pavement causing pedestrian inconvenience and indicating ineffective drainage/blockage. [IMG,PAG] (p42)</p></div><div class="nugget-popup"><p>Footway flooding on the south side of Broad Street opposite Churchill Road. Roof drainage downpipe discharging into a blocked highway gully contributed to surface water accumulation on the pavement, creating localized flooding and risk of water ingress to adjacent properties. [IMG,PAG] (p43)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 parked cars [IMG,PAG] (p37)</p></div></div></body></div>`)[0];

                var html_9b57f2e1f3bf25168f743cfaf3e3b83c = $(`<div id="html_9b57f2e1f3bf25168f743cfaf3e3b83c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Earls Barton</h1><div class="nugget-popup"><p>Earls Barton (the village containing The Square) is the locality investigated in the flood report. [PAG] (p1)</p></div><div class="nugget-popup"><p>The Square in Earls Barton was the subject of a Northamptonshire County Council Section 19 flood investigation, indicating a flooding incident occurred at The Square that is examined in the report. (p2)</p></div><div class="nugget-popup"><p>Moderate rainfall led to drainage being unable to collect and carry rainwater, with surface water following natural contours to low points on the public highway and around private property in the village, resulting in internal flooding of a property. [PAG] (p6)</p></div><div class="nugget-popup"><p>Localised surface water flooding following moderate rainfall led to surface water flowing to low points on the public highway in The Square and caused internal flooding of one property within Earls Barton. [PAG] (p7)</p></div><div class="nugget-popup"><p>The Square, within Earls Barton, experienced internal flooding of a property on 16th September 2015; the incident is part of repeated internal flooding incidents in the village over the last five years. [PAG] (p9)</p></div><div class="nugget-popup"><p>Flood incident investigation of the town identified surface water flooding issues during the event: public and surface water sewers conveyed flows into the town centre (The Square/Broad Street), road gullies were observed blocked and runoff from hardstanding and private car parks was seen entering the public highway. (p10)</p></div><div class="nugget-popup"><p>Moderate rainfall could not be collected or conveyed by drainage. Surface water flowed from private property and the highway on higher ground, following natural contours to low points in the village, causing flooding of low&ndash;lying areas, footways and properties; highway drainage and public sewers were relied upon and were vulnerable to blockage and exceedance. [PAG] (p13)</p></div><div class="nugget-popup"><p>Surface water overtopped kerbs and flowed towards private property; highway drainage capacity was identified as insufficient in areas creating flood risk to properties. Actions recommended include regular highway drainage cleansing, asset capacity assessments and review of carriageway/kerb/footway levels to reduce overtopping and runoff to properties. (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property [PAG] (p6)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p7)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p9)</p></div></div></body></div>`)[0];
