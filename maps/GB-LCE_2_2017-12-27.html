                var html_113a524d156cec7b1fcd8e7bb32c4a2a = $(`<div id="html_113a524d156cec7b1fcd8e7bb32c4a2a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Thornborough Road, Coalville</h1><div class="nugget-popup"><p>Prolonged rainfall and an obstructed connecting pipe in a trench alongside the property prevented capture of runoff, allowing excess surface water to flow overland into a residential property and cause internal damage. (p3)</p></div><div class="nugget-popup"><p>Internal property flooding occurred on Thornborough Road from unknown or multiple sources; this triggered the mandatory investigation criterion for internal property flooding. (p5)</p></div><div class="nugget-popup"><p>Repeated surface&ndash;water/road flooding at a low point in the highway. A historical incident (15 June 2016) flooded the highway due to surface water accumulation; residents and an investigation map for the 27 December 2017 incident indicate a blocked drainage outfall and a drainage trench from a property connecting to that outfall, implicating local drainage blockage in the December 2017 flooding. [IMG,MUL] (p7)</p></div><div class="nugget-popup"><p>Surface&ndash;water runoff concentrated along the road corridor on 27 December 2017; accumulations were shown adjacent to the road and adjacent properties and contributed to floodwater reaching the frontage, rear and sides of the affected property, enabling water to enter buildings through openings. [IMG] (p11)</p></div><div class="nugget-popup"><p>Storm (surface) water entered a property on Thornborough Road when saturated ground, a blocked outfall in a trench alongside the property and a narrow gap at the side of the building allowed ingress, causing internal flooding of the property. (p13)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 residential property (p3)</p></div><div class="nugget-popup quant"><p>1 report (15 June 2016) [IMG,MUL] (p7)</p></div><div class="nugget-popup quant"><p>1 residential property (p13)</p></div></div></body></div>`)[0];
