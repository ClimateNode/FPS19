                var html_5897535c3edff393ec56c3cae871752e = $(`<div id="html_5897535c3edff393ec56c3cae871752e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Downing Close, Mildenhall</h1><div class="nugget-popup"><p>Internal flooding of residential properties on Downing Close. The report records internal flooding of five properties during the single 23/12/2020 incident and that one property experienced internal flooding on more than one occasion. (p2)</p></div><div class="nugget-popup"><p>Repeated highway flooding across the full width of the road and footway displaced by passing vehicles (bow waves), which pushed standing water onto surrounding footways, gardens and into nearby properties. Internal flooding occurred in ground&ndash;floor rooms (lounge, kitchen and hall), causing damage to furnishings and increased stress for residents despite use of property&ndash;level resilience (e.g. sandbags). [PAG,MUL] (p3)</p></div><div class="nugget-popup"><p>Highway gullies surcharged during the storm, causing standing water to flow down the carriageway and accumulate in low&ndash;lying areas. Floodwater on the highway was displaced by passing vehicles onto lower&ndash;fronted properties, contributing to internal flooding of adjacent homes and preventing drainage for 24&ndash;48 hours following rainfall. [MUL] (p4)</p></div><div class="nugget-popup"><p>Highway gullies surcharged during the storm on 23rd December 2020 causing water to flow down the highway and accumulate in low&ndash;lying areas. Highways drainage discharges to a series of soakaways to the west of the highway which may require relocating to permit continued maintenance access. Highway gullies were cleansed and the soakaway inspected in February 2021 but a full condition survey/cleanse was prevented by high groundwater; a repeat visit was scheduled. [TAB,PAG] (p5)</p></div><div class="nugget-popup"><p>Highways surface&ndash;water drainage (specifically soakaways) were silted/blocked requiring cleansing and a CCTV survey to record points of discharge and address points of concern; actions instructed to restore highway drainage function and prevent further surface&ndash;water flooding. (p6)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>internal flooding of one property (on more than one occasion); internal flooding of five properties (during one incident) (p2)</p></div><div class="nugget-popup quant"><p>16&ndash;20 m length of road; 100&ndash;150 mm depth [PAG,MUL] (p3)</p></div><div class="nugget-popup quant"><p>3 internal rooms (lounge, kitchen and hall) reported flooded in affected properties [MUL] (p4)</p></div></div></body></div>`)[0];
