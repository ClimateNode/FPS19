                var html_3cd3fe15fe4bf05beae343ed454a009a = $(`<div id="html_3cd3fe15fe4bf05beae343ed454a009a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Nottinghamshire</h1><div class="nugget-popup"><p>Storm Henk on 02/01/2024 produced heavy rainfall that led to widespread flooding across Nottinghamshire. River Trent surcharging and resulting knock&ndash;on failures of local watercourses and surface&ndash;water assets caused flooding across catchments along the Trent corridor. (p3)</p></div><div class="nugget-popup"><p>Flooding across the county led to delivery of sandbags to affected communities and the closure of roads to protect at&ndash;risk areas and promote road safety. (p6)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>69 roads (p6)</p></div></div></body></div>`)[0];

                var html_2536413d6265749b1a7128d255e1e409 = $(`<div id="html_2536413d6265749b1a7128d255e1e409" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Newark and Sherwood</h1><div class="nugget-popup"><p>Communities across the district experienced surface water flooding which then continued as river flooding. The event led to evacuations (residents helped to evacuate their homes), the need for emergency accommodation, distribution of large numbers of aqua sacs, and subsequent cleanup operations (cleaning roads and paths and removal of bulky waste from flooded homes). The council also contacted affected individuals to identify humanitarian needs and commenced recovery actions including grant funding where eligible. (p6)</p></div></div></body></div>`)[0];
