                var html_a61804e4279948cdb7aa73c5f9f55c4c = $(`<div id="html_a61804e4279948cdb7aa73c5f9f55c4c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>B3157 at Portesham</h1><div class="nugget-popup"><p>Flows from Front Street and surrounding lanes conveyed onto the B3157 Coast Road, causing significant traffic disruption and closure of the road for an extended period; highway inundated by floodwater. (p8)</p></div><div class="nugget-popup"><p>Mud and debris from the event contributed to blocking highway gullies along the B3157, impairing drainage and leading to surface water issues on the road. (p13)</p></div><div class="nugget-popup"><p>Floodwaters flowed onto and across the B3157; vehicles travelling the road produced bow&ndash;waves that exacerbated property flooding. Residents reported delays in road closure during the event. (p15)</p></div><div class="nugget-popup"><p>Floodwater reached the bottom of Front Street and flowed onto the B3157 Coast Road, causing carriageway inundation and prompting an emergency response. (p26)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>flood depths of up to approximately 400mm on the highway (p8)</p></div></div></body></div>`)[0];

                var html_00d58a8cb4f8a423e755812c0ee6f0bb = $(`<div id="html_00d58a8cb4f8a423e755812c0ee6f0bb" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Front Street, Portesham</h1><div class="nugget-popup"><p>Front Street experienced surface water flooding when overland flows and out&ndash;of&ndash;bank flows from Portesham Stream inundated the road; flooding then conveyed onto the B3157 Coast Road causing major traffic disruption and closure. (p8)</p></div><div class="nugget-popup"><p>One property experienced internal flooding due to fluvial (river) flooding during the event. [TAB] (p9)</p></div><div class="nugget-popup"><p>Surface water was conveyed downhill towards Front Street, carrying and depositing a large amount of silt and gravel from the surrounding hills, Rocky Lane and the eroding verge beside the C112 road. (p10)</p></div><div class="nugget-popup"><p>High&ndash;velocity surface water and runoff from the surrounding hills and C112 overwhelmed the highway drainage; the highway drain surcharged and flowed along Front Street. A watercourse on the western side overtopped upstream of several culverts and flowed back onto the road. A locked sluice gate prevented additional flows being diverted to the elevated eastern channel. Obstructions within the channel caused one property to flood. [IMG,PAG] (p11)</p></div><div class="nugget-popup"><p>Exceedance flows were conveyed onto Front Street; mud and debris contributed to blocking highway gullies, causing surface water to flow/pond on the carriageway. (p13)</p></div><div class="nugget-popup"><p>Front Street was subject to flooding risk that prompted actions to formalise a management plan and coordinate bodies to manage drainage and reduce future surface water flooding. [TAB] (p18)</p></div><div class="nugget-popup"><p>Floodwater overtopped boundaries and ran from raised garden areas onto the pavement and carriageway, inundating the road outside residential properties; muddy runoff and soil washed over the pavement and across the carriageway. [PAG] (p25)</p></div><div class="nugget-popup"><p>Footpath and adjacent carriageway were inundated; water flowing over the sidewalk beside a stone wall with emergency vehicles on the road responding to the flooding. [PAG] (p26)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>flood depths up to approximately 400 mm on the highway (p8)</p></div><div class="nugget-popup quant"><p>1 property [TAB] (p9)</p></div><div class="nugget-popup quant"><p>one property [IMG,PAG] (p11)</p></div></div></body></div>`)[0];

                var html_e1884e7e9189ac73254d33d5288db2c7 = $(`<div id="html_e1884e7e9189ac73254d33d5288db2c7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Rocky Lane, Portesham</h1><div class="nugget-popup"><p>Experienced surface water flooding from overland flows originating on higher ground after heavy rainfall; runoff from the tarmacked track on Rocky Lane was reported by residents as contributing to surface water issues that reached the village. [PAG] (p8)</p></div><div class="nugget-popup"><p>Surface water flooding impacted Rocky Lane during the 19 January 2019 event; runoff issues from Rocky Lane were reported and one property experienced internal flooding. [TAB] (p9)</p></div><div class="nugget-popup"><p>Erosion of the verge/hills around Rocky Lane mobilised silt and gravel that were conveyed downhill in the flood flows and deposited on Front Street, contributing debris in the flood. (p11)</p></div><div class="nugget-popup"><p>Overland flows from surrounding hills were conveyed via a farm track and the Right of Way onto Rocky Lane, bringing significant silt and gravel which blocked highway gullies and increased silt load in the watercourse. A soakaway at the entrance to the RoW could not cope with the volume of surface water. A recently tarmacked section increased surface water run&ndash;off velocity and changed the camber, directing flow towards properties on the southern side of the lane; one property experienced internal flooding. [IMG] (p12)</p></div><div class="nugget-popup"><p>Surface&ndash;water runoff and silt deposition caused overland flow and flooding affecting Rocky Lane; recommended Natural Flood Management interventions to reduce runoff and silt deposition. [TAB] (p18)</p></div><div class="nugget-popup"><p>Surface water flooding affected the lane; the soakaway was inspected because flows were unable to enter the system and the surface water drainage of the adjacent tarmacked track requires improvements to pass flows. [TAB] (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property internally flooded [TAB] (p9)</p></div><div class="nugget-popup quant"><p>one property [IMG] (p12)</p></div></div></body></div>`)[0];

                var html_4dd23c5846e65d4c3307f08ec1909b03 = $(`<div id="html_4dd23c5846e65d4c3307f08ec1909b03" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Portesham</h1><div class="nugget-popup"><p>Portesham stream flows southwards through the village and splits into raised channels; the village is the subject of the Flood Investigation Report and the catchment&#8217;s flashy response to storm rainfall is identified as causing flood risk to the settlement. [IMG,PAG] (p6)</p></div><div class="nugget-popup"><p>Overland flows from higher ground converged on the village leading to surface water inundation of streets and properties; local drainage was overwhelmed. [IMG,PAG] (p8)</p></div><div class="nugget-popup"><p>Village&ndash;wide flooding during the 19 January 2019 event: property and highway flooding occurred during a highly localised afternoon rainfall. Drainage issues were reported (blocked/restricted culverts, blocked highway gullies, and non&ndash;operating flow control sluices) which contributed to flood impacts across the village. [TAB,PAG] (p9)</p></div><div class="nugget-popup"><p>Surface water from the saturated catchment (hills to the north and from the C112 road) was conveyed downhill into the village, bringing large amounts of silt and gravel from surrounding hills, Rocky Lane and the eroding verge of the C112 road. [PAG] (p10)</p></div><div class="nugget-popup"><p>Surface water runoff from surrounding hills and C112 and overtopping of the local stream caused flooding on Front Street in Portesham, surcharging highway drains, depositing silt and gravel, and resulting in at least one property being flooded. [IMG,PAG] (p11)</p></div><div class="nugget-popup"><p>Flood&ndash;response and mitigation works implemented after the event: culvert under the track to the Dairy Farm cleared and the upstream watercourse desilted; Malthouse Meadows side weir set to the agreed level and formed in brick; obstructions cleared from the swale on the inlet to the attenuation pond; attenuation pond base level corrected (soil removed and now operating at design capacity); a rain gauge was installed by the LLFA to record storm events. [TAB,PAG] (p17)</p></div><div class="nugget-popup"><p>The village experienced surface&ndash;water runoff and overland flow during the event, causing highway flooding, silt deposition and drainage problems (references to Front Street, Malthouse Meadows and sluice gate operation are made in relation to managing flood risk). [TAB,PAG] (p18)</p></div><div class="nugget-popup"><p>Village experienced surface water flooding associated with intense rainfall on 19 January 2019, prompting a Section 19 flood investigation. [IMG,PAG] (p21)</p></div><div class="nugget-popup"><p>Flood extents from a 1:100&ndash;year surface water event encroached on built&ndash;up areas of Portesham, with infrastructure such as roads and parking areas affected. Appendix photos show flooding in the elevated western channel looking north&ndash;east towards Front Street. [IMG,PAG] (p24)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>9 properties [IMG,PAG] (p8)</p></div><div class="nugget-popup quant"><p>9 properties internally flooded (total); includes 6 properties in Goose Hill, 1 in Rocky Lane, 1 in Malthouse Meadows, 1 on Front Street [TAB,PAG] (p9)</p></div><div class="nugget-popup quant"><p>one property [IMG,PAG] (p11)</p></div></div></body></div>`)[0];
