                var html_dd94aabdcaf9cb41ecb28b13b9a784f6 = $(`<div id="html_dd94aabdcaf9cb41ecb28b13b9a784f6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Pig and Whistle (former)</h1><div class="nugget-popup"><p>The bridge by the Pig and Whistle was described as not suitable to convey the volume of water; this contributed to blockage/backup of the brook and local flooding. [TAB,PAG] (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 inches [TAB,PAG,MUL] (p19)</p></div></div></body></div>`)[0];

                var html_06d9a426cf85d00825a878ef09f9bc10 = $(`<div id="html_06d9a426cf85d00825a878ef09f9bc10" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Pix Brook</h1><div class="nugget-popup"><p>Debris was blocking the brook causing water to enter residential properties; flow was restored after debris was cleared. The blockage and associated flooding prompted deployment of responders and mitigation measures. (p5)</p></div><div class="nugget-popup"><p>During the intense rainfall event on 4 July 2015 a significant quantity of debris (vegetation, timber and watercress) was mobilised and conveyed along Pix Brook to downstream locations, contributing to blockage risk at the twin culvert and requiring debris management measures. [PAG] (p6)</p></div><div class="nugget-popup"><p>Debris blockage of the Pix Brook twin&ndash;culvert caused surface water to accumulate upstream and contributed to internal and external flooding in the affected area. Residents reported being affected internally or externally on 4th July 2015; debris blocking the culvert on 24th July 2015 caused surface water to accumulate on Brook Street/Coppice Mead. IDB undertook maintenance and a 2015 project to reduce culvert blocking and enable safe debris removal. [MUL] (p7)</p></div><div class="nugget-popup"><p>On 4th July 2015 heavy rainfall produced high flows in the Pix Brook; debris (predominantly watercress) accumulated at the trash screen at the Brook Street road junction, overwhelming the screen and blocking the twin&ndash;culvert highway culvert. This caused upstream water levels to rise rapidly, overtopping the brook banks and flooding the local area, resulting in internal and external flooding, risk to life and obstruction of access. (p8)</p></div><div class="nugget-popup"><p>Trash screens at Brook Street, Valerian Way and other structures became blocked and were cleared following the flood; debris removal was necessary to restore flow. [PAG] (p9)</p></div><div class="nugget-popup"><p>Flooding of Pix Brook on 4 July 2015 led to blockages at trash screens and other structures (notably at Brook Street and Valerian Way), contributing to local flooding that prompted emergency attendance by the Internal Drainage Board to clear/remove screens and a Section 19 investigation coordinated by Central Bedfordshire Council. (p10)</p></div><div class="nugget-popup"><p>Pix Brook is described as having a significant debris load (sources include a nearby conservation woodland, watercress growth and garden/back&ndash;channel debris adjacent to Brook Street) that can block culverts and reduce channel capacity during flood flows. Specific issues cited include potential debris blocking at the A507 culvert, sediment accumulation at the Brook Street highway bridge reducing discharge capacity, and interaction with the Pix Brook Reservoir flood gates &mdash; all contributing to flooding risk in the locality. [TAB,PAG] (p12)</p></div><div class="nugget-popup"><p>The Pix Brook overtopped/caused local flooding in Stotfold on 4 July 2015. Debris from adjacent areas (notably watercress and tree branches) was identified as blocking the channel and contributing to flow obstructions along the banks, increasing flood risk to nearby properties and land. (p13)</p></div><div class="nugget-popup"><p>Identified as a prime source of debris (including watercress and woody branches) that was transported and accumulated in the channel and at outfalls, increasing debris loading and contributing to blockages during the 4 July 2015 flood; prompted recommendations for trash screens, maintenance, baffle hedges and other controls to reduce debris entering the channel. [PAG] (p14)</p></div><div class="nugget-popup"><p>High flows in the Pix Brook caused the brook to burst its banks, inundating adjacent woodland and mobilising woody debris which was carried downstream (identified as the source of debris found at Brook Street). (p15)</p></div><div class="nugget-popup"><p>Vegetation (identified as watercress) from upstream woodland was dislodged and flowed downstream, with similar weed observed having been pulled out at Brook Street &mdash; indicating vegetation/debris transport by the flood flows and potential for local channel/blockage issues. [PAG] (p17)</p></div><div class="nugget-popup"><p>Flooding occurred along the Pix Brook corridor on 4 July 2015. The post&ndash;event annotated map identifies culverts (Hitchin Road, Brook Street), IDB trash screens (Brook Street, Valerian Way), a standalone reservoir and control gates, and the proximity of Letchworth sewage works as relevant to the event and response. The report notes actions to increase retention in the lower floodplain and the need to intercept debris before the two channels meet. [IMG] (p18)</p></div><div class="nugget-popup"><p>The brook became blocked by debris and by a recently installed trash screen/bridge, forming a dam that prevented flow and caused the brook to overflow into gardens, garages, vehicles and streets. [TAB,PAG,MUL] (p19)</p></div><div class="nugget-popup"><p>The brook course was blocked by debris and a recently installed trash gate/trash screen which collected debris and was not cleared, causing the brook to be unable to convey storm flows. These blockages led to overflow and flooding of adjacent gardens and streets on 04/07/2015 and during heavy rainfall in mid&ndash;July 2015. [PAG,MUL] (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>12 properties; two properties (p5)</p></div></div></body></div>`)[0];

                var html_f876b6e25f57e24da6edb85c95bd1320 = $(`<div id="html_f876b6e25f57e24da6edb85c95bd1320" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Brook Street Bridge</h1><div class="nugget-popup"><p>A newly installed trash screen/strainer at the Brook Street bridge became blocked by debris on 04/07/2015 and acted like a dam, holding back flow. The blockage caused upstream water to build up and overflow into back gardens, garages, houses and along Brook Street. [TAB] (p19)</p></div></div></body></div>`)[0];

                var html_95e487a9eb3dd3f34fd8af79bdc86787 = $(`<div id="html_95e487a9eb3dd3f34fd8af79bdc86787" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Brook Street, Stotfold</h1><div class="nugget-popup"><p>Debris blocking Pix Brook at Brook Street caused water to enter residential properties; Fire & Rescue were on site and deployed aqua sacs to limit flood water entering properties; IDB operatives and Highways/grab lorry cleared debris and the brook was reported to be flowing again; Brook Street trash screen was cleared/removed by IDB. (p5)</p></div><div class="nugget-popup"><p>Surface water accumulated on Brook Street (and Coppice Mead) when debris blocked the twin&ndash;culvert downstream, causing obstruction of access (estimated 24 hours) and contributing to internal/external flooding reported by residents on 4th July 2015. [MUL] (p7)</p></div><div class="nugget-popup"><p>On 4th July 2015 the trash screen at the road junction on Brook Street became blocked by debris during high flows, preventing flow into the highway culvert and causing overtopping and flooding of the highway/local area and obstruction of access. (p8)</p></div><div class="nugget-popup"><p>Trash screens at Brook Street became obstructed during the flood; the Internal Drainage Board attended on 4th July to assist in clearing the trash screen(s). (p10)</p></div><div class="nugget-popup"><p>Accumulation of sediment and debris in the Brook Street highway bridge and the adjacent back channel reduced the discharge capacity of the highway asset and was identified as a debris source that could contribute to flooding of the gardens adjacent to the back channel. [TAB] (p12)</p></div><div class="nugget-popup"><p>Debris accumulated in the back channel and at Brook Street (the report states the majority of the debris at Brook Street came from nearby woodland), reducing channel capacity and contributing to flooding and debris entry into gardens during the 4 July 2015 event; recommended inspection, removal of debris sources and surveying of the highway bridge for sediment. [PAG] (p14)</p></div><div class="nugget-popup"><p>Deposition/accumulation of debris at Brook Street caused by flood flows in the Pix Brook; the report states the majority of debris at Brook Street originated from the nearby woodland washed into the brook. (p15)</p></div><div class="nugget-popup"><p>High flows dislodged vegetation (identified as watercress) which was pulled out at Brook Street and transported downstream, indicating strong flood flows and debris movement. (p16)</p></div><div class="nugget-popup"><p>Brook Street is shown on the 4 July 2015 annotated map as the location of a highway culvert and an IDB Brook Street trash screen; these features are identified as relevant to flood flow and debris interception during the event. [IMG] (p18)</p></div><div class="nugget-popup"><p>Overflow from the brook (exacerbated by a blocked trash/gate at the Brook Street bridge) caused flooding down Brook Street and into adjacent gardens and properties. Reports note water overflowing into Coppice Mead and previous events where water rose high enough to threaten properties; the fire brigade was called to help divert road water on an earlier occasion. [TAB,PAG,MUL] (p19)</p></div><div class="nugget-popup"><p>A blocked trash screen/trash strainer at the Brook Street bridge on 04/07/2015 caused the Pixy to overflow directly into back gardens and down Brook Street into Coppice Mead. Heavy rainfall on 16/17 July 2015 also caused overflow into back gardens. The floodplain was ineffective and the brook course was blocked so no relief flow was available. [MUL] (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>12 properties; 2 properties (electricity isolated) (p5)</p></div></div></body></div>`)[0];
