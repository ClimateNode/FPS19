                var html_24462596ef99b93fd0b4e3d49e6fa9a7 = $(`<div id="html_24462596ef99b93fd0b4e3d49e6fa9a7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Deben</h1><div class="nugget-popup"><p>The River Deben overtopped during the event; overtopping combined with converging overland flows to produce internal flooding of properties, infrastructure and services in Wickham Market. (p4)</p></div><div class="nugget-popup"><p>Overtopping of the River Deben contributed fluvial floodwater to Wickham Market, exacerbating internal flooding in the village. (p7)</p></div><div class="nugget-popup"><p>The River Deben (designated Main River) is identified as a source of fluvial flooding that contributed to the flooding in Wickham Market during the Storm Babet event. [PAG] (p8)</p></div><div class="nugget-popup"><p>Overtopping of the River Deben affected the low&ndash;lying northeast part of Wickham Market, with the main river flow path running along the eastern side of the village and contributing to fluvial flooding there. [PAG] (p10)</p></div><div class="nugget-popup"><p>Overtopping of the River Deben (noted north and south of the High Street bridge) was described as a significant cause of flooding: flow paths overtopped banks and spread through Deben Mills and the Rackham estate, across the highway and into properties on both sides of the High Street and along Spring Lane, causing internal property flooding. (p12)</p></div><div class="nugget-popup"><p>The river overtopped north and south of the main road (High Street) bridge causing flow paths across the access road to Deben Mill, west and south along the highway and down the High Street into Spring Lane. Overtopping and bank breach/overflow sent water into properties (front and rear), flowed over the B1078 and down Ashe Road into properties, and contributed to high&ndash;velocity flows that eroded highway banks and deposited mud. Silt build&ndash;up in the main river channel adjacent to the B1078 bridge was identified after the event and is being investigated as reducing channel capacity. (p13)</p></div><div class="nugget-popup"><p>The River Deben overtopped its channel; flood water flowed from the overtopped river down High Street, Spring Lane and across Rackham's and Deben Mills estates. Significant silt build&ndash;up adjacent to the B1078 road bridge was identified and may have reduced channel capacity, contributing to overtopping and altered flow paths. [IMG,PAG] (p14)</p></div><div class="nugget-popup"><p>The River Deben caused flooding impacts in the Wickham Market area during the event, with debris in the river contributing to reduced channel conveyance; this prompted community&ndash;led debris removal and prompted the Environment Agency to plan localised desilting and mapping of flood extents. [TAB,PAG] (p30)</p></div><div class="nugget-popup"><p>Silt and debris build&ndash;up in the main channel (north and south of the main road bridge) increased flood risk; removal of debris by landowners occurred and the Environment Agency/SCC Highways planned clearance and commissioned hydraulic modelling to assess silt impacts on flood risk. [TAB] (p32)</p></div><div class="nugget-popup"><p>Silt build&ndash;up in the main channel of the River Deben north and south of the main road bridge reduced channel capacity and was identified as contributing to flood risk; clearance of silt and hydraulic modelling have been proposed to understand and reduce future river flooding. (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>48 properties (p12)</p></div><div class="nugget-popup quant"><p>60cm internal flooding; 100cm external flooding (wrack marks) (p13)</p></div></div></body></div>`)[0];

                var html_8a9dc91568fd87e0ff34beab578bec5f = $(`<div id="html_8a9dc91568fd87e0ff34beab578bec5f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Broad Road, Wickham Market</h1><div class="nugget-popup"><p>Floodwater affected the street and adjacent properties during the October 2023 event, arising from surface water runoff and overwhelmed drainage/sewer systems. (p7)</p></div><div class="nugget-popup"><p>During Storm Babet (18 Oct 2023 &ndash; 21 Oct 2023) Broad Road was affected by fluvial and pluvial flooding, causing highway inundation and external flooding of the road and surrounding land. [PAG] (p8)</p></div><div class="nugget-popup"><p>Surface water runoff overwhelmed drainage and flowed into the village along a high&ndash;risk flow path affecting Broad Road, contributing to property inundation. (p18)</p></div><div class="nugget-popup"><p>A piped section of a watercourse that appears to continue into the Broad Road housing area was overwhelmed; overland flow travelled through gardens and onto the highway, affecting properties from the front and rear. [PAG] (p19)</p></div><div class="nugget-popup"><p>Overland flows from fields to the west and overwhelmed local drainage caused flooding to the front and back of properties. Back gardens of properties on the east side (back&ndash;to&ndash;back with Broadway properties) flooded and water entered properties via rear doors; the Broad Road carriageway itself did not flood due to slightly higher ground. (p20)</p></div><div class="nugget-popup"><p>Surface water affected the road and local drainage; residents on Broad Road were included in proposed investigations of rainwater collection and drainage improvements to reduce discharge during storm events. [TAB,PAG] (p32)</p></div><div class="nugget-popup"><p>Surface water drainage issues linked to ineffective gullies in the High Street / Broad Road area led to flooding impacts on the highway; actions proposed to investigate and improve gullies. (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than 10 properties (combined across the area including Broad Road, Broadway and Orchard Place West Wickham Market) (p18)</p></div><div class="nugget-popup quant"><p>more than 10 properties (area&ndash;wide) [PAG] (p19)</p></div><div class="nugget-popup quant"><p>external flooding reached 60 cm in gardens; internal flooding ranged 10&ndash;20 cm at various properties (p20)</p></div></div></body></div>`)[0];

                var html_30efdcfaab2a5449595483766b98909d = $(`<div id="html_30efdcfaab2a5449595483766b98909d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Broadway, Wickham Market</h1><div class="nugget-popup"><p>Flooding on the street and to adjacent properties caused by surface water runoff and overwhelmed drainage/sewer systems during the October 2023 event. (p7)</p></div><div class="nugget-popup"><p>During Storm Babet (18 Oct 2023 &ndash; 21 Oct 2023) Broadway experienced fluvial and surface water flooding, leading to highway inundation and external flooding to the street and adjacent properties/land. [PAG] (p8)</p></div><div class="nugget-popup"><p>Surface water runoff from surrounding fields and across the primary school field flowed into the village via Broadway, overwhelming drainage and inundating properties. (p18)</p></div><div class="nugget-popup"><p>The piped section of the watercourse was overwhelmed and flow travelled through gardens and onto the highway, affecting properties from the front and rear in the Broadway area. [PAG] (p19)</p></div><div class="nugget-popup"><p>Surface water runoff from fields to the west flowed down a footpath between houses on the west side, overwhelming highway drainage and causing the road to flood. Floodwater accumulated at low points between Broadway and Broad Road and flooded back gardens of properties, entering houses via rear doors; low&ndash;lying properties were worst affected. (p20)</p></div><div class="nugget-popup"><p>Surface water affected the road and its highway drainage assets; actions recommended to investigate and increase maintenance of gullies and drainage to manage surface water flows. [TAB,PAG] (p32)</p></div><div class="nugget-popup"><p>Surface water overwhelmed or was not drained effectively along the southern High Street area serving Broadway due to ineffective/blocked gullies; investigations and gully improvements planned to reduce recurrence. (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than 10 properties (combined across the area including Broad Road, Broadway and Orchard Place West Wickham Market) (p18)</p></div><div class="nugget-popup quant"><p>more than 10 properties (area&ndash;wide, West Wickham Market including Orchard Place, Broadway and Broad Road) [PAG] (p19)</p></div><div class="nugget-popup quant"><p>external flooding reached 60 cm in gardens; internal flooding ranged 10&ndash;20 cm at various properties (p20)</p></div></div></body></div>`)[0];

                var html_bcc61881cc0014f2d31367b2a984168c = $(`<div id="html_bcc61881cc0014f2d31367b2a984168c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Orchard Place, Wickham Market</h1><div class="nugget-popup"><p>Impacted by floodwater during the October 2023 event, with surface water runoff and overwhelmed drainage contributing to flooding of the street and nearby properties. (p7)</p></div><div class="nugget-popup"><p>During Storm Babet (18 Oct 2023 &ndash; 21 Oct 2023) Orchard Place was affected by fluvial and surface water flooding, causing highway/external flooding of the street and nearby land. [PAG] (p8)</p></div><div class="nugget-popup"><p>Floodwaters originating to the west of Orchard Place contributed to a flow path through the primary school field into the village, overwhelming drainage capacity locally. (p18)</p></div><div class="nugget-popup"><p>Surface water runoff from the west entered properties from the rear; overwhelmed or slow&ndash;draining highway gullies/roads caused road flooding and water to enter properties from the front. A nearby piped watercourse was overwhelmed, leading to flow through gardens and onto the highway affecting properties. [PAG] (p19)</p></div><div class="nugget-popup"><p>A piped watercourse north of Orchard Place was overwhelmed; the piped section may be damaged or collapsed, causing flow to travel through gardens and onto the highway and affect properties from both front and rear. [PAG] (p20)</p></div><div class="nugget-popup"><p>Possible impediment to drainage from a piped section north of Orchard Place contributed to surface water becoming unable to flow away, with reports of water bubbling up and pooling at low points; reactive highway drainage works were carried out on the day of the event. (p21)</p></div><div class="nugget-popup"><p>Orchard Place identified as an affected road; investigation of a culvert north of Orchard Place to check for blockages, size and capacity was recommended following flooding that impeded water movement. [TAB,PAG] (p32)</p></div><div class="nugget-popup"><p>A culvert north of Orchard Place is to be investigated because it may have been blocked or undersized during the event, reducing conveyance and contributing to local flooding; checks planned on size, condition and outfall. (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than 10 properties (combined across the area including Broad Road, Broadway and Orchard Place West Wickham Market) (p18)</p></div><div class="nugget-popup quant"><p>more than 10 properties (area&ndash;wide, West Wickham Market including Orchard Place, Broadway and Broad Road) [PAG] (p19)</p></div><div class="nugget-popup quant"><p>external flooding reached 60 cm in gardens; internal flooding ranged 10&ndash;20 cm at various properties [PAG] (p20)</p></div></div></body></div>`)[0];

                var html_839f4d381693cafb7c587f148344d681 = $(`<div id="html_839f4d381693cafb7c587f148344d681" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ash Road, Campsea Ashe</h1><div class="nugget-popup"><p>Part of the North investigation zone affected during Storm Babet (20 Oct 2023). Properties on Ashe Road experienced internal flooding as floodwater entered buildings; flooding sources reported for the village include surface water runoff from surrounding fields, overtopping of the river Deben/other watercourses, and overwhelmed drainage/sewers. (p7)</p></div><div class="nugget-popup"><p>Flood water that overtopped the river bank north of the mill travelled over the B1078 and down Ashe Road, entering properties from the front. Properties on Ashe Road experienced internal flooding; flow damaged brickwork and mortar, caused walls to collapse in places, livestock rescues were undertaken and some homeowners were evacuated. (p13)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>internal flooding reached 60cm; external wrack marks at 100cm (p13)</p></div></div></body></div>`)[0];

                var html_73dc6817b494ba745f146e36e949f786 = $(`<div id="html_73dc6817b494ba745f146e36e949f786" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>High Street, Wickham Market</h1><div class="nugget-popup"><p>Both the North and South sections of High Street are identified in the report as affected zones. Properties along High Street experienced internal flooding during the October 2023 event as floodwater entered buildings; reported sources include surface water runoff, overtopping of the Deben/other watercourses, and overwhelmed drainage/sewers. (p7)</p></div><div class="nugget-popup"><p>During Storm Babet (18 Oct 2023 &ndash; 21 Oct 2023) High Street was affected by fluvial flooding from the River Deben and by surface water (pluvial) flooding, causing highway inundation and external flooding of the road and adjacent land/properties. [PAG] (p8)</p></div><div class="nugget-popup"><p>River overtopping north and south of the main road bridge produced a highway flow path along the High Street, affecting properties on both sides. Flood water flowed down the highway toward Spring Lane, entered properties through front doors (exacerbated by bow waves from passing vehicles), and later surged across rear gardens causing internal flooding. [PAG] (p13)</p></div><div class="nugget-popup"><p>Floodwater from the overtopped River Deben flowed down High Street; highway drainage gullies became overwhelmed by the rainfall and river&ndash;derived flows. (p14)</p></div><div class="nugget-popup"><p>Low spots on the west side of the High Street collected surface water during heavy rainfall. Water running off the highway inundated nearby properties; inadequate or blocked highway gullies and exceeding of the drainage network design capacity contributed to the flooding. (p17)</p></div><div class="nugget-popup"><p>Surface&ndash;water/road drainage issues reported on High Street (south) leading to planned gully investigations and increased highway drainage maintenance to reduce future surface water flooding. [TAB,PAG] (p32)</p></div><div class="nugget-popup"><p>Southern High Street experienced surface water flooding related to ineffective gullies and drainage; investigations include culvert checks, potential new highway drainage, and assessment of the nearby pumping station/outfall to prevent river backflow during high River Deben levels. [PAG] (p33)</p></div><div class="nugget-popup"><p>Surface water flows affected the High Street during the event; the pumping station north of High Street is being reviewed for adequate capacity and the suitability of a non&ndash;return valve on the outfall to prevent ingress during high river levels. Additional highway drainage assets are being considered to manage surface water along High Street. (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>internal flooding reached 60cm; external wrack marks at 100cm [PAG] (p13)</p></div></div></body></div>`)[0];

                var html_4f52ab496714980e825c66fc7c6fdb4f = $(`<div id="html_4f52ab496714980e825c66fc7c6fdb4f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wickham Market</h1><div class="nugget-popup"><p>Properties on High Street, Spring Lane, Ashe Road, and the Deben Mill and Rackham estates experienced front&ndash;and&ndash;rear flooding as flood water from the overtopped river and from surface water flow paths entered homes (including through front doors). Flooding persisted on the highway during the morning of 20 October, later surges inundated gardens and caused internal flooding. Flood flows damaged brickwork and mortar, caused walls to collapse, required livestock rescues and led to evacuations of some homeowners. Highway erosion and mud deposition created hazardous driving conditions. (p13)</p></div><div class="nugget-popup"><p>Surface water runoff from surrounding fields caused flooding across parts of the town; the eastern area was the least affected but low&ndash;lying streets (Mill Lane and Chapel Lane) acted as surface&ndash;water flow paths that concentrated runoff and exacerbated local flooding. (p15)</p></div><div class="nugget-popup"><p>Southern Wickham Market experienced surface water flooding from significant rainfall and runoff. Water ran off the highway into low spots and into properties; highway drainage capacity was exceeded and some gullies were not operating at the time, increasing flood severity. (p17)</p></div><div class="nugget-popup"><p>Significant rainfall produced high levels of surface water runoff across the western catchment that overwhelmed drainage systems, leading to inundation of properties in the village (notably Broad Road, Broadway and Orchard Place areas). (p18)</p></div><div class="nugget-popup"><p>Significant rainfall produced large volumes of surface water runoff from fields to the west that overwhelmed highway and local drainage, causing pooling at low points, garden inundation and internal flooding of properties across the village. Historic filled&ndash;in ponds likely reduced attenuation locally. Some reactive highway drainage works were carried out during the event. (p20)</p></div><div class="nugget-popup"><p>Significant rainfall produced large volumes of surface&ndash;water runoff from fields to the west which overwhelmed highway drainage, causing flood water to flow to lowest points and pool within the town (including the area around the primary school and low&ndash;lying highways). [IMG] (p21)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>60cm internal flooding; 100cm external flooding (wrack marks) (p13)</p></div><div class="nugget-popup quant"><p>more than 10 properties (known affected in the west of the village) (p18)</p></div><div class="nugget-popup quant"><p>external flooding reached 60 cm in gardens; internal flooding ranged 10&ndash;20 cm at various properties (p20)</p></div></div></body></div>`)[0];
