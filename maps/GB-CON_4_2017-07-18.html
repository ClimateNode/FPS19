                var html_62baa055e99f95dda9a256d77ddb7a4a = $(`<div id="html_62baa055e99f95dda9a256d77ddb7a4a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Polecoverack Lane, Coverack</h1><div class="nugget-popup"><p>Removal of debris from the damaged lane and removal of contaminated items as part of recovery works. (p12)</p></div><div class="nugget-popup"><p>On 18th July 2017 the lane became a flowroute for overland runoff and rapidly flowing water during the extreme rainfall event; drainage was overwhelmed and it contributed to surface&ndash;water flow through the village. (p42)</p></div><div class="nugget-popup"><p>Surface&ndash;water flooding down Polcoverack Lane is specifically noted on the Environment Agency reconnaissance map for the 18th July 2017 event. The hydraulic model did not reproduce this flow path, but reconnaissance indicates the lane experienced surface water flows. [PAG] (p57)</p></div></div></body></div>`)[0];

                var html_7165da0e46b9829df38e08272e424774 = $(`<div id="html_7165da0e46b9829df38e08272e424774" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cornwall</h1><div class="nugget-popup"><p>The report records that the 18th July 2017 extreme rainfall and resulting flash flooding across parts of Cornwall (including Coverack, Porthallow, St Keverne and Porthoustock) was extraordinary and the most extreme three&ndash;hour rainfall total recorded in Cornwall; the upper value has been recorded as breaking the UK three&ndash;hour record. The intense event produced tremendous flows across catchments, widespread channel erosion and blockage, landslips, cliff erosion and severe damage to homes, businesses and infrastructure in the affected communities. [PAG] (p5)</p></div><div class="nugget-popup"><p>An extreme, highly localised rainfall event over the South Coverack Stream catchment produced intense surface&ndash;water and rapid (flash) flooding in the Coverack area on 18th July 2017. The event produced very large runoff volumes from the small catchment, overwhelming channels and drainage and causing damage to property and the environment in Coverack. [PAG] (p9)</p></div><div class="nugget-popup"><p>Cornwall Council carried out post&ndash;event inspections of assets after the 18 July 2017 flood; assessed existing drainage and highway drainage where economically feasible; decided not to carry out further watercourse works; offered property assessments for potential funding toward Property Level Resilience for properties damaged in July 2017. [PAG] (p16)</p></div><div class="nugget-popup"><p>On 18th July 2017 intense inland rainfall produced excess water that discharged over the cliff edge at Coverack, causing accelerated loss of cliff material along an unprotected section of coastline between the existing highway defences and the private sea defence at the north end of the beach. The event highlighted vulnerability of the adjacent highway and prompted Cornwall Council to assess coastal erosion risk and plan additional sea defence works. [PAG] (p17)</p></div><div class="nugget-popup"><p>The extreme, highly localised rainfall event produced internal property flooding in communities within Cornwall (reported reconnaissance across the area identified multiple affected properties) and caused watercourses to be overwhelmed with out&ndash;of&ndash;bank flows and debris&ndash;choked channels. [TAB] (p21)</p></div><div class="nugget-popup"><p>Coverack village within Cornwall experienced flooding: emergency responders working in a flooded village; village buildings were inundated or damaged, a car was stranded and surrounded by debris, and visible floodwater was present in the street. [PAG] (p25)</p></div><div class="nugget-popup"><p>Coverack and neighbouring communities on the east of the Lizard peninsula experienced highly localised intense rainfall on 18 July 2017 that led to flash flooding; the catchment was overwhelmed producing river and surface&ndash;water flooding, significant erosion, pollution from damaged sewers and domestic oil supplies, and severe damage to road infrastructure. Emergency services rescued residents (including two winched to safety) and there was a high risk to life from deep fast&ndash;flowing debris&ndash;laden water. (p28)</p></div><div class="nugget-popup"><p>Coverack and neighbouring communities on the east of the Lizard peninsula experienced localised intense rainfall on 18 July 2017 that led to flash flooding. The catchment was overwhelmed, producing river and surface&ndash;water flooding with significant erosion, dangerous deep fast&ndash;flowing debris&ndash;laden water, rescue of residents (including two winched to safety by a coastguard helicopter), pollution from damaged sewers and domestic oil supplies, and severe damage to road infrastructure. [PAG] (p33)</p></div><div class="nugget-popup"><p>An intense, extremely localised convective storm stalled over Coverack on 18 July 2017 (approximately 13:30&ndash;16:30), producing very high short&ndash;duration rainfall that led to rapid surface&ndash;water/flash flooding in the village. Radar&ndash;gauge merged accumulation maps show the storm concentrated directly over Coverack. [IMG] (p39)</p></div><div class="nugget-popup"><p>Highly localised extreme rainfall on 18 July 2017 produced rapid runoff in the South Coverack Stream (and nearby North Corner Stream) that led to a flash/river flood affecting the village of Coverack. The sea wall at the stream mouth provided minimal control on upstream water levels and hydraulic conditions at the wall were represented as a waterfall; the event produced substantial flows that generated the observed flooding impact in the community. (p44)</p></div><div class="nugget-popup"><p>Parts of Cornwall experienced intense, localised storms that produced rapid, damaging flooding. On 18 July 2017 extreme three&ndash;hour rainfall produced fast&ndash;occurring flooding that severely affected coastal villages including Coverack, St Keverne and Porthallow. Cornwall was also affected by the Boscastle event in August 2004, where extreme local rainfall caused large channel erosion, widespread infrastructure damage and properties to be flooded or destroyed. [PAG,MUL] (p52)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>around fifty properties flooded; eleven properties flooded; one property flooded; at least 5 properties flooded internally; road flooded to a depth of around 400mm [PAG] (p1)</p></div><div class="nugget-popup quant"><p>165mm&ndash;201mm/3 hours; approximately 400,000 cubic metres of water over the 2.2 km2 catchment; 201mm is reported as the upper 3&ndash;hour UK record [PAG] (p9)</p></div><div class="nugget-popup quant"><p>44 properties in Coverack; 10 properties in St Keverne; 1 property in Porthallow [TAB] (p21)</p></div><div class="nugget-popup quant"><p>over 50 properties affected; about 0.5&ndash;0.6 million m3 of water moved through the valley; two residents winched to safety (p28)</p></div><div class="nugget-popup quant"><p>over 50 properties affected (across the incident) [PAG] (p33)</p></div><div class="nugget-popup quant"><p>about 100 homes and businesses; 4 properties destroyed in Boscastle; 2 properties destroyed in Crackington Haven; 115 vehicles swept away; about 100 people rescued [PAG,MUL] (p52)</p></div></div></body></div>`)[0];

                var html_fa30ac6f672cb518c4dadf87a650988c = $(`<div id="html_fa30ac6f672cb518c4dadf87a650988c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Berkshire</h1><div class="nugget-popup"><p>Emergency services responded to flash flooding in Berkshire on 18 July 2017. (p28)</p></div><div class="nugget-popup"><p>Emergency services responded to flash flooding in Berkshire during the storm on 18 July 2017. (p33)</p></div></div></body></div>`)[0];

                var html_9da900dae2684bb2ffaa2cdf78b08962 = $(`<div id="html_9da900dae2684bb2ffaa2cdf78b08962" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Coverack</h1><div class="nugget-popup"><p>Significant, unprecedented and potentially life&ndash;threatening flooding affected the community on 18th July 2017; residents and emergency services acted swiftly and there were no fatalities. [PAG] (p4)</p></div><div class="nugget-popup"><p>On 18th July 2017 Coverack experienced an unprecedented, potentially life&ndash;threatening flash flood caused by extreme, concentrated rainfall. Many homes, businesses and elements of local infrastructure were severely damaged. River channels and banks were extensively eroded and became blocked by large quantities of rocks, sediment and other debris; there were landslips and cliff erosion in places. Emergency response and community action were required and, despite the severity, no lives were lost. (p5)</p></div><div class="nugget-popup"><p>Extensive damage to residents' and business properties and possessions; risk to life during the event; landslips and cliff erosion occurred or were caused risk; river channels and banks of local watercourses suffered extensive erosion and became blocked, with large quantities of rock, sediment and debris transported downstream and disrupting flow conveyance. [PAG] (p6)</p></div><div class="nugget-popup"><p>Coverack was flooded on 18th July 2017 when intense local rainfall produced rapid runoff from the three small watercourses draining the catchment through the village, causing inundation, erosion and damage to drainage/highway assets and triggering post&ndash;event inspections and repair support processes by the Environment Agency and Cornwall Council. [IMG,TAB,PAG] (p7)</p></div><div class="nugget-popup"><p>The village was subjected to an extraordinary, highly localised storm concentrated on the South Coverack Stream catchment that produced rapid surface&ndash;water and flash flooding across the community; residents reported the 18th July event as unprecedented in living memory. [PAG] (p9)</p></div><div class="nugget-popup"><p>Rapid, intense flows formed a 'wall of water' down the main road with little warning. Internal flooding affected many homes; fast&ndash;flowing, and in places deep, water carried large rocks and debris. One property was surrounded by fast&ndash;flowing water and occupants were rescued by a coastguard helicopter. The event posed a significant risk to life. [PAG] (p10)</p></div><div class="nugget-popup"><p>Internal flooding of many properties; extensive damage to homes and businesses and possessions; erosion of land, river channels and the road network; pollution from damaged infrastructure (including sewers and domestic oil supplies). Significant damage to the B3294 rendered it impassable and flows eroded the upper cliff face. Public toilets and the car park were significantly damaged. Landslips in the village resulted in evacuation of properties and closure of the SW coast path. The watercourse change on North Corner Stream ripped out a gravity sewer and damaged the access road to the Waste Water Treatment works. [PAG] (p11)</p></div><div class="nugget-popup"><p>Localised flash flooding driven by a very rapid rise of the South Coverack Stream during an extreme localised storm&ndash;burst; the community would be unlikely to receive a timely warning because no specific flood warning service exists for the stream. [PAG] (p14)</p></div><div class="nugget-popup"><p>Experienced extreme, rapid&ndash;onset flash flooding on 18th July 2017 caused by very localized intense rainfall; the event required community first&ndash;response and recovery actions, and was not preventable given the localised nature of the rainfall and lack of local warning infrastructure. (p15)</p></div><div class="nugget-popup"><p>Intense rainfall caused flash flooding on 18 July 2017 that resulted in significant damage to properties in Coverack; recovery operations and post&ndash;event inspections were carried out and authorities determined no practicable flood alleviation works would be undertaken. (p16)</p></div><div class="nugget-popup"><p>Experienced intense rainfall on 18th July 2017 that caused surface water/flash flooding and associated damage: accelerated cliff loss where excess inland water flowed over the cliff edge, potential vulnerability of the highway, damage to properties (owners advised to consider property&ndash;level resilience), and community&ndash;led works at Polcoverack to restore drainage ditches and increase upstream storage. (p17)</p></div><div class="nugget-popup"><p>The observed flood extents from the 18 July 2017 event in the village area matched the Flood Map for the South Coverack Stream; Coverack experienced flooding driven by the stream during the event. (p18)</p></div><div class="nugget-popup"><p>Observed flooding of the South Coverack Stream during the 18th July 2017 event; the observed flood extent matches the Flood Map for Planning for the stream. [PAG] (p19)</p></div><div class="nugget-popup"><p>Intense, localised rainfall produced rapid overland runoff and out&ndash;of&ndash;bank flows in local watercourses. Internal flooding occurred in properties, river channels and structures (bridges and culverts) became choked with large volumes of debris which exacerbated flooding and flow conveyance was impeded. [TAB] (p21)</p></div><div class="nugget-popup"><p>On 18th July 2017 intense rainfall and flash flooding inundated Coverack. Watercourses produced high flows that caused severe erosion and localised loss of river bank in multiple locations; culverts became blocked by mobilised debris; properties suffered significant flood damage and local drainage and highway systems were overwhelmed. Flood outlines observed after the incident match the Flood Map for Planning extents. [TAB] (p22)</p></div><div class="nugget-popup"><p>The 18th July 2017 event overwhelmed the catchment and drainage system. Some culverts were blocked by mobilised debris and the scale of the event meant drainage ditches had no effect on reducing flooding in the village. [TAB] (p23)</p></div><div class="nugget-popup"><p>Floodwater in the village street; emergency responders working in the flooded area; visible damage to buildings, debris throughout the street, and a car stranded/partially surrounded by debris and floodwater. [IMG] (p25)</p></div><div class="nugget-popup"><p>Localised intense rainfall on 18th July 2017 led to flash flooding: the small catchment was overwhelmed causing flooding from rivers and surface water, significant erosion, deep fast&ndash;flowing water carrying debris and a high risk to life. Emergency services rescued residents (including a couple winched to safety by the coastguard helicopter). Pollution occurred from damaged infrastructure (including sewers and domestic oil supplies) and road infrastructure was severely damaged. No fatalities or serious injuries were reported. [PAG] (p28)</p></div><div class="nugget-popup"><p>Extreme, highly localised three&ndash;hour rainfall produced very large runoff that moved down the steep&ndash;sided valley to the sea, overwhelming natural and manmade drainage. Flood flows at the downstream extent of the Main River were estimated to be far higher than design estimates, producing widespread surface water and flash flooding across the settlement. [PAG] (p29)</p></div><div class="nugget-popup"><p>On 18 July 2017 intense, short&ndash;duration rainfall produced rapid surface&ndash;water runoff and flash flooding through the village (aerial imagery shows flow routes across the northern part). Streets and properties were inundated by fast&ndash;flowing runoff following those flow routes. (p31)</p></div><div class="nugget-popup"><p>Localised extremely heavy rainfall on 18th July 2017 caused very rapid rises in small streams and flash flooding in the village; residents described it as the worst flooding they had seen. (p37)</p></div><div class="nugget-popup"><p>Intense, highly localised heavy rainfall stalled over Coverack on 18 July 2017, producing rapid surface&ndash;water/flash flooding in the village. [PAG] (p38)</p></div><div class="nugget-popup"><p>An intense, highly localised thunderstorm stalled over Coverack on 18 July 2017 producing extreme short&ndash;duration rainfall that led to rapid runoff and flash/surface&ndash;water flooding in the village and nearby flow routes (the event that prompted the Section 19 investigation). [IMG] (p40)</p></div><div class="nugget-popup"><p>Experienced a short&ndash;duration, intense flash flooding event on 18 July 2017. Flooding in Coverack was substantially greater than in nearby St Keverne and Porthallow; flow routes concentrated across the northern part of the village (aerial view referenced). [IMG,PAG] (p41)</p></div><div class="nugget-popup"><p>On 18th July 2017 an extreme three&ndash;hour rainfall caused rapid overland runoff and flash flooding through the village. The main road (B3294) and Polcoverack Lane became flowpaths for fast&ndash;moving water. Streams, ditches and drains were overwhelmed and channels blocked with debris including large boulders; some boulders were lifted from channels. At The Croft on North Corner Stream the watercourse changed direction and boulders ripped out the gravity sewer. Vehicles were partially submerged and transport routes were disrupted. [PAG] (p42)</p></div><div class="nugget-popup"><p>Rapid overland runoff travelled above and through the village, turning the main road (B3294) and Polcoverack Lane into flowpaths. Streams, ditches and drains were overwhelmed and channels became blocked with debris including large boulders. Strong flows and concentrated surface&ndash;water routes caused erosion in the northern part of the village and brought floodwater close to houses; at The Croft on North Corner Stream the watercourse changed direction and boulders ripped out the gravity sewer. [IMG,PAG] (p43)</p></div><div class="nugget-popup"><p>Experienced a highly localised extreme rainfall and associated flooding on 18 July 2017; the localised nature of the rainfall over the community produced the flood impacts reflected in the stream peak flow estimates. [PAG] (p44)</p></div><div class="nugget-popup"><p>Localized extreme rainfall on 18 July 2017 produced very rapid runoff in the local stream system and caused significant flooding in the village. Peak flows were estimated to have occurred in the South Coverack Stream and North Corner Stream, and the event&#8217;s specific discharge plots between the ICE 'Normal Maximum Flood' and 'Catastrophic Flood' curves, consistent with an unusually large, highly localised event for the catchment size. [IMG] (p45)</p></div><div class="nugget-popup"><p>An intense convective storm centred on Coverack produced very large runoff (about 0.5&ndash;0.6 million m3) that moved through the valley to the sea in three hours. The volume overwhelmed local drainage networks, caused direct runoff and considerable erosion of land, river channels and the road network, and caused pollution from damaged infrastructure including sewers and domestic oil supplies. Photographs show debris and damage to the B3294 and the adjacent car park. (p46)</p></div><div class="nugget-popup"><p>Intense rainfall and runoff caused fast&ndash;flowing floodwater and stream overflow through the village. Internal flooding affected many properties (mostly shallow but with some deep incidents). One property was surrounded by deep, fast&ndash;flowing water requiring a coastguard helicopter rescue of the occupants. Landslips occurred in the village (southern area near Dolor Point), causing evacuations. Floodwaters carried large rocks, uprooted vegetation and debris, damaging private infrastructure (driveway uplifted and made impassable) and washing out windows. [IMG] (p49)</p></div><div class="nugget-popup"><p>Intense, short&ndash;duration rainfall caused rapid surface&ndash;water / flash flooding across Coverack. Floodwaters lifted a manhole cover, inundated roads and properties, trapped people in flood water leading to multiple life&ndash;risk incidents, and prompted a major&ndash;incident response by emergency services. [TAB] (p50)</p></div><div class="nugget-popup"><p>Surface water/flash flooding across the village: manhole cover was observed lifting from force of water; first emergency calls originated from the Coverack area; multiple life&ndash;risk incidents and a major incident were reported in response to flooding. [PAG] (p51)</p></div><div class="nugget-popup"><p>Sustained, very intense rainfall on 18 July 2017 produced significant, rapidly occurring flooding in Coverack; the event was one of the most extreme three&ndash;hour rainfall events recorded in the UK and led to severe local flooding in the village. [PAG] (p52)</p></div><div class="nugget-popup"><p>Experienced intense direct rainfall and resulting surface&ndash;water overland flows on 18th July 2017; the event was analysed using a 2D direct rainfall model to represent flood routing and assess flood risk to properties and infrastructure. (p55)</p></div><div class="nugget-popup"><p>Extensive surface&ndash;water flooding across the northern part of Coverack (mostly shallow); property flooding generally shallow with reconnaissance map showing property flooding around <50mm. Southern part of Coverack also had affected properties broadly matching the reconnaissance map. Some modelled flood depths may be underestimated; some observed flow paths (down the track from 'Medical Care' and down Polcoverack Lane) were noted on reconnaissance but not fully represented in the model. [PAG] (p56)</p></div><div class="nugget-popup"><p>Extensive surface-water flooding across the northern and southern parts of the village during the 18th July 2017 event. Environment Agency reconnaissance indicates property flooding generally <50mm; the model shows much of the flooded area as relatively shallow (<100mm) but with the deepest flooding concentrated along the central watercourse (map indicates >200mm in places). Modelled extents broadly match observed affected properties though some depths are likely underestimated. [IMG,PAG] (p57)</p></div><div class="nugget-popup"><p>The 18th July 2017 intense rainfall produced flood outlines concentrated around the village and along key watercourses; surface water flooding was mapped down Polcoverack Lane and floodwater inundated areas of the village and adjacent land. [IMG] (p58)</p></div><div class="nugget-popup"><p>Extensive flooding on 18th July 2017 &mdash; the modelled flood outline for this date covers the largest area (blue), especially across the main village and to the north and west. The event was localised and extreme (storm stalled over Coverack), producing more significant impacts in Coverack than the other compared high&ndash;intensity events (17 Aug 2016 and 5 Aug 2013). The map and report state Coverack experienced unprecedented local flooding compared with previous recorded events. [IMG,PAG] (p59)</p></div><div class="nugget-popup"><p>An extreme, highly localised storm produced very large surface&ndash;water/flash flooding across Coverack (particularly the northern part). The event overwhelmed natural and manmade drainage; modelled flood extents for 18 July 2017 were much larger than for other events and the report states nothing like the 18 July 2017 impact had been seen before. [PAG] (p60)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>44 properties flooded; flood depths generally less than 50mm but several properties experienced up to 1.5m to 2.0m depth; 1 property surrounded and occupants rescued [PAG] (p10)</p></div><div class="nugget-popup quant"><p>44 properties; 3 properties [PAG] (p11)</p></div><div class="nugget-popup quant"><p>44 properties; property flooding depths generally less than 50mm, with several properties experiencing up to 1.5m to 2.0m depth [TAB] (p21)</p></div><div class="nugget-popup quant"><p>over 50 properties [PAG] (p28)</p></div><div class="nugget-popup quant"><p>44 properties flooded; 1 property surrounded by fast&ndash;flowing water; 3 properties evacuated; internal flooding generally <50mm deep; some properties flooded up to 1.5m to 2.0m deep [IMG] (p49)</p></div><div class="nugget-popup quant"><p>more than 50 emergency calls; 1 major incident declared [TAB] (p50)</p></div><div class="nugget-popup quant"><p>more than 50 emergency calls [PAG] (p51)</p></div><div class="nugget-popup quant"><p><50mm (property flooding per EA reconnaissance); <100mm (much of modelled flooding); >200mm (deepest along central watercourse) [IMG,PAG] (p57)</p></div></div></body></div>`)[0];
                popup_cc9cb5c70c4804d7bad26d8e71394aff.setContent(html_9da900dae2684bb2ffaa2cdf78b08962);

                var html_642d18691ee37198a3ed6c37f5ff5913 = $(`<div id="html_642d18691ee37198a3ed6c37f5ff5913" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>St Keverne</h1><div class="nugget-popup"><p>Impacted by the significant, unprecedented flooding of 18th July 2017 that affected Coverack and surrounding communities. [PAG] (p4)</p></div><div class="nugget-popup"><p>St Keverne was reported as affected by the significant flash flooding on 18th July 2017. The community experienced damage to homes, businesses and infrastructure, and catchment flows caused erosion, blockage of channels with debris and notable disruption to residents. (p5)</p></div><div class="nugget-popup"><p>Internal flooding occurred to properties within the settlement. (p10)</p></div><div class="nugget-popup"><p>Internal flooding of properties and landslips; a landslip caused partial closure of Commercial Road. [PAG] (p11)</p></div><div class="nugget-popup"><p>Recorded flood outlines were produced for the area showing flooding from the 18th July 2017 event; these recorded outlines compare favourably to the Flood Map for Planning. (p19)</p></div><div class="nugget-popup"><p>Internal property flooding caused by rapid overland surface water runoff and out&ndash;of&ndash;bank river flows; debris&ndash;choked channels worsened flooding. [TAB] (p21)</p></div><div class="nugget-popup"><p>Named as a neighbouring community to Coverack that was severely affected by localised intense rainfall and flash flooding on 18 July 2017. (p28)</p></div><div class="nugget-popup"><p>Named as a neighbouring community to Coverack that was severely affected by intense local rainfall on 18 July 2017, resulting in flash flooding; the event overwhelmed the catchment causing river and surface&ndash;water flooding, significant erosion, rescues, pollution from damaged sewers and domestic oil supplies, and serious damage to road infrastructure. (p33)</p></div><div class="nugget-popup"><p>Experienced flooding associated with the same extreme rainfall on 18th July 2017, though substantially less severe than in Coverack; affected by rapid runoff and stream responses. (p42)</p></div><div class="nugget-popup"><p>Surface water/runoff and associated landslips caused internal flooding of properties and local transport disruption. A landslip partly closed Commercial Road. [PAG] (p49)</p></div><div class="nugget-popup"><p>Surface&ndash;water/flash flooding affected St Keverne during the storm; flooding was reported to commence at 16:00 and cease at 19:00 on 18/07/2017. [TAB] (p50)</p></div><div class="nugget-popup"><p>Flooding commenced in St Keverne during the event and later ceased. (p51)</p></div><div class="nugget-popup"><p>Affected by the intense storm of 18 July 2017 that produced rapid, localised flooding in the area. (p52)</p></div><div class="nugget-popup"><p>Experienced intense direct rainfall and resulting surface&ndash;water overland flows on 18th July 2017; the catchment was included in a 2D direct rainfall model to represent observed flooding and assess flood routing and property risk. (p55)</p></div><div class="nugget-popup"><p>Reported to have experienced flooding associated with the same storm on 18th July 2017. [IMG,PAG] (p59)</p></div><div class="nugget-popup"><p>Experienced flooding from the same extreme, localised storm that produced flooding in Coverack on 18 July 2017. (p60)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>10 properties flooded (p10)</p></div><div class="nugget-popup quant"><p>10 properties [PAG] (p11)</p></div><div class="nugget-popup quant"><p>10 properties; up to 1.5m to 2.0m deep [TAB] (p21)</p></div><div class="nugget-popup quant"><p>over 50 properties affected (across the incident) (p33)</p></div><div class="nugget-popup quant"><p>10 properties flooded [PAG] (p49)</p></div></div></body></div>`)[0];

                var html_49ab7534cb39a8f60e4b697c96b75c2a = $(`<div id="html_49ab7534cb39a8f60e4b697c96b75c2a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Porthallow</h1><div class="nugget-popup"><p>Affected by the significant and unprecedented flooding that occurred on 18th July 2017 as part of the same event impacting the area. [PAG] (p4)</p></div><div class="nugget-popup"><p>Porthallow was one of the surrounding communities affected by the 18th July 2017 flash flooding. The event caused significant impacts to properties, businesses and local infrastructure, with watercourse erosion, blockage by debris and widespread community disruption requiring emergency response and recovery actions. (p5)</p></div><div class="nugget-popup"><p>One property in Porthallow experienced internal flooding. (p10)</p></div><div class="nugget-popup"><p>Internal flooding affected properties (one property flooded). A blocked trash screen at Porthallow was cleared by Environment Agency staff during the event, which prevented further properties from flooding. [PAG] (p11)</p></div><div class="nugget-popup"><p>Environment Agency 'Recorded Flood Outlines' were generated for flooding observed during the 18th July 2017 event; these recorded outlines compare favourably to the Flood Map for Planning. (p19)</p></div><div class="nugget-popup"><p>Internal flooding of properties from rapid surface water runoff and associated out&ndash;of&ndash;bank flows; property flooding in the area was generally relatively shallow. [TAB] (p21)</p></div><div class="nugget-popup"><p>Identified as a neighbouring community to Coverack that was severely affected by localised intense rainfall and consequent flash flooding on 18 July 2017. (p28)</p></div><div class="nugget-popup"><p>Identified as a neighbouring community to Coverack that was severely affected by localised intense rainfall on 18 July 2017, leading to flash flooding; catchment overwhelm produced river and surface&ndash;water flooding, significant erosion, rescue of residents, pollution from damaged sewers and domestic oil, and severe road damage. (p33)</p></div><div class="nugget-popup"><p>Affected by flooding during the 18th July 2017 extreme rainfall event, but to a lesser extent than Coverack; impacted by surface runoff and overwhelmed local watercourses. (p42)</p></div><div class="nugget-popup"><p>Internal flooding occurred at least in one property. A trashscreen was blocked by debris; prompt clearance of the trashscreen by the Environment Agency prevented further properties from flooding. (p49)</p></div><div class="nugget-popup"><p>EA flood reconnaissance recorded flooding in Porthallow that commenced at about 15:00 and had ceased by 18:00 on 18/07/2017. [TAB] (p50)</p></div><div class="nugget-popup"><p>Impacted by the intense, localised storm on 18 July 2017 which produced rapid flooding in the village. (p52)</p></div><div class="nugget-popup"><p>Experienced intense direct rainfall and resulting surface&ndash;water overland flows on 18th July 2017; the catchment was modelled with a 2D direct rainfall model to represent observed flood behaviour and assess flood risk. (p55)</p></div><div class="nugget-popup"><p>Reported to have experienced flooding associated with the same storm on 18th July 2017. [IMG,PAG] (p59)</p></div><div class="nugget-popup"><p>Suffered flooding associated with the same extreme, localised storm that affected Coverack on 18 July 2017. (p60)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property flooded (p10)</p></div><div class="nugget-popup quant"><p>one property [PAG] (p11)</p></div><div class="nugget-popup quant"><p>1 property [TAB] (p21)</p></div><div class="nugget-popup quant"><p>over 50 properties affected (across the incident) (p33)</p></div><div class="nugget-popup quant"><p>1 property flooded (p49)</p></div></div></body></div>`)[0];
