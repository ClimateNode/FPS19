                var html_1aa7f22122ff5bd089e204b4045c12cf = $(`<div id="html_1aa7f22122ff5bd089e204b4045c12cf" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cocker Beck</h1><div class="nugget-popup"><p>The Cocker Beck (a Main River through the Lowdham catchment) rose to its highest recorded level (Lowdham Grange gauge peak 1.54m) on 16 February 2020 and caused a significant flood event in Lowdham, resulting in internal flooding of properties, flooding of gardens/curtilages and inundation of the public highway. [IMG] (p3)</p></div><div class="nugget-popup"><p>The Cocker Beck overtopped on 16 Feb 2020 and, combined with surface water runoff, was a primary source of widespread flooding across Lowdham that led to internal property flooding, flooding of roads and open spaces. [IMG] (p4)</p></div><div class="nugget-popup"><p>The watercourse was overwhelmed by runoff from saturated upper catchment, over&ndash;topped its banks and spilled out at points along its route, contributing to extensive overland flows that overwhelmed local surface water assets and caused widespread flooding in the catchment. [IMG,PAG] (p5)</p></div><div class="nugget-popup"><p>Cocker Beck (Main River) had raised river levels that required use of the cricket pitch flood storage area; flood storage water was subsequently drained via a penstock once the river level reduced. (p7)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>93 reported incidents of internal property flooding [IMG] (p3)</p></div><div class="nugget-popup quant"><p>93 reported incidents of internal property flooding (across Lowdham) [IMG] (p4)</p></div></div></body></div>`)[0];

up quant"><p>93 reported incidents of internal property flooding [IMG,PAG] (p4)</p></div></div></body></div>`)[0];
