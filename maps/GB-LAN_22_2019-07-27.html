                var html_9c546a9b1c70bb582ef6872a2a01f87d = $(`<div id="html_9c546a9b1c70bb582ef6872a2a01f87d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lancashire</h1><div class="nugget-popup"><p>Lancashire experienced flooding during the event spanning 27 July to 1 August 2019. (p1)</p></div><div class="nugget-popup"><p>Summer storms (27&ndash;29 July 2019) and further rainfall on 1 August 2019 temporarily overwhelmed local drainage systems across Lancashire, causing extensive flooding of properties and highways. Records show 102 properties flooded (91 homes and 11 commercial/agricultural properties), with 14 homes flooded internally to at least one habitable room; there is a report of one further property potentially flooded (possible total 103 properties). [MUL] (p3)</p></div><div class="nugget-popup"><p>Part of Lancashire experienced flooding during the event; the area covered by the Earby and Salterforth Internal Drainage Board was affected by floodwater. (p10)</p></div><div class="nugget-popup"><p>Widespread flooding occurred across large areas of the county as a series of intense rainfall events between 27 July 2019 and 1 August 2019, affecting multiple communities and prompting localised site inspections by risk management authorities. [PAG] (p12)</p></div><div class="nugget-popup"><p>Heavy rainfall across the county resulted in property flooding: one property in Fylde flooded on 27 July 2019; on 28 July 2019 a total of 25 properties were reported flooded within Lancashire (4 in western Lancashire across Fylde, Chorley and Preston; 1 in Pendle; 20 in Rossendale &mdash; all 20 in the town of Whitworth). [IMG] (p13)</p></div><div class="nugget-popup"><p>Widespread external flooding to residential properties across multiple districts within the county and standing surface water on main and residential roads, causing travel disruptions. [PAG] (p15)</p></div><div class="nugget-popup"><p>External flooding affected properties across multiple districts within the county and widespread standing water and travel disruption on the local road network. [PAG] (p16)</p></div><div class="nugget-popup"><p>Repeated bands of heavy rain across the county between 27 July and 1 August 2019 caused flooding; county council Highway Service inspected affected highway locations, removed silt from gullies and drainage systems, and flood waters subsided the following morning. [PAG] (p17)</p></div><div class="nugget-popup"><p>Extreme rainfall between 27 July and 1 August 2019 overwhelmed many drainage networks in parts of Lancashire, causing flooding that damaged homes and belongings and raised serious concerns for personal safety among affected people. [PAG] (p19)</p></div><div class="nugget-popup"><p>Extreme rainfall between 27 July and 1 August 2019 overwhelmed local drainage networks across the county, causing flooding of homes and business premises and damage to people's homes and belongings; significant concern for personal safety was reported. [PAG] (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>102 properties; 91 homes; 11 commercial/agricultural properties; 14 homes flooded internally; possible total of 103 properties [MUL] (p3)</p></div><div class="nugget-popup quant"><p>1 property (27 Jul 2019); 25 properties (28 Jul 2019); 20 properties (in Whitworth, Rossendale) [IMG] (p13)</p></div><div class="nugget-popup quant"><p>75 properties across the county (29 Jul 2019: 21 properties; 30&ndash;31 Jul 2019: 34 properties; 1 Aug 2019: 20 properties) [PAG] (p15)</p></div><div class="nugget-popup quant"><p>5 properties (Chorley); 1 property (Hyndburn); 1 property (Preston); 2 properties (Ribble Valley); 1 property (Rossendale); 10 properties (West Lancashire); 8 properties (Whitworth) [PAG] (p16)</p></div><div class="nugget-popup quant"><p>103 individual homes and business premises [PAG] (p20)</p></div></div></body></div>`)[0];
