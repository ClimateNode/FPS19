ncident records on the mapped area show medium&ndash;priority residential flood incidents. [MUL] (p4)</p></div><div class="nugget-popup"><p>Groundwater levels rose markedly, leading to basement flooding in properties. At least one basement water sample (29/01/2021) tested positive for chemicals associated with potable water (chloride and nitrates). Groundwater rise is identified as the highly probable source of the basement flooding; groundwater flood alerts were issued for Bury St Edmunds. [MUL] (p5)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 6 adjacent properties [PAG,MUL] (p2)</p></div><div class="nugget-popup quant"><p>6 properties; 2,500 litres; 1 tenant rehoused [PAG] (p3)</p></div><div class="nugget-popup quant"><p>2 separate occasions; 1 basement tested positive for potable&ndash;water markers (29/01/2021); 2 medium&ndash;priority residential flood records (08/06/2017 and 22/09/2017) [MUL] (p4)</p></div><div class="nugget-popup quant"><p>groundwater levels rose by approximately 1.4m; between 1.7m and 1.8m higher than the typical winter peak; water meter boundary boxes were surcharged on 7 of the 9 properties checked [MUL] (p5)</p></div></div></body></div>`)[0];
