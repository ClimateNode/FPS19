                var html_e334e0a00064009c4c2582375e8ce873 = $(`<div id="html_e334e0a00064009c4c2582375e8ce873" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Yazor Brook</h1><div class="nugget-popup"><p>Identified as the main river (blue line) along which Flood Zones 2 and 3 are concentrated; the brook is the watercourse driving river flooding that exposes adjacent properties and infrastructure to inundation. [IMG] (p1)</p></div><div class="nugget-popup"><p>Overflowing Yazor Brook (and associated blocked bridge/culvert and overflowing ditch) contributed to fluvial flooding that caused internal flooding of nearby properties close to the confluence with an unnamed tributary draining Crowmoor. (p2)</p></div><div class="nugget-popup"><p>The Yazor Brook feeds a fishing lake via a weir and has a series of small weirs upstream of Roman Road; the diverted watercourse can break out of bank (towards the south&ndash;east) and flood lower&ndash;lying farmland, contributing to local flood risk around Roman Road. (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 properties; flood depths from less than 6 inches up to 4 ft (p2)</p></div></div></body></div>`)[0];

                var html_88e5052cbe4ddbc2203ee96244aa6e30 = $(`<div id="html_88e5052cbe4ddbc2203ee96244aa6e30" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Roman Road, Hereford</h1><div class="nugget-popup"><p>A4110 Roman Road (Roman Road) was affected during the event; it is a known location of surface water flooding and lies close to flood flow paths. The highway was implicated in the event (strategic highway network impact) and road&ndash;raising works previously included structures to convey floodwater beneath the carriageway. [TAB] (p2)</p></div><div class="nugget-popup"><p>Flood water is conveyed under the carriageway via a concrete weir and overflow channel constructed when Roman Road was raised in the 2000s; Herefordshire Council has identified a requirement to promote drainage improvements at Roman Road and scheduled a highway drainage project (2021/22) in response to recent flooding. (p3)</p></div><div class="nugget-popup"><p>Fluvial (river) flooding affected areas of Roman Road in Hereford, leading to a proposed flood risk study and consideration of local mitigation measures. (p4)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 properties (in the Towtree Lane / Roman Road area); flood depths from less than 6 inches up to 4 ft [TAB] (p2)</p></div></div></body></div>`)[0];
