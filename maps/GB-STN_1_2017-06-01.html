                var html_ebf262c454b0040d2be68cc4f000bb21 = $(`<div id="html_ebf262c454b0040d2be68cc4f000bb21" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Grotto Canal</h1><div class="nugget-popup"><p>The canal is described as groundwater&ndash;influenced and may have partly contributed to the June 2017 basement flood by influencing local groundwater levels, though the report indicates groundwater was likely not the main cause. (p58)</p></div><div class="nugget-popup"><p>Identified in the report as a source of groundwater and surface&ndash;water flood risk affecting the local interrelated drainage network; recommended for further hydraulic modelling to determine whether it should be designated as a main river. (p61)</p></div></div></body></div>`)[0];

                var html_f1042e71a8057fa72803c575f7764c3e = $(`<div id="html_f1042e71a8057fa72803c575f7764c3e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Borough of Sutton</h1><div class="nugget-popup"><p>As local highway/ drainage authority, Sutton is implicated across multiple hotspots: investigate soakaway on Ross Road; reinvestigate raised table at Riverside Close to reduce surface water entering lower properties and highway; provide gully maintenance and street cleansing; collaborate with TWUL/EA on sewer network, property&ndash;level protection and retrofit SuDS to increase resilience. [PAG] (p4)</p></div><div class="nugget-popup"><p>Report documents multiple location&ndash;wide flood incidents across named hotspots in the borough (Demesne Road; London Road and Riverside Close; Carshalton High Street; Stanley Park Road and Warnham Court Road; Oxford Road; Oaks Avenue). The report examines surface water, ordinary watercourse (fluvial/river), groundwater and sewer mechanisms and records response actions by risk management authorities. (p6)</p></div><div class="nugget-popup"><p>The June 2017 flood event caused reported flooding across the borough: 28 reported sites experienced flooding and 22 of those experienced internal property flooding or flooding within the curtilage. The scale of the incident triggered a Section 19 investigation by the lead local flood authority. [PAG] (p12)</p></div><div class="nugget-popup"><p>Within the area covered by Sutton, clusters of reported flooded sites were identified, concentrated in the central and southern parts of the borough during the June 2017 event. [IMG,PAG] (p14)</p></div><div class="nugget-popup"><p>Torrential rainfall on 2 June 2017 caused surface water / urban flooding across the London Borough of Sutton; multiple sites were reported to have flooded during the June 2017 event. [TAB,PAG] (p15)</p></div><div class="nugget-popup"><p>Residential streets and properties within the Sutton area were inundated during the event; images show water entering properties, garages and highways, and vehicles partially submerged. [PAG] (p18)</p></div><div class="nugget-popup"><p>The Sutton area experienced a severe rainfall event on 2 June 2017 that led to several reported flood incidents, including internal house flooding, surcharge of gullies/manholes that flooded highways, and basement inundation at commercial/residential properties. [PAG] (p19)</p></div><div class="nugget-popup"><p>A torrential rainfall event on 2 June 2017 produced surface water flooding and local sewer overcapacity across the borough, causing multiple properties and sections of highway to flood; resident reports and photographed incidents are summarised in Table 2&ndash;1 and Figures 2&ndash;1 to 2&ndash;8. [PAG] (p20)</p></div><div class="nugget-popup"><p>Torrential rainfall on 2 June 2017 caused multiple locations across the borough to flood. Properties experienced internal flooding (water entering homes, basements and kitchens), highway flooding and near&ndash;misses where water came close to entering properties. Local sewer systems surcharged and some gullies surcharged; blocked drains contributed to internal flooding at properties on Nightingale Road. [PAG,IMG] (p21)</p></div><div class="nugget-popup"><p>Areas within Sutton experienced surface water ponding and localized property and highway flooding at identified hotspots during the June 2017 event. [PAG] (p22)</p></div><div class="nugget-popup"><p>Multiple localized surface&ndash;water flooding hotspots across the borough during the June 2017 event led to ponding at topographic low points, overwhelmed local sewer capacity and flooding of properties and highways. Flooding was concentrated in central and eastern parts of the borough and affected both private properties and highway infrastructure. [PAG] (p23)</p></div><div class="nugget-popup"><p>Clustered reported flood incidents in central and eastern parts of Sutton associated with the June 2017 heavy rainfall (peak period on 2 June 2017). [IMG,PAG] (p24)</p></div><div class="nugget-popup"><p>Sutton experienced flooding linked to the intense rainfall in June 2017; anecdotal evidence in the report indicates impacts during the 2 June rainfall may have exceeded a 1&ndash;in&ndash;5&ndash;year intensity. [PAG] (p25)</p></div><div class="nugget-popup"><p>The council engaged Highways Inspectors to clean blocked gullies in affected areas and installed new gully infrastructure (including on West Way and St Mary Avenue) as part of the response to flooding; borough&ndash;wide investigations and modelling work were carried out for critical drainage hotspots. [PAG] (p30)</p></div><div class="nugget-popup"><p>Flood incidents occurred across the borough during the June 2017 event; blue light emergency services were involved in managing flood risk and responding to those incidents. [PAG] (p32)</p></div><div class="nugget-popup"><p>Sewer flooding occurred in June 2017 in the Sutton area; residents were impacted, incidents were reported and collated, and communications (letters) were sent to affected residents. [PAG] (p41)</p></div><div class="nugget-popup"><p>The borough area (Wallington within Sutton) experienced surface water flooding during the heavy downpour on 2 June 2017, with properties and roads affected; culvert blockage led to overflow through gullies and contributed to flooding on London Road and Riverside Close. [PAG] (p44)</p></div><div class="nugget-popup"><p>The borough experienced surface water flooding at the Carshalton High Street hotspot on 2 June 2017, with properties suffering internal flooding and at least one reported evacuation. [PAG] (p52)</p></div><div class="nugget-popup"><p>Carshalton High Street in Sutton experienced reported surface water flooding during the event; properties there lie in a catchment low and on primary overland flow routes that conveyed floodwater to the High Street. [PAG] (p56)</p></div><div class="nugget-popup"><p>Local authority actions recommended following flooding: investigate street cleansing frequency to reduce gully blockages, review maintenance of a car park at the rear of a property that experienced flooding and consider SuDS, meet with TfL and residents about flood risk, and use EA modelling outputs to understand Grotto/Westcroft Canal interactions after the June 2017 floods. [PAG] (p61)</p></div><div class="nugget-popup"><p>Affected by the June 2017 flood event which prompted investigations and mitigation actions including gully cleansing and CCTV surveys. [PAG] (p71)</p></div><div class="nugget-popup"><p>Part of the borough (Carshalton &mdash; Oxford Road) experienced surface water flooding on 2 June 2017; properties on Oxford Road had floodwater enter garages, driveways and property access ways. [PAG,IMG] (p73)</p></div><div class="nugget-popup"><p>Sewer&ndash;sourced flooding affected locations in the borough during June 2017; the authority collated reported incidents and communicated with impacted residents after the event. Soakaways in the vicinity of Oxford Road, Harrow Road and Banstead Road were subsequently cleared as part of follow&ndash;up actions. [PAG] (p78)</p></div><div class="nugget-popup"><p>The borough experienced significant flooding that triggered a borough&ndash;wide Section 19 flood risk investigation; reported incidents across the borough were collated as part of the investigation. [TAB,PAG] (p86)</p></div><div class="nugget-popup"><p>Borough&ndash;wide flooding on 2 June 2017 resulted in multiple properties experiencing internal flooding; a borough investigation identified 28 flood sites grouped into six sub&ndash;catchments and found flood risk mainly from surface water and sewer flooding (with some groundwater contribution). [PAG] (p87)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>28 sites [PAG] (p4)</p></div><div class="nugget-popup quant"><p>28 reported sites; 22 properties [PAG] (p12)</p></div><div class="nugget-popup quant"><p>28 sites [IMG,PAG] (p14)</p></div><div class="nugget-popup quant"><p>11 reported flood incidents (listed in Table 2&ndash;1) [PAG] (p19)</p></div><div class="nugget-popup quant"><p>11 sites listed in Table 2&ndash;1 [PAG] (p20)</p></div><div class="nugget-popup quant"><p>28 sites; 22 properties; 5 residential properties (highway flooding immediately outside the site); 1 highway underpass [PAG,IMG] (p21)</p></div><div class="nugget-popup quant"><p>26 properties; 4 highway/infrastructure locations [PAG] (p23)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p61)</p></div><div class="nugget-popup quant"><p>At least 2 garages flooded on Oxford Road (resident reports). [PAG,IMG] (p73)</p></div><div class="nugget-popup quant"><p>28 flood sites; six sub catchments; five sub catchments draining towards the River Wandle [PAG] (p87)</p></div></div></body></div>`)[0];

                var html_365d4f5d863848e1fa7ee2a86e24cba4 = $(`<div id="html_365d4f5d863848e1fa7ee2a86e24cba4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Wandle</h1><div class="nugget-popup"><p>Received discharge from an ordinary watercourse (a tributary) that lies approximately 11 m north of an impacted property on London Road and discharges into the River Wandle approximately 40 m north&ndash;west of that property; the river/receiving channel therefore contributed to local flooding of nearby properties. [PAG] (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property on London Road; 1 property on Riverside Close [PAG] (p47)</p></div></div></body></div>`)[0];

                var html_6cac747874175a822bee2f564cb9a47e = $(`<div id="html_6cac747874175a822bee2f564cb9a47e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Demesne Road, London Borough of Sutton</h1><div class="nugget-popup"><p>A foul water manhole on Demesne Road (near the railway line) surcharged; investigation recommended to confirm cause of manhole surcharge. (p4)</p></div><div class="nugget-popup"><p>Properties at a topographical low on Demesne Road were flooded by surface water ponding during the June 2017 event. [TAB] (p22)</p></div><div class="nugget-popup"><p>Surface water ponding during the June 2017 event caused internal/property flooding affecting residential premises at Demesne Road. [PAG,IMG] (p23)</p></div><div class="nugget-popup"><p>Surface water overwhelmed drainage during the June 2017 event; floodwaters were deep enough to knock down homeowner&ndash;placed sandbags and allowed water to enter and flood a garage. Raw sewage emerged from a rear garden drain, believed to be a backup of foul water from a neighbour's property. (p33)</p></div><div class="nugget-popup"><p>Demesne Road lies at a topographical low so surface water flowed and ponded across the road; properties along Demesne Road (south of the railway line) are identified as being within a flood hotspot. A nearby soakaway at the junction of Ross Road and Demesne Road is described in 'poor' condition, reducing infiltration capacity and likely worsening surface water ponding. [PAG,IMG] (p36)</p></div><div class="nugget-popup"><p>Demesne Road lies at a topographic low so surface water ponds across the road; properties along Demesne Road (south of the railway) are identified as a flood hotspot and are predicted to be encroached by surface water. Predicted flood extents for 1 in 100 and 1 in 1000 year events encroach onto properties. Local drainage (soakaway at Ross Road/Demesne Road) is recorded in poor condition, which may reduce infiltration and exacerbate ponding. [PAG,IMG] (p38)</p></div><div class="nugget-popup"><p>Surface water drains were overwhelmed during the June 2017 rainfall; surface water surcharged from drains onto the road and flooded nearby properties. A sewer at a neighbouring property near the railway line backed up with raw sewage, causing several properties in the area to be flooded with sewage overflow. [PAG] (p40)</p></div><div class="nugget-popup"><p>Flow backing up from the main foul sewer (due to a surcharged manhole near the railway line) caused flooding to the rear gardens of properties. A flood alleviation scheme was proposed to protect specific properties (FLIP, pumping station, raised brick wall). [TAB] (p42)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>three properties [TAB] (p22)</p></div><div class="nugget-popup quant"><p>3 properties [PAG,IMG] (p23)</p></div><div class="nugget-popup quant"><p>Predicted flood depths range 0.15m &ndash; 0.9m maximum; mapped at 1 in 30 year, 1 in 100 year and 1 in 1000 year RoFSW events [PAG,IMG] (p38)</p></div></div></body></div>`)[0];

                var html_77005a47475cbf7bee7c71d70fc79f36 = $(`<div id="html_77005a47475cbf7bee7c71d70fc79f36" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Road, Hackbridge</h1><div class="nugget-popup"><p>Concerns that changes to the raised table at the entrance to Riverside Close could affect surface water flow; report highlights risk of surface water entering lower&ndash;lying properties and the highway and the need to avoid increasing risk to London Road. (p4)</p></div><div class="nugget-popup"><p>One property on London Road experienced internal flooding. [TAB] (p22)</p></div><div class="nugget-popup"><p>A property at London Road experienced flooding due to surface water during the June 2017 event. [PAG,IMG] (p23)</p></div><div class="nugget-popup"><p>Heavy downpour on 2 June 2017 caused London Road to be heavily flooded with depths rising above the tyres of cars. Surface water ran off London Road; overflow was exacerbated by a blocked culvert (from the pond under Derek Avenue) causing water to back up and overflow through gullies onto London Road. [PAG] (p43)</p></div><div class="nugget-popup"><p>Heavy downpour on 2 June 2017 caused London Road to be heavily flooded with flood depths rising above the tyres of cars; water ran off the road into gardens and properties, flooding parts of houses. A blocked culvert (from the pond under Derek Avenue) backed water up, which then overflowed through gullies and flooded London Road. [PAG,IMG] (p44)</p></div><div class="nugget-popup"><p>Surface water within the defined catchment naturally drains along London Road toward Riverside Close; London Road forms the primary overland flow route directing surface water into the Riverside Close low point. [PAG,IMG] (p45)</p></div><div class="nugget-popup"><p>Surface water drains along London Road and forms the primary overland flow route directing runoff northwards toward Riverside Close, contributing to surface water flood risk downstream. [PAG,IMG] (p46)</p></div><div class="nugget-popup"><p>Surface water inundation of an impacted property on London Road; predicted surface water extent for the 1&ndash;in&ndash;1000&ndash;year event encroaches onto the property, producing flood depths up to 0.15 m&ndash;0.9 m. [IMG] (p47)</p></div><div class="nugget-popup"><p>Predicted surface&ndash;water extent and overtopping of a nearby ordinary watercourse encroach onto an impacted property on London Road; floodwaters are predicted to partially flow south from the ordinary watercourse onto the property. [PAG,IMG] (p48)</p></div><div class="nugget-popup"><p>Identified in the report as a flooding hotspot during the June 2017 flood incident. Located within the ≥75% Areas Susceptible to Groundwater Flooding class; the report notes no basement/subsurface flooding was reported and that groundwater, sewer and reservoir sources were not considered the cause of the incident. [IMG] (p49)</p></div><div class="nugget-popup"><p>Surface water runoff from London Road flowed into Riverside Close and contributed to local flooding; a blocked culvert downstream was identified as exacerbating flooding along London Road and Riverside Close. [TAB] (p50)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property [TAB] (p22)</p></div><div class="nugget-popup quant"><p>1 property [PAG,IMG] (p23)</p></div><div class="nugget-popup quant"><p>flood depths 0.15m&ndash;0.9m; at risk in 1&ndash;in&ndash;30, 1&ndash;in&ndash;100 and 1&ndash;in&ndash;1000 year events [IMG] (p47)</p></div><div class="nugget-popup quant"><p>1 impacted property; flood depths ranging from 0.15 m to 0.9 m maximum [PAG,IMG] (p48)</p></div></div></body></div>`)[0];

                var html_9f94fee0601084d61ecad34b53742025 = $(`<div id="html_9f94fee0601084d61ecad34b53742025" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Riverside Close, Hackbridge</h1><div class="nugget-popup"><p>Surface water was entering lower&ndash;lying properties and the highway at the entrance to Riverside Close; recommendation to reinvestigate the raised table road hump to reduce the risk of surface water ingress without increasing risk to London Road. (p4)</p></div><div class="nugget-popup"><p>One property on Riverside Close experienced internal flooding. [TAB] (p22)</p></div><div class="nugget-popup"><p>A property at Riverside Close was flooded by surface water during the June 2017 event. [PAG,IMG] (p23)</p></div><div class="nugget-popup"><p>Included in site visits following the flooding incidents; part of the council's investigation and gullies/road drainage maintenance actions. (p29)</p></div><div class="nugget-popup"><p>Properties on Riverside Close experienced flooding during the heavy downpour on 2 June 2017; a homeowner reported their garden and parts of their house were flooded and that runoff from London Road entered Riverside Close (avoiding the road hump at the entrance). The culvert blockage under Derek Avenue is identified as a contributing factor. [PAG] (p43)</p></div><div class="nugget-popup"><p>Properties on Riverside Close experienced flooding during the heavy downpour on 2 June 2017; a resident reported their garden and parts of their house were flooded. The resident observed water coming off London Road and bypassing the road hump at the entrance to Riverside Close. The culvert blockage upstream may have significantly contributed to this flooding. [PAG,IMG] (p44)</p></div><div class="nugget-popup"><p>Properties along Riverside Close are located in a topographic low and are identified as a flood hotspot. Overland surface water drains along London Road toward Riverside Close, concentrating flow at this location; the main overland flow then outfalls to the River Wandle just north of River Side Close. [PAG,IMG] (p45)</p></div><div class="nugget-popup"><p>Riverside Close lies in a topographic low within the catchment so surface water and overland flow concentrate here; properties along Riverside Close are identified as a flood hotspot and receive flows that then outfall to the River Wandle just north of the street. [PAG,IMG] (p46)</p></div><div class="nugget-popup"><p>Surface water flooding encroaches onto an impacted property on Riverside Close; predicted 1&ndash;in&ndash;1000&ndash;year surface water extent produces flood depths of about 0.15 m&ndash;0.30 m (maximum). [IMG] (p47)</p></div><div class="nugget-popup"><p>Predicted surface&ndash;water extent for the 1 in 1000 year event encroaches onto an impacted property on Riverside Close; site is assessed as at high risk of surface water flooding and a nearby minor ordinary watercourse links to the local surface water sewer network. [PAG,IMG] (p48)</p></div><div class="nugget-popup"><p>Identified in the report as a flooding hotspot during the June 2017 flood incident. Location lies within the ≥75% Areas Susceptible to Groundwater Flooding class; the report states there were no reports of basement or subsurface flooding at the site and concludes groundwater, sewer and reservoir sources were not believed to be the cause. [IMG,PAG] (p49)</p></div><div class="nugget-popup"><p>Surface water flowing off London Road entered Riverside Close, causing flooding of lower&ndash;lying properties; a culvert blockage (pond under Derek Avenue) contributed to the flood impact. Residents were affected and incidents were reported to the council. [TAB,PAG] (p50)</p></div><div class="nugget-popup"><p>Surface water entered lower&ndash;lying properties and the highway; entrance geometry (raised table road hump) allowed surface water to enter properties. (p51)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property [TAB] (p22)</p></div><div class="nugget-popup quant"><p>1 property [PAG,IMG] (p23)</p></div><div class="nugget-popup quant"><p>flood depths 0.15m&ndash;0.30m; at risk in 1&ndash;in&ndash;30, 1&ndash;in&ndash;100 and 1&ndash;in&ndash;1000 year events [IMG] (p47)</p></div><div class="nugget-popup quant"><p>1 impacted property; flood depths ranging from 0.15 m to 0.30 m maximum [PAG,IMG] (p48)</p></div></div></body></div>`)[0];

                var html_97c0bb3f913e3a26c56cebd39e02a1ff = $(`<div id="html_97c0bb3f913e3a26c56cebd39e02a1ff" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Carshalton High Street, London Borough of Sutton</h1><div class="nugget-popup"><p>Surface water infrastructure (surface water pipe) at Carshalton High Street was identified for detailed investigation by TWUL (in partnership with TfL) because it was associated with flooding at this hotspot location. (p4)</p></div><div class="nugget-popup"><p>Floodwater flowing from the car park entered a property through the door; water resided in the kitchen and basement. [TAB] (p16)</p></div><div class="nugget-popup"><p>Flood water originating from an adjacent car park entered a property through the door, inundating the kitchen and causing significant basement flooding (several inches of water with floating debris visible in photographic evidence). [PAG,IMG] (p19)</p></div><div class="nugget-popup"><p>Property flooding on High Street, Carshalton during the June 2017 event; properties were inundated in two catchments. [TAB] (p22)</p></div><div class="nugget-popup"><p>Properties on Carshalton High Street were flooded during the June 2017 event; flooding is reported in two catchments (catchment 3 and catchment 5), indicating repeated/localised surface water/urban flooding impacts to premises on the High Street. [PAG,IMG] (p23)</p></div><div class="nugget-popup"><p>Identified in Section 19 response as a location where flooding occurred; site visit carried out and highway inspectors engaged to clean blocked gullies as part of the response. (p29)</p></div><div class="nugget-popup"><p>Surface water from a heavy downpour (2 June 2017) overwhelmed drains and travelled along the High Street, entering properties. Reported impacts include extensive internal flooding requiring evacuation of a residence, flooding of a kitchen and basement from water coming from a car park, and surface water entering a shop via the shop front. A large footpath tree is believed to have exacerbated the flooding. [PAG] (p52)</p></div><div class="nugget-popup"><p>Surface water from a heavy downpour overwhelmed drains and travelled along the High Street into properties: internal flooding requiring evacuation, water entering through front doors, kitchen and basement flooding, and a shop front flooded. A footpath tree is believed to have exacerbated the flooding. [PAG,IMG] (p53)</p></div><div class="nugget-popup"><p>Properties along Carshalton High Street were located within a flood hotspot and reported flooding caused by overland surface&ndash;water flow draining to the low point at the High Street; flooded properties lie on the primary overland flow path toward the River Wandle. [PAG,IMG] (p54)</p></div><div class="nugget-popup"><p>Properties along Carshalton High Street lie in a topographical low on the catchment's primary overland flow path and were reported to have flooded during the event; street and property flooding was caused by overland surface water flows draining into the low point. [PAG,IMG] (p55)</p></div><div class="nugget-popup"><p>Properties along Carshalton High Street were affected by surface water driven by overland flow: the High Street lies in a topographic low within the catchment and is identified as a flood hotspot where surface water drains and concentrates, with properties on the overland flow path reported as having flooded. [PAG,IMG] (p56)</p></div><div class="nugget-popup"><p>During the June 2017 storm a drain on Carshalton High Street was overwhelmed, leading to flooding at a property (basement flooding and water entering via the front door). Local surface water drainage (three 375mm pipes combining into a single 450mm surface water pipe) was unable to cope, and the incident is attributed to sewer/surface&ndash;water drainage failure. [IMG,PAG] (p58)</p></div><div class="nugget-popup"><p>Properties along High Street experienced flooding (including basement flooding at a property that prompted a London Fire Brigade callout). Gullies along the High Street were found blocked with vegetation/rotting leaves and silt, contributing to carriageway and property flooding; gullies were cleaned by TfL and sandbags were placed by emergency services/residents as a temporary measure. (p59)</p></div><div class="nugget-popup"><p>Extensive basement flooding to a property on the High Street; the London Fire Brigade were called but did not pump out water; sandbags were placed by emergency services as a temporary measure to prevent further flooding (at the resident's initiative). (p60)</p></div><div class="nugget-popup"><p>Surface water sewer network along the High Street surcharged during the June 2017 event prompting investigation and maintenance reviews; associated highway flooding is reported in the hotspot for the same period. (p61)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property [PAG,IMG] (p19)</p></div><div class="nugget-popup quant"><p>3 properties (catchment 3); 1 property (catchment 5) [TAB] (p22)</p></div><div class="nugget-popup quant"><p>3 properties (catchment 3); 1 property (catchment 5) [PAG,IMG] (p23)</p></div><div class="nugget-popup quant"><p>one property; one drain overwhelmed (single 450mm surface water pipe section) [IMG,PAG] (p58)</p></div><div class="nugget-popup quant"><p>addresses 43&ndash;51 High Street Carshalton; 96 High Street Carshalton; 39 High Street Carshalton; a property on the High Street (basement flooded) (p59)</p></div></div></body></div>`)[0];

iv><div class="nugget-popup"><p>A drain along Stanley Park Road was reported as overwhelmed with water during the rainfall event; this contributed to sewer&ndash;related flooding at the intersection with Warnham Court Road. Site visit notes indicate water could surcharge from a nearby BT chamber onto the adjacent footway during storm conditions. (p69)</p></div><div class="nugget-popup"><p>Sewer deposits and structural defects were identified that reduced pipe capacity and presented an immediate risk of backing up and/or causing flooding. A clean of the local sewer (including Stanley Park Road) was completed on 23/03/2018. [MUL] (p70)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 properties; highway flooding [PAG,IMG] (p23)</p></div><div class="nugget-popup quant"><p>three properties (p62)</p></div></div></body></div>`)[0];

it). Sewer/surcharging issues in the area led to cleaning actions on the local network. (p70)</p></div><div class="nugget-popup"><p>The junction between Warnham Court Road and Stanley Park Road was identified for regular gully cleaning due to issues observed after the June 2017 flood event; gully cleansing and CCTV surveys were carried out in the aftermath. (p71)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property [TAB] (p22)</p></div><div class="nugget-popup quant"><p>1 property; highway flooding [PAG,IMG] (p23)</p></div></div></body></div>`)[0];

                var html_e0989eb3adc427edd06294f6858742b1 = $(`<div id="html_e0989eb3adc427edd06294f6858742b1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Oxford Road, Carshalton</h1><div class="nugget-popup"><p>A property on Oxford Road experienced flooding linked to a nearby surface water chamber; TWUL were recommended to investigate nearby assets (Harrow Road) and to clear and regularly maintain the surface water chamber to prevent blockages. (p4)</p></div><div class="nugget-popup"><p>Two properties on Oxford Road were flooded during the June 2017 event. [TAB] (p22)</p></div><div class="nugget-popup"><p>Surface water ponding and flooding at a local low point resulted in internal flooding of properties; two properties were flooded during the June 2017 heavy rainfall event, attributed to excess surface water and limited local drainage capacity. [PAG,IMG] (p23)</p></div><div class="nugget-popup"><p>Named in the report as having had a site visit as part of the post&ndash;flood investigation; highway gully clearance was undertaken in affected areas. (p29)</p></div><div class="nugget-popup"><p>Heavy downpour on 2 June 2017 caused surface water flooding on Oxford Road that poured onto the pavement and into driveways. At least two homeowners reported their garages and the side&ndash;entry/driveway to their properties were flooded. A malfunctioning drain at Harrow Road (adjacent to a property) contributed to surface water entering properties. [IMG,PAG] (p72)</p></div><div class="nugget-popup"><p>Heavy downpour on the afternoon of 2 June 2017 caused floodwater to pour onto the pavement and down into driveways. Resident accounts report that water entered properties: garages were flooded and the sideway entry to properties flooded. [PAG,IMG] (p73)</p></div><div class="nugget-popup"><p>Oxford Road lies at a topographical low within the defined hydrological catchment so surface water runoff and the primary overland flow route concentrate at the carriageway; properties along Oxford Road are identified as being within a flood hotspot. The overland flow path from the catchment then outfalls to the River Wandle just north of Oxford Road. [PAG,IMG] (p75)</p></div><div class="nugget-popup"><p>A surface water chamber on Oxford Road was full of silt, blocking its designed connection to the southern soakaway; this blockage is believed to have exacerbated flooding during the 01 Jun 2017 &ndash; 30 Jun 2017 event. The incident is attributed to sewer&ndash;related flooding (not groundwater or fluvial sources). [IMG,PAG] (p77)</p></div><div class="nugget-popup"><p>Oxford Road experienced sewer&ndash;sourced/local surface water flooding during the June 2017 event; drainage assets (notably the southernmost soakaway and an associated surface water chamber) were identified as potentially exacerbating flooding and were cleared in later remedial works. [TAB,PAG] (p78)</p></div><div class="nugget-popup"><p>The southernmost soakaway on Oxford Road (fed by a surface water chamber) was implicated in the flooding; the chamber/soakaway may have faults or blockages and mitigation (gullies/swales) was recommended to reduce sewer network load. (p79)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>two properties [TAB] (p22)</p></div><div class="nugget-popup quant"><p>two properties [PAG,IMG] (p23)</p></div><div class="nugget-popup quant"><p>2 homeowner accounts; 4 incidents (2012, 2014, 2015, June 2017) [IMG,PAG] (p72)</p></div><div class="nugget-popup quant"><p>At least 2 garages flooded; past flood incidents reported in 2012, 2014, 2015 and June 2017 by residents. [PAG,IMG] (p73)</p></div></div></body></div>`)[0];
