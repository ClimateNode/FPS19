                var html_c80399bfe08d0fce304142b499f13449 = $(`<div id="html_c80399bfe08d0fce304142b499f13449" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Albert Dock</h1><div class="nugget-popup"><p>At the height of the tidal surge (peak ~5.8mAOD) sea water entered into Albert Dock over defences and through the lock gates; once the dock rapidly filled this water flowed onwards into the city and contributed to flooding of the city centre. (p5)</p></div><div class="nugget-popup"><p>Identified as the origin/source area for tidal ingress during the event; low defences allowed tidal water to enter the dock area and into local sewer/drainage, contributing to sewer surcharging and downstream flooding impacts. [PAG] (p14)</p></div><div class="nugget-popup"><p>Defence levels at Albert Dock are known to be lower than other parts of the city and were a focus during the flood event; temporary and long&ndash;term raising of defences was being considered following the event. The dock was the subject of defence operations during the 5th December tidal/extreme levels. [IMG] (p17)</p></div><div class="nugget-popup"><p>Riverside areas of Albert Dock were overwashed by tidal waters; the volume of water grossly exceeded the dock basin's storage capacity and so could not prevent flood flows entering the city. (p19)</p></div><div class="nugget-popup"><p>Tidal surge caused overtopping into the dock, raising dock levels; once the dock filled, flood waters passed from the dock into the city. Investigation found that water entering the dock over low points in the riverside defences far exceeded the amount entering through the lock. The dock provided some informal storage which limited impacts elsewhere but did not prevent significant flooding on the date of the event. (p21)</p></div><div class="nugget-popup"><p>Operational procedures for the lock gates were not fully finalised during the tidal surge; recommendations call for full and final implementation of procedures and consideration of optimising agreements so the dock can provide an informal flood storage role. Defence improvements in the Albert Dock area were identified as a highest priority following the event. [TAB] (p22)</p></div><div class="nugget-popup"><p>The riverside quay at Albert Dock had the lowest defence levels in the city; significant tidal flood waters overwhelmed the dock and flowed through it into adjacent areas (notably English Street). [PAG] (p23)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>43 properties (p14)</p></div></div></body></div>`)[0];

                var html_5b27bc292aa2cbccee3302c958169d16 = $(`<div id="html_5b27bc292aa2cbccee3302c958169d16" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kingston Upon Hull Unitary Authority</h1><div class="nugget-popup"><p>Record tidal levels and a positive surge caused seawater ingress into parts of the city (notably English Street), flows spread into the city centre and as far west as Hessle Road; defences limited overtopping but low points (Riverside Quay/Albert Dock) allowed seawater into the dock which then flowed into the city; overall large&ndash;scale tidal flooding impacts across the city. (p4)</p></div><div class="nugget-popup"><p>Tidal inundation (from the Humber tidal source) caused flooding of properties and roads across central and southern parts of Kingston upon Hull including the city centre and docklands; flood flow routes are indicated across the urban area on the map. [IMG] (p8)</p></div><div class="nugget-popup"><p>The report links the 5 December 2013 tidal flood source (the River Humber) to the Hull area and describes the city's Humber frontage as being defended by raised flood defences (flood walls, wharfages, defence levels in the public realm) and the Hull Tidal Surge Barrier. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>Flooding entered the city around the time severe flood warnings were issued (18:56 on 5th December); CCTV recorded deep, fast&ndash;flowing flood waters in the English Street area; riverside defences (e.g. Victoria Dock) showed evidence of overtopping as surge and wind/wave direction changed and forecasts increased. (p12)</p></div><div class="nugget-popup"><p>Flood flows moved through the city centre, causing severe traffic disruption, inundation of buildings and vehicles, and closure of the A63. (p16)</p></div><div class="nugget-popup"><p>City defences generally withstood the tidal level; the council opened the Civic control room, set up rest centres and evacuated residents from care homes on Victoria Dock Village and Ferensway. (p18)</p></div><div class="nugget-popup"><p>The city experienced tidal flood threat and impacts on 5 December; defences prevented inundation across vast parts of the city but flood flows did pass into the city where defences were overtopped (including sewer and riverside inundation in parts of the urban area). [PAG] (p19)</p></div><div class="nugget-popup"><p>Experienced a tidal surge that produced record tide levels in the city; existing flood defences protected properties but warnings were issued close to the onset of flooding limiting time for emergency deployment. Recommendations include full topographic surveys of all flooded locations, review of incident room activities, and incorporation of model findings into planning and policy. [TAB] (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>115 businesses; 149 residential properties; 19,000 properties protected (p4)</p></div><div class="nugget-popup quant"><p>>100,000 properties in the city (reported as at risk of tidal flooding) [IMG,PAG] (p9)</p></div><div class="nugget-popup quant"><p>114 businesses and 149 residential properties (p12)</p></div><div class="nugget-popup quant"><p>more than 50 residents (p18)</p></div><div class="nugget-popup quant"><p>more than 19,000 properties [TAB] (p22)</p></div></div></body></div>`)[0];

                var html_d2e1f23b2d53cc455e6b6317f86d03f8 = $(`<div id="html_d2e1f23b2d53cc455e6b6317f86d03f8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Humber</h1><div class="nugget-popup"><p>The storm surge moved down the East coast into the Humber Estuary and caused tidal flooding in East Yorkshire; resulted in flooding on the north bank (East Riding) and significant flooding on the south bank of the Humber. [PAG] (p4)</p></div><div class="nugget-popup"><p>A tidal surge in the Humber arrived about 30 minutes before the astronomical tide, producing a peak tidal level recorded at 5.8mAOD at Hull which caused significant ingress of seawater into the city (English Street area and city centre) and contributed to widespread flooding. (p5)</p></div><div class="nugget-popup"><p>A tidal surge increased levels in the River Humber, causing overtopping and contributing to flooding across the city's southern boundary; this surge led to overtopping and road flooding at locations including St Andrews Quay retail park and Victoria Dock Village residential area. (p6)</p></div><div class="nugget-popup"><p>Tidal surge from the River Humber was the sole flood source for the event on 5 December 2013, driving tidal inundation into Kingston upon Hull that produced the mapped flooded properties, flooded roads and flood flow routes shown in Figure 1. [IMG,PAG] (p8)</p></div><div class="nugget-popup"><p>Identified in the report as the sole tidal source for the 5 December 2013 flood event. The river is described as the driver of tidal ingress risk around the estuary and requires active management to prevent inundation. (p9)</p></div><div class="nugget-popup"><p>A tidal surge on 5 December 2013 (initial forecasts 5.5m AOD, later increased by about 400mm) combined with changing wind/wave direction increased surge levels and the risk of overtopping defences, prompted severe flood warnings and consideration of evacuations and led to flooding into Hull. (p12)</p></div><div class="nugget-popup"><p>High sea levels and surge tides on the Humber contributed to overtopping of riverside defences and consequent flooding across the city, leading to inundation of properties and businesses. [PAG] (p13)</p></div><div class="nugget-popup"><p>Tidal surge/flows in the Humber caused overtopping of defences and contributed to tidal inundation and overwash of riverside areas affecting the city and port facilities. (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than 400 properties [PAG] (p4)</p></div><div class="nugget-popup quant"><p>115 businesses; 149 residential properties (p5)</p></div><div class="nugget-popup quant"><p>more than 250 properties (p6)</p></div><div class="nugget-popup quant"><p>115,000 hectares; 400,000 properties; &gt;100,000 properties in Hull (p9)</p></div><div class="nugget-popup quant"><p>114 businesses; 149 residential properties (p12)</p></div><div class="nugget-popup quant"><p>114 businesses; 149 residential properties [PAG] (p13)</p></div></div></body></div>`)[0];
