                var html_b7cefc1e3ee9165d3817fe52e4586e1d = $(`<div id="html_b7cefc1e3ee9165d3817fe52e4586e1d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Nottinghamshire</h1><div class="nugget-popup"><p>Within Nottinghamshire, the village of Caunton experienced surface water flooding during Storm Babet, resulting in 39 residential properties being internally flooded and further garden/outbuilding and road flooding in the village. (p1)</p></div><div class="nugget-popup"><p>County&ndash;wide flood event included surface water flooding and a continued risk of river flooding. Flood&ndash;affected residents and businesses experienced internal flooding that required verification on site; sandbags were delivered to affected areas and communities; 77 roads were closed across the county to promote road safety and avoid additional flood damage; actions to clean up roads, paths and remove bulky waste from flooded homes were carried out. An investigation was commissioned into surface water runoff/highway drainage in the Mill Lane area as part of the aftermath. (p7)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>39 residential properties (p1)</p></div><div class="nugget-popup quant"><p>77 roads (p7)</p></div></div></body></div>`)[0];

                var html_ee1d0ebb9f9b9e6a7dada88f1df65c9d = $(`<div id="html_ee1d0ebb9f9b9e6a7dada88f1df65c9d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Caunton</h1><div class="nugget-popup"><p>During Storm Babet the village experienced extensive surface water flooding: 39 residential properties suffered internal flooding; additional properties experienced flooding to gardens and outbuildings and roads were flooded. The scale of flooding in the village was greater than any on record. [PAG] (p1)</p></div><div class="nugget-popup"><p>The village experienced significant internal flooding during the Storm Babet event: 39 residential properties suffered internal flooding; further properties experienced flooding to gardens and outbuildings. Flooded areas included central village clusters and an outlying farm area (highlighted in Figure 2). [IMG,PAG] (p2)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties; gardens and outbuildings also flooded. The scale of flooding in the village during Storm Babet was greater than any on record. [IMG,PAG] (p3)</p></div><div class="nugget-popup"><p>Caunton experienced flooding during Storm Babet. The report states the majority of flooding in the village during the event correlated with the predicted flood zones. Specific impacts: a number of properties in the Mill Lane area suffered internal flooding attributed to surface&ndash;water runoff from the public highway; residents raised concerns about hydraulic capacity of three bridges over The Beck and about the effectiveness/condition of highway drainage (an investigation of Mill Lane drainage connectivity and condition was later carried out). [IMG] (p4)</p></div><div class="nugget-popup"><p>The Caunton community is considering how to access the Government's Property Flood Resilience Repair Grant; the council is delivering grant funding to eligible individuals and working with parish council/residents on recovery (including restocking aqua sacs and continuing partnership working). (p8)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>39 residential properties [PAG] (p1)</p></div><div class="nugget-popup quant"><p>39 residential properties [IMG,PAG] (p2)</p></div><div class="nugget-popup quant"><p>39 residential properties [IMG,PAG] (p3)</p></div></div></body></div>`)[0];
