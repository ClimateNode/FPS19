ntified impacts</i><div class="nugget-popup quant"><p>peak ≈ 1.2 m river level [IMG] (p33)</p></div></div></body></div>`)[0];

></div><div class="nugget-popup"><p>South and east areas of Leicester experienced flooding on 22nd June 2023: public highways were flooded and properties were flooded where rainfall exceeded the capacity of public sewer systems. [TAB] (p23)</p></div><div class="nugget-popup"><p>Flooding of public highways across Leicester occurred on 22nd June 2023 when public sewers and highway drainage interacted, causing transport disruption and prompting investigations. [PAG] (p24)</p></div><div class="nugget-popup"><p>Roads in Leicester experienced flooding on 22nd June 2023; this led to requests for sewer condition reports and localised modelling to identify capacity issues in drainage and sewer networks. (p25)</p></div><div class="nugget-popup"><p>Areas in the South Knighton area along the Hol Brook were affected by flooding; flooding occurred along the watercourse and affected the local area. (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 80 domestic properties (p4)</p></div><div class="nugget-popup quant"><p>18 flooding incidents; 95 personnel; 7 pumps (at 6 locations); over 60 properties visited [PAG] (p8)</p></div><div class="nugget-popup quant"><p>more than 6 properties at multiple locations [IMG,PAG] (p11)</p></div></div></body></div>`)[0];
