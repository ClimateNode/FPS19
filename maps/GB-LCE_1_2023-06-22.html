</body></div>`)[0];

                var html_fd071a8d049c3fd2099876bdc71a970d = $(`<div id="html_fd071a8d049c3fd2099876bdc71a970d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Leicester Unitary Authority</h1><div class="nugget-popup"><p>Intense rainfall on 22 June 2023 caused surface water to flow across the ground and overwhelm drains and sewers, resulting in internal flooding of domestic properties. (p4)</p></div><div class="nugget-popup"><p>Properties across a large area of the city were recorded as flooded during the storm covered by this report. (p6)</p></div><div class="nugget-popup"><p>On 22 June 2023 intense rainfall caused many sewers to surcharge in the south and east of the city. Evidence included displaced manhole/inspection covers. The event caused rapid overland flow to low areas, overwhelmed highway gullies and outfalls, and resulted in damage to roads, paving and significant damage to highway surfacing. [IMG,PAG] (p7)</p></div><div class="nugget-popup"><p>Widespread surface water and sewer surcharging across the city (particularly south and east) caused displaced manhole/inspection covers, roads and paving damage, flooded roads, and internal property flooding. Overland flows moved rapidly to low areas; emergency response and highway repairs were required. [PAG] (p8)</p></div><div class="nugget-popup"><p>A map of reported internal property flooding incidents shows distributions across the city with the highest concentration of reports in central and northeastern Leicester; several locations on the map are indicated as having affected more than six properties. [IMG,PAG] (p11)</p></div><div class="nugget-popup"><p>Public highways across the city experienced flooding related to the interaction between highway drainage and the public sewer network, prompting reporting to the water company and targeted maintenance actions. [TAB] (p21)</p></div><div class="nugget-popup"><p>South and east areas of Leicester experienced flooding on 22nd June 2023: public highways were flooded and properties were flooded where rainfall exceeded the capacity of public sewer systems. [TAB] (p23)</p></div><div class="nugget-popup"><p>Flooding of public highways across Leicester occurred on 22nd June 2023 when public sewers and highway drainage interacted, causing transport disruption and prompting investigations. [PAG] (p24)</p></div><div class="nugget-popup"><p>Roads in Leicester experienced flooding on 22nd June 2023; this led to requests for sewer condition reports and localised modelling to identify capacity issues in drainage and sewer networks. (p25)</p></div><div class="nugget-popup"><p>Areas in the South Knighton area along the Hol Brook were affected by flooding; flooding occurred along the watercourse and affected the local area. (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 80 domestic properties (p4)</p></div><div class="nugget-popup quant"><p>18 flooding incidents; 95 personnel; 7 pumps (at 6 locations); over 60 properties visited [PAG] (p8)</p></div><div class="nugget-popup quant"><p>more than 6 properties at multiple locations [IMG,PAG] (p11)</p></div></div></body></div>`)[0];
