o parts of the village and some roads/built&ndash;up areas, indicating vulnerability during the event. [IMG] (p5)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>17 residential properties [PAG] (p2)</p></div></div></body></div>`)[0];
