                var html_7bac20537fc2ac83e1e0c76def460c21 = $(`<div id="html_7bac20537fc2ac83e1e0c76def460c21" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Port Road, Upper Harlestone</h1><div class="nugget-popup"><p>Internal flooding of property(ies) on Port Road. Excess surface water from intense rainfall on a saturated catchment flowed over ground following natural contours to areas around the watercourse at Port Road, causing internal flooding. [PAG] (p5)</p></div><div class="nugget-popup"><p>Excess surface water flowed over ground following natural contours to areas around the watercourse at Port Road; internal flooding of at least one property on Port Road was reported. [PAG] (p6)</p></div><div class="nugget-popup"><p>Floodwater overtopped the public highway, flowing in and around properties on Port Road and adjacent fields; at least one property experienced severe internal flooding to ground floor living areas; residents required temporary alternative accommodation. [PAG] (p8)</p></div><div class="nugget-popup"><p>The public highway became full of surface water flowing to the low point at the culvert; water was retained within the verge and kerbs, increased in depth and led to overtopping of a residential driveway. (p9)</p></div><div class="nugget-popup"><p>The public highway became full of surface water flowing to the low point at the culvert; water was retained within the verge and kerbs, gained depth as rain continued and overtopped a residential driveway. (p10)</p></div><div class="nugget-popup"><p>Adjacent fields either side of the watercourse west of Port Road ponded during the flood incident; this ponding prompted recommendations to investigate and reinstate historic drainage and to assess highway drainage (gullies, carriageway levels and verge grips) to reduce runoff/ponding affecting the highway and nearby properties. (p16)</p></div><div class="nugget-popup"><p>Carriageway crossfall and drainage arrangement directs surface water runoff toward nearby properties, creating areas of flood risk to property. Historic road gullies and highway drainage in this location have been found buried (under approximately 1 m of carriageway verge), which may impair drainage function and maintenance and increase surface water reaching properties. The culvert inlet under Port Road has a grille arrangement that is vulnerable to debris ingress, increasing the risk of blockage and consequent surface water flooding. (p17)</p></div><div class="nugget-popup"><p>Roadside drainage (culvert and debris screen) was observed intercepting and conveying runoff from the road; visible water flow at the culvert entrance indicates the drainage feature was actively managing surface water from the road. [IMG,PAG] (p36)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least one property [PAG] (p5)</p></div><div class="nugget-popup quant"><p>at least one property [PAG] (p6)</p></div><div class="nugget-popup quant"><p>one property [PAG] (p8)</p></div><div class="nugget-popup quant"><p>1 driveway overtopped (p9)</p></div></div></body></div>`)[0];

                var html_2bd7c637a9776f5c722824eb5a3ea7d6 = $(`<div id="html_2bd7c637a9776f5c722824eb5a3ea7d6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Upper Harlestone</h1><div class="nugget-popup"><p>Flooding occurred in the village as a result of intense rainfall on a saturated catchment; properties (including those on Port Road) experienced internal flooding and surface water followed natural contours toward the watercourse. [PAG] (p6)</p></div><div class="nugget-popup"><p>People and property were affected by flooding on 21 November 2012. Fields either side of the watercourse became ponded; surface water in the public highway deepened and a residential driveway was overtopped. A residential property experienced internal flooding of the ground&ndash;floor living area (a previous incident reported to have manifested in the same way as the 21 Nov 2012 event). (p9)</p></div><div class="nugget-popup"><p>The report discusses flooding in the locality: rear yards, access ways and gardens of properties were flooded; emergency services attended (Fire Service) and highway works were carried out on Port Way to manage flow; overland flow entered properties and later drained away into the watercourse/Fish Pond. (p11)</p></div><div class="nugget-popup"><p>Flooding occurred in the village during the Flood Incident as a result of intense rainfall. Residents were identified as being at risk of flooding and were advised to take property&ndash;level protection and community resilience measures (sign up to Flood Warning Direct, nominate flood wardens, produce flood plans, implement flood protection, move valuables to higher ground). [PAG] (p14)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least one property [PAG] (p6)</p></div><div class="nugget-popup quant"><p>1 residential property (internal ground&ndash;floor flooding); 1 driveway overtopped (p9)</p></div></div></body></div>`)[0];
