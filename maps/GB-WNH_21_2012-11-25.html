                var html_dd5efa809272a28d17387f9709835481 = $(`<div id="html_dd5efa809272a28d17387f9709835481" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>School Lane, Quinton</h1><div class="nugget-popup"><p>Excess surface water from intense rainfall flowed to low points on School Lane, causing internal flooding of at least one property and indicating repeated internal flooding on at least one other occasion within the prior five years. [PAG] (p5)</p></div><div class="nugget-popup"><p>Excess surface water flowed to low points on School Lane during intense rainfall on 25 November 2012; at least one property on or adjacent to School Lane flooded internally. The lane acted as a flow route for runoff following natural contours to low points. [PAG] (p6)</p></div><div class="nugget-popup"><p>Street was inundated during the event; at least one adjacent property experienced internal flooding and flood water beyond the building threshold; temporary drainage trench excavated to allow flood water to drain north of the village. (p8)</p></div><div class="nugget-popup"><p>A large volume and high&ndash;velocity surface water flowed south&ndash;to&ndash;north along School Lane after culvert sections and riparian ditches overtopped; surface water ran down School Lane toward the low point at Preston Deanery Road and posed a risk to buildings as water flowed through properties' gardens toward School Lane. (p10)</p></div><div class="nugget-popup"><p>Start of a culvert in a riparian&ndash;owned ditch on the north side of Wootton Road conveys water that then flows northwards along School Lane; the culvert entrance contains water, indicating drainage flow/standing water affecting the lane's drainage corridor. [IMG,PAG] (p35)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 1 property; 1 other occasion in last 5 years [PAG] (p5)</p></div><div class="nugget-popup quant"><p>at least 1 property flooded internally [PAG] (p6)</p></div><div class="nugget-popup quant"><p>1 property (p8)</p></div><div class="nugget-popup quant"><p>at least three properties (p10)</p></div></div></body></div>`)[0];

                var html_8bcea3783bb42572555011d936350564 = $(`<div id="html_8bcea3783bb42572555011d936350564" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Preston Deanery Road, Quinton</h1><div class="nugget-popup"><p>During the intense rainfall event, excess surface water flowed along natural contours to low points on Preston Deanery Road, causing surface&ndash;water flooding at those low points. (p6)</p></div><div class="nugget-popup"><p>The road experienced flooding during the event on 25 November 2012. (p8)</p></div><div class="nugget-popup"><p>An area of ponding formed at the junction of Preston Deanery Road and School Lane; ponding water (~150mm deep) caused flooding to a residential property. The Fire and Rescue Service pumped water north and excavated a temporary trench to allow ponding water to flow away; ponded areas also drained via highway drainage. (p10)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one residential property; 150mm in depth (p10)</p></div></div></body></div>`)[0];

                var html_3778f66cec75fa0bef58c259549fd85e = $(`<div id="html_3778f66cec75fa0bef58c259549fd85e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wootton Road, Quinton</h1><div class="nugget-popup"><p>Runoff and surface flows on Wootton Road (including flow from the start of the culvert) were not removed by the riparian ditch and highway grip drainage systems, so flows from Wootton Road travelled to School Lane and added to the overall surface water flooding; riparian ditches and culverted watercourse at the south of School Lane on Wootton Road were full of stagnant water and accepted runoff and treated foul water from nearby properties. (p10)</p></div><div class="nugget-popup"><p>Highway grip drains and adjacent riparian ditches on Wootton Road were identified as locations requiring attention because the drainage was not able to convey the flood flows; this contributed to overspill toward the highway and nearby properties. (p16)</p></div><div class="nugget-popup"><p>Riparian&ndash;owned roadside ditches alongside Wootton Road (north side) contain standing water adjacent to the carriageway; evidence of highway grip drains and historic riparian ditches west of School Lane are present, indicating drainage features alongside the road are affected by retained water. [IMG,PAG] (p35)</p></div></div></body></div>`)[0];

                var html_383b69487315e0735ef91f296ab01366 = $(`<div id="html_383b69487315e0735ef91f296ab01366" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Quinton</h1><div class="nugget-popup"><p>Intense rainfall on a saturated catchment caused excess surface water to flow across Quinton (following natural contours), resulting in internal flooding of at least one property and noted to have occurred on at least one other occasion within the previous five years; historic drainage was ineffective. [PAG] (p5)</p></div><div class="nugget-popup"><p>At least one property in Quinton flooded internally during the flood event; flooding resulted from intense short&ndash;duration rainfall on a saturated catchment causing excess surface water to flow over ground following natural contours to low points (including School Lane and Preston Deanery Road). Flooding was also reported on at least one other occasion within the previous five years. [PAG] (p6)</p></div><div class="nugget-popup"><p>Village experienced flooding during heavy rainfall on 25 November 2012 including inundation of streets (School Lane and Preston Deanery Road) and at least one property flooded internally. (p8)</p></div><div class="nugget-popup"><p>Flood incidents occurred in Quinton; these incidents are the subject of LLFA (NCC) investigation and recommendations. The local watercourse in the village is an ordinary watercourse (not a Main River). [PAG] (p11)</p></div><div class="nugget-popup"><p>Flooding affected Quinton village associated with the local ordinary watercourse; the Main River (Wootton Brook) about 1.5 km downstream is not considered to affect the village flooding. (p12)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration rainfall on a saturated catchment caused existing drainage systems and watercourses to be unable to cope. Water overtopped systems and flowed to the low point in the village; drainage at that low point could not drain the quantity of water experienced. Inlets to drainage structures were affected by silt and debris, reducing flow capacity. (p15)</p></div><div class="nugget-popup"><p>Flows of water from higher ground overtopped drainage systems and flowed to the low point in the village. The village drainage was not designed to convey the quantity of water experienced, causing overspill of land drainage from watercourses onto the public highway and private property. (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 1 property; 1 other occasion in last 5 years [PAG] (p5)</p></div><div class="nugget-popup quant"><p>at least 1 property flooded internally; 1 additional historical occurrence within last five years [PAG] (p6)</p></div><div class="nugget-popup quant"><p>1 property (p8)</p></div></div></body></div>`)[0];
