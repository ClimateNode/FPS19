                var html_94d4628e4444854724b700186d50df7c = $(`<div id="html_94d4628e4444854724b700186d50df7c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Brook House</h1><div class="nugget-popup"><p>Brook House was within the July 2019 flood outline which exceeded the modelled 1 in 1000 extents; the report notes that flood mapping did not show the exceedance flow path around this building and identifies debris/possible blockages in the nearby culvert (The Demmings). [TAB] (p45)</p></div><div class="nugget-popup"><p>July 2019 (28 Jul&ndash;31 Jul 2019): Flooding affected the Brook House area; mapping did not show the exceedance flow path around the building. An upstream blockage/release at Brook House/The Demmings is identified as possibly increasing 2019 flood extents, and debris accumulation was reported. [PAG] (p46)</p></div><div class="nugget-popup"><p>An upstream blockage release at Brook House may have increased the extent of the July 2019 flood. (p47)</p></div><div class="nugget-popup"><p>Brook House car park was progressively inundated (stages recorded from ~75 mm up to ~750 mm), the wall adjacent to Brook House collapsed releasing ponded water into the downstream brook, and ground&ndash;floor industrial units with floor levels below external ground levels were quickly flooded. Internal flooding in the local area was reported up to 1.3 m deep for residential and commercial properties. (p84)</p></div><div class="nugget-popup"><p>Flood waters ponded and depths rapidly increased adjacent to Brook House as the return path was restricted by a brickwork boundary wall at the downstream end of the Brook House car park; at some point the ~0.9m&ndash;high wall collapsed into the watercourse and flood depth thereafter reduced. Video evidence indicates internal flooding of right&ndash;bank buildings (water draining from cracks). (p85)</p></div><div class="nugget-popup"><p>Overland (pluvial) surface water flow routed around the southern side of the industrial buildings and inundated the area around Brook House; the pluvial flood map and observed extents from 31 July 2019 show an overland flow path affecting Brook House. (p86)</p></div><div class="nugget-popup"><p>The culvert below Brook House was identified as a channel constriction that would increase upstream water levels and contribute to out&ndash;of&ndash;channel flow; EA inspected the culvert after the event and reported it clear of obstructions. [PAG] (p88)</p></div><div class="nugget-popup"><p>Used as an exceedance flow route during the July 2019 fluvial flooding from Micker Brook; preserving an open route via the car park was recommended to allow floodwater to return to the watercourse and to minimise flood depth. (p89)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>car park inundation up to 2.5 feet (750 mm); internal flooding reported for 10 residential properties and 9 commercial properties (area&ndash;wide) (p84)</p></div><div class="nugget-popup quant"><p>0.9m&ndash;high boundary wall collapsed (p85)</p></div></div></body></div>`)[0];

                var html_e661d0d301585d8fd6cbf4ea02b81d22 = $(`<div id="html_e661d0d301585d8fd6cbf4ea02b81d22" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Brookdale Club</h1><div class="nugget-popup"><p>Muddy water from Lady Brook entered the site on the afternoon of 31 July 2019: ponding commenced at the rear, drains and yard filled, water flowed onto the access, and muddy water streamed through a gateway and around the building; the front door and access to Bridge Lane were partially flooded. (p71)</p></div><div class="nugget-popup"><p>Ponding commenced at the rear of the building; drains filled the yard and the front door was partially flooded. Muddy water from Lady Brook flowed onto the rear access, streamed through a gateway in the river wall and flowed around the building onto the access road. [PAG] (p72)</p></div><div class="nugget-popup"><p>Access bridge at the rear of Brookdale Club became surcharged during the 31 July 2019 event, restricting flow under the bridge and causing increased upstream water depths and associated hydraulic energy losses. [IMG] (p74)</p></div></div></body></div>`)[0];

                var html_d289d5b54a33102ba3265e4ff5311efd = $(`<div id="html_d289d5b54a33102ba3265e4ff5311efd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lady Brook</h1><div class="nugget-popup"><p>Lady Brook is identified as affecting local flood levels; the report includes significant factors/structures on Lady Brook that contributed to elevated flood levels and river flooding impacting adjacent areas. [TAB,PAG] (p7)</p></div><div class="nugget-popup"><p>The Network C attenuation pond (which discharges into Lady Brook) overflowed and was damaged during the 28&ndash;31 July 2019 event, resulting in overflow/discharge into Lady Brook and elevated flows associated with the pond failure. (p33)</p></div><div class="nugget-popup"><p>Overflow from the full Network C pond flowed overland to Lady Brook; the river was noted as being 'very high' during the overflow on 31 Jul 2019. (p34)</p></div><div class="nugget-popup"><p>EA issued flood alerts relevant to Lady Brook on 28 and 31 July 2019 and carried out clear&ndash;up operations removing accumulated debris following localised flooding in the catchment. (p37)</p></div><div class="nugget-popup"><p>Fluvial (river) flooding on Lady Brook that affected Bramhall Green, prompting recommendations to consider options to reduce fluvial flood risk. [TAB] (p40)</p></div><div class="nugget-popup"><p>Fluvial flooding/risk from Lady Brook affected Bramhall Green and the report recommends considering options to reduce that fluvial flood risk. (p41)</p></div><div class="nugget-popup"><p>Lady Brook flows exceeded channel capacity during the July 2019 event, causing widespread flooding at the Bramhall Green roundabout and contributing to flooding at Bramhall Bridge upstream. [TAB,PAG] (p45)</p></div><div class="nugget-popup"><p>High flows in Lady Brook exceeded the capacity of the upstream channel and restricted discharge, which contributed to widespread flooding across the roundabout and flooding at Bramhall Bridge (Bramhall Lane South). (p46)</p></div><div class="nugget-popup"><p>Lady Brook experienced elevated flows during the July 2019 flooding. The report notes the A555 drainage contributed only a small portion of the flow to Lady Brook at this location, so the catchment upstream was the dominant source of high flows. (p49)</p></div><div class="nugget-popup"><p>Flows from overtopping Pond C reached Lady Brook during the July 2019 flood, causing overtopping&ndash;related erosion and slippage of the brook bank which exposed manhole construction and the potential outfall headwall; there is a risk of further bank erosion and a breach between the pond and the watercourse. [PAG] (p50)</p></div><div class="nugget-popup"><p>Overflow from the Network C attenuation pond flowed overland into Lady Brook, which was observed as 'very high' and receiving the overflow, contributing to limited discharge capacity and local flooding issues. (p63)</p></div><div class="nugget-popup"><p>Overtopping from attenuation Pond C occurred during the July 2019 event, causing overtopping erosion and bank slippage that exposed the outlet flow control chamber / manhole and created a risk of pond breach into Lady Brook. Pond outlet installation defects reduced available storage, worsening overtopping risk. (p66)</p></div><div class="nugget-popup"><p>Lady Brook overtopped its river wall on 31 July 2019 (spilling and weiring over the wall between about 16:37 and 16:47). Muddy water from the brook flowed onto access roads and through a gateway in the river wall, streaming around buildings; the brook's overtopping is directly linked to internal flooding of 12 properties (internal depth up to 2 ft / 0.6 m) and external flooding up to 5 ft (1.5 m). (p71)</p></div><div class="nugget-popup"><p>Lady Brook rose above bank levels and broke its banks, spilling over the river wall and sending muddy water into the rear of upstream properties (notably Brookdale Club) and onto adjacent accesses. The brook's overtopping contributed the majority of floodwater that ponded and then flowed towards Bramhall Green roundabout. [PAG] (p72)</p></div><div class="nugget-popup"><p>High flows in Lady Brook on 31 July 2019 produced surcharging at downstream bridges, raising upstream water levels and creating a hydraulic profile that increased flood risk to properties between Womanscroft Bridge and the Bramhall Green roundabout. Restrictions at bridges (notably at Bramhall Lane South) and silt build&ndash;up increased upstream depths. (p74)</p></div><div class="nugget-popup"><p>Flooding of Lady Brook caused increased flows that overtopped/channel constraints and resulted in extensive flood flow over Bramhall Lane South; hydraulic constraints at the Bramhall Lane South (old masonry arch + newer) bridge and silt build&ndash;up upstream exacerbated local flow depth increases. (p75)</p></div><div class="nugget-popup"><p>A tributary of Lady Brook to the south of Southern Crescent ponded upstream of a debris&ndash;choked bridge on Fred Perry Way and, when the blockage breached on 31 July 2019, a flood surge flowed downstream overwhelming the channel and causing garden and some property flooding on Southern Crescent. (p76)</p></div><div class="nugget-popup"><p>Fluvial flooding from Lady Brook expanded from the watercourse onto the rear of properties on Sandringham Road, approaching homes from the rear and leading to internal inundation. Contaminated floodwater entered properties and contributed to foul flooding when sewer networks became surcharged. (p80)</p></div><div class="nugget-popup"><p>Lady Brook overtopped/flowed during the late July 2019 event and was identified as the primary driver of fluvial flooding affecting Sandringham Road; its hydraulic behaviour (channel, weirs and floodplain interaction) dominated local flood water levels. (p82)</p></div><div class="nugget-popup"><p>Flooding in Lady/Micker Brook (Lady Brook upstream) caused localised flooding at Queens Road, the Demmings Road Industrial Estate and nearby streets (including Pickmere Gardens). Internal flooding was recorded in properties adjacent to the brook. [PAG] (p83)</p></div><div class="nugget-popup"><p>The upstream reach known as Lady Brook flowed into Micker Brook and contributed to the surge that caused localised flooding at Queens Road/Brook House and internal flooding of properties. (p84)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>outlet pipe installed 680 mm higher than designed (Pond C) (p66)</p></div><div class="nugget-popup quant"><p>12 properties; internal depth up to 2 feet (0.6m); external depth up to 5 feet (1.5m) (p71)</p></div><div class="nugget-popup quant"><p>0.3 m below soffit level (observed at 14:30 before overtopping) [PAG] (p72)</p></div><div class="nugget-popup quant"><p>6 houses flooded; 1 ft (0.3 m) flood depth inside homes (p80)</p></div><div class="nugget-popup quant"><p>10 residential properties; 9 commercial properties; internal flooding up to 1.3 m deep [PAG] (p83)</p></div><div class="nugget-popup quant"><p>10 residential properties; 9 commercial properties; internal flooding up to 1.3m deep (p84)</p></div></div></body></div>`)[0];

                var html_e1422751a574b4210b39b7553a20b249 = $(`<div id="html_e1422751a574b4210b39b7553a20b249" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Micker Brook</h1><div class="nugget-popup"><p>Flood extents on Micker Brook during the July 2019 event were inconsistent with modelled/mapped extents; a relatively recent housing development that had been mapped outside the 1&ndash;in&ndash;1000&ndash;year outline was flooded, and other properties alongside Micker Brook were also flooded. [MUL] (p11)</p></div><div class="nugget-popup"><p>EA carried out clear&ndash;up operations and issued flood alerts for the Micker Brook catchment on 28 and 31 July 2019. The report notes the formal warning for Micker Brook is driven by River Mersey trigger levels and was insensitive to localised intense rainfall in the Micker Brook catchment. (p37)</p></div><div class="nugget-popup"><p>Heaviest rainfall was centred on Micker Brook producing more significant fluvial flooding during the July 2019 event; recorded flood extents in locations (Sandringham Road, Queens Road/The Demmings, Broadway Avenue) were inconsistent with mapped EA extents, prompting recommendation to review modelling and mapping and extend the review upstream (including Bramhall Green). (p44)</p></div><div class="nugget-popup"><p>Micker Brook (main river) produced July 2019 flood extents that exceeded the mapped 1 in 1000 extents and contributed to property flooding at multiple locations (Sandringham Road, Queens Road, Wilmslow Road). Debris and potential blockages were reported in the channel and culverts. [TAB] (p45)</p></div><div class="nugget-popup"><p>Micker Brook (main river) produced flows in July 2019 that exceeded current 1 in 1,000 flood extents in multiple reaches (including Sandringham Road, Queens Road and Wilmslow Road reaches), leading to property flooding (including Broadway Avenue and areas around Brook House) and where debris and possible culvert blockages were observed; modelling and mapping for this reach are recommended to be updated and validated against the 2019 event. [PAG] (p46)</p></div><div class="nugget-popup"><p>July 2019 flood outline exceeded current 1 in 1000 flood extent for this reach; 2019 extent may have been increased by an upstream blockage release at Brook House. (p47)</p></div><div class="nugget-popup"><p>Micker Brook produced deep and fast&ndash;flowing floodwaters that caused dangerous flooding and 'Risk to Life' conditions at adjacent locations (e.g. Bramhall Green, Queens Road, Twinning Brook Road). (p53)</p></div><div class="nugget-popup"><p>Localised intense rainfall produced a rapid catchment response on the Micker Brook, contributing increased flood flows that combined downstream (via Lady Brook) and fed flooding at Bramhall Green and lower reaches (including Lyme Park and Poynton). The event highlighted that the River Mersey&ndash;based warning system was insensitive to these fast, localised catchment responses. [PAG] (p75)</p></div><div class="nugget-popup"><p>Catchment flooding on Micker Brook contributed to downstream flood impacts across Bramhall Green and other downstream locations; catchment&ndash;scale controls and a local flood warning system were recommended following the 28&ndash;31 July 2019 event. [PAG] (p76)</p></div><div class="nugget-popup"><p>Micker Brook carried the July 2019 flood flow that contributed to local flooding (including Sandringham Road). The EA pluvial map reproduces the July 2019 flood flow in Micker Brook, and the brook's hydraulic behaviour dominated local flood water levels; obstructions or weirs on the channel may have elevated levels. (p81)</p></div><div class="nugget-popup"><p>Fluvial flooding in Micker Brook (including its Lady Brook tributary) was the primary driver of the July 2019 flood at Sandringham Road. Localised intense rainfall produced flood flows in Micker Brook that inundated the corridor along Sandringham Road and adjacent residential streets. [PAG] (p82)</p></div><div class="nugget-popup"><p>Fluvial flooding from the Micker Brook / Lady Brook system caused localised flooding at Queens Road and adjacent streets (including Pickmere Gardens and the Demmings Road Industrial Estate) on the evening of 31 July 2019. Micker Brook passes under Queens Road in a walled channel and culvert, contributing to flooding at Brook House and nearby properties. Sandringham Road flooding in July 2019 was also driven by fluvial flooding from the Lady/Micker Brook system. [PAG] (p83)</p></div><div class="nugget-popup"><p>Micker Brook overtopped/ponded as it passed under Queens Road and alongside Old Wool Lane, flowed into a culvert under Brook House and contributed directly to localised flooding and internal inundation of nearby residential and commercial properties. A wall adjacent to Brook House collapsed, releasing ponded water into the brook downstream and exacerbating flooding. [PAG] (p84)</p></div><div class="nugget-popup"><p>Identified as the main river source of flooding; caused multiple out&ndash;of&ndash;channel overflows and bank overtopping that led to ponding and flooding of Queens Road, Pickmere Gardens, Old Wool Lane and Brook House. (p85)</p></div><div class="nugget-popup"><p>Identified as the primary driver of flooding at Queens Road and The Demmings in late July 2019; produced out&ndash;of&ndash;channel flows and elevated river levels that caused flooding in adjacent areas. (p89)</p></div><div class="nugget-popup"><p>Micker Brook overflowed / generated overland flow across Wilmslow Road on 31 Jul 2019, producing flow across the carriageway toward Broadway and contributing to a rapid downstream rise in water levels (linked to a release of ponded water at The Demmings Industrial Estate). [IMG,PAG] (p91)</p></div><div class="nugget-popup"><p>Main river that overtopped and generated out&ndash;of&ndash;channel flow. Broke its banks downstream of Wilmslow Road, producing overland flow that flooded Wilmslow Road, returned via properties on Wilmslow Road and Broadway, and led to raised flood levels affecting gardens and basements along Broadway Avenue. (p92)</p></div><div class="nugget-popup"><p>Micker Brook generated fluvial flooding consistent with the mapped extents and the flooding reported on 31 July 2019, contributing floodwater to adjacent streets and properties (including Wilmslow Road, Brookfield Crescent and Broadway Avenue). Culverted tributaries feeding the brook contributed to overland flow paths noted in the pluvial mapping. [PAG] (p93)</p></div><div class="nugget-popup"><p>Micker Brook is identified as the primary driver of the fluvial flooding that affected the Wilmslow Road area in late July 2019. The report notes possible debris accumulations upstream of Wilmslow Road bridge, siltation downstream, and blockages at culverted tributary entrances, and that secondary flooding occurred from two local (partly culverted) tributaries feeding Micker Brook. [PAG] (p94)</p></div><div class="nugget-popup"><p>Micker Brook produced a rapid fluvial response to intense local rainfall and was the source of flooding that affected downstream areas (including the Wilmslow Road area). The catchment (including Norbury, Poynton and Lady Brook) experienced localised flooding that was not well&ndash;captured by warning levels tied to the River Mersey. [PAG] (p95)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>10 residential properties; 9 commercial properties; internal flooding up to 1.3m [PAG] (p83)</p></div><div class="nugget-popup quant"><p>10 residential properties; 9 commercial properties; internal flooding up to 1.3m deep; Brook House car park observed depths: 75mm; 100mm; 150mm; 300mm; 750mm [PAG] (p84)</p></div></div></body></div>`)[0];

                var html_029cbc7871f474aa7bb0da4d270bf6d0 = $(`<div id="html_029cbc7871f474aa7bb0da4d270bf6d0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Poynton Brook</h1><div class="nugget-popup"><p>Recorded clear spikes in flow on 28 July and 31 July 2019 with the peak on 31 July significantly greater than the 28 July peak, indicating rapid runoff and river flooding of Poynton Brook during the event. (p29)</p></div><div class="nugget-popup"><p>Recorded rapid spikes in water level on 28 July and 31 July 2019, with the 31 July peak substantially larger. At the Poynton gauge the water level reached 2.195 m on 31 July 2019 (the highest since records began in December 2008). Flood&ndash;frequency analysis gives an estimated peak flow of around 12 m3/s for the July 2019 event with an indicative return period of about 45 years. [PAG,IMG] (p30)</p></div><div class="nugget-popup"><p>Peak flows were recorded on 31 July 2019; the Poynton gauge reached its highest level on record (2.195 m) during this event, indicating significant river flooding on Poynton Brook driven by the 31 July rainfall on saturated ground. (p31)</p></div><div class="nugget-popup"><p>The Environment Agency conducted clear&ndash;up operations on Poynton Brook, clearing accumulated debris and processing flood reports; flood warnings were issued for sections of Poynton Brook (Wigwam Wood, parts of Armcon Business Park, Poynton and Midway) during the event. [TAB] (p37)</p></div><div class="nugget-popup"><p>Peak flows recorded on 31 July 2019; gauge records show the 31 July peaks exceeded those on 28 July, indicating significant river response during the event. (p53)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2.195 m water level; peak flow around 12 m3/s; indicative return period around 45 years; highest since records began December 2008 [PAG,IMG] (p30)</p></div></div></body></div>`)[0];

                var html_7d5ec6e8701dab1e7e444e8bf8a62e20 = $(`<div id="html_7d5ec6e8701dab1e7e444e8bf8a62e20" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Poise Brook</h1><div class="nugget-popup"><p>Gauge&ndash;recorded peak flow on 28 July 2019 was slightly greater than the peak on 31 July, showing river flooding response to the intense rainfall on those dates and indicating rapid runoff in the Poise Brook catchment. (p29)</p></div><div class="nugget-popup"><p>Observed rapid rises in stage indicating flashy runoff and flooding: the record shows two major flood spikes (one on 28 July and another around 1 August) with additional smaller peaks between 29&ndash;31 July, demonstrating flood responses in the Poise Brook channel during the event period. [IMG] (p31)</p></div><div class="nugget-popup"><p>The Environment Agency carried out clear&ndash;up operations along Poise Brook after the July 2019 intense rainfall, clearing accumulated debris from the watercourse and processing flood reports. (p37)</p></div><div class="nugget-popup"><p>Fluvial flooding on Poise Brook produced observed flood extents at Bean Leach Road during the July 2019 event that exceeded the EA's mapped extents; the report recommends a review of modelling and mapping for the area. (p44)</p></div><div class="nugget-popup"><p>Poise Brook exceeded capacity at Bean Leach Road bridge during the July 2019 event, producing exceedance flows that ran along the road, bypassed defences and caused flooding of Minsmere Walks, Shearwater and adjacent properties. [TAB,PAG] (p45)</p></div><div class="nugget-popup"><p>Poise Brook exceeded capacity at the Bean Leach Road bridge during the July 2019 event, producing exceedance flows that ran along the highway and caused flooding of adjacent footways, open spaces and properties. (p47)</p></div><div class="nugget-popup"><p>Poise Brook flowed outflanking a third&ndash;party defence at Offerton Green; flows that were expected to be defended (to the 1 in 1,000&ndash;year standard) were overtopped/outflanked and travelled along Bean Leach Road, spilling towards the adjacent housing estate. (p54)</p></div><div class="nugget-popup"><p>Poise Brook produced fluvial flooding during the July 2019 event through Offerton Green: bulk floodwater travelled along Bean Leach Road bypassing a mapped third&ndash;party flood defence bund and there were concerns about siltation at Eld drainage outfalls reducing drainage efficiency. Actions were recommended to review fluvial flood mapping, alert triggers and options for flood risk management. [TAB] (p55)</p></div><div class="nugget-popup"><p>Poise Brook was implicated in the July 2019 flood mechanism whereby bulk floodwater (along Bean Leach Road) bypassed a mapped third&ndash;party defence bund, prompting review of fluvial flood mapping and alert trigger levels. (p56)</p></div></div></body></div>`)[0];

                var html_1267a6d41bbc38dc74503a38711c439e = $(`<div id="html_1267a6d41bbc38dc74503a38711c439e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Gatley Brook</h1><div class="nugget-popup"><p>A culvert/tributary under the railway linked to Gatley Brook is identified as the intended drainage route; blockage or failure of this route is inferred to have directed railway drainage and overland flows away from the culvert and onto Borrowdale Avenue, overwhelming the combined sewer system and contributing to foul surface&ndash;water/sewer flooding in the area. (p97)</p></div></div></body></div>`)[0];

                var html_5bbedfb452f73ef0a6b75af66c6c55f5 = $(`<div id="html_5bbedfb452f73ef0a6b75af66c6c55f5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Torkington Brook</h1><div class="nugget-popup"><p>Identified as the likely main source of flooding that led to surcharge at the culvert entrance and overland flow onto Hazelwood Road; overflow route returned to the main river downstream toward Bosden Fold Road and the confluence with Poise Brook. (p102)</p></div></div></body></div>`)[0];

                var html_4419447326735e620f2b573d90fb9108 = $(`<div id="html_4419447326735e620f2b573d90fb9108" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Stockport Metropolitan District</h1><div class="nugget-popup"><p>Properties across the borough experienced internal and external flooding; transport networks were disrupted across the borough. [PAG] (p10)</p></div><div class="nugget-popup"><p>The Metropolitan Borough of Stockport was heavily impacted by the storms (28&ndash;31 July 2019) with widespread flooding and transport disruption; large numbers of internal and external property flood reports were raised; surface water flooding occurred at many locations and some watercourses had very high flows causing bank flooding and overtopping at bridges and culverts. [PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Intense rainfall across 27&ndash;31 July caused widespread flooding and transport disruption across the Metropolitan Borough of Stockport, with a large number of reports of internal and external property flooding. [PAG] (p12)</p></div><div class="nugget-popup"><p>The Metropolitan Borough of Stockport was heavily impacted by the storms, with widespread internal and external property flooding across the borough and transport disruption. [TAB] (p13)</p></div><div class="nugget-popup"><p>The borough experienced widespread flooding that prompted the Section 19 investigation; the report reviews causes and major impacts across the most affected areas ('hotspots') and considers previous 2016 flood events. [PAG] (p14)</p></div><div class="nugget-popup"><p>Widespread flooding across the borough during 28 Jul 2019 &ndash; 31 Jul 2019, with many isolated incidents and locally concentrated 'hot spots'. Critical catchments implicated include Micker/Lady/Poynton/Norbury Brooks and Poise Brook, where runoff conveyed from large upstream areas caused localised inundation of communities and infrastructure; hot&ndash;spot locations were reviewed in appendices C&ndash;N. [PAG,IMG] (p23)</p></div><div class="nugget-popup"><p>Severe rainfall across the borough between 28 and 31 July 2019 exceeded surface water drainage design standards over a large area, so widespread surface water flooding was expected and flooding on ordinary watercourses was likely; reduced available storage (e.g. attenuation ponds on the A555 still draining) further increased runoff and flood risk. (p28)</p></div><div class="nugget-popup"><p>Multiple ordinary watercourses within the Stockport area were the subject of clear&ndash;up operations and flood warnings/alerts during the July 2019 events; local RMAs investigated reported incidences of flooding across the borough. [TAB] (p37)</p></div><div class="nugget-popup"><p>The borough experienced widespread flooding in July 2019 with a significantly greater incidence compared to earlier events; local flood incident logging systems (LLFA) were overwhelmed, and RMA response was largely reactive. This prompted recognition of the need for improved asset registers and stronger proactive maintenance/checking of critical structures. (p43)</p></div><div class="nugget-popup"><p>Multiple locations within Stockport experienced flooding issues during the July 2019 event; records of affected areas have been maintained by the investigators. (p52)</p></div><div class="nugget-popup"><p>Widespread flooding across the borough with numerous reports and local 'risk to life' incidents (deep/fast flowing waters and inundation threats). Specific locations reported included Bramhall Green, Queens Road, The Demmings, Twinning Brook Road (fast/deep flows) and basement flooding at Guywood Lane, Romiley; additional inundation threat reports (9) related to the Toddbrook Reservoir incident affecting the Strines/Whaley Bridge area. [PAG] (p53)</p></div><div class="nugget-popup"><p>Widespread flooding across the borough during late July 2019 with multiple sources: surface water/overland flows, highway flooding, watercourse blockages and capacities of watercourses/sewers/drains being exceeded. 776 flood reports were received by RMAs (majority on 31 July 2019). Peak flows were recorded on the River Goyt and Poynton Brook on 31 July; 'risk to life' conditions were reported at Bramhall Green, Queens Road, The Demmings and Twinning Brook Road due to deep, fast&ndash;flowing Lady/Micker Brook waters and at Guywood Lane, Romiley due to a flooded basement flat. Sandringham Road and The Demmings Industrial Estate experienced flooding beyond the mapped 1,000&ndash;year extent. Poise Brook at Offerton Green outflanked a third&ndash;party defence along Bean Leach Road and spilled towards a housing estate. [PAG] (p54)</p></div><div class="nugget-popup"><p>Widespread and diverse flooding across the borough during the July 2019 event triggered borough&ndash;wide recommendations and local actions; multiple local areas and watercourses experienced flooding and drainage failures requiring targeted investigations and interventions. [TAB,PAG] (p55)</p></div><div class="nugget-popup"><p>Flooding incidents affected the A555 within the borough; the road and its drainage had suffered repeated flooding up to July 2019 and the road drainage has the potential to alter runoff to adjacent watercourses in the borough. [PAG] (p59)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>477 property flood reports reported to Stockport Metropolitan Borough Council (LLFA) [TAB] (p13)</p></div><div class="nugget-popup quant"><p>776 flood reports [PAG] (p14)</p></div><div class="nugget-popup quant"><p>776 flood reports; 9 'risk to life' reports relating to the reservoir incident [PAG] (p53)</p></div><div class="nugget-popup quant"><p>776 flood reports [PAG] (p54)</p></div></div></body></div>`)[0];

                var html_262f79a3e58b370d1ea28b1fc47f7cc0 = $(`<div id="html_262f79a3e58b370d1ea28b1fc47f7cc0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wigwam Wood</h1><div class="nugget-popup"><p>Poynton Brook flooding threatened/impacted Wigwam Wood; the EA issued Flood Warnings for Poynton Brook at Wigwam Wood (28/07/2019 and 31/07/2019) and carried out post&ndash;event clear&ndash;up of debris from the watercourse. [TAB] (p37)</p></div></div></body></div>`)[0];

                var html_05591ae98295f36eb8372b5d78e849a1 = $(`<div id="html_05591ae98295f36eb8372b5d78e849a1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Goyt</h1><div class="nugget-popup"><p>River stage rose sharply in response to rainfall on 28 July 2019 and again on 31 July 2019, with the peak on 31 July significantly greater than the peak on 28 July. River stage increases closely followed spikes of rainfall and then declined more slowly, indicating rapid rainfall&ndash;to&ndash;runoff response in the catchment. [IMG] (p30)</p></div><div class="nugget-popup"><p>Peak watercourse flows were recorded on 31 July 2019; at Marple Bridge the gauge reached 2.01 m (the second highest recorded since 1969), indicating a significant river flood event on the River Goyt. (p31)</p></div><div class="nugget-popup"><p>Peak flows recorded on 31 July 2019; the Environment Agency provisionally estimated the flood flow return period at Marple Bridge as circa 20 years and noted this was the second&ndash;highest recorded event (since March 1969). (p53)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>circa 20 year return period; 2nd highest event on record since March 1969 (p53)</p></div></div></body></div>`)[0];

                var html_68d9253abdcfbc3118430825c8dcbc70 = $(`<div id="html_68d9253abdcfbc3118430825c8dcbc70" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Mersey</h1><div class="nugget-popup"><p>Flood warning thresholds for the Middle Mersey catchment are based on measured trigger levels on the River Mersey. Reliance on those Mersey trigger levels meant localised, fast flooding on smaller tributaries (such as Micker/Lady Brook) was not identified by the warning system during the July 2019 events. [MUL] (p82)</p></div></div></body></div>`)[0];

                var html_b0bfacc66134b83851a5ba4fbcd58a5c = $(`<div id="html_b0bfacc66134b83851a5ba4fbcd58a5c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>A555 Manchester Airport Relief Road</h1><div class="nugget-popup"><p>Post&ndash;flood investigations identified development control issues and actions on the A555 related to the flood event, indicating the road corridor was affected by flooding. (p7)</p></div><div class="nugget-popup"><p>Attenuation ponds serving the A555 were still draining from earlier rainfall, reducing available storage for the 31 July rainfall and so reducing the road corridor's capacity to store/runoff. This reduced storage, combined with the intense rainfall, meant surface water drainage standards were likely exceeded and increased the risk of surface water flooding affecting the A555 during the event. (p28)</p></div><div class="nugget-popup"><p>Heavy rainfall led to closures of the A555 due to flooding: the road was closed on 28 July 2019 and again on 31 July 2019. On 31 July the A555 was closed due to flooding at three locations (two of those locations within the Stockport borough). During the period drainage of A555 catchment E was maintained by temporary pumping at Hall Moss Lane to manage floodwater. [PAG,MUL] (p31)</p></div><div class="nugget-popup"><p>Flooding of the carriageway causing road closures and transport disruption. The A555 was closed due to flooding on 28 July 2019 and was reported closed due to flooding at three locations on 31 July 2019 (two of those locations within the SMBC area). The route had also experienced earlier flooding incidents, including closure from 20:00 on 16 March 2019 to 20:00 on 18 March 2019. [PAG,MUL] (p32)</p></div><div class="nugget-popup"><p>Carriageway flooded on multiple occasions due to heavy rainfall and pump failures, causing repeated full closures between A523 and A34 (including closures on 16&ndash;18 Mar 2019 and 28&ndash;31 Jul 2019). Sections reopened progressively in early August; one lane remained shut for pump installation and tank desilting until 14 Aug. [PAG,MUL] (p33)</p></div><div class="nugget-popup"><p>A555 carriageway flooded during the event. Carriageway was cleared after pumps at Network C were re&ndash;started on 29 Jul; later the A555 became completely flooded at the Network C pump station when the pond overflowed on 31 Jul. Overflow from attenuation ponds E1/E2 also flowed onto and along the A555 in a westerly direction. [PAG] (p34)</p></div><div class="nugget-popup"><p>The A555 dual carriageway was completely covered by floodwater, rendering the road impassable and preventing vehicle passage; vehicles were stopped at the far side and response/maintenance activity was present. [IMG] (p35)</p></div><div class="nugget-popup"><p>Significant council effort was directed at controlling flooding on the A555 including inspections, implementing road closures and mobilising pump maintenance to manage floodwater. (p36)</p></div><div class="nugget-popup"><p>Repeated surface&ndash;water flooding during the July 2019 event caused pumping station failures; attenuation ponds overflowed due to design/construction defects and the road became completely impassable when the original A555 pump station no.4 at Hall Moss Lane was overloaded. [TAB] (p45)</p></div><div class="nugget-popup"><p>Drainage provision associated with the A555 was found to be deficient (networks designed to limited return periods and Network E only to 30&ndash;year), meaning the drainage did not provide sufficient capacity and contributed to flooding/exceedance flows during the event. [PAG] (p48)</p></div><div class="nugget-popup"><p>The A555 drainage scheme (networks A, B and C and other elements) exhibited post&ndash;flood problems: attenuation and routing arrangements did not adequately manage exceedance flows, there is evidence of potential non&ndash;filling of attenuation Pond B, blockages and construction defects, and unattenuated runoff contributed to local flooding during the 28 Jul 2019 &ndash; 31 Jul 2019 event. [PAG] (p49)</p></div><div class="nugget-popup"><p>The A555 drainage network receives runoff from in excess of 1300 m of carriageway plus substantial green areas (compared with the original design provision for 700 m of carriageway), increasing peak flows and volumes to existing storage and the Hall Moss Lane pumping station. Pond E2 has a storage volume of 981 m3 and a Hydrobrake pass&ndash;forward flow of 14.6 l/s. The combined E1/E2 arrangement has an extended drain&ndash;down time (estimated between 4.5 days with no inflow and up to 2 weeks with steady inflow of 10 l/s), leaving the highway vulnerable to long&ndash;duration and follow&ndash;on rainfall events. The original pump station is likely inadequate to drain the combined new and original road to a reasonable standard, increasing flood risk to the carriageway and requiring potential enlargement of ponds or additional mitigation. [PAG] (p52)</p></div><div class="nugget-popup"><p>Drainage design and as&ndash;built shortcomings meant the A555 was not as robust to intense rainfall as expected; the road drainage was overwhelmed during the July 2019 event(s). Some construction deficiencies have been or are being rectified, though the investigation concluded A555 drainage deficiencies were not a significant contributor to downstream flooding in the borough. (p54)</p></div><div class="nugget-popup"><p>Attenuation storage associated with the A555 did not provide the intended capacity during the July 2019 event; concerns about pond/tank functionality and insufficient attenuation led to highway flooding and risk of flood exceedance. Inundation depths during the event had potential to affect power supplies, pumping equipment and controls serving the drainage installation. [PAG] (p56)</p></div><div class="nugget-popup"><p>The new dual carriageway suffered repeated flooding incidents that affected the road and its drainage since opening (Oct 2018). The road had flooded on multiple occasions up to July 2019 and was implicated in a 2016 S19 Flood Report while under construction. The road and its drainage are capable of altering runoff to adjacent watercourses. [MUL] (p59)</p></div><div class="nugget-popup"><p>Heavy/continuous rainfall caused surface&ndash;water/urban flooding of the A555 carriageways, triggering multiple closures (including full closures between the A523 and A34). Pumping infrastructure failures or insufficiency contributed to flooding; attenuation tanks/ponds overflowed or were damaged. Repeated closures occurred between 28&ndash;31 July 2019 (and an earlier closure 16&ndash;18 March 2019). Recovery works included fitting new pumps and desilting attenuation tanks, with lanes remaining closed into August. [TAB,PAG,MUL] (p62)</p></div><div class="nugget-popup"><p>A555 carriageway flooded at two locations within the SMBC area (Network C adjacent to Woodford Road and Network E adjacent to Hall Moss Lane). Repeated inundation led to closures: closed both ways between A523 and A34 from 13:30 on 28 Jul 2019; temporary reopenings and further closures occurred through 31 Jul. Eastbound carriageway reopened 2 Aug (18:00) and westbound reopened 5 Aug (19:00); one lane remained shut until 14 Aug to fit new pumps and desilt an attenuation tank. [PAG] (p63)</p></div><div class="nugget-popup"><p>A555 carriageway beneath Woodford Bridge was inundated on 28 July 2019, with the road surface covered by water and rendered impassable; vehicles were stopped and maintenance/response personnel attended. [IMG,PAG] (p65)</p></div><div class="nugget-popup"><p>Carriageway inundated during the July 2019 event (flooding observed at Woodford bridge). Sections of the new A555 drainage (Network E) routed excess flows into the original A555 drainage causing flows that could not be pumped to be temporarily stored on or below the carriageway. Design/installation defects in downstream attenuation ponds and outlets reduced available storage and likely reduced discharge control capacity, increasing peak flows to the existing A555 pump/storage system. [PAG] (p66)</p></div><div class="nugget-popup"><p>Flows that cannot be pumped were temporarily stored on or below the A555 carriageway, increasing flood depths and reliance on carriageway storage and existing below&ndash;ground storage and pumping capacity; this exposes the highway to inundation and increases peak flows into the original A555 drainage/pumping system. (p67)</p></div><div class="nugget-popup"><p>Unplanned drainage runoff from the A555 contributed to increased flood flow to Bramhall Green during the event; some A555 drainage features did not work entirely as designed or intended. (p75)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>closed at 3 locations; 2 locations within SMBC area [PAG,MUL] (p31)</p></div><div class="nugget-popup quant"><p>3 locations; 2 locations within SMBC area; two of four pumps working [PAG,MUL] (p32)</p></div><div class="nugget-popup quant"><p>2 locations; 1 lane [PAG,MUL] (p33)</p></div><div class="nugget-popup quant"><p>Two of four pumps working; one lane shut until 14th August [TAB,PAG,MUL] (p62)</p></div><div class="nugget-popup quant"><p>2 locations; one lane shut until 14 August [PAG] (p63)</p></div><div class="nugget-popup quant"><p>1,300 m of carriageway connected into the original A555 drainage network [PAG] (p66)</p></div></div></body></div>`)[0];
                popup_07fa091096d91be4a9d3b2eb9eec948d.setContent(html_b0bfacc66134b83851a5ba4fbcd58a5c);

                var html_daf053059113fb8559d454e0c29fca59 = $(`<div id="html_daf053059113fb8559d454e0c29fca59" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wilmslow Road Bridge</h1><div class="nugget-popup"><p>The A555 Manchester section under Wilmslow Rd Bridge (within Cheshire East Council boundary) was closed because of flooding during the late&ndash;July 2019 event. (p33)</p></div><div class="nugget-popup"><p>A555 Manchester section closed under Wilmslow Rd Bridge due to flooding in that location (closure noted as not SMBC responsibility). (p63)</p></div><div class="nugget-popup"><p>Hydraulic capacity of the Wilmslow Road bridge over Micker Brook was exceeded by the flow on 31 July 2019, associated with overland flow across Wilmslow Road and upstream/backwater effects. (p92)</p></div><div class="nugget-popup"><p>Debris accumulations observed upstream and debris and siltation observed downstream of the bridge, contributing to blockages and localised flow restrictions during the Micker Brook flood in late July 2019. (p94)</p></div></div></body></div>`)[0];

                var html_62dfc6c74925b4710d78eb1f6d8ecea9 = $(`<div id="html_62dfc6c74925b4710d78eb1f6d8ecea9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bramhall Green Roundabout</h1><div class="nugget-popup"><p>Floodwater initially ponded on the roundabout as highway drains were overwhelmed; depths then rose and floodwater overflowed from the roundabout, producing overland flow across Bramhall Lane South and towards Bramall Hall Park. The ponding and subsequent overflow are attributed largely to Lady Brook overflowing its banks combined with surface water runoff. (p72)</p></div><div class="nugget-popup"><p>Flooding affected the roundabout area and adjacent properties/roads. EA fluvial mapping shows properties between Womanscroft Bridge and the roundabout lie within the 'Medium' (1%&ndash;3.3% AEP) risk zone; EA pluvial mapping indicates a very similar flood risk for properties in this area. The mapped flood extent related to the event on 31 July 2019 extended upstream to Bramhall Lane South, indicating greater&ndash;than&ndash;forecast depths upstream of the roundabout. [IMG] (p73)</p></div><div class="nugget-popup"><p>Mentioned as having linked flooding issues within the same river model; the report flags the need for similar review/actions for flooding at Bramhall Green Roundabout (part of the same event/model area). (p88)</p></div></div></body></div>`)[0];

                var html_3fd3bba3f59e7dbaf9bd213588f98200 = $(`<div id="html_3fd3bba3f59e7dbaf9bd213588f98200" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Queens Road, Cheadle Hulme</h1><div class="nugget-popup"><p>Fluvial flooding associated with Micker Brook affected Queens Road/The Demmings in July 2019 with flood extents reported as exceeding the EA mapped extents; modelling and mapping review recommended. (p44)</p></div><div class="nugget-popup"><p>July 2019 flood outline exceeded the current 1 in 1000 flood extents at this reach of Micker Brook. Flood mapping did not show the exceedance flow path around buildings (notably affecting Brook House). Debris was reported in the riverbed upstream and downstream of The Demmings culvert. [TAB] (p45)</p></div><div class="nugget-popup"><p>July 2019 (28 Jul&ndash;31 Jul 2019): Micker Brook flooding exceeded the modelled 1&ndash;in&ndash;1000 extents and caused flooding at Queens Road. Flood mapping did not show the exceedance flow path around buildings (notably Brook House). Debris was observed in the riverbed upstream and downstream of The Demmings culvert; blockages may have contributed to the extent. (p46)</p></div><div class="nugget-popup"><p>Deep, fast&ndash;flowing floodwaters from Lady/Micker Brook produced 'Risk to Life' conditions at Queens Road. (p53)</p></div><div class="nugget-popup"><p>Fluvial flooding from Lady Brook / Micker Brook affected Queens Road during the July 2019 event, prompting mapping validation, channel surveys and consideration of flood risk management works. [TAB] (p55)</p></div><div class="nugget-popup"><p>Subject to fluvial flood inundation during July 2019; identified for validation of flood extents in updated mapping. [PAG] (p56)</p></div><div class="nugget-popup"><p>Subject to flooding during the July 2019 event as part of the same river model reach; identified for hydraulic/model review in relation to observed flood impacts. (p75)</p></div><div class="nugget-popup"><p>Queens Road experienced localised flooding on the evening of 31 July 2019 associated with Micker Brook passing under the road and subsequent surcharging/ponding, contributing to internal flooding of adjacent properties. (p84)</p></div><div class="nugget-popup"><p>Out&ndash;of&ndash;channel flow from the left bank of Micker Brook overtopped upstream of Queens Road, flooding the road and adjacent properties; ponding occurred. (p85)</p></div><div class="nugget-popup"><p>Properties on Queens Road were reported flooded during the event of 31 July 2019. The road itself is not shown to flood on the EA fluvial map; it is unclear whether flooding at Queens Road resulted from restricted discharge at the Old Wool Lane bridge/culvert or from flood flows and hydraulic constrictions at the watercourse and Queens Road bridge. [IMG] (p86)</p></div><div class="nugget-popup"><p>Overland flow path routed water from the industrial area north of Queens Road into the residential area south of the road; out&ndash;of&ndash;bank flow occurred upstream of Queens Road, inundating areas around buildings that the EA model did not indicate. [IMG,PAG] (p88)</p></div><div class="nugget-popup"><p>Out&ndash;of&ndash;bank flow on the left bank upstream of Queens Road caused by back&ndash;up associated with debris/fallen tree in the channel; report identifies fluvial (river) flooding from Micker Brook as the primary driver for flooding at Queens Road in July 2019. (p89)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>10 residential properties; 9 commercial properties; internal flooding up to 1.3m deep (p84)</p></div></div></body></div>`)[0];

                var html_8064cb60c49ec99b4eedb50fe05c7f73 = $(`<div id="html_8064cb60c49ec99b4eedb50fe05c7f73" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wilmslow Road, Cheadle</h1><div class="nugget-popup"><p>July 2019 flood outline on Micker Brook exceeded the current 1&ndash;in&ndash;1000 flood extent in this area; properties on Broadway Avenue (off Wilmslow Road) were reported flooded. The event may have been exacerbated by upstream blockage release at Brook House/The Demmings. [TAB] (p45)</p></div><div class="nugget-popup"><p>Fluvial flooding from the Lady Brook / Micker Brook catchment impacted Wilmslow Road during the July 2019 event, contributing to mapped 2019 flood extents and the need for surveys and potential flood risk management measures. [TAB] (p55)</p></div><div class="nugget-popup"><p>Experienced fluvial flood inundation during the July 2019 event (noted as Wilmslow Road / Broadway Avenue) and was identified for validation of mapped flood extents. (p56)</p></div><div class="nugget-popup"><p>Identified as experiencing flooding during the July 2019 event as part of the same river model reach and flagged for hydraulic/model review. (p75)</p></div><div class="nugget-popup"><p>Identified in the report as part of the same river model that produced overbank flows during the 31 July 2019 event; highlighted for review because the hydraulic model and debris impacts likely contributed to flooding in this area. (p88)</p></div><div class="nugget-popup"><p>Wilmslow Road was inundated by overland flow from Micker Brook on 31 Jul 2019: gullies produced initial flooding (~17:00) and by 20:00 flow was reported passing across the road toward Broadway before returning to the watercourse. [IMG,PAG] (p91)</p></div><div class="nugget-popup"><p>Overland flow from Micker Brook crossed Wilmslow Road (reports at about 20:00 on 31 July 2019), with flow passing onto Broadway and returning to the watercourse. Hydraulic capacity of Wilmslow Road bridge was exceeded during the event. (p92)</p></div><div class="nugget-popup"><p>Properties on Wilmslow Road just south of Micker Brook were affected by flooding. The Wilmslow Road bridge experienced possible debris accumulations upstream and debris and siltation downstream, which likely influenced local flow and blockage. [IMG,PAG] (p93)</p></div><div class="nugget-popup"><p>The Wilmslow Road area experienced fluvial flooding driven by Micker Brook, with surface&ndash;water (pluvial) flow paths modelled along the road network. Debris accumulations were noted upstream of the Wilmslow Road bridge and possible debris/siltation downstream. Secondary flooding originated from local culverted tributaries whose runoff progressed overland along roads. [IMG,PAG] (p94)</p></div><div class="nugget-popup"><p>Fluvial flooding from Micker Brook was identified as the primary driver of flooding in the Wilmslow Road area in July 2019. Two local, partly&ndash;culverted tributaries also produced secondary flooding that contributed to impacts in the area. (p95)</p></div></div></body></div>`)[0];

ng the channel onto adjacent land upstream of Queens Road. (p89)</p></div></div></body></div>`)[0];

                var html_c3662f16a2d176c2cc50fd355ead5b57 = $(`<div id="html_c3662f16a2d176c2cc50fd355ead5b57" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hall Moss Lane, Woodford</h1><div class="nugget-popup"><p>Original A555 pump station adjacent to Hall Moss Lane was exposed as deteriorating; during the March event only two of four pumps were working and in July drainage relied on a temporary pump in the wet well. Flooding at Hall Moss Lane led to A555 closure and prevented contractor access to the pump station during the July event. [PAG,MUL] (p33)</p></div><div class="nugget-popup"><p>Deep flooding at Hall Moss Lane prevented access. Runoff collected at Hall Moss Lane overwhelmed Network E attenuation and pumping capacity (the single temporary pump in operation could not cope), causing attenuation ponds E1 and E2 to overflow onto the A555 carriageway and flow westwards toward the original pump station. Overflow contributed to carriageway flooding and inundation of the pump station; supplementary temporary pumps were required to drain the carriageway and attenuation storage. [PAG] (p34)</p></div><div class="nugget-popup"><p>The original A555 pump station no.4 at Hall Moss Lane overloaded/failed during the storm, contributing to surface&ndash;water flooding and making the A555 completely impassable. [TAB] (p45)</p></div><div class="nugget-popup"><p>The original A555 Hall Moss Lane pumping station received discharge from Network E, which had been designed to a lower standard (30&ndash;year); no assessment of the combined original and new drainage was made. This contributed to inadequate conveyance and surcharging during the 28 Jul 2019 &ndash; 31 Jul 2019 floods. (p49)</p></div><div class="nugget-popup"><p>Flooding occurred at the A555/Hall Moss Lane location; the original A555 pump station at Hall Moss Lane was exposed as deteriorating during heavy rain (pumps failing), requiring temporary pumping from the wet well to Spath Brook and later replacement of pumps and controls. Flooding at this location contributed to road closures and repeated inundation of the carriageway. [PAG,MUL] (p62)</p></div><div class="nugget-popup"><p>A555 flooded at Hall Moss Lane adjacent to the original A555 pump station (Network E); the pump station could not be accessed by contractor APS on 28 Jul due to depth of flooding. Road closure and police attendance were reported (police call at 11:45, road closed 13:30 on 28 Jul). [PAG] (p63)</p></div><div class="nugget-popup"><p>Runoff collected at Hall Moss Lane overwhelmed the Network E attenuation and pumping provision on 28 and 31 July 2019. A single temporary pump in place was unable to cope; supplementary temporary pumps were later used to drain the flooded carriageway and attenuation storage. Attenuation ponds E1 and E2 overflowed onto the A555 carriageway and flowed west toward the original pump station; this unattenuated overflow contributed to flooding of the A555 carriageway and flooding at the original pump station. (p64)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Two of four pumps working [PAG,MUL] (p62)</p></div></div></body></div>`)[0];

                var html_bb822faf5feb402af7788a668567cb55 = $(`<div id="html_bb822faf5feb402af7788a668567cb55" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Sandringham Road, Adswood</h1><div class="nugget-popup"><p>Fluvial flooding from Micker Brook at Sandringham Road produced observed flood extents during the July 2019 event that were greater than the Environment Agency's mapped extents; report recommends review of modelling and mapping for this location. (p44)</p></div><div class="nugget-popup"><p>July 2019 flood outline exceeded the current 1 in 1000 flood extent, causing flooding of new residential properties on Sandringham Road. [TAB] (p45)</p></div><div class="nugget-popup"><p>July 2019 flood outline exceeded the current 1 in 1,000 modelled flood extent at Sandringham Road (Micker Brook main river reach), causing flooding of new residential properties. (p46)</p></div><div class="nugget-popup"><p>Flooding occurred at Sandringham Road with the flooded extent exceeding the Environment Agency's mapped 1,000&ndash;year flood extent; the report highlights this as an out&ndash;of&ndash;modelled&ndash;extent event and recommends investigation into modelling deficiencies or significant blockages. (p54)</p></div><div class="nugget-popup"><p>Fluvial flooding associated with Lady Brook / Micker Brook inundated Sandringham Road during the July 2019 event, contributing to the need to validate 2019 flood extents and consider channel and infrastructure interventions. [TAB] (p55)</p></div><div class="nugget-popup"><p>Flooding during the July 2019 event with flood extents identified along the road that require validation in updated fluvial flood mapping. [PAG] (p56)</p></div><div class="nugget-popup"><p>Experienced flooding during the same July 2019 event as part of the Lady Brook / Micker Brook modelled reach; identified for review alongside other nearby road flooding locations. (p75)</p></div><div class="nugget-popup"><p>Six recently constructed houses on the north side were flooded from the rear as the flood extent of Lady Brook expanded. Contaminated floodwater entered properties to a depth of about 0.3 m (1 ft). Foul sewage was forced from sinks as UU foul/combined sewers became surcharged by surrounding fluvial floodwater. [PAG] (p80)</p></div><div class="nugget-popup"><p>Residential properties on Sandringham Road were flooded during the July 2019 event. The observed flood extents match the EA pluvial (surface water) flood mapping but conflict with the EA fluvial (river) mapping, suggesting either modelling error or elevated levels caused by partial blockage/structures (weirs) behind properties. This indicates a need to review flood modelling and consider mitigation for the road/properties. [IMG] (p81)</p></div><div class="nugget-popup"><p>Sandringham Road experienced fluvial (river) flooding in late July 2019 caused by flows on Lady/Micker Brook; the road corridor corresponded with the high&ndash;risk flood corridor on the EA surface&ndash;water map for the area. [IMG,PAG] (p82)</p></div><div class="nugget-popup"><p>Fluvial (river) flooding from Lady/Micker Brook was identified as the primary driver of flooding at Sandringham Road in July 2019. (p83)</p></div><div class="nugget-popup"><p>Linked in the report to flooding from the same brook/river model that produced out&ndash;of&ndash;bank flow during the 31 July 2019 event. The model under&ndash;predicted overland flow in the area and Sandringham Road is flagged for review as part of that hydraulic/model discrepancy. (p88)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>6 houses; 1 ft (0.3 m) floodwater depth inside properties [PAG] (p80)</p></div></div></body></div>`)[0];

                var html_8aa622a194a6fad71a49df2084011d6b = $(`<div id="html_8aa622a194a6fad71a49df2084011d6b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bramhall Green</h1><div class="nugget-popup"><p>Area experienced river flooding associated with Lady Brook; the appendix to the report contains a flooding timeline, mapping and analysis of mechanisms and structures affecting flood levels in Bramhall Green. [TAB] (p7)</p></div><div class="nugget-popup"><p>Shown as a hotspot on the July 2019 incident map with concentrated reported flooding (clustered RMA reports plotted by postcode), indicating local flooding impacts during the event. [PAG,IMG] (p22)</p></div><div class="nugget-popup"><p>Properties were flooded and vulnerable residents required rescue by the Fire and Rescue service. (p36)</p></div><div class="nugget-popup"><p>Fluvial (river) flooding on Lady Brook that affected Bramhall Green, prompting recommendations to consider options to reduce fluvial flood risk. [TAB] (p40)</p></div><div class="nugget-popup"><p>Fluvial flooding/risk from Lady Brook affected Bramhall Green and the report recommends considering options to reduce that fluvial flood risk. (p41)</p></div><div class="nugget-popup"><p>Initial highway runoff and/or restricted discharge due to high flows in Lady Brook led to widespread flooding across the roundabout; Lady Brook exceeded channel capacity causing flooding at Bramhall Bridge (Bramhall Lane South) during the July 2019 event. [TAB,PAG] (p45)</p></div><div class="nugget-popup"><p>Deep, fast&ndash;flowing floodwaters from Lady/Micker Brook produced 'Risk to Life' conditions at Bramhall Green. (p53)</p></div><div class="nugget-popup"><p>Fluvial flooding from the Lady Brook / Micker Brook catchment during the July 2019 event inundated Bramhall Green, affecting streets and nearby properties and prompting actions to update flood mapping, re&ndash;survey channel sections and consider flood risk management measures. [TAB] (p55)</p></div><div class="nugget-popup"><p>Inundation from fluvial flooding in July 2019; listed as a location where 2019 flood extents should be validated. [PAG] (p56)</p></div><div class="nugget-popup"><p>On the afternoon of 31 July 2019 flooding linked to Lady Brook caused internal and external flooding in the area between Lady Brook and Bridge Lane (from the roundabout up to Womanscroft Bridge). Twelve residential and commercial properties suffered internal flooding (maximum internal depth reported 2 feet / 0.6 m) and external flooding up to 5 feet (1.5 m). (p71)</p></div><div class="nugget-popup"><p>Properties between Womanscroft Bridge and the Bramhall Green roundabout were flooded; those properties lie within the EA's 'Medium' fluvial risk zone (approximately 1%&ndash;3.3% annual chance). [IMG] (p73)</p></div><div class="nugget-popup"><p>EA pluvial mapping for the area shows very high/high surface&ndash;water flood severity concentrated at the Bramhall Green roundabout and along the main roads. The report notes localised flooding on Bramhall Lane South within the Bramhall Green area during the event. [IMG] (p74)</p></div><div class="nugget-popup"><p>Subject to fluvial flooding from Lady Brook in July 2019; identified as the primary location affected at Bramhall by the event and the focus for recommended mitigation measures. (p75)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>12 properties; internal depth up to 2 feet (0.6m); external depth up to 5 feet (1.5m) (p71)</p></div></div></body></div>`)[0];

 the rear of properties. [IMG] (p78)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property on Mostyn Road; 600mm (garden inundation depth) [IMG] (p77)</p></div></div></body></div>`)[0];
