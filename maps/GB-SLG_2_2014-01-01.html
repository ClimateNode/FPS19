                var html_f541c275187687630b4bb8066674971d = $(`<div id="html_f541c275187687630b4bb8066674971d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Pippins Park</h1><div class="nugget-popup"><p>County Ditch at Pippins Park had a tree removed from the channel as part of post&ndash;flood river cleaning to restore conveyance and reduce future flood risk. Water levels in the County Ditch were observed to rise and fall rapidly, prompting further investigation actions. [TAB] (p25)</p></div></div></body></div>`)[0];

                var html_e0d9135cdeeab01be3ec0d12650d1e8b = $(`<div id="html_e0d9135cdeeab01be3ec0d12650d1e8b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Colne Brook</h1><div class="nugget-popup"><p>Fluvial flooding from the Colne Brook caused flooding along Mill Street; Colne Brook&ndash;driven high river levels contributed to local flooding during the event. (p4)</p></div><div class="nugget-popup"><p>Fallen trees and other debris in the Colne Brook created a head differential that prevented water passing back from the West Lakes, exacerbating the volume of water routed through the penstock and contributing to downstream flooding. [TAB,PAG] (p5)</p></div><div class="nugget-popup"><p>During the Jan&ndash;Feb 2014 floods Colne Brook exhibited elevated river levels observed on post&ndash;flood site visits. Its high levels influenced flow interactions with the West Lakes and downstream drains and contributed to flood conditions in the Colnbrook investigation area. (p7)</p></div><div class="nugget-popup"><p>Experienced elevated river levels during the January&ndash;February 2014 floods. Site visits after the 2014 floods noted Colne Brook levels were higher than adjacent West Lakes; the brook conveyed higher flows that interacted with embankments, penstocks and the Albany Park barrage (affecting flow routing). [PAG,IMG] (p8)</p></div><div class="nugget-popup"><p>Colne Brook exhibited higher river levels than the adjacent West Lakes and overtopped/communicated with the lakes and floodplain during the January&ndash;February 2014 events, contributing to flooding of nearby areas. [PAG] (p9)</p></div><div class="nugget-popup"><p>Flows from the Colne Brook contributed to flooding risk by feeding County Ditch during flood conditions; operation of penstocks at Colnbrook West Lake was used to prevent flow from the Colne Brook entering County Ditch and exacerbating inundation and groundwater rise. [IMG] (p11)</p></div><div class="nugget-popup"><p>High river levels during the January&ndash;February 2014 rainfall event contributed to widespread property flooding in the catchment and created a risk of backflow into adjacent channels (managed by local assets such as the Albany Park Barrage). (p12)</p></div><div class="nugget-popup"><p>High flows in the Colne Brook spilled into the West Lakes. Trees and debris in the Colne Brook are reported to have obstructed reverse flow, creating a head differential that prevented water returning to the brook and instead forced water over the West Lake embankment into Colnbrook. [PAG,MUL] (p14)</p></div><div class="nugget-popup"><p>Colne Brook is implicated in the local flood processes: water routed into West Lakes did not flow back into the Colne Brook (partly attributed to low West Lake embankment height and fallen trees/debris in the Colne Brook), and river proximity relates to the mapped flood areas through the village. (p15)</p></div><div class="nugget-popup"><p>River levels were reported to be high and contributed flow that flooded Mill Street (flow reported in bank at Mill Street on 1 February 2014). (p18)</p></div><div class="nugget-popup"><p>Post&ndash;event actions included surveying low points between the Colne Brook and adjacent lakes/areas to better understand flood pathways. The river and connected channels were investigated as sources/pathways for floodwater and in relation to gully connectivity and local ditch management. [TAB] (p23)</p></div><div class="nugget-popup"><p>Trees and other debris were removed from the Colne Brook between Orlitts Lake and the A4 Colnbrook by&ndash;pass bridge by the Environment Agency to clear the channel following the flood event, as a priority to restore flow and reduce flood risk. [TAB] (p25)</p></div><div class="nugget-popup"><p>Fluvial flooding from the Colne Brook was identified as the predominant source of flooding along Mill Street; debris and head differentials also prevented flows returning to the Colne Brook, exacerbating flooding. [TAB] (p28)</p></div><div class="nugget-popup"><p>Trees and other debris were removed by the Environment Agency in a key area to reduce the risk of channel overtopping following the flood; connectivity between the Colne Brook and the West Lakes was identified for investigation because raised flows downstream worsened drainage from Colnbrook. [TAB] (p29)</p></div></div></body></div>`)[0];

                var html_974eca00237c3fcad22eeaf41c04693f = $(`<div id="html_974eca00237c3fcad22eeaf41c04693f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Orlitts Lake</h1><div class="nugget-popup"><p>Identified as one of the West Lakes whose connectivity with the Colne Brook should be investigated because that connectivity may have influenced overtopping and local flood impacts during the Jan&ndash;Feb 2014 flooding. (p6)</p></div><div class="nugget-popup"><p>Orlitts Lake is one of the West Lakes (Old Slade Lake, Orlitts Lake, Colnbrook West Lake) that form flood storage used by the Colne Brook floodplain and influenced flow behaviour during the Jan&ndash;Feb 2014 floods. (p7)</p></div><div class="nugget-popup"><p>Part of the Colnbrook West Lakes flood storage system. During the January&ndash;February 2014 flood event the West Lakes were implicated in flood storage behaviour: site visits after the 2014 floods noted Colne Brook river levels were higher than the Lakes and the lakes/embankment were the intended receptor for overtopping flows from the Colne Brook. [PAG,IMG] (p8)</p></div><div class="nugget-popup"><p>Removal of debris in the Colne Brook reach between Orlitts Lake and the A4 was carried out by the Environment Agency; proposals were made to add a fluvial gauge upstream of Orlitts Lake to improve flood warnings and inform penstock operations. [TAB] (p25)</p></div></div></body></div>`)[0];

                var html_081272a521f180e6f95c0f7347c2e62a = $(`<div id="html_081272a521f180e6f95c0f7347c2e62a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Old Slade Lake</h1><div class="nugget-popup"><p>After the 2014 floods, site visits noted that Colne Brook river levels were higher than the lake levels (Old Slade Lake), indicating the lakes were involved in the flood event and observed as part of post&ndash;flood inspections. [IMG] (p8)</p></div></div></body></div>`)[0];

                var html_108a771da97e4c5d645b0e75ba483092 = $(`<div id="html_108a771da97e4c5d645b0e75ba483092" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Slough Unitary Authority</h1><div class="nugget-popup"><p>The flooding in the area prompted borough&ndash;wide emergency actions: suspension of refuse and recycling collections where roads were inaccessible; road closures (including Colnbrook High Street); deployment of sandbags; installation of portable toilets and temporary waste bins; liaison with GPs and adult social care to support vulnerable residents; and opening of an Emergency Operations Centre. [TAB] (p20)</p></div></div></body></div>`)[0];

                var html_4922be0923b014e96e84a33ae0799439 = $(`<div id="html_4922be0923b014e96e84a33ae0799439" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Colnbrook West Lake</h1><div class="nugget-popup"><p>The west (main) penstock on Colnbrook West Lake was open for an unknown period, allowing continuous flow into Colnbrook via Hawthorn Ditch and County Ditch; at the peak the lake overtopped, bypassed the penstocks and flowed into Colnbrook village, worsening local flooding and keeping groundwater levels topped up. (p4)</p></div><div class="nugget-popup"><p>Colnbrook West Lake overtopped its embankment; water bypassed the penstocks and flowed into Colnbrook village. The embankment level was 9 cm below its designed level, increasing overtopping risk. [TAB,PAG] (p5)</p></div><div class="nugget-popup"><p>Embankment level recorded 9 cm below the designed level, increasing the risk of premature overtopping during the Jan&ndash;Feb 2014 flood; recommendation made to raise the embankment (permanently or temporarily, e.g. sandbags or concrete kerbs). [PAG] (p6)</p></div><div class="nugget-popup"><p>During the January&ndash;February 2014 event the Colne Brook overtopped the low embankment and flowed into the West Lakes (including Colnbrook West Lake); the Lakes provided flood storage which reduced flows conveyed downstream. Site visits after the floods noted Colne Brook levels higher than the Lakes. (p7)</p></div><div class="nugget-popup"><p>Colnbrook West Lake (part of the West Lakes) was identified in post&ndash;flood site visits after the Jan&ndash;Feb 2014 event; the report notes the relationship between Colne Brook and the West Lakes during the 2014 floods and their role in flood storage dynamics. [PAG,IMG] (p8)</p></div><div class="nugget-popup"><p>Penstocks at Colnbrook West Lake were central to controlling flows into County Ditch during the flood event; at the time there was uncertainty over which authority should operate the asset. Temporary operating conditions were established after the flood, the main penstock was closed, and two other penstocks (HW1 and HW3) are controlled to prevent backflow to the road. A flap valve is to be fitted upstream of the outfalls to stop backflow. [IMG] (p11)</p></div><div class="nugget-popup"><p>Colnbrook West Lake threatened to backflow towards the adjacent road during the winter floods; penstocks at the lake were a focus for preventing lake water reaching the highway (controls and flap&ndash;valve measures were specified). [IMG] (p12)</p></div><div class="nugget-popup"><p>Penstocks on the West Lake outlets were observed partially closed or fully open and submerged during the event; obstructed seating required tarpaulin and bagging to reduce flow. The main penstock being open allowed continued flow from the lake, and closure by the council on 12 February corresponded with significant drops in local water levels. The report also notes that even with the penstock shut, high flows in Colne Brook risked earlier overtopping of the West Lake embankment and continued flow towards Colnbrook. [PAG] (p13)</p></div><div class="nugget-popup"><p>Main penstock to the lake was open on 11/02/2014 allowing a sustained flow into Colnbrook; penstock seating obstructed and needed tarpaulin/sandbagging to reduce flow. All flood storage in the West Lakes was used up and the West Lake embankment overtopped, forcing flood water over the downstream embankment towards Colnbrook. The embankment crest was 9 cm below design, causing earlier overtopping. Closure of penstocks on 12/02/2014 led to observed falls in water levels. [MUL] (p14)</p></div><div class="nugget-popup"><p>Penstocks at West Lake were confirmed as open during the incident; the council sought to confirm responsibility and ensure they were closed to manage high water levels. [TAB] (p20)</p></div><div class="nugget-popup"><p>Penstocks at West Lake were confirmed open during the event; authorities sought to confirm responsibility and to close them to control flows. (p21)</p></div><div class="nugget-popup"><p>The main penstock was located, shut and sealed with tarpaulin and sandbagging by Slough Borough Council staff who entered deep water during the flood response. [TAB] (p22)</p></div><div class="nugget-popup"><p>West Lake operations were altered during the response: the main West Lake penstock was kept closed under a temporary winter agreement to control levels, there were concerns about backflow from the lake to the road (leading to a proposed flap valve in chamber CP110), and a formal penstock operation manual was proposed to manage future flood risk. [TAB] (p25)</p></div><div class="nugget-popup"><p>High water levels at West Lake prompted operational changes to the main penstock (temporary gate closure over winter under agreement), actions to make the penstock safe to operate when levels are high, and marking of the penstock location with a permanent bollard; these measures were taken to reduce future flood risk. (p26)</p></div><div class="nugget-popup"><p>Backflow from West Lake was identified as a source of potential flooding to the adjacent road; this prompted the proposal to fit a flap valve to the West Lake penstock chamber (CP110) to prevent lake&ndash;to&ndash;road backflow. (p27)</p></div><div class="nugget-popup"><p>The west (main) penstock on Colnbrook West Lake was open for an unknown period, allowing continuous flow into Colnbrook via Hawthorn Ditch and County Ditch; at peak the lake overtopped, bypassed the penstocks and flowed into Colnbrook village, and the open penstock helped keep groundwater levels topped up. [TAB] (p28)</p></div><div class="nugget-popup"><p>The embankment was noted to be below its designed level, increasing the risk of premature overtopping during high flows; recommended solutions include raising the embankment to design height or using temporary sandbags/concrete kerbs when extreme weather is forecast. [TAB] (p29)</p></div></div></body></div>`)[0];
                popup_33032999b0010794ec405f84befc2f73.setContent(html_4922be0923b014e96e84a33ae0799439);

                var html_165602e7f436c999b570024c9ebc0f01 = $(`<div id="html_165602e7f436c999b570024c9ebc0f01" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Colnbrook</h1><div class="nugget-popup"><p>Internal flooding of properties in Coleridge Crescent and adjoining Closes and in Cottesbrook Close was predominantly caused by elevated groundwater; the Albany Park area was predominantly flooded by fluvial flooding from the Cottesbrook Ditch. The village was also flooded when water overtopped Colnbrook West Lake and flowed into Colnbrook via Hawthorn Ditch and County Ditch. (p4)</p></div><div class="nugget-popup"><p>Internal property flooding in the village; Section 19 investigation triggered because multiple properties flooded. [PAG] (p6)</p></div><div class="nugget-popup"><p>Properties in Colnbrook suffered internal flooding during the January&ndash;February 2014 flood event; flooding was associated with high Colne Brook river levels and interaction with local storage at the West Lakes. (p7)</p></div><div class="nugget-popup"><p>Colnbrook village experienced flooding during the Jan&ndash;Feb 2014 event and was the focus of this Section 19 investigation. [IMG] (p8)</p></div><div class="nugget-popup"><p>Colnbrook village experienced flooding during January&ndash;February 2014; residential areas and streets within the village were inundated as part of the event. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>The Colnbrook area experienced fast&ndash;reacting groundwater response connected to river levels; water rose from gullies and through floors during the flooding and surface&ndash;water ponding occurred at local low spots. [IMG,PAG] (p10)</p></div><div class="nugget-popup"><p>Groundwater emerged to surface during the event: residents reported water coming up from roadside gullies and entering buildings (up through floorboards) rather than from river bank overtopping; streets and properties were affected by rising groundwater. [IMG,PAG] (p11)</p></div><div class="nugget-popup"><p>Widespread property flooding experienced in the area during the winter 2013&ndash;14 river flood; river levels responded to heavy rainfall causing property flooding. [IMG] (p12)</p></div><div class="nugget-popup"><p>Flood water passed into Colnbrook via watercourses and overland flow and also through groundwater due to saturated catchments; water levels in Colnbrook Village rose and later fell markedly after penstocks were sealed, confirming local flood impacts during the event. [PAG] (p13)</p></div><div class="nugget-popup"><p>Flood water entered Colnbrook via watercourses, overland flow and groundwater. Water flowed towards Colnbrook after the West Lake embankment overtopped. Open penstock likely sustained higher groundwater levels; residents reported water levels dropped significantly after penstocks were sealed. [PAG,MUL] (p14)</p></div><div class="nugget-popup"><p>Three key flood areas were identified in Colnbrook Village. Flood water passed into the village via watercourses, overland flow and through groundwater; flood area 1 (including Fawsley Close and Albany Park) was first attended by the Environment Agency on 31 January when those streets reported flooding. Flood flows into the village were aggravated by overtopping at West Lakes and flows from the County Ditch when a penstock was open. [IMG] (p15)</p></div><div class="nugget-popup"><p>Mill Street flooded from flow from the Colne Brook (river levels high but generally in bank); a section of road flooded where a defect hole in the raised brickwork channel wall allowed water into the carriageway. The flood envelope along Mill Street broadened during the event but fluvial (internal) property flooding was not reported; after the event one property reported internal flooding caused by groundwater. Flood waters eventually subsided. [PAG] (p19)</p></div><div class="nugget-popup"><p>The focus of the flood event moved onto Colnbrook Village in January. Flood response actions included delivery of sandbags to locations identified in the emergency flood plan; suspension of refuse/recycling collections; closure of Albany Park to vehicles; delivery of emergency advice/letters to residents; placement of temporary waste bins where roads were inaccessible; provision of portable toilets and washing facilities (Coleridge Crescent); assistance to vulnerable residents and help moving belongings to upper floors. [TAB] (p20)</p></div><div class="nugget-popup"><p>Area&ndash;wide flood mitigation and response: protection of critical infrastructure (including electricity) with sandbags; penstocks at West Lake confirmed open and highway penstocks closed/sandbagged where possible; sluice gates at Horton Mill were cleared; vulnerable people assessed and assisted; temporary services and facilities provided. (p21)</p></div><div class="nugget-popup"><p>Deep water in the village; Slough Borough Council staff entered deep water to locate, shut and seal the main penstock at Colnbrook West Lake. Residents had homes flooded and were advised to leave flood&ndash;damaged items in their front gardens for collection. [TAB] (p22)</p></div><div class="nugget-popup"><p>The winter (Jan&ndash;Feb 2014) flooding affected residents in Colnbrook. Post&ndash;event activity included a flood surgery attended by affected residents, setting up community and multi&ndash;agency flood groups, strategic sandbag issuance at limited locations, advertising repair/renew grants to affected properties, and review of policies and local modelling. The response notes flooding was predominantly from groundwater and that vehicle bow waves exacerbated impacts. [TAB,PAG] (p23)</p></div><div class="nugget-popup"><p>Settlement affected by the Jan&ndash;Feb 2014 flood event, prompting multi&ndash;agency response and subsequent measures including river and ditch cleaning, changes to Horton Mill Weir operation, temporary West Lake penstock arrangements, and proposals for infrastructure investigations (culvert/gauging/penstock modifications). [TAB] (p25)</p></div><div class="nugget-popup"><p>During the investigation surrounding the Jan&ndash;Feb 2014 event, Colnbrook experienced issues with groundwater and local drainage: groundwater levels required consideration for drawdown ahead of winter, a groundwater gauge was proposed to be upgraded to daily/sub&ndash;daily logging to better understand movements, and local flow issues were observed where water was backing through the Bath Road culvert&mdash;indicating local surface&ndash;water/fluvial backflow affecting the settlement and drainage system. (p26)</p></div><div class="nugget-popup"><p>Floodwater from overtopping of Colnbrook West Lake and flows through Hawthorn Ditch/County Ditch entered the village; prolonged rainfall and raised groundwater levels also caused internal groundwater flooding and sustained high groundwater in the area, impeding drainage. [TAB] (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>14 properties (official); up to 67 properties (unofficial) (p4)</p></div><div class="nugget-popup quant"><p>14 properties claimed Council Tax relief; 67 properties (unofficial estimate) [PAG] (p6)</p></div><div class="nugget-popup quant"><p>three flood areas; 2 locations (Fawsley Close and Albany Park) [IMG,PAG] (p15)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p19)</p></div><div class="nugget-popup quant"><p>more than 750 sandbags delivered to locations in Colnbrook Village (9 Feb); additional 800 sandbags delivered to key areas (11 Feb) [TAB] (p20)</p></div></div></body></div>`)[0];
