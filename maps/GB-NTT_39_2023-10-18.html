                var html_7da2a9d4e66273da2ed2f046b1049b31 = $(`<div id="html_7da2a9d4e66273da2ed2f046b1049b31" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lowdham</h1><div class="nugget-popup"><p>During Storm Babet internal flooding affected residential properties and businesses; additional properties experienced flooding to gardens and outbuildings; roads and properties flooded more quickly because the ground was already saturated. [PAG] (p2)</p></div><div class="nugget-popup"><p>Widespread flooding occurred across the village caused by the Cocker Beck overtopping combined with intense surface water runoff from saturated fields. Properties, roads and open spaces were flooded; major local roads (Epperstone By&ndash;Pass, Main Street) acted as channels for overland flow. Sewer systems were overwhelmed in places (foul water rising on Ton Lane West/East; sewage coming up through drains in Blenheim). A lagoon filled and later overtopped, contributing to flooding. [IMG] (p3)</p></div><div class="nugget-popup"><p>The village experienced significant flooding from saturated catchment runoff feeding Cocker Beck which overtopped and spilled into the settlement; substantial overland flows routed along roads (including Epperstone By&ndash;Pass and Main Street) overwhelmed surface water drainage and caused sewer surcharge in parts of the village. [IMG,PAG] (p4)</p></div><div class="nugget-popup"><p>Experienced surface water flooding which transitioned to a continued river&ndash;flooding risk; council staff visited impacted communities and vulnerable individuals at their homes, supported evacuations and provided emergency accommodation where needed, cleaned roads and paths, removed bulky waste from flooded homes, offered recovery support and grants, and restocked local aqua sac supplies; a multi&ndash;agency community drop&ndash;in was held locally. [PAG] (p9)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>135 residential properties and businesses [PAG] (p2)</p></div></div></body></div>`)[0];
