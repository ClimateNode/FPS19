                var html_c5783cab90799004cd5b779158b73993 = $(`<div id="html_c5783cab90799004cd5b779158b73993" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lowdham</h1><div class="nugget-popup"><p>During Storm Babet residential properties and businesses experienced internal flooding; additional properties suffered flooding to gardens and outbuildings. Flooding followed a period of saturated ground and intense rainfall. [PAG] (p2)</p></div><div class="nugget-popup"><p>Experienced widespread flooding from a combination of Beck overtopping and surface water (overland) flows; properties, roads (including Epperstone By&ndash;Pass and Main Street), gardens and outbuildings were affected and the local surface water drainage system was overwhelmed. [PAG,IMG] (p3)</p></div><div class="nugget-popup"><p>Lowdham village experienced significant flooding produced by a combination of saturated catchment runoff, overland flows and the Cocker Beck overtopping. Initial flooding in the village (reported around 09:00) affected areas via water flowing through the Magna car park toward cottages on Southwell Road (source uncertain); later, the filled lagoon overtopped (circa 14:00) and contributed further flooding. The combined high river and surface water levels overwhelmed the surface water drainage system and there were subsequent sewage/discharge issues in parts of the village. [IMG,PAG] (p4)</p></div><div class="nugget-popup"><p>The Cocker Beck overtopped contributing fluvial (river) flooding to the village. Surface water was evident on Ton Lane West and Ton Lane East caused by foul water rising from the Severn Trent sewer system; Ton Lane East required a road closure. After the beck began to recede, sewage came up through drains in Blenheim. Drainage was slow down Old Tannery Dyke primarily because a double culvert after Harrison's garage is too high and too small. An Environment Agency&ndash;led reservoir scheme upstream is planned to store Cocker Beck flows to reduce future fluvial flooding. [PAG,IMG] (p5)</p></div><div class="nugget-popup"><p>Community experienced flooding leading to council visits to impacted homes and vulnerable individuals; some residents were evacuated and provided emergency accommodation; communications and multi&ndash;agency drop&ndash;in events were held to inform residents; council undertook cleanup of roads and paths and removal of bulky waste from flooded homes; recovery actions including grant funding delivery to eligible residents were commenced. [PAG,MUL] (p9)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>135 residential properties and businesses [PAG] (p2)</p></div><div class="nugget-popup quant"><p>135 residential properties and businesses internally flooded; additional unspecified number of gardens and outbuildings flooded [PAG,IMG] (p3)</p></div></div></body></div>`)[0];
