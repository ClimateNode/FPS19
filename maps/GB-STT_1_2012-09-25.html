<p>Lustrum Beck overtopped its banks (fluvial flooding) and caused surrounding inundation: it completely surrounded the two lowest buildings adjacent to the beck, flooded the gardens of properties on Dundas Street and flooded the allotments. [PAG] (p34)</p></div><div class="nugget-popup"><p>Overtopping of Lustrum Beck caused fluvial flooding to the rear of Portrack Retail Park, leading to inundation of retail units and car parking. (p35)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 buildings [PAG] (p34)</p></div><div class="nugget-popup quant"><p>3 retail units (p35)</p></div></div></body></div>`)[0];
