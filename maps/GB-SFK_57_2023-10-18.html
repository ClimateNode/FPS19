                var html_926b83199be6b1336afd6ef75b5272dc = $(`<div id="html_926b83199be6b1336afd6ef75b5272dc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Meadow Works Business Park</h1><div class="nugget-popup"><p>Overtopping of the local watercourse (Derry Brook) and runoff from surrounding fields and allotments caused floodwater to run down the highway and into the Meadow Works Business Park area. The highway acted as a secondary flow path and floodwater entered properties from the road. Floodwater was reported contaminated with sewage and oil, indicating an overwhelmed foul sewer system. Internal flooding depths reached up to 35 cm in affected properties; external depths were sufficient to fully submerge cars. [MUL] (p21)</p></div><div class="nugget-popup"><p>Meadow Works business park was flooded by flows from the overtopped River Deben and contributing runoff along Aspall Road, Chancery Lane, Water Lane and Priory Lane; floodwater was contaminated with sewage and oil. (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 5 properties; internal depths reaching 35 cm; external depths sufficient to fully submerge cars [MUL] (p21)</p></div><div class="nugget-popup quant"><p>24 properties (in the central Debenham area); internal flooding depths 20 cm to over 90 cm; external flood water over 150 cm (p22)</p></div></div></body></div>`)[0];

                var html_3acd95b872b975c09b428c1e0bdca22f = $(`<div id="html_3acd95b872b975c09b428c1e0bdca22f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Deben</h1><div class="nugget-popup"><p>The River Deben was in flood during Storm Babet; convergence of overland flow routes with the river exacerbated flooding and resulted in internal flooding of properties and impacts to infrastructure and services in Debenham. (p4)</p></div><div class="nugget-popup"><p>The main channel running through Debenham; fluvial flow in the River Deben, combined with surface runoff from tributaries and intense rainfall, contributed to the rapid rise in flood waters within the village and the internal flooding of properties. [PAG,IMG] (p9)</p></div><div class="nugget-popup"><p>The River Deben overtopped, sending flow south down Chancery Lane and Aspall Road. A damaged bank and reduced watercourse capacity allowed water to flow directly onto the road and into properties, carrying sewage and oil. Flooding resulted in damaged properties and vehicles and required evacuations. Vegetation build&ndash;up (annual cut not yet carried out) and a slipped home oil tank into the watercourse contributed to blockage and pollution. [PAG] (p18)</p></div><div class="nugget-popup"><p>The River Deben overtopped its banks and was identified as the primary source of flow through the area. Overtopping produced flows that travelled south along Aspall Road and Chancery Lane, then along Water Lane and down Priory Lane, contributing the bulk of the flooding observed in central Debenham. (p22)</p></div><div class="nugget-popup"><p>River Deben reached capacity and was overwhelmed; flows contributed to water being forced north along an ordinary watercourse (against natural flow), which then spilled out into rear gardens and, combined with highway&ndash;sourced flows, caused internal flooding of properties in lower Debenham. (p24)</p></div><div class="nugget-popup"><p>The River Deben exceeded bank capacity and overtopped onto the floodplain, flooding properties (notably at Fen Street) from the rear and influencing local flow paths around the weir and surrounding land. [PAG,IMG] (p28)</p></div><div class="nugget-popup"><p>The River Deben experienced high flows during the wet period including the event, prompting EA analysis and changes to flood alert/warning trigger levels to reflect impacts experienced in the community. [TAB,PAG] (p37)</p></div><div class="nugget-popup"><p>River Deben experienced high flows that contributed to flooding impacts in the Debenham area; actions referenced include review of river&ndash;level monitoring, clearing of pinch points, and channel maintenance/blockage removal to reduce flood risk. (p38)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>25 properties; internal water depths 5cm to 45cm [PAG] (p18)</p></div><div class="nugget-popup quant"><p>24 properties affected in the area (internal depths 20 cm to over 90 cm; external floodwater over 150 cm) &mdash; these reports cover central Debenham impacted by the River Deben overtopping (p22)</p></div><div class="nugget-popup quant"><p>24 properties; internal flooding depths reported 15 cm to over 60 cm (p24)</p></div></div></body></div>`)[0];

                var html_4e745b096a0f62329473221ad869173a = $(`<div id="html_4e745b096a0f62329473221ad869173a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Water Lane, Debenham</h1><div class="nugget-popup"><p>Flooding began at the northern part of Water Lane (around 10:00) with runoff from surrounding fields and overtopping of the river contributing to flows. Floodwater was reported contaminated with sewage and oil, indicating an overwhelmed foul sewerage system. The flow then ran down into adjoining streets. (p21)</p></div><div class="nugget-popup"><p>Flooding began around 10:00 at the northern part of Water Lane as a result of runoff from surrounding fields and overtopping of the watercourse. Floodwater was reported contaminated with sewage and oil (indicating an overwhelmed foul sewer). A culvert under Water Lane was noted as possibly silted/overgrown and not operating at full capacity, which may have exacerbated flooding. Emergency access was impeded and vulnerable residents were rescued by boat. [PAG] (p22)</p></div><div class="nugget-popup"><p>Flows from Water Lane (and connected flow paths Priory Lane/Green Cross) overwhelmed highway drainage and combined with other flow paths to travel into lower Debenham, contributing to breaches of properties and internal flooding. [PAG] (p23)</p></div><div class="nugget-popup"><p>Flows from the Water Lane flow path merged in lower Debenham with other flow paths, contributing to overland inundation of the low&ndash;lying central area and to properties being flooded from the front (highway side) when highway drainage was overwhelmed. (p24)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>part of the at least 5 properties across four roads (shared impact) (p21)</p></div><div class="nugget-popup quant"><p>24 properties affected in the area (internal depths 20 cm to over 90 cm; external floodwater over 150 cm) &mdash; these reports cover central Debenham including Water Lane [PAG] (p22)</p></div><div class="nugget-popup quant"><p>24 properties (p24)</p></div></div></body></div>`)[0];

                var html_5d7a3e585031e2e3c538fda5eeb99410 = $(`<div id="html_5d7a3e585031e2e3c538fda5eeb99410" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Priory Lane, Debenham</h1><div class="nugget-popup"><p>Floodwater from the overtopped watercourse ran down Priory Lane; residents reported additional runoff from allotments contributing to the flow, aligning with predicted pluvial (surface&ndash;water) flooding and contributing to property flooding. [PAG] (p21)</p></div><div class="nugget-popup"><p>Water from the overtopped watercourse ran down Priory Lane; residents reported additional runoff from allotments contributing to flows consistent with predicted pluvial flow paths. The northern arm of the Priory Lane watercourse was noted as overgrown/silted and its riparian ownership is under discussion; reduced capacity may have increased local severity. Flows from Priory Lane contributed to inundation of downstream locations (Cross Green and Meadow Works business park). Vulnerable residents required rescue and emergency access was compromised. (p22)</p></div><div class="nugget-popup"><p>Runoff from the Priory Lane allotments and surrounding land produced a significant volume of surface water which overwhelmed the highway drainage. Local culverts and watercourses were reported as not operating at full capacity, contributing to surface water flowing through the lane and adjoining areas. [PAG] (p23)</p></div><div class="nugget-popup"><p>The Priory Lane flow path contributed to merged overland flows in lower Debenham that inundated the low point of the village once watercourses and highway drainage were overwhelmed. (p24)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>part of the at least 5 properties across four roads (shared impact) [PAG] (p21)</p></div><div class="nugget-popup quant"><p>24 properties affected in the area (internal depths 20 cm to over 90 cm; external floodwater over 150 cm) &mdash; these reports cover central Debenham including Priory Lane (p22)</p></div><div class="nugget-popup quant"><p>24 properties (p24)</p></div></div></body></div>`)[0];

                var html_c9184f4cd8a78b10d2e9b94e1742c02b = $(`<div id="html_c9184f4cd8a78b10d2e9b94e1742c02b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>High Street, Debenham</h1><div class="nugget-popup"><p>Properties on High Street experienced internal flooding after overwhelmed watercourses, an overloaded highway drainage system and a foul sewerage network allowed water to flow along the highway and into properties. Bow waves from vehicles driving through floodwater exacerbated internal flooding by breaching doorsteps. Water from an adjacent low&ndash;lying flood plain and converging flow from Cherry Tree Brook increased impacts. (p23)</p></div><div class="nugget-popup"><p>An ordinary watercourse along the easterly edge of back gardens was forced north (against natural flow) after Cherry Tree Brook and the River Deben were overwhelmed; the watercourse quickly overtopped and spilled into rear gardens, causing properties on the High Street to be flooded from both the rear and the front (from highway flows). The land immediately east of the High Street was noted as one of the worst affected spots. (p24)</p></div><div class="nugget-popup"><p>Flows from Low Road accumulated at High Street as water passed through the catchment, contributing to highway flooding and accumulation before flowing south out of the catchment; highways drainage reached capacity. (p26)</p></div><div class="nugget-popup"><p>The roadway was inundated with floodwater, rendering it impassable and resulting in vehicles being partially submerged (water reaching around wheel hubs). [PAG] (p35)</p></div><div class="nugget-popup"><p>Residential front gardens, property boundaries and access on High Street were inundated by floodwater that reached at least knee&ndash;depth. Residents were observed wading through water, carrying children and belongings; wooden fences and property landscaping were submerged, restricting access and forcing temporary movement to safety. [PAG] (p36)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>24 properties; internal flooding depths reported from 15 cm to over 60 cm (p24)</p></div><div class="nugget-popup quant"><p>3 people observed wading through floodwater [PAG] (p36)</p></div></div></body></div>`)[0];

                var html_590b944280545bfaa24e1bba29f713f0 = $(`<div id="html_590b944280545bfaa24e1bba29f713f0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Low Road, Debenham</h1><div class="nugget-popup"><p>Water flowing along Cherry Tree Brook and overwhelmed watercourses flowed into back gardens on Low Road and into properties, contributing to internal flooding. (p23)</p></div><div class="nugget-popup"><p>Flood flow followed the Cherry Tree Brook line and spilled onto Low Road; the highway acted as a secondary flow path, with drainage reaching capacity and flood water surrounding properties and entering buildings (including commercial premises, offices, farm buildings and workshops). (p26)</p></div><div class="nugget-popup"><p>Low Road is included in proposed future planned highway/drainage works intended to address drainage problems identified during the October 2023 flooding investigation. [TAB,PAG] (p40)</p></div><div class="nugget-popup"><p>Planned drainage improvement works are proposed for Low Road to address flood risk identified during the response to the flood event. (p41)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>23 properties; internal flooding levels between 15cm and 90cm; external depths over 90cm; approximately 45cm deep affecting offices, farm buildings and workshops (p26)</p></div></div></body></div>`)[0];

                var html_ec819f8326ef09d6f50d76edbb0ef55e = $(`<div id="html_ec819f8326ef09d6f50d76edbb0ef55e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Aspall Lane, Aspall</h1><div class="nugget-popup"><p>A road at/near Aspall Lane was heavily flooded with muddy water making it impassable to vehicles; vehicles were partially submerged up to the windows. [PAG] (p29)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 cars [PAG] (p29)</p></div></div></body></div>`)[0];

                var html_ef281408f314a02942b5b4e0eb24b692 = $(`<div id="html_ef281408f314a02942b5b4e0eb24b692" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Suffolk</h1><div class="nugget-popup"><p>Storm Babet (18&ndash;21 October 2023) caused significant disruption to communities across Suffolk; infrastructure and services were disrupted as a result of widespread fluvial and pluvial flooding. [PAG] (p4)</p></div><div class="nugget-popup"><p>During Storm Babet Suffolk experienced the heaviest rainfall across East Anglia, causing significant flooding of roads and properties; river systems rose rapidly and flows were close to or exceeding record levels, producing widespread travel disruption and many flooded communities. [PAG,MUL] (p6)</p></div><div class="nugget-popup"><p>Significant rainfall associated with Storm Babet (20 October 2023) on saturated ground caused internal flooding to residential and commercial properties across the county; the investigation focuses on Debenham and surrounding areas within Mid Suffolk. [IMG,PAG] (p7)</p></div><div class="nugget-popup"><p>Significant rainfall from Storm Babet on saturated ground caused internal flooding to residential and commercial properties across the county. [PAG] (p8)</p></div><div class="nugget-popup"><p>Storm Babet produced significant rainfall on already saturated ground across the county, causing internal flooding to residential and commercial properties from multiple sources (fluvial and pluvial). [PAG,IMG] (p9)</p></div><div class="nugget-popup"><p>Suffolk County Council (Highways Authority) performed a recorded gully cleanse in December 2023 and an unrecorded visit shortly after the storm; overhauled inspection and cleansing routines across Suffolk to ensure gullies are included and higher priority is given to known flood&ndash;risk areas. [TAB,PAG] (p37)</p></div></div></body></div>`)[0];

                var html_2390a8ae662982e827556a1a9801cd8e = $(`<div id="html_2390a8ae662982e827556a1a9801cd8e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>East Anglia</h1><div class="nugget-popup"><p>During Storm Babet (18&ndash;21 October 2023) much of East Anglia experienced very heavy rainfall which caused saturated catchments and rapidly rising rivers. River levels at many Environment Agency gauging stations were close to or exceeded highest recorded flows and this produced significant flooding of roads and properties across the region, causing widespread travel disruption and numerous flooded communities. [IMG,PAG] (p6)</p></div></div></body></div>`)[0];

                var html_ebf5abfcbd1bb8d3b21264b8b799d20f = $(`<div id="html_ebf5abfcbd1bb8d3b21264b8b799d20f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Debenham</h1><div class="nugget-popup"><p>Debenham was one of the most severely impacted locations. Intense rainfall overwhelmed five natural flow routes and the capacity of existing drainage; these flows converged with the River Deben (which was also in flood), causing internal flooding of properties, and disruption to infrastructure and services. The village was divided into nine impacted zones for reporting. (p4)</p></div><div class="nugget-popup"><p>Internal flooding to properties (residential and commercial) within the village; report focuses on Debenham and describes probable sources, observed flow paths through the community and receptors affected. [IMG,PAG] (p7)</p></div><div class="nugget-popup"><p>Debenham experienced rapid rise in flood waters during Storm Babet as fluvial (main river) and pluvial (surface water/overland) flows combined. Properties were internally flooded and some were flooded before the Aspall gauge reached its trigger level or a warning was issued. [PAG] (p8)</p></div><div class="nugget-popup"><p>The village experienced significant internal flooding of residential and commercial properties. Flood water approached from fluvial sources (tributaries and the River Deben), pluvial surface&ndash;water runoff, and combinations of both. Properties were flooded before the Aspall Watercourse gauge reached its trigger level and before a Flood Warning was issued. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>Pluvial (surface water) flood risk concentrated in the low&ndash;lying village where five major flow paths converge on the River Deben. Seven streets (Chancery Lane, Aspall Road, Water Lane, Priory Lane, High Street, Kenton Road and Low Road) are shown as being at risk of flooding. The village can act as temporary attenuation during intense rainfall, retaining flood water until discharge to the south; during significant storms infrastructure and watercourses have been observed to be overwhelmed. Local geology (Lowestoft Formation diamicton) produced low infiltration during Storm Babet, increasing runoff into the village. [IMG,PAG] (p14)</p></div><div class="nugget-popup"><p>Surface&ndash;water / overland flow flooding driven by low&ndash;permeability soils and multiple flow paths. The report links these local soil conditions and antecedent rainfall to runoff during Storm Babet, which increased flood risk in Debenham. [IMG,PAG] (p15)</p></div><div class="nugget-popup"><p>Extreme rainfall (Storm Babet) combined with low&ndash;lying ground, multiple flow paths and low&ndash;permeability surrounding soils caused watercourses and a culvert to be overwhelmed. Floodwater from interconnecting watercourses and an overwhelmed/partially blocked culvert flowed onto the highway (Bellwell Lane) and into the village, inundating properties and roads; silt and a headwall forcing flow onto the road were identified as factors that impeded conveyance downstream. [PAG,MUL] (p16)</p></div><div class="nugget-popup"><p>Flood waters from the local watercourse and surface runoff converged in the village; a small number of properties on Bellwell Lane were reported flooded. Drainage assets were overwhelmed and a culvert under Bellwell Lane may have been blocked or impeded, contributing to flooding. [PAG] (p17)</p></div><div class="nugget-popup"><p>Parts of the town (northern Debenham) experienced flows from overtopped watercourses and the River Deben, resulting in inundation of roads and damage to residential properties and vehicles, with evacutions required. [IMG] (p19)</p></div><div class="nugget-popup"><p>Flow from the west and north entered the central village catchment as the Derry Brook overtopped, with roads acting as secondary flow paths and contributing to internal flooding of properties and significant external depths that submerged vehicles in the village. [PAG] (p20)</p></div><div class="nugget-popup"><p>Overtopping of the Derry Brook and overwhelmed watercourses caused flood water to spill onto the highway which then acted as a secondary flow path into the central village catchment. Floodwater entered properties from the highway; floodwater was reported contaminated with sewage and oil. Ground saturation and low&ndash;permeability ground likely exacerbated the event. Concerns were raised about surface&ndash;water management at recent housing developments. [MUL] (p21)</p></div><div class="nugget-popup"><p>High rainfall and an overtopped River Deben, combined with runoff from fields, allotments and developed surfaces, produced contaminated flood flows through the town (along Aspall Road, Chancery Lane, Water Lane and Priory Lane). Properties were internally flooded, vulnerable residents were rescued by boat, and emergency services experienced access issues. [IMG] (p22)</p></div><div class="nugget-popup"><p>Lower Debenham (the lowest part of the village) received converging overland flow from Cherry Tree Brook and highway/green&ndash;space flow paths; drainage assets were overwhelmed and floodwater congregated before exiting the village to the south via the River Deben. Vehicle movement through floodwater worsened ingress to properties. (p24)</p></div><div class="nugget-popup"><p>Parts of Debenham (notably the south and a small area on the west &mdash; Henry Street) experienced overwhelmed watercourses and drainage/sewer systems, highways acting as flow paths and consequent internal and external property flooding. [IMG,PAG] (p26)</p></div><div class="nugget-popup"><p>Commercial and residential properties were flooded and damaged when watercourses and drainage networks were quickly overwhelmed, causing highways to act as secondary flow paths and outfalls to the river to be blinded, restricting drainage. Resources in local emergency services stations and charitable centres were reported as significantly damaged. [IMG,PAG] (p27)</p></div><div class="nugget-popup"><p>Local watercourses and drainage were quickly overwhelmed so highways acted as secondary flow paths; highways drainage and sewerage systems reached capacity and blinded outfalls restricted drainage. Localised blockages (e.g. blocked sewers or gullies) are reported as contributors to flooding in western Debenham (Gracechurch/Henry Street area). [PAG,IMG] (p28)</p></div><div class="nugget-popup"><p>The River Deben overtopped its banks onto the floodplain and flooded properties from the rear; floodwater also travelled from the road descending north, surrounding properties. Central Debenham required rescues by boat during the flooding. [PAG] (p29)</p></div><div class="nugget-popup"><p>Residential streets, gardens and properties were inundated; residents required evacuation/rescue using small boats and assistance in the flooded neighbourhood. Houses and gardens were partially submerged with floodwater reaching at least knee&ndash;depth in places. (p30)</p></div><div class="nugget-popup"><p>Central Debenham was inundated such that residents had to be rescued by boat. [IMG] (p31)</p></div><div class="nugget-popup"><p>Internal flooding of a residential living room: murky floodwater covering the floor and partially submerging furniture, risking water damage to upholstery, tables and household items. [IMG,PAG] (p34)</p></div><div class="nugget-popup"><p>Residential areas experienced external flooding: gardens were waterlogged with water covering lawns and surrounding outdoor furniture and plants; streets within the settlement had standing floodwater affecting vehicles and transport. [PAG] (p35)</p></div><div class="nugget-popup"><p>Areas of Debenham, including residential streets, experienced flooding that inundated gardens and reached property boundaries; residents were seen moving through deep water and carrying children and belongings to safety. [PAG] (p36)</p></div><div class="nugget-popup"><p>Community experienced flooding associated with Storm Babet (mid&ndash;October 2023) &mdash; impacts prompted community engagement with agencies, removal of river/stream blockages and local gully/road inspections and cleanses. [TAB,PAG] (p37)</p></div><div class="nugget-popup"><p>High river flows during the wet Autumn/Winter 2023/24 (including the event 18 Oct 2023 &ndash; 21 Oct 2023) produced impacts in the local community. Gauged water level data for Debenham was analysed in the context of those impacts, flood alert and warning trigger thresholds were refined and activated, and River Levels data on the public website was updated. Follow&ndash;up monitoring/visits are planned (next visit July 2024). (p38)</p></div><div class="nugget-popup"><p>The community experienced flooding which prompted refinements to local flood alert and warning trigger thresholds, updates to online river level information, community engagement with those directly affected, and removal of obvious river blockages (trees, branches, flood debris) to reduce pinch&ndash;point flooding. [PAG] (p39)</p></div><div class="nugget-popup"><p>Properties in the village flooded internally during Storm Babet (October 2023). Drainage and culvert blockages were observed and cleared by agencies and community members; engagement sessions were held with residents to capture experiences and review the emergency plan. Progressed installation of Property Flood Resilience (PFR) measures for properties identified at highest risk. [TAB,PAG] (p40)</p></div><div class="nugget-popup"><p>Properties in the village flooded internally during Storm Babet; affected property owners will be contacted for a PFR investigation project and hydraulic modelling is planned to assess channel silt/soil impacts on flood risk. (p43)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 70 residential and commercial properties were internally flooded; five natural flow routes (p4)</p></div><div class="nugget-popup quant"><p>over seventy properties [PAG] (p8)</p></div><div class="nugget-popup quant"><p>over seventy properties reported internal flooding [IMG,PAG] (p9)</p></div><div class="nugget-popup quant"><p>7 streets shown at risk [IMG,PAG] (p14)</p></div><div class="nugget-popup quant"><p>25 properties; internal water depths 5 cm to 45 cm [IMG] (p19)</p></div><div class="nugget-popup quant"><p>5 properties across the four roads; internal depths up to 35 cm [PAG] (p20)</p></div><div class="nugget-popup quant"><p>at least 5 properties; internal flood depths of 35 cm; external depths sufficient to fully submerge cars (Northern Debenham) [MUL] (p21)</p></div><div class="nugget-popup quant"><p>24 properties (in the central Debenham area); internal flooding depths 20 cm to over 90 cm; external flood water over 150 cm [IMG] (p22)</p></div><div class="nugget-popup quant"><p>24 properties (p24)</p></div><div class="nugget-popup quant"><p>23 properties; internal flood depths recorded between 15cm and 90cm [IMG,PAG] (p26)</p></div><div class="nugget-popup quant"><p>23 properties; internal flooding levels recorded between 15cm and 90cm; external depths of over 90cm [IMG,PAG] (p27)</p></div><div class="nugget-popup quant"><p>four people rescued/evacuated by boat (p30)</p></div><div class="nugget-popup quant"><p>3 armchairs partially submerged [IMG,PAG] (p34)</p></div><div class="nugget-popup quant"><p>3 people observed wading through floodwater [PAG] (p36)</p></div><div class="nugget-popup quant"><p>10 properties [TAB,PAG] (p40)</p></div></div></body></div>`)[0];
                popup_dd3b1deb73a3d923b870e41c1f17159e.setContent(html_ebf5abfcbd1bb8d3b21264b8b799d20f);
