                var html_463007e6a9ee96fc11f28ea0377aa2fc = $(`<div id="html_463007e6a9ee96fc11f28ea0377aa2fc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>King Street, Whalley</h1><div class="nugget-popup"><p>The trash screen at the junction of King Street and Brookside Close was inspected and maintained by Lancashire Highways following the December 2015 flooding and is now on a weekly inspection schedule (response to flooding impacts). [TAB] (p20)</p></div><div class="nugget-popup"><p>The King Street culvert was identified during post&ndash;December 2015 investigations as a potential failure point contributing to flooding; options considered included replacing large sections of the culvert or repairing it if detailed inspection showed it was required. Related highways/drainage works were programmed to address issues near the junction with Brookside Close. [PAG] (p22)</p></div></div></body></div>`)[0];

                var html_cb9a061f10ec0a4b43282fcf0987465e = $(`<div id="html_cb9a061f10ec0a4b43282fcf0987465e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lancashire</h1><div class="nugget-popup"><p>Significant flooding occurred across Lancashire in December 2015, affecting communities and exposing shortcomings in how flood risk messages were communicated to those communities. (p3)</p></div><div class="nugget-popup"><p>Storms and heavy rainfall in November&ndash;December 2015 caused widespread flooding across Lancashire during December 2015, flooding properties and damaging private gardens, garages and outbuildings, business premises, agricultural property and critical public infrastructure including roads, bridges, retaining walls, water treatment works, power and communications installations, and community buildings such as schools, village and town halls. (p9)</p></div><div class="nugget-popup"><p>Experienced widespread flooding during two major storm events in December 2015 affecting multiple communities across the county. Consequences included countywide data collection and timelines, a countywide Section 19 investigation and follow&ndash;up 'stage two' reporting, increased household sign&ndash;up to Environment Agency flood warnings and the formation of new local Flood Action Groups to support communities. [PAG] (p10)</p></div><div class="nugget-popup"><p>One property in the Wiswell (Pendleton Road area) suffered internal flooding. An ordinary watercourse was identified close to the affected property but it is not clear whether this was the primary source of the flooding. [TAB] (p23)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 2,500 properties (p9)</p></div><div class="nugget-popup quant"><p>1 property [TAB] (p23)</p></div></div></body></div>`)[0];
