                var html_a7364c62de469eefe4a4be7b5ac37a89 = $(`<div id="html_a7364c62de469eefe4a4be7b5ac37a89" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>British Sugar</h1><div class="nugget-popup"><p>Access to the British Sugar factory (immediately west of the highway) was limited when the adjacent highway flooded and was closed; closures during incidents have disrupted HGV access especially during the sugar beet campaign season. [TAB,PAG,MUL] (p6)</p></div><div class="nugget-popup"><p>The reservoir owned by British Sugar to the north&ndash;east of Compiegne Way was identified as a potential source of reservoir flooding risk, but a February 2024 assessment found the reservoir functioning normally with no evidence of leaks and concluded it is at most a minor contributor to the observed flooding and can be discounted as a significant source. (p10)</p></div><div class="nugget-popup"><p>British Sugar investigated the possible contribution of an adjacent reservoir to the flooding incident and was asked to consider rerouting internal traffic to avoid HGVs using local roads when Compiegne Way is flooded; the factory&#8217;s operations and HGV access routes are implicated by the road closures. [TAB] (p13)</p></div><div class="nugget-popup"><p>Compiegne Way is frequently subject to groundwater flooding, which disrupts road access and displaces HGV traffic onto local roads; this affects factory traffic flows and operations, prompting recommendations to reroute internal factory traffic and to raise the road level to prevent frequent groundwater flooding. (p15)</p></div></div></body></div>`)[0];

                var html_f46cf6aac1c23c1f9b0d076d2062f672 = $(`<div id="html_f46cf6aac1c23c1f9b0d076d2062f672" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Lark</h1><div class="nugget-popup"><p>A 200 m stretch of Compiegne Way in Bury St Edmunds was flooded, causing the major transport route to be closed and traffic to be displaced onto local roads. (p4)</p></div><div class="nugget-popup"><p>Pumped groundwater and highway drainage discharge into the River Lark raised concerns about pollution input and erosion; recommended actions include reducing pollution entering the river, lifting the outfall level to improve pump discharge performance, and providing erosion protection. [TAB,MUL] (p13)</p></div><div class="nugget-popup"><p>The River Lark receives pumped groundwater discharge; the text notes near&ndash;constant flow into the river from pumping that can cause erosion and recommends lifting the outfall and providing erosion protection to mitigate adverse impacts from these discharges. [PAG] (p15)</p></div></div></body></div>`)[0];

                var html_b6263203655758d87591eee457af304c = $(`<div id="html_b6263203655758d87591eee457af304c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Compiegne Way, Bury St Edmunds</h1><div class="nugget-popup"><p>Road surface was overtopped by floodwater, covering the full width of the carriageway, partially submerging road markings, a metal barrier and a warning sign and rendering the road impassable. (p1)</p></div><div class="nugget-popup"><p>A 200 m stretch of the highway between investigation points A and B was significantly inundated on both sides of the carriageway; the western carriageway experienced greater flood depths than the eastern carriageway. The flooded section is a major route for HGVs accessing the adjacent British Sugar factory and for traffic approaching Bury St Edmunds from the north&ndash;east, with associated high traffic flows and silt loading noted. (p5)</p></div><div class="nugget-popup"><p>Repeated inundation of this section of highway by surface water (pluvial) with an indirect contribution from high river levels preventing drainage outfall discharge. Impacts include road closures (limiting access to the British Sugar factory and blocking access to Bury St Edmunds from the north&ndash;east), damage to the road surface, cars stranded, insurance claims, pumps and drainage works undertaken and remedial repairs carried out/delayed due to continuous inflow from an unknown source. [PAG,MUL] (p8)</p></div><div class="nugget-popup"><p>Southern end of this stretch is at high risk from fluvial (main river) flooding; outfall for the highway drainage sits below the predicted annual peak river level so when river levels are high the highway drainage cannot discharge at full volume, which can indirectly cause flooding of the highway. The section sits lower than surrounding land so pluvial (surface water) flooding causes runoff to flow through and accumulate here after heavy/prolonged rainfall. Drainage relies on a sump and pump (pumping water into the River Lark) so the system is dependent on mechanical/electrical operation and is less resilient than gravity drainage, increasing flood risk. Groundwater is currently at or just below the road surface in this location, causing water to emerge from the verge and appear on the carriageway. [PAG] (p9)</p></div><div class="nugget-popup"><p>Surface water and groundwater emerge at the low point of Compiegne Way where a pumped drainage system is located, causing the highway to be partially blocked or flooded to depths requiring emergency road closures. Floodwaters (including groundwater) do not drain quickly, so closures remain in place for extended periods while water is removed and the drainage network/road surface remediated. Pump failures (exacerbated by high silt loading) and an outfall at or below River Lark peak levels reduce pump effectiveness during high river flows, producing significant and prolonged flooding of the highway. [MUL] (p12)</p></div><div class="nugget-popup"><p>Sections of Compiegne Way were partially to fully submerged by floodwater (visible in January 2024 and March 2023), rendering the road obstructed or impassable. The flooding disrupted vehicular traffic (cars and HGVs), prevented normal access into and out of Bury St Edmunds for residents and businesses, required clearance of water and silt and remedial works to pumps and drainage, and removed a critical diversion route used when the nearby A14 is closed. [TAB,MUL] (p13)</p></div><div class="nugget-popup"><p>Compiegne Way experienced frequent groundwater flooding and is reliant on a pumped drainage system; when pumps cannot discharge at full capacity the road floods, displacing traffic onto local roads and creating risk of vehicle damage. Recommendations in the text target diversion of the most westerly section, raising the road level, improving outfall and adding storage/ditches to reduce reliance on pumping. [PAG] (p15)</p></div><div class="nugget-popup"><p>During a flood event traffic on Compiegne Way is displaced onto local roads; report recommends rerouting traffic on Compiegne Way to prevent displacement onto local roads. (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>road closed for approximately 1 month (January 2024); road closed for 12&ndash;24 hours (February 2024); drainage catchment ~1.5 km of road network discharging to this low point; pumped outfall via ~1 km of piped network to the River Lark; 75% of recorded local flooding events occur in winter/early spring; 17 historic incident dates recorded in Table 2. [PAG,MUL] (p8)</p></div><div class="nugget-popup quant"><p>1.5 km of road network drains toward this section; approximately 1 km of piped (pumped) network to River Lark; road elevation approx 32.6 m AOD; groundwater recorded approx 32 m AOD (February 2024). [PAG] (p9)</p></div></div></body></div>`)[0];

                var html_1ca09f7362db0fc1ae43e4a182f650b0 = $(`<div id="html_1ca09f7362db0fc1ae43e4a182f650b0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bury St Edmunds</h1><div class="nugget-popup"><p>Flooding occurred on a road (Compiegne Way) within Bury St Edmunds, causing a carriageway to be overtopped and made impassable. (p1)</p></div><div class="nugget-popup"><p>The investigation area lies within Bury St Edmunds; a 200 m section of Compiegne Way in Bury St Edmunds experienced significant inundation on both carriageways, with greater depths on the western carriageway. [IMG] (p5)</p></div><div class="nugget-popup"><p>Vehicular access to Bury St Edmunds from the north&ndash;east was prevented at times when the highway flooded and was closed, disrupting residents and visitors. [TAB,PAG,MUL] (p6)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 1 month; 12&ndash;24 hours; 17 historic incidents [TAB,PAG,MUL] (p6)</p></div></div></body></div>`)[0];
