                var html_a1d581e15eaa1fa2926bec98ab11e130 = $(`<div id="html_a1d581e15eaa1fa2926bec98ab11e130" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Retford</h1><div class="nugget-popup"><p>Experienced extensive flooding during the November 2019 intense rainfall event; town was specifically called out as being affected in the report. [PAG] (p1)</p></div><div class="nugget-popup"><p>Parts of the town experienced fluvial and surface&ndash;water flooding: internal property flooding, flooded gardens and curtilages, and public highways rendered impassable (local streets listed). [IMG,PAG] (p2)</p></div><div class="nugget-popup"><p>Significant internal property flooding across the town (internal flooding of dwellings), inundation of gardens and curtilages and public highways made impassable (notably Grove Lane and Blackstope Lane). [IMG] (p3)</p></div><div class="nugget-popup"><p>Localised internal flooding occurred in parts of Retford where the Retford Beck is culverted; backing up of water at culvert locations caused overtopping and led to flooding of nearby houses (notably around Grove Lane and Blackstope Lane). [IMG,PAG] (p4)</p></div><div class="nugget-popup"><p>An area of Retford (near Carr Dyke and adjacent to the River Idle) experienced internal flooding affecting residential properties, rear gardens, outhouses and allotment gardens; the map highlights an area near Bequel Road as affected. [IMG,PAG] (p5)</p></div><div class="nugget-popup"><p>Properties in the community were affected by flooding; a public drop&ndash;in session in Retford was attended by Bassetlaw District Council, Nottinghamshire County Council Flood Risk Management and Emergency Planning Teams and the Red Cross to provide updates, advice and assistance; recovery grants and resilience measures are being administered/delivered. (p11)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>31 reported incidents of internal property flooding; 2 public highways named as impassable (Grove Lane and Blackstope Lane). [IMG,PAG] (p2)</p></div><div class="nugget-popup quant"><p>31 reported incidents of internal property flooding [IMG] (p3)</p></div><div class="nugget-popup quant"><p>2 properties; approximately 15 properties' rear gardens and outhouses [IMG,PAG] (p5)</p></div></div></body></div>`)[0];
