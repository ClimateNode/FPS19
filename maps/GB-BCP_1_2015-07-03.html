                var html_5545f365650a09d4176535f99eaac742 = $(`<div id="html_5545f365650a09d4176535f99eaac742" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bournemouth</h1><div class="nugget-popup"><p>The report investigates flooding that affected Bournemouth on 3rd July 2015; it documents the event for local flood investigation purposes (Section 19). (p1)</p></div><div class="nugget-popup"><p>Widespread surface water / flash flooding across the conurbation. Sewers and drains surcharged causing damage to the highway; urgent carriageway repairs undertaken by Bournemouth Borough Council and Wessex Water. Foul/combined sewer surcharging required major clean&ndash;up of affected properties and the Lower Gardens. (p3)</p></div><div class="nugget-popup"><p>Many houses and businesses flooded; roads damaged by surcharging sewers; The Lower Gardens closed for several days while a major clean&ndash;up was carried out following a surcharged sewer; numerous properties entered temporary accommodation while properties dried out; businesses lost stock and trading days; reputational damage to a local facility (The Lower Gardens). [TAB,PAG] (p10)</p></div><div class="nugget-popup"><p>Extreme thunderstorm on the night of 3rd July 2015 caused inevitable flash flooding across the town. Limited channel and outfall capacity led to overflows; the main foul/combined sewer also overflowed causing a significant pollution incident. Parts of local gardens were closed for several days for cleanup, and the event attracted local media coverage. [PAG] (p17)</p></div><div class="nugget-popup"><p>Reported and observed surface&ndash;water/urban flooding across Bournemouth on 3 July 2015; locations of flooding were mapped in the report (Maps 3, 3(a), 3(b), Map 4 and Map 5) and formed the basis for the investigation and response. (p18)</p></div><div class="nugget-popup"><p>Rapidly intensifying heavy precipitation moved onshore over Bournemouth during the 22:45&ndash;23:15 BST period on 3 July 2015, producing surface&ndash;water/flash flooding in the urban area associated with the event. [IMG] (p21)</p></div><div class="nugget-popup"><p>Very high, localized rainfall rates were observed over central and northern Bournemouth at 23:40 BST on 3 July 2015 (large areas of 16&ndash;32 mm/hour and some &gt;32 mm/hour on radar). This intense, concentrated precipitation produced conditions for rapid surface&ndash;water (pluvial) flooding within and immediately north of the city boundary. [IMG,PAG] (p23)</p></div><div class="nugget-popup"><p>Areas near the coastline showed higher densities of reported flooding incidents on 3 July 2015, with multiple external and highway&ndash;type flood reports clustered close to the coast. [IMG] (p25)</p></div><div class="nugget-popup"><p>Multiple locations across the urban area experienced flooding incidents on 3rd July 2015 (red dots). Incident clusters overlap with previously reported/observed flooding (light blue), indicating recurring vulnerability in central and southern parts of the town, including areas near the coastline. [IMG] (p29)</p></div><div class="nugget-popup"><p>Across Bournemouth wards shown on the map, multiple surface water flood locations on 3 July 2015 are indicated (red points), with predicted 1&ndash;in&ndash;100&ndash;year (>150mm) flood corridors (magenta) overlapping some actual flood sites &mdash; demonstrating urban surface water flooding impacts during the event. [IMG] (p30)</p></div><div class="nugget-popup"><p>The map shows scattered observed flooding locations across Bournemouth on 3 July 2015 (red), with clustering in southern and western wards (notably Westbourne/West Cliff). Modelled 1&ndash;in&ndash;100&ndash;year (>150mm) predicted flood zones (magenta) follow watercourses and low&ndash;lying areas and overlap with many observed points, indicating both historical impacts and modelled exposure to high&ndash;return&ndash;period pluvial flooding in parts of the town. [IMG] (p31)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>133 reported or observed incidents of flooding; 56 properties flooded internally (p3)</p></div><div class="nugget-popup quant"><p>133 records; 40 records of internal flooding affecting some 56 properties; 37 records of external flooding; 38 records of highway flooding; 18 records indeterminate. [TAB,PAG] (p10)</p></div></div></body></div>`)[0];
