                var html_dca16ac5c195c6826b014efdba3e66aa = $(`<div id="html_dca16ac5c195c6826b014efdba3e66aa" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lowdham</h1><div class="nugget-popup"><p>On 2 January 2024 (Storm Henk) heavy rain on already saturated ground caused internal flooding in Lowdham, affecting homes and businesses. The report states 60 properties and businesses experienced internal flooding; some incidents were repeats and many residents were still recovering from Storm Babet. Lowdham also has a long history of flooding (notably 1999 when 300 properties flooded) and has been the subject of previous Section 19 reports. Flood storage works were constructed on the Cricket Pitch in 2000 and a £25m catchment flood alleviation project (preliminary works started September 2023) is intended to reduce future risk. [IMG] (p3)</p></div><div class="nugget-popup"><p>Internal flooding affected homes and businesses in central and eastern Lowdham; many residents and businesses experienced distress and some repeated internal&ndash;flooding incidents while still recovering from a prior event (Storm Babet). [IMG,PAG] (p4)</p></div><div class="nugget-popup"><p>Widespread flooding across the village and catchment: high surface&ndash;water flows and river overtopping overwhelmed drainage and defences, flooding properties, roads (including Epperstone By&ndash;Pass and Main Street) and open spaces; multiple streets and residential areas experienced internal and isolated internal flooding. [IMG,PAG] (p5)</p></div><div class="nugget-popup"><p>Reduced discharge capacity of the Cocker Beck (due to pumps placed in the Beck) caused the Beck to back up and overtop defences earlier than in previous events, leading to flooding of Station Road and properties in Victoria Avenue, Longmoor Avenue, Station Road, The Orchards and other streets; additionally, floodwaters from an overtopped left bank defence flooded The Corner, properties at 7&ndash;11 Main Street then flowed down Southwell Road into The Cottages, Willow Holt and Merevale as part of the wider Lowdham flood. (p6)</p></div><div class="nugget-popup"><p>Properties in the village were affected by bow&ndash;wave / surface water flooding; volunteers closed roads within the village to limit bow&ndash;wave impacts on properties. (p9)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>60 properties and businesses; 300 properties (1999) [IMG] (p3)</p></div><div class="nugget-popup quant"><p>60 properties and businesses [IMG,PAG] (p4)</p></div><div class="nugget-popup quant"><p>30 properties; properties 7 &ndash; 11 Main Street (5 properties) [IMG,PAG] (p5)</p></div><div class="nugget-popup quant"><p>30 properties; 6 pumps (2 operational); 5 properties (7&ndash;11 Main Street) (p6)</p></div></div></body></div>`)[0];
