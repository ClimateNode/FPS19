                var html_55d1cf74e35a33c42b1c2f3341923624 = $(`<div id="html_55d1cf74e35a33c42b1c2f3341923624" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Riversdale, Bourne End</h1><div class="nugget-popup"><p>Flooding reported along A4094 Ferry Lane caused by heavy persistent rainfall, inadequate drains and low freeboard of the River Thames; many houses around Riversdale and Ferry Lane are built on stilts as a resilience measure against repeated flooding, reducing the number of reported property flood incidents. (p17)</p></div><div class="nugget-popup"><p>Properties were inundated by River Thames flood waters; some properties are elevated on stilts and had individual flood barriers/other measures. Residents used two aluminium boats to move from their properties to higher ground via the private access road. (p23)</p></div><div class="nugget-popup"><p>Riversdale and the adjacent Ferry Lane were inundated by flood waters from the River Thames during the January&ndash;February 2014 floods. Properties in the vicinity were affected by rising river water; residents used two aluminium boats to move to higher ground and some properties in the area are elevated on stilts and have flood barriers. Local records indicate internal flooding of properties in the Riversdale area. [IMG,PAG] (p24)</p></div><div class="nugget-popup"><p>Water was reported at property thresholds in Abbotsbrook (inspection on 6 January); Riversdale private road flooded on 8 January (initially no properties reported flooded); by 14 February about 20 properties were reported flooded, mostly centred around Abbotsbrook and Riversdale. [TAB,MUL] (p26)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 properties [IMG,PAG] (p24)</p></div><div class="nugget-popup quant"><p>approximately 20 properties flooded (Abbotsbrook and Riversdale) [TAB,MUL] (p26)</p></div></div></body></div>`)[0];
