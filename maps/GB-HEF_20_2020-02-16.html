                var html_167f428f9418bd532a6fa33bc228ff34 = $(`<div id="html_167f428f9418bd532a6fa33bc228ff34" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Curl Brook</h1><div class="nugget-popup"><p>Curl Brook is the main watercourse shown as producing river flooding; flood zones 3 and 2 follow the course of the brook, placing adjacent land and properties at the highest flood risk; areas benefiting from flood defences are limited and closely follow the brook. [IMG] (p1)</p></div><div class="nugget-popup"><p>River overflow from the Curl Brook caused internal flooding to properties in Lyonshall; site visit (June 2021) also confirmed previous episodes of flooding and foul (sewer) flooding associated with the brook. [IMG,MUL] (p3)</p></div><div class="nugget-popup"><p>Identified as a source of fluvial flood risk close to properties in the village. An upstream tributary of the Curl Brook was diverted (railway construction) and the channel gradient and routing are reported to allow water to drain onto the road and into the village; Herefordshire Council LLFA has proposed a feasibility study into the Curl Brook to address the fluvial flood risk. (p4)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 properties reported river overflow from Curl Brook; internal flood depths reported as less than 6 inches [IMG,MUL] (p3)</p></div></div></body></div>`)[0];

                var html_faa2854cad8d7ffb6ca1c78d7f91b578 = $(`<div id="html_faa2854cad8d7ffb6ca1c78d7f91b578" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lyonshall</h1><div class="nugget-popup"><p>Properties adjacent to Curl Brook lie within Flood Zone 3 (highest risk); areas benefiting from flood defences are limited and closely follow the river, so properties near the brook are at significant risk of river flooding. [IMG] (p1)</p></div><div class="nugget-popup"><p>Internal flooding occurred to properties in Lyonshall during the key event; flooding sources reported include river overflow from Curl Brook, blocked gullies/overland flows, and overflowing sewers/toilets (foul flooding). (p3)</p></div><div class="nugget-popup"><p>The village experienced internal flooding to residential properties (five properties internally flooded during the key flood event). Surface water runoff affected the highway with water draining onto the road and into the village; foul sewers surcharged during storms and there are reports of foul flooding on highways. No injuries or loss of life were reported. (p4)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 properties recorded internal flooding (depths all less than 6 inches); 2 additional properties in the parish flooded from Sour Brook (p3)</p></div><div class="nugget-popup quant"><p>5 properties (p4)</p></div></div></body></div>`)[0];
