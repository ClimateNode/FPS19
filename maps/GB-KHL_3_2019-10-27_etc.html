                var html_1e78e333b77ed732cea2f22c1390d5dd = $(`<div id="html_1e78e333b77ed732cea2f22c1390d5dd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kingston Upon Hull</h1><div class="nugget-popup"><p>The city experienced internal flooding of properties and widespread road/garden flooding during two separate events. On 27 October 2019 overtopping of the Old Fleet Drain led to internal flooding of properties; following heavy rain on 10 November 2019 there was repeat flooding at multiple locations and high levels in Old Fleet Drain persisted for several days. [MUL] (p4)</p></div><div class="nugget-popup"><p>Two properties within the city were reported to have experienced minor internal flooding during the event on 10 November 2019. (p5)</p></div><div class="nugget-popup"><p>On 10 November 2019 the Old Fleet Drain overtopped causing local flooding in the city. Reports were received of two further properties: one at Victoria Dock (reports of flooding unconfirmed) and one at Sutton Park where water flowed from a higher footpath across an impervious front garden causing slight internal flooding via an air brick. There were also reports of extensive road flooding at Cumbrian Way and North Carr Road and gardens submerged in Norland Avenue. Record high levels on the Holderness Drain caused some flooding to property outside the city boundary. [IMG,PAG] (p8)</p></div><div class="nugget-popup"><p>Catchment saturation from heavy rainfall (September) and increased rainfall in October and November led watercourses in the Hull area to overtop and drainage systems to be overwhelmed. [PAG,MUL] (p30)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>five properties (27 October 2019); two properties (10 November 2019) [MUL] (p4)</p></div><div class="nugget-popup quant"><p>2 properties (p5)</p></div><div class="nugget-popup quant"><p>two properties [IMG,PAG] (p8)</p></div></div></body></div>`)[0];

                var html_352ea63f7fff214cd5dd9d743f33b783 = $(`<div id="html_352ea63f7fff214cd5dd9d743f33b783" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bexhill Avenue, Kingston Upon Hull</h1><div class="nugget-popup"><p>Internal flooding of a property at 34 Bexhill Avenue was reported on 27 October 2019; emergency services (Humberside Fire and Rescue) and Hull City Council used pumps and gully cleaners to assist. (p4)</p></div><div class="nugget-popup"><p>Residents noticed rising flood water around their houses on the street; floodwater rose around properties. [PAG] (p10)</p></div><div class="nugget-popup"><p>Overtopping of the nearby Old Fleet Drain caused water to run through a garden, across an area of public open space and into houses on Bexhill Avenue. On 2 April 2018 a single property flooded internally. On 27 October 2019 a larger overtopping event caused internal flooding of five properties. On 10 November 2019 a resident reported flooding again but the subsequent investigation found water contained to the garden with no internal flooding. The fire service and Hull City Council attended the 27 October 2019 incident. [IMG,PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Flooding occurred at Bexhill (flows backed up due to tide&ndash;locked outfall); HCC and EA deployed pumps and personnel to manage water levels; the bank at Bexhill Avenue was identified as being lower at this location, increasing flood risk; a temporary sandbag wall was constructed (15 Nov) as a defence. [MUL] (p21)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property (34 Bexhill Avenue) (p4)</p></div><div class="nugget-popup quant"><p>1 property (2 April 2018); 5 properties internally (27 October 2019); 1 property garden&ndash;only (10 November 2019); houses 16, 24 and 34 highlighted on map [IMG,PAG,MUL] (p11)</p></div><div class="nugget-popup quant"><p>Hull City Council deployed 5 operatives and a pump (shifts reported) at Bexhill Avenue; 2 HCC operatives and a pump attended for a total of 36 hours over 2 days with a manager in attendance for 16 hours over the 2 days. [MUL] (p21)</p></div></div></body></div>`)[0];
