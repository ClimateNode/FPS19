                var html_2a7b6111da1be3bc58bfb02541e5d206 = $(`<div id="html_2a7b6111da1be3bc58bfb02541e5d206" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Tandridge</h1><div class="nugget-popup"><p>The area affected by the incident covered the north&ndash;west of Tandridge, including the Caterham on the Hill catchment. Intense storms on 7 June 2016 produced flooding across this area resulting in numerous property and road impacts and localised traffic gridlock. [IMG,PAG] (p6)</p></div><div class="nugget-popup"><p>The Caterham on the Hill catchment (in north&ndash;west Tandridge) experienced extensive flooding on 7th June 2016: internal property and external flooding, impassable roads and road closures. Many internal property floods included sewage; roads were impassable causing traffic gridlock; Caterham Drive (just north of the Croydon/Tandridge boundary) was badly flooded. (p7)</p></div><div class="nugget-popup"><p>Parts of Tandridge (notably Caterham on the Hill in the north of the district) experienced intense rainfall and surface&ndash;water flow/routes modelled and observed as causing surface water flood risk; historic highway wetspots recorded in the caterham catchment lie within the district. [PAG,IMG] (p26)</p></div><div class="nugget-popup"><p>The northern part of Tandridge (Caterham on the Hill catchment) was subject to intense short&ndash;duration rainfall on 7 June 2016 leading to high surface water flood risk within the catchment; historic wetspots and reports of internal flooding are located in this area of Tandridge. [IMG] (p27)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 86 internal property floods; 63 external floods; 40 roads/road sections affected [IMG,PAG] (p6)</p></div><div class="nugget-popup quant"><p>86 internal property floods; 63 external floods; 40 roads/road sections affected; 7 road closures (p7)</p></div><div class="nugget-popup quant"><p>4 roads (wetspots) recorded in the catchment within Tandridge [PAG,IMG] (p26)</p></div><div class="nugget-popup quant"><p>4 roads (Queen's Park Road; Money Road; Banstead Road; Ninehams Road / Stites Hill Road); internal flooding reported at Park Road and Court Road [IMG] (p27)</p></div></div></body></div>`)[0];

                var html_30082f0dc1b63bca3956d0100ce222ba = $(`<div id="html_30082f0dc1b63bca3956d0100ce222ba" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Surrey</h1><div class="nugget-popup"><p>Emergency Management (Surrey Contact Centre) received calls and convened an emergency meeting to assess the developing situation and request setup of a rest centre. Adult Social Care prioritised response to key locations and carried out a vulnerable people search. Surrey Highways coordinated emergency highway response, instructed contractors to attend, and implemented actions including an emergency road closure. Conway tankers were coordinated by SCC Highways and TDC to support pumping and response. (p15)</p></div><div class="nugget-popup"><p>Surrey County Council (Surrey Highways) carried out joint investigations of the piped watercourse/surface water sewer (including ownership and maintenance); the Money&ndash;Pit was surveyed and maintenance work was carried out as part of recovery from the flood. (p19)</p></div></div></body></div>`)[0];

                var html_4e2af017dd087b7e3fbfaedac4e6564b = $(`<div id="html_4e2af017dd087b7e3fbfaedac4e6564b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Caterham On the Hill</h1><div class="nugget-popup"><p>Town experienced a flood incident that is the subject of the Section 19 flood investigation report. (p1)</p></div><div class="nugget-popup"><p>Surface&ndash;water flooding occurred in the Caterham Valley area during the intense storm on 7 June 2016. [IMG,PAG] (p6)</p></div><div class="nugget-popup"><p>Localised surface&ndash;water flooding occurred in the Caterham on the Hill area as a result of the intense storm on 7th June 2016; flooding was caused by very high short&ndash;duration rainfall and rapid runoff in the town/catchment. [PAG] (p7)</p></div><div class="nugget-popup"><p>The upper settlement (Caterham on the Hill area) was subject to an intense convective rainfall event on 7th June 2016 that produced rapid surface water runoff within the Caterham on the Hill catchment. The report identifies the area as being on the flow route for surface water draining northwards (via piped routes) toward Croydon and highlights a high modelled risk of surface water flooding for this locality. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>The town experienced flooding during the event on 7 June 2016. (p12)</p></div><div class="nugget-popup"><p>Experienced flash surface&ndash;water flooding on 7 June 2016; members of the public phoned emergency services about the severity of the flooding and blue light responders attended the flooded area. (p14)</p></div><div class="nugget-popup"><p>Intense rainfall produced widespread surface water flooding across Caterham on the Hill which hydraulically overloaded the sewer network, causing internal sewer flooding and requiring Thames Water attendance and pumping. Some locations experienced very deep standing water; highways were disrupted (including an emergency road closure of Ninehams Road) and responders carried out emergency actions to manage traffic and drainage. [PAG] (p15)</p></div><div class="nugget-popup"><p>Residential and local highway impacts from flooding: properties were flooded or displaced residents required assistance; flood&ndash;damaged furniture and rubbish was removed from homes; debris was present on roads and alleyways requiring additional street cleaning; recovery and multi&ndash;agency investigations were initiated across the catchment. [PAG] (p19)</p></div><div class="nugget-popup"><p>Flash flooding along the piped watercourse/surface water sewer affected the town: road network disruption, evacuations of vulnerable people and school closures were part of the incident response. [PAG] (p20)</p></div><div class="nugget-popup"><p>Surface water runoff and surcharging of the sewer system caused flooding in the Caterham on the Hill area, resulting in internal sewer flooding of properties and prompting multi&ndash;agency investigations and resident engagement. [PAG] (p21)</p></div><div class="nugget-popup"><p>Properties in the Caterham on the Hill area were identified as being at risk of flooding; a Flood Action Group was established to coordinate RMAs and residents and to develop resilience measures for affected properties. [PAG] (p22)</p></div><div class="nugget-popup"><p>Surface water flooding and surface&ndash;water flow along the Caterham on the Hill piped watercourse / storm route affected the town. Historic highway flooding (wetspots) are recorded in the Caterham on the Hill area and there are recorded instances of internal property flooding in streets within the town; the Money Pit structure on the piped watercourse (adjacent to St Michaels Road) was inspected and being cleaned as part of the response. [IMG] (p26)</p></div><div class="nugget-popup"><p>The Caterham on the Hill catchment (upper reach in Caterham) experienced intense convective rainfall on 7 June 2016 that produced rapid surface water runoff along the piped watercourse/surface water sewer. This resulted in surface water flooding with recorded historic highway flooding (wetspots) on local roads and reports of internal flooding on streets within the catchment. [IMG,PAG] (p27)</p></div><div class="nugget-popup"><p>Intense, localized rainfall on 7 June 2016 (radar&ndash;observed catchment totals of ~77.6 mm over ~2.5 hours; local station 72.6 mm in 2 hours) produced surface&ndash;water/urban flooding in the Caterham on the Hill catchment. The flow route is a piped watercourse/surface water sewer draining northwards; the catchment and its highway drainage assets were the subject of a Section 19 investigation. The catchment has known historic highway wetspots at Queen's Park Road, Money Road, Banstead Road and Ninehams Road / Stites Hill Road, and previous reports of internal property flooding in Park Road and Court Road (historic locations referenced by the investigation). (p28)</p></div><div class="nugget-popup"><p>Surface&ndash;water flooding on 7 June 2016 caused property impacts across the town. Local authority response included two Flood Forum surgeries (13 and 28 June) with multiple agencies, a council meeting for residents of Hillcroft Court to assist 18 impacted properties, provision of council tax discounts for displaced households, approximately 70 residents contacting the council for assistance (requests for sandbags, bulky waste collection, council tax enquiries, flood advice) with about 27 follow&ndash;ups, an Emergency Parking Order in Park Road to enable contractor parking, additional street cleaning to remove flood debris, and press communications. (p31)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 40 calls on 7th June; a further 40 calls on 8th June; surface water depths in excess of 900mm in some locations; 11 emergency actions on 7th June; 1 emergency road closure (Ninehams Road); 13 Conway tankers deployed in the area [PAG] (p15)</p></div><div class="nugget-popup quant"><p>18 properties impacted (Hillcroft Court); ~70 residents contacted the Council; 21 bulky waste collections; 13 roads cleaned; 3 skips [PAG] (p19)</p></div><div class="nugget-popup quant"><p>7 road closures; 40 roads affected; 5 schools closed [PAG] (p20)</p></div><div class="nugget-popup quant"><p>4 roads (wetspots); internal flooding reported on 2 streets (Park Road and Court Road) [IMG] (p26)</p></div><div class="nugget-popup quant"><p>4 roads (Queen's Park Road; Money Road; Banstead Road; Ninehams Road / Stites Hill Road); internal flooding reported at Park Road and Court Road [IMG,PAG] (p27)</p></div><div class="nugget-popup quant"><p>approximately 70 residents contacted the Council; approx. 27 residents were called back; 18 properties impacted (p31)</p></div></div></body></div>`)[0];
                popup_fde5faa5fa69296b8a20bde92d40dcc0.setContent(html_4e2af017dd087b7e3fbfaedac4e6564b);
