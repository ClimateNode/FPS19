                var html_8fc8938e313e07c4e454558c79148971 = $(`<div id="html_8fc8938e313e07c4e454558c79148971" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hampstead Heath Extension</h1><div class="nugget-popup"><p>Acted as a receptor/flow path for surface water runoff during the 12 July 2021 event, experiencing increased overland flow and being identified as an area where additional storage could reduce surface water on adjacent roads. [PAG] (p4)</p></div><div class="nugget-popup"><p>Saturated ground and surface water in the Hampstead Heath Extension produced overland flows that fed downhill runoff, contributing to surface water flooding on downhill roads (notably Wildwood Road) during the storm. [PAG] (p43)</p></div><div class="nugget-popup"><p>High elevation and saturated ground on Hampstead Heath Extension, and a culverted watercourse draining north&ndash;west, likely conveyed flows at full capacity and contributed runoff that interacted with the surface water drainage network, compounding sewer surcharging and downstream surface water flooding. (p46)</p></div><div class="nugget-popup"><p>Identified as a potential location to increase water storage capacity (as part of the Decoy Brook CDA) to reduce downstream flood risk, indicating the heath extension contributes to or is affected by brook flooding impacts. [PAG] (p54)</p></div><div class="nugget-popup"><p>Surface water from nearby roads (for example Wildwood Road and areas uphill) was routed/drained into Hampstead Heath Extension, prompting investigation to increase storage capacity on the Heath and its Extension to reduce surface water in roads and pressure on the drainage network. [PAG] (p55)</p></div></div></body></div>`)[0];

                var html_19030f032ec7f26fad1667fde2c0d5a0 = $(`<div id="html_19030f032ec7f26fad1667fde2c0d5a0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hampstead Heath</h1><div class="nugget-popup"><p>Ground on Hampstead Heath became saturated during the 12th July 2021 storm, producing overland flows that were directed downhill onto Wildwood Road and contributed to the surface water flooding of the road. (p42)</p></div><div class="nugget-popup"><p>A watercourse on the Hampstead Heath Extension is described as the origin of a westward flow path; it is culverted to the Decoy Brook and onward to the River Brent. This flow path contributed to a high risk of surface water flooding downstream (notably toward Golders Green) during the 12 July 2021 storm. [IMG,PAG] (p44)</p></div><div class="nugget-popup"><p>Surface water runoff from saturated ground on Hampstead Heath Extension and a culverted watercourse likely flowed at capacity and contributed flows into the local surface water drainage network. These flows routed down Middleton Road toward Finchley Road and Hoop Lane and contributed to surcharging of sewers and ponding at the topographic low at the junction of Hoop Lane and Finchley Road. (p46)</p></div></div></body></div>`)[0];

                var html_12dfd9545d2f4a5d90a3096d1c37be47 = $(`<div id="html_12dfd9545d2f4a5d90a3096d1c37be47" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>East Finchley Allotments</h1><div class="nugget-popup"><p>Two small watercourses that align with the identified surface&ndash;water flow paths travel through the East Finchley Allotments toward Islington and St Pancras Cemetery. The report notes that a sewer (via Hertford/Durham Road) eventually discharges into a watercourse in the allotments; these watercourses and flow paths concentrate surface water and were implicated in the surface&ndash;water flooding associated with the 12th July 2021 incidents. [PAG] (p30)</p></div></div></body></div>`)[0];

                var html_9fd7410da27aa423f18ccfaff300163a = $(`<div id="html_9fd7410da27aa423f18ccfaff300163a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Golders Hill Park</h1><div class="nugget-popup"><p>Identified as the upstream area from which surface water flowed east&ndash;to&ndash;west towards Childs Hill and Hendon Way; runoff from the park is described as contributing to surcharging of the surface water sewer network and localised surface&ndash;water flooding during the 12 July 2021 event. (p47)</p></div><div class="nugget-popup"><p>Forms part of a surface&ndash;water flow path flowing east&ndash;west toward Hendon Way that contributes to surface water flooding in the Childs Hill area; contains surface water sewer infrastructure (a 375mm sewer) and lies within areas mapped as at&ndash;risk by EA RoFSW. [PAG] (p48)</p></div></div></body></div>`)[0];

                var html_d0c1c0b47bf9595cbc812e4f40f2547f = $(`<div id="html_d0c1c0b47bf9595cbc812e4f40f2547f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Mutton Brook</h1><div class="nugget-popup"><p>High water levels in Mutton Brook during the 12 July 2021 event reduced discharge capacity for surface water sewers, contributing to sewer surcharge and increased flooding risk in adjacent areas. (p3)</p></div><div class="nugget-popup"><p>Flooding associated with the Mutton Brook affected its functional floodplain, prompting recommendations to discourage unpermitted development on the floodplain and to investigate re&ndash;naturalisation to reduce flood risk. (p4)</p></div><div class="nugget-popup"><p>The investigation includes Mutton Brook flood incidents and a figure titled 'Mutton Brook fluvial flood risk', indicating river (fluvial) flooding from Mutton Brook contributed to reported flood incidents during the event. [PAG] (p8)</p></div><div class="nugget-popup"><p>Flooding incidents occurred within the Mutton Brook area affecting multiple streets: highway flooding at Bute Mews and Kingsley Close, an external (property/exterior) incident at Norrice Lea, and an internal property incident at The Bishops Avenue. [TAB] (p21)</p></div><div class="nugget-popup"><p>Flooding associated with Mutton Brook affected nearby areas: internal property flooding on Falloden Way and The Bishops Avenue, external flooding of a driveway and garden on Norrice Lea, highway flooding reports for Bute Mews and Kingsley Way, and flooding of Lyttleton Playing Fields, Northway Tennis Centre and Northway Gardens. [PAG] (p32)</p></div><div class="nugget-popup"><p>Flood incidents clustered along Mutton Brook led to surface water ponding and flooding of adjacent green spaces and nearby properties/roads. Reported impacts included internal flooding of properties, external flooding of a driveway and garden, and highway flooding on nearby streets. [IMG,PAG] (p33)</p></div><div class="nugget-popup"><p>The brook flows through Northway Gardens and Lyttleton Playing Fields and is described as influencing local surface water and fluvial flood risk; it is associated with flooding incidents in adjacent green spaces and properties during the 12 July 2021 event. [PAG] (p34)</p></div><div class="nugget-popup"><p>Recorded clusters of external, highway and internal flood incidents located along and adjacent to the Mutton Brook (concentrated near Hampstead Garden Suburb). Flood Zone 3 lies tightly along the brook with Flood Zone 2 extending further into adjacent areas (Northway Gardens, Lyttleton Playing Fields). [PAG,IMG] (p36)</p></div><div class="nugget-popup"><p>Fluvial flooding along the Mutton Brook resulted in clustered flood incidents adjacent to the watercourse (internal, external and highway incidents were recorded on the map). The brook&#8217;s low path concentrated runoff towards the channel and is associated with multiple recorded flood markers in the mapped area. [IMG,PAG] (p37)</p></div><div class="nugget-popup"><p>Mutton Brook acted as the downstream receptor for surface water and the local surface water sewer network (the 1,220mm sewer discharges into it). Its channel lies at a local low point, concentrating runoff and being associated with flood incidents in the area during the event. [PAG] (p38)</p></div><div class="nugget-popup"><p>Water within the Mutton Brook exceeded the capacity of the channel; fluvial flooding from the brook likely contributed to local flooding and raised water levels that reduced the ability of surface water sewers to discharge, contributing to surcharging of the sewer network. [PAG] (p39)</p></div><div class="nugget-popup"><p>Mutton Brook is identified as a key source/contributor to flooding in the area: water levels likely rose and exceeded channel capacity, reducing the ability of surface water sewers to discharge, contributing to sewers surcharging and to local internal and highway flooding nearby. (p40)</p></div><div class="nugget-popup"><p>Mutton Brook overtopping/floodplain interaction caused flooding issues during the investigated event, affecting adjacent open spaces and prompting recommendations to re&ndash;naturalise channel sections and to prevent encroachment onto the functional floodplain to reduce future flood risk. (p54)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>40 reports of flooding borough&ndash;wide; 17 reports of internal flooding; 4 reports of external flooding; 19 reports of highway flooding (p3)</p></div><div class="nugget-popup quant"><p>Bute Mews: 1 incident (highway); Kingsley Close: 1 incident (highway); Norrice Lea: 1 incident (external); The Bishops Avenue: 1 incident (internal) [TAB] (p21)</p></div><div class="nugget-popup quant"><p>two internal flooding incidents; one external report; two highway reports [PAG] (p32)</p></div><div class="nugget-popup quant"><p>2 internal incidents; 1 external report; 2 highway reports [IMG,PAG] (p33)</p></div><div class="nugget-popup quant"><p>7 discharge points [PAG,IMG] (p36)</p></div></div></body></div>`)[0];

                var html_70fc74819383a2c4ae7ac259e19df95e = $(`<div id="html_70fc74819383a2c4ae7ac259e19df95e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Borough of Barnet</h1><div class="nugget-popup"><p>On 12 July 2021 heavy rainfall caused widespread flooding across the London Borough of Barnet. The borough received 40 reports of flooding (17 internal, 4 external and 19 highway). The evidence indicates the sewer network became overwhelmed due to lack of capacity and high surface&ndash;water runoff, causing internal, external and highway flooding. High water levels in the Mutton Brook reduced discharge from surface water sewers and further impacted sewer capacity. [PAG] (p3)</p></div><div class="nugget-popup"><p>The borough experienced multiple flood incidents on 12th July 2021, including culvert/trash&ndash;screen issues on Shirebourne Brook (Chipping Barnet), surface&ndash;water accumulation at King George's Fields (Chipping Barnet), surface&ndash;water/sewer flooding issues around Hertford Road and Oakview Gardens (East Finchley), drainage failures affecting Bute Mews and Kingsley Close (Mutton Brook corridor), surface&ndash;water flow&ndash;path issues on Wildwood Road (Hampstead Garden Suburb), and storage/capacity concerns on Decoy Brook/Hampstead Heath (Golders Green). [PAG] (p4)</p></div><div class="nugget-popup"><p>The report records reported flood incidents in the borough (figures reference a 'Chipping Barnet flood incident' and 'Location of reported flood incidents from 12'), indicating the borough experienced flooding during the event described in the document. [PAG] (p7)</p></div><div class="nugget-popup"><p>Flooding incidents occurred across Barnet as a result of the intense rainfall on 12 July 2021; the Section 19 report investigated those flooding incidents in the borough. [PAG] (p15)</p></div><div class="nugget-popup"><p>Intense rainfall on 12 July 2021 caused widespread surface water and sewer&ndash;related urban flooding across the borough, disrupting roads and causing internal flooding to properties in multiple locations. [PAG] (p16)</p></div><div class="nugget-popup"><p>The 12 July 2021 storm caused widespread disruption across the borough: roads were disrupted and properties experienced internal and external flooding. High river levels and sewer surcharging were noted as mechanisms contributing to flooding. [PAG,IMG] (p17)</p></div><div class="nugget-popup"><p>The borough experienced widespread flooding on 12 July 2021 driven by intense rainfall and rapid rises in local watercourses (Dollis Brook, River Brent and Pymmes Brook), which contributed to sewer outfall surcharge and surface water inundation affecting properties, property boundaries (gardens/driveways) and public highways. [IMG] (p20)</p></div><div class="nugget-popup"><p>Multiple internal, external and highway surface water flood incidents across the borough reported in the investigation tables. [TAB,PAG] (p21)</p></div><div class="nugget-popup"><p>Localized surface water / urban flooding in the Chipping Barnet area associated with the Shirebourne Brook corridor &mdash; areas of higher surface water flood risk were identified around King George's Fields, surrounding the Shirebourne Brook culvert near Bosworth Road and along Meadway; the surface water sewer network conveys flow eastwards beneath residential gardens towards Victoria Recreation Ground. [IMG,PAG] (p26)</p></div><div class="nugget-popup"><p>Two internal flooding incidents reported within the borough in the East Finchley area (properties at Oakview Gardens and Hertford Road experienced internal flooding during the heavy rainfall). [IMG,PAG] (p29)</p></div><div class="nugget-popup"><p>Surface water flood risk and sewer surcharge risk were identified in the Barnet area around Hertford Road, with a 225mm surface water sewer along Hertford Road joining a 400mm sewer in Durham Road that discharges into a watercourse in the East Finchley Allotments. These drainage and flow&ndash;path issues contributed to localised surface water flooding. [PAG,IMG] (p30)</p></div><div class="nugget-popup"><p>Residential areas of East Finchley within the London Borough of Barnet experienced clustered internal/roadway flood incidents during the 12th July 2021 storm. Surface water ponding and sewer network surcharge (notably along Hertford Road) were identified as local flood mechanisms; blocked gullies by storm&ndash;washed debris reduced drainage capacity. [IMG,PAG] (p31)</p></div><div class="nugget-popup"><p>Surface water flooding on 12 July 2021 produced multiple incidents within the borough linked to Mutton Brook and overwhelmed surface water sewers beneath roads, causing ponding, internal property flooding (ground/basement levels), external driveway/garden flooding, and highway flooding in the affected area. [PAG,IMG] (p33)</p></div><div class="nugget-popup"><p>The London Borough of Barnet contained multiple recorded flood incidents along the Mutton Brook during the event; the Section 19 report and map cover these incidents within the borough. [PAG,IMG] (p36)</p></div><div class="nugget-popup"><p>Mutton Brook flood incidents were recorded within the borough, concentrated in the Hampstead Garden Suburb area (internal, external and highway incidents associated with Mutton Brook). [PAG,IMG] (p37)</p></div><div class="nugget-popup"><p>Parts of the borough (including Hampstead Garden Suburb and areas along Mutton Brook) experienced surface water pooling, sewer network surcharging and fluvial overflow that contributed to internal and highway flooding of properties and roads. [IMG] (p40)</p></div><div class="nugget-popup"><p>Surface water flooding occurred within Hampstead Garden Suburb of the borough, driven by runoff from Hampstead Heath towards the Mutton Brook. Local streets (notably Wildwood Road, Meadway and Kingsley Way) were identified at high risk; Wildwood Road in particular was observed to pond at its northern end where road camber, banking and a relatively flat section prevent flow onto the Heath. Thames Water Utilities Limited (TWUL) modelling indicated the surface water sewer on Wildwood Road is at risk of surcharge for a 1 in 2&ndash;year event, which could have contributed to surface water overtopping and ponding. An internal flood incident is marked within the suburb on the investigation map. [IMG] (p41)</p></div><div class="nugget-popup"><p>An internal flood incident occurred within the borough in the Hampstead Garden Suburb area: surface water runoff and overwhelmed sewers caused ponding and flooding on Wildwood Road and nearby locations. [IMG,PAG] (p42)</p></div><div class="nugget-popup"><p>Multiple surface water and sewer&ndash;related flooding impacts across the borough on 12 July 2021: ponding at lower elevations where surface water could not drain to the surface water sewer network; Wildwood Road experienced a combination of high surface water runoff and an overwhelmed sewer network with overland flows directed downhill from saturated ground at Hampstead Heath; Meadway surface water sewer likely at capacity exacerbating local ponding; Golders Green area recorded internal flooding incidents. [IMG] (p43)</p></div><div class="nugget-popup"><p>Cluster of internal property flood incidents in the Golders Green area. Ponding at lower elevations was exacerbated by an inability to drain to the surface water network and by surface water sewers reaching/exceeding design capacity during the storm on 12 July 2021, contributing to internal flooding. [PAG,IMG] (p44)</p></div><div class="nugget-popup"><p>Internal surface water flood incidents in the Golders Green area of the borough were concentrated near the intersection of Golders Green Road and Finchley Road. Flows from higher ground (Hampstead Heath Extension) routed along Middleton Road and intersected Finchley Road/Hoop Lane, leading to ponding at the low point and localized internal flooding where the drainage network was unable to accept flows. [PAG,IMG] (p46)</p></div><div class="nugget-popup"><p>Localised surface&ndash;water flooding occurred across parts of the borough on 12 July 2021, including reported internal flooding in Childs Hill (West Heath Road and Hodford Road) and mapped internal incidents; surface&ndash;water runoff and sewer surcharge caused ponding at topographic low points. [IMG] (p47)</p></div><div class="nugget-popup"><p>The borough contains the Childs Hill area where surface water flood incidents were recorded and where EA RoFSW shows high surface&ndash;water flood risk; local roads (Hodford Road, Finchley Road, West Heath Road) are identified as locations at risk of sewer surcharge and surface water accumulation contributing to flooding in the borough. [IMG] (p48)</p></div><div class="nugget-popup"><p>Parts of the Barnet area (Childs Hill) were affected by surface water ponding and runoff from higher elevations that could not drain to the sewer network. [IMG,PAG] (p49)</p></div><div class="nugget-popup"><p>Multiple external and highway flood incidents across the borough on 12 July 2021 caused by surface water ponding and surface water sewers surcharging where they could not discharge to watercourses; roads and some properties were flooded, and the council provided sandbags and officers attended affected sites. [PAG,IMG] (p51)</p></div><div class="nugget-popup"><p>Widespread flooding on 12th July 2021 from an intense rainfall event caused surface water ponding at low points, flow paths and road junctions. Surcharging sewers prevented drainage in several locations and, where receiving watercourses were high, discharge was prevented leading to sewer backing&ndash;up and combined sewer/surface water flooding across multiple locations. [PAG] (p53)</p></div><div class="nugget-popup"><p>The borough experienced surface water and sewer&ndash;related flooding across multiple catchments during the investigated event, prompting borough&ndash;wide recommendations to reduce surface water runoff and improve drainage capacity. [PAG] (p54)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>40 reports of flooding; 17 reports of internal flooding; 4 reports of external flooding; 19 reports of highway flooding [PAG] (p3)</p></div><div class="nugget-popup quant"><p>40 reports of flooding; 17 reports of internal flooding; 4 reports of external flooding; 19 reports of highway flooding [PAG] (p16)</p></div><div class="nugget-popup quant"><p>40 reports of flooding; 17 reports of internal flooding; 4 reports of external flooding; 19 reports of highway flooding [PAG,IMG] (p17)</p></div><div class="nugget-popup quant"><p>40 reported incidents; 17 internal, 4 external, 19 highway. [IMG] (p20)</p></div><div class="nugget-popup quant"><p>Multiple incidents across borough (see street&ndash;level entries) [TAB,PAG] (p21)</p></div><div class="nugget-popup quant"><p>2 reports of internal flooding [IMG,PAG] (p29)</p></div><div class="nugget-popup quant"><p>two flood reports [PAG,IMG] (p30)</p></div><div class="nugget-popup quant"><p>2 internal incidents; 1 external report; 2 highway reports [PAG,IMG] (p33)</p></div><div class="nugget-popup quant"><p>seven discharge points [PAG,IMG] (p36)</p></div><div class="nugget-popup quant"><p>1 internal flood incident [IMG] (p41)</p></div><div class="nugget-popup quant"><p>1 internal flood incident [IMG,PAG] (p42)</p></div><div class="nugget-popup quant"><p>8 reports of internal flooding [IMG] (p43)</p></div><div class="nugget-popup quant"><p>8 reports of internal flooding [PAG,IMG] (p44)</p></div><div class="nugget-popup quant"><p>2 internal flood incidents [IMG] (p47)</p></div><div class="nugget-popup quant"><p>2 flood incidents [IMG] (p48)</p></div><div class="nugget-popup quant"><p>19 further reported incidents [PAG,IMG] (p51)</p></div><div class="nugget-popup quant"><p>40 flooding reports; 17 internal flooding reports; 4 external flooding reports; 19 highway flooding reports [PAG] (p53)</p></div></div></body></div>`)[0];

                var html_fc9ec830671c20c4b2e893ec601d8456 = $(`<div id="html_fc9ec830671c20c4b2e893ec601d8456" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Brent</h1><div class="nugget-popup"><p>Elevated River Brent water levels were recorded on 12 July 2021 (figure cited) in association with the flood event and reported incidents. (p8)</p></div><div class="nugget-popup"><p>River Brent water levels rose substantially on 12th July 2021 (afternoon/evening), increasing flood risk locally and contributing to conditions that reduced the ability of surface water sewers to discharge to the watercourse, increasing surcharging and flood impacts in adjacent areas. [PAG,IMG] (p17)</p></div><div class="nugget-popup"><p>Water levels in the River Brent (Brent Cross gauge) rose on 12th July 2021 from 0.09 m at 12:00 to 1.14 m at 18:30 (an increase of 1.05 m), reflecting a substantial river&ndash;level response to the afternoon rainfall. [PAG] (p18)</p></div><div class="nugget-popup"><p>Water levels in the River Brent rose rapidly on 12th July 2021, starting after 15:30 and peaking in the early evening. The rapid rise was recorded at the Brent Cross gauge and is identified in the report as being in proximity to reported flood locations in the borough. [PAG,IMG] (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>rose from around 0.09 metres at 12:00 to 1.14 metres at 18:30 (increase of 1.05 metres) [PAG,IMG] (p17)</p></div><div class="nugget-popup quant"><p>increase of 1.05m; peak 1.14m [PAG] (p18)</p></div><div class="nugget-popup quant"><p>increase of 1.05 m; peak 1.14 m [PAG,IMG] (p19)</p></div></div></body></div>`)[0];

                var html_c01d6c964c7d623225356c8fe6123707 = $(`<div id="html_c01d6c964c7d623225356c8fe6123707" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hoop Lane, Golders Green</h1><div class="nugget-popup"><p>Residential street heavily flooded: water covered the road and part of the footway, reaching the base of a wooden fence. Flooding impeded vehicle and pedestrian movement and affected parked cars and adjacent houses visible in the scene. [IMG] (p1)</p></div><div class="nugget-popup"><p>Subject to surface water flooding / risk of surface water flooding; identified as requiring improved sewer capacity to reduce surface water risk and pressure on the drainage network during high rainfall. (p5)</p></div><div class="nugget-popup"><p>Internal flooding of properties reported on Hoop Lane. [TAB] (p21)</p></div><div class="nugget-popup"><p>Internal flooding of properties on or adjacent to Hoop Lane caused by surface water runoff and sewers exceeding capacity during the storm. [IMG] (p43)</p></div><div class="nugget-popup"><p>Hoop Lane contains a topographical low point where multiple surface water sewers converge; the report identifies this junction (Hoop Lane and Finchley Road) as a likely ponding location where surface water would collect because the sewers were surcharged, causing localised flooding. [PAG] (p46)</p></div><div class="nugget-popup"><p>Surface water ponded at the topographical low point at the junction with Finchley Road due to flows from higher ground and surcharge of the surface water sewer network. (p47)</p></div><div class="nugget-popup"><p>Surface water flooding affected the road, contributing to risk of carriageway flooding and placing pressure on the drainage/sewer network; prompted recommendation for sewer capacity improvements and increased permeable surfacing/SuDS. (p55)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>6 incidents [TAB] (p21)</p></div><div class="nugget-popup quant"><p>8 reports of internal flooding across the Golders Green area affecting Middleton Road, Finchley Road and Hoop Lane. [IMG] (p43)</p></div></div></body></div>`)[0];

t risk of surcharge (1&ndash;in&ndash;2&ndash;year event), which contributed to highway ponding and local flooding during the heavy rainfall on 12th July 2021. [PAG] (p31)</p></div><div class="nugget-popup"><p>Hertford Road was affected by surface water and sewer&ndash;related flooding during the event, prompting recommendations to increase permeable surfacing locally and to consider sewer capacity improvements to reduce flood risk. (p54)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 incident [TAB] (p21)</p></div><div class="nugget-popup quant"><p>one internal flood report [PAG,IMG] (p29)</p></div></div></body></div>`)[0];

th resulted in downhill flows along Wildwood Road, ponding at lower elevations and localised flooding of the carriageway and adjacent properties. [PAG] (p43)</p></div><div class="nugget-popup"><p>Identified as a flow path for surface water where runoff causes pressure on the drainage network; measures are recommended to interrupt flow paths and increase sewer/drain capacity to reduce road flooding. (p54)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 incident [TAB] (p21)</p></div><div class="nugget-popup quant"><p>one report of internal flooding [PAG] (p39)</p></div><div class="nugget-popup quant"><p>1 report of internal flooding [PAG,IMG] (p40)</p></div></div></body></div>`)[0];

nt near the centre of the study area and another to the northeast; these surface&ndash;water flow paths follow local watercourses and low&ndash;lying streets and posed a risk to nearby community infrastructure. [IMG,PAG] (p30)</p></div><div class="nugget-popup"><p>The investigation and map show clustered internal flood incidents across residential parts of East Finchley associated with the intense rainfall on 12th July 2021; incidents appear correlated with the local sewer network and resulted in internal/urban flooding in the neighbourhood. [IMG,PAG] (p31)</p></div><div class="nugget-popup"><p>Areas of East Finchley (notably Hertford Road and Oakview Gardens) experienced surface water and sewer&ndash;capacity&ndash;related flooding during the event; recommendations include increasing permeable surfacing and sewer network capacity and confirming drainage infrastructure. (p54)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>40 reports of flooding borough&ndash;wide; 17 reports of internal flooding; 4 reports of external flooding; 19 reports of highway flooding (p3)</p></div><div class="nugget-popup quant"><p>3 incidents [TAB] (p21)</p></div><div class="nugget-popup quant"><p>two reports of internal flooding [PAG] (p28)</p></div><div class="nugget-popup quant"><p>two internal flood reports [IMG,PAG] (p29)</p></div><div class="nugget-popup quant"><p>two flood reports [IMG,PAG] (p30)</p></div></div></body></div>`)[0];

                var html_758810067005cfa45aa52d1799040ddd = $(`<div id="html_758810067005cfa45aa52d1799040ddd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hampstead Garden Suburb</h1><div class="nugget-popup"><p>High runoff during the 12 July 2021 event overwhelmed sewer capacity, causing sewer and surface water flooding impacts in Hampstead Garden Suburb. (p3)</p></div><div class="nugget-popup"><p>Surface water flooding affected Wildwood Road in Hampstead Garden Suburb, leading to recommendations for sustainable drainage measures, sewer capacity improvements, and consideration of enabling drainage into Hampstead Heath Extension with additional storage to reduce road flooding and pressure on the drainage network. (p4)</p></div><div class="nugget-popup"><p>Flood incident reported in Hampstead Garden Suburb on 12th of July 2021; incidents were mapped against the Environment Agency RoFSW (surface water) dataset and the Thames Water (TWUL) sewer network indicating surface&ndash;water and sewer&ndash;related flooding impacts to the area. [PAG] (p8)</p></div><div class="nugget-popup"><p>Internal property flooding reported in the Hampstead Garden Suburb area at Wildwood Road. [TAB] (p21)</p></div><div class="nugget-popup"><p>Surface water flooding associated with Mutton Brook affected parts of the suburb: green spaces (Lyttleton Playing Fields, Northway Gardens) and nearby roads and properties were flooded. Specific impacts recorded included internal property flooding on Falloden Way and The Bishops Avenue, external flooding at a property on Norrice Lea, and highway flooding at Bute Mews and Kingsley Way. [IMG] (p33)</p></div><div class="nugget-popup"><p>Recorded flood incidents (internal, highway and external) were concentrated along the Mutton Brook in the vicinity of Hampstead Garden Suburb during the event, as shown on the report map. [IMG] (p36)</p></div><div class="nugget-popup"><p>Clustered Mutton Brook&ndash;related flood incidents (internal, external and highway) occurred along and near the Mutton Brook within Hampstead Garden Suburb, affecting streets and properties close to the watercourse. [IMG] (p37)</p></div><div class="nugget-popup"><p>There was one reported internal flooding incident in the area associated with Wildwood Road. [PAG] (p39)</p></div><div class="nugget-popup"><p>Area experienced an internal flooding incident during the event; the report identifies one internal flood report in this part of Hampstead Garden Suburb (relating to Wildwood Road) and a mapped internal flood incident near Meadway/Constable Close. [IMG,PAG] (p40)</p></div><div class="nugget-popup"><p>An internal surface&ndash;water flood incident was recorded within the suburb during the investigation. Surface water routed from Hampstead Heath towards the Mutton Brook, flowing along streets (including Kingsley Way, Meadway and Wildwood Road) and leading to ponding where sewers were at capacity; ponding was noted at the northern end of Wildwood Road due to road camber and banking which impeded drainage to the Heath. [IMG,PAG] (p41)</p></div><div class="nugget-popup"><p>An internal flood incident was reported in the Hampstead Garden Suburb area on 12th July 2021. Surface water runoff from higher ground flowed through the suburb and was unable to drain to the surface water sewer network, contributing to local flooding; sewer capacity was exceeded during the event. [IMG,PAG] (p42)</p></div><div class="nugget-popup"><p>Area affected by surface water flow paths (notably Wildwood Road) that contribute to surface water flooding and overload the drainage network; recommendations target SuDS and conveying surface water away to reduce road flooding. (p54)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>40 reports of flooding borough&ndash;wide; 17 reports of internal flooding; 4 reports of external flooding; 19 reports of highway flooding (p3)</p></div><div class="nugget-popup quant"><p>Wildwood Road: 1 incident [TAB] (p21)</p></div><div class="nugget-popup quant"><p>2 internal incidents; 1 external report; 2 highway reports [IMG] (p33)</p></div><div class="nugget-popup quant"><p>one report of internal flooding [PAG] (p39)</p></div><div class="nugget-popup quant"><p>1 internal flood report [IMG,PAG] (p40)</p></div><div class="nugget-popup quant"><p>one internal flood incident [IMG,PAG] (p42)</p></div></div></body></div>`)[0];
