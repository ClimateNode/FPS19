                var html_9935e80ce562860dc124695e2acb1359 = $(`<div id="html_9935e80ce562860dc124695e2acb1359" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bury Road, Lawshall</h1><div class="nugget-popup"><p>Site of a flood event that prompted a Section 19 investigation by the Lead Local Flood Authority (Suffolk County Council). (p1)</p></div><div class="nugget-popup"><p>Deep surface water (>0.3 m) occurred in two locations on Bury Road. At the junction of Bury Road/Lawshall Row up to Windsor Close (referred to as Bury Rd South) five properties were severely affected (including sewer flooding at Bury Rd South). On the northern section of Bury Road (Bury Rd North) over a 20 m length two properties were severely affected. [PAG] (p2)</p></div><div class="nugget-popup"><p>Two sections of Bury Road were affected: Bury Rd South (junction of Bury Road/Lawshall Row up to Windsor Close) experienced deep surface water (>0.3m) and sewer discharge causing internal and external property flooding; Bury Rd North (northern section of Bury Road) experienced deep surface water leading to severe property flooding. Both sections had temporary road closures. [PAG] (p3)</p></div><div class="nugget-popup"><p>Sewer surcharge and overloaded drainage caused surface water and sewer flooding along Bury Road. Two manhole covers were lifted by surcharge pressure. Gullies (three) at Bury Road North are prone to overloading during intense storms; approximately 500m of Bury Road has no road drainage, contributing to ponding and flow towards the low point. At Bury Road South the pumping station and sewer were overloaded, contributing to internal flooding of houses. Reduced capacity of the main drainage channel (a 25m length of 225mm culvert) caused throttling of flows. [PAG] (p4)</p></div><div class="nugget-popup"><p>Properties on Bury Rd South were internally flooded; road drainage and kerb heights at dropped kerbs in front of doors contributed to water entry. Recommendations include reinstating kerb heights, improving grips and gullies, clearing adjacent watercourse and upgrading pumping station to reduce future flooding. [TAB,PAG] (p5)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 properties; 2 properties; &gt;0.3 m deep surface water; 20 m [PAG] (p2)</p></div><div class="nugget-popup quant"><p>5 properties; 2 properties [PAG] (p3)</p></div></div></body></div>`)[0];

                var html_25db8f862180a4f002594a06a8c9776c = $(`<div id="html_25db8f862180a4f002594a06a8c9776c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Suffolk</h1><div class="nugget-popup"><p>The flood event on 19 September 2014 in Suffolk (Lawshall, Bury Road) produced deep surface water (>0.3 m) in two low points of the local sub&ndash;catchments, severely affecting 5 properties at Bury Rd South (including sewer flooding) and 2 properties at Bury Rd North; criteria indicate a major transport route was closed for more than 10 hours during the incident. [TAB] (p2)</p></div><div class="nugget-popup"><p>Deep surface water (>0.3 m) and sewer discharge caused internal and external flooding to properties at two low points on Bury Road: (1) Bury Rd South &mdash; the junction of Bury Road/Lawshall Row up to Windsor Close (severe impacts, also sewer flooding and overloaded pumping station); (2) Bury Rd North &mdash; northern section of Bury Road for ~20 m (severe impacts). Manhole covers were lifted near the pumping station. Temporary road closures occurred at both locations. [IMG] (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 properties; 2 properties; &gt;0.3 m; &gt;10 hours [TAB] (p2)</p></div><div class="nugget-popup quant"><p>5 properties; 2 properties; 2 locations with deep surface water (>0.3 m) [IMG] (p3)</p></div></div></body></div>`)[0];
