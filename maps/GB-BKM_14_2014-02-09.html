                var html_897f06ef1ca18f94122d4de68791a9f3 = $(`<div id="html_897f06ef1ca18f94122d4de68791a9f3" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Willowbank Island</h1><div class="nugget-popup"><p>Internal flooding of residential properties and business premises in the Willowbank area caused by overflow/interaction of the River Colne channels (branches, weirs and sluices) around the residential area. [PAG] (p6)</p></div><div class="nugget-popup"><p>Fluvial (river) flooding in February 2014 caused by over&ndash;topping of river banks and of a low flood&ndash;defence bund; resulted in defined flow routes and inundation across the Willowbank and Oakside residential area. [PAG] (p19)</p></div><div class="nugget-popup"><p>River overtopping/outflow occurred near the gauging station weir at the northern end of Willowbank Island; water then flowed overland from that location into downstream Oakside areas. (p20)</p></div><div class="nugget-popup"><p>Rising river levels and a reported possible blockage at the southern end prompted response. Bucks Flood & Rescue Service opened the Allied Mills sluice at Kings Mill Cottage which resulted in upstream levels dropping. Debris on the access bridge indicated water reached over the soffit level. Sandbags were requested to protect low spots in the Willowbank recreation area. (p22)</p></div><div class="nugget-popup"><p>Surface&ndash;water flooding occurred in the Willowbank recreation area; site operative requested sandbags to protect two low spots and locations were passed to the response gang. Initial flooding in Willowbank was caused by surface water that could not drain away due to poorly maintained drainage channels and then exacerbated by high river levels. [TAB,PAG] (p23)</p></div><div class="nugget-popup"><p>River Colne passes through New Denham and around Willowbank (classified as Main River); fluvial flood risk is identified and local open surface water ditches and piped systems (feeding from Alder Road, Willow Avenue and Hawthorn Drive) can back up and deliver water into properties. (p24)</p></div><div class="nugget-popup"><p>The area between Poplar Road and High Bridge is at high flood risk. Parts are protected by flood defences (designed to 1 in 100 year) which prevented internal flooding within the defended area, but defences did overtop at a location and caused external flooding of gardens. (p27)</p></div><div class="nugget-popup"><p>Initial flooding in the Willowbank area was from surface water that could not flow away because of high river levels, leading to inundation of the area and contributing to onward fluvial flooding. (p28)</p></div><div class="nugget-popup"><p>Floodwater entered private gardens on Willow Crescent West and Willow Avenue; embankment vulnerability adjacent to the Willowbank residential area was identified and recommendations were made to raise/strengthen embankments. [TAB] (p29)</p></div><div class="nugget-popup"><p>A breach of the river right bank upstream of the gauging weir occurred and surface water drainage/piped systems in the Willowbank area were affected, causing flooding risk to properties and businesses (including on Oxford Road). The event prompted surveys of the breached bank, investigations of the River Colne modelling and flood warning accuracy, and actions relating to the surface water system (ownership, CCTV inspection) to address flood impacts. (p30)</p></div><div class="nugget-popup"><p>Photographs taken in the Willowbank area document elevated river levels during the event, with water reaching the gauge board and coming close to the riverside footpath and nearby houses, indicating river flooding that threatened adjacent properties and vegetation. (p36)</p></div><div class="nugget-popup"><p>Reported overland flow route from the River Colne near the gauging station at the north of Willowbank Island contributed to flow paths across the island area and toward Oakside; area associated with sandbagging activity affecting nearby Oakside properties. (p43)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>five or more properties; two or more business premises [PAG] (p6)</p></div><div class="nugget-popup quant"><p>numbers 25&ndash;29; numbers 42&ndash;44; at least 4 properties (Willowbank and Oakside) [PAG] (p20)</p></div><div class="nugget-popup quant"><p>water level 32.61mAOD (p36)</p></div></div></body></div>`)[0];

                var html_2d15e4ae298c0d92cf3e3db136a275ea = $(`<div id="html_2d15e4ae298c0d92cf3e3db136a275ea" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>King's Island</h1><div class="nugget-popup"><p>Fluvial flooding and surface water ponding affected the island: residents sandbagged doors and garages on Willow Avenue, Willow Crescent West, Poplar Road and Alder Road; pumps were used at the northern end of the island to remove water; standing water accumulated at the northern end of the recreation ground after overtopping of the defence (flood kerbs exposed and topsoil eroded); the external area of Mill Stream Cottage (southern end of Willow Avenue) showed signs of both fluvial and foul sewer flooding. The flood defence between Poplar Road and Alder Road generally performed and prevented wider internal flooding of properties. (p18)</p></div><div class="nugget-popup"><p>Flooding prompted a requirement to determine and communicate the operating procedure for the King's Island sluice gates so the management company can operate them effectively to manage river discharge during floods. (p30)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>three properties; 16 Willow Avenue; 100&ndash;150mm topsoil erosion (p18)</p></div></div></body></div>`)[0];

                var html_4a3acfd7c8c6ed5218a7475251fc1c3e = $(`<div id="html_4a3acfd7c8c6ed5218a7475251fc1c3e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Colne</h1><div class="nugget-popup"><p>Branches and channels of the River Colne run through and around Willowbank (weirs, sluices and splits to the Grand Union canal); these channels were implicated in the flooding that caused internal flooding of properties and businesses in Willowbank. (p6)</p></div><div class="nugget-popup"><p>The River (Colne) reached elevated fluvial levels during the event; modelled flood level was approximately 1.278 m (between the 1 in 50&ndash;year and 1 in 100&ndash;year return periods). High river levels reduced the ability of local surface&ndash;water drains to discharge to the river, affecting drainage on Willowbank and adjacent areas; Environment Agency banks and the Willowbank weirs controlled and split flows around Willowbank island during the high flows. (p16)</p></div><div class="nugget-popup"><p>High flows in the River Colne flowed around King's Island and fed water into the Grand Union Canal, contributing to elevated canal levels and downstream flooding; a sluice next to King's Island main gate was opened (to manage flows). (p18)</p></div><div class="nugget-popup"><p>River Colne overflowed / conveyed floodwater into adjacent open land and along mapped flow routes, the water then flowed through car parks and along streets into properties on Oxford Road, the nearby pub and filling station. [IMG] (p21)</p></div><div class="nugget-popup"><p>Channel restrictions and lack of flood defences caused the river to back up through New Denham (around Willowbank), contributing to fluvial flooding and resulting in water backing up into properties via poor pipe overflow systems. (p24)</p></div><div class="nugget-popup"><p>River Colne was shown adjacent to a flood defence where flooding/interaction with the defence occurred; an overtopping location exposed the flood kerb and contributed to inundation of adjacent land. [IMG] (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>five or more properties; two or more business premises (p6)</p></div><div class="nugget-popup quant"><p>1.278 m; between 1 in 50&ndash;year and 1 in 100&ndash;year return period (p16)</p></div></div></body></div>`)[0];
                popup_eeaf03745234164c8f27ad98a2ff6f25.setContent(html_4a3acfd7c8c6ed5218a7475251fc1c3e);

                var html_38d71b8a556014cc29be843ff6fcdc41 = $(`<div id="html_38d71b8a556014cc29be843ff6fcdc41" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Oxford Road, Denham</h1><div class="nugget-popup"><p>The River Colne overtopped its banks and floodwater flowed into the area along Oxford Road; the channel overtopped and flowed into shops and houses on Oxford Road, causing inundation of properties and commercial premises. (p4)</p></div><div class="nugget-popup"><p>Oxford Road was within the estimated fluvial flood extent in February 2014; floodwater reached the road as a result of over&ndash;topping of banks/low flood defence bunds shown on the map, causing flooding of the carriageway and exposure of adjacent properties to floodwater. [IMG] (p19)</p></div><div class="nugget-popup"><p>Floodwater travelled down through car parks to properties on Oxford Road, flooding the parade of shops and causing internal flooding to businesses (including the hair salon and carpet shop), and affecting the pub and filling station. [PAG] (p20)</p></div><div class="nugget-popup"><p>Floodwaters followed flow routes into the parade of shops on Oxford Road, causing internal flooding to businesses (including the hair salon and Willow Carpets) and to nearby properties. [IMG,PAG] (p21)</p></div><div class="nugget-popup"><p>Rear of Oxford Road properties experienced floodwater ingress; some downpipes and soil vent pipes were in poor repair and flood water may have come up through these pipes into properties. A request was made for 6 sandbags to fill a gap at the rear of 20A Oxford Road to prevent water coming from the River Colne. [TAB] (p22)</p></div><div class="nugget-popup"><p>The parade of shops along Oxford Road were flooded due to high river levels, channel restrictions and poor pipe overflow systems that caused water to back up into properties. A request was made for 6 sandbags to protect a gap at the rear of 20A Oxford Road. [PAG] (p23)</p></div><div class="nugget-popup"><p>Internal flooding of properties and businesses along Oxford Road. The parade of shops had two properties flooded internally. River/mill&ndash;channel restrictions and likely surcharged sewer/surface&ndash;water outlets and soil vent pipes caused backing up into properties. The area is in Flood Zone 3 and is unprotected by defences. (p27)</p></div><div class="nugget-popup"><p>Business properties in the parade of shops along Oxford Road were flooded. Flooding was caused by backing up of flow due to surcharged and underwater soil vent pipes and surface&ndash;water outlets into the restricted mill channel/river, combined with high river (fluvial) levels; the area is in Flood Zone 3 and is undefended. [PAG] (p28)</p></div><div class="nugget-popup"><p>Business properties in the parade of shops along Oxford Road were flooded due to backing up of flows and poor pipe/overflow systems causing water to back up into properties. [TAB,PAG] (p29)</p></div><div class="nugget-popup"><p>Floodwater flowed through a gap beside the hair salon at 20a Oxford Rd and into the parade of shops/pavement; the gap is documented as a route by which flood water entered the property area. (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 4 properties; 20a (hair salon) [PAG] (p20)</p></div><div class="nugget-popup quant"><p>4 properties [IMG,PAG] (p21)</p></div><div class="nugget-popup quant"><p>4 properties flooded internally; 2 properties flooded internally (parade of shops) (p27)</p></div></div></body></div>`)[0];

                var html_3980f9b9ac69493cc92a3abb3f9e348d = $(`<div id="html_3980f9b9ac69493cc92a3abb3f9e348d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Oakside, Denham</h1><div class="nugget-popup"><p>Floodwater from the overtopped River Colne flowed down a field into the area around Oakside and inundated nearby properties; houses on Oxford Road and shops at Oxford Road were flooded when the river channel overtopped and flowed into shops. (p4)</p></div><div class="nugget-popup"><p>Fluvial (river) flooding in February 2014 caused by over&ndash;topping of river banks and of a low flood&ndash;defence bund; resulted in defined flow routes and inundation across the Willowbank and Oakside residential area. [PAG] (p19)</p></div><div class="nugget-popup"><p>Overbank river water emerging upstream near the gauging station flowed overland through Oakside. No internal flooding reported for some properties, but water reached door thresholds at numbers 25&ndash;29; sandbagging was present around properties and along the riverbank; car parks and gardens adjacent to the properties were inundated. Floodwater from fields then flowed to Oxford Road causing internal flooding of properties and businesses. [PAG] (p20)</p></div><div class="nugget-popup"><p>Fluvial floodwater from overtopping of the right bank flowed into a field and into the residential area around Oakside, inundating properties and streets. (p23)</p></div><div class="nugget-popup"><p>External flooding of gardens and roads in both Willowbank and Oakside. In Oakside, properties were close to internal flooding and outbuilding flooding occurred. Flooding in Oakside resulted from a breach of the river bank upstream of the weir which allowed water to flow through fields into Oakside and then toward Oxford Road. (p27)</p></div><div class="nugget-popup"><p>Residential area around Oakside was inundated when overtopped river water flowed from upstream (via the gauged weir location) into fields and the housing area, and flowed through onto Oxford Road. (p28)</p></div><div class="nugget-popup"><p>Sandbagging observed at Oakside residential properties (nos. 42&ndash;44); raised water level recorded at 2 Poplar Road; ponding and overland flow recorded in fields to the west indicating flow routes toward Oakside. [PAG] (p42)</p></div><div class="nugget-popup"><p>Residential properties adjacent to the river experienced high water levels; properties Nos. 42&ndash;44 were sandbagged to protect against flood water and photographs show ponding and river encroachment onto the bank beside houses. [IMG,PAG] (p43)</p></div><div class="nugget-popup"><p>Reported overland flow routes and ponding directed into the residential area; water tracked across paved areas and grass toward buildings. Significant sandbagging was undertaken around properties. [IMG,PAG] (p44)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>numbers 25&ndash;29; number 25; numbers 42&ndash;44; at least 4 properties [PAG] (p20)</p></div><div class="nugget-popup quant"><p>3 properties (nos. 42&ndash;44); 1 property (2 Poplar Rd) [PAG] (p42)</p></div><div class="nugget-popup quant"><p>3 properties (Nos. 42&ndash;44) sandbagged [IMG,PAG] (p43)</p></div></div></body></div>`)[0];

 from Alder Road south along Willow Avenue to Tudor Cottage to locate blockages or damage caused by the event. (p30)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>three properties; 16 Willow Avenue [PAG] (p18)</p></div></div></body></div>`)[0];

                var html_439f3cadcd25f439593580bdffc9319a = $(`<div id="html_439f3cadcd25f439593580bdffc9319a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Poplar Road, Denham</h1><div class="nugget-popup"><p>Sandbagging of doors and garages was observed along Poplar Road and Alder Road. The flood defence between Poplar Road and Alder Road was reported to be in order (no breach noted) during the event. (p17)</p></div><div class="nugget-popup"><p>Sandbagging observed at doors and garages; residents deployed sandbags and pumps which prevented internal flooding of properties at the corners of Poplar Road and Willow Avenue. Pumping was carried out from properties at the northern end of the island. Estate surface water ditches and drains were not cleared, contributing to local flooding issues. Flood defence nearby (between Poplar Road and Alder Road) performed and reduced fluvial impacts. (p18)</p></div><div class="nugget-popup"><p>River levels opposite Poplar Road were recorded high (gauge reading 32.61mAOD) and photographs show water close to the riverside path and fishing platform adjacent to Poplar Road, indicating river flooding impacted the riverside section of Poplar Road. [IMG] (p36)</p></div><div class="nugget-popup"><p>Surface water affected the property boundary/driveway area; a water&ndash;level measurement was taken at the base of a brick pillar beside the driveway, indicating inundation or elevated water at the property edge. (p41)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>32.61mAOD [IMG] (p36)</p></div></div></body></div>`)[0];

                var html_f6d39cc4a8a9f6aa33c52c1ff24e89c9 = $(`<div id="html_f6d39cc4a8a9f6aa33c52c1ff24e89c9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>New Denham</h1><div class="nugget-popup"><p>Following prolonged above&ndash;average rainfall ground was saturated and increased surface water entered highway drainage and main rivers. The River Colne was very high and overtopped its banks upstream of Willowbank; floodwater flowed across fields and into the area around Oakside and houses on Oxford Road. The river channel also overtopped alongside the shops on Oxford Road, with floodwater flowing into shops. (p4)</p></div><div class="nugget-popup"><p>The Willowbank residential area between two branches of the River Colne experienced internal flooding of properties; the Environment Agency surveyed the low bank upstream of Willowbank and contacted residents and the residents association to gather details and discuss options following the flood. [PAG] (p5)</p></div><div class="nugget-popup"><p>Area&ndash;wide flooding event affecting the New Denham locality (including Willowbank) with internal flooding of properties and business premises. [PAG] (p6)</p></div><div class="nugget-popup"><p>Flow in the river/channel was backed up due to lack of flood defences and channel restrictions (overbuilds and access tracks), and poor pipe overflow systems caused water to back up into properties. (p24)</p></div><div class="nugget-popup"><p>Heavy rainfall and saturated ground led to surface water flooding in roads and gardens; high river levels and poorly maintained channels prevented discharge. A breach of the right river bank upstream of the weir sent water through fields into Oakside and on to Oxford Road, contributing to internal flooding of properties. (p27)</p></div><div class="nugget-popup"><p>Garden areas on Willow Crescent West and Willow Avenue were inundated. The parade of shops on Oxford Road experienced internal flooding as business properties were flooded; the report attributes this to backing&ndash;up and poor pipe overflow systems allowing water into properties. [TAB] (p29)</p></div><div class="nugget-popup"><p>Properties and residents were impacted by flooding, prompting distribution of guidance, offers to assist with Repair and Renewal Grant applications, requests to revisit River Colne modelling and to check flood warning accuracy, and investigations including a survey of a breached right bank upstream of the gauging weir. (p30)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>internal flooding of five or more properties [PAG] (p5)</p></div><div class="nugget-popup quant"><p>five or more properties; two or more business premises [PAG] (p6)</p></div></div></body></div>`)[0];
