                var html_19a34ecdee0e0632b5d0ac35ab563c13 = $(`<div id="html_19a34ecdee0e0632b5d0ac35ab563c13" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Willow Brook</h1><div class="nugget-popup"><p>Surface water in the village drains to the Main River Willow Brook; the investigation into the 14th February 2014 event recorded internal flooding of one property in the new housing development at the north of Deenethorpe, with runoff discharging to Willow Brook. [PAG] (p9)</p></div><div class="nugget-popup"><p>Very high silt levels at the Deene Park lake inlet and very high water levels in Willow Brook upstream to Osier Bed Lane were observed; these high river levels caused backwater and contributed to standing water on nearby roads and ditches. (p10)</p></div><div class="nugget-popup"><p>Runoff and ponded surface water from Deenethorpe Lane drained via road gullies and verge grip drains into Willow Brook, increasing flows in the brook during the event. (p12)</p></div><div class="nugget-popup"><p>Willow Brook did not appear to flow or function satisfactorily due to manmade controls forming an artificial lake downstream of the A43, which affected water levels and reduced the brook's ability to receive surface water runoff from Deenethorpe, exacerbating local flooding issues. (p17)</p></div><div class="nugget-popup"><p>The brook was impeded by man&ndash;made controls forming an artificial lake downstream of the A43, causing elevated water levels around Osier Bed Lane and reducing the ability for surface water from Deenethorpe to drain into the watercourse. [PAG] (p18)</p></div><div class="nugget-popup"><p>High water level observed immediately upstream of the A43 road bridge and artificial lake, with water close to the base of the bridge arch, indicating limited clearance and risk of overflow. [IMG,PAG] (p48)</p></div><div class="nugget-popup"><p>Standing/stagnant water observed in nearby ditches and drainage features adjacent to Willow Brook; verge grips noted between Deenethorpe Lane and Willow Brook opposite the housing development, indicating local overland flow/runoff collecting towards the brook and nearby drainage. These conditions were recorded in association with the investigation of standing water on nearby carriageways. [IMG,PAG] (p49)</p></div><div class="nugget-popup"><p>Received discharge from the culvert outlet and the open water course; the channel from the culvert delivered pooled and flowing water into Willow Brook, increasing local flow and conveying sediment/vegetation from the outlet and channel. [IMG,PAG] (p51)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property [PAG] (p9)</p></div></div></body></div>`)[0];

                var html_a1005018856fe82a4e6ab9366a109f37 = $(`<div id="html_a1005018856fe82a4e6ab9366a109f37" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Deenethorpe Lane, Deenethorpe</h1><div class="nugget-popup"><p>A culvert with headwalls crossing Deenethorpe Lane (north of the housing development) was observed in poor condition with silted pipes and high water levels; field boundary ditches drain to this culvert allowing runoff to discharge to Willow Brook, contributing to flooding risk on/around the lane. (p10)</p></div><div class="nugget-popup"><p>Ponding occurred in Deenethorpe Lane as water from agricultural fields flowed toward properties; a culvert crossing Deenethorpe Lane to Willow Brook was observed with high water levels, silted pipes and poor maintenance. [TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Surface water flowed onto Deenethorpe Lane causing ponding across the carriageway until the water drained via road gullies or verge grip drains. (p12)</p></div><div class="nugget-popup"><p>Culvert system beneath Deenethorpe Lane discharged water at its outlet, forming a shallow pooled area and feeding an open, muddy channel that ran from the culvert towards Willow Brook. Verge grips and a road gully on Deenethorpe Lane (opposite the housing development) conveyed surface water towards the culvert outlet, creating flow and local pooling at the lane verge. [IMG,PAG] (p51)</p></div></div></body></div>`)[0];

                var html_f4b1f6aff3bc53a2599d9cf399f90c31 = $(`<div id="html_f4b1f6aff3bc53a2599d9cf399f90c31" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Osier Bed Lane, Deenethorpe</h1><div class="nugget-popup"><p>Areas of standing water were observed on the carriageway of Osier Bed Lane; stagnant standing water was also seen in roadside ditches alongside the lane, attributable to very high Willow Brook water levels upstream. (p10)</p></div><div class="nugget-popup"><p>Water levels around Osier Bed Lane were affected because Willow Brook did not function satisfactorily (due to downstream controls/artificial lake), which could impair the ability for surface water from Deenethorpe to drain into the brook and increase local flood risk. (p17)</p></div><div class="nugget-popup"><p>Standing water on the carriageway and stagnant water in adjacent roadside ditches, causing carriageway inundation, reduced access and hazards to vehicles and pedestrians; indicates poor drainage at the location. [IMG,PAG] (p48)</p></div></div></body></div>`)[0];

                var html_3836120cfc5ace5e42205bff40fd6498 = $(`<div id="html_3836120cfc5ace5e42205bff40fd6498" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Deenethorpe</h1><div class="nugget-popup"><p>Intense short&ndash;duration rainfall led to excess surface water flowing over ground to low points in the village because land drainage systems and watercourses could not convey the runoff, resulting in internal flooding of at least one property. [PAG] (p6)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration rainfall overwhelmed land drainage and watercourses so that excess surface water flowed to low points in the village, causing internal flooding to at least one property; the property has experienced internal flooding on more than one occasion in the five years prior to the investigation. [PAG] (p7)</p></div><div class="nugget-popup"><p>Internal flooding of a residential property in the new housing development at the north of the village. The property experienced internal flooding on 14th February 2014 and had been internally flooded on more than one occasion in the previous five years. (p9)</p></div><div class="nugget-popup"><p>Surface water from agricultural fields flowed into rear gardens of residential properties in the housing development north of Deenethorpe, flooding a patio and a garage, flowing to the front of properties and a shared private drive, and causing ponding in Deenethorpe Lane. On 14/02/14 a second property was confirmed affected. [TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Surface water from agricultural fields flowed into rear gardens of a housing development north of Deenethorpe. At two properties muddy surface water flowed over property boundaries at significant velocity, reaching approximately 100mm depth on patios. Surface water entered a garage covering the floor and putting an external air&ndash;source heating unit at risk. Large deposits of soil were left across a patio area and inside a garage requiring clearance. At a second property surface water and groundwater lifted slab paving at the rear requiring re&ndash;laying. Residents used sandbags to prevent water entering airbricks. (p12)</p></div><div class="nugget-popup"><p>Incident Plans (Appendix C) indicate reported routes of surface water across the village during the event. [PAG] (p13)</p></div><div class="nugget-popup"><p>Intense rainfall on a saturated catchment caused existing drainage systems, land drainage ditches and watercourses in Deenethorpe to be unable to cope, causing water to flow into other areas and drainage systems that could not manage the additional quantity of water. Run&ndash;off from agricultural land was a significant factor increasing flood volume and risk to vulnerable properties. (p17)</p></div><div class="nugget-popup"><p>Surface water runoff from Deenethorpe could not drain effectively to Willow Brook because the brook did not flow or function satisfactorily (see Willow Brook), increasing local flood risk. [PAG] (p18)</p></div><div class="nugget-popup"><p>Properties in Deenethorpe were affected by surface water runoff from neighbouring land and by the emergence of groundwater during the 14th February 2014 event. The report recommends reviewing drainage for the housing development north of Deenethorpe to confirm overland&ndash;flow mitigation measures were designed and implemented. (p21)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property (internal flooding) [PAG] (p6)</p></div><div class="nugget-popup quant"><p>one property; more than one occasion in the last 5 years [PAG] (p7)</p></div><div class="nugget-popup quant"><p>one property (p9)</p></div><div class="nugget-popup quant"><p>1 residential dwelling (patio and garage); a second property confirmed affected (total 2 properties); Five occurrences (December 2012) [TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup quant"><p>2 properties; ~100mm depth; 1 garage affected (p12)</p></div></div></body></div>`)[0];
