                var html_81d2e7c3a3dfdff27c0423fb9513a2af = $(`<div id="html_81d2e7c3a3dfdff27c0423fb9513a2af" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Willow Brook</h1><div class="nugget-popup"><p>Surface water in the village drains to the Main River Willow Brook; the investigation into the 14th February 2014 event recorded internal flooding of one property in the new housing development at the north of Deenethorpe, with runoff discharging to Willow Brook. [PAG] (p9)</p></div><div class="nugget-popup"><p>Very high water levels upstream to Osier Bed Lane and at the inlet to the Deene Park lake due to high silt levels; these high river levels contributed to standing water on nearby roads and ditches. (p10)</p></div><div class="nugget-popup"><p>Willow Brook did not function satisfactorily due to manmade controls forming an artificial lake downstream of the A43; this affected water levels and reduced the brook's ability to receive surface water from Deenethorpe, contributing to local flooding and drainage problems. (p17)</p></div><div class="nugget-popup"><p>Restricted flow due to manmade controls forming an artificial lake downstream of the A43 has elevated water levels around Osier Bed Lane and impaired the ability of surface water from Deenethorpe to drain into the brook, increasing local flood risk. [PAG] (p18)</p></div><div class="nugget-popup"><p>High water level immediately upstream of the A43 road bridge and artificial lake, with water nearly reaching the base of the bridge arch, indicating elevated river levels and risk of overflow. [IMG,PAG] (p48)</p></div><div class="nugget-popup"><p>An open water course was observed channeling muddy, active flow from the culvert outlet into Willow Brook, demonstrating hydrological connectivity and overland flow reaching the brook during the event. [IMG,PAG] (p51)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property [PAG] (p9)</p></div></div></body></div>`)[0];

                var html_441a2a9a028b7ba786d5e924fe5bbeb5 = $(`<div id="html_441a2a9a028b7ba786d5e924fe5bbeb5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Deenethorpe Lane, Deenethorpe</h1><div class="nugget-popup"><p>Ditch system north of the housing development and the culvert crossing Deenethorpe Lane were in poor condition with high water levels and silted pipes, reducing discharge to Willow Brook and impairing drainage. (p10)</p></div><div class="nugget-popup"><p>Ponding occurred in Deenethorpe Lane as water from agricultural fields and private drives accumulated; a ditch system and a culvert crossing Deenethorpe Lane to Willow Brook were observed with high water levels and silted pipes, contributing to drainage problems. [TAB,PAG] (p11)</p></div><div class="nugget-popup"><p>Surface water from properties and shared driveways flowed onto Deenethorpe Lane, causing ponding across the carriageway until the water drained via road gullies or verge grip drains. (p12)</p></div><div class="nugget-popup"><p>Culvert beneath Deenethorpe Lane discharged into a shallow muddy pool; road gully and verge grip conveyed surface water/runoff from the lane toward the culvert and downstream channel. Sediment accumulation and vegetation encroachment observed at the outlet and adjacent banks, with visible active flow indicating overland drainage and localised channelled surface&ndash;water flow during the event. [IMG,PAG] (p51)</p></div></div></body></div>`)[0];

                var html_e193398f869f4530a79eca19096ff306 = $(`<div id="html_e193398f869f4530a79eca19096ff306" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Osier Bed Lane, Deenethorpe</h1><div class="nugget-popup"><p>Areas of standing water were observed on the carriageway and stagnant standing water in ditches alongside Osier Bed Lane as a result of very high water levels in Willow Brook and silt&ndash;affected flow. (p10)</p></div><div class="nugget-popup"><p>Water levels around Osier Bed Lane were affected by the impaired functioning of Willow Brook, reducing the ability for surface water from Deenethorpe to drain into the brook and contributing to local flooding and drainage issues. (p17)</p></div><div class="nugget-popup"><p>Standing water present in the carriageway at Osier Bed Lane and stagnant water in adjacent ditches near the bridge, affecting the road and local drainage. [IMG] (p47)</p></div><div class="nugget-popup"><p>Standing water on the carriageway and stagnant water in adjacent roadside ditches, indicating poor drainage and water accumulation on the road surface. [IMG,PAG] (p48)</p></div></div></body></div>`)[0];

                var html_c8281f5a5af230b7df1abb59b5be5f9b = $(`<div id="html_c8281f5a5af230b7df1abb59b5be5f9b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Deenethorpe</h1><div class="nugget-popup"><p>Intense short&ndash;duration rainfall led to excess surface water flowing over ground to low points in the village because land drainage systems and watercourses could not convey the runoff, resulting in internal flooding of at least one property. [PAG] (p6)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration rainfall overwhelmed land drainage and watercourses so that excess surface water flowed to low points in the village, causing internal flooding to at least one property; the property has experienced internal flooding on more than one occasion in the five years prior to the investigation. [PAG] (p7)</p></div><div class="nugget-popup"><p>Internal flooding of a residential property in the new housing development at the north of the village. The property experienced internal flooding on 14th February 2014 and had been internally flooded on more than one occasion in the previous five years. (p9)</p></div><div class="nugget-popup"><p>Surface water from agricultural runoff flowed from fields into the rear gardens of residential properties in the housing development north of Deenethorpe, flooding patios and garages; water then flowed to the front of properties onto a shared private drive and caused ponding in Deenethorpe Lane. [TAB,PAG] (p11)</p></div><div class="nugget-popup"><p>Surface water from neighbouring agricultural fields flowed into rear gardens of a housing development north of Deenethorpe. At least two properties experienced muddy surface water overtopping property boundaries at significant velocity, reaching approximately 100mm depth on patios. One property had water enter and cover the garage floor and an external air&ndash;source heating unit was at risk of damage; large deposits of soil were left across a patio and inside the garage requiring clearance. At a second property the water (including groundwater emerging from a steep banked garden) lifted slab paving at the rear requiring re&ndash;laying. Residents used sandbags to prevent water entering airbricks at a neighbouring property. (p12)</p></div><div class="nugget-popup"><p>Reported routes of surface water were observed through the village during the flood event; the incident plans for the event indicate surface water flow paths through Deenethorpe. [PAG] (p13)</p></div><div class="nugget-popup"><p>Intense rainfall on a saturated catchment caused existing drainage systems, land drainage ditches and watercourses in Deenethorpe to be unable to cope. Surface water and runoff from agricultural land flowed through the housing development towards other drainage routes, causing flooding of vulnerable properties and local drainage failure. (p17)</p></div><div class="nugget-popup"><p>Surface water in the village could not drain effectively to the downstream watercourse because Willow Brook did not flow or function satisfactorily (manmade controls forming an artificial lake downstream of the A43 raised water levels), increasing local flood risk and impairing drainage from Deenethorpe. [PAG] (p18)</p></div><div class="nugget-popup"><p>Surface water runoff from neighbouring land and the emergence of groundwater affected residents in the village, creating flood risk to properties. (p21)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property (internal flooding) [PAG] (p6)</p></div><div class="nugget-popup quant"><p>one property; more than one occasion in the last 5 years [PAG] (p7)</p></div><div class="nugget-popup quant"><p>one property (p9)</p></div><div class="nugget-popup quant"><p>1 residential dwelling (patio and garage) on 19/12/12; 2 properties affected on 14/02/14 [TAB,PAG] (p11)</p></div><div class="nugget-popup quant"><p>2 properties; depth approximately 100mm (p12)</p></div></div></body></div>`)[0];
