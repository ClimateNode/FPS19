                var html_b8e9f4deb9b27ff35ece5f5b8914572e = $(`<div id="html_b8e9f4deb9b27ff35ece5f5b8914572e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Colne Brook</h1><div class="nugget-popup"><p>Flows on the Colne Brook were managed during the event (partial closure of Moor Lane sluice gate) as part of efforts to control flood levels; the brook was referenced as a watercourse where flow control actions occurred. (p2)</p></div><div class="nugget-popup"><p>Could not discharge to the Thames during winter 2013/14, backed up and contributed to spilling into the Staines Aqueduct and flooding in the Staines&ndash;upon&ndash;Thames area. (p5)</p></div><div class="nugget-popup"><p>Experienced elevated flood flows that later receded; flows on the Colne Brook began to recede on the afternoon of 12 February after the Moor Lane sluice gate was 50% closed as part of flood management operations. (p10)</p></div><div class="nugget-popup"><p>Subject of a flood alert (31 January 2014) covering Iver and Colnbrook and a flood warning for Colnbrook on 31 January 2014, indicating river flooding threat from the Colne Brook in that area. [PAG] (p11)</p></div></div></body></div>`)[0];

                var html_0f1b7a47b9f629e50a634db4fd295b10 = $(`<div id="html_0f1b7a47b9f629e50a634db4fd295b10" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Ash</h1><div class="nugget-popup"><p>Unprecedented winter 2013/14 rainfall caused fluvial flooding from the River Ash that affected the upstream section in the vicinity of Leacroft and Priory Green; prompted operational interventions (EA overrode sluice gate; Thames Water adjusted pumping and sluice settings) to control flows. (p2)</p></div><div class="nugget-popup"><p>Upstream section rose dramatically and overtopped its banks; high river levels persisted for a number of days and caused fluvial flooding into nearby areas, including overflow into lakes, a county ditch and the Staines Reservoir Aqueduct. [PAG] (p3)</p></div><div class="nugget-popup"><p>The upstream section rose rapidly and overtopped its banks in the vicinity of Leacroft and Priory Green, causing fluvial flooding that led to road flooding and internal flooding of some properties (including on Leacroft, Leacroft Close and Raleigh Court). Elevated levels persisted for several days before receding. [PAG] (p4)</p></div><div class="nugget-popup"><p>Flows in the River Ash were increased due to overtopping from the Staines Reservoir Aqueduct (including at the Crooked Billet side weir), contributing to flooding in nearby areas. [IMG] (p6)</p></div><div class="nugget-popup"><p>River Ash overtopped/caused flooding at Priory Green and the surrounding area. (p8)</p></div><div class="nugget-popup"><p>Flooding from the River Ash affected Priory Green and surrounding areas; the EA overrode the sluice gate controls (which manage flow from the River Colne into the River Ash) during the February 2014 event to regulate flows and reduce flooding. [PAG] (p9)</p></div><div class="nugget-popup"><p>Flow into the River Ash was actively controlled by an EA&ndash;owned sluice gate during the February event. The gate was closed manually on 9 February to minimise flood flows entering the Ash (downstream levels were low so it later automatically re&ndash;opened to restore base flow). The gate was closed again on 11 February and prevented from automatically re&ndash;opening (reducing base flow), then reopened on 13 February to allow a small flow to prevent damage from a dry riverbed. Flows on the Ash began to recede on the afternoon of 12 February. [PAG,MUL] (p10)</p></div><div class="nugget-popup"><p>Flood alert and flood warning issued (10 February 2014) for the River Ash covering the Borough of Spelthorne, including Ashford and Staines (and named areas Birch Green, Knowle Green, Littleton and Shepperton). River level thresholds on the River Ash were reduced after the February 2014 event so that flood warnings will be issued at an earlier stage. [PAG] (p12)</p></div><div class="nugget-popup"><p>A sharp rise in water levels on the River Ash led to property flooding in the Birch Green area; opening of a sluice gate and water from other watercourses entering the aqueduct contributed to rising levels and spillover into the River Ash. [PAG] (p13)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 80 properties; at least 11 properties [PAG] (p4)</p></div></div></body></div>`)[0];

                var html_9aa1cdc1473a661d58ac4c45b79559d7 = $(`<div id="html_9aa1cdc1473a661d58ac4c45b79559d7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wraysbury River</h1><div class="nugget-popup"><p>High levels in the River Wraysbury (together with the River Thames) were identified as a source of the February 2014 flooding. These high river levels contributed to the River Ash overtopping its banks, which led to road flooding and internal property flooding in nearby streets (Leacroft, Leacroft Close, Raleigh Court, Manor Place, Chestnut Manor Close, Priory Green) and overflow into Heron Lake, a county ditch and the Staines Reservoir Aqueduct. [IMG,PAG] (p3)</p></div><div class="nugget-popup"><p>High levels in the River Wraysbury (together with the Thames) are reported as a source of the fluvial flooding that led to elevated levels in the River Ash and the aqueduct and consequent property and road flooding around Leacroft and Priory Green. (p4)</p></div><div class="nugget-popup"><p>Was prevented from discharging to the Thames by exceptionally high Thames levels in winter 2013/14, backing up and contributing to spill into the Staines Aqueduct and flooding in the Staines area. (p5)</p></div><div class="nugget-popup"><p>Floodwater from the Wraysbury River fed the Aqueduct during the event, contributing to elevated flows that required increased pumping and sluice gate management on the Aqueduct. (p10)</p></div></div></body></div>`)[0];

                var html_c5652ad2fb4a6cf69d4a74025ca84110 = $(`<div id="html_c5652ad2fb4a6cf69d4a74025ca84110" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Thames</h1><div class="nugget-popup"><p>High levels in the River Thames were identified as a source of the flooding that propagated into the River Ash, Staines Reservoir Aqueduct and surrounding areas, contributing to overtopping and subsequent road and property flooding. [IMG,PAG] (p3)</p></div><div class="nugget-popup"><p>Exceptional winter rainfall kept the River Thames running at capacity, producing very high river levels on the Lower Thames (the highest in over 65 years) that prevented tributaries discharging and contributed to flooding around Staines&ndash;upon&ndash;Thames. [PAG] (p5)</p></div><div class="nugget-popup"><p>Very high River Thames levels prevented tributaries from discharging to it, causing those tributaries to back up and contribute to flooding in the Staines&ndash;upon&ndash;Thames area. [PAG] (p6)</p></div><div class="nugget-popup"><p>High river flows prompted EA flood notices including a flood alert (24 December 2013) and flood warnings (7 February 2014) and a severe flood warning for the reach at Staines and Egham on 9 February 2014. Thames Water closed its River Thames intake during the high flows and only reopened it after EA agreement on 17 February 2014. [MUL] (p11)</p></div><div class="nugget-popup"><p>High river levels on the Thames triggered EA flood alerts and warnings covering Staines&ndash;upon&ndash;Thames (including a 24 Dec 2013 flood alert for River Thames from Datchet to Shepperton Green, a 7 Feb 2014 flood warning for Staines and Egham and a 9 Feb 2014 severe flood warning), indicating the Thames contributed to flood risk in the Staines area. [PAG,MUL] (p12)</p></div><div class="nugget-popup"><p>The River Thames was included in updated modelling and is described as influencing flood risk to communities between Datchet and Teddington (including Spelthorne / Staines); the River Thames Scheme is intended to reduce that flood risk. (p13)</p></div></div></body></div>`)[0];
                popup_4967662606c132d7fd8019c5d5e0fb5e.setContent(html_c5652ad2fb4a6cf69d4a74025ca84110);

                var html_afe938069992320d80ce561d7a723453 = $(`<div id="html_afe938069992320d80ce561d7a723453" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Staines-Upon-Thames</h1><div class="nugget-popup"><p>The Staines&ndash;upon&ndash;Thames area experienced flooding caused by a combination of saturated ground, high rainfall and high River Thames levels that forced tributaries to back up and spill, producing local flooding. [IMG] (p6)</p></div><div class="nugget-popup"><p>The focus of the flood response moved to the Staines area in early February 2014; EA field teams managed local assets (including the River Ash sluice gate) to minimise flooding at Priory Green and surrounding areas. (p9)</p></div><div class="nugget-popup"><p>Staines was within the area covered by River Thames and River Ash flood alerts/warnings (including a severe flood warning for River Thames at Staines on 9 February 2014). The EA had personnel on site in the Staines area from 10&ndash;14 February to record flooded properties and extent. [PAG,MUL] (p11)</p></div></div></body></div>`)[0];

                var html_8bcbb3c48eb1f6b2e4535d91846727e7 = $(`<div id="html_8bcbb3c48eb1f6b2e4535d91846727e7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hythe End</h1><div class="nugget-popup"><p>Rising water levels at Hythe End triggered the Ash Protocol; intake gates at Hythe End were operated (in automatic mode and then reported fully closed) to control Aqueduct water levels, and the Aqueduct became fed by floodwater as a consequence. [MUL] (p10)</p></div></div></body></div>`)[0];

                var html_3af9032920c16cbaba142fdb3723d817 = $(`<div id="html_3af9032920c16cbaba142fdb3723d817" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Staines Reservoir Aqueduct</h1><div class="nugget-popup"><p>The aqueduct was a focus of flood&ndash;control operations; the Environment Agency worked with Thames Water under the Ash Protocol to control flooding at the Staines Reservoir Aqueduct. Thames Water carried out repairs to the aqueduct following the event and will agree revised operating arrangements for when nearby river levels are high. (p2)</p></div><div class="nugget-popup"><p>Staines Reservoir Aqueduct (asset associated with the reservoir) rose above its banks and received overflow from fluvial water; operation of assets on the Staines Reservoir Aqueduct was implicated and recommended for revised operating arrangements. [IMG,PAG] (p3)</p></div><div class="nugget-popup"><p>The aqueduct rose above its banks in areas around Leacroft and Priory Green, contributing to road and internal property flooding; fluvial water also overflowed into the aqueduct via county ditch connections. (p4)</p></div><div class="nugget-popup"><p>High Thames levels prevented normal discharge of tributaries; those tributaries backed up and spilled into the Staines Aqueduct at various points, producing backflow/spill within the aqueduct and forming part of the flooding experienced in the Staines&ndash;upon&ndash;Thames area. (p5)</p></div><div class="nugget-popup"><p>The Staines Reservoir Aqueduct overtopped (into the River Ash at the Crooked Billet side weir) and overtopping at multiple points contributed to increased flows in the River Ash and local flooding. (p6)</p></div><div class="nugget-popup"><p>Identified as a key asset requiring active management during the flooding event; the aqueduct was managed by Thames Water staff to reduce flood risk to the asset and surrounding area. (p9)</p></div><div class="nugget-popup"><p>During the February event the Aqueduct was fed solely with floodwater originating from the County Ditch and Wraysbury River. Thames Water intake gates at Hythe End were set to control levels and were fully closed on 9 February. Operations on the Aqueduct (including Moor Lane sluice gate) were managed as part of flood control: pumping from Birch Green pumping station was increased to control flood levels, Moor Lane sluice gate was instructed to be 50% closed (completed by 00:30 on 12 February), flows began to recede on 12 February afternoon so no further closure was required, and the gate was raised and pumping reduced when levels fell. [MUL] (p10)</p></div><div class="nugget-popup"><p>The Staines Reservoir Aqueduct partially collapsed following the flood event, causing significant damage; it was taken out of service for repairs and remained out of service throughout the summer of 2014. [PAG] (p11)</p></div><div class="nugget-popup"><p>Subject to high river levels and risk of overtopping during the February 2014 flood event; operational changes made to reduce flood risk including removal of a sluice gate, installation of new isolation valves on the siphon under the railway, Thames Water to close valves when aqueduct levels reach a trigger before overtopping, and the aqueduct was added to the SCC Flooding Asset Register to highlight its importance to flood risk. Thames Water will run annual tests of communications and operations. (p12)</p></div><div class="nugget-popup"><p>Water from various watercourses getting into the aqueduct caused levels to rise and spill over into the River Ash, contributing to the sharp rise in river levels that led to flooding. (p13)</p></div><div class="nugget-popup"><p>The report states that water from various watercourses entering the aqueduct caused levels to rise and spill into the River Ash, likely contributing to the sudden rise in river levels and downstream property flooding in Birch Green when combined with other factors. (p14)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 80 properties; at least 11 properties (p4)</p></div><div class="nugget-popup quant"><p>pumping increased from 270 million litres&ndash;a&ndash;day to 350 million litres&ndash;a&ndash;day and later to 420 million litres&ndash;a&ndash;day; Moor Lane sluice gate 50% closed by 00:30 on 12 February [MUL] (p10)</p></div></div></body></div>`)[0];
