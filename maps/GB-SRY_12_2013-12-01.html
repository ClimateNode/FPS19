                var html_29e26098db4abd0662927ca700880ee8 = $(`<div id="html_29e26098db4abd0662927ca700880ee8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Colne Brook</h1><div class="nugget-popup"><p>Flows on the Colne Brook were managed during the event (partial closure of Moor Lane sluice gate) as part of efforts to control flood levels; the brook was referenced as a watercourse where flow control actions occurred. (p2)</p></div><div class="nugget-popup"><p>Experienced elevated flood flows that later receded; flows on the Colne Brook began to recede on the afternoon of 12 February after the Moor Lane sluice gate was 50% closed as part of flood management operations. (p10)</p></div><div class="nugget-popup"><p>Subject of a flood alert (31 January 2014) covering Iver and Colnbrook and a flood warning for Colnbrook on 31 January 2014, indicating river flooding threat from the Colne Brook in that area. [PAG] (p11)</p></div></div></body></div>`)[0];

                var html_aea12019035b61cf2148a50e06294b1b = $(`<div id="html_aea12019035b61cf2148a50e06294b1b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Ash</h1><div class="nugget-popup"><p>Unprecedented winter 2013/14 rainfall caused fluvial flooding from the River Ash that affected the upstream section in the vicinity of Leacroft and Priory Green; prompted operational interventions (EA overrode sluice gate; Thames Water adjusted pumping and sluice settings) to control flows. (p2)</p></div><div class="nugget-popup"><p>Upstream section rose dramatically and overtopped its banks; high river levels persisted for a number of days and caused fluvial flooding into nearby areas, including overflow into lakes, a county ditch and the Staines Reservoir Aqueduct. [PAG] (p3)</p></div><div class="nugget-popup"><p>Flows in the River Ash were increased due to overtopping from the Staines Reservoir Aqueduct (including at the Crooked Billet side weir), contributing to flooding in nearby areas. [IMG] (p6)</p></div><div class="nugget-popup"><p>Flow into the River Ash was actively controlled by an EA&ndash;owned sluice gate during the February event. The gate was closed manually on 9 February to minimise flood flows entering the Ash (downstream levels were low so it later automatically re&ndash;opened to restore base flow). The gate was closed again on 11 February and prevented from automatically re&ndash;opening (reducing base flow), then reopened on 13 February to allow a small flow to prevent damage from a dry riverbed. Flows on the Ash began to recede on the afternoon of 12 February. [PAG,MUL] (p10)</p></div><div class="nugget-popup"><p>Flood alert and flood warning issued (10 February 2014) for the River Ash covering the Borough of Spelthorne, including Ashford and Staines (and named areas Birch Green, Knowle Green, Littleton and Shepperton). River level thresholds on the River Ash were reduced after the February 2014 event so that flood warnings will be issued at an earlier stage. [PAG] (p12)</p></div><div class="nugget-popup"><p>A sharp rise in water levels on the River Ash led to property flooding in the Birch Green area; opening of a sluice gate and water from other watercourses entering the aqueduct contributed to rising levels and spillover into the River Ash. [PAG] (p13)</p></div></div></body></div>`)[0];

                var html_11e3d955dc103b026e78484105e838c5 = $(`<div id="html_11e3d955dc103b026e78484105e838c5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wraysbury River</h1><div class="nugget-popup"><p>High levels in the River Wraysbury (together with the River Thames) were identified as a source of the February 2014 flooding. These high river levels contributed to the River Ash overtopping its banks, which led to road flooding and internal property flooding in nearby streets (Leacroft, Leacroft Close, Raleigh Court, Manor Place, Chestnut Manor Close, Priory Green) and overflow into Heron Lake, a county ditch and the Staines Reservoir Aqueduct. [IMG,PAG] (p3)</p></div><div class="nugget-popup"><p>Floodwater from the Wraysbury River fed the Aqueduct during the event, contributing to elevated flows that required increased pumping and sluice gate management on the Aqueduct. (p10)</p></div></div></body></div>`)[0];

                var html_97a6840e9eca7bf8d0f7c191995c1f9e = $(`<div id="html_97a6840e9eca7bf8d0f7c191995c1f9e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Thames</h1><div class="nugget-popup"><p>High levels in the River Thames were identified as a source of the flooding that propagated into the River Ash, Staines Reservoir Aqueduct and surrounding areas, contributing to overtopping and subsequent road and property flooding. [IMG,PAG] (p3)</p></div><div class="nugget-popup"><p>Very high River Thames levels prevented tributaries from discharging to it, causing those tributaries to back up and contribute to flooding in the Staines&ndash;upon&ndash;Thames area. [PAG] (p6)</p></div><div class="nugget-popup"><p>High river flows prompted EA flood notices including a flood alert (24 December 2013) and flood warnings (7 February 2014) and a severe flood warning for the reach at Staines and Egham on 9 February 2014. Thames Water closed its River Thames intake during the high flows and only reopened it after EA agreement on 17 February 2014. [MUL] (p11)</p></div><div class="nugget-popup"><p>High river levels on the Thames triggered EA flood alerts and warnings covering Staines&ndash;upon&ndash;Thames (including a 24 Dec 2013 flood alert for River Thames from Datchet to Shepperton Green, a 7 Feb 2014 flood warning for Staines and Egham and a 9 Feb 2014 severe flood warning), indicating the Thames contributed to flood risk in the Staines area. [PAG,MUL] (p12)</p></div><div class="nugget-popup"><p>The River Thames was included in updated modelling and is described as influencing flood risk to communities between Datchet and Teddington (including Spelthorne / Staines); the River Thames Scheme is intended to reduce that flood risk. (p13)</p></div></div></body></div>`)[0];

                var html_733f8f98af0b25db8b18dc303a1e6ffa = $(`<div id="html_733f8f98af0b25db8b18dc303a1e6ffa" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Leacroft, Knowle Green</h1><div class="nugget-popup"><p>The Leacroft area experienced fluvial flooding associated with the River Ash during the event; flood warnings were issued to the affected area and on&ndash;site data were collected regarding extent, source and depth. (p2)</p></div><div class="nugget-popup"><p>Fluvial flooding affected Leacroft, causing road flooding and internal flooding to some properties. [PAG] (p3)</p></div><div class="nugget-popup"><p>Flooding occurred in the vicinity of Leacroft during the upstream River Ash event and this area was part of the investigation into property flooding. (p13)</p></div></div></body></div>`)[0];

                var html_1ed3ecb331c293cf201574b84e8225ff = $(`<div id="html_1ed3ecb331c293cf201574b84e8225ff" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Moor Lane, Staines-Upon-Thames</h1><div class="nugget-popup"><p>The Moor Lane sluice gate was partially closed following an instruction from the Environment Agency to control flow levels on the River Ash and Colne Brook during the flood. (p2)</p></div><div class="nugget-popup"><p>Operational control of the sluice gate on the aqueduct to manage flood flows: EA requested closure to reduce floodwater entering the Aqueduct; initially no record of closure so gate remained open; later instructed to be 50% closed which was completed by 00:30 on 12 February, contributing to flows receding on the River Ash and Colne Brook; gate later raised on 14 February to allow pumping. [PAG,MUL] (p10)</p></div><div class="nugget-popup"><p>The Moor Lane sluice gate was operated as part of flood management: it was 50% closed by 00:30 on 12 February, and was raised on 14 February to allow pumping to take place. [MUL] (p11)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>50% closure [PAG,MUL] (p10)</p></div><div class="nugget-popup quant"><p>50% closed [MUL] (p11)</p></div></div></body></div>`)[0];

                var html_715185b20009395f1ae48d7afd3ea283 = $(`<div id="html_715185b20009395f1ae48d7afd3ea283" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Knowle Green</h1><div class="nugget-popup"><p>Knowle Green was included in EA flood warnings for the River Ash (10 February 2014) and is within the area for which river level monitoring thresholds were reviewed and reduced, so warnings will be issued earlier for this locality. [PAG,MUL] (p12)</p></div></div></body></div>`)[0];

                var html_ef6170e484737557a02672269a5c9fd5 = $(`<div id="html_ef6170e484737557a02672269a5c9fd5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Staines Reservoir Aqueduct</h1><div class="nugget-popup"><p>The aqueduct was a focus of flood&ndash;control operations; the Environment Agency worked with Thames Water under the Ash Protocol to control flooding at the Staines Reservoir Aqueduct. Thames Water carried out repairs to the aqueduct following the event and will agree revised operating arrangements for when nearby river levels are high. (p2)</p></div><div class="nugget-popup"><p>Staines Reservoir Aqueduct (asset associated with the reservoir) rose above its banks and received overflow from fluvial water; operation of assets on the Staines Reservoir Aqueduct was implicated and recommended for revised operating arrangements. [IMG,PAG] (p3)</p></div><div class="nugget-popup"><p>The Staines Reservoir Aqueduct overtopped (into the River Ash at the Crooked Billet side weir) and overtopping at multiple points contributed to increased flows in the River Ash and local flooding. (p6)</p></div><div class="nugget-popup"><p>During the February event the Aqueduct was fed solely with floodwater originating from the County Ditch and Wraysbury River. Thames Water intake gates at Hythe End were set to control levels and were fully closed on 9 February. Operations on the Aqueduct (including Moor Lane sluice gate) were managed as part of flood control: pumping from Birch Green pumping station was increased to control flood levels, Moor Lane sluice gate was instructed to be 50% closed (completed by 00:30 on 12 February), flows began to recede on 12 February afternoon so no further closure was required, and the gate was raised and pumping reduced when levels fell. [MUL] (p10)</p></div><div class="nugget-popup"><p>The Staines Reservoir Aqueduct partially collapsed following the flood event, causing significant damage; it was taken out of service for repairs and remained out of service throughout the summer of 2014. [PAG] (p11)</p></div><div class="nugget-popup"><p>Subject to high river levels and risk of overtopping during the February 2014 flood event; operational changes made to reduce flood risk including removal of a sluice gate, installation of new isolation valves on the siphon under the railway, Thames Water to close valves when aqueduct levels reach a trigger before overtopping, and the aqueduct was added to the SCC Flooding Asset Register to highlight its importance to flood risk. Thames Water will run annual tests of communications and operations. (p12)</p></div><div class="nugget-popup"><p>Water from various watercourses getting into the aqueduct caused levels to rise and spill over into the River Ash, contributing to the sharp rise in river levels that led to flooding. (p13)</p></div><div class="nugget-popup"><p>The report states that water from various watercourses entering the aqueduct caused levels to rise and spill into the River Ash, likely contributing to the sudden rise in river levels and downstream property flooding in Birch Green when combined with other factors. (p14)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>pumping increased from 270 million litres&ndash;a&ndash;day to 350 million litres&ndash;a&ndash;day and later to 420 million litres&ndash;a&ndash;day; Moor Lane sluice gate 50% closed by 00:30 on 12 February [MUL] (p10)</p></div></div></body></div>`)[0];
