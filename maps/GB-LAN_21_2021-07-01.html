                var html_be10411a8ab9869f9ddfdfbd2c0554e5 = $(`<div id="html_be10411a8ab9869f9ddfdfbd2c0554e5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Factory Lane, Penwortham</h1><div class="nugget-popup"><p>Lancashire Factory Lane was flooded during the July 2021 event. (p1)</p></div><div class="nugget-popup"><p>Three separate floodings between 3 July and 12 July 2021 disrupted access along the lane for residents and businesses, encroached into drives and garden areas, and caused repeated damage to one particular home. (p3)</p></div><div class="nugget-popup"><p>Flooding associated with defects in the local culverted watercourse occurred downstream of Factory Lane; investigations link these defects to reported flooding that affected a home (on 3, 10 and 12 July 2021) and other nearby premises. [PAG] (p4)</p></div><div class="nugget-popup"><p>Flooding occurred on Factory Lane associated with the organised, heavy and persistent rain on 3 July 2021; the street area was highlighted as a key flooding location in the investigation map (localised inundation from intense rainfall and/or overflow from the nearby watercourse). [IMG,PAG] (p5)</p></div><div class="nugget-popup"><p>Blocked gullies caused flooding of the highway and adjacent private property. The Council's local Highways team attended to clear gullies between 3 and 12 July 2021, but flooding recurred in further heavy rain. Subsequent investigation identified defects in a downstream carrier drain / culverted watercourse; tree roots and trapped silt formed a significant obstruction that prevented flows draining away in heavy rainfall. [PAG,MUL] (p6)</p></div><div class="nugget-popup"><p>Following clearance of an upstream blockage in May 2021, the drainage systems around Factory Lane became inundated during heavy rainfall in early July 2021. A shallow&ndash;gradient culverted watercourse had trapped silt and tree roots, creating a significant obstruction to flows; the culvert was subsequently cleared/repaired. Separate new reports of flooding at a different location on Factory Lane were made in May 2023 and September 2023 (under investigation). [MUL] (p7)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>three flooding events; one home (p3)</p></div><div class="nugget-popup quant"><p>1 home [PAG] (p4)</p></div></div></body></div>`)[0];
