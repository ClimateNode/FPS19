                var html_feea25526e4366fb48c09b8b1298a5aa = $(`<div id="html_feea25526e4366fb48c09b8b1298a5aa" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1>Woodbarton, Milverton</h1><div class="nugget-popup"><p>Properties on Woodbarton were internally flooded on 2023&ndash;05&ndash;09; these properties form part of the total reported loss of 18 residential and 2 commercial properties flooded internally in Milverton. (p7)</p></div><div class="nugget-popup"><p>Received cascading overland flows down the eastern valley axis as water exited the pond and flowed eastwards toward the Woodbarton area. [PAG,IMG] (p26)</p></div><div class="nugget-popup"><p>Runoff and cascading flow reached Woodbarton carrying a large volume of mud, rocks, stones and debris into the culvert that starts in the garden of 11 Woodbarton. The drain between fields was overwhelmed, allowing water to flow over the surface and pick up topsoil en route; residents reported unusually sediment&ndash;laden (muddy) runoff compared with normal heavy rain events. [PAG,IMG] (p27)</p></div><div class="nugget-popup"><p>Post&ndash;event observations (11 May 2023) show a fan of eroded soil at the boundary of the arable field above Woodbarton, indicating substantial sediment delivery toward the hamlet during the event and ongoing surface runoff impacts to the local environment and watercourses. [PAG,IMG,MUL] (p28)</p></div><div class="nugget-popup"><p>Rapid surface&ndash;water runoff from fields above Woodbarton overwhelmed a culvert and drainage features on 9 May 2023, producing short&ndash;duration but intense flooding (around 45 minutes) that caused water to flow through gardens, erode soil, move debris and temporarily breach a hedge where a plastic pipe allowed water to pass between fields. [PAG,IMG] (p29)</p></div><div class="nugget-popup"><p>A culvert was overcome within minutes and extreme surface&ndash;water flooding persisted for approximately 45 minutes before receding rapidly. A plastic field drain pipe between the two fields behind Woodbarton was observed discharging water under a hedge; residents reported the hedge initially held flows until it broke through. Runoff carrying mud and debris moved downhill, accumulated at a natural sticking point and then burst through in a single large rush that overwhelmed drains and properties. Properties were inundated with mud, with mud remaining in homes for up to a year after the event; at the time of writing one resident had not returned to their home due to flood damage. [IMG] (p30)</p></div><div class="nugget-popup"><p>Street required fire brigade attendance to clear flood&ndash;affected roadway, indicating localised inundation and obstruction of the street during the event on 2023&ndash;05&ndash;09. (p35)</p></div><div class="nugget-popup"><p>The culvert at Woodbarton was identified as an asset of concern after the 2023 flooding &mdash; CCTV and mapping work are being carried out to understand its route and condition. Recommendations note the culvert/grill may be undersized or blocked and contributed to local flooding, prompting potential repairs (grill replacement) and upstream investigations to reduce future surface&ndash;water flow into the culvert. [TAB] (p37)</p></div><div class="nugget-popup"><p>Severe rainfall on 2023&ndash;05&ndash;09 highlighted capacity issues at the top of the Woodbarton culvert; attenuation measures were proposed because the culvert/drainage was overwhelmed. [TAB] (p38)</p></div><div class="nugget-popup"><p>On 2023&ndash;05&ndash;09 intense rainfall produced a rapid rush of water, mud and debris from upstream hedgerows that quickly blocked the inlet screen of the culvert feeding Woodbarton. The blockage caused the culvert to overtop and flood properties in Woodbarton; flooding had rapid onset (appearing and then receding quickly) and carried mud and debris into the estate. (p44)</p></div><div class="nugget-popup"><p>Surface water flooding on 2023&ndash;05&ndash;09 affected the area around the Woodbarton culvert. The report identifies attenuation possibilities at the top of the Woodbarton culvert as a potential mitigation measure. Residents commented that they do not believe the culvert contributed to flooding of a nearby farmstead; this point is recorded as a disputed contribution to the flooding of that farmstead. The event was part of the broader surface&ndash;water event in Milverton that flooded 20 properties. (p46)</p></div></div></body></div>`)[0];

                var html_4edc4cefd8fdb47d8de0654bc38a5641 = $(`<div id="html_4edc4cefd8fdb47d8de0654bc38a5641" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1>Creedwell Close, Milverton</h1><div class="nugget-popup"><p>Properties on Creedwell Close experienced internal flooding during the heavy rainfall on 9 May 2023; counted among the 18 residential and 2 commercial properties reported as flooding internally in Milverton. (p7)</p></div><div class="nugget-popup"><p>Identified in the report summary as one of four areas significantly affected by flooding on 9 May 2023. (p26)</p></div><div class="nugget-popup"><p>Drains on Creedwell Close became overwhelmed on 2023&ndash;05&ndash;09, causing two properties to flood internally. Properties remained inundated with mud for up to a year afterwards; at the time of writing one resident had not returned home due to flood damage. The local 225 mm drain running beneath the affected properties was inadequate for the volume of water received and connects to the main drainage system to the north. [PAG,IMG,MUL] (p31)</p></div><div class="nugget-popup"><p>Surface water accumulated on the paved road adjacent to properties at Creedwell Close due to an inadequate 225mm drain beneath the affected properties. Water pooled on the carriageway at the drain location, indicating the drain was overwhelmed or blocked, causing localised flooding of the road and contributing to flooding of the nearby properties; the drain connects to the main drainage system to the north. [IMG] (p32)</p></div><div class="nugget-popup"><p>Drainage on Creedwell Close was reported as problematic (leaves from an ash tree blocking the drain; drains/gullies described as undersized). The drain is included in CCTV investigations to address blockages/undersizing that contributed to surface&ndash;water flooding on the street. [TAB] (p37)</p></div></div></body></div>`)[0];

                var html_c0288c57da9639d4fc5dd46a08084ac9 = $(`<div id="html_c0288c57da9639d4fc5dd46a08084ac9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Somerset</h1><div class="nugget-popup"><p>On 2023&ndash;05&ndash;09 heavy rainfall affected many areas across Somerset; multiple areas experienced flooding during the event and five additional Section 19 investigations were undertaken for other affected areas of the county. [IMG] (p7)</p></div><div class="nugget-popup"><p>Widespread intense rainfall on 2023&ndash;05&ndash;09 caused surface&ndash;water flooding across Somerset, stretching Risk Management Authorities thin and resulting in prioritisation of resources to other affected areas; this contributed to delayed attendance and recovery actions in Milverton. [MUL] (p35)</p></div><div class="nugget-popup"><p>The top of the Woodbarton culvert was identified for attenuation works after severe rainfall overwhelmed local drainage capacity; the culvert/adjacent area experienced capacity issues during the event. [TAB,MUL] (p38)</p></div></div></body></div>`)[0];

                var html_0370cd6c18e856d4525fd8171e9dec37 = $(`<div id="html_0370cd6c18e856d4525fd8171e9dec37" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Milverton</h1><div class="nugget-popup"><p>On 9 May 2023 unprecedented rainfall produced an extraordinary level of surface water flooding that overwhelmed parish drainage. Runoff and channelled flows were directed toward properties causing extensive damage: mud from nearby fields inundated twenty properties, collapsing structures allowed water entry, and the parish&ndash;wide drainage infrastructure proved inadequate. [MUL] (p5)</p></div><div class="nugget-popup"><p>On 2023&ndash;05&ndash;09 Milverton experienced surface&ndash;water (pluvial) flooding. Multiple, spatially separated areas of the village were impacted (concentrated near the town centre with one outlying area to the southwest); properties were internally flooded &mdash; in total 18 residential and 2 commercial properties flooded internally across Woodbarton, Sand Street, Creedwell Close and Lower Lovelynch. [IMG] (p7)</p></div><div class="nugget-popup"><p>The iShare screenshot for Milverton shows marked flooding points and flooding lines within the village (notably on/near High Street), and multiple drainage features and gullies mapped nearby, indicating localised flooding in the village during the incident under investigation. [PAG,IMG] (p21)</p></div><div class="nugget-popup"><p>iShare maps and accompanying figures show flooding lines and flooding points within Milverton and surface&ndash;water velocity and surface&ndash;water&ndash;risk mapping for the village. Gullies and other drainage features are concentrated along main roads and streets and are co&ndash;located with mapped flooding lines/points, indicating surface&ndash;water flooding affected streets and local drainage infrastructure. [PAG,IMG,MUL] (p22)</p></div><div class="nugget-popup"><p>Observed surface&ndash;water flow routed through Milverton town centre (flow segment 2 on the 9 May 2023 map). The map shows overland water movement within the town converging into lower elevations around Milverton, indicating streets/low&ndash;lying central areas were affected by overland flow on 2023&ndash;05&ndash;09. [PAG,IMG] (p25)</p></div><div class="nugget-popup"><p>On 2023&ndash;05&ndash;09 intense overland flow and ponding occurred in central Milverton: water travelling from a northern shallow valley washed across a track into a pond and pooled on an access road forming a large temporary pond; water exited the pond, flowed through an arable field north of the orchard and cascaded eastwards toward Woodbarton, inundating parts of Sand Street/Woodbarton area. [PAG,IMG] (p26)</p></div><div class="nugget-popup"><p>Flooding on 2023&ndash;05&ndash;09 disrupted school collection (parents/guardians unable to collect pupils), many vehicles drove through the village creating bow waves that exacerbated flooding in some properties; properties were left inundated with mud for up to a year after the event and at least one resident had not returned home because of flood damage. (p35)</p></div><div class="nugget-popup"><p>On 2023&ndash;05&ndash;09 exceptional/intense rainfall overwhelmed drainage across the parish, causing surface water/urban flooding. Multiple properties experienced internal flooding with extensive damage; mud from a nearby field was deposited into homes. Structural collapse in places allowed floodwater to enter several properties. Drainage infrastructure was insufficient to convey flows, directing water toward properties and increasing damage. [PAG,MUL] (p39)</p></div><div class="nugget-popup"><p>On 2023&ndash;05&ndash;09, debris carried from fields and a sudden collapse of material at upstream hedge lines caused a rush of water, mud and debris that blocked the inlet screen to a culvert. The blocked screen led to the culvert being overtopped and properties (notably in Woodbarton and Sand Street within Milverton) were flooded. Flooding receded quickly after a wall collapsed allowing runoff and firefighters cleared debris from the culvert entrance to restore flow. (p45)</p></div></div></body></div>`)[0];
