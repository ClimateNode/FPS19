                var html_587e4831d0150a4734b57808ee5df97c = $(`<div id="html_587e4831d0150a4734b57808ee5df97c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Loddon</h1><div class="nugget-popup"><p>Flooding of the River Loddon caused inundation of the Sandford Lane area during the January 2016 flood event. (p9)</p></div><div class="nugget-popup"><p>The River Loddon is shown as a main river with flood&ndash;affected areas shaded along its course. The map indicates the river caused inundation of adjacent lakes, marshes and parkland (including areas around its confluence with Emm Brook) during the January 2016 event. [IMG] (p16)</p></div></div></body></div>`)[0];

                var html_97ac3c6fec2e651f734cbb92cef17e09 = $(`<div id="html_97ac3c6fec2e651f734cbb92cef17e09" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Sandford Lane, Wokingham Unitary Authority</h1><div class="nugget-popup"><p>Floodwater from the Emm Brook and River Loddon spilled into the local network of lakes and roadside ditches and flowed onto the highway. The section immediately west of Emm Brook Bridge was flooded first (water spilled out of the roadside ditch), reaching approximately 50 mm depth on 10 January. As the event progressed, the central section and the area adjacent to the Black Bridge were also flooded (water flowing out of the roadside ditch and directly from Sandford Lake). Back&ndash;up in the Emm Brook (observed above culvert soffit) caused flow upstream into the roadside ditch; overtopping of Sandford Lake contributed to highway flooding. (p6)</p></div><div class="nugget-popup"><p>Sections of the highway flooded from water flowing out of roadside ditches and from overland flow fed by the River Loddon and Emm Brook. Floodwater remained on the highway for multiple days, causing the highway to be closed for the duration of the event and then re&ndash;opened after drainage. [PAG] (p7)</p></div><div class="nugget-popup"><p>Portion of Sandford Lane was inundated during the January 2016 flood event. The flooded area of Sandford Lane was not within an Environment Agency Flood Warning Area and did not receive a flood warning from the Environment Agency. [PAG] (p9)</p></div><div class="nugget-popup"><p>Floodwater from the River Loddon and Emm Brook flowed onto and inundated the highway (Sandford Lane). Measures considered include raising the carriageway or constructing a bund to prevent floodwater entering the road; roadside ditches and drainage require maintenance to reduce recurrence. [PAG] (p10)</p></div><div class="nugget-popup"><p>Sections of Sandford Lane were inundated during the January 2016 event. The map annotations identify a 'first section of the road to flood' and a 'final section of the road to flood.' Floodwater moved from Sandford Lake, Lavell's Lake and associated roadside ditches toward the road and bridges. Channels were cut into the roadside verge to try to drain water into the ditches, but these measures were insufficient to prevent flooding of the road. [IMG] (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 50 mm (p6)</p></div><div class="nugget-popup quant"><p>flood water depths on the highway ranged from approximately 50 mm to 300 mm; a section between River Loddon Bridge and Black Bridge reached approximately 600 mm; flooded 4 times since the beginning of 2016; typically floods between 6 and 8 times each year; highway remained flooded on 11, 12 and 13 January and was re&ndash;opened on 14 January (road closed for 3 days); longest previous closure 1 week. [PAG] (p7)</p></div><div class="nugget-popup quant"><p>0 properties affected [PAG] (p10)</p></div></div></body></div>`)[0];
