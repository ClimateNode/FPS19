                var html_2d758b4e70752f007e8d43e38fcd0a07 = $(`<div id="html_2d758b4e70752f007e8d43e38fcd0a07" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Birmingham Metropolitan District</h1><div class="nugget-popup"><p>The 27 May 2018 storm produced short, intense, highly localised heavy rainfall that led to numerous reported flooding incidents across the city, including internal property flooding, garden flooding and highway flooding. Birmingham City Council received 448 resident flood survey responses and investigations were carried out in 41 areas to determine causes and propose actions. [PAG] (p5)</p></div><div class="nugget-popup"><p>Widespread flooding of highways, open spaces and properties across Birmingham. (p6)</p></div><div class="nugget-popup"><p>Widespread flooding across the city following the storm on 27 May 2018: waterlogged gardens, impassable roads, water outflowing from highway gullies, rivers breaching banks, manholes and sewers surcharging and internal property flooding. (p7)</p></div><div class="nugget-popup"><p>Two distinct zones within the city were affected by flooding on 27 May 2018: a larger south&ndash;west area (including Northfield, Selly Oak and Edgbaston) and a smaller north&ndash;east area (parts of Sutton Coldfield). Flooding followed exceptional, highly localised rainfall (up to 90 mm recorded in the south of the city). [IMG,PAG] (p8)</p></div><div class="nugget-popup"><p>Runoff from the storm on 27th May 2018 followed local topography and the highway network, overtopping kerbs and ponding outside properties; water built up and flowed towards properties lower than road level, flooding properties on Hubert Road in Bournbrook and Selly Park. [TAB] (p27)</p></div><div class="nugget-popup"><p>Runoff from the surrounding catchment followed local topography across the area, producing surface&ndash;water/urban flooding that flowed through Saxelby Close, along Manningford Road and into Bicknell Croft, affecting properties and the highway network. [TAB] (p51)</p></div><div class="nugget-popup"><p>During the storm on 27 May 2018, runoff from surrounding public open space followed the natural topography toward the rear of properties; existing drainage adjacent to properties was overwhelmed, water levels rose and entered properties from the rear. In the Druids Heath and Monyhull &ndash; Sherston Covert area this resulted in internal flooding of properties. [TAB] (p55)</p></div><div class="nugget-popup"><p>Flows in Harts Green Brook and Bourn Brook exceeded channel capacity and overtopped into adjacent property. Flooding was exacerbated by blockages of Harts Green Brook from debris and fallen trees and by silt restrictions in Bourn Brook. Local works were carried out (site walkover, removal of blockages) and a community event held. [TAB] (p65)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>448 responses; 180 incidents of internal flooding; 41 areas [PAG] (p5)</p></div><div class="nugget-popup quant"><p>1 property [TAB] (p27)</p></div><div class="nugget-popup quant"><p>2 properties [TAB] (p55)</p></div><div class="nugget-popup quant"><p>4 properties [TAB] (p65)</p></div></div></body></div>`)[0];
