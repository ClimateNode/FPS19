                var html_e71294d926f4924ecc8d8f1a435506cd = $(`<div id="html_e71294d926f4924ecc8d8f1a435506cd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Wharfe</h1><div class="nugget-popup"><p>Identified as the most significant mechanism causing flooding within Tadcaster (i.e. river overflow leading to town flooding). (p2)</p></div><div class="nugget-popup"><p>Very high river levels in the River Wharfe (reported as the second&ndash;highest in 30 years at Tadcaster) contributed to widespread flooding locally &mdash; most notably the major flood impact at Tadcaster &mdash; and to internally flooded properties elsewhere in the catchment. (p8)</p></div><div class="nugget-popup"><p>The lower River Wharfe experienced very high river levels (recorded as the second highest in 30 years at Tadcaster) and was a cause of flooding to communities in the Selby District (notably Tadcaster). (p10)</p></div><div class="nugget-popup"><p>River Wharfe overtopped and/or breached its banks at multiple specific locations through Tadcaster: near the Old Mill property adjacent to the weir (left bank); adjacent to Sainsbury's (left bank); a small site upstream where the defence takes a 90&deg; turn and the footpath crosses (right bank); and downstream of the bridge near the plinth for the temporary footbridge (right bank). [IMG,PAG] (p12)</p></div><div class="nugget-popup"><p>High flows during the February 2022 flood event prompted additional EA surveys and changes to flood warning/alert triggers at Tadcaster; the river's high water levels contributed to the breach/circumvention of the defence embankment at Ulleskelf and to flooding/surcharging of Ulleskelf Ings. (p13)</p></div><div class="nugget-popup"><p>High water levels on the River Wharfe caused the breach/circumvention of the flood defence embankment behind West End properties in Ulleskelf, contributed to surcharging of the Ulleskelf Ings and triggered widespread flood warnings across the catchment. [PAG] (p14)</p></div><div class="nugget-popup"><p>Properties within the Wharfe catchment were internally flooded; at Kirkby Wharfe (on the Wharfe) one property was internally flooded and both approach roads were cut off by flooding. Community HESCO bank initially held floodwater but was overtopped and the Aquadam then came into play; pumps could not match percolation beneath the Aquadam leading to the property flood. [TAB,PAG] (p15)</p></div><div class="nugget-popup"><p>EA reprofiling of low spots within the River Wharfe to reduce the risk of the river breaching; the river is linked in the report to flooding in Tadcaster (including the 2015 event) and the February 2022 event. [TAB,MUL] (p16)</p></div><div class="nugget-popup"><p>Experienced significant flooding as part of the February 2022 catchment flood events; subject of a formal flood investigation by NYCC. (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>63 properties internally flooded in Tadcaster; 6 properties internally flooded in Ulleskelf; an additional 15 internally flooded properties across the Nidd, Wharfe and Aire catchments. (p8)</p></div><div class="nugget-popup quant"><p>Second highest in 30 years at Tadcaster; linked to 63 internally flooded properties in Tadcaster (flooding from the River Wharfe listed among causes) (p10)</p></div><div class="nugget-popup quant"><p>4 locations [IMG,PAG] (p12)</p></div><div class="nugget-popup quant"><p>1 property (Kirkby Wharfe); 15 properties (combined across Nidd and Wharfe catchments) [TAB,PAG] (p15)</p></div></div></body></div>`)[0];

                var html_b238b26384e83c665093838e3136db9b = $(`<div id="html_b238b26384e83c665093838e3136db9b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Tadcaster</h1><div class="nugget-popup"><p>The town experienced flooding caused principally by the River Wharfe; this flood event prompted Section 19 investigations and local meetings with affected communities. [PAG] (p2)</p></div><div class="nugget-popup"><p>Community experienced flooding requiring a Flood Alleviation Scheme; surface water systems serving the location were implicated and must be accounted for in the FAS design. [PAG] (p3)</p></div><div class="nugget-popup"><p>Widespread internal flooding of residential properties in the town caused by very high river levels (River Wharfe). (p8)</p></div><div class="nugget-popup"><p>Flooding from the River Wharfe inundated the town, with the majority of internal flooding concentrated around Bridge Street and Commercial Street; many flooded properties were businesses. (p10)</p></div><div class="nugget-popup"><p>The River Wharfe overtopped and breached its banks at multiple locations through Tadcaster (both left and right banks), including points near the main bridge, a 90&deg; turn in the defence where a footpath crosses, the footbridge plinth downstream of the bridge, adjacent to Sainsbury's and near the Old Mill property; defences were overtopped/breached allowing floodwater to pass over the defences and reach adjacent areas and infrastructure. [IMG,PAG] (p12)</p></div><div class="nugget-popup"><p>The February 2022 flood event led to EA action on warnings at Tadcaster; properties (for example on Bridge Street) experienced internal flooding despite some property flood resilience measures, and some residents/businesses used warnings to reduce losses by moving furniture/equipment enabling quicker re&ndash;opening of a number of businesses. (p13)</p></div><div class="nugget-popup"><p>River levels breached defences in Tadcaster causing internal flooding of properties; overtopping of flood defences on the west bank contributed to flooding in the town. [TAB,PAG] (p15)</p></div><div class="nugget-popup"><p>Tadcaster experienced major flooding (notably the 2015 event and flooding in February 2022) that led to internal property flooding, installation of property flood resilience measures, and programme&ndash;level responses including development of the Tadcaster Flood Alleviation Scheme and re&ndash;profiling of low spots on the River Wharfe to reduce breach risk. [TAB,MUL] (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>63 properties internally flooded (p8)</p></div><div class="nugget-popup quant"><p>63 properties internally flooded; estimated £400,000 of damages (p10)</p></div><div class="nugget-popup quant"><p>63 properties [TAB,PAG] (p15)</p></div><div class="nugget-popup quant"><p>£11.5 million of funding [TAB,MUL] (p16)</p></div></div></body></div>`)[0];

ed internally. [TAB,PAG] (p16)</p></div><div class="nugget-popup"><p>Properties in Ulleskelf have flooded internally; recommendation for the Environment Agency to review flood risk assets and models and to communicate with residents about options and potential contribution to solutions; advice to consider property flood resilience measures. (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>6 properties internally flooded (p8)</p></div><div class="nugget-popup quant"><p>6 properties internally flooded (p10)</p></div><div class="nugget-popup quant"><p>6 properties (p15)</p></div></div></body></div>`)[0];
