                var html_99e20bb35b8e883351d1803dab386fa5 = $(`<div id="html_99e20bb35b8e883351d1803dab386fa5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Haxby and Wigginton</h1><div class="nugget-popup"><p>Reports ranged from minor road flooding and significant blockages of roads to flooded gardens and internal flooding of properties. Surface water drainage from much of the ward drains to Westfield Beck, requiring pumping during floods. (p12)</p></div><div class="nugget-popup"><p>Elevated levels in Westfield Beck (exacerbated by weed screen blockage and pumping station issues) reduced the capacity and capability of the surface water drainage network serving Haxby and Wigginton, increasing flood risk to the area. (p14)</p></div><div class="nugget-popup"><p>Surface water flooded roads across the area, entered gardens, non&ndash;attached and attached garages and into floor voids; Yorkshire Water sewage system was surcharged and blockages were uncovered and released; gullies were cleared as part of response. [PAG] (p28)</p></div><div class="nugget-popup"><p>Surface water entered roads, gardens and driveways across parts of the parish. Sewage system surcharge and pumping issues in the area caused backups into the local drainage network and are linked to local gully and drainage problems; investigations and coordination with IDB/Yorkshire Water/Environment Agency are ongoing. [PAG] (p29)</p></div><div class="nugget-popup"><p>Surface water flooded roads in the Haxby area during the event. [PAG] (p31)</p></div><div class="nugget-popup"><p>Surface water flooded roads across the area; surface water caused internal flooding (ground&ndash;floor) of a property and water ingress to a property via airbricks; gullies were cleared but one gully was reported not operational; sewer/drainage system experienced backflow to local business premises. (p32)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property (ground&ndash;floor flooded); one property (water ingress via airbricks); one gully not operational (p32)</p></div></div></body></div>`)[0];

                var html_bb28b8d979f3034d32ba871fdc22b014 = $(`<div id="html_bb28b8d979f3034d32ba871fdc22b014" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>York Unitary Authority</h1><div class="nugget-popup"><p>Intense rainfall on 13 August 2018 produced widespread standing water and recorded flooding across the city, including flooded roads, flooded gardens and in a small number of cases flooding of property. Highway drainage and sewerage infrastructure were tested and exceeded, leading to inundation of streets and surrounding areas; some locations had identified drainage defects that likely increased the chance of flooding. [PAG] (p4)</p></div><div class="nugget-popup"><p>Intense, high&ndash;intensity rainfall on 13 August 2018 overwhelmed drainage causing widespread standing water on the highway network; a number of properties were internally flooded and outbuildings/gardens were affected. Council officers investigated flooding at locations across the city. [PAG,IMG] (p6)</p></div><div class="nugget-popup"><p>Impacts of the 13th August 2018 storm were spread wide across the city, with ponding of water on roads and footways and significant impacts to people and property reported to the council, emergency services and media. (p18)</p></div><div class="nugget-popup"><p>Surface water flooded multiple roads, gardens, driveways and non&ndash;attached garages across the city (examples listed in the report include Hawthorn Avenue, North Lane, Kennedy Drive, Longcroft, Mulberry Drive, Oaken Grove, Old Orchard, Ripley Grove). Gullies were cleared; downstream Yorkshire Water sewer surcharging and backups were linked to local sewer issues (e.g. Birch Lane, Albleton Grove). [PAG] (p29)</p></div><div class="nugget-popup"><p>Surface water flooded roads in the Haxby and Wigginton area (multiple streets referenced) and a pumping station malfunction caused the beck to back up into drainage systems, leading to surcharged sewers and local inundation. (p31)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>123 locations [PAG] (p4)</p></div><div class="nugget-popup quant"><p>123 locations [PAG,IMG] (p6)</p></div></div></body></div>`)[0];

                var html_99da4c77084facd5873e791443f9ddce = $(`<div id="html_99da4c77084facd5873e791443f9ddce" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Westfield Beck</h1><div class="nugget-popup"><p>Majority of surface water flows from Haxby and Wigginton drain to Westfield Beck during flooding; the system requires pumping to remove these flows and is implicated in local drainage and highway flooding issues. [PAG] (p12)</p></div><div class="nugget-popup"><p>Receives runoff from the Westfield Beck catchment; during the 13 August 2018 event flows draining to the beck were managed by the Westfield Beck pumping station and the watercourse/pumping arrangement influenced the ability of local surface water and sewer systems to discharge, affecting drainage efficiency in the catchment. [IMG,PAG] (p13)</p></div><div class="nugget-popup"><p>Debris build&ndash;up on the weed screen and equipment failures on 13 August 2018 elevated upstream river levels. The automated penstock was not opening sufficiently and one pump was found not to be working, reducing the capacity of the surface water drainage network and causing concern for local residents. The IDB attended and had to use a machine to clear the screen, remaining on site until late evening. (p14)</p></div><div class="nugget-popup"><p>Malfunction at the Westfield Beck pumping station (pumps and penstock) likely caused the beck to back up into drainage systems, contributing to surcharge of Yorkshire Water's sewage system and surface water flooding of roads, gardens and properties (including ground&ndash;floor flooding and roads/back lanes flooded). (p27)</p></div><div class="nugget-popup"><p>Malfunction at Westfield Beck pumping station (penstock/pumps) caused the beck to back up into the IDB and Yorkshire Water drainage system, leading to surcharging of the Yorkshire Water sewage system downstream and backup into connected drainage. (p29)</p></div><div class="nugget-popup"><p>Malfunction at Westfield Beck pumping station (pump and penstock issues) caused the beck to back up into connected IDB and Yorkshire Water drainage systems, contributing to surface water flooding of roads and surcharge of the sewer network. [PAG] (p30)</p></div><div class="nugget-popup"><p>A malfunction at the Westfield Beck pumping station (50% pump failure and restrictive penstock operation) caused Westfield Beck to back up into adjacent drainage systems (IDB and Yorkshire Water), producing flooding and sewer surcharge. (p31)</p></div><div class="nugget-popup"><p>Malfunction at the Westfield Beck pumping station (approximately 50% failure of pumps and penstock operation) caused the beck to back up into IDB and Yorkshire Water drainage systems, leading to surface&ndash;water flooding of roads and at least one property's ground floor and sewer backflow into a business. (p32)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>50% failure of pumps; 1 property (ground floor flooded); 1 business (toilet backflow) (p32)</p></div></div></body></div>`)[0];
