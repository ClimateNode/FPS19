                var html_d3c01c6b51253a530ecc95dbf4b4f53a = $(`<div id="html_d3c01c6b51253a530ecc95dbf4b4f53a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cambridge Street, St Neots</h1><div class="nugget-popup"><p>Area C (Cambridge Street / Cambridge Gardens area) experienced both internal and external flooding: four internal property flood reports and nine external flood reports to gardens/outbuildings were recorded for the event. [TAB] (p11)</p></div><div class="nugget-popup"><p>Flooding affected properties in the Cambridge Street / Cambridge Gardens area during the December 2020 event, with both internal and external property impacts reported. [PAG,IMG] (p12)</p></div><div class="nugget-popup"><p>Properties on Manor Farm Road, Victoria Court (Cambridge Street) and adjacent Cambridge Street reported garden/outbuildings flooding with reported depths of 30 cm (Manor Farm Road), ~15 cm (Victoria Court) and 20 cm (Cambridge Street); no evacuations reported for these specific reports. (p15)</p></div><div class="nugget-popup"><p>Properties in the Cambridge Street / Cambridge Gardens area experienced internal flooding; reports included foul sewer surcharge into toilets and baths. RMAs attended site to inspect features and speak to residents. [IMG,PAG] (p21)</p></div><div class="nugget-popup"><p>Piped section of Fox Brook runs behind properties on Cambridge Street and Shaftesbury Avenue and was investigated for collapse or blockage under the Land Drainage Act (1991). LLFA attended to investigate internal flooding at nearby properties. Routine and emergency maintenance/clearance of the trash screen on Fox Brook at the junction of Kings Lane and Cambridge Street was undertaken. Anglian Water was tasked to investigate the resilience of their structures in the area because high water levels in the main rivers were reducing discharge efficiency, potentially causing backups into the piped watercourse and contributing to internal/property flooding. [IMG,PAG] (p22)</p></div><div class="nugget-popup"><p>Fluvial (river) flooding affected the Cambridge Street / Cambridge Gardens area during 23 Dec 2020 &ndash; 26 Dec 2020. Table 3 identifies capacity issues, RMA operational issues and riparian maintenance issues as contributors to the flooding. [TAB] (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 properties; 9 external flood reports [TAB] (p11)</p></div><div class="nugget-popup quant"><p>4 properties flooded internally; 9 properties experienced external flooding [PAG,IMG] (p12)</p></div><div class="nugget-popup quant"><p>30 cm; ~15 cm; 20 cm; durations 2 days, 2 days, 1 day (Manor Farm Road, Victoria Court and Cambridge Street) (p15)</p></div></div></body></div>`)[0];

                var html_0cd810d1affd9af6ec602b1fcda5b3d2 = $(`<div id="html_0cd810d1affd9af6ec602b1fcda5b3d2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>St Neots</h1><div class="nugget-popup"><p>Flooding began in St Neots on 23 December 2020 from intense rainfall and saturated ground. A major incident was declared; large areas of the town&mdash;particularly low&ndash;lying areas along the River Great Ouse and its contributory brooks&mdash;were affected by fluvial and surface water flooding. [PAG,IMG] (p6)</p></div><div class="nugget-popup"><p>Significant surface water flooding began on 23 December 2020 (predominantly 23&ndash;24 Dec) followed by fluvial (river) flooding when local watercourses exceeded channel capacity. Flooding across St Neots was declared a major incident; the event involved rapid high runoff due to intense rainfall and saturated ground. [PAG,MUL] (p7)</p></div><div class="nugget-popup"><p>Very rapid high runoff from 23 December rainfall produced significant surface water flooding in and around St Neots, followed by fluvial (river) flooding on 24 December 2020 when watercourses in St Neots exceeded channel capacity. Flood Warnings were issued for the area and properties were reported as being affected; warning lead times were short in places and the issued Flood Warning was close to or after properties were first reported as affected. [PAG] (p8)</p></div><div class="nugget-popup"><p>Thirty&ndash;four flood reports were received across St Neots for 23&ndash;24 December 2020. The community reported 14 properties flooded internally and a further 20 properties with external flooding (gardens/outbuildings). Flooding durations were reported between 1 and 5 days. Five key risk areas were identified within the town. (p11)</p></div><div class="nugget-popup"><p>Community&ndash;reported flooding across the town: 34 flood reports received by the LLFA for 23&ndash;24 December 2020; reports indicate both internal and external property flooding across multiple neighbourhoods. [PAG,IMG] (p12)</p></div><div class="nugget-popup"><p>Fluvial flooding into St Neots from Wintringham Brook and Hen Brook caused internal flooding to residential properties (Hampden Way) and flooding of gardens/outbuildings. Residents were temporarily displaced in some cases. (p18)</p></div><div class="nugget-popup"><p>The town is identified as the area at flood risk; the Environment Agency is considering strategic projects and improved warning/triggering to reduce future flood risk to St Neots. (p24)</p></div><div class="nugget-popup"><p>Intense rainfall on 23 December produced very rapid high runoff that caused significant surface water flooding in St Neots, followed on 24 December by fluvial (river) flooding when watercourses across St Neots exceeded channel capacity. (p27)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>duration between 1 and 5 days; river flow upstream of St Neots recorded at 34.29 m3/s (200% of the Long Term Average) [PAG,MUL] (p7)</p></div><div class="nugget-popup quant"><p>34.29 m3/s; 200% of the Long Term Average; river levels exceeded those of 1998 and reached the highest on record [PAG] (p8)</p></div><div class="nugget-popup quant"><p>34 flood reports; 14 properties; 20 properties; five key areas; 1&ndash;5 days (p11)</p></div><div class="nugget-popup quant"><p>34 flood reports; 14 properties flooded internally; 20 properties flooded externally; flooding duration reported between 1 and 5 days [PAG,IMG] (p12)</p></div><div class="nugget-popup quant"><p>25cm; 30cm; 5cm; 60cm; 2&ndash;5 days; 2&ndash;3 weeks (p18)</p></div></div></body></div>`)[0];

                var html_3dd4f10a68426fe919b93224aca8aa88 = $(`<div id="html_3dd4f10a68426fe919b93224aca8aa88" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Eaton Socon</h1><div class="nugget-popup"><p>Eaton Socon is identified on the flood risk maps as lying in low&ndash;lying, river&ndash; and surface&ndash;water&ndash;prone areas and formed part of the St Neots flooding event that began 23 December 2020. [PAG,IMG] (p6)</p></div><div class="nugget-popup"><p>Area D (Eaton Socon North) recorded both internal and external property flooding: four internal property flood reports and three external flood reports to gardens/outbuildings were recorded during the event. [TAB] (p11)</p></div><div class="nugget-popup"><p>The Eaton Socon (North) area experienced flooding during the December 2020 incident, affecting both internal and external premises of properties. [PAG,IMG] (p12)</p></div><div class="nugget-popup"><p>Area affected by Duloe Brook overtopping/exceeding channel capacity; properties in Squires Court and locations at the Duloe Brook&ndash;River Great Ouse confluence experienced flooding and surcharging of car&ndash;park drainage when river levels were high. (p16)</p></div><div class="nugget-popup"><p>LLFA attended to investigate internal flooding, inspected relevant features and spoke with residents and representatives; actions were taken to determine next steps for risk management authorities. Follow&ndash;up included increased gully maintenance and investigations by Anglian Water into asset resilience. [TAB] (p22)</p></div><div class="nugget-popup"><p>Fluvial (river) flooding affected Eaton Socon (North) during 23 Dec 2020 &ndash; 26 Dec 2020. Table 3 identifies capacity issues and RMA operational issues as contributors in this area. [TAB] (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 properties; 3 external flood reports [TAB] (p11)</p></div><div class="nugget-popup quant"><p>4 properties flooded internally; 3 properties experienced external flooding [PAG,IMG] (p12)</p></div></div></body></div>`)[0];
                popup_238d1ee628af1e306b4bee2f316f2a6b.setContent(html_3dd4f10a68426fe919b93224aca8aa88);

                var html_87d7b239205a6e0e0298114ea1f27d8e = $(`<div id="html_87d7b239205a6e0e0298114ea1f27d8e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Eynesbury</h1><div class="nugget-popup"><p>Part of St Neots that was affected when flooding began on 23 December 2020. Flooding was caused by intense rainfall and high River Great Ouse levels, with surface water flooding evident across low&ndash;lying areas shown on the council map. The event was declared a major incident (23 December 2020) and response was coordinated by Cambridgeshire Police. Flooding was exacerbated by prolonged high river levels that reduced discharge capacity of contributory watercourses and connected drainage. [PAG,IMG] (p6)</p></div><div class="nugget-popup"><p>Flooding affected properties in the area: internal property flooding reported and external flooding to gardens/outbuildings. Identified as one of five key risk areas in St Neots during the December 2020 event. [TAB] (p11)</p></div><div class="nugget-popup"><p>Property flooding reported in the Eynesbury (East) key risk area: internal flooding of residential properties and external flooding of gardens/outbuildings affecting local premises. [PAG,IMG] (p12)</p></div><div class="nugget-popup"><p>Internal property flooding was investigated by the LLFA; officers attended site to inspect features, speak to residents and and determine next steps for Risk Management Authorities. [IMG] (p23)</p></div><div class="nugget-popup"><p>Fluvial (river) flooding affected Eynesbury (East) during 23 Dec 2020 &ndash; 26 Dec 2020. Table 3 identifies RMA operational issues as a relevant issue in this area. [TAB] (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 properties (internal); 2 properties (external) [TAB] (p11)</p></div><div class="nugget-popup quant"><p>3 properties (internal); 2 properties (external) [PAG,IMG] (p12)</p></div></div></body></div>`)[0];

                var html_465459d54b55c17af8bd0d5d1b6cf902 = $(`<div id="html_465459d54b55c17af8bd0d5d1b6cf902" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Eaton Ford</h1><div class="nugget-popup"><p>Area A (Eaton Ford West) recorded internal flooding affecting properties; six internal property flood reports were recorded for the event. [TAB] (p11)</p></div><div class="nugget-popup"><p>Flooding at The Paddocks in December 2020 was reported as surface water flooding caused by surface water drains surcharging within the road rather than fluvial inundation; nearby Riverside Carpark functions as flood storage when gates are deployed but the December 2020 event at The Paddock was due to surcharging drains. [PAG,IMG] (p12)</p></div><div class="nugget-popup"><p>The Eaton Ford area experienced both rapid&ndash;onset surface water flooding and subsequent fluvial flooding on the river ('wet' side of the defences). Surface water sewer surcharging occurred in defended areas; parts of the area on the river side of the defences (including Riverside carpark and north of the B1428) were flooded. (p13)</p></div><div class="nugget-popup"><p>Properties experienced internal flooding; site visits were carried out (March/May 2021) to investigate internal flooding, inspect features and speak to residents. High main&ndash;river levels reduced discharge efficiency affecting the local pumping station and outfalls, contributing to flooding. [TAB] (p19)</p></div><div class="nugget-popup"><p>Fluvial (river) flooding affected Eaton Ford (East) during 23 Dec 2020 &ndash; 26 Dec 2020. Table 3 identifies capacity issues, RMA operational issues and riparian maintenance issues as contributors to the flooding impact in this area. [TAB] (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>6 properties [TAB] (p11)</p></div><div class="nugget-popup quant"><p>6 properties flooded internally; flood water depth reported at approximately 15 cm in the road [PAG,IMG] (p12)</p></div><div class="nugget-popup quant"><p>15cm; 50&ndash;90cm (p13)</p></div></div></body></div>`)[0];
