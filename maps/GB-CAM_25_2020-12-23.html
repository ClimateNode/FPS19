                var html_220a4f5016b4a93d5e756d02f1272db2 = $(`<div id="html_220a4f5016b4a93d5e756d02f1272db2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cambridge Street, St Neots</h1><div class="nugget-popup"><p>Area C (Cambridge Street / Cambridge Gardens area) experienced both internal and external flooding: four internal property flood reports and nine external flood reports to gardens/outbuildings were recorded for the event. [TAB] (p11)</p></div><div class="nugget-popup"><p>Flooding affected properties in the Cambridge Street / Cambridge Gardens area during the December 2020 event, with both internal and external property impacts reported. [PAG,IMG] (p12)</p></div><div class="nugget-popup"><p>Properties on Manor Farm Road, Victoria Court (Cambridge Street) and adjacent Cambridge Street reported garden/outbuildings flooding with reported depths of 30 cm (Manor Farm Road), ~15 cm (Victoria Court) and 20 cm (Cambridge Street); no evacuations reported for these specific reports. (p15)</p></div><div class="nugget-popup"><p>Properties in the Cambridge Street / Cambridge Gardens area experienced internal flooding; reports included foul sewer surcharge into toilets and baths. RMAs attended site to inspect features and speak to residents. [IMG,PAG] (p21)</p></div><div class="nugget-popup"><p>Piped section of Fox Brook runs behind properties on Cambridge Street and Shaftesbury Avenue and was investigated for collapse or blockage under the Land Drainage Act (1991). LLFA attended to investigate internal flooding at nearby properties. Routine and emergency maintenance/clearance of the trash screen on Fox Brook at the junction of Kings Lane and Cambridge Street was undertaken. Anglian Water was tasked to investigate the resilience of their structures in the area because high water levels in the main rivers were reducing discharge efficiency, potentially causing backups into the piped watercourse and contributing to internal/property flooding. [IMG,PAG] (p22)</p></div><div class="nugget-popup"><p>Fluvial (river) flooding affected the Cambridge Street / Cambridge Gardens area during 23 Dec 2020 &ndash; 26 Dec 2020. Table 3 identifies capacity issues, RMA operational issues and riparian maintenance issues as contributors to the flooding. [TAB] (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 properties; 9 external flood reports [TAB] (p11)</p></div><div class="nugget-popup quant"><p>4 properties flooded internally; 9 properties experienced external flooding [PAG,IMG] (p12)</p></div><div class="nugget-popup quant"><p>30 cm; ~15 cm; 20 cm; durations 2 days, 2 days, 1 day (Manor Farm Road, Victoria Court and Cambridge Street) (p15)</p></div></div></body></div>`)[0];

                var html_5d766a8d37b68ac74ec8c199c79c2023 = $(`<div id="html_5d766a8d37b68ac74ec8c199c79c2023" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Eaton Socon</h1><div class="nugget-popup"><p>Eaton Socon is identified on the flood risk maps as lying in low&ndash;lying, river&ndash; and surface&ndash;water&ndash;prone areas and formed part of the St Neots flooding event that began 23 December 2020. [PAG,IMG] (p6)</p></div><div class="nugget-popup"><p>Area D (Eaton Socon North) recorded both internal and external property flooding: four internal property flood reports and three external flood reports to gardens/outbuildings were recorded during the event. [TAB] (p11)</p></div><div class="nugget-popup"><p>The Eaton Socon (North) area experienced flooding during the December 2020 incident, affecting both internal and external premises of properties. [PAG,IMG] (p12)</p></div><div class="nugget-popup"><p>Area affected by Duloe Brook overtopping/exceeding channel capacity; properties in Squires Court and locations at the Duloe Brook&ndash;River Great Ouse confluence experienced flooding and surcharging of car&ndash;park drainage when river levels were high. (p16)</p></div><div class="nugget-popup"><p>LLFA attended to investigate internal flooding, inspected relevant features and spoke with residents and representatives; actions were taken to determine next steps for risk management authorities. Follow&ndash;up included increased gully maintenance and investigations by Anglian Water into asset resilience. [TAB] (p22)</p></div><div class="nugget-popup"><p>Fluvial (river) flooding affected Eaton Socon (North) during 23 Dec 2020 &ndash; 26 Dec 2020. Table 3 identifies capacity issues and RMA operational issues as contributors in this area. [TAB] (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 properties; 3 external flood reports [TAB] (p11)</p></div><div class="nugget-popup quant"><p>4 properties flooded internally; 3 properties experienced external flooding [PAG,IMG] (p12)</p></div></div></body></div>`)[0];

                var html_02b0c9b3e1653808da4a1ea1dd3556e7 = $(`<div id="html_02b0c9b3e1653808da4a1ea1dd3556e7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Eynesbury</h1><div class="nugget-popup"><p>Part of St Neots that was affected when flooding began on 23 December 2020. Flooding was caused by intense rainfall and high River Great Ouse levels, with surface water flooding evident across low&ndash;lying areas shown on the council map. The event was declared a major incident (23 December 2020) and response was coordinated by Cambridgeshire Police. Flooding was exacerbated by prolonged high river levels that reduced discharge capacity of contributory watercourses and connected drainage. [PAG,IMG] (p6)</p></div><div class="nugget-popup"><p>Flooding affected properties in the area: internal property flooding reported and external flooding to gardens/outbuildings. Identified as one of five key risk areas in St Neots during the December 2020 event. [TAB] (p11)</p></div><div class="nugget-popup"><p>Property flooding reported in the Eynesbury (East) key risk area: internal flooding of residential properties and external flooding of gardens/outbuildings affecting local premises. [PAG,IMG] (p12)</p></div><div class="nugget-popup"><p>Internal property flooding was investigated by the LLFA; officers attended site to inspect features, speak to residents and and determine next steps for Risk Management Authorities. [IMG] (p23)</p></div><div class="nugget-popup"><p>Fluvial (river) flooding affected Eynesbury (East) during 23 Dec 2020 &ndash; 26 Dec 2020. Table 3 identifies RMA operational issues as a relevant issue in this area. [TAB] (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 properties (internal); 2 properties (external) [TAB] (p11)</p></div><div class="nugget-popup quant"><p>3 properties (internal); 2 properties (external) [PAG,IMG] (p12)</p></div></div></body></div>`)[0];

opup quant"><p>6 properties flooded internally; flood water depth reported at approximately 15 cm in the road [PAG,IMG] (p12)</p></div><div class="nugget-popup quant"><p>15cm; 50&ndash;90cm (p13)</p></div></div></body></div>`)[0];
