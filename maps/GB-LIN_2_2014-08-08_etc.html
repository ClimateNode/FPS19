ent. [IMG,MUL] (p91)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 properties externally flooded (Chatteris House and Cromwell House) (p11)</p></div><div class="nugget-popup quant"><p>2 properties [MUL] (p88)</p></div></div></body></div>`)[0];

ss="nugget-popup quant"><p>1 property internally flooded; flooded on three occasions [MUL] (p17)</p></div><div class="nugget-popup quant"><p>4 properties internally flooded (on Little Coates Road) [IMG,PAG,MUL] (p19)</p></div><div class="nugget-popup quant"><p>4 properties (p20)</p></div></div></body></div>`)[0];

                var html_b6dce39a9092c839d3b8bb58566b1c04 = $(`<div id="html_b6dce39a9092c839d3b8bb58566b1c04" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>North East Lincolnshire</h1><div class="nugget-popup"><p>Internal flooding of residential properties on Henry Street, Lawrence Street and Lister Street in Grimsby, resulting in internal property flooding. [IMG,MUL] (p34)</p></div><div class="nugget-popup"><p>Flooding in Grimsby (Area 14, Willingham Street) occurred within North East Lincolnshire: 1 property externally flooded on 20 July 2014 and 3 properties internally flooded on 10 August 2014; the report indicates additional external flooding likely affected other properties in the area due to topography. [IMG,MUL] (p59)</p></div><div class="nugget-popup"><p>Internal flooding of one residential property at Torbay Drive, Scartho: a small difference in levels allowed surface water to enter one property but not neighbouring properties; engagement on property&ndash;level flood protection recommended to neighbours at risk. [IMG] (p69)</p></div><div class="nugget-popup"><p>The report records a real flooding incident within North East Lincolnshire: one property on Salisbury Avenue, Waltham was flooded when water surcharged from a manhole in the adjacent grassed area, ran down the driveway, flooded the back garden and entered the side utility room. [IMG] (p72)</p></div><div class="nugget-popup"><p>A property on Hainton Avenue, Grimsby (within North East Lincolnshire) was internally flooded when the main sewer surcharged and backed up out of domestic gullies to the rear of the property; floodwater entered through a rear door into the utility area and was contained there due to the lower level of that room and the property's topographical low spot. Surrounding gardens and paved surfaces draining toward the property exacerbated the event. [IMG] (p84)</p></div><div class="nugget-popup"><p>North East Lincolnshire Council's Gully Cleansing Department visited all affected areas within a month to check and clear highway gullies; gullies were found to be operating in a satisfactory condition. A site investigation including sewer inspections was undertaken within four months. [MUL] (p88)</p></div><div class="nugget-popup"><p>The map and report cover parts of the borough (North East Lincolnshire) and identify mapped surface water flood risk including a concentrated high&ndash;risk cluster (Cromwell Road area). The report also links intense summer storm rainfall to the observed flooding and describes borough&ndash;level mitigation actions (e.g. installing rain gauges). [IMG,MUL] (p91)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>16 properties [IMG,MUL] (p34)</p></div><div class="nugget-popup quant"><p>1 property; 3 properties [IMG,MUL] (p59)</p></div><div class="nugget-popup quant"><p>1 property [IMG] (p69)</p></div><div class="nugget-popup quant"><p>1 property [IMG] (p72)</p></div><div class="nugget-popup quant"><p>1 property [IMG] (p84)</p></div></div></body></div>`)[0];

                var html_39f3f14b0e2efbc6909f80b1c700b966 = $(`<div id="html_39f3f14b0e2efbc6909f80b1c700b966" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Grimsby</h1><div class="nugget-popup"><p>Multiple rainfall events caused surface&ndash;water/urban flooding affecting central Grimsby and other parts: internal flooding of properties in central Grimsby occurred during the event peaking 03:30&ndash;04:30 on 20 July 2014; further intense rainfall on 8 August 2014 caused localised flooding (external flooding and some internal flooding in parts); and the event peaking 11:15&ndash;12:15 on 10 August 2014 again produced internal flooding in central Grimsby. [PAG,MUL] (p7)</p></div><div class="nugget-popup"><p>Internal flooding of some properties in central Grimsby; external/surface water flooding elsewhere in the town causing minor disruption. The most westerly part of Grimsby (including Wybers Wood, Willows Estates and Laceby by&ndash;pass) was affected by intense rainfall. [PAG,MUL] (p8)</p></div><div class="nugget-popup"><p>Multiple locations within Grimsby experienced internal and external property flooding driven mainly by surcharging sewers (main trunk sewer and highway gullies). Manhole lids were forced off by sewer surcharge; flood embankments and new sheet piling prevented drainage to the New Cut Drain, causing water to back up towards properties and run across footpaths, down driveways and into garages and houses. [MUL] (p10)</p></div><div class="nugget-popup"><p>Multiple streets and residential properties in Grimsby were affected: properties on Mayfair Drive West and Timberley Drive flooded; sheltered housing and a care home externally flooded on Barmouth Drive; properties and care homes externally flooded on Cromwell Road; sewer surcharging caused manhole covers and top slabs to be blown off and severe footway damage along the trunk sewer route. [PAG] (p11)</p></div><div class="nugget-popup"><p>Properties in the Broadway West area of Grimsby experienced flooding when the combined sewer surcharged, with at least one property internally flooded and others externally flooded. [MUL] (p17)</p></div><div class="nugget-popup"><p>Area experienced public sewer surcharging (historic and during the incidents), contributing to internal flooding risk at properties; welding of a manhole cover and reported surcharging incidents were recorded during the investigation. [MUL] (p18)</p></div><div class="nugget-popup"><p>Two community facilities (Leisure Centre and Auditorium) experienced internal flooding caused by combined sewer surcharging, with raw sewage entering internal areas. [MUL] (p23)</p></div><div class="nugget-popup"><p>Localised surface water and sewer surcharging affected parts of the town including Carson Avenue; one property in Carson Avenue was internally flooded and manholes/sewers were surcharging in nearby streets. (p27)</p></div><div class="nugget-popup"><p>North and central Grimsby (low&ndash;lying, flat areas) experienced increased siltation and reduced sewer gradients leading to poorer sewer performance, surcharging and urban flooding. Residents installed property&ndash;level protection (e.g. air bricks with flood covers) and recommendations were made for systemic and property&ndash;level mitigation. [MUL] (p28)</p></div><div class="nugget-popup"><p>The report records at least one property in Chestnut Avenue (within Grimsby) internally flooded on both 20 July 2014 and 10 August 2014; the town also contains the Carson Avenue area mapped as an 'Area of Flooding' for surface water. [IMG,PAG,MUL] (p29)</p></div><div class="nugget-popup"><p>Multiple incidents of flooding affected the town: internal flooding of residential properties (including Chestnut Avenue and Fairfax Road), internal flooding of businesses (ground floors) from both Cromwell Road build&ndash;up and a surcharged manhole to the rear, roads became impassable, and an electricity substation on Marshall Avenue was internally flooded causing loss of power to many homes. [MUL] (p30)</p></div><div class="nugget-popup"><p>North and central Grimsby (including the Cromwell Road area) experienced flooding during the events. Ageing sewerage systems, slack gradients in low&ndash;lying parts of Grimsby and siltation contributed to sewer surcharging and urban/surface&ndash;water flooding across the area. [MUL] (p32)</p></div><div class="nugget-popup"><p>Parts of Grimsby (Henry Street, Lawrence Street and Lister Street) experienced internal flooding of properties due to intense rainfall causing surface water runoff and sewers to surcharge and back up. [MUL] (p35)</p></div><div class="nugget-popup"><p>Low&ndash;lying parts of Grimsby (notably Lawrence Street) experienced sewer surcharging during the reported flood events, with the lowest&ndash;lying catchment (Lawrence Street) having the majority of properties either internally flooded or coming very close. The local sewer network (mainly 225/300mm pipes) and siltation/maintenance issues were identified as contributors. [MUL] (p36)</p></div><div class="nugget-popup"><p>North and central Grimsby (low&ndash;lying flat areas) experienced sewer surcharging and surface&ndash;water&ndash;related flooding during extreme rainfall, prompting council gully clearance and investigations into sewer capacity and outfall/pumping improvements. [MUL] (p40)</p></div><div class="nugget-popup"><p>Internal sewer&ndash;related flooding occurred at Freshney Place shopping centre in Grimsby, with floodwater containing raw sewage entering business premises. (p42)</p></div><div class="nugget-popup"><p>Central Grimsby (area around Freshney Place) experienced surface water flooding during the heavy rainfall event. A Council engineer noted the extent of flooding early afternoon on 10th August and recorded that two affected properties (Area 10 &ndash; Welholme Avenue) had flood boards in place and a pump was used to prevent internal flooding. [IMG] (p43)</p></div><div class="nugget-popup"><p>Parts of Grimsby experienced surface water and sewer&ndash;related flooding that caused internal flooding of residential properties (notably on Ainslie Street and Wintringham Road). Floodwater carried raw sewage and entered properties via fronts (road/ gullies) and rears (public sewers), and via door openings, air bricks and defective brickwork. [MUL] (p47)</p></div><div class="nugget-popup"><p>Storm flows from the sewer/pumping network affecting west Grimsby were linked to the flooding of properties there during the summer 2014 events; west Grimsby is identified as the location of nearly all properties affected by those floods. [MUL] (p49)</p></div><div class="nugget-popup"><p>A large central Grimsby sewer catchment surcharged during the events, contributing to flooding at Doughty Road subway and basement backflow at the Town Hall. [MUL] (p51)</p></div><div class="nugget-popup"><p>Surcharging of the main trunk sewer for central Grimsby caused a lower&ndash;lying manhole in the Doughty Road depot to discharge floodwater into a subway; pumped water from the subway recirculated back into the sewer outfall connection, sustaining flooding. The sewer into which the outfall discharged was heavily silted, reducing performance. [PAG,MUL] (p52)</p></div><div class="nugget-popup"><p>Substantial flooding of the highway occurred at the Peaks Parkway Underpass (A16) and the Ellis Way Underpass (A1136) in Grimsby; these underpasses were reported as substantially flooded during the events. [IMG,PAG,MUL] (p55)</p></div><div class="nugget-popup"><p>Substantial highway flooding at the Peaks Parkway and Ellis Way underpasses led to local transport disruption and underpass inundation within the town. [MUL] (p56)</p></div><div class="nugget-popup"><p>Willingham Street, within Grimsby (Area 14), experienced flooding: 1 property was externally flooded on 20 July 2014 and 3 properties were internally flooded on 10 August 2014. The report also notes that, because of local topography, many more properties in the area were likely affected by external flooding on both dates. [IMG,MUL] (p59)</p></div><div class="nugget-popup"><p>North and central Grimsby (low&ndash;lying flat areas) experienced flooding issues linked to intense rainfall, slack sewer gradients, siltation and ageing sewer infrastructure; area has a history of significant flooding requiring drainage improvement funding. [MUL] (p61)</p></div><div class="nugget-popup"><p>Siltation in the sewer network (noted in north/central Grimsby including East Marsh Ward) reduced system capacity during intense rainfall and contributed to sewer and surface&ndash;water/urban flooding. Floodwater entered one property due to a small difference in levels so that the single dwelling flooded while neighbouring properties did not. [MUL] (p68)</p></div><div class="nugget-popup"><p>At least one property in Grimsby (on Hainton Avenue) experienced internal flooding when the combined sewer surcharged and backed up through domestic gullies, allowing floodwater into the property's rear utility area. (p85)</p></div><div class="nugget-popup"><p>Across Grimsby (Cromwell Road, Service Road 26 and Ravenscar Road) there were external property floods and extensive public highway flooding caused by surcharging of the main sewer and subsequent backup through highway and domestic gullies. [MUL] (p88)</p></div><div class="nugget-popup"><p>Intense summer 2014 rainfall caused urban surface water and sewer flooding across north and central Grimsby, producing sewer surcharging, internal property flooding and local disruption; slack sewer gradients and siltation in low&ndash;lying parts of Grimsby contributed to poor sewer performance. (p93)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Greyfriars: 5 properties externally flooded (20 July 2014); 1 property internally flooded and 4 properties externally flooded (10 August 2014); Grasby Crescent: 4 properties externally flooded (20 July 2014) and 4 properties externally flooded (10 August 2014); Anderby Drive: 3 properties externally flooded (20 July 2014) and 9 properties externally flooded (10 August 2014); St. Nicholas Drive: 16 properties internally flooded and 9 properties externally flooded (10 August 2014); Mayfair Drive West: 1 property internally flooded and 1 property externally flooded (10 August 2014). (Aggregate: 18 properties internally flooded; 39 properties externally flooded; total 57 properties affected). [MUL] (p10)</p></div><div class="nugget-popup quant"><p>1 property internally flooded; 1 property externally flooded (Mayfair Drive West); 1 property externally flooded (Timberley Drive); Stratford House and The Willows externally flooded; Chatteris House and Cromwell House externally flooded [PAG] (p11)</p></div><div class="nugget-popup quant"><p>1 property internally flooded; flooded on three occasions [MUL] (p17)</p></div><div class="nugget-popup quant"><p>2 community facilities internally flooded [MUL] (p23)</p></div><div class="nugget-popup quant"><p>1 property (p27)</p></div><div class="nugget-popup quant"><p>1 property [IMG,PAG,MUL] (p29)</p></div><div class="nugget-popup quant"><p>1 property (Chestnut Avenue) internally flooded on 20th July 2014 and 10th August 2014; 1 property (Fairfax Road) internally flooded on 20th July 2014; Marshall Avenue: 1 property internally flooded and 1 electricity substation internally flooded (20th July 2014); Marshall Avenue: 2 properties internally flooded and 1 property externally flooded (10th August 2014) [MUL] (p30)</p></div><div class="nugget-popup quant"><p>16 properties [MUL] (p35)</p></div><div class="nugget-popup quant"><p>6 businesses internally flooded (p42)</p></div><div class="nugget-popup quant"><p>2 properties [IMG] (p43)</p></div><div class="nugget-popup quant"><p>4 properties internally flooded on 20th July 2014; 7 properties internally flooded on 10th August 2014; 1 property internally flooded on 20th July 2014 [MUL] (p47)</p></div><div class="nugget-popup quant"><p>600mm [MUL] (p56)</p></div><div class="nugget-popup quant"><p>1 property; 3 properties [IMG,MUL] (p59)</p></div><div class="nugget-popup quant"><p>one property [MUL] (p68)</p></div><div class="nugget-popup quant"><p>1 property (p85)</p></div><div class="nugget-popup quant"><p>3 properties [MUL] (p88)</p></div></div></body></div>`)[0];
