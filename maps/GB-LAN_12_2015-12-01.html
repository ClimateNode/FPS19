</div><div class="nugget-popup"><p>High river levels overtopped banks (left bank into Recreation Gardens and later the right bank), and undermined the central pier of Bridgeway Bridge leading to its collapse. (p21)</p></div><div class="nugget-popup"><p>Cellar flooding along Bacup Road (over footbridges of the River Irwell) was believed to be caused by a groundwater issue associated with proximity to the River Irwell. (p23)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 properties (p15)</p></div><div class="nugget-popup quant"><p>50 properties; 3 inches of water in cellars (p18)</p></div><div class="nugget-popup quant"><p>16 properties; 24 properties [PAG] (p20)</p></div></div></body></div>`)[0];

                var html_c9cf9839e4ce3f54d03b35b27793bc89 = $(`<div id="html_c9cf9839e4ce3f54d03b35b27793bc89" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lancashire</h1><div class="nugget-popup"><p>Significant flooding occurred across Lancashire in December 2015; the event exposed shortcomings in communication to affected communities and led to the development of district&ndash;level reports and follow&ndash;up actions by risk management authorities. [PAG] (p3)</p></div><div class="nugget-popup"><p>Lancashire experienced major flooding during December 2015 (the highest recorded river flows and the wettest December), resulting in widespread impacts on people, homes and businesses across the county. [TAB] (p8)</p></div><div class="nugget-popup"><p>Extreme storms and rainfall in November and December 2015 caused widespread flooding across Lancashire during December 2015, damaging private gardens, garages and out&ndash;buildings, business premises, agricultural property and critical public infrastructure including roads, bridges and retaining walls, water treatment plants, power and communications installations, and community buildings such as schools, village and town halls. (p9)</p></div><div class="nugget-popup"><p>Communities across the county experienced flooding as a result of two major storm events in December 2015. The extent and geographic distribution of flooding led to a countywide investigation to identify affected communities and to track and prioritise remedial actions via stage two reports. [PAG] (p10)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 2,500 properties flooded [TAB] (p8)</p></div><div class="nugget-popup quant"><p>over 2,500 properties (p9)</p></div></div></body></div>`)[0];
