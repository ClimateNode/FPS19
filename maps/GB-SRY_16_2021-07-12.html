                var html_36cb8658851f92165944b5bf83c7af95 = $(`<div id="html_36cb8658851f92165944b5bf83c7af95" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Nork Way, Nork</h1><div class="nugget-popup"><p>Surface water flooding on 12th July 2021 affected properties on Nork Way (within catchment 2); impacts were confirmed by site inspection and resident photographs. (p4)</p></div><div class="nugget-popup"><p>Surface water flooding on 12th July 2021 impacted the Nork Way flow route within Catchment 2, causing flooding to properties as confirmed by site visits. [PAG,IMG] (p5)</p></div><div class="nugget-popup"><p>Rapid surface water runoff collected and flowed across the highway towards low points in front of properties causing external flooding; foul sewage inundation affected properties in August 2020 due to damaged non&ndash;return valves (subsequently replaced). Residents installed flood gates and other barriers; some properties experienced internal flooding with foul sewage. [PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Surface water runoff collected and flowed across the highway towards low points in front of properties, with gullies overtopped and water continuing down to low points. Additionally, internal flooding with foul sewage occurred at 83A Nork Way (August 2020) caused by damaged non&ndash;return valves; 83A has since installed flood gates and internal garage access gates which have been left up. Thames Water was reported to the August 2020 sewage incident and the damaged non&ndash;return valves were replaced. [PAG,MUL] (p12)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>External flooding: part of Catchment 2 total of 8 properties (12 July 2021); 2 properties (83A and 87 Nork Way) impacted by foul sewage in August 2020; 1 property (83A) flooded internally with foul sewage (August 2020). these have since been replaced); 83A has since installed flood gates and internal garage access barriers. [PAG,MUL] (p12)</p></div><div class="nugget-popup"><p>The Nork area experienced very high rainfall on 12th July 2021 that contributed to surface water flooding across the local catchment, overwhelming highway drainage and generating fast overland flows toward low points. (p16)</p></div><div class="nugget-popup"><p>Intense rainfall on 12th July 2021 produced surface water runoff in the Nork area; runoff followed mapped surface water flow routes and increased in severity since the nearby development, with flow splitting and continuing south onto the highway and east along a footpath toward Kingswood. (p20)</p></div><div class="nugget-popup"><p>Heavy rainfall on 12 July 2021 caused flooding along modelled surface water flow routes in Nork. Surface water accumulated at topographical low points, overtopped kerb thresholds and flowed towards properties situated lower than the road and drainage system; this flooding was worsened by increased runoff from local development and hard landscaping and where residents had extended into or diverted the flow routes. (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 properties (83A and 87 Nork Way) [PAG,MUL] (p12)</p></div></div></body></div>`)[0];

                var html_823d27ce2fe9f575d48f57527138246e = $(`<div id="html_823d27ce2fe9f575d48f57527138246e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Tattenhams</h1><div class="nugget-popup"><p>Parts of Tattenhams were flooded during the July 2021 flood event. [IMG] (p1)</p></div><div class="nugget-popup"><p>Internal property flooding to properties in the Tattenhams area; residents provided photographic evidence of internal flooding and road&ndash;closure information was recorded. The investigation focuses on the flooding that occurred on 12 July 2021, with a similar event on 13 August 2020. [MUL] (p3)</p></div><div class="nugget-popup"><p>Properties in the Tattenhams area experienced surface water flooding; site visits and resident photographs were used to confirm the impact and extent of flooding to properties on 12th July 2021. [PAG] (p4)</p></div><div class="nugget-popup"><p>Surface water flooding affected properties in the Tattenhams area; a site visit for this investigation confirmed the impact and extent of flooding to properties on 12 July 2021. [PAG,IMG] (p5)</p></div><div class="nugget-popup"><p>The Tattenhams area experienced intense rainfall and steep terrain&ndash;driven rapid flows that routed water to low points, exceeding drainage capacity and causing both surface water inundation and foul sewer surcharging at manholes. (p7)</p></div><div class="nugget-popup"><p>The Tattenhams area experienced intense rainfall on 12th July 2021 leading to rapid overland surface water flows, overwhelmed gullies and highway drainage, and flows collecting at low points that caused property and highway flooding across the area. [PAG] (p16)</p></div><div class="nugget-popup"><p>On 12th July 2021 very high rainfall generated surface water runoff in the Tattenhams area that contributed to the surface water flow route described; runoff severity increased following development to the north and contributed to flows onto the highway and along the eastern footpath. (p20)</p></div><div class="nugget-popup"><p>Heavy rainfall on 12 July 2021 caused flooding along modelled surface water flow routes in the Tattenhams area. Surface water collected in valley low points, overtopped kerbs and flowed towards properties at lower elevations; flooding was exacerbated by urbanisation in the catchment (increased hard surfaces and reduced infiltration) and by alterations that diverted or encroached on flow routes. (p22)</p></div></div></body></div>`)[0];
