                var html_78ec96c8e50603d350b9f8f49eb84792 = $(`<div id="html_78ec96c8e50603d350b9f8f49eb84792" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hargrave</h1><div class="nugget-popup"><p>Flood incident on 27 December 2017 at the B645 east of Hargrave where surface water drainage systems were unable to convey rainwater, causing excess surface water to flow to low points around private property. Internal flooding of one dwelling has occurred (on more than one occasion within the last five years). (p7)</p></div><div class="nugget-popup"><p>Internal flooding of a property located adjacent to the B645 east of Hargrave; internal flooding has been experienced on more than one occasion in the last five years, triggering a formal investigation. [PAG] (p9)</p></div><div class="nugget-popup"><p>Recommendations are made to undertake regular highway drainage cleansing throughout Hargrave to manage highway runoff and reduce flood risk to properties and the highway network. (p16)</p></div><div class="nugget-popup"><p>Heavy sleety snow and rainfall on a saturated catchment caused drainage systems to be unable to collect and convey rainwater. Excess surface water flowed over ground following localised topography to low points around private properties; an affected private property was located in a high risk area for surface water flooding. (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one dwelling (p7)</p></div><div class="nugget-popup quant"><p>one property [PAG] (p9)</p></div></div></body></div>`)[0];
