                var html_df9074fc9ad0d30480848be75d6530b7 = $(`<div id="html_df9074fc9ad0d30480848be75d6530b7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>St Peters Court</h1><div class="nugget-popup"><p>Culverted River Misbourne and highway drainage under the High Street / St Peter's Court were implicated in flooding: connections into the east culvert beneath the High Street were mapped, and the area around TQ 00102 90885 experienced road and property flooding. A nearby sewer overflow onto Gravel Hill was also identified as a related issue. (p10)</p></div><div class="nugget-popup"><p>The culvert beneath St Peter's Court was partly restricted, contributing to road and property flooding in the nearby area (area B around TQ 00102 90885). High River Misbourne levels and the culvert restriction prevented gullies on the High Street from discharging at full capacity; once the culvert was cleared and gullies jetted, surface water cleared rapidly. (p23)</p></div><div class="nugget-popup"><p>A partially restricted culvert under St Peter's Court caused a flow obstruction that prevented highway drainage from discharging into the River Misbourne, resulting in a backup of surface water at ground level. [PAG] (p29)</p></div><div class="nugget-popup"><p>The culvert under St Peter's Court was partially restricted, causing water to back up and preventing surface water from draining into the River Misbourne; this obstruction contributed to a backup of surface water at ground level. [PAG] (p30)</p></div><div class="nugget-popup"><p>A blocked riparian&ndash;owned culvert at St Peter's Court was identified as causing local flooding; the Environment Agency contacted the riparian owner, authorised and commissioned emergency clearance, carried out site visits and arranged jetting/clearance works to alleviate the flooding. [TAB,MUL] (p32)</p></div><div class="nugget-popup"><p>The culvert under St Peter's Court was partially restricted, causing water to back up and preventing surface water from draining via the surface water drainage infrastructure. (p37)</p></div><div class="nugget-popup"><p>The St Peters Court culvert suffered flow restrictions/obstructions that contributed to surface water/urban flooding in Chalfont St Peter (including the High Street). Recommended actions include CCTV inspection, clearing/repair of outfalls and prioritised maintenance (jetting of gullies and culvert repairs) to reduce future surface water flooding. [TAB] (p38)</p></div><div class="nugget-popup"><p>Problems with surface water outfalls into the St Peter's Court culvert were identified as contributing to surface water flooding in the nearby High Street; recommended actions included CCTV survey, clearing/maintenance of the culvert and jetting of gully connections. [TAB] (p39)</p></div></div></body></div>`)[0];

                var html_9a4549e4cef58f9a6988fd570ea071d0 = $(`<div id="html_9a4549e4cef58f9a6988fd570ea071d0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Misbourne</h1><div class="nugget-popup"><p>The Misbourne catchment experienced high river levels driven by above&ndash;average rainfall and exceptionally high groundwater; catchment issues (including culvert restriction at St Peter's Court) led to local water backing up and surface water flooding. The catchment was later included in Thames Water's information&ndash;gathering exercise into infiltration and groundwater problems. [PAG,MUL] (p29)</p></div><div class="nugget-popup"><p>Water levels in the River Misbourne were high due to above&ndash;average prolonged rainfall and exceptionally high groundwater levels; these high river levels contributed to prevented surface water drainage and to prolonged flooding and repeated sewer overflows in Chalfont St Peter. (p37)</p></div><div class="nugget-popup"><p>Obstructions and culvert flow restrictions on the Misbourne contributed to flooding in Chalfont St Peter (including surface water flooding affecting the High Street). Actions recommended include culvert CCTV surveys, enforcement against landowners who failed to remove obstructions, upstream land&ndash;management and consideration of a telemetered gauge to improve warnings. [TAB,PAG] (p38)</p></div></div></body></div>`)[0];

                var html_efc1b1b9b064a91f126b8106b1b5e7ed = $(`<div id="html_efc1b1b9b064a91f126b8106b1b5e7ed" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>High Street, Chalfont St Peter</h1><div class="nugget-popup"><p>The High Street was closed due to flood impacts (including foul water overflows and drainage backups), causing significant local disruption and affecting access and businesses in the village centre. (p5)</p></div><div class="nugget-popup"><p>Culverted River Misbourne and highway drainage under the High Street / St Peter's Court were implicated in flooding: connections into the east culvert beneath the High Street were mapped, and the area around TQ 00102 90885 experienced road and property flooding. A nearby sewer overflow onto Gravel Hill was also identified as a related issue. (p10)</p></div><div class="nugget-popup"><p>Gullies on the High Street were unable to discharge to the River Misbourne at full capacity leading to surface water accumulation; manholes overflowed with sewage&ndash;laden water entering the George pub on the High Street during incidents reported in January and February 2014. [MUL] (p24)</p></div><div class="nugget-popup"><p>Sewage&ndash;laden water from overflowing manholes entered premises on the High Street: The George pub suffered internal flooding on multiple occasions (reported weekend 05/06 January 2014; again 12 February 2014) and the Greyhound Inn suffered internal flooding (07 February 2014). Road and pavement around the nearby A413 zebra crossing were contaminated and required clean&ndash;up; pumping to relieve High Street flooding was considered but not used due to risk to downstream properties. [PAG,MUL] (p25)</p></div><div class="nugget-popup"><p>The culvert downstream of High Street was surveyed and cleared as part of the response; TfB cleared road gullies in the flooded area after culvert clearing. The EA reported no obstructions, culverts of ample capacity and the channel conveying water efficiently along this stretch. [TAB] (p27)</p></div><div class="nugget-popup"><p>Experienced a sewage overflow incident; Thames Water reported the High Street incident as closed on 10 February 2014 and cleanup of sewage from road and pavements was carried out. [TAB] (p31)</p></div><div class="nugget-popup"><p>Sewage overflow onto the road and pavements; Thames Water carried out cleanup of sewage from road and pavements. Transport for Buckinghamshire/BCC closed the High Street, moved sandbags to protect High Street properties and closed the footpath from High Street to the Church Lane parking lot. [TAB,PAG,MUL] (p32)</p></div><div class="nugget-popup"><p>Surface water flooding occurred in the High Street, linked to blocked outfalls into the St Peter's Court culvert and gully/connection issues; interventions included clearing the culvert, jetting gully connections and investigating other causes if flooding recurred. [TAB] (p39)</p></div><div class="nugget-popup"><p>Surcharging manholes on High Street caused water to bubble up and overflow onto the pavement and road; standing floodwater covered the street and adjacent footpath (to a parking lot), with temporary barriers placed to warn/restrict access. [IMG,MUL] (p46)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 pub (George) flooded [MUL] (p24)</p></div></div></body></div>`)[0];

                var html_fb76df4f27d40eb827f3cae0039a638b = $(`<div id="html_fb76df4f27d40eb827f3cae0039a638b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Buckinghamshire</h1><div class="nugget-popup"><p>The county was the subject of a flood investigation covering a flood event that occurred during January&ndash;March 2014; the report analyses conditions, watercourses, incident response and provides conclusions and recommendations related to that flooding. (p2)</p></div><div class="nugget-popup"><p>Chalfont St Peter (within Buckinghamshire) experienced internal flooding of commercial premises and closure of the High Street, disrupting local businesses and access. [IMG,PAG] (p6)</p></div><div class="nugget-popup"><p>Parts of the county (Chalfont St Peter and nearby villages) were affected by manhole/sewer overflows and culvert&ndash;related high river/ surface water levels that caused sewage&ndash;laden water to enter commercial premises (The George pub, Greyhound Inn), required road closures and clean&ndash;up, caused an upstream Affinity Water pumping station in Chalfont St Giles to cease pumping, and prompted emergency culvert clearance works by the Environment Agency. [MUL] (p25)</p></div><div class="nugget-popup"><p>Organised and led multi&ndash;agency response to high river levels in Chalfont St Peter (meeting on 18 February 2014). Coordinated jetting operations downstream of a culvert; contractor unable to deploy silt nets because of high water. Jetting removed large amounts of silt, pieces of plywood, branches and general refuse and continued until 21 February 2014; remaining silt was expected to be flushed out naturally as river levels fell slowly during the week of the works. [MUL] (p26)</p></div><div class="nugget-popup"><p>Experienced road flooding (including at the Narcot Lane/Welders Lane junction) and multiple sewage overflow incidents affecting roads, pavements and local properties; local authority distributed FloodSax® to affected properties and assisted with site visits and reporting. [TAB,MUL] (p31)</p></div><div class="nugget-popup"><p>Flooding across the county prompted emergency actions: TfB distributed and installed sandbags (including two tonnes in one night); Thames Water removed a blockage that ended a sewage overflow at the A413 zebra crossing; Thames Water installed a temporary pumping and filtration system beside the George pub to discharge water into the River Misbourne. (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>two or more business premises; High Street closed for approximately two weeks [IMG,PAG] (p6)</p></div><div class="nugget-popup quant"><p>two properties [TAB,MUL] (p31)</p></div></div></body></div>`)[0];

                var html_8dc35170e7bba0d98caf9b487c5bb7d0 = $(`<div id="html_8dc35170e7bba0d98caf9b487c5bb7d0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hertfordshire</h1><div class="nugget-popup"><p>Widespread flooding occurred in the EA Hertfordshire and North London area, prompting the opening of the Hatfield Area Incident Room to manage the response. (p31)</p></div></div></body></div>`)[0];

                var html_e33acc0855f2c3a09ec6f7777fbe4aa5 = $(`<div id="html_e33acc0855f2c3a09ec6f7777fbe4aa5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Chalfont St Peter</h1><div class="nugget-popup"><p>The village experienced flooding during January&ndash;March 2014 following prolonged rainfall and exceptionally high groundwater. A culvert flow restriction caused the River Misbourne to back up, contributing to backup of the surface water drainage network. Blockage and groundwater infiltration within the sewer network caused foul water overflows onto the A413 and within the village centre. (p4)</p></div><div class="nugget-popup"><p>After a prolonged period of above&ndash;average rainfall and exceptionally high groundwater levels, river levels were raised and a culvert flow restriction in the village caused the River Misbourne to back up, which may have caused a backup of the surface water drainage network. A blockage in the sewer network caused an overflow of foul water onto the A413 and groundwater infiltration into the sewer network caused foul water overflows within the village centre. Internal flooding affected business premises within the village. [PAG] (p5)</p></div><div class="nugget-popup"><p>The village contained two identified flood problem locations: a sewer overflow discharging onto Gravel Hill (location A) and road and property flooding at a junction near location B (around TQ 00102 90885). The River Misbourne flows through the village (partly culverted in the centre) and is implicated in local fluvial/drainage&ndash;related flooding that contributed to these issues. [IMG,PAG] (p8)</p></div><div class="nugget-popup"><p>Sewer overflow discharged onto Gravel Hill (location A) and road and property flooding occurred in the area around TQ 00102 90885 (location B). Flooding was associated with the River Misbourne and a small tributary, and the village centre contains a culverted section of the Misbourne (culvert under St Peter's Court split into two pipes) that is implicated in local drainage/flooding behaviour. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>Road and property flooding in the village centre (area B). A sewer overflow discharged onto Gravel Hill (area A). Culverting of the River Misbourne in the centre and culvert connections beneath the High Street/St Peter's Court were implicated in the flooding. [IMG,PAG] (p10)</p></div><div class="nugget-popup"><p>During the January&ndash;March 2014 event groundwater incursion affected Chalfont St Peter by entering the foul sewer network, contributing to sewer&ndash;related flooding problems in the village. [IMG,PAG] (p15)</p></div><div class="nugget-popup"><p>Groundwater incursion entered the foul sewer network, causing sewer flooding in the village during the reported event. [IMG,PAG] (p16)</p></div><div class="nugget-popup"><p>Groundwater incursion into the foul sewer network during the event described in the report (January&ndash;March 2014). Historic fluvial and surface&ndash;water flooding of the village centre (November 2000&ndash;February 2001) with sewage often combining with floodwater, causing road closures (including one week in February 2001) and business disruption (the Greyhound Inn repeatedly flooded and closed from February 2001). The village centre was flooded to a depth of 45 cm in February 2001. [PAG,MUL] (p17)</p></div><div class="nugget-popup"><p>Manholes overflowed with sewage&ndash;laden water causing sewage to enter the George pub on the High Street; gullies on the High Street were unable to discharge fully due to high River Misbourne levels and culvert restriction, causing surface water accumulation; internal flooding occurred at the Greyhound Inn and a road closure occurred associated with the flooding. [MUL] (p24)</p></div><div class="nugget-popup"><p>High water levels in the River Misbourne and exceptionally high groundwater levels contributed to flooding in the village centre; the culvert under St Peter's Court was partially restricted causing water to back up and preventing surface water draining into the river via highway drainage connections. Village&ndash;centre flooding affected parking and pavement use by customers and business activity. At least two business premises flooded internally. (p29)</p></div><div class="nugget-popup"><p>Areas of Chalfont St Peter were affected by flooding associated with the River Misbourne and by surface water flooding; the High Street experienced surface water flooding and residents adjacent to the Misbourne were impacted. [TAB,PAG] (p38)</p></div><div class="nugget-popup"><p>Surface&ndash;water flooding affected the High Street in Chalfont St Peter associated with blocked/poorly performing road drainage (St Peter's Court culvert outfalls and gully connections). The event prompted CCTV investigation of the culvert, gully cleansing/jetting and consideration of temporary flood defences and other mitigation measures. [TAB,PAG] (p39)</p></div><div class="nugget-popup"><p>The area experienced flooding in January&ndash;March 2014 related to the River Misbourne (and associated culverts/ditches), sewer infiltration and capacity problems, and surface water/urban runoff. This prompted reviews of temporary flood defences, riparian maintenance guidance and proposals to form a local Flood Action Group. [TAB,PAG] (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>internal flooding of two or more business premises within an area of 1km2; High Street closed for approximately two weeks [PAG] (p5)</p></div><div class="nugget-popup quant"><p>two instances caused sewage entry to the George pub; road closure for at least 10 hours [MUL] (p24)</p></div><div class="nugget-popup quant"><p>at least 2 business premises (p29)</p></div></div></body></div>`)[0];
                popup_4a0323b09379f41443a161dc98b733d6.setContent(html_e33acc0855f2c3a09ec6f7777fbe4aa5);
