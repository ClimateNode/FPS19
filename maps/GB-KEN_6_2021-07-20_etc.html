                var html_fef2005fa311b73fee7f8e0e0d8244eb = $(`<div id="html_fef2005fa311b73fee7f8e0e0d8244eb" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Swanley</h1><div class="nugget-popup"><p>Flooding occurred in the town as a result of intense thunderstorms and heavy rainfall on 20th July 2021. (p1)</p></div><div class="nugget-popup"><p>Intense rainfall caused large volumes of surface water runoff predominantly from the urban network leading to surcharging of gullies; there were also reports of overland flows from surrounding agricultural land to the east of Swanley. As a result, on 20 July 2021 approximately 53 properties (including two schools) were affected and 30 properties flooded internally. A later event on 20&ndash;21 October 2021 (thunderstorms/intense rainfall) produced similar surface water runoff and gully surcharging, with approximately 17 properties affected and 11 properties flooding internally. [MUL] (p2)</p></div><div class="nugget-popup"><p>Multiple streets and properties across the town experienced surface water flooding on 20 July 2021, causing internal and external flooding to residences on named streets. (p5)</p></div><div class="nugget-popup"><p>Two intense periods of rainfall (around 13:00&ndash;14:30 and 16:30&ndash;17:30) produced surface water / flash flooding in Swanley. Resident reports of flooding were concentrated between about 17:00&ndash;18:00; the second intense storm (16:30&ndash;17:30) is consistent with the majority of these reports and radar suggests the storm was focused close to Swanley. Both intense periods are judged likely to have contributed to the flooding. (p7)</p></div><div class="nugget-popup"><p>Intense, highly localised rainfall on 20 July 2021 produced surface water and flash urban flooding across Swanley, inundating properties and streets and prompting the flood investigation response. (p9)</p></div><div class="nugget-popup"><p>Urban / surface&ndash;water flooding affected Swanley during the event referenced in the report; intense convective storm runoff led to short&ndash;duration flooding across the town. [IMG] (p10)</p></div><div class="nugget-popup"><p>Areas of Swanley experienced surface water and urban flooding during the events; the report notes affected parts of Swanley and links the intense rainfall and runoff to flooding impacts in local streets and properties. [IMG,MUL] (p13)</p></div><div class="nugget-popup"><p>Parts of Swanley (notably St. Mary's Estate) experienced surface water runoff and flooding during the event, with drains surcharging and roads/alleyways inundated at low points. [IMG] (p14)</p></div><div class="nugget-popup"><p>Swanley (High Firs area and southern parts) experienced heavy surface water flooding during the intense rainfall on 20th July 2021. Overland flows from and across the A20 and overtopping of a balancing pond between the A20 and Pinks Hill contributed to flooding of nearby properties; principal routes including Goldsel Road experienced major disruption. (p15)</p></div><div class="nugget-popup"><p>The Swanley area (including High Firs Estate and nearby streets) experienced surface water flooding during the intense rainfall on 20th July 2021. Runoff from embankments and surcharged drains produced flooded roads and impacted residential streets and community infrastructure within the town. [IMG] (p16)</p></div><div class="nugget-popup"><p>Intense rainfall on 20th July 2021 caused surface water runoff and surcharge of drainage infrastructure across Swanley, with notable ponding and flow along roads in lower&ndash;lying areas (concentrated in the north&ndash;east of the town). [IMG] (p17)</p></div><div class="nugget-popup"><p>Localised surface water flooding concentrated in the Strawberry Fields/The Spinney area caused ponding on roads, surcharged drainage and internal flooding of properties where property thresholds were lower than the adjacent road. (p18)</p></div><div class="nugget-popup"><p>The Hextable area of Swanley experienced surface water/urban flooding on 20th July 2021: a section of College Road (between Egerton Avenue and the Post Office) was impassable to local traffic due to carriageway flooding; Stuart Close suffered significant flooding to the road and to properties; surface water runoff along Lower Road flowed into Laura Drive, and drainage infrastructure surcharged under the intense rainfall. (p20)</p></div><div class="nugget-popup"><p>Properties in Swanley experienced surface water/urban flooding leading to requests for flood saxs and multiple reported incidents that generated emergency calls and follow&ndash;up gully and drainage clearance. [MUL] (p21)</p></div><div class="nugget-popup"><p>Short, intense rainfall on 20 July 2021 and 20&ndash;21 October 2021 overwhelmed local surface water drainage, causing flooding to properties across the town and disruption to local roads. [MUL] (p22)</p></div><div class="nugget-popup"><p>Multiple reported flood incidents were concentrated in the residential and urban streets of southern Swanley on 20th July 2021, with affected locations marked on the map. The incidents indicate localised inundation in the built&ndash;up area and disruption to streets and properties. [IMG] (p23)</p></div><div class="nugget-popup"><p>Multiple reported flood incidents concentrated in the central and southern parts of Swanley, affecting residential areas and sections of major roads (locations marked as affected on the map). [IMG] (p24)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 53 properties including two schools affected (20 July 2021); 30 properties flooded internally (20 July 2021); approximately 17 properties affected (20&ndash;21 October 2021); 11 properties flooded internally (20&ndash;21 October 2021) [MUL] (p2)</p></div><div class="nugget-popup quant"><p>16 properties (sum of reported affected properties across named streets) (p5)</p></div><div class="nugget-popup quant"><p>68 properties [MUL] (p22)</p></div></div></body></div>`)[0];
