                var html_22f84c9998465d72505f7b36e53db53e = $(`<div id="html_22f84c9998465d72505f7b36e53db53e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Mid Devon</h1><div class="nugget-popup"><p>Watercourses overtopped and drainage systems were overwhelmed in Mid Devon, which led to internal flooding of properties. Property flood resilience (PFR) measures prevented internal flooding in some cases; five properties are known to have prevented internal flooding using PFR, and two further properties are believed would have been prevented had large vehicles not overtopped PFR during a road closure. [PAG] (p1)</p></div><div class="nugget-popup"><p>Internal property flooding was reported in towns and villages within Mid Devon (table lists Bampton, Bickleigh, Cove, Exebridge, Oakfordbridge) as part of the January flood event; some properties in the area had PFR that prevented internal flooding. [PAG] (p2)</p></div><div class="nugget-popup"><p>Internal property flooding in towns within the district (reports of internal flooding to domestic properties across multiple villages). [TAB] (p3)</p></div><div class="nugget-popup"><p>Countywide heavy rainfall (notably affecting southern Exmoor within the district) on saturated ground during 11&ndash;13 January 2023 led to a significant response in the River Exe, with a peak on 12 January 2023 associated with the flood incident described in the report. [TAB] (p5)</p></div><div class="nugget-popup"><p>River Exe overtopped its banks causing extensive flooding of the A396 and of properties along that road in Bickleigh. (p9)</p></div><div class="nugget-popup"><p>Areas within Mid Devon (notably rural Bampton) experienced river flooding resulting in internal flooding of properties and debris accumulation against bridges. (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>27
