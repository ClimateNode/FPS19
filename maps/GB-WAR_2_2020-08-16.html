                var html_ebde659166277bcf30094c6146138273 = $(`<div id="html_ebde659166277bcf30094c6146138273" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Duffins Piece, Snitterfield</h1><div class="nugget-popup"><p>Overtopping of a small unnamed ordinary watercourse led flows along a public right of way into the private tarmacked access road (which has no formal drainage). Resulting flows entered properties and adjacent arable land; the event caused internal flooding of properties and significant surface flow along the access. [IMG] (p9)</p></div><div class="nugget-popup"><p>Two distinct surface&ndash;water/overland flow routes entered the Duffins Piece area during the 16 August 2020 event. Primary flow overtopped an ordinary watercourse and travelled down a public right of way onto Duffins Piece; a secondary overland flow breached a raised vehicle access and entered via a gated field access. Flows entered two properties where internal thresholds were lower than or comparable to the unadopted highway. Inspection found the ordinary watercourse had lost much of its original profile and was obstructed by self&ndash;set trees and saplings, reducing conveyance and likely increasing flood risk. [PAG] (p14)</p></div><div class="nugget-popup"><p>Internal flooding of properties caused by exceedance of the ordinary watercourse at Duffins Piece; inundation affected nearby low&ndash;lying land and resulted in property interiors being flooded. (p15)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 properties [IMG] (p9)</p></div><div class="nugget-popup quant"><p>2 properties internally flooded; 0 properties externally flooded; 0 critical infrastructure flooded [PAG] (p14)</p></div><div class="nugget-popup quant"><p>2 properties internally flooded (p15)</p></div></div></body></div>`)[0];

                var html_9c2be3d042d5a2bc436f487b8c7aa3ea = $(`<div id="html_9c2be3d042d5a2bc436f487b8c7aa3ea" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Snitterfield</h1><div class="nugget-popup"><p>Flooding occurred in the village on the reported event date; recovery and remedial works were undertaken and investigations of the drained (drainage) network carried out by WCC together with partner RMAs; parts of remedial works remain ongoing. [PAG] (p4)</p></div><div class="nugget-popup"><p>Short, intense convective rainfall (peaking late afternoon/early evening) caused localised highway flooding and led to water ingress through the fabric of multiple properties (anecdotal reports collated 17 Aug). Radar data for 16 Aug 2020 correlate peak rainfall rates with the period of reported flooding. [MUL] (p6)</p></div><div class="nugget-popup"><p>Short, localised intense rainfall caused water ingress through the fabric of buildings (not associated with fluvial mechanisms), resulting in internal property ingress across the village. [PAG] (p7)</p></div><div class="nugget-popup"><p>Short&ndash;duration, high&ndash;intensity rainfall on 16th August 2020 produced surface water flows and inundation of artificial drainage (including sewers). Flows exploited the built environment (highways, hardscaped gardens), channelled water, deposited large amounts of silt on the highway and caused flooding reported across three main areas of the village (including Duffins Piece and The Green). (p9)</p></div><div class="nugget-popup"><p>Short&ndash;duration, high&ndash;intensity rainfall on 16 Aug 2020 caused surface water flows and inundation/surcharging of artificial drainage (sewers), with flow routes exploiting highways and hardscaped areas. Flooding was reported in three main areas (Duffins Piece, The Green, School Road); drainage chambers were overwhelmed and silt was deposited onto highways. [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>On 16th August 2020 surface&ndash;water flows from higher ground impacted the village: properties on The Green experienced low&ndash;level internal water accumulation through a flagstone floor, and flows along School Road (from Hales Close/Duttons Close) overwhelmed drainage causing drainage chambers to surcharge; central parts along the village waterway showed the highest surface&ndash;water extents on EA mapping. [IMG] (p11)</p></div><div class="nugget-popup"><p>Snitterfield has a recorded history of property flooding in 1998, 2007, 2012, 2016, 2019 and 2020. During the 16 August 2020 event surface&ndash;water/overland flows associated with an ordinary watercourse and runoff from agricultural land caused internal flooding to properties in the Duffins Piece area of the village. [PAG,MUL] (p14)</p></div><div class="nugget-popup"><p>During the 16 August 2020 rainfall event Snitterfield experienced significant localised surface water accumulations and flows entering the highway from higher surrounding land. Reports recorded highway and garden flooding across the village and at least one property suffered low&ndash;level internal flooding (ingress through a flagstone floor caused by a raised local water table). Post&ndash;event inspections by Warwickshire County Council and the Environment Agency gathered further evidence but could not fully establish the precise mode of flooding. [PAG] (p16)</p></div><div class="nugget-popup"><p>Residential area in Snitterfield experienced internal flooding of properties (six properties internally flooded). Multiple investigatory and mitigation actions were taken including gully cleansing, CCTV of sewers, river/stream modelling and ditch maintenance discussions. (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>three main areas; 2 properties (p9)</p></div><div class="nugget-popup quant"><p>2 properties [PAG,IMG] (p10)</p></div><div class="nugget-popup quant"><p>2 properties internally flooded (Duffins Piece, 16 August 2020) [PAG,MUL] (p14)</p></div><div class="nugget-popup quant"><p>Properties internally flooded 1; Properties externally flooded 2+ [PAG] (p16)</p></div><div class="nugget-popup quant"><p>6 properties (p19)</p></div></div></body></div>`)[0];
