                var html_4fdb011c9022c7033d6745e1adb91cb1 = $(`<div id="html_4fdb011c9022c7033d6745e1adb91cb1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Mead Crescent, Stapenhill</h1><div class="nugget-popup"><p>Internal property flooding was reported at this location following the storms. (p6)</p></div><div class="nugget-popup"><p>Flooding affected Mead Crescent during the Storm Dennis event; the Section 19 investigation summarises the extent of reported flooding and the most likely cause. [PAG] (p7)</p></div><div class="nugget-popup"><p>Mead Crescent experienced a flood event on 16th February 2020 associated with heavy, persistent rainfall from Storm Dennis. (p16)</p></div><div class="nugget-popup"><p>Residential properties in the Mead Crescent development (housing association&ndash;managed) were affected by flooding; the location plan in the report marks the flood at Mead Crescent (green dot). [PAG,IMG] (p19)</p></div><div class="nugget-popup"><p>Multiple properties along Mead Crescent (the Crescent) reported flooding during the 16 February 2020 event. [PAG] (p23)</p></div><div class="nugget-popup"><p>Surface water from nearby fields flowed to the rear of properties then entered homes from both front and rear. Internal flooding damaged furniture, carpets and flooring across ground floors; gardens, driveways and the highway were also flooded. Flood water reached up to front doors and covered the highway. The extent of damage led to residents being evacuated by the Housing Association. Residents expressed concern that floodwater may have been contaminated (unverified). [PAG] (p24)</p></div><div class="nugget-popup"><p>Flooding affected properties and the highway; property owners were required to vacate their homes and move into temporary accommodation while repairs were completed. [PAG] (p25)</p></div><div class="nugget-popup"><p>Flooding affected properties and the highway at Mead Crescent; incidents recorded as occurring on multiple occasions and specifically investigated following flooding on 16th February 2020. [IMG] (p26)</p></div><div class="nugget-popup"><p>Significant volumes of surface water flowed over already&ndash;saturated ground and caused flooding on Mead Crescent on 16/02/2020. The Housing Association reported local factors exacerbated the flooding, producing greater impacts than expected for the storm magnitude. (p27)</p></div><div class="nugget-popup"><p>Water flowed from the adjacent field into the rear drainage ditch which became overwhelmed; part of the bund between the ditch and houses was washed away and floodwater entered properties via a gap between properties, resulting in internal flooding to properties along Mead Crescent. [IMG] (p28)</p></div><div class="nugget-popup"><p>Surface water runoff followed local topography toward Pipe A; the outlet pipe became hydraulically overwhelmed and the drainage ditch filled and overtopped, flowing through rear gardens into properties. An informal soil bund (~0.6m high) provided some delay but was eroded and water infiltrated into gardens; installed property flood gates proved ineffective and properties were inundated from the rear garden side. [IMG,PAG] (p33)</p></div><div class="nugget-popup"><p>Surface water runoff from the adjacent field overwhelmed the rear ditch, overtopped the bund and flowed towards properties on Mead Crescent causing flooding to the street and rear of properties. (p34)</p></div><div class="nugget-popup"><p>Properties experienced internal flooding; gardens, driveways and the highway were flooded; some residents were evacuated. (p38)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>16 residential properties experienced internal flooding (across Mead Crescent and Manor Crescent) [PAG] (p24)</p></div><div class="nugget-popup quant"><p>temporary accommodation for approximately 3 to 4 months [PAG] (p25)</p></div><div class="nugget-popup quant"><p>16 residential properties (total across Mead Crescent and Manor Crescent) (p38)</p></div></div></body></div>`)[0];

ed on several occasions and were investigated after flooding on 16th February 2020. [IMG] (p26)</p></div><div class="nugget-popup"><p>Surface water from the intense rainfall episode and saturated ground caused flooding affecting Manor Crescent on 16/02/2020 (identified as part of the same flood location as Mead Crescent). (p27)</p></div><div class="nugget-popup"><p>Floodwater followed topography from the overwhelmed ditch down towards Manor Crescent, resulting in internal flooding to properties on Manor Crescent. [IMG] (p28)</p></div><div class="nugget-popup"><p>Floodwater overtopping the drainage ditch flowed through rear gardens and followed prevailing topography toward Manor Crescent, causing runoff and inundation of gardens/properties in that area. [PAG] (p33)</p></div><div class="nugget-popup"><p>Surface water runoff from the adjacent field followed topography after overtopping the bund and flowed towards Manor Crescent, causing flooding to the street and properties. (p34)</p></div><div class="nugget-popup"><p>Properties experienced internal flooding; gardens, driveways and the highway were flooded; some residents were evacuated. (p38)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>16 residential properties experienced internal flooding (across Mead Crescent and Manor Crescent) [PAG] (p24)</p></div><div class="nugget-popup quant"><p>16 residential properties (total across Mead Crescent and Manor Crescent) (p38)</p></div></div></body></div>`)[0];

                var html_8268f95892640d67598a9588897817e5 = $(`<div id="html_8268f95892640d67598a9588897817e5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Stapenhill</h1><div class="nugget-popup"><p>Internal property flooding was reported on Mead Crescent and Manor Crescent within Stapenhill. (p6)</p></div><div class="nugget-popup"><p>Contains Mead Crescent and Manor Crescent, which were flooded during Storm Dennis and are the subject of the investigation. [PAG] (p7)</p></div><div class="nugget-popup"><p>Stapenhill was the location of the flood event on 16th February 2020 affecting Mead Crescent and Manor Crescent, caused by heavy rainfall associated with Storm Dennis. (p16)</p></div><div class="nugget-popup"><p>Part of Stapenhill &mdash; specifically the Mead Crescent/Manor Crescent residential development &mdash; was affected by flooding, impacting housing association&ndash;managed properties. [PAG,IMG] (p19)</p></div><div class="nugget-popup"><p>Surface&ndash;water/urban flooding affected the Mead Crescent / Manor Crescent area of Stapenhill. Runoff from the adjacent agricultural field was routed into a drainage ditch and via culvert inlet(s) and outlet pipes (Pipe A and Pipe B) toward Severn Trent surface water sewers on Mead Crescent and Mead Walk, contributing to flooding of properties; a bund was present between the ditch and properties to limit flows toward Mead Crescent. [IMG,PAG] (p21)</p></div><div class="nugget-popup"><p>Flooding affected properties and the highway at Mead Crescent and Manor Crescent in Stapenhill. Flooding to both property and the highway was recorded during the event on 16 February 2020. [IMG] (p26)</p></div><div class="nugget-popup"><p>Incidents of surface water flooding were reported in the Stapenhill area, including internal flooding to properties on Mead Crescent and Manor Crescent and some evacuations. (p38)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>16 residential properties (p38)</p></div></div></body></div>`)[0];
