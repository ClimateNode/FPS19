                var html_fbfb91f19b63563377cd8c1ce2ba42f4 = $(`<div id="html_fbfb91f19b63563377cd8c1ce2ba42f4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Weedon Bec</h1><div class="nugget-popup"><p>Church Street in the village was the subject of a Northamptonshire County Council flood investigation report, indicating that flooding occurred on Church Street and affected the village. (p2)</p></div><div class="nugget-popup"><p>Intense rainfall on a saturated catchment caused excess surface water to flow following natural contours to low points in the village, resulting in internal flooding of properties in Weedon Bec during the 21 November 2012 event; at least one property flooded internally and similar internal flooding has occurred several times in the previous five years. (p5)</p></div><div class="nugget-popup"><p>Intense rainfall on a saturated catchment caused excess surface water to flow over ground to low points in the village. On 21 November 2012 at least one property on Church Street flooded internally; properties in the village have experienced internal flooding on multiple occasions in the five years prior to the investigation. [PAG,MUL] (p6)</p></div><div class="nugget-popup"><p>Significant rainfall and runoff across the Weedon Bec catchment on 21 November 2012 produced surface water flooding and ponding within the village (notably at the junction of New Street, Bridge Street and Church Street), leading to at least one property flooding internally and several other properties being at high risk. (p8)</p></div><div class="nugget-popup"><p>Ponding at the junction of Bridge Street, Church Street, New Street and West Street caused water to breach the threshold of a commercial property on Bridge Street and to reach very close to the thresholds of at least two other properties; water depth in Bridge Street was approximately 300mm. (p13)</p></div><div class="nugget-popup"><p>Intense rainfall on a saturated catchment on 21st November 2012 overwhelmed existing drainage systems and watercourses in Weedon Bec. Runoff from higher land flowed onto the public highway and into properties; drainage systems and watercourses were in poor maintenance with silt and debris, reducing their ability to convey the deluge. (p16)</p></div><div class="nugget-popup"><p>Runoff from higher land flowed onto the public highway where there was no adequate drainage, allowing water to flow to private properties. (p17)</p></div><div class="nugget-popup"><p>Village streets and residential areas were flooded, causing disruption to the community &mdash; residents observed and waded in floodwater and used a cart to move household items to safety; roads were made impassable by the inundation. [IMG] (p45)</p></div><div class="nugget-popup"><p>The town experienced urban/ surface&ndash;water flooding (illustrated by Church Street), with streets inundated and properties at ground&ndash;floor level exposed to floodwater, restricting access and affecting daily activities. [IMG] (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property (p5)</p></div><div class="nugget-popup quant"><p>1 property (at least) flooded internally; incidents occurred over a five&ndash;year period [PAG,MUL] (p6)</p></div><div class="nugget-popup quant"><p>at least one property flooded internally (p8)</p></div><div class="nugget-popup quant"><p>one commercial property; at least two other properties; approximately 300mm depth (p13)</p></div></div></body></div>`)[0];
