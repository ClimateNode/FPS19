                var html_40642a39e415e5023879466c78ff02c7 = $(`<div id="html_40642a39e415e5023879466c78ff02c7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Mill Fleam</h1><div class="nugget-popup"><p>The Mill Fleam rose quickly during the intense storm and blocked drainage exit points, which contributed to rapid surface water/road flooding in the locality; flood levels then subsided within about an hour. (p17)</p></div><div class="nugget-popup"><p>Observed heavy silt accumulation within the watercourse; siltation was reported as likely to restrict outfall and surface water sewer discharge during heavy storms, adversely affecting flow within the Mill Fleam and increasing local flood risk. [PAG,IMG] (p19)</p></div><div class="nugget-popup"><p>Identified as the local watercourse conveying surface water runoff during the intense, localised July flooding; the Environment Agency will undertake a maintenance assessment to determine if remedial works are required following the event. (p20)</p></div><div class="nugget-popup"><p>The Mill Fleam watercourse around the sewer outfalls was found to be heavily silted; this was identified as a factor that could impede discharge during heavy storms and thus contribute to local flooding. Environment Agency maintenance of the channel is under review. (p23)</p></div><div class="nugget-popup"><p>Identified as the receiving watercourse for local drainage networks in the area affected by the intense thunderstorms on 8 July 2023; associated with the flooding incident in Tutbury that produced internal flooding of residential and commercial properties and significant highway flooding. (p26)</p></div></div></body></div>`)[0];

 2023; the event in Tutbury also led to several residential and commercial properties across the town being flooded internally. [IMG] (p27)</p></div><div class="nugget-popup"><p>Mapped watercourses converge near Duke Street; experienced significant highway flooding during the intense thunderstorms on 8 July 2023, causing overland flow across the road, disruption to transport access and contributing to internal flooding of nearby residential and commercial premises in Tutbury. [IMG] (p29)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Max depth: 65 cm; Volume: 250 m³ [IMG] (p9)</p></div><div class="nugget-popup quant"><p>Max depth: 65 cm; Volume: 250 m3 [PAG,IMG] (p10)</p></div><div class="nugget-popup quant"><p>143 gullies within the surveyed area; 6 gullies with higher silt levels; 1 sink hole reported in Duke Street (investigation booked) (p17)</p></div></div></body></div>`)[0];

operty flooding reported by residents and businesses. Gullies were reported blocked or overwhelmed during the event. [IMG] (p12)</p></div><div class="nugget-popup"><p>A focused intense storm caused the Mill Fleam to rise quickly and block drainage exit points, producing rapid highway/urban flooding in the village; flood waters rose quickly and subsided within about an hour. (p17)</p></div><div class="nugget-popup"><p>Mill Fleam conveyed surface water runoff through the town centre during the intense, localised July event, producing flooding of the central Tutbury area and smaller drainage networks rather than the River Dove. [IMG] (p20)</p></div><div class="nugget-popup"><p>Several residential and commercial properties were flooded internally; significant flooding of the highway. [TAB,PAG,MUL] (p24)</p></div><div class="nugget-popup"><p>Intense thunderstorms on 8 July 2023 produced significant flooding in Tutbury: residential and commercial properties were flooded internally and there was significant flooding of the highway across the town. (p25)</p></div><div class="nugget-popup"><p>Significant flooding on 8 July 2023 after intense thunderstorms (around 20:30). Several residential and commercial properties were flooded internally and there was significant flooding of the highway across the town centre. [MUL] (p27)</p></div><div class="nugget-popup"><p>Intense thunderstorms on 08 Jul 2023 caused significant flooding across Tutbury: several residential and commercial properties were flooded internally and there was significant flooding of the highway (road network inundation and local access disruption). [MUL] (p29)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Depression storage at Duke Street: max depth 65 cm; volume 250 m3 [IMG] (p10)</p></div><div class="nugget-popup quant"><p>more than five surveys reported internal property flooding [IMG] (p12)</p></div></div></body></div>`)[0];

                var html_59954469407c7b1a6691cd944c8bbd9c = $(`<div id="html_59954469407c7b1a6691cd944c8bbd9c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Anslow</h1><div class="nugget-popup"><p>Main Street in Anslow was flooded with water covering the road, people walking through floodwater and at least one vehicle partially submerged; roads, vehicles and local properties were disrupted by the surface water exceedance. [IMG] (p5)</p></div><div class="nugget-popup"><p>Anslow experienced surface water/urban flooding caused by extreme rainfall that exceeded the design standard of the drainage infrastructure; flooding occurred on the dates given in the report and prompted identification of improvements to reduce future impacts. [PAG,MUL] (p6)</p></div><div class="nugget-popup"><p>Floodwater accumulated in the middle of the village (Main Road and Bushton Lane), causing flooding to residential properties and businesses. [IMG,MUL] (p7)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration rainfall events in June and July 2023 produced rapid runoff through the local catchment, causing surface&ndash;water pooling in the central built&ndash;up area and along Main Road. Depression storage in the central area reached depths up to 65 cm and stored about 680 m3, resulting in local inundation of the road and adjacent open spaces. [IMG] (p13)</p></div><div class="nugget-popup"><p>Short&ndash;duration, intense rainfall over the 9 ha catchment generated rapid runoff toward Main Road, producing surface&ndash;water ponding and flow. On Main Road water depths can reach approximately 65 cm with a stored volume around 680 m3; estimated runoff rates from the catchment exceed 500 l/s. Flooding occurred during the June&ndash;July 2023 storm events recorded in the area. [IMG,PAG] (p14)</p></div><div class="nugget-popup"><p>Residents and businesses reported internal property flooding within the village. [PAG,IMG] (p15)</p></div><div class="nugget-popup"><p>Significant surface&ndash;water flooding from very intense, short&ndash;duration thunderstorms in June&ndash;July 2023; residents reported foul sewage mixed with floodwater. Drainage networks in the village were jetted and CCTV&ndash;inspected as part of the response. (p22)</p></div><div class="nugget-popup"><p>High&ndash;intensity storms overwhelmed local highway drainage leading to an identified defect in the drainage/gully system. The defect was repaired and additional drainage and an overflow connection between networks were installed to reduce future flood impacts. (p23)</p></div><div class="nugget-popup"><p>Highway and local drainage were affected leading to remedial works: gullies were jetted and cleansed; a defect near Bushton Lane was repaired; a new Birco channel drain was installed and two systems were connected to provide an overflow. A Section 19 investigation was completed and monitoring/continued cleansing planned. [TAB] (p24)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>65 cm; 680 m3 [IMG] (p13)</p></div><div class="nugget-popup quant"><p>9 ha catchment; 20 mm&ndash;30 mm rainfall in 30&ndash;40 minutes; &gt;500 l/s runoff rate; Main Road depth ≈65 cm; Main Road volume 680 m3 [IMG,PAG] (p14)</p></div></div></body></div>`)[0];
