                var html_efe91e658ac51e5c311a2c9addab61f5 = $(`<div id="html_efe91e658ac51e5c311a2c9addab61f5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Gawcott Methodist Chapel</h1><div class="nugget-popup"><p>A damaged section of the culvert located close to the Methodist Chapel reduced conveyance capacity and contributed to surcharging; manholes close to the chapel started discharging first, initiating flooding on the highway. (p37)</p></div><div class="nugget-popup"><p>Floodwater entered the chapel internally; water was reported seeping up through the floor in the storage room, causing internal flood damage to the building and contents. (p38)</p></div><div class="nugget-popup"><p>The Methodist chapel flooded internally: water entered and was observed seeping up through the floor in the storage room. (p39)</p></div><div class="nugget-popup"><p>Internal flooding of the building: water entered the interior and was observed seeping up through the floor in the storage room. (p40)</p></div><div class="nugget-popup"><p>Internally flooded during the 23 December 2020 event, sustaining flood damage as reported in the Section 19 investigation. (p60)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 Methodist chapel (p38)</p></div><div class="nugget-popup quant"><p>1 building (Gawcott Methodist Chapel) internally flooded (p60)</p></div></div></body></div>`)[0];

                var html_c24be3ff54879af5e2481807379c6c04 = $(`<div id="html_c24be3ff54879af5e2481807379c6c04" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Milton Keynes</h1><div class="nugget-popup"><p>Experienced multiple flood incidents in villages around the area; Gawcott is identified as a significant area of flooding within this wider area. (p33)</p></div></div></body></div>`)[0];

        var popup_e4f5707a97677f48dc14579a3618fb50 = L.popup({});

        
            
                var html_b270592cd1111bbe0e2c10b7a8d6a640 = $(`<div id="html_b270592cd1111bbe0e2c10b7a8d6a640" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Main Street, Gawcott</h1><div class="nugget-popup"><p>Main Street was impacted during the 23 December 2020 event when the culverted watercourse beneath/adjacent to the road exceeded capacity, causing surface water flooding that prompted appraisal of culvert improvements (replacement/enlargement/relining/parallel culvert) and targeted repairs. [TAB] (p7)</p></div><div class="nugget-popup"><p>Main Street experienced flooding during the event on 23 December 2020; a manhole was observed to be surcharged and the street was flooded (photographic evidence referenced in the report Figures 8&ndash;4 and 8&ndash;5). [PAG,IMG] (p18)</p></div><div class="nugget-popup"><p>Main Street was inundated during the 23 December 2020 event; the report and figures show flooding of the highway and a surcharged manhole on Main Street during the event. [PAG] (p21)</p></div><div class="nugget-popup"><p>Main Street experienced overtopping/surface water inundation during the event; a manhole was observed surcharged and photos show flooding of the carriageway. The surcharging and surface flooding were linked to constrained culverted flows and defects in the surface water culvert (hole in culvert wall, masonry in base, pipe crossings, reductions in culvert diameter and blockages) which reduced conveyance and led to highway flooding. [PAG] (p22)</p></div><div class="nugget-popup"><p>Floodwater flowed down both streets (Main Street and New Inn Lane), pooling at a low spot and causing internal property flooding. [TAB] (p32)</p></div><div class="nugget-popup"><p>Road closures were put in place and sandbags were delivered to the street; access and transport were disrupted and residents on the street required assistance to dispose of flood&ndash;damaged furnishings (skip arranged by the parish council). (p33)</p></div><div class="nugget-popup"><p>The culvert running below Main Street surcharged and exceeded capacity during the event, leading to surface flooding along Main Street. Manholes were reported as surcharged and blocked gullies prevented highway drainage, contributing to flooding of the street (photographic evidence in the report shows Main Street flooded during the event). [PAG,IMG] (p34)</p></div><div class="nugget-popup"><p>Traffic driving through floodwater on Main Street washed water into properties located on Main Street; culvert surcharge and manhole lifting occurred along the culvert beneath Main Street during the 23 December 2020 event. (p36)</p></div><div class="nugget-popup"><p>The culverted watercourse beneath Main Street was significantly over&ndash;capacity during the event, causing surcharging along the culvert. Manholes were lifted and began discharging water onto the carriageway from about 13:30, flooding the highway and allowing floodwater to flow west along Main Street. A surcharged manhole on Main Street was photographed overflowing onto the road surface. [IMG] (p37)</p></div><div class="nugget-popup"><p>Highway flooding was significant along these roads (Main Street and New Inn Lane), prompting transport disruption and contributing to a road closure. (p38)</p></div><div class="nugget-popup"><p>Highway flooding inundated the full carriageway and encroached onto adjacent properties and driveways, impeding vehicle and pedestrian movement. Buckinghamshire Council (the Highway Authority) ordered a road closure after 18:00 on 23rd December 2020. [IMG,PAG] (p39)</p></div><div class="nugget-popup"><p>The culverted watercourse running along Main Street was found to have blockages, intrusions and pipe size changes that reduced capacity; short sections were impassable. A Grade 5 defect (a hole) was identified close to the Methodist Chapel between manholes SW01 and SW02, with another similar hole observed on CCTV. [PAG] (p40)</p></div><div class="nugget-popup"><p>Survey identified a 300mm foul misconnection between inspection points SW02 and SW01 discharging into the 600mm brick sewer beneath the street; foul debris from this connection has been observed by residents downstream, indicating contamination of surface waters and water&ndash;quality impacts associated with the flood event. [IMG] (p42)</p></div><div class="nugget-popup"><p>The main culverted watercourse running the length of Main Street was overloaded during the event on 23 December 2020, causing surface water flooding on/around Main Street; culvert blockages and poor condition contributed to the flooding. [PAG] (p45)</p></div><div class="nugget-popup"><p>Conveyance under Main Street was a key failure point: the culvert beneath Main Street is in very poor condition with blockages, pipe&ndash;size constrictions, sedimentation and rough material that reduced conveyance causing surcharge and flooding onto Main Street (a manhole on Main Street was observed surcharged during the event). Modelling tested removing blockages and smoothing the culvert and also tested increasing culvert capacity and additional gullies to reduce surface water flooding. [PAG,IMG] (p46)</p></div><div class="nugget-popup"><p>The culvert under Main Street was blocked/defective and its capacity was exceeded during the 23 December 2020 event, causing flooding along Main Street (surcharging and local ponding). Modelling indicates relining would not have prevented flooding on 23 Dec 2020 (though it would have reduced recession times and reduced impacts in lower&ndash;order events); enlarging or adding a parallel culvert could have prevented flooding caused by culvert capacity being exceeded, though ponding from rainfall may still have occurred. (p49)</p></div><div class="nugget-popup"><p>Constrained sections of the Main Street culvert (most of the culvert is 600mm but with short 300mm and 150mm sections and other constrictions) reduced conveyance. During the 23 December 2020 event these restrictions contributed to flooding on Main Street and slowed recession of flood levels. Blockages of masonry and roots were present in problematic sections; targeted clearing/relining and repairs are being proposed to stabilise damaged sections and remove blockages, which would reduce impacts and speed recession though would likely not have prevented flooding on 23 December 2020. (p50)</p></div><div class="nugget-popup"><p>The culvert beneath Main Street is identified as a critical infrastructure element whose capacity was predicted to be exceeded in the 1&ndash;in&ndash;10 annual chance event; exceedance of this culvert contributed to flooding at and around Main Street. The condition of the culvert is noted as an unresolved issue increasing flood risk. (p52)</p></div><div class="nugget-popup"><p>The village of Gawcott experienced flooding during the 23rd December 2020 event; flows overwhelmed local conveyance (including the culvert under Main Street), prompting recommendations to appraise upstream NFM measures while noting NFM alone would likely not have prevented the December 2020 flooding. (p53)</p></div><div class="nugget-popup"><p>The Main Street culvert was subject to excessive pressure from surface water runoff during the December 2020 flood; restricted culvert capacity and downstream channel/pond condition were cited as factors that increased flood impacts in the village. (p56)</p></div><div class="nugget-popup"><p>The main culvert under Main Street surcharged during the event, backing up through highway drainage and manholes and preventing gullies from discharging. Highway flooding was significant and Main Street was impassable during the 23 December 2020 event; culvert blockages and damaged sections were noted and works were proposed to address safety and blockages. (p60)</p></div></div></body></div>`)[0];

                var html_f0007050affd5062cfde5a01ea8de1c8 = $(`<div id="html_f0007050affd5062cfde5a01ea8de1c8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Buckinghamshire</h1><div class="nugget-popup"><p>The county contains the affected area (Gawcott) where flooding caused internal flooding of residential properties, displacement, loss of possessions and negative mental and physical health impacts; the report discusses county&ndash;level flood risk management and recommends actions for risk management authorities in Buckinghamshire. (p6)</p></div><div class="nugget-popup"><p>Flooding on 23 December 2020 affected the Main Street culvert and local highway drainage in Gawcott, prompting recommended actions for Buckinghamshire authorities (Transport for Buckinghamshire and the LLFA) including targeted culvert repairs, increased gully cleansing and highway drainage improvements. [TAB,PAG] (p7)</p></div><div class="nugget-popup"><p>Experienced widespread flood incidents across villages (including Gawcott); emergency services (BFRS) dealt with a high volume of flood&ndash;related calls, with many communities cut off and main roads impassable in places; county transport teams carried out gully clearance and distributed sandbags. (p33)</p></div><div class="nugget-popup"><p>During the 23rd December 2020 event, blocked highway gullies contributed to the severity of flooding in the area. Highway flooding occurred, affecting access and egress and producing flooding from vehicle wash; modelling reported that culvert capacity was insufficient to drain the water during this event. [TAB] (p58)</p></div><div class="nugget-popup"><p>As Lead Local Flood Authority (Buckinghamshire Council) they undertook a Section 19 investigation into the 23 December 2020 flooding, recording internal flooding to 13 residential properties and Gawcott Methodist Chapel and external flooding to 4 properties; they also progressed immediate actions and a high&ndash;level appraisal of flood risk management options (including targeted culvert repairs and other measures). (p60)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>14 residential properties (p6)</p></div><div class="nugget-popup quant"><p>161 incidents (p33)</p></div><div class="nugget-popup quant"><p>13 residential properties; 1 Gawcott Methodist Chapel; 4 properties (p60)</p></div></div></body></div>`)[0];

                var html_813add2fe8c224461fc0db9c378f6949 = $(`<div id="html_813add2fe8c224461fc0db9c378f6949" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Gawcott</h1><div class="nugget-popup"><p>Internal flooding of residential properties in the village. (p5)</p></div><div class="nugget-popup"><p>Experienced flooding from extreme rainfall and ordinary watercourse/overland flow pathways resulting in internal flooding of homes, displacement of residents, loss of possessions and negative mental and physical health impacts; emergency services attended to assist residents. (p6)</p></div><div class="nugget-popup"><p>Gawcott was the locality assessed in the investigation of the 23 December 2020 event. The Main Street culvert and downstream ordinary watercourse were identified as pathways that exceeded capacity during the event, causing surface water/ordinary watercourse flooding that impacted roads, infrastructure and properties and led to recommended culvert repairs, upstream attenuation/NFM appraisals and community resilience actions. [TAB] (p7)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties in the village, causing occupants to experience inundation inside homes. [MUL] (p13)</p></div><div class="nugget-popup"><p>The village was affected by flooding during the event on 23 December 2020; the incident prompted a Section 19 investigation to record and understand flood impacts across the settlement and surrounding agricultural land. (p14)</p></div><div class="nugget-popup"><p>During the event on 23rd December 2020 the main culverted watercourse under/along Main Street surcharged and caused flooding to Main Street; a manhole in Main Street was observed surcharged during the event. Floodwater arrived via two upstream ordinary watercourses culverted into a single main culvert beneath the village which then discharges to an open channel near Preston Road. [IMG] (p16)</p></div><div class="nugget-popup"><p>The village experienced flooding of the highway (Main Street) during the 23rd December 2020 event &mdash; including a surcharged manhole and surface water inundation. Flooding was associated with upstream open ordinary watercourses conveyed through two upstream culverts and a main culvert under Main Street, plus highway gullies which were found to drain into the culverted watercourses (not the public combined sewer). Private property surface water discharges into either the combined sewer or the surface water culvert, which likely contributed to capacity exceedance and surcharging. [PAG,IMG] (p17)</p></div><div class="nugget-popup"><p>During the 23 December 2020 event the village experienced surface water and sewer&ndash;related flooding. Main Street was recorded flooded and a manhole on Main Street was reported surcharged during the event. Investigation findings note that private roof and yard runoff is assumed to discharge to either the combined sewer or the surface&ndash;water culvert, and that highway gullies within the village drain to the culverted watercourse (not the combined sewer), directing runoff into the culvert and contributing to surcharge and flooding in the village. [PAG,IMG] (p18)</p></div><div class="nugget-popup"><p>During the 23rd December 2020 event, Main Street in Gawcott was flooded and a manhole in Main Street was observed surcharged. Highway gullies within the village drain into culverted watercourses (not the combined sewer) according to the commissioned survey; CCTV and survey work identified defects in the culverted watercourse (e.g. holes in culvert wall, masonry in the base producing ~40% blockage, reductions in culvert diameter) which contributed to flow restriction and local flooding of the street. [PAG,IMG] (p19)</p></div><div class="nugget-popup"><p>Surface&ndash;water runoff followed a flow path from the open channel between Radclive Road and Buckingham Road and along Hillesden Road into Main Street. Main Street was observed flooded during the event and manholes on Main Street were surcharged. [PAG,IMG] (p20)</p></div><div class="nugget-popup"><p>The village experienced surface&ndash;water flooding along the main watercourse and associated flow paths; Main Street (in the centre of Gawcott) was flooded during the 23 December 2020 event. [PAG,IMG] (p21)</p></div><div class="nugget-popup"><p>Surface water flooding affected the village centre: flow paths from an open channel and culverted watercourse conveyed runoff toward the village causing inundation in parts of Gawcott, including Main Street. CCTV and site inspection after the event identified defects in the culverted watercourse (holes, masonry in base, changes in pipe size and blockages) that contributed to flow restriction and local flooding. Hydraulic modelling of the drainage system was undertaken to better understand these interactions. [PAG,IMG] (p22)</p></div><div class="nugget-popup"><p>Gawcott has a history of flooding from ordinary watercourses and surface water. Records show flooding in Jan 2002 from an ordinary watercourse (noted as possibly related to culvert and ditch maintenance). Multiple past incidents are recorded (May 2006; Jul 2007; Jan 2008; Dec 2013; 2016) described as similar to the December 2020 event, and the settlement was impacted by the investigated flood event on 23 December 2020. [TAB,PAG,MUL] (p23)</p></div><div class="nugget-popup"><p>The village experienced flooding on 23 December 2020 associated with rising nearby ordinary watercourses and the River Great Ouse; the event affected the settlement and prompted local flood response and investigation. [PAG] (p24)</p></div><div class="nugget-popup"><p>Flooding associated with the 23 December 2020 event caused internal property flooding. At least one property that had pre&ndash;installed flood doors still experienced water ingress; following the event at least one further property had flood doors installed. (p28)</p></div><div class="nugget-popup"><p>The Gawcott catchment experienced intense, two&ndash;wave rainfall on 23 December 2020 that fell on already wet soils with minimal additional storage capacity, producing rapid runoff across the catchment and causing flooding within the Gawcott area. The storm passed across the catchment in a northerly then southerly direction during the event. [PAG] (p29)</p></div><div class="nugget-popup"><p>The 23 December 2020 storm produced rapid runoff on an already saturated catchment leading to flooding; a hydraulic model was used to represent flood levels and extents on the ordinary watercourse. The modelling estimates an approximate flow return period of 50&ndash;75 years and indicates a peak flow of about 0.9 m3/s. The rainfall event itself had a ~14% annual exceedance probability (≈7&ndash;year return) but the saturated soils made the catchment very sensitive and quick to respond, contributing to the flood impacts modelled at Gawcott. [IMG,TAB,PAG] (p30)</p></div><div class="nugget-popup"><p>Flooding across the village on 23 December 2020 with water flowing down streets and pooling in a low spot; internal property flooding occurred and remaining flood water receded overnight into 24 December. [TAB] (p32)</p></div><div class="nugget-popup"><p>Noted by emergency services as a significant area of flooding; roads were flooded making emergency response difficult, communities were cut off in places, residents suffered property and household item damage requiring disposal (skip provided), and sandbags were delivered locally. [PAG] (p33)</p></div><div class="nugget-popup"><p>Intense rainfall and a saturated upstream catchment caused the ordinary watercourse through the village to rise rapidly. The culverted tributaries converged into a single culvert beneath Main Street which surcharged and exceeded capacity, providing pathways for flooding across the village; overland flow from adjoining fields drained towards the village centre and contributed to accumulation and flooding (including impacts to the playing field). [PAG] (p34)</p></div><div class="nugget-popup"><p>Surface water runoff from surrounding farmland accumulated and flowed into the village's playing fields and streets; the culverted watercourse under Main Street was significantly exceeded during the event, leading to surcharging, lifting of manholes and widespread surface water flooding across the village on 23 December 2020. (p36)</p></div><div class="nugget-popup"><p>The village experienced internal and external flooding: 13 residential properties flooded internally (water entered from both front and rear), at least one internal flood was caused by toilets backing up, at least four properties had external flooding to gardens or outbuildings (two near&ndash;misses where water almost reached thresholds), at least one property was temporarily vacated for repairs, structural damage occurred to at least one property (crumbling brickwork), garages and other outbuildings were flooded, and external flood depths around properties to the west reached approximately 600&ndash;650 mm. Residents reported significant distress, insurance claims and financial impacts. (p38)</p></div><div class="nugget-popup"><p>Severe flooding affected the village centre (notably Main Street and New Inn Lane), inundating streets and encroaching on residential properties; this prompted a highway authority road closure on 23rd December 2020. [IMG,PAG] (p39)</p></div><div class="nugget-popup"><p>The culverted watercourse running through Gawcott was surveyed and found to have blockages, intrusions and structural defects (including holes) reducing capacity and leaving sections at risk of collapse; these culvert conditions are associated with flooding of local property (for example the Methodist Chapel). (p40)</p></div><div class="nugget-popup"><p>The village culverted watercourse along Main Street has frequent and severe defects and blockages that reduced culvert capacity and contributed to surcharging, manhole exceedance and flooding in the village during the 23rd December 2020 event. CCTV and survey evidence show partial blockages (masonry, rubble, roots and pipe intrusions), pipe size reductions and structural holes that risk collapse and caused the survey to be abandoned in places. A 300mm foul misconnection was identified between SW02 and SW01 and is likely the source of foul debris observed downstream. The defects therefore increased the likelihood and severity of surface water flooding and led to sewer/foul contamination impacts to downstream properties/areas; urgent repairs and maintenance were recommended to avoid collapse, backing up or future flooding. [PAG,IMG] (p44)</p></div><div class="nugget-popup"><p>Surface water flooding affected the village on 23 December 2020. The culverted watercourse and surface water drainage were overloaded and the hydraulic model was verified to replicate the flood depths experienced that day. [PAG] (p45)</p></div><div class="nugget-popup"><p>Village&ndash;level surface water/urban flooding occurred on 23 December 2020 driven by poor culvert conveyance under Main Street (leading to surcharging and street flooding). The investigation modelled mitigation options for Gawcott including increasing culvert capacity, adding gullies on Main Street, and upstream storage areas to reduce runoff towards Main Street. [PAG,IMG] (p46)</p></div><div class="nugget-popup"><p>Modelling and report text state that Gawcott flooded during the 23 December 2020 event. The culvert capacity limitations contributed to flood depths; even if the culvert had been clear and in good condition the village would still have flooded in that event, although depths would have been reduced by culvert improvements. (p49)</p></div><div class="nugget-popup"><p>Surface&ndash;water flows from the surrounding catchment and highways entered the village and overwhelmed the drainage system; the culvert under Main Street was predicted to be exceeded in design extreme events, causing flooding in the village. Modelling showed upstream attenuation (three small storage areas) did not prevent the culvert being exceeded for a 1&ndash;in&ndash;10 annual chance event. [PAG] (p52)</p></div><div class="nugget-popup"><p>Water entered properties through multiple entry points (front and rear doors). In one case sewage/backflow entered a property via the toilets. Properties experienced internal flooding and associated damage to belongings and fabric. [TAB,PAG] (p54)</p></div><div class="nugget-popup"><p>Floodwater entered many properties through multiple points, including front and rear doors; in one property floodwater backed up through the toilets causing internal ingress and associated damage. (p55)</p></div><div class="nugget-popup"><p>On 23 December 2020 flooding affected Gawcott. Blockage of highway gullies was identified as a contributing factor that increased the severity of flooding, worsening access and egress and promoting additional spread from vehicle wash. The investigation found the culvert outlet was running freely and the downstream ordinary watercourse and ponds were only one&ndash;third to one&ndash;half full during the event, so downstream channel condition was not considered to have caused the December 2020 flooding; culvert capacity throttled flows. (p57)</p></div><div class="nugget-popup"><p>On 23 December 2020 heavy rainfall on a saturated catchment caused rapid surface runoff and overloaded sewers, highway drainage and culverted watercourses in Gawcott. The event led to internal flooding of residential properties, external flooding to gardens/outbuildings, significant highway flooding that made the main access impassable, property damage (including flooded garages and outbuildings), at least one household temporarily relocating, and reported mental health impacts among residents. (p60)</p></div><div class="nugget-popup"><p>The local culvert suffered damaged sections and blockages (masonry and roots) that contributed to flooding in Gawcott; short&ndash;term targeted repairs to stabilise damaged culvert sections and clear blockages were recommended, and further appraisal of culvert enlargement and upstream attenuation was advised. [TAB] (p61)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>14 properties (p5)</p></div><div class="nugget-popup quant"><p>14 residential properties (p6)</p></div><div class="nugget-popup quant"><p>at least seven properties [MUL] (p13)</p></div><div class="nugget-popup quant"><p>1 property (pre&ndash;event flood doors; still flooded); 1 property (flood doors installed after event) (p28)</p></div><div class="nugget-popup quant"><p>13 residential properties; 1 internal flood caused by toilet backup; 4 properties with external flooding; 1 property temporarily vacated; external flood depths approximately 600&ndash;650 mm (p38)</p></div><div class="nugget-popup quant"><p>1 property [TAB] (p54)</p></div><div class="nugget-popup quant"><p>13 residential properties; 4 properties (external flooding to gardens/outbuildings); 1 property (residents temporarily moved out) (p60)</p></div></div></body></div>`)[0];
                popup_2d695df7cd5d3ec2c1d5b1462aa8bde3.setContent(html_813add2fe8c224461fc0db9c378f6949);
