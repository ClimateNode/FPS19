                var html_afb7b0a48385a1ff0c4dd0c8c3c67016 = $(`<div id="html_afb7b0a48385a1ff0c4dd0c8c3c67016" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wood Street, Wood End</h1><div class="nugget-popup"><p>Surface water flowing from higher ground (Tamworth Road) overwhelmed WCC County highways drainage and Severn Trent Water systems; flows backed up out of manholes and gullies onto Wood Street and ponded on the highway, leading to internal flooding of properties. An overgrown watercourse/blocked culvert west of Wood End Primary School also caused one further property to be internally flooded. [PAG] (p9)</p></div><div class="nugget-popup"><p>Surface water flows from higher ground on Tamworth Road overwhelmed highway drainage and sewer systems; flows backed up out of manholes and gullies onto Wood Street, causing large amounts of highway ponding and the internal flooding of properties. Overgrown watercourses and a potentially blocked culvert to the west of Wood End Primary School also contributed to one further internal flood. [PAG] (p10)</p></div><div class="nugget-popup"><p>Surface water flows originating on higher ground (Tamworth Road) flowed down Wood Street into the drainage network and onwards to Glenville Avenue, contributing to exceedance of drainage capacity and subsequent internal flooding of nearby properties. [PAG] (p11)</p></div><div class="nugget-popup"><p>Ordinary watercourses north of Wood Street conveyed significant overland flows; overgrown vegetation and a potential culvert blockage caused flows to back up and resulted in internal flooding of a property on Wood Street. (p14)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>five properties; one property [PAG] (p9)</p></div><div class="nugget-popup quant"><p>five properties; one property [PAG] (p10)</p></div><div class="nugget-popup quan                 var html_9c82e7942b37522323ee4d286c324a88 = $(`<div id="html_9c82e7942b37522323ee4d286c324a88" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Glenville Avenue, Wood End</h1><div class="nugget-popup"><p>Surface water flows routed from Tamworth Road via Wood Street overwhelmed highway and sewer drainage, causing manholes and gullies to back up and flood onto Glenville Avenue, resulting in internal flooding of properties. [PAG] (p10)</p></div><div class="nugget-popup"><p>Flooding occurred due to intense rainfall overwhelming the artificial drainage network. CCTV and jetting surveys of the drainage were carried out; small defects in the artificial drainage network were identified and will be rectified by the relevant asset owner. Options to install additional drainage on Glenville Avenue are being explored; some investigation remains outstanding and residents have been updated when requested. (p12)</p></div><div class="nugget-popup"><p>Surface water flowed down into Glenville Avenue, overwhelming artificial drainage networks and causing flows to back up out of manholes and gullies onto the street; resulting flows led to internal flooding of properties at this location (combined with Wood Street). [PAG] (p14)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>five properties [PAG] (p10)</p></div><div class="nugget-popup quant"><p>10 properties (combined Wood Street and Glenville Avenue) [PAG] (p14)</p></div></div></body></div>`)[0];

                var html_dae03b88ff7cec0212ba276c86b2b2f7 = $(`<div id="html_dae03b88ff7cec0212ba276c86b2b2f7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Tamworth Road, Wood End</h1><div class="nugget-popup"><p>Surface water runoff originating on the high ground of Tamworth Road flowed down Wood Street and onto Glenville Avenue, contributing to the overwhelming of WCC County Highways and Severn Trent Water drainage systems. This led to backing up of flows from manholes and gullies onto Glenville Avenue and the internal flooding of properties downstream. [PAG,IMG] (p11)</p></div><div class="nugget-popup"><p>Primary surface&ndash;water flow originated on higher ground at Tamworth Road and flowed down towards Wood Street, overwhelming highway and sewer drainage and initiating overland flow that led to internal property flooding in Wood Street/Glenville Avenue. (p14)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 properties [PAG,IMG] (p11)</p></div><div class="nugget-popup quant"><p>10 properties (p14)</p></div></div></body></div>`)[0];

                var html_dce1a8d70f66af2097acc6a6962fb246 = $(`<div id="html_dce1a8d70f66af2097acc6a6962fb246" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Warwickshire</h1><div class="nugget-popup"><p>Isolated heavy rainfall on 11 June 2023 resulted in internal property flooding from surface water in parts of Warwickshire, including at least 11 properties in Wood End (Atherstone). Internal property flooding was also experienced elsewhere in the county and will be subject to separate investigations. (p3)</p></div><div class="nugget-popup"><p>The county contains Wood End, where flooding occurred on 11 June 2023; county&ndash;level LLFA (WCC) carried out the Section 19 investigation and coordinated recovery and remedial actions. (p4)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>11 properties (p3)</p></div></div></body></div>`)[0];

                var html_c06f61fbb2d6f75a3cbb2023d44a34fb = $(`<div id="html_c06f61fbb2d6f75a3cbb2023d44a34fb" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wood End</h1><div class="nugget-popup"><p>Surface water flooding on 11 June 2023 caused internal flooding to properties in Wood End (Atherstone). (p3)</p></div><div class="nugget-popup"><p>Flooding occurred in Wood End on 11 June 2023. Recovery and investigations were carried out: WCC worked with Severn Trent Water, WCC Highways, councillors and residents to provide advice and guidance, advise on remedial works and to investigate the drainage network. Considerable remedial work has taken place but parts of the remedial works remain ongoing. (p4)</p></div><div class="nugget-popup"><p>A short period of very intense localised rainfall on 11 June 2023 caused surface water flooding in Wood End; anecdotal reports indicate numerous properties experienced ingress through building frontages as a result of surface water. [IMG,PAG] (p6)</p></div><div class="nugget-popup"><p>Anecdotal reports from 11 June 2023 indicate numerous properties experienced ingress through their frontages due to surface water after a short period of localised intense rainfall. [PAG] (p7)</p></div><div class="nugget-popup"><p>Short, localised intense rainfall produced surface water runoff that entered properties through the frontages, causing ingress to residential buildings in Wood End. [PAG] (p8)</p></div><div class="nugget-popup"><p>Short&ndash;duration, high&ndash;intensity rainfall caused surface water flows and the inundation/overwhelming of artificial drainage networks (including sewers and highway drainage) across the Wood End area, producing large amounts of ponding on highways and internal flooding of properties in two main areas (Wood Street and Glenville Avenue). [PAG] (p9)</p></div><div class="nugget-popup"><p>Short&ndash;duration, high&ndash;intensity rainfall produced surface water flows from higher ground on Tamworth Road that overwhelmed highway drainage and Severn Trent Water assets, causing manholes and gullies to back up and discharge onto the highway. Flows were channelled along the built environment (notably Wood Street and Glenville Avenue) and ponded on the highway. Internal flooding of properties occurred as a result. [IMG] (p10)</p></div><div class="nugget-popup"><p>Surface water flooding affected parts of the Wood End area &mdash; mapping and investigation focus show extent of surface water flooding concentrated along low&ndash;lying corridors and watercourses, affecting residential streets and contributing to internal flooding of properties in the locality. [IMG] (p11)</p></div><div class="nugget-popup"><p>Intense rainfall produced surface water runoff and high flows in ordinary watercourses; highway and STW drainage were overwhelmed leading to manhole/gully backup and internal flooding of properties across the village. [IMG,PAG] (p14)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>11 properties (p3)</p></div><div class="nugget-popup quant"><p>five properties (Wood Street); one property (from blocked/overgrown watercourse near Wood End Primary School); five properties (Glenville Avenue) [PAG] (p9)</p></div><div class="nugget-popup quant"><p>11 properties internally flooded (five properties on Wood Street; five properties on Glenville Avenue; one further property from a blocked/overgrown watercourse/culvert) [IMG] (p10)</p></div><div class="nugget-popup quant"><p>5 properties [IMG] (p11)</p></div><div class="nugget-popup quant"><p>11 properties [IMG,PAG] (p14)</p></div></div></body></div>`)[0];
