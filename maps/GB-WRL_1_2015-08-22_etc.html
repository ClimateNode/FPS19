                var html_f7dd1d558e131f0a24e4951ba77f74cb = $(`<div id="html_f7dd1d558e131f0a24e4951ba77f74cb" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Coronation Park</h1><div class="nugget-popup"><p>Reported as part of the East Greasby hotspot affected by surface water/urban flooding during the 2nd September 2015 event, with localised flooding of the park area linked to surface water runoff and ordinary watercourse connections. (p27)</p></div><div class="nugget-popup"><p>Grassed areas waterlogged with multiple areas of standing water; clay deposits and low&ndash;permeability soils generated overland flow that routed water toward surrounding properties; a drainage ditch on the western boundary conveyed a small volume of water and provided low&ndash;level protection to playing fields and adjacent residences. [IMG,PAG,MUL] (p29)</p></div><div class="nugget-popup"><p>Waterlogged, low&ndash;permeability soils generated overland flow during heavy rainfall that routed northerly across the park toward adjacent residential areas; a drainage ditch on the park's western boundary conveyed a small volume of water and provides only low&ndash;level protection to playing fields and nearby properties. [PAG,MUL] (p30)</p></div><div class="nugget-popup"><p>Limited infiltration capacity in the park's grassed areas generated a large volume of surface water which accumulated and produced overland flow toward surrounding streets. [IMG] (p31)</p></div><div class="nugget-popup"><p>Large contributing area at Coronation Park generated surface water runoff that caused flooding to nearby residential streets; park runoff was identified as the primary source of the flooding at this location. [PAG,MUL] (p32)</p></div><div class="nugget-popup"><p>Large volumes of surface water runoff affected properties at Coronation Park during the 2nd September 2015 flooding. [TAB] (p82)</p></div><div class="nugget-popup"><p>Large volumes of surface water runoff during the 2nd September 2015 event caused flooding associated with Coronation Park that affected nearby properties; recommendations included improving drainage and SuDS at the park to reduce future risk. [TAB] (p83)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8 hectares [IMG,PAG,MUL] (p29)</p></div></div></body></div>`)[0];

                var html_01b11d25749b9e1ed3f67db067f75de2 = $(`<div id="html_01b11d25749b9e1ed3f67db067f75de2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Magenta Living</h1><div class="nugget-popup"><p>Properties managed by Magenta Living were recorded as flooded; Magenta Living provided a record of flooded properties, photographs of flooding and a timeline for the 2nd September 2015 event. [TAB] (p21)</p></div><div class="nugget-popup"><p>Magenta Living teams acted as coordinators for affected residents, attempted contact with council leads, isolated utilities in properties, supported evacuations and relief for tenants displaced by surface&ndash;water flooding across Moreton streets (including Wastdale Road, Tern Way and Town Meadow Lane). [TAB] (p44)</p></div><div class="nugget-popup"><p>Many Magenta Living tenants reported flooding to the Magenta Living call centre; the organisation received a high number of calls and its call centre struggled to cope. WBC was unaware of Magenta Living&#8217;s involvement and of associated evacuations until midday. (p75)</p></div><div class="nugget-popup"><p>Magenta Living assisted vulnerable residents to evacuate flooded properties during the 2 September 2015 flooding, providing direct support to those affected. (p76)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Water level at Wastdale Road approximately 18 inches above property thresholds; properties at Tern Way confirmed flooded (approx. 50 properties) with depths up to 24 inches [TAB] (p44)</p></div></div></body></div>`)[0];

                var html_14573fc4f1e7ebaaa37384e2945ac063 = $(`<div id="html_14573fc4f1e7ebaaa37384e2945ac063" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>North Cheshire Trading Estate</h1><div class="nugget-popup"><p>Experienced localised river flooding, with the river flooding heavily compounded by surface water and sewer flooding. (p9)</p></div><div class="nugget-popup"><p>Access and egress to the estate were inhibited by fluvial flooding of the adjacent Prenton Brook during the 2 September 2015 event, causing major operational disruption to businesses on site (staff unable to leave or reach the site). No internal flooding of units was reported. [IMG] (p59)</p></div><div class="nugget-popup"><p>Flooding of the access road (Prenton Way) made the road impassable; police closed the access road, preventing vehicles and staff reaching the estate until waters receded (road became passable around 10:30am) and business operations were temporarily disrupted. (p60)</p></div><div class="nugget-popup"><p>Access road flooding occurred at the North Cheshire Trading Estate (Prenton Way) on 2 September 2015, with standing surface water at a low spot within the estate and photographs showing the access road submerged; vehicular access and estate operations were impacted. [PAG] (p61)</p></div><div class="nugget-popup"><p>Flooding affected the estate due to fluvial floodwater routed through the Prenton Brook, the brook exceeding its channel capacity (especially on the northern aspect where the gradient reduces), a low spot on Prenton Way retaining floodwater, and surface water compounding the fluvial flooding where sewer outfalls could not drain to the watercourse. [PAG] (p62)</p></div><div class="nugget-popup"><p>Significant volume of fluvial floodwater routed through Prenton Brook exceeded channel capacity around the northern estate, causing overtopping/inundation across large parts of the estate. A low spot in Prenton Way retained floodwater until the peak passed. Surface water compounded the fluvial flooding where UU surface water sewer outfalls could not drain. Access and egress to the site were likely impossible during flooding. [IMG,PAG,MUL] (p63)</p></div><div class="nugget-popup"><p>The estate's sole access and egress route was flooded, isolating the estate and disrupting access; this event highlighted the need for cooperative contingency planning between SP Energy Networks, WBC, the Environment Agency and emergency responders. [MUL] (p77)</p></div><div class="nugget-popup"><p>The estate's sole access and egress route was flooded, prompting the need for cooperative contingency planning and development of key contacts for repeat flood events. [MUL] (p84)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 hours [IMG] (p59)</p></div><div class="nugget-popup quant"><p>1 access and egress route [MUL] (p84)</p></div></div></body></div>`)[0];

                var html_e1fd6aa47dd2f35875b13c048bda4f91 = $(`<div id="html_e1fd6aa47dd2f35875b13c048bda4f91" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Dibbinsdale Brook</h1><div class="nugget-popup"><p>The Dibbinsdale Brook is the main river flowing south&ndash;north through Bebington and Bromborough; it is associated with the localised flooding reported in the area during the 22nd August 2015 and 2nd September 2015 incidents and may have contributed to fluvial/river flooding in the locality (contribution is inferred from its location through the flooded area). [MUL] (p25)</p></div><div class="nugget-popup"><p>High water levels in Dibbinsdale Brook produced fluvial floodwater and prevented drainage discharge, contributing to severe flooding at Spital Dam (surface water ponding plus river flooding) that caused major vehicular disruption and required a motorist rescue. [MUL] (p26)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1.2m depth; 1 motorist rescued [MUL] (p26)</p></div></div></body></div>`)[0];

                var html_37161027b11e6078f193b2eb1dfe2be2 = $(`<div id="html_37161027b11e6078f193b2eb1dfe2be2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Arrowe Road, Greasby</h1><div class="nugget-popup"><p>Reported highway and property flooding during the 2nd September 2015 event. The report links flooding in Central Greasby (including Arrowe Road) to surface water, sewers and ordinary watercourses rather than main river sources. (p27)</p></div><div class="nugget-popup"><p>Reported flood incidents at the junction with Tudor Grange were recorded in feedback following the 02/09/2015 event; flooding on Arrowe Road may have been compounded by surface&ndash;water flows routed downslope from the Rigby Drive/Croft area. [PAG] (p35)</p></div><div class="nugget-popup"><p>Surface water drainage and local topography cause convergence of flows outside properties, leading to sewer surcharging and severe ponding on the road; floodwater has entered homes via brickwork and doors despite some installed resilience measures; heavy traffic generated bow waves that increased damage to adjacent properties and community&ndash;led road closures were implemented during the event. [PAG] (p36)</p></div><div class="nugget-popup"><p>Repeated, severe flooding over an approximate 10&ndash;year period; water ingress into properties via brickwork and doors during flood events despite fitted airbrick covers; community&ndash;led road closures were used during the 2 September 2015 flood to prevent vehicular traffic generating bow waves that could increase property flooding; survey team provided advice on additional property resilience measures. (p37)</p></div><div class="nugget-popup"><p>Floodwater routed through adjacent gardens and footpaths reached properties on Arrowe Road; surface water from the easterly aspect and UU sewers exceeding capacity caused property flooding. Heavy traffic generated bow waves that increased flood damage to adjacent properties. [PAG] (p38)</p></div><div class="nugget-popup"><p>Subject to road closures by WBC Highways in response to flooding, disrupting access along the road during the event. [TAB] (p44)</p></div></div></body></div>`)[0];

                var html_7aa6c7cd2fab8f10b6739da769cdb8db = $(`<div id="html_7aa6c7cd2fab8f10b6739da769cdb8db" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Acton Lane, Saughall Massie</h1><div class="nugget-popup"><p>An additional threshold level was implemented at the Acton Lane gauging station (by the Environment Agency) and is now used to provide Moreton with a targeted flood warning service following the 2015 flood incidents. [MUL] (p80)</p></div></div></body></div>`)[0];

        var popup_98a7f7fc582e6935b2e82c453a6ff2ac = L.popup({});

        
            
                var html_45b2d35378aa886f09e6a3f52babedbb = $(`<div id="html_45b2d35378aa886f09e6a3f52babedbb" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wirral</h1><div class="nugget-popup"><p>Intense rainfall on 22 August 2015 caused localised flooding across the south&ndash;east of the Wirral (Rock Ferry to Bromborough and Bebington) leading to road closures and disruption to critical transport routes (including the Mersey Tunnel entrance). Severe rainfall across the wider Wirral Peninsula on 1&ndash;2 September 2015 caused significant flooding on 2 September 2015 with widespread property damage and flooding in urban areas. [MUL] (p8)</p></div><div class="nugget-popup"><p>Severe surface water flooding occurred across the Wirral due to intense rainfall (93 mm in 48 hours), causing localised and severe property damage. Sewer network capacity was exceeded in multiple locations causing localised highway and property flooding. Elevated river levels caused localised river flooding; multiple mechanisms interacted (combination flooding) particularly on 2 September. [PAG,MUL] (p9)</p></div><div class="nugget-popup"><p>The 2 September flooding affected the Wirral area: flooding occurred with limited or no warning and very rapidly, reducing lead time for response; information about scale and severity was slow to reach decision&ndash;makers; community resilience and preparedness were exposed as limited. [PAG] (p10)</p></div><div class="nugget-popup"><p>Significant numbers of flood incidents were reported across the Wirral including flooding to properties (residential and business premises) and to highways; sewer and surface water flooding affected property and priority highways. [MUL] (p11)</p></div><div class="nugget-popup"><p>Many parts of the borough experienced flooding to property and highways, with widespread surface water and sewer flooding recorded across the borough on the morning of 2 September 2015. (p16)</p></div><div class="nugget-popup"><p>Significant surface water/urban flooding occurred across the Wirral peninsular, with the majority of flooding on the morning of 2nd September 2015 following two intense pulses of rainfall (one after 00:00 on 1st September and a second after 00:30 on 2nd September). Flooding was spatially variable across catchments due to localized heavy rainfall. [MUL] (p18)</p></div><div class="nugget-popup"><p>Localised, high&ndash;intensity rainfall across the Wirral on the morning of 2 September 2015 produced observable flooding impacts (predominantly surface water, with some river impacts). The observed impacts were greater than expected from available gauge and radar data, becoming apparent well into the morning of 2 September 2015; investigators concluded either unrecorded localised higher intensities or antecedent conditions increased susceptibility. (p20)</p></div><div class="nugget-popup"><p>Multiple parts of the borough experienced flooding between 22nd August 2015 and 2nd September 2015; spatial hotspots of reported flooding were identified and mapped for those dates. [TAB,PAG,MUL] (p21)</p></div><div class="nugget-popup"><p>Parts of the borough (notably Bebington and Bromborough) experienced localised flooding on 22nd August 2015 and 2nd September 2015, resulting in disruption to main roads and the need for road closures by WBC Highways and Merseyside Police. [MUL] (p25)</p></div><div class="nugget-popup"><p>As the Lead Local Flood Authority, WBC commissioned the Section 19 investigation into the flooding in Moreton (emphasis on concerns about a consented temporary works crossing), held a public drop&ndash;in session (16 September 2015) with partners to advise residents on cleanup and preparedness, and is recommended to work in partnership with EA and UU to develop an integrated catchment understanding and improve communications about Environmental Permits and Ordinary Watercourse Consents. (p58)</p></div><div class="nugget-popup"><p>Areas within Wirral experienced fluvial flooding (Prenton Brook) that inhibited access to the North Cheshire Trading Estate, disrupting operations at businesses there (for example SP Energy Networks). [PAG] (p59)</p></div><div class="nugget-popup"><p>High flows in Prenton Brook caused flooding at the North Cheshire Trading Estate (Prenton Way) rendering the access road impassable; police closed the road, some staff were shuttled in by high&ndash;wheelbase vehicle, businesses temporarily relocated operations and access and operations gradually recovered after waters started to recede. EA carried out channel clearance. (p60)</p></div><div class="nugget-popup"><p>Significant surface&ndash;water and sewer flooding across the borough during the events of 22 Aug 2015 and 2 Sep 2015. Flooding caused highway inundation, road closures and stranded/partially submerged vehicles; United Utilities reported many sewer incidents where rainfall exceeded the 1&ndash;in&ndash;20&ndash;year design standard. [IMG,MUL] (p72)</p></div><div class="nugget-popup"><p>Widespread flooding across the borough from the 22/08/2015 and 02/09/2015 events, caused by intense rainfall, saturated ground and elevated river levels. Flooding led to road closures, highway inundation (e.g. Heswall), local ordinary watercourse and main river overtopping, and internal property flooding. [MUL] (p73)</p></div><div class="nugget-popup"><p>The administrative area experienced saturated ground and intense rainfall leading to widespread surface water and sewer flooding, elevated river levels that inhibited drainage and caused combined flooding mechanisms, rapid onset with limited warning, and extensive urban ponding due to flat topography. [PAG,MUL] (p74)</p></div><div class="nugget-popup"><p>The borough experienced significant flooding events prompting multi&ndash;agency response, evacuations and community support; led to reviews of plans, warning triggers and mitigation works by RMAs. [MUL] (p76)</p></div><div class="nugget-popup"><p>Residents across the borough were affected by flooding and reported uncertainty about how to report flooding, where to get help during or after a flood, and whether they would need additional help. The findings support a need for coordinated community&ndash;level resilience and engagement in known flooding hotspots. [MUL] (p78)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>452 reports of flooding between 22 August and 2 September 2015; 83 internal property flooding reports (7 on 22 Aug 2015; 73 on 2 Sep 2015; 3 unconfirmed); 75 external flooding reports; total 452 reports [MUL] (p8)</p></div><div class="nugget-popup quant"><p>452 reports of flooding; 7 internal property flooding reports on 22 August 2015; 73 internal property flooding reports on 2 September 2015 [PAG,MUL] (p9)</p></div><div class="nugget-popup quant"><p>1 access road impassable for approximately 4 hours [PAG] (p59)</p></div><div class="nugget-popup quant"><p>452 reports of flooding; 73 confirmed internal property floodings (2/9/2015) [MUL] (p73)</p></div><div class="nugget-popup quant"><p>452 reports of flooding; 73 internal property floodings [PAG,MUL] (p74)</p></div></div></body></div>`)[0];

                var html_abbe31291ec211902d23856c02ac6d4c = $(`<div id="html_abbe31291ec211902d23856c02ac6d4c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bromborough</h1><div class="nugget-popup"><p>Localised flooding from intense rainfall resulting in road closures and disruption to transport routes. (p8)</p></div><div class="nugget-popup"><p>Sewer network capacity being exceeded caused localised highway flooding and, in some places, flooding of residential properties in Bromborough. [MUL] (p9)</p></div><div class="nugget-popup"><p>Sewer and surface water flooding affected property and highways; the area is specifically named as impacted on 22 August 2015 and the borough experienced widespread surface&ndash;water and sewer flooding during the 2 September 2015 event. [MUL] (p16)</p></div><div class="nugget-popup"><p>Public highway in the Bromborough area was flooded, contributing to transport disruption during the 22 August 2015 event. (p24)</p></div><div class="nugget-popup"><p>Bromborough experienced localised flooding during the events on 22nd August 2015 and again on 2nd September 2015. The flooding significantly affected main roads, prompting road closures. [IMG,MUL] (p25)</p></div></div></body></div>`)[0];

                var html_fc548f656a602afc716214e8f7a4a2eb = $(`<div id="html_fc548f656a602afc716214e8f7a4a2eb" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bebington</h1><div class="nugget-popup"><p>Localised flooding from intense rainfall causing road closures and disruption to critical transport routes. (p8)</p></div><div class="nugget-popup"><p>Localised sewer network exceedance led to highway flooding and, in places, flooding of residential properties in Bebington. [MUL] (p9)</p></div><div class="nugget-popup"><p>Sewer and surface water flooding affected property and priority highways in the south&ndash;east of the Wirral that includes Bebington. (p16)</p></div><div class="nugget-popup"><p>Public highway in the Bebington area was flooded, contributing to transport disruption during the 22 August 2015 event. (p24)</p></div><div class="nugget-popup"><p>Localised flooding occurred during the 22nd August 2015 and again on 2nd September 2015, causing significant disruption to main roads in the area; road closures were put in place by WBC Highways and Merseyside Police. [IMG,MUL] (p25)</p></div><div class="nugget-popup"><p>Following the 22 Aug and 2 Sep 2015 incidents WBC Highways investigated areas around Bebington for potential operational problems associated with flooding; road sweeping was undertaken at nearby Moreton to remove highway flood debris and gullies were checked and repaired where needed. [MUL] (p80)</p></div></div></body></div>`)[0];

                var html_c36eb5b7e1f4575a87139f970bebcb58 = $(`<div id="html_c36eb5b7e1f4575a87139f970bebcb58" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Moreton</h1><div class="nugget-popup"><p>Significant property damage and property flooding reported in the urban area of Moreton during the wider Wirral flooding event. (p8)</p></div><div class="nugget-popup"><p>Moreton was severely affected by interacting surface water, sewer and river flooding &mdash; elevated river levels caused localised river flooding which exacerbated surface water and sewer flooding. (p9)</p></div><div class="nugget-popup"><p>Surface water flooding combined with ordinary watercourse and Main River flooding, contributing to flooding of property and highways in the area. (p16)</p></div><div class="nugget-popup"><p>Main River and ordinary watercourse flooding occurred in Moreton during the 2 September 2015 event and combined with widespread surface&ndash;water/sewer flooding across the borough, contributing to flooding of property and highways in the area. [PAG,IMG,TAB] (p17)</p></div><div class="nugget-popup"><p>Estimated flood extents were produced for Moreton and used to identify flooding hotspots following the 22nd August 2015 and 2nd September 2015 events. [TAB,MUL] (p21)</p></div><div class="nugget-popup"><p>Identified as a study area and targeted for site visits to investigate reported flooding associated with the 2 September 2015 event; investigations considered internal property flooding and external flooding mechanisms. (p24)</p></div><div class="nugget-popup"><p>Reported flood incidents were recorded in the area (notably at the junction of Arrowe Road and Tudor Grange) and drop&ndash;in feedback sessions were held in Moreton following the 2 September 2015 event where residents provided photographic evidence and accounts of property flooding. (p36)</p></div><div class="nugget-popup"><p>Localised river/urban flooding in the village associated with elevated levels in Arrowe Brook. AECOM reconstructed an approximate timeline for the flooding that occurred on 2nd September 2015; residential areas bisected by Arrowe Brook experienced localised inundation. Downstream discharge issues at Bidston Great Culvert (trash screen alarm) formed part of the incident timeline. [IMG,PAG] (p43)</p></div><div class="nugget-popup"><p>Properties in Moreton experienced flooding from surface water; reports of property flooding were recorded and residents requested sandbags and assistance; emergency response and community support organised for affected residents. [TAB,PAG] (p44)</p></div><div class="nugget-popup"><p>Flooding affected the Moreton area, with residential streets (including Tern Way and Wastdale Drive) inundated as shown in contextual photographs. (p46)</p></div><div class="nugget-popup"><p>A swollen River Birket/overflowing watercourse overtopped its banks in Moreton on 2 Sep 2015, producing fast&ndash;moving, high water that encroached onto adjacent floodplain and threatened nearby residential properties; debris was visible at the water's edge. [IMG] (p48)</p></div><div class="nugget-popup"><p>Photographs document flooding in Moreton on 2/9/15; residential areas and adjacent open land were inundated. Blocked surface water outfalls and potential backwater from Arrowe Brook/rail bridge were identified as contributing factors. [IMG,PAG] (p49)</p></div><div class="nugget-popup"><p>The town experienced flooding resulting from multiple interlinked mechanisms: fluvial flow constriction (bridges), and a temporary UU crossing over Arrowe Brook which was present during the 2 September event and was a focus of community concern about its contribution to flooding; properties upstream of constrictions were impacted by backwater effects. [PAG] (p50)</p></div><div class="nugget-popup"><p>Urban area of Moreton flooded on 2 September 2015 due to several interlinked mechanisms: high river flows on Arrowe Brook combined with surface water (rainfall/runoff) and drainage interactions. River flow alone was assessed as not sufficient to cause the observed flooding. (p51)</p></div><div class="nugget-popup"><p>A combination of severe surface water and fluvial flooding occurred in Moreton on 2 September 2015 as a result of intense rainfall, elevated river flows (Arrowe Brook), constrained downstream discharge at the Great Culvert/Mersey Estuary producing backwater on the River Birket, and local hydraulic restrictions (bridges). (p53)</p></div><div class="nugget-popup"><p>Areas of Moreton were flooded on 2 September 2015 due to fluvial flooding from the Arrowe Brook; the Environment Agency&#8217;s predefined threshold at the Greasby Road gauge was not exceeded so no Flood Warning was issued for the Moreton FWA for this event. [PAG] (p56)</p></div><div class="nugget-popup"><p>Areas of Moreton were flooded on 2nd September 2015. The report concludes the flooding resulted from a combination and interaction of fluvial (Arrowe Brook), surface&ndash;water and sewer flooding mechanisms rather than from a single source. [PAG,IMG] (p57)</p></div><div class="nugget-popup"><p>Parts of Moreton were flooded on 2nd September 2015 by a combination of surface water runoff, sewer flooding and raised levels in the Arrowe Brook. Residents experienced damage and required clean&ndash;up; community engagement (drop&ndash;in session) and targeted flood warning improvements were implemented afterwards. [PAG] (p58)</p></div><div class="nugget-popup"><p>The incident in Moreton began with intense surface&ndash;water and sewer flooding several hours before river involvement; internal property flooding was confirmed (first confirmed internal flood report at 09:10 in the Moreton timeline). Arrowe Brook flows later elevated river levels and combined with surface&ndash;water and sewer flooding to increase property inundation and impair drainage. [PAG] (p74)</p></div><div class="nugget-popup"><p>Rapid&ndash;onset surface water flooding caused internal flooding of properties in Moreton; first reports to emergency services and first confirmed internal flooding occurred within a two&ndash;hour window, limiting response time. (p75)</p></div><div class="nugget-popup"><p>Area experienced flooding linked to Arrowe Brook and sewer failure/overrunning; properties were flooded, residents evacuated or required assistance, and post&ndash;event mitigation and investigations were undertaken. (p76)</p></div><div class="nugget-popup"><p>Moreton was identified as a local flooding hotspot; a multi&ndash;agency feedback session for affected residents was held at the Moreton community centre on 25th September following the flood events, indicating local impact and community engagement needs. [MUL] (p78)</p></div><div class="nugget-popup"><p>Moreton experienced rapid surface&ndash;water flooding on 2 September 2015 which preceded and was then accompanied by fluvial overtopping of the Arrowe Brook; the Flood Alert for Moreton was issued about four hours after the flooding occurred. This event prompted targeted changes to flood&ndash;warning procedures and community engagement. [PAG] (p79)</p></div><div class="nugget-popup"><p>Moreton experienced surface water flooding during the 22 Aug and 2 Sep 2015 events. The Environment Agency undertook hydraulic modelling of the flooding mechanisms, revised flood warning procedures by adding an additional threshold at the Acton Lane gauging station to provide targeted warnings for Moreton, WBC carried out road sweeping to remove flood debris, and United Utilities investigated reports and provided property&ndash;level mitigation to affected properties. [MUL] (p80)</p></div><div class="nugget-popup"><p>The Moreton area experienced flooding associated with the 22nd August 2015 and 2nd September 2015 events; incidents in the area were investigated by UU, and the role of a temporary crossing in Arrowe Brook as a contributor was examined. [MUL] (p81)</p></div><div class="nugget-popup"><p>Reported to have experienced combined flooding mechanisms (sewers, watercourses and surface water) during the investigated events; prompted recommendations for integrated catchment modelling and community engagement to improve resilience and preparedness. [MUL] (p84)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>properties flooded to a depth of 24 inches (at Tern Way, Moreton) (p46)</p></div><div class="nugget-popup quant"><p>11.7m3/s peak on the Arrowe Brook (reported as approximately a 1 in 75 year fluvial return period) (p53)</p></div></div></body></div>`)[0];

                var html_28ad390358c79cacc1e2ad8452f20ab9 = $(`<div id="html_28ad390358c79cacc1e2ad8452f20ab9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Greasby</h1><div class="nugget-popup"><p>Significant property damage and property flooding reported in the urban area of Greasby during the wider Wirral flooding event. (p8)</p></div><div class="nugget-popup"><p>Surface water flooding around Coronation Park, Rigby Drive and Arrowe Road in Greasby caused localised and severe property damage; sewer network exceedance also contributed to local highway and residential flooding. [MUL] (p9)</p></div><div class="nugget-popup"><p>Multiple reports of property and highway flooding during the 2nd September 2015 event. Flooding was predominantly linked to surface water, sewers and ordinary watercourses rather than the main rivers; hotspots within the village were delineated and categorised into connected flood cells. (p27)</p></div><div class="nugget-popup"><p>Converging surface water from surrounding hills and ordinary watercourses exceeded sewer capacity and flowed overland through streets and gardens in central Greasby. Surface water routed from the hillside above Rigby Drive via The Close and Rigby Drive into gardens and onward to The Croft, conveyed along Howell Drive with ponding at the junction with Lloyd Drive, and routed through gardens and a footpath on Lloyd Drive onto properties on Arrowe Road. Overland flow also ran down Tudor Grange onto Circular Drive and onto Rylands Hey. Heavy traffic on Arrowe Road generated bow waves that increased damage to adjacent properties. [IMG] (p39)</p></div><div class="nugget-popup"><p>During the 2nd September 2015 event large volumes of runoff at Coronation Park (Greasby) affected properties; recommended resilience improvements target reducing surface water runoff that caused property impacts on nearby streets (Brookdale Close, Joan Avenue and Greasby Road). The area also contains other identified hotspots (e.g. Central Greasby, Circular Drive) requiring investigation. [TAB] (p83)</p></div></div></body></div>`)[0];

                var html_eb9395b5b979f29202b3a3d8fe430c64 = $(`<div id="html_eb9395b5b979f29202b3a3d8fe430c64" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Pensby</h1><div class="nugget-popup"><p>Significant property damage and property flooding reported in the urban area of Pensby during the wider Wirral flooding event. (p8)</p></div><div class="nugget-popup"><p>Standing surface water in northwest Pensby due to insufficient hydraulic capacity in the United Utilities (UU) sewer network during extreme rainfall; suspected surface water flooding in southeast Pensby. Local highway topography (notably at Thingwall Drive and Somerset Road) routed floodwater towards properties. Internal flooding of homes at Thingwall Drive during the 2nd September 2015 event (UU dispatched an operations team to pump floodwater out). Post&ndash;flood clearance, maintenance and refurbishment works were carried out on Somerset Road by UU. [IMG,MUL] (p71)</p></div></div></body></div>`)[0];
