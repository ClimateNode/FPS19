                var html_9648e0756bf1febb3cfca649234df1af = $(`<div id="html_9648e0756bf1febb3cfca649234df1af" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ferndale Avenue, Hounslow</h1><div class="nugget-popup"><p>Residents on Ferndale Avenue reported flooding affecting properties/residents; surface water drainage assets at the eastern end of the development are under investigation to determine whether surface water discharges into the foul (sewer) system and whether drainage connections/maintenance of a private road and garages contribute to the problem. (p4)</p></div><div class="nugget-popup"><p>Rainfall&ndash;driven surface water ponding at the end of the cul&ndash;de&ndash;sac caused flooding of the carriageway and footway at the eastern end of Ferndale Avenue; flood water extended towards and entered private garages behind the houses and in places overtopped the kerb. Infrastructure impacts include manholes and gullies surcharging associated with a filled soakaway, and reported foul sewer blockages (FOGs) and silt in the surface water sewer noted as contributing factors. [MUL] (p8)</p></div><div class="nugget-popup"><p>Manholes and gullies at Ferndale Avenue surcharged during reported flood incidents. Two gullies that drain to a soakaway became overwhelmed and surcharged. The newer development at the end of Ferndale Avenue lacks known surface water drainage so the foul sewer (allegedly acting as a combined sewer) must accept additional runoff from houses at the eastern end, increasing flows and contributing to the system becoming overwhelmed. One gully on the privately owned road leading to the garages behind Ferndale Avenue is privately owned and maintained. [PAG,MUL] (p16)</p></div><div class="nugget-popup"><p>Surface water and sewer flooding occurred in Ferndale Avenue: gullies and the local soakaway became overwhelmed leading to gullies surcharging; the sewer system was at risk of becoming overwhelmed by additional runoff and manholes were reported to surcharge, limiting drainage of floodwater from the street. [PAG] (p17)</p></div><div class="nugget-popup"><p>Soakaway at the end of Ferndale Avenue became overwhelmed causing connected gullies to surcharge; increased flow entering the drainage system at the street end risked overwhelming the system and causing manholes to surcharge. A privately owned gully at the topographical low point limits the ability for surface water to drain away. [PAG] (p18)</p></div><div class="nugget-popup"><p>Recurring flood incidents were reported at Ferndale Avenue. A foul/sewer flooding report was logged (forwarded 17 January 2016). Multiple blocked/cleared gullies were recorded on Ferndale Avenue and, following recurring incidents (including the 10 June 2019 incident), a non&ndash;return valve was fitted in the surface water system draining to the soakaway to prevent backflow; no flood incidents have been reported to Hounslow since that installation. [MUL] (p19)</p></div><div class="nugget-popup"><p>Recurring flooding incidents on Ferndale Avenue that prompted multiple attendances by the sewerage company; causes identified during visits included blockages in the foul and surface water systems (FOGs and silt), issues with road gullies and groundwater, and problems with the surface water system that leads to the soakaway. Hounslow Highways fitted a non&ndash;return valve in the surface water system draining to the soakaway in summer 2019 to prevent backflow; no further flood incidents at Ferndale Avenue have been reported to Hounslow since the valve installation. [PAG,MUL] (p20)</p></div><div class="nugget-popup"><p>Surface water pools in the topographical low point of Ferndale Avenue; drainage from this low point is slow because there is only one privately owned gully (located on the road leading to the garages). Gullies and the soakaway can surcharge due to groundwater ingress, and residents reported flooding since summer 2019. [PAG,MUL] (p23)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>ten reports of flooding (since 2013); photographs taken on 10 and 13 June 2019; TWUL called three times to investigate foul sewer blockages in 2020 [MUL] (p8)</p></div><div class="nugget-popup quant"><p>one foul sewer flooding report (17 January 2016); two gullies cleared (26 June 2016); one blocked gully cleared (24 October 2017); one blocked gully reported (6 February 2019); one non&ndash;return valve installed (summer 2019) [MUL] (p19)</p></div><div class="nugget-popup quant"><p>ten call&ndash;outs since 2018; three blockages rectified in 2020 [PAG,MUL] (p20)</p></div></div></body></div>`)[0];
