                var html_7a6af35f0286021fd2bb0ee7b5b08228 = $(`<div id="html_7a6af35f0286021fd2bb0ee7b5b08228" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bedford</h1><div class="nugget-popup"><p>Various locations across the borough experienced flooding during the December 2020 flood event. (p1)</p></div><div class="nugget-popup"><p>Parts of the borough experienced widespread and exceptional flooding from both surface water runoff and the River Great Ouse between 23&ndash;26 Dec 2020; rapid overland flows caused villages north of Bedford to flood within several hours; communities required rescue and local assistance. [PAG] (p3)</p></div><div class="nugget-popup"><p>Widespread flooding affected residential, commercial, community and educational properties across the borough, including internal property flooding reported at multiple locations and resulting in 27 formal investigations of internal flooding. (p4)</p></div><div class="nugget-popup"><p>Widespread flooding across the Borough between 23rd and 26th December 2020 affected multiple wards. Internal property flooding occurred at 27 locations and 27 formal flood investigations were carried out across 20 villages/towns. Roads, footpaths, gardens and open spaces were also inundated, causing access impacts in areas including Kingsbrook Ward (footpath access in the vicinity of Oasis Pool, Cardington Road and Goodmayes Close), Castle Ward, Newnham Ward, Great Barford and Bletsoe. Flood waters and/or discharge to local drainage systems, highway culverts and gullies produced localised access and surface flooding impacts. (p5)</p></div><div class="nugget-popup"><p>Clusters of flooding incidents occurred in and around the town, producing access impacts to roads, footpaths and open spaces. Specific local impacts cited include footpath access issues in Kingsbrook Ward (vicinity of Oasis Pool, Cardington Road, Goodmayes Close) and impacts in Castle Ward and Newnham Ward due to flood waters and drainage/culvert discharge. (p6)</p></div><div class="nugget-popup"><p>Internal flooding caused by River Great Ouse: Bedford &ndash; Boating Lake: 1 commercial and 1 educational property flooded; Bedford &ndash; Priory Lake: 1 commercial property flooded. [TAB] (p7)</p></div><div class="nugget-popup"><p>Across the borough, surface water and fluvial flooding left debris and siltation in properties, roads, footways, local drainage systems and watercourses; several roads and bridges were reported impassable, hindering access for highways and emergency teams. Rest centres were used by affected residents and evacuations occurred. [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>Multiple locations within the borough adjacent to the River Great Ouse experienced river (fluvial) flooding during the 23&ndash;26 December 2020 event; Flood Warnings were issued for low&ndash;lying areas in the borough (including Boating Lake and Priory Lake in Bedford on 25/12/2020). [TAB] (p14)</p></div><div class="nugget-popup"><p>Above&ndash;average rainfall in the week before 23 December 2020 caused main river and ordinary watercourse levels to rise. Flood Warnings were issued across the Borough shortly before or after flooding in several locations, giving insufficient time for residents to prepare or evacuate; Harrold and Wyboston did not receive a Flood Warning. Inconsistent and changing timing information from the Environment Agency about surges/peaks on the Great River Ouse increased community anxiety and hindered the Council's response. In the absence of timely warnings, Police volunteers and the Resilience Team undertook a mass leaflet drop (24 December) to warn residents of imminent flooding. Surface water flooding affected areas that are generally not covered by flood warnings. [MUL] (p15)</p></div><div class="nugget-popup"><p>The 23 December 2020 flood involved ditch/river capacity issues (Kings Ditch mentioned) and surface water/overland flows affecting properties and highways across the borough, prompting investigations and remedial works by agencies. [TAB] (p24)</p></div><div class="nugget-popup"><p>High Street highway drainage was investigated due to blockages related to the flood response; blockages were cleared in March 2021 to restore drainage and reduce highway surface water flooding. [PAG,MUL] (p25)</p></div><div class="nugget-popup"><p>Kempston High Street experienced flooding during the event. Culverts on High Street became blocked and required clearance (two culverts were cleared in March 2021). Temporary drainage works were carried out after the flood: grips were dug either side of High Street to divert water into adjacent ditches, and a resident cleared/maintained the ditches following the flood. [TAB] (p27)</p></div><div class="nugget-popup"><p>Flooding in December 2020 affected highways and properties: highway drainage and grips along High Street required inspection and maintenance, a blocked gully on Kennel Hill was cleared (March 2021) as part of post&ndash;flood recovery, and Main River assets were inspected with remedial works identified for some assets. [PAG] (p28)</p></div><div class="nugget-popup"><p>Parts of the area experienced surface water/urban flooding during the December 2020 event, prompting investigations into highway drainage, culvert condition and property&ndash;level flood protection measures; remedial gullies clearance was carried out in March 2021 and highway drainage works (clearance of blockages) were completed in May 2021. [PAG] (p30)</p></div><div class="nugget-popup"><p>The December 2020 flood event in Bedford prompted investigations, inspections of river/main&ndash;river assets and highway drainage, remedial works, community flood&ndash;group engagement, and property&ndash;level flood protection investigations across the area. [PAG] (p32)</p></div><div class="nugget-popup"><p>Surface water/urban flooding affected the length of High Street and Green Lane, leading to investigations of highway drainage and culverts and clearance works; the drainage clearing for this length was completed in May 2021 as a response to the flood impacts. [PAG] (p33)</p></div><div class="nugget-popup"><p>Surface water/urban flooding occurred in Bedford on 23rd December 2020, prompting investigation of culverts and maintenance of ditches and consideration of property&ndash;level flood resilience measures (including for a flooded utility room). [TAB] (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>65 properties; 27 different locations [PAG] (p3)</p></div><div class="nugget-popup quant"><p>27 locations; 27 investigations; 20 villages/towns (p4)</p></div><div class="nugget-popup quant"><p>27 locations; 27 investigations; 20 villages/towns (p6)</p></div><div class="nugget-popup quant"><p>1 commercial; 1 educational; 1 commercial [TAB] (p7)</p></div><div class="nugget-popup quant"><p>five properties; one property; two bridges [PAG,IMG] (p10)</p></div></div></body></div>`)[0];

,PAG] (p21)</p></div><div class="nugget-popup"><p>Local flooding from watercourses and constrained culverts affected the village (including Vicarage Lane area); actions recorded include culvert condition investigation, assessment of downstream river influence, maintenance of watercourses, consideration of a flood warning system, and community resilience measures (flood kits, flood plans, PFR information). [TAB] (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 residential; 4 residential [TAB,PAG] (p7)</p></div></div></body></div>`)[0];
