                var html_e59139ec4bb36f2e8a606aa0781eb261 = $(`<div id="html_e59139ec4bb36f2e8a606aa0781eb261" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Newark-On-Trent</h1><div class="nugget-popup"><p>Newark on Trent is the subject of this Section 19 investigation and was within the area affected by the heavy rain from Storm Henk that caused flooding on 2 January 2024. [PAG] (p1)</p></div><div class="nugget-popup"><p>Areas of Newark&ndash;on&ndash;Trent close to the River Trent lie within Flood Zone 3 (high risk) and nearby urban/peri&ndash;urban areas are shown as being at medium to high surface&ndash;water flood risk. Figure 5 is noted to show areas affected by internal flooding within the mapped area. [IMG] (p3)</p></div><div class="nugget-popup"><p>Internal flooding affected multiple parts of the town when drainage assets were overwhelmed following heavy rainfall from Storm Henk; properties, open spaces and public highways were flooded. [IMG,PAG] (p4)</p></div><div class="nugget-popup"><p>Flood warnings were issued for River Trent locations affecting Newark; multi&ndash;agency response and community engagement (public meeting, drop&ndash;in event) took place to gather impacts and support affected residents. (p7)</p></div><div class="nugget-popup"><p>Experienced surface water flooding that transitioned to river flooding from the River Trent on 2 January 2024; floodwater entered and overwhelmed the sewer network in some locations of the town, causing local flooding impacts and prompting ongoing investigations. (p8)</p></div><div class="nugget-popup"><p>The Environment Agency has planned asset data improvements across Newark and commissioned an updated flood risk model to test scenarios and inform future works following flooding in the area. (p9)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>three discrete areas [IMG,PAG] (p4)</p></div></div></body></div>`)[0];
