                var html_d527e6f214d42ec48c55f69060ed8f35 = $(`<div id="html_d527e6f214d42ec48c55f69060ed8f35" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Newark and Sherwood</h1><div class="nugget-popup"><p>The district containing Newark on Trent was within the area affected by heavy rain from Storm Henk leading to flooding on 2 January 2024. (p1)</p></div><div class="nugget-popup"><p>Internal flooding affected properties, open spaces and public highways in Newark on Trent. Three discrete areas were internally flooded: Farndon Road area, Kelham Road area and Lime Grove. Kelham Road flooding was attributed to interaction between the floodplain catchment and the public sewerage system; Lime Grove appears to have been flooded due to intense local rainfall. Rivers and tributaries were surcharged and drainage assets were overwhelmed, preventing effective discharge. (p4)</p></div><div class="nugget-popup"><p>Flooding affected the Farndon Road area and an area of Farndon experienced internal flooding. Nursery Avenue and Old Fosse Road suffered isolated flooding that may have been contributed to by the River Devon. [PAG] (p5)</p></div><div class="nugget-popup"><p>Newark and Sherwood District Council played an intensive role in flood response: formed a large cross&ndash;departmental team, staff worked beyond normal hours to prioritise and deliver flood support. (p7)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 discrete areas (p4)</p></div></div></body></div>`)[0];

                var html_cb1aa29f73f132c96d3b53110edd7f12 = $(`<div id="html_cb1aa29f73f132c96d3b53110edd7f12" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Newark-On-Trent</h1><div class="nugget-popup"><p>Newark on Trent is the subject of this Section 19 investigation and was within the area affected by the heavy rain from Storm Henk that caused flooding on 2 January 2024. [PAG] (p1)</p></div><div class="nugget-popup"><p>Areas of Newark&ndash;on&ndash;Trent close to the River Trent lie within Flood Zone 3 (high risk) and nearby urban/peri&ndash;urban areas are shown as being at medium to high surface&ndash;water flood risk. Figure 5 is noted to show areas affected by internal flooding within the mapped area. [IMG] (p3)</p></div><div class="nugget-popup"><p>Internal flooding affected multiple parts of the town when drainage assets were overwhelmed following heavy rainfall from Storm Henk; properties, open spaces and public highways were flooded. [IMG,PAG] (p4)</p></div><div class="nugget-popup"><p>Flood warnings were issued for River Trent locations affecting Newark; multi&ndash;agency response and community engagement (public meeting, drop&ndash;in event) took place to gather impacts and support affected residents. (p7)</p></div><div class="nugget-popup"><p>Experienced surface water flooding that transitioned to river flooding from the River Trent on 2 January 2024; floodwater entered and overwhelmed the sewer network in some locations of the town, causing local flooding impacts and prompting ongoing investigations. (p8)</p></div><div class="nugget-popup"><p>The Environment Agency has planned asset data improvements across Newark and commissioned an updated flood risk model to test scenarios and inform future works following flooding in the area. (p9)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>three discrete areas [IMG,PAG] (p4)</p></div></div></body></div>`)[0];
