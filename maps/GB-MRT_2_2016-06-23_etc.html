                var html_eceeb117ff73fbf8d3018416283b36f8 = $(`<div id="html_eceeb117ff73fbf8d3018416283b36f8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Whatley Avenue, Raynes Park</h1><div class="nugget-popup"><p>Foul sewer at the junction and the combined sewer network adjacent to Bushey Road experienced hydraulic overflow / capacity issues likely caused by misconnections or private drainage, contributing to flooding at Whatley Avenue. (p4)</p></div><div class="nugget-popup"><p>Street experienced sewer&ndash;related flooding during the June 2016 event; recorded sewer gauge indicated a 1&ndash;in&ndash;24&ndash;year return period for that storm. [TAB] (p21)</p></div><div class="nugget-popup"><p>Flooding concentrated at the local low point at the junction with Martin Way: internal flooding of properties where flows were channelled down Whatley Avenue towards the junction. Flooding started at about 09:00 on 23 June 2016 and lasted about 12 hours. [PAG] (p23)</p></div><div class="nugget-popup"><p>Surface water ponding/channelled to a local low point at the junction with Martin Way causing flooding at that junction; nearby properties set lower than the highway were affected. Highway gullies on Whatley Avenue (excluding the eastern part) were on Merton's high priority cleansing programme and had last been cleaned in January&ndash;February 2016 prior to the incident. [PAG,MUL] (p24)</p></div><div class="nugget-popup"><p>Properties on/near Whatley Avenue experienced internal flooding (confirmed by contractors on 23 June 2016); the main trunk sewer serving the area was running at full capacity during the event; as part of the response the foul sewer on Whatley Avenue (either side of the junction with Martin Way) was cleaned on 28 July 2016. [TAB,MUL] (p26)</p></div><div class="nugget-popup"><p>Runoff from higher ground (Cannon Hill Common and Joseph Hood Recreation Ground) and surcharge of local surface water and foul sewers caused flooding at low&ndash;level locations near the junction with Martin Way; gullies were overwhelmed and properties flooded. [PAG] (p27)</p></div><div class="nugget-popup"><p>A 750 mm surface water sewer and the foul sewer were running full upstream of the junction with Martin Way; additional flow backed up into gullies and caused flooding of low&ndash;level properties at the junction with Martin Way. Runoff from Cannon Hill Common and Joseph Hood Recreation Ground slopes down to Whatley Avenue, increasing flows into the local drainage. [PAG,MUL] (p28)</p></div><div class="nugget-popup"><p>Intense rainfall during the 22&ndash;24 June 2016 period associated with the June 2016 flood investigation produced surface water flooding at Whatley Avenue as part of the event. [TAB] (p87)</p></div><div class="nugget-popup"><p>Recorded extreme short&ndash;duration (5&ndash;minute) rainfall during 23 June 2016, associated with surface&ndash;water / flash&ndash;flooding conditions in the locality. [TAB] (p88)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 in 24 yr (recorded sewer return period) [TAB] (p21)</p></div><div class="nugget-popup quant"><p>approximately ten properties; peak depth between 300 and 450 mm [PAG] (p23)</p></div></div></body></div>`)[0];

iated with the June 2016 flood investigation produced surface water flooding at Martin Way as part of the event. [TAB] (p87)</p></div><div class="nugget-popup"><p>Recorded extreme short&ndash;duration (5&ndash;minute) rainfall during 23 June 2016, associated with surface&ndash;water / flash&ndash;flooding conditions in the locality. [TAB] (p88)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 in 24 yr (recorded sewer return period) (p21)</p></div><div class="nugget-popup quant"><p>approximately ten properties; peak depth between 300 and 450 mm [PAG] (p23)</p></div></div></body></div>`)[0];

                var html_b3fb10af212b6321210766e3421d4169 = $(`<div id="html_b3fb10af212b6321210766e3421d4169" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bushey Road, London Borough of Merton</h1><div class="nugget-popup"><p>The combined sewer/trunk main adjacent to Bushey Road receives multiple flows from north and south; capacity and hydraulic overflow issues in this network contributed to flooding in the surrounding area (Apostles area experienced significant flooding in the 2016 event and lesser flooding during 2017 events). CCTV of the combined sewer near Bushey Road was recommended to identify misconnections. [PAG,MUL] (p28)</p></div><div class="nugget-popup"><p>Surface water flooding in the Apostles area drained toward and into the Bushey Road trunk sewer; the local roads (north&ndash;south roads between Kingston Road, Grand Drive and Bushey Road) became inaccessible to vehicular traffic during the event. The worst affected road, Dupont Road, experienced internal property flooding and widespread inundation visible to wheel&ndash;rim height on parked vehicles. [PAG] (p29)</p></div><div class="nugget-popup"><p>Flows from the blocked Dupont Road passed across Bushey Road and there was highway ponding at the junction with Grand Drive. The 2000 by 1524 mm trunk surface&ndash;water sewer on Bushey Road acted as a hydraulic throttle, contributing to the ponding. TWUL inspected this trunk sewer and found it running clear on 26 June 2016. [TAB] (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately ten properties; 36 hours; maximum depth 300&ndash;450 mm [PAG] (p29)</p></div></div></body></div>`)[0];

                var html_31a8c24bcbfcf58775b3138699b9057f = $(`<div id="html_31a8c24bcbfcf58775b3138699b9057f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Dupont Road, London Borough of Merton</h1><div class="nugget-popup"><p>Part of the 'Apostles' area that experienced flooding driven by interactions between surface water runoff and the sewer network; flooding was linked to a hydraulic 'throttle' effect in the main surface water sewer and its connections, contributing to surface water/sewer overflow onto side roads including Dupont Road. CCTV investigation of the main surface water sewer and connections was recommended. (p4)</p></div><div class="nugget-popup"><p>Dupont Road (included within the Apostles area) experienced sewer&ndash;related flooding during the June 2016 event with a recorded sewer return period of 1&ndash;in&ndash;24 years. [TAB] (p21)</p></div><div class="nugget-popup"><p>Dupont Road was the worst&ndash;affected road in the Apostles area during the June 2016 event: the street was inundated, vehicles partially submerged and pedestrian/vehicular access disrupted; flooding contributed to internal flooding of properties in the affected area. [IMG,PAG] (p29)</p></div><div class="nugget-popup"><p>Dupont Road was the worst&ndash;affected road in the event: flooding reached internal parts of properties. The report links the mapped extent in Dupont Road to the June 2016 event and notes it as the worst affected road in the area. [PAG] (p30)</p></div><div class="nugget-popup"><p>Flooding occurred as a result of a blockage identified in the surface water sewer. Non&ndash;scheduled gully cleansing on 22 Jun 2016 identified the issue; on 23 Jun 2016 a Merton jetting tanker cleared the blockage and resolved the flooding. Thames Water attended subsequently to check the sewer. [TAB] (p32)</p></div><div class="nugget-popup"><p>Blockage of a 225 mm surface water sewer at the junction with Dorien Road caused water to back up and flood the low point of Dupont Road, producing internal flooding of properties at lower levels. The blockage was cleared by Merton using a jetting tanker. [TAB,PAG] (p33)</p></div><div class="nugget-popup"><p>Dupont Road (within the Apostles area) recorded intense rainfall during 22&ndash;24 June 2016 associated with the June 2016 event and was affected by surface water flooding during that event. [TAB] (p87)</p></div><div class="nugget-popup"><p>Recorded extreme short&ndash;duration (5&ndash;minute) rainfall during 23 June 2016 (listed as part of the Apostles area), associated with surface&ndash;water / flash&ndash;flooding conditions in the locality. [TAB] (p88)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 in 24 yr (recorded sewer return period) [TAB] (p21)</p></div><div class="nugget-popup quant"><p>approximately ten properties; 300&ndash;450 mm [IMG,PAG] (p29)</p></div><div class="nugget-popup quant"><p>approximately 10 properties; maximum flood depth between 300 and 450 mm; incident duration about 36 hours [PAG] (p30)</p></div></div></body></div>`)[0];

h;priority cleansing programme (cleaned December 2015 and via reactive call&ndash;outs before and after the incidents) in response to the flooding incidents. [PAG,MUL] (p38)</p></div><div class="nugget-popup"><p>Coombe Lane (by Raynes Park railway bridge) recorded intense rainfall during 22&ndash;24 June 2016 associated with the June 2016 event and experienced surface water flooding as part of the investigated event. [TAB] (p87)</p></div><div class="nugget-popup"><p>Recorded extreme short&ndash;duration (5&ndash;minute) rainfall during 23 June 2016 (noted at location by Raynes Park Railway Bridge), associated with surface&ndash;water / flash&ndash;flooding conditions in the locality. [TAB] (p88)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 commercial properties [MUL] (p35)</p></div></div></body></div>`)[0];

                var html_94647b32040ffe7b14443b8f6b24c965 = $(`<div id="html_94647b32040ffe7b14443b8f6b24c965" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Worple Road, Raynes Park</h1><div class="nugget-popup"><p>Worple Road experienced flooding linked to surface water runoff and sewers reaching hydraulic capacity; Thames Water were recommended to carry out CCTV investigation of the surface water sewer network to establish sewer condition and identify blockages or defects contributing to the flooding. (p4)</p></div><div class="nugget-popup"><p>Worple Road (part of the 'Worple Road and Wimbledon Hill Road' location) experienced sewer flooding reaching the Section 19 threshold across the listed events. Flooding was recorded in June 2016, July 2017 and August 2017 (recorded sewer return periods 1 in 21 yr, 1 in 2 yr and 1 in 5 yr respectively). [TAB,MUL] (p21)</p></div><div class="nugget-popup"><p>Following the 2016 flooding incident, gullies along Worple Road were added to the high&ndash;priority cleansing programme, showing Worple Road was affected by the 2016 flood and associated sewer/highway drainage failures. (p37)</p></div><div class="nugget-popup"><p>Highway flooding and inundation of basements. Runoff entered basements of retail units (The Pavement) via basement skylights; flooding extended onto Worple Road Mews. Two residential properties were affected internally. [MUL] (p49)</p></div><div class="nugget-popup"><p>Highway inundated; basements of some retail units on The Pavement flooded by runoff entering through basement skylights at the footway; flooding extended onto Worple Road Mews; two residential properties affected internally; commercial units recorded internal flooding (30 July 2017 event). [PAG,MUL] (p50)</p></div><div class="nugget-popup"><p>Recorded historic flooding incidents in the vicinity (2007 and 2011) believed to be a combination of surface water and sewer flooding. The SFRA and RoFSW mapping indicate medium risk along Worple Road in front of commercial units; report notes similar consequences occurred in the 2016 and 2017 events. [PAG,MUL] (p52)</p></div><div class="nugget-popup"><p>Gullies on the road were cleansed between November 2016 and April 2017 as a response following flooding that affected the road and nearby commercial units. [TAB] (p53)</p></div><div class="nugget-popup"><p>Because Worple Road is relatively flat and perpendicular to local slopes, rapid surface water flow ponds on Worple Road and flows downhill toward the town centre; runoff from Worple Road and Worple Road Mews runs towards The Pavement shopping parade causing flooding to some shop units and surcharging of local surface water sewers. (p54)</p></div><div class="nugget-popup"><p>Short&ndash;duration extreme rainfall during 23 June 2016 resulted in localised surface water flooding of the road and surrounding areas, affecting carriageway drainage and access. [TAB] (p88)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 residential properties; flood depths 300&ndash;600 mm (recorded for the July 2017 incident) [MUL] (p49)</p></div><div class="nugget-popup quant"><p>2 residential properties [PAG,MUL] (p50)</p></div></div></body></div>`)[0];

                var html_e7b36eadf139d694d8f0a52707985196 = $(`<div id="html_e7b36eadf139d694d8f0a52707985196" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wimbledon Hill Road, London Borough of Merton</h1><div class="nugget-popup"><p>Wimbledon Hill Road was included among streets where surface water sewer condition is suspected to have contributed to flooding; the report recommends CCTV of surface water sewers to establish condition and potential causes of blockages or failures. (p4)</p></div><div class="nugget-popup"><p>The street was inundated by sewer&ndash;related flooding recorded at the local Thames Water sewer gauge. Flooding occurred on 23 June 2016, 29&ndash;30 July 2017 and 09 August 2017 with recorded sewer return periods of 1 in 21 years (June 2016), 1 in 2 years (July 2017) and 1 in 5 years (August 2017). [TAB,MUL] (p21)</p></div><div class="nugget-popup"><p>Part of the town&ndash;centre area that experienced flooding during the events; contributed to highway and basement inundation affecting commercial and residential premises in the local area. [MUL] (p49)</p></div><div class="nugget-popup"><p>The steep slope of Wimbledon Hill Road channels surface water runoff down towards the local low point at the junction with Alexandra Road and St George's Road, contributing to increased surface water flooding extents and channelling water that causes ponding on adjacent roads during the flooding incidents. [MUL] (p51)</p></div><div class="nugget-popup"><p>Historic flooding incidents recorded (2007 and 2011). Mapping and report text identify increased surface water flooding extents predicted on Wimbledon Hill Road and a high&ndash;risk junction with St George's Road/Alexandra Road; records indicate similar impacts in the 2016 and 2017 events. [PAG,MUL] (p52)</p></div><div class="nugget-popup"><p>Responders attended Wimbledon Hill Road (26 June 2016) and checked the lateral sewer; attended again on 28&ndash;29 June 2016 and pumped out the basement of a property. A CCTV sewer survey was later carried out (12 July 2016). [TAB,PAG] (p53)</p></div><div class="nugget-popup"><p>Basement flooding at a property was pumped out following the June 2016 incident; surface water runoff from Wimbledon Hill Road contributed to overland flow towards The Pavement shopping parade during the Aug 2017 event, increasing flood risk to nearby shops; lateral sewer was inspected and found clear in June 2016. [TAB,MUL] (p54)</p></div><div class="nugget-popup"><p>Short&ndash;duration extreme rainfall during 23 June 2016 produced localised surface water flooding on the road and adjacent areas, impacting drainage and access. [TAB] (p88)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one basement [TAB,PAG] (p53)</p></div><div class="nugget-popup quant"><p>1 property (basement pumped out) [TAB,MUL] (p54)</p></div></div></body></div>`)[0];

oding of the road and adjacent areas, causing rapid inundation of the carriageway and nearby land. [TAB] (p88)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>two residential properties; one property with damage to kitchen and flooring [PAG] (p55)</p></div></div></body></div>`)[0];

                var html_40aa929d0112b842935268017ff00fa5 = $(`<div id="html_40aa929d0112b842935268017ff00fa5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>West Barnes Lane, London Borough of Merton</h1><div class="nugget-popup"><p>Properties adjacent to West Barnes Lane were affected by preferential surface water flows and issues in the local surface water sewer network (including blockages), with flows directed from West Barnes Lane toward neighbouring streets contributing to flooding. (p5)</p></div><div class="nugget-popup"><p>West Barnes Lane experienced sewer&ndash;related flooding on 23 June 2016 and 29&ndash;30 July 2017; recorded sewer return periods were 1 in 30 years (June 2016) and 1 in 2 years (July 2017). [TAB,MUL] (p21)</p></div><div class="nugget-popup"><p>Surface water runoff overtopped the raised table at the junction with Adela Avenue and flowed along West Barnes Lane toward properties on the eastern side and the adjacent access gate to private land behind those properties. The flooding at this location reached Merton's Section 19 investigation threshold during the incidents listed. [PAG,MUL] (p59)</p></div><div class="nugget-popup"><p>Surface water and surface&ndash;water sewer surcharge led to flooding affecting properties on the eastern side of West Barnes Lane. Runoff that could not enter the sewer network drained towards the culverted Pyl Brook behind properties, causing inundation of rear gardens/driveways and increasing flood risk to adjacent homes. [IMG,PAG,MUL] (p60)</p></div><div class="nugget-popup"><p>Surface water runoff and surcharge towards the low point at the culverted Pyl Brook caused flooding along West Barnes Lane; eastern&ndash;side properties and driveways back&ndash;slope toward the highway and were within the flood&ndash;prone area. Gullies on West Barnes Lane were on the council's high&ndash;priority cleansing programme and had last been cleaned in December 2015/January 2016 prior to the flooding incidents. [PAG,MUL] (p61)</p></div><div class="nugget-popup"><p>Flooding recorded between junctions with Estella Avenue and Seaforth Avenue on 20 July 2007; attended on 23 June 2016 when a gully&ndash;cleansing tanker removed surface water but the surface water sewer was found not to be flowing. Subsequent gully cleans and highway/gully improvements were implemented to reduce runoff to properties. [TAB,PAG,MUL] (p62)</p></div><div class="nugget-popup"><p>Properties on West Barnes Lane were flooded because they sit slightly lower than the raised table at the Adela Avenue junction and runoff that could not enter gullies was channelled toward back&ndash;sloping driveways. Highway gullies at the junction were cleaned as part of the response. [TAB,MUL] (p63)</p></div><div class="nugget-popup"><p>Properties and the junction near the raised table experienced flooding during 2016 and 2017. Highway gullies around the junction may have surcharged, runoff was observed to be poorly draining, and debris suggests blockages remain in the surface water sewer. There is potential interaction with the culverted Pyl Brook if that culvert is at capacity. [MUL] (p64)</p></div><div class="nugget-popup"><p>Short&ndash;duration intense rainfall on 23 June 2016 produced localised surface water flooding of the lane and adjacent areas, affecting drainage and access. [TAB] (p88)</p></div></div></body></div>`)[0];

                var html_9f96fc1d70bc9277127ee1a18ec49dd6 = $(`<div id="html_9f96fc1d70bc9277127ee1a18ec49dd6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Adela Avenue, London Borough of Merton</h1><div class="nugget-popup"><p>Surface water runoff flowed north&ndash;eastwards along Adela Avenue and ponded either side of the carriageway before overtopping the raised table on West Barnes Lane, contributing to overland flow toward properties at the eastern side of West Barnes Lane. [PAG,MUL] (p59)</p></div><div class="nugget-popup"><p>Surface water collected by a 225 mm surface water sewer on Adela Avenue drained to a manhole and discharged into the culverted Pyl Brook immediately north&ndash;west of affected properties; this runoff contributed to the surface water/sewer flooding of properties adjacent to West Barnes Lane during the 2016 and 2017 incidents. [PAG,MUL] (p60)</p></div><div class="nugget-popup"><p>Properties on the south side of the Adela Avenue junction lie within Flood Zone 3 and Flood Zone 2 extends approximately 50 m southwest up Adela Avenue; gullies on Adela Avenue were on the council's high&ndash;priority cleansing programme and had last been cleaned in December 2015/January 2016 prior to the flooding incidents. [PAG,MUL] (p61)</p></div><div class="nugget-popup"><p>Surface&ndash;water flooding/ponding on the highway was attended on 23 June 2016; a gully&ndash;cleansing tanker removed as much surface water as possible but the surface water sewer was not flowing. Subsequent mitigation works included jetting of main sewers and connections, and installation of two additional highway gullies on Adela Avenue; kerb and footway/raised&ndash;table level adjustments and an additional gully were installed nearby in 2018 to reduce runoff toward properties. [TAB,PAG] (p62)</p></div><div class="nugget-popup"><p>Surface water runoff could not enter the highway gullies and the local 225 mm surface water sewer had insufficient capacity, causing runoff to back up and surcharge out of gullies at the raised table. Remedial works were carried out: footway and raised table levels adjusted and an additional highway gully installed outside property 168 in 2018; two additional gullies were installed on Adela Avenue and the main sewers and connections were jetted when this work occurred. [TAB,PAG,MUL] (p63)</p></div><div class="nugget-popup"><p>Flooding incidents in 2016 and 2017 are believed to have been caused by the Adela Avenue 225 mm surface water sewer; gullies at Adela Avenue drain into that sewer and evidence of poor drainage and potential sewer blockage was observed. [PAG,MUL] (p64)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one highway gully outside property 168; two additional gullies on Adela Avenue [TAB,PAG,MUL] (p63)</p></div></div></body></div>`)[0];

d re&ndash;benching to allow easier discharge into a larger sewer. [TAB,PAG,MUL] (p69)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than two properties [PAG] (p65)</p></div></div></body></div>`)[0];

                var html_96b43fa92a200d728711e59219279a29 = $(`<div id="html_96b43fa92a200d728711e59219279a29" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Abbott Avenue, Raynes Park</h1><div class="nugget-popup"><p>Abbott Avenue (including Dundonald Church) experienced sewer&ndash;related flooding on 23 Jun 2016 and 29&ndash;30 Jul 2017; recorded sewer return periods were 1&ndash;in&ndash;24 yr (Jun 2016) and 1&ndash;in&ndash;3 yr (Jul 2017). [TAB,MUL] (p21)</p></div><div class="nugget-popup"><p>Foul sewer surcharged at the lowest point of the catchment causing internal flooding of properties at the western end adjacent to the pumping station; during the July 2017 incident the pump failed, prolonging flooding and resulting in internal property damage. [MUL] (p42)</p></div><div class="nugget-popup"><p>A manhole surcharged causing internal flooding to properties at the western end of Abbott Avenue adjacent to the pumping station; Dundonald Church experienced internal flooding. Post&ndash;event imagery (approx. one week after June 2016) shows residual foul water, mud and debris on the carriageway. [IMG,PAG,MUL] (p43)</p></div><div class="nugget-popup"><p>Local surface water and foul sewer network routed significant flows along Abbott Avenue during the recorded incidents. A 225 mm surface water sewer and a storage tank (500 mm x 1250 mm) convey flow north&ndash;east along Abbott Avenue before being diverted south into Kingston Road via an existing footpath. Two foul sewers (each 450 mm) join at Abbott Avenue and connect into a rectangular sewer (660 mm x 1015 mm); there is an approximately 30 m section adjacent to the Dundonald Church with dimensions 991 mm x 661 mm. Following a flooding incident in 2016, gullies on Abbott Avenue were added to the higher&ndash;priority cleansing programme and cleaned at least once per year for 2016/17 and 2017/18; gullies had last been cleaned in February 2017 prior to the 2017 incident. [PAG,MUL] (p44)</p></div><div class="nugget-popup"><p>Abbott Avenue experienced flooding incidents as part of local surface&ndash;water / urban flooding. The area slopes toward Abbott Avenue and parts of the south side are shown at high/medium surface&ndash;water flood risk. LLFA discussions confirmed flooding incidents in the area in three consecutive years (2016&ndash;2018), the most significant in 2016. Gullies on Abbott Avenue were not on the high&ndash;priority cleansing programme prior to the 2016 incident (cleaned at least once every two years under the standard contract) and were added to annual cleansing programmes for 2016/17 and 2017/18; gullies were last cleaned in February 2017 prior to the 2017 incident. [PAG,MUL] (p45)</p></div><div class="nugget-popup"><p>Subject to surface water/sewer flooding incidents: contractor clean&ndash;up works and confirmation the pumping station was operational (attended 28 Jun 2016); added to high&ndash;priority gully cleansing programme; gullies cleaned (Jan/Feb 2017); post&ndash;July 2017 network investigations including CCTV survey, manhole inspections ('lift and look') and sewer cleaning; pump station arrangement reviewed and network modelling undertaken. [TAB,MUL] (p46)</p></div><div class="nugget-popup"><p>Foul sewer network backed up and surcharged at the lowest point of the catchment at Abbott Avenue, with surcharging discharging out of a foul manhole where flows from under the railway converge with those from the pumping station. Debris (including ladders and bricks) was found in the foul sewer between the pumping station and Abbott Avenue causing blockages. The local sewage pumping station experienced an electrical failure and was out of service for 12 hours during the July 2017 incident. [TAB] (p47)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration rainfall on 23 June 2016 caused localised surface water flooding on Abbott Avenue, affecting the roadway and immediate surroundings. [TAB] (p88)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 incidents reached Section 19 threshold (2016 and 2017); pump failure for 12 hours; flooding lasted about six hours (July 2017) [MUL] (p42)</p></div></div></body></div>`)[0];

                var html_6125463d0748e56d0ffc96f0e6a61836 = $(`<div id="html_6125463d0748e56d0ffc96f0e6a61836" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>High Street Colliers Wood, London Borough of Merton</h1><div class="nugget-popup"><p>Increased surface water runoff and combined sewer surcharge in this street contributed to the combined sewer flooding incident that affected Baltic Close on 23 Jun 2016. Historic flooding incidents along High Street Colliers Wood occurred in 2000 and 2007; the 2007 event led to closure of Colliers Wood London Underground station and internal damage to a nearby library. [MUL] (p76)</p></div><div class="nugget-popup"><p>Existing highway flow path and carriageway levels on High Street Colliers Wood diverted surface water runoff toward a private property (junction with Baltic Close), contributing to the basement flooding incident. [PAG] (p77)</p></div></div></body></div>`)[0];

                var html_c8656f9835ec058c7034c9691e5d9744 = $(`<div id="html_c8656f9835ec058c7034c9691e5d9744" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Borough of Merton</h1><div class="nugget-popup"><p>Multiple locations across the borough experienced flooding during three intense rainfall events; the LLFA investigated threshold&ndash;reaching sites and analysed additional flooded locations across the borough. [IMG,PAG,MUL] (p3)</p></div><div class="nugget-popup"><p>Multiple locations within the borough were heavily affected by intense rainfall leading to localised surface&ndash;water / urban flooding, causing disruption to local roads, rail and properties. These incidents triggered a Section 19 investigation. [PAG,MUL] (p16)</p></div><div class="nugget-popup"><p>Three locations within the borough were heavily affected by intense thunderstorms and associated surface water/flash flooding, reaching the Section 19 investigation threshold. [IMG,PAG] (p17)</p></div><div class="nugget-popup"><p>Intense, short&ndash;duration rainfall produced peak hourly depths across local gauges and led to surface&ndash;water / urban flooding across parts of the borough, causing localized flooding of streets and properties. [PAG,MUL] (p18)</p></div><div class="nugget-popup"><p>During the three rainfall events nine locations within the borough reached the council's flood investigation threshold; multiple localities experienced localised inundation and investigations/actions were recorded by responsible managing authorities. [PAG,MUL] (p19)</p></div><div class="nugget-popup"><p>Across the borough there were multiple flood incidents during the three rainfall events: nine locations reached Merton's Section 19 investigation threshold on at least one occasion; additional locations also flooded. The events triggered investigations, chaptered analysis of flood mechanisms and collaborative recommendations between risk management authorities. [IMG,PAG,MUL] (p20)</p></div><div class="nugget-popup"><p>Multiple locations across the borough experienced flooding during the reported events; sewer gauge data was used to estimate storm return periods for fourteen flooded locations. [TAB,PAG,MUL] (p21)</p></div><div class="nugget-popup"><p>The area around the junction of Whatley Avenue and Martin Way within the borough experienced surface water flooding, with ponding at a local low point and properties near the junction affected; highway gullies on the roads were on a high priority cleansing programme and had been last cleaned in January&ndash;February 2016 prior to the incident. [IMG,PAG,MUL] (p24)</p></div><div class="nugget-popup"><p>Flooding occurred at the junction of Martin Way and Whatley Avenue caused by a 750 mm surface water sewer running full and the local foul sewer network running full; additional flow backed up into gullies and low&ndash;level properties. Runoff from Cannon Hill Common and Joseph Hood Recreation Ground slopes down to Whatley Avenue, exacerbating the local drainage surcharge. [PAG] (p27)</p></div><div class="nugget-popup"><p>The council is responsible for implementing recommended actions (detention basin, SuDS, new gullies, increased street cleansing and planting features) to reduce runoff and local sewer overload that caused flooding of properties and roads. [PAG,MUL] (p28)</p></div><div class="nugget-popup"><p>The borough experienced significant surface water and sewer&ndash;related flooding in the Apostles area (Raynes Park ward) during the June 2016 event: local drainage and trunk sewers were overwhelmed, contributing to prolonged inundation and internal property flooding within the affected neighbourhood. [PAG] (p29)</p></div><div class="nugget-popup"><p>Multiple locations within the borough reached the council's Section 19 threshold for flooding, indicating localised surface&ndash;water/sewer&ndash;related flooding across the area. [IMG,PAG] (p30)</p></div><div class="nugget-popup"><p>Area of Merton (Bushey Mead/Dupont Road area) experienced surface water/highway flooding associated with the June 2016 event; the council undertook gully cleansing as part of its response. [IMG,PAG] (p31)</p></div><div class="nugget-popup"><p>Surface water flooding occurred in the borough (notably Dupont Road) due to a blockage in the surface water sewer; response actions included gully cleansing and jetting to clear the blockage and resolve the flooding. Thames Water attended multiple times to check the sewer. [TAB,PAG] (p32)</p></div><div class="nugget-popup"><p>The borough contained a flooding hotspot at Coombe Lane by Raynes Park railway bridge that reached the investigation (Section 19) threshold in all three events. Local topography, a large contributing sewer catchment draining down to Coombe Lane and low levels beneath the railway bridge contributed to repeated inundation. The council carried out/led CCTV investigations, collaborative drainage modelling with TWUL, and identification of SuDS and storm&ndash;relief/bypass options to reduce inflows to the main surface water sewer and provide overflow safety. [PAG,MUL] (p34)</p></div><div class="nugget-popup"><p>Multiple flood incidents across the borough reached the Section 19 threshold: internal flooding of commercial properties and transport disruption (including closure of the Raynes Park railway bridge underpass). [PAG,MUL] (p36)</p></div><div class="nugget-popup"><p>The borough experienced localised surface&ndash;water and sewer&ndash;related flooding during the incidents. Highway gullies in Coombe Lane and the south part of Pepys Road were a focus for cleansing before and after the incidents; four gullies directly beneath Raynes Park railway bridge were initially inaccessible and were not cleaned prior to the 2016/2017 incidents but were cleaned in April 2017. Flooding incidents caused risk to transport and flooding of commercial properties within the borough. [PAG,MUL] (p37)</p></div><div class="nugget-popup"><p>Surface water flooding in the Cottenham Park critical drainage area prompted gully cleansing, council liaison with TWUL and subsequent sewer cleaning and CCTV inspections by Thames Water after the July 2017 event. [TAB,PAG] (p40)</p></div><div class="nugget-popup"><p>The local sewer network in the borough received rainfall that probably exceeded its design capacity. The foul sewer surcharged at the lowest point of the catchment at Abbott Avenue (Dundonald ward) during the 2016 and 2017 events; during the 2017 incident an existing pump at Abbott Avenue failed for 12 hours, leading to local flooding. The borough is recommended to investigate pumps and sewer capacities in the affected catchment. [TAB,PAG,MUL] (p41)</p></div><div class="nugget-popup"><p>Multiple locations across the borough experienced sewer surcharge and surface water runoff that exceeded the sewer network capacity during the reported events, leading to internal flooding of properties and several locations reaching Merton's Section 19 threshold. [PAG,MUL] (p42)</p></div><div class="nugget-popup"><p>Flooding at multiple locations in the borough reached the council's Section 19 reporting threshold; Abbott Avenue was one of the affected locations where sewer surcharge caused internal property flooding. [PAG,MUL] (p43)</p></div><div class="nugget-popup"><p>The local authority (Merton) changed the gully cleansing priority for Abbott Avenue after the 2016 flooding incident: gullies that had previously been on a standard (at least once every two years) cleansing regime were moved to an at&ndash;least&ndash;annual cleansing programme for 2016/17 and 2017/18. [IMG,PAG,MUL] (p44)</p></div><div class="nugget-popup"><p>The Merton area (drainage catchment DC27) experienced surface&ndash;water flooding incidents in consecutive years (2016&ndash;2018), with the most significant incident in 2016. Flood&ndash;risk mapping (Figure 7.3) identifies parts of the local area, including Abbott Avenue and parts of Lower Downs Road, as high/medium risk of surface&ndash;water flooding. [IMG,PAG,MUL] (p45)</p></div><div class="nugget-popup"><p>Experienced surface water and sewer flooding affecting streets including Abbott Avenue and Lower Downs Road, prompting gully cleansing, pump station checks and sewer investigations and cleaning. [TAB,PAG,MUL] (p46)</p></div><div class="nugget-popup"><p>Parts of the borough (the Hillside/Wimbledon town centre area including Worple Road and Wimbledon Hill Road and adjacent streets) were affected by flooding during multiple events, reaching Merton's Section 19 investigation threshold. [PAG,MUL] (p48)</p></div><div class="nugget-popup"><p>Parts of the borough (central Wimbledon area) experienced surface water and associated sewer flooding; mapping shows predominant local risk from surface water runoff and predicted increased extents on key streets. [IMG,PAG,MUL] (p52)</p></div><div class="nugget-popup"><p>Town&ndash;centre surface water flooding occurred during prolonged rainfall (Aug 2017), with rapid overland flow down steep adjacent roads causing ponding on Worple Road and St. George's Road, runoff from a multi&ndash;storey car park reaching pavements and entering shops, and surface water sewers becoming overwhelmed/surcharging. [PAG,MUL] (p54)</p></div><div class="nugget-popup"><p>The local area experienced a surface&ndash;water flooding incident driven by topography that routes runoff to the Effra Road/Haydon's Road low point; parts of Merton (Effra Road, Haydon's Road and nearby properties) were affected or identified in connection with the incident. [IMG,PAG] (p56)</p></div><div class="nugget-popup"><p>Flooding at West Barnes Lane and adjoining streets reached the threshold for a Section 19 investigation for the June 2016 and July 2017 incidents; flooding was focused around the north&ndash;eastern end of Adela Avenue and across the highway junction with West Barnes Lane. [TAB,PAG,MUL] (p58)</p></div><div class="nugget-popup"><p>The London Borough of Merton carried out a high&ndash;priority highway gully cleansing programme for Adela Avenue and West Barnes Lane (gullies cleaned Dec 2015/Jan 2016); despite this, surface water/sewer flooding occurred in the locality during the 2016 and 2017 incidents and is the subject of the Section 19 investigation. [IMG,PAG,MUL] (p60)</p></div><div class="nugget-popup"><p>The borough's historic incident records include surface&ndash;water and fluvial&ndash;interaction flooding at local streets (for example Seaforth Avenue and West Barnes Lane on 20 July 2007) and records a response to surface&ndash;water flooding on 23 June 2016. [TAB,PAG,MUL] (p62)</p></div><div class="nugget-popup"><p>The local authority carried out cleansing of highway gullies at the affected junction (Adela Avenue and West Barnes Lane) between December 2016 and March 2017 and again in February&ndash;March 2018 as part of the response to local surface water flooding. [TAB,PAG,MUL] (p63)</p></div><div class="nugget-popup"><p>Areas within the borough reached the Section 19 threshold (e.g. Mount Road / Acuba Road / Brooklands Avenue in June 2016). The council carried out kerb and highway drainage improvement works (including adding gullies and carriageway resurfacing) which have reduced local flood risk. [PAG,MUL] (p64)</p></div><div class="nugget-popup"><p>Flooding in the Wimbledon Park ward (covering Mount Road, Acuba Road and Brooklands Avenue) reached the council's Section 19 threshold. The event started at approximately 09:00 BST and lasted about 12 hours; internal flooding affected properties (including residential basements) and foul sewage was reported on the road at the junction of Acuba Road and Ravensbury Road. [PAG] (p65)</p></div><div class="nugget-popup"><p>The council's highway gullies in the area were implicated in a local flooding incident; gullies were part of the high&ndash;priority cleansing programme and, after the flooding incident, gullies at the junction of Mount Road and Acuba Road were added to the high priority cleansing programme for 2016/17 and 2017/18. [IMG,PAG] (p66)</p></div><div class="nugget-popup"><p>The borough experienced multiple incidents of sewer and surface&ndash;water flooding (including foul sewer surcharging at Acuba/Ravensbury junction and basement flooding on Brooklands Avenue). Merton carried out assessment and made recommendations including engaging with TWUL on sewer re&ndash;benching and advising property&ndash;level resilience for affected basements. [PAG,MUL] (p69)</p></div><div class="nugget-popup"><p>The Merantun Way / Morden Road location in the borough reached the Council's Section 19 threshold on three occasions (one event on 23 Jun 2016 and two events in 2017), producing highway inundation and closures at a critical TfL&ndash;managed junction. [PAG,MUL] (p70)</p></div><div class="nugget-popup"><p>Reported the flooding to TfL and Thames Water during the incidents; significant flooding in the area led to a closure of Morden Road (from South Wimbledon station). [TAB,PAG,MUL] (p73)</p></div><div class="nugget-popup"><p>The borough experienced surface water flooding across multiple locations: Morden Road was closed due to significant flooding; Dorset Road (between Kingston Road and Erridge Road in Merton Park ward) experienced surface water ponding across the carriageway during the events, with greatest depths adjacent to dropped kerb crossovers. The council raised concerns about sewer functionality and asset maintenance contributing to flooding. [PAG,MUL] (p74)</p></div><div class="nugget-popup"><p>On 23 June 2016 combined sewer flooding following increased surface water runoff from High Street, Colliers Wood led to significant flooding of the basement of a commercial property within the borough. [PAG] (p75)</p></div><div class="nugget-popup"><p>The borough experienced a combined sewer surcharge / surface water flooding incident on 23 Jun 2016 that produced basement flooding of a commercial property in Baltic Close (max depth ~600 mm). The borough also records historic flooding incidents in 2000 and 2007 (the 2007 event disrupted Colliers Wood London Underground station). [PAG,MUL] (p76)</p></div><div class="nugget-popup"><p>Parts of the borough experienced combined sewer backflow and surface water runoff incidents that caused property basement flooding (for example the Baltic Close property) and prompted sewer inspections. [PAG] (p77)</p></div><div class="nugget-popup"><p>Numerous flooding incidents occurred across the borough during the reported events &mdash; affecting communities and infrastructure across multiple locations. Nine locations experienced incidents that met Merton's Section 19 investigation threshold and a further five locations flooded without reaching that threshold; incidents prompted actions by Risk Management Authorities before, during and after the events and led to recommendations for drainage improvements and communication. [PAG,MUL] (p81)</p></div><div class="nugget-popup"><p>Merton (the borough) experienced numerous surface water and sewer&ndash;related flooding incidents in the three events. Sewers reached hydraulic capacity and were overwhelmed by the extreme rainfall; misconnections and blockages aggravated flooding in local drainage networks and resulted in multiple locations meeting the Section 19 threshold. [PAG,MUL] (p82)</p></div><div class="nugget-popup"><p>The borough's sewer/drainage network was unable to handle the extreme rainfall and was overwhelmed, resulting in sewer and surface&ndash;water flooding across the borough. [PAG] (p83)</p></div><div class="nugget-popup"><p>Local sewer/drainage capacity was exceeded during the June 2016 extreme rainfall, with the sewer network unable to handle the flows and thus being overwhelmed; this prompted recommendations to re&ndash;evaluate the drainage network on a catchment basis. (p84)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>nine locations reached Section 19 threshold on 23 June 2016; five locations reached Section 19 threshold on 29&ndash;30 July 2017; three locations reached Section 19 threshold on 9 August 2017; five additional locations flooded but did not reach Section 19 thresholds [IMG,PAG,MUL] (p3)</p></div><div class="nugget-popup quant"><p>9 locations reached Section 19 threshold (23 Jun 2016); 5 locations (29 Jul 2017 &ndash; 30 Jul 2017); 3 locations (09 Aug 2017) [PAG,MUL] (p16)</p></div><div class="nugget-popup quant"><p>3 locations [IMG,PAG] (p17)</p></div><div class="nugget-popup quant"><p>9 locations [PAG,MUL] (p19)</p></div><div class="nugget-popup quant"><p>9 locations; 5 locations; 4 TWUL sewer gauges [IMG,PAG,MUL] (p20)</p></div><div class="nugget-popup quant"><p>14 flooding locations [TAB,PAG,MUL] (p21)</p></div><div class="nugget-popup quant"><p>approximately ten properties; 36 hours; 300&ndash;450 mm [PAG] (p29)</p></div><div class="nugget-popup quant"><p>nine locations reached Section 19 threshold (including Dupont Road) [IMG,PAG] (p30)</p></div><div class="nugget-popup quant"><p>approximately four commercial properties; flood depth 600&ndash;1000 mm (at Raynes Park); June event duration approximately 12 hours [PAG,MUL] (p36)</p></div><div class="nugget-popup quant"><p>9 locations reached Section 19 threshold across the borough; 3 distinct reported incidents [PAG,MUL] (p42)</p></div><div class="nugget-popup quant"><p>9 locations reached Section 19 threshold [PAG,MUL] (p43)</p></div><div class="nugget-popup quant"><p>more than two properties [PAG] (p65)</p></div><div class="nugget-popup quant"><p>1 commercial property (basement) flooded; maximum flood depth approximately 600 mm [PAG] (p75)</p></div><div class="nugget-popup quant"><p>one commercial property; maximum depth approximately 600 mm; closure of a tube station for nine hours [PAG,MUL] (p76)</p></div><div class="nugget-popup quant"><p>14 locations; 9 locations; 5 locations [PAG,MUL] (p81)</p></div><div class="nugget-popup quant"><p>fourteen locations; nine locations reached Merton's Section 19 threshold; five additional locations flooded but did not reach the threshold [PAG,MUL] (p82)</p></div><div class="nugget-popup quant"><p>designed for up to 1 in 30 year rainfall events; June 2016 was reported as a 1 in 60 year event (p84)</p></div></div></body></div>`)[0];
                popup_5ba616ea46536df78fb9e4af2927a0c4.setContent(html_c8656f9835ec058c7034c9691e5d9744);

                var html_779e68e0015482051953248d19947d9f = $(`<div id="html_779e68e0015482051953248d19947d9f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Raynes Park</h1><div class="nugget-popup"><p>The area around Raynes Park railway bridge was implicated in flooding linked to pump condition/operation beneath the bridge, affecting local drainage behaviour and requiring investigation to inform surface water and sewer flood modelling. (p4)</p></div><div class="nugget-popup"><p>The Raynes Park ward experienced sewer&ndash;related flooding associated with the Coombe Lane location on 23 Jun 2016, 29&ndash;30 Jul 2017 and 09 Aug 2017 (see Coombe Lane entries and recorded sewer return periods). [TAB,MUL] (p21)</p></div><div class="nugget-popup"><p>The Apostles area within Raynes Park (twelve roads between Kingston Road, Grand Drive and Bushey Road) experienced significant flooding in the June 2016 event, resulting in internal flooding of properties and prolonged street inundation. (p29)</p></div><div class="nugget-popup"><p>The location within Raynes Park ward reached Merton's Section 19 threshold in the reported events; impacts in the area included internal flooding of commercial properties and transport disruption (including closure of the railway&ndash;bridge underpass). [PAG,MUL] (p35)</p></div><div class="nugget-popup"><p>The underpass beneath the Raynes Park railway bridge was inundated, causing Metropolitan Police to close the highway and making the road impassable; local transport was disrupted and commercial properties were flooded as part of the same incident. [IMG,PAG] (p36)</p></div><div class="nugget-popup"><p>The sewer network converges near Raynes Park railway bridge (major diameters discharging there) and gullies beneath the railway bridge were implicated in previous flooding incidents; the local sewer configuration and blocked/uncleared gullies contributed to surface&ndash;water surcharge and transport risk in the Raynes Park area during the recorded incidents. (p37)</p></div><div class="nugget-popup"><p>Four highway gullies directly underneath the Raynes Park railway bridge were not cleaned prior to the 2016 flooding incidents due to lack of access; these four gullies were subsequently cleaned in April 2017. The railway bridge also forms the catchment boundary and the area immediately south was identified as high risk of surface water flooding in the report. [PAG] (p38)</p></div><div class="nugget-popup"><p>The road slopes down beneath the Raynes Park railway bridge created a man&ndash;made low spot where significant flooding occurred; the railway bridge underpass became impassable and was closed to pedestrians and vehicles. Pumps beneath the railway bridge were identified for further investigation. [PAG,MUL] (p41)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately ten properties; 36 hours; 300&ndash;450 mm (p29)</p></div><div class="nugget-popup quant"><p>4 commercial properties; 1 underpass closure [PAG,MUL] (p35)</p></div><div class="nugget-popup quant"><p>approximately four commercial properties; flood depth 600&ndash;1000 mm; June event duration approximately 12 hours [IMG,PAG] (p36)</p></div><div class="nugget-popup quant"><p>3 incidents [PAG,MUL] (p41)</p></div></div></body></div>`)[0];

                var html_a662ba8ba4104cc4926e23283473e359 = $(`<div id="html_a662ba8ba4104cc4926e23283473e359" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>West Barnes</h1><div class="nugget-popup"><p>Flooding occurred at the Burlington Road / Shannon Corner junction and along West Barnes Lane; sewer gauges record sewer surcharge events at these locations. [TAB,PAG,MUL] (p21)</p></div><div class="nugget-popup"><p>Properties within West Barnes (notably those backing onto the culverted Pyl Brook along West Barnes Lane) experienced inundation during the 2016 and 2017 incidents; the area is also mapped as Flood Zone 3, covering most of West Barnes Lane and some properties around the Adela Avenue junction. [IMG,PAG,MUL] (p60)</p></div><div class="nugget-popup"><p>Area experienced surface&ndash;water flooding during the events in 2016 and 2017; runoff collected toward low&ndash;lying parts of the neighbourhood (notably along West Barnes Lane) contributing to inundation of the local study area. [IMG,PAG,MUL] (p61)</p></div><div class="nugget-popup"><p>The Burlington Road / Shannon Corner junction (under the A3 flyover) in West Barnes was affected during all three reported rainfall events. Flooding at this location is recurrent and during the events was attributable to heavily silted surface water sewers and a limited sewer gradient that produced surcharges and backflows. Network investigations confirmed siltation issues beneath the central island of the roundabout; no properties were recorded by the council as affected. [MUL] (p79)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>0 properties recorded as affected [MUL] (p79)</p></div></div></body></div>`)[0];
