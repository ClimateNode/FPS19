                var html_29b88a4516d3f7d0dd375e38959afa0c = $(`<div id="html_29b88a4516d3f7d0dd375e38959afa0c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hunnyhill Aquatics</h1><div class="nugget-popup"><p>Included in the report as part of an area of interest (with Vicarage Road and Towngate Pond) following the 25 October 2023 floods, indicating localised flooding affected the vicinity. The report notes Source&ndash;Pathway&ndash;Receptor mapping was not produced for many of these localised incidents due to limited internal flooding reports. (p37)</p></div><div class="nugget-popup"><p>Shop interior was inundated by floodwater; flooding was associated with river/tidal influences and upstream stream backup. [PAG] (p55)</p></div><div class="nugget-popup"><p>Internal flooding on 25 October with recorded flood depth of approximately 1200mm inside the shop; shop lost around 99% of its stock and suffered loss of revenue. The site is in Flood Zone 3, located ~100m west of the Gunville Stream/Lukely Brook confluence, and likely experienced tidal locking that increased upstream river levels and caused water to exceed channel capacity. [IMG] (p56)</p></div><div class="nugget-popup"><p>Debris screens near Hunnyhill Aquatics became blocked during the 25 October 2023 flood; the screens were consequently removed and the blockages impeded river flow, increasing local flood risk. (p83)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 1200 mm flood depth inside the shop; 99% of stock lost [PAG] (p55)</p></div><div class="nugget-popup quant"><p>1200mm internal flood depth; 99% of stock lost [IMG] (p56)</p></div></div></body></div>`)[0];

                var html_fadbcf220821ad4b14195d4319e1a552 = $(`<div id="html_fadbcf220821ad4b14195d4319e1a552" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Mill Court</h1><div class="nugget-popup"><p>Identified as an additional area of interest (paired with Furlongs) after the 25 October 2023 floods; experienced localised flooding, but the report states there were fewer reports of internal flooding and no detailed Source&ndash;Pathway&ndash;Receptor model was produced for this location. (p37)</p></div><div class="nugget-popup"><p>During the 25 October 2023 event, intense rainfall combined with a high tide produced elevated river levels and likely tidal locking near the estuary; impeded river drainage and increased channel pressure are stated to have significantly influenced flooding impacts at the Mill Court building. (p53)</p></div><div class="nugget-popup"><p>Elevated river levels together with a high tide produced tidal locking and impeded river drainage near the site, placing additional pressure on the channel capacity close to the Mill Court building and significantly influencing the impacts of flooding at the building. [IMG,PAG] (p54)</p></div></div></body></div>`)[0];

                var html_1dc5c65375019a18a33d97878bacf6f6 = $(`<div id="html_1dc5c65375019a18a33d97878bacf6f6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lukely Brook</h1><div class="nugget-popup"><p>Triggered flood warnings (Lukely Brook at 04:43 on 25 October 2023) and contributed to flooding in the area due to rapid catchment response; fluvial flow estimated between a 1 in 20 and 1 in 50 year event on 25 October 2023. (p34)</p></div><div class="nugget-popup"><p>A Flood Warning was issued for Lukely Brook (and River Medina) during the event to warn of flooding risk. [TAB] (p35)</p></div><div class="nugget-popup"><p>Intense rainfall caused increased volume and velocity in the Lukely Brook leading to channel exceedance; the brook flowed over fords, out of bank into rear gardens backing onto the brook and contributed to internal flooding of nearby properties. (p48)</p></div><div class="nugget-popup"><p>Debris at the confluence (defined by two arch culverts) is understood to have possibly caused a blockage during the storm, contributing to elevated water levels and flooding at the confluence area. (p55)</p></div><div class="nugget-popup"><p>The Lukely Brook overtopped/flooded into the rear gardens of properties on Caesar's Road, delivering up to 400 mm of water into gardens; levels then subsided as the tide receded into the Medina River. (p58)</p></div><div class="nugget-popup"><p>High water in the brook overtopped/encroached into adjoining rear gardens; visual evidence of swollen, turbid water close to bank. [IMG] (p59)</p></div><div class="nugget-popup"><p>The brook is associated with fluvial flood risk; current SFRA flood zone mapping is misaligned with the river course which can lead to areas being omitted from flood alerts and warnings and reduced awareness of flood risk. Recommendation to investigate and update mapping and correctly map ordinary watercourses to clarify riparian ownership and help prevent channel blockages. (p79)</p></div><div class="nugget-popup"><p>Flows in Lukely Brook contributed to downstream flooding that affected the urban extent of Newport and nearby properties; downstream culvert condition and capacity were identified as factors influencing drainage and flood impacts. (p82)</p></div><div class="nugget-popup"><p>Breach of the river channel during the 25 October 2023 storm, contributing to fluvial flooding and localised property inundation in Newport. (p86)</p></div><div class="nugget-popup"><p>Out&ndash;of&ndash;bank flows / capacity issues on Lukely Brook contributed to flooding in Newport during the 25 October 2023 event; a feasibility study to increase channel/catchment capacity was recommended in response. [TAB] (p88)</p></div><div class="nugget-popup"><p>Channel capacity of Lukely Brook was identified as insufficient in the context of the flood investigation following the 25 October 2023 event; a recommendation was made to study increasing its capacity (alongside Gunville Stream) to reduce future flooding. (p90)</p></div></div></body></div>`)[0];

                var html_a31646f662f498cd076948aeb1a16a1c = $(`<div id="html_a31646f662f498cd076948aeb1a16a1c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Medina</h1><div class="nugget-popup"><p>Identified as a main river within the Newport study area and lies inside Environment Agency flood warning areas that cover Newport. Associated with monitoring/forecasting for river flooding and therefore part of the river network contributing to local flood risk (linked spatially to the October 2023 community flood response in Newport; causal link to that event is plausible but not explicitly stated). [PAG,IMG] (p28)</p></div><div class="nugget-popup"><p>Flood warning issued for River Medina on 25 October 2023 (07:28), indicating it was affected by the fluvial response to the storm; fluvial flows on 25 October were estimated between a 1 in 20 and 1 in 50 year event. (p34)</p></div><div class="nugget-popup"><p>Environment Agency issued a flood warning for the River Medina as part of the Lukely Brook / River Medina flood warning on 25 October 2023. [TAB] (p35)</p></div><div class="nugget-popup"><p>Elevated river levels on 25 October 2023, driven by intense rainfall coupled with a high tide, contributed to impeded drainage and likely tidal locking near the estuary head, which influenced flood impacts at nearby sites such as Mill Court. (p53)</p></div></div></body></div>`)[0];

                var html_e4d00a403c6c78b4d4ab3ce6e0e5aff2 = $(`<div id="html_e4d00a403c6c78b4d4ab3ce6e0e5aff2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Arthur Moody Drive, Gunville</h1><div class="nugget-popup"><p>The culvert under Arthur Moody Close (sic) was identified for investigation of condition and capacity as part of the analysis of the 25 October 2023 event, implicating it as a potential contributor to the flooding across Newport (combined fluvial, surface water and sewer sources). [TAB] (p5)</p></div><div class="nugget-popup"><p>Water pooled between Arthur Moody Drive and Park Close during the event, indicating localised surface water inundation at this location. (p39)</p></div><div class="nugget-popup"><p>Surface water runoff from the western fields flowed along primary pathways originating near Arthur Moody Drive (numbered source points on mapping). Water pooled between Arthur Moody Drive and Park Close and contributed to inundation of Broadwood Lane. A culvert (300mm) passing under Arthur Moody Drive was noted as conveying flow from neighbouring fields. [PAG,IMG] (p41)</p></div><div class="nugget-popup"><p>The culvert under Arthur Moody Close (sic) was identified for condition and capacity investigation because it likely restricted flow during the 25th October 2023 event and contributed to local flooding; remediation/upgrade is recommended. [TAB] (p87)</p></div><div class="nugget-popup"><p>The culvert under Arthur Moody Close (sic) was identified for investigation for condition and capacity following the Newport Section 19 flood investigation, indicating the culvert was implicated in flooding and may have contributed to local surface water/urban flooding. [TAB] (p88)</p></div></div></body></div>`)[0];

                var html_f71d81ac2140b80f101f50013a5eb34c = $(`<div id="html_f71d81ac2140b80f101f50013a5eb34c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ash Lane, Gunville</h1><div class="nugget-popup"><p>The watercourse at Ash Lane was identified for investigation of condition and capacity as part of the analysis of the 25 October 2023 event, implicating it as a potential contributor to the flooding across Newport (combined fluvial, surface water and sewer sources). [TAB] (p5)</p></div><div class="nugget-popup"><p>At least five properties on Ash Lane experienced internal flooding during the 25 October event. (p39)</p></div><div class="nugget-popup"><p>Properties backing onto the Gunville Stream flooded from the stream (river flood) and were left uninhabitable due to flood water damage; site investigation found large electrical appliances with clear flood damage remaining in the properties. (p40)</p></div><div class="nugget-popup"><p>At least five properties on Ash Lane experienced internal flooding during the 25 October event attributed to the Gunville Stream and surface water runoff. Properties backing onto the Gunville Stream were later found (site visit 27 February 2024) to remain uninhabited due to flood water damage; large electrical appliances remained in&ndash;situ with clear flood damage. [PAG,IMG] (p41)</p></div><div class="nugget-popup"><p>Masonry arch culvert adjacent to Ash Lane shows structural deterioration consistent with flood&ndash;related damage: concrete spalling and local erosion on both headwalls, loss of mortar and a missing stone unit in the arch, mineral seepage and a drainage pipe on the downstream left side continuously discharging into the watercourse during the survey. Daylight was visible through the culvert barrel and the barrel could not be fully inspected from the surface, indicating possible internal voids or damage and potential debris build&ndash;up. A full CCTV inspection was recommended to assess structural damage and blockages. (p62)</p></div><div class="nugget-popup"><p>Unmapped watercourse and adjacent channel behind Ash Lane properties were photographed and recorded as obstructed, silted and carrying debris; these conveyance problems are shown in images taken at the time of the incident and are implicated in localised flooding of back gardens and adjacent land. [IMG] (p65)</p></div><div class="nugget-popup"><p>Properties on Ash Lane are identified as being at risk from fluvial flooding; a photograph in the report shows an unmapped watercourse on Ash Lane that may contribute to flooding and evacuation risk. [PAG] (p83)</p></div><div class="nugget-popup"><p>An unmapped watercourse runs through residential gardens on Ash Lane; properties on the street were identified as needing early warning and potential evacuation, indicating they were affected by fluvial flooding during the event. [IMG,PAG] (p84)</p></div><div class="nugget-popup"><p>The watercourse at Ash Lane was identified for condition and capacity investigation following the 25th October 2023 event as it may have contributed to local flooding; investigation and any necessary works are recommended. [TAB] (p87)</p></div><div class="nugget-popup"><p>The watercourse at Ash Lane was identified for investigation of condition and capacity in the Section 19 investigation, indicating the watercourse was implicated in flooding affecting the locality. [TAB] (p88)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least five properties (p39)</p></div><div class="nugget-popup quant"><p>internal flood depths of up to 450mm (p40)</p></div><div class="nugget-popup quant"><p>at least five properties [PAG,IMG] (p41)</p></div></div></body></div>`)[0];

                var html_a6a263298faa0e0fb16ef6791cac99cc = $(`<div id="html_a6a263298faa0e0fb16ef6791cac99cc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Forest Hills, Gunville</h1><div class="nugget-popup"><p>Flooding on Forest Hills (photograph caption) and sandbags placed on Forest Hills to protect properties (photograph caption). (p8)</p></div><div class="nugget-popup"><p>Surface water runoff from fields above flowed at high velocity down Forest Hills (an opening was formed at the top of Forest Hills), directing flows eastwards towards Broadwood Lane and Park Close. [PAG] (p39)</p></div><div class="nugget-popup"><p>Residential properties experienced internal flooding routed by high&ndash;velocity surface water flows diverted onto Forest Hills; resulted in property damage, loss of belongings and contamination of gardens with sewage/faecal matter following blocked drains. (p40)</p></div><div class="nugget-popup"><p>Street&ndash;level flooding with standing and fast&ndash;flowing surface water down the road; surface water was reported to flow at high velocity eastwards down Forest Hills towards Broadwood Lane and Park Close. Residential properties on Forest Hills experienced internal flooding, causing property damage, mental health impacts and contamination in gardens (faecal matter and toilet paper reported). Sandbags were deployed along the street as a mitigation response. [IMG] (p43)</p></div><div class="nugget-popup"><p>Surface water was diverted at the top of Forest Hills (an opening was formed) causing high&ndash;velocity flows eastwards down Forest Hills into Broadwood Lane and Park Close. Residential properties on Forest Hills experienced internal flooding; sandbags were deployed. Flooding contributed to property damage, loss of belongings, and negative impacts on residents' wellbeing (fear, anxiety). Blocked drains were reported with sewage&ndash;related material (faecal matter and toilet paper) present in gardens following drain blockages. [IMG,PAG] (p44)</p></div><div class="nugget-popup"><p>Experienced intense surface water flooding on 25 October 2023 caused by heavy runoff from fields to the west; limited capacity in sewer networks and drainage from the fields led to overland flow down Forest Hills. Recommendations include drainage improvements and construction of rain gardens to capture excess stormwater and reduce overland flows. (p81)</p></div><div class="nugget-popup"><p>Forest Hills was identified in the report as an area where surface water flood risk needs addressing (recommendations include Nature Based Solutions/SuDS retrofit and designing surface water drainage to manage off&ndash;site risk), indicating it was affected by surface water flooding during the 25 October 2023 event. (p90)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>internal flood depths of up to 450mm (p40)</p></div><div class="nugget-popup quant"><p>internal flood depths up to 450mm [IMG] (p43)</p></div><div class="nugget-popup quant"><p>internal flood depths of up to 450mm [IMG,PAG] (p44)</p></div></div></body></div>`)[0];

                var html_596d2c8c20ce4f345e12bf1387ac0898 = $(`<div id="html_596d2c8c20ce4f345e12bf1387ac0898" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Newport</h1><div class="nugget-popup"><p>Internal flooding of residential properties in the town caused by a combined impact of river (fluvial), surface water and sewer sources; steep topography and heavy urbanisation exacerbated runoff and flooding. [PAG] (p4)</p></div><div class="nugget-popup"><p>Flooding occurred across Newport driven by a combined impact of fluvial (river), surface water and sewer sources; steep topography and heavy urbanisation contributed to the flooding during the event. (p5)</p></div><div class="nugget-popup"><p>The report includes multiple flood maps and data for Newport (Environment Agency Flood Map for Planning; Risk of Flooding from Surface Water maps; JBA groundwater flood map; Environment Agency historic flood map) and a line graph of tide and river levels, indicating Newport is exposed to surface&ndash;water, groundwater, river and tidal/coastal flooding and is the focus of flood risk assessment and warning/alert areas. [PAG] (p7)</p></div><div class="nugget-popup"><p>Reported internal property flooding across the town (heatmap of reported internal property flooding is referenced). (p8)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties in the town, causing internal inundation of homes. [PAG] (p11)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties within the town. [PAG] (p12)</p></div><div class="nugget-popup"><p>Flood risk is concentrated along the course of the River Medina and its tributaries through central Newport (most of which lies in Flood Zone 3). Reported internal flood incidents (as of Oct 2023) cluster near these flood zones. Tidal influence (tidal locking) can inhibit river discharge at high tide and cause river levels to rise upstream, increasing fluvial flooding risk in Newport. [IMG,PAG] (p18)</p></div><div class="nugget-popup"><p>Study area intersected by multiple watercourses and covered by EA Flood Alert/Warning areas. The text records flooding in October 2023 when community volunteers cleared and unblocked drains and cleared roads in Newport. [IMG,PAG] (p27)</p></div><div class="nugget-popup"><p>Newport was subject to flooding during the October 2023 event; community volunteers helped to unblock drains and clear roads during that flooding. The Newport study area is covered by Environment Agency flood alert and flood warning areas linked to nearby watercourses. [IMG,PAG] (p28)</p></div><div class="nugget-popup"><p>A storm on 25 October 2023 produced heavy rainfall and prompted a fluvial flow estimate for the event; gauged data were used to assess river/flow response affecting Newport. [PAG] (p30)</p></div><div class="nugget-popup"><p>On 25 October 2023 peak river levels coincided with a high tide (tidal locking) in downstream areas of Newport, raising river levels and likely obstructing sewer outfalls. Tide locking and elevated river levels exacerbated flooding impacts across Newport; internal property flooding is reported in the town (see heatmap and photographs referenced). [IMG] (p33)</p></div><div class="nugget-popup"><p>Gunville area (within Newport) generated multiple flood rescue calls; sandbags were made available at a Newport car park (Lugley Street); Local Authority set up a hub for help, guidance and information at Ambassadors Snooker Hall in Gunville (Newport) on 29 October as part of the recovery. [TAB,MUL] (p35)</p></div><div class="nugget-popup"><p>Widespread flooding across the town on 25 October 2023, including multiple properties experiencing internal flooding; heatmap and source&ndash;pathway&ndash;receptor mapping used to analyse the event. [PAG] (p37)</p></div><div class="nugget-popup"><p>Widespread internal property flooding across Newport during the 25 October 2023 event. JBA&#8217;s heatmap and community surveys identified dense clusters of internal flooding requiring source&ndash;pathway&ndash;receptor analysis, and localised incidents elsewhere in the town (see examples below). [IMG,PAG] (p38)</p></div><div class="nugget-popup"><p>Surface water runoff from fields west of Forest Hills and insufficient drainage produced overland flow that inundated roads and gardens in the Gunville area. The Gunville Stream became fast flowing and exceeded channel capacity, causing localised river flooding and internal flooding of properties backing onto the stream (Ash Lane). Roads and junctions were inundated (notably Broadwood Lane, Forest Hills, Arthur Moody Drive / Park Close area); rear gardens were flooded and sandbags were used on Forest Hills. Site visit on 27 February 2024 found Ash Lane properties remaining uninhabited due to flood water damage and large electrical appliances showing clear flood damage. [PAG,IMG,MUL] (p41)</p></div><div class="nugget-popup"><p>The report maps internal property flooding in the Newport study area (heatmap) with incidents concentrated near the watercourse and Carisbrooke Mill Pond; flood flows from local rivers and surface water pathways contributed to internal flooding of properties during the event. [PAG,IMG] (p50)</p></div><div class="nugget-popup"><p>At least 56 residential and commercial properties experienced internal flooding; foul sewage was reported entering gardens; drainage systems were overwhelmed causing high surface runoff; river channel breaches contributed to flooding and widespread property damage and impacts on residents' mental health. (p86)</p></div><div class="nugget-popup"><p>Flooding occurred in Newport on 25th October 2023, prompting a Section 19 investigation and a package of recommended measures (improved flood zone and watercourse mapping, a community flood plan and training, SuDS and enhanced asset monitoring) to reduce future flood risk. [TAB,PAG] (p87)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 56 properties [PAG] (p4)</p></div><div class="nugget-popup quant"><p>56 properties [PAG] (p11)</p></div><div class="nugget-popup quant"><p>at least 56 properties [PAG] (p12)</p></div><div class="nugget-popup quant"><p>Four calls received between 05:15 and 06:02 [TAB,MUL] (p35)</p></div><div class="nugget-popup quant"><p>22 reported internal incidents in Gunville; 5 reported internal incidents in Alvington Manor View; 9 reported internal incidents in Carisbrooke High Street [PAG] (p37)</p></div><div class="nugget-popup quant"><p>Gunville: 22 reported internal incidents; Alvington Manor View: 5 reported internal incidents; Carisbrooke High Street: 9 reported internal incidents [IMG,PAG] (p38)</p></div><div class="nugget-popup quant"><p>at least 5 properties [PAG,IMG,MUL] (p41)</p></div><div class="nugget-popup quant"><p>56 residential and commercial properties (p86)</p></div></div></body></div>`)[0];
                popup_f21d24beb5a74507494e9967cb7c8f8d.setContent(html_596d2c8c20ce4f345e12bf1387ac0898);

                var html_478d175a72b630c85b920466f9486727 = $(`<div id="html_478d175a72b630c85b920466f9486727" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Gunville</h1><div class="nugget-popup"><p>Localised street and garden flooding in the Gunville study area (source&ndash;pathway&ndash;receptor mapping for Gunville and multiple photographs in the Gunville area are referenced). [PAG] (p8)</p></div><div class="nugget-popup"><p>Flooding in the Gunville area generated emergency calls and required flood rescue response; a local recovery hub was later established in Gunville (Ambassadors Snooker Hall). [TAB] (p35)</p></div><div class="nugget-popup"><p>Streets and properties within Gunville (including Broadwood Lane, Ash Lane and Forest Hills) were affected by surface water runoff and localised river flooding during the event, causing road inundation and internal property flooding. (p39)</p></div><div class="nugget-popup"><p>Surface water runoff from fields west of Forest Hills produced overland flows across the Gunville area; water pooled between Arthur Moody Drive and Park Close and at the junction of Broadwood Lane and Forest Hills, inundating parts of Broadwood Lane. The Gunville Stream was fast&ndash;flowing and exceeded channel capacity on 25 October, increasing local flood levels. The land adjacent to the Gunville Stream is in Flood Zone 3, indicating a high probability of river flooding during intense rainfall. [PAG,IMG] (p41)</p></div><div class="nugget-popup"><p>Gunville experienced flooding linked to surface water runoff from adjacent undeveloped land and limited sewer network capacity; measures such as retrofitting SuDS (basins, swales), investigating culvert capacity/condition and other drainage improvements are recommended to mitigate surface water flood risk. (p81)</p></div><div class="nugget-popup"><p>The report found fluvial (river) flooding to be a leading source of flooding in parts of Gunville; some properties are at risk from river&ndash;related flooding. (p83)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 calls [TAB] (p35)</p></div><div class="nugget-popup quant"><p>at least five properties (p39)</p></div><div class="nugget-popup quant"><p>at least five properties [PAG,IMG] (p41)</p></div></div></body></div>`)[0];

                var html_53cc480f5c581fdc8ca3026ed1faaf97 = $(`<div id="html_53cc480f5c581fdc8ca3026ed1faaf97" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Carisbrooke</h1><div class="nugget-popup"><p>The Carisbrooke catchment responded rapidly to the storm. The Carisbrooke Mill gauge (within Carisbrooke area) recorded a high fluvial peak on 25 October 2023; fluvial flow for the event was estimated between a 1 in 20 and 1 in 50&ndash;year event. [TAB,PAG] (p33)</p></div><div class="nugget-popup"><p>Received a Flood Warning on 25 October 2023 (Carisbrooke on the Lukely Brook at 05:13) and was subject to the resulting local response (sandbags made available from Carisbrooke High Street Car Park; stock reported insufficient). [PAG] (p34)</p></div><div class="nugget-popup"><p>Flood rescue operations were carried out in Carisbrooke with multiple calls for assistance (Castle Street and Carisbrooke High Street). A Flood Warning was also issued covering Carisbrooke. [TAB] (p35)</p></div><div class="nugget-popup"><p>Local residents and properties in the Carisbrooke area experienced fluvial flooding during the event, with significant negative impacts on wellbeing and properties. (p48)</p></div><div class="nugget-popup"><p>Fluvial flooding from the Lukely Brook exceeded the channel and fords (Spring Lane and Castle Street), causing water to enter rear gardens and flow into properties on Carisbrooke Road and nearby streets. Flooding was driven by channel exceedance combined with blocked drains and foul sewer overflows; surface runoff from High Street also contributed. High water velocities at the Castle Street ford overtopped a flood barrier and caused the Lukely Brook to flow out of bank towards nearby properties. Water ingress affected property interiors and electrical circuits, leaving some residents unable to use electricity until properties dried. [IMG,MUL] (p50)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 call at Castle Street (07:40); 3 calls at Carisbrooke High Street (09:06&ndash;10:53) [TAB] (p35)</p></div><div class="nugget-popup quant"><p>at least nine properties experienced internal flooding (p48)</p></div></div></body></div>`)[0];
