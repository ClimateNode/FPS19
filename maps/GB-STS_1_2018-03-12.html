                var html_07744762a9c1f94a610a258427afd36f = $(`<div id="html_07744762a9c1f94a610a258427afd36f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kitling Greaves Lane, Burton Upon Trent</h1><div class="nugget-popup"><p>Fluvial flows in the adjacent watercourse, augmented by surface&ndash;water runoff from the road and saturated ground, contributed to flooding affecting Kitling Greaves Lane and properties adjacent to it. The road conveys surface water; a culverted section runs beneath part of the lane and a trash screen and gabion structure were noted at the channel; the rain on 12 March 2018 resulted in properties in the area being flooded. [PAG] (p7)</p></div><div class="nugget-popup"><p>On 12th March a significant blockage on the upstream face of the culvert under Kitling Greaves Lane (debris and tyres) compromised the culvert's ability to pass flow downstream. This blockage was a major contributory factor to flooding on the lane and affected nearby properties at high risk. The road conveys surface water toward the watercourse; gullies are not designed to convey water from the watercourse. [PAG] (p8)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 6 properties [PAG] (p7)</p></div></div></body></div>`)[0];
