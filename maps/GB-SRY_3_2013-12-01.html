                var html_28001390f9eba87b79a0ab6799c94ec9 = $(`<div id="html_28001390f9eba87b79a0ab6799c94ec9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Colne</h1><div class="nugget-popup"><p>Flood waters from the River Colne contributed to flows entering the River Ash; EA actions (sluice operation) were taken to control these flows. (p7)</p></div><div class="nugget-popup"><p>Lower Colne watercourses experienced very high river flows (largest resulting flows where antecedent saturation amplified runoff), causing channels to exceed capacity and contributing to flooding in the Colne and Ash catchments. (p11)</p></div><div class="nugget-popup"><p>The Colne exceeded channel capacity in locations across the winter 2013/14 period, producing notable flooding problems at Watford and Staines; the Colne/Ash catchment response was principally driven by the 6&ndash;8 February 2014 storm when antecedent saturation produced very large peak river flows. [IMG] (p12)</p></div><div class="nugget-popup"><p>EA issued a flood warning for the River Colne at West Drayton and Stanwell Moor indicating river flooding risk and warnings to nearby properties/residents. [TAB] (p23)</p></div><div class="nugget-popup"><p>Flood waters from the River Colne were entering the River Ash; EA interventions included operating off&ndash;take sluice gates to manage flows during 9&ndash;13 February 2014. (p24)</p></div><div class="nugget-popup"><p>The River Colne generated EA flood warnings during the winter 2013/14 event (warnings relevant to this area were issued on 10 January, 31 January and 7 February) and was associated with flooding in the sub&ndash;area. [MUL] (p30)</p></div><div class="nugget-popup"><p>Part of the named warning area; flooding from the River Colne prompted EA flood warnings covering West Drayton and Stanwell Moor. [TAB] (p36)</p></div></div></body></div>`)[0];

                var html_d7a8f0a51f9e79305814fcadb443fbb5 = $(`<div id="html_d7a8f0a51f9e79305814fcadb443fbb5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Thames</h1><div class="nugget-popup"><p>The EA carried out maintenance along the River Thames in Spelthorne districts as part of response actions to fluvial flooding. (p7)</p></div><div class="nugget-popup"><p>The River Thames rose to exceptional levels over the winter 2013/14: it reached a high point between Datchet and Teddington on 11 January and, after further rainfall on saturated ground, produced the highest levels on the Lower Thames for more than 65 years and very large volumes discharged downstream (notably recorded at Kingston). [MUL] (p12)</p></div><div class="nugget-popup"><p>River flows during the winter 2013/14 floods washed debris onto Thames weirs; the Environment Agency removed the debris and later surveyed the river bed and removed shoals left by the floods. [MUL] (p15)</p></div><div class="nugget-popup"><p>Overtopped its banks in January 2014, flowing into the north&ndash;eastern end of a former quarry lake; this supplemented a groundwater&ndash;fed lake and the combined waters passed through the eight culverts under the M3 into a southern lake and contributed to flooding of Abbeyfields, Thames Side and the rear of properties on Chertsey Bridge Road, helping make Chertsey Bridge Road inaccessible. [PAG] (p20)</p></div><div class="nugget-popup"><p>Overtopped its banks north of the M3 in January 2014 and flowed into the north end of a former quarry lake, contributing water that passed through eight culverts under the M3 into the southern lake and helped cause downstream flooding of lakes, Abbeyfields and Chertsey Bridge Road. [IMG] (p21)</p></div><div class="nugget-popup"><p>The River Thames caused fluvial flooding of properties along its banks in this area: properties from Littleton Lane to Shepperton Lock were flooded on 5 February 2014; properties from Shepperton Lock to Beasley's Ait were flooded on 8 February 2014; further properties at Shepperton Green were flooded on 9 February 2014. [PAG,MUL] (p22)</p></div><div class="nugget-popup"><p>The Environment Agency issued multiple flood warnings for stretches of the River Thames through Spelthorne during winter 2013/14, covering communities adjacent to the river and prompting on&ndash;the&ndash;ground response to monitor extent and impacts. [TAB,MUL] (p23)</p></div><div class="nugget-popup"><p>The River Thames caused flooding in the Staines area in January 2014, resulting in six properties being flooded. (p26)</p></div><div class="nugget-popup"><p>Flooding of properties in the Staines area caused by the River Thames, which led to inundation of homes and local streets (worst affected areas included Mayfield Gardens, Chertsey Way and Bundy's Way). [PAG] (p27)</p></div><div class="nugget-popup"><p>River Thames was within the EA flood warning area at Staines and Egham during the winter 2013/14 event and was associated with flood warnings and response activity in the Staines area. (p30)</p></div><div class="nugget-popup"><p>The winter 2013/14 fluvial flooding of the River Thames included flooding at Penton Hook (Britain's largest inland marina) and contributed to flooding impacts in south Staines (internal property flooding and road closures). [TAB,MUL] (p32)</p></div><div class="nugget-popup"><p>The River Thames formed the south&ndash;eastern boundary of the sub area and caused fluvial flooding in January&ndash;February 2014; properties in Sunbury were flooded from the River Thames. [PAG,MUL] (p37)</p></div><div class="nugget-popup"><p>High river levels at Sunbury caused flooding that affected nearby properties; the EA issued multiple flood warnings for the River Thames at Sunbury and recorded flooded properties associated with these high flows. [TAB,MUL] (p38)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>highest levels for more than 65 years; assessed as a 1 in 15 to 20 annual chance for peak levels; two‑month discharge volume at Kingston ranked highest since records began (1885) with a <1% chance in any year (>100‑year return period) [MUL] (p12)</p></div><div class="nugget-popup quant"><p>6 properties (p26)</p></div><div class="nugget-popup quant"><p>six properties [PAG] (p27)</p></div><div class="nugget-popup quant"><p>2 properties (EA count on 06/01/2014); 1 property (EA count on 08/01/2014); 35 properties (EA count on 02/02/2014); 6 properties (EA count on 07/02/2014) [TAB,MUL] (p38)</p></div></div></body></div>`)[0];

                var html_bbed3cfd9d6f013b684e89aa6dbab6f1 = $(`<div id="html_bbed3cfd9d6f013b684e89aa6dbab6f1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Spelthorne</h1><div class="nugget-popup"><p>Internal property flooding at multiple addresses within the borough and associated road closures were reported. [TAB] (p2)</p></div><div class="nugget-popup"><p>Widespread fluvial flooding (main source), with elevated groundwater causing groundwater flooding and contributing to sewer flooding, and additional surface water flooding. Internal flooding of properties occurred across the borough. [PAG] (p7)</p></div><div class="nugget-popup"><p>Widespread flooding across the borough during winter 2013/14 resulted in 53 S19 investigation sites assigned across seven sub&ndash;areas; exceptional seasonal rainfall drove the flooding and the subsequent investigations. [IMG] (p10)</p></div><div class="nugget-popup"><p>Spelthorne was affected by widespread winter 2013/14 flooding driven by saturated ground and high river flows in its catchments (Colne and Ash), with rivers exceeding channel capacities in locations within the district. [PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Experienced severe river and surface&ndash;water flooding during winter 2013/14. The catchment produced exceptional river discharge over a two&ndash;month period (the two&ndash;month discharge at Kingston was the highest since records began in 1885) giving a total flood volume with a return period of more than 100 years; this event formed the basis of the Section 19 investigation and involved risk management authorities (EA, Surrey County Council as LLFA, Thames Water). (p13)</p></div><div class="nugget-popup"><p>Identified as particularly affected by the winter 2013/14 floods; subject of specific response and recovery actions by RMAs (details referenced but not listed on this page). [PAG] (p15)</p></div><div class="nugget-popup"><p>Temporary flood defence erected in Staines (within Spelthorne) to manage flood risk during the winter 2013/14 floods. Laleham Park pumping station failed due to high flood waters during the event and was subsequently repaired (flood&ndash;resilient door installed and all motors replaced). Thames Water network engineers attended internally flooded properties in the borough where sewer flooding was the primary cause. (p16)</p></div><div class="nugget-popup"><p>Major flooding from fluvial (River Thames), surface water, ordinary watercourse, sewer and groundwater sources affected the borough; the River Thames was the main source of fluvial flooding impacting the Shepperton, Littleton, Laleham and Sunbury sub&ndash;areas; properties were internally flooded. (p39)</p></div><div class="nugget-popup"><p>Spelthorne borough experienced flooding during the winter 2013/14 event; poorly maintained riparian watercourses and ditches were identified as contributing factors to the impacts in the area. (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>130 properties [PAG] (p7)</p></div><div class="nugget-popup quant"><p>Approximately 130 properties (p39)</p></div></div></body></div>`)[0];

                var html_dde3ee402ba2282740b1fb7bfd300e39 = $(`<div id="html_dde3ee402ba2282740b1fb7bfd300e39" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Staines-Upon-Thames</h1><div class="nugget-popup"><p>Internal property flooding at multiple addresses and road closures were reported in the locality (listed as Staines&ndash;upon&ndash;Thames in the report). [TAB] (p2)</p></div><div class="nugget-popup"><p>Temporary barriers and pumps were used in two locations in Staines to prevent properties from flooding; a Flood Assistance Centre was set up in Staines&ndash;upon&ndash;Thames (February 2014); sandbags were provided/delivered to residents in affected areas. [PAG,MUL] (p7)</p></div><div class="nugget-popup"><p>Two locations in Staines had temporary barriers and pumps installed by the Environment Agency to prevent flooding; sandbags and assistance were provided to residents; a Flood Assistance Centre was established in Staines&ndash;upon&ndash;Thames to support those affected. [PAG,MUL] (p8)</p></div><div class="nugget-popup"><p>Property&ndash;level flooding occurred in parts of Staines&ndash;upon&ndash;Thames (notably the Laleham Road area, Commercial Road area and southern Staines), which were included as S19 investigation sub&ndash;areas in the report. [IMG] (p10)</p></div><div class="nugget-popup"><p>River Colne flows exceeded channel capacity at Staines, causing notable flooding problems associated with the River Colne during the winter 2013/14 period. (p11)</p></div><div class="nugget-popup"><p>A temporary defence was erected in Staines to manage flood risk during the winter 2013/14 floods. (p16)</p></div><div class="nugget-popup"><p>A Flood Assistance Centre was set up in Staines&ndash;upon&ndash;Thames by Spelthorne Borough Council to support residents during the flooding; it coordinated assistance and information in February 2014. (p18)</p></div><div class="nugget-popup"><p>Flood warnings were issued for the River Thames at Staines (and Egham) during winter 2013/14; large numbers of people/properties in the Staines area were warned and included in EA notifications. [TAB,MUL] (p23)</p></div><div class="nugget-popup"><p>Two temporary barriers were erected in Staines during the Feb 2014 floods and held back floodwater; pumping was used to remove water from behind the defences; measures were designed to protect properties (together the defences were designed to protect more than 150 properties); barriers were removed on 21 February 2014; EA ambassadors and flood data recorders were present in Jan&ndash;Feb 2014 and a Flood Assistance Centre was set up by SBC in February 2014. [MUL] (p24)</p></div><div class="nugget-popup"><p>Six properties in the Staines area were flooded by the River Thames in January 2014. (p26)</p></div><div class="nugget-popup"><p>Flooding in the Staines area from the River Thames that inundated residential properties and local streets; worst affected locations named included Mayfield Gardens, Chertsey Way and Bundy's Way. [PAG] (p27)</p></div><div class="nugget-popup"><p>During winter 2013/14 there were reported instances of internal property flooding and road closures in the Staines (Laleham Road area) sub&ndash;area. (p29)</p></div><div class="nugget-popup"><p>The Staines area experienced flooding in winter 2013/14: rising groundwater caused flooding to Guildford Street in early January 2014, the flood water included foul contamination from sewage as drains backed up and residents were prevented from using sanitation facilities; flood waters remained throughout most of January and February 2014. [PAG] (p30)</p></div><div class="nugget-popup"><p>During winter 2013/14 there were reported instances of internal property flooding and road closures in the south Staines&ndash;upon&ndash;Thames sub area (centred around Wheatsheaf Lane). The sub area also experienced similar flooding in early 2003. [TAB,PAG,MUL] (p32)</p></div><div class="nugget-popup"><p>Winter 2013/14 flooding included inundation at Penton Hook (marina) and local flooding across the Staines area. Early January 2014 extended rainfall and rising groundwater caused flooding on Wheatsheaf Lane; rising groundwater led to surcharging of the foul sewer network and flooded ground&ndash;floor properties where floor levels were lower than the road. Flood waters filled Wheatsheaf Lane and also flooded parts of Avondale Road, Garrick Close and Penton Hook Road; flooding persisted through most of January and February 2014. Temporary defences (installed mid&ndash;February) and pumps were used to protect areas and held back floodwater. [PAG,MUL] (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 150 properties prevented from flooding [PAG,MUL] (p7)</p></div><div class="nugget-popup quant"><p>approximately 150 properties [PAG,MUL] (p8)</p></div><div class="nugget-popup quant"><p>400 m temporary defence; 260 m temporary defence; three pumps; more than 150 properties [MUL] (p24)</p></div><div class="nugget-popup quant"><p>6 properties (p26)</p></div><div class="nugget-popup quant"><p>six properties [PAG] (p27)</p></div><div class="nugget-popup quant"><p>temporary 400m and 260m barriers; three pumps; designed to protect more than 150 properties [PAG,MUL] (p33)</p></div></div></body></div>`)[0];
