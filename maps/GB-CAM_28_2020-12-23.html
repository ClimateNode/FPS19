                var html_c3e28426bf9ab081449d0607ed801478 = $(`<div id="html_c3e28426bf9ab081449d0607ed801478" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>New Road, Woodwalton</h1><div class="nugget-popup"><p>Surface water and overland flow routed into a low spot; overflowing highway gullies and an overgrown partially culverted ditch/culverts. Three residential properties, outbuildings and gardens were internally flooded to a maximum depth of c.460mm. Some residents were unable to return to their properties for over one month. [PAG] (p9)</p></div><div class="nugget-popup"><p>Surface water routed to this low spot, with a partially culverted ditch to the west overgrown and highway gullies overflowing; ditch/culverts overtopped. Floodwater inundated residential properties, outbuildings and gardens to a maximum depth of about 460 mm; some residents were unable to return to their properties for over one month. [TAB] (p10)</p></div><div class="nugget-popup"><p>Localized flooding affected New Road; residents reported flooding and maintenance issues with ditches and drainage which prompted LLFA walkovers and follow&ndash;up works (ditch maintenance and gully/culvert cleansing were arranged). [TAB] (p13)</p></div><div class="nugget-popup"><p>Surface water flooding affected New Road. Riparian maintenance issues were identified and RMA operational issues were recorded, requiring ongoing liaison between the LLFA and relevant Risk Management Authorities. [TAB] (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 residential properties; maximum depth of c.460mm [PAG] (p9)</p></div><div class="nugget-popup quant"><p>3 residential properties; over 1 month [TAB] (p10)</p></div></div></body></div>`)[0];

                var html_f944eceb75a381723b91226ce40aec6e = $(`<div id="html_f944eceb75a381723b91226ce40aec6e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>The Cross, Woodwalton</h1><div class="nugget-popup"><p>Internal flooding of residential properties was reported at this location (listed as one of three key risk areas where internal property flooding occurred). Additional local roads and gardens in the village were also identified as flooded. (p9)</p></div><div class="nugget-popup"><p>Surface water flooding occurred; highway gullies and the ditch at The Cross overflowed. Outbuildings and gardens attached to one residential property were inundated. When floodwater leaves the ditch channel it flows toward the centre of the village, worsening flooding. A tree was observed blocking the village&ndash;green ditch, contributing to conveyance problems. [PAG] (p10)</p></div><div class="nugget-popup"><p>At the Cross and village green, outbuildings and gardens attached to one residential property were inundated with flood water; residents did not have to leave the property. A ditch at the village green was obstructed by a tree trunk and roots, causing water to pool and, when the ditch overtopped, floodwater flowed towards the centre of the village and exacerbated local flooding. In the Braefield area (within Woodwalton), surface water routed from fields to the north flooded one residential property to a depth of about 60 mm internally and flooded the outbuildings of that property to about 180 mm; anecdotal evidence indicates that this floodwater dissipated relatively quickly after the event. [TAB] (p11)</p></div><div class="nugget-popup"><p>Flooding was reported at The Cross; investigations identified issues with ditches and highway drainage leading to planned and carried&ndash;out maintenance actions to alleviate future flooding. [TAB] (p13)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 residential property [PAG] (p10)</p></div><div class="nugget-popup quant"><p>1 residential property; internal flooding c.60 mm; outbuildings flooded c.180 mm [TAB] (p11)</p></div></div></body></div>`)[0];

                var html_5fb0fe3eda45d999b5ce9492e44ef843 = $(`<div id="html_5fb0fe3eda45d999b5ce9492e44ef843" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Braefield, Woodwalton</h1><div class="nugget-popup"><p>Internal flooding of residential properties was reported at this location (listed as one of three key risk areas where internal property flooding occurred). The village&ndash;level reports also note additional flooding to roads and gardens. (p9)</p></div><div class="nugget-popup"><p>Field runoff routed from fields to the north caused surface water to flood one residential property to a depth of about 60mm; outbuildings associated with the property flooded to about 180mm. Anecdotal evidence indicates the flood water dissipated relatively quickly and the resident did not have to leave the property. [TAB,PAG] (p12)</p></div><div class="nugget-popup"><p>Braefield experienced flooding reports tied to blocked/poorly maintained ditches and drainage; this prompted meetings with residents, LLFA site visits and subsequent ditch maintenance and gully/culvert cleansing. [TAB] (p13)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 residential property [TAB,PAG] (p12)</p></div></div></body></div>`)[0];

                var html_ea070e74c1a06a329d4987336c2ffee1 = $(`<div id="html_ea070e74c1a06a329d4987336c2ffee1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Woodwalton</h1><div class="nugget-popup"><p>Significant flooding occurred in Woodwalton as a result of very high runoff from the intense rainfall on 23rd December 2020. (p6)</p></div><div class="nugget-popup"><p>Six LLFA flood reports for Woodwalton describing internal flooding to residential properties, plus flooding to some roads and gardens. Three local areas were highlighted where internal property flooding was reported: New Road; The Cross and village green; and Braefield. [PAG] (p8)</p></div><div class="nugget-popup"><p>Following the 23 December 2020 flood, drainage systems in Woodwalton required maintenance. Actions taken or arranged included cleansing of highway gullies by Cambridgeshire Highways and riparian maintenance of drainage ditches (Huntingdonshire District Council visited the site and maintenance work is understood to have been carried out). The LLFA offered support to residents to set up a local flood plan and will continue to liaise with Risk Management Authorities until outstanding actions are completed. (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>six flood reports; five residential properties; three key risk areas [PAG] (p8)</p></div></div></body></div>`)[0];
