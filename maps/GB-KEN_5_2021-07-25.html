nternally flooded; 2 properties externally flooded; 5 cm &ndash; 15 cm of floodwater within properties [TAB] (p2)</p></div></div></body></div>`)[0];

                var html_94ed22f3079cc37b6f1bceb3cc22ef93 = $(`<div id="html_94ed22f3079cc37b6f1bceb3cc22ef93" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Forge Hill, Bethersden</h1><div class="nugget-popup"><p>Internal flooding of a property with floodwater entering the building to a significant depth. [TAB] (p2)</p></div><div class="nugget-popup"><p>The Bethersden Stream passes via a 675 mm culvert beneath the junction of Forge Hill and Ashford Road (A28); the junction is a local low spot where surface water is known to pond. The culvert and junction geometry contributed to local ponding and conveyance of stream flows through the junction during the event. [IMG,PAG] (p10)</p></div><div class="nugget-popup"><p>The culvert beneath Forge Hill was being bypassed by high river flows on 25 July 2021. The Forge Hill/A28 junction is a known low spot where surface water ponds; during the event properties on Forge Hill were flooded and Kent Fire & Rescue Service pumped floodwater from inside properties into the Bethersden Stream, which may have increased downstream flooding. [IMG] (p11)</p></div><div class="nugget-popup"><p>The culvert and surrounding drainage located at The Street and Forge Hill junction were cleaned and pipe repairs were undertaken (March 2022) as part of remedial works following the 25 July 2021 flood. (p12)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property flooded internally; reports of 20 cm of floodwater within the property. [TAB] (p2)</p></div></div></body></div>`)[0];

                var html_6f8e3cbc5a2e6f32914feac55ecaec5e = $(`<div id="html_6f8e3cbc5a2e6f32914feac55ecaec5e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bethersden</h1><div class="nugget-popup"><p>Intense rainfall on 25 July 2021 caused local river levels (Bethersden Stream and an unnamed tributary of the River Beult) to rise quickly, surcharging highway surface water drainage and culverts (under Church Hill and Norton Lane). Sewer network was reported unable to cope in isolated areas. Approximately 33 properties were flooded (22 internally, 11 externally). (p1)</p></div><div class="nugget-popup"><p>Flooding affected properties within the village: at least one property was flooded internally (reported ~90 cm of floodwater) and other properties experienced external flooding (two properties on The Street). [IMG,PAG] (p3)</p></div><div class="nugget-popup"><p>Lower&ndash;lying areas of the village associated with the two tributaries experienced surface&ndash;water and tributary/river flooding; the high&ndash;risk areas on surface&ndash;water mapping largely correspond to the properties affected in the 25 July 2021 event. (p4)</p></div><div class="nugget-popup"><p>Intense, localized rainfall on 25 July 2021 led to flooding in Bethersden, with flooding reported to start at approximately 15:00 as a result of the extreme hourly rainfall. The local Environment Agency rain gauge is located in Bethersden and recorded the extreme event used to characterise the flood. (p5)</p></div><div class="nugget-popup"><p>Intense rainfall on 25 July 2021 overwhelmed drainage and watercourses, causing main&ndash;river overtopping and surface water runoff that flooded properties in the village. (p8)</p></div><div class="nugget-popup"><p>Overland flows from land to the south overwhelmed the rear land drainage ditch south of Bailey Fields, which overtopped and led to flooding of properties along Ashford Road. Debris was reported near drainage pipes south of Bailey Fields. Kent Fire and Rescue Service attended on 25 July 2021 to pump out floodwater from multiple properties. Subsequent KCC Highways surveys (2022) identified defects in the surface water drainage system (deformed/partially collapsed pipes and root masses) that would have reduced system capacity. (p9)</p></div><div class="nugget-popup"><p>On 25 July 2021 culverts (including beneath Church Hill and Norton Lane) surcharged and sent floodwater onto adjacent roads; an unnamed tributary and collapsed culvert beneath Union Chapel caused surcharge and flooding of surrounding properties. Emergency responders (KCC, KFRS) attended and pump and clearance operations were undertaken. Subsequent actions included raising a pond bank north of Sunnyside and remedial culvert/pipe cleaning and repairs. [PAG] (p12)</p></div><div class="nugget-popup"><p>Intense rainfall on 25 July 2021 overwhelmed local surface water drainage systems and local watercourses, causing internal flooding to properties and carriageway flooding of local roads in the village. [PAG] (p13)</p></div><div class="nugget-popup"><p>On 25 July 2021 intense rainfall overwhelmed local surface water drainage and local watercourses, causing flooding to properties and roads. High water levels in receiving watercourses prevented the drainage network from discharging. [PAG] (p14)</p></div><div class="nugget-popup"><p>Flooding incidents were reported across the village, with clusters of inundation near the village centre and along main roads. Flooding locations on the map are concentrated close to local watercourses and at road junctions, indicating inundation of roads and adjacent areas. [IMG] (p15)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 33 properties; 22 properties internal flooding; 11 properties external flooding (p1)</p></div><div class="nugget-popup quant"><p>1 property; 2 properties [IMG,PAG] (p3)</p></div><div class="nugget-popup quant"><p>5 properties; 30 properties (p8)</p></div><div class="nugget-popup quant"><p>33 properties [PAG] (p13)</p></div><div class="nugget-popup quant"><p>33 properties [PAG] (p14)</p></div></div></body></div>`)[0];
