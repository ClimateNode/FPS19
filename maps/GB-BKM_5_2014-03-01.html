                var html_9f4f140c1857f21608215617c97d3ea7 = $(`<div id="html_9f4f140c1857f21608215617c97d3ea7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Chalfont St Giles</h1><div class="nugget-popup"><p>Exceptionally high groundwater levels in the chalk aquifer caused groundwater flooding in the village, which affected local critical infrastructure including the Affinity Water pumping station, the British Telecom telephone exchange, and the main access road to the village shops. (p4)</p></div><div class="nugget-popup"><p>Surface water and fluvial flooding affected the village centre: commercial and residential properties along the central watercourse and the road corridor (Pheasant Hill / High Street) were shown to be at risk. The valley funnels groundwater, surface water and river flow into the valley bottom, concentrating floodwater into the centre of the village. [IMG,PAG] (p12)</p></div><div class="nugget-popup"><p>Area experienced high river levels in the period; river (Misbourne) was at bank full and in spate with some minor flooding of bankside gardens and farmland in the locality. No reported failures or damage to highway or surface water drainage features within the Chalfont St Giles locality were reported as contributing to the flooding. [PAG,MUL] (p17)</p></div><div class="nugget-popup"><p>High groundwater levels flooded local infrastructure (Affinity Water pumping station and the BT telephone exchange). Over&ndash;pumping from the BT exchange caused flooding of the high street, forced closure of the car park and required the main street to be reduced to one direction of traffic, producing an economic impact on small businesses in the village. [PAG] (p18)</p></div><div class="nugget-popup"><p>Exceptionally high groundwater levels in the chalk aquifer caused groundwater flooding across the village that affected local critical infrastructure: the Affinity Water pumping station and the BT telephone exchange were impacted, and the main access road to the shops in the village centre was flooded, restricting access. (p23)</p></div><div class="nugget-popup"><p>Spring 2014 groundwater flooding affected the village: local critical infrastructure was impacted (Affinity Water pumping station and the BT telephone exchange) and the main access road to the shops in the centre of the village was affected. [TAB,PAG] (p24)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 critical infrastructure assets; 1 main access road (p23)</p></div></div></body></div>`)[0];

                var html_b6bee35e30f0c0c1ff917b322f6dcfc1 = $(`<div id="html_b6bee35e30f0c0c1ff917b322f6dcfc1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Little Missenden</h1><div class="nugget-popup"><p>The telemetered river level gauge at Little Missenden recorded exceptionally high river levels during the Dec 2013&ndash;Apr 2014 period; the event is listed as number 1 in the gauge's top 10 levels and the peak on 08 March 2014 indicates severe fluvial flooding in the River Misbourne at this location. [PAG,MUL] (p15)</p></div><div class="nugget-popup"><p>The Little Missenden gauge recorded exceptionally high river stages during Dec 2013&ndash;Apr 2014 associated with fluvial flooding of the River Misbourne influenced by exceptionally high groundwater. The period was treated as one event influenced by groundwater, with multiple high peaks providing an early indication of high flows upstream. [IMG,PAG,MUL] (p16)</p></div><div class="nugget-popup"><p>Gauge recorded exceptionally high river levels during the event; provided early warning of high flows upstream of Chalfont St Giles and shows the event&ndash;ranked peak during the three&ndash;month episode. [IMG,PAG] (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>459 mm peak level on 08 March 2014 (maximum recorded 0.459 mSG); ranked number 1 of top 10 levels at this site for the three&ndash;month event [IMG,PAG] (p17)</p></div></div></body></div>`)[0];
