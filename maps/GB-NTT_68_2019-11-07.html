                var html_afe8ba243e8cd5ba34f00ccc36b42079 = $(`<div id="html_afe8ba243e8cd5ba34f00ccc36b42079" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Worksop</h1><div class="nugget-popup"><p>The town experienced extensive flooding on 7 November 2019 following exceptional rainfall; the River Ryton (which flows through the town) and surface water from saturated ground contributed to inundation of parts of the town. [PAG] (p1)</p></div><div class="nugget-popup"><p>Significant internal flooding across the town caused by intense rainfall and fluvial (river) flooding. Flooding affected residential properties, businesses, public highways, gardens and curtilages. [IMG,PAG] (p2)</p></div><div class="nugget-popup"><p>Significant flood event beginning morning 07/11/2019: 308 reported incidents of internal flooding across the town. Floodwater also affected public highways and many gardens/curtilages. (p3)</p></div><div class="nugget-popup"><p>Overtopping of the River Ryton led to initial flooding at the Caravan Park and sports pavilion, later spilling over the right bank and flooding highways and properties in central Worksop (Central Avenue area and listed streets); tributaries backed up and overtopped, roads became impassable and some were closed for safety. (p5)</p></div><div class="nugget-popup"><p>Central area affected: evacuations carried out; large parts of the town lost power; several roads in and out of the town were closed; properties and businesses experienced internal flooding. (p6)</p></div><div class="nugget-popup"><p>Affected by flooding associated with the River Ryton; town centre and surrounding areas were identified for vegetation removal (Canch area and town centre) and for consideration of storage and hydraulic&ndash;modelling&ndash;based alleviation options. [PAG] (p10)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>308 reported incidents of internal flooding; 128 properties; 180 businesses [IMG,PAG] (p2)</p></div><div class="nugget-popup quant"><p>308 reported incidents of internal flooding; 128 properties; 180 businesses (p3)</p></div><div class="nugget-popup quant"><p>128 residential properties; 180 businesses (p6)</p></div></div></body></div>`)[0];
