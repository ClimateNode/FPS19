                var html_97cccf7cf4b37f37887dcc9e479fdf08 = $(`<div id="html_97cccf7cf4b37f37887dcc9e479fdf08" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kingsbridge</h1><div class="nugget-popup"><p>Internal property flooding occurred in the town during the storm; worst affected area was Bridge Street and multiple other streets experienced internal property flooding. (p1)</p></div><div class="nugget-popup"><p>Multiple areas of Kingsbridge experienced surface water flooding during the event; muddy water overwhelmed highway drains and entered properties and businesses across the town. [TAB,PAG] (p2)</p></div><div class="nugget-popup"><p>Central Kingsbridge (including the Bridge Street area) experienced the majority of flooding on 4 June 2022: heavy rainfall caused surface water to overwhelm highway drains and flood into properties; fluvial risk from the local watercourse exacerbated surface water flooding when the watercourse could not accept additional flows; tide locking contributed to drainage failure in the combined system. Photographic evidence shows floodwater reaching the bottom of car doors and building entrances. (p4)</p></div><div class="nugget-popup"><p>The area around Bridge Street and central Kingsbridge experienced the majority of the flooding on 4 June 2022; surface water from heavy rainfall overwhelmed highway drains and flooded into properties. The town centre has both fluvial and surface water flood risk, with tide locking and combined system issues making drainage inadequate for a 1&ndash;in&ndash;10&ndash;year event. [PAG] (p5)</p></div><div class="nugget-popup"><p>Multiple properties within the town were flooded on 4 June 2022 (clustered around Dodbrooke Stream and its culvert). The highway network was affected by surface water, sewer discharges from combined sewers may have occurred (e.g. at Bridge Street and the bus station), and muddy/silty flood waters were conveyed through the town during the event. [IMG,PAG] (p6)</p></div><div class="nugget-popup"><p>Flooding occurred in Kingsbridge on 4 June. Hydraulic modelling predicted the areas that flooded except Manor Park, which flooded from pluvial (surface water) runoff. Flooding happened after high tide; the surface water system had reduced discharge flow for at least 1&ndash;2 hours after high tide, which hampered catchment drainage and possibly caused discharges from combined sewer overflows at Bridge Street and the bus station. Ongoing development sites contributed to muddy and silty flood waters being conveyed through the town. [PAG] (p7)</p></div><div class="nugget-popup"><p>The chapter recommends multiple flood&ndash;management actions for Kingsbridge: progress Kingsbridge IUDM flood improvements; consider Property Flood Resilience measures; consider natural flood management in the catchment; sewer network maintenance and potential investment (including storm water separation); ensure highway drains and culverts are maintained; ensure Dodbrook Stream culvert is maintained. These recommendations indicate the town experienced flooding issues prompting these measures. [TAB] (p8)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>13 properties (p1)</p></div><div class="nugget-popup quant"><p>13 properties [TAB,PAG] (p2)</p></div></div></body></div>`)[0];
