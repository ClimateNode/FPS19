                var html_86292916074a89e04a2f4c73a12b6194 = $(`<div id="html_86292916074a89e04a2f4c73a12b6194" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Brampton Park Golf Club</h1><div class="nugget-popup"><p>Flood incident cluster located adjacent to Brampton Golf CP was identified as one of three areas where internal property flooding occurred during the event (map circle 2 / 'The Fairways'). [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>Surface water runoff from a saturated catchment caused a tributary and an on&ndash;channel pond to exceed capacity on 23rd December 2020; floodwaters travelled north, inundating operational buildings of the golf club and the golf club car park and contributing to flooding of nearby residential properties. (p12)</p></div><div class="nugget-popup"><p>Flooding prompted the club (and landowners/operators) to renew inlet and outlet culverts for an on&ndash;channel pond, perform channel maintenance on sections of the watercourse on club land, and engage in discussions about groundworks to reduce future flood risk; unconsented works by a private landowner were also identified during the post&ndash;flood investigations. [TAB,PAG] (p13)</p></div><div class="nugget-popup"><p>Flooding associated with the adjacent riparian watercourse affected the golf course (including The Fairways area and an on&ndash;channel pond). Works undertaken in response included renewal of inlet and outlet culverts for the on&ndash;channel pond, channel maintenance on sections of the watercourse on club land, and planning of groundworks and riparian maintenance to reduce future inundation risk. (p14)</p></div></div></body></div>`)[0];

                var html_a3116491eda01731e574c588fd24751b = $(`<div id="html_a3116491eda01731e574c588fd24751b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Park Road, Brampton</h1><div class="nugget-popup"><p>Identified as one of three key risk areas where internal property flooding was reported during the event; grouped among the most significantly impacted areas. [PAG] (p9)</p></div><div class="nugget-popup"><p>Surface water flooding inundated one residential property on 23rd December 2020; the property was flooded internally and its garden and outbuildings were inundated, and residents were forced to vacate. [TAB] (p12)</p></div><div class="nugget-popup"><p>Surface water flooding inundated one residential property, its garden and outbuildings. Local drainage was overwhelmed by exceptional runoff and concurrent high flows in the River Great Ouse. [TAB,PAG] (p13)</p></div><div class="nugget-popup"><p>The Park Road area experienced increased flood risk during the event; the LLFA is working with Highways England to determine whether the new A14 has contributed to that increased flood risk and RMA operational issues were noted. [PAG] (p18)</p></div><div class="nugget-popup"><p>Surface water flooding affected Park Road; the report also notes RMA operational issues associated with this location. [TAB] (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 residential property; c.150mm depth; residents vacated for 5 days [TAB] (p12)</p></div><div class="nugget-popup quant"><p>1 residential property [TAB,PAG] (p13)</p></div></div></body></div>`)[0];

                var html_e9df4cab55b884debf629a5e30409ddf = $(`<div id="html_e9df4cab55b884debf629a5e30409ddf" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Brampton</h1><div class="nugget-popup"><p>Significant flooding from surface water sources caused by intense short&ndash;duration rainfall on already saturated ground, producing very high runoff that led to flooding in Brampton. (p7)</p></div><div class="nugget-popup"><p>Significant surface&ndash;water/urban flooding across the area; 24 flood reports were received by the LLFA; roads and gardens were flooded; internal flooding to residential properties occurred. [PAG] (p9)</p></div><div class="nugget-popup"><p>Area&ndash;wide flooding in Brampton with 24 flood reports to the LLFA. Internal flooding affected residential properties (roads, gardens and some public/green land were also flooded). Thrapston Road area: two residential properties, industrial outbuildings, gardens, land and fields flooded to a maximum depth of approximately 500 mm; residents and businesses were evacuated for up to one month. [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>Areas around Brampton experienced surface water flooding due to exceptional runoff (soil capacity vastly exceeded) and concurrent high flows entering the River Great Ouse from other watercourses, which exceeded channel capacity. The LLFA carried out site walkovers and met residents known to have flooded as part of the investigation. [TAB,PAG] (p13)</p></div><div class="nugget-popup"><p>Flooding occurred in the village, particularly the south of Brampton where nearby watercourses are thought to have contributed to flooding; maintenance actions have been taken but further work is required to ensure watercourses convey water away from the village effectively. (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>24 flood reports; 9 residential properties flooded internally [PAG] (p9)</p></div><div class="nugget-popup quant"><p>24 flood reports; 9 residential properties flooded internally; 2 residential properties (Thrapston Road); up to 1 month evacuations; max depth c.500 mm [PAG,IMG] (p10)</p></div></div></body></div>`)[0];
