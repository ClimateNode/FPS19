                var html_23045ed14aad67009b9ea16aa0b20488 = $(`<div id="html_23045ed14aad67009b9ea16aa0b20488" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Beverley Brook</h1><div class="nugget-popup"><p>Beverley Brook is the watercourse responsible for recorded flooding in the area. Telemetry shows a very sharp rise during the 25 July 2021 event that brought river levels to 2.76 mASD (within 100 mm of the July 2007 peak of 2.85 mASD), rapidly submerging drainage outlets and contributing to hydraulic locking and flooding of adjacent areas including Worcester Park. [PAG,MUL] (p6)</p></div><div class="nugget-popup"><p>Rapid, sharp rise in river level on 25th July 2021 submerged drainage outlets and caused hydraulic lock; contributed to surcharging of gullies and manholes and linked foul sewer flooding (including reported high levels again on 28th July 2021). [MUL] (p7)</p></div><div class="nugget-popup"><p>The Thames Water surface water system (including a 750mm main pipe running from Avon Close) discharges into the Beverley Brook; culverted former tributaries now feed the brook via the drainage network and are therefore implicated in the local flood dynamics. [PAG] (p10)</p></div><div class="nugget-popup"><p>On 25 July 2021 water levels in the Beverley Brook rose to one of the highest recorded levels; the elevated brook level exceeded the height of the Thames Water drainage outlet, preventing discharge from the surface water network and causing the piped system to back up and surcharge at gullies and manholes. (p11)</p></div><div class="nugget-popup"><p>Received surface water discharges from multiple sub&ndash;catchments and surface water pipes, causing rapid responses and a risk of outlet blockage that increased downstream flood risk. [PAG] (p12)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>River level 2.76 mASD on 25 July 2021; 2.85 mASD recorded in July 2007 [PAG,MUL] (p6)</p></div><div class="nugget-popup quant"><p>River level 2.76mASD on 25th July 2021; peak recorded 2.85mASD (July 2007) [MUL] (p7)</p></div></div></body></div>`)[0];

                var html_ac08c74510dd816d628a6d2d45f22c03 = $(`<div id="html_ac08c74510dd816d628a6d2d45f22c03" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Borough of Sutton</h1><div class="nugget-popup"><p>The London Borough of Sutton's Surface Water Management Plan records the Worcester Park area as having been impacted by 21&ndash;50 incidents of sewer flooding; downstream works on the Beverley Brook in Sutton (flood alleviation scheme) reduced risk to properties, and areas draining to the brook contributed to rapid river rises and hydraulic locking of outfalls during the 25 July 2021 event. [PAG] (p6)</p></div><div class="nugget-popup"><p>Surface water from the wider catchment (including areas within Sutton) drained into the Beverley Brook; this contributed to the rapid rise in river levels that prevented Thames Water outlets from discharging and led to backup and surcharging in the surface water network. (p11)</p></div><div class="nugget-popup"><p>Sub&ndash;catchments in the borough were identified as discharging surface water into the Beverley Brook via surface water pipes, contributing to the rapid surge in the brook and increased downstream flood risk in Worcester Park. [PAG] (p12)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>21&ndash;50 incidents of sewer flooding in the Worcester Park area; approximately 90 properties identified as having reduced flood risk by the Beverley Brook alleviation scheme [PAG] (p6)</p></div></div></body></div>`)[0];

                var html_358f5c57327796ac91c587e1ff5f1538 = $(`<div id="html_358f5c57327796ac91c587e1ff5f1538" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Avon Close, Cuddington</h1><div class="nugget-popup"><p>Residential properties on Avon Close experienced flooding (internal and/or external) during intense surface water runoff on 25th July 2021, as part of the Worcester Park event. (p4)</p></div><div class="nugget-popup"><p>Identified in the Environment Agency historical flood records as a location impacted by Beverley Brook flooding; designated as a historic wetspot. Avon Close gullies (eight total) were inspected after the 25 July 2021 event and confirmed operational on arrival and on leaving. [MUL] (p6)</p></div><div class="nugget-popup"><p>On 25 July 2021 gullies and manholes began to surcharge (around 15:00) causing surface water to flood the road up to number 44 and enter properties at the front and rear; a manhole in the rear garden of No. 21 surcharged sending water through rear gardens; some properties experienced internal flooding via kitchen and bathroom wastepipes. Water subsided by the following morning. Additional foul sewer flooding was reported on 28 July 2021, likely linked to high Beverley Brook levels. [PAG,MUL] (p7)</p></div><div class="nugget-popup"><p>Drainage assets (eight gullies and associated laterals) were partially silted during the event which may have impaired functionality; assets were jetted and confirmed clear and freely discharging to the Thames Water surface water system after the event. [PAG] (p10)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Part of the area&ndash;wide totals: 35 internal property floods; 71 external property floods; 106 total incidents in Worcester Park (p4)</p></div><div class="nugget-popup quant"><p>8 gullies; 3 gullies obstructed by vehicles (reported since 2014); 1 historical record of flooding affecting Avon Close [MUL] (p6)</p></div><div class="nugget-popup quant"><p>flood depths of approximately 500mm; properties flooded internally from 23 Avon Close up to 64 Avon Close; properties 15, 16 and 17 Avon Close flooded externally [PAG,MUL] (p7)</p></div><div class="nugget-popup quant"><p>8 gullies; seven assets with 50% silt; one asset with 75% silt [PAG] (p10)</p></div></div></body></div>`)[0];

                var html_aeb3d8ef3077785152cec3bb84626dd4 = $(`<div id="html_aeb3d8ef3077785152cec3bb84626dd4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Epsom and Ewell</h1><div class="nugget-popup"><p>Recorded heavy rainfall in the district led to surface water flooding within the Worcester Park area of the district, producing internal and external property flooding. (p4)</p></div><div class="nugget-popup"><p>District&ndash;level records and assessments identify sewer&ndash;flooding incidents and the district contains Worcester Park, which experienced property flooding during the event. [PAG] (p5)</p></div><div class="nugget-popup"><p>Heavy rainfall on 25 July 2021 within the Epsom and Ewell sub&ndash;catchment contributed to rapid runoff into the Beverley Brook, increasing flows that led to the Beverley Brook exceeding outlet levels and causing surface water drainage to back up in the Worcester Park network. (p11)</p></div><div class="nugget-popup"><p>The Epsom and Ewell section of the Worcester Park catchment discharges to the Beverley Brook; flows from this sub&ndash;catchment contributed to the brook's rapid response and local flooding. [PAG] (p12)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>35 internal property floods; 71 external flood incidents; 106 total (p4)</p></div><div class="nugget-popup quant"><p>19 cases of sewer flooding [PAG] (p5)</p></div></div></body></div>`)[0];

                var html_34351328a328a624aca7854aa3701f8c = $(`<div id="html_34351328a328a624aca7854aa3701f8c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Worcester Park</h1><div class="nugget-popup"><p>Surface water flooding on 25 July 2021 caused internal and external flooding across the Worcester Park area. Reported impacts include internal property flooding and external (street/adjacent) flooding; main streets/areas reported affected include Avon Close, Edenfield Gardens, The Avenue, Stoneleigh Park Road, Woodlands Avenue, Dewsbury Gardens, Ardrossan Gardens and Kinross Avenue. [PAG] (p3)</p></div><div class="nugget-popup"><p>Surface water flooding on 25 July 2021 caused internal and external flooding across the residential area. The main streets reported affected include Avon Close, Edenfield Gardens, The Avenue, Stoneleigh Park Road, Woodlands Avenue, Dewsbury Gardens, Ardrossan Gardens and Kinross Avenue. [IMG,TAB] (p4)</p></div><div class="nugget-popup"><p>Lower&ndash;elevation parts of Worcester Park experienced property flooding; historical record of fluvial flooding impacted Avon Close; area reported to have flooded in July 2007. (Impacts in this settlement were the subject of the investigation into the 25th July 2021 event.) [PAG,MUL] (p5)</p></div><div class="nugget-popup"><p>Area experienced repeated sewer&ndash;flooding incidents (recorded in London Borough of Sutton SWMP) and was affected by rapid river&ndash;level rise in the Beverley Brook on 25 July 2021 that submerged drainage outlets, caused hydraulic locking of surface water outlets and contributed to local flooding. The area also has a historical recorded flood in July 2007. [PAG,MUL] (p6)</p></div><div class="nugget-popup"><p>Surface water drainage from the Worcester Park area conveyed rapidly into Beverley Brook, contributing to rapid river level rises; properties in Avon Close (within Worcester Park) experienced surface water flooding front, rear and internal flooding with water entering via surcharged gullies, manholes and wastepipes. [MUL] (p7)</p></div><div class="nugget-popup"><p>Surface water drainage from Worcester Park was carried into the local Thames Water surface water system (including the 750mm main pipe) that discharges to the Beverley Brook; the local culverted tributary/drainage network was implicated in the event. (p10)</p></div><div class="nugget-popup"><p>On 25 July 2021 intense rainfall produced one of the highest recorded Beverley Brook water levels at Worcester Park; the brook rose above the Thames Water drainage outlet, preventing discharge, causing the surface water pipe network to back up and surcharge at gullies and manholes, which prevented overland runoff from draining and produced local surface water flooding. (p11)</p></div><div class="nugget-popup"><p>Surface water from multiple sub&ndash;catchments discharged via surface water pipes into the Beverley Brook, causing rapid rises and increasing risk of outlets becoming blocked; contributed to flooding in the Worcester Park area. [PAG] (p12)</p></div><div class="nugget-popup"><p>Water level at the Worcester Park gauge rose above the defined 'Flooding Possible' threshold, indicating flood conditions at the gauge location; levels spiked on 25/07 and then fell back into the typical range. [IMG] (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 35 internal property floods; 71 external floods [PAG] (p3)</p></div><div class="nugget-popup quant"><p>35 internal property floods; 71 external flood incidents; 106 total [IMG,TAB] (p4)</p></div><div class="nugget-popup quant"><p>1 record of flooding at Avon Close [PAG,MUL] (p5)</p></div><div class="nugget-popup quant"><p>21&ndash;50 incidents of sewer flooding (Worcester Park area, per Sutton SWMP) [PAG,MUL] (p6)</p></div><div class="nugget-popup quant"><p>Flood depths approximately 500mm; properties from 23 Avon Close up to 64 Avon Close flooded internally; 15, 16 and 17 Avon Close flooded externally [MUL] (p7)</p></div><div class="nugget-popup quant"><p>water level exceeded flooding threshold 2.85 mASD on 25/07 (peak above 2.85 mASD) [IMG] (p19)</p></div></div></body></div>`)[0];
