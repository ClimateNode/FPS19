                var html_add10793d01bbce2156bb0c684841efd = $(`<div id="html_add10793d01bbce2156bb0c684841efd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Windsor Close, Towcester</h1><div class="nugget-popup"><p>Surface water ponded on the carriageway because drainage systems were blocked and gullies/levels were inefficient; ponded water spilled over into low points around private property causing internal flooding of a property. (p6)</p></div><div class="nugget-popup"><p>Excess surface water ponded in the carriageway due to blocked and inefficient drainage; ponding spilled over into low points around private property causing internal flooding of at least one property. Drainage blockages were reported and subsequently cleared. (p7)</p></div><div class="nugget-popup"><p>Internal flooding of a residential property (water crossed the building threshold). The property experienced internal flooding on 2 November 2014 and has been flooded on more than one occasion in the previous five years, prompting a formal flood investigation. [PAG] (p9)</p></div><div class="nugget-popup"><p>Surface water flooding occurred at the north/end of the cul&ndash;de&ndash;sac of Windsor Close. A property at this location was reported flooded. Ponding at the kerb line was noted following a previous resurfacing that reduced road camber; silt deposits were observed. Two road gullies drain this section (east gully collects water; west gully is at a higher level and does not). A piped drainage system within the curtilage of a private property at the end of the cul&ndash;de&ndash;sac conveys runoff north beneath properties and may connect to the surface water public sewer in Buckingham Way (connection not verified). Runoff from private driveways, shared parking and the wider catchment (including areas of Buckingham Way) can flow to the low point at the end of Windsor Close. [PAG] (p10)</p></div><div class="nugget-popup"><p>Surface water from the carriageway flowed north across the carriageway channel, ponded at the north kerb line at the end of the cul&ndash;de&ndash;sac, overtopped the back of the footway and spilled onto private property, flowing into a garage and around the front of a house. [TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Flooding occurred at Windsor Close causing a property to be flooded; drainage systems serving the area were not operating effectively during the incident due to blockage and poor location; the property sits at a low level in the natural flow path and is vulnerable to high volumes of surface water runoff. (p16)</p></div><div class="nugget-popup"><p>A flood incident occurred at the low point of Windsor Close, influenced by runoff from the wider catchment and drainage located on private property at the end of the street. Impacts and risks led to recommendations to establish ownership/maintenance of private drainage, consider additional drainage and flood gates, and undertake kerbing and carriageway/gully re&ndash;levelling at the low point. [PAG] (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property (internal flooding) (p6)</p></div><div class="nugget-popup quant"><p>1 property (p7)</p></div><div class="nugget-popup quant"><p>one property [PAG] (p9)</p></div><div class="nugget-popup quant"><p>2 recorded incidents (during w/c 27/10/14 (possibly 29/10/14) and 02/11/14) [TAB,PAG,MUL] (p11)</p></div></div></body></div>`)[0];
