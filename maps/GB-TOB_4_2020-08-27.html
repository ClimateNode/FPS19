                var html_aa0600ef7d83cc524db99b442ec8547c = $(`<div id="html_aa0600ef7d83cc524db99b442ec8547c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Torbay</h1><div class="nugget-popup"><p>Torbay experienced a continuous five&ndash;hour period of rain with a short period of extremely intense rainfall on 27th August; the intense short&ndash;duration rainfall produced conditions associated with surface water / flash flooding across the Torbay area (rain gauges in Torquay, Paignton and Brixham recorded intense totals during the event). (p5)</p></div><div class="nugget-popup"><p>The area experienced flooding impacts during the intense storm: flooded roads required diversion arrangements; road gullies and trash screens were blocked and cleared; blown manhole covers were replaced (indicative of surcharged sewers); multiple calls were received reporting flooding throughout the day. [PAG] (p6)</p></div><div class="nugget-popup"><p>Torbay experienced a flooding event on 27 August 2020 that prompted investigations and remedial actions (drainage/gully clearing, sewer system condition checks, watercourse maintenance and advice to property owners on groundwater/flood protection). (p20)</p></div></div></body></div>`)[0];

                var html_9639adad549599620c5c72bb1ce1cd32 = $(`<div id="html_9639adad549599620c5c72bb1ce1cd32" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Torquay</h1><div class="nugget-popup"><p>Floodwaters entered the Town Centre via Market Street, Union Street and Fleet Street causing highway (urban) flooding in the town centre area. (p7)</p></div><div class="nugget-popup"><p>Parts of Torquay experienced highway and surface&ndash;water/urban flooding. Internal flooding was reported to one property in Ellacombe Church Road and one in Lower Ellacombe Church Road; two properties on Petitor Road were flooded internally; commercial premises on Fleet Street were flooded. [TAB] (p8)</p></div><div class="nugget-popup"><p>Within Torquay the Old Newton Road area experienced extensive highway flooding; one commercial property in that area reported internal flooding caused by floodwater following the vehicle access from the highway. (p9)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>37 properties internal flooding; 3 properties external flooding; 28 locations of highway flooding; covers to two manhole chambers replaced; 1 property in Ellacombe Church Road; 1 property in Lower Ellacombe Church Road [PAG] (p7)</p></div><div class="nugget-popup quant"><p>1 property (Ellacombe Church Road); 1 property (Lower Ellacombe Church Road); 2 properties (Petitor Road) [TAB] (p8)</p></div><div class="nugget-popup quant"><p>one commercial property (p9)</p></div></div></body></div>`)[0];
