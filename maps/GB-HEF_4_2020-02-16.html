                var html_6b1060be935be0d13db03dbdc5f02213 = $(`<div id="html_6b1060be935be0d13db03dbdc5f02213" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hereford</h1><div class="nugget-popup"><p>Areas of central Hereford &mdash; specifically the racecourse and the Widmarsh area &mdash; are shown as being within Flood Zone 3 (high probability of fluvial flooding). Proximity to Ayles Brook and low elevation contours (circa 56&ndash;60m) indicate susceptibility to river (fluvial) flooding; parts of the urban area benefit from flood defences but key infrastructure and built&ndash;up areas lie within the high&ndash;risk zone. [IMG] (p1)</p></div><div class="nugget-popup"><p>The Racecourse to Ledbury Road area of Hereford experienced fluvial and surface water flooding, resulting in internal flooding of residential properties; critical infrastructure impact included Holmer C of E Academy Primary School. [TAB,PAG] (p2)</p></div><div class="nugget-popup"><p>Central Hereford experienced fluvial flooding from the River Wye (backwater causing Widemarsh Brook to burst banks at Edgar Street Grid and Ledbury Road) and surface&ndash;water flooding where the Ayles Brook culvert and local drainage were overwhelmed (notably around Hereford Racecourse and Roman Road). Holmer C of E Academy Primary School is recorded as having flooded during February 2020. [PAG] (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>34 properties; 1 school (Holmer C of E Academy Primary School) identified as affected critical infrastructure [TAB,PAG] (p2)</p></div></div></body></div>`)[0];
