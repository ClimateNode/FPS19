                var html_29ee33e2a3725b950c5abb800bb41b5e = $(`<div id="html_29ee33e2a3725b950c5abb800bb41b5e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ayles Brook</h1><div class="nugget-popup"><p>Ayles Brook was identified as the source of fluvial flooding that contributed to internal flooding of properties in the 'Racecourse to Ledbury Road' area of Hereford. The brook drains into Widemarsh Brook and is culverted under the Racecourse and the A49; its flooding contributed to internal property flooding at depths reported from 1 ft up to 5 ft, with flood durations of about 1&ndash;2 days. Six respondents recorded outbuildings flooded to depths less than 6 inches. [PAG] (p2)</p></div><div class="nugget-popup"><p>Identified as the source of fluvial flooding for properties in Flood Zones 2 and 3. The Ayles Brook is culverted under Hereford Racecourse; the culvert has limited capacity and could not convey water beneath the A49, causing water to become overland flow and contribute to surface water flooding in the racecourse area and nearby streets. [PAG] (p3)</p></div><div class="nugget-popup"><p>Identified as a location requiring a feasibility study because of existing fluvial flood risk to properties; DEFRA grant funding bids are based on flood risk in this area. (p4)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>34 properties; 6 outbuildings; depths of 1 ft up to 5 ft; duration 1&ndash;2 days [PAG] (p2)</p></div></div></body></div>`)[0];

                var html_267c968d6ff5c677a6f6ed5af64939cc = $(`<div id="html_267c968d6ff5c677a6f6ed5af64939cc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hereford</h1><div class="nugget-popup"><p>Areas of central Hereford &mdash; specifically the racecourse and the Widmarsh area &mdash; are shown as being within Flood Zone 3 (high probability of fluvial flooding). Proximity to Ayles Brook and low elevation contours (circa 56&ndash;60m) indicate susceptibility to river (fluvial) flooding; parts of the urban area benefit from flood defences but key infrastructure and built&ndash;up areas lie within the high&ndash;risk zone. [IMG] (p1)</p></div><div class="nugget-popup"><p>The Racecourse to Ledbury Road area of Hereford experienced fluvial and surface water flooding, resulting in internal flooding of residential properties; critical infrastructure impact included Holmer C of E Academy Primary School. [TAB,PAG] (p2)</p></div><div class="nugget-popup"><p>Central Hereford experienced fluvial flooding from the River Wye (backwater causing Widemarsh Brook to burst banks at Edgar Street Grid and Ledbury Road) and surface&ndash;water flooding where the Ayles Brook culvert and local drainage were overwhelmed (notably around Hereford Racecourse and Roman Road). Holmer C of E Academy Primary School is recorded as having flooded during February 2020. [PAG] (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>34 properties; 1 school (Holmer C of E Academy Primary School) identified as affected critical infrastructure [TAB,PAG] (p2)</p></div></div></body></div>`)[0];
