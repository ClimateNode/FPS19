                var html_15b15f1a0ac9007d3ebcd2728539dcbd = $(`<div id="html_15b15f1a0ac9007d3ebcd2728539dcbd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Somerset</h1><div class="nugget-popup"><p>The heavy rainfall event on 2023&ndash;05&ndash;09 affected communities in the county, including the parish of Yeovilton where 29 properties were reported internally flooded (24 in Podimore and 5 in Bridgehampton). Flooding comprised a combination of pluvial (surface water) and fluvial (river) flooding across parts of the county in this locality. [IMG] (p7)</p></div><div class="nugget-popup"><p>On 2023&ndash;05&ndash;09 a rapid wave of water moved down the River Cam catchment (Cam Valley), sweeping through Yarlington, North Cadbury, South Cadbury, Blackford, Sparkford, Queen Camel, West Camel, Bridgehampton and Podimore. Several properties in the affected villages were partially submerged to at least 3 feet, some remained inundated for days. Numerous vehicles were written off and many residents (including elderly) had to temporarily relocate during home repairs. Church Farm flooded for the first time in 150 years; residents described a sudden 'gush' or 'tidal wave' of water passing down the catchment. Shepton Montague (Cattle Hill) recorded a sudden surge described as a 'tsunami.' (p33)</p></div><div class="nugget-popup"><p>Widespread heavy rainfall across Somerset on 9 May 2023 stretched Risk Management Authorities county&ndash;wide, resulting in multiple major incidents and thinly spread response resources. [PAG] (p34)</p></div><div class="nugget-popup"><p>The investigation area within Somerset experienced flooding on 9 May 2023. A combination of river flooding and surface&ndash;water flooding led to 29 properties reported flooded across the three communities in the report, with 24 of those properties in Podimore. [IMG,MUL] (p41)</p></div></div></body></div>`)[0];

                var html_ce86e6163776388a58a9cfdb08d5a28f = $(`<div id="html_ce86e6163776388a58a9cfdb08d5a28f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bridgehampton</h1><div class="nugget-popup"><p>Severe flooding on 9 May 2023: drains filled rapidly and inadequate attenuation exacerbated impacts; roads became impassable; properties were partially submerged and homes rendered unliveable for an extended period; vehicles were written off and some residents required temporary relocation. Part of the total of 29 reported properties affected in the event were in this locality. (p5)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties: 5 residential properties were internally flooded as a result of the combined surface water (pluvial) and river (fluvial) flooding affecting Bridgehampton on 9 May 2023. [TAB] (p7)</p></div><div class="nugget-popup"><p>On 2023&ndash;05&ndash;09 ditches and an attenuation pond north of the village overtopped and a flood barrier failed. Floodwater inundated the road and houses south of the road; the main bridge was overtopped making the village impassable. Almost all properties in the area were affected and some homes were unliveable for a significant period; roads became impassable to vehicles. [PAG,IMG,MUL] (p30)</p></div><div class="nugget-popup"><p>Recorded a noticeable 'gush' / sudden rush of water passing down the River Cam catchment through the day on 9 May, indicating fluvial flooding affected the community. (p33)</p></div><div class="nugget-popup"><p>Exceptional rainfall on 2023&ndash;05&ndash;09 overwhelmed drainage in Bridgehampton, inundating properties. Drains filled rapidly and inadequate attenuation exacerbated flooding. Roads became impassable, homes were unliveable for an extended period, properties were partially submerged, vehicles were written off, and some residents were temporarily relocated. (p38)</p></div></div></body></div>`)[0];

                var html_4839bbd4e1ec1495865779b597fd4754 = $(`<div id="html_4839bbd4e1ec1495865779b597fd4754" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Podimore</h1><div class="nugget-popup"><p>Severe flooding on 9 May 2023 affecting the locality: drains filled rapidly and inadequate attenuation exacerbated impacts; roads became impassable; properties were partially submerged and homes rendered unliveable for an extended period; vehicles were written off and some residents required temporary relocation. Part of the total of 29 reported properties affected in the event were in this locality. (p5)</p></div><div class="nugget-popup"><p>On 9 May 2023, 24 residential properties in Podimore were internally flooded. Flooding followed heavy rainfall and a combination of pluvial and fluvial processes investigated in the report. [TAB] (p7)</p></div><div class="nugget-popup"><p>On 2023&ndash;05&ndash;09 water began flowing into the village from fields east of Church Street (around midnight), carrying waste material from corn/maize fields. The most severe flooding occurred between 03:00 and 04:00 on 2023&ndash;05&ndash;09, with water entering properties, following road and open&ndash;space pathways, and converging southeast through the village. [PAG,IMG,MUL] (p31)</p></div><div class="nugget-popup"><p>Overnight runoff from adjacent maize fields and overflow from the road and surrounding fields led to rapid inundation beginning around midnight and peaking between 03:00 and 04:00 on 2023&ndash;05&ndash;09. Water entered houses around Lower Farm Meadows at both front and rear, encircling properties. Several properties were partially submerged to depths of around 3 feet, with some remaining inundated for days. Vehicular movement through the village was severely restricted; numerous vehicles were written off. Many residents (including elderly people) were temporarily displaced during home renovations. Floodwater carried waste material from corn fields and bow waves from vehicles worsened property flooding. [IMG,MUL] (p32)</p></div><div class="nugget-popup"><p>Experienced a sudden rush of water passing down the catchment on 9 May; standing water was present on 10 May such that officers could not visit all houses. Community reported feeling abandoned by responders; local actions and a point of contact were established following the visit. (p33)</p></div><div class="nugget-popup"><p>Exceptional rainfall on 2023&ndash;05&ndash;09 overwhelmed drainage and attenuation, inundating properties in Podimore. Drains filled rapidly, roads became impassable, homes were rendered unliveable for an extended period, properties were partially submerged, some vehicles were written off, and residents required temporary relocation. (p38)</p></div><div class="nugget-popup"><p>Experienced unusually severe internal property flooding on 9 May 2023 at levels not previously recorded. After the event residents reported the village has flooded more frequently since May 2023, possibly due to increased silt in drains and changes to A303 runoff; roads and properties required clean&ndash;up following the flood; a reservoir at the base of the A303 bridge filled and flowed back toward a T&ndash;junction. [MUL] (p39)</p></div><div class="nugget-popup"><p>Blocked/choked drainage (reported as the ditch/drainage from the A303) contributed to surface water flooding and impeded drainage of runoff. [MUL] (p41)</p></div><div class="nugget-popup"><p>24 properties reported flooded in Podimore (24 of 29 properties reported flooded across the three communities). (p42)</p></div></div></body></div>`)[0];
