                var html_92aa264b2c2ccab365cfc8dddeb57902 = $(`<div id="html_92aa264b2c2ccab365cfc8dddeb57902" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Norwich Road, Halesworth</h1><div class="nugget-popup"><p>Shallow surface water (approximately 0.15 m) entered one property at the roadside edge of Norwich Road. The road experienced deeper flooding with depths of approximately 0.15&ndash;0.3 m. (p2)</p></div><div class="nugget-popup"><p>Runoff accumulates at the lowest elevation of Norwich Rd (A144) causing ponding that overtops the highway drop kerb and enters adjacent residential buildings, producing localised internal and external flooding. Highway interception measures can be overwhelmed during high&ndash;intensity storms and the system is sensitive to maintenance levels. [MUL] (p3)</p></div><div class="nugget-popup"><p>Blocked local watercourses and heavily silted highway drainage caused overloading of road drainage on Norwich Road; persistent rainfall and high&ndash;intensity events inundated local depressions, flood depths topped the footway kerb and ran into property; highway drainage outfalls were unable to discharge and car movements forced water out of the highway. (p4)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property; road flooding depth 0.15&ndash;0.3 m; shallow internal flood depth 0.15 m (p2)</p></div><div class="nugget-popup quant"><p>1 property internally affected [MUL] (p3)</p></div></div></body></div>`)[0];
