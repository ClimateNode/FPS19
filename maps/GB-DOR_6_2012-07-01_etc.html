                var html_dd54a18134387c4f1295417e16c7aedc = $(`<div id="html_dd54a18134387c4f1295417e16c7aedc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River South Winterbourne</h1><div class="nugget-popup"><p>Heavy rainfall and a rapid 9.7 m rise in groundwater (7&ndash;9 July 2012) increased flow in the South Winterbourne, causing river levels to exceed channel capacity along much of its length, flooding at channel restrictions and producing overland flow and spring emergence that affected properties and infrastructure. (p23)</p></div><div class="nugget-popup"><p>The river experienced coincident increases in flow and stage during the early July 2012 groundwater rise, with a pronounced peak in early July. [PAG] (p27)</p></div><div class="nugget-popup"><p>Received augmentation discharges from Wessex Water and reportedly very large volumes of water (including from a released reservoir), increasing flows in the watercourse and contributing to downstream flooding of properties. [PAG] (p29)</p></div><div class="nugget-popup"><p>The South Winterbourne experienced episodic very high flows in 2012 that coincided with flood events: a sharp spike in mean daily flow in July 2012 associated with the July 2012 flood, and further elevated peaks in November 2012 and December 2012. [IMG,PAG,MUL] (p30)</p></div><div class="nugget-popup"><p>During the July 2012 event groundwater volumes and pressure were very high, with groundwater emerging through concrete floors in the area. In November 2012 river levels rose (the report notes the river level rise during that event); the Wessex Water augmentation was suspended before the November river rise and did not contribute to that flooding. [MUL] (p31)</p></div><div class="nugget-popup"><p>The South Winterbourne channel has limited capacity through the study area, which was identified as a key contributor to fluvial flooding risk affecting the local villages; blockages (including low bridges and other permanent obstructions) increase upstream flood risk and constrained channel alignment (by properties and the road) limits options for widening or diversion. [PAG,MUL] (p34)</p></div><div class="nugget-popup"><p>The South Winterbourne watercourse alongside the A35 is identified for annual clearance and investigation of highway drainage discharge because it receives highway runoff and is a key feature in the local flood pathway associated with the July 2012 overland flooding. (p43)</p></div><div class="nugget-popup"><p>Extreme high flows in the South Winterbourne watercourse during 6&ndash;8 July 2012 led to overtopping of the watercourse and contributed to flooding of downstream properties; the event was driven by an extreme rise in groundwater and the watercourse remained at elevated flows contributing to further flooding in November and December 2012. [MUL] (p46)</p></div><div class="nugget-popup"><p>The South Winterbourne watercourse was central to the investigation; community management and maintenance were proposed to reduce flood risk, and household&ndash;level measures were recommended to protect properties against groundwater, surface water and fluvial flooding affecting the villages served by the catchment. [PAG,MUL] (p47)</p></div><div class="nugget-popup"><p>Conveyance through the village was poor with risk of blockage at numerous small bridges and along the watercourse; surface water from the north of the B3159 was entering the South Winterbourne due to drainage/road camber issues. Report recommends alterations to bridges, improved drainage connections and road camber to reduce blockage risk and improve conveyance of surface water into the watercourse. [PAG,MUL] (p48)</p></div><div class="nugget-popup"><p>The watercourse overflowed and caused flooding to downstream properties; residents raised concerns about an augmentation discharge by Wessex Water around the July 2012 floods and numerous WW tankers operating downstream were reported. Flooding severely affected three properties in the South Winterbourne area, which remained unoccupied six months after the event; flows were diverted to a rear sump and pumped into the channel during the event. [PAG] (p76)</p></div><div class="nugget-popup"><p>During the July 2012 flood event residents reported very large volumes of water entering the South Winterbourne associated with a Wessex Water augmentation discharge and rumours of a reservoir release; Wessex Water tankers were observed operating downstream of the watercourse. [PAG] (p77)</p></div><div class="nugget-popup"><p>The South Winterbourne stream experienced very high flows associated with the extreme rainfall in June/July 2012. Groundwater emergence through the South Winterbourne valley and high flows contributed to flooding of the villages; an agreement exists to suspend Wessex Water discharges to the stream when flow exceeds 400 l/s. [PAG] (p78)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>9.7 m rise in groundwater; flood waters remained high for approximately two weeks (p23)</p></div><div class="nugget-popup quant"><p>Peak flow at gauging location 1.33 m3/s on 08/07/2012 (highest recorded in the record). [PAG] (p27)</p></div><div class="nugget-popup quant"><p>peak flow just below 1.4 m3/s in July 2012; secondary peak just below 1.0 m3/s in December 2012 [IMG,PAG,MUL] (p30)</p></div><div class="nugget-popup quant"><p>3 properties [PAG] (p76)</p></div><div class="nugget-popup quant"><p>flow threshold 400 l/s (suspension of discharge) [PAG] (p78)</p></div></div></body></div>`)[0];

                var html_f8428f8f0dfb33e46680c100f9c01b8e = $(`<div id="html_f8428f8f0dfb33e46680c100f9c01b8e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Steepleton Water, Winterbourne Steepleton</h1><div class="nugget-popup"><p>Residents in the Steepleton Water area reported surface runoff from the A35 spilling across properties; existing drainage was not maintained and proved inadequate to manage the large flows during the July 2012 flood. [PAG] (p76)</p></div></div></body></div>`)[0];

                var html_117078324ea40e8d92660e6b16dad9e9 = $(`<div id="html_117078324ea40e8d92660e6b16dad9e9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Martinstown</h1><div class="nugget-popup"><p>The village experienced incidences of flooding which prompted an investigation to understand causes and identify possible flood alleviation measures. [MUL] (p8)</p></div><div class="nugget-popup"><p>Properties were flooded as groundwater emerged through springs and from overland flow and drainage backup/overflow caused by the elevated groundwater and river levels. (p23)</p></div><div class="nugget-popup"><p>Surface water runoff from surrounding hills, groundwater emerging from springs and fluvial overflow caused overland flows through the village. Restricted channel capacity from low bridges and lack of watercourse maintenance increased flooding. Vehicles on the B3159 generated bow&ndash;waves that pushed floodwater above thresholds and into properties. (p29)</p></div><div class="nugget-popup"><p>During the July 2012 flood event bow waves from traffic along the B3159 through Martinstown exacerbated flood impacts; impacts were increased by diverted traffic following the A35 closure. [TAB] (p37)</p></div><div class="nugget-popup"><p>Properties were flooded during the 6&ndash;8 July 2012 event due to an extreme rise in groundwater causing groundwater emergence into properties and high watercourse flows causing overtopping; the persistently high groundwater led to additional flooding in November and December 2012. [MUL] (p46)</p></div><div class="nugget-popup"><p>Areas of inadequate surface water drainage were identified and improvement works are recommended to reduce local flood risk. [PAG,MUL] (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>42 properties (combined across Winterbourne Abbas, Winterbourne Steepleton and Martinstown) (p23)</p></div><div class="nugget-popup quant"><p>20 properties (combined Martinstown and Winterbourne Monkton) (p29)</p></div><div class="nugget-popup quant"><p>42 properties (combined across Winterbourne Abbas, Winterbourne Steepleton and Martinstown) [MUL] (p46)</p></div></div></body></div>`)[0];

                var html_cd077756483ec627a77d5c2a4a01958c = $(`<div id="html_cd077756483ec627a77d5c2a4a01958c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Winterbourne Steepleton</h1><div class="nugget-popup"><p>The village experienced incidences of flooding which prompted an investigation to understand causes and identify possible flood alleviation measures. [MUL] (p8)</p></div><div class="nugget-popup"><p>Historic episodes of flooding reported (e.g. 14 April 1936 parish records) where the river overflowed into the upper pond and caused storm flows down the main road, flooding the road between Boxen Hedge Farm and Dairy House and posing danger to children; accounts are similar to residents' reports after the 2012 floods. [PAG,MUL] (p18)</p></div><div class="nugget-popup"><p>Properties were flooded due to spring emergence of groundwater beneath properties and overland flow/drainage backup associated with the high groundwater and river levels. (p23)</p></div><div class="nugget-popup"><p>Eight properties flooded in the July 2012 event; some of these properties were flooded again in November and December 2012. Flooding resulted from direct groundwater emergence, overland flow from groundwater emerging outside properties, and fluvial flooding due to overtopping of the watercourse. Restricted watercourse capacity and proximity of properties increased vulnerability. [MUL] (p28)</p></div><div class="nugget-popup"><p>The village is identified as one of the affected villages where properties experienced fluvial and groundwater&ndash;related flooding; the report notes potential to utilise existing disused channels in Winterbourne Steepleton for localised secondary channel works to reduce flood risk. [MUL] (p34)</p></div><div class="nugget-popup"><p>During the July 2012 flood event bow waves from traffic moving along the B3159 through the village exacerbated flooding impacts; this was worsened when the A35 was closed and traffic was diverted through the village. [TAB] (p37)</p></div><div class="nugget-popup"><p>Properties were flooded during the 6&ndash;8 July 2012 event as rising groundwater emerged into and around buildings (including through floors/basements and via doorways) and high flows caused overtopping; continued high groundwater produced further flooding in November and December 2012. [MUL] (p46)</p></div><div class="nugget-popup"><p>Alterations to the watercourse are recommended to reduce blockage risk and improve conveyance; works to channel structures to lower local river levels and reuse of the mill leat/secondary channels were proposed to reduce local flooding and downstream risk from blockages at small bridges. [MUL] (p47)</p></div><div class="nugget-popup"><p>Surface runoff from the A35 spilled across properties due to inadequate/unmaintained drainage; severe flooding impacted three properties in the South Winterbourne area (flows diverted to a sump and pumped to the watercourse), with those properties still unoccupied six months after the event. [PAG] (p76)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>42 properties (combined across Winterbourne Abbas, Winterbourne Steepleton and Martinstown) (p23)</p></div><div class="nugget-popup quant"><p>8 properties [MUL] (p28)</p></div><div class="nugget-popup quant"><p>42 properties (combined across Winterbourne Abbas, Winterbourne Steepleton and Martinstown) [MUL] (p46)</p></div><div class="nugget-popup quant"><p>3 properties [PAG] (p76)</p></div></div></body></div>`)[0];

                var html_35646c17e4e664e1210800e1ab6cd033 = $(`<div id="html_35646c17e4e664e1210800e1ab6cd033" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Winterbourne Abbas</h1><div class="nugget-popup"><p>The village experienced incidences of flooding which prompted an investigation to understand causes and identify possible flood alleviation measures. [MUL] (p8)</p></div><div class="nugget-popup"><p>Historical records (parish records referenced in the report) indicate instances of flooding in the village; accounts are described as consistent with groundwater and surface&ndash;water flooding and similar to those given after the 2012 floods. (p18)</p></div><div class="nugget-popup"><p>Properties were flooded when groundwater emerged through springs beneath properties and by overland flow and drainage backup/overflow resulting from the high groundwater and river levels. (p23)</p></div><div class="nugget-popup"><p>Fourteen properties suffered internal flooding in July 2012 from overland surface water flow and direct groundwater emergence. Flooding north of the A35 was perceived to be linked to damaged drainage beneath the highway. The A35 was closed for several days due to flooding. Residents reported surcharging of foul and surface water drainage and emergence from utility access chambers. Overland flow from hills also flowed across the Little Chef car park and caused flooding to Valley Cottages; properties at the A35/B3159 junction were affected by overland flow and by the watercourse exceeding capacity. (p28)</p></div><div class="nugget-popup"><p>During the July 2012 event groundwater volumes and pressure were very high, with groundwater emerging through concrete floors in Winterbourne Abbas. (p31)</p></div><div class="nugget-popup"><p>Suffered flooding in July 2012 and further flooding in November 2012 and December 2012 due to sustained high groundwater levels; Wessex Water infrastructure at Winterbourne Abbas had no discharge via its consented outfall during the July 2012 event. [MUL] (p32)</p></div><div class="nugget-popup"><p>In the July 2012 event overland flow crossed the hills in the south&ndash;west of the village, flowed across the Little Chef car park and flooded properties in Valley Cottages; temporary sandbagging was used as alleviation. (p43)</p></div><div class="nugget-popup"><p>Properties were flooded during the 6&ndash;8 July 2012 event when an extreme rise in groundwater resulted in groundwater emerging through floors and basements and entering properties, and very high watercourse flows caused overtopping; groundwater remained high leading to additional flooding in November and December 2012. [MUL] (p46)</p></div><div class="nugget-popup"><p>Surface water and highway drainage were inadequate causing localised flooding risk; recommendations include investigating drainage connections north of the A35, improving maintenance of surface water/highway drains and considering a permanent flood barrier at the Little Chef car park to direct overland flow into the watercourse. [MUL] (p47)</p></div><div class="nugget-popup"><p>During the July 2012 event residents reported surface runoff (including from the A35) and poor or blocked surface&ndash;water drainage/gulls leading to runoff spilling across properties and reduced channel capacity; these drainage failures contributed to flooding in the village. Residents also reported concerns about an augmentation discharge and tankers operating downstream around the July 2012 floods. [PAG] (p76)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>42 properties (combined across Winterbourne Abbas, Winterbourne Steepleton and Martinstown) (p23)</p></div><div class="nugget-popup quant"><p>14 properties (p28)</p></div><div class="nugget-popup quant"><p>42 properties (combined across Winterbourne Abbas, Winterbourne Steepleton and Martinstown) [MUL] (p46)</p></div></div></body></div>`)[0];
                popup_5ed89353e1a2e3e2c34fceed07c2ea1c.setContent(html_35646c17e4e664e1210800e1ab6cd033);

                var html_6997c7a22c0f332c7e862dc9581902ba = $(`<div id="html_6997c7a22c0f332c7e862dc9581902ba" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Long Bredy</h1><div class="nugget-popup"><p>Experienced groundwater&ndash;related flooding in July 2012 (noted as the worst since 1955) and further flooding in November 2012 and December 2012 as groundwater levels remained high; the village remained on extended flood alert periods. [MUL] (p32)</p></div><div class="nugget-popup"><p>Residents reported rumours that the below&ndash;ground Wessex Water reservoir at Long Bredy was 'let go' during the July 2012 flood, resulting in very large volumes of water entering the South Winterbourne; a large number of Wessex Water tankers were observed operating downstream of the watercourse. (p77)</p></div></div></body></div>`)[0];
