                var html_eff409045428ad28afe9b3e400e8c4b7 = $(`<div id="html_eff409045428ad28afe9b3e400e8c4b7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Anchorsholme Pumping Station</h1><div class="nugget-popup"><p>The pumping station reached capacity during the extreme rainfall on the night of 22nd November 2017. Pumps were called into duty sequentially as flows arriving from the tunnel rose; the station operated at capacity and could not reduce tunnel levels earlier because pumping only starts once tunnel levels exceed the start height. (p5)</p></div><div class="nugget-popup"><p>High flows arriving at the station triggered sequential automatic activation of pumps; on the evening of 22nd November and during 23rd November the station automatically called the remaining two pumps into service to manage storm&ndash;water. Pump five experienced intermittent tripping during the evening of 22nd November. [PAG,MUL] (p6)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 pumps (p5)</p></div><div class="nugget-popup quant"><p>two pumps called into service on the evening of 22nd November; five pumps at the station (total) [PAG,MUL] (p6)</p></div></div></body></div>`)[0];

                var html_95a47cacef17c2a00850d5acc788835e = $(`<div id="html_95a47cacef17c2a00850d5acc788835e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Blackpool</h1><div class="nugget-popup"><p>Widespread surface&ndash;water flooding reported across the Blackpool and Lancashire area on 22 November 2017, affecting multiple streets and local communities. (p3)</p></div><div class="nugget-popup"><p>Town&ndash;wide flooding on 22 Nov 2017 affecting multiple streets and infrastructure: specific locations named include Limerick Road and Lockhurst Avenue; major flooding under Devonshire Road Bridge (road closure); Anchorsholme Academy was flooded. The report attributes the flooding to an exceptionally severe storm that overwhelmed highway drainage and sewers. [IMG,PAG] (p4)</p></div><div class="nugget-popup"><p>The sewer/tunnel system serving Blackpool was operating at full storage capacity during prolonged rainfall from 20 November and the sequential operation of pumping stations culminated in extreme conditions on the night of 22 November 2017. (p5)</p></div><div class="nugget-popup"><p>Widespread property&ndash;level flooding across the borough: council data recorded property&ndash;level flooding affecting properties and garages; roads and highways were flooded and in parts impassable. Water entered properties (often under the floor), sandbags were ineffective, some properties experienced electrical disruption. Water was recorded to have receded from affected properties during the morning of 23rd November 2017. (p7)</p></div><div class="nugget-popup"><p>Areas of Blackpool experienced flooding on 22 November 2017 prompting a Section 19 investigation; specific properties (notably on Valentia Road and Limerick Road) were identified for potential flood resilience measures; actions proposed include watercourse clearance, surface water management measures and partnership works to improve storage and flow in local brooks. (p9)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 300 properties (Blackpool and Lancashire) (p3)</p></div><div class="nugget-popup quant"><p>approximately 300 properties [IMG,PAG] (p4)</p></div><div class="nugget-popup quant"><p>74 properties; 6 garages; road flooding up to 1 m deep at Valentia Road and Limerick Road; highway depths around 500 mm in East Anchorsholme (p7)</p></div></div></body></div>`)[0];

pumps were operating intermittently on the evening of 22nd November. (p8)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 pumps at Anchorsholme Pumping Station (p5)</p></div><div class="nugget-popup quant"><p>500 mm highway depth in East Anchorsholme (p7)</p></div></div></body></div>`)[0];
