                var html_81f4e95f41027071fedb98939e4c02c8 = $(`<div id="html_81f4e95f41027071fedb98939e4c02c8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lustrum Beck</h1><div class="nugget-popup"><p>The (Lustrum) Beck is listed in the Cleveland&ndash;area impacts (Section 3.3.2). It experienced flooding during the Winter 2015&ndash;16 event and is discussed in the report in relation to local flood impacts. (p3)</p></div><div class="nugget-popup"><p>Flooding from Lustrum Beck has led to elevated river levels and overtopping that caused property flooding and localised surface&ndash;water flooding. Historical peak levels were recorded (June 2000; November 2000) with November 2000 specifically associated with flooding at Hartburn Avenue. The highest recorded peak was in September 2012 when flooding from a combination of overtopping from the beck and surface water caused reports of properties flooding. During the Storm Eva event (25&ndash;26 December) flood warnings were issued for the Lustrum Beck but no properties were reported flooded and temporary defences in the Brown's Bridge area remained dry. [MUL] (p50)</p></div><div class="nugget-popup"><p>Lustrum Beck is specifically mentioned as part of the low&ndash;lying land in the Lower Tees valley included in the TA and listed under the Storm (5&ndash;6 January 2016), indicating the beck and adjacent areas experienced flooding during the event. (p56)</p></div><div class="nugget-popup"><p>Lustrum Beck overtopped/caused flooding that inundated properties and low&ndash;lying land in Newtown and Oxbridge. Properties adjacent to the Beck were affected, including Hartburn Avenue, Burnside Grove, Oxbridge Lane, Wrensfield Road, Primrose Hill Industrial Estate, Bedford Street and Bishopton Road; streets leading from Wrensfield Road and local facilities (North Shore Academy) were also reported in the affected area. (p61)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 617 properties at risk; 77 reports of property flooding [MUL] (p50)</p></div></div></body></div>`)[0];

report. [TAB] (p52)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>33 properties (8 January 2005) [PAG,MUL] (p27)</p></div><div class="nugget-popup quant"><p>68 properties (64 residential, 4 business) (p28)</p></div></div></body></div>`)[0];

                var html_28486a382cdf3a725a380139d29252de = $(`<div id="html_28486a382cdf3a725a380139d29252de" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Tyne</h1><div class="nugget-popup"><p>High river flows caused overtopping of flood defences at The Stanners (Corbridge), prompting 2 Severe Flood Warnings (River Tyne at Corbridge and at Wellbank Riverside); flood banks at Corbridge were damaged and required emergency repairs. (p5)</p></div><div class="nugget-popup"><p>The River Tyne experienced river flooding during Storm Desmond (5&ndash;6 Dec 2015), producing record or exceptional peak levels at multiple gauges in the catchment. [TAB,MUL] (p9)</p></div><div class="nugget-popup"><p>The River Tyne (Tyne) rose and caused flooding impacts in Hexham, including entry into Tyne Green via an underpass and overtopping at Bridge End that led to property and business flooding. [TAB,MUL] (p24)</p></div><div class="nugget-popup"><p>The River Tyne caused flooding at Corbridge: during Storm Desmond (5&ndash;6 December 2015) the flood wall at The Stanners began to overtop (~15:00 on 5 Dec) and by 17:45 on 5 Dec four properties at Wellbank Riverside had flooded; water later rose rapidly (reported rise from knee to waist at ~21:00). Earlier event on 8 January 2005 (4.25m @ Corbridge) saw 4 properties flood at Wellbank and 33 properties flood on the right bank at The Stanners and Station Road due to embankment breach/overtopping. On 15 November 2015 flood water reached the property thresholds of Cornwell House and Tynevale at Wellbank Riverside (no internal property flooding reported on that date). [PAG,MUL] (p27)</p></div><div class="nugget-popup"><p>High River Tyne levels led to overtopping of flood defences at Corbridge on 5 December 2015, prevented discharge from the dry side evacuation pipe/outfall (causing ponding), and caused properties at Wellbank Riverside and in the Well Bank and Stanners areas to flood. The River Tyne was also implicated in the 26 December 2015 event when properties at Wellbank Riverside flooded. [MUL] (p28)</p></div><div class="nugget-popup"><p>The River Tyne backed up the Riding Mill / March Burn tributary, causing flooding of properties and gardens in Riding Mill (listed properties flooded and garden inundation). [PAG] (p31)</p></div><div class="nugget-popup"><p>River Tyne flooding during Storm Desmond (5&ndash;6 Dec 2015) caused widespread flooding in the area: overtopping and breaching of the Bywell flood bank, flooding of at least 6 properties at Bywell (including Bywell Hall cellar, Bywell Lodge and nos. 1&ndash;4 Bywell House), and contributed to a total of at least 47 properties known to have flooded at Bywell, Ovingham and Low Prudhoe. [TAB] (p32)</p></div><div class="nugget-popup"><p>River Tyne levels overtopped defences and flowed into adjacent channels and low&ndash;lying areas, causing widespread flooding, bank overtopping and backflow into tributaries (notably Whittle Burn and Park Burn) that led to property and business flooding. [PAG] (p33)</p></div><div class="nugget-popup"><p>River Tyne caused fluvial flooding that affected communities and properties along the valley reported in the tables (for example Hexham, Low Prudhoe and other locations). [TAB] (p52)</p></div><div class="nugget-popup"><p>River experienced river flooding associated with the Storm of 5&ndash;6 January 2016; specifically referenced in the TA description ('The River Tyne from Hexham to Wylam and its tributaries'). [PAG] (p56)</p></div><div class="nugget-popup"><p>River Tyne at Wellbank Riverside (Corbridge) is associated with properties and low&ndash;lying areas around Wellbank and St. Andrews Terrace being affected by flooding. [PAG] (p58)</p></div><div class="nugget-popup"><p>River Tyne flooding during the Storm of 5&ndash;6 January 2016 affected low&ndash;lying areas and properties at Wellbank Riverside (Corbridge) and at Bywell and Prudhoe, inundating properties and surrounding low&ndash;lying land. (p62)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 Severe Flood Warnings (p5)</p></div><div class="nugget-popup quant"><p>34.843 mAOD (Hexham); 5.759 m (Corbridge); 5.991 m (Riding Mill); 6.959 m (Bywell) [TAB,MUL] (p9)</p></div><div class="nugget-popup quant"><p>Approximately 13 residential properties and 31 businesses flooded; other site&ndash;level impacts as reported for River Tyne [TAB,MUL] (p24)</p></div><div class="nugget-popup quant"><p>4 properties at Wellbank Riverside (5 December 2015); 4 properties flooded at Wellbank (8 January 2005); 33 properties flooded on the right bank at The Stanners and Station Road (8 January 2005) [PAG,MUL] (p27)</p></div><div class="nugget-popup quant"><p>68 properties (64 residential, 4 business); 4 properties; 3 properties [MUL] (p28)</p></div><div class="nugget-popup quant"><p>5 properties; 2 gardens (3 and 4 Burnside) [PAG] (p31)</p></div><div class="nugget-popup quant"><p>at least 47 properties; 6 properties (Bywell) [TAB] (p32)</p></div><div class="nugget-popup quant"><p>6 properties flooded at Bywell; 16 properties flooded in Ovingham; at least 18 business premises flooded at Low Prudhoe Industrial Estate; 6 chalets and 1 static caravan destroyed at Ferry Landing Holiday Park [PAG] (p33)</p></div></div></body></div>`)[0];

                var html_5823139fa162a9d41131d50188f5a27f = $(`<div id="html_5823139fa162a9d41131d50188f5a27f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River North Tyne</h1><div class="nugget-popup"><p>Peak river levels on the North Tyne associated with Storm Desmond were recorded at multiple gauges, several reaching their highest on record, indicating significant river flooding on the North Tyne and its tributaries. [TAB,MUL] (p9)</p></div><div class="nugget-popup"><p>River North Tyne overtopped or contributed to surface water flooding on multiple occasions: caused flooding of a cellar at Riverside on Boat Lane (Bellingham) during the Storm Desmond event (5 Dec 2015); flows came out of bank at Falstone and flowed towards local recreational areas; river levels were associated with historical flooding including a recorded flood event on 8 January 2005 that coincided with one property flooding at Chollerford; river levels were reported close to entering properties such as Barrasford Mill (within 10cm). [PAG,MUL] (p15)</p></div><div class="nugget-popup"><p>River North Tyne caused flooding that inundated the cellar of the property 'Riverside' on Boat Lane; it came very close to entering the property at Barrasford Mill (wrack marks showed proximity) and contributed to flows that entered the garden of Haughton Mill. [PAG] (p16)</p></div><div class="nugget-popup"><p>Listed as an affected catchment in the report and identified as experiencing river (fluvial) flooding during Storm 5&ndash;6 January 2016. [PAG] (p56)</p></div><div class="nugget-popup"><p>River flooding affected the River North Tyne and its tributaries; the report includes the North Tyne from source to its confluence with the Tyne as impacted. (p57)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Reported peak levels on North Tyne gauges: Ugly Dub 2.573 m (05/12/2015, rank 1), Falstone 3.338 m (05/12/2015, rank 1), Bellingham 3.83 m (05/12/2015, rank 1), Reaverhill 5.072 m (06/12/2015, rank 1), Chollerford 3.403 m (05/12/2015, rank 1). [TAB,MUL] (p9)</p></div><div class="nugget-popup quant"><p>1 cellar flooded (Riverside on Boat Lane, 5 Dec 2015); two other properties affected by surface water (Bellingham, 5 Dec 2015); 1 property flooded at Chollerford (8 January 2005) [PAG,MUL] (p15)</p></div><div class="nugget-popup quant"><p>1 property cellar flooded (Riverside on Boat Lane); 1 property at Barrasford Mill within 10 cm; garden of 1 property (Haughton Mill) entered; 1 m distance from Haughton Mill property [PAG] (p16)</p></div></div></body></div>`)[0];

                var html_71fc3f84e12e53ac7a4375c39c7b4e94 = $(`<div id="html_71fc3f84e12e53ac7a4375c39c7b4e94" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River South Tyne</h1><div class="nugget-popup"><p>Multiple gauges on the South Tyne recorded peak river levels associated with Storm Desmond, indicating river flooding on the South Tyne. [TAB] (p9)</p></div><div class="nugget-popup"><p>The river burst its banks at Haltwhistle during Storm Desmond (5&ndash;6 December 2015), contributing to internal flooding of two properties. It remained in bank at Eals but caused considerable erosion and produced wrack marks at Slaggyford indicating it had come out of bank in places. [PAG] (p17)</p></div><div class="nugget-popup"><p>The river came out of bank in places causing overtopping, inundation of adjacent fields and roads and flooding of properties (Haydon Bridge, Lipwood, Middle Lipwood, Brigwood). It also caused considerable erosion at Eals where the river remained in bank. The river overtopped upstream of the railway bridge on 5 December 2015, filling adjacent fields then overtopping onto the A69 and into nearby properties. [PAG,MUL] (p18)</p></div><div class="nugget-popup"><p>Flooding of properties in Warden during the December 2015 event (Flood Alert issued 04 Dec 2015; Flood Warning 05 Dec 2015). The river flood caused properties on both left and right banks to flood; earlier high flows/breach on 8 Jan 2005 also caused widespread flooding at Warden/Hardhaugh. [MUL] (p21)</p></div><div class="nugget-popup"><p>River experienced river flooding associated with the Storm of 5&ndash;6 January 2016; listed in the report as an affected watercourse. (p56)</p></div><div class="nugget-popup"><p>River South Tyne caused flooding of properties and low&ndash;lying areas around Slaggyford and Lambley; named affected places include Lake House, Knarburn Cottage, Eals Village and Waughold Holme. (p58)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Alston 2.472 mStage (rank 5, 40 yrs); Featherstone 2.462 mStage (rank 3, 51 yrs); Haltwhistle 3.27 mStage (rank 2, 17 yrs); Haydon Bridge 4.646 mStage (rank 2, 49 yrs); Warden Bridge End 5.71 mStage (rank 1, 10 yrs) [TAB] (p9)</p></div><div class="nugget-popup quant"><p>2 properties [PAG] (p17)</p></div><div class="nugget-popup quant"><p>at least 35 properties flooded at Haydon Bridge and Lipwood (5 December 2015); 23 properties flooded at Haydon Bridge (8 January 2005); 6 properties flooded at Middle Lipwood including Lipwood Well, Middle Lipwood Cottage and Middle Lipwood Farm (5 December 2015); 2 residential properties flooded at Brigwood (The Haughs 500mm deep and The Marton) [PAG,MUL] (p18)</p></div><div class="nugget-popup quant"><p>8 residential properties; 9 businesses; 23 properties [MUL] (p21)</p></div></div></body></div>`)[0];

"><p>4.646 mStage; rank 2 in record; record length 49 years [TAB] (p9)</p></div><div class="nugget-popup quant"><p>40 residential properties; 4 commercial properties; total 44 properties [TAB] (p12)</p></div><div class="nugget-popup quant"><p>23 properties flooded at Haydon Bridge (8 January 2005); at least 35 properties flooded at Haydon Bridge and Lipwood (5 December 2015); 9 properties affected by surface water (5 December 2015) [TAB,MUL] (p18)</p></div><div class="nugget-popup quant"><p>6 residential properties; 1 inch; 4 inches [IMG] (p20)</p></div><div class="nugget-popup quant"><p>4 businesses; 40 residences; 44 total addresses [TAB] (p52)</p></div></div></body></div>`)[0];

                var html_1cae605454efbd1361cb19ab3a5a999c = $(`<div id="html_1cae605454efbd1361cb19ab3a5a999c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Corbridge</h1><div class="nugget-popup"><p>Affected by winter flooding associated with the Winter Flooding 2015&ndash;16 event. (p3)</p></div><div class="nugget-popup"><p>Sustained significant impacts: flood defences at The Stanners overtopped, causing a significant risk to life and infrastructure; flood banks at Corbridge were damaged by Storm Desmond and required emergency repairs; some properties (Wellbank area) flooded on more than one occasion during the winter. [MUL] (p5)</p></div><div class="nugget-popup"><p>The Corbridge gauge on the Tyne recorded a peak river level associated with Storm Desmond, the highest in its record. [TAB] (p9)</p></div><div class="nugget-popup"><p>Properties in Corbridge were flooded during the winter events; a small number of properties in Corbridge flooded more than once during the named storms. [TAB] (p12)</p></div><div class="nugget-popup"><p>Corbridge was affected by river flooding during Storm Desmond (5&ndash;6 December 2015) with Severe Flood Warnings issued, local flood defences expected to be overtopped, police evacuation requests, and property flooding at Wellbank Riverside; there was also renewed flooding at Wellbank on 26 December 2015. [PAG,MUL] (p27)</p></div><div class="nugget-popup"><p>Severe Flood Warnings were issued for Corbridge on 5 December 2015 because flood defences were expected to be significantly overtopped. A police&ndash;led evacuation of residents was started. A total of 68 properties (64 residential, 4 business) flooded in the Well Bank and Stanners areas of Corbridge during the 5 December 2015 event. A further event on 26 December 2015 flooded additional properties at Wellbank Riverside. [PAG,MUL] (p28)</p></div><div class="nugget-popup"><p>Multiple locations within Corbridge experienced flooding: flood wall overtopping at The Stanners caused surface flooding (5 Dec 2015); a residential street/Station Road was inundated (5 Dec 2015); and three properties at Wellbank Riverside flooded from the River Tyne during the event on 26 Dec 2015. [IMG,PAG,MUL] (p29)</p></div><div class="nugget-popup"><p>Corbridge experienced river flooding on 5 December 2015, including flood wall overtopping at The Stanners and inundation of riverside buildings (for example Dyvels PH) and streets (for example Station Road). [IMG,PAG] (p30)</p></div><div class="nugget-popup"><p>Fluvial flooding affected multiple addresses in Corbridge, including St Andrews Terrace, Corwell House, Orchard caravans, Tynedale Park RFC, sports ground, cemetery, Station Road (1&ndash;31), The Dyvels Pub, The Stanners, Valley Restaurant, Tynevale and Welwyn Houses. [TAB] (p52)</p></div><div class="nugget-popup"><p>Properties and low&ndash;lying areas around Wellbank and St. Andrews Terrace in Corbridge were flooded. (p58)</p></div><div class="nugget-popup"><p>Properties and low&ndash;lying areas around Wellbank and St. Andrews Terrace (in Corbridge) were inundated by floodwater. (p62)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Corbridge properties were among the 320 properties flooded across the winter; 294 properties flooded during Storm Desmond (regional total). [MUL] (p5)</p></div><div class="nugget-popup quant"><p>5.759 m [TAB] (p9)</p></div><div class="nugget-popup quant"><p>62 residential; 8 commercial; total 70 properties; 3 properties flooded more than once [TAB] (p12)</p></div><div class="nugget-popup quant"><p>4 properties [PAG,MUL] (p27)</p></div><div class="nugget-popup quant"><p>68 properties (64 residential, 4 business); 3 properties [PAG,MUL] (p28)</p></div><div class="nugget-popup quant"><p>3 properties [IMG,PAG,MUL] (p29)</p></div><div class="nugget-popup quant"><p>8 businesses; 62 residences; 70 addresses total [TAB] (p52)</p></div></div></body></div>`)[0];

ffected properties in Ovingham. Listed affected addresses include East and West Cottages; 1&ndash;8 Burnside Close; Bleach Green farm and Cottage; Bridge End Pub and B&B; Dene House; Greenhaugh; Old School House; The Hall; Ferry Landing Caravan Park. [TAB,PAG] (p52)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>12 residential; 15 commercial; total 27 properties; 1 property flooded more than once [TAB] (p12)</p></div><div class="nugget-popup quant"><p>at least 47 properties flooded across Bywell, Ovingham and Low Prudhoe during Storm Desmond (combined) [TAB,MUL] (p32)</p></div><div class="nugget-popup quant"><p>16 properties; 1 residential property and 4 business premises on the right bank; visitor centre reached 1.7m; Gladstone Packaging reached 2.1m; East and West Cottages flooded &gt;1m internally [PAG] (p33)</p></div><div class="nugget-popup quant"><p>approximately 1332 properties at risk of flooding from the River Wansbeck in this area [IMG,PAG] (p35)</p></div><div class="nugget-popup quant"><p>27 properties (15 businesses, 12 residential) [TAB,PAG] (p52)</p></div></div></body></div>`)[0];
