                var html_408b512d812da46ea38a91c2aca05612 = $(`<div id="html_408b512d812da46ea38a91c2aca05612" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Market Square, Chesham</h1><div class="nugget-popup"><p>Mainly business properties flooded originating at Market Square and extending along the High Street north to The Broadway (identified as Area B). (p8)</p></div><div class="nugget-popup"><p>CCTV footage showed surface water flooding in Market Square exceeding the capacity of the slot drain along the eastern edge and the gullies along the western edge, producing ponding that peaked around 05:00 and had fully dissipated by 06:00. The recent replacement of the Vale Brook culvert section in Market Square was followed by compaction of sand around the new culvert and collapse of brick pavers at the surface during the rainfall event; the collapse did not affect culvert performance. (p18)</p></div><div class="nugget-popup"><p>Surface water exceeded the capacity of the slot drain along the eastern edge and gullies on the western edge, producing ponding across the width of Market Square (peak ponding ~05:00, dissipated by ~06:03). The event caused compaction of sand around a recently replaced Vale Brook culvert and collapse of brick pavers at the surface (surface damage), though culvert performance was not reduced. Properties in the square were flooded internally. [PAG] (p19)</p></div><div class="nugget-popup"><p>Surface water entered shops from the street&ndash;facing front causing internal shallow flooding; businesses reported some floor&ndash;level stock loss, damaged carpets and reduced trading hours while cleaning and drying took place. (p20)</p></div><div class="nugget-popup"><p>Surface water drainage in Market Square performed poorly during the flooding (works were completed in 2014 but further improvements were recommended); the EA was asked to identify possible improvements linked to the Flood Alleviation Scheme. [TAB] (p27)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 properties [PAG] (p19)</p></div><div class="nugget-popup quant"><p>5 properties (p20)</p></div></div></body></div>`)[0];

inage and highway drainage capacity/state of repair were identified as problematic during the flood event; recommendations call for improved understanding, gully and highway drainage cleansing and prioritised repairs to address flow restrictions. [TAB] (p27)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 3 shops (p18)</p></div><div class="nugget-popup quant"><p>18 properties; at least 3 shops' manholes surcharged; depth approximately 2 to 5 cm [PAG] (p19)</p></div><div class="nugget-popup quant"><p>18 properties; 4 properties from the rear via East Street [PAG] (p20)</p></div></div></body></div>`)[0];

                var html_ad6846b608209b89312fd42ab0351113 = $(`<div id="html_ad6846b608209b89312fd42ab0351113" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Chesham</h1><div class="nugget-popup"><p>The rainfall&ndash;accumulation radar for 20 September 2014 shows very high, localized rainfall over Chesham and its immediate west/southwest surroundings. This heavy accumulation is presented as part of a Flood Investigation Report for Chesham, indicating the intense rainfall was linked to flooding that was investigated. Specific impacts to properties, infrastructure or people are not detailed in the provided context. [IMG] (p1)</p></div><div class="nugget-popup"><p>On 20 September 2014 intense rainfall caused surface water runoff and increased flows in the River Chess and its tributary the Vale Brook. In parts of the town these increased flows exceeded the capacity of infrastructure (notably the Vale Brook culvert), resulting in flooding of parts of Chesham. (p4)</p></div><div class="nugget-popup"><p>An intense rainfall event produced surface water runoff and markedly increased flows in the River Chess and its tributary the Vale Brook. In parts of town the increased flow exceeded the capacity of infrastructure (notably the Vale Brook culvert), causing internal flooding to residential properties (including basements). [PAG] (p5)</p></div><div class="nugget-popup"><p>Multiple areas within the town experienced property flooding during the incident (areas A, B and C are highlighted as locations where residential and business properties flooded). [IMG,PAG] (p8)</p></div><div class="nugget-popup"><p>Town centre was affected by flooding driven by the Vale Brook receiving surface water from much of Chesham's urban area and limited channel capacity; flood and surface&ndash;water risk prompted mapping of fluvial and surface water flood extents in the town centre. [IMG,PAG] (p10)</p></div><div class="nugget-popup"><p>Surface water flooding affected an extensive area of the town during the investigated event, with residential and commercial streets within the town shown to be at risk; a band of fluvial flooding also occurred along the River Chess in the south of the town. The valley topography funnelled runoff towards the Vale Brook and the River Chess, concentrating flows through low&ndash;lying parts of Chesham and increasing flood impacts. [IMG,PAG] (p12)</p></div><div class="nugget-popup"><p>A very localised, intense overnight storm (19&ndash;20 Sept 2014) produced heavy rainfall over the town; radar shows highest accumulation over Chesham (particularly High Street and Pednormead End neighbourhoods). The intense rainfall caused rapid rises in local watercourses (see Vale Brook) and contributed to acute urban/flash flooding conditions in the town. Water levels rose and fell quickly in response to the storm. [IMG,PAG] (p16)</p></div><div class="nugget-popup"><p>At least 34 properties were internally flooded (5 residential, 29 businesses). Surface&ndash;water ponding in Market Square and along the High Street exceeded slot drains causing overland flows (southern High Street flowed overland for about an hour); most shop flooding penetrated only a few metres to depths of about 2&ndash;5 cm. Vale Brook culvert manholes within at least three High Street/Broadway shops surcharged. Market Square section of the Vale Brook culvert experienced sand compaction from the event, causing collapse of brick pavers at the surface (surface damage) though the culvert performance was not affected. [PAG] (p19)</p></div><div class="nugget-popup"><p>At least 34 properties were flooded internally (5 residential properties and 29 businesses). Town&ndash;centre shops were generally flooded from the street&ndash;facing front for a few metres with shallow depths of about 2&ndash;5 cm; some properties were flooded from the rear via East Street. Businesses reported loss of floor&ndash;level stock, damaged carpets and reduced trading while cleaning and repairing. The culverted Vale Brook capacity was exceeded, causing backing up of water through manholes and preventing rapid drainage of surface water. [PAG,MUL] (p20)</p></div><div class="nugget-popup"><p>An intense, highly localised rainfall event (approx. 03:00&ndash;05:00) produced widespread surface water flooding across Chesham. Up to around Pednormead End and the town centre the event led to overwhelmed drainage, backed&ndash;up culverts/manholes, and surface water entering properties; property owners cleaned floors, removed damaged carpet tiles and used dehumidifiers. Surface water had largely drained away by about 06:00, and no immediate multi&ndash;agency incident response occurred because agencies were unaware until the following Monday. [PAG] (p21)</p></div><div class="nugget-popup"><p>The town experienced flooding on 20 September 2014; a number of issues contributed to the event (including problems associated with the Vale Brook culvert). (p25)</p></div><div class="nugget-popup"><p>The town experienced flooding that affected the town centre; issues with drainage and culvert restrictions (Vale Brook culvert under Missenden Road) increased flood risk and prompted post&ndash;event actions (CCTV surveys, temporary defences review and the Chesham Flood Alleviation Scheme). [TAB,PAG] (p27)</p></div><div class="nugget-popup"><p>The town experienced flooding associated with the investigated event (20 September 2014). Community and local authority response actions are recorded: residents were advised to sign up for Environment Agency Floodline warnings, to document and report flood incidents to Chiltern District Council, Buckinghamshire County Council and the Environment Agency, and the Chesham Flood Action Group coordinated local response and support. [TAB,PAG] (p29)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>five residential properties within 1km2 [PAG] (p5)</p></div><div class="nugget-popup quant"><p>34 properties; 5 residential properties; 29 businesses; at least 3 shop manholes surcharged [PAG] (p19)</p></div><div class="nugget-popup quant"><p>34 properties; 5 residential properties; 29 businesses; 5 properties in Market Square; 18 properties along the High Street; 2 properties on The Broadway; 4 properties on Broad Street [PAG,MUL] (p20)</p></div></div></body></div>`)[0];
