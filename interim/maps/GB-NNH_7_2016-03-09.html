                var html_196776620b6004650f232400ca0869fb = $(`<div id="html_196776620b6004650f232400ca0869fb" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Brick Kiln Road, Raunds</h1><div class="nugget-popup"><p>Heavy rainfall on a saturated catchment caused drainage systems to be unable to convey water. Excess surface water flowed over ground to low points around private property, resulting in internal flooding of a property at the Brick Kiln Road / North Street location. (p7)</p></div><div class="nugget-popup"><p>Internal flooding of a property at Brick Kiln Road associated with the flood incident on 9 March 2016; the property has experienced internal flooding on more than one occasion in the last five years. (p9)</p></div><div class="nugget-popup"><p>Surface water flowed down the carriageway of Brick Kiln Road around the bend and onto North Street; Brick Kiln Road was recorded as flooded on the listed dates. [TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Surface water flowed down the carriageway of Brick Kiln Road around the bend and onto North Street; runoff from a blocked ditch in the south verge (entering a pipe immediately north of Furnells Close) contributed significant additional surface water. During the investigation a flow of muddy brown water was observed entering road gullies on Brick Kiln Road from Enterprise Road, contributing to ponding at the low point on North Street. [PAG,MUL] (p12)</p></div><div class="nugget-popup"><p>Drainage systems taking water away from Brick Kiln Road were not recently maintained and were unable to collect and convey rainwater on the saturated catchment. This caused drainage to overtop and excess surface water to flow to low points around properties, producing ponding in the carriageway at low points. Fully surcharged main drainage systems caused nearby domestic drainage to back up, which could lead to internal flooding of properties. (p13)</p></div><div class="nugget-popup"><p>Recent and ongoing developments on Brick Kiln Road were reviewed because their flood risk assessments and drainage designs may be ineffective, potentially contributing to surface water drainage problems and flood risk to nearby properties; ENC was advised to review and contact developers. (p22)</p></div><div class="nugget-popup"><p>Ditch and pipe systems on Brick Kiln Road (marked Q1) were involved in the incident plan. Overland surface&ndash;water flow routes and the schematic flooded area are shown concentrated along the main road, indicating flooding affected the road corridor and adjacent residential frontage during the incident. [IMG] (p30)</p></div><div class="nugget-popup"><p>Floodwater covered a significant portion of the roadway, leaving standing water and debris that made the road hazardous or impassable for vehicles and pedestrians. [IMG,PAG] (p40)</p></div><div class="nugget-popup"><p>Floodwater covered the full width of the roadway and partially submerged pavements and roadside areas, rendering the road impassable to most vehicles. The water encroached onto the frontage of adjacent properties and a parked vehicle was partially surrounded by water. [IMG,PAG] (p41)</p></div><div class="nugget-popup"><p>Floodwater covered the entire road surface and adjacent verge, obstructing transport access and inundating roadside infrastructure. A red post box was partially submerged and water reached the base of a streetlamp; floodwater extended into the surrounding area near fences and nearby properties. [IMG,PAG] (p42)</p></div><div class="nugget-popup"><p>Floodwater covered the entire road surface, reaching up to sidewalks and property boundaries and partially submerging houses and vegetation lining the street; the road was rendered impassable to vehicles and pedestrians and people were present conducting response or assessment activities. [IMG,PAG] (p43)</p></div><div class="nugget-popup"><p>Flooding in the North Street/Brick Kiln Road area inundated the road surface, causing deep standing water that impeded vehicles (evidenced by a bus driving through high water), creating hazardous conditions and likely disrupting traffic on Brick Kiln Road. [IMG,PAG] (p45)</p></div><div class="nugget-popup"><p>Waterlogged field drainage north of Brick Kiln Road with a narrow flooded path and standing water; and muddy, partially flooded ground at the east end/bend where Brick Kiln Road meets North Street, showing localised surface&ndash;water flooding and poor drainage. [IMG,PAG] (p46)</p></div><div class="nugget-popup"><p>Adjacent field drainage north of Brick Kiln Road was waterlogged with muddy standing water near the road and properties; surface water was present at the east end where the road meets North Street, contributing to poor drainage and saturated ground. [IMG,PAG] (p47)</p></div><div class="nugget-popup"><p>Flooding at the east end/bend covered the road surface, impeding vehicle passage. Public transport was affected (a bus was observed approaching through the flooded area) and a car was parked off the road to avoid the water. Field drainage immediately north of Brick Kiln Road was carrying cloudy, sediment&ndash;laden water and vegetation was encroaching on the channel, potentially reducing drainage efficiency. [IMG,PAG] (p48)</p></div><div class="nugget-popup"><p>Surface water on the carriageway/adjacent verge at the east end of Brick Kiln Road associated with the 9 March 2016 flood; nearby field drainage north of the road was carrying pale, sediment&ndash;laden runoff indicating overland flow into drainage channels. [IMG,PAG] (p49)</p></div><div class="nugget-popup"><p>Surface water accumulated and flowed along Brick Kiln Road, channelled along the road edge into a road gully; water flowed on and off the south&ndash;side footway at the access to a development, and muddy runoff collected in a ditch in the south verge, indicating localized surface&ndash;water flooding and drainage overload. [IMG,PAG] (p57)</p></div><div class="nugget-popup"><p>Surface water runoff flowing on and off the south&ndash;side footway at the access to a development; pooling and muddy conditions in the carriageway and verge (south verge ditch), impairing pedestrian access and creating a road hazard. Runoff was fed by water flowing from Enterprise Road. [IMG,PAG] (p58)</p></div><div class="nugget-popup"><p>Surface water flowed on and off the footway on the south side at the access to a development. Surface water was reported flowing from Enterprise Road onto Brick Kiln Road. Debris in the ditch in the south verge (immediately north of Furnells Close) was restricting flow, and standing water was present at a brick culvert/ditch at the development access. [IMG,PAG] (p59)</p></div><div class="nugget-popup"><p>Debris in the ditch on the south verge restricted flow. Two inlets (a smaller inlet and a second, larger inlet) convey runoff from Brick Kiln Road and fields to the north into a watercourse east of Brick Kiln Road; overgrown vegetation and a partially broken concrete inlet contained water and mud, impeding conveyance into the channel and restricting drainage at the road edge. [IMG,PAG] (p61)</p></div><div class="nugget-popup"><p>Muddy surface water was present on the carriageway; roadside ditches and headwalls contained pooled water and vegetation encroachment that reduced channel capacity and contributed to road surface water. [IMG,PAG] (p68)</p></div><div class="nugget-popup"><p>Blocked road gully on the south side at the junction with Enterprise Road leading to muddy surface water on the road and pavement; accumulation/flow of mud and surface water across the carriageway. [IMG,PAG] (p69)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property (internally flooded) (p7)</p></div><div class="nugget-popup quant"><p>one property (p9)</p></div></div></body></div>`)[0];

                var html_dea72f22beb917242b5d8bf4b5779363 = $(`<div id="html_dea72f22beb917242b5d8bf4b5779363" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>North Street, Raunds</h1><div class="nugget-popup"><p>Heavy rainfall on a saturated catchment caused drainage systems to be unable to convey water. Excess surface water flowed over ground to low points around private property at the Brick Kiln Road / North Street location, resulting in internal flooding of a property. (p7)</p></div><div class="nugget-popup"><p>Named as part of the location of the flood incident on 9 March 2016; associated internal flooding at the Brick Kiln Road/North Street location (one property internally flooded, recurring incidents reported). (p9)</p></div><div class="nugget-popup"><p>Internal flooding of a property on North Street. The internally flooded property has domestic drainage systems which discharge to main drainage in North Street. (p10)</p></div><div class="nugget-popup"><p>Residential property on North Street experienced internal flooding (water entering properties). Surface water flowed from Brick Kiln Road onto North Street and developed into a pool at the low point on North Street; internal flooding damaged carpets on at least one occasion. [TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Surface water collected at the low point on North Street forming a pool. The pool reached within 50mm of entering one property. Domestic drainage for a second property on North Street could not discharge to the main drainage, causing rainwater from the roof to back up and flood into that house (internal flooding). The Fire Service pumped water from the low point and the garden of the internally flooded property into the Main River (Hog Dyke). [PAG] (p12)</p></div><div class="nugget-popup"><p>The flooding that occurred in Brick Kiln Road/North Street was caused by heavy rainfall on a saturated catchment; drainage systems were unable to convey rainwater, leading to excess surface water flowing over ground to low points around private properties. Drainage at low points was fully surcharged, causing ponding in the carriageway and backups into domestic drainage systems with potential internal property flooding. (p13)</p></div><div class="nugget-popup"><p>Floodwater covered the roadway and extended up to property boundaries, encroaching on frontages and making the street impassable. [IMG,PAG] (p44)</p></div><div class="nugget-popup"><p>Deep floodwater in the North Street/Brick Kiln Road area that partially submerged vehicle wheels and produced large waves as vehicles passed, creating hazardous driving conditions and likely disrupting local traffic. [IMG,PAG] (p45)</p></div><div class="nugget-popup"><p>Muddy, waterlogged ground with standing surface water at the bend at the top of North Street (the east end junction with Brick Kiln Road), indicating poor drainage and localised flooding that obstructs the area. [IMG,PAG] (p46)</p></div><div class="nugget-popup"><p>Surface water and standing water accumulated on the road at the bend (top of North Street / east end of Brick Kiln Road), leaving the carriageway wet and muddy and creating hazardous driving/walking conditions. [IMG,PAG] (p47)</p></div><div class="nugget-popup"><p>Flooding at the bend at the top of North Street (where it meets the east end of Brick Kiln Road) covered the carriageway and impeded vehicle movement; a bus was observed using/approaching the flooded road and a car was parked off the verge to avoid the water. [IMG,PAG] (p48)</p></div><div class="nugget-popup"><p>Wet road surface and evidence of surface water at the bend at the top of North Street during the 9 March 2016 flood incident, showing surface water accumulation on the carriageway and adjacent grass verge. [IMG,PAG] (p49)</p></div><div class="nugget-popup"><p>Road completely covered with floodwater that encroached onto sidewalks and front gardens; water entered residential properties causing internal flooding despite sandbags being in place, with household items and floors submerged and access along the street impeded. [IMG,MUL] (p51)</p></div><div class="nugget-popup"><p>During heavy rainfall the carriageway became wet and reflective with surface water accumulating and pooling at a low point beside the kerb. Water flowed along the road surface toward a road gully at the low point; the gully was shown collecting this flow but appeared at or near capacity, indicating local drainage overwhelmed by the rainfall. [IMG] (p56)</p></div><div class="nugget-popup"><p>Deposits of silt at a road gully on North Street, indicating surface&ndash;water flow and gully deposition affecting the carriageway/drainage. [IMG,PAG] (p69)</p></div><div class="nugget-popup"><p>Deposits of silt were recorded around a road gully on North Street, obstructing the gully and contributing to the risk of localised surface&ndash;water flooding; recent foul&ndash;water drainage works have been carried out on North Street (post&ndash;event remediation/works noted). [IMG,PAG] (p70)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property (internally flooded) (p7)</p></div><div class="nugget-popup quant"><p>one property (p9)</p></div><div class="nugget-popup quant"><p>1 property (p10)</p></div><div class="nugget-popup quant"><p>approx 750mm deep internal flooding [TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup quant"><p>50mm; one property internally flooded; one additional property had drainage unable to discharge [PAG] (p12)</p></div></div></body></div>`)[0];

                var html_fdca93fbf10b28bcde8177129e39c5bf = $(`<div id="html_fdca93fbf10b28bcde8177129e39c5bf" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Brooks Road, Raunds</h1><div class="nugget-popup"><p>A watercourse flows into the north of Raunds along Brooks Road and this watercourse is part of the Main River through Raunds. The report attributes the March 2016 event to ordinary watercourse flooding (alongside surface water and agricultural runoff), so the watercourse along Brooks Road was implicated in the ordinary watercourse flooding during the 9 March 2016 event. (p10)</p></div></div></body></div>`)[0];

                var html_805d0d971d95fea37018a9ffecefbc49 = $(`<div id="html_805d0d971d95fea37018a9ffecefbc49" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Mackenzie Road, Raunds</h1><div class="nugget-popup"><p>The watercourse flows south through the centre of Raunds parallel with High Street, Brook Street and MacKenzie Road and then flows to the River Nene. The report attributes the March 2016 event to ordinary watercourse flooding among other causes, so the watercourse running parallel to MacKenzie Road was implicated in the ordinary watercourse flooding during the 9 March 2016 event. (p10)</p></div></div></body></div>`)[0];

                var html_d2a85a04a9d7d970213710d17736dd3b = $(`<div id="html_d2a85a04a9d7d970213710d17736dd3b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Furnells Close, Raunds</h1><div class="nugget-popup"><p>The ditch in the south verge was reported blocked at the point where it enters a pipe immediately north of Furnells Close; the blockage caused the ditch to overtop and made a significant contribution to surface water flowing onto Brick Kiln Road and towards North Street. During the 25 April investigation ditch systems were observed to back up at the same location due to the reported blockage (though rainfall on that date was not enough to overtop). [MUL] (p12)</p></div></div></body></div>`)[0];

                var html_d00d0547e5c999f57d890db6aec5a623 = $(`<div id="html_d00d0547e5c999f57d890db6aec5a623" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Raunds</h1><div class="nugget-popup"><p>The flood incident at Brick Kiln Road / North Street in Raunds (9 March 2016) resulted in internal flooding of a property in Raunds; the cause is described as heavy rainfall on a saturated catchment with drainage unable to convey water, producing overland flow to low points near properties. (p7)</p></div><div class="nugget-popup"><p>Flood incident on 9 March 2016 led to internal flooding in the town: causes reported include agricultural runoff, surface water runoff and ordinary watercourse flooding. The investigation recorded internal flooding and repeated incidents at the Brick Kiln Road/North Street location. [PAG] (p9)</p></div><div class="nugget-popup"><p>Raunds was affected during the event: the town is crossed by a Main River (the Hog Dyke) and associated watercourses and ditches that connect to drainage in the town. The report records an internally flooded property in Raunds (on North Street). (p10)</p></div><div class="nugget-popup"><p>Heavy rainfall on a saturated catchment caused drainage systems across Raunds to be unable to collect and convey rainwater to larger watercourses, resulting in excess surface water following natural contours to low points around private properties. Drainage systems (including ditches in the south verge) became backed up or overtopped, main drainage systems were fully surcharged causing carriageway ponding and domestic drainage backups with reported internal flooding of property(ies). A reported blockage where a ditch enters a pipe immediately north of Furnells Close caused local backing up of the verge ditch. [PAG] (p13)</p></div><div class="nugget-popup"><p>Main drainage systems at low points were fully surcharged causing ponding in carriageways; surcharge led to domestic drainage backing up and reported internal flooding of property(ies). (p14)</p></div><div class="nugget-popup"><p>Site of flood incidents prompting a Section 19 investigation by the LLFA (NCC); the report discusses identifying causes and recording assets and hotspots related to flooding in Raunds. (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property (internally flooded) (p7)</p></div><div class="nugget-popup quant"><p>over 70 properties; over 200 reports of flooding [PAG] (p9)</p></div><div class="nugget-popup quant"><p>1 property internally flooded (on North Street) (p10)</p></div><div class="nugget-popup quant"><p>one property (p14)</p></div></div></body></div>`)[0];
