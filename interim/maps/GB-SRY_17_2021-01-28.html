                var html_945110fe84aee1ca2f096da0cfd438da = $(`<div id="html_945110fe84aee1ca2f096da0cfd438da" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Guildford Street, Knowle Green</h1><div class="nugget-popup"><p>A low point on Guildford Street (between nos. 14 and 24) pooled with floodwater during the event; limited drainage (only gullies and a soakaway) meant most of the road was susceptible to flooding and photos from residents show water pooling at that location. Surface water also entered the foul sewer system in the area (investigation evidence). (p3)</p></div><div class="nugget-popup"><p>Rising groundwater (linked to high River Thames levels) filled the highway soakaway capacity so surface water falling on the highway could not drain, flowed overland and pooled at a low point. Groundwater also entered the foul sewer through joints/cracks and a hole in a foul sewer lateral near the manhole in the front garden of 21 Guildford Street, causing foul contamination of floodwater and causing the foul sewer to exceed capacity. The lateral has since been lined/repaired. [PAG] (p5)</p></div></div></body></div>`)[0];

                var html_1764000474fbad2347131cd6c05f1817 = $(`<div id="html_1764000474fbad2347131cd6c05f1817" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Spelthorne</h1><div class="nugget-popup"><p>Surface water pooled at a low point on Guildford Street (between 14 and 24 Guildford Street) during Storm Christoph; limited drainage on the road contributed to pooling. Thames Water investigation found surface water entered the foul sewer network via pipe joins and a hole in a lateral from one property. (p3)</p></div><div class="nugget-popup"><p>Large parts of Spelthorne (including Staines) sit on River Terrace Deposits so when the River Thames was high, groundwater rose to the same level and lower&ndash;lying land experienced groundwater coming to the surface. In this event rising groundwater filled the soakaway on Guildford Street, causing surface water to flow overland and pool, and groundwater ingress into the foul sewer plus a hole in a lateral at 21 Guildford Street led to foul contamination of flood water. [PAG] (p5)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>addresses 14&ndash;24 Guildford Street; one property lateral hole (p3)</p></div><div class="nugget-popup quant"><p>1 hole in a foul sewer lateral (near the manhole in the front garden of 21 Guildford Street) [PAG] (p5)</p></div></div></body></div>`)[0];
