 West Bars roundabout. (p31)</p></div><div class="nugget-popup"><p>Holme Brook corridor flooding contributed to inundation of adjacent areas and properties in Central Chesterfield during the 19 Oct 2023 &ndash; 21 Oct 2023 event. [IMG] (p52)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>192 properties; 137 homes; 55 businesses (p24)</p></div><div class="nugget-popup quant"><p>137 homes; 55 businesses; 192 properties (total) within the community shown in Table 4&ndash;1; 142 properties had flooded previously (73% of the properties that were internally flooded during Storm Babet). [PAG,IMG] (p27)</p></div><div class="nugget-popup quant"><p>Contributed to internal flooding of 192 properties in Brampton (p28)</p></div><div class="nugget-popup quant"><p>1.6 m peak level (second highest level ever recorded) [IMG,PAG] (p29)</p></div><div class="nugget-popup quant"><p>8 homes and businesses (p31)</p></div></div></body></div>`)[0];

                var html_298e24bcbf1e9c29aab1f0d0ce2c6cab = $(`<div id="html_298e24bcbf1e9c29aab1f0d0ce2c6cab" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Smithy Brook</h1><div class="nugget-popup"><p>Smithy Brook and its culverted sections overtopped/linked with recorded flood outlines during Storm Babet, causing flooding adjacent to watercourse crossings and residential streets in Renishaw and contributing to internal flooding of homes. [IMG] (p38)</p></div><div class="nugget-popup"><p>Smithy Brook, an ordinary watercourse through the north of Renishaw, was implicated in the Storm Babet event; recorded flood extents align with Smithy Brook and its culverted connections, and its flooding contributed to internal flooding of residential properties in the village. [PAG,IMG] (p39)</p></div><div class="nugget-popup"><p>Smithy Brook and its vicinity produced surface&ndash;water flooding during Storm Babet that led to internal flooding of properties; four businesses on Smithy Brook Road were internally flooded. [IMG,PAG] (p40)</p></div><div class="nugget-popup"><p>Overtopped at its culvert inlet due to exceptional rainfall and culvert blockages; this overtopping contributed to flooding across Renishaw and to flow routes that joined Sheffield Road and Emmet Carr Brook floodwater. [TAB,PAG] (p41)</p></div><div class="nugget-popup"><p>Overtopping at the Smithy Brook culvert inlet (exacerbated by a blocked culvert) caused flow to travel westwards and join Sheffield Road and Emmett Carr Brook, contributing to internal property flooding in Renishaw. North East Derbyshire District Council reported peak severity on 20 Oct between 12:00 and 14:00. [IMG,PAG] (p42)</p></div><div class="nugget-popup"><p>Culvert inlet was blocked by debris following Storm Babet causing overtopping. Pooling occurred on derelict land east of Smithy Brook Road; water flowed westwards down Smithy Brook Road flooding four businesses, flowed onto the Main Road (A6135) flooding six homes, then flowed south along Emmett Carr Lane flooding eighteen homes. [PAG] (p43)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>39 properties [IMG] (p38)</p></div><div class="nugget-popup quant"><p>39 properties [PAG,IMG] (p39)</p></div><div class="nugget-popup quant"><p>4 businesses [IMG,PAG] (p40)</p></div><div class="nugget-popup quant"><p>four businesses; six homes; eighteen homes; internal flood depths 0.2m to 0.8m (Sheffield Road); up to 1.2m (property on Emmett Carr Lane) [IMG,PAG] (p42)</p></div><div class="nugget-popup quant"><p>4 businesses; 6 homes; 18 homes [PAG] (p43)</p></div></div></body></div>`)[0];

                var html_1c92589686dda3353681554cc33b0960 = $(`<div id="html_1c92589686dda3353681554cc33b0960" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Don</h1><div class="nugget-popup"><p>Experienced extreme rainfall during Storm Babet (19&ndash;21 October 2023) and associated very high river flows/levels recorded at gauging stations in the sub&ndash;catchment. (p3)</p></div><div class="nugget-popup"><p>During Storm Babet (19&ndash;21 October 2023) heavy rainfall produced extreme river flows in the Don sub&ndash;catchment; gauging stations recorded the highest or second&ndash;highest flows/levels on record and these extreme flows contributed to flooding impacts across the sub&ndash;catchment communities. [IMG] (p4)</p></div><div class="nugget-popup"><p>The mapped Storm Babet recorded flood outline lies inside the Don and Rother management catchment area; watercourses and culverted watercourses within this management catchment intersect the flood zone, indicating the catchment experienced river flooding during the event. [IMG] (p25)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Recorded rainfall equating to 1.1%&ndash;3.4% AEP at stations across the catchment; all gauging stations produced the highest or second&ndash;highest ranked flows or levels on record. [IMG] (p4)</p></div></div></body></div>`)[0];

                var html_24b268c8e00c34d652e1e0eb2f7d5872 = $(`<div id="html_24b268c8e00c34d652e1e0eb2f7d5872" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Rother</h1><div class="nugget-popup"><p>Recorded longer and slower river responses to the heavy rainfall from Storm Babet and contributed to very high flows/levels (gauging stations produced their highest or second highest ranked flows/levels). Shortest lag time between peak rainfall and peak flow in the sub&ndash;catchment was recorded near Staveley (8 hours) with the longest at Woodhouse Mill. (p3)</p></div><div class="nugget-popup"><p>The River Whitting (a tributary of the River Rother) overtopped/was implicated in flooding on the floodplain at Station Road, contributing to internal flooding of nearby properties. [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>The Don and Rother management catchment (including the Rother) is shown as the context for the recorded Storm Babet flood outline; watercourses and culverts within this management catchment intersect the recorded flood extent indicating river/urban flooding affected the area. [IMG] (p25)</p></div><div class="nugget-popup"><p>Flooding of the River Rother produced the recorded flood outline during Storm Babet that closely followed the river and inundated adjacent residential streets in South Chesterfield, contributing to internal flooding of properties. [IMG] (p33)</p></div><div class="nugget-popup"><p>The River Rother overtopped/was the primary source of flooding in the Chesterfield South community; flooding from the Rother produced most of the flooded homes on the adjacent floodplain (most flooded homes were west of the river). Flood defenses (walls and embankments) are present along the river. [IMG,PAG] (p34)</p></div><div class="nugget-popup"><p>Flooding from the River Rother affected the Chesterfield South community. West bank defences (two flood walls and Hawthorne Street embankment) provided protection, while there are no engineered defences on the east bank. The Avenue Flood Balancing Reservoir upstream operated as intended during the event and stored water. [PAG,IMG] (p35)</p></div><div class="nugget-popup"><p>The River Rother was the primary source of flooding: it overtopped flood defence structures at several locations causing inundation of low&ndash;lying areas. Overtopping occurred near Derby Road bridge and along the west bank defences, producing flow routes through gardens into streets and causing internal flooding of homes, businesses and an electricity substation. [PAG] (p36)</p></div><div class="nugget-popup"><p>The River Rother overtopped its banks (floodwater reached ~76.0 mAOD in topographic data), causing floodwater to flow over the bank by Derby Road bridge into properties along Riverview, through gardens on Bridge Street and into Hawthorne Street; it also inundated properties at St Giles Close and Healaugh Way and flooded a Yorkshire Water pumping station which failed. (p37)</p></div><div class="nugget-popup"><p>The Rother flooded its floodplain during Storm Babet and inundated adjacent properties and infrastructure in the community centred on Tapton Terrace. [PAG,IMG] (p45)</p></div><div class="nugget-popup"><p>The River Rother corridor flooded, concentrating Flood Zone 3 along its banks; river flooding from the Rother caused inundation of adjacent properties in Chesterfield, contributing to internal flooding of homes and non&ndash;residential buildings during Storm Babet. [IMG] (p46)</p></div><div class="nugget-popup"><p>The recorded flood outline closely follows the course of the River Rother; river flooding overlapped predicted surface&ndash;water risk areas and inundated adjacent low&ndash;lying streets and properties. [PAG,IMG] (p47)</p></div><div class="nugget-popup"><p>Primary source of flooding that caused internal flooding across the local community, affecting residential and non&ndash;residential properties downstream of Chesterfield Tapton Bridge. [PAG] (p48)</p></div><div class="nugget-popup"><p>Identified as the primary source of flooding for this community; high river levels and overflow from the channel caused inundation of adjacent low&ndash;lying areas and properties. [PAG,IMG] (p49)</p></div><div class="nugget-popup"><p>River flooding from the River Rother contributed to internal flooding in central Chesterfield; where it passes beneath Hasland Road three homes and one business were internally flooded. The Environment Agency issued a Flood Alert for the Upper River Rother Catchment and a Flood Warning for the River Rother at Tapton during the event. [PAG] (p50)</p></div><div class="nugget-popup"><p>Fluvial flooding from the River Rother and the River Hipper caused internal flooding across central Chesterfield. Flooding occurred at multiple locations along and adjacent to these watercourses, resulting in internal flooding of homes and businesses at Hasland Road, Spital Lane (confluence), Clayton Street, Hollis Lane / Hady Hill, Camlough Walk, Queen's Park, Ravenside Retail Park and locations near Lordsmill Street. [PAG,IMG] (p51)</p></div><div class="nugget-popup"><p>Channel flooding from the River Rother affected its floodplain and contributed to flooding of nearby properties and urban areas in Central Chesterfield during the 19 Oct 2023 &ndash; 21 Oct 2023 event. [IMG] (p52)</p></div><div class="nugget-popup"><p>The River Rother caused river flooding in Central Chesterfield during the event. Affected areas adjacent to the River Rother included Horns Bridge, Alma Retail Park, Clayton Street, Spital Lane, Hasland Road and Hollis Lane. The Environment Agency issued a 'River Rother at Central Chesterfield' Flood Warning on 20 Oct 2023. The Asset Information and Maintenance Programme records no formal flood defences along the River Rother within the community, leaving riparian walls and natural/engineered high ground to provide informal protection. [PAG,IMG] (p53)</p></div><div class="nugget-popup"><p>The River Rother exceeded channel capacity and was a main driver of internal flooding to properties adjacent to the watercourse, contributing to the community flood impacts. [PAG] (p54)</p></div><div class="nugget-popup"><p>The River Hipper overflowed its banks at Queens Park and Ravenside Retail Park, causing internal flooding to businesses in those locations. Floodwater reached approx. 0.7 m depth at a Queens Park business and approx. 0.8 m depth inside an internally flooded business at Ravenside Retail Park; ten businesses at Ravenside/Queens Park were flooded. Hydrology at the Chesterfield Park Road Bridge gauge on the River Hipper recorded an unprecedented peak on 20 October (gauge peak reached 2.93 m). The River Rother overflowed near Hasland Road (about 100 m upstream of its confluence with Spital Brook), causing internal flooding to one commercial property to the west of the river and four residential properties to the east. [IMG] (p55)</p></div><div class="nugget-popup"><p>The River Rother overflowed its banks at multiple locations in the area, contributing to internal property flooding at Hasland Road, causing flood flows toward the low spot on the A617/Horns Bridge and contributing to flooding of roads, retail parks (including Alma Retail Park) and other infrastructure. (p56)</p></div><div class="nugget-popup"><p>The River Rother overflowed its west bank at Hady Hill and elsewhere, causing internal flooding of the ground floors of The Foundry and Markham Quay apartment blocks, internal flooding of three businesses on Hady Hill between the river and the railway underpass, and internal flooding of properties on Hollis Lane; sewage was reported at some flooded buildings indicating sewer overwhelm. (p57)</p></div><div class="nugget-popup"><p>Floodwater from the River Rother accumulated at a low spot beneath the railway underpass on Hollis Lane / Hady Hill, causing pooling and contributing to internal flooding of nearby properties; individuals evacuated the area by wading through floodwater at depths that exceeded 1 m. [PAG] (p58)</p></div><div class="nugget-popup"><p>The community sits on the River Rother floodplain and flooding from the river contributed to internal flooding of properties at Meadow Close (New Whittington). [PAG] (p59)</p></div><div class="nugget-popup"><p>Flooding of the River Rother during Storm Babet affected its floodplain; the river's flood extent reached the area south of Meadow Close and is described as contributing to the internal flooding of nearby homes. [PAG,IMG] (p60)</p></div><div class="nugget-popup"><p>High flows in the River Rother produced river flooding that impacted adjacent residential areas, including Meadow Close. The recorded flood outline from Storm Babet overlaps the river and nearby streets, indicating the river was the source of flooding in the locality. [PAG,IMG] (p61)</p></div><div class="nugget-popup"><p>River levels rose from the evening of 19 October, peaking at the Whittington gauge on 20 October 2023 and contributing to the recorded flood extent that affected nearby Meadow Close and Station Lane. [PAG,IMG] (p62)</p></div><div class="nugget-popup"><p>River Rother levels rose sharply (gauge peak 20 Oct) and contributed to the flood extent in the Meadow Close area; floodwater from the river crossed Station Lane and is assessed as likely the dominant source causing the final extent of flooding that led to internal flooding of homes. [IMG,PAG] (p63)</p></div><div class="nugget-popup"><p>River Rother (together with its tributary The Moss) overtopped/caused river flooding that contributed to internal flooding of properties in Eckington; most flooded homes were west of the River Rother and south of The Moss. [PAG,IMG] (p65)</p></div><div class="nugget-popup"><p>High levels in the River Rother may have prevented The Moss tributary from discharging, possibly exacerbating flooding on the floodplain and contributing to inundation of adjacent properties. [PAG,IMG] (p66)</p></div><div class="nugget-popup"><p>The River Rother may have contributed indirectly by holding high levels that potentially prevented The Moss from discharging, but its direct contribution to the inundation is unclear. [PAG,IMG] (p67)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8 hours (p3)</p></div><div class="nugget-popup quant"><p>10 residential properties [PAG,IMG] (p10)</p></div><div class="nugget-popup quant"><p>103 properties [IMG] (p33)</p></div><div class="nugget-popup quant"><p>two flood walls totalling 170m; Hawthorne Street embankment 170m; reservoir stored about 100m^3 [PAG,IMG] (p35)</p></div><div class="nugget-popup quant"><p>103 homes; 3 businesses; 1 electricity substation [PAG] (p36)</p></div><div class="nugget-popup quant"><p>topographic level reached 76.0 mAOD; flood depths exceeded 0.8 m (p37)</p></div><div class="nugget-popup quant"><p>26 residential properties; 17 non&ndash;residential properties; 1 death [PAG,IMG] (p45)</p></div><div class="nugget-popup quant"><p>17 non&ndash;residential properties [IMG] (p46)</p></div><div class="nugget-popup quant"><p>43 properties affected in total; 26 homes (Tapton Terrace); 17 non&ndash;residential properties (Brimington Road and Holbeck Close) [PAG] (p48)</p></div><div class="nugget-popup quant"><p>43 properties flooded (26 residential homes on Tapton Terrace; 17 non&ndash;residential properties in nearby industrial areas) [PAG,IMG] (p49)</p></div><div class="nugget-popup quant"><p>3 homes; 1 business [PAG] (p50)</p></div><div class="nugget-popup quant"><p>Hasland Road: 3 homes; 1 business; Spital Lane (confluence with River Hipper): 3 homes; 4 businesses; Clayton Street: 10 businesses; Hollis Lane / Hady Hill: 4 homes; 5 businesses; Camlough Walk: 39 homes [PAG,IMG] (p51)</p></div><div class="nugget-popup quant"><p>10 businesses; 1 commercial property; 4 residential properties; approx. 0.7 m flood depth at Queens Park business; approx. 0.8 m flood depth at an internally flooded business at Ravenside Retail Park [IMG] (p55)</p></div><div class="nugget-popup quant"><p>1 commercial property; 4 residential properties; 4 businesses; around 200 homes without power (p56)</p></div><div class="nugget-popup quant"><p>2 apartment blocks; 3 businesses on Hady Hill; 4 homes and 2 businesses on Hollis Lane (p57)</p></div><div class="nugget-popup quant"><p>4 homes; 2 businesses; flood depths &gt;1 m [PAG] (p58)</p></div><div class="nugget-popup quant"><p>15 properties [PAG] (p59)</p></div><div class="nugget-popup quant"><p>15 properties [PAG,IMG] (p60)</p></div><div class="nugget-popup quant"><p>15 internally flooded properties (on Meadow Close) attributable to river flooding in the area [PAG,IMG] (p61)</p></div><div class="nugget-popup quant"><p>peak level 4.09 m recorded at the Whittington gauge (20 Oct 2023) [PAG,IMG] (p62)</p></div><div class="nugget-popup quant"><p>15 internally flooded homes [IMG,PAG] (p63)</p></div><div class="nugget-popup quant"><p>8 properties (5 residential, 3 commercial) [PAG,IMG] (p65)</p></div></div></body></div>`)[0];
                popup_ab0db3e8f49a1cf3b1858fef4c8ad9fe.setContent(html_24b268c8e00c34d652e1e0eb2f7d5872);

                var html_b14ca4f01d24121c80361a5c525a7f68 = $(`<div id="html_b14ca4f01d24121c80361a5c525a7f68" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Hipper</h1><div class="nugget-popup"><p>Quicker and earlier river responses to the heavy rainfall from Storm Babet were recorded on the River Hipper (near Chesterfield and Holymoorside); gauging stations produced the highest or second&ndash;highest ranked flows or levels on record in response to Storm Babet. (p3)</p></div><div class="nugget-popup"><p>Flooding from the River Hipper (ordinary watercourse through Holymoorside) inundated residential properties in the village, causing internal flooding. (p14)</p></div><div class="nugget-popup"><p>Flows through Holymoorside on its floodplain and contributed to flooding during the event; flood outlines were recorded along the watercourse and at nearby road crossings, associated with internal flooding of local properties. [PAG,IMG] (p15)</p></div><div class="nugget-popup"><p>High river levels at the Holymoorside gauge on 20 October 2023 (rise beginning ~00:00, peaking ~12:00) contributed to the flood extent in Holymoorside and inundation of nearby residential properties and a business. River Hipper levels reached a record gauge reading and are identified as a causal contributor to the internal flooding of properties on The Alders, New Road and Loads Road. [IMG,PAG] (p17)</p></div><div class="nugget-popup"><p>The River Hipper rose rapidly (peak gauge at Holymoorside on 20 Oct) and overtopped its banks at multiple locations through the village and near Old Mill Pond; overtopping entered properties from the rear (including The Alders, New Road and Loads Road) and contributed directly to the internal flooding of homes and the overtopping of Old Mill Pond. (p18)</p></div><div class="nugget-popup"><p>The river overtopped its banks at multiple locations near Old Mill Pond and through Holymoorside; Old Mill Pond overtopped local to a weir. Overtopping upstream of Loads Road bridge and restricted bridge arch capacity caused floodwater to flow east along Loads Road and pool at the Loads Road / New Road low spot, contributing to internal flooding of properties (including The Alders and two homes at the New Road/Loads Road junction). [PAG] (p19)</p></div><div class="nugget-popup"><p>The River Hipper flooded during the storm and is identified as the main river flowing through the community; floodwaters from the River Hipper resulted in internal flooding of nearby properties (all flooded properties are within 75 m of the river). The Storm Babet recorded flood outline closely follows the River Hipper corridor. [PAG,IMG] (p20)</p></div><div class="nugget-popup"><p>Flooding from the River Hipper affected the adjacent Chatsworth Road West community; properties on the river floodplain and at similar elevation to the top bank were internally flooded. [PAG,IMG] (p21)</p></div><div class="nugget-popup"><p>River Hipper water levels rose during the event, reaching a recorded peak (gauge c.20 m upstream of Walton Road bridge reached 3.59 m, the highest on record) on 20 Oct, with levels rising from early morning and peaking at 13:00; these high river levels caused flooding of the nearby residential properties. [PAG,IMG] (p22)</p></div><div class="nugget-popup"><p>The River Hipper exceeded its channel and breached its banks at multiple locations in the community. At Chapel Lane West the river breached the north bank and flowed north up the street. River water entered five homes on Walton Road through their rear gardens and flooded them internally. River flows are also understood to have been a dominant source of flooding at Chapel Lane West and are likely connected to flooding affecting Grove Cottages (possible flows through drainage holes in the riverside wall). Residents reported waist&ndash;high water at the south end of Chapel Street West adjacent to the River Hipper. [IMG,PAG] (p23)</p></div><div class="nugget-popup"><p>The River Hipper flowed through Brampton and was a principal flood source during Storm Babet; it contributed to internal flooding across the community. The Hipper is heavily modified and culverted at multiple locations within the community, which is described in the report as part of the flooding mechanism. (p24)</p></div><div class="nugget-popup"><p>River Hipper overtopped/caused fluvial flooding across the local floodplain during the event, inundating built&ndash;up areas south of Chatsworth Road (including Wheatbridge Road, Dock Walk and Anna Street West). Topographic data shows flooded properties sit at similar elevation to the top bank, with low spots in the floodplain contributing to inundation. [IMG] (p25)</p></div><div class="nugget-popup"><p>River Hipper is a primary watercourse in the Brampton floodplain and is identified as concentrating the highest flood risk along its banks (Flood Zone 3), contributing to the flooding of adjacent properties and areas. [PAG,IMG] (p26)</p></div><div class="nugget-popup"><p>The River Hipper is within the community floodplain and its Flood Warning Area ('River Hipper at Brampton') covered the majority of properties that flooded internally during the event. Flooding from the Hipper (and associated surface&ndash;water interaction where culverts are present) led to internal flooding of properties in Brampton. [PAG,IMG] (p27)</p></div><div class="nugget-popup"><p>River Hipper rose to very high levels on 20 October 2023 and its rise contributed to fluvial flooding that led to internal flooding in the Brampton community. (p28)</p></div><div class="nugget-popup"><p>Overtopped on the right bank upstream of Factory Street Bridge and was a primary source of floodwater that inundated a derelict brownfield site, flowed onto Factory Street and into the Lidl car park, and generated flow routes into low&ndash;lying areas of the community. [IMG] (p29)</p></div><div class="nugget-popup"><p>The River Hipper overtopped near a derelict brownfield site upstream of Factory Street, inundating that site and initiating flooding of Factory Street, the Lidl car park and downstream sections of Chatsworth Road; the river also surcharged a culvert beneath the Lidl entrance allowing river water to join the road network. [PAG] (p30)</p></div><div class="nugget-popup"><p>The River Hipper overtopped just upstream of the culvert beneath Boythorpe Road, contributing to localised flooding and infrastructure damage. Overtopping and high flows are linked to internal flooding in the adjacent streets and to structural damage (a riparian&ndash;owned brick wall collapsed upstream of the culvert immediately west of Boythorpe Road). [PAG] (p31)</p></div><div class="nugget-popup"><p>Flood Warning issued for the River Hipper at Brampton on 20/10/2023 (11:15). EA/FIDO reported River Hipper flooding with lots of debris and land drainage blockages, a collapsed wall was reported on the Hipper in Chesterfield, and post&ndash;event channel clearance and inspections were carried out (including identification of defects in retaining/boundary walls and a culvert). Floodwater made some properties inaccessible and prompted sandbag requests from local streets. [TAB,MUL] (p32)</p></div><div class="nugget-popup"><p>Flooding along the River Hipper caused internal flooding to businesses at multiple locations as it passed through central Chesterfield. [PAG,IMG] (p51)</p></div><div class="nugget-popup"><p>Overtopping/channel flooding from the River Hipper inundated adjacent floodplain and contributed to flooding of properties and urban areas in Central Chesterfield during the 19 Oct 2023 &ndash; 21 Oct 2023 event. [IMG] (p52)</p></div><div class="nugget-popup"><p>Flooding from the River Hipper led to internal flooding of properties adjacent to the watercourse; a Flood Warning for 'The River Hipper at Central Chesterfield' was issued on 20 Oct 2023 covering the internally flooded properties (excluding one business on Park Road). [PAG,IMG] (p53)</p></div><div class="nugget-popup"><p>The River Hipper overflowed its banks, causing internal flooding to businesses at Queens Park and Ravenside Retail Park; watermarks show substantial internal inundation at affected buildings. [PAG] (p54)</p></div><div class="nugget-popup"><p>The River Hipper overflowed its banks at Queens Park and Ravenside Retail Park, causing internal flooding to businesses in those locations. Floodwater reached approx. 0.7 m depth at a Queens Park business and approx. 0.8 m depth inside an internally flooded business at Ravenside Retail Park; ten businesses at Ravenside/Queens Park were flooded. Hydrology at the Chesterfield Park Road Bridge gauge on the River Hipper recorded an unprecedented peak on 20 October (gauge peak reached 2.93 m). The River Rother overflowed near Hasland Road (about 100 m upstream of its confluence with Spital Brook), causing internal flooding to one commercial property to the west of the river and four residential properties to the east. [IMG] (p55)</p></div><div class="nugget-popup"><p>The River Hipper overtopped near the Clayton Street Bridge, initiating flooding that flowed north down Clayton Street and contributed to internal flooding of properties on Clayton Street. (p57)</p></div><div class="nugget-popup"><p>Internal flooding of properties along the River Hipper in Central Chesterfield during the October 2023 event; Environment Agency issued a Flood Warning for the River Hipper that included the internally flooded properties. (p58)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>7 properties; approximately 50 cm internal flood depth indicated by a watermark on one property (p14)</p></div><div class="nugget-popup quant"><p>7 properties [PAG,IMG] (p15)</p></div><div class="nugget-popup quant"><p>7 residential properties flooded internally; 1 business flooded internally; 6 of the 7 flooded homes were within the 'Upper River Rother catchment' Flood Alert; 5 of the 7 flooded homes are in Flood Zone 3 [IMG,PAG] (p17)</p></div><div class="nugget-popup quant"><p>two internally flooded homes at New Road and Loads Road junction; multiple overtopping locations (unspecified); The Alders flooded from multiple sides [PAG] (p19)</p></div><div class="nugget-popup quant"><p>18 properties; 8 on the north bank; 10 on the south bank; all internally flooded properties within 75 m of the river [PAG,IMG] (p20)</p></div><div class="nugget-popup quant"><p>18 internally flooded properties [PAG,IMG] (p21)</p></div><div class="nugget-popup quant"><p>18 properties; eight on north bank; ten on south bank [PAG,IMG] (p22)</p></div><div class="nugget-popup quant"><p>5 homes; 18 properties (total area&ndash;wide internal flooding across Chatsworth Road, Walton Road, Chapel Lane West and Grove Cottages) [IMG,PAG] (p23)</p></div><div class="nugget-popup quant"><p>192 properties; 137 homes; 55 businesses (p24)</p></div><div class="nugget-popup quant"><p>137 homes; 55 businesses; 192 properties [IMG] (p25)</p></div><div class="nugget-popup quant"><p>137 homes; 55 businesses; 192 properties (total) within the community shown in Table 4&ndash;1; 142 properties had flooded previously (73% of the properties that were internally flooded during Storm Babet). [PAG,IMG] (p27)</p></div><div class="nugget-popup quant"><p>Contributed to internal flooding of 192 properties in Brampton (p28)</p></div><div class="nugget-popup quant"><p>flood depths exceeding 0.5m; up to 1m in some low spots; areas with about 0.4m reported [IMG] (p29)</p></div><div class="nugget-popup quant"><p>flood depths in locations fed by the river overtopping exceeded 0.5m [PAG] (p30)</p></div><div class="nugget-popup quant"><p>one business internally flooded; one riparian&ndash;owned brick wall collapsed [PAG] (p31)</p></div><div class="nugget-popup quant"><p>11 lengths of retaining or boundary walls; 1 culvert defect report; 3 culverts inspected (no issues reported for those); 1 abutment defect report [TAB,MUL] (p32)</p></div><div class="nugget-popup quant"><p>one business at Queen's Park; nine business units south of Ravenside Retail Park; two businesses south of Lordsmill Street; contributed to flooding at the Rother&ndash;Hipper confluence (three homes and four businesses at Spital Lane) [PAG,IMG] (p51)</p></div><div class="nugget-popup quant"><p>10 businesses [PAG] (p54)</p></div><div class="nugget-popup quant"><p>10 businesses; 1 commercial property; 4 residential properties; approx. 0.7 m flood depth at Queens Park business; approx. 0.8 m flood depth at an internally flooded business at Ravenside Retail Park [IMG] (p55)</p></div><div class="nugget-popup quant"><p>10 non&ndash;residential properties (p57)</p></div></div></body></div>`)[0];
                popup_c5c51b8f3bbdac46c83d0128367989e0.setContent(html_b14ca4f01d24121c80361a5c525a7f68);

                var html_d44497ea4b24768c5cb5da19f55a69ef = $(`<div id="html_d44497ea4b24768c5cb5da19f55a69ef" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Doe Lea</h1><div class="nugget-popup"><p>Historic flooding from the River Doe Lea inundated the area now occupied by the Erin Court housing development in June 2007. During Storm Babet (19&ndash;21 Oct 2023) the recorded flood outline overlaps the River Doe Lea corridor and adjacent residential streets (notably the Erin Court development, The Grove and Cottage Close), indicating inundation of the river corridor and nearby properties during that event. It is likely the river/floodplain contributed to the observed flooding. [IMG,MUL] (p5)</p></div><div class="nugget-popup"><p>The River Doe Lea catchment was the subject of a Flood Alert covering parts of Poolsbrook; maintenance of the flap valve where Ditch 1 joins the Doe Lea is being undertaken to ensure continued functionality against flooding. (p9)</p></div></div></body></div>`)[0];

ey Road) internally flooded [PAG] (p12)</p></div><div class="nugget-popup quant"><p>Peak gauge level 2.56m; 10 properties internally flooded in the affected area (9 on Station Road: 8 homes and 1 business; 1 business on Whitting Valley Road) [IMG,PAG] (p13)</p></div></div></body></div>`)[0];

gget-popup"><p>Internal flooding of both residential and non&ndash;residential properties on Chatsworth Road as part of the Brampton inundation caused by high flows in the local watercourses. [TAB] (p28)</p></div><div class="nugget-popup"><p>River floodwater joined Chatsworth Road via the surcharged Lidl culvert and flowed eastwards, pooling at a low spot near School Board Lane/Chatsworth Business Park and flooding properties opposite Bradbury Hall; flooding extended east as far as the Pizza Hut on the north side, with flood depths at the low spot reaching at least 0.5 m. [PAG] (p30)</p></div><div class="nugget-popup"><p>Floodwater on Chatsworth Road acted as the source of runoff that travelled downslope into Hipper Street West and Alma Street West. Properties at the west end of Chatsworth Road (near West Bars Roundabout) suffered internal flooding. [PAG] (p31)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>18 properties flooded (collective for Chatsworth Road and Walton Road): 17 residential semi&ndash;detached; 1 commercial; 8 on the Hipper north bank; 10 on the Hipper south bank [PAG] (p19)</p></div><div class="nugget-popup quant"><p>18 properties; 17 residential; 1 commercial [PAG,IMG] (p20)</p></div><div class="nugget-popup quant"><p>18 internally flooded properties; 17 residential (all semi&ndash;detached); 1 commercial; 11 properties in Flood Zone 2 [PAG,IMG] (p21)</p></div><div class="nugget-popup quant"><p>18 properties; eight on north bank; ten on south bank [PAG,IMG] (p22)</p></div><div class="nugget-popup quant"><p>18 properties (total area&ndash;wide internal flooding across Chatsworth Road, Walton Road, Chapel Lane West and Grove Cottages) [IMG,PAG] (p23)</p></div><div class="nugget-popup quant"><p>34 homes; 34 non&ndash;residential (78 properties total) [TAB] (p28)</p></div><div class="nugget-popup quant"><p>depths at the School Board Lane/Chatsworth Business Park low spot reached at least 0.5m [PAG] (p30)</p></div><div class="nu ridge. Flooding reached depths of up to 1.5 m in some homes and caused one resident fatality. [PAG,IMG] (p49)</p></div><div class="nugget-popup"><p>Emergency services attended during the event; three properties requested sandbags during Storm Babet; Environment Agency operatives deployed pumps to empty a manhole chamber following the event; one resident lost their life during the event. (p50)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>26 residential properties; 1 death [IMG,PAG] (p45)</p></div><div class="nugget-popup quant"><p>17 non&ndash;residential properties; 12 flooded previously in 2007; 1 non&ndash;residential property in Flood Zone 2; 4 non&ndash;residential properties in Flood Zone 1 [IMG,PAG] (p46)</p></div><div class="nugget-popup quant"><p>floodwater depths up to 1.5 m in some homes [PAG,IMG] (p47)</p></div><div class="nugget-popup quant"><p>26 homes; 1 fatality; flood depths of 1.5m in some homes [PAG] (p48)</p></div><div class="nugget-popup quant"><p>26 homes; depths up to 1.5m; 1 fatality [PAG,IMG] (p49)</p></div><div class="nugget-popup quant"><p>three properties; two 75mm pumps (one used); one fatality (p50)</p></div></div></body></div>`)[0];

                var html_6d2bfa443d54c5103cdb35c6c1223c8e = $(`<div id="html_6d2bfa443d54c5103cdb35c6c1223c8e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Derbyshire</h1><div class="nugget-popup"><p>Communities within the county were affected by flooding during Storm Babet, including internal flooding to seven properties in Holymoorside and flooding at Station Road in Chesterfield. (p14)</p></div><div class="nugget-popup"><p>Soil and silt deposits were left on Loads Road (Holymoorside area) after the flood; Derbyshire County Council highways cleared the soil and silt approximately four days after the event. Eighteen properties near Chatsworth Road and Walton Road (approx. 1 km west of Chesterfield) suffered internal flooding during Storm Babet; 17 of the flooded properties were residential (all semi&ndash;detached) and 1 was commercial. Flooding affected properties adjacent to the River Hipper and Walton Dam. [PAG,IMG] (p20)</p></div><div class="nugget-popup"><p>Storm Babet produced a recorded flood outline in this part of Derbyshire. A built&ndash;up area south of Chatsworth Road (including Anna Street West, Wheatbridge Road and Dock Walk) was covered by the recorded flood extent; properties in the community were internally flooded. The Environment Agency historic maps show many of the properties flooded during the event had flooded previously. [IMG] (p25)</p></div><div class="nugget-popup"><p>Flooding in Chesterfield during the event included: River Rother flooding in South Chesterfield that caused internal flooding of homes (west of the Rother); River Hipper issues in Brampton and Chesterfield where patrols found debris and land drainage blockages requiring channel clearance and a reported collapsed wall; and a NIRS report of damage to flood defences at Boythorpe. [IMG,PAG] (p33)</p></div><div class="nugget-popup"><p>Storm Babet caused recorded flood outlines and internal flooding of residential properties in Renishaw. Flooding was concentrated along Smithy Brook and Emmett Carr Brook and their culverted sections, inundating parts of the village. [IMG] (p38)</p></div><div class="nugget-popup"><p>Parts of Derbyshire (Chesterfield area) experienced river flooding from the River Rother that caused internal flooding of properties in Tapton Terrace and neighbouring streets. [IMG] (p45)</p></div><div class="nugget-popup"><p>Portion of the county (Meadow Close, New Whittington) experienced river and surface&ndash;water flooding during Storm Babet; residential properties suffered internal flooding and flood outlines overlapped housing and roads, prompting multi&ndash;agency site visits and engagement. [IMG] (p60)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>7 properties; 1 property with internal flooding at Station Road (p14)</p></div><div class="nugget-popup quant"><p>18 properties; 17 residential properties; 1 commercial property; 8 properties on north bank; 10 properties on south bank; 11 properties in Flood Zone 2 [PAG,IMG] (p20)</p></div><div class="nugget-popup quant"><p>192 properties internally flooded (137 homes; 55 businesses); 142 properties had flooded previously (73% of properties internally flooded during Storm Babet) [IMG] (p25)</p></div><div class="nugget-popup quant"><p>103 properties [IMG,PAG] (p33)</p></div><div class="nugget-popup quant"><p>39 properties [IMG] (p38)</p></div><div class="nugget-popup quant"><p>26 residential properties; 17 non&ndash;residential properties; 1 fatality [IMG] (p45)</p></div><div class="nugget-popup quant"><p>15 properties [IMG] (p60)</p></div></div></body></div>`)[0];

                var html_1731a084adc84726a53ac66bb66734b3 = $(`<div id="html_1731a084adc84726a53ac66bb66734b3" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Chesterfield</h1><div class="nugget-popup"><p>A retail district (with large&ndash;footprint businesses and some residential properties) located on the River Whitting floodplain was flooded. Properties sit close to the top of the river bank and lower than surrounding ground. Flooding during 19 Oct 2023 &ndash; 21 Oct 2023 was more extensive than the June 2007 river flood. The flooded properties are within Flood Zone 3 and are also mapped as high risk of surface water flooding. [IMG] (p11)</p></div><div class="nugget-popup"><p>Floodwater pooled at a low spot on Station Road with reported depths that impeded the road; at least one property suffered internal flooding as indicated by a ~50 cm watermark. A resident on Station Road made a sandbag request on 20 October at 15:00. (p14)</p></div><div class="nugget-popup"><p>River level exceedance of the River Hipper caused flooding across Chesterfield. Properties on multiple streets requested sandbags on 20/10/2023; some properties were inaccessible due to floodwater. Fire and Rescue attended the community. Debris and land drainage blockages were recorded constraining channel capacity; a collapsed wall and other channel/retaining wall defects were reported. Environment Agency and local authorities carried out post&ndash;event channel clearances and inspections, and assisted removal of debris and PFR scheme applications. [TAB] (p32)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties in South Chesterfield concentrated either side of the River Rother; recorded flood outline during Storm Babet inundated the community, causing internal flooding of homes. [IMG,PAG] (p33)</p></div><div class="nugget-popup"><p>Residential properties were flooded on the community floodplain; most of the flooded homes were located west of the River Rother within the Chesterfield South community. [IMG,PAG] (p34)</p></div><div class="nugget-popup"><p>Properties in the Chesterfield South community experienced river&ndash;related and surface water flood impacts; the area lies within Flood Zone 3 and has extensive surface water flood risk. Local flood defences on the River Rother (west bank flood walls and embankments) were a feature of the event and the Avenue Flood Balancing Reservoir upstream operated during the event. [PAG] (p35)</p></div><div class="nugget-popup"><p>Flooding was reported behind the embankment at Hawthorne/Sherwood Street requiring pumping on Sunday morning. Community Information Officers were deployed to Chesterfield; UPR Operations Patrol reported assets in Chesterfield appeared undamaged following patrols. (p38)</p></div><div class="nugget-popup"><p>Homes in the Chesterfield community (including Tapton Terrace) were internally flooded during Storm Babet (Oct 2023). Seventeen non&ndash;residential properties flooded during the event. The Environment Agency flood mapping shows many affected properties lie within Flood Zone 3 adjacent to the River Rother; one non&ndash;residential property is in Flood Zone 2 and four are in Flood Zone 1. [IMG] (p46)</p></div><div class="nugget-popup"><p>Central Chesterfield suffered internal flooding during Storm Babet, affecting streets and retail areas including Camlough Walk, Spital Lane, Hasland Road, Alma Retail Park, Ravenside Retail Park, Clayton Street and Hollis Lane. (p50)</p></div><div class="nugget-popup"><p>Flood warning/alerting and response actions occurred in Chesterfield (Upper River Rother Flood Alert on 19 Oct; River Rother at Tapton Flood Warning on 20 Oct). Emergency services attended Tapton Terrace; Environment Agency deployed Community Information Officers and sent operatives with two 75mm pumps to Tapton Terrace (one used to empty a manhole chamber). Chesterfield Borough Council provided sandbags and conducted post&ndash;event visits. One resident lost their life in Tapton Terrace and a coroner's inquest was opened. [IMG,PAG] (p51)</p></div><div class="nugget-popup"><p>Properties in Central Chesterfield were flooded during the reported event. The Environment Agency Historic Flood Map indicates about half of the flooded properties had previously flooded in November 2000 and June 2007 (from river or surface water). Some flooded properties had no prior records, including properties on Camlough Walk and some on Spital Lane and Hasland Road. Several flooded homes lie in Flood Zone 3 (river floodplain) and other areas show high long&ndash;term surface&ndash;water flood risk. [PAG] (p52)</p></div><div class="nugget-popup"><p>Properties in Central Chesterfield experienced internal flooding during the reported event; flooding affected properties adjacent to the River Hipper and the River Rother, and parts of the urban area were exposed to surface&ndash;water flooding risk. [PAG] (p53)</p></div><div class="nugget-popup"><p>Rivers (River Rother and River Hipper) exceeded channel capacity causing widespread flooding across the community; sewers were overwhelmed in places and surface water runoff exacerbated flooding. Internal flooding affected residences and businesses across the community. [PAG] (p54)</p></div><div class="nugget-popup"><p>Flooding in central Chesterfield was concentrated along the River Hipper and River Rother. Hydrological records (Chesterfield Park Road Bridge, River Hipper) show a peak level of 2.93 m (highest recorded) on 20 Oct 2023, with levels rising from about 02:00 and peaking at ~14:30. Near the River Rother at Hasland Road, one commercial property (west of the river) and four residential properties (east of the river) suffered internal flooding when the Rother overtopped its banks. [IMG,PAG] (p55)</p></div><div class="nugget-popup"><p>Central Chesterfield experienced internal flooding from the River Hipper and River Rother (including properties along Clayton Street, Camlough Walk, Hady Hill and Hollis Lane); Flood Warnings were issued for the River Hipper at Central Chesterfield and River Rother areas during the event. (p58)</p></div><div class="nugget-popup"><p>Flooding in the Chesterfield area during Storm Babet: collapsed banks, a missing flap valve from an outfall and sections of walls in poor condition recorded at Ravenside Retail Park; inspections along the River Hipper and investigations following surcharging at Horns Bridge which may have contributed to local flooding. [PAG] (p59)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>30 cm floodwater at Station Road low spot; ~50 cm internal flooding watermark on one property; 1 property made a sandbag request (p14)</p></div><div class="nugget-popup quant"><p>6 streets requested sandbags; 11 lengths of retaining or boundary walls inspected; 6 defect reports completed; 1 culvert defect reported [TAB] (p32)</p></div><div class="nugget-popup quant"><p>103 properties [IMG,PAG] (p33)</p></div><div class="nugget-popup quant"><p>two flood walls totalling 170m; Hawthorne Street embankment 170m; The Avenue Flood Balancing Reservoir located ~1.7km upstream; reservoir storing about 100m^3 [PAG] (p35)</p></div><div class="nugget-popup quant"><p>17 non&ndash;residential properties; 1 non&ndash;residential property in Flood Zone 2; 4 non&ndash;residential properties in Flood Zone 1; 12 of the 17 non&ndash;residential properties had flooded previously in 2007 [IMG] (p46)</p></div><div class="nugget-popup quant"><p>49 homes and 30 businesses (p50)</p></div><div class="nugget-popup quant"><p>3 properties (requested sandbags in Tapton Terrace); two 75mm pumps deployed; one death [IMG,PAG] (p51)</p></div><div class="nugget-popup quant"><p>49 homes; 30 businesses [PAG] (p54)</p></div><div class="nugget-popup quant"><p>2.93 m peak level on 20 Oct 2023; one commercial property; four residential properties [IMG,PAG] (p55)</p></div><div class="nugget-popup quant"><p>4 homes; 2 businesses; flood depths &gt;1 m (p58)</p></div></div></body></div>`)[0];

                var html_fd24ccad2fbf4a8defa61dbf252e10f4 = $(`<div id="html_fd24ccad2fbf4a8defa61dbf252e10f4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Poolsbrook</h1><div class="nugget-popup"><p>Seven residential properties suffered internal flooding in the main group of houses west of the River Doe Lea during Storm Babet; flooding occurred in the area west of the River Doe Lea with nearby ordinary watercourses and ditches (Pools Brook, Ditch 1, Ditch 2) connected through the local drainage network. [PAG] (p3)</p></div><div class="nugget-popup"><p>Seven residential properties suffered internal flooding during Storm Babet. The recorded Storm Babet flood outline (pink) covered central and eastern parts of the village, particularly areas near Staveley Road, The Grove and Cottage Close. Flooding was associated with local ordinary watercourses and ditches (Pools Brook, Ditch 1 and Ditch 2) in the vicinity of the affected properties. [IMG,PAG,MUL] (p4)</p></div><div class="nugget-popup"><p>Recorded flood outline from Storm Babet (Oct 2023) overlaps parts of the community; homes within the community were flooded during the event and homes near Ditch 1 have high surface&ndash;water flood risk. [IMG,PAG] (p5)</p></div><div class="nugget-popup"><p>Internal flooding occurred to properties within the village during Storm Babet. Six residential properties and one non&ndash;residential property suffered internal flooding across two streets: five properties adjacent to the Staveley Road / Poolsbrook Crescent junction and two newer&ndash;build homes on the Erin Court development. National mapping also shows a high surface&ndash;water flood risk (≥3.3% AEP) for homes near Ditch 1 and along low&ndash;lying areas adjacent to the River Doe Lea. [IMG,PAG] (p6)</p></div><div class="nugget-popup"><p>Flood extent at Poolsbrook covered the low spot at the Staveley Road / Poolsbrook Crescent junction and surrounding area; parts of Erin Court and Staveley Road were impacted and land surrounding Ditch 1 flooded. In total six residential properties and one non&ndash;residential property suffered internal flooding across the area. [PAG] (p7)</p></div><div class="nugget-popup"><p>Floodwater from woodland and from Ditch 2 flowed into the Erin Court housing development, internally flooding two newer&ndash;build homes. That water then flowed downslope along Staveley Road to the low spot at the Staveley Road / Poolsbrook Crescent junction, resulting in internal flooding of properties at that low spot. The sewer network also discharged at locations including the rear of No.58 Staveley Road, the junction of Staveley Road and Poolsbrook Crescent, and from a trunk sewer adjacent to the eastern end of Ditch 1, which contributed to the event. Land surrounding Ditch 1 also flooded. [PAG,IMG] (p8)</p></div><div class="nugget-popup"><p>Floodwater flowed from Ditch 2 and the ordinary watercourse to the south, with a partially blocked headwall identified during investigations as likely contributing to flooding. Overland flow from the ordinary watercourse to the south was also identified as a contributing/exacerbating source. The Environment Agency flood alert covered part of Poolsbrook to the east (though internally&ndash;flooded properties were not located within the alert area). [PAG] (p9)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Seven properties [PAG] (p3)</p></div><div class="nugget-popup quant"><p>7 properties [IMG,PAG,MUL] (p4)</p></div><div class="nugget-popup quant"><p>six residential properties; one non&ndash;residential property; five properties on Staveley Road; two properties on the Erin Court development [IMG,PAG] (p6)</p></div><div class="nugget-popup quant"><p>6 residential properties; 1 non&ndash;residential property [PAG] (p7)</p></div><div class="nugget-popup quant"><p>6 residential properties; 1 non&ndash;residential property; 5 properties on Staveley Road; 2 homes on the Erin Court development [PAG,IMG] (p8)</p></div></div></body></div>`)[0];

                var html_ade1517862fb8bdf5dde077118c68382 = $(`<div id="html_ade1517862fb8bdf5dde077118c68382" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Holymoorside</h1><div class="nugget-popup"><p>Residential properties in the village suffered internal flooding during Storm Babet; the affected area is residential (mostly detached homes). The local primary school did not flood. (p14)</p></div><div class="nugget-popup"><p>Seven residential properties (mostly detached homes) suffered internal flooding during the event. The community lies on the floodplain of the River Hipper; five of the seven flooded homes are in Flood Zone 3 and two in Flood Zone 1. All internally flooded homes have a medium surface water flood risk (some are high). The primary school did not flood. [PAG,IMG] (p15)</p></div><div class="nugget-popup"><p>During Storm Babet (19 Oct 2023 &ndash; 21 Oct 2023) seven homes in the Holymoorside community suffered internal flooding. The community lies on the floodplain of the River Hipper; five of the seven flooded homes are located in Flood Zone 3 and two are in Flood Zone 1. The Environment Agency Historic Flood Map indicates the properties that flooded had not flooded previously. All internally flooded homes are shown as medium risk of surface water flooding on the Long Term Flood Risk Map, and some of these internally flooded homes are shown as high surface&ndash;water risk. The local primary school is the only known vulnerable building type in the community but it did not suffer flooding during Storm Babet. [PAG,IMG] (p16)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties during Storm Babet. Seven residential properties experienced internal flooding and one business also flooded. The community is on the River Hipper floodplain; six of the seven internally flooded homes were covered by the 'Upper River Rother catchment' Flood Alert. Five of the seven flooded homes are in Flood Zone 3 (river &gt;1% AEP); two are in Flood Zone 1. All internally flooded homes have medium surface&ndash;water flood risk; some have high surface&ndash;water flood risk. [PAG] (p17)</p></div><div class="nugget-popup"><p>River Hipper overtopped banks at multiple locations through the village (including near Old Mill Pond), Old Mill Pond overtopped, and floodwater and runoff flowed through the village (notably along Loads Road) pooling at the Loads Road / New Road low spot. This led to internal flooding of residential properties on The Alders, New Road and Loads Road, internal flooding of one business, highway flooding and significant soil/silt deposits on Loads Road. [PAG] (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>7 properties (p14)</p></div><div class="nugget-popup quant"><p>7 properties [PAG,IMG] (p15)</p></div><div class="nugget-popup quant"><p>7 homes; 5 of the 7 homes; 2 of the 7 homes [PAG,IMG] (p16)</p></div><div class="nugget-popup quant"><p>7 residential properties; 1 business; 6 of the 7 homes were within the Flood Alert; 5 of the 7 homes are in Flood Zone 3; 2 of the 7 homes are in Flood Zone 1. [PAG] (p17)</p></div><div class="nugget-popup quant"><p>7 residential properties; 1 business [PAG] (p18)</p></div></div></body></div>`)[0];

                var html_929001ad2fe2c5dfcf600b303f393327 = $(`<div id="html_929001ad2fe2c5dfcf600b303f393327" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Brampton</h1><div class="nugget-popup"><p>A Flood Warning for the River Hipper at Brampton was issued on 20 Oct 2023; the warning area included properties that subsequently flooded internally during the event. [PAG] (p22)</p></div><div class="nugget-popup"><p>Internal flooding of properties in the community during Storm Babet; the River Hipper and Holme Brook flow through the community and contributed to flooding. (p24)</p></div><div class="nugget-popup"><p>Internal flooding of properties within the Brampton community. Flooding occurred in the floodplain of the River Hipper and Holme Brook; topography places many flooded properties at similar elevation to top bank level and in low spots of the floodplain. [IMG,PAG] (p26)</p></div><div class="nugget-popup"><p>Internal flooding of residential and commercial properties across the community; properties sit at similar elevation to top bank level with low spots in the floodplain which contributed to inundation. Some properties had property flood resilience (PFR) measures but many flooded internally. (p27)</p></div><div class="nugget-popup"><p>On 20 October 2023 rising levels on the River Hipper and Holme Brook caused internal flooding across the Brampton community. A total of 192 properties were internally flooded (137 homes and 55 non&ndash;residential). Street&ndash;level counts from the event: Alma Street West 53 homes; Chatsworth Road 34 homes and 34 non&ndash;residential (78 total); Brook Vale 10 homes; Hipper Street West 26 homes; Chester Street 6 homes and 2 non&ndash;residential (8 total); School Board Lane 3 homes; Hardwicks Yard 4 homes; Welfare Avenue 1 home; Factory Street 1 non&ndash;residential; Wheatbridge Road 9 non&ndash;residential; Boythorpe Road 2 non&ndash;residential; Chatsworth Road Business Park 7 non&ndash;residential. [TAB] (p28)</p></div><div class="nugget-popup"><p>Overtopping of the River Hipper (and contributions from Holme Brook) produced flow routes through the Brampton community, concentrating flooding in low&ndash;elevation areas. Impacts included inundation of a derelict brownfield site upstream of Factory Street, flooding of Factory Street (low spot and bridge area), inundation of the Lidl car park, and internal flooding of a public house on Factory Street. Flow paths affected business areas and streets and left debris caught on the Factory Street bridge. [IMG] (p29)</p></div><div class="nugget-popup"><p>Brampton was the location for a Flood Warning for the River Hipper (20/10/2023). The community experienced river flooding with debris and drainage blockages; some properties became inaccessible and multi&ndash;agency response (EA, DCC, Chesterfield Borough Council, Fire & Rescue) attended and provided post&ndash;event assistance including channel clearance, debris removal and drop&ndash;in support events. [TAB,MUL] (p32)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>10 properties [PAG] (p22)</p></div><div class="nugget-popup quant"><p>192 properties; 137 homes; 55 businesses (p24)</p></div><div class="nugget-popup quant"><p>137 homes; 55 businesses; 192 properties flooded total; 142 properties had flooded previously (73%) [IMG,PAG] (p26)</p></div><div class="nugget-popup quant"><p>137 homes; 55 businesses; 192 total properties internally flooded; 142 properties previously flooded (73% of those internally flooded) (p27)</p></div><div class="nugget-popup quant"><p>192 properties; 137 homes; 55 non&ndash;residential; Alma Street West 53 homes; Chatsworth Road 78 properties (34 homes, 34 non&ndash;residential); Brook Vale 10 homes; Hipper Street West 26 homes; Chester Street 8 properties (6 homes, 2 non&ndash;residential); School Board Lane 3 homes; Hardwicks Yard 4 homes; Welfare Avenue 1 home; Factory Street 1 non&ndash;residential; Wheatbridge Road 9 non&ndash;residential; Boythorpe Road 2 non&ndash;residential; Chatsworth Road Business Park 7 non&ndash;residential [TAB] (p28)</p></div><div class="nugget-popup quant"><p>1.6m peak level at Chesterfield Ashgate gauge (20 Oct 2023); Lidl entrance flood depth likely &gt;0.5m; flood depths up to 1m in some locations; low spot at 84.6mAOD noted with depths exceeding 50cm [IMG] (p29)</p></div></div></body></div>`)[0];

                var html_107e40c187f80b0b3e140c309f03c88d = $(`<div id="html_107e40c187f80b0b3e140c309f03c88d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Renishaw</h1><div class="nugget-popup"><p>Residential area in Renishaw experienced internal flooding of homes during Storm Babet; the main cluster of flooded properties is shown adjacent to Smithy Brook and aligned with the mapped flood outlines. (p38)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties concentrated in the area north of the village where Smithy Brook and Emmett Carr Brook run; flood extents coincide with Flood Zone 3 and high surface&ndash;water&ndash;risk areas, inundating houses near Main Road and Emmet Carr Lane. [PAG,IMG] (p39)</p></div><div class="nugget-popup"><p>Internal flooding of properties during Storm Babet; recorded flood outline concentrated near Emmett Carr Lane and Main Road; high surface&ndash;water flood risk adjacent to Emmett Carr Brook and Smithy Brook affecting residential streets and properties. [PAG] (p40)</p></div><div class="nugget-popup"><p>Overtopping of Smithy Brook at its culvert inlet (and overtopping of Emmett Carr Brook upstream of its culvert inlet), exacerbated by culvert/trash&ndash;screen blockages, caused pooling and flow routes through Renishaw. Floodwater flowed west along Smithy Brook Road flooding four businesses, flowed onto the Main Road and east along the A6135 flooding six homes, then flowed south along Emmett Carr Lane flooding eighteen homes. Internal flood depths were reported at 0.2m&ndash;0.8m on Sheffield Road and up to 1.2m inside a property on Emmett Carr Lane. Reports indicate peak severity on 20 Oct between 12:00 and 14:00. [IMG] (p42)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>39 properties (p38)</p></div><div class="nugget-popup quant"><p>39 properties [PAG,IMG] (p39)</p></div><div class="nugget-popup quant"><p>4 businesses [PAG] (p40)</p></div><div class="nugget-popup quant"><p>4 businesses; 6 homes; 18 homes; internal depths 0.2m&ndash;0.8m; internal depth up to 1.2m at one property [IMG] (p42)</p></div></div></body></div>`)[0];
