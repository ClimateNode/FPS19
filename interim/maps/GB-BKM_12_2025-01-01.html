                var html_2cf5c67e43c575f3dfd5791e9ca4f962 = $(`<div id="html_2cf5c67e43c575f3dfd5791e9ca4f962" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Thames</h1><div class="nugget-popup"><p>The River Thames experienced very high flows with peaks in January and February 2014; these high main&ndash;river levels rose into the Medmenham area, coming up Ferry Lane and causing inundation of roads and houses and preventing drains from discharging. [MUL] (p4)</p></div><div class="nugget-popup"><p>The River Thames is identified as the dominant source of flooding in the area; river levels (constrained by locks and weirs at Mill End (Hambleden) upstream and Hurley downstream) led to inundation of the Medmenham floodplain. There are no flood defences along this stretch, contributing to flood impact on the village. (p10)</p></div><div class="nugget-popup"><p>The River Thames is identified as the primary driver of flooding in the area; river levels dominate the mapped flood extent and the Thames (constrained by upstream and downstream locks/weirs) causes inundation of the Medmenham floodplain shown as Flood Zone 3. [PAG,IMG] (p12)</p></div><div class="nugget-popup"><p>River levels rose during the winter event; the Thames broke its banks west of Medmenham and water flowed across the floodplain. This breach initiated floodwater propagation up Ferry Lane, across land to the bridge near Abbey Cottages, and produced a dominant north&ndash;east flood flow toward wetlands adjacent to New Lock Lane, causing property flooding in the southern part of Ferry Lane. (p15)</p></div><div class="nugget-popup"><p>High River Thames levels and bank overtopping caused local land drains to back up and break their banks; this led to flood water moving westwards, contributing to property flooding in west Medmenham and to flooding on the north of Ferry Lane (Common Moor and land south of the church) when the river broke its banks west of Ferry Lane. [PAG] (p16)</p></div><div class="nugget-popup"><p>The River Thames overtopped its banks during the January&ndash;February 2014 event and was the primary source of flooding that flowed inland across fields and into the Medmenham area, producing fast&ndash;flowing water across roads (e.g. Ferry Lane) and extensive inundation of low&ndash;lying land and properties. [IMG] (p18)</p></div><div class="nugget-popup"><p>River Thames levels backed up into low&ndash;lying areas around Medmenham, overflowing into Ferry Lane and adjoining ditches and contributing to flooding of local properties and infrastructure (bridges were covered at times and water flowed into adjacent land). [TAB] (p21)</p></div><div class="nugget-popup"><p>The River Thames rose and breached its banks (south of Hambleden Lock), sending water across fields toward the former Water Research Centre; flows met on Ferry Lane and caused the road to become impassable (except by boat or tractor) and inundated nearby houses. The January and February 2014 events produced prolonged high flows. [PAG,MUL] (p23)</p></div><div class="nugget-popup"><p>The River Thames was at very high levels and breached its banks upstream during January&ndash;February 2014, sending floodwater across fields toward Medmenham and causing back&ndash;up in surface water channels, ditches and wetland areas which contributed to property flooding and restricted access. (p27)</p></div><div class="nugget-popup"><p>Identified as the watercourse related to flooding in Medmenham; prompted consideration of capital works on the Thames to protect Medmenham and led to changes to flood warning arrangements. [TAB] (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Typically 1 m deep over fields; parts noted up to 1 m depth with localized inundation lasting up to 3 months (north&ndash;east area) [IMG] (p18)</p></div><div class="nugget-popup quant"><p>15 properties flooded [TAB] (p21)</p></div><div class="nugget-popup quant"><p>Upstream Jan 2014 water level peak 29.61m; Upstream Feb 2014 water level peak 29.67m; Downstream Jan 2014 water level peak 29.1m; Downstream Feb 2014 water level peak 29.13m [PAG,MUL] (p23)</p></div></div></body></div>`)[0];

        var popup_3828c70ae7ff9f1016101aaf9a77127e = L.popup({});

        
            
                var html_047951130dbba3bff622c0131d36a39c = $(`<div id="html_047951130dbba3bff622c0131d36a39c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ferry Lane, Medmenham</h1><div class="nugget-popup"><p>High River Thames levels came up Ferry Lane, leading to inundation of the main route and contributing to flooding of roads and houses in the village; associated drainage (highways and field drains) could not discharge due to high river levels. [MUL] (p4)</p></div><div class="nugget-popup"><p>River Thames levels rose and floodwater progressed up Ferry Lane from the slipway. When the Thames broke its banks west of Medmenham water travelled across the floodplain to the bridge near Abbey Cottages and then flowed northeast toward the wetlands adjacent to New Lock Lane. Properties typically affected are those south of the 'white bridge', notably Abbey Cottages and the entrance to Medmenham Abbey; once the Thames has broken its banks practically all properties south of Abbey Cottages can be impacted. Some raised properties were surrounded by floodwater. (p15)</p></div><div class="nugget-popup"><p>When the River Thames broke its banks west of Ferry Lane the combined floodwater exacerbated drainage backup and caused property flooding in the area. (p16)</p></div><div class="nugget-popup"><p>Ferry Lane experienced fast&ndash;flowing floodwater from the River Thames during the Jan&ndash;Feb 2014 event. Flood depths reached up to 80 cm there, making the road impassable and preventing many residents from accessing their houses. Bucks Fire & Rescue deemed the road and floodwater too dangerous to cross (even in 4x4 vehicles); a tractor taxi service was used to transport residents. Owners of some properties operated pumps to limit water ingress. [IMG,PAG] (p18)</p></div><div class="nugget-popup"><p>Road flooded with west&ndash;to&ndash;east flowing water, preventing pedestrian and vehicle access; many residents could not reach their houses and normal access was replaced by a 'tractor taxi'. Road and floodwater judged too dangerous to cross even in 4x4 vehicles. [TAB,PAG] (p19)</p></div><div class="nugget-popup"><p>Ferry Lane was inundated, restricting and limiting access to multiple properties and hampering response; flood depths on the lane and at property entrances were measured and caused water ingress to houses. [TAB,PAG] (p20)</p></div><div class="nugget-popup"><p>River Thames water backed up into Ferry Lane: lane flooded, water flowed rapidly along Ferry Lane and over the bridge, water reached as far as Southlands. Sandbags were delivered and rescue activity took place on Ferry Lane. Floodwater later drained into ditches and levels fell over the following days. [TAB,PAG,MUL] (p21)</p></div><div class="nugget-popup"><p>Repeated floodwater flowed up Ferry Lane from the River Thames and from adjacent higher ground, crossing and covering the bridge, flowing fast along the lane and across the road. At times water was &#8216;all the way up Ferry Lane&#8217; and drained later via roadside ditches; by later dates flow reduced to puddles and drainage. Residents recorded depths and sandbagging occurred nearby. [TAB,PAG,MUL] (p22)</p></div><div class="nugget-popup"><p>River Thames rose and flowed up Ferry Lane, flooding the road and surrounding houses; the road was made impassable except by boat or tractor. After the peaks water was still coming up Ferry Lane (noted 21 February 2014) then reduced to very slight flow and began draining via the roadside ditch with puddles remaining (noted 22 February 2014). [TAB,PAG] (p23)</p></div><div class="nugget-popup"><p>Floodwater from the Thames flowed up Ferry Lane from the south and met flows from across the fields, flooding the road and houses; the road was made impassable except by boat or tractor and houses were flooded to significant depth. [PAG] (p24)</p></div><div class="nugget-popup"><p>Floodwater rose up Ferry Lane as the River Thames levels increased; Ferry Lane acted as a source/path for floodwater flowing into fields and properties and contributed to the backing up of drainage channels. (p27)</p></div><div class="nugget-popup"><p>Measured river flood depth at the shallowest position in Ferry Lane (near the river): 27 cm on 11.1.2014 (corrected to 29 cm), indicating local inundation at the low point of the lane. [TAB] (p33)</p></div><div class="nugget-popup"><p>Flood depths were recorded along Ferry Lane (datum: left gate post) on 12 January 2014. Recorded depths (measured; corrected by +13 cm where indicated) include: Monkshood 22 cm (35 cm corrected); Olmeda 43 cm (56 cm corrected); Abbey Drive 10 cm (23 cm corrected); Ferry Nab 35 cm (48 cm corrected); Abbey Lodge 45 cm (58 cm corrected); 1 Abbey Cottage 56 cm (69 cm corrected); Gate of Monks Cottage 58 cm (71 cm corrected); H sign on wall of Ferry Nab 36 cm (49 cm corrected); Base of 'beware river' traffic sign 22 cm (35 cm corrected). [TAB] (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Water depth up to 80 cm; map shows a circle labeled '18' at Ferry Lane (likely indicating 18 properties affected) [IMG,PAG] (p18)</p></div><div class="nugget-popup quant"><p>80 cm; 60 cm; two houses evacuated [TAB,PAG] (p19)</p></div><div class="nugget-popup quant"><p>60 cm; 5 inches; 18 inches; 3 foot; 4 inches; 8 inches; 1 inch; 5 mm [TAB,PAG] (p20)</p></div><div class="nugget-popup quant"><p>15 properties flooded at Medmenham; water fell by 4 inches and 5 inches (measured during recession) [MUL] (p21)</p></div><div class="nugget-popup quant"><p>29cm (11.1.2014 corrected) [TAB] (p33)</p></div><div class="nugget-popup quant"><p>Monkshood 22 cm (35 cm); Olmeda 43 cm (56 cm); Abbey Drive 10 cm (23 cm); Ferry Nab 35 cm (48 cm); Abbey Lodge 45 cm (58 cm); 1 Abbey Cottage 56 cm (69 cm); Gate of Monks Cottage 58 cm (71 cm); H sign on wall of Ferry Nab 36 cm (49 cm); Base of 'beware river' traffic sign 22 cm (35 cm) [TAB] (p34)</p></div></div></body></div>`)[0];
                popup_3828c70ae7ff9f1016101aaf9a77127e.setContent(html_047951130dbba3bff622c0131d36a39c);

                var html_8ee6f166274b454f8ef0c25390b153ab = $(`<div id="html_8ee6f166274b454f8ef0c25390b153ab" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Buckinghamshire</h1><div class="nugget-popup"><p>When the River Thames rose, water flowed up Ferry Lane from the south flooding the road and houses. A second flow route occurred when the Thames broke its banks south of Hambleden Lock and flowed across fields towards and through the site of the former Water Research Centre. The two flow routes met on Ferry Lane, making the road impassable except by boat or tractor and flooding houses to a significant depth. (p24)</p></div></div></body></div>`)[0];

                var html_99bc35098cb672c0c266b691495d4346 = $(`<div id="html_99bc35098cb672c0c266b691495d4346" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Medmenham</h1><div class="nugget-popup"><p>The village experienced flooding when very high River Thames levels rose and came up the main route (Ferry Lane), inundating roads and flooding houses. High river levels also prevented highways and field drains from discharging. [MUL] (p4)</p></div><div class="nugget-popup"><p>A flood incident occurred in Medmenham during the January&ndash;February 2014 event, prompting an investigation. The village lies immediately adjacent to the River Thames with the main route (Ferry Lane) running down to the river; the settlement includes low&ndash;lying open areas, fields and drainage ditches alongside the Thames that are described in the investigation context as relevant to the flood incident. [PAG] (p6)</p></div><div class="nugget-popup"><p>The village is on a natural floodplain south of the A4155 and was affected by flooding dominated by the River Thames. Flood Zone 3 / the 1&ndash;in&ndash;100&ndash;year model extent covers almost the entire village; low&ndash;lying land (~30&ndash;31 m AOD) and properties along Ferry Lane and near New Lock Lane lie within the floodplain and were at risk of inundation. There are no flood defences on this stretch of river, increasing exposure. (p10)</p></div><div class="nugget-popup"><p>The village lies on the natural Thames floodplain south of the A4155 and is shown as being within Flood Zone 3. Flooding in the area is dominated by the River Thames; low&ndash;lying parts of the village (notably south of the A4155 and along Ferry Lane, with additional properties near New Lock Lane) are at high risk of inundation. There are no flood defences along this stretch of river and river levels are controlled by nearby locks and weirs, contributing to flood risk. [PAG] (p12)</p></div><div class="nugget-popup"><p>The River Thames rose and broke its banks west of Medmenham, sending floodwater north&ndash;east across the floodplain into the village. Flooding progressed up Ferry Lane from the slipway, affected the eastern side of Medmenham Abbey and, once banks had breached further west, created a dominant NE flow that inundated wetlands and led to property flooding in the southern half of Ferry Lane (notably south of the white bridge and Abbey Cottages). Some raised properties were surrounded by water. [PAG] (p15)</p></div><div class="nugget-popup"><p>When the River Thames was high the land drains backed up and broke their banks, sending floodwater westwards into the main part of Medmenham and inundating gardens and properties; the situation was worsened when the Thames breached its banks west of Ferry Lane. (p16)</p></div><div class="nugget-popup"><p>Medmenham was impacted by river flooding in January and February 2014 (onset December 2013) with flood marks and resident reports indicating inundation. Local groundwater emergence also caused prolonged flooding of the back gardens of one bungalow. [PAG,MUL] (p17)</p></div><div class="nugget-popup"><p>Flooding from the River Thames overtopping affected the Medmenham area in January&ndash;February 2014. Properties were inundated; most residents remained in their homes, some used pumps to limit ingress, and two houses were evacuated. Access to some houses was prevented by deep floodwater on local roads (notably Ferry Lane). A tractor taxi was used to move people because roads were unsafe. [IMG,PAG] (p18)</p></div><div class="nugget-popup"><p>Flooding from the River Thames and backed&ndash;up flows inundated gardens, drives and local roads. Gardens and drive were fully immersed to depths reported between 30 cm and 1 m (about 0.5 m average). A house flooded to a maximum depth of 20 cm in February 2014; other houses had no water inside in January 2014. The boat yard area was flooded (estimated inches depth). Water reached up Ferry Lane to Southlands and covered a bridge; water was reported just inside Abbey Gates and at the level of Weybrooks garage. Bucks Fire & Rescue Service recorded 15 properties flooded in Medmenham during the event. [TAB,MUL] (p21)</p></div><div class="nugget-popup"><p>Low&ndash;lying areas in Medmenham were flooded when Thames water flowed up Ferry Lane from the south, flooding the road and houses. Ferry Lane and the road were made impassable (only passable by boat or tractor). During the February 2014 episode water was still coming up Ferry Lane (noted 21 Feb) then by 22 Feb was mostly draining via roadside ditches and puddles remained. [MUL] (p23)</p></div><div class="nugget-popup"><p>The River Thames at very high levels caused flooding in Medmenham. 23 properties were affected, 10 experienced internal flooding and two homes were evacuated. Around half of properties were impacted either by internal flooding or restricted access; the disruption was extensive and occurred twice over the January&ndash;February 2014 events. (p27)</p></div><div class="nugget-popup"><p>Experienced flooding associated with the River Thames that led to calls for improved emergency response, temporary defences, community flood planning and investigation of capital works to reduce future flood risk. [TAB] (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>two flood events; one bungalow [PAG,MUL] (p17)</p></div><div class="nugget-popup quant"><p>2 houses evacuated [IMG,PAG] (p18)</p></div><div class="nugget-popup quant"><p>30cm to 1m; 0.5m average; 20cm; 2&ndash;3 inches; 15 properties [TAB,MUL] (p21)</p></div><div class="nugget-popup quant"><p>23 properties; 10 internal flooding; 2 homes evacuated (p27)</p></div></div></body></div>`)[0];
                popup_0ca4cbf132b040de26c16ab4c8e73580.setContent(html_99bc35098cb672c0c266b691495d4346);
