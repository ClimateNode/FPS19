                var html_a5d4e7cff60cab719393222bb3dd4cba = $(`<div id="html_a5d4e7cff60cab719393222bb3dd4cba" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Leck</h1><div class="nugget-popup"><p>Water levels in the River Leck rose rapidly on the morning of 9 March, overtopping banks through Church End. Floodwater flowed the full length of the village road (onto which most properties front). Overland flows from saturated valley sides also contributed. Two properties on Church End were affected by overtopping floodwater; residents deployed their own flood prevention measures and no internal property damage was sustained. (p13)</p></div><div class="nugget-popup"><p>High water levels in the River Leck produced fast&ndash;flowing floodwater (deepest at the bridge) that reached up to approximately 1 m depth, making the only vehicular access to the village impassable for hours and isolating Leckhampstead. (p15)</p></div><div class="nugget-popup"><p>Rapid river response in the River Leck catchment following intense rainfall on already&ndash;saturated soils. Very little rain was retained in the soil; quick throughflow and some overland flow rapidly routed water into stream channels, producing high peak flows and consequent river flooding across the catchment. [PAG,IMG] (p19)</p></div><div class="nugget-popup"><p>High levels in the River Leck (and its inability to discharge to the Great Ouse when that river is high) contributed to flooding of adjacent infrastructure, notably causing flooding of the A422 and isolating the village. (p27)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Two properties (p13)</p></div><div class="nugget-popup quant"><p>approx 1 m depth (p15)</p></div></div></body></div>`)[0];

                var html_0e31ccc65da22fc2a43bd3813fc010b6 = $(`<div id="html_0e31ccc65da22fc2a43bd3813fc010b6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Great Ouse</h1><div class="nugget-popup"><p>The River Great Ouse exhibited elevated flows at Thornborough, rising above the 0.73 m flood threshold on 9 March and peaking at just above 1.0 m by the morning of 10 March, close to historical high levels. [IMG] (p14)</p></div><div class="nugget-popup"><p>High water levels in the Great Ouse prevented the River Leck from discharging, contributing to flooding of the A422 and compounding the isolation of Leckhampstead. [TAB] (p15)</p></div><div class="nugget-popup"><p>Rising levels on the Great Ouse were the main concern during the 8&ndash;9 March 2016 event; in places the river was on the verge of breaking its banks and sections of road were closed where the river rose significantly (A422 Stratford Road was closed where the river had risen). (p21)</p></div><div class="nugget-popup"><p>High water levels in the Great Ouse prevented the River Leck from discharging, which led to local flooding impacts including inundation and closure of the A422. (p27)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>exceeded 0.73 m flood threshold; peaked just above 1.0 m; highest recorded 2.24 m [IMG] (p14)</p></div><div class="nugget-popup quant"><p>river rose by 1.6m in places (p21)</p></div></div></body></div>`)[0];

                var html_181b6f476a9e84e88773c8881a5e8184 = $(`<div id="html_181b6f476a9e84e88773c8881a5e8184" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Buckinghamshire</h1><div class="nugget-popup"><p>Parts of Buckinghamshire within the River Leck catchment experienced intense, concentrated rainfall on saturated ground, which generated rapid runoff and high peak river flows leading to flooding in the catchment. [PAG,IMG] (p19)</p></div><div class="nugget-popup"><p>Heavy rain on 08 Mar 2016 &ndash; 09 Mar 2016 caused flooding incidents across the area. Transport for Buckinghamshire closed a number of roads. The Great River Ouse in places approached or threatened to break its banks; the A422 Stratford Road was closed where the river had risen (reported locally up to 1.6 m in places). Other localities including Buckingham and Beachampton also faced flooding incidents. (p21)</p></div><div class="nugget-popup"><p>Transport for Buckinghamshire crews attended multiple road flooding incidents across the county on 9 March 2016. Impacts included flooded carriageways and at least one road closure (Main Street, Beachampton). Roads affected included Stratford Road (Leckhampstead and Buckingham), Grenville Road (Buckingham), Ford Street (Buckingham), Winslow Road (Padbury and Nash), Main Street (Gawcott), Nash Road (Beachampton), Buckingham Road (Newton Purcell), Church Hill and Lillingstone Road (Akeley), Edgcott Road (Grendon Underwood), Verney Road (Addington) and Fulwell Road (Westbury). Responses were recorded as complete for attended incidents. [TAB] (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>18 transport response sites; 1 road closure; 3 incidents in Buckingham; 2 incidents on Winslow Road; 2 incidents in Beachampton; 2 incidents in Akeley; 1 incident each in Gawcott, Newton Purcell, Grendon Underwood, Nash, Leckhampstead, Addington, Westbury [TAB] (p22)</p></div></div></body></div>`)[0];

                var html_4a8a4649ee69f0eece790cb0f1cf86e6 = $(`<div id="html_4a8a4649ee69f0eece790cb0f1cf86e6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Leckhampstead</h1><div class="nugget-popup"><p>Leckhampstead was the subject of a formal flood investigation (Flood Investigation Report) dated 9 March 2016, indicating a flood event affected the settlement and prompted the investigation. [IMG] (p1)</p></div><div class="nugget-popup"><p>Water levels in the River Leck rose rapidly and overtopped the banks, combined with overland flows from saturated valley sides; this resulted in floodwater affecting properties and making the village access route impassable for a number of hours. (p5)</p></div><div class="nugget-popup"><p>Rapid onset flooding with high&ndash;velocity, deep floodwater across the main access route that isolated the village for a few hours. (p6)</p></div><div class="nugget-popup"><p>The village of Leckhampstead was affected by flooding associated with the River Leck catchment during the incident; floodwater inundated parts of the settlement. [IMG] (p8)</p></div><div class="nugget-popup"><p>March 2016 flooding exhibited a rapid onset that caused highway access and egress problems isolating the village, posed a hazard to people due to depth and velocity of floodwater, and resulted in some houses experiencing internal flooding. The text records repeated historical flood occurrences affecting the village in 1932; 1959; 1983; 1986; 1988; 1990; Easter 1998; February 2001; July 2007; October 2007. [MUL] (p12)</p></div><div class="nugget-popup"><p>Floodwater from the River Leck, aided by overland flows from saturated valley sides, flowed the full length of the road through the village, affecting property frontages; residents deployed local flood prevention measures and no internal property damage was sustained. (p13)</p></div><div class="nugget-popup"><p>Leckhampstead experienced flooding driven by a rapid river response and high peak flows on the River Leck after intense rainfall fell on an already&ndash;saturated catchment (causing rapid throughflow and some surface saturation). [PAG,IMG] (p19)</p></div><div class="nugget-popup"><p>During 08 Mar 2016 &ndash; 09 Mar 2016 the village was covered by a Flood Alert for the Upper Ouse that was of limited relevance (based on Great Ouse levels rather than the River Leck). Village residents signed up to receive the alert did not receive it due to a delayed update, reducing local preparedness for the flood event. (p21)</p></div><div class="nugget-popup"><p>Flooding affected the Leckhampstead area on 9 March 2016 (Stratford Road reported as flooded); Transport for Buckinghamshire responded to the incident and recorded it as 2hr/Flooding (COMPLETE). [TAB] (p22)</p></div><div class="nugget-popup"><p>Rapid rise of the River Leck and overland flows on saturated ground caused floodwater through the village: main highway access routes were impassable for hours, floodwater flowed along the full length of the only street (onto which many properties front), and properties were affected by deep, fast&ndash;flowing water. (p26)</p></div><div class="nugget-popup"><p>Intense rainfall recorded by the HYRAD radar over the area on 09/03/2016 is associated with the flood event affecting Leckhampstead on 08&ndash;09/03/2016. The rainfall led to flooding in the Leckhampstead area. (p39)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 properties (p5)</p></div><div class="nugget-popup quant"><p>Two properties (p13)</p></div><div class="nugget-popup quant"><p>2 properties (p26)</p></div></div></body></div>`)[0];
