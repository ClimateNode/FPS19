ts</i><div class="nugget-popup quant"><p>7 properties [PAG] (p21)</p></div><div class="nugget-popup quant"><p>7 properties [IMG] (p22)</p></div><div class="nugget-popup quant"><p>7 residential properties [PAG] (p33)</p></div></div></body></div>`)[0];
