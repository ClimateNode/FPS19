                var html_235a63eb497423f467025f374eaf3e95 = $(`<div id="html_235a63eb497423f467025f374eaf3e95" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lyveden Brook</h1><div class="nugget-popup"><p>Overtopping of Lyveden Brook during the incident caused high risk of internal flooding to residential properties; damage and loss occurred due to the depth and velocity of the overtopping water. [PAG] (p9)</p></div><div class="nugget-popup"><p>Inspection during the flood investigation found a severe narrowing of the watercourse upstream of Stoke Doyle Road with a section of barbed wire across the channel and a build&ndash;up of debris, indicating obstruction and elevated flow conditions; downstream reaches were described as narrow and shallow and the brook flows to the River Nene. [PAG] (p10)</p></div><div class="nugget-popup"><p>Depth and flow of water from Lyveden Brook caused flooding that affected people and property during the event; listed as the cause of various incidents of flooding on 28/10/2013. [PAG] (p11)</p></div><div class="nugget-popup"><p>Banks overtopped; reported to be over one metre higher than normal and flowing strongly. High water from the brook caused high&ndash;velocity overland flow across garden boundaries at Warren Bridge, led to significant damage to outbuildings, came close to internally flooding a residential property, and high levels upstream affected sports facilities (closure). (p12)</p></div><div class="nugget-popup"><p>An excessive flow in Lyveden Brook caused raised water levels and strong flows that overtopped banks and affected adjoining property; reductions in the cross&ndash;sectional area of the watercourse are identified as a factor in the high velocity and depth of flow. (p17)</p></div><div class="nugget-popup"><p>Reductions to the cross&ndash;sectional area of the watercourse and man&ndash;made flow controls upstream and downstream of Warren Bridge increased flow velocity and water depth, contributing to flooding at this location; these factors were identified for further investigation by the responsible owners. (p18)</p></div><div class="nugget-popup"><p>Overtopping / insufficient channel capacity from Lyveden Brook contributed to flooding in the town catchment, prompting recommendations to reinstate historic drainage (re&ndash;excavate ditches, repair/replace piped/culvert sections, dredge and trim watercourses, replace structures and clear vegetation) to reduce future flood risk. [PAG] (p19)</p></div><div class="nugget-popup"><p>Lyveden Brook overtopped its banks and discharged muddy floodwater into adjacent private gardens and yards, submerging vegetation and enabling water to reach house bases. [IMG,PAG] (p44)</p></div><div class="nugget-popup"><p>Lyveden Brook was swollen and overflowed its banks, producing muddy, high&ndash;velocity flow that submerged the bases of trees and shrubs and inundated the rear of a nearby property and gardens. [IMG,PAG] (p45)</p></div><div class="nugget-popup"><p>Lyveden Brook overflowed its banks, inundating adjacent vegetation and land; trees and shrubs were partially submerged and water encroached onto the embankment. [IMG] (p47)</p></div><div class="nugget-popup"><p>High water levels observed along Lyveden Brook at the rear of Warren Bridge. Evidence of elevated flows and deposits of debris at a public sewer outfall opposite Warren Bridge. [IMG] (p49)</p></div><div class="nugget-popup"><p>High water levels were observed at a public sewer outfall opposite Warren Bridge, with deposits of debris indicating the brook reached elevated levels and overtopped or reached infrastructure margins. [IMG,PAG] (p51)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over one metre higher than normal; approximately two days (p12)</p></div></div></body></div>`)[0];

                var html_1d947627888d7befdb3b519c41d2cec6 = $(`<div id="html_1d947627888d7befdb3b519c41d2cec6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Biggin Fish Pond</h1><div class="nugget-popup"><p>During the flood investigation the inflow to the silt pond was observed to be at a high level and there was evidence that water levels had been higher, with debris deposited around the pond banks; the main lake discharges via a weir and spillway when levels exceed the weir capacity and some historic outlet structures east of the lake were found disused or non&ndash;operational. (p10)</p></div><div class="nugget-popup"><p>Identified as a feature to inspect after the 28 October 2013 flood incident: the Environment Agency was asked to review inspection and supervision under the Reservoirs Act 1975 and to consider an immediate inspection to assess current flow controls, water and silt levels, and any recent changes to sluice/overflow arrangements that could have affected downstream flows. (p20)</p></div><div class="nugget-popup"><p>The pond spilled over its grassy spillway/overflow and discharged water via the main dam/weir into Lyveden Brook. Photographs show the spillway overtopping but the embankment appeared vegetated and without obvious erosion. [IMG,PAG] (p53)</p></div><div class="nugget-popup"><p>Elevated water levels in the upstream silt pond caused pond water to encroach onto and partially flood a woodland/dirt path alongside the pond. Photographs show the waterline reaching the path and high water at the point where a watercourse enters the upstream silt pond (stone culvert/bridge). [IMG,PAG] (p58)</p></div></div></body></div>`)[0];
                popup_5d8edcbdb3a34d5d280fc628e2b39c7e.setContent(html_1d947627888d7befdb3b519c41d2cec6);

                var html_25919c114c197ca94fe0044280ff8a7a = $(`<div id="html_25919c114c197ca94fe0044280ff8a7a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Warren Bridge, Oundle</h1><div class="nugget-popup"><p>Flooding of gardens at Warren Bridge and significant damage to outbuildings at a residential property (impacts recorded for the 28/10/2013 event). The location also experienced garden flooding on 04/11/2012 and 22/12/2012, and internal flooding of at least one residential property in Spring 1998. [TAB,MUL] (p11)</p></div><div class="nugget-popup"><p>Rear gardens became flooded; varying risk to dwellings depending on floor level. High&ndash;velocity flow across garden boundaries caused significant damage to outbuildings and nearly internally flooded a residential property. Land opposite the rear gardens was also flooded. (p12)</p></div><div class="nugget-popup"><p>Man&ndash;made controls of the natural flow upstream and downstream of Warren Bridge, and reductions in the watercourse cross&ndash;sectional area in that area, are identified as contributing factors to the high velocity and depth of water during the flood. (p17)</p></div><div class="nugget-popup"><p>Muddy floodwater pooled up to the house wall at the property by Warren Bridge and partially entered the adjoining garage, affecting access and property safety. [IMG,PAG] (p42)</p></div><div class="nugget-popup"><p>Rear garden and patio inundated by floodwater (Lyveden Brook adjacent); outdoor furniture and potted plants partially submerged; a summer house was moved/rotated on its footings and the patio area was submerged by muddy water. [IMG,PAG] (p43)</p></div><div class="nugget-popup"><p>Floodwater from Lyveden Brook overtopped nearby banks and inundated rear gardens adjacent to Warren Bridge; water reached up to the base of houses and garden areas, moving/rotating a summer house on its footings and submerging garden structures. [IMG,PAG] (p44)</p></div><div class="nugget-popup"><p>Area at the rear of a property adjacent to Warren Bridge was inundated when Lyveden Brook overflowed; high&ndash;velocity floodwater flowed from a neighbouring garden into the property's rear/passageway, threatening structures and submerging vegetation. [IMG,PAG] (p45)</p></div><div class="nugget-popup"><p>High&ndash;velocity, turbulent muddy water flowed from a neighbouring property's garden into the rear of a property at Warren Bridge, passing forcefully through a wooden fence and inundating the rear area and narrow passage. [PAG] (p46)</p></div><div class="nugget-popup"><p>High&ndash;velocity flow of floodwater entered the rear garden from neighbouring property; garden and grounds were inundated and floodwater reached and surrounded a small outbuilding at the rear of the property. [IMG,PAG] (p47)</p></div><div class="nugget-popup"><p>High water levels recorded at the rear of Warren Bridge; nearby public sewer outfall opposite the bridge showed evidence of high water and deposits of debris. [IMG,PAG] (p49)</p></div><div class="nugget-popup"><p>Public sewer outfall opposite Warren Bridge was nearly submerged (water level near top of brick structure) with deposits of debris; Lyveden Brook at the rear of Warren Bridge also showed evidence of high water levels and debris deposits. [IMG,PAG] (p50)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 residential property (damage to outbuildings on 28/10/2013); 1+ residential property (internal flooding in Spring 1998) [TAB,MUL] (p11)</p></div></div></body></div>`)[0];

                var html_4666a0a555d85cae4a902007e925b05c = $(`<div id="html_4666a0a555d85cae4a902007e925b05c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Northamptonshire</h1><div class="nugget-popup"><p>A formal Section 19 flood investigation was carried out by the LLFA into a flood incident in Oundle (within Northamptonshire) on 28 October 2013. The incident was caused by high flows in an Ordinary Watercourse leading to overtopping of its banks and overflow affecting private property. (p6)</p></div><div class="nugget-popup"><p>Extreme flooding occurred in the town of Oundle (within Northamptonshire). The flooding was described as extreme in nature and extent and prompted the Lead Local Flood Authority to carry out a formal Section 19 investigation despite the county thresholds for a formal investigation not being formally met. (p8)</p></div></div></body></div>`)[0];

                var html_a89ae6b6153a47be454ecdc6ecd607ee = $(`<div id="html_a89ae6b6153a47be454ecdc6ecd607ee" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Oundle</h1><div class="nugget-popup"><p>High water levels and strong flows in an Ordinary Watercourse caused the watercourse banks to overtop, with overflow affecting private property in Oundle. [PAG] (p6)</p></div><div class="nugget-popup"><p>High water levels and strong flows in an ordinary watercourse caused the watercourse banks to overtop and overflow into private property; private properties were affected by floodwater. [PAG] (p7)</p></div><div class="nugget-popup"><p>Residential properties suffered internal flooding; damage and loss were caused by the depth and velocity of water overtopping the Ordinary Watercourse (Lyveden Brook). (p9)</p></div><div class="nugget-popup"><p>On 28th October 2013 depth and flow from Lyveden Brook caused flooding in Oundle: gardens at Warren Bridge were flooded and there was significant damage to outbuildings at a residential property. Road drainage (gullies/kerb offlets) on Benefield Road north of Lyveden Brook were observed blocked with silt and debris, contributing to local surface&ndash;water issues. (p11)</p></div><div class="nugget-popup"><p>Various incidents of flooding on 28 October 2013 affected people and property as a result of depth and flow from Lyveden Brook. Rear gardens and land were flooded; sports facilities were affected and closed for approximately two days. [PAG] (p12)</p></div><div class="nugget-popup"><p>High water levels in Lyveden Brook affected local sports facilities in Oundle, causing the facilities to close. [PAG] (p13)</p></div><div class="nugget-popup"><p>Excessive flow in Lyveden Brook caused water levels to rise and strong flows to overtop the brook banks, affecting adjoining property in Oundle. (p17)</p></div><div class="nugget-popup"><p>Flooding in the town on 28th October 2013 was driven by high&ndash;velocity, deep flows in Lyveden Brook associated with reductions to the watercourse cross&ndash;sectional area and man&ndash;made controls near Warren Bridge, causing river flooding of parts of Oundle. (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 residential property (outbuildings significantly damaged) (p11)</p></div><div class="nugget-popup quant"><p>approximately two days [PAG] (p12)</p></div><div class="nugget-popup quant"><p>closure of sports facilities for approximately two days [PAG] (p13)</p></div></div></body></div>`)[0];
