                var html_fbf35907dc5aededb8684222eda07041 = $(`<div id="html_fbf35907dc5aededb8684222eda07041" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kent</h1><div class="nugget-popup"><p>Very heavy rainfall on 10 June 2019 led to surface water flooding across the county; areas such as West Kingsdown, Vigo, Snodland and Swanley were particularly badly affected. In the West Kingsdown area around a dozen properties are reported to have been flooded by surface water, many affected internally. (p1)</p></div><div class="nugget-popup"><p>Overland flows from farmland south of the A20 London Road caused muddy surface&ndash;water runoff onto the A20 and into residential streets in West Kingsdown. Floodwater flowed from fields across the A20 into Ash Tree Close and then north towards Southfields Road. Multiple properties experienced internal and external flooding (including kitchens), part of a conservatory wall collapsed, waist&ndash;high flooding was reported on Neal Road and one resident was evacuated by KFRS. A commercial property was internally flooded and local roads were affected by significant muddy runoff. [IMG] (p2)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>around a dozen properties (p1)</p></div><div class="nugget-popup quant"><p>15 properties; 1 commercial property; 5 properties in Ash Tree Close/Ash Tree Drive; 2 properties internally flooded in Neal Road; 1 property externally flooded in Neal Road; 1 resident evacuated; 1 part of a conservatory wall collapsed; 1 property flooded on A20 London Road; 1 property flooded in Southfields Road; 1 property in Heaver Wood Road; 1 property in Phelps Close; 1 property in Botsom Lane; 1 property in Primmett Close; 1 property in Warland Road [IMG] (p2)</p></div></div></body></div>`)[0];

                var html_6b1e4cb94be650f5754cb5479762e5bf = $(`<div id="html_6b1e4cb94be650f5754cb5479762e5bf" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>West Kingsdown</h1><div class="nugget-popup"><p>Around a dozen properties in the West Kingsdown area were flooded by surface water; many of those properties were affected internally. (p1)</p></div><div class="nugget-popup"><p>Multiple locations across the town experienced overland/surface water flooding (overland flow from adjacent farmland and runoff from a business park). Impacts included internal flooding to residential and at least one commercial property, external flooding, a conservatory wall collapse, and at least one evacuation. [IMG] (p2)</p></div><div class="nugget-popup"><p>A heavy, approximately 1&ndash;in&ndash;100&ndash;year storm overwhelmed drainage, producing overland flows from the rural catchment and urban area that collected at local low points and flow paths and caused flooding to properties in the vicinity. Highway drainage was overwhelmed but drained once rainfall ceased. (p7)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>around a dozen properties (p1)</p></div><div class="nugget-popup quant"><p>A20 London Road: 1 residential property flooded; 1 commercial property internally flooded; Ash Tree Close/Drive: 5 properties internally flooded; Southfields Road: 1 property; Neal Road: 2 properties internally flooded and 1 property externally flooded; Heaver Wood Road: 1 property; Phelps Close: 1 property; Botsom Lane: 1 property; Primmett Close: 1 property; Warland Road: 1 property; Evacuations: 1 resident; Conservatory wall collapse: 1 [IMG] (p2)</p></div><div class="nugget-popup quant"><p>1 report of flooding received during the event (p7)</p></div></div></body></div>`)[0];
