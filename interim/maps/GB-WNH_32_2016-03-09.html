                var html_e62b70cc19e6ee260941c7595541806d = $(`<div id="html_e62b70cc19e6ee260941c7595541806d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Elkins Close, Yelvertoft</h1><div class="nugget-popup"><p>Water level rose entering gardens and properties on Elkins Close as floodwater travelled down Swinnertons/Swinnertions Lane and from overtopping watercourses. A resident reported the nearby culverted section of Yelvertoft Brook (running alongside Swinnertions Lane) was unable to convey water during the flood, contributing to local flooding. [TAB] (p12)</p></div></div></body></div>`)[0];

                var html_73d3d16041f010e4d867243fad38c7fe = $(`<div id="html_73d3d16041f010e4d867243fad38c7fe" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Northamptonshire</h1><div class="nugget-popup"><p>Widespread flooding across the county from a combination of agricultural runoff, surface water runoff and ordinary watercourse flooding; numerous properties flooded internally. (p7)</p></div><div class="nugget-popup"><p>On 9 March 2016 heavy rainfall across the county produced widespread flooding from a combination of agricultural runoff, surface water runoff and ordinary watercourse flooding, resulting in numerous internal flood incidents and other reports of flooding. (p9)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 70 properties internally flooded; over 200 reports of flooding (p7)</p></div><div class="nugget-popup quant"><p>over 70 properties; over 200 reports of flooding (p9)</p></div></div></body></div>`)[0];

                var html_1f0ef5e82a245bcb4befb4cf66c2bcda = $(`<div id="html_1f0ef5e82a245bcb4befb4cf66c2bcda" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Yelvertoft</h1><div class="nugget-popup"><p>Internal flooding of private property: excess water flowed over ground to low points around private property when local drainage and storage could not convey runoff. (p7)</p></div><div class="nugget-popup"><p>Internal flooding entered at least one property in the village; this triggered a formal Section 19 investigation. Residents reported the 9 March 2016 event and previous internal flooding incidents. [MUL] (p9)</p></div><div class="nugget-popup"><p>Multiple recorded flood incidents in the Yelvertoft area. A historic overspill feature is noted for the culverted section. Easter 1998: 26 properties recorded affected. 06/11/2000: 1 property flooded on School Lane. 10/01/2007: Crick Road reported almost impassable; 1 property had nearly 2 ft of water and required pumping by the fire service; 5 properties reported water in gardens. 09/03/2016: approximately 15 properties flooded after excessive rainfall caused the FSA to fill and overtop; excess could not pass into an undersized culvert, resulting in nearby properties being affected. [PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>The village experienced flooding on 9 March 2016 due to exceedance of the Yelvertoft Brook flood storage area and culverts. Yelvertoft Brook reached the top of its banks, overtopped and flowed along highways (Crick Road, High Street), and drainage/culvert capacity was exceeded causing overland flow to low points and flooding of properties (including internal flooding reported on some High Street and Crick Road properties). [TAB,PAG] (p12)</p></div><div class="nugget-popup"><p>Heavy rainfall on a saturated catchment overwhelmed local drainage. Drainage systems and culverts (including a culverted section of Yelvertoft Brook alongside Swinnertions Lane) were unable to convey and dispose of rainwater; culvert capacity and the flood storage area were exceeded and water flowed over ground following natural contours to low points around private properties. Affected properties are situated at localised low points and were vulnerable to overland flow of surface water running off the highway. [PAG] (p13)</p></div><div class="nugget-popup"><p>Flood incidents occurred in Yelvertoft and were subject to investigation by the LLFA (NCC); NCC can suggest possible causes and make recommendations to mitigate flood risk but lacks the mandate/funding to force other authorities to act. (p15)</p></div><div class="nugget-popup"><p>Subject of a Northamptonshire County Council flood incident investigation (Incident Date: 9 March 2016). The map in the report locates the village within the Upper Avon catchment and shows nearby main watercourses that are relevant to the investigated flood event. [IMG] (p27)</p></div><div class="nugget-popup"><p>Flood Zone 3 is concentrated along the river within the village, with Flood Zone 2 extending further; this places residential properties, the primary school and several farms adjacent to the watercourse at risk of being flooded in extreme river flood events. [IMG] (p29)</p></div><div class="nugget-popup"><p>The investigation and map show surface&ndash;water flood risk concentrated along the central watercourse through Yelvertoft. Flood&ndash;risk shading overlaps built&ndash;up areas in the village centre and north&ndash;east, placing residential properties, several farms, the primary school and the sewage works within or adjacent to flood&ndash;risk zones and indicating they were at risk or impacted during the flood incident. [IMG,PAG] (p31)</p></div><div class="nugget-popup"><p>Subject of a flood&ndash;incident investigation. The supplied map shows the local river and culvert network through residential areas (open channel transitioning to underground/culverted sections) which are relevant to the flood event; specific property&ndash;level impacts are not described in this excerpt. [PAG] (p33)</p></div><div class="nugget-popup"><p>The Crick Road area of Yelvertoft was the focus of a flood incident investigation dated 9 March 2016; flood storage areas and a watercourse through the Crick Road area were identified as holding excess water during the incident, indicating the locality was affected by the flood event. [IMG,PAG] (p35)</p></div><div class="nugget-popup"><p>Subject of the Flood Incident Investigation for the event on 9 March 2016. The investigation map shows red&ndash;hatched flood risk zones across the village and dense surface&ndash;water and combined sewer networks concentrated along main roads, indicating the village experienced surface&ndash;water and sewer&ndash;related flooding during the incident and that drainage infrastructure and potential culverts/gullies were relevant to the event. [IMG,PAG] (p37)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property (internally flooded) (p7)</p></div><div class="nugget-popup quant"><p>1 property [MUL] (p9)</p></div><div class="nugget-popup quant"><p>26 properties; 1 property; 5 properties; approximately 15 properties [PAG,MUL] (p11)</p></div></div></body></div>`)[0];
