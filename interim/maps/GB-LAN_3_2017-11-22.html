                var html_7efcf7f66211d6391c2e58c59c1e1859 = $(`<div id="html_7efcf7f66211d6391c2e58c59c1e1859" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lancashire</h1><div class="nugget-popup"><p>Flooding occurred across the county during the event on the dates given. (p1)</p></div><div class="nugget-popup"><p>The rainfall event overwhelmed drainage across the county causing extensive surface water and river flooding, dislodging debris that blocked drains, obstructing many roads (including critical emergency access routes) and causing sewer flooding in parts of the Fylde. Trains north of Preston were cancelled and multiple flood warnings/alerts were in place. [PAG] (p3)</p></div><div class="nugget-popup"><p>Extreme rainfall on the night of 22/23 November 2017 caused widespread flooding across the county. Reports of flooding were received from every district. Surface water run&ndash;off and overwhelmed drainage led to surface water flooding; watercourses overtopped in the Ellel and Galgate area; flooding from the River Conder and Burrow Beck combined to encroach into homes and outbuildings and obstruct highways. Run&ndash;off to the Irish Sea and Morecambe Bay was impeded by a normal high tide, prolonging surface water flooding into the daytime of 23 November until low tide restored outfall drainage. (p12)</p></div><div class="nugget-popup"><p>Extreme, intense rainfall around Lancaster University caused watercourses to overtop in the Ellel and Galgate area; flooding from the River Conder and Burrow Beck combined with surface&ndash;water runoff to encroach into homes and outbuildings and obstruct highways. Surface&ndash;water flooding also overwhelmed Caton and Halton as watercourses breached their banks and washed silt from fields onto roads and houses. Power&ndash;supply issues caused intermittent interruptions to pumping operations along the Fylde coast, affecting flood management operations (effects noted most significantly in nearby Blackpool, which lies outside this council boundary). [IMG] (p13)</p></div><div class="nugget-popup"><p>Extreme rainfall on 22/23 November 2017 overwhelmed natural and man&ndash;made drainage networks across a large area of Lancashire, causing widespread flooding. (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 900 homes and other premises flooded; 70 households evacuated; 9 flood warnings; 12 flood alerts [PAG] (p3)</p></div></div></body></div>`)[0];
