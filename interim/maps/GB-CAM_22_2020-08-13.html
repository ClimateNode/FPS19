                var html_39bbe7b07e8d915f5defef03334bd98c = $(`<div id="html_39bbe7b07e8d915f5defef03334bd98c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>St Ives</h1><div class="nugget-popup"><p>Heavy, short&ndash;duration rainfall on 13 and 16 August 2020 overwhelmed local drainage, resulting in flooding within the town and pressure on drainage infrastructure. [IMG,MUL] (p7)</p></div><div class="nugget-popup"><p>Intense rainfall on 13 and 16 August 2020 overwhelmed surface water drainage and road drainage networks. Surface water accumulated on roads and from highways gullies, sewers surcharged causing flooding, and adjacent land and premises (including commercial premises on Harding Way) experienced internal flooding. [PAG] (p8)</p></div><div class="nugget-popup"><p>Areas and properties within the town were affected by surface water flooding as drainage systems were unable to convey intense rainfall, causing excess surface water to flow over ground following local topography. (p9)</p></div><div class="nugget-popup"><p>Internal flooding of commercial premises and associated land at Harding Way; external flooding reported affecting properties across multiple streets (Orwell Close; Kings Hedges; Nursery Gardens; Pig Lane; St. Audrey's Lane; Sandwich Close). Three key risk areas in the town experienced property/internal flooding or significant external premises flooding. [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>Multiple streets and properties across St Ives experienced flooding (highways, footways, car parks and properties) during the August 2020 event. (p11)</p></div><div class="nugget-popup"><p>Commercial premises adjacent to Marley Gap Brook at Harding Way were identified in the investigation as being affected by flooding; the brook and surface water interaction at this location contributed to flood impacts on premises. [TAB] (p12)</p></div><div class="nugget-popup"><p>Community and infrastructure in St Ives were affected by flooding; the investigation identified capacity, operational and riparian maintenance issues and prompted maintenance actions and further investigation by the LLFA. (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>15 properties; three key risk areas [PAG,IMG] (p10)</p></div></div></body></div>`)[0];
