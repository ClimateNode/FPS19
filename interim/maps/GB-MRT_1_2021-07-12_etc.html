                var html_21b77b345e1312090db6614fd8ea2770 = $(`<div id="html_21b77b345e1312090db6614fd8ea2770" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Joseph Hood Recreation Ground</h1><div class="nugget-popup"><p>Sir Joseph Hood (labelled as Joseph Hood) is within Hotspot 4 and experienced surface water/urban flooding during the extreme rainfall events, with reports of internal, external and highway flooding in the hotspot area due to sewer surcharge and surface water runoff. [IMG,MUL] (p4)</p></div><div class="nugget-popup"><p>Listed as part of Hotspot 4 ('MARINA AVENUE and SIR JOSEPH HOOD') impacted during the 25 July rainfall event, indicating flooding occurred on this street. (p8)</p></div><div class="nugget-popup"><p>Sir Joseph Hood area (labelled Joseph Hood) is part of the Hotspot 4 cluster where multiple internal, external and highways flooding reports occurred during the 25th July 2021 event. [IMG] (p29)</p></div><div class="nugget-popup"><p>Surface water flooding occurred at Sir Joseph Hood during the reported events; modelled maximum Hydromaster return period 1 in 2 to 1 in 5 yr (25 July 2021). [TAB] (p32)</p></div><div class="nugget-popup"><p>Sir Joseph Hood (part of Hotspot 4) experienced surface water flooding: flooding was limited to external areas of properties on 12th July 2021 and was substantially worse on 25th July 2021. [PAG,MUL] (p58)</p></div><div class="nugget-popup"><p>Internal flooding affected a pavilion within the park (described as a residential property within the pavilion). Much of the Sir Joseph Hood Memorial playing fields were flooded, particularly in areas closer to the river line to the west. (p59)</p></div><div class="nugget-popup"><p>Internal flooding affected one residential property located within the pavilion inside Sir Joseph Hood Memorial Park; external areas of properties and much of the playing fields were inundated, particularly in areas closer to the river line to the west. [PAG] (p60)</p></div><div class="nugget-popup"><p>Surface water collected on the Sir Joseph Hood Memorial Playing Fields and flowed northwards toward the Sir Joseph Hood pavilion, contributing to surface water flooding risk at the pavilion area and toward Marina Avenue during the 25 July 2021 rainfall event. Gully maintenance at the pavilion area was last recorded as cleaned in December 2020 and not again until October 2022, indicating they were not on a high&ndash;priority cleansing schedule prior to the event. [IMG,PAG] (p61)</p></div><div class="nugget-popup"><p>Fluvial flooding occurred within the hotspot that includes the park during the event on 25th July 2021. Areas immediately adjacent to the pavilion were modelled at high risk of surface water flooding (EA RoFSW) and incident mapping shows flood incidents clustered adjacent to the Sports/Leisure Centre and pavilion area. (p62)</p></div><div class="nugget-popup"><p>The Sir Joseph Hood Memorial Fields and adjacent rear external areas of residential properties (within the Sir Joseph Hood area) lie in Flood Zone 3 and were within the hotspot where fluvial flooding occurred; therefore these areas experienced fluvial flooding during the event. [IMG,PAG] (p63)</p></div><div class="nugget-popup"><p>Fluvial floodwaters from Beverley Brook overflowed channel banks and entered the Sir Joseph Hood Memorial Playing Fields; local topography caused areas of standing floodwater to remain after the event peak. [TAB,PAG] (p65)</p></div><div class="nugget-popup"><p>Sir Joseph Hood Memorial Playing Fields received fluvial floodwaters that overflowed from Beverley Brook and retained standing floodwater after the event peak due to topography. Poor pitch drainage increased surface water runoff during the heavy rainfall, contributing to floodwater collecting within the playing fields and flowing towards Marina Avenue. (p66)</p></div><div class="nugget-popup"><p>Surface water runoff from the Sir Joseph Hood Memorial Playing Fields ran onto Marina Avenue; a blocked outlet and frequently blocked gullies were identified as compounding local flooding. (p72)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 residential property (pavilion) (p59)</p></div><div class="nugget-popup quant"><p>one residential property [PAG] (p60)</p></div><div class="nugget-popup quant"><p>1 property (internal flooding adjacent to the playing fields) (p66)</p></div></div></body></div>`)[0];

 surcharges and flooding of adjacent roads. (p69)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one garage outbuilding [PAG] (p56)</p></div></div></body></div>`)[0];

                var html_888ba6a3ddb2452bd2e64d769761d802 = $(`<div id="html_888ba6a3ddb2452bd2e64d769761d802" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Beverley Brook</h1><div class="nugget-popup"><p>High river levels exceeded channel capacity, resulting in fluvial flooding to some locations within LB Merton during the extreme rainfall events. [PAG,MUL] (p4)</p></div><div class="nugget-popup"><p>High river levels along the Beverley Brook exceeded channel capacity, resulting in fluvial (river) flooding to some locations within LB Merton. [PAG,MUL] (p5)</p></div><div class="nugget-popup"><p>Overtopping/high flows in Beverley Brook (and the river line to the west) contributed to flooding of Sir Joseph Hood Memorial Playing Fields and adjacent areas, and was linked to flooding affecting nearby Marina Avenue and the sports/leisure centre. This hydrological link is cited in the hotspot description for the 25 July 2021 event. [IMG] (p59)</p></div><div class="nugget-popup"><p>Areas of Sir Joseph Hood Memorial Playing Fields adjacent to the river line to the west experienced flooding; the local surface water sewer in Marina Avenue discharges into Beverley Brook and is noted in the hotspot description. (p60)</p></div><div class="nugget-popup"><p>The Beverley Brook (main river) runs along the southern/western edges of the hotspot and is identified as a watercourse that could influence local flood risk; it is therefore a potential contributing source to flooding in the Marina Avenue / Sir Joseph Hood area during the 25 July 2021 rainfall event. [IMG] (p61)</p></div><div class="nugget-popup"><p>Beverley Brook, an EA&ndash;designated main river along the western boundary of the hotspot, was the fluvial source associated with the event: the EA issued a fluvial flood warning (Beverley Brook, West Barnes) and Merton Council confirmed fluvial flooding in the hotspot on 25th July 2021. Adjacent areas (including rear external areas of properties on the south side of Marina Avenue and property within the Sir Joseph Hood area) are in Flood Zone 3 and were affected by this fluvial flooding. [PAG] (p62)</p></div><div class="nugget-popup"><p>The EA&ndash;designated main river that generated fluvial flooding adjacent to the Marina Avenue & Sir Joseph Hood hotspot, contributing to inundation of nearby properties and external areas along the western edge of the hotspot. [IMG,PAG] (p63)</p></div><div class="nugget-popup"><p>Beverley Brook was the primary flood source on 25th July 2021; its limited channel capacity led to out&ndash;of&ndash;bank flows. Increased river volumes overflowed the banks, with floodwaters entering the hotspot from the south and causing flooding to Sir Joseph Hood Memorial Playing Fields and Marina Avenue. Topography trapped water in the playing fields, leaving areas of standing floodwater after peak flows. (p66)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 residential properties (internal flooding); 1 pavilion inside Sir Joseph Hood Memorial Park (internal flooding); 30 m of road flooded; 65 m of footway flooded [IMG] (p59)</p></div></div></body></div>`)[0];

                var html_c239208f064acfd78901650a96127952 = $(`<div id="html_c239208f064acfd78901650a96127952" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Region</h1><div class="nugget-popup"><p>Extreme rainfall on 12 July 2021 and 25 July 2021 caused widespread surface&ndash;water and urban flooding across London. Sewer networks were overwhelmed (surface water entering the surface water sewer network exceeded capacity), causing surcharging and backflow at outfalls in river channels; high river levels (notably Beverley Brook) exceeded channel capacity and caused fluvial (river) flooding to some locations within the borough of Merton. [IMG,PAG,MUL] (p4)</p></div><div class="nugget-popup"><p>Parts of London experienced surface water / urban flooding during the Summer 2021 storms. In the London Borough of Merton several locations were flooded during the July 2021 events (Apostles area, Coombe Lane, Abbott Avenue, West Barnes Lane and Burlington Road). [PAG] (p15)</p></div><div class="nugget-popup"><p>The 25th July 2021 rainfall event produced substantial flooding across London, of which Merton was one affected borough. [IMG,PAG] (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 locations [PAG] (p15)</p></div></div></body></div>`)[0];

                var html_1ade56ecdd3c71d373ef946c3f4e9d16 = $(`<div id="html_1ade56ecdd3c71d373ef946c3f4e9d16" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Borough of Croydon</h1><div class="nugget-popup"><p>Substantial flooding occurred in the borough during the 25 July 2021 rainfall event: the southern half of the borough was primarily affected, with highways and both internal and external areas of properties flooded. Flood reports were concentrated in two hotspots in the south&ndash;west of the borough. [IMG] (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>35 reports; 2 incidents (reported to social media); 2 hotspots [IMG] (p22)</p></div></div></body></div>`)[0];

                var html_5defda7043da0f4b9594e08c1a08c901 = $(`<div id="html_5defda7043da0f4b9594e08c1a08c901" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Raynes Park Station</h1><div class="nugget-popup"><p>The surface&ndash;water sewer network at/around Raynes Park Station was implicated in flooding issues; TWUL undertook high&ndash;pressure jet cleaning and cleared silt from the surface water sewer network at the station as part of post&ndash;2021 works. [TAB,MUL] (p19)</p></div><div class="nugget-popup"><p>Surface water flooding occurred at the railway underpass/adjacent station area; internal and external flooding incidents are shown clustering near the station and highway flooding is reported nearby in the hotspot. (p40)</p></div><div class="nugget-popup"><p>Following the event, the surface water sewer network at Raynes Park Station required high&ndash;pressure jet cleaning and gully clearance as part of remediation for flooding&ndash;related issues. [TAB] (p46)</p></div></div></body></div>`)[0];

                var html_e9b8cdf42ff22230ad6779a902c8f9c9 = $(`<div id="html_e9b8cdf42ff22230ad6779a902c8f9c9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Home Park Road, London Borough of Merton</h1><div class="nugget-popup"><p>Designated Hotspot 2 on the 12 July 2021 map with clustered reports of internal, external and highways flooding during the extreme rainfall event; one of the primary concentrations of reported incidents used to prioritise flood risk management. [IMG] (p3)</p></div><div class="nugget-popup"><p>The main surface water sewer line running below the railway behind Home Park Road suffered defects or capacity problems associated with the extreme rainfall, prompting investigations and repair actions; highway gullies on Home Park Road were also identified for priority cleansing to reduce surface&ndash;water flooding. [MUL] (p5)</p></div><div class="nugget-popup"><p>Designated as Hotspot 2 on the 12 July 2021 map with clustered flood reports (internal, external and highways flooding present within the hotspot area). [PAG,IMG] (p29)</p></div><div class="nugget-popup"><p>Surface&ndash;water/urban flooding affected Home Park Road during the 12 July 2021 event (Hydromaster 1 in 2 to 1 in 5 yr recorded in the report). [TAB] (p31)</p></div><div class="nugget-popup"><p>Highways flooding with much of Home Park Road covered by several inches of floodwater; external flooding to front and rear gardens of multiple properties; internal flooding of ground floors and basements of two residential properties (basement floodwaters reached door&ndash;handle height in one property); a surface water sewer running below Home Park Road near the junction with Dora Road partially collapsed. [IMG] (p49)</p></div><div class="nugget-popup"><p>Eastern portion of Home Park Road is a local low point where surface water collected and flowed through gaps between properties into rear gardens and towards the railway line; flood extents from surface water extended into the boundaries of some properties and impacted the carriageway along the eastern ~100m of the road. [PAG] (p51)</p></div><div class="nugget-popup"><p>Approximately 100 m stretch of the road (from the junction with Kenilworth Avenue to the junction with Vineyard Hill Road) is at high risk of surface water flooding, with high&ndash;risk extent primarily limited to the carriageway but extending into some property boundaries. A larger area is at medium risk with estimated flood extent reaching onto adjacent roads. Local surface water and combined sewers converge at the eastern end of Home Park Road; during extreme rainfall these sewers could surcharge, rendering gullies unable to take additional runoff and causing localised flooding. The surface water sewer main is constrained under the railway, likely preventing effective conveyance of high flows away from Home Park Road. [IMG,PAG,MUL] (p52)</p></div><div class="nugget-popup"><p>Sewer network surcharged during extreme rainfall, causing gullies to be unable to take additional runoff and resulting in internal, external and highways flooding incidents along Home Park Road. The surface water sewer main is constrained under the railway which likely prevented effective conveyance of high flows away from the road. [IMG,MUL] (p53)</p></div><div class="nugget-popup"><p>During the 12th July 2021 rainfall event the surface water sewer system at Home Park Road was unable to cope with increased flows, with flows collecting at the eastern end of Home Park Road. The surface water sewer along Home Park Road at the junction with Dora Road partially collapsed during the event. Blocked gullies outside properties at the primary affected location on the eastern end of Home Park Road exacerbated runoff and worsened the flooding impacts; the main line below the railway is restricted, causing the system to be at high risk of surcharging during extreme rainfall. [TAB,PAG] (p54)</p></div><div class="nugget-popup"><p>The surface water sewer at Home Park Road was unable to cope during the 12 July 2021 rainfall: flows collected at the eastern end of Home Park Road, surface runoff accumulated in the low point and flowed through gaps into rear gardens toward the railway, and gullies outside properties were blocked, worsening flooding. The surface water sewer at the junction with Dora Road partially collapsed during the event, reducing the sewer system's ability to manage increased flows. (p55)</p></div><div class="nugget-popup"><p>Surface&ndash;water flows and an overloaded/defective surface&ndash;water sewer (including the main sewer running below the railway) caused flooding and sewer surcharging on Home Park Road; gullies were surcharging and the sewer defects/capacity constraints contributed to flooding and risk to ground&ndash;floor and basement areas. [MUL] (p71)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 residential properties; 4 instances of sewer flooding in postcode SW19 7 [IMG] (p49)</p></div><div class="nugget-popup quant"><p>4 instances of sewer flooding reported to TWUL in the Home Park Road postcode area [IMG,MUL] (p53)</p></div></div></body></div>`)[0];

                var html_b0fc263fd4378d94c40aee81d8ae3362 = $(`<div id="html_b0fc263fd4378d94c40aee81d8ae3362" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Marina Avenue, London Borough of Merton</h1><div class="nugget-popup"><p>Marina Avenue is within Hotspot 4 where extreme rainfall and exceeded sewer capacity produced surface water runoff and urban flooding; reported incidents include internal, external and highway flooding clustered in this hotspot. [IMG,MUL] (p4)</p></div><div class="nugget-popup"><p>Marina Avenue is part of the Marina Avenue & Sir Joseph Hood hotspot where clustered internal, external and highways flood reports were recorded during the 25th July 2021 rainfall event. [PAG,IMG] (p29)</p></div><div class="nugget-popup"><p>Surface water flooding occurred at Marina Avenue during the reported events; modelled maximum Hydromaster return period 1 in 2 to 1 in 5 yr. [TAB,MUL] (p32)</p></div><div class="nugget-popup"><p>Marina Avenue (part of Hotspot 4) experienced surface water flooding: on 12th July 2021 flooding was limited to external areas of properties; on 25th July 2021 the location experienced substantial flooding. [PAG,MUL] (p58)</p></div><div class="nugget-popup"><p>On 25th July 2021 surface water/urban flooding caused internal flooding to two residential properties on Marina Avenue, flooding to external areas of properties, and extensive highway flooding (approximately 30 m of carriageway and 65 m of footway). [IMG] (p59)</p></div><div class="nugget-popup"><p>Highway and property flooding along Marina Avenue during the 25 July 2021 event: internal flooding to two residential properties; external flooding to property external areas; extensive highway flooding affecting the carriageway and footway. [PAG] (p60)</p></div><div class="nugget-popup"><p>Surface water runoff from the lower&ndash;elevation Sir Joseph Hood Memorial Playing Fields flowed northwards and collected on Marina Avenue (flat topography). The western half of Marina Avenue and rear external areas of properties along the street were at medium risk of surface water flooding during the 25 July 2021 rainfall event; internal areas of properties were not classed at medium/high risk but are adjacent to medium&ndash;high risk zones. Gullies on Marina Avenue are not included in the Council's current cleansing programme (historical cleansing priority unavailable). [IMG,PAG] (p61)</p></div><div class="nugget-popup"><p>Flooding incidents (internal, external and highways) are reported on the map clustered along Marina Avenue during the event; rear external areas of properties on the south side of Marina Avenue are in Flood Zone 3 and the street and its properties are in Flood Zone 2. Merton Council confirmed fluvial flooding occurred within this hotspot on 25th July 2021. [IMG,PAG] (p62)</p></div><div class="nugget-popup"><p>Fluvial (river) flooding affected Marina Avenue during the event; properties and the road are within EA Flood Zone 2/3 and experienced external, internal and highways flooding in locations adjacent to Beverley Brook. Merton Council confirmed fluvial flooding occurred within this hotspot on 25th July 2021. [IMG,PAG] (p63)</p></div><div class="nugget-popup"><p>Flooding incidents were recorded along Marina Avenue including internal property flooding and highway (road) flooding; the western half of Marina Avenue is described as an area that could be affected by sewer&ndash;related flooding during extreme rainfall, and coloured dots marking incidents are shown along Marina Avenue on the hotspot map. [IMG] (p64)</p></div><div class="nugget-popup"><p>Fluvial floodwaters from Beverley Brook overflowed the channel banks and caused flooding to the Marina Avenue area. [TAB,PAG] (p65)</p></div><div class="nugget-popup"><p>Marina Avenue was flooded when Beverley Brook overflowed and when surface water runoff from the nearby playing fields collected and flowed onto the street during the 25th July 2021 event. Properties immediately adjacent to Marina Avenue were at risk of expansion of surface water onto them; one property undergoing renovations experienced internal flooding and had lowered ground&ndash;floor thresholds, increasing its vulnerability to floodwater. (p66)</p></div><div class="nugget-popup"><p>Surface water runoff from adjacent sports pitches and blocked outlets at Sir Joseph Hood caused runoff and flooding onto Marina Avenue; potential compounding from a main river culvert beneath the railway was identified and recommended for survey to address river/culvert&ndash;related contributions to flooding. [MUL] (p72)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 residential properties; 30m of road; 65m of footway [IMG] (p59)</p></div><div class="nugget-popup quant"><p>2 residential properties; approximately 30m of road; approximately 65m of footway [PAG] (p60)</p></div><div class="nugget-popup quant"><p>1 property (internal flooding, undergoing renovations with lowered thresholds) (p66)</p></div></div></body></div>`)[0];

                var html_9d5c402b7f3f4dbbd43b7807a23f7902 = $(`<div id="html_9d5c402b7f3f4dbbd43b7807a23f7902" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Coombe Lane, London Borough of Merton</h1><div class="nugget-popup"><p>Surface water runoff and extreme rainfall caused sewer capacity to be exceeded across hotspots, affecting Coombe Lane (Hotspot 1) with surface water entering the drainage/sewer network and contributing to local sewer capacity issues and flooding. [MUL] (p5)</p></div><div class="nugget-popup"><p>Coombe Lane was reported as an area affected by flooding (listed in the report's summary of previous Section 19 (2018) and as part of Hotspot 1 &mdash; Raynes Park &mdash; for the 12 July 2021 event). Local drainage was overwhelmed during the heavy rainfall, resulting in flooding of the street. [MUL] (p7)</p></div><div class="nugget-popup"><p>Flooding at a local low point (including at Raynes Park railway bridge) caused by collection of water from multiple sewers and high surface runoff; drainage discharged to a pump station but sewer capacity was exceeded so the area flooded. [PAG,MUL] (p16)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration rainfall on 25th July 2021 produced surface water flooding in the western part of the borough. The Coombe Lane West Hydromaster gauge recorded the highest west&ndash;borough intensity during the 25 July event and is identified in the report as associated with the rainfall that caused flooding in the area. [IMG,PAG] (p26)</p></div><div class="nugget-popup"><p>Coombe Lane West gauge recorded one of the highest short&ndash;duration rainfall peaks during 25th July 2021; the location was a Hydromaster hotspot within a cluster of surface water flood reports and was associated with surface&ndash;water/flash flooding during the 25th July 2021 event. [IMG] (p28)</p></div><div class="nugget-popup"><p>Coombe Lane area (including Raynes Park railway bridge) experienced surface water flooding during the 12th July 2021 event. [TAB] (p31)</p></div><div class="nugget-popup"><p>Most severe flooding occurred along Coombe Lane on 12 July 2021; floodwaters were deepest running parallel to the railway embankment and within the underpass. Internal flooding affected properties on Coombe Lane and commercial premises near Raynes Park railway station; highway flooding led to closure of access to Coombe Lane, impacting emergency access. [IMG,PAG] (p33)</p></div><div class="nugget-popup"><p>Floodwaters were deepest along Coombe Lane running parallel to the railway embankment and within the underpass. Internal flooding affected properties along Coombe Lane (commercial properties near Raynes Park railway station were internally flooded) and external areas of properties were inundated; highway flooding caused road closures and loss of access. [PAG] (p34)</p></div><div class="nugget-popup"><p>Severe highway flooding with deepest floodwaters running parallel to the railway embankment and within the underpass; road closed to emergency vehicles, contributing to loss of access routes and meeting 'risk to residential property' and 'risk to commercial property' Section 19 thresholds. [PAG] (p35)</p></div><div class="nugget-popup"><p>Coombe Lane was identified as one of the primary affected locations in the July 2021 hotspot where surface water sewers flow and converge toward Beverley Brook; the local surface water sewer network was implicated in the hotspot flooding and highway drainage (gullies) condition is noted in relation to the July 2021 flood event. (p36)</p></div><div class="nugget-popup"><p>The Coombe Lane area experienced clusters of flood incidents (internal, external and highways) during the July 2021 event. Highway gullies in the Coombe Lane area were part of the council's high&ndash;priority cleansing programme and had been cleaned in June 2021, but gullies below the railway had last been cleaned in March 2020 prior to the July 2021 flood, indicating parts of the local drainage/highway system were implicated in the surface water/highway flooding observed. [IMG,PAG] (p37)</p></div><div class="nugget-popup"><p>Surface water flows routed downhill collected in local low points along Coombe Lane and the railway underpass, producing flooding at these low points due to steep local topography and the blocking effect of the raised railway embankment. (p39)</p></div><div class="nugget-popup"><p>Surface water flooding occurred along Coombe Lane during the 12th July 2021 event, with internal and external flooding incidents clustering along the corridor close to Raynes Park station and associated highway inundation near the railway underpass. [IMG,PAG] (p40)</p></div><div class="nugget-popup"><p>Surface water and sewer&ndash;related flooding impacted highway drainage and the drainage network at Coombe Lane, triggering assessment of the surface water sewer and the local pump station, reconstruction/upsizing and repair of highway drainage, CCTV inspection of drains and gully inspections to address blockages and faults. [TAB] (p45)</p></div><div class="nugget-popup"><p>The foul sewer network surcharged and combined sewer overflows discharged onto Coombe Lane during the 12th July 2021 event, contributing to sewer flooding and road access issues/closures. [TAB,PAG] (p46)</p></div><div class="nugget-popup"><p>Many converging surface water sewers and topographic low points caused gullies to surcharge and sewer flooding during the 12 July 2021 event; surface water runoff accumulated at the low point below the railway and may have entered sewers via misconnections; a resident reported distortion of a swimming pool lining attributable to groundwater pressure. (p47)</p></div><div class="nugget-popup"><p>Coombe Lane area experienced flooding during the extreme rainfall events and was identified within the Raynes Park hotspot as requiring additional resilience measures and SuDS to reduce surface water and sewer flood risk. [MUL] (p70)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 residential properties [IMG,PAG] (p33)</p></div><div class="nugget-popup quant"><p>postcode area SW20 0: 3 instances of sewer flooding; postcode area SW20 8: 5 instances of sewer flooding (these postcode areas cover most/all of the Coombe Lane area) [PAG] (p34)</p></div><div class="nugget-popup quant"><p>1 road closure [TAB] (p46)</p></div><div class="nugget-popup quant"><p>1 property (swimming pool lining distorted) (p47)</p></div></div></body></div>`)[0];

                var html_eb2f98489d365a656055e6b8e6f42aaf = $(`<div id="html_eb2f98489d365a656055e6b8e6f42aaf" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Abbott Avenue, Raynes Park</h1><div class="nugget-popup"><p>Extreme surface water runoff exceeded sewer capacity affecting Abbott Avenue (Hotspot 1); the report references attenuation tank and pumping station operation/monitoring as responses to sewer capacity issues during extreme rainfall events. [MUL] (p5)</p></div><div class="nugget-popup"><p>Recorded flooding during the borough's historical incidents and again during the July 2021 events (surface&ndash;water/sewer&ndash;related urban flooding). [PAG,MUL] (p16)</p></div><div class="nugget-popup"><p>Identified as the area receiving foul sewer flow potentially increased by misconnections from recent private developments upstream of a pumping station; investigations were recommended to identify misconnections that may contribute surface water into the foul sewer system draining towards Abbott Avenue. [TAB] (p20)</p></div><div class="nugget-popup"><p>Abbott Avenue experienced flooding during the July 2021 events; the report records flooding at Abbott Avenue on 12th July 2021 (Hydromaster return period 1 in 5 to 1 in 10 yr; TWUL FEH13 1 in 393.2 yr). [TAB] (p31)</p></div><div class="nugget-popup"><p>Highway flooding resulted in closure of access to Abbott Avenue on 12 July 2021, impacting routes and emergency access. [PAG] (p33)</p></div><div class="nugget-popup"><p>Highway flooding led to closure of access along Abbott Avenue by the police, impacting access routes for emergency services. Properties in the area were affected by sewer&ndash;related flooding instances recorded in the local postcode. [PAG] (p34)</p></div><div class="nugget-popup"><p>Access was closed during the event, inhibiting emergency vehicle access and meeting the 'risk to transport' Section 19 threshold. [PAG] (p35)</p></div><div class="nugget-popup"><p>During the July 2021 flood event (25th July 2021) Abbott Avenue experienced surface&ndash;water (urban) flooding. Highway gullies in Abbott Avenue had not been cleaned since March 2020 prior to the event; this lack of recent gully cleansing was noted in the report and may have contributed to drainage blockage and the local flooding. (p37)</p></div><div class="nugget-popup"><p>Highway and external flooding incidents are marked on the local drainage map for Abbott Avenue. Highway gullies on Abbott Avenue had not been cleaned since March 2020 (despite earlier inclusion in the high&ndash;priority cleansing programme), which is noted as a possible contributory factor to blockage and subsequent surface water/highway flooding during the July 2021 flood event. [IMG,PAG] (p38)</p></div><div class="nugget-popup"><p>Abbott Avenue experienced flooding issues leading to its addition to the high priority gully cleansing programme and to network investigations and foul sewer cleaning. [TAB] (p45)</p></div><div class="nugget-popup"><p>During the 12th July 2021 extreme rainfall event the continued operation/discharge from the nearby pump station increased flows onto Abbott Avenue, causing gully surcharging and local sewer flooding at the street. [TAB,PAG] (p46)</p></div><div class="nugget-popup"><p>During the 12 July 2021 extreme rainfall event the continuing operation of the Abbott Avenue pumping station increased flow onto Abbott Avenue, leading to gully surcharging and localised flooding of the street. (p47)</p></div><div class="nugget-popup"><p>Experienced flooding linked to sewer system behaviour during extreme rainfall: continued operation of the Abbott Avenue pumping station can increase flow into the road's sewer network, leading to gully surcharging and localized flooding (with potential for property backflow). [MUL] (p70)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>postcode area SW20 8: 5 instances of sewer flooding [PAG] (p34)</p></div></div></body></div>`)[0];

                var html_55236afaf61fec07137a3f2fdc067750 = $(`<div id="html_55236afaf61fec07137a3f2fdc067750" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lower Downs Road, Raynes Park</h1><div class="nugget-popup"><p>Sewer network capacity along Lower Downs Road was exceeded during the extreme rainfall events, prompting recommendations to investigate and upgrade sewer capacity to address flooding risk. [MUL] (p5)</p></div><div class="nugget-popup"><p>Lower Downs Road was affected by flooding on 12th July 2021 (reported together with Worple Road). The Hydromaster return period for the event is 1 in 10 to 1 in 20 yr; TWUL FEH13 1 in 177.86 yr. [TAB] (p31)</p></div><div class="nugget-popup"><p>The railway underpass at Lower Downs Road was flooded and closed during the 12 July 2021 event, contributing to loss of access and impacting emergency routes; nearby property basements (Worple Road junction area) were also affected. [IMG,PAG] (p33)</p></div><div class="nugget-popup"><p>The Lower Downs Road railway underpass was inundated on 12th July 2021 with deep floodwater (photo evidence) that reached wheel&ndash;axle depths on a vehicle; the underpass/highway was closed by the MPS, restricting access and impeding emergency services. [IMG,PAG] (p34)</p></div><div class="nugget-popup"><p>Railway underpass and road access were closed due to flooding, restricting emergency vehicle access; the location lies within postcode SW20 8 which had recorded sewer flooding during the event. [PAG,MUL] (p35)</p></div><div class="nugget-popup"><p>Surface water sewers from adjacent streets converge onto Lower Downs Road and flow toward the railway underpass; highway gullies on Lower Downs Road were part of the high&ndash;priority cleansing programme in 2018/19&ndash;2019/20 but had last been routinely cleaned in March 2020 prior to the July 2021 flooding. (p38)</p></div><div class="nugget-popup"><p>Surface water flows were directed into the local low point at the Lower Downs Road railway underpass (compounded by the raised railway embankment), resulting in collection of runoff and recorded highway/external flooding incidents within the hotspot. Map16 data indicate gullies on Lower Downs Road had last been routinely cleaned in March 2020 prior to the July 2021 flooding. [IMG,PAG] (p39)</p></div><div class="nugget-popup"><p>Flows were routed along Worple Road into Lower Downs Road during the 12th July 2021 event, collecting at the local low point at the Lower Downs Road railway underpass; the raised railway embankment redirected flows into this low point, causing accumulation and highway/underpass flooding. [PAG] (p40)</p></div><div class="nugget-popup"><p>Lower Downs Road was targeted for gully cleansing and added to a high&ndash;priority gully cleansing programme as a risk management action related to surface water/flooding (gullies cleaned in early and late 2017, late 2018, early 2019 and early 2020). [TAB] (p45)</p></div><div class="nugget-popup"><p>Area experienced gullies surcharging toward the topographic low below the railway; the railway underpass at Lower Downs Road was closed due to flood waters. [TAB,PAG] (p46)</p></div><div class="nugget-popup"><p>Surface water runoff from higher elevations flowed towards the low point along Lower Downs Road below the railway, compounding an over&ndash;capacity sewer network and causing gully surcharging during the 12 July 2021 event; recommendations noted upgrading surface water sewer capacity to limit future gully surcharging. [PAG] (p47)</p></div><div class="nugget-popup"><p>Gully surcharging and inadequate surface water sewer capacity resulted in surface water collecting at the local low point below the railway; upgrades to the surface water sewer and increased gully cleansing were recommended to limit future roadway flooding. [MUL] (p71)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>SW20 8: 5 instances of sewer flooding [PAG,MUL] (p35)</p></div><div class="nugget-popup quant"><p>1 railway underpass closure [TAB,PAG] (p46)</p></div></div></body></div>`)[0];

its (e.g. permeable paving) to improve infiltration and reduce runoff into the local drainage system. [MUL] (p71)</p></div></div></body></div>`)[0];

                var html_8103d6e3c6f2175267621d6bda9ba043 = $(`<div id="html_8103d6e3c6f2175267621d6bda9ba043" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Shannon Corner, London Borough of Merton</h1><div class="nugget-popup"><p>Shannon Corner Junction is mentioned (as part of Burlington Road) in the previous Section 19 summary and in non&ndash;section 19 investigations under Hotspot 3 (West Barnes) for the 12 July 2021 event, indicating the junction experienced flooding during the heavy rainfall when local drainage was overwhelmed. [PAG,MUL] (p7)</p></div><div class="nugget-popup"><p>Identified as a flooded junction (Shannon Corner) and investigated (non&ndash;Section 19) as part of Hotspot 3 in the 12 July 2021 event. [PAG] (p8)</p></div><div class="nugget-popup"><p>Burlington Road and Shannon Corner junction experienced surface water flooding during the 12th July 2021 and 25th July 2021 events. [TAB,MUL] (p31)</p></div><div class="nugget-popup"><p>Junction area (Burlington Road and Shannon Corner) identified as primarily affected in the 12th July 2021 event; experienced highway/external area flooding. (p56)</p></div><div class="nugget-popup"><p>During the 12th July 2021 event flooding was constrained to highways at the eastern end of Burlington Road adjacent to the Shannon Corner roundabout. The likely mechanism was sewer surcharge/backflow caused by limited gradient and heavy siltation of local surface water sewers; surface water flooding was also a contributory factor. Access for emergency vehicles remained possible. [PAG] (p57)</p></div><div class="nugget-popup"><p>The Shannon Corner junction (including the roundabout) is part of the area that flooded during the 12th July 2021 event; flooding was likely linked to silted and limited&ndash;gradient surface water sewers causing surcharges/backflows, with high surface&ndash;water flood risk contributing. [PAG] (p58)</p></div><div class="nugget-popup"><p>The Burlington Road / Shannon Corner junction experienced flooding during the extreme rainfall events; flooding was more substantial on 12th July 2021 with fewer reports on 25th July 2021. [MUL] (p69)</p></div><div class="nugget-popup"><p>Surface water runoff and poor infiltration at the Burlington Road / Shannon Corner junction and within the Shannon Corner roundabout contributed to flooding risk; SuDS (permeable paving) is recommended to improve infiltration and reduce runoff that causes flooding and highway impacts. [MUL] (p72)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>three previous rainfall incidents [PAG] (p57)</p></div><div class="nugget-popup quant"><p>three previous rainfall incidents [PAG] (p58)</p></div></div></body></div>`)[0];

iv><i>Quantified impacts</i><div class="nugget-popup quant"><p>one internal property extension flooded [PAG] (p67)</p></div></div></body></div>`)[0];

                var html_6368abbde3f66b540eb4224ee818a471 = $(`<div id="html_6368abbde3f66b540eb4224ee818a471" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Worple Road, Raynes Park</h1><div class="nugget-popup"><p>Worple Road was affected by flooding on 12th July 2021 (grouped with Lower Downs Road in the report). The Hydromaster return period for the event is given as 1 in 10 to 1 in 20 yr; TWUL FEH13 1 in 177.86 yr. [TAB] (p31)</p></div><div class="nugget-popup"><p>Basement areas of properties along Worple Road near the junction with Lower Downs Road were internally flooded during the 12 July 2021 event; external flooding also affected property exteriors and highway access was disrupted. [IMG,PAG] (p33)</p></div><div class="nugget-popup"><p>Basement areas of properties along Worple Road near the junction with Lower Downs Road were flooded. Highway flooding also contributed to closures and impacted access in the locality. [PAG] (p34)</p></div><div class="nugget-popup"><p>Road closures due to highway/underpass flooding that inhibited access for emergency vehicles; part of the area sits within postcode SW20 8 which experienced sewer flooding during the event. [PAG,MUL] (p35)</p></div><div class="nugget-popup"><p>Surface water pipes from Worple Road converge with other local surface water sewers at the Worple Road / Pepys Road junction; these sewer flows were implicated in the Coombe Lane hotspot flooding during the July 2021 event, resulting in surface water/sewer flooding affecting the Worple Road area. (p36)</p></div><div class="nugget-popup"><p>Local surface water sewer network along Worple Road conveys flows eastwards; highway gullies on Worple Road were on Merton&#8217;s high&ndash;priority cleansing programme and were last recorded as cleaned in June 2021 prior to the July 2021 flooding. (p38)</p></div><div class="nugget-popup"><p>Surface water runoff from higher ground concentrated onto Worple Road causing highway flooding within the Raynes Park hotspot. Map16 gully&ndash;sensor data show Worple Road gullies were on Merton Council's high&ndash;priority cleansing programme but were last cleaned in June 2021 prior to the July 2021 flooding incident. [IMG,PAG] (p39)</p></div><div class="nugget-popup"><p>Worple Road is identified as part of the corridor receiving overland flows from higher ground; parts of Worple Road are shown as high&ndash;risk for surface water flooding and flows were directed toward local low points (contributing to flooding at the hotspot). [PAG] (p40)</p></div><div class="nugget-popup"><p>Council requested funding for SuDS features proposed along Worple Road as a response to flooding at the Raynes Park hotspot. [TAB] (p45)</p></div><div class="nugget-popup"><p>Properties along Worple Road (near the junction with Lower Downs Road) were impacted by sewer backflows caused by overflows in the combined sewer network; the road was also closed during the flood. [TAB,PAG] (p46)</p></div><div class="nugget-popup"><p>Properties along Worple Road near the junction with Lower Downs Road were impacted by sewer backflows caused by overflows within the combined sewer network during the 12 July 2021 event; gullies also surcharged in the area. (p47)</p></div><div class="nugget-popup"><p>Extreme rainfall increased flows into the Worple Road sewer network and manholes, contributing to surcharging and local flood risk; monitoring and upstream storage were recommended to keep extreme flows away from nearby roads and properties. [MUL] (p70)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>postcode area SW20 8: 5 instances of sewer flooding [PAG] (p34)</p></div><div class="nugget-popup quant"><p>SW20 8: 5 instances of sewer flooding [PAG,MUL] (p35)</p></div></div></body></div>`)[0];

                var html_d81835b55a2b5a7e9ea3e7f288589555 = $(`<div id="html_d81835b55a2b5a7e9ea3e7f288589555" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Borough of Merton</h1><div class="nugget-popup"><p>Significant flooding concentrated in western and south&ndash;western parts of Merton during the extreme rainfall events; the report identifies clustered hotspots (e.g. Raynes Park, Home Park Road, West Barnes) where internal, external and highways flooding were recorded. [IMG,PAG,MUL] (p3)</p></div><div class="nugget-popup"><p>Widespread flooding across the borough during extreme rainfall on 12 and 25 July 2021. Sewer capacity was exceeded as large volumes of surface water entered the surface water network; high river levels (Pyl Brook and Beverley Brook) caused backflow, surcharged outfalls and fluvial flooding in some locations. Local factors (topography, gully blockages, sewer configuration) compounded impacts. [PAG,MUL] (p4)</p></div><div class="nugget-popup"><p>Extreme rainfall caused widespread surface water flooding and sewer capacity exceedance within the borough; high river levels on Beverley Brook caused fluvial flooding in parts of the borough and outfalls were surcharged leading to backflow issues. [PAG,MUL] (p5)</p></div><div class="nugget-popup"><p>The borough experienced multiple surface water / sewer&ndash;related flooding hotspots during the July rainfall events, prompting borough&ndash;wide recommendations (sewer capacity upgrades, SuDS retrofits, increased gully cleansing and inspection programmes) to reduce recurrence. [PAG,MUL] (p6)</p></div><div class="nugget-popup"><p>Multiple locations within the borough are identified as hotspots and affected locations in the report for the rainfall events of 12 July 2021 and 25 July 2021. [PAG,MUL] (p7)</p></div><div class="nugget-popup"><p>The Merton borough area experienced flooding associated with the 12th July 2021 and 25th July 2021 heavy rainfall events, with multiple hotspots and non&ndash;Section 19 flooded locations documented. [PAG,MUL] (p8)</p></div><div class="nugget-popup"><p>Two significant flood events in the borough produced a total of 112 reports of flooding; nine properties were internally flooded; one highway incident impeded road access to emergency vehicles across five roads; reports originated from five hotspot locations (four in the western half of the borough and one in the north&ndash;east). [MUL] (p12)</p></div><div class="nugget-popup"><p>Beverley Brook is reported to run adjacent to Hotspot 4 and is identified in the report as potentially contributing to flooding at that hotspot during the investigated events. [PAG,MUL] (p13)</p></div><div class="nugget-popup"><p>Multiple flood incidents affected the borough: three events in June 2016 and July and August 2017 reached the Section 19 investigation threshold, and several locations that had previously flooded were affected again during the July 2021 storms. Named locations affected in July 2021 include the Apostles area, Coombe Lane, Abbott Avenue, West Barnes Lane and Burlington Road. [PAG,MUL] (p15)</p></div><div class="nugget-popup"><p>Multiple locations across the borough experienced surface water and sewer&ndash;related flooding during the recorded incidents; these reached the Section 19 investigation threshold and prompted borough&ndash;level investigation and follow&ndash;up. [IMG,PAG,MUL] (p16)</p></div><div class="nugget-popup"><p>Parts of the borough (Raynes Park / Apostles / Coombe Lane areas) experienced surface water and sewer flooding that prompted the Section 19 recommendations and subsequent investigations, CCTV surveys and pump upgrades to reduce future flood risk. [PAG,MUL] (p18)</p></div><div class="nugget-popup"><p>The borough experienced surface water runoff overloading foul sewers that caused sewage flooding onto streets and into homes in the borough during the 2021 events; borough&ndash;level activity with partners (TWUL and Merton Council) has since delivered clearance, inspections and pump upgrades to reduce recurrence. [PAG] (p19)</p></div><div class="nugget-popup"><p>Widespread flooding on 12 July 2021 causing substantial disruption to roads across the borough, temporarily limiting road access to Category One responder vehicles and private vehicles; flooding reported to highways and to internal and external areas of properties. [PAG] (p20)</p></div><div class="nugget-popup"><p>Widespread surface&ndash;water/urban flooding across the borough on 12 July 2021: substantial disruption to roads (temporary limitation of access to Category One responder vehicles and private vehicles in some locations); highways and both internal and external areas of properties reported flooded. Flooding was concentrated primarily in four hotspots across the west and north&ndash;east of the borough. [IMG,PAG] (p21)</p></div><div class="nugget-popup"><p>Intense rainfall on 25th July 2021 caused surface&ndash;water/urban flooding across the borough, primarily affecting the southern half. Highways and both internal and external areas of properties were flooded. Most reports were concentrated in two hotspots in the south&ndash;western corner of the borough. [PAG] (p22)</p></div><div class="nugget-popup"><p>Intense July 2021 rainfall led to surface&ndash;water / urban flooding across the borough; the two events (12 July 2021 and 25 July 2021) prompted monitoring and assessment using EA and Hydromaster rain gauges. [IMG,PAG,MUL] (p24)</p></div><div class="nugget-popup"><p>Intense, short&ndash;duration rainfall on 12th July and 25th July led to surface water / urban flooding across the borough. On 25th July the report states the rainfall that caused flooding entered the northern areas by about 13:50 and reached the southern areas by about 14:00. The 12th July event produced highly variable, intense downpours (most intense in the north&ndash;west) that contributed to borough&ndash;wide surface water flooding. [IMG,PAG,MUL] (p26)</p></div><div class="nugget-popup"><p>The borough experienced clustered surface water/urban flooding during the intense rainfall on 12th and 25th July 2021, with multiple streets reporting flooding and a number of internal property floodings. [IMG,PAG,MUL] (p28)</p></div><div class="nugget-popup"><p>Widespread reports of internal, external and highways flooding across the borough during the two July 2021 rainfall events; reports were clustered into hotspots and 14 distinct flooded locations were recorded enabling this Section 19 investigation. [PAG,IMG,MUL] (p29)</p></div><div class="nugget-popup"><p>Multiple locations across the borough experienced flooding during the storm events, triggering Section 19 investigation criteria. The report distinguishes 14 different locations across seven hydrological catchments and five hotspots where flood reports were concentrated. [PAG] (p30)</p></div><div class="nugget-popup"><p>The administrative area experienced multiple surface&ndash;water/urban flood hotspots during the 2021 summer storm events identified in the report. [TAB,PAG,MUL] (p31)</p></div><div class="nugget-popup"><p>On 12th July 2021 parts of the London Borough of Merton (Hotspot 1: Raynes Park) experienced surface water flooding that caused internal flooding to properties (including two residential properties), commercial property flooding along Coombe Lane, basement flooding on Worple Road and highway flooding leading to road and underpass closures which affected emergency access. [IMG,PAG] (p33)</p></div><div class="nugget-popup"><p>On 12 July 2021 a flooding hotspot in Merton caused internal flooding to properties (residential and commercial), basement flooding on Worple Road, severe highway flooding in underpasses (e.g., Lower Downs Road underpass) and closures that disrupted emergency access. [IMG,PAG] (p34)</p></div><div class="nugget-popup"><p>The borough experienced an intense July 2021 rainfall hotspot that caused surface water / urban flooding across the hotspot area; local drainage networks were stressed and the event is treated as a primary affected hotspot in the borough&ndash;level investigation. [PAG] (p36)</p></div><div class="nugget-popup"><p>Merton Council&#8217;s gully&ndash;cleansing programme was changed after a 2016 flooding incident; Map16 data supplied by the council show gullies in Abbott Avenue and other local roads were on the high&ndash;priority cleansing programme in 2018/19&ndash;2019/20. Map16 also shows Abbott Avenue gullies had not been cleaned since March 2020 prior to the July 2021 flooding. [IMG,PAG] (p38)</p></div><div class="nugget-popup"><p>Areas within the borough (Raynes Park, Abbott Avenue, Coombe Lane) experienced surface water/sewer flooding, triggering borough&ndash;led investigations, cleansing and infrastructure works. [TAB,PAG] (p45)</p></div><div class="nugget-popup"><p>The borough hotspot experienced sewer surcharging with blown manhole covers, combined sewer overflow discharge and foul water within property boundaries; intense rainfall&ndash;driven surface water runoff flowed to low points (including Coombe Lane and below the railway in Raynes Park) compounding sewer flooding; groundwater pressure distorted a swimming pool lining at a Coombe Lane property. (p47)</p></div><div class="nugget-popup"><p>Multiple surface water and sewer flooding incidents occurred within the borough during the reported events, including sewer overflow flooding to Dupont Road and Clifton Park Avenue, highways flooding, external garden flooding and internal flooding of residential properties; hotspot impacts included a partially collapsed surface water sewer at Home Park Road. [IMG,PAG,MUL] (p49)</p></div><div class="nugget-popup"><p>A stretch of Home Park Road experienced surface&ndash;water flooding concentrated on the carriageway; flood extent extended into the boundaries of some adjacent residential properties and a larger area was at medium risk with estimated flood extent onto some adjacent roads. [PAG,MUL] (p52)</p></div><div class="nugget-popup"><p>During the 12th July 2021 rainfall event the surface water sewer system at Home Park Road was unable to cope, with flows collecting at the eastern end of Home Park Road. The surface water sewer partially collapsed at the junction with Dora Road and blocked gullies outside properties exacerbated runoff, worsening local flooding impacts. [TAB,PAG] (p54)</p></div><div class="nugget-popup"><p>The hotspot within the London Borough of Merton experienced sewer flooding (primary) and surface water flooding (secondary) during the 12 July 2021 rainfall event, with reports to Merton Council about overwhelmed sewers and surface runoff concentrating at Home Park Road. [PAG] (p55)</p></div><div class="nugget-popup"><p>Multiple locations across the borough experienced flooding during the 12th July 2021 rainfall event; some locations (including Hotspot 4: Marina Avenue / Sir Joseph Hood) experienced more substantial flooding on 25th July 2021. [MUL] (p58)</p></div><div class="nugget-popup"><p>Within the London Borough of Merton, Hotspot 4 (Marina Avenue & Sir Joseph Hood) in West Barnes experienced surface water/urban flooding on 25th July 2021 that caused internal flooding to a total of three residential properties (two on Marina Avenue and one within the pavilion) and extensive highway flooding along Marina Avenue; one instance of sewer flooding was recorded in postcode KT3 6. [IMG,PAG] (p59)</p></div><div class="nugget-popup"><p>Parts of the borough were affected by fluvial flooding during the event on 25th July 2021; Merton Council confirmed fluvial flooding occurred within the Marina Avenue & Sir Joseph Hood hotspot. [IMG,PAG] (p62)</p></div><div class="nugget-popup"><p>A fluvial (river) flood incident occurred within a hotspot in the London Borough of Merton (Marina Avenue / Sir Joseph Hood area) on 25th July 2021; Merton Council confirmed flooding within this hotspot. [IMG,PAG] (p63)</p></div><div class="nugget-popup"><p>The Marina Avenue / Sir Joseph Hood hotspot within the London Borough of Merton experienced flooding incidents (internal and highways) during the 25 July 2021 event, concentrated along Marina Avenue and near the Sports/Leisure Centre. [IMG,PAG] (p64)</p></div><div class="nugget-popup"><p>Fluvial flooding from Beverley Brook overflowed channel banks and entered the borough hotspot on 25th July 2021, causing flooding to the Sir Joseph Hood Memorial Playing Fields and Marina Avenue. Surface water runoff due to poor drainage in the playing fields contributed to floodwater collecting and spreading onto Marina Avenue. Within the borough, the Lower Morden hotspot experienced highways and external&ndash;area flooding (with one residential extension internally flooded on Garth Road). [PAG] (p66)</p></div><div class="nugget-popup"><p>Extreme rainfall events on 12th July 2021 and 25th July 2021 caused borough&ndash;wide flooding: numerous surface water and sewer flooding incidents, some river&ndash;influenced impacts (high Pyl Brook levels reduced sewer capacity) and road closures that disrupted emergency response. [MUL] (p69)</p></div><div class="nugget-popup"><p>Flooding occurred across the borough during the 12 July 2021 and 25 July 2021 extreme rainfall events, producing multiple reports, incidents of internal flooding and localized road closures (including in Raynes Park). The borough was identified as primarily at risk of sewer and surface water flooding, with parts additionally at high risk of fluvial and groundwater flooding. [PAG,MUL] (p70)</p></div><div class="nugget-popup"><p>The borough experienced concentrated surface&ndash;water and sewer flooding at identified hotspots (Raynes Park, Home Park Road, West Barnes, Burlington Road / Shannon Corner). Specific impacts included sewer surcharge and property backflows at Abbott Avenue (western end), overflow/flows from the Worple Road CSO entering manholes, gully surcharging on Lower Downs Road at the low point below the railway, capacity and defect&ndash;related flooding of the main surface&ndash;water sewer under the railway behind Home Park Road, and backflows/insufficient capacity on the Westway surface&ndash;water sewer. [PAG,MUL] (p71)</p></div><div class="nugget-popup"><p>Multiple hotspots across the borough (including West Barnes, Burlington Road / Shannon Corner, Marina Avenue / Sir Joseph Hood, and Lower Morden) experienced surface&ndash;water flooding, sewer surcharges/backflows and fluvial flooding risks; the council and RMAs were given recommendations to improve drainage, clear blocked outlets and introduce SuDS and flood storage to reduce future impacts. [PAG,MUL] (p72)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Clusters of reports concentrated within three hotspot areas on the 12 July 2021 map; five borough&ndash;wide hotspots were selected for analysis in the investigation [IMG,PAG,MUL] (p3)</p></div><div class="nugget-popup quant"><p>112 reports of flooding; nine internally flooded properties; one highway incident; five roads; five hotspot locations [MUL] (p12)</p></div><div class="nugget-popup quant"><p>14 locations; 9 locations met the Section 19 threshold; 5 named locations affected (Apostles area, Coombe Lane, Abbott Avenue, West Barnes Lane, Burlington Road) [PAG,MUL] (p15)</p></div><div class="nugget-popup quant"><p>3 flooding incidents; 14 locations affected; 9 locations met Section 19 threshold [IMG,PAG,MUL] (p16)</p></div><div class="nugget-popup quant"><p>65 reports of flooding; 10 incidents reported to social media [PAG] (p20)</p></div><div class="nugget-popup quant"><p>65 reports of flooding to Merton Council; 10 further incidents reported on social media [IMG,PAG] (p21)</p></div><div class="nugget-popup quant"><p>35 reports of flooding to Merton Council; 2 further incidents reported on social media [PAG] (p22)</p></div><div class="nugget-popup quant"><p>65 resident flood reports across 35 streets (12th July 2021); 35 resident flood reports across 21 streets (25th July 2021); 9 internal flooding incidents (12th July 2021); 4 internal flooding incidents (25th July 2021) [IMG,PAG,MUL] (p28)</p></div><div class="nugget-popup quant"><p>14 different locations; seven hydrological catchments; five hotspots [PAG,IMG,MUL] (p29)</p></div><div class="nugget-popup quant"><p>14 different locations; seven hydrological catchments; five hotspots [PAG] (p30)</p></div><div class="nugget-popup quant"><p>14 primary flooded locations [PAG,MUL] (p31)</p></div><div class="nugget-popup quant"><p>2 residential properties [IMG,PAG] (p33)</p></div><div class="nugget-popup quant"><p>1 property (Coombe Lane swimming pool) (p47)</p></div><div class="nugget-popup quant"><p>2 residential properties; 4 instances of sewer flooding in postcode SW19 7 [IMG,PAG,MUL] (p49)</p></div><div class="nugget-popup quant"><p>1 collapsed surface water sewer; 1 flooded property [TAB,PAG] (p54)</p></div><div class="nugget-popup quant"><p>3 residential properties; 30m of road; 65m of footway; 1 instance of sewer flooding [IMG,PAG] (p59)</p></div><div class="nugget-popup quant"><p>1 property (internal flooding adjacent to Sir Joseph Hood area); 1 property extension (internal flooding, Garth Road) [PAG] (p66)</p></div><div class="nugget-popup quant"><p>75 reports; 37 reports; 9 internal flooding incidents; 4 internal flooding incidents [MUL] (p69)</p></div><div class="nugget-popup quant"><p>75 reports; 37 reports; nine incidents of internal flooding; four incidents of internal flooding [PAG,MUL] (p70)</p></div></div></body></div>`)[0];

                var html_61b7e971a2ed835679743385aeb8c6b6 = $(`<div id="html_61b7e971a2ed835679743385aeb8c6b6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Raynes Park</h1><div class="nugget-popup"><p>Designated Hotspot 1 on the 12 July 2021 map with clustered reports of internal, external and highways flooding during the extreme rainfall event; identified as a concentrated area of flood reports indicating local vulnerability likely related to topography, drainage or infrastructure. [IMG] (p3)</p></div><div class="nugget-popup"><p>Following the July 2021 flooding, a pumping station in Raynes Park was upgraded and is subject to monitoring&mdash;implying the area experienced sewer capacity issues and required asset upgrades due to flooding. [MUL] (p5)</p></div><div class="nugget-popup"><p>Raynes Park town centre experienced surface&ndash;water&ndash;related and sewage flooding during the 2021 events; subsequent joint works (gully clearance, CCTV surveys and pump upgrades) have been implemented and have since prevented flooding to the town centre and underneath the railway bridge following the 2021 incidents. [TAB,MUL] (p19)</p></div><div class="nugget-popup"><p>Raynes Park appears in the map cells showing high return periods (50&ndash;100 years and above) during the 12 July 2021 event; the intense rainfall and the borough&ndash;wide flooding response imply Raynes Park likely experienced localised surface&ndash;water/urban flooding as part of the broader disruption (including road access limitations and multiple borough reports of flooding). [IMG] (p21)</p></div><div class="nugget-popup"><p>Clustered reports of internal, external and highways flooding concentrated within the Raynes Park hotspot (map for 12 July 2021 shows many of the borough's reported incidents were located here). [PAG,IMG] (p29)</p></div><div class="nugget-popup"><p>Flooding in the Coombe Lane area including the Raynes Park railway bridge during the July 2021 events. The report records this location as flooded on 12th July 2021 (Hydromaster return period 1 in 50 to 1 in 100 yr; TWUL FEH13 1 in 393.2 yr). [TAB] (p31)</p></div><div class="nugget-popup"><p>On 12th July 2021 intense rainfall caused surface water/urban flooding across the Raynes Park hotspot. Internal flooding occurred to two residential properties on Coombe Lane and Richmond Road; several commercial units along Coombe Lane near Raynes Park railway station were internally flooded; basement areas of properties on Worple Road near the junction with Lower Downs Road were flooded; external areas of properties were inundated; highway flooding led to closures of Coombe Lane, Abbott Avenue, Worple Road and the railway underpasses at Lower Downs Road and Approach Road. The deepest flooding was along Coombe Lane adjacent to the railway embankment and within the underpass. [IMG] (p33)</p></div><div class="nugget-popup"><p>Hotspot area experienced combined sewer and surface water flooding that led to internal flooding of residential and commercial properties, road closures (including railway underpasses and access routes), and disruption to emergency access. Coombe Lane experienced the deepest floodwaters, running parallel to the railway embankment and within the underpass. [IMG] (p35)</p></div><div class="nugget-popup"><p>Raynes Park is identified as Hotspot 1 on the map with clustering of internal, external and highways flooding incidents along main drainage corridors during the July 2021 event. Flood incidents were shown near key infrastructure (education, medical, library), indicating the area experienced surface water/urban flood impacts. [IMG] (p37)</p></div><div class="nugget-popup"><p>Flows from higher ground collected in central Raynes Park against the raised railway embankment, causing concentrated surface&ndash;water and highway flooding in the town centre and local low points (including the railway underpass). The map shows internal, external and highway flooding incidents clustered within the hotspot boundary in the Worple Road / Lower Downs Road area. [IMG] (p39)</p></div><div class="nugget-popup"><p>The area around Raynes Park (including the railway underpass by Raynes Park Railway Station and adjacent streets) experienced surface water flooding during the 12th July 2021 event, with recorded internal/external incidents clustering near the station and along Coombe Lane. [IMG] (p40)</p></div><div class="nugget-popup"><p>Surface water/sewer flooding affected the Raynes Park town centre area leading to installation of 4G sensors across most of the town centre to monitor blocked drains and silt/water levels, and funding proposals for SuDS measures on nearby roads to reduce future surface water impacts. [TAB] (p45)</p></div><div class="nugget-popup"><p>Surface water sewer network at Raynes Park Station required high&ndash;pressure jet cleaning after the event; surface water overloading and sewer surcharging occurred in the area contributing to local flooding and gully surcharging that discharged onto downstream streets. [TAB] (p46)</p></div><div class="nugget-popup"><p>Central Raynes Park low points (below the railway bridge) experienced surface water runoff and surcharging of the sewer network during the 12 July 2021 rainfall, creating areas of floodwater and contributing to property impacts in the hotspot. (p47)</p></div><div class="nugget-popup"><p>During the 12 July 2021 event, access to several roads across Raynes Park was closed, disrupting emergency responder movements. The area has high susceptibility to groundwater emergence and sewer&ndash;related issues (including gully surcharging related to pumping station operation) that contributed to localised flooding. (p70)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 residential properties [IMG] (p33)</p></div></div></body></div>`)[0];

                var html_e609faa67ab5733407fe5af507569d70 = $(`<div id="html_e609faa67ab5733407fe5af507569d70" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>West Barnes</h1><div class="nugget-popup"><p>Designated as Hotspot 3 on the 12 July 2021 map with multiple reported incidents of internal, external and highways flooding concentrated in the area; identified as a localised area of elevated flood risk and prioritised for further investigation and management. [IMG] (p3)</p></div><div class="nugget-popup"><p>Identified as Hotspot 3: localised flooding issues linked to constrained surface water sewer capacity and surface water runoff; recommendations include increasing sewer size at Westway, higher&ndash;frequency inspections, SuDS retrofits along West Barnes Lane/Westway/Burlington Road&ndash;Shannon Corner, and increased gully cleansing. [MUL] (p6)</p></div><div class="nugget-popup"><p>The report&#8217;s rainfall analysis shows West Barnes lying within west/south areas that experienced elevated return periods (approximately 50&ndash;100 years) on 12 July 2021. That extreme rainfall is associated with surface water/urban flooding across western LB Merton and with temporary road access disruption noted in the report. [IMG] (p21)</p></div><div class="nugget-popup"><p>Clustered reports of internal (property) and external flooding and some highways flooding concentrated in the West Barnes hotspot during the 12th July 2021 intense rainfall event. [PAG,IMG] (p29)</p></div><div class="nugget-popup"><p>Flooding occurred across the West Barnes hotspot during the 12th July 2021 rainfall event, affecting highways and external areas of properties; primarily&ndash;affected locations included Westway, West Barnes Lane, and the Burlington Road / Shannon Corner junction. One residential property's garage outbuilding experienced internal flooding (not involving foul water). [PAG] (p56)</p></div><div class="nugget-popup"><p>The Hotspot located within West Barnes (Marina Avenue & Sir Joseph Hood) experienced surface water/urban flooding on 25th July 2021 causing internal flooding to two residential properties on Marina Avenue and one residential property within the Sir Joseph Hood pavilion, plus extensive highway flooding on Marina Avenue; a sewer&ndash;flooding incident was recorded within postcode KT3 6 in the hotspot area. (p59)</p></div><div class="nugget-popup"><p>The West Barnes area experienced flooding associated with the two extreme rainfall events; specific roads in the area saw few reports on 25th July 2021 but more substantial flooding on 12th July 2021. [MUL] (p69)</p></div><div class="nugget-popup"><p>Surface runoff and constrained surface&ndash;water sewer capacity led to flooding issues in the West Barnes area, with risk of sewer backflows; recommendations include increased inspection and upsizing of the main surface&ndash;water sewer and introduction of highway SuDS to reduce runoff. [MUL] (p71)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 garage outbuilding [PAG] (p56)</p></div><div class="nugget-popup quant"><p>3 residential properties; 30m of road; 65m of footway; 1 instance of sewer flooding (p59)</p></div></div></body></div>`)[0];

topography and sewer surcharges occurred within the local roads. High Pyl Brook levels likely reduced local sewer&ndash;network capacity during the event. (p69)</p></div><div class="nugget-popup"><p>Identified as Hotspot 5 and affected by the July 2021 extreme rainfall events; parts of the area experienced flood impacts from fluvial sources (Beverley Brook / Pyl Brook risk), and from surface water and sewer&ndash;related flooding with water collecting in local low spots. [PAG,MUL] (p70)</p></div><div class="nugget-popup"><p>The area (Garth Road / Lynmouth Avenue) experienced sewer surcharges and was identified at risk of fluvial flooding; recommendations include expanding local flood storage (Lynmouth Gardens), SuDS retrofits to properties and highways, and increased sewer inspection/clearing to limit surcharges and surface runoff. (p72)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>65 reports of flooding received by Merton Council across LB Merton; 10 further incidents reported via social media (borough&ndash;wide) [IMG] (p21)</p></div><div class="nugget-popup quant"><p>1 property internally flooded; 4 locations (locations 11&ndash;14) identified as primarily affected (p66)</p></div></div></body></div>`)[0];
