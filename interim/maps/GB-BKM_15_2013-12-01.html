                var html_5f3b10c07bed281c8a5aec5567539690 = $(`<div id="html_5f3b10c07bed281c8a5aec5567539690" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>The Orchards Residential Park</h1><div class="nugget-popup"><p>Prolonged above&ndash;average rainfall caused groundwater levels to rise, contributing to the overwhelming of drainage and resulting localised flooding. (p4)</p></div><div class="nugget-popup"><p>Surface water flooding affected mainly the south of The Orchards residential park during the December 2013&ndash;February 2014 event. Flooding resulted from a combination of high watercourse (fluvial) levels, elevated groundwater and surface water ponding which inundated the southern part of the park. [PAG,IMG] (p9)</p></div><div class="nugget-popup"><p>The southern area of the residential park flooded during the December 2013&ndash;February 2014 event. Surface water flooding observed on the maps corresponds to flooding actually experienced; high watercourse (river) levels and high groundwater levels, together with surface runoff, combined to cause inundation of the park. [PAG] (p10)</p></div><div class="nugget-popup"><p>The combined drainage system became inundated (full to capacity) due to groundwater infiltration and excess runoff; it backed up and discharged via gullies, causing contaminated floodwater to pond around the residential park and reducing system capacity. [PAG] (p12)</p></div><div class="nugget-popup"><p>The Orchards Residential Park experienced flooding when the combined drainage system could not cope with extreme, prolonged rainfall. Floodwater (contaminated with sewerage) covered roads, gardens and footpaths, making access very difficult and creating environmental and public health risks. [TAB] (p16)</p></div><div class="nugget-popup"><p>Extensive external flooding across The Orchards Residential Park driven by extreme, prolonged rainfall. The combined drainage system backed up and discharged via gullies; floodwater was contaminated with sewage and covered roads, gardens and footpaths, restricting access and creating environmental and public health risk. No properties were flooded internally. (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>0 properties internally affected (p17)</p></div></div></body></div>`)[0];
