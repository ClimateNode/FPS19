                var html_ece324b3f3dfa1e93ed30e4758d2fead = $(`<div id="html_ece324b3f3dfa1e93ed30e4758d2fead" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Swarbourn</h1><div class="nugget-popup"><p>During Storm Dennis on 16th February 2020 the River Swarbourn rose and was implicated in flooding of Yoxall; bank overtopping and high flows contributed to inundation of the village centre (affecting Main Street and Bond End). [PAG] (p18)</p></div><div class="nugget-popup"><p>The River Swarbourn has produced notable flood events that inundated Yoxall (historic events listed include July 1922, 1953, August 1987 and November 2000). The 1987 and 2000 events caused extensive flooding to the centre of Yoxall and damage to properties and transport routes. On 16 February 2020 peak river levels corresponded with resident reports of internal property flooding in Yoxall. [PAG,MUL] (p22)</p></div><div class="nugget-popup"><p>The River Swarbourn rose and overtopped/escaped its channel onto the floodplain west of the channel, backing up at the Town Hill Bridge and causing floodwater to spill into gardens and contribute to internal flooding of properties on Main Street. [PAG] (p23)</p></div><div class="nugget-popup"><p>The River Swarbourn rose and topped its banks and was identified as the main driver of the flooding in Yoxall, contributing to internal property flooding and surcharge of the local drainage system. (p25)</p></div><div class="nugget-popup"><p>The Swarbourn catchment experienced high flows during the event; the 1.91 m stage corresponds to roughly 15&ndash;16 m3/s and produced flood conditions that affected downstream communities including Yoxall. [PAG] (p27)</p></div><div class="nugget-popup"><p>The River Swarbourn recorded its highest level on record at the Hoar Cross monitoring station during the event, with rapid rise and fall of river levels indicating a river&ndash;flood incident affecting the catchment upstream of Yoxall. [IMG,PAG] (p28)</p></div><div class="nugget-popup"><p>Recorded the highest river level since records began (1.91 m) at the Hoar Cross monitoring station on 16 February 2020; river stage and flows indicate a large flood event in the catchment and contributed to elevated river levels through Yoxall upstream/downstream influence. Modelling and rating&ndash;curve analysis give mixed estimates of event severity but document unusually high river levels on that date. [IMG] (p29)</p></div><div class="nugget-popup"><p>High River Swarbourn levels in February 2020 backed up against structures (Town Hill Bridge and Bond End Footbridge), reduced conveyance capacity and contributed to flooding in Yoxall; upstream weir likely increased upstream water levels and worsened the event. [PAG] (p30)</p></div><div class="nugget-popup"><p>Record high flows in the River Swarbourn during February 2020 caused water levels to rise and flood surrounding land, contributing to internal flooding of properties in Yoxall (including Bond End) by backing up against structures in the channel. [IMG] (p32)</p></div><div class="nugget-popup"><p>River Swarbourn was identified as the main source of flooding in Yoxall; flows larger than local drainage capacity contributed to ingress into the highway system and river flood waters were directed into gardens and properties. (p33)</p></div><div class="nugget-popup"><p>The River Swarbourn caused flooding in Yoxall on 16 February 2020. Flow was constricted by Town Hill Bridge and Bond End Footbridge which increased local flood levels and backwater; water also backed up against an upstream weir, contributing to flooding and channel issues. [TAB,PAG] (p34)</p></div><div class="nugget-popup"><p>Identified as a source of river flooding in Yoxall; water backed up against channel structures contributing to flooding of the village. River levels during the February 2020 event were approximately a 5% AEP (1 in 20&ndash;year) event and the channel at key structures was identified as having insufficient capacity to convey flows. (p38)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1.91 m; approximately 15&ndash;16 m3/s [PAG] (p27)</p></div><div class="nugget-popup quant"><p>1.91 m river level; flow approximately 15&ndash;16 m3/s (rating curve); modelled peak discharge 8.1 m3/s at 16:15 on 16th February 2020; rating&ndash;curve equivalent 16.1 m3/s (5% AEP / 20&ndash;year) [IMG,PAG] (p28)</p></div><div class="nugget-popup quant"><p>1.91 m river level; flow approximately between 15 and 16 m3/s (rating&ndash;curve estimate); peak discharge modelled at 8.1 m3/s at 16:15 hrs on 16 February 2020; 5% AEP (20&ndash;year) reference of 16.1 m3/s [IMG] (p29)</p></div></div></body></div>`)[0];

ng potential surcharging; main roads became unpassable to some residents and properties nearby were affected by flood water. (p33)</p></div><div class="nugget-popup"><p>Main Street was affected by flooding from the River Swarbourn during the 16 February 2020 event, prompting recommendations to assess and maintain highway drainage (gullies) and increase maintenance frequency to improve network capacity. [TAB] (p34)</p></div><div class="nugget-popup"><p>Highway drainage on Main Street was implicated in flood impacts; the condition and capacity of gullies and the highway drainage network should be assessed and maintenance increased to reduce future flooding. (p35)</p></div><div class="nugget-popup"><p>Main Street in Yoxall experienced internal flooding to properties, flooding of gardens, garages, summer houses and driveways, and main roads through the village became unpassable leaving residents cut off. (p38)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8 residential properties and 1 commercial property (across Yoxall) (p38)</p></div></div></body></div>`)[0];

                var html_1e2248f2f99175de058f5724a5a8ed42 = $(`<div id="html_1e2248f2f99175de058f5724a5a8ed42" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bond End, Yoxall</h1><div class="nugget-popup"><p>Internal property flooding reported on Bond End; properties were internally affected during the event. (p5)</p></div><div class="nugget-popup"><p>Flooding occurred on Bond End in Yoxall on 16th February 2020. (p16)</p></div><div class="nugget-popup"><p>Bond End (A515 through Yoxall) was flooded on 16th February 2020, with floodwaters affecting the road corridor through the village and causing disruption to the route. (p18)</p></div><div class="nugget-popup"><p>Properties at Bond End were internally inundated during the early hours of 16 February 2020; impacts included subsequent damp and mould growth and internal property damage (carpets, flooring, furniture and some irreplaceable personal items). [IMG] (p24)</p></div><div class="nugget-popup"><p>Floodwater backed up against the Bond End Footbridge and spilled out to affect properties at Bond End during the February 2020 flood incident. (p30)</p></div><div class="nugget-popup"><p>Several properties in Bond End flooded internally during the early hours of 16 February 2020 as a result of record river flows and backing&ndash;up of water against channel structures. [IMG] (p32)</p></div><div class="nugget-popup"><p>Surface water pooled at the Bond End and Mainstreet junction and flows (including those from Savey Lane) were directed into this junction, contributing to flooding of adjacent properties and making main roads impassable. Local highway drainage became overwhelmed and potentially surcharged near this location. (p33)</p></div><div class="nugget-popup"><p>Bond End was affected by flooding from the River Swarbourn on 16 February 2020; actions were recommended to inspect and maintain highway drainage and address blockage risks at nearby structures. [TAB,PAG] (p34)</p></div><div class="nugget-popup"><p>Bond End in Yoxall was affected by the same flooding incident: internal flooding to properties, flooding of gardens/garages/summer houses/driveways, and roads becoming impassable; river flows backed up against structures such as Bond End footbridge. (p38)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 to 24 inches (approximately 12&ndash;60 cm) internal flood depths [PAG,IMG] (p24)</p></div><div class="nugget-popup quant"><p>8 residential properties and 1 commercial property (across Yoxall) (p38)</p></div></div></body></div>`)[0];

                var html_e1176412a6cd5693c0f15857b7f9d5c0 = $(`<div id="html_e1176412a6cd5693c0f15857b7f9d5c0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>East Staffordshire</h1><div class="nugget-popup"><p>Storm Dennis (February 2020) caused flooding to properties and highways across East Staffordshire; resulted in requests for grant support and multiple incidents of internal property flooding. (p6)</p></div><div class="nugget-popup"><p>East Staffordshire Borough Council received reports and processed Flooded Property Claims arising from the event; grant funding (DEFRA Property Flood Resilience and ESBC) was provided to support repairs for affected properties across the borough. (p25)</p></div><div class="nugget-popup"><p>Yoxall, within East Staffordshire, experienced flooding on 16 February 2020 (affecting areas including Main Street and Bond End), prompting investigation and recommended actions by RMAs. [TAB] (p34)</p></div><div class="nugget-popup"><p>River Swarbourn flooded and contributed to flooding in Yoxall village. Flooding led to channel condition concerns, debris blocking structures (e.g. bridges/footbridges), and pressure on highway drainage (Main Street / Bond End); the catchment was noted as saturated due to antecedent rainfall. (p35)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than 130 applications for grant support; incidents in many areas where five or more properties were internally flooded (p6)</p></div><div class="nugget-popup quant"><p>more than 130 applications; approximately 86 properties received grants; approximately ␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀␀                 var html_bc74459eef413c4b64ad2a9e9ae7893e = $(`<div id="html_bc74459eef413c4b64ad2a9e9ae7893e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Yoxall</h1><div class="nugget-popup"><p>Properties in Yoxall (specifically on Main Street and Bond End) suffered internal flooding associated with Storm Dennis. (p5)</p></div><div class="nugget-popup"><p>Properties on Main Street and Bond End in Yoxall were internally flooded as a result of the Storm Dennis event. [PAG] (p6)</p></div><div class="nugget-popup"><p>On 16 February 2020 multiple properties in Yoxall reported internal flooding; anecdotal accounts describe floodwaters entering properties in the early hours corresponding with a peak River Swarbourn level at 04:00. Flood sources reported included surface water, surcharging/drainage flooding and predominantly river flooding from the River Swarbourn. Historical impacts: the centre of Yoxall suffered extensive flooding with property damage and disrupted local transport during August 1987 and November 2000; Main Street experienced flooding in June 2007 and summer 2012 (in 2012 one commercial property at the junction of Main Street and the B5016 was flooded, with no internal property flooding reported). [PAG,MUL] (p22)</p></div><div class="nugget-popup"><p>Multiple properties experienced internal flooding; gardens, garages, summer houses and driveways were flooded. Main roads through the village became unpassable until floodwater receded, leaving some residents unable to leave their homes. [PAG,IMG] (p23)</p></div><div class="nugget-popup"><p>Multiple properties across Yoxall experienced internal flooding during the event on 16 February 2020; property owners reported flood depths within dwellings of approximately 12&ndash;60 cm and subsequent damp, mould and internal damage to carpets, flooring, furniture and personal items. [PAG] (p24)</p></div><div class="nugget-popup"><p>Flood Warning for the River Swarbourn was in force during the event; properties in Yoxall were internally flooded with reported internal damage to carpets, flooring, furniture and irreplaceable personal items; Environment Agency collected reports of flooded properties and sandbags were observed outside properties on Main Street. [PAG] (p25)</p></div><div class="nugget-popup"><p>Floodwaters from the River Swarbourn overtopped its banks and spilled onto the floodplain west of the channel, back&ndash;up at the Town Hill Bridge caused constriction and led to inundation of gardens and flow into properties on Main Street. Internal ground&ndash;floor flooding occurred in properties; gardens, garages, summer houses and driveways were flooded; main roads through the village were impassable, leaving some residents unable to leave their homes. Sandbags were observed outside several properties. A Flood Warning for the River Swarbourn at Yoxall was in force during the event. [IMG,PAG] (p26)</p></div><div class="nugget-popup"><p>Yoxall was affected by the Swarbourn catchment flood incident on 16 February 2020: intense rainfall in the preceding period and raised river levels in the catchment (River Swarbourn peak 1.91 m upstream) contributed to local flooding. (p27)</p></div><div class="nugget-popup"><p>Flooding on 16th February 2020 affected the village when River Swarbourn backed up at structures (Town Hill Bridge and Bond End Footbridge), causing water to spill out and affect properties in the settlement. (p30)</p></div><div class="nugget-popup"><p>River flood waters (from the River Swarbourn) entered gardens and properties in the village; surface water pooled at key junctions and flowed into residential areas. Main roads became unpassable and some residents were unable to leave their properties until flood water receded. [PAG] (p33)</p></div><div class="nugget-popup"><p>The village of Yoxall experienced flooding from the River Swarbourn on 16 February 2020. Flood levels in the village were influenced by local structures (Town Hill Bridge, Bond End Footbridge) and an upstream weir, prompting consideration of measures such as NFM, PFR, channel maintenance and modelling updates. [TAB] (p34)</p></div><div class="nugget-popup"><p>Flooding from the River Swarbourn affected the village; debris became trapped against local bridges (Bond End footbridge and Town Hill Bridge) and water was observed to back up against an upstream weir, contributing to local inundation. [PAG] (p35)</p></div><div class="nugget-popup"><p>Floodwater from increased runoff/river flow entered the village during extended periods of rainfall, prompting recommendations for natural flood management measures and community engagement; residents were asked to provide flood levels/photographs to the EA to help check warning triggers. [PAG] (p36)</p></div><div class="nugget-popup"><p>Internal flooding of residential and commercial properties; flooding of gardens, garages, summer houses and driveways; main roads through the village became unpassable leaving some residents on Main Street and Bond End cut off and unable to leave their homes for a period. (p38)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 arches of Town Hill Bridge; 1 commercial property flooded (summer 2012) [PAG,MUL] (p22)</p></div><div class="nugget-popup quant"><p>8 residential properties; 1 commercial property [PAG,IMG] (p23)</p></div><div class="nugget-popup quant"><p>flood depths 12&ndash;60 cm reported in dwellings [PAG] (p24)</p></div><div class="nugget-popup quant"><p>8 residential properties; 1 commercial property [IMG,PAG] (p26)</p></div><div class="nugget-popup quant"><p>8 residential properties; 1 commercial property (p38)</p></div></div></body></div>`)[0];
                popup_38402d33bb8d025e55c65da8c7e4a3ae.setContent(html_bc74459eef413c4b64ad2a9e9ae7893e);

                var html_6e8c9a322d8309b1ae4824100a967948 = $(`<div id="html_6e8c9a322d8309b1ae4824100a967948" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hoar Cross</h1><div class="nugget-popup"><p>The Hoar Cross monitoring station recorded the highest River Swarbourn level on record: 1.91 m at 05:00 on 16 February 2020, indicating the location experienced the peak river stage for the event. [PAG] (p27)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1.91 m [PAG] (p27)</p></div></div></body></div>`)[0];
