                var html_de54d1433198acd74087ffc1e957d1da = $(`<div id="html_de54d1433198acd74087ffc1e957d1da" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Brighton and Hove</h1><div class="nugget-popup"><p>Heavy rainfall on 20 June 2023 produced localised surface water flooding across Brighton and Hove, affecting both commercial and residential locations; flows were routed along the highway network and followed the steeply sloping terrain. [PAG] (p5)</p></div><div class="nugget-popup"><p>Reports of flooding across several locations in the city on 20 June 2023, affecting both commercial and residential areas. [PAG] (p6)</p></div><div class="nugget-popup"><p>Reported flood incidents across the study area on 20 June 2023 affected multiple catchments and identified &#8216;hotspot&#8217; locations, prompting a Section 19 investigation and formulation of an Action Plan and mitigation measures for the city. (p8)</p></div><div class="nugget-popup"><p>The City was impacted by flooding on 20th June 2023 due to heavy rain and thunderstorms, causing surface water flooding across the City. [PAG] (p13)</p></div><div class="nugget-popup"><p>On 20 June 2023 heavy rain and thunderstorms caused flash and surface&ndash;water urban flooding across the city: homes and businesses flooded (including named shops Waitrose, Poundland and the Post and Telegraph); roads flooded causing delays on routes including the A23 and A27; observed flow paths included Sutherland Road from Whitehawk Hill and Elm Grove down to the Lewes Road junction; footpath at Preston Park Station was flooded. Brighton and Hove City Council received reports and evidence of multiple flooded properties. [TAB,PAG] (p14)</p></div><div class="nugget-popup"><p>Experienced concentrated surface&ndash;water/urban flooding associated with a brief, intense rainfall on 20 June 2023; recorded incidents were spread across the authority area with concentration in central Brighton and Hove and nearby neighbourhoods. [PAG] (p16)</p></div><div class="nugget-popup"><p>The authority area experienced multiple localised flood incidents during the June 2023 event; the report locates a centroid (531477, 106640) in the centre of most recorded flood incidents in the urban area and uses local gauge and FEH point data to analyse the event. (p18)</p></div><div class="nugget-popup"><p>Multiple recorded flood incidents across the authority area during the 1&ndash;hour intense rainfall on 20th June 2023, concentrated in central Brighton and the southern seafront. The local gauge observed ~26.6&ndash;26.8 mm in one hour; modelling translated this to a ~150&ndash;year 1&ndash;hour design hyetograph, indicating an unusually severe short&ndash;duration surface&ndash;water flooding episode affecting the urban area. [IMG,PAG] (p19)</p></div><div class="nugget-popup"><p>Surface water flooding during the intense June 2023 rainfall (20 June 2023) across the city; incidents were reported by residents prompting an investigation. Highway drainage issues were reported (blocked gullies/drains) and flood water not draining away. [PAG] (p20)</p></div><div class="nugget-popup"><p>Heavy rainfall in June 2023 produced surface water flooding across the city; the urban form (hills and valleys, lack of open watercourses) caused runoff to concentrate and produce reported flooding incidents, with floodwaters routed along urban streets and into low&ndash;lying areas. [PAG] (p22)</p></div><div class="nugget-popup"><p>Heavy rainfall on 20th June 2023 produced rapid overland and surface water flow causing localised surface water flooding across the city, affecting both commercial and residential locations. Flooding was reported to the council and via social media/news; the city's drainage is reliant on the sewer/drainage infrastructure (no rivers indicated in the Detailed River Network). (p23)</p></div><div class="nugget-popup"><p>Experienced flooding in June 2023, prompting ESFRS call&ndash;outs and a Section 19 Flood Investigation by the local authority. (p41)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>11 incidents reported to Brighton and Hove City Council; 17 locations attended by East Sussex Fire and Rescue Service [PAG] (p5)</p></div><div class="nugget-popup quant"><p>18 flood related incidents; 11 reported incidents; 5 properties (No. 12, 14, 18, 19 and 20b Warmdene Road); 3 properties (82 Valley Road and 2 neighbouring houses); 2 supermarkets (Waitrose and Poundland) [TAB,PAG] (p14)</p></div><div class="nugget-popup quant"><p>28 recorded incidents [PAG] (p16)</p></div><div class="nugget-popup quant"><p>11 incidents reported; 17 locations attended by East Sussex Fire and Rescue Service (p23)</p></div></div></body></div>`)[0];
