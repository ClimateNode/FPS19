                var html_5bff7a9099b4cdf8b633994e2a20c69c = $(`<div id="html_5bff7a9099b4cdf8b633994e2a20c69c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Wye</h1><div class="nugget-popup"><p>The River Wye's channel through the Wooburn Green area split as it passed under Windsor Hill, with flows directed west toward the A4094 and SW around the eastern boundary. During the event these river channels contributed to flooding in the Wooburn Green area (including the area around Wooburn Manor Park). (p7)</p></div><div class="nugget-popup"><p>The River Wye burst its banks and flowed across the right bank, across fields and toward the houses on Windsor Hill, delivering floodwater into the built&ndash;up area. A fallen tree was mapped on the east bank upstream of the main bridge and may have obstructed flow, exacerbating localized flooding. (p14)</p></div><div class="nugget-popup"><p>The River Wye burst its banks when high winter rainfall combined with a channel blockage (a fallen tree) prevented flow. The river broke its banks on the right bank and flowed across the adjacent field towards Windsor Hill, filling the field and causing downstream flooding of properties. [PAG] (p15)</p></div><div class="nugget-popup"><p>River Wye levels were very high and, combined with a tree blocking the channel upstream of Windsor Hill bridge, the river breached its right bank upstream of the blockage. Floodwater flowed into the adjacent field and towards Windsor Hill, inundating properties and infrastructure. [PAG,TAB] (p16)</p></div><div class="nugget-popup"><p>A tree in the channel upstream of Windsor Hill bridge blocked the free flow of water during high flows, causing the river to overtop the right bank and flow into the adjacent field, across the road and up to a house on the north side of Windsor Hill. (p17)</p></div></div></body></div>`)[0];

                var html_eaa3e9bce412af2364f47b359e51e63a = $(`<div id="html_eaa3e9bce412af2364f47b359e51e63a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Windsor Hill, Wooburn Green</h1><div class="nugget-popup"><p>Flooding forced full closure of the road; closure disrupted access and transport through the area. (p4)</p></div><div class="nugget-popup"><p>Windsor Hill road was closed due to flooding, causing loss of highway access over the period of the event. (p5)</p></div><div class="nugget-popup"><p>Floodwater from the River Wye flowed across fields toward the houses on Windsor Hill, and additional rapid overland flow ran down the steep Windsor Hill, increasing flood risk to properties on the hill. (p14)</p></div><div class="nugget-popup"><p>Floodwater from the River Wye flowed across the field and down Windsor Hill. The field filled with water up to waist depth; horses had to be removed. Residents moved cars to safety and pumped water out of front gardens. Water approached houses from the road and the rear; properties had water up to their floorboards and gardens and drives were flooded. The Queen and Albert public house had its cellar flooded. [PAG] (p15)</p></div><div class="nugget-popup"><p>Floodwater from the River Wye broke its banks and flowed down into the field towards Windsor Hill. The field was inundated to about waist depth, horses were removed for safety, residents moved cars to safety, water was pumped from front gardens, and properties experienced flooding to floorboards, gardens and drives. The road was closed (reports show closures from 07 Feb, remaining closed through 11 Feb, reopened 12 Feb). [PAG,TAB] (p16)</p></div><div class="nugget-popup"><p>Overtopping of the River Wye's right bank caused floodwater to flow into the adjacent field, across the road and up to the house on the north side of Windsor Hill; the road experienced deep water and was closed by TfB/BCC to prevent vehicles pushing water towards houses; residents undertook protective measures and sought assistance from the EA. (p17)</p></div><div class="nugget-popup"><p>Windsor Hill road and adjacent properties were flooded: the road was closed between 6 and 12 February 2014; water surrounded properties on the north side of Windsor Hill, residents pumped to try to prevent ingress, and water rose up to the floorboards in a number of properties. (p21)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 houses (p4)</p></div></div></body></div>`)[0];

                var html_bdbf84f51a92f75cc303731e65f1e922 = $(`<div id="html_bdbf84f51a92f75cc303731e65f1e922" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Buckinghamshire</h1><div class="nugget-popup"><p>Buckinghamshire County Council (BCC) implemented the closure of Windsor Hill (with TfB) between 06 Feb 2014 and 12 Feb 2014 as part of the immediate response; the flooding was caused by River Wye overtopping its right bank after a tree blocked the channel, leading to water on the road and surrounding properties on the north side of Windsor Hill. [TAB] (p21)</p></div></div></body></div>`)[0];

                var html_906f4df7c2b3de2804c2fccd71353f1c = $(`<div id="html_906f4df7c2b3de2804c2fccd71353f1c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wooburn Green</h1><div class="nugget-popup"><p>Flooding at Windsor Hill within Wooburn Green caused the Windsor Hill road to be closed for several days; residential properties experienced internal flooding to floorboard level and the public house cellar flooded. (p4)</p></div><div class="nugget-popup"><p>Flooding in the Wooburn Green area caused the closure of Windsor Hill (a Class A/B highway) and prompted a formal section 19 investigation by the county authority. [PAG] (p5)</p></div><div class="nugget-popup"><p>Flooding from the River Wye affected the Wooburn Green area. The River Wye, which runs through Wooburn Green, splits under Windsor Hill; one channel flows toward the A4094 and the other flows around the eastern boundary then along the southern boundary of the Wooburn Manor Park residential area before rejoining. These channel routes were implicated in the local inundation of the Wooburn Green locality during the event. [PAG] (p6)</p></div><div class="nugget-popup"><p>The region of Wooburn Green was flooded, with inundation affecting areas around Wooburn Manor Park and other low&ndash;lying areas adjacent to the River Wye's channels. [PAG] (p7)</p></div><div class="nugget-popup"><p>Floodwater from the River Wye breached its banks and flowed across the lower&ndash;lying fields between the river and the property Salan, inundating those fields and flowing onto Windsor Hill road toward houses on Windsor Hill. Runoff down the steep Windsor Hill road also contributed to flood routing into the settlement. Photographs and resident records document historic inundation along Windsor Hill and the intervening fields. (p13)</p></div><div class="nugget-popup"><p>Area of Wooburn Green (particularly Windsor Hill) was affected when the River Wye breached its banks and flooded adjoining fields and properties &mdash; causing inundation to gardens, drives and floorboards, horse evacuation, vehicle moves and road closures. [PAG,TAB] (p16)</p></div><div class="nugget-popup"><p>The fluvial event (caused by prolonged rainfall and worsened by a tree blocking the River Wye channel upstream of Windsor Hill Bridge) led to river overtopping that produced deep water on roads and flow into fields and up to houses in the Wooburn Green area; residents called the Environment Agency, took protective measures for their properties and requested assistance; highways authorities closed the road to reduce the risk of vehicles pushing water into houses. (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>road closed for 5 to 6 days; 2 houses with water up to floorboards; 1 public house cellar flooded (p4)</p></div></div></body></div>`)[0];
                popup_d11abae3373c98a3a41fa16991390bff.setContent(html_906f4df7c2b3de2804c2fccd71353f1c);

                var html_fc677ce6c2d28766e0a84b3ebabc2797 = $(`<div id="html_fc677ce6c2d28766e0a84b3ebabc2797" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wooburn</h1><div class="nugget-popup"><p>Wooburn Green (part of Wooburn) was flooded; the flood triggered a section 19 investigation and was associated with local transport disruption (Windsor Hill road closure). [PAG] (p5)</p></div><div class="nugget-popup"><p>The two River Wye channels rejoin near the SW corner of Wooburn Manor Park and then follow a SW route along the A4094 through Wooburn, causing river flooding along that route through Wooburn. [PAG] (p7)</p></div></div></body></div>`)[0];
