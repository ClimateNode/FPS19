                var html_bebee6c49fa7458c661080ca4c1ed1d8 = $(`<div id="html_bebee6c49fa7458c661080ca4c1ed1d8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hayle</h1><div class="nugget-popup"><p>Fore Street experienced flash flooding (seen on CCTV) and was closed by Hayle CFRS; Copperhouse area of Hayle was reported flooded and received a 999 call; the St Erth river gauge reached trigger level prompting an Environment Agency flood warning for Hayle; a riverbank collapse was reported at Philgray Close; water had completely receded from Fore Street by 13:15. [TAB] (p2)</p></div><div class="nugget-popup"><p>Major flood incident in the town: town centre inundated by agricultural surface water runoff and by the River Hayle rising rapidly with tide&ndash;locking; town&ndash;centre flooding aggravated by bow&ndash;wave from traffic; town&ndash;centre streets (Prospect Place, St Johns Street and Chapel Lane) were closed and feeder streets flooded; significant internal flooding of properties in the town centre (Fore Street). [PAG] (p5)</p></div><div class="nugget-popup"><p>Hayle experienced the most significant flooding on 19 December 2019, driven by an intense downpour between about 10:00 and 10:45 which led to surface water/urban flooding in the town. [PAG] (p6)</p></div><div class="nugget-popup"><p>Town drainage and highway drains were pushed to capacity by intense rainfall and by water flowing in from outside the urban drainage catchment (including agricultural runoff and A30 areas), resulting in flooding of the urban area. High river and tide levels in the River Hayle (around the same time) increased flood risk within the town. (p7)</p></div><div class="nugget-popup"><p>Surface water flooding affected the town: flows down Lower Church Street approached house thresholds; internal flooding of residential and commercial properties occurred on Fore Street and Commercial Road due to bow waves from vehicles; property flooding by surface water run&ndash;off occurred on Strawberry Lane between Burnthouse Lane and High Lanes; a combined sewage overflow was observed on Chapel Lane. [PAG,MUL] (p8)</p></div><div class="nugget-popup"><p>Surface water flooding occurred in parts of Hayle on 19th December 2019. Observations indicate Copperhouse Pool levels were more than 1 metre below ground in the flooded area and therefore were not considered to have contributed to the extent of surface water flooding. (p9)</p></div><div class="nugget-popup"><p>Flooding in Hayle was driven in severity by agricultural runoff (also affected the A30). High tide coincided with extreme rainfall but tidal influence was judged not to be a significant contributor. Flood consequences included flood damage, mud and silt on the construction site at Trevassack, blocked drains, and main floodwaters (carrying sediment) flooding a property uphill of the development and then through the development. [PAG] (p10)</p></div><div class="nugget-popup"><p>On 19th December 2019 floodwaters carrying large amounts of sediment inundated properties and flowed through a development (including flooding a property uphill of a construction site). Mud and silt were deposited on site and drains became blocked in the aftermath; properties in the town sustained flood damage. (p11)</p></div><div class="nugget-popup"><p>Hayle experienced a major flooding incident on 19 December 2019 caused primarily by agricultural runoff from uphill fields combined with extreme rainfall and saturated ground; properties in Hayle were flooded and the town was the principal area affected that day. [PAG] (p12)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>46 properties [PAG] (p5)</p></div><div class="nugget-popup quant"><p>approximately 50 properties [PAG,MUL] (p8)</p></div></div></body></div>`)[0];
