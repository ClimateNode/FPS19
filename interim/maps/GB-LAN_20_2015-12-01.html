                var html_58185cceff7109732616f98ce15245e5 = $(`<div id="html_58185cceff7109732616f98ce15245e5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lancashire</h1><div class="nugget-popup"><p>Extreme storms and rainfall in November&ndash;December 2015 caused flooding throughout December 2015 affecting communities across the county. Approximately 2,500 homes across 229 separate communities were flooded. Floods also damaged private gardens, garages and out&ndash;buildings, business premises, agricultural property and critical public infrastructure including roads, bridges, retaining walls, water treatment plants, power and communications installations, schools, village halls and town halls. (p3)</p></div><div class="nugget-popup"><p>Widespread flooding across the county during December 2015 that required emergency response and recovery actions by Risk Management Authorities. (p7)</p></div><div class="nugget-popup"><p>Experienced widespread and extreme&ndash;magnitude flooding during December 2015 that affected infrastructure, commercial properties and the local economy, with a particular emphasis on internal flooding of residential properties. Investigations were required across many communities to account for flood mechanisms and remedial actions. (p12)</p></div><div class="nugget-popup"><p>Significant and widespread flooding across the county from storm rainfall, affecting infrastructure, commercial properties and the local economy; many residential properties experienced internal flooding; highways and critical infrastructure were reported flooded in places. (p13)</p></div><div class="nugget-popup"><p>Extensive increases in river flows across the county in response to persistent heavy rainfall through November&ndash;December 2015; contributed to flood events investigated in the report and exceptional river flows recorded in the North West. [IMG] (p18)</p></div><div class="nugget-popup"><p>Experienced fluvial (river) flooding with an additional surface water element during the event on 5/6 December 2015; river levels rose following the rainfall peak, reducing the ability of surface&ndash;water systems to discharge and resulting in internal flooding to domestic properties, mainly in the north of the county. [IMG] (p20)</p></div><div class="nugget-popup"><p>Northern Lancashire experienced fluvial (river) flooding with an additional surface&ndash;water element during the December 2015 events. Rivers were at capacity and overtopped, causing out&ndash;of&ndash;bank flow and backup/surcharge of surface drainage systems producing visible surface water on roads, gardens and causing internal flooding to domestic properties. [IMG,PAG] (p21)</p></div><div class="nugget-popup"><p>Rising river levels on 25&ndash;26 December caused river channels and receiving drains to become unable to discharge. Drainage systems surcharged (backed up) against elevated stream and river levels, causing flooding of properties. The majority of affected locations were caused by fluvial flooding or a combination of fluvial and surface water runoff. [IMG] (p23)</p></div><div class="nugget-popup"><p>County&ndash;wide flooding during December 2015: 2,467 homes across 115 towns, villages and the city of Lancaster were flooded (7,500 people directly affected); 229 separate communities identified for further investigation; several major roads were flooded and not passable; bridges were closed due to concerns over structural integrity; roads closed due to collapse of retaining walls, landslips or deteriorated surfaces; disruption to rail services requiring repairs; electricity substations in Lancaster were flooded causing widespread power loss. (p25)</p></div><div class="nugget-popup"><p>During the December 2015 floods parts of Lancashire experienced widespread flooding: 2,467 homes across 115 towns, villages and the city of Lancaster were flooded (about 7,500 people directly affected); 229 communities/sub&ndash;communities were identified for further investigation; several major roads were flooded and impassable; bridges were closed over concerns about structural integrity; roads were also closed due to retaining wall collapse or landslips and required repairs before re&ndash;opening; rail disruption occurred when a landslide on the West Coast Main Line required repairs before services could resume; electricity substations were flooded, leaving 61,000 homes in Lancaster without power. [PAG] (p26)</p></div><div class="nugget-popup"><p>County&ndash;wide flooding during December 2015 that prompted multi&ndash;agency response, investigations (Stage 2) and bids for flood&ndash;reduction funding; led to increased data collection and collaborative risk&ndash;management activity by local RMAs and the LLFA. (p27)</p></div><div class="nugget-popup"><p>Widespread December 2015 flooding affected communities across the county, prompting emergency response, investigations led by the LLFA and other RMAs, and some remedial works. Early investigations were disrupted by additional flooding later in the month; recovery and coordinated programmes of further investigation and mitigation were initiated. [PAG] (p28)</p></div><div class="nugget-popup"><p>Unprecedented December 2015 rainfall exceeded drainage and river capacities so significant volumes of water flowed above ground, damaging property and public assets and limiting travel, public services and business operations for many days. [PAG] (p30)</p></div><div class="nugget-popup"><p>During December 2015 prolonged heavy rainfall and saturated ground caused main rivers to flow out&ndash;of&ndash;bank (notably on 5&ndash;6 December) and surface water drainage systems to surcharge (notably on 25&ndash;26 December). Significant volumes of water flowed above ground, damaging property and public assets, restricting travel and limiting public services and business operations for many days, and causing many households to be displaced while repairs and restoration were carried out. (p31)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 2,500 homes; 229 separate communities (p3)</p></div><div class="nugget-popup quant"><p>Locations with between 51 and 344 properties flooded at the highest&ndash;impact sites (map legend category 51&ndash;344 properties). [IMG] (p23)</p></div><div class="nugget-popup quant"><p>2,467 homes; 115 towns, villages and the city of Lancaster; 7,500 people; 229 separate communities; 61,000 homes (p25)</p></div><div class="nugget-popup quant"><p>2,467 homes; 115 towns, villages and the city of Lancaster; 7,500 people; 229 separate communities and sub&ndash;communities; 61,000 homes without power; 1 landslide on the West Coast Main Line [PAG] (p26)</p></div><div class="nugget-popup quant"><p>229 communities and sub&ndash;communities locations affected [PAG] (p28)</p></div><div class="nugget-popup quant"><p>229 individual locations investigated [PAG] (p30)</p></div></div></body></div>`)[0];
