AG] (p39)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>ponding to a depth of approximately 200mm (p11)</p></div><div class="nugget-popup quant"><p>approximately 200mm [PAG] (p12)</p></div></div></body></div>`)[0];

                var html_8d49d48e292cc0b3e9302453c3f10c24 = $(`<div id="html_8d49d48e292cc0b3e9302453c3f10c24" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Woodford Halse</h1><div class="nugget-popup"><p>Intense rainfall on a saturated catchment caused excess surface water to flow overland along natural contours to low points in the village, resulting in internal flooding of properties. [PAG] (p5)</p></div><div class="nugget-popup"><p>Intense, short&ndash;duration rainfall onto a saturated catchment caused excess surface water to flow overland following natural contours to low points in the village; historic drainage was ineffective, resulting in internal flooding of properties in the village. [PAG] (p6)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties across four separate locations in the village: eight properties flooded internally in one clustered location; at least one property flooded internally at a second location; at least one property flooded internally at a third location; properties at a fourth location are at high risk of regular flooding. (p8)</p></div><div class="nugget-popup"><p>Localised ponding at the road junction of Scrivens Hill and Byfield Road during heavy rainfall deepened until water flowed back into and inundated a residential property. (p13)</p></div><div class="nugget-popup"><p>Residents of Woodford Halse were identified in the report as being at risk during the Flood Incident; guidance and actions for preparing properties and community resilience (e.g. signing up to Flood Warning Direct, property&ndash;level protection, community flood plans, flood wardens) were recommended. (p15)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration rainfall onto a saturated catchment overwhelmed existing drainage systems and watercourses. Silt and debris were observed blocking inlets, preventing satisfactory flows; excessive flows overtopped and backed up drainage, causing water to flow to low points in the village and into other drainage systems unable to cope. (p16)</p></div><div class="nugget-popup"><p>Drainage systems and watercourses were unable to convey excessive flows from higher ground, causing overtopping and water to flow or back up to low points in the village; land drainage overspilled onto the public highway and into private property, creating flood risk to properties. (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>internal flooding of 8 properties in close proximity; internal flooding of at least 2 other properties [PAG] (p5)</p></div><div class="nugget-popup quant"><p>internal flooding of eight properties; internal flooding of at least two other properties [PAG] (p6)</p></div><div class="nugget-popup quant"><p>4 locations; 8 properties flooded internally (p8)</p></div><div class="nugget-popup quant"><p>1 residential property (p13)</p></div></div></body></div>`)[0];
