                var html_2f15224a8d42c961cc22796194022263 = $(`<div id="html_2f15224a8d42c961cc22796194022263" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>The Square, Earls Barton</h1><div class="nugget-popup"><p>Moderate rainfall overwhelmed local drainage so excess surface water flowed over ground and along the public highway and around private property; carriageway, kerbs and footways directed surface water toward vulnerable properties, causing internal flooding of property(ies) in The Square. [PAG] (p6)</p></div><div class="nugget-popup"><p>Moderate rainfall and ineffective drainage caused excess surface water to flow over ground and along the public highway and around private property; local carriageway/kerb/footway levels directed surface water toward vulnerable properties, resulting in internal flooding of one property. [PAG,MUL] (p7)</p></div><div class="nugget-popup"><p>Water crossed the threshold of a building at The Square causing internal flooding of a property; the property has experienced internal flooding on more than one occasion in the last five years. [PAG] (p9)</p></div><div class="nugget-popup"><p>The Square is a focal point for surface water flow and was affected by surface water flooding. Surface water sewers drain to The Square from High Street and West Street; blocked road gullies on approaches were seen during the Flood Incident Investigation. The carriageway is higher than the south footway and some building thresholds, leading to water reaching doorways; frontage channel drains have been installed to try to protect thresholds. [PAG] (p10)</p></div><div class="nugget-popup"><p>On 16/09/15 surface water from High Street and West Way overtopped kerbs at the corner of Station Road and The Square; surface water entered the doorway of a property on The Square and flowed into several rooms, nearly reaching the electrical cupboard. The Square has also experienced external flooding of private property and repeated near&ndash;miss internal flooding requiring temporary barriers. [TAB,PAG] (p11)</p></div><div class="nugget-popup"><p>Surface water built up at the corner of Station Road and The Square, overtopped lowered kerbs and flowed into the doorway of a property at The Square, causing internal flooding that reached close to an electrical cupboard and required cleaning; the business was temporarily affected. (p12)</p></div><div class="nugget-popup"><p>The arrangement of kerbs and levels meant surface water flowing off the carriageway could enter The Square, flow onto the footway and into doorways of properties during the 16th September 2015 event. (p13)</p></div><div class="nugget-popup"><p>The street was flooded with muddy water overtopping the kerbs and flowing across the pavement. Debris (wooden planks, fencing) and a partially submerged construction cone were present; buildings adjacent to the square had sandbags and planks placed at entrances to reduce water ingress. [PAG] (p34)</p></div><div class="nugget-popup"><p>Kerb and footway arrangement at The Square with observed gully blockages and leaf accumulation recorded during the flood investigation, indicating reduced drainage capacity and association with surface water flooding at the Square and its junctions. [IMG,PAG] (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property [PAG] (p6)</p></div><div class="nugget-popup quant"><p>one property [PAG,MUL] (p7)</p></div><div class="nugget-popup quant"><p>one property [PAG] (p9)</p></div><div class="nugget-popup quant"><p>approximately six times every year for the last five years (repeated kerb overtopping/near&ndash;miss at The Square) [TAB,PAG] (p11)</p></div><div class="nugget-popup quant"><p>1 property; 25 mm depth of water (p12)</p></div></div></body></div>`)[0];

                var html_fef234da9ad0c1df294daea901cb6433 = $(`<div id="html_fef234da9ad0c1df294daea901cb6433" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Broad Street, Earls Barton</h1><div class="nugget-popup"><p>Broad Street was identified as a low point receiving surface water flows and is shown on mapping as high risk. Several road gullies on Broad Street were observed blocked with leaves and silt during the Flood Incident Investigation, contributing to surface water ponding on the carriageway and the potential for water to reach lower footways and building thresholds. [PAG] (p10)</p></div><div class="nugget-popup"><p>Surface water flowed east along Broad Street to the low point opposite Churchill Road; water was reported flowing out of road gullies and overtopping kerbs at the low point, flooding the road and footways. (p12)</p></div><div class="nugget-popup"><p>Areas of Broad Street were vulnerable to surface water flowing off the carriageway; during the 16th September 2015 event this water could flow onto the footway and into property doorways, causing flooding impacts. (p13)</p></div><div class="nugget-popup"><p>Water discharged from a kerb offlet gully and spread onto the pavement and road, causing surface water flooding on the south and north sides of Broad Street; pooling and flow across the carriageway and footway with muddy/discoloured runoff indicating drainage overflow and potential contamination and hazards to pedestrians and vehicles. [IMG,PAG] (p38)</p></div><div class="nugget-popup"><p>Footway flooding on the south side of Broad Street (opposite Churchill Road): multiple damp patches and pooling of water, with a visible puddle concentrated around a metal drain cover on the pavement. [IMG,PAG] (p42)</p></div><div class="nugget-popup"><p>Footway flooding occurred on the south side of Broad Street (opposite Churchill Road). Roof drainage discharges onto a gully in the pavement which is blocked, causing water to accumulate on the footway and verge and contributing to flooding of the pedestrian area and adjacent carriageway. [IMG,PAG] (p43)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one visible puddle [IMG,PAG] (p42)</p></div></div></body></div>`)[0];

                var html_b27150b4f45a803df027527e41887734 = $(`<div id="html_b27150b4f45a803df027527e41887734" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Earls Barton</h1><div class="nugget-popup"><p>Named as the subject of a Northamptonshire County Council flood investigation report (The Square, Earls Barton). No specific flood impacts are described in the provided excerpt. (p2)</p></div><div class="nugget-popup"><p>Moderate rainfall and ineffective drainage produced excess surface water that flowed to low points on the public highway and around private properties in Earls Barton (The Square), resulting in internal flooding of at least one property and repeated internal flooding incidents noted. [PAG] (p6)</p></div><div class="nugget-popup"><p>Surface water from moderate rainfall collected and flowed along natural contours to low points on the public highway at The Square, causing internal flooding of at least one property within Earls Barton. [PAG] (p7)</p></div><div class="nugget-popup"><p>The village contained the flood incident at The Square where internal flooding of one property occurred. [PAG] (p9)</p></div><div class="nugget-popup"><p>The town centre experienced surface water flooding during the investigated event. Blocked road gullies were observed during the Flood Incident Investigation which contributed to poor highway drainage. Runoff from private car parks and hardstandings on West Street and High Street flowed onto the public highway, increasing surface water conveyance into the centre. (p10)</p></div><div class="nugget-popup"><p>Moderate rainfall on 16th September 2015 produced surface water that could not be collected or conveyed by drainage. Surface water flowed from higher ground (private property and highway) following natural contours into low points of the village, causing flooding of low&ndash;lying areas and temporary impacts to properties and businesses. Highway drainage systems and public sewers were vulnerable to blockage and exceedance during the event. [PAG] (p13)</p></div><div class="nugget-popup"><p>Settlement experienced flooding and was the subject of a Section 19 flood investigation by NCC following the event on 16th September 2015. (p16)</p></div><div class="nugget-popup"><p>The town experienced surface water flooding on 16th September 2015: highway drainage and runoff led to overtopping of kerbs and flow towards private properties, prompting reporting of incidents, community response planning and recommended drainage/asset improvements. (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property [PAG] (p6)</p></div><div class="nugget-popup quant"><p>one property [PAG] (p7)</p></div><div class="nugget-popup quant"><p>one property [PAG] (p9)</p></div></div></body></div>`)[0];
