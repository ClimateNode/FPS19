                var html_df076e088bee820dd00c748d10fcfe92 = $(`<div id="html_df076e088bee820dd00c748d10fcfe92" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Barnes Green</h1><div class="nugget-popup"><p>Anecdotal evidence indicates Barnes Green flooded during the 12th July 2021 event due to tide&ndash;locking of the River Thames, with the green acting as floodplain and flooding as intended. (p44)</p></div><div class="nugget-popup"><p>A large number of locations at Barnes Green were affected by flooding during the event; the council noted many affected locations had not submitted reports and encouraged use of the flood reporting tool. (p48)</p></div></div></body></div>`)[0];

                var html_af25dc7d34085d09cb87d69416978aef = $(`<div id="html_af25dc7d34085d09cb87d69416978aef" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Borough of Richmond Upon Thames</h1><div class="nugget-popup"><p>Heavy rainfall on 12 July 2021 triggered multiple flood incidents across the borough: ten reports of flooding at eight different locations, including six reports of internal flooding (at Chestnut Road, Eleanor Grove, Lower Mortlake Road, The Quadrant and two at Halcyon Close). Surface water runoff and surcharge of the TWUL sewer network were identified as the most frequent sources, with topographical low points exacerbating impacts. [PAG] (p3)</p></div><div class="nugget-popup"><p>The borough experienced flooding in July 2021 that led to borough&ndash;wide actions (internal flood group, LFRMS and SWMP updates) and a programme of gully monitoring; measures were taken in response to historical/known surface water flooding issues. [PAG] (p4)</p></div><div class="nugget-popup"><p>Multiple localities within Richmond were affected by surface water/highway flooding and sewer&ndash;related flooding during the main rainfall event; Richmond is advised to encourage reporting and investigate affected locations to work with TWUL on reducing recurrence. [PAG] (p5)</p></div><div class="nugget-popup"><p>The borough experienced flooding during the 12 July rainfall event. The report lists multiple flooded locations within the borough (sections under 'FLOODED LOCATIONS'): Chestnut Road, Eleanor Grove, Halcyon Close, Lower Mortlake Road and The Quadrant. The investigation addresses surface water, sewer and groundwater flood risks and local fluvial (river) interactions for those locations. [PAG] (p7)</p></div><div class="nugget-popup"><p>Significant rainfall on 12th July 2021 led to multiple flooding incidents across the borough, including internal flooding where water crossed building thresholds and external/highways flooding affecting public roads and locations. [PAG] (p10)</p></div><div class="nugget-popup"><p>Intense rainfall on 12 July 2021 caused flooding across the borough. The RMAs received eight initial reports of flooding from within the borough; a social media search returned two additional reports, one of which met Richmond's Section 19 criteria and was investigated. The event prompted a borough&ndash;level investigation and compilation of recommendations on flood risk mitigation. [TAB,PAG] (p11)</p></div><div class="nugget-popup"><p>As the Lead Local Flood Authority and a Category One Responder, the council led emergency planning, response and recovery activity for the July 2021 summer storm event affecting the borough and coordinated multi&ndash;agency liaison under the Multi&ndash;Agency Flood Plan. [PAG] (p13)</p></div><div class="nugget-popup"><p>Widespread surface&ndash;water (flash) flooding across the borough: ten reported flood incidents including internal and external/highway flooding; the London Fire Brigade received multiple calls and attended addresses to assist with flooding. [PAG] (p16)</p></div><div class="nugget-popup"><p>The borough experienced widespread surface water 'flash' flooding on 12 July 2021, generating ten flood reports across the borough including internal and external/highway impacts at multiple locations. [PAG,IMG] (p17)</p></div><div class="nugget-popup"><p>Internal flooding reported by a resident; drains were reported to back up quickly during heavy rain and the resident implied previous occasions of flooding. [IMG,PAG] (p18)</p></div><div class="nugget-popup"><p>The intense rainfall on 12th July 2021 caused widespread flooding in the Richmond area as part of a larger event affecting large parts of London. [PAG] (p19)</p></div><div class="nugget-popup"><p>Intense rainfall on 12 July 2021 led to surface water overwhelming the local drainage. At Chestnut Road this produced a single report of internal flooding; drains were reported to back up quickly and overland flow from Staines Road down Chestnut Road likely contributed. [PAG,IMG] (p20)</p></div><div class="nugget-popup"><p>Within the Richmond area, there were local flooding impacts reported on 12th July 2021, including a single report of internal flooding at Eleanor Grove (garden flooding and below&ndash;street&ndash;level kitchen flooding where water entered through drains and shower drain), and external/highway flooding reports such as at Chestnut Road where drains backed up and surface ponding occurred. [PAG] (p23)</p></div><div class="nugget-popup"><p>The local authority area received flood reports during the 12 July 2021 event, including an internal flooding report at Eleanor Grove and reports of sewer/surface&ndash;water related flooding at Chestnut Road and anecdotal reports at Rosslyn Avenue. [PAG] (p24)</p></div><div class="nugget-popup"><p>Widespread surface&ndash;water / urban flooding occurred across Richmond during the 12 July 2021 rainfall event; different parts of the town experienced varying intensities (e.g. Barnes and Hampton had the highest return periods, central Richmond was less intense). [PAG,IMG] (p28)</p></div><div class="nugget-popup"><p>The London Borough experienced widespread flooding on 12 July 2021 and compiled the Section 19 investigation. Reported impacts within the borough include internal flooding at a property on Eleanor Grove (below&ndash;street&ndash;level kitchen flooded to ~30 mm), and the Halcyon Close event where 14 properties were impacted with two properties flooded internally and surface water depths reported to about 100 mm. The borough also received reports from Chestnut Road consistent with sewer surcharge/backing&ndash;up of drains. [IMG] (p30)</p></div><div class="nugget-popup"><p>Parts of Richmond experienced surface&ndash;water flooding during the 12th July 2021 rainfall event; the report notes variation across the town (central Richmond generally experienced lower return periods compared to areas such as Barnes and Hampton). [PAG,IMG] (p33)</p></div><div class="nugget-popup"><p>The 12th July 2021 rainfall caused widespread surface water and sewer&ndash;related flooding across parts of Richmond. Reported impacts include internal flooding of properties, street ponding and overwhelmed private/drainage assets (examples: Halcyon Close, Eleanor Grove, Lower Mortlake Road, Chestnut Road). [PAG,IMG] (p35)</p></div><div class="nugget-popup"><p>The borough experienced widespread surface water/urban flooding during the 12th July 2021 rainfall event. Return periods varied across the borough (e.g., Barnes and Hampton recorded &gt;1 in 100 year return periods while central Richmond was generally lower). Multiple streets within the borough reported flooding (examples include Lower Mortlake Road, Eleanor Grove, Halcyon Close, Chestnut Road). [PAG,IMG] (p38)</p></div><div class="nugget-popup"><p>A single property between The Quadrant and Quadrant Road flooded on 12 July 2021. Resident&ndash;reported flood depths were approximately 8 inches (~200 mm) entering the rear from Quadrant Road, spreading to about 5 inches (~130 mm) through the front and into the basement. The incident is consistent with local surface water and/or sewer surcharge mechanisms. [PAG,IMG] (p40)</p></div><div class="nugget-popup"><p>Flooding was reported in The Quadrant area of Richmond (a flooded property and a flood report location on Quadrant Road). The area is mapped as high risk of surface water flooding and as having high susceptibility to groundwater emergence, indicating both surface water and groundwater were relevant flood mechanisms affecting the town area. [IMG] (p41)</p></div><div class="nugget-popup"><p>The borough experienced external/highways flooding associated with the intense rainfall on 12th July 2021, generating multiple resident reports across the borough that triggered LLFA and Highways follow&ndash;up and gully inspection/cleansing activity. [IMG,TAB,PAG] (p44)</p></div><div class="nugget-popup"><p>The borough experienced surface water flooding from the intense rainfall; post&ndash;event actions included gully inspections/cleansing, implementation of gully sensors across known problem areas, and establishment/updating of internal flood arrangements and plans (internal flood group, updated LFRMS and SWMP) in response to the incident. (p45)</p></div><div class="nugget-popup"><p>Following extreme rainfall on 12th July 2021 the borough received ten reports of flooding (six internal property floodings and four external/highway floodings). Five locations met the Section 19 investigation criteria and were investigated: Chestnut Road, Eleanor Grove, Halcyon Close, Lower Mortlake Road and The Quadrant. External/highway reports were recorded (outlined in section 4.6) but were not investigated to the same level of detail as the internal flooded locations. [PAG] (p46)</p></div><div class="nugget-popup"><p>Richmond experienced widespread surface water flooding and sewer surcharge during the 12th July 2021 event; topographical low points exacerbated impacts and triggered Section 19 investigations at five locations within the area. [PAG] (p47)</p></div><div class="nugget-popup"><p>Areas within Richmond experienced surface water inundation and sewer surcharge on 12 July 2021, prompting local authority involvement in gully, highway and drainage investigations following the flooding. [PAG] (p48)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>10 reports of flooding at 8 different locations; 6 internal flooding reports across 5 locations [PAG] (p3)</p></div><div class="nugget-popup quant"><p>six reports of internal flooding; four reports of external / highways flooding; eight different locations [PAG] (p10)</p></div><div class="nugget-popup quant"><p>eight initial reports of flooding; two social media reports; one report met Section 19 criteria [TAB,PAG] (p11)</p></div><div class="nugget-popup quant"><p>ten flooding reports; six reported incidents of internal flooding across five locations; four reported incidents of external/highway flooding across three locations; 36 calls to the LFB from properties within Richmond; LFB attended ten addresses in SW13 (Barnes). [PAG] (p16)</p></div><div class="nugget-popup quant"><p>10 flooding reports; 6 internal incidents; 4 external/highway incidents; 5 locations with internal flooding; 3 locations with external/highway flooding [PAG,IMG] (p17)</p></div><div class="nugget-popup quant"><p>1 report of internal flooding [IMG,PAG] (p18)</p></div><div class="nugget-popup quant"><p>1 internal flooding report [PAG,IMG] (p20)</p></div><div class="nugget-popup quant"><p>1 internal flooding report; 1 property with 30mm deep internal flooding to a below&ndash;street&ndash;level kitchen [PAG] (p23)</p></div><div class="nugget-popup quant"><p>1 internal flooding report [PAG] (p24)</p></div><div class="nugget-popup quant"><p>14 properties; 2 properties internally flooded; 1 internal flooding report at Eleanor Grove; ~30 mm depth (Eleanor Grove kitchen); ~100 mm depth (Halcyon Close) [IMG] (p30)</p></div><div class="nugget-popup quant"><p>14 properties affected at Halcyon Close; 2 internal floods at Halcyon Close; 1 internal property at Lower Mortlake Road; 1 internal property at Eleanor Grove; 100mm deep flooding at Halcyon Close; 30mm deep flooding to a below&ndash;street&ndash;level kitchen at Eleanor Grove. [PAG,IMG] (p35)</p></div><div class="nugget-popup quant"><p>1 property; 8 inches (~200 mm); 5 inches (~130 mm) [PAG,IMG] (p40)</p></div><div class="nugget-popup quant"><p>four external/highways flood reports [IMG,TAB,PAG] (p44)</p></div><div class="nugget-popup quant"><p>Approximately 12 gully sensors implemented across Richmond (p45)</p></div><div class="nugget-popup quant"><p>10 reports of flooding; 6 internal; 4 external/highway; 5 locations investigated [PAG] (p46)</p></div><div class="nugget-popup quant"><p>ten reports of flooding; six internal flooding; four external/highway flooding [PAG] (p47)</p></div></div></body></div>`)[0];
                popup_07c87bade6af2f4ab2513d16d6f8cb22.setContent(html_af25dc7d34085d09cb87d69416978aef);

                var html_4dacd747a857747c723c0f2a6af0d17d = $(`<div id="html_4dacd747a857747c723c0f2a6af0d17d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Region</h1><div class="nugget-popup"><p>Heavy rainfall on 12 July 2021 triggered significant flooding across London, of magnitude between approximately a 1 in 10 year and greater than a 1 in 100 year event in parts of Richmond. [PAG] (p3)</p></div><div class="nugget-popup"><p>Large parts of London experienced intense rainfall and widespread surface water flooding on 12 July 2021; Richmond was included among affected areas. [IMG,PAG] (p18)</p></div><div class="nugget-popup"><p>Large parts of London experienced intense rainfall on 12th July 2021 that resulted in widespread surface water flooding, including impacts within Richmond. (p19)</p></div><div class="nugget-popup"><p>Widespread surface&ndash;water/urban flooding occurred across parts of London during the 12th July 2021 rainfall event, with elevated return periods in some areas (event affected Richmond areas included in this report). [PAG,IMG] (p33)</p></div><div class="nugget-popup"><p>Widespread intense rainfall on 12th July 2021 caused surface&ndash;water/urban flooding across London, prompting major&ndash;incident coordination and heavy demand on utilities' customer services. [IMG,TAB] (p44)</p></div><div class="nugget-popup"><p>Widespread flooding in London due to the intense rainfall led to operational impacts: the water company (TWUL) received well over its normal daily contacts, the Customer Contact Centre became overwhelmed and updated telephone messages, and the London Resilience Group convened a major incident call; additional TWUL teams (98&ndash;106 teams) were mobilised across London to support customers. [PAG] (p45)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>98&ndash;106 teams supporting customers across London [PAG] (p45)</p></div></div></body></div>`)[0];
                popup_3719cf69d3c1a09374f743c03a826930.setContent(html_4dacd747a857747c723c0f2a6af0d17d);

                var html_8e692f7684b014f4aeb3ba56b9d80b82 = $(`<div id="html_8e692f7684b014f4aeb3ba56b9d80b82" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Thames</h1><div class="nugget-popup"><p>High water levels on the Thames led to tide flaps being shut, which was reported as a possible factor that prevented surface water discharging to the river and thereby exacerbated local surface water flooding (notably at Halcyon Close). [PAG,IMG] (p30)</p></div><div class="nugget-popup"><p>High water levels on the River Thames during the event caused tide flaps to remain shut, preventing discharge from surface water sewers and likely contributing to sewer backup/surface&ndash;water flooding (exacerbating flooding at Halcyon Close and nearby highway areas). [PAG,IMG] (p33)</p></div><div class="nugget-popup"><p>High water levels in the River Thames led to tide flaps being shut during the event, preventing surface water sewers from discharging to the river; this likely caused sewer backup and contributed to flooding onto the highway and adjacent properties. (p34)</p></div><div class="nugget-popup"><p>High Thames water/tidal levels on 12th July 2021 likely prevented surface water discharge at tide flaps, which was reported as a potential exacerbating factor for flooding at Halcyon Close (preventing surface water leaving the local drainage system). (p35)</p></div><div class="nugget-popup"><p>High water/tidal levels in the River Thames are described as having caused tide flaps to remain shut, preventing surface water discharge and likely exacerbating surface water flooding at Halcyon Close during the 12th July 2021 event. [PAG,IMG] (p38)</p></div><div class="nugget-popup"><p>Tide&ndash;locking of the River Thames is believed to have caused inundation of Barnes Green (the green acted as floodplain and flooded), with anecdotal reports of flooding to properties along the river. [IMG] (p44)</p></div></div></body></div>`)[0];
                popup_ea1247285b24f9369162e32b6f50c0bc.setContent(html_8e692f7684b014f4aeb3ba56b9d80b82);

                var html_caf51f6d42f86a81a078e97a45edbb70 = $(`<div id="html_caf51f6d42f86a81a078e97a45edbb70" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Chestnut Road, London Borough of Richmond Upon Thames</h1><div class="nugget-popup"><p>Reported internal flooding as one of the six internal flooding reports from the 12 July 2021 event. (p3)</p></div><div class="nugget-popup"><p>Reported issues indicating a potential blockage or capacity problem in the surface water sewer; recommendation to check gullies and review gully maintenance to address surface water flooding risk. (p4)</p></div><div class="nugget-popup"><p>Internal flooding reported inside a property on Chestnut Road (flooding inside the building). [PAG] (p16)</p></div><div class="nugget-popup"><p>Internal flooding reported inside a building during the 12 July 2021 event. [PAG,IMG,TAB] (p17)</p></div><div class="nugget-popup"><p>Resident report of internal flooding during the intense rainfall on 12 July 2021; resident also reported drains backing up quickly during heavy rain and that the location has flooded on other occasions. [IMG,PAG] (p18)</p></div><div class="nugget-popup"><p>Intense rainfall on 12th July 2021 led to surface water entering buildings on Chestnut Road, producing a single report of internal (property) flooding. Surface water on Chestnut Road drains to the local TWUL surface water network via a 225mm pipe that joins a larger 375mm pipe on Staines Road; runoff from Staines Road would have flowed down Chestnut Road and contributed to the flooding. A resident reported drains backing up quickly during heavy rain and noted previous flooding occurrences. [PAG] (p19)</p></div><div class="nugget-popup"><p>Internal (property) flooding reported on Chestnut Road during the intense rainfall event; surface water is described as ponding/overwhelming local drainage and likely flowing from Staines Road down Chestnut Road toward the local sewer connection. [PAG,IMG] (p20)</p></div><div class="nugget-popup"><p>A flood report is located on Chestnut Road (yellow dot on the EA RoFSW map). The report location lies within a high surface&ndash;water&ndash;risk zone (1 in 30 year) adjacent to Chestnut Road; Chestnut Road is also mapped as being within an area of medium&ndash;high groundwater emergence susceptibility which may have exacerbated surface flooding. The report location is near the intersection with Staines Road. [IMG,PAG] (p21)</p></div><div class="nugget-popup"><p>A flood report location is shown on Chestnut Road. The road lies within an EA&ndash;mapped area with medium&ndash;high (50&ndash;75%) susceptibility to groundwater emergence, indicating groundwater emergence flooding occurred or was reported at this location. A resident report described sewage backing up onto the surface (overland flow), consistent with sewer surcharge/backup affecting the road. [IMG] (p22)</p></div><div class="nugget-popup"><p>Surface water sewers/gullies on Chestnut Road reportedly backed up during heavy rain, causing overland ponding on the roadway. Ponding was exacerbated by local topography which slopes away from Staines Road, causing water to remain on the road surface until the sewer system could accept it. The resident report described drains backing up quickly, suggesting surcharging of the surface water sewer or blocked gullies. [PAG] (p23)</p></div><div class="nugget-popup"><p>Resident reports received for the 12 July 2021 rainfall event related to Chestnut Road included mentions of highway flooding, indicating Chestnut Road was affected by external/highway flooding during the event. (p44)</p></div><div class="nugget-popup"><p>Chestnut Road was one of the five locations investigated after flooding on 12th July 2021. The investigation and recommendations indicate surface water flooding occurred and that there may be a blockage or capacity issue in the surface water sewer; Richmond recommended gully checks and liaison with TWUL. (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 internal flooding report (p3)</p></div><div class="nugget-popup quant"><p>one incident of internal flooding at Chestnut Road. [PAG] (p16)</p></div><div class="nugget-popup quant"><p>1 internal incident [PAG,IMG,TAB] (p17)</p></div><div class="nugget-popup quant"><p>1 report of internal flooding [IMG,PAG] (p18)</p></div><div class="nugget-popup quant"><p>one internal flooding report [PAG] (p19)</p></div><div class="nugget-popup quant"><p>one internal flooding report [PAG,IMG] (p20)</p></div></div></body></div>`)[0];

                var html_b996b902fc3a7dbed96b96cd8681babc = $(`<div id="html_b996b902fc3a7dbed96b96cd8681babc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Eleanor Grove, London Borough of Richmond Upon Thames</h1><div class="nugget-popup"><p>Reported internal flooding as one of the six internal flooding reports from the 12 July 2021 event. (p3)</p></div><div class="nugget-popup"><p>Eleanor Grove is listed in the report's 'Flooded Locations' (section 4.2), indicating it was affected by flooding during the reported event; the report includes local drainage, flood mechanism and flood risk subsections for Eleanor Grove. (p6)</p></div><div class="nugget-popup"><p>Listed under 'Flooded Locations' &mdash; reported flooded as part of the 12th of July rainfall event. [PAG] (p7)</p></div><div class="nugget-popup"><p>Internal flooding recorded inside a building at this location as a result of the intense surface&ndash;water flash rainfall on 12 July 2021. [PAG] (p16)</p></div><div class="nugget-popup"><p>Internal flooding reported inside a building during the 12 July 2021 event. [PAG,IMG,TAB] (p17)</p></div><div class="nugget-popup"><p>Recorded as a flood location during the intense rainfall event on 12 July 2021; included in Figure 3&ndash;4 as a site affected by the storm. [IMG] (p18)</p></div><div class="nugget-popup"><p>One resident reported internal flooding: garden flooded and below&ndash;street&ndash;level kitchen flooded to a depth of around 30mm. Water also came up through the shower drain and was described as contaminated. [PAG] (p24)</p></div><div class="nugget-popup"><p>Internal flooding reported to a residential property: garden flooded; below&ndash;street&ndash;level kitchen flooded with water entering via shower drain. Water reported as contaminated (source of contamination not explicitly determined). Local drains were reported as not coping with the rainfall. [PAG,IMG] (p25)</p></div><div class="nugget-popup"><p>A specific flood report location on Eleanor Grove (marked by a yellow dot on the map) experienced surface water flooding. The report location lies within a high&ndash;risk (1&ndash;in&ndash;30&ndash;year) RoFSW zone and the map shows surface water flood risk concentrated along Eleanor Grove and adjacent streets. [IMG,PAG] (p26)</p></div><div class="nugget-popup"><p>A flood report is located at the intersection of Eleanor Grove and White Hart Lane. The site is predicted to be at very low fluvial (river) flood risk (Flood Zone 1) but is mapped as highly susceptible to groundwater emergence, indicating flooding from groundwater emergence affected or was reported at this location. [IMG,PAG] (p27)</p></div><div class="nugget-popup"><p>Surcharging of the surface water and combined sewer network during the 12 July 2021 rainfall led to internal flooding of a property: garden flooding and contaminated water entering a below&ndash;street&ndash;level kitchen (water reported coming up through a shower drain). [PAG,IMG] (p28)</p></div><div class="nugget-popup"><p>During the 12th July 2021 intense rainfall (estimated ~1 in 100 year at this location) the local combined and surface water sewers are described as having surcharged, producing significant ponding on Eleanor Road that flowed down towards Eleanor Grove. Highway drains were reported as unable to cope and the water was described as contaminated. Foul sewage is reported or inferred to have backed up (reports of water coming up through a shower drain) and flooded a below&ndash;ground kitchen. A private or internal blockage or leakage is also noted as a possible contributory cause. [PAG] (p29)</p></div><div class="nugget-popup"><p>Resident reports for the 12 July 2021 event for Eleanor Grove included mentions of highway flooding (including reference to Rosslyn Avenue), indicating external/highway flooding impacts during the event. (p44)</p></div><div class="nugget-popup"><p>Eleanor Grove was investigated after flooding on 12th July 2021 and identified as having a high risk of foul/combined sewer surcharge. Richmond recommended TWUL investigate the combined and foul sewers for blockages and carry out detailed modelling and monitoring to understand risks. (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 internal flooding report (p3)</p></div><div class="nugget-popup quant"><p>one internal flooding incident [PAG] (p16)</p></div><div class="nugget-popup quant"><p>1 internal incident [PAG,IMG,TAB] (p17)</p></div><div class="nugget-popup quant"><p>1 report; 30mm deep flooding [PAG] (p24)</p></div><div class="nugget-popup quant"><p>1 internal flooding report; 30mm deep flooding in below&ndash;street&ndash;level kitchen [PAG,IMG] (p25)</p></div><div class="nugget-popup quant"><p>>=75% predicted groundwater susceptibility [IMG,PAG] (p27)</p></div><div class="nugget-popup quant"><p>single report of internal flooding; 30mm deep flooding to a below&ndash;street&ndash;level kitchen [PAG,IMG] (p28)</p></div><div class="nugget-popup quant"><p>30mm deep flooding to the below ground kitchen [PAG] (p29)</p></div></div></body></div>`)[0];

                var html_685611cf2841453ec05dd9405217796e = $(`<div id="html_685611cf2841453ec05dd9405217796e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lower Mortlake Road, North Sheen</h1><div class="nugget-popup"><p>Internal property flooding at this location caused by sewer surcharge and surface water runoff concentrating at a topographical low point. (p3)</p></div><div class="nugget-popup"><p>Internal flooding recorded inside a building at this location caused by the surface&ndash;water flash flooding on 12 July 2021. [PAG] (p16)</p></div><div class="nugget-popup"><p>Internal flooding reported inside a building during the 12 July 2021 event. [PAG,IMG,TAB] (p17)</p></div><div class="nugget-popup"><p>A flood report is associated with Lower Mortlake Road during the 12 July 2021 event (listed as a flood location in the figure; details of impacts not provided). [IMG] (p18)</p></div><div class="nugget-popup"><p>Blocked gullies on the main road caused water to back up over the pavement and enter a property, resulting in internal flooding. [PAG,IMG] (p35)</p></div><div class="nugget-popup"><p>A flood report was recorded at Lower Mortlake Road on 12 July 2021. The street sits at a local low point (LiDAR shows ~0.5 m fall towards the lowest point outside the Premier Inn) and was the location of reported inundation. EA RoFSW mapping shows portions of the road and adjacent area in 1 in 30 to 1 in 1000 year surface&ndash;water risk zones. EA groundwater mapping indicates high susceptibility to groundwater emergence (≥75%) in the area, and the local TWUL sewer network is complex and identified as at risk of surcharging (noted as capable of causing sewer flooding), so surface water, groundwater emergence and sewer surcharge are all implicated in the observed flooding. [PAG,IMG] (p37)</p></div><div class="nugget-popup"><p>Blocked gullies on the main road caused water to back up over the pavement and enter a property, resulting in internal flooding. The event is attributed to sewers and surface water being overwhelmed by the 12th July 2021 rainfall, with ponding at low points of the highway due to the road gradient. [PAG,IMG] (p38)</p></div><div class="nugget-popup"><p>Gullies on Lower Mortlake Road were visited and cleared by the Highways contractor as part of the post&ndash;event response to the intense rainfall and surface water flooding. (p45)</p></div><div class="nugget-popup"><p>Experience of external/highway flooding during the 12th July 2021 extreme rainfall event caused by high volumes of surface water runoff with contribution from overwhelmed sewer network and topographical low&ndash;point; report recommends gully checks and maintenance. [PAG] (p47)</p></div><div class="nugget-popup"><p>Surface water / highway flooding occurred on Lower Mortlake Road linked to blocked or poorly maintained gullies; council recommended checking gullies and reviewing gully maintenance to reduce recurrence. (p48)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 internal flooding report (p3)</p></div><div class="nugget-popup quant"><p>one internal flooding incident [PAG] (p16)</p></div><div class="nugget-popup quant"><p>1 internal incident [PAG,IMG,TAB] (p17)</p></div><div class="nugget-popup quant"><p>1 property [PAG,IMG] (p35)</p></div><div class="nugget-popup quant"><p>1 property [PAG,IMG] (p38)</p></div><div class="nugget-popup quant"><p>1 visit (30th July 2021) (p45)</p></div></div></body></div>`)[0];

                var html_98eb0bb9b243ac459e81d5d36f2e34de = $(`<div id="html_98eb0bb9b243ac459e81d5d36f2e34de" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>The Quadrant, London Borough of Richmond Upon Thames</h1><div class="nugget-popup"><p>Internal property flooding likely caused by sewer surcharge and surface water runoff; TWUL drainage asset data inconsistencies were noted at this location. (p3)</p></div><div class="nugget-popup"><p>Internal flooding recorded inside a building at this location associated with the 12 July 2021 surface&ndash;water flash flood. [PAG] (p16)</p></div><div class="nugget-popup"><p>One internal flooding incident reported at The Quadrant on 12 July 2021 (flooding inside a building). [IMG,TAB,PAG] (p17)</p></div><div class="nugget-popup"><p>A flood report is associated with The Quadrant during the 12 July 2021 event (the report lists The Quadrant as a flood location; no further specifics provided). [IMG] (p18)</p></div><div class="nugget-popup"><p>Flooding of a single residential property located between The Quadrant and Quadrant Road. Floodwater entered the property from Quadrant Road, entering ~200mm (8 inches) at the rear and spreading to ~130mm (5 inches) at the front and into the basement. [PAG,MUL] (p39)</p></div><div class="nugget-popup"><p>A single property located between The Quadrant and Quadrant Road was flooded. Resident reported ~200mm (8 inches) of water entering the rear of the property from Quadrant Road, spreading to ~130mm (5 inches) at the front and into the basement. A previous event on 12th August 2020 included water rising through a manhole and entering at basement wall edges. [IMG,PAG,MUL] (p40)</p></div><div class="nugget-popup"><p>A property on The Quadrant was flooded; the section outside the flooded property is identified as being at high risk of surface&ndash;water flooding and the area also has high susceptibility to groundwater emergence, indicating both surface water and groundwater likely contributed to the property flooding. [IMG,PAG] (p41)</p></div><div class="nugget-popup"><p>Flooding affected a property on The Quadrant: water accumulated in a low point outside the parade of shops causing the property to flood with reports of water coming &#8220;through the back&#8221;; basement walls had previously shown groundwater ingress (reported 12 Aug 2020). A surcharging surface water manhole / sewer backup is also reported as a possible contributor. [PAG,MUL] (p43)</p></div><div class="nugget-popup"><p>Flooding at The Quadrant was linked to risk of sewer surcharge and inadequate surface water drainage; recommendations include investigating highways SuDS opportunities and TWUL updating surface water drainage network information to identify solutions. (p48)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 internal flooding report (p3)</p></div><div class="nugget-popup quant"><p>one internal flooding incident [PAG] (p16)</p></div><div class="nugget-popup quant"><p>1 internal flooding incident [IMG,TAB,PAG] (p17)</p></div><div class="nugget-popup quant"><p>1 property; 8 inches (~200mm) at rear; 5 inches (~130mm) at front and basement [PAG,MUL] (p39)</p></div><div class="nugget-popup quant"><p>1 property [IMG,PAG,MUL] (p40)</p></div><div class="nugget-popup quant"><p>1 property [PAG,MUL] (p43)</p></div></div></body></div>`)[0];

                var html_6ffaee5b1de4b0772a5054277ac23bb7 = $(`<div id="html_6ffaee5b1de4b0772a5054277ac23bb7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Halcyon Close, London Borough of Richmond Upon Thames</h1><div class="nugget-popup"><p>Internal flooding at properties due to sewer surcharge and surface water accumulation at a topographical low point. (p3)</p></div><div class="nugget-popup"><p>Internal flooding recorded inside buildings at this location resulting from the surface&ndash;water flash flooding on 12 July 2021. [PAG] (p16)</p></div><div class="nugget-popup"><p>Internal flooding reported (inside buildings) from two separate incidents during the 12 July 2021 event. [PAG,IMG,TAB] (p17)</p></div><div class="nugget-popup"><p>Listed as a flood location associated with the intense rainfall on 12 July 2021 and identified as being within the Putney catchment in Figure 3&ndash;4. [IMG] (p18)</p></div><div class="nugget-popup"><p>Surface water flooding reached approximately 100mm depth across the close, overwhelming a privately owned soakaway and impacting residential properties; flooding affected 14 properties in the area and resulted in 2 properties flooding internally. High water levels in the Thames (tide flaps shut) were reported as a possible exacerbating factor that prevented surface water discharge. [PAG,IMG] (p30)</p></div><div class="nugget-popup"><p>Surface water runoff flowed into Halcyon Close from higher ground (Queen's Ride) due to a c.0.5 m lower elevation at Halcyon Close, causing surface water flooding reported on 12th July 2021. [PAG] (p31)</p></div><div class="nugget-popup"><p>Surface water runoff from Queen's Ride conveyed towards Halcyon Close and resulted in surface water flooding reported on 12th July 2021. The north&ndash;west corner of Halcyon Close was shown as high risk on RoFSW mapping and the site is also mapped as highly susceptible to groundwater emergence (>=75%), indicating groundwater emergence may have contributed. [PAG,IMG] (p32)</p></div><div class="nugget-popup"><p>Surface water and surcharging of the local sewer network inundated Halcyon Close; a privately owned soakaway serving the carpark and roofs became overwhelmed. Closed tide flaps (due to high Thames levels) likely prevented discharge and exacerbated flooding. [PAG,IMG] (p33)</p></div><div class="nugget-popup"><p>Surface water conveyed from Queen's Ride collected at the low point of the road and entered Halcyon Close; surcharge and likely overwhelm of the surface water sewer (TWUL) on Queen's Ride amplified flows into the road. A privately owned soakaway in Halcyon Close was reported to have been overwhelmed, reducing infiltration. Tide flaps on the outfall were shut due to high Thames levels, preventing discharge and likely causing sewer backup and flooding onto the highway. [PAG] (p34)</p></div><div class="nugget-popup"><p>Halcyon Close was one of the five investigated locations for flooding on 12th July 2021. Surface water was reported to enter via a dropped&ndash;kerb access; recommendations include investigating surface water sewer capacity on Queen's Ride, redirecting runoff away from the access, and assessing SuDS opportunities. [PAG] (p47)</p></div><div class="nugget-popup"><p>Surface water entered Halcyon Close via the dropped&ndash;kerb access (drainage/runoff from Queen's Ride), causing localised inundation of the access/road and affecting the close during the 12 July 2021 event. [PAG] (p48)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 internal flooding reports (p3)</p></div><div class="nugget-popup quant"><p>two internal flooding incidents [PAG] (p16)</p></div><div class="nugget-popup quant"><p>2 internal incidents [PAG,IMG,TAB] (p17)</p></div><div class="nugget-popup quant"><p>100mm deep flooding; 14 properties; 2 properties flooded internally [PAG,IMG] (p30)</p></div><div class="nugget-popup quant"><p>100mm deep flooding;14 properties affected;2 properties flooded internally [PAG,IMG] (p33)</p></div></div></body></div>`)[0];

                var html_dc44cb9bcce332f7e66c3bc416e93f8e = $(`<div id="html_dc44cb9bcce332f7e66c3bc416e93f8e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Queen's Ride, London Borough of Richmond Upon Thames</h1><div class="nugget-popup"><p>Surface water runoff and reported flood locations on Queen's Ride conveyed flow towards the entrance to Halcyon Close; low elevations at the entrance contributed to surface water flowing into Halcyon Close during the event. [IMG,PAG] (p30)</p></div><div class="nugget-popup"><p>Surface water runoff on Queen's Ride (notably at the low point at the entrance to Halcyon Close and Queen's Court, and across a steep gradient rising to the railway) conveyed water towards Halcyon Close and contributed to the surface water flooding reported on 12th July 2021. [PAG] (p31)</p></div><div class="nugget-popup"><p>Surface water runoff on the steep gradient of Queen's Ride was conveyed downslope toward Halcyon Close, and Queen's Ride is shown/predicted to be at high risk of surface water flooding at the entrance and to the west of Halcyon Close; this is reflective of the flooding reported on 12th July 2021. [IMG,PAG] (p32)</p></div><div class="nugget-popup"><p>Surface water conveyance from Queen's Ride flowed into the lower&ndash;lying Halcyon Close. The TWUL surface water sewer on Queen's Ride is likely to have been overwhelmed and to have surcharged, increasing volumes of surface water conveyed into Halcyon Close; closed tide flaps likely prevented discharge to the Thames and amplified backup. [IMG] (p33)</p></div><div class="nugget-popup"><p>Surface water overflows from Queen's Ride conveyed substantial volumes of runoff into Halcyon Close. The TWUL surface water sewer on Queen's Ride is likely to have been overwhelmed and surcharged during the event, amplifying surface water flows into lower&ndash;lying
