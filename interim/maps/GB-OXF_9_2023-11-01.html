                var html_bbf18c2749d8985d56bbf249577b5071 = $(`<div id="html_bbf18c2749d8985d56bbf249577b5071" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Childrey Brook</h1><div class="nugget-popup"><p>Unmaintained and fully silted sections of Childrey Brook caused flooding of the adjacent A417 between November 2023 and May 2024. [PAG] (p2)</p></div><div class="nugget-popup"><p>Sections of the channel were reported as fully silted, reducing conveyance. Landowners were contacted in October 2023 and a topographical survey demonstrating the levels of siltation was circulated in March 2024; the sections remained fully silted as of May 2024. [PAG] (p3)</p></div><div class="nugget-popup"><p>Obstruction and siltation of riparian&ndash;owned sections of the brook contributed to flooding that affected the A417 and surrounding drainage assets; report recommends full de&ndash;siltation and annual maintenance/inspection. [TAB,PAG] (p4)</p></div><div class="nugget-popup"><p>A heavily obstructed section of Childrey Brook prevented water following its natural course, causing flooding that led to the A417 becoming impassable during the reporting period; upstream increased water volumes (after canal works and prolonged rainfall) contributed to the severity. [IMG,PAG] (p7)</p></div><div class="nugget-popup"><p>A heavily obstructed section of Childrey Brook prevented water following its natural course, causing runoff and silt to back up and flood the nearby A417. Obstructions and returning silt after clearance contributed to ongoing flooding and required repeated silt and vegetation clearance downstream. [PAG] (p8)</p></div><div class="nugget-popup"><p>Silt accumulation in the open section of Childrey Brook downstream of the A417 caused the channel to act as a siphon. As the siphon effect failed, water backed up through the 0.6 m pipe beneath the A417 and spilled out onto the A417, i.e. the brook's siltation directly caused flooding onto the road. [PAG] (p9)</p></div><div class="nugget-popup"><p>Silt accumulation in the open section of Childrey Brook downstream of the A417 obstructed flow. The blocked channel caused the drainage system to act like a siphon; when the siphon broke, water backed up through a 0.6 m pipe beneath the A417 and spilled onto the A417, producing the worst flooding on available records. More frequent discharge from the restored canal has prolonged the duration of flooding, although the restoration works did not factually cause the blockage. (p10)</p></div><div class="nugget-popup"><p>Silting and blockages in riparian&ndash;owned sections contributed to the flood event; report recommends full de&ndash;siltation of riparian sections, annual monitoring and inspections, and follow&ndash;on camera surveys and remedial works on associated drainage assets. [TAB] (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>0.4 m (peak flood depth on the A417 in places) [PAG] (p8)</p></div></div></body></div>`)[0];
