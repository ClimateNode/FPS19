rainfall event, indicating properties were at risk of external inundation from surface water. [TAB,PAG] (p15)</p></div><div class="nugget-popup"><p>Borough&ndash;wide flooding caused by an unprecedented storm over 18&ndash;20 January 2021. Intense, exceptional rainfall and saturated ground led to groundwater emerging as surface water and runoff from higher land flowing onto saturated or impermeable areas, inundating urban areas and infrastructure across the borough. [PAG] (p16)</p></div><div class="nugget-popup"><p>Borough&ndash;wide flooding occurred: groundwater emerging as surface water from higher ground, combined with runoff and river flows, inundated areas across the borough. [TAB] (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>385 residential properties; 78 non&ndash;residential properties; 8 critical services (p8)</p></div><div class="nugget-popup quant"><p>385 residential properties; 78 non&ndash;residential properties; 8 critical services [TAB,PAG] (p9)</p></div><div class="nugget-popup quant"><p>3 road closures (Burton Head Road, College Street, Peasley Cross Lane); 1 vaccination site (Totally Wicked Stadium) affected with damaged automatic flood barriers [TAB,PAG] (p14)</p></div></div></body></div>`)[0];
