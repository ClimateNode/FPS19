                var html_4e1f683d0d2393400a2d394e782d8d91 = $(`<div id="html_4e1f683d0d2393400a2d394e782d8d91" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Collett Park</h1><div class="nugget-popup"><p>The Collett Park Stream (culverted) carried substantial surface water from the Tadley Acres area and, during the 3&ndash;4 Oct 2020 event, its culvert was reported beyond capacity with observed surcharging from manhole ref. 0750 (and foul sewer manhole 0700) along the culvert, contributing to local flooding and sewer surcharge. [PAG] (p34)</p></div><div class="nugget-popup"><p>Collet Park was extensively flooded in the area of the duck pond and well beyond, forming a small lake when the engorged stream surged into the park. [MUL] (p37)</p></div><div class="nugget-popup"><p>CCTV surveys (Feb&ndash;Mar 2022) of drainage and watercourse structures in Collett Park identified locations where damage/defects require repair works following flooding associated with the October 2020 event. (p40)</p></div></div></body></div>`)[0];

                var html_c271212d6138b485c73e95c9c729df00 = $(`<div id="html_c271212d6138b485c73e95c9c729df00" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Greyhound Farm</h1><div class="nugget-popup"><p>During the 3&ndash;4 October 2020 event a drain directly outside and running adjacent to Greyhound Farm was identified as blocked; property owners reported Jack's Bridge was blocked/exceeded capacity. Owners on site described flood&ndash;water flow paths and ingress locations affecting properties in this area, linked to blocked drains/culverts and high river levels. (p24)</p></div></div></body></div>`)[0];

        var popup_ab3d9b3233500887208e788302c26f51 = L.popup({});

        
            
                var html_89dcdba78b935dc2ba72918f760d8abc = $(`<div id="html_89dcdba78b935dc2ba72918f760d8abc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Sheppey</h1><div class="nugget-popup"><p>Identified as a source of fluvial flooding for the event; contributed to internal flooding of properties (26 properties across Croscombe, Bowlish and Shepton Mallet in total) and associated raised groundwater/seepage impacts. [TAB] (p5)</p></div><div class="nugget-popup"><p>The River Sheppey (main river) is heavily modified and culverted through Shepton Mallet; its convergence with the culverted Collett Park Stream and other tributaries contributed to the mapped flooding at the intersection near 4 Leg Square / The Old Surgery and in the north&ndash;eastern town area (including impacts at Lower Lane and adjacent streets). [PAG,IMG] (p16)</p></div><div class="nugget-popup"><p>High levels in the River Sheppey have contributed to property flooding in adjacent areas; the river channel/culvert is the primary focus of flood risk in central Shepton Mallet with high&ndash;risk zones concentrated along the channel and at crossings. [PAG,IMG,MUL] (p18)</p></div><div class="nugget-popup"><p>River Sheppey overtopped/caused flooding of Long Street / Jack's Lane in Croscombe resulting in highway flooding and approximately 10 properties flooded. [TAB,MUL] (p19)</p></div><div class="nugget-popup"><p>The River Sheppey contributed to flooding across Shepton Mallet and nearby Croscombe, causing inundation of streets and multiple properties (examples in the report include Long Street, Church Street, West Shepton and other local streets). [PAG] (p20)</p></div><div class="nugget-popup"><p>Associated with Storm Alex heavy rainfall across the catchment (2&ndash;4 Oct 2020) leading to high river levels and increased surface runoff; contributed to widespread flooding in the catchment with internal flooding of properties, road closures and travel disruption in nearby settlements (eg Croscombe, Bowlish, Shepton Mallet). [PAG,IMG] (p21)</p></div><div class="nugget-popup"><p>The River Sheppey exceeded capacity, producing a rapid surge of water that caused flooding in Croscombe (vicinity of the A371, Long Street, Jack's Lane and Old Street Lane). Approximately 10 properties were reported flooded, with a further 1&ndash;2 potential additional properties identified during a 4 December site visit. Four properties on Long Street were flooded internally despite having Property Flood Resilience measures (flood boards, toilet bungs, non&ndash;return valves and pumps) installed in 2017. Local residents reported water levels rose very suddenly and to levels not seen in about twenty years. [IMG] (p23)</p></div><div class="nugget-popup"><p>River levels rose during the 3&ndash;4 Oct 2020 event and exceeded the height of some private rear&ndash;garden bridges; owners reported river water tracking underneath the road and entering properties through floor flagstones and subfloor voids, causing internal flooding (including one report of ~300 mm at a front door). (p25)</p></div><div class="nugget-popup"><p>Raised bed levels and a narrowing of the channel (noted in front of Manor House and reported at Jack's Bridge) reduced conveyance and contributed to fluvial flooding of properties (notably Manor House) during the 3&ndash;4 October 2020 event; community members requested dredging to increase channel capacity. [PAG] (p27)</p></div><div class="nugget-popup"><p>River Sheppey exceeded channel capacity during the 3&ndash;4 October 2020 event, producing a sudden surge that caused flooding through Croscombe. Flood water flowed through Jack's Bridge spillways on 3 and 4 October 2020, culverts and crossings were identified as potential pinch points and blockages, and surface water/gully surcharging occurred upstream of a culvert inlet on Long Street. Approximately ten properties flooded in Croscombe; four properties on Long Street flooded internally (despite fitted PFR measures). Manor House experienced internal flooding from the mill leat with depths of c.100 mm in one ground&ndash;floor room and up to 380 mm elsewhere on the ground floor. The event and channel behaviour also raised concerns about faster conveyance of flows downstream to areas such as Wells. [PAG] (p28)</p></div><div class="nugget-popup"><p>Flows along the River Sheppey significantly exceeded channel capacity during the 3&ndash;4 October 2020 event, contributing to flooding of adjacent areas (notably Bowlish and Darshill). Residents reported sewerage discharges into the river, evidenced by deposition of toilet paper and wet wipes. [PAG,IMG] (p31)</p></div><div class="nugget-popup"><p>River flows significantly exceeded channel capacity, overtopping at locations including the weir at Weirside (flows spilled from the weir and into the culvert under the A371) and contributing to downstream internal property flooding. Residents reported deposition of sewerage detritus (toilet paper and wet wipes) in the river, indicating sewerage discharges into the River Sheppey during the event. [PAG] (p32)</p></div><div class="nugget-popup"><p>The Sheppey (the watercourse) experienced high flows within long culverted reaches; culvert capacities were exceeded during the 3&ndash;4 Oct 2020 event and contributed to local flooding and surcharge issues in adjacent areas. (p34)</p></div><div class="nugget-popup"><p>Historic channel structures (culverts, mill leats, bifurcations, weirs) and elevated flows caused parts of the River Sheppey to exceed conveyance capacity; this led to flooding in Croscombe, Bowlish and Shepton Mallet as culverts and other structures were overwhelmed. [PAG] (p38)</p></div><div class="nugget-popup"><p>The River Sheppey and associated weirs/culverts were implicated in the October 3&ndash;4, 2020 flooding; locations through Bowlish (weirs/culverts near the Horseshoe Inn and Ham Mill/Weirside) and sections through Shepton Mallet (including Collett Park Stream, the vicinity of Leg Square and under the prison) were targeted for CCTV survey and some locations were later identified as requiring repair. (p40)</p></div><div class="nugget-popup"><p>Flooding in the River Sheppey catchment contributed to surface water and sewer surcharging in nearby streets and estates (references to impacts at Pike Hill and the Shaftsgate estate running down Bowlish Lane). The event prompted a flood alert for the catchment and recommendations for stricter surface water management around the River Sheppey. (p41)</p></div></div></body></div>`)[0];

                var html_ccb582ad9491e3e42046998be4c65f4a = $(`<div id="html_ccb582ad9491e3e42046998be4c65f4a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Jack's Bridge</h1><div class="nugget-popup"><p>The area around Jack's Bridge (and the nearby culvert/bifurcation) was within the flooded zone as the River Sheppey exceeded capacity; residents described a sudden surge of water and flood flow paths through this locality were observed during the site visit. (p23)</p></div><div class="nugget-popup"><p>Jack's Bridge was reported as blocked or having exceeded capacity during the 3&ndash;4 October 2020 event. The junction of two steep roads funnels surface&ndash;water run&ndash;off to the bridge; spillways cut into the bridge parapet were observed discharging flood water on 3&ndash;4 October 2020. The bridge blockage and high river levels contributed to localised flooding and ingress to adjacent properties. [PAG] (p24)</p></div><div class="nugget-popup"><p>Jack's Bridge was reported as blocked/exceeded capacity during the event; spillways cut into the downstream parapet (installed in 2009) were observed discharging flood water on 3&ndash;4 Oct 2020. A culvert adjacent to the A371 at the bridge was heavily vegetated and potentially blocked, and blockage at/around the bridge was linked to drainage failure and local flooding of adjacent properties (Greyhound Farm, Saddlers, Old Mill Cottage, Manor House). [PAG] (p25)</p></div><div class="nugget-popup"><p>Flood water from road surface run&ndash;off was observed flowing through three spillways cut into the downstream parapet of Jack's Bridge, discharging into the River Sheppey. The spillways were seen to be flowing on 2020&ndash;10&ndash;03 and 2020&ndash;10&ndash;04. [PAG,IMG,MUL] (p26)</p></div><div class="nugget-popup"><p>Localised raised river&ndash;bed level at Jack's Bridge (property owner estimated ≈300 mm higher than in 2008) is reported to have reduced channel capacity and contributed to fluvial flooding problems at nearby properties (including Manor House) during the 3&ndash;4 October 2020 event. [PAG] (p27)</p></div></div></body></div>`)[0];

                var html_81edae5fd26fbcab98a868b5465a0991 = $(`<div id="html_81edae5fd26fbcab98a868b5465a0991" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1>Leg Square, Shepton Mallet</h1><div class="nugget-popup"><p>Map and figure annotation identify an area in Leg Square as the approximate flood location where multiple culverted watercourses converge; this location was affected by localised surface&ndash;water/urban flooding as culverted flows and converging watercourses led to inundation. [PAG,IMG] (p16)</p></div><div class="nugget-popup"><p>Surface&ndash;water inundation and culvert&ndash;related flow impacts along Leg Square where the Collett Park Stream is culverted beneath the former prison and discharges to the River Sheppey &mdash; mapped as medium/high surface&ndash;water risk during the 2020&ndash;10&ndash;03 to 2020&ndash;10&ndash;04 event. [PAG,IMG] (p18)</p></div><div class="nugget-popup"><p>Leg Square affected as part of the 03/10/2020&ndash;04/10/2020 event when River Sheppey flows and local drainage caused highway flooding and contributed to flooding of properties (part of the combined total of 6 properties flooded in Leg Lane / Leg Square). [TAB] (p19)</p></div><div class="nugget-popup"><p>Leg Square is reported alongside Leg Lane as having experienced highway impacts and flooding of properties (approximately six properties noted) during Storm Alex, causing internal property flooding and disruption to the highway. (p21)</p></div><div class="nugget-popup"><p>Water flowed down Gaol Lane into Leg Square as culvert capacity was exceeded; water was observed surcharging from manholes (including manhole ref 0750 on the Collett Park Stream culvert and foul sewer manhole 0700), causing flooding within Leg Square and urban sewer surcharge. (p34)</p></div><div class="nugget-popup"><p>Rapid flows from the Gaol Lane&ndash;Leg Square link were described as a 'waterfall' and photographs/flow&ndash;paths show water flowing from Gaol Lane into Leg Square, indicating sudden surface water inundation through the square. [PAG,IMG] (p35)</p></div><div class="nugget-popup"><p>Leg Square was completely flooded and impassable to traffic for several hours. Surface water from Gaol Lane plus surging manholes caused flooding of some properties' gardens, ground floors and basements in the vicinity. [PAG,IMG] (p36)</p></div><div class="nugget-popup"><p>Leg Square was completely flooded and impassable to traffic for several hours. Properties in the vicinity had gardens, ground floors and basements flooded. The road surface between The Hollies and The Old Manor House split and was forced upwards by several feet, and cobblestones on the south side were forced upwards into the Square. The area was described as dangerous to children and other vulnerable pedestrians. [PAG,MUL] (p37)</p></div><div class="nugget-popup"><p>Named as a location where the River Sheppey and Collett Park Stream should be surveyed following the October 2020 floods; the surrounding river/stream infrastructure in this vicinity was investigated as part of the post&ndash;event programme and defects requiring repair were identified. (p40)</p></div></div></body></div>`)[0];

                var html_c55f60038ebe33605f1443e871bd4704 = $(`<div id="html_c55f60038ebe33605f1443e871bd4704" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1>Long Street, Croscombe</h1><div class="nugget-popup"><p>03&ndash;04 October 2020: River Sheppey flooding on Long Street / Jack's Lane, Croscombe flooded the highway and about 10 properties. [TAB,MUL] (p19)</p></div><div class="nugget-popup"><p>Long Street (village western end and other sections): surface&ndash;water flooding and drainage blockages affected the highway and flooded around four properties. [PAG,MUL] (p20)</p></div><div class="nugget-popup"><p>Four properties on Long Street flooded internally during the event; these properties had previously been fitted with Property Flood Resilience (PFR) measures (boards, toilet bungs, non&ndash;return valves and pumps) installed by the Environment Agency in 2017. Flood water flow paths and ingress locations were documented during a site visit. (p23)</p></div><div class="nugget-popup"><p>Multiple properties on A371 Long Street experienced internal flooding during the event. One property had ~300 mm of flood water at the front door (facing A371 Long Street); another reported ingress through the kitchen floor from beneath. Floodwater was reported coming up through floor flagstones (believed to be river water tracking under the road). River levels overtopped private rear garden bridges at properties on Long Street, and the culvert adjacent to A371 Long Street was observed significantly vegetated and potentially blocked, which would have exacerbated local drainage and flooding. [PAG] (p24)</p></div><div class="nugget-popup"><p>Properties on A371 Long Street flooded internally on 3&ndash;4 Oct 2020: owners reported river water tracking beneath the road and rising through flagstones and floor voids; river level also exceeded the height of some private rear&ndash;garden bridges, indicating elevated river levels impacted Long Street properties. [PAG] (p25)</p></div><div class="nugget-popup"><p>Long Street acted as a conduit for exceedance flow westwards; four properties on Long Street were reported to have flooded internally (despite having Property Flood Resilience measures). A gully opposite the village store surcharged from the River Sheppey and water was reported emanating from cracks between road surface and kerb. [PAG] (p28)</p></div><div class="nugget-popup"><p>A property on Long Street required a sewage clean&ndash;up carried out by Wessex Water on 3 and 4 October 2020 following sewer&ndash;related impacts; associated with internal property flooding reports and sewer infiltration issues. [PAG] (p29)</p></div><div class="nugget-popup"><p>Flooding near the George Inn made travel westwards (towards Wells) impassable; sections of the A371 Long Street west of Croscombe were flooded and one car was written off. Eastward travel towards Shepton Mallet was unaffected. [PAG,MUL] (p30)</p></div><div class="nugget-popup"><p>Flooding of the A371 (Long Street) west of Croscombe made travel impassable towards Wells, with the section of Long Street flooded; one car was written off. [PAG] (p31)</p></div></div></body></div>`)[0];

                var html_e229e67a6dc4524a0d67b4fb79cf6e74 = $(`<div id="html_e229e67a6dc4524a0d67b4fb79cf6e74" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Somerset</h1><div class="nugget-popup"><p>The county experienced Storm Alex rainfall which produced widespread flooding, internal property flooding, road closures and travel disruption across the affected area. [IMG] (p21)</p></div></div></body></div>`)[0];

                var html_6e2e6459eb027a64ea16baec12a810d3 = $(`<div id="html_6e2e6459eb027a64ea16baec12a810d3" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Croscombe</h1><div class="nugget-popup"><p>10 properties internally flooded (part of the event). Maximum reported internal depth 380 mm in one property. Predominant duration of internal flooding up to 24 hours. Strategic highway flooding estimated up to 200 mm. [TAB] (p5)</p></div><div class="nugget-popup"><p>Localised flooding affected the village during the event of 2020&ndash;10&ndash;03 to 2020&ndash;10&ndash;04, prompting a site walkover (4 December 2020) with SCC, Wessex Water, Mendip District Council and local residents and formation/activity of the Croscombe Flood Committee to gather information and support recovery and investigation. (p8)</p></div><div class="nugget-popup"><p>The village experienced flooding during the October 2020 event with properties affected in parts of Croscombe. During a site walk&ndash;over the Croscombe Flood Committee reported that no properties flooded east of the junction of Rock Street and the A371 (Long Street), implying flooding occurred elsewhere in the village; the investigation therefore focused on areas around the A371/Long Street and nearby lanes. (p11)</p></div><div class="nugget-popup"><p>Properties in Croscombe have flooded from surface water and from blocked culverts/drainage; drainage improvements (additional gullies) were installed by Area Highways after the 2008 event to reduce surface water impacts. [PAG,MUL] (p18)</p></div><div class="nugget-popup"><p>03&ndash;04 October 2020: River Sheppey flooding in Croscombe (Long Street / Jack's Lane) flooded the highway and about 10 properties in the village. [PAG,TAB,MUL] (p19)</p></div><div class="nugget-popup"><p>Flooding from the River Sheppey and intense surface&ndash;water runoff affected the village: multiple properties flooded (records show clusters of property impacts including up to 10 properties on Long Street / Jack's Lane, 4 properties on Long Street & Church Street, 3 properties elsewhere, and isolated single properties), highways (Long Street, western end of village, Thrupe Lane and other local roads) were inundated, and local drainage/culverts were blocked contributing to the flooding. [PAG] (p20)</p></div><div class="nugget-popup"><p>Multiple locations in Croscombe were affected by flooding during Storm Alex. Surface water and River Sheppey&ndash;related flooding are reported to have caused internal flooding of properties (noted counts include clusters of 3 properties in one entry) and highway impacts. [PAG,IMG,MUL] (p21)</p></div><div class="nugget-popup"><p>Approximately 10 properties were flooded in the village during the event; a further 1&ndash;2 properties at the western end were identified as potentially flooded during a site visit. Local residents described the source as the River Sheppey exceeding capacity with a rapid surge in water levels. [IMG] (p23)</p></div><div class="nugget-popup"><p>Around 10 properties were reported flooded during the 3&ndash;4 October 2020 event (with a further 1&ndash;2 properties identified as possibly flooded during a site visit). Flooding occurred in the vicinity of A371/Long Street, Jack's Lane and Old Street Lane. Long Street acted as a conduit for exceedance flow from west of The George Inn to the Elderwell footpath. Four properties on Long Street flooded internally (despite previous PFR measures). Manor House flooded internally via the mill leat with recorded depths of c.100 mm in one ground&ndash;floor room and c.380 mm elsewhere on the ground floor. Jack's Bridge spillways were discharging flood water, a culvert (~150 m length) adjacent to A371/Long Street and outfalling by Laurel Villa was identified as potentially blocked, and gullies upstream of the culvert were reported to have surcharged. An Environment Agency flood alert was issued at 10:21 on 2020&ndash;10&ndash;03. (p28)</p></div><div class="nugget-popup"><p>Flooding on Long Street near the George Inn made travel impassable westwards towards Wells; flooding outside the village to the west; the A371 Long Street west of Croscombe was flooded and one car was written off. Temporary traffic diversions were put in place to reroute vehicles around the flooded section. [MUL] (p30)</p></div><div class="nugget-popup"><p>Flooding on the A371 (Long Street) to the west of the village and flood outside the village to the west caused travel disruption, closure of the A371 through the west end of the village, and implementation of temporary diversions; at least one vehicle was written off. [PAG] (p31)</p></div><div class="nugget-popup"><p>The village experienced flooding in the event described (contrasted with Shepton Mallet in the report). (p34)</p></div><div class="nugget-popup"><p>Flooding occurred in the village as flows in the River Sheppey and rapid surface water runoff exceeded conveyance capacity (including culverts and other structures), leading to inundation. The exceeded river capacity also had a follow&ndash;on impact on the foul sewer network with potential ingress of flood water into sewers and potential sewer discharge. (p38)</p></div><div class="nugget-popup"><p>Multiple properties in Croscombe experienced internal property flooding despite having previously installed Property Flood Resilience (PFR) measures; PFR measures failed to prevent internal inundation and require review and possible remedial actions. [MUL] (p40)</p></div><div class="nugget-popup"><p>Village experienced flooding (residents requested additional hydrological information and monitoring). The event prompted community requests for a rain gauge and for event&ndash;by&ndash;event rainfall analysis to identify vulnerable locations, and engagement with the Croscombe Flooding Committee and local authorities to develop mitigation and planning. [PAG] (p42)</p></div></div></body></div>`)[0];

                var html_7acec79c62be47e77cdee87363aac91a = $(`<div id="html_7acec79c62be47e77cdee87363aac91a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bowlish</h1><div class="nugget-popup"><p>Area experienced flooding during 2020&ndash;10&ndash;03 to 2020&ndash;10&ndash;04, leading to inclusion in the Somerset County Council flood investigation and subsequent actions/meetings to assess causes and mitigation measures. (p8)</p></div><div class="nugget-popup"><p>Properties and built areas in Bowlish have flooded from surface water and from high river levels; local watercourses have been heavily modified and culverted, and blocked culverts / drainage issues have contributed to flooding. [PAG,MUL] (p18)</p></div><div class="nugget-popup"><p>Highway flooded and ten properties flooded due to the River Sheppey on 03&ndash;04 October 2020 (Wells Road, Bowlish). [TAB,MUL] (p19)</p></div><div class="nugget-popup"><p>Bowlish experienced surface water/urban flooding with blocked drains/culverts reported, affecting highways and local premises (including a school on Wells Road). [PAG] (p20)</p></div><div class="nugget-popup"><p>Storm Alex caused torrential rainfall in Bowlish leading to flooding of streets and properties, with highway impacts reported (Wells Road in Bowlish is listed as affected) and localised internal property flooding and road closures. (p21)</p></div><div class="nugget-popup"><p>Part of the report that '10 properties flooded in Bowlish and Darshill' &mdash; properties in Bowlish were flooded during the 3&ndash;4 October 2020 event. Flooding is attributed to the River Sheppey exceeding capacity; residents also reported sewerage detritus indicating sewer discharges associated with the flooding. [PAG] (p31)</p></div><div class="nugget-popup"><p>A culverted historic tributary along Coombe Lane (approx. 225 mm diameter) reportedly surcharged, with internal pressure causing heaving of the road surface in the centre of Bowlish. [MUL] (p32)</p></div><div class="nugget-popup"><p>Flows in the River Sheppey and rapid surface water runoff exceeded the capacity of conveyance structures (notably culverts), causing flooding in Bowlish. There was also a downstream effect on the foul sewer network with potential ingress of flood waters into sewers and possible sewer discharges. (p38)</p></div></div></body></div>`)[0];

                var html_e8d2d2c20d17d18b23a928fd10a74217 = $(`<div id="html_e8d2d2c20d17d18b23a928fd10a74217" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Shepton Mallet</h1><div class="nugget-popup"><p>6 properties internally flooded. Maximum reported internal depth 457 mm in one property. One property reported internal flooding lasting one week (other properties predominantly up to 24 hours). Strategic highway flooding estimated to 305 mm. [TAB] (p5)</p></div><div class="nugget-popup"><p>Property flooding occurred in Shepton Mallet during the event; flood duration is unknown but assumed to be similar to that reported for property flooding. (p6)</p></div><div class="nugget-popup"><p>Flooding occurred in Shepton Mallet on 2020&ndash;10&ndash;03 to 2020&ndash;10&ndash;04; this prompted an online meeting with Shepton Town Council (14 December 2020) to present the event to SCC, MDC, EA, Wessex Water and community members as part of the investigation and response. (p8)</p></div><div class="nugget-popup"><p>Surface water / urban flooding where multiple culverted watercourses (River Sheppey, Collett Park Stream and tributaries) converge in the north&ndash;eastern part of the town; flooding is indicated at the intersection near 4 Leg Square / The Old Surgery affecting the Leg Square / Gaol Lane / Lower Lane / Cornhill area. [PAG,IMG,MUL] (p16)</p></div><div class="nugget-popup"><p>Flooding affected the north&ndash;eastern side of the town (vicinity of Leg Square, Gaol Lane, Lower Lane and Cornhill). Properties have flooded due to surface water, blocked culverts/drainage and high River Sheppey levels; the Collett Park Stream (culverted beneath the former HMP Shepton Mallet) discharges into the River Sheppey culvert north of Lower Lane, contributing to local flood behaviour. [PAG,IMG,MUL] (p18)</p></div><div class="nugget-popup"><p>03&ndash;04 October 2020: River Sheppey (and local drainage) flooding affected Leg Lane / Leg Square in Shepton Mallet, flooding the highway and about 6 properties. [TAB,MUL] (p19)</p></div><div class="nugget-popup"><p>Widespread flooding across Shepton Mallet during the event: surface water on multiple highways, blocked culverts/drainage, and river flooding from the River Sheppey. Numerous streets and several properties were recorded flooded (report lists multiple affected properties on Long Street, Church Street, Jack's Lane, Leg Lane/Leg Square, West Shepton and others). [PAG] (p20)</p></div><div class="nugget-popup"><p>During Storm Alex (early October 2020) Shepton Mallet experienced widespread flooding causing internal flooding of properties, road closures and travel disruption across the town (reported impacts include affected highways and multiple flooded properties, e.g. Leg Lane and Leg Square). [PAG,IMG] (p21)</p></div><div class="nugget-popup"><p>During 3&ndash;4 October 2020 the area experienced significant flooding: multiple properties had internal flooding (including water rising through floor flagstones and ingress from beneath floors), river levels exceeded some private garden bridges, culverts (including one adjacent to A371 Long Street) were observed vegetated/potentially blocked and were reported blocked during the event, Jack's Bridge was reported blocked/exceeded capacity, and surface water run&ndash;off flowed through spillways cut into Jack's Bridge. One property reported ~300 mm of water at the front door. (p24)</p></div><div class="nugget-popup"><p>On 3&ndash;4 Oct 2020 Shepton Mallet experienced flooding from a combination of surface water and manhole surcharge caused by high water levels in the culverted River Sheppey and Collett Park Stream (both culverts described as beyond capacity). Reports describe a 'gush of water almost resembling a waterfall', water flowing down Gaol Lane into Leg Square, and surcharge from manholes (including referenced manholes). (p34)</p></div><div class="nugget-popup"><p>Flooding occurred in Shepton Mallet when River Sheppey flows and rapid surface water runoff exceeded the capacity of river structures (including culverts and weirs), leading to inundation. The exceeded river capacity impacted the foul sewer network, with potential ingress of flood waters into sewers and possible discharge from the sewer network. (p38)</p></div><div class="nugget-popup"><p>The River Sheppey (through Bowlish, near the Horseshoe Inn and Ham Mill/Weirside) had weirs and culverts identified for targeted CCTV survey following the event; surveys found locations where repair works are required to address flood&ndash;related damage and reduce future flood risk. [MUL] (p40)</p></div></div></body></div>`)[0];

                var html_690514d0fe60d25a5c021d564351b5fa = $(`<div id="html_690514d0fe60d25a5c021d564351b5fa" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Darshill</h1><div class="nugget-popup"><p>River Sheppey and surface water affected Darshill: at least one property reported flooded and highway (Back Lane/Old Wells Road area) experienced inundation from blocked drainage and river&ndash;related flows. [PAG] (p20)</p></div><div class="nugget-popup"><p>Properties in Darshill flooded as part of the same incident that affected Bowlish (together accounting for about 10 properties) during 3&ndash;4 October 2020. Flooding is linked to River Sheppey flows exceeding capacity; reports indicate sewerage detritus consistent with sewer discharges. [PAG] (p31)</p></div><div class="nugget-popup"><p>The volume of water exceeded normal operation of the Darshill weir (former mill/control structure). During the storm all three culvert barrels were utilised (weir in full flow), indicating the structure was operating beyond its normal capacity. (p33)</p></div></div></body></div>`)[0];
