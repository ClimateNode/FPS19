><div class="nugget-popup quant"><p>Greenwood Avenue: 39 properties; Ogle Street area: 20 properties; Wighay Road / Ward Avenue: 16 properties; Polperro Way: 5 properties; Oakenhall Avenue / Wenlock Drive: 4 properties; Linby Road: 3 properties; Dale Close: 2 properties; Papplewick Lane: 1 property; Thoresby Dale: 1 property; Brookside: 1 property. [IMG] (p3)</p></div></div></body></div>`)[0];
