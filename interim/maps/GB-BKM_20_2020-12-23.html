                var html_ca08995613995485f968ea69beda8372 = $(`<div id="html_ca08995613995485f968ea69beda8372" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Thornborough Mill</h1><div class="nugget-popup"><p>Flooding from the river (Great Ouse) was reported in the Thornborough Mill area and receded the following evening. (p6)</p></div><div class="nugget-popup"><p>Following the 23 December 2020 flood event, landowners in the Thornborough Mill area worked together to reinstate the ditch alongside the solar farm to re&ndash;establish channelled land drainage. (p30)</p></div><div class="nugget-popup"><p>Flooding occurred in the Thornborough Mill area later in the evening of 23 December 2020, associated with high flows on the Great Ouse; an Environment Agency warning for the Great Ouse was issued that evening. [TAB,PAG] (p33)</p></div><div class="nugget-popup"><p>The Thornborough Mill area started to flood from surface runoff in the late evening of 23/12/2020; residents deployed resilience measures and sandbags that night. The area then started to flood from the main river (Great Ouse) at about 03:30 on 24/12/2020. Flood waters at the Mill receded by late evening on 24/12/2020. [TAB,PAG,MUL] (p34)</p></div><div class="nugget-popup"><p>Area flooded first from surface runoff (late evening) and later from the main river; residents at Thornborough Mill deployed resilience measures and sandbags; flood later receded. [PAG] (p35)</p></div><div class="nugget-popup"><p>Mill area was flooded during the event; flood water later receded at the mill. (p36)</p></div><div class="nugget-popup"><p>High river levels on the River Great Ouse led to overtopping of the south bank at Thornborough Mill; surface water flowed south from the river into the floodplain, affecting properties immediately south of the river. [IMG] (p38)</p></div><div class="nugget-popup"><p>High River Great Ouse levels overtopped the south bank at Thornborough Mill; surface water from fields to the south was also observed flowing onto the site. [PAG] (p39)</p></div><div class="nugget-popup"><p>Two properties reported internal flooding across ground floors; one property experienced flood depths up to 14cm and subsequently installed resilience measures including raised floor levels. (p41)</p></div><div class="nugget-popup"><p>The Great Ouse overtopped its banks at Thornborough Mill during the 23rd December 2020 event, causing flooding at the mill location and adjacent areas. A large left&ndash;bank floodplain exists but raised ground at the bank restricted flow from the channel to the floodplain, likely concentrating floodwater at the mill. A weir immediately upstream controls water levels and is noted in relation to the event. (p49)</p></div><div class="nugget-popup"><p>The Thornborough Mill area was inundated by the December 2020 flood event. [PAG] (p50)</p></div><div class="nugget-popup"><p>Subject to flooding from the Great Ouse during the extreme December 2020 event; the catchment and river flows at Thornborough Mill were directly discussed in relation to the December 2020 flood magnitude. [PAG,IMG] (p51)</p></div><div class="nugget-popup"><p>Overland flows were observed in the Thornborough Mill area, contributed to by a blocked ditch below the solar farm at Thornborough Grounds. (p62)</p></div><div class="nugget-popup"><p>High River Great Ouse levels caused floodwater to overtop the south bank near Thornborough Mill, with surface water observed flowing off the adjoining fields onto the area. [PAG] (p64)</p></div><div class="nugget-popup"><p>The Thornborough Mill catchment on the Great Ouse experienced elevated flows in response to the 23rd December 2020 rainfall (soils already saturated), with an approximate flow return period of 10&ndash;30 years. This increased flood risk at Thornborough Mill and underpinned recommendations for measures such as natural flood management and property flood resilience. [PAG] (p65)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 400 mm depth [PAG] (p35)</p></div><div class="nugget-popup quant"><p>2 properties; 14cm (ground&ndash;floor flood depth) (p41)</p></div></div></body></div>`)[0];

                var html_c64573431dca1c4050bc32f34f017cb7 = $(`<div id="html_c64573431dca1c4050bc32f34f017cb7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Back Street Ford</h1><div class="nugget-popup"><p>Road flooding was seen at the ford on Back Street with water levels anecdotally reaching greater than 6 ft; water level was noted as above the 6 ft marker at the ford. (p24)</p></div><div class="nugget-popup"><p>The ford at Back Street was overtopped by Thorn Brook, causing inundation at that crossing/location. [PAG] (p36)</p></div><div class="nugget-popup"><p>The ford and adjacent footpath on Back Street were flooded from Thorn Brook, with water pooling on the road and reaching the second railing. (p37)</p></div><div class="nugget-popup"><p>The Ford on Back Street was flooded during the event; when both this Ford and Lower End were flooded, residents who live between these two points were cut off until the flood waters receded. (p42)</p></div><div class="nugget-popup"><p>Vegetation in the narrow channel downstream of the Ford contributed to exacerbation of flooding on nearby Back Street by restricting conveyance. (p48)</p></div><div class="nugget-popup"><p>Flooding at Back Street Ford (Thorn Brook) produced concentrated overland flows along Back Street; in the Back Street/Lower End area at least 13 cars became stranded and flooded requiring Fire Brigade attendance. (p64)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>water levels above 6ft marker; greater than 6ft (anecdotal) (p24)</p></div><div class="nugget-popup quant"><p>5 ft 2 in (flood board reading at the Back Street ford) (p37)</p></div><div class="nugget-popup quant"><p>13 cars (p64)</p></div></div></body></div>`)[0];

                var html_2278752b0f0b87d1cf73831f604db2df = $(`<div id="html_2278752b0f0b87d1cf73831f604db2df" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Great Ouse</h1><div class="nugget-popup"><p>The Great Ouse experienced high flows contributing to flooding at Thornborough Mill later in the evening of 23 December 2020; an Environment Agency flood warning for the Great Ouse was issued at 18:35 referencing the area. [PAG] (p33)</p></div><div class="nugget-popup"><p>The south bank of the River Great Ouse at Thornborough Mill was overtopped, allowing river water to flow southward across the floodplain and into properties immediately south of the river. [IMG] (p38)</p></div><div class="nugget-popup"><p>Experienced an extreme river flood event during December 2020 that affected flows at Thornborough Mill; the December 2020 flood magnitude on the Great Ouse at Thornborough Mill was described as 'too extreme' in the report and is the primary river flooding influence in the Thornborough Mill area. [PAG] (p51)</p></div><div class="nugget-popup"><p>The Great Ouse (affecting the Thornborough Mill catchment) experienced elevated flows in response to the 23rd December 2020 rainfall and saturated soils, contributing to raised river levels and flood risk at Thornborough Mill; this influenced recommendations for catchment and riparian measures. (p65)</p></div></div></body></div>`)[0];

                var html_70b9471b2e92c9c04ae5ca5d83c1de2e = $(`<div id="html_70b9471b2e92c9c04ae5ca5d83c1de2e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lower End Bridge</h1><div class="nugget-popup"><p>The bridge at Lower End Road became impassable due to flooding. (p6)</p></div><div class="nugget-popup"><p>The location where the watercourse passes under Lower End Bridge was identified in maintenance responsibility notes and was adjacent to channel clearance works carried out after the 23rd December 2020 flood; the IDB cleared upstream sections to increase capacity and removed a concrete in&ndash;channel weir on the upstream face of Hatchet Leys Bridge. (p29)</p></div><div class="nugget-popup"><p>Lower End Bridge became impassable due to flood water; road impassable and flood water at the bridge reached approximately 400 mm depth (observed 23/12/2020). [TAB] (p34)</p></div><div class="nugget-popup"><p>Floodwater reached road level at the bridge, making the road impassable. (p35)</p></div><div class="nugget-popup"><p>Cowerde Brook overtopped the bridge and spilled into the road, submerging areas of Back Street and Lower End. Flooding began at around 16:00 and is shown in Figure 8&ndash;2. (p37)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>400 mm depth at Lower End Bridge [TAB] (p34)</p></div><div class="nugget-popup quant"><p>approximately 400 mm depth (p35)</p></div></div></body></div>`)[0];

                var html_0d3e18e3ea3a77ba63be962cf5aec638 = $(`<div id="html_0d3e18e3ea3a77ba63be962cf5aec638" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hatchet Leys Bridge</h1><div class="nugget-popup"><p>Following the 23 December 2020 flood the IDB removed a concrete in&ndash;channel weir on the upstream face of Hatchet Leys Bridge and cleared the stream between the bridges to increase conveyance and reduce blockages. (p30)</p></div><div class="nugget-popup"><p>Bridge/road became impassable due to flood water; depth at Lower End Bridge reached approximately 400 mm making the road impassable. [TAB] (p34)</p></div><div class="nugget-popup"><p>Cowerde Brook overtopped the bridge and spilled into the road, submerging areas of Back Street and Lower End. Flooding began at around 16:00 and is shown in Figure 8&ndash;2. (p37)</p></div><div class="nugget-popup"><p>Overflow at Hatchet Leys Bridge caused floodwater onto Hatchet Leys Lane; a property flooded internally with one room inundated to about 10 cm, fast&ndash;flowing water breached raised ground outside the front door, and pumping measures were deployed to limit further ingress. Flooding at the bridge was also worsened by converging overland flows from Back Street and High Street. (p40)</p></div><div class="nugget-popup"><p>Water backed up immediately downstream of Hatchet Leys bridge due to blockages in the upstream channel/IDB drain, contributing to local flooding at the bridge location. (p48)</p></div><div class="nugget-popup"><p>Concrete single&ndash;span bridge with a downstream livestock gate that can trap debris and contribute to blockage; during the 23rd December 2020 event water pooled upstream of the bridge, leading to the watercourse overtopping and floodwater spilling onto nearby fields, roads and properties. (p59)</p></div><div class="nugget-popup"><p>The bridge and associated livestock gate/constriction caused water to back up; recommendations include removing the livestock gate and investigating a bypass around the bridge to allow floodwater to flow onto downstream fields to reduce upstream backing. [TAB] (p60)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>400 mm depth [TAB] (p34)</p></div><div class="nugget-popup quant"><p>one room flooded; approximately 10cm depth (p40)</p></div></div></body></div>`)[0];

                var html_61565bff7c9ae8d793ac49a6ac0f8395 = $(`<div id="html_61565bff7c9ae8d793ac49a6ac0f8395" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>High Street, Thornborough</h1><div class="nugget-popup"><p>Tonne Brook was observed beginning to overtop at the High Street, causing water to reach and flow along the street (photo evidence from the event). A small watercourse is culverted under the High Street and was a pathway for flows. [PAG] (p22)</p></div><div class="nugget-popup"><p>After overtopping of the River Great Ouse, ordinary watercourses overtopped and floodwater on High Street flooded the green to approximately 6 ft in depth. (p24)</p></div><div class="nugget-popup"><p>Flooding affected the street during the event; residents on High Street deployed resilience measures and sandbags, and Transport for Buckinghamshire implemented road closures affecting High Street. [TAB,PAG] (p34)</p></div><div class="nugget-popup"><p>Residents deployed resilience measures and sandbags to protect properties from floodwater. (p35)</p></div><div class="nugget-popup"><p>Tonne Brook began to overtop at High Street (at the pond next to the Village Hall and downstream pond outlet), with photographic evidence of overtopping during the event. [PAG,IMG] (p36)</p></div><div class="nugget-popup"><p>Water from the surcharging culvert flowed onto High Street and combined with surface water (exacerbated by blocked drains), resulting in flooding of the street. [PAG] (p37)</p></div><div class="nugget-popup"><p>The culvert under High Street surcharged, backing up water that flowed onto the road; this combined with surface water from blocked drains. Tonne Brook began to overtop adjacent to High Street, with floodwater encroaching onto the grassy area, footpath and carriageway. [PAG,IMG] (p38)</p></div><div class="nugget-popup"><p>Overland surface water flows from saturated fields (notably from the area around Stonelands Farm) contributed significant amounts of water towards the rear of properties on Lower End and High Street. (p39)</p></div><div class="nugget-popup"><p>A channel developed on High Street flowing northwards from the spring at Location 9, directing floodwater towards the village. A property near the village hall flooded internally when muddy water entered via a surcharged manhole, reaching approximately 15&ndash;20cm in two rooms. The main village High Street experienced significant flooding between about 19:00 and 20:00 that lasted roughly five hours, causing residents to wade to their cars. (p40)</p></div><div class="nugget-popup"><p>Two properties flooded externally; at one property floodwater reached the front&ndash;door sill, and at another floodwaters from Tonne Brook flowed through the rear garden via a diversion flow path (residents reported this garden floods regularly; a sluice is fitted at the gate). (p41)</p></div><div class="nugget-popup"><p>External flooding was reported at properties (from field runoff) and flooding occurred near the village hall on High Street during the event. [PAG] (p42)</p></div><div class="nugget-popup"><p>Playing fields and footpaths on the floodplain off the High Street (sports fields and adjacent footpaths) were flooded; these floodings did not present a significant hazard to residents. [PAG] (p43)</p></div><div class="nugget-popup"><p>Tonne Brook began to overtop onto High Street on 23rd December 2020, resulting in water flowing onto the street (reported and photographed in the investigation). [PAG,IMG] (p46)</p></div><div class="nugget-popup"><p>Overland flow from farmland to the south of the village caused external flooding around properties off High Street. No internal flooding was reported, largely because homeowners had carried out resilience works to route water around properties. (p62)</p></div><div class="nugget-popup"><p>Significant flooding of High Street after a village&ndash;hall meeting forced residents to wade to their cars; the flooding began between 19:00 and 20:00 and caused major disruption. (p64)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 6ft in depth (p24)</p></div><div class="nugget-popup quant"><p>two rooms; 15&ndash;20cm; approximately five hours (p40)</p></div><div class="nugget-popup quant"><p>2 properties; 1 property (flood reached front&ndash;door sill) (p41)</p></div><div class="nugget-popup quant"><p>2 properties [PAG] (p42)</p></div></div></body></div>`)[0];

                var html_4feeea16f64e109cb70c31d98c9b1feb = $(`<div id="html_4feeea16f64e109cb70c31d98c9b1feb" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Back Street, Thornborough</h1><div class="nugget-popup"><p>Overland flow from agricultural fields accumulated on Back Street, producing surface&ndash;water pooling/flow on the roadway during the event (photo evidence). [PAG] (p22)</p></div><div class="nugget-popup"><p>Floodwater on Back Street flooded the green to around 6 ft; road flooding was reported at the ford on Back Street with water levels noted above the 6 ft marker and anecdotal reports of depths greater than 6 ft. (p24)</p></div><div class="nugget-popup"><p>Cowerde Brook overtopped at Hatchet Leys Lane (around 16:00 on 23 December 2020) and spilled into the road, submerging areas of Back Street and Lower End. [PAG] (p36)</p></div><div class="nugget-popup"><p>Back Street was flooded: the ford and footpath were inundated and floodwater pooled on the road. Areas of Back Street were submerged by water overflowing from local brooks (including Cowerde Brook). [PAG] (p37)</p></div><div class="nugget-popup"><p>Surface water was observed flowing off fields onto Back Street; an overflowing drainage ditch along the highway verge exacerbated flooding and a channel formed that flowed along the street towards Lower End. (p39)</p></div><div class="nugget-popup"><p>A defined channel developed from converging surface water from fields to the north and flowed along Back Street towards Lower End. Flooding at the junction of Back Street and Lower End stranded and flooded numerous vehicles, creating a hazardous situation that required emergency response. (p40)</p></div><div class="nugget-popup"><p>Flooding occurred along Back Street (including the ford) during the 23 December 2020 event, contributing to local road inundation and isolating residents between the flooded points until waters receded. (p42)</p></div><div class="nugget-popup"><p>Watercourse overtopped at Back Street, causing flooding of the Back Street area. (p43)</p></div><div class="nugget-popup"><p>Flooding was exacerbated on Back Street due to vegetation in the narrow channel downstream of the Ford; channel condition contributed to increased local flood risk though a relief route exists. [TAB] (p48)</p></div><div class="nugget-popup"><p>Runoff from fields to the north of Back Street was reported to flow out onto the road and down to the junction with Lower End, contributing to overland flows affecting the highway and local area. (p62)</p></div><div class="nugget-popup"><p>Severe road flooding at the junction of Back Street and Lower End caused at least 13 cars to become stranded and flooded, creating a hazardous situation that required emergency response. (p64)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 6ft in depth; water level above 6ft marker; greater than 6ft (anecdotal) (p24)</p></div><div class="nugget-popup quant"><p>at least 13 cars (p40)</p></div></div></body></div>`)[0];

                var html_5de6744afdf6768cd6a61b82fea244bd = $(`<div id="html_5de6744afdf6768cd6a61b82fea244bd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bridge Street, Thornborough</h1><div class="nugget-popup"><p>Internal flooding observed in a property, with water coming up through floorboards. [TAB] (p34)</p></div><div class="nugget-popup"><p>Tonne Brook overtopped at Bridge Street (location 15), causing flooding of the street and adjacent areas. [PAG] (p36)</p></div><div class="nugget-popup"><p>Overtopping of Tonne Brook occurred at Bridge Street, with floodwater reaching the first white railing of the bridge. (p37)</p></div><div class="nugget-popup"><p>Residents reported sewage backing up into toilets (sewer flooding) and observers noted overland flows pouring off fields onto Bridge Street (surface water reaching the road). (p39)</p></div><div class="nugget-popup"><p>Overland flows from surrounding fields and overflows from the Tonne Brook converged on Bridge Street. Floodwater ran down the street, encroaching on the front of one property; on the far side of the bridge flows reportedly reached depths of about 30 cm as they ran into the village. (p40)</p></div><div class="nugget-popup"><p>Flooding occurred along Bridge Street causing external flooding to properties (water reaching door thresholds) and contributing to road inundation in the village. [PAG] (p41)</p></div><div class="nugget-popup"><p>Flooding occurred along Bridge Street during the event. (p42)</p></div><div class="nugget-popup"><p>Watercourse overtopped at Bridge Street, resulting in overtopping&ndash;related flooding at this location. (p43)</p></div><div class="nugget-popup"><p>Bridge Street acted as the only possible relief flow route for the Tonne Brook where overtopping of the bridge deck occurred once in&ndash;channel levels backed up; the restricted floodplain (houses on banks) forced flows to use this route, causing floodwater to pass over the bridge and threaten adjoining properties. (p44)</p></div><div class="nugget-popup"><p>Flooding was exacerbated on Bridge Street because the narrow, engineered channel provides no relief flow routes, increasing flood depths/impact on the street. [TAB] (p48)</p></div><div class="nugget-popup"><p>On 23 December 2020 Bridge Street experienced surface water flowing onto the road (including water pouring off adjacent fields) and sewer&ndash;related impacts: residents reported sewer backup with water entering toilets. The ordinary watercourse at Bridge Street was also recorded as overtopping during the event. (p64)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property; 30 cm deep (p40)</p></div><div class="nugget-popup quant"><p>6 properties; 18cm (reported maximum depth at door thresholds along Bridge Street) [PAG] (p41)</p></div></div></body></div>`)[0];

                var html_e791aaa6c16e78f97532d201609fb3d2 = $(`<div id="html_e791aaa6c16e78f97532d201609fb3d2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hatchet Leys Lane, Thornborough</h1><div class="nugget-popup"><p>Road flooding with vehicles stuck; Fire and Rescue attended and the road was shut for safety. [TAB] (p34)</p></div><div class="nugget-popup"><p>The bridge at Hatchet Leys Lane was overtopped and the lane/adjacent road was submerged by overflow from Cowerde Brook (flooding began at around 16:00). [PAG,IMG] (p36)</p></div><div class="nugget-popup"><p>A property on Hatchet Leys Lane flooded from overflow of Cowerde Brook at Hatchet Leys Bridge; one room flooded to approximately 10cm depth. Fast&ndash;flowing water breached raised land outside the front door, though further internal flooding was limited by use of a sump pump and other measures. Flooding was exacerbated by converging overland flows from Back Street and High Street. (p40)</p></div><div class="nugget-popup"><p>River/watercourse overtopped at the location adjacent to Hatchet Leys Lane, causing localised flooding of the lane/adjacent land. (p43)</p></div><div class="nugget-popup"><p>Moderate siltation of the Cowerde Brook between the bridges at Lower End and Hatchet Leys End produced low&ndash;velocity flows and reduced conveyance in this reach, contributing to local flooding risk during the event. (p44)</p></div><div class="nugget-popup"><p>Highway gullies were reported blocked or overwhelmed during the event, producing surface water flow paths at the road edges; this roadside surface water contributed to internal flooding of a property and caused localised roadside inundation. [TAB] (p60)</p></div><div class="nugget-popup"><p>The Hatchet Leys Lane bridge area experienced overtopping (from Cowerde Brook), causing road flooding and contributing to roads being unpassable in the village. (p64)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>13 vehicles; one person [TAB] (p34)</p></div><div class="nugget-popup quant"><p>one room; approximately 10cm (p40)</p></div><div class="nugget-popup quant"><p>1 property [TAB] (p60)</p></div></div></body></div>`)[0];

                var html_7d549290b027be707206f44f14101af3 = $(`<div id="html_7d549290b027be707206f44f14101af3" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Buckinghamshire</h1><div class="nugget-popup"><p>Widespread flooding across the county during the event: main roads (including A422 and A421) were impassable in places, multiple communities were cut off, and emergency services prioritised risk&ndash;to&ndash;life responses; in some cases water tables were too high to pump properties dry. (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>161 incidents; 13 vehicles; 1 person (p34)</p></div></div></body></div>`)[0];

                var html_2a71f7d99bbceae50c0b0796467479e7 = $(`<div id="html_2a71f7d99bbceae50c0b0796467479e7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Thornborough</h1><div class="nugget-popup"><p>The village experienced flooding during the 23 December 2020 storm (flooding began around 15:00), with overtopping of local watercourses, converged overland and surface water flows and groundwater emergence causing internal flooding of homes, resident displacement, loss of possessions and negative mental and physical health impacts. (p6)</p></div><div class="nugget-popup"><p>Internal flooding to residential properties within the settlement, triggering a Section 19 investigation. (p13)</p></div><div class="nugget-popup"><p>The village was impacted by flooding during the December 2020 event (23 December 2020); this prompted a Section 19 flood investigation and collection of evidence (photos, questionnaires, rainfall and drainage data) to understand causes and impacts. (p14)</p></div><div class="nugget-popup"><p>Overbank flows and surface&ndash;water overland flow affected multiple locations in the village during the event: flooding at Lower End Bridge and Hatchet Leys Bridge, Tonne Brook beginning to overtop at the High Street, overland flow from fields accumulating on Back Street, and high flows at the inlet to Thornborough Pond. [PAG,IMG] (p22)</p></div><div class="nugget-popup"><p>Repeated flooding of the village from ordinary watercourses, surface water and the River Great Ouse across multiple events: 1902 (whole village flooded, several houses flooded by rapid ingress), 1935 (storm &mdash; brook at Bridge Street burst its banks, forced down a brick wall, water rose rapidly to around 6 ft and entered houses to ~1 ft depth; many properties affected), March 1947 (overtopping of the River Great Ouse led to ordinary watercourses overtopping and High Street/Back Street and the village green being flooded to about 6 ft), April 1998 (heavy rainfall led to very high river levels and road/ford flooding), July 2000 (internal/external flooding affecting the village), 2006 (two properties reported flooded), July 2007 (around 10 properties flooded; River Great Ouse believed to have flooded the Thornborough Mill area), and the reported event on 23 December 2020 when the village was the subject of the investigation. Impacts described include inundation of streets (High Street, Back Street, The Green), internal property flooding, damage to carpets and furniture, and significant depths of standing water in parts of the village and at the ford on Back Street. [PAG,IMG,TAB,MUL] (p23)</p></div><div class="nugget-popup"><p>The village experienced overtopping of the River Great Ouse and subsequent overtopping of ordinary watercourses; properties across the centre and Lower End were flooded (internal and external flooding reported), with roughly ten properties cited in some accounts and reports that up to 17 or 18 houses had water entry. (p24)</p></div><div class="nugget-popup"><p>Following the flood event on 23rd December 2020, local watercourses (notably Cowerde Brook) caused flooding issues in the village. Transport for Buckinghamshire cleared gullies and culverts in the adopted highway. The Buckingham and Ouzel IDB cleared a section of channel upstream of Lower End bridge to increase capacity, removed a concrete in&ndash;channel weir on the upstream face of Hatchet Leys Bridge, and cleared the stream between bridges. Fly&ndash;tipped debris in the highway ditch beside the IDB&ndash;maintained watercourse was identified as obstructing flow and a potential contributor to flooding. A section of watercourse flows to a pumping station alongside Lower Road. (p29)</p></div><div class="nugget-popup"><p>Flooding occurred in the village beginning at approximately 15:00 on 23 December 2020; floodwaters affected the village and later receded. [TAB,PAG] (p33)</p></div><div class="nugget-popup"><p>Flooding began in the village at approximately 15:00 on 23/12/2020. Internal flooding was observed on Bridge Street at 16:00 with water coming up through the floorboards of a property. Lower End Bridge and Hatchet Leys bridge became impassable; roads were flooded and closed (including High Street). Residents deployed sandbags on Lower End and High Street. Flood water in the village had receded by about 23:00 on 23/12/2020. [TAB,PAG] (p34)</p></div><div class="nugget-popup"><p>Extreme rainfall on an already saturated catchment caused multiple ordinary watercourses to overtop in the village (at least seven locations) and produced overland flow pathways, resulting in widespread flooding across Thornborough on 23 December 2020. [PAG,IMG] (p36)</p></div><div class="nugget-popup"><p>Multiple local watercourses overtopped in the village: Thorn Brook flooded the ford and footpath on Back Street (water pooled on the road, reaching the second railing); Tonne Brook overtopped near the pond and flowed through the grounds of Thornborough Manor; the pond overtopped and flooded the road at Location 2; Bridge Street experienced overtopping to the first white railing; a culvert near the Old Manor surcharged and backed water onto High Street; blocked culvert/culvert debris caused flooding behind the Maltings. [PAG] (p37)</p></div><div class="nugget-popup"><p>Extreme rainfall on a saturated catchment and overtopping of ordinary watercourses caused widespread local flooding in the village. Ordinary watercourses overtopped in at least seven locations, producing overland flow paths that flooded streets and low&ndash;lying areas; groundwater emerged from springs behind the Maltings and on High Street; culvert surcharge and blocked drains exacerbated flooding in the village. [PAG,IMG] (p38)</p></div><div class="nugget-popup"><p>High River Great Ouse levels occurred in the village, with the south bank overtopped at Thornborough Mill. Groundwater emerged from a spring behind the Maltings on Bridge Lane (Location 14) and from the ground on the High Street (Location 9). Overland runoff from saturated fields (including around Stonelands Farm) flowed onto roads and into rear gardens on Lower End and High Street and 'poured' onto Bridge Street. A manhole cover near Location 2 lifted with flood water, and sewer backup caused water to enter toilets on Bridge Street near Location 17. [PAG] (p39)</p></div><div class="nugget-popup"><p>Converging overland flows, overflows from watercourses and groundwater ingress caused widespread localised flooding across the village. Flooding led to vehicles becoming stranded and flooded at the Back Street / Lower End junction, significant inundation of the High Street (residents had to wade to cars), and multiple properties flooded internally (including a property on Hatchet Leys Lane, a property on High Street and the Two Brewers pub). (p40)</p></div><div class="nugget-popup"><p>Village&ndash;wide flooding affected multiple properties (internal and external) and infrastructure: properties flooded internally and externally, roads inundated (including Lower End, Back Street Ford, Bridge Street, High Street), vehicles stranded requiring rescue, and some residents cut off while floodwaters persisted. (p41)</p></div><div class="nugget-popup"><p>Footpaths located within the village floodplain were inundated during the event; this flooding did not present a significant hazard to residents. (p43)</p></div><div class="nugget-popup"><p>Flooding in Thornborough caused damage to property and affected people/communities, prompting a high&ndash;level appraisal of mitigation measures (improvements to data collection and modelling, flood warning and incident management, community resilience, asset maintenance and flood risk management schemes). [PAG] (p52)</p></div><div class="nugget-popup"><p>Properties in Thornborough were affected by flooding during the event on 23 December 2020. The investigation recommends Property Flood Resilience measures for at&ndash;risk properties and community&ndash;level actions (a Community Flood Toolkit and a flood&ndash;preparedness information pack) to reduce future impacts. [TAB,PAG] (p54)</p></div><div class="nugget-popup"><p>During the 23rd December 2020 event floodwater reached close to multiple properties in the village. Some residents deployed door barriers which successfully prevented water ingress; others, despite landscaping intended to redirect flows, still experienced floodwater approaching their properties. (p55)</p></div><div class="nugget-popup"><p>Highway gullies were blocked or overwhelmed producing surface water flow paths at the sides of roads. Overland flow from farmland (south of the village and from fields north of Back Street) caused external flooding around properties off High Street and runoff flowed onto roads down to the junction with Lower End. A blocked ditch below the solar farm at Thornborough Grounds contributed to overland flows in the Thornborough Mill area. Homeowner resilience measures prevented internal flooding in some cases. [PAG] (p61)</p></div><div class="nugget-popup"><p>Overland flow from farmland to the south of the village caused external flooding around properties off High Street; properties avoided internal flooding due to resilience works carried out by homeowners. [PAG] (p62)</p></div><div class="nugget-popup"><p>On 23 December 2020 the village experienced intense surface water and river&ndash;related flooding. At least five residential properties suffered internal flooding. Multiple ordinary watercourses and culverts were overtopped in the village, roads became unpassable, drains were blocked and overwhelmed, and a manhole cover lifted with flood water near properties. Water backed up from sewers into toilets (reported on Bridge Street). Concentrated overland flows and runoff from saturated surrounding fields contributed to flooding across streets. At the junction of Back Street and Lower End at least 13 cars became stranded and flooded requiring Fire Brigade attendance. Residents leaving the village hall had to wade through significant flooding on the High Street during an episode starting between 19:00&ndash;20:00 and lasting roughly five hours, causing major disruption and distress. [PAG] (p64)</p></div><div class="nugget-popup"><p>The Thornborough village catchment (Cowerde Brook) produced an elevated flow response to heavy rainfall on 23rd December 2020 while soils were saturated, giving an estimated flow return period of about 5&ndash;20 years. This led to increased flood risk to the village and prompted recommendations for community resilience (Flood Action Plan, Community Flood Toolkit) and Property Flood Resilience at highest&ndash;risk properties. [TAB,PAG] (p65)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>five residential properties (p6)</p></div><div class="nugget-popup quant"><p>at least five properties (p13)</p></div><div class="nugget-popup quant"><p>17 or 18 houses; approximately 10 properties; Two properties; Approximately 10 properties [PAG,IMG,TAB,MUL] (p23)</p></div><div class="nugget-popup quant"><p>approximately 10 properties; 17 or 18 houses (p24)</p></div><div class="nugget-popup quant"><p>1 property; 13 vehicles [TAB,PAG] (p34)</p></div><div class="nugget-popup quant"><p>5 ft 2 in (flood board reading at the Back Street ford) [PAG] (p37)</p></div><div class="nugget-popup quant"><p>7 locations [PAG,IMG] (p38)</p></div><div class="nugget-popup quant"><p>5 properties; 3 properties in Thornborough; at least 13 cars; approximately five hours (p40)</p></div><div class="nugget-popup quant"><p>6 properties (along Bridge Street); 2 properties (Thornborough Mill internal); 2 properties (High Street Location 2 external) (p41)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p61)</p></div><div class="nugget-popup quant"><p>at least five residential properties; at least seven overtopping locations; at least 13 cars; approximately five hours [PAG] (p64)</p></div></div></body></div>`)[0];

                var html_e5ae63da9f3530a2a1661739fcc20130 = $(`<div id="html_e5ae63da9f3530a2a1661739fcc20130" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lower End</h1><div class="nugget-popup"><p>Flooding made the bridge on Lower End Road impassable during the event. (p6)</p></div><div class="nugget-popup"><p>Lower End is repeatedly reported as being flooded: in 1902 the whole village (including Lower End) was flooded; in the September 1935 storm many homes at Lower End were invaded and houses near the brook were commonly flooded, with floodwater sweeping over a 6 ft wall and entering houses (reports describe water entering properties to depths around 1 ft). Photographic evidence in the report shows flooding at Lower End Bridge and Hatchet Leys Bridge on 23 December 2020. [PAG,TAB,MUL] (p23)</p></div><div class="nugget-popup"><p>Houses at Lower End near the brook were flooded; many homes were invaded when the brook burst its banks and water entered houses up to 1 foot deep in some properties. [PAG] (p24)</p></div><div class="nugget-popup"><p>The reach of watercourse passing under the Lower End bridge was the focus of post&ndash;flood clearance works carried out after the 23rd December 2020 event (IDB cleared upstream channel to increase capacity). (p29)</p></div><div class="nugget-popup"><p>Cowerde Brook overtopped at Hatchet Leys Lane (around 16:00 on 23 December 2020) and spilled into the road, submerging areas of Back Street and Lower End. [PAG] (p36)</p></div><div class="nugget-popup"><p>Overland surface water flows from saturated fields (notably from the area around Stonelands Farm) contributed significant amounts of water towards the rear of properties on Lower End and High Street. (p39)</p></div><div class="nugget-popup"><p>Converging overland flows and overflows from nearby watercourses reached Lower End. Flow paths from College Farm discharged onto the road at Lower End and then flowed northwards; the junction with Back Street experienced stranded vehicles. Surface flows and overtopping combined here to exacerbate flooding. (p40)</p></div><div class="nugget-popup"><p>Field runoff converging from fields to the south caused external flooding at properties on Lower End and High Street; roads were flooded (notably Lower End), the Fire and Rescue Service were called to rescue cars stranded in floodwater, and when Lower End and Back Street Ford were both flooded residents between those points were cut off until waters receded. (p41)</p></div><div class="nugget-popup"><p>External flooding reported at properties from field runoff converging from fields to the south. The road along Lower End was flooded and the Fire and Rescue Service were called to rescue cars stranded in the floodwater. When Lower End and the Ford on Back Street were both flooded during the event, residents between these points were cut off until waters receded. [PAG] (p42)</p></div><div class="nugget-popup"><p>Watercourse overtopped at Lower End, causing flooding of the Lower End area. (p43)</p></div><div class="nugget-popup"><p>Moderate siltation of the Cowerde Brook between the bridges at Lower End and Hatchet Leys End produced low&ndash;velocity flows and reduced conveyance in this reach, contributing to local flooding risk during the event. (p44)</p></div><div class="nugget-popup"><p>Overland flows/runoff from surrounding fields flowed down to the junction with Lower End, indicating local road flooding and contribution to flood pathways in this area during the event. (p62)</p></div><div class="nugget-popup"><p>Severe road flooding at the junction of Back Street and Lower End caused at least 13 cars to become stranded and flooded, creating a hazardous situation that required emergency response. (p64)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>water entered houses to a depth of 1 foot; 17 or 18 houses; many homes [PAG] (p24)</p></div><div class="nugget-popup quant"><p>at least 13 cars (p40)</p></div><div class="nugget-popup quant"><p>2 properties (Lower End and High Street) (p41)</p></div><div class="nugget-popup quant"><p>2 properties [PAG] (p42)</p></div></div></body></div>`)[0];
