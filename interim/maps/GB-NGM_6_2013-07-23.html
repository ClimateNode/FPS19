                var html_e466a756bdfe73a05da96e5681c967b3 = $(`<div id="html_e466a756bdfe73a05da96e5681c967b3" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bakewell Drive, Top Valley</h1><div class="nugget-popup"><p>Properties on Bakewell Drive suffered internal flooding during the intense storm event affecting the Top Valley area. (p3)</p></div><div class="nugget-popup"><p>Internal (over the doorstep) flooding of residential properties on the street. (p5)</p></div><div class="nugget-popup"><p>Properties on Bakewell Drive experienced internal flooding during the event; flood locations are marked at the valley bottom where runoff concentrates from higher ground. [PAG] (p7)</p></div><div class="nugget-popup"><p>Area was affected by surface&ndash;water (surface water) flooding associated with the flood event on 23rd July 2013. The Environment Agency Flood Map for Surface Water shows Bakewell Drive at high risk and indicates the flood flow route follows the natural valley through this location. [PAG] (p8)</p></div><div class="nugget-popup"><p>Properties on Bakewell Drive were flooded on 23 July 2013 due to rapid overland flow and ponding. Local topography caused additional overland flow from Barnes Road, Whitworth Rise (east end) and the school playing fields to the north, directing water onto the properties. (p11)</p></div><div class="nugget-popup"><p>The road, lying in the valley bottom, became a conduit for rapid downhill surface water from surrounding roads and playing fields; both surface water and foul sewer systems became overloaded and surcharged, contributing to overland flow and flooding of properties from front and rear. [PAG] (p13)</p></div><div class="nugget-popup"><p>Rapid surface water and sewer surcharge produced overland flow along the valley&ndash;bottom street. This caused internal flooding of properties from both front (road) and rear (playing fields), with water entering via low thresholds and airbricks. [IMG,PAG] (p14)</p></div><div class="nugget-popup"><p>Internal damage to carpets, floors, doors, walls and furniture, and external damage to walls, sheds and gardens. [TAB] (p15)</p></div><div class="nugget-popup"><p>Intense rainfall produced large volumes of surface water runoff that overwhelmed drainage, causing water to pond in low&ndash;lying areas and enter properties. Internal flooding occurred requiring complete renovation of downstairs areas including flooring, kitchens, walls, doors, plaster and furniture. (p16)</p></div><div class="nugget-popup"><p>During the 23rd July 2013 event surface water was unable to drain effectively into the highway drainage system; gullies on Bakewell Drive were placed on a Targeted Gully Cleansing Regime for more regular maintenance to help reduce future surface water flooding. [TAB] (p17)</p></div><div class="nugget-popup"><p>Residential properties on Bakewell Drive were flooded internally; external areas were also extensively flooded as drainage and public sewers were overwhelmed by intense rainfall. (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>25 properties (p5)</p></div><div class="nugget-popup quant"><p>25 properties; external flooding depths between 127mm and 1200mm; of which 2 are social housing managed by Nottingham City Homes [IMG,PAG] (p14)</p></div><div class="nugget-popup quant"><p>25 properties [TAB] (p15)</p></div><div class="nugget-popup quant"><p>2 properties (both properties required complete renovation) (p16)</p></div><div class="nugget-popup quant"><p>31 residential properties (across Bakewell Drive, Tenter Close and Tobias Close) (p20)</p></div></div></body></div>`)[0];

                var html_3dfe3a1f4582cb5703dda4c8e26f6caf = $(`<div id="html_3dfe3a1f4582cb5703dda4c8e26f6caf" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Tobias Close, Top Valley</h1><div class="nugget-popup"><p>Properties on Tobias Close suffered internal flooding during the intense storm event affecting the Top Valley area. (p3)</p></div><div class="nugget-popup"><p>Internal (over the doorstep) flooding of residential properties on the street. (p5)</p></div><div class="nugget-popup"><p>Properties on Tobias Close were identified as flood locations on the site map and experienced surface&ndash;water/urban flooding draining down the valley, contributing to internal property flooding on the date of the incident. (p7)</p></div><div class="nugget-popup"><p>Area was affected by surface&ndash;water flooding during the flood event on 23rd July 2013. The Environment Agency Flood Map for Surface Water shows Tobias Close at high risk and the report identifies the natural valley/flood flow route passing through this area. (p8)</p></div><div class="nugget-popup"><p>Properties on the street were flooded during and after the intense rainfall on 23 July 2013. Rapid overland flow and ponding conveyed surface water along roads and footpaths toward properties; residents reported roads looking like rivers and water discharging from manholes and road gullies. (p11)</p></div><div class="nugget-popup"><p>Surface water flowed rapidly along the footpath from the subway and ponded in a natural hollow at the front of properties. Water entered through front doorways causing internal flooding. Floodwater was foul&ndash;smelling, indicating mixing of surcharging foul sewer flows with surface water runoff. (p12)</p></div><div class="nugget-popup"><p>Rapid surface water flow ponded in a natural hollow at the front of properties and entered through front doorways causing internal flooding; foul&ndash;smelling water indicates surcharging and mixing of foul sewers with surface runoff. [IMG,PAG] (p13)</p></div><div class="nugget-popup"><p>Downstairs flats experienced internal and external damage to electrics, carpets, floors, doors, walls and furniture. Upstairs flats had damage to doors, carpet, floors and walls in hallways. [TAB] (p15)</p></div><div class="nugget-popup"><p>Intense rainfall produced large volumes of surface water runoff that overwhelmed drainage, causing water to pond in low&ndash;lying areas and enter properties; evidence indicates surface water was unable to drain to highway drainage and sewers contributed to surface water volumes. (p16)</p></div><div class="nugget-popup"><p>During the 23rd July 2013 event surface water was unable to drain effectively into the highway drainage system; gullies on Tobias Close were placed on a Targeted Gully Cleansing Regime for more regular maintenance to help reduce future surface water flooding. [TAB] (p17)</p></div><div class="nugget-popup"><p>Residential properties on Tobias Close were flooded internally; external areas were extensively flooded when heavy rainfall saturated the ground and overwhelmed drainage and public sewers. (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 properties (p5)</p></div><div class="nugget-popup quant"><p>4 properties; 530 mm depth (p12)</p></div><div class="nugget-popup quant"><p>4 properties; water depth up to 530 mm (externally and internally on ground&ndash;floor properties) [IMG,PAG] (p13)</p></div><div class="nugget-popup quant"><p>4 properties (of which 2 are social housing managed by Nottingham City Homes) [TAB] (p15)</p></div><div class="nugget-popup quant"><p>31 residential properties (across Bakewell Drive, Tenter Close and Tobias Close) (p20)</p></div></div></body></div>`)[0];

ass="nugget-popup"><p>Internal flooding required complete renovation of the downstairs of both properties, including replacement/repair of flooring, kitchens, walls, doors, plaster and furniture. [TAB] (p15)</p></div><div class="nugget-popup"><p>Intense rainfall produced large volumes of surface water runoff that overwhelmed drainage, causing water to pond in low&ndash;lying areas and enter properties; evidence indicates surface water was unable to drain to highway drainage and sewers contributed to surface water volumes. (p16)</p></div><div class="nugget-popup"><p>Surface water was unable to drain into the highway drainage and sewers flooded and contributed to surface water volumes on Tenter Close; gullies on Tenter Close were placed on a Targeted Gully Cleansing Regime for more regular maintenance. [TAB] (p17)</p></div><div class="nugget-popup"><p>Residential properties on Tenter Close were flooded internally; external areas were extensively flooded as drainage capacity and sewers were exceeded by intense rainfall. (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 properties (p5)</p></div><div class="nugget-popup quant"><p>2 properties (p13)</p></div><div class="nugget-popup quant"><p>2 properties [TAB] (p15)</p></div><div class="nugget-popup quant"><p>31 residential properties (across Bakewell Drive, Tenter Close and Tobias Close) (p20)</p></div></div></body></div>`)[0];

kitchens, walls, doors, plaster, furniture). Evidence indicates sewers were also surcharging and contributing to surface&ndash;water volumes. (p16)</p></div><div class="nugget-popup"><p>The low&ndash;lying Top Valley area experienced internal flooding of residential properties and extensive external flooding after intense rainfall saturated the ground and filled available storage in underground drainage and sewers. (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>31 properties (p3)</p></div><div class="nugget-popup quant"><p>2 properties (p16)</p></div><div class="nugget-popup quant"><p>31 residential properties (across Bakewell Drive, Tenter Close and Tobias Close) (p20)</p></div></div></body></div>`)[0];
