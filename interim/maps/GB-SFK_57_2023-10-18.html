                var html_261d7e61c34f9e3ea2a9083670d5fba4 = $(`<div id="html_261d7e61c34f9e3ea2a9083670d5fba4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Fen Street</h1><div class="nugget-popup"><p>Fen Street is marked as a water feature on the investigation map. During the extreme rainfall from Storm Babet (20 October 2023) mapped water features like this are likely to have formed flow paths through the community and could have contributed to local flooding; the context implies water features were considered probable flooding sources but does not explicitly record specific impacts to Fen Street. [IMG] (p7)</p></div><div class="nugget-popup"><p>The River Deben overtopped its banks onto the floodplain and flooded properties from the rear; surface water also travelled from the road northwards, surrounding properties which sit lower than the road. [IMG] (p28)</p></div></div></body></div>`)[0];

                var html_b6466e11290f3c391785b0b542aab9c1 = $(`<div id="html_b6466e11290f3c391785b0b542aab9c1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Deben</h1><div class="nugget-popup"><p>The River Deben was in flood during the event; when natural flow routes converged with the river (which was in flood) this contributed to internal flooding of property, infrastructure and services in Debenham. (p4)</p></div><div class="nugget-popup"><p>The River Deben is a mapped watercourse within the investigation area and, given the extreme rainfall from Storm Babet (20 October 2023), is identified as a plausible flooding source and potential flow path that may have contributed to flooding in Debenham. The report focuses on probable flooding sources and flow paths through the community, so the river is likely relevant to those discussions (impact not explicitly confirmed in the supplied text). [IMG] (p7)</p></div><div class="nugget-popup"><p>Described as the main river system with tributaries flowing into Debenham; fluvial sources from the river system contributed to flood water approaching Debenham during Storm Babet. [PAG] (p8)</p></div><div class="nugget-popup"><p>The principal channel through Debenham; fluvial flooding from the River Deben (together with its tributaries and surface&ndash;water run&ndash;off) contributed to elevated water levels in the village and to internal flooding of properties during Storm Babet. [PAG,IMG] (p9)</p></div><div class="nugget-popup"><p>The river Deben overtopped and flowed south down Chancery Lane and Aspall Road, contributing to flooding that entered properties, damaged cars and buildings and required evacuations. [PAG] (p18)</p></div><div class="nugget-popup"><p>The River Deben overtopped its banks and was the primary source of the flows that travelled south along Aspall Road and Chancery Lane, through Water Lane and Priory Lane, contributing to flooding of central Debenham; floodwater was contaminated with sewage and oil. (p22)</p></div><div class="nugget-popup"><p>The River Deben reached/exceeded capacity and, along with Cherry Tree Brook being overwhelmed, forced water back north along an ordinary watercourse bordering properties' rear gardens on the High Street, causing those watercourses to be quickly overwhelmed and contributing to internal flooding of properties. (p24)</p></div><div class="nugget-popup"><p>Rising River Deben levels submerged outfall pipes that discharge into Cherry Tree Brook, severely restricting drainage capacity and contributing to backing up of floodwater into gardens and properties. [IMG] (p26)</p></div><div class="nugget-popup"><p>The River Deben exceeded its capacity and overtopped its banks onto the floodplain, leading to flooding of properties (notably at Fen Street) from the rear. [PAG,IMG] (p28)</p></div><div class="nugget-popup"><p>High flows on the River Deben were recorded and reviewed by the Environment Agency in the context of impacts experienced in the Debenham community; this prompted a review and refinement of flood alert and warning trigger thresholds for Debenham and updates to the River Levels online information. [TAB,PAG] (p37)</p></div><div class="nugget-popup"><p>High flows on the River Deben and its tributaries during the wet autumn/winter contributed to flooding concerns. This led to a review of early&ndash;warning systems for river levels, refinement of flood alert and warning trigger thresholds by the Environment Agency, updates to River Levels data published online, and recognition of the benefit of clearing pinch points in the river channel. (p38)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 70 residential and commercial properties internally flooded (in Debenham as a result of river and surface water flooding) (p4)</p></div><div class="nugget-popup quant"><p>25 properties; internal water depths ranging from 5cm to 45cm [PAG] (p18)</p></div><div class="nugget-popup quant"><p>24 properties affected in the area; internal flooding depths 20 cm to over 90 cm; external flood water over 150 cm (p22)</p></div><div class="nugget-popup quant"><p>24 properties; 15cm to over 60cm of internal flooding (p24)</p></div></div></body></div>`)[0];

                var html_8600ba87a03bacae3e74626f11a1ae42 = $(`<div id="html_8600ba87a03bacae3e74626f11a1ae42" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Water Lane, Debenham</h1><div class="nugget-popup"><p>Flooding began at around 10:00 at the northern part of Water Lane from run&ndash;off from surrounding fields and overtopping of the river; floodwater was reported contaminated with sewage and oil, indicating an overwhelmed foul sewer system. (p21)</p></div><div class="nugget-popup"><p>Flooding began at around 10:00 at the northern part of Water Lane as runoff from surrounding fields combined with River Deben overtopping; floodwater was reported contaminated with sewage and oil (indicative of an overwhelmed foul sewer). Emergency access was compromised and vulnerable residents required rescues by boat. [PAG] (p22)</p></div><div class="nugget-popup"><p>Watercourses near Water Lane were overwhelmed and contributed to flows that overwhelmed highway drainage and led to flooding of the highway and properties in lower Debenham. [PAG] (p23)</p></div><div class="nugget-popup"><p>Acted as a flow path carrying surface water toward lower Debenham where flows merged and contributed to inundation of the central area; highway drainage was overwhelmed along these routes. (p24)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>24 properties affected in the area; internal flooding depths 20 cm to over 90 cm; external flood water over 150 cm [PAG] (p22)</p></div></div></body></div>`)[0];

                var html_a98079de110e0a5062f581fb5b154908 = $(`<div id="html_a98079de110e0a5062f581fb5b154908" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Priory Lane, Debenham</h1><div class="nugget-popup"><p>Floodwater from the overtopped watercourse ran down Priory Lane; residents reported additional runoff from allotments contributing to the flows, consistent with pluvial (surface water) flooding. [PAG] (p21)</p></div><div class="nugget-popup"><p>Overtopped flow from the River Deben ran down Priory Lane; resident reports indicate additional runoff from allotments contributed. Local watercourse arms and a culvert were noted as overgrown/silted and may have reduced conveyance, exacerbating flooding. (p22)</p></div><div class="nugget-popup"><p>Allotments adjacent to Priory Lane experienced significant surface water runoff during the event. Highway drainage was overwhelmed in the area; culverts and local watercourses were identified as potentially not working to full capacity, contributing to faster runoff from surrounding land into Priory Lane. [PAG] (p23)</p></div><div class="nugget-popup"><p>Part of the eastern/western flow path network feeding the lower village; overland flows from this route contributed to the congregation of floodwater in lower Debenham and to overwhelmed highway drainage. (p24)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>24 properties affected in the area; internal flooding depths 20 cm to over 90 cm; external flood water over 150 cm (p22)</p></div></div></body></div>`)[0];

                var html_55517f2730d2a2e305125dd09e77848e = $(`<div id="html_55517f2730d2a2e305125dd09e77848e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>High Street, Debenham</h1><div class="nugget-popup"><p>Properties on High Street experienced internal flooding after highway drainage and the foul sewerage network were overwhelmed. Flood water from an adjacent low&ndash;lying flood plain and converging flows from Cherry Tree Brook and other flow paths entered the highway and flowed into properties; vehicle bow waves were reported to have caused further ingress by breaching doorsteps. (p23)</p></div><div class="nugget-popup"><p>Properties on the High Street were flooded from both the front (highway/overland flows) and the rear (an ordinary watercourse forced north when Cherry Tree Brook and the River Deben were overwhelmed), producing rapid overwhelming of the rear watercourse and internal flooding of dwellings. (p24)</p></div><div class="nugget-popup"><p>As flow passed along Low Road it met the High Street, where water accumulated before flowing south out of the catchment. Accumulation occurred because highways drainage and sewer systems reached capacity, contributing to flooding of nearby properties and the local highway acting as a flow route. (p26)</p></div><div class="nugget-popup"><p>Floodwater covered the entire street, reaching the base of buildings and partially submerging vehicles, causing obstruction to traffic and damage to street&ndash;level property and vehicles. (p33)</p></div><div class="nugget-popup"><p>High Street was subject to surface water flooding with multiple vehicles partially submerged and the roadway covered by water, rendering the street impassable and disrupting traffic. [PAG] (p35)</p></div><div class="nugget-popup"><p>Residential yards and gardens inundated; floodwater reached at least knee height, overtopped a wooden fence and extended to the vicinity of a brick house. Residents were forced to wade through water and carry children and belongings to safety. [PAG] (p36)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>24 properties; 15 cm to over 60 cm internal flooding (p24)</p></div><div class="nugget-popup quant"><p>23 properties (area, including adjacent streets) ; internal flooding depths between 15cm and 90cm; external depths over 90cm (p26)</p></div></div></body></div>`)[0];

                var html_becccaba22ffd1c29c8174314cba63ed = $(`<div id="html_becccaba22ffd1c29c8174314cba63ed" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Suffolk</h1><div class="nugget-popup"><p>Storm Babet (18&ndash;21 October 2023) caused significant disruption to communities across Suffolk; widespread flooding impacts occurred in the county with severe impacts in Debenham. [PAG] (p4)</p></div><div class="nugget-popup"><p>During Storm Babet (October 2023) Suffolk experienced the heaviest rainfall across East Anglia, producing saturated catchments, rapidly rising river systems and significant flooding that disrupted travel and inundated communities and properties in the county. [PAG] (p6)</p></div><div class="nugget-popup"><p>During Storm Babet (20 October 2023) significant rainfall on already saturated ground caused internal flooding to residential and commercial properties across the county; the investigation is focused on Debenham and surrounding areas to assess sources, flow paths and affected receptors. [IMG,PAG] (p7)</p></div><div class="nugget-popup"><p>Storm Babet (20 October 2023) produced significant rainfall across Suffolk, resulting in internal flooding to residential and commercial properties across the county from various flooding sources. [PAG] (p8)</p></div><div class="nugget-popup"><p>Storm Babet produced intense rainfall on already saturated ground across Suffolk, causing internal flooding to residential and commercial properties countywide. Floodwaters approached communities from both fluvial (river/tributary) and pluvial (surface water runoff) sources. Debenham, within Suffolk, reported over seventy properties with internal flooding. [PAG,IMG] (p9)</p></div><div class="nugget-popup"><p>Suffolk County Council (Highways Authority) carried out a recorded gully cleanse in December 2023 and an unrecorded visit shortly after the storm; overhauled inspection and cleansing routines to prioritise known flood&ndash;risk areas and scheduled the next visit to Debenham for July 2024. [TAB,PAG] (p37)</p></div><div class="nugget-popup"><p>The county experienced impacts from river high flows and surface&ndash;water flooding during the wet autumn/winter, prompting county&ndash;wide changes: overhaul of gully inspection/cleansing routines across Suffolk, prioritisation of known flood locations, promotion of PFR grant uptake, and increased channel maintenance and reporting to reduce flood risk. River Levels data and warning thresholds have been updated for public viewing. [PAG] (p38)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 70 properties [PAG,IMG] (p9)</p></div></div></body></div>`)[0];

                var html_0953360c04953fe5d78f8adb9c2eab4e = $(`<div id="html_0953360c04953fe5d78f8adb9c2eab4e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>East Anglia</h1><div class="nugget-popup"><p>During Storm Babet (mid&ndash;late October 2023) intense rainfall caused rivers across catchments to rise rapidly and widespread surface water flooding. The event produced significant flooding of roads and properties, with many river level gauging stations showing flows close to or exceeding their highest on record. [IMG,PAG] (p6)</p></div><div class="nugget-popup"><p>Storm Babet (20 October 2023) is described as an extreme event affecting the region; heavy rainfall led to flooding impacts in parts of the region (including Suffolk) during the event. (p7)</p></div></div></body></div>`)[0];

                var html_c0fd99d94eb863283d04680bdae48ff7 = $(`<div id="html_c0fd99d94eb863283d04680bdae48ff7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Debenham</h1><div class="nugget-popup"><p>Debenham was one of the most severely impacted locations: intense rainfall overwhelmed five natural flow routes and the design capacity of drainage infrastructure; flows converged with the River Deben (which was in flood) causing internal flooding of properties, infrastructure and services. (p4)</p></div><div class="nugget-popup"><p>Internal flooding to properties (residential and commercial) in the village during the Storm Babet event; the investigation focuses on Debenham to assess probable flooding sources, observed flow paths and affected receptors. [IMG,PAG] (p7)</p></div><div class="nugget-popup"><p>Debenham was significantly impacted during Storm Babet: much of the flood water approached from fluvial and pluvial sources (and both combined). Over seventy properties reported internal flooding; properties were flooded before a flood warning was issued due to rapid overland flows. [PAG] (p8)</p></div><div class="nugget-popup"><p>The village experienced combined fluvial and pluvial flooding during Storm Babet. Flood waters approached from tributaries (Aspall Watercourse, Derry Brook, Cherry Tree Brook) and overland flow, causing rapid rises in water within the village. Internal flooding was reported in residential and commercial properties; the Environment Agency flood warning based on the Aspall gauge was issued after flooding had already occurred. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>Pluvial (surface water) and fluvial impacts in the village: low&ndash;lying central Debenham receives runoff from five major flow paths that converge on the River Deben, causing the village to retain (attenuate) floodwater until it can discharge to the south. Multiple streets are shown as at risk of flooding (Chancery Lane, Aspall Road, Water Lane, Priory Lane, High Street, Kenton Road, Low Road). Infrastructure and watercourses can be overwhelmed during significant storm events. [IMG,PAG] (p14)</p></div><div class="nugget-popup"><p>Surface water runoff and overland flow occurred during Storm Babet when soils were at low permeability, contributing to flood flows in and around the village. [IMG,PAG] (p15)</p></div><div class="nugget-popup"><p>Floodwaters from surrounding fields and ordinary watercourses (via a box culvert north of the village) overwhelmed drainage assets and flowed into the village. Flood flows from Bellwell Lane converged with village floodwater; a small number of properties in the village were reported flooded. [PAG] (p16)</p></div><div class="nugget-popup"><p>Flows from upstream watercourses and runoff converged in Debenham village; drainage assets (including a culvert under Bellwell Lane) were overwhelmed or impeded, causing floodwater to enter the village, inundating roads and properties. [PAG] (p17)</p></div><div class="nugget-popup"><p>The northern part of the town experienced converging surface water and river flows; overtopping of the River Deben and runoff from surrounding fields led to flooding of roads and properties (notably Aspall Road and Chancery Lane), property and vehicle damage, and evacuations. Local concerns included ineffective attenuation on new developments and obstructed watercourses exacerbating highway flooding. [IMG] (p19)</p></div><div class="nugget-popup"><p>The central village catchment received flow from the west and north as the Derry Brook overtopped and surrounding watercourses were overwhelmed. Roads acted as secondary flow paths, leading to internal flooding of properties in the village and deep external flooding that submerged vehicles; adjacent streets including Aspall Road and Chancery Lane were also affected. [PAG] (p20)</p></div><div class="nugget-popup"><p>Overtopping of the Derry Brook caused highways to act as secondary flow paths, sending floodwater into the central village catchment and adjoining streets; floodwater entered properties causing internal flooding and externally reached depths sufficient to fully submerge cars. (p21)</p></div><div class="nugget-popup"><p>Central Debenham experienced flooding from an overtopped River Deben combined with surface&ndash;water runoff from surrounding fields and developments. Floodwater was reported contaminated with sewage and oil (indicative of an overwhelmed foul sewer system). Vulnerable residents were rescued by boat and emergency services had difficulty reaching customers. [IMG] (p22)</p></div><div class="nugget-popup"><p>Lower Debenham (central area around the High Street) was inundated by confluent overland flows from Cherry Tree Brook, highway flow paths (Water Lane/Green Cross/Priory Lane) and local green space; highway drainage was overwhelmed and internal property flooding occurred. 24 properties in the area were affected, with reported internal depths of 15 cm to over 60 cm. (p24)</p></div><div class="nugget-popup"><p>Cherry Tree Brook and local watercourses were overwhelmed; outfall pipes became submerged by rising river levels so drainage was restricted and floodwater backed into gardens and properties. The highway acted as a secondary flow path (Low Road and Cherry Tree Lane), surrounding properties and causing water to enter buildings. Commercial and residential properties, local emergency services stations and charitable centres sustained significant damage; offices, farm buildings and workshops were affected with flood depths recorded around 45 cm. [IMG] (p26)</p></div><div class="nugget-popup"><p>Significant rainfall overwhelmed drainage networks in western Debenham; flow paths converged through streets and towards lower&ndash;lying areas, contributing to localised flooding of properties and critical points (flow convergence near public infrastructure). [IMG] (p27)</p></div><div class="nugget-popup"><p>Highways drainage and sewage systems were overwhelmed in parts of western Debenham (Gracechurch/Henry Street), with potential localised blockages contributing to flooding; in southern Debenham the River Deben exceeded capacity and overtopped onto the floodplain, flooding nearby properties. [PAG,IMG] (p28)</p></div><div class="nugget-popup"><p>Central Debenham was flooded during the event; residents in central Debenham required rescue by boat as floodwaters rendered areas impassable. [PAG] (p29)</p></div><div class="nugget-popup"><p>Residential streets and gardens were inundated with deep floodwater, requiring residents to be evacuated or rescued by boat; houses and fences shown partially submerged and daily life disrupted. (p30)</p></div><div class="nugget-popup"><p>The village experienced surface&ndash;water/urban flooding affecting streets (The Butts / High Street) and causing internal flooding in at least one residential property (living room water covering the floor and submerging lower parts of furniture). [IMG,PAG] (p34)</p></div><div class="nugget-popup"><p>Residential areas and streets in Debenham experienced surface water flooding: gardens were inundated and public roads became impassable in places, causing disruption to local access and risk to property. [PAG] (p35)</p></div><div class="nugget-popup"><p>Residential area experienced external flooding (including High Street) with yards and gardens inundated, residents wading through knee&ndash;deep water and moving children and belongings; nearby residential structures and landscaping were affected. [PAG] (p36)</p></div><div class="nugget-popup"><p>Experienced high river flows and local surface&ndash;water flooding associated with Storm Babet (mid&ndash;late October 2023). Impacts prompted Environment Agency review of warning thresholds and community/agency clearance of blockages and debris from watercourses. [TAB,PAG] (p37)</p></div><div class="nugget-popup"><p>Debenham experienced river flooding and surface&ndash;water/urban flooding associated with the wet autumn event. The impacts on the community prompted analysis of gauged water&ndash;level data and refinement of flood alert/warning trigger levels. Actions taken in response included a recorded gully cleanse in December 2023 and an unrecorded highways visit shortly after the storm, updates to River Levels on the internet, and an overhaul of inspection and cleansing routines for gullies and drains. [MUL] (p38)</p></div><div class="nugget-popup"><p>High river flows during the wet autumn/winter period caused flooding that affected the local community in Debenham. Impacts prompted community engagement sessions with agencies and landowners, and coordinated removal of obvious river blockages (trees/branches/flood debris). Flood warning and alert trigger thresholds for Debenham were refined and River Levels online data were updated to improve timeliness and accuracy of warnings. [PAG] (p39)</p></div><div class="nugget-popup"><p>Properties in the village flooded internally during Storm Babet. Community volunteers, riparian owners and agencies removed obvious blockages (trees/branches/flood debris) as part of the immediate response. Progress has been made to install Property Flood Resilience measures to properties previously identified at greatest flood risk. [TAB,PAG] (p40)</p></div><div class="nugget-popup"><p>Properties in the village flooded internally during Storm Babet; channel silt/soil and contributing flows from the three main upstream tributaries were identified as factors being investigated as exacerbating local flood risk. (p43)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 70 residential and commercial properties internally flooded (p4)</p></div><div class="nugget-popup quant"><p>over seventy properties [PAG] (p8)</p></div><div class="nugget-popup quant"><p>over seventy properties [IMG,PAG] (p9)</p></div><div class="nugget-popup quant"><p>5 major flow routes; 7 streets shown at risk for flooding [IMG,PAG] (p14)</p></div><div class="nugget-popup quant"><p>25 properties; internal water depths 5 cm to 45 cm [IMG] (p19)</p></div><div class="nugget-popup quant"><p>5 properties across the four roads; 35 cm internal depths; four roads [PAG] (p20)</p></div><div class="nugget-popup quant"><p>5 properties; internal depths 35 cm (p21)</p></div><div class="nugget-popup quant"><p>24 reports of affected properties; internal flooding depths 20 cm to over 90 cm; external flood water over 150 cm [IMG] (p22)</p></div><div class="nugget-popup quant"><p>24 properties; 15 cm to over 60 cm internal flooding (p24)</p></div><div class="nugget-popup quant"><p>23 properties; internal flooding depths 15 cm&ndash;90 cm; external depths over 90 cm; ≈45 cm recorded affecting offices, farm buildings and workshops [IMG] (p26)</p></div><div class="nugget-popup quant"><p>23 properties [IMG] (p27)</p></div><div class="nugget-popup quant"><p>four people; one small boat (p30)</p></div><div class="nugget-popup quant"><p>1 residential property internally flooded; 2 parked cars partially submerged [IMG,PAG] (p34)</p></div><div class="nugget-popup quant"><p>10 properties [TAB,PAG] (p40)</p></div></div></body></div>`)[0];
