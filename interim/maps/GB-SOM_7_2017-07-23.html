                var html_d3e6ebf2a49c83280242bb377a4b8008 = $(`<div id="html_d3e6ebf2a49c83280242bb377a4b8008" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ilminster</h1><div class="nugget-popup"><p>On 2017&ndash;07&ndash;23 intense rainfall produced surface water run&ndash;off into the town centre causing internal flooding to approximately 10 properties (maximum internal depth ~200 mm). Internal flooding lasted about 2&ndash;3 hours for properties. Strategic infrastructure (the highway in the town centre) was also affected by surface water flooding, with highway flooding present for up to about 1 hour. [PAG] (p4)</p></div><div class="nugget-popup"><p>A flood event at Ilminster on 2017&ndash;07&ndash;23 was investigated by Somerset County Council. The town centre (which sits in a hollow) experienced surface water/urban flooding during the event. Past and local impacts include flooding at Ditton Street attributed to the capacity of the culvert on the Shudrick Stream (culverted between the Tesco carpark on Shudrick Lane and Lamplighters on Wharf Lane), which affected local drainage and contributed to flooding in the town centre. [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>On 2017&ndash;07&ndash;23 Ilminster experienced intense rainfall (25 mm in under one hour) causing surface water flooding across the town; highways and multiple streets were inundated and properties were flooded in the town during the event. [PAG] (p11)</p></div><div class="nugget-popup"><p>On 2017&ndash;07&ndash;23 intense rainfall (about 25 mm in <1 hour) produced fast surface water run-off through the town. Runoff flowed down Old Road across the High Street into North Street, across into Silver Street and into Ditton Street where flows were described as 'intense' and 'like a river' and flooded properties; water overflowed from a manhole outside 14b Ditton Street. Water pooled at the southern end of North Street (junction with Silver Street, East Street and Ditton Street) and extensively outside the Tesco filling station on Ditton Street between Shudrick Lane and Orchard Vale, where additional silt-laden runoff from Listers Hill worsened flooding. Runoff from the northern slopes of Pretwood Hill passed through Shudrick Lane car park and threatened properties on Ditton Street from the rear. Surface water also flowed down New Road across the High Street into West Street and down Court Barton into Wharf Lane, where a number of properties were directly affected. Numerous community reports indicated highway drainage was restricted and unable to accept flows. Reports to Wessex Water referenced sewer-system impacts but none were classified as reportable sewer flooding incidents. [PAG,IMG] (p13)</p></div><div class="nugget-popup"><p>A pluvial (surface water) flood occurred on 2017&ndash;07&ndash;23 after a particularly intense 30&ndash;minute downpour. The extreme rainfall saturated and/or overwhelmed the urban drainage system and surrounding Beacon Hill catchment, producing localised surface&ndash;water/urban flooding across Ilminster. [PAG,IMG] (p17)</p></div><div class="nugget-popup"><p>The town experienced pluvial (surface water) flooding on 2017&ndash;07&ndash;23 caused by an intense short&ndash;duration rainfall event on an already&ndash;saturated, largely impermeable catchment. Surface water exceeded drainage capacity and inundated low&ndash;lying areas of the town. [PAG] (p18)</p></div><div class="nugget-popup"><p>Multiple properties experienced internal flooding during the 2017&ndash;07&ndash;23 event. Residents identified roads with blocked, partially blocked or surging gullies contributing to local flooding; actions recommended include gully cleansing, review of gully cleansing frequency (notably Ditton Street and surrounding roads), and Property Level Resilience/Protection (PLR) inspections and potential PLR works for properties that flooded. The report also recommends reviewing and supporting local community flood response and the local flood plan. [TAB] (p20)</p></div><div class="nugget-popup"><p>The town experienced surface/urban flooding that led to blocked gullies and silt deposition. This triggered a reactive gully&ndash;cleansing programme targeting North Street, Market Square, East Street, Silver Street, Ditton Street and Shudrick Lane (programme commenced 2017&ndash;09&ndash;11; initial works complete), a recommendation to CCTV the culvert from Shudrick Lane to Wharf Lane to check for obstructions or damage caused by increased flow, and clearance of a silt&ndash;trap on Old Road adjacent to The Bell Inn (twenty&ndash;four bags of sediment removed). (p21)</p></div></div></body></div>`)[0];
