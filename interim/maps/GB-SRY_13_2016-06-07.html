fied impacts</i><div class="nugget-popup quant"><p>over 86 internal property floods; 63 external floods; 40 roads/road sections affected [IMG,PAG] (p6)</p></div><div class="nugget-popup quant"><p>86 internal property floods; 63 external floods; 40 roads/road sections affected; 7 road closures (p7)</p></div><div class="nugget-popup quant"><p>4 roads (wetspots) recorded in the catchment within Tandridge [PAG,IMG] (p26)</p></div><div class="nugget-popup quant"><p>4 roads (Queen's Park Road; Money Road; Banstead Road; Ninehams Road / Stites Hill Road); internal flooding reported at Park Road and Court Road [IMG] (p27)</p></div></div></body></div>`)[0];

                var html_1f5f617ef83e7f03785e700ceb2ec092 = $(`<div id="html_1f5f617ef83e7f03785e700ceb2ec092" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Surrey</h1><div class="nugget-popup"><p>Emergency Management (Surrey Contact Centre) received calls and convened an emergency meeting to assess the developing situation and request setup of a rest centre. Adult Social Care prioritised response to key locations and carried out a vulnerable people search. Surrey Highways coordinated emergency highway response, instructed contractors to attend, and implemented actions including an emergency road closure. Conway tankers were coordinated by SCC Highways and TDC to support pumping and response. (p15)</p></div><div class="nugget-popup"><p>Surrey County Council (Surrey Highways) carried out joint investigations of the piped watercourse/surface water sewer (including ownership and maintenance); the Money&ndash;Pit was surveyed and maintenance work was carried out as part of recovery from the flood. (p19)</p></div></div></body></div>`)[0];

                var html_a26d424f30009f55731dbd16666bd0ba = $(`<div id="html_a26d424f30009f55731dbd16666bd0ba" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Caterham On the Hill</h1><div class="nugget-popup"><p>Town experienced a flood incident that is the subject of the Section 19 flood investigation report. (p1)</p></div><div class="nugget-popup"><p>Surface&ndash;water flooding occurred in the Caterham Valley area during the intense storm on 7 June 2016. [IMG,PAG] (p6)</p></div><div class="nugget-popup"><p>Localised surface&ndash;water flooding occurred in the Caterham on the Hill area as a result of the intense storm on 7th June 2016; flooding was caused by very high short&ndash;duration rainfall and rapid runoff in the town/catchment. [PAG] (p7)</p></div><div class="nugget-popup"><p>The upper settlement (Caterham on the Hill area) was subject to an intense convective rainfall event on 7th June 2016 that produced rapid surface water runoff within the Caterham on the Hill catchment. The report identifies the area as being on the flow route for surface water draining northwards (via piped routes) toward Croydon and highlights a high modelled risk of surface water flooding for this locality. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>The town experienced flooding during the event on 7 June 2016. (p12)</p></div><div class="nugget-popup"><p>Experienced flash surface&ndash;water flooding on 7 June 2016; members of the public phoned emergency services about the severity of the flooding and blue light responders attended the flooded area. (p14)</p></div><div class="nugget-popup"><p>Intense rainfall produced widespread surface water flooding across Caterham on the Hill which hydraulically overloaded the sewer network, causing internal sewer flooding and requiring Thames Water attendance and pumping. Some locations experienced very deep standing water; highways were disrupted (including an emergency road closure of Ninehams Road) and responders carried out emergency actions to manage traffic and drainage. [PAG] (p15)</p></div><div class="nugget-popup"><p>Residential and local highway impacts from flooding: properties were flooded or displaced residents required assistance; flood&ndash;damaged furniture and rubbish was removed from homes; debris was present on roads and alleyways requiring additional street cleaning; recovery and multi&ndash;agency investigations were initiated across the catchment. [PAG] (p19)</p></div><div class="nugget-popup"><p>Flash flooding along the piped watercourse/surface water sewer affected the town: road network disruption, evacuations of vulnerable people and school closures were part of the incident response. [PAG] (p20)</p></div><div class="nugget-popup"><p>Surface water runoff and surcharging of the sewer system caused flooding in the Caterham on the Hill area, resulting in internal sewer flooding of properties and prompting multi&ndash;agency investigations and resident engagement. [PAG] (p21)</p></div><div class="nugget-popup"><p>Properties in the Caterham on the Hill area were identified as being at risk of flooding; a Flood Action Group was established to coordinate RMAs and residents and to develop resilience measures for affected properties. [PAG] (p22)</p></div><div class="nugget-popup"><p>Surface water flooding and surface&ndash;water flow along the Caterham on the Hill piped watercourse / storm route affected the town. Historic highway flooding (wetspots) are recorded in the Caterham on the Hill area and there are recorded instances of internal property flooding in streets within the town; the Money Pit structure on the piped watercourse (adjacent to St Michaels Road) was inspected and being cleaned as part of the response. [IMG] (p26)</p></div><div class="nugget-popup"><p>The Caterham on the Hill catchment (upper reach in Caterham) experienced intense convective rainfall on 7 June 2016 that produced rapid surface water runoff along the piped watercourse/surface water sewer. This resulted in surface water flooding with recorded historic highway flooding (wetspots) on local roads and reports of internal flooding on streets within the catchment. [IMG,PAG] (p27)</p></div><div class="nugget-popup"><p>Intense, localized rainfall on 7 June 2016 (radar&ndash;observed catchment totals of ~77.6 mm over ~2.5 hours; local station 72.6 mm in 2 hours) produced surface&ndash;water/urban flooding in the Caterham on the Hill catchment. The flow route is a piped watercourse/surface water sewer draining northwards; the catchment and its highway drainage assets were the subject of a Section 19 investigation. The catchment has known historic highway wetspots at Queen's Park Road, Money Road, Banstead Road and Ninehams Road / Stites Hill Road, and previous reports of internal property flooding in Park Road and Court Road (historic locations referenced by the investigation). (p28)</p></div><div class="nugget-popup"><p>Surface&ndash;water flooding on 7 June 2016 caused property impacts across the town. Local authority response included two Flood Forum surgeries (13 and 28 June) with multiple agencies, a council meeting for residents of Hillcroft Court to assist 18 impacted properties, provision of council tax discounts for displaced households, approximately 70 residents contacting the council for assistance (requests for sandbags, bulky waste collection, council tax enquiries, flood advice) with about 27 follow&ndash;ups, an Emergency Parking Order in Park Road to enable contractor parking, additional street cleaning to remove flood debris, and press communications. (p31)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 40 calls on 7th June; a further 40 calls on 8th June; surface water depths in excess of 900mm in some locations; 11 emergency actions on 7th June; 1 emergency road closure (Ninehams Road); 13 Conway tankers deployed in the area [PAG] (p15)</p></div><div class="nugget-popup quant"><p>18 properties impacted (Hillcroft Court); ~70 residents contacted the Council; 21 bulky waste collections; 13 roads cleaned; 3 skips [PAG] (p19)</p></div><div class="nugget-popup quant"><p>7 road closures; 40 roads affected; 5 schools closed [PAG] (p20)</p></div><div class="nugget-popup quant"><p>4 roads (wetspots); internal flooding reported on 2 streets (Park Road and Court Road) [IMG] (p26)</p></div><div class="nugget-popup quant"><p>4 roads (Queen's Park Road; Money Road; Banstead Road; Ninehams Road / Stites Hill Road); internal flooding reported at Park Road and Court Road [IMG,PAG] (p27)</p></div><div class="nugget-popup quant"><p>approximately 70 residents contacted the Council; approx. 27 residents were called back; 18 properties impacted (p31)</p></div></div></body></div>`)[0];
                popup_e0a6765e436ec312149f6573b15d7565.setContent(html_a26d424f30009f55731dbd16666bd0ba);

                var html_169ce82f1892150fab7de7e64fda3dc3 = $(`<div id="html_169ce82f1892150fab7de7e64fda3dc3" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Caterham</h1><div class="nugget-popup"><p>Caterham on the Hill was affected by a localized flash flood on 7 June 2016 which overwhelmed local road and drainage infrastructure. The event caused internal and external property flooding (including sewage in many internal floods), many impassable roads producing traffic gridlock, and multiple road closures. [PAG] (p3)</p></div><div class="nugget-popup"><p>Caterham on the Hill (the catchment focus of the report) was affected by flash surface&ndash;water flooding on 7 June 2016; local road and drainage infrastructure was overwhelmed resulting in internal property flooding (many internal floods included sewage), external property flooding and impassable roads/traffic gridlock. (p4)</p></div><div class="nugget-popup"><p>Part of the Caterham on the Hill catchment that was the focus of the investigation and experienced flooding during the incident; contributed to the internal and external property flooding and road impacts recorded in the catchment. [PAG] (p5)</p></div><div class="nugget-popup"><p>The Caterham on the Hill catchment experienced flooding on 7th June 2016 that affected the local road network and properties. Over 40 roads/road sections were identified as affected; gully&ndash;cleaning and recovery works were carried out (38 roads cleaned). Road damage occurred where a soakaway surcharge damaged the road surface on Seymour Avenue. Properties in Hillcroft Court/Chaldon Road were impacted; sandbags were delivered and bulky&ndash;waste collections and other recovery assistance were provided. [PAG] (p18)</p></div><div class="nugget-popup"><p>Localised intense rainfall caused surface water flooding across the town: properties reported flooded, multiple roads closed and difficult driving conditions; delivery of sandbags was impacted and response resources (tankers) were deployed. [TAB,PAG] (p29)</p></div><div class="nugget-popup"><p>Residential properties and local roads were affected by the flood: sandbags were delivered to affected homes; bulky waste collections and skips were provided to remove flood&ndash;damaged furniture and debris; additional street sweeping and gully&ndash;cleaning were required; multi&ndash;agency recovery meetings and National Flood Forum events were held locally. [TAB] (p30)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 86 internal property floods; 63 external property floods; 40 roads/road sections affected; 7 road closures by the Police; 1 road closure by Surrey County Council Highways [PAG] (p3)</p></div><div class="nugget-popup quant"><p>over 86 internal property floods; 63 external property floods; 40 roads/road sections affected (p4)</p></div><div class="nugget-popup quant"><p>38 roads had gullies cleaned; 18 properties impacted (Hillcroft Court/Chaldon Road); at least 21 bulky waste collections; approximately 70 resident contacts; approximately 27 residents called back [PAG] (p18)</p></div><div class="nugget-popup quant"><p>7 roads closed; 13 tankers in Caterham on the Hill [TAB,PAG] (p29)</p></div></div></body></div>`)[0];
