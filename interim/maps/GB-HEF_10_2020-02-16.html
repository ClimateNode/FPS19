                var html_b097e736b9913b3b9f53b1bf512ab54f = $(`<div id="html_b097e736b9913b3b9f53b1bf512ab54f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Eardisley</h1><div class="nugget-popup"><p>Built&ndash;up parts of the village lie within high flood risk zones (Flood Zone 3) adjacent to the main river; areas to the west and south of the river are the most affected. Local flood defences and a flood storage area are present but do not cover all high&ndash;risk areas. [IMG] (p1)</p></div><div class="nugget-popup"><p>Internal flooding occurred to properties within the village during the key event; sandbags were also delivered to a property (separately noted on 26 October 2019). Some respondents recorded previous flood events (2007, ~13 years prior to report, and one reporting 'almost annually'). [IMG,MUL] (p2)</p></div><div class="nugget-popup"><p>Properties are located in Flood Zone 3 and experienced both fluvial and surface&ndash;water flooding. During the key event properties were internally flooded; watercourses (Willersey Brook and Folly Brook) overflowed, the Folly Brook culvert below Church Road can become overwhelmed causing surface&ndash;water flooding through the village, and flows out of bank on Willersey Brook near the weir caused surface&ndash;water flooding affecting properties alongside the A4111. Cultural heritage is affected: listed properties lie within the flood zone. [MUL] (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>6 properties; depth 6 inches to 1 ft; duration less than 1 day [IMG,MUL] (p2)</p></div><div class="nugget-popup quant"><p>6 internally flooded properties related to key flood event; 22 internally flooded properties during most acute flood; 17 listed properties located within the Flood Zone [MUL] (p3)</p></div></div></body></div>`)[0];
