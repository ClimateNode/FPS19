                var html_efc4f0177a0bb02c665665c9b40f9914 = $(`<div id="html_efc4f0177a0bb02c665665c9b40f9914" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lower Road, Stoke Mandeville</h1><div class="nugget-popup"><p>Carriageway covered by deep surface water during winter 2013/2014; vehicles were forced to drive through floodwater with large splashes, making the road difficult and dangerous to traverse and disrupting local transport. (p1)</p></div><div class="nugget-popup"><p>Lower Road (B4443) in Stoke Mandeville experienced flooding during winter 2013/2014. [PAG] (p3)</p></div><div class="nugget-popup"><p>Surface water flooding occurred during the winter 2013/2014 flood event and prompted a formal flood investigation by Risk Management Authorities (Buckinghamshire CC, AVDC, TfB). The location was highlighted soon after the event as requiring investigation. [IMG,PAG] (p8)</p></div><div class="nugget-popup"><p>Recorded flooding of Lower Road (road inundation) reported by a local resident; surface water inundation affecting the road and nearby properties in the Lower Road area. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>Blockages in the main drainage line on Lower Road contributed to flooding during the heavy rainfall of winter 2013/14. Transport for Buckinghamshire used a heavy duty jetter and gulley crew on several visits, excavated the footway/verge to investigate, and repairs were carried out where blockages could not be cleared by jetter. [MUL] (p14)</p></div></div></body></div>`)[0];
