                var html_cd4ab550e4b9734da14870ae934eaa86 = $(`<div id="html_cd4ab550e4b9734da14870ae934eaa86" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wokingham Unitary Authority</h1><div class="nugget-popup"><p>Recurrent heavy rainfall and high river and groundwater levels caused rivers (including the River Loddon and River Blackwater) to burst banks and added large volumes of water to the Thames floodplain, resulting in widespread internal and external property flooding across multiple parishes within the borough; Lower Thames reached highest levels for more than 65 years. [PAG,IMG] (p8)</p></div><div class="nugget-popup"><p>During the winter 2013/14 (01 Dec 2013 &ndash; 28 Feb 2014) parts of Wokingham Borough experienced multiple sources of flooding: river flooding affected settlements within the borough (notably Wargrave, Shinfield and Charvil); surface water (pluvial) flooding affected areas including Swallowfield and Charvil; sewer flooding occurred in Swallowfield and Hurst; and high groundwater levels in parts of Wokingham contributed to other types of flooding. [PAG] (p12)</p></div><div class="nugget-popup"><p>Winter 2013/14 flooding across Wokingham Borough affected six parishes and multiple villages; properties were flooded both internally and externally and some residents were displaced. Site visits (Sept&ndash;Nov 2014) found a small number of houses still uninhabitable due to flood damage. [PAG] (p14)</p></div><div class="nugget-popup"><p>Experienced fluvial flood warnings and on&ndash;the&ndash;ground impacts during winter 2013/14: roads were flooded and impassable or worsening flooding to properties (prompting road closures), sandbags were supplied to residents, blocked drainage/structures were cleared and pumps used, and some residents suffered sewage backup requiring provision of Portaloos. [PAG] (p15)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>88 properties flooded in the borough total; 40 properties flooded internally; 48 properties flooded externally; approximately 5 houses still uninhabited (site visits Sept&ndash;Nov 2014). [PAG] (p14)</p></div></div></body></div>`)[0];

                var html_211e1757d1ed02629d3f67a31ca01ac2 = $(`<div id="html_211e1757d1ed02629d3f67a31ca01ac2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Thames</h1><div class="nugget-popup"><p>Although the River Thames did not burst its banks in December 2013, unrelenting rainfall through January and February 2014 caused water levels on the Lower Thames to reach their highest level for more than 65 years, adding further water to an already inundated Thames floodplain. (p6)</p></div><div class="nugget-popup"><p>Fluvial (river) flooding along the River Thames during the winter 2013/14 event. Photographs and the parish table identify areas adjacent to the Thames (notably Charvil and Wargrave) among the worst affected in the borough. [TAB,PAG] (p13)</p></div><div class="nugget-popup"><p>Flooding from the River Thames led to external flooding of properties on Thames Drive in Charvil; residents were unable to reach their properties by vehicle for approximately two weeks in January 2014. (p31)</p></div><div class="nugget-popup"><p>The River Thames came out of bank in the Wargrave / Loddon Drive area during the winter 2013&ndash;14 flood event and contributed to prolonged inundation of the island between the Thames, Loddon and St Patricks Stream. Floodwaters persisted in the area and reached substantial depths (estimated up to ~1.3 m at peak), rendering properties inaccessible by car and mixing with sewage discharged downstream. [PAG] (p43)</p></div><div class="nugget-popup"><p>Increased Thames levels contributed floodwater into properties (notably The River House), causing internal flooding. (p44)</p></div><div class="nugget-popup"><p>River Thames came out of bank in the vicinity of Wargrave, contributing to flooding of the village; associated flood warnings were issued for the reach from Shiplake to Wargrave during the event. [PAG,MUL] (p45)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 parishes [TAB,PAG] (p13)</p></div><div class="nugget-popup quant"><p>10 properties (p31)</p></div></div></body></div>`)[0];

                var html_69728220a50dc6dd8695cb200fa6b99a = $(`<div id="html_69728220a50dc6dd8695cb200fa6b99a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Loddon</h1><div class="nugget-popup"><p>Fluvial (river) flooding along the River Loddon during the winter 2013/14 event. Aerial photography and parish reports identified some of the worst&ndash;affected areas along the Loddon, and multiple parishes in the borough (Arborfield, Swallowfield, Shinfield, Charvil and Hurst) were associated with Loddon&ndash;related flooding in the investigation. [TAB,PAG] (p13)</p></div><div class="nugget-popup"><p>Areas along the River Loddon were among the worst affected in the borough; aerial photography and reports indicate the river contributed to flooding of adjacent areas and properties. (p14)</p></div><div class="nugget-popup"><p>River Loddon contributed river flooding to Swallowfield during the winter 2013&ndash;14 event, as one of the sources causing flooding in the village. (p22)</p></div><div class="nugget-popup"><p>The River Loddon came out of bank and flooded the fields to the east and west of the watercourse; the floodwater did not reach properties or highways. (p23)</p></div><div class="nugget-popup"><p>The River Loddon overtopped its banks north of Swallowfield and flooded fields to the east and west of the channel. The flood water did not inundate properties or highways. [PAG] (p24)</p></div><div class="nugget-popup"><p>The River Loddon burst its banks north of the A327 Arborfield Road, sending significant volumes of water toward the road and contributing to flooding of nearby properties and raised water in rear gardens. [PAG] (p28)</p></div><div class="nugget-popup"><p>The River Loddon (Main River) came out of bank during winter 2013&ndash;14, raising lake levels and contributing to flooding of adjacent areas in Charvil, including inundation of lakes, roads and external areas of properties. [PAG] (p32)</p></div><div class="nugget-popup"><p>High water levels on the River Loddon resulted in fluvial flooding that impacted Whistley Mill Lane and nearby properties; debris and fallen trees in the river exacerbated the flooding severity and duration. (p37)</p></div><div class="nugget-popup"><p>Flooding of the River Loddon inundated the Loddon Drive area during the winter 2013&ndash;14 event. Sewage flooding also occurred when sewage was released from the Thames Water Sewage Treatment Works into the flooded River Loddon and when private sewage treatment facilities in individual residences were inundated. (p41)</p></div><div class="nugget-popup"><p>River Loddon came out of bank in the Loddon Drive/Wargrave area during the winter 2013&ndash;14 event, contributing to prolonged flooding of the island and properties. The river had been silted/clogged prior to the event (slowing flows). The downstream sewage treatment works discharged untreated effluent into the River Loddon during the event, so floodwater in the river was contaminated by sewage; private foul drainage in the area was likely inundated. [PAG] (p43)</p></div><div class="nugget-popup"><p>Flooding from the River Loddon flowed across the floodplain into properties (including The River House); flows were reported to be fast with a strong current, making access unsafe. [PAG] (p44)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 parishes [TAB,PAG] (p13)</p></div><div class="nugget-popup quant"><p>six properties (p22)</p></div><div class="nugget-popup quant"><p>2 properties [PAG] (p28)</p></div><div class="nugget-popup quant"><p>4 residential properties affected along Whistley Mill Lane; flood depth approx 1.3 m at Lands End Stables; water remained high for ~3.5 months (p37)</p></div><div class="nugget-popup quant"><p>7 properties [PAG] (p43)</p></div></div></body></div>`)[0];

                var html_8adb50cdace6eec0ba0e5ba63d35777f = $(`<div id="html_8adb50cdace6eec0ba0e5ba63d35777f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Church Lane, Arborfield</h1><div class="nugget-popup"><p>Church Lane was inundated by overland flows collecting in a low point within 200m of the Reading Road junction; the road was covered from that junction to where the lane turns, remained partially flooded from early February into March 2014, and reached a maximum depth of approximately 600mm. A nearby drainage ditch was partially silted and blocked, preventing effective drainage. [PAG] (p17)</p></div><div class="nugget-popup"><p>The first c.200m stretch (from the Reading Road junction) was partially flooded; overland flow from the east and across the adjacent field increased water collecting in this stretch. High groundwater prevented a Main River drainage ditch crossing the field from effectively draining the area. During the winter 2013&ndash;14 event residents observed manhole covers in Church Lane being forced open by flows from the sewers. [PAG] (p18)</p></div><div class="nugget-popup"><p>During the winter 2013&ndash;14 flood event residents observed manhole covers in Church Lane being forced open by flows from the sewers. Properties in Church Lane experienced foul water back&ndash;up during the pumping station failure, leaving occupants unable to use toilets and showers. [PAG] (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>200m stretch of highway; maximum depth approximately 600mm [PAG] (p17)</p></div><div class="nugget-popup quant"><p>200m; manhole covers forced open [PAG] (p18)</p></div></div></body></div>`)[0];

                var html_eece209caa92077d552e140794286f71 = $(`<div id="html_eece209caa92077d552e140794286f71" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Willow Lane, Wargrave</h1><div class="nugget-popup"><p>During the winter 2013&ndash;14 event (early February) the River Thames and the Hennerton Backwater came out of bank and completely inundated Willow Lane. External areas of properties on the western side were flooded by Thames water; properties on the eastern side were externally flooded by Hennerton Backwater combining with Thames flows. The island area containing the properties was overtopped. [PAG] (p41)</p></div><div class="nugget-popup"><p>Flood water from the Thames and Hennerton Backwater channelled along the road, turning Willow Lane into a fast&ndash;flowing quasi&ndash;stream roughly 900 mm deep at times; external areas of properties on the western side were completely flooded, eastern side properties flooded by combined backwater/Thames flows; dangerous fast flows and access loss caused three households to move out early in the event; 17 residential properties suffered internal flooding. (p42)</p></div><div class="nugget-popup"><p>Willow Lane was identified as an area during the winter 2013&ndash;14 flood event and was affected by the river&ndash;flooding incident; the Environment Agency was not present in this area during the event. (p45)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 20 residential properties; 5 commercial properties [PAG] (p41)</p></div><div class="nugget-popup quant"><p>17 residential properties (internal flooding) ; 3 properties (residents moved out) (p42)</p></div></div></body></div>`)[0];

                var html_393bcfedfa9a3441c846c1f7f04020e5 = $(`<div id="html_393bcfedfa9a3441c846c1f7f04020e5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Loddon Drive, Wargrave</h1><div class="nugget-popup"><p>Area was completely inundated by fluvial flooding during the winter 2013&ndash;14 event. The area also experienced sewage flooding caused by release of sewage from the Thames Water Sewage Treatment Works into the flooded River Loddon and by inundation of private sewage treatment facilities at individual residences. (p41)</p></div><div class="nugget-popup"><p>Area (an island between River Thames, St Patricks Stream and River Loddon) was on floodplain and flooded during the winter 2013&ndash;14 event. Floodwater affected properties for over two months from late December through early March, with water estimated up to about 1.3 m at its deepest. Properties were inaccessible by car; residents had to wade (and later water was too deep/fast to walk). Seven properties suffered internal flooding; some private foul drainage systems were likely inundated. Floodwater included untreated sewage discharged from the downstream sewage treatment works. [PAG] (p43)</p></div><div class="nugget-popup"><p>Seven properties along Loddon Drive suffered internal flooding. On both occasions of high water Loddon Drive was impassable to vehicles and residents had to wade through floodwater or use boats to reach properties; raised planks to the railway were used as an access route. [PAG] (p44)</p></div><div class="nugget-popup"><p>Loddon Drive was identified as an area during the winter 2013&ndash;14 flood event and was affected by the flooding; the Environment Agency was not present in this area. The road is private and responsibility for gullies/drainage lies with residents. (p45)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>7 properties [PAG] (p43)</p></div><div class="nugget-popup quant"><p>seven properties; water around 1.5m deep (on the road) [PAG] (p44)</p></div></div></body></div>`)[0];

                var html_cf55bd299d9468bed1ddfc16e6c8c925 = $(`<div id="html_cf55bd299d9468bed1ddfc16e6c8c925" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Swallowfield</h1><div class="nugget-popup"><p>Community experienced flooding linked to the winter 2013/14 flood event; informal Flood Wardens were operating locally prior to and during this event to assist preparedness and response. (p11)</p></div><div class="nugget-popup"><p>Was affected by surface water (pluvial) flooding, experienced sewer flooding, and was the only parish affected by groundwater flooding during the winter 2013/14 flood events. (p12)</p></div><div class="nugget-popup"><p>Surface water flooding affected Swallowfield during the winter 2013/14 event; Table 1&ndash;1 lists Swallowfield as affected and notes River Blackwater and River Loddon as valley influences with 'Surface Water' as the primary source. [TAB] (p13)</p></div><div class="nugget-popup"><p>Properties in Swallowfield experienced external property flooding during the winter 2013/14 event. [TAB] (p14)</p></div><div class="nugget-popup"><p>The village suffered flooding from three sources in winter 2013&ndash;14: surface water runoff from surrounding farmland, sewage from a surcharging Thames Water foul network, and river flooding from both the Loddon and Blackwater. High groundwater levels worsened flooding. Highway flooding was evident across the village. [PAG] (p22)</p></div><div class="nugget-popup"><p>Village experienced significant surface water runoff channelled via field drains and ditches into the River Blackwater and onto the highway; highway flooding occurred at the junction of the B3349 and Swallowfield Street (late December) and an area of Swallowfield Street flooded; northern fields were affected by river flooding (River Loddon and River Blackwater) including fields south of Swallowfield Park drive which were completely flooded. [PAG] (p23)</p></div><div class="nugget-popup"><p>To the north of the village the River Loddon overtopped its banks and flooded fields to the east and west (without flooding properties or highways). Separately, ingress of surface water and groundwater into the foul sewer network during the winter 2013&ndash;14 event caused sewage flooding in the village: households suffered blocked lavatories and non&ndash;flowing wastewater; foul water mixed with flood water on local streets and sewage debris was left on roads requiring clearing. [PAG] (p24)</p></div><div class="nugget-popup"><p>The Swallowfield area experienced flooding during winter 2013&ndash;14: the council's gully emptier attended the area to assist with blocked drains and ditches; the council responded to all local requests for sandbags; Church Road in Swallowfield was inspected for flood depths to assess whether a road closure was necessary. [PAG] (p25)</p></div><div class="nugget-popup"><p>Ingress of floodwater into the foul sewer system led to reduced sewer capacity, resulting in sewage back&ndash;up and sewage flooding affecting the village after periods of heavy rainfall. (p26)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 properties flooded; 0 properties flooded internally; 3 properties flooded externally [TAB] (p14)</p></div><div class="nugget-popup quant"><p>6 properties (external flooding) [PAG] (p22)</p></div><div class="nugget-popup quant"><p>10 occasions [PAG] (p25)</p></div></div></body></div>`)[0];

ow waves; further north the A321 flooded where Twyford Brook and an adjacent stream spilled out of bank. (p36)</p></div><div class="nugget-popup"><p>The majority of flooding in the village during the winter 2013&ndash;14 event resulted from ordinary watercourses and the Main Rivers (the Old River and the River Loddon) coming out of bank due to increased water levels, causing flooding across the vicinity of the village. (p38)</p></div><div class="nugget-popup"><p>Properties in Hurst were affected by the winter 2013&ndash;14 flooding. Residents reported sewage backing&ndash;up and information from residents suggests a possible failure/insufficiency of the local Thames Water Hurst pumping station; local main rivers and associated culverts were implicated in the flood risk to properties. [PAG] (p39)</p></div><div class="nugget-popup"><p>Local main river flooding affected properties in Hurst; properties experienced flood impacts and alleviating the risk would require a capital works scheme. [PAG] (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>12 properties flooded; 8 properties flooded internally; 4 properties flooded externally [TAB] (p14)</p></div><div class="nugget-popup quant"><p>6 residential properties external flooding; 2 residential properties internal flooding; 6 commercial properties internal flooding (p35)</p></div><div class="nugget-popup quant"><p>2 properties (No.1 and No.2 Gloster Cottages) (p36)</p></div></div></body></div>`)[0];

                var html_f4c431deecd955e669d52d3f2ee3fa28 = $(`<div id="html_f4c431deecd955e669d52d3f2ee3fa28" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wargrave</h1><div class="nugget-popup"><p>Experienced fluvial (river) flooding as a significant component of the winter 2013/14 flood events. (p12)</p></div><div class="nugget-popup"><p>Fluvial flooding from the River Thames affected Wargrave during the winter 2013/14 event. [TAB] (p13)</p></div><div class="nugget-popup"><p>Property flooding in Wargrave included large numbers of internal and external property floods during the winter 2013/14 event; internal flooding affected many homes. [TAB] (p14)</p></div><div class="nugget-popup"><p>Two areas within the parish (Willow Lane and Loddon Drive) suffered fluvial flooding in winter 2013&ndash;14. The event caused internal flooding to 26 properties (including two businesses) and external flooding to seven properties; both Willow Lane and Loddon Drive were completely inundated. (p41)</p></div><div class="nugget-popup"><p>River Thames, River Loddon and St Patricks Stream came out of bank in the Wargrave area during the winter 2013&ndash;14 event, causing flooding through parts of south&ndash;west Wargrave (Heron's Ditch flows north&ndash;east towards the Thames through south&ndash;west Wargrave). (p43)</p></div><div class="nugget-popup"><p>Flooding in the village resulted from main rivers (River Thames and River Loddon) coming out of bank, causing inundation of the village and local properties. [PAG] (p44)</p></div><div class="nugget-popup"><p>Main Rivers in the vicinity (River Thames and River Loddon) came out of bank, causing flooding in the village; several roads were closed and required considerable clean up; local properties and businesses were provided with sandbags and required pumping/tanking operations. [PAG] (p45)</p></div><div class="nugget-popup"><p>Ditches in the Wargrave area are described as requiring regular maintenance to remain free from excess silt build&ndash;up and vegetation to prevent/relieve flooding. Loddon Drive is noted as a private road where gullies and drainage are the responsibility of residents (affecting local drainage capacity). [PAG] (p46)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>34 properties flooded; 27 properties flooded internally; 7 properties flooded externally [TAB] (p14)</p></div><div class="nugget-popup quant"><p>26 properties; 2 businesses; 7 properties (p41)</p></div><div class="nugget-popup quant"><p>7 properties; 1.5m deep (p44)</p></div><div class="nugget-popup quant"><p>nearly 1,000 sandbags; over 30 occasions [PAG] (p45)</p></div></div></body></div>`)[0];

                var html_2f81ca6d47c57f788d851fdee7719acf = $(`<div id="html_2f81ca6d47c57f788d851fdee7719acf" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Shinfield</h1><div class="nugget-popup"><p>Experienced fluvial (river) flooding as a significant component of the winter 2013/14 flood events. (p12)</p></div><div class="nugget-popup"><p>Fluvial flooding from the River Loddon affected the parish during the winter 2013/14 flood event; parish representatives provided anecdotal information to the investigation and were visited during site walkovers. [TAB] (p13)</p></div><div class="nugget-popup"><p>Properties in Shinfield experienced internal property flooding during the winter 2013/14 event. [TAB] (p14)</p></div><div class="nugget-popup"><p>The River Loddon burst its banks (week before Christmas 2013) and flowed across fields toward the village, producing overland flows into Shinfield. Highway flooding occurred across the parish, particularly along the A327 Arborfield Road. Two properties on the A327 (the Magpie and Parrot public house and No. 20) experienced internal flooding. Floodwater on the A327 collected to a depth that restricted access to 4x4 vehicles, caused vehicles to become stuck and generated large bow waves. [PAG] (p27)</p></div><div class="nugget-popup"><p>Main River flooding from the River Loddon came out of bank to the south&ndash;east and north&ndash;east of the village; groundwater rose through the permeable floodplain sediments affecting areas alongside the River Loddon. [PAG] (p28)</p></div><div class="nugget-popup"><p>The village experienced flooding during the winter 2013&ndash;14 event; properties were affected and the condition of ditches and ordinary watercourses around the village was noted as potentially contributing to poor drainage and impeded runoff to the River Loddon. [PAG] (p29)</p></div><div class="nugget-popup"><p>Properties in Shinfield were affected by flooding. As part of the approved Eastern Shinfield Relief Road works a raised section of road was introduced that provides protection to the Magpie and Parrot properties, and a new flood bund was constructed around No.20 Arborfield Road to mitigate an increased flood risk caused by the works. [PAG] (p30)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 properties flooded; 2 properties flooded internally; 0 properties flooded externally [TAB] (p14)</p></div><div class="nugget-popup quant"><p>2 properties; road surface depth approximately 0.5m [PAG] (p27)</p></div><div class="nugget-popup quant"><p>2 properties [PAG] (p28)</p></div></div></body></div>`)[0];

                var html_51a59fd57b3271b2e2b3d987149a8e01 = $(`<div id="html_51a59fd57b3271b2e2b3d987149a8e01" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Charvil</h1><div class="nugget-popup"><p>Experienced both river (fluvial) flooding and surface water (pluvial) flooding during the winter 2013/14 flood events. (p12)</p></div><div class="nugget-popup"><p>Fluvial flooding (River Loddon and River Thames) affected Charvil during the winter 2013/14 event; the parish council representative contributed information to the investigation. [TAB] (p13)</p></div><div class="nugget-popup"><p>Charvil experienced extensive external property flooding during the winter 2013/14 event. [TAB] (p14)</p></div><div class="nugget-popup"><p>The village suffered fluvial flooding and surface water runoff during winter 2013&ndash;14. A localised area of the parish experienced sewer flooding following a failure at the Charvil Thames Water Pumping Station. None of the properties suffered internal flooding but 31 properties experienced external flooding. Localised highway flooding also occurred in some areas of the parish. (p31)</p></div><div class="nugget-popup"><p>Multiple parts of Charvil were flooded during winter 2013&ndash;14 when the Old River and the River Loddon came out of bank. Raised lake levels and fluvial inundation flooded roads, meadows and external areas of properties. Sewer flooding occurred following failure of the Thames Water pumping station in Charvil, with effluent collecting in roads, driveways and front gardens for over two weeks in January. [PAG] (p32)</p></div><div class="nugget-popup"><p>The village was subject to flood warnings for the River Loddon (warnings issued 18 Jan 2014 removed 21 Jan 2014; re&ndash;issued 2 Feb 2014 removed 23 Feb 2014). Areas of Charvil were reported to have been affected by foul&ndash;water (sewer) flooding during the winter 2013&ndash;14 event; residents reported pumping station failures contributing to foul&ndash;water impacts (Thames Water dispute this claim). (p33)</p></div><div class="nugget-popup"><p>Fluvial flooding in the vicinity led to inundation impacts in Charvil during the winter 2013&ndash;14 event; a small number of properties were affected and the local Thames Water pumping station failed, prompting investigations into wet well capacity and potential foul network lining. (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>31 properties flooded; 0 properties flooded internally; 31 properties flooded externally [TAB] (p14)</p></div><div class="nugget-popup quant"><p>31 properties (p31)</p></div><div class="nugget-popup quant"><p>2 properties (p32)</p></div></div></body></div>`)[0];

                var html_e0601d8434a80d52c60238f3506b2ff8 = $(`<div id="html_e0601d8434a80d52c60238f3506b2ff8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Arborfield</h1><div class="nugget-popup"><p>Sewage (sewer) flooding affected the parish during the winter 2013/14 event; Arborfield is listed in Table 1&ndash;1 as an affected parish with 'Sewage' recorded as the primary source of flooding. [TAB] (p13)</p></div><div class="nugget-popup"><p>Properties in Arborfield were flooded during the winter 2013/14 event, with both internal and external property flooding recorded. [TAB] (p14)</p></div><div class="nugget-popup"><p>Affected residents in Arborfield were visited by Thames Water officers to assess issues and were given a 'Sewer Flooding Questionnaire' following the flood event. (p15)</p></div><div class="nugget-popup"><p>Within the village, high groundwater forced overland flows that travelled westerly toward the River Loddon, flooding sections of Reading Road (A327) and Church Lane. Church Lane experienced partial flooding (water collected in a low point near the Reading Road junction); a nearby drainage ditch became partially silted/blocked and did not alleviate flooding. (p17)</p></div><div class="nugget-popup"><p>Affected by high groundwater and foul water flooding during the winter 2013&ndash;14 event. High groundwater led to surface water flooding on roads in the village; groundwater ingress and overland flows into the foul sewer network caused the sewer system to become inundated, manhole covers in Church Lane were forced open, properties north of Reading Road experienced sewage backups, Arborfield House suffered internal sewage flooding to ~150 mm, and No.2 and No.3 Arborfield Grange had foul water emerging from bath plug holes. (p19)</p></div><div class="nugget-popup"><p>Foul (sewer) water flooding affected areas of Arborfield during the winter 2013&ndash;14 flood event; the council has no record of cleanup works following the foul water flooding. Resident reports and remedial works by Thames Water indicate local sewer/pumping issues associated with the flooding. [PAG,MUL] (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>6 properties flooded; 3 properties flooded internally; 3 properties flooded externally [TAB] (p14)</p></div><div class="nugget-popup quant"><p>Three properties (internal); three properties (external) (p17)</p></div><div class="nugget-popup quant"><p>2 properties (No.2 and No.3 Arborfield Grange); 1 property (Arborfield House) internal flooding 150 mm (p19)</p></div></div></body></div>`)[0];

                var html_f7aac3dc19b9cc421cafb0833fb6c9c3 = $(`<div id="html_f7aac3dc19b9cc421cafb0833fb6c9c3" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wargrave Sewage Treatment Works</h1><div class="nugget-popup"><p>Released sewage into the flooded River Loddon, contributing to sewage flooding in the Loddon Drive area and causing inundation of private sewage treatment facilities. (p41)</p></div><div class="nugget-popup"><p>During the winter 2013&ndash;14 flood event the works discharged untreated foul effluent into the River Loddon under its emergency allowance because it lacked capacity to retain foul water. Those discharges mixed with fluvial floodwater and therefore contributed to contamination of floodwater affecting downstream properties (including in the Loddon Drive area). (p43)</p></div><div class="nugget-popup"><p>Wet well capacity at the treatment works is potentially insufficient during flood events, resulting in excess sewage being discharged into the River Loddon; investigation recommended to increase wet well capacity to reduce such discharges. (p46)</p></div></div></body></div>`)[0];
