                var html_7de36dc7e4a8f3c239d5611c59efd05e = $(`<div id="html_7de36dc7e4a8f3c239d5611c59efd05e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kirkley Stream</h1><div class="nugget-popup"><p>Computer modelling and the 24/25 July 2015 heavy rainfall indicate the stream and local drainage were overwhelmed, causing river and surface water flooding of residential properties, roads and gardens in the lower part of the stream. (p1)</p></div><div class="nugget-popup"><p>The stream was partly blocked by debris (natural material and illegally dumped garden/fly&ndash;tipped waste) and areas of excessive vegetation. Coupled with a large volume of rainfall, this caused the stream to overtop its banks and directly flood lower areas, overflowing into roads, gardens and ultimately getting into homes. (p2)</p></div><div class="nugget-popup"><p>The stream was partly blocked by debris (including illegally dumped garden and fly&ndash;tipped waste) and excessive vegetation. Combined with high inflows this caused the stream to overtop its banks and flood lower areas, resulting in water entering homes and gardens. Anglian Water had carried out monthly maintenance but there were occasions when more extensive clearance was required. [PAG] (p3)</p></div><div class="nugget-popup"><p>The stream (designated main river) was implicated in the event where highway drains could not discharge into it, contributing to road flooding. A culverted section was jetted to restore flows; the Environment Agency has proposed vegetation clearance (and potentially removal of a large tree) and review of the trash screen to reduce blockages and future flood risk. [PAG] (p4)</p></div><div class="nugget-popup"><p>Kirkley Stream is associated with recorded flood incidents along its course; a flood storage area is located centrally along the stream and attenuation ponds/structures are shown to manage flood risk. Flood incident records are concentrated on the stream's southern reaches (near Pakefield Park). The stream is mapped as Main River and Non&ndash;Main River with ownership/responsibility delineated. [IMG] (p8)</p></div><div class="nugget-popup"><p>Flood incidents are concentrated along the Kirkley Stream corridor, associated with internal property flooding, garden and outbuilding flooding, and road flooding. Incident records and key watercourse infrastructure (bridges/culverts/trash screens, attenuation pond) are annotated along the stream, indicating repeated flood occurrences where the stream passes through Carlton Colville. [IMG] (p9)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>33 homes; ~50m of public highway flooded; flood depths 300&ndash;500mm in main living areas, approx. 450mm on highway (p1)</p></div><div class="nugget-popup quant"><p>1 home; roads reportedly flooded to about 300 mm (p2)</p></div><div class="nugget-popup quant"><p>six large pipes partially blocked [PAG] (p3)</p></div><div class="nugget-popup quant"><p>Internal (38); Out building (8); Road (9); Garden (5); Historic EA (Pre 2011) (3); Tidal (19) [IMG] (p8)</p></div><div class="nugget-popup quant"><p>Internal (38); Garden (5); Out building (3); Road (9); Tidal (19); Historic EA (Pre 2011) (3) [IMG] (p9)</p></div></div></body></div>`)[0];
