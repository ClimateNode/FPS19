                var html_4f21a6f6579c5da74798404d7de376da = $(`<div id="html_4f21a6f6579c5da74798404d7de376da" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Grom</h1><div class="nugget-popup"><p>The River Grom overflowed at the culvert entrance near Rodmell Road during the heavy rainfall, inundating gardens on the north&ndash;eastern side of Warwick Park and causing internal flooding to a property; culvert entrance arrangements may have impeded flow and contributed to the flooding. (p17)</p></div><div class="nugget-popup"><p>The culverted River Grom was likely overwhelmed by excessive rainfall, contributing to local flooding; the culvert entrance arrangement (largely closed with a small opening and lower entrance chamber) is likely to impede inflow and may lead to flooding of gardens at Warwick Park. A CCTV inspection found only minor deposits and a root mass but no major defects. [PAG] (p19)</p></div><div class="nugget-popup"><p>Culvert capacity limits, trash&ndash;screen blockages and potential large obstructions caused backing up of flow; the culvert restricts floodplain so when capacity is exceeded water floods open sections and through manholes, placing nearby properties at high risk. KCC replaced the trash screen and arranged maintenance to reduce this risk. (p25)</p></div><div class="nugget-popup"><p>KCC replaced the previous vertical trash screens at the River Grom entrance with a single raked trash screen to allow safer and more effective clearing of debris during higher flows; the River Grom culvert was subject to CCTV inspection to assess for damage, defects and blockages after the 2017 flood. [PAG] (p26)</p></div><div class="nugget-popup"><p>The River Grom reached peak flows as highway surface water discharged to the watercourse and overflowed at the entrance to the culvert system, contributing to flooding in the local area. [PAG] (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property (p17)</p></div></div></body></div>`)[0];

                var html_3886ab9f35486b77bb5f5010a50d1f5b = $(`<div id="html_3886ab9f35486b77bb5f5010a50d1f5b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Tunbridge Wells</h1><div class="nugget-popup"><p>Tunbridge Wells area was affected by flooding during the event on 19th July 2017. [PAG] (p1)</p></div><div class="nugget-popup"><p>Extensive highway flooding and inundation of properties across parts of the town. [PAG] (p5)</p></div><div class="nugget-popup"><p>Widespread flooding reported across the town on 19 July 2017; many of the areas flooded in July 2017 had also been affected by flooding on 24 August 2015. [PAG,MUL] (p6)</p></div><div class="nugget-popup"><p>Widespread flooding across the town on 19 July 2017 affected multiple residential and commercial properties; emergency services (KFRS) attended and pumped properties and provided humanitarian assistance; water had receded by 04:30. [PAG] (p7)</p></div><div class="nugget-popup"><p>Multiple locations across Tunbridge Wells experienced flooding in 2017; properties were inundated (reports of over 1 metre of water in some properties) and emergency services received over 60 calls and carried out pumping and assistance. [IMG] (p8)</p></div><div class="nugget-popup"><p>Intense, short&ndash;duration rainfall on 19 July 2017 caused flash/surface&ndash;water flooding across Tunbridge Wells, producing urban flooding in shopping and residential areas (figures show locations of flooding in Royal Victoria Place and High Brooms). [IMG,PAG] (p10)</p></div><div class="nugget-popup"><p>Surface water from surrounding hills and roads converged in the central area (The Pantiles / Nevill Street / Warwick Park low point ~80.3mAOD). Converging flow routes and limited ability for water to flow away, combined with a small local pump serving basements, increased loads on drainage and the pump and led to surface water and sewer&ndash;related flooding in the central area, including flooding of basements and water on highways during the 19 July 2017 event. [IMG] (p18)</p></div><div class="nugget-popup"><p>Excessive rainfall exceeded drainage capacity across the area, overwhelming systems and causing surface water to accumulate in low points and combined sewers to surcharge into properties (including areas such as Mount Pleasant Road, Castle Street and Warwick Park). (p19)</p></div><div class="nugget-popup"><p>On 19th July 2017 excessive/intensive rainfall exceeded the capacity of the town's drainage and combined sewer systems. Surface water accumulated in topographic low points and entered properties; parts of the town (including London Road, Castle Street and the Royal Victoria Place area) experienced overwhelmed gullies/combined sewers and blocked drains. Kent County Council attended (water had cleared from some highways by 03:54) and drains were cleansed and audited following the event. (p20)</p></div><div class="nugget-popup"><p>Following the 19 July 2017 flood event, KCC undertook drainage cleansing on roads in Tunbridge Wells that were affected by flooding; a resident flood action group was formed (facilitated by the National Flood Forum) to address local flood issues; natural flood management measures were delivered in local green spaces (Hilbert Woods and Grosvenor Park) to reduce peak flows. (p26)</p></div><div class="nugget-popup"><p>Intense rainfall exceeded the design capacity of drainage systems across Tunbridge Wells, preventing surface water entering drainage networks quickly enough; surface water flowed to local low points and caused flooding across the town. [PAG] (p28)</p></div><div class="nugget-popup"><p>Surface water / urban flooding affected the town during the event, with overland flow contributing to surface water flooding forming on Nevill Street and increasing risk to downstream properties; prompted calls for natural flood management measures on The Common, Hilbert Woods and Grosvenor Park to reduce runoff and discharge onto surrounding roads. [PAG] (p29)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 60 calls; over 1 metre of water within some properties [PAG] (p7)</p></div><div class="nugget-popup quant"><p>over 60 calls; over 1 metre of water within some properties; 3 fire engines [IMG] (p8)</p></div><div class="nugget-popup quant"><p>2 commercial properties; 3 blocked drains (p19)</p></div><div class="nugget-popup quant"><p>3 blocked drains; 15 properties affected (approximately 11 residential, 4 commercial) (p20)</p></div></div></body></div>`)[0];
