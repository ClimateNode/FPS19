                var html_a7e098c6b970a67b900f5686ef29e0dd = $(`<div id="html_a7e098c6b970a67b900f5686ef29e0dd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Tottle Brook</h1><div class="nugget-popup"><p>Water levels rose sharply during the intense summer storm and the watercourse overtopped, particularly at locations where the channel was restricted; this contributed to flooding in Wollaton Vale and Larchdene Avenue and to internal flooding of properties. (p4)</p></div><div class="nugget-popup"><p>Constrained and partly culverted channel adjacent to Larchdene Avenue and Wollaton Vale contributed to flooding that caused internal flooding of properties; unconsented channel alterations reduced capacity and conveyance through the channel, increasing flood risk to nearby properties. [PAG] (p7)</p></div><div class="nugget-popup"><p>The watercourse can rise sharply due to numerous connections from private properties and surface water sewers; it has overtopped and caused external flooding (overtopping linked to flooding on nearby streets). The brook is the main channel with a bypass culvert to divert additional flows to protect lower properties. [MUL] (p8)</p></div><div class="nugget-popup"><p>Overtopping of Tottle Brook was the predominant cause of flooding, leading to inundation of adjacent properties. Surface water sewers discharge directly into the brook, producing a rapid rise in water level and causing backing up of water through the sewer network and onto highway infrastructure. Channel modifications and pinch points exacerbated the tendency to back up towards properties. (p10)</p></div><div class="nugget-popup"><p>Flooding associated with the Tottle Brook catchment was linked to property flooding in the study area; there is no flood warning system for the Tottle Brook and assets (e.g. trash screens and culverts) are inspected/cleaned by the Environment Agency. The LLFA recommends surveying the Tottle Brook and its assets to identify constraints that impact conveyance. (p11)</p></div><div class="nugget-popup"><p>The brook's capacity was exceeded by a short, high&ndash;intensity rainfall event, contributing to flooding of nearby properties (internal flooding on Larchdene Avenue and Wollaton Vale). [TAB] (p15)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than 5 properties reported internal flooding (p4)</p></div><div class="nugget-popup quant"><p>19 properties [PAG] (p7)</p></div><div class="nugget-popup quant"><p>maximum rainfall intensity at location estimated as a 1 in 70&ndash;year return period (1.43% annual chance); sewers typically designed for a 1 in 30&ndash;year event (capacity exceeded) (p10)</p></div><div class="nugget-popup quant"><p>19 properties internally; at least 3 properties externally (p11)</p></div><div class="nugget-popup quant"><p>11 residential properties; 8 residential properties [TAB] (p15)</p></div></div></body></div>`)[0];

                var html_5400b535ed56e6eba98e53aa93029713 = $(`<div id="html_5400b535ed56e6eba98e53aa93029713" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Larchdene Avenue, Wollaton</h1><div class="nugget-popup"><p>Identified as a location impacted by the 17 June 2020 flood event and the subject of a Section 19 flood investigation. (p1)</p></div><div class="nugget-popup"><p>Named location in the Section 19 flood investigation report; the area experienced flooding and was investigated under a formal flood investigation. (p2)</p></div><div class="nugget-popup"><p>On 17 June 2020 an intense summer storm affected Larchdene Avenue. The report describes Tottle Brook rising and overtopping in the area (where the channel is restricted) and the storm overwhelming the sewer system and highway infrastructure, resulting in surface water flooding and internal flooding of properties. (p4)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties on the street as part of the flood event. [PAG] (p6)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties located on the street. [PAG] (p7)</p></div><div class="nugget-popup"><p>Identified in the report title as a location under the Section 19 flood investigation into the event associated with the intense thunderstorm on 17/06/2020. [PAG] (p9)</p></div><div class="nugget-popup"><p>Flooding occurred rapidly in response to a localised thunderstorm. Mechanisms varied at Larchdene Avenue: some properties were affected by Tottle Brook overtopping (fluvial) and some by surface water overland flow; drainage capacity was exceeded causing water to reach property thresholds and affect highway drainage connections. (p10)</p></div><div class="nugget-popup"><p>Properties in Larchdene experienced internal and external flooding: residents reported internal flooding leading to properties being uninhabitable during repairs; damage included unrepairable furniture, furnishings, floorboards and carpets; external damage included gardens, outdoor furniture, decking and planting; residents were displaced and impacts were amplified by the COVID&ndash;19 pandemic. [PAG] (p11)</p></div><div class="nugget-popup"><p>The report documents a local flood event affecting Larchdene Avenue and Wollaton Vale and recommends establishing a flood warning system so residents can prepare for predicted events and minimise damage. [PAG] (p12)</p></div><div class="nugget-popup"><p>A short, high&ndash;intensity rainfall event (55 minutes on 17th June) exceeded the capacity of the Tottle Brook and local drainage systems, causing internal flooding of residential properties: 11 properties on Larchdene Avenue and a further 8 properties on Wollaton Vale. [PAG] (p14)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties caused by the Tottle Brook and drainage systems being overwhelmed by a short, intense rainfall event. (p15)</p></div><div class="nugget-popup"><p>A storm event exceeded the design capacity of the sewer network, causing flooding impacts associated with overwhelmed sewers; emergency maintenance and culvert cleansing were required post&ndash;flood event in the catchment; road gullies were targeted for cleansing in response to weather warnings. [PAG] (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than 5 properties (p4)</p></div><div class="nugget-popup quant"><p>19 properties (across both Larchdene Avenue and Wollaton Vale) [PAG] (p6)</p></div><div class="nugget-popup quant"><p>19 properties (combined across Larchdene Avenue and Wollaton Vale) [PAG] (p7)</p></div><div class="nugget-popup quant"><p>flooding reported within 30 minutes; sewers are typically designed for a 1 in 30&ndash;year event (capacity exceeded) (p10)</p></div><div class="nugget-popup quant"><p>19 properties internally (across Larchdene and Wollaton Vale); at least 3 properties externally [PAG] (p11)</p></div><div class="nugget-popup quant"><p>11 residential properties; 8 residential properties [PAG] (p14)</p></div><div class="nugget-popup quant"><p>11 residential properties (p15)</p></div></div></body></div>`)[0];

                var html_e0cf9c3410adef4c4a5e78392bc280fc = $(`<div id="html_e0cf9c3410adef4c4a5e78392bc280fc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wollaton Vale</h1><div class="nugget-popup"><p>Identified as an area impacted by the 17 June 2020 flood event and the subject of a Section 19 flood investigation. [PAG] (p1)</p></div><div class="nugget-popup"><p>On 17 June 2020 an intense summer storm caused water levels in the Tottle Brook to rise and overtop (particularly where the channel is restricted). The same storm overwhelmed the sewer system and highway infrastructure, producing additional surface water flooding. Properties in the area experienced internal flooding. [PAG] (p4)</p></div><div class="nugget-popup"><p>Flooding predominantly caused by Tottle Brook overtopping; some properties were affected by surface water and some by a combination of fluvial and surface&ndash;water mechanisms. Overland flow from steeper streets to the lower level of Wollaton Vale exacerbated impacts; drainage infrastructure and sewers were at capacity, leading to backing up of water and highway drainage being unable to discharge. [PAG] (p10)</p></div><div class="nugget-popup"><p>Properties in Wollaton Vale experienced internal and external flooding: residents reported internal flooding leading to properties being uninhabitable during repairs; damage included unrepairable furniture, furnishings, floorboards and carpets; external damage included gardens, outdoor furniture, decking and planting; residents were displaced and impacts were amplified by the COVID&ndash;19 pandemic. [PAG] (p11)</p></div><div class="nugget-popup"><p>The report documents a local flood event affecting Larchdene Avenue and Wollaton Vale and recommends establishing a flood warning system so residents can prepare for predicted events and minimise damage. [PAG] (p12)</p></div><div class="nugget-popup"><p>A short, high&ndash;intensity rainfall event (55 minutes on 17th June) exceeded the capacity of the Tottle Brook and local drainage systems, causing internal flooding of residential properties: 11 properties on Larchdene Avenue and a further 8 properties on Wollaton Vale. [PAG] (p14)</p></div><div class="nugget-popup"><p>A storm event exceeded the design capacity of the sewer network, causing flooding impacts associated with overwhelmed sewers; emergency maintenance and culvert cleansing were required post&ndash;flood event in the catchment; road gullies were targeted for cleansing in response to weather warnings. [PAG] (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than 5 properties [PAG] (p4)</p></div><div class="nugget-popup quant"><p>flooding reported within 30 minutes; maximum rainfall intensity at location estimated as a 1 in 70&ndash;year return period (1.43% annual chance); sewers typically designed for a 1 in 30&ndash;year event (capacity exceeded) [PAG] (p10)</p></div><div class="nugget-popup quant"><p>19 properties internally (across Larchdene and Wollaton Vale); at least 3 properties externally [PAG] (p11)</p></div><div class="nugget-popup quant"><p>11 residential properties; 8 residential properties [PAG] (p14)</p></div></div></body></div>`)[0];

                var html_a40e13e6340a4e3b69355db49d106c96 = $(`<div id="html_a40e13e6340a4e3b69355db49d106c96" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wollaton</h1><div class="nugget-popup"><p>Wollaton experienced an intense summer storm on 17 June 2020. Tottle Brook rose sharply and overtopped (particularly where the channel is restricted). The storm also overwhelmed the sewer system and highway infrastructure, causing additional surface water flooding and internal flooding of properties in the area. [PAG] (p4)</p></div><div class="nugget-popup"><p>Parts of Wollaton (specifically Larchdene Avenue and Wollaton Vale) experienced internal flooding of residential properties. [PAG] (p7)</p></div><div class="nugget-popup"><p>A highly localised thunderstorm moved northwest over Wollaton on 17/06/2020 producing intense rainfall that caused surface water / urban flooding in the Wollaton area and prompted the Section 19 flood investigation. [PAG] (p9)</p></div><div class="nugget-popup"><p>Thunderstorm was extremely localised to Wollaton; flooding occurred rapidly (within ~30 minutes of the storm reaching the area). Drainage systems were compromised by the intense rainfall (almost an average month's June precipitation fell over 2 days in Wollaton), resulting in flooding of properties and streets driven by overtopping of the Tottle Brook and surface water overland flow. [PAG] (p10)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than 5 properties [PAG] (p4)</p></div><div class="nugget-popup quant"><p>19 properties (within Wollaton; combined across Larchdene Avenue and Wollaton Vale) [PAG] (p7)</p></div></div></body></div>`)[0];
