                var html_567de111364afa7794c7a0e1f53e3248 = $(`<div id="html_567de111364afa7794c7a0e1f53e3248" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Surrey</h1><div class="nugget-popup"><p>Localised surface&ndash;water and ordinary watercourse flooding affected the Hinchley Wood estate on 22&ndash;23 June 2016. Restricted ditch capacity (silted southern boundary channel reduced to ~one third of upstream width), a blocked trash grille at a watercourse/culvert junction and a blockage in one of a twin&ndash;pipe culvert caused back&ndash;up and overbank flow. Water flowed down Hengest Avenue and into front gardens, entered rear gardens via a footpath/under&ndash;fence route, and flooded gardens along Claygate Lane. Surrey Fire & Rescue Service and Surrey County Council contractors attended during the event; subsequent ditch clearance works were carried out (before photo 30/06/2016; after clearance 08/12/2016). [IMG] (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>width reduced to approximately one third; one of the two culvert pipes blocked [IMG] (p19)</p></div></div></body></div>`)[0];

                var html_77cdd19be201834fefcadf51cc63eeea = $(`<div id="html_77cdd19be201834fefcadf51cc63eeea" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hinchley Wood</h1><div class="nugget-popup"><p>The storm centred on a catchment around Hinchley Wood; localised flooding in the Hengest Avenue and Clay Lane area resulted from watercourses reaching capacity, causing flooding of roads and property. (p4)</p></div><div class="nugget-popup"><p>Surface water flooding in Hinchley Wood led to internal flooding of residential properties on Hengest Avenue. [IMG] (p5)</p></div><div class="nugget-popup"><p>Localised surface water flooding affected the Hinchley Wood area during intense rainfall on 22&ndash;23 June 2016; the report specifically locates a flooding incident at Hengest Avenue. (p6)</p></div><div class="nugget-popup"><p>Hinchley Wood was the focus of the intense rainfall and experienced localised surface water flooding; surface water flow routes are described east of The Rythe with runoff directed north towards the A309. The area sustained the majority of the storm accumulation during the event. [PAG,MUL] (p7)</p></div><div class="nugget-popup"><p>Localised surface water flooding and ordinary watercourse (channel) flooding occurred on 22&ndash;23 June 2016; watercourse maintenance was carried out following the incident. (p9)</p></div><div class="nugget-popup"><p>The Hinchley Wood estate experienced localised surface water and ordinary watercourse flooding during the event; restricted ditch capacity, siltation and blocked trash grilles caused water to spill from banks, flow down Hengest Avenue and inundate fronts and rears of properties and gardens. [PAG] (p10)</p></div><div class="nugget-popup"><p>Combination of very high localised rainfall and two areas of restricted ditch capacity caused flooding of the Hinchley Wood estate. The southern boundary ditch was heavily silted (reduced to ~one third of upstream width) causing water to spill out of banks and flow down Hengest Avenue, flooding the fronts of properties. A blocked trash grille caused water to back up and run onto a footpath and under a fence into rear gardens. A blockage in one pipe of a twin&ndash;pipe culvert at the northern section reduced culvert capacity and caused garden flooding along Claygate Lane. Runoff from Surbiton Golf Course ditches also could not be accepted by the watercourse during the high rainfall event and contributed to flooding. [PAG] (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>10 internally flooded houses (p4)</p></div><div class="nugget-popup quant"><p>10 houses [IMG] (p5)</p></div></div></body></div>`)[0];
