er area) [PAG] (p68)</p></div><div class="nugget-popup quant"><p>about 50 people; approximately 1,000 homes (p69)</p></div></div></body></div>`)[0];

d risk; highway drainage and culvert capacity were identified as issues contributing to flooding. (p85)</p></div><div class="nugget-popup"><p>Blocked/defective culvert under the road required jetting from 33 to 30 Fishbourne Road East; culvert turning under the road caused slow/blocked flow affecting the highway. [TAB] (p102)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>28 properties (cluster total shared across West Chichester, Parklands and Fishbourne Road) [TAB] (p22)</p></div><div class="nugget-popup quant"><p>4 properties [PAG] (p43)</p></div><div class="nugget-popup quant"><p>4 properties [PAG] (p44)</p></div></div></body></div>`)[0];

                var html_856e76092cc4b78388bf480b869b3d04 = $(`<div id="html_856e76092cc4b78388bf480b869b3d04" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>West Sussex</h1><div class="nugget-popup"><p>An extreme rainfall event on 10&ndash;12 June 2012 caused widespread flooding across parts of the county. Almost 800 properties across West Sussex were affected by flooding from a variety of sources; the worst affected areas included the Manhood Peninsula, Bognor Regis, Littlehampton and Worthing. The Bognor Regis conurbation (including Middleton on Sea, Elmer and Felpham) had reports of properties flooded primarily by surface water. (p3)</p></div><div class="nugget-popup"><p>The county experienced unprecedented summer 2012 rainfall (notably 10&ndash;12 June 2012) that overloaded local drainage networks across the coastal plain. Flood water generally dissipated over 2&ndash;3 days with no significant infrastructure damage, but the event caused widespread surface water flooding. (p5)</p></div><div class="nugget-popup"><p>Widespread surface water flooding during the June 2012 event; flooding patterns closely matched the county's Areas Susceptible to Surface Water Flooding maps. Prolonged heavy rainfall (some locations received large totals in 12&ndash;24 hours) generated excess runoff and caused inundation across parts of the county. (p13)</p></div><div class="nugget-popup"><p>West Sussex experienced very high short&ndash;duration rainfall that generated excess runoff and led to surface water flooding in the county. [PAG] (p14)</p></div><div class="nugget-popup"><p>Numerous extreme rainfall observations were recorded across West Sussex during the event (Met Office and other networks). The report notes multiple very large local totals in the county and describes highly localised convective cells, indicating the county experienced intense rainfall that increased the likelihood of significant disruption and potential flooding in parts of West Sussex. (p15)</p></div><div class="nugget-popup"><p>Extremely high, localised rainfall across West Sussex produced widespread surface water flooding (the majority of property flooding on 10&ndash;12 June) and some river&ndash;linked flooding; the Environment Agency issued Flood Alerts and Flood Warnings for multiple rivers and watercourses in the county. [PAG] (p16)</p></div><div class="nugget-popup"><p>Widespread extreme rainfall in June 2012 caused extensive surface water flooding across the county (main event 10&ndash;12 June 2012). Some property flooding occurred; river levels in parts of the county (notably Aldingbourne Rife and the Manhood Peninsula rife network) remained high for days after the rain. [PAG,IMG] (p17)</p></div><div class="nugget-popup"><p>Experienced flood incidents during the heavy rainfall of 10&ndash;12 June 2012, which disrupted roads, hospitals and schools and led to evacuations and protective/pumping operations across the county. [PAG] (p18)</p></div><div class="nugget-popup"><p>Cluster identified as affected by the June 2012 floods. Properties in this area suffered flooding impacts that ranged from external flooding (gardens, outbuildings, garages) to some properties being internally affected. Affected properties were mapped and prioritised for follow&ndash;up investigation. (p21)</p></div><div class="nugget-popup"><p>County&ndash;wide intense rainfall produced spatial clusters of property flooding, with the majority of affected properties concentrated in the southwest of the county (notably around the South Downs and adjacent coastal towns). [IMG,PAG] (p23)</p></div><div class="nugget-popup"><p>In June 2012 widespread flooding traumatised people and damaged homes; many residents faced the prospect of moving out of their homes for many months due to flood damage. (p52)</p></div><div class="nugget-popup"><p>A very heavy rainfall event on 10&ndash;12 June 2012 (in excess of a 1 in 200 year event) caused widespread surface water/urban flooding across West Sussex; highway drainage (road gullies) failed to cope with the intensity of the rain. (p57)</p></div><div class="nugget-popup"><p>An extreme rainfall event on 10/11 June 2012 produced widespread flooding across parts of the county, affecting communities and properties. [PAG] (p58)</p></div><div class="nugget-popup"><p>Widespread flooding across parts of the county between 10 June 2012 and 12 June 2012 caused by extreme rainfall and hydraulic overloading of drainage systems. Almost 800 properties were affected. Contributing factors cited include lack of riparian maintenance and loss of land drainage, infilling/piping of ditch lines, weed and plant growth slowing flow in ditches, and poor condition or loss of surface water sea outfalls. (p59)</p></div><div class="nugget-popup"><p>Extreme rainfall overwhelmed drainage infrastructure across the county. Public drainage systems (including culverts) failed to cope with the volume of water, resulting in flooding that affected residents; the report also notes many residents were not registered for the EA flood warning service. [PAG] (p61)</p></div><div class="nugget-popup"><p>Widespread flooding across the county: WSFRS Command and Mobilising Centre received large numbers of calls for flooded properties; basement flooding at Worthing Hospital affected lift shafts; over twenty basement properties on South Terrace, Littlehampton required pumping and most residents left their properties; extensive flooding affected Felpham and Bognor Regis with water rescues; Aldingbourne Rife levels were lowered using an HVP; mutual aid from Hampshire crews was required to maintain emergency cover. (p67)</p></div><div class="nugget-popup"><p>The county experienced flooding associated with the event of 10&ndash;12 June 2012, triggering community support and multi&ndash;agency recovery activity. (p70)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>almost 800 properties; up to 370 properties (p3)</p></div><div class="nugget-popup quant"><p>780 properties (p5)</p></div><div class="nugget-popup quant"><p>almost 800 properties [PAG] (p58)</p></div><div class="nugget-popup quant"><p>almost 800 properties (p59)</p></div><div class="nugget-popup quant"><p>over 2,000 calls requesting assistance; over 20 basement properties pumped on South Terrace, Littlehampton; over 30 residents and guests evacuated from Bracklesham caravans (p67)</p></div></div></body></div>`)[0];

                var html_b04a45d06868d99284d0a0934d307993 = $(`<div id="html_b04a45d06868d99284d0a0934d307993" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Arun</h1><div class="nugget-popup"><p>District experienced flooding that prompted opening of rest centres, displacement and temporary accommodation of residents, coordinated multi&ndash;agency recovery activity and monitoring of pollution and sea&ndash;water quality. (p64)</p></div><div class="nugget-popup"><p>Arun was the main area affected by the floods. Arun&#8217;s services attended recovery work: Housing Management and WSCC Social Services addressed accommodation difficulties for vulnerable people and the homeless; Waste collection services provided skips and help to residents clearing flood&ndash;damaged items; Environmental Services worked with the Environment Agency to monitor pollution reports and sea water quality. Residents reported concerns about over&ndash;development and lack of maintenance of ditches and watercourses contributing to flooding. [PAG] (p65)</p></div><div class="nugget-popup"><p>Identified as the main area affected by the floods: extensive flooding across the district led to basement flooding in Littlehampton requiring pumping, evacuations and water rescues in Felpham and Bognor Regis, deployment of a High Volume Pump to lower levels of the Aldingbourne Rife, and evacuations from flooded static caravans in Bracklesham. [PAG] (p66)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over twenty basement properties on South Terrace, Littlehampton; over thirty residents and guests evacuated from flooded caravans [PAG] (p66)</p></div></div></body></div>`)[0];

                var html_918ae3d9d81a80f1d5c50ea007ac1208 = $(`<div id="html_918ae3d9d81a80f1d5c50ea007ac1208" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bognor Regis</h1><div class="nugget-popup"><p>Bognor Regis conurbation was among the worst affected in the 10&ndash;12 June 2012 event; properties flooded and the conurbation is thought to have been flooded primarily by surface water. (p3)</p></div><div class="nugget-popup"><p>The Bognor to Chichester area recorded the highest rainfall during the 10&ndash;12 June 2012 event; the intense rainfall overloaded local drainage leading to surface water/urban flooding in low&ndash;lying parts of the area. (p5)</p></div><div class="nugget-popup"><p>Extreme, highly localised rainfall was recorded in Bognor Regis during the event. The Environment Agency rain gauge at Bognor Regis recorded 114mm over the whole event &mdash; the highest 24&ndash;hour total recorded at Bognor since EA records began in 1974 &mdash; and the report characterises this as approximately a 1&ndash;in&ndash;200&ndash;year (0.5% annual chance) rainfall event. A separate town council gauge and other local gauges reported substantially higher totals at nearby locations, indicating an exceptionally intense, localised storm over the Bognor area and implying a high potential for disruption. [PAG] (p15)</p></div><div class="nugget-popup"><p>Extremely intense, localized rainfall during the June 2012 event (recorded as one of the highest totals in the EA network) contributed to surface water flooding; properties in the area were flooded during the main event. [PAG,IMG] (p17)</p></div><div class="nugget-popup"><p>Part of the area that experienced flood incidents during the heavy rainfall on 10&ndash;12 June 2012; flooding disrupted roads, hospitals and schools and contributed to evacuations and protective/pumping operations. (p18)</p></div><div class="nugget-popup"><p>Properties were flooded as part of the Central Bognor Regis and Bersted cluster. [TAB] (p22)</p></div><div class="nugget-popup"><p>Properties in and around Bognor Regis were flooded due to intense rainfall concentrated in the area; affected properties are clustered within the highest rainfall contour zones (80&ndash;99 mm and 100+ mm). [IMG] (p23)</p></div><div class="nugget-popup"><p>Extensive flooding affected the town; a number of residents were assisted from their properties by specially equipped water rescue crews. (p67)</p></div><div class="nugget-popup"><p>Widespread flooding in the Bognor area resulted in homes being flooded and residents being assisted by water rescue crews. The incident was part of the multi&ndash;agency search and rescue and recovery operation. [PAG] (p68)</p></div><div class="nugget-popup"><p>Communities in the Bognor Regis area (including Shripney and Felpham) formed flood action groups (SCFAG, WFFAA), held multi&ndash;engagement meetings and took part in a local flood fair; the NFF continued to support resilience planning. [PAG] (p81)</p></div><div class="nugget-popup"><p>Flooding affected communities in the Bognor Regis area, prompting local community response: new and existing local groups became active and a flood fair was held to engage residents; the National Flood Forum (NFF) offered help and support to affected residents and groups. [PAG] (p82)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>up to 370 properties (Bognor Regis conurbation incl. Middleton on Sea, Elmer and Felpham) (p3)</p></div><div class="nugget-popup quant"><p>140 properties (Central Bognor Regis and Bersted combined) [TAB] (p22)</p></div><div class="nugget-popup quant"><p>250 homes [PAG] (p68)</p></div></div></body></div>`)[0];

                var html_a933698c1fbbdb571edb0896c856c8ba = $(`<div id="html_a933698c1fbbdb571edb0896c856c8ba" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Littlehampton</h1><div class="nugget-popup"><p>Named as one of the worst&ndash;affected areas during the 10&ndash;12 June 2012 event; widespread flooding affected properties in the town. (p3)</p></div><div class="nugget-popup"><p>Very heavy bursts of rain led to flood incidents in Littlehampton, disrupting roads, services (including schools and hospitals) and prompting evacuation and protective actions. (p18)</p></div><div class="nugget-popup"><p>The South Terrace area of Littlehampton experienced flooding, with properties affected in this cluster. [TAB] (p22)</p></div><div class="nugget-popup"><p>Properties in Littlehampton were affected by rainfall&ndash;driven flooding; the map shows clustered 'property affected' markers within the highest rainfall contour near the coastal area. [IMG] (p23)</p></div><div class="nugget-popup"><p>High volumes of surface water inundated and overwhelmed surface water and combined/foul sewer systems; surcharged systems and overwhelmed highway drainage caused flows to be transported above ground via roads into properties. Public foul drainage and local wastewater pumping stations were manned and additional pumps deployed to maintain operation. [PAG] (p33)</p></div><div class="nugget-popup"><p>Local roads and car parks (for example Wick Precinct; Banjo Road adjacent to South Terrace) were flooded; residents reported impacts including bow waves from vehicles on flooded roads, insufficient drain capacity, need for road closures, instances of foul water pumping, delayed emergency response and concerns over insurance and property reinstatement. (p53)</p></div><div class="nugget-popup"><p>Location of an Inspire Leisure rest centre opened to accommodate residents displaced by the flooding. (p64)</p></div><div class="nugget-popup"><p>Basement flooding on South Terrace required pumping; most affected residents had to leave their homes. (p67)</p></div><div class="nugget-popup"><p>Extensive basement flooding on South Terrace required pumping; most residents of those basement properties had to leave their properties. The area is also reported as having around 20 homes flooded during the event. [PAG] (p68)</p></div><div class="nugget-popup"><p>Highway drainage adjacent to the mini golf was identified for upgrade following flooding; proposed improvements to the existing highway drainage to reduce future flooding of the road and adjacent land. [TAB] (p84)</p></div><div class="nugget-popup"><p>Multiple highway drainage defects across the town required jetting and repairs (including Lyminster Road and Sea Road) to clear blocked gullies and remove floodwater from roads and parking areas. [TAB] (p106)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>85 properties [TAB] (p22)</p></div><div class="nugget-popup quant"><p>over 20 basement properties (p67)</p></div><div class="nugget-popup quant"><p>over twenty basement properties; 20 homes [PAG] (p68)</p></div></div></body></div>`)[0];

                var html_00e398eb6c093d9957881752bda97eb1 = $(`<div id="html_00e398eb6c093d9957881752bda97eb1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Worthing</h1><div class="nugget-popup"><p>Named as one of the worst&ndash;affected areas during the 10&ndash;12 June 2012 event; widespread flooding affected properties in the town. (p3)</p></div><div class="nugget-popup"><p>Area was among the worst affected by the 10&ndash;12 June 2012 storm; extreme rainfall overloaded local drainage networks causing surface water/urban flooding. Floodwaters attracted national media attention; flooding generally dissipated over 2&ndash;3 days and caused property flooding though no significant infrastructure damage is reported in the text. (p5)</p></div><div class="nugget-popup"><p>Properties were flooded in Central Worthing. [TAB,PAG] (p22)</p></div><div class="nugget-popup"><p>Properties in the town were mapped as affected (blue property markers) within the highest rainfall zones during the June 2012 event, indicating property inundation from intense rainfall / surface water flooding. [IMG] (p23)</p></div><div class="nugget-popup"><p>Central Worthing experienced flooding along and over the route of the piped/culverted Teville Stream during the June 2012 event; properties, gardens, roads and parkland in the area were flooded. Flooding incidents east of the hospital/Homefield Park contained sewage, indicating sewer surcharging and contamination. [PAG] (p47)</p></div><div class="nugget-popup"><p>During 10 Jun 2012 &ndash; 12 Jun 2012 heavy rain coinciding with high tide reduced outflow through sea outfalls and caused sewer surcharging. Floodwaters spread laterally across West Worthing, inundating properties, gardens, roads and parkland; some flooding incidents reported contamination by sewage. (p50)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>17 properties (Central Worthing) [TAB,PAG] (p22)</p></div></div></body></div>`)[0];

                var html_cf003183ca1a852864745b9f99231781 = $(`<div id="html_cf003183ca1a852864745b9f99231781" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Middleton-On-Sea</h1><div class="nugget-popup"><p>Part of the Bognor Regis conurbation that reported flooding during 10&ndash;12 June 2012; thought to have been flooded primarily by surface water. (p3)</p></div><div class="nugget-popup"><p>The Middleton and Elmer cluster experienced flooding; properties in this combined area were affected. [TAB] (p22)</p></div><div class="nugget-popup"><p>The Middleton area (specifically Central Drive, West Drive and Southdean Close) experienced surface water flooding during the June 2012 extreme event caused by a lack of highway drainage and failing soakaways; subsequent to the event WSCC jetted and cleansed the highway drainage system. (p26)</p></div><div class="nugget-popup"><p>Overland surface water ran into the Elmer Sands Estate from fields to the north (Ancton Lodge Lane area) and along Elmer Road and Kingsmead Road. Highway drainage entered a culvert beneath Elmer Road that was observed to be flowing slowly during the June event, indicating restricted discharge; this culvert discharges into silted IDB ditches on the north side of Ancton Lane which restricted outflow and contributed to local flooding. [PAG] (p28)</p></div><div class="nugget-popup"><p>Areas of Middleton (including private estates such as Lodge Close and Willowbrook) experienced surface water flooding. Private and highway drainage were overwhelmed or constrained by silted/blocked culverts and restricted outlets, causing surface water to pond and back up into estate roads and properties. Investigations and jetting after the event confirmed blockages and culvert restrictions affecting flow and storage. [PAG,IMG] (p29)</p></div><div class="nugget-popup"><p>Part of the area where homes were flooded and visited by police and rescue teams; residents were assisted during search and evacuation operations. (p68)</p></div><div class="nugget-popup"><p>Following the June 2012 flood WSCC carried out jetting and CCTV surveys; the Elmer Road to Ancton Lane ditch line was cleared of overgrowth and the piped highway drainage was jetted with repair work identified to the piped system. [TAB] (p84)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>up to 370 properties (Bognor Regis conurbation incl. Middleton on Sea, Elmer and Felpham) (p3)</p></div><div class="nugget-popup quant"><p>152 properties [TAB] (p22)</p></div><div class="nugget-popup quant"><p>part of estimated 250 homes flooded in Felpham, Middleton and Elmer; NPT leafleted approximately 1,000 homes in Felpham, Elmer and Middleton; approximately 100 vulnerable persons contacted (area) (p68)</p></div></div></body></div>`)[0];

                var html_bf2bf72a036960b46ea3a13a6d7921cc = $(`<div id="html_bf2bf72a036960b46ea3a13a6d7921cc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Elmer</h1><div class="nugget-popup"><p>Part of the Bognor Regis conurbation that reported flooding during 10&ndash;12 June 2012; thought to have been flooded primarily by surface water. (p3)</p></div><div class="nugget-popup"><p>Identified as part of Cluster 1 (Middleton and Elmer) and recorded among the areas that suffered a high number of 'properties affected' during the 10&ndash;12 June 2012 floods. Properties experienced flooding of gardens, outbuildings and garages and some properties were reported as internally affected; the cluster was prioritised for investigation and mapping of affected properties. (p21)</p></div><div class="nugget-popup"><p>Properties were flooded as part of the Middleton and Elmer cluster. [TAB] (p22)</p></div><div class="nugget-popup"><p>The Elmer Rife and associated ditches have a historically slow discharge and were contributing to raised flood risk. The Environment Agency were on site on 10&ndash;12 June 2012 to clear the Elmer Rife weedscreen of blockages to reduce the risk of watercourse outfall restriction. [PAG] (p25)</p></div><div class="nugget-popup"><p>Affected by flooding as part of the Felpham/Middleton/Elmer area: properties visited during search and rescue and recovery; residents were checked and assisted by multi&ndash;agency teams. (p68)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>up to 370 properties (Bognor Regis conurbation incl. Middleton on Sea, Elmer and Felpham) (p3)</p></div><div class="nugget-popup quant"><p>152 properties (Middleton and Elmer combined) [TAB] (p22)</p></div><div class="nugget-popup quant"><p>part of estimated 250 homes flooded in Felpham, Middleton and Elmer; NPT leafleted approximately 1,000 homes in Felpham, Elmer and Middleton; approximately 100 vulnerable persons contacted (area) (p68)</p></div></div></body></div>`)[0];

                var html_0537b5f8845c11b1a4f95b550bb76179 = $(`<div id="html_0537b5f8845c11b1a4f95b550bb76179" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Felpham</h1><div class="nugget-popup"><p>Part of the Bognor Regis conurbation that experienced flooding primarily from surface water; properties were inundated as part of the wider local flood impacts. (p3)</p></div><div class="nugget-popup"><p>Properties in Felpham were affected by flooding reported in the cluster. [TAB] (p22)</p></div><div class="nugget-popup"><p>A259 (Felpham Way) experienced significant surface&ndash;water/urban flooding with road inundation extending into driveways and front gardens and vehicles partially submerged (photo evidence). Flooding was exacerbated by a tide&ndash;locked sea outfall requiring storage during high tide, reduced storage capacity where the overflow ditch has been infilled/enclosed within gardens, and loss of historical connection to Ley Road ditch; restrictions in the SWS surface water sewer (e.g. past root&ndash;blocking) were also noted as contributing factors. The Davenport Road area was pumped clear and A259 drained down following pumping. [IMG,PAG] (p31)</p></div><div class="nugget-popup"><p>Felpham's outfall infrastructure (Felpham Pumping Station and related tidal outfalls) is listed as EA responsibility and is described as operating normally during the 10&ndash;12 Jun 2012 flood event. Southern Water has separately proposed contingency pumping arrangements for flooding in Felpham. (p55)</p></div><div class="nugget-popup"><p>Location of an Inspire Leisure rest centre opened to accommodate residents displaced by the flooding. (p64)</p></div><div class="nugget-popup"><p>Extensive flooding affected the area; residents were assisted from their properties by specially equipped water rescue crews. (p67)</p></div><div class="nugget-popup"><p>Extensive flooding affected Felpham; residents were assisted from their properties by specially equipped water rescue crews; area formed part of a cluster of flooded homes in Felpham, Middleton and Elmer that were visited and checked by responding agencies. [PAG] (p68)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>up to 370 properties (Bognor Regis conurbation: Middleton on Sea, Elmer and Felpham) (p3)</p></div><div class="nugget-popup quant"><p>43 properties [TAB] (p22)</p></div><div class="nugget-popup quant"><p>part of estimated 250 homes flooded in Felpham, Middleton and Elmer; NPT leafleted approximately 1,000 homes in Felpham, Elmer and Middleton; approximately 100 vulnerable persons contacted (area) [PAG] (p68)</p></div></div></body></div>`)[0];

lass="nugget-popup quant"><p>4 properties; approximately 300mm (road depth in parts) [PAG] (p43)</p></div></div></body></div>`)[0];
