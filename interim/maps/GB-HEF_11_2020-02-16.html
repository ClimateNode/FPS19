                var html_8206019862a89f7c584f0c63a349a064 = $(`<div id="html_8206019862a89f7c584f0c63a349a064" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Luston Primary School</h1><div class="nugget-popup"><p>Recorded as being impacted during the February 16, 2020 flood event. Flooding arose from surface water runoff (drains could not convey water away quickly) and fluvial/surface&ndash;water interaction on low&ndash;lying land, causing internal/area flooding of the school (critical infrastructure). No injuries or loss of life were reported. [TAB] (p2)</p></div><div class="nugget-popup"><p>Surface water overland flow appeared to pool behind the school before discharging to the watercourse, contributing to local flood risk. (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 school (Westland Primary School) [TAB] (p2)</p></div></div></body></div>`)[0];

                var html_8ed565c921572814aaf9c621138df960 = $(`<div id="html_8ed565c921572814aaf9c621138df960" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ridgemoor Brook</h1><div class="nugget-popup"><p>The Ridgemoor Brook and its upper tributaries (an ordinary watercourse) are implicated in fluvial flooding that led to internal flooding of properties in Luston; tributary flows contributed to surface&ndash;water risk around the village. [MUL] (p2)</p></div><div class="nugget-popup"><p>Identified as a small watercourse contributing to fluvial flooding in Luston. The brook, together with multiple overland flow routes, contributed to the complex flooding mechanism for the location. Downstream diversion of the channel and possible partial blockages where the channel runs deep may have reduced channel capacity. The brook has been targeted for Natural Flood Management measures and a feasibility study has been proposed by the LLFA. [MUL] (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Five properties; 7 properties [MUL] (p2)</p></div></div></body></div>`)[0];

                var html_6b668356e36660529f52bc1c334593d1 = $(`<div id="html_6b668356e36660529f52bc1c334593d1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Luston</h1><div class="nugget-popup"><p>Internal flooding from a small unmapped watercourse/tributary through the village: properties experienced floodwater from the watercourse and from surface&ndash;water runoff (water running down the road). Surface water runoff also caused a dwelling to flood and contributed to flooding at Westland Primary School (critical infrastructure). Foul flooding is referenced. Fire Service attended a domestic property during the event. [MUL] (p2)</p></div><div class="nugget-popup"><p>The village experienced fluvial (small watercourse/Ridgemoor Brook) and surface water flooding during the February 2020 event; respondents reported overland flows and overflowing streams, and foul/sewer flooding and blocked gullies were also reported as part of the episode. [MUL] (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Five properties; 7 properties [MUL] (p2)</p></div></div></body></div>`)[0];
