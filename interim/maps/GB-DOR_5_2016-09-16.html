                var html_fad8b48fe2564d15a932c79c033cae36 = $(`<div id="html_fad8b48fe2564d15a932c79c033cae36" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>The Square, Wimborne Minster</h1><div class="nugget-popup"><p>The Square was within the area described as most affected by surface water flooding during the heavy storm on 16 September 2016; it forms the northern boundary of the affected area in the town centre. [IMG,PAG] (p6)</p></div><div class="nugget-popup"><p>Surface water flood risk extends across The Square in the 1 in 100 year event, and a commercial property in The Square was reported as experiencing internal and external flooding following the heavy storm. [PAG] (p8)</p></div><div class="nugget-popup"><p>Internal flooding reported to 1 commercial property; the reporter indicated a further 2 commercial properties were also affected. [TAB] (p9)</p></div><div class="nugget-popup"><p>Surface water run&ndash;off from the public highway collected at a slot highway drainage location immediately in front of a commercial property during the storm and could not drain quickly enough, resulting in surface water entering and causing internal flooding of the commercial property. [IMG,PAG] (p10)</p></div><div class="nugget-popup"><p>Surface water run&ndash;off from the road and pavement collected at the location of slot highway drainage on the eastern side of The Square during the storm in the early hours of 16 September 2016 and entered a commercial property, causing internal flooding. The slot drainage was later found to be blocked and required jetting. Records and proprietor account also identify previous similar occurrences (including an event thought to be in August 2011) where standing water and bow waves from vehicular movement contributed to water entering the same commercial property. [PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Slot drain jetting was carried out throughout The Square following the storm; the Wimborne Square Enhancement Scheme had installed slot drains and paved footpaths intended to pass excess flows if slot drains surcharged or blocked. [IMG] (p12)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>three commercial properties (total across The Square, High Street and East Street) [PAG] (p8)</p></div><div class="nugget-popup quant"><p>1 commercial property internally flooded; 2 additional commercial properties affected [TAB] (p9)</p></div><div class="nugget-popup quant"><p>1 commercial property [IMG,PAG] (p10)</p></div></div></body></div>`)[0];

                var html_b89efb7972c852667b03a6e68ec8b794 = $(`<div id="html_b89efb7972c852667b03a6e68ec8b794" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>High Street, Wimborne Minster</h1><div class="nugget-popup"><p>High Street formed the western boundary of the area most affected by surface water flooding in the town centre during the heavy rainfall event on 16 September 2016; the surface water sewer runs southerly along High Street as described in the drainage section. [IMG,PAG] (p6)</p></div><div class="nugget-popup"><p>Surface water flowed along the southern end of High Street during heavy rainfall, with internal and external flooding reported at a commercial property in High Street during the storm. Surface water flood maps show risk at the southern end of High Street in a 1 in 30 year event and across High Street in a 1 in 100 year event. The slot drain along High Street (ending between Nos. 1 and 7) was designed with gullies and pavement profiles to convey excess flow if the slot drain surcharged or blocked. [PAG] (p8)</p></div><div class="nugget-popup"><p>Internal flooding reported to 1 commercial property; the reporter indicated a further 3 commercial properties were also affected. [TAB] (p9)</p></div><div class="nugget-popup"><p>Reports were received of commercial properties on High Street suffering internal flooding during/after the heavy storm in the early hours of 16th September 2016. (p10)</p></div><div class="nugget-popup"><p>A commercial property on the eastern side of High Street reported internal flooding during the storm in the early hours of 16 September 2016. Rainfall run&ndash;off collected immediately in front of the property and entered when it reached sufficient depth; additional surface water run&ndash;off from the car park to the rear collected along the northern wall and entered through the side of the premises. [PAG] (p11)</p></div><div class="nugget-popup"><p>Surface water run&ndash;off collected immediately in front of properties and contributed to internal flooding; the slot highway drainage system to the north of the affected property was found to be in need of jetting and was subsequently jetted throughout High Street. (p12)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>three commercial properties (total across The Square, High Street and East Street) [PAG] (p8)</p></div><div class="nugget-popup quant"><p>1 commercial property internally flooded; 3 additional commercial properties affected [TAB] (p9)</p></div></div></body></div>`)[0];

                var html_afc4a192e354d1b84c4159feada01cf2 = $(`<div id="html_afc4a192e354d1b84c4159feada01cf2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wimborne Minster</h1><div class="nugget-popup"><p>The town centre experienced a storm with heavy rainfall in the early hours of 16 September 2016; the town centre area suffered surface water flooding (urban/surface water inundation) affecting the area bounded by The Square (north), East Street (south), High Street (west) and the River Allen (east). (p6)</p></div><div class="nugget-popup"><p>Reports of internal and external flooding affecting commercial properties located in The Square, High Street and East Street. [TAB] (p9)</p></div><div class="nugget-popup"><p>A heavy storm in the early hours of 16 September 2016 caused surface water/urban flooding across Wimborne Town Centre. In the following days there were reports of commercial properties suffering internal flooding, specifically in The Square, High Street and East Street. [IMG,MUL] (p10)</p></div><div class="nugget-popup"><p>Highway flooding occurs regularly during intense rainfall, causing surface water flooding in the town centre and affecting highway drainage infrastructure; this flooding is reported likely to have occurred during the events/incidents referenced in the report. [PAG] (p14)</p></div><div class="nugget-popup"><p>The town centre experienced surface water flooding risk and/or reported surface water flooding incidents; this prompted actions to review and clear highway drainage, collect as&ndash;built records for the Wimborne Square Enhancement Scheme, review surface water sewers and historical flooding information, and consider property&ndash;level resilience measures. [TAB,PAG] (p15)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 commercial properties reported flooded [TAB] (p9)</p></div><div class="nugget-popup quant"><p>three locations [TAB,PAG] (p15)</p></div></div></body></div>`)[0];
