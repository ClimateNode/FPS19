                var html_0f7fa7459f46f3c354da4daa9b440199 = $(`<div id="html_0f7fa7459f46f3c354da4daa9b440199" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Chorley Road, Walton-Le-Dale</h1><div class="nugget-popup"><p>Chorley Road in Bamber Bridge was affected by flooding during the January 2022 event referenced in the document. (p1)</p></div><div class="nugget-popup"><p>A number of homes on Chorley Road suffered internal flooding when a culverted local watercourse, which had been accidentally obstructed during nearby demolition works, backed up and overflowed into the public highway. Floodwater in the highway rose above property thresholds. The damaged and obstructed lengths of the culvert were later replaced, which remedied the problem. (p3)</p></div><div class="nugget-popup"><p>Damage to a culverted watercourse during demolition/site clearance caused a significant blockage that prevented normal flow and local highway drainage. Under heavy rainfall the public highway flooded, water breached thresholds of nearby homes and caused extensive flood damage to ground floors. Emergency out&ndash;of&ndash;hours response was required from the police and the local highway authority. The culvert was repaired and there have been no further instances of flooding since repairs were completed by the end of February 2022. (p6)</p></div></div></body></div>`)[0];
