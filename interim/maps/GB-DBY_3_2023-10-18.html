                var html_626802cf0e723d777f7be0fb97fcc675 = $(`<div id="html_626802cf0e723d777f7be0fb97fcc675" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bottle Brook</h1><div class="nugget-popup"><p>Bottle Brook recorded shorter and earlier river responses to the heavy rainfall and its gauging stations produced some of the highest&ndash;ranked flows or levels on record in response to Storm Babet. (p3)</p></div><div class="nugget-popup"><p>Bottle Brook overtopped/caused fluvial flooding in Little Eaton that resulted in internal flooding of nearby residences on both banks. [IMG] (p16)</p></div><div class="nugget-popup"><p>Bottle Brook overtopped/increased flow during the event and caused internal flooding to nearby residential properties on the west side (around Croft End) and to a property on the east side of the brook in Little Eaton. [PAG,IMG] (p17)</p></div><div class="nugget-popup"><p>Bottle Brook is the local watercourse on whose floodplain the affected properties lie; a flood alert for the 'Bottle Brook in Derbyshire' Flood Alert Area was issued on 19 October 2023 and properties on its floodplain experienced internal flooding during the event period (noting the Smithy Houses gauge did not reach the flood&ndash;warning threshold). [PAG,IMG] (p18)</p></div><div class="nugget-popup"><p>High river levels in Bottle Brook during the event contributed to flooding impacts in adjacent communities; elevated levels would have closed a flap valve preventing ingress to the surface water network and were associated with internal flooding of nearby properties (including eight homes in the local community and 17 properties in Lower Kilburn during Storm Babet). [PAG] (p19)</p></div><div class="nugget-popup"><p>High river levels in Bottle Brook contributed to flooding in Lower Kilburn, closed a flap valve on a surface water outfall and would have prevented discharge back into the brook, impacting the connected surface water network. [PAG] (p20)</p></div><div class="nugget-popup"><p>Bottle Brook floods its floodplain and has caused river flooding of Lower Kilburn; historical flood incidents are recorded (1977, 2007) and the Environment Agency assessment following Storm Babet indicates recent flood activity associated with the brook that has affected nearby properties. [PAG,IMG] (p21)</p></div><div class="nugget-popup"><p>River flows in Bottle Brook inundated Gypsy Bridge to the north of Lower Kilburn and then spread southwards, contributing to flooding in Lower Kilburn (combining with surface water from the east). (p22)</p></div><div class="nugget-popup"><p>Overflow/overflowing along the Bottle Brook (including culverted sections) was closely associated with internal flooding of properties in Denby Bottles during Storm Babet. [IMG] (p24)</p></div><div class="nugget-popup"><p>Bottle Brook overflowed and caused flooding of the Denby Bottles community; the Environment Agency historic map and report link Bottle Brook to the internal flooding of properties during the storm. [PAG,IMG] (p25)</p></div><div class="nugget-popup"><p>Bottle Brook caused river flooding that led to internal flooding of properties in Denby Bottles during Storm Babet. The Environment Agency's historic flood map identifies Bottle Brook as having flooded Denby Bottles in the past. [PAG,IMG] (p26)</p></div><div class="nugget-popup"><p>Bottle Brook North and Bottle Brook East overtopped their channels and caused fluvial flooding in the Denby Bottles area. Exceedance of Bottle Brook North at two upstream locations led to floodwater spilling onto Derby Road and flowing south along the road; a further channel exceedance and right&ndash;bank exceedance at the Denby Institute and Recreation Ground caused water to enter non&ndash;residential buildings. Floodwater entered properties from both front (via Derby Road) and rear. [IMG,PAG] (p27)</p></div><div class="nugget-popup"><p>Bottle Brook North exceeded its channel at two upstream locations and further downstream, spilling onto Derby Road and using Derby Road as a secondary flow route. Floodwater entered properties on Derby Road via their fronts and also from the rear due to downstream channel exceedance. Properties further south experienced greater depths. Channel exceedance on the right bank at Denby Institute and Recreation Ground caused internal flooding of The Bowling Green Sports Pavilion and the Denby Institute and Recreation Ground building. [PAG] (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8 residential properties; 7 homes west of the brook; 1 home east of the brook [IMG] (p16)</p></div><div class="nugget-popup quant"><p>8 residential properties; 1 property (east side of Bottle Brook) [PAG,IMG] (p17)</p></div><div class="nugget-popup quant"><p>8 properties; 17 properties [PAG] (p19)</p></div><div class="nugget-popup quant"><p>17 residential properties [PAG] (p20)</p></div><div class="nugget-popup quant"><p>35 properties internally flooded in Denby Bottles (see Denby Bottles entry) [IMG] (p24)</p></div><div class="nugget-popup quant"><p>two channel exceedances upstream; 35 properties internally flooded (total across Denby Bottles) [IMG,PAG] (p27)</p></div><div class="nugget-popup quant"><p>28 homes; 3 businesses; 2 buildings; flood depths between 0.1m and 1m [PAG] (p28)</p></div></div></body></div>`)[0];

h local flood risk; Derbyshire County Council is progressing studies of natural flood management measures in response to flooding in the area (e.g., leaky dams, floodplain reconnection, bunding, woodland creation). (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>six residential properties (p28)</p></div><div class="nugget-popup quant"><p>3 homes [IMG,PAG] (p29)</p></div><div class="nugget-popup quant"><p>6 properties (community total: 2 Brookside Road; 1 Moor Road; 3 Rectory Lane); 0.5 m depth (road flooding in low spots) [PAG] (p32)</p></div></div></body></div>`)[0];

                var html_58921c71f0bb25221c6dababf3ed3e35 = $(`<div id="html_58921c71f0bb25221c6dababf3ed3e35" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Derwent</h1><div class="nugget-popup"><p>River Derwent experienced later and longer flow responses to Storm Babet with record/highest&ndash;ranked flows or levels at downstream stations (notably St Mary's Bridge in Derby). Upstream locations (Yorkshire Bridge, Mytham Bridge) did not record high&ndash;ranking flows because Ladybower Reservoir was intentionally drawn down by Severn Trent prior to the event to create storage capacity. (p3)</p></div><div class="nugget-popup"><p>High river levels on the River Derwent during the storm hindered the River Amber's ability to discharge into it, causing the Amber to back up, rise and contribute to overtopping of Amber banks that flooded local properties. (p10)</p></div><div class="nugget-popup"><p>Environment Agency issued a Flood Warning for the River Derwent at Baslow and Bubnell on 20 October; floodwater from Bar Brook converged towards the River Derwent, increasing river levels and flood risk in the Baslow area. [IMG,PAG] (p15)</p></div><div class="nugget-popup"><p>A Flood Warning was issued for the River Derwent at Baslow and Bubnell on 20 Oct 2023 at 15:44. (p16)</p></div><div class="nugget-popup"><p>Flood Warning was issued for the River Derwent at Baslow and Bubnell on 20 October, and Flood Alerts covered the Upper River Derwent and tributaries, indicating elevated river levels and flood risk to communities along the Derwent. [PAG] (p17)</p></div><div class="nugget-popup"><p>A flood warning for the River Derwent at Little Eaton was issued on 21 October 2023 as part of the incident; this formed part of the local flood risk during the same period. [PAG] (p18)</p></div><div class="nugget-popup"><p>Lower Kilburn sits in the Derwent catchment and experienced internal property flooding during the event; high flows in tributary Bottle Brook (within the Derwent catchment) contributed to property flooding. (p19)</p></div><div class="nugget-popup"><p>The River Derwent (Lower Derwent) formed part of the flood alert/warning area for the event and contributed to local flood risk around Duffield as described in flood warning coverage. [IMG] (p43)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>27 hours lag time between peak rainfall and peak flow at St. Mary's Bridge; 'highest ranked flows or levels on record' recorded at St. Mary's Bridge (p3)</p></div><div class="nugget-popup quant"><p>17 residential properties (p19)</p></div><div class="nugget-popup quant"><p>33 flooded properties were within flood alert/warning areas that include the 'Lower Derwent' Flood Alert Area [IMG] (p43)</p></div></div></body></div>`)[0];

                var html_9782aa96df404120b91f147691387e84 = $(`<div id="html_9782aa96df404120b91f147691387e84" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Ecclesbourne</h1><div class="nugget-popup"><p>Downstream reaches of the River Ecclesbourne recorded shorter and earlier responses to the heavy rainfall during Storm Babet. Gauging stations on the River Ecclesbourne produced some of the highest&ndash;ranked flows or levels on record in response to the event. (p3)</p></div><div class="nugget-popup"><p>River flooding on the Ecclesbourne floodplain was associated with internal flooding of properties in Duffield; flooded homes are concentrated adjacent to the watercourse (notably around Ecclesbourne Avenue and Village Court). [IMG] (p41)</p></div><div class="nugget-popup"><p>The River Ecclesbourne flows through the Duffield floodplain and is identified as a main river contributing to flooding of adjacent properties; flood maps show Flood Zone 3/2 adjacent to the river and the report records past and recent flooding in Duffield linked to the watercourse. [IMG] (p42)</p></div><div class="nugget-popup"><p>Flooding of properties in Duffield associated with the River Ecclesbourne during the event; the river is the subject of flood alerts/warnings and has historic flood defence walls (constructed 1970&ndash;1975) intended to provide ~1% AEP standard of protection. The river&#8217;s condition (conveyance) was a focus of maintenance activity immediately prior to the event. [IMG,PAG] (p43)</p></div><div class="nugget-popup"><p>The River Ecclesbourne exceeded its capacity and overflowed its banks and formal defences in several locations through Duffield, overtopping left banks and defences, flowing overland via the riverside footpath, across Duck Island bridge, and directly causing internal flooding to numerous properties and flooding of roads and gardens. [PAG] (p44)</p></div><div class="nugget-popup"><p>Raised flows/overflow from the River Ecclesbourne contributed to flooding of adjacent low&ndash;lying areas in Duffield, including overflow of ordinary watercourses near the school and flood flows toward Village Court and nearby locations. [IMG] (p46)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>7 hours lag time (shortest lag at Duffield on the River Ecclesbourne); 'highest ranked flows or levels on record' at River Ecclesbourne gauging stations (p3)</p></div><div class="nugget-popup quant"><p>34 properties internally flooded in Duffield (31 residential; 3 non&ndash;residential including Duffield Meadows Primary School); map annotations show 5 homes flooded on Ecclesbourne Avenue and 19 homes flooded on Village Court [IMG] (p41)</p></div><div class="nugget-popup quant"><p>30 properties in Flood Zone 3; 3 properties in Flood Zone 2; 1 property in Flood Zone 1 (Duffield, per Flood Map for Planning) [IMG] (p42)</p></div><div class="nugget-popup quant"><p>33 flooded properties (within flood alert/warning areas) [IMG,PAG] (p43)</p></div><div class="nugget-popup quant"><p>31 homes internally flooded; 3 non&ndash;residential properties internally flooded [PAG] (p44)</p></div></div></body></div>`)[0];

; three properties flooded externally; flood depths reached 0.6 m [PAG,IMG] (p6)</p></div></div></body></div>`)[0];

                var html_2e46329e755b3350bffecc28b677fe5f = $(`<div id="html_2e46329e755b3350bffecc28b677fe5f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Derbyshire</h1><div class="nugget-popup"><p>Multiple communities within the county experienced flooding during the storm: internal flooding of homes in Amber Valley (Ridgeway) and Drover&#8217;s Way, widespread local responses including sandbag requests, pumping of water and silt by Fire and Rescue at Lilac Way, and culvert blockage and siltation that impeded drainage (silt subsequently removed). [PAG] (p7)</p></div><div class="nugget-popup"><p>Communities within Derbyshire (notably Ridgeway along the River Amber) experienced river flooding during Storm Babet, resulting in internal flooding of residential properties. [PAG,IMG] (p8)</p></div><div class="nugget-popup"><p>Communities in Derbyshire adjacent to the River Amber experienced river flooding that resulted in internal and external flooding of residential properties; affected properties fall within EA River Amber flood alert/warning areas. (p10)</p></div><div class="nugget-popup"><p>The county experienced a flood event tied to the River Amber and associated surface&ndash;water and sewer impacts: flood warnings/alerts were issued, local pumping infrastructure was overwhelmed causing sewer backup and foul flooding around properties, and surface water runoff contributed to property inundation with internal depths recorded up to 0.9 m. (p11)</p></div><div class="nugget-popup"><p>The report records internal flooding within Derbyshire at Baslow (Baslow East) during Storm Babet: properties located on the floodplain of Bar Brook were inundated, resulting in internal flooding of homes and non&ndash;residential buildings in the Baslow East community. [IMG] (p12)</p></div><div class="nugget-popup"><p>The Baslow East community (within Derbyshire) experienced river flooding when Bar Brook exceeded capacity and flooded residential properties; flood alerts and a flood warning were issued for areas in Derbyshire during the event. [PAG] (p14)</p></div><div class="nugget-popup"><p>The Upper River Derwent in Derbyshire was issued a flood alert by the Environment Agency on 20 Oct 2023 at 09:26. [IMG,PAG] (p16)</p></div><div class="nugget-popup"><p>High flows in Bottle Brook during Storm Babet caused river overtopping and internal flooding of residential properties in Lower Kilburn. Surface water and foul sewer systems were overwhelmed (manhole surcharging reported); the Little Eaton pumping station pumped throughout but was overwhelmed by flows. Severn Trent identified an ordinary watercourse connected to their surface water network and report the flap valve on the system outfall would have closed when Bottle Brook levels were high, impacting the network's ability to discharge. [PAG,IMG] (p20)</p></div><div class="nugget-popup"><p>Communities within Derbyshire (for example Breadsall) experienced river flooding when Dam Brook and Boosemoor Brook overflowed during Storm Babet, causing internal flooding of residential properties. (p28)</p></div><div class="nugget-popup"><p>Flooding in the Breadsall area during 18&ndash;21 Oct 2023 included a Flood Alert for the Lower Derwent on 19 Oct and internal flooding of six residential properties on 20 Oct 2023. (p32)</p></div><div class="nugget-popup"><p>Within Derbyshire, the village of Castleton experienced river flooding from Peakshole Water during Storm Babet, resulting in internal flooding of properties. [IMG,PAG] (p52)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 100 requests for sandbags; 15 requests responded to; 16 residential properties internally flooded in Ridgeway; 3 homes flooded on Drover's Way [PAG] (p7)</p></div><div class="nugget-popup quant"><p>16 residential properties [PAG,IMG] (p8)</p></div><div class="nugget-popup quant"><p>16 homes internally flooded; 4 homes externally flooded; 3 homes flooded on Drovers Way (p10)</p></div><div class="nugget-popup quant"><p>0.9 m internal flooding depth (p11)</p></div><div class="nugget-popup quant"><p>9 residential properties; 11 non&ndash;residential properties [IMG] (p12)</p></div><div class="nugget-popup quant"><p>17 residential properties; 14 homes on Derby Road [PAG,IMG] (p20)</p></div><div class="nugget-popup quant"><p>six residential properties (p28)</p></div><div class="nugget-popup quant"><p>6 properties (p32)</p></div><div class="nugget-popup quant"><p>24 residential properties; 5 non&ndash;residential properties [IMG,PAG] (p52)</p></div></div></body></div>`)[0];

                var html_31a68bf2f5eeff2f4ab6e85edb611911 = $(`<div id="html_31a68bf2f5eeff2f4ab6e85edb611911" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Duffield</h1><div class="nugget-popup"><p>The gauging station at Duffield on the River Ecclesbourne recorded the shortest lag between peak rainfall and peak flow, indicating a rapid river response during Storm Babet. (p3)</p></div><div class="nugget-popup"><p>Internal flooding to properties in the village during the event; a mix of terraced, semi&ndash;detached and detached homes and businesses were affected. [PAG] (p40)</p></div><div class="nugget-popup"><p>Internal flooding of local properties during Storm Babet; flooding concentrated near open and culverted watercourses (notably around Ecclesbourne Avenue and Village Court). Flooded premises include a mix of terraced, semi&ndash;detached and detached homes and businesses; vulnerable community facilities and groups are present in the flooded area. [IMG,PAG] (p41)</p></div><div class="nugget-popup"><p>Flooding associated with the River Ecclesbourne and surface&ndash;water/urban runoff during 18 Oct 2023&ndash;21 Oct 2023 caused properties in Duffield to flood and affected local transport routes. The event led to multiple property flood incidents in the town; local roads in the vicinity of the watercourses were impacted. [PAG] (p43)</p></div><div class="nugget-popup"><p>River Ecclesbourne exceeded capacity and overflowed banks and formal defences through Duffield during Storm Babet, causing overtopping of defence walls (e.g. at Village Court and Duffield Tennis Club), flow across Duffield Tennis Club onto rear gardens and roads, flooding down Town Street (road closure) and internal flooding of multiple residential and non&ndash;residential properties. [PAG] (p44)</p></div><div class="nugget-popup"><p>Localized flooding across the village from overland flow routes and overflowing watercourses. Notable impacts include overflow points at Duck Island and Village Court, overtopping of flood defence walls (Village Court and Duffield Tennis Club), road closures (Town Street) and evacuations. [IMG,PAG] (p46)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>34 properties; 31 residential properties; 3 non&ndash;residential properties [PAG] (p40)</p></div><div class="nugget-popup quant"><p>34 properties internally flooded; 31 residential; 3 non&ndash;residential (including Duffield Meadows Primary School); map annotations show 5 homes flooded on Ecclesbourne Avenue and 19 homes flooded on Village Court [IMG,PAG] (p41)</p></div><div class="nugget-popup quant"><p>33 flooded properties within a flood alert or flood warning area; 1 flooded property not within a Flood Alert Area or Flood Warning Area [PAG] (p43)</p></div><div class="nugget-popup quant"><p>31 homes internally flooded; 3 non&ndash;residential properties internally flooded [PAG] (p44)</p></div></div></body></div>`)[0];

ties [PAG] (p19)</p></div><div class="nugget-popup quant"><p>17 residential properties [PAG,IMG] (p20)</p></div><div class="nugget-popup quant"><p>17 properties [PAG] (p22)</p></div></div></body></div>`)[0];

                var html_8301ace9003600bae3ceb296ca3f39b2 = $(`<div id="html_8301ace9003600bae3ceb296ca3f39b2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Denby Bottles</h1><div class="nugget-popup"><p>Internal flooding of residential and non&ndash;residential properties during Storm Babet; flooding clustered along Derby Road and Prospect Road and closely associated with the course and culverted sections of Bottle Brook. [IMG,PAG] (p24)</p></div><div class="nugget-popup"><p>Properties in Denby Bottles experienced internal flooding during Storm Babet. Flooding was associated with Bottle Brook and coincided with high surface&ndash;water risk shown on long&ndash;term maps; most flooded homes were terraced residential properties located within Flood Zone 3. [PAG,IMG] (p25)</p></div><div class="nugget-popup"><p>Properties in Denby Bottles suffered internal flooding during Storm Babet (18 Oct 2023 &ndash; 21 Oct 2023). Most of the flooded residential properties were terraced homes. All flooded homes are located in Flood Zone 3 and were within the 'Bottle Brook Derbyshire' Flood Alert Area and the 'Bottle Brook at Rawson Green' Flood Warning Area. The Long Term Flood Risk (surface water) mapping shows the flooded properties lie within a high surface&ndash;water&ndash;risk area. [PAG,IMG] (p26)</p></div><div class="nugget-popup"><p>The community experienced fluvial flooding driven by Bottle Brook overtopping. Thirty&ndash;five properties across three areas in Denby Bottles suffered internal flooding: two non&ndash;residential properties within the Denby Institute and Recreation Ground, twenty&ndash;eight homes and three businesses on Derby Road, and two homes on Prospect Road. Flooding concentrated in lower elevation zones adjacent to the watercourses. [IMG] (p27)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>35 properties internally flooded; 30 homes; 5 non&ndash;residential (including businesses); 28 terraced homes on Derby Road; 2 internally flooded homes on Prospect Road; 2 internally flooded non&ndash;residential properties north of Derby Road. [IMG,PAG] (p24)</p></div><div class="nugget-popup quant"><p>35 properties internally flooded; breakdown: 2 non&ndash;residential properties (Denby Institute and Recreation Ground); 28 homes and 3 non&ndash;residential properties (Derby Road); 2 homes (Prospect Road) [IMG] (p27)</p></div></div></body></div>`)[0];

ve overtopped around 08:30 on 20 October before receding and then rising again; Brookside Road flooded to about 0.5 m in low spots and remained flooded until around 15:00, after which levels began to recede. Sewer network surcharge associated with the road flooding contributed to internal property flooding. (p32)</p></div><div class="nugget-popup"><p>Internal flooding affected at least one property (water entering buildings) and floodwater from drainage surcharge impacted property access; a demountable driveway flood barrier prevented flood water reaching another property. [PAG] (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>six residential properties [PAG] (p28)</p></div><div class="nugget-popup quant"><p>6 homes flooded internally [IMG,PAG] (p29)</p></div><div class="nugget-popup quant"><p>six homes; two properties on Brookside Road; one property on Moor Road; three properties on Rectory Lane; 0.5 m depth (road low spots) (p32)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p33)</p></div></div></body></div>`)[0];

                var html_6c5abfb3bd4e1b4f51c73a55844a0a1e = $(`<div id="html_6c5abfb3bd4e1b4f51c73a55844a0a1e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bradwell</h1><div class="nugget-popup"><p>Internal flooding of residential and non&ndash;residential properties concentrated along Bradwell Brook; impacts to homes, holiday lets, commercial properties and public buildings in the village. [IMG] (p47)</p></div><div class="nugget-popup"><p>Flooding has affected the village on multiple occasions. The community impacted has included residential properties, holiday lets, commercial properties and businesses, public buildings, schools and churches. The majority of flooded homes are shown as being in Flood Zone 3 (greater than 1% AEP from rivers). The village is described as vulnerable to flooding from main river, ordinary watercourse, surface water and old mining drains. [IMG,PAG] (p48)</p></div><div class="nugget-popup"><p>Multiple sources of flooding (Bradwell Brook, an unnamed watercourse and surface water) caused internal flooding of properties across the village during Storm Babet. Properties on Church Street, Brookside, Soft Water Lane and other streets were affected; flood warnings and alerts covered the village. [IMG,PAG] (p49)</p></div><div class="nugget-popup"><p>Multiple sources of flooding affected the village: Bradwell Brook, an unnamed watercourse and surface water runoff. Twenty&ndash;nine properties internally flooded across the village (26 residential, 3 non&ndash;residential). Surface water flooded the B6049 along its full width (shallow). One property is built over Bradwell Brook where a culvert with silt/debris may have reduced capacity, contributing to local flooding. [IMG,PAG] (p50)</p></div><div class="nugget-popup"><p>Flooding in the village linked to reduced culvert capacity under a property on Soft Water Lane (Bradwell Brook). Reported road flooding depths: Church Street near the bridge was reported as shin&ndash;deep and depths on Soft Water Lane were reported deeper. The Environment Agency issued a Flood Alert (19 Oct 2023 19:13) and a Flood Warning (20 Oct 2023 13:16) for Bradwell; EA operatives removed large blockages during the event and conducted CCTV surveys prior to Storm Babet. [PAG,MUL] (p51)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>26 residential properties; 3 non&ndash;residential properties [IMG] (p47)</p></div><div class="nugget-popup quant"><p>Flooding recorded in 1991, 1997, 1998, 2007, 2010, 2015, 2021 and 2022 [IMG,PAG] (p48)</p></div><div class="nugget-popup quant"><p>29 properties internally flooded; 26 residential houses; 3 non&ndash;residential; 17 houses on Church Street; 2 houses on Brookside; 2 houses on Soft Water Lane; 1 house each on The Hills, Town Gate, Bridge Street, New Church Street [IMG,PAG] (p49)</p></div><div class="nugget-popup quant"><p>29 properties; 26 residential houses; 3 non&ndash;residential; 17 houses on Church Street; 2 houses on Brookside; 2 houses on Soft Water Lane; 1 house on The Hills; 1 house on Town Gate; 1 house on Bridge Street; 1 house on New Church Street; 1 property built over Bradwell Brook [IMG,PAG] (p50)</p></div><div class="nugget-popup quant"><p>one property built over Bradwell Brook [PAG,MUL] (p51)</p></div></div></body></div>`)[0];

ass="nugget-popup quant"><p>24 residential properties; 5 non&ndash;residential properties [IMG,PAG] (p52)</p></div><div class="nugget-popup quant"><p>29 homes and commercial properties internally flooded; includes 17 homes and 3 commercial holiday lets on Millbridge, Trickett Close and Mill Court; 4 homes and 2 commercial properties on The Island; 1 home on Waterside; 1 on The Stones; 1 on Eades Fold. [IMG,PAG] (p54)</p></div></div></body></div>`)[0];

                var html_6a1f6f840d1a9a7762bd2d34c6e4cd34 = $(`<div id="html_6a1f6f840d1a9a7762bd2d34c6e4cd34" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Clay Cross</h1><div class="nugget-popup"><p>Smithy Brook (Press Brook), a tributary of the River Amber, flooded and caused internal flooding of residential properties in the town. (p55)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties within the town: homes adjacent to Smithy Brook flooded, reflecting inundation from the local watercourse and floodplain. [PAG] (p56)</p></div><div class="nugget-popup"><p>The residential community in Clay Cross is partly located within the Smithy Brook floodplain; properties adjacent to Windermere Road and Clay Lane lie within Flood Zones 2 and 3 and experienced river and surface&ndash;water flooding impacts (including internal flooding of some houses). [IMG,PAG] (p57)</p></div><div class="nugget-popup"><p>Internal flooding affected the community: floodwater entered residential properties, with photographic evidence showing flood marks about halfway up a door and wall of a property. (p58)</p></div><div class="nugget-popup"><p>Forty&ndash;five homes internally flooded; floodwater reached about halfway up external doors and walls. All properties on the east side of Windemere Road and the majority on the west side were internally flooded. Some properties on Clay Lane, Coniston Drive and Grasmere Avenue also flooded. Roads were impassable during the event, preventing sandbag delivery by the district council. (p59)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>45 residential properties (p55)</p></div><div class="nugget-popup quant"><p>45 residential properties [PAG] (p56)</p></div><div class="nugget-popup quant"><p>45 homes internally flooded (p58)</p></div><div class="nugget-popup quant"><p>45 homes (p59)</p></div></div></body></div>`)[0];
