                var html_8e3d83a0ac803d33b04e36726f0543ed = $(`<div id="html_8e3d83a0ac803d33b04e36726f0543ed" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Nene</h1><div class="nugget-popup"><p>The River Nene sits within Flood Zone 3 adjacent to Bedford Road; the flood hazard associated with the river area encompassed Bedford Road on 5th August 2013, during which the A428 Bedford Road was temporarily closed because of the depth of flood water and manhole covers being lifted. (p9)</p></div><div class="nugget-popup"><p>Elevated water levels in the River Nene in the vicinity of the incident during the 5th August 2013 event may have prevented discharge from drainage systems and contributed to local flooding impacts. (p20)</p></div><div class="nugget-popup"><p>A surface water outfall discharging into the River Nene was heavily clogged with debris (metal grate and organic/plastic material), partially blocking flow. The blockage would have impeded drainage into the Nene and increased the risk of upstream surface&ndash;water flooding during the flood investigation (documented following the 5 August 2013 event). [IMG] (p43)</p></div></div></body></div>`)[0];

                var html_d9de3869480e72112ec542ca79aa3a4a = $(`<div id="html_d9de3869480e72112ec542ca79aa3a4a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bedford Road, Northampton</h1><div class="nugget-popup"><p>Intense short&ndash;duration rainfall caused existing drainage to back up and overtop at ground level, resulting in surface water flooding of Bedford Road; the flood affected Bedford Road, a critical arterial route for Northampton. [PAG] (p6)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration rainfall overwhelmed local drainage; drainage systems backed up and overtopped at ground level, causing flooding of the carriageway on Bedford Road, disrupting this critical arterial route and prompting a formal Section 19 investigation. [PAG] (p7)</p></div><div class="nugget-popup"><p>The A428 Bedford Road was temporarily closed to traffic due to the depth of flood water and manhole covers being lifted; the closure affected a critical arterial route connecting Northampton town centre to the A45. [PAG] (p9)</p></div><div class="nugget-popup"><p>Standing water ponded in the carriageway (reaching a depth higher than the kerb lines so verges and footways were flooded), manhole covers were lifted by excessive volumes in the sewerage system, and the road was closed to through traffic causing delays, congestion and traffic diversions. (p12)</p></div><div class="nugget-popup"><p>Bedford Road was flooded by intense short&ndash;duration rainfall; existing drainage systems were unable to cope, became surcharged and ejected water back to the surface, causing surface water to flow into areas and drainage systems that could not manage the volume. (p17)</p></div><div class="nugget-popup"><p>Carriageway and road gullies on Bedford Road were liable to overflow during extreme rainfall, contributing to surface water flooding and increasing flood risk to lower&ndash;lying ground and properties; recommendation to allow controlled overflow routes to lower ground (e.g. grip drains, lowered verges). (p19)</p></div><div class="nugget-popup"><p>During the extreme rainfall on 5th August 2013 the carriageway and road gullies on Bedford Road overtopped, causing surface water to flow across the road. Measures were recommended to allow overflow of road gullies to lower ground (e.g. grip drains, lowering verges/footways) to reduce repeat overtopping. [PAG] (p20)</p></div><div class="nugget-popup"><p>Flooding occurred at the junction of Bedford Road and Cliftonville Road; Main River Nene overflowed into the adjacent flood channel south of Bedford Road. Flood pressures caused manhole covers to be lifted at the junction. [IMG,PAG] (p44)</p></div><div class="nugget-popup"><p>Flooding occurred at the junction of Bedford Road and Cliftonville Road; manhole covers were lifted (surcharging) and the junction was inundated. (p45)</p></div><div class="nugget-popup"><p>Flooding occurred at the west end of Bedford Road and at the junction with Cliftonville Road; surface water outfall to the River Nene is located at the west end south of the car park. Manhole covers were lifted, indicating sewer surcharge and local surface&ndash;water inundation. Low spots in the vertical alignment of Bedford Road contributed to ponding. [IMG,PAG] (p46)</p></div></div></body></div>`)[0];
