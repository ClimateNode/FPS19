                var html_6a059c86e07659b1ba1da9e3d6de1a89 = $(`<div id="html_6a059c86e07659b1ba1da9e3d6de1a89" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Grendon Brook</h1><div class="nugget-popup"><p>Grendon Brook is one of the main rivers that converges near Hall Farm/Lower End and contributed to flooding at that confluence. (p7)</p></div><div class="nugget-popup"><p>Grendon Brook (a main river close to Blackmile Lane) is associated with the area of deepest flooding shown on the map; river reaches follow low&ndash;lying zones and contributed to localised flooding when channel capacity was exceeded (recorded at Easter 1998) and during the heavy rainfall event that saturated the catchment prior to 14 July 2012. [IMG,PAG,MUL] (p8)</p></div><div class="nugget-popup"><p>Grendon Brook is included in the discussion of the Grendon Brook catchment being saturated by repeated intense rainfall leading up to and including the event on 14 July 2012. [MUL] (p22)</p></div><div class="nugget-popup"><p>Investigations found only two small sections where a shallow depth of water came out of Grendon Brook (shallow out&ndash;of&ndash;bank flow); these were considered too small to account for the overall flooding experienced. [PAG] (p23)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>flood depth just under 1 m at the confluence (deepest point) (p7)</p></div></div></body></div>`)[0];

                var html_42b6f50500fdc052564eb19324d77ed8 = $(`<div id="html_42b6f50500fdc052564eb19324d77ed8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Blackmile Lane, Grendon</h1><div class="nugget-popup"><p>Floodwater affected the street. (p1)</p></div><div class="nugget-popup"><p>Intense rainfall on a saturated catchment produced excess surface water that flowed to Blackmile Lane; resulted in internal flooding of properties on Blackmile Lane and closure of the highway. (p4)</p></div><div class="nugget-popup"><p>Significant flooding on 14 July 2012: residents reported chest&ndash;deep water on the highway; water came down the highway and pooled at the bottom of Blackmile Lane then came across adjacent fields; a small surge of fast&ndash;moving water was reported prior to the peak; emergency services attended and the highway was closed; internal flooding of nearby properties occurred. (p5)</p></div><div class="nugget-popup"><p>Water came down the highway and pooled at the bottom of Blackmile Lane, then came across fields to the southeast. Water rose steadily and some residents reported a small surge of fast&ndash;moving water prior to the peak. 31 properties on Blackmile Lane were evacuated by Northamptonshire Fire and Rescue Service and occupants were temporarily taken to Grendon Hall. [IMG,PAG] (p6)</p></div><div class="nugget-popup"><p>Internal flooding of properties (residential and commercial); flooding of grounds and gardens; access to properties was affected. (p9)</p></div><div class="nugget-popup"><p>Channelled surface water flowed across fields onto the lane. Access to about 31 properties (including flooded properties) was obstructed for several hours. The worst affected house at the bottom of Blackmile Lane was internally flooded to a depth of approximately 30cm. (p10)</p></div><div class="nugget-popup"><p>Volume of water pooled on the lane greatly exceeded channel capacity; a small culvert on the Gibbards Arm was completely submerged and there was flooding over a significant length of highway downstream of the structure. (p12)</p></div><div class="nugget-popup"><p>Some houses in Blackmile Lane experienced flooding; ditches between Grendon Brook and Blackmile Lane are noted as important to control surface water flow to protect these houses. (p13)</p></div><div class="nugget-popup"><p>Intense rainfall on a saturated catchment caused excess surface water to flow following natural contours toward the junction of Blackmile Lane and Main Road, producing surface water flooding of some properties; local features such as garden walls channelled flows and altered impacts to individual properties. (p14)</p></div><div class="nugget-popup"><p>Flooding occurred at Blackmile Lane on 14 July 2012. (p19)</p></div><div class="nugget-popup"><p>Flooding occurred on 14 July 2012 after intense short&ndash;duration rainfall on a saturated catchment; high river levels and inability of the ground to absorb water caused excess surface water to flow over ground following natural contours to the junction of Blackmile Lane and Main Road. [PAG] (p27)</p></div><div class="nugget-popup"><p>Excess surface water flowed over ground following natural contours to the junction at Blackmile Lane; surface water reached the junction (i.e. inundation along the lane leading to the junction with Main Road). (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than 5 properties (p4)</p></div><div class="nugget-popup quant"><p>more than 5 properties flooded internally (p5)</p></div><div class="nugget-popup quant"><p>31 properties [IMG,PAG] (p6)</p></div><div class="nugget-popup quant"><p>7 residential properties; 1 commercial property; approximately 31 properties had access affected (p9)</p></div><div class="nugget-popup quant"><p>approximately 31 properties; 1 property internally flooded to a depth of approximately 30cm (p10)</p></div></div></body></div>`)[0];

                var html_e2f2bf1a514f801877e16f2e5f0d7038 = $(`<div id="html_e2f2bf1a514f801877e16f2e5f0d7038" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Grendon</h1><div class="nugget-popup"><p>The flood on Blackmile Lane (within Grendon) caused internal flooding of properties and closure of the highway; records indicate similar flooding has occurred at this location in the past. (p4)</p></div><div class="nugget-popup"><p>The village experienced flooding during the event of 14 July 2012: significant rainfall over the local catchment produced runoff that caused chest&ndash;deep flooding on Blackmile Lane, required emergency services assistance, closed the highway and led to internal flooding of nearby properties. (p5)</p></div><div class="nugget-popup"><p>Blackmile Lane, on the northern edge of Grendon Village, experienced surface water/flash flooding that led to residents being evacuated (31 properties) and temporary sheltering at Grendon Hall. (p6)</p></div><div class="nugget-popup"><p>Parts of Grendon (specifically Lower End and the area around Hall Farm) experienced flooding where main rivers and ordinary watercourses converged, creating the deepest flood point in the area. [IMG,PAG] (p7)</p></div><div class="nugget-popup"><p>The civil parish area contains the low&ndash;lying catchment around Blackmile Lane where flooding concentrated near the confluence of main rivers (deepest flooding marked on the LiDAR&ndash;derived map). Recorded localised flooding events affecting this locality include Easter 1998 (channel capacity exceeded) and heavy rainfall affecting the catchment on 14 July 2012. [IMG,MUL] (p8)</p></div><div class="nugget-popup"><p>Assessed the main river and identified out&ndash;of&ndash;bank flows: two upstream locations where Grendon Brook overtopped its channel at natural low points; wrack lines showed out&ndash;of&ndash;bank flows that followed the channel to relatively shallow depths. Concluded a small amount of water left the channel but high water levels and limited channel capacity may have contributed to increased surface water in the catchment. [MUL] (p12)</p></div><div class="nugget-popup"><p>The Grendon area experienced a short, intense rainfall event between midnight and 04:30 on 14 July 2012 (44 mm reported), which contributed to saturation of the local catchment. (p22)</p></div><div class="nugget-popup"><p>There had been flooding in the area on 14 July 2012; a flood warning covering Grendon was issued at 06:52 on 14 July 2012. (p26)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than 5 properties (p4)</p></div><div class="nugget-popup quant"><p>more than 5 properties flooded internally (p5)</p></div><div class="nugget-popup quant"><p>31 properties (p6)</p></div><div class="nugget-popup quant"><p>flood depth just under 1 m at the deepest point affecting Lower End and Hall Farm [IMG,PAG] (p7)</p></div><div class="nugget-popup quant"><p>1 recorded flood event (Easter 1998) [IMG,MUL] (p8)</p></div></div></body></div>`)[0];

                var html_4813cf0a5ee0dd4ef5a53799d7215a36 = $(`<div id="html_4813cf0a5ee0dd4ef5a53799d7215a36" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Easton Maudit</h1><div class="nugget-popup"><p>The stream came out of bank (EA estimate of 0.5 m depth) and flowed down the main road, causing damage to bank protection measures in the area. (p11)</p></div><div class="nugget-popup"><p>Flooding from intense, short&ndash;duration rainfall led to reported damage to assets in Easton Maudit; NCC and the EA are recommended to investigate those reported asset damages. (p14)</p></div><div class="nugget-popup"><p>Included within the Grendon Brook Catchment flood warning area; a flood warning was issued at 06:52 on 14 July 2012. (p26)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>0.5 m depth (p11)</p></div></div></body></div>`)[0];
