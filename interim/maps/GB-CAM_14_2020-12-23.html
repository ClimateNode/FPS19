                var html_abe05fe69fedcb55a9540c9c510f8dae = $(`<div id="html_abe05fe69fedcb55a9540c9c510f8dae" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bury Brook</h1><div class="nugget-popup"><p>Bury Brook is the main river flowing through Broughton and is identified as the source of fluvial flooding in the village; high water levels in the brook exacerbate flooding when contributory watercourses and highway gullies cannot discharge, producing Flood Zone 3 along its immediate banks that affects adjacent properties and farmland. [PAG,IMG] (p5)</p></div><div class="nugget-popup"><p>Rapid runoff from intense rainfall on 23rd December 2020 led to a rapid rise in river levels and flooding from the Bury Brook, contributing to flooding in the village. (p7)</p></div><div class="nugget-popup"><p>Water levels in Bury Brook rose rapidly and exceeded channel capacity, contributing to river and surface water flooding of adjacent roads and properties and causing the highway drainage system to back up. (p11)</p></div><div class="nugget-popup"><p>Overflow/river&ndash;related flooding contributing to internal property flooding and local drainage issues in Broughton; prompted inspections and planned maintenance (including review of vegetation clearance, dredging feasibility and maintenance schedule). [TAB,PAG] (p13)</p></div><div class="nugget-popup"><p>Bury Brook was inspected visually following the December 2020 flooding; partners planned a review of maintenance along the brook including investigation of dredging and vegetation clearance, and to reinstate damaged/blocked grips between the highway and the brook. (p14)</p></div><div class="nugget-popup"><p>Bury Brook was identified as the watercourse for which flood alleviation measures are being considered following the 23 December 2020 flooding; it contributed to flooding in Broughton and is subject to planned mitigation actions. (p23)</p></div></div></body></div>`)[0];

                var html_0c212a9a039835992334df3d078b65a8 = $(`<div id="html_0c212a9a039835992334df3d078b65a8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bridge Road, Broughton</h1><div class="nugget-popup"><p>A combination of river flooding from the adjacent Bury Brook and surface water runoff occurred. Saturated catchment caused rapid runoff into the brook, highway gullies backed up, surface water travelled down Bridge Road into the village centre and pooled. [PAG] (p10)</p></div><div class="nugget-popup"><p>Surface water runoff and rising levels in Bury Brook caused highway drainage to back up; surface water travelled down Bridge Road into the village centre and pooled. Three residential properties, associated outbuildings and gardens were flooded; some residents were displaced and had to leave their homes for over one month. [TAB] (p11)</p></div><div class="nugget-popup"><p>Highway gullies on Bridge Road were found blocked as a result of the flooding; cleansing of blocked gullies was ordered and a post&ndash;flooding asset inspection was undertaken. [TAB,PAG] (p13)</p></div><div class="nugget-popup"><p>Blocked/covered gullies on Bridge Road contributed to drainage failure during the December 2020 flooding; the highway authority ordered cleansing of blocked gullies as part of the post&ndash;flood response and an inspection was scheduled. (p14)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 residential properties; maximum flood depth c.600mm; displacement &gt;1 month [TAB] (p11)</p></div></div></body></div>`)[0];

                var html_b0dca5634ccad235808561eb46430c00 = $(`<div id="html_b0dca5634ccad235808561eb46430c00" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Causeway Road, Broughton</h1><div class="nugget-popup"><p>Identified as one of three key flood incident locations in the village on 23 December 2020; the bend and adjacent road area were part of the mapped flood incidents and would have experienced road and nearby property/garden flooding associated with the village&ndash;wide event. [PAG] (p10)</p></div><div class="nugget-popup"><p>Highway gullies draining to Bury Brook and saturated ground resulted in rapid surface water runoff that travelled down these roads (School Road and Causeway Road) into the village centre, where water pooled and contributed to local flooding. (p11)</p></div><div class="nugget-popup"><p>Surface water run&ndash;off from saturated surrounding fields flowed onto Causeway Road and pooled at the bend. One residential property flooded internally to a maximum depth of approximately 300 mm, with additional outbuilding and garden flooding. [TAB] (p12)</p></div><div class="nugget-popup"><p>Blocked highway gullies on Causeway Road and School Road associated with the flooding were identified; cleansing was ordered and damaged/blocked grips between the highway and Bury Brook were flagged for reinstatement. [TAB,PAG] (p13)</p></div><div class="nugget-popup"><p>Blocked/covered gullies on Causeway Road and School Road were identified during the post&ndash;flood response; the highway authority ordered cleansing of blocked gullies and a joint site inspection was scheduled to check for additional blocked/covered gullies. (p14)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 residential property [TAB] (p12)</p></div></div></body></div>`)[0];

                var html_f684c6fe44f06ddbc333b819c8cddef3 = $(`<div id="html_f684c6fe44f06ddbc333b819c8cddef3" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>School Road, Broughton</h1><div class="nugget-popup"><p>Highway gullies draining to Bury Brook and saturated ground resulted in rapid surface water runoff that travelled down these roads (School Road and Causeway Road) into the village centre, where water pooled and contributed to local flooding. (p11)</p></div><div class="nugget-popup"><p>Blocked highway gullies on Causeway Road and School Road associated with the flooding were identified; cleansing was ordered and damaged/blocked grips between the highway and Bury Brook were flagged for reinstatement. [TAB,PAG] (p13)</p></div><div class="nugget-popup"><p>Blocked/covered gullies on Causeway Road and School Road were identified during the post&ndash;flood response; the highway authority ordered cleansing of blocked gullies and a joint site inspection was scheduled to check for additional blocked/covered gullies. (p14)</p></div></div></body></div>`)[0];

                var html_1fdc54369b964570e97ebfd52e9d08c2 = $(`<div id="html_1fdc54369b964570e97ebfd52e9d08c2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cambridgeshire</h1><div class="nugget-popup"><p>Rapid runoff on 23 December 2020 caused a rapid rise in Bury Brook and widespread surface water flooding in the village of Broughton. Impacts included internal flooding of homes and external flooding of gardens, outbuildings and roads. At least four properties remained uninhabitable 10 months after the event. [IMG] (p9)</p></div><div class="nugget-popup"><p>The highway authority (Cambridgeshire County Council) carried out post&ndash;flooding asset inspections, visual inspection of Bury Brook, arranged cleansing of blocked gullies and committed to look into reinstating damaged/blocked grips between the highway and Bury Brook as part of the response to the December 2020 flooding. (p14)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>15 flood reports; 16 properties; 4 properties [IMG] (p9)</p></div></div></body></div>`)[0];

                var html_e13243c72a7102bcdc718d73b6bcf945 = $(`<div id="html_e13243c72a7102bcdc718d73b6bcf945" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Broughton</h1><div class="nugget-popup"><p>Areas of the village (particularly along Bridge Road and Causeway Road and the village centre) have been flooded multiple times in recent years due to fluvial flooding from Bury Brook and from surface water runoff; flood zones on the map show properties and farmland adjacent to Bury Brook are at risk when water levels are high and drainage is unable to discharge to the brook. [PAG,IMG] (p5)</p></div><div class="nugget-popup"><p>Significant flooding affected the village on 23 December 2020. Flooding originated from Bury Brook (fluvial) and from surface&ndash;water runoff, causing inundation of low&ndash;lying parts of the settlement. [PAG,IMG] (p6)</p></div><div class="nugget-popup"><p>On 23rd December 2020 the village experienced surface&ndash;water flooding throughout the settlement and flooding caused by the Bury Brook following rapid runoff and rising river levels. (p7)</p></div><div class="nugget-popup"><p>Significant flooding across the village on 23 December 2020: river levels in the Bury Brook rose rapidly and exceeded channel capacity and surface water from intense rainfall led to widespread runoff and ponding. Properties flooded internally and external flooding affected gardens, outbuildings and roads; some properties remained uninhabitable months later. [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>Surface water runoff from surrounding fields and exceedance of Bury Brook channel capacity caused surface water to travel down roads (Bridge Road, School Road, Causeway Road) into the village centre where water pooled, exacerbating flooding in the central area of the village. (p11)</p></div><div class="nugget-popup"><p>Six residential properties were flooded internally to a maximum depth of approximately 900 mm. Additional outbuilding and garden flooding was noted. Some residents reported having to leave their houses for a period of over one month. [TAB] (p12)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties and local highway drainage failure: six residential properties flooded internally to a depth of c.300mm; highway gullies on Bridge Road, Causeway Road and School Road were blocked, contributing to local surface water/road flooding; damaged/blocked grips between the highway and Bury Brook were reported and to be reinstated. [TAB,PAG] (p13)</p></div><div class="nugget-popup"><p>Broughton experienced flooding on 23rd December 2020. The event prompted Environment Agency review and validation of flood warnings (leading to a lower river&ndash;level trigger and expansion of the flood warning area), and local flood&ndash;risk partners (LLFA, highways) to carry out post&ndash;flood inspections and community engagement. [PAG] (p14)</p></div><div class="nugget-popup"><p>Properties in Broughton were flooded during the December 2020 event. As a result, residents were affected by loss/damage from the flood and subsequent lack of eligibility for the previously activated Household Flood Resilience Grant (which was not activated for the December 2020 flooding). The event prompted a local flood investigation and follow&ndash;up actions by the LLFA and partners. [TAB,PAG] (p16)</p></div><div class="nugget-popup"><p>Surface water flooding affected the settlement during the 23 December 2020 event, leading to identified RMA operational and riparian maintenance issues and prompting LLFA and Cambridgeshire Highways to plan maintenance and upgrades to the highway drainage network to alleviate the problem. [TAB] (p23)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>16 properties; 4 properties [PAG,IMG] (p10)</p></div><div class="nugget-popup quant"><p>6 residential properties [TAB] (p12)</p></div><div class="nugget-popup quant"><p>6 residential properties; c.300mm internal flood depth [TAB,PAG] (p13)</p></div></div></body></div>`)[0];
