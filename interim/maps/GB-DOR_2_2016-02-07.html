                var html_d848102f78607f39a377d3f31966a8db = $(`<div id="html_d848102f78607f39a377d3f31966a8db" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Plush</h1><div class="nugget-popup"><p>On the evening of 7 Feb 2016 a flash flood from intense surface&ndash;water run&ndash;off and Plush Brook overtopping caused internal flooding of properties in the village; the brook rose rapidly and flowed out of bank, converging with additional run&ndash;off. (p10)</p></div><div class="nugget-popup"><p>The village experienced a flash/fluvial and surface water flood on the evening of 7 February 2016. Flows from the north and converging surface water routes caused internal flooding to properties; residents reported a 'roar of rushing water' prior to inundation. [IMG,PAG] (p11)</p></div><div class="nugget-popup"><p>These communities were subject to remedial works and reviews after flooding: WDDC jetted through the Flood Alleviation Scheme in Egypt (Piddletrenthide); a new sandbag store was set up in Plush and sandbag stores replenished in Piddletrenthide; DCC Highways reviewed highway drainage infrastructure in affected areas within Plush and Piddletrenthide and identified locations requiring further works. [TAB] (p17)</p></div><div class="nugget-popup"><p>Plush was affected by surface&ndash;water/runoff and watercourse issues during the event. Actions implemented included setting up a new sandbag store in Plush, DCC Highways reviewing highway drainage in Plush, and recommendations to keep Plush Brook channel clear of obstructions and to investigate diversion of surface water away from the village centre. [TAB,PAG] (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>7 properties flooded internally on 07 Feb 2016; 3 properties initially flooded by the brook; brook rose by approximately 1.5m (p10)</p></div><div class="nugget-popup quant"><p>7 properties flooded internally [IMG,PAG] (p11)</p></div></div></body></div>`)[0];
