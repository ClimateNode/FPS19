                var html_fb1e1adbe32d3ee9d678e745a935dcf2 = $(`<div id="html_fb1e1adbe32d3ee9d678e745a935dcf2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Burcote Fields, Towcester</h1><div class="nugget-popup"><p>Intense rainfall onto a saturated catchment caused excess surface water to flow to low points on Burcote Fields. Surface water was drained via highway drainage and flowed north beyond Burcote Fields toward Burcote Road. At least one property experienced internal flooding. [PAG] (p5)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration rainfall on a saturated catchment caused excess surface water to flow over ground to low points on Burcote Fields. This led to internal flooding of property(ies); flows were drained partly by highway drainage and also flowed north beyond Burcote Fields toward Burcote Road. [PAG] (p6)</p></div><div class="nugget-popup"><p>At least one residential property experienced internal flooding (water crossed the building threshold). Several other properties on the estate were identified as being at high risk of flooding. [PAG] (p8)</p></div><div class="nugget-popup"><p>A large volume and high&ndash;velocity surface water flow from the headwall of a culverted watercourse overtopped the headwall (the grille at the headwall was blocked by debris) and flowed over the footpath and into the carriageway. Flow followed natural contours to low points causing ponding immediately outside two residential properties; water entered at least one property and flooded the ground floor. (p11)</p></div><div class="nugget-popup"><p>Localised ponding reached a depth of approximately 150mm and entered at least one residential property, flooding the ground floor of that property to a depth of approximately 25mm. [PAG] (p12)</p></div><div class="nugget-popup"><p>Intense rainfall on a saturated catchment caused existing drainage systems and watercourses to be unable to convey flows; systems overtopped and water flowed to the low point at Burcote Fields. Drainage at this location was not designed to drain the quantity of water experienced to the public sewerage system. Inlets and structures were affected by silt and debris, reducing flow capacity. (p15)</p></div><div class="nugget-popup"><p>Flows of land drainage and surface water from higher ground overtopped drainage systems and collected at the low point at Burcote Fields. The existing drainage at this low point was not designed to cope with the volume experienced during the flood, resulting in overspill of land drainage onto the public highway and into private property. [PAG] (p16)</p></div><div class="nugget-popup"><p>Location of the culvert entrance where debris accumulated at the grille and downstream scour was observed; evidence indicates the field's drainage infrastructure experienced obstructive debris and erosive flows that affected the immediate area. [IMG] (p35)</p></div><div class="nugget-popup"><p>Downstream of a culvert the stream channel and a metal fence had accumulated debris (branches, leaves and litter) caught on and around the fence and culvert outlet, restricting flow. Scour marks and exposed soil on the banks indicate erosion and sediment deposition in the channel. Photographs show the low point in the Burcote Fields residential area adjacent to the channel. [IMG,PAG] (p36)</p></div><div class="nugget-popup"><p>Surface water collected at the low point in Burcote Fields and flowed toward the start of a culvert; surface water flows were reported moving through the field boundary (see gap at east boundary). [IMG,PAG] (p37)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least one property [PAG] (p5)</p></div><div class="nugget-popup quant"><p>at least one property; within the last five years (recurrence) [PAG] (p6)</p></div><div class="nugget-popup quant"><p>1 property flooded internally [PAG] (p8)</p></div><div class="nugget-popup quant"><p>150mm ponding outside two residential properties; 25mm depth of floodwater inside at least one property's ground floor; more than 1.5 metres of scouring on the watercourse banks south of Burcote Fields (p11)</p></div><div class="nugget-popup quant"><p>1 residential property; 150mm ponding; 25mm internal flood depth [PAG] (p12)</p></div></div></body></div>`)[0];
