                var html_ae92bb3fc0e263d75840d1aff9674c33 = $(`<div id="html_ae92bb3fc0e263d75840d1aff9674c33" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Silver Street North, Chacombe</h1><div class="nugget-popup"><p>Intense rainfall on a saturated catchment caused excess surface water to flow over ground following natural contours to low points on Silver Street North, resulting in internal flooding of at least one property. [PAG] (p5)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration rainfall on a saturated catchment caused excess surface water to flow over ground following natural contours to low points on Silver Street North. Historic drainage was ineffective, resulting in internal flooding of at least one property on Silver Street North; the same property has experienced internal flooding on multiple occasions over the previous five years. [PAG] (p6)</p></div><div class="nugget-popup"><p>Flooding occurred on Silver Street North on 16 March 2013; flood water crossed building thresholds and at least one residential property experienced internal flooding. Flooding on this street has been experienced multiple times in the five years prior to the investigation. (p8)</p></div><div class="nugget-popup"><p>Repeated flooding on Silver Street North during high rainfall events. Flooding previously reached the front door of one residential property on numerous occasions (prior to raised kerbs). After kerb works, flooding now affects the side doors and walls of that property. Flooding affected people and one property during the event on 16 March 2013. A residential property also flooded on 2 November 2012. [PAG,MUL] (p9)</p></div><div class="nugget-popup"><p>A large volume and high&ndash;velocity surface water flow moved south&ndash;to&ndash;north along Silver Street North, bypassing the road gully and flowing to the low point of the road. Kerbs at the low point prevented water entering the front door, but water built up against the building wall on the west side and entered a residential property through a stone wall and a west&ndash;facing doorway. Rooms within the property were affected and required constant attention to prevent spread; ponding at low points around the west of the property prevented flow away to the north. (p10)</p></div><div class="nugget-popup"><p>Flooding was reported at Silver Street North. The report notes the Main River accepting flow from the ordinary watercourse is not considered to have affected the flooding at Silver Street North. (p12)</p></div><div class="nugget-popup"><p>Highway drainage on Silver Street North was identified as needing full investigation because existing road drainage was implicated in being unable to manage the event, allowing surface water to flow from the highway toward low&ndash;lying residential areas. (p15)</p></div><div class="nugget-popup"><p>Highway drainage and its outfall on Silver Street North were identified as requiring examination because insufficient drainage capacity for highway runoff creates flood risk to properties; recommendations include cleansing, assessing capacity, adding or relocating road gullies and repairing/replacing outfall/culvert sections as required. (p16)</p></div><div class="nugget-popup"><p>Ponding/standing surface water observed along Silver Street North adjacent to a property at a low point, indicating local surface water flooding and increased inundation risk to the nearby property and carriageway. [IMG] (p39)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least one property [PAG] (p5)</p></div><div class="nugget-popup quant"><p>at least one property [PAG] (p6)</p></div><div class="nugget-popup quant"><p>at least 1 property (p8)</p></div><div class="nugget-popup quant"><p>one property (affected on 16 March 2013); one residential property (flooded on 2 November 2012) [PAG,MUL] (p9)</p></div><div class="nugget-popup quant"><p>one property (p10)</p></div></div></body></div>`)[0];
