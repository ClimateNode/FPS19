                var html_81a0c586bcc9f6f2bce10f3557797a51 = $(`<div id="html_81a0c586bcc9f6f2bce10f3557797a51" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Thames</h1><div class="nugget-popup"><p>High river levels in the Thames caused flooding of properties on the High Street (right bank) and made the highway on the opposite bank impassable. (p2)</p></div><div class="nugget-popup"><p>The River Thames caused flooding to properties on High Street in Clifton Hampden during the January 2024 event (those properties are in Flood Zone 3). [IMG] (p7)</p></div><div class="nugget-popup"><p>The River Thames overtopped/caused flooding that affected properties on High Street in Clifton Hampden on 4th January 2024 (these properties are in Flood Zone 3). [PAG] (p8)</p></div><div class="nugget-popup"><p>High river levels caused flooding of the High Street area: the highway on the left bank was flooded and impassable, and properties on the right bank close to the river experienced internal flooding. (p17)</p></div><div class="nugget-popup"><p>High river levels on the Thames caused internal flooding of a residential property on the right bank at High Street and internal flooding of the neighbouring pub's boiler room; flooding from the river also contributed to the highway becoming impassable on the opposite bank. (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one residential property; one business; highway on opposite bank impassable (p2)</p></div><div class="nugget-popup quant"><p>1 residential property; 1 business (p17)</p></div><div class="nugget-popup quant"><p>one residential property; one neighbouring pub boiler room (p19)</p></div></div></body></div>`)[0];

                var html_08a6908e3cb5b0de813a615582415e6c = $(`<div id="html_08a6908e3cb5b0de813a615582415e6c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Watery Lane, Clifton Hampden</h1><div class="nugget-popup"><p>Restrictions within the watercourse in Watery Lane caused backing up of flow and contributed to internal flooding of upstream properties. [PAG,MUL] (p2)</p></div><div class="nugget-popup"><p>Properties were flooded due to the unnamed ordinary watercourse and its tributary (culverted) that flows from the Watery Lane area through Clifton Hampden, forming part of Location 1 in the January 2024 event. (p7)</p></div><div class="nugget-popup"><p>Properties on Watery Lane (grouped with Abingdon Road) were flooded by water from an unnamed ordinary watercourse and tributary that left its channel upstream; properties were internally flooded during the early January 2024 event. (p13)</p></div><div class="nugget-popup"><p>A manhole on Watery Lane surcharged during the flood event, causing flooding on the private road. A second culverted watercourse carrying runoff from farmland to the east joins at the Watery Lane manhole location and contributed to the surcharge. The resident photo (Figure 9) documents flooding on Watery Lane. [PAG] (p15)</p></div><div class="nugget-popup"><p>Floodwater surcharged from multiple culvert/manhole chambers and flowed onto the carriageway; residents lifted manhole/chamber covers to release flood flows onto the road. Floodwater covered the full width of the lane, was turbid/muddy and impeded accessibility. Downstream manholes (S1, S2, S3) received water from the carriageway, indicating capacity constraints in the culvert sections. [IMG,PAG] (p16)</p></div><div class="nugget-popup"><p>Surcharging occurred at the culverted confluence/chamber (labelled S6) at the top of Watery Lane during the 4th January 2024 event; the chamber inlet arrangement (angled incoming culverts and a trash screen) contributed to turbulence and the surcharging observed. (p22)</p></div><div class="nugget-popup"><p>Surface water flows on Watery Lane surcharged from chamber S6 into the culvert system; two culvert covers on the culvert line have been replaced with grated covers since the January 4, 2024 event to receive flood water. (p24)</p></div><div class="nugget-popup"><p>Culvert restriction and reduced conveyance during the storm on 4 January 2024. A 450mm culvert and the confluence of two culverted watercourses on Watery Lane provided limited capacity and a lower invert outfall (~200mm lower than the brick culvert it discharges to), reducing flow conveyance and contributing to hydraulic inefficiency visible during inspection. [IMG,PAG] (p25)</p></div><div class="nugget-popup"><p>The confluence of two culverted watercourses on Watery Lane was restricted by a 450mm culvert installed in 2011, causing flow to back up and be significantly slower than calculations predicted during the flood (4 Jan 2024). Post&ndash;event inspections were limited by high water levels; an April 2024 CCTV survey was abandoned at 72m due to a 100% obstruction caused by root mass. The root mass was removed in May 2024. Recommendations were made to prevent future root ingress (reinforcement or tree removal). [PAG] (p26)</p></div><div class="nugget-popup"><p>A 450mm culverted watercourse experienced root ingress and capacity issues leading to backing up of the watercourse and surcharged flooding from manholes on Watery Lane; subsequent works after the event included cutting out the root mass, installing new grated manhole covers and reconstructing the downstream headwall. (p27)</p></div><div class="nugget-popup"><p>Culverted watercourse under/near Watery Lane has suffered root ingress and drainage restriction, contributing to surface water reaching the lane and nearby properties; recommendations include root prevention, additional gully drainage and grated manhole covers. [TAB] (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>five residential properties; one business [PAG,MUL] (p2)</p></div><div class="nugget-popup quant"><p>one manhole surcharged; one additional culverted watercourse joined at location [PAG] (p15)</p></div><div class="nugget-popup quant"><p>3 manholes (S1, S2, S3) [IMG,PAG] (p16)</p></div><div class="nugget-popup quant"><p>2 covers replaced (p24)</p></div><div class="nugget-popup quant"><p>450mm culvert cross&ndash;sectional area 0.159m2; two incoming culverts total 0.22m2; approximate full&ndash;bore capacity ~0.11m3/s (Watery Lane) vs downstream culvert ~0.14m3/s; invert level difference ~200mm [IMG,PAG] (p25)</p></div><div class="nugget-popup quant"><p>450mm culvert; 0.159m2 cross&ndash;sectional area; two incoming culverts total 0.22m2; approximate full&ndash;bore capacity ~0.11m3/s; downstream culvert capacity 0.14m3/s; CCTV survey abandoned at 72m due to 100% obstruction [PAG] (p26)</p></div></div></body></div>`)[0];

                var html_50d9ed8fe65a9e878f6e0d271e148f19 = $(`<div id="html_50d9ed8fe65a9e878f6e0d271e148f19" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Abingdon Road, Clifton Hampden</h1><div class="nugget-popup"><p>Floodwater discharged from a culvert inlet onto Abingdon Road when downstream channel siltation prevented discharge; highway drainage could not return the water and it crossed the road into nearby properties in Burcot. (p2)</p></div><div class="nugget-popup"><p>A terrace of cottages on Abingdon Road between Clifton Hampden and Burcot (Location 3) was flooded during the 4th January 2024 event; the report notes this location was distinct from the ordinary&ndash;watercourse and Thames&ndash;driven flooding and is described separately (implying surface water was the source). [PAG] (p8)</p></div><div class="nugget-popup"><p>Surface water flooding occurred on Abingdon Road between Clifton Hampden and Burcot (Location 3) on 4 January 2024. [PAG] (p9)</p></div><div class="nugget-popup"><p>Properties on Abingdon Road were flooded by water from an unnamed ordinary watercourse and tributary that overtopped its channel upstream; properties were internally flooded during the early January 2024 event. (p13)</p></div><div class="nugget-popup"><p>Cottages on the north side of Abingdon Road experienced floodwater at the outside of the buildings during the January event. Flooding resulted from elevated water levels in a nearby watercourse to the west combined with overland flow from waterlogged ground to the east; residents and the landowner cleared the watercourse after the flood. [PAG] (p18)</p></div><div class="nugget-popup"><p>Cottages on the north side of Abingdon Road (Location 3) experienced flooding to the exterior of the buildings (water reached the outside of the buildings) caused by a combination of elevated water levels in a watercourse to the west and overland flow from waterlogged ground to the east. Residents and the landowner cleared the watercourse after the event and have discussed options to reduce surface water flood risk. [TAB,PAG] (p19)</p></div><div class="nugget-popup"><p>A culvert under Abingdon Road at Location 2 was silted and blocked causing the culvert inlet to flood and the highway drainage to be unable to accept the additional flows; at Location 3 surface water flows reached the external fabric of cottages on Abingdon Road (not internally), and upstream channels have since been cleared with discussions to install a small earth bund to prevent overtopping. (p27)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>two properties (p2)</p></div></div></body></div>`)[0];

                var html_49ec471330c990c5ad54519f9dea96c0 = $(`<div id="html_49ec471330c990c5ad54519f9dea96c0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Burcot Park, Burcot</h1><div class="nugget-popup"><p>A channel located in the rear gardens of Burcot Park experienced siltation/obstruction that reduced culvert discharge capacity and contributed to flooding onto Abingdon Road and into properties. (p2)</p></div><div class="nugget-popup"><p>Report recommends desilting of the watercourse in rear gardens to allow the culvert to adequately discharge, indicating restricted discharge of the culvert and surface&ndash;water/overflow issues affecting rear gardens. [TAB] (p3)</p></div><div class="nugget-popup"><p>The culvert outfall from under the highway discharges into an open channel in the rear gardens of Burcot Park. Siltation in the culvert and restriction in the downstream channel reduced the ability to convey flows, contributing to overland flows that entered nearby properties and gardens. [PAG] (p17)</p></div><div class="nugget-popup"><p>Overland flows from farmland converged into a culvert which outfalls into an open channel in the rear gardens of Burcot Park. Siltation in the culvert and restrictions in the downstream channel reduced conveyance, highway drainage did not remove the out&ndash;of&ndash;channel flows and surface water entered properties in Burcot, causing internal flooding. [IMG,PAG] (p18)</p></div><div class="nugget-popup"><p>The open channel through Burcot Park properties was noted to have insufficient fall and silt accumulation affecting downstream discharge from the highway culvert; clearance and restoration of fall were recommended to allow adequate pass&ndash;forward flow. (p26)</p></div><div class="nugget-popup"><p>Downstream end of a culvert under Abingdon Road was silted and blocked so the highway culvert outfall lay fully below the bed of the channel; a hole in the top of the culvert became the effective discharge point. The culvert taking flows from land to the north flooded at the inlet and the highway drainage could not accept the additional flows, causing flows to pass through the open channel across Burcot Park properties. Clearance below the invert of the culvert outfall and regrading to provide a constant fall through the Burcot Park properties was recommended. Clifton Hampden Parish Council applied to OCC for grant funding to carry out a one&ndash;time watercourse clearance and desilting on behalf of riparian owners. [PAG] (p27)</p></div><div class="nugget-popup"><p>Back&ndash;up of a culverted watercourse in rear gardens reducing discharge capacity; recommendation to desilt the watercourse to allow culvert to adequately discharge. [TAB] (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>two properties (p2)</p></div><div class="nugget-popup quant"><p>two properties [PAG] (p17)</p></div><div class="nugget-popup quant"><p>2 properties [IMG,PAG] (p18)</p></div></div></body></div>`)[0];

                var html_60c3af5ebd3114f8a9db1f0c72bf63f1 = $(`<div id="html_60c3af5ebd3114f8a9db1f0c72bf63f1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>High Street, Clifton Hampden</h1><div class="nugget-popup"><p>High Thames levels flooded one residential property adjacent to the right bank and one business on the High Street; opposite bank highway was made impassable by flooding. (p2)</p></div><div class="nugget-popup"><p>One residential property directly adjacent to the right bank of the Thames and one business were flooded due to high river levels. [TAB,PAG] (p3)</p></div><div class="nugget-popup"><p>Properties on the High Street were flooded by the River Thames during the January 2024 event; these properties are located within Environment Agency Flood Zone 3 (high probability of river flooding). [PAG] (p7)</p></div><div class="nugget-popup"><p>Properties on High Street were flooded by the River Thames on 4th January 2024; these properties lie within Environment Agency Flood Zone 3 (high probability of river flooding). [PAG] (p8)</p></div><div class="nugget-popup"><p>High Street on the left bank of the Thames was flooded and impassable during the event; bow waves from vehicles passing through the floodwater increased risk to nearby properties. On the right bank one residential property and one business were internally flooded. (p17)</p></div><div class="nugget-popup"><p>At Location 4 (High Street) one residential property directly adjacent to the Thames was internally flooded due to high river levels (the January event was the third internal flooding experienced by the owners and the highest level they have seen). The boiler room of a neighbouring pub business was also internally affected. On the opposite bank the highway was made impassable by flooding though homes there were at higher ground and not internally affected. (p19)</p></div><div class="nugget-popup"><p>Location 1 runs to High Street; culverted watercourses at/near High Street were surveyed and found to have variable culvert sizes and capacity. Dye tests and invert level surveys identified sections with reduced/slow flow here that contributed to local flooding risk and were recommended for CCTV and jetting. (p20)</p></div><div class="nugget-popup"><p>High Street is affected by flood events to the extent that community&ndash;requested road closure signage is recommended, indicating the carriageway becomes impassable or hazardous during flooding. [TAB,PAG] (p33)</p></div><div class="nugget-popup"><p>High Street was identified as a location requiring community response road&ndash;closure signage for flood events, indicating it was affected by flooding that can require road closures. (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one residential property; one business (p2)</p></div><div class="nugget-popup quant"><p>1 residential property; 1 business [TAB,PAG] (p3)</p></div><div class="nugget-popup quant"><p>1 residential property; 1 business (p17)</p></div><div class="nugget-popup quant"><p>one residential property; one neighbouring pub boiler room; third instance of internal flooding (p19)</p></div></div></body></div>`)[0];

                var html_3b38c6ff36d0dd7612f3d737337fc577 = $(`<div id="html_3b38c6ff36d0dd7612f3d737337fc577" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Oxford Road, Clifton Hampden</h1><div class="nugget-popup"><p>Properties were flooded as a result of an unnamed ordinary watercourse and its tributary (culverted) that runs from the Oxford Road area through Clifton Hampden; this watercourse contributed to one of the four separate property&ndash;flood locations in the January 2024 event. (p7)</p></div><div class="nugget-popup"><p>Properties on Oxford Road were affected as part of Location 1: an unnamed ordinary watercourse and tributary overtopped upstream, flooding properties. Additionally, in 2021 flooding at Location 1 entered gardens close to property thresholds (no internal flooding recorded) and in early 2024 properties on Oxford Road were flooded from the same location; the watercourse is culverted beneath Oxford Road via a 375mm diameter pipe at the road crossing. [PAG,MUL] (p13)</p></div><div class="nugget-popup"><p>The culverted watercourse reaches Oxford Road at a 375mm pipe inlet and trash screen; flow continued along the culverted alignment alongside Oxford Road towards Courtiers Green during the flood event. Concerns were raised about the condition of this culverted section (last CCTV 2017). (p14)</p></div><div class="nugget-popup"><p>Location 1 is defined from Oxford Road to High Street; culverted watercourses along Oxford Road were surveyed and found to vary in size and capacity. Dye testing and invert surveys showed sections with slower flow here, indicating culvert capacity constraints that contributed to flooding risk and required further CCTV and jetting. (p20)</p></div><div class="nugget-popup"><p>During the 4 January 2024 event water came out of the channel onto Oxford Road. The main unnamed watercourse is culverted under Oxford Road (375mm diameter with a trash screen at the inlet). Following concerns about its condition, OCC Highways jetted the culvert and carried out a CCTV survey (30 April 2024) which showed the culvert section beneath Oxford Road to be in good condition. A secondary field&ndash;drainage culvert crosses under Oxford Road and connects to the main channel; a farm access crossing was improved after the January event to prevent water emerging onto the road. [IMG,PAG] (p21)</p></div><div class="nugget-popup"><p>Water from a culverted field drainage/main channel came out of its channel and flowed onto Oxford Road during the 4th January 2024 event. After the event, improvement works were carried out at a nearby farm access crossing to prevent water leaving the channel and reaching the road. [PAG] (p22)</p></div><div class="nugget-popup"><p>Blocked/partially blocked culverted watercourse and trash screen on Oxford Road impaired drainage, contributing to flooding of the highway and adjacent footpath; CCTV/jetting and remedial works recommended to restore flow. [TAB,PAG] (p33)</p></div><div class="nugget-popup"><p>Highway verge adjacent to a culverted watercourse was identified for review after the flood event; OCC to consider moving a recently planted tree to reduce risk of blockage or increased surface water transfer to nearby properties. (p34)</p></div></div></body></div>`)[0];

                var html_a6d1456ea30d0e2f33174552e067286f = $(`<div id="html_a6d1456ea30d0e2f33174552e067286f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Clifton Hampden</h1><div class="nugget-popup"><p>Multiple locations within the village/parish experienced flooding on 4 January 2024. Five residential properties and one business were internally flooded by water emerging from a channel in upstream farmland (exacerbated by channel restrictions and lack of maintenance). A property and a business on the High Street (adjacent to the right bank of the Thames) were internally flooded due to high river levels. Flooding between these areas reached homes north of Abingdon Road but did not cause internal flooding there. The five properties flooded by the channel were flooded again on 18 February 2024. [MUL] (p2)</p></div><div class="nugget-popup"><p>Within Clifton Hampden there were four separate locations of property flooding in the January 2024 event. Location 1 was flooding associated with an unnamed ordinary watercourse and its tributary culvert through Oxford Road, Courtiers Green and Watery Lane. Location 3 (Terrace of Cottages on Abingdon Road between Clifton Hampden and Burcot) and Location 4 (properties on High Street) were also affected; the High Street properties were flooded by the River Thames. Most affected properties were in Flood Zone 1, while those on High Street are in Flood Zone 3. [IMG] (p7)</p></div><div class="nugget-popup"><p>Four separate locations within the village experienced property flooding on 4th January 2024; sources included an unnamed ordinary (culverted) watercourse running through the village and, for the High Street area, the River Thames. [IMG,PAG] (p8)</p></div><div class="nugget-popup"><p>Flooding in the village was caused by ordinary watercourses and the River Thames, affecting low&ndash;lying areas adjacent to watercourses and properties/recreational land in Clifton Hampden on 4 January 2024. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>Two separate internal property flooding events occurred in early 2024: one associated with Storm Henk (early January) and a second event on 18 February 2024. Multiple locations within the parish flooded from different sources. Location 1 (part of these events) flooded properties on Oxford Road, Courtiers Green and Abingdon Road/Watery Lane from an unnamed ordinary watercourse and tributary that overtopped due to channel restrictions and lack of maintenance; upstream landowner later carried out remedial works. [MUL] (p13)</p></div><div class="nugget-popup"><p>Water came out of the channel onto farmland upstream of the village due to channel restrictions and lack of maintenance; the landowner has carried out remedial works since the flood. Within the village area, manholes on the footpath toward Watery Lane and on Watery Lane surcharged during the flood events. [IMG] (p14)</p></div><div class="nugget-popup"><p>Multiple local flood sources affected the village during the event: Watery Lane (an unadopted private highway) experienced surcharging from multiple chambers and residents lifted chamber covers to release flows onto the road; downstream manholes (S1, S2, S3) and adjacent culvert sections received water from the carriageway indicating limited culvert capacity; High Street (left bank) was flooded and impassable with bow waves from passing vehicles increasing risk to properties; one residential property and one business on the High Street right bank were internally flooded; a Thames Water foul sewer on High Street opposite the Post Office was reported to be surcharging and possibly discharging to the Thames near the pumping station (this sewer surcharge did not cause internal property flooding). (p17)</p></div><div class="nugget-popup"><p>Culverted watercourses in Clifton Hampden (Location 1, from Oxford Road to High Street) were surveyed and found to have a variety of culvert sizes and capacities. Dye testing and invert level surveys identified sections with reduced/slow flow in both publicly and privately owned culverts; these constrained flows were identified as contributing to local flooding risk and were flagged for further CCTV inspection and jetting. (p20)</p></div><div class="nugget-popup"><p>The main unnamed watercourse that runs through the village overtopped/escaped its channel during the January 4, 2024 event, causing water to come out of the channel toward the road and prompting subsequent improvement works to reduce further runoff onto the highway. [PAG] (p21)</p></div><div class="nugget-popup"><p>Exceptionally heavy rainfall on 4th January 2024 (and a secondary event in February 2024) caused flooding across the village, including out&ndash;of&ndash;channel flows from an unnamed watercourse, surcharged manholes where culverts backed up, external fabric flooding of cottages on Abingdon Road, and one residential property (adjacent to the River Thames) internally flooded; the boiler room of a neighbouring pub was also internally affected. [MUL] (p27)</p></div><div class="nugget-popup"><p>The village experienced flooding on 4th January 2024 that affected the community and local properties through surface water runoff. Flooding prompted the production of a Community Flood Plan and actions to review drainage, highway assets and property&ndash;level protection. (p36)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 residential properties; 1 business; 1 residential property (High Street); 1 business (High Street) [MUL] (p2)</p></div><div class="nugget-popup quant"><p>four separate locations of property flooding [IMG] (p7)</p></div><div class="nugget-popup quant"><p>4 separate locations [IMG,PAG] (p8)</p></div><div class="nugget-popup quant"><p>2 manholes [IMG] (p14)</p></div><div class="nugget-popup quant"><p>1 residential property; 1 business (p17)</p></div><div class="nugget-popup quant"><p>1 residential property; 1 pub boiler room [MUL] (p27)</p></div></div></body></div>`)[0];

                var html_cdcc2956876e1c138d5c6aea1841695d = $(`<div id="html_cdcc2956876e1c138d5c6aea1841695d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Burcot</h1><div class="nugget-popup"><p>Two properties in Burcot were internally flooded on 4 January 2024. The cause was overland flow and an undefined channel converging into a culvert; downstream siltation/obstruction reduced culvert discharge, causing water to back up, flood from the inlet onto Abingdon Road, cross the highway and enter properties. Highway drainage could not convey the water back into the channel. (p2)</p></div><div class="nugget-popup"><p>Properties in Burcot were flooded in the January 2024 event: Location 2 is described as Burcot properties south of Abingdon Road, and Location 3 (Terrace of Cottages on Abingdon Road) lies between Clifton Hampden and Burcot and was affected. [IMG] (p7)</p></div><div class="nugget-popup"><p>Properties south of Abingdon Road in Burcot were flooded on 4th January 2024 (listed as Location 2 in the report). [IMG,PAG] (p8)</p></div><div class="nugget-popup"><p>Overland flows from farmland north of Abingdon Road converged into a culvert which, after crossing under Abingdon Road, outfallen into an open channel in rear gardens. Siltation within the culvert and downstream channel restrictions reduced conveyance so highway drainage could not remove the flows and surface water entered properties, causing internal flooding. [PAG] (p17)</p></div><div class="nugget-popup"><p>Build up of sediment in the watercourse downstream of the highway culvert caused the channel to back up, flooding the highway and flooding two properties. (p24)</p></div><div class="nugget-popup"><p>At Location 2 in Burcot the highway culvert outfall was found fully below the bed of the channel due to silt build&ndash;up; a hole in the top of the culvert was acting as the current discharge. Clearance beneath the culvert outfall and maintaining fall in the open channel through Burcot Park properties was recommended to restore adequate pass&ndash;forward flow. (p26)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 properties (p2)</p></div><div class="nugget-popup quant"><p>locations 2 and 3 (as described) [IMG] (p7)</p></div><div class="nugget-popup quant"><p>two properties [PAG] (p17)</p></div><div class="nugget-popup quant"><p>two properties (p24)</p></div></div></body></div>`)[0];
