                var html_a3b461ab8ad8013017b0b540391dfaf4 = $(`<div id="html_a3b461ab8ad8013017b0b540391dfaf4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Haydon Bridge</h1><div class="nugget-popup"><p>Residential areas on both banks of the River Tyne were flooded when the river and tributaries swelled and overtopped defences. A culverted watercourse north of the village overtopped its inlet in the high school grounds and manholes surcharged along the culvert, affecting a number of properties. Significant surface&ndash;water highway flooding occurred at Belmont and Church Street. The caravan park on the south bank was also affected. [IMG,TAB] (p1)</p></div><div class="nugget-popup"><p>Centre of the village experienced higher water levels (several inches higher on the December 2015 event) with defences overtopping for longer, resulting in properties having more water during the event. In total 50 residential buildings and 8 businesses in the area were affected by the flooding. [TAB,PAG] (p2)</p></div><div class="nugget-popup"><p>Surface water flooding associated with poor culvert performance at Belmont prompted an investigation (in partnership with the EA), development of a Community Flood Action Plan, and improvements to the local Flood Warning service. (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>50 residential properties; 8 businesses; 1 road [IMG,TAB] (p1)</p></div><div class="nugget-popup quant"><p>50 residential buildings; 8 businesses [TAB,PAG] (p2)</p></div></div></body></div>`)[0];
