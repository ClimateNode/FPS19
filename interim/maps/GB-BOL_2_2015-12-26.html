                var html_adde7c81926094f07569e6d5f4251193 = $(`<div id="html_adde7c81926094f07569e6d5f4251193" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Radcliffe</h1><div class="nugget-popup"><p>Main&ndash;river flooding resulted in internal flooding to properties in Radcliffe/Redvales. [TAB] (p17)</p></div><div class="nugget-popup"><p>Flooding affected the Radcliffe area, inundating domestic properties; a scheme has been proposed to assess options for reducing flood risk in the area. [IMG] (p20)</p></div><div class="nugget-popup"><p>Radcliffe experienced flood damage to electrical infrastructure and significant power outages: two sub&ndash;stations were damaged by floodwater and thousands of properties lost supply. [TAB] (p21)</p></div><div class="nugget-popup"><p>Flooding caused the collapse of a footbridge that carried a sewer and a gas main; the collapse ruptured the gas main and led to a gas&ndash;related incident. Gas supply was affected (low pressure) to many domestic properties and some non&ndash;domestic supplies were isolated. (p22)</p></div><div class="nugget-popup"><p>Radcliffe (together with Redvales) was heavily affected by the Boxing Day flood, with many properties flooded and homes evacuated. (p29)</p></div><div class="nugget-popup"><p>Radcliffe experienced river flooding during the 26 December 2015 event; the Environment Agency is drawing up proposals to develop a flood defence scheme for Radcliffe in response to that flooding. (p34)</p></div><div class="nugget-popup"><p>Radcliffe (with Redvales) was the most severely affected community in the borough: about 671 properties were flooded by the River Irwell. Maximum flood depth above ground level reached 1.4m, with typical depths of 0.6&ndash;0.8m. [IMG,PAG] (p56)</p></div><div class="nugget-popup"><p>Flooding caused the collapse of a footbridge carrying a sewer and gas main at Lomax Street; the gas main ruptured causing a fire and explosion and sewage was discharged into the River Irwell. Temporary measures by Bury Council later reopened the bridge to pedestrian traffic. [PAG] (p57)</p></div><div class="nugget-popup"><p>Widespread flooding affected residential and commercial properties and highways; footbridge failures (including Lomax Street and Milltown Street); treated sewage discharged into the River Irwell from flooded wastewater works; major disruption to services including loss of electricity supply at substations. [PAG] (p58)</p></div><div class="nugget-popup"><p>Experienced flooding that affected residents and businesses (clusters of reported flooding); a flood extent outline was mapped, prompted a community drop&ndash;in and multi&ndash;agency working group, and led to proposals and a business case being developed for a flood defence and storage scheme. (p59)</p></div><div class="nugget-popup"><p>Widespread flooding from the River Irwell and surface&ndash;water runoff affected Radcliffe: properties along Warth Road/Radcliffe Road, York Street/Dumers Lane, Morris Street and Riverside Drive were inundated; a footbridge at Lomax Street carrying a sewer and gas main collapsed and discharged sewage into the river; a further footbridge at Milltown Street was damaged beyond repair; businesses in the area were significantly impacted with some relocating outside the borough. [PAG] (p61)</p></div><div class="nugget-popup"><p>Radcliffe experienced overbank flooding with general flood depths around 0.6 to 0.8m; infrastructure was affected (a pipe bridge in Radcliffe is being replaced and a temporary pipe route installed); properties in the area lie in Flood Zone 2 and Flood Zone 3 and were among those flooded. (p63)</p></div><div class="nugget-popup"><p>River Irwell overtopped and caused flooding affecting the Radcliffe area; the event prompted the Environment Agency to develop proposals for a flood defence scheme for the Radcliffe and Redvales area and to review flood warning thresholds for the River Irwell. (p66)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>670 properties in Radcliffe and Redvales combined [TAB] (p17)</p></div><div class="nugget-popup quant"><p>Over 670 properties flooded [IMG] (p20)</p></div><div class="nugget-popup quant"><p>3,200 properties without power; 2 sub&ndash;stations damaged [TAB] (p21)</p></div><div class="nugget-popup quant"><p>900 domestic properties; 2 non&ndash;domestic supplies (p22)</p></div><div class="nugget-popup quant"><p>670 properties (p29)</p></div><div class="nugget-popup quant"><p>671 properties [IMG,PAG] (p56)</p></div><div class="nugget-popup quant"><p>3,200 properties [PAG] (p58)</p></div><div class="nugget-popup quant"><p>671 properties flooded; 900 domestic properties affected by low water pressure [PAG] (p61)</p></div><div class="nugget-popup quant"><p>0.6 to 0.8m flood depth (p63)</p></div></div></body></div>`)[0];

                var html_08788b74b3ead5d8846f4ca814d50ea8 = $(`<div id="html_08788b74b3ead5d8846f4ca814d50ea8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Uppermill</h1><div class="nugget-popup"><p>On 26th December 2015 Uppermill at Saddleworth experienced flooding (called out as an exception in the Mersey catchment), with river levels rising sufficiently to cause flood impacts in that locality. (p14)</p></div><div class="nugget-popup"><p>Uppermill experienced river flooding on 26 December 2015; the gauging station on the Tame recorded its highest&ndash;ever level (Rank 1) during the event. [TAB,PAG] (p15)</p></div><div class="nugget-popup"><p>Internal flooding to properties from multiple sources including main river flooding and surface water, affecting the Uppermill area. [TAB,PAG] (p17)</p></div><div class="nugget-popup"><p>Uppermill (listed alongside Delph) was identified for recommended actions after the floods, indicating it experienced flooding and requires interventions. (p34)</p></div><div class="nugget-popup"><p>Uppermill experienced significant flooding with 35 properties internally flooded; river levels at Uppermill rose in response to the rainfall. [PAG] (p88)</p></div><div class="nugget-popup"><p>The River Tame at Uppermill rose to a record level during the event: 1.242 m (156.79 m AOD), the highest reading in the station's 17&ndash;year record, with the peak driven by intense rainfall on and immediately after 26 December 2015. [IMG] (p89)</p></div><div class="nugget-popup"><p>The EA gauge at Uppermill (downstream of Delph) recorded a river level of 1.24 m (156.79 AOD), the highest in its 17 years of recording; this level is assessed as having a 1 in 50 to 1 in 100 year likelihood and is associated with flooding of properties from the main river (FZ3). (p96)</p></div><div class="nugget-popup"><p>Flooding from the River Tame inundated the centre of Uppermill on 26 December 2015; map shows clustered main&ndash;river flood symbols in the village centre and along the river. United Utilities received three incidents of sewer flooding reported in the area on Boxing Day 2015. The Environment Agency led investigations into the river&ndash;sourced flooding. [IMG] (p97)</p></div><div class="nugget-popup"><p>Riverside parts of Uppermill experienced significant flooding during the event; residential properties in the village had ground&ndash;floor inundation from the overflowing river. [IMG,PAG] (p100)</p></div><div class="nugget-popup"><p>Parts of Uppermill experienced residential and street flooding (e.g. School Street and High Street) with water at doorsteps and ground&ndash;floor levels causing property water ingress and local disruption. [IMG,PAG] (p101)</p></div><div class="nugget-popup"><p>The locality experienced extreme river levels and associated flooding that inundated streets and properties; infrastructure damage occurred including the collapse of a culvert on Pickhill Brook, prompting repair works and a replacement culvert scheme. [IMG,PAG] (p102)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>35 properties (12 main river; 2 ordinary watercourse; 21 surface water) [TAB,PAG] (p17)</p></div><div class="nugget-popup quant"><p>35 properties [PAG] (p88)</p></div><div class="nugget-popup quant"><p>3 incidents of sewer flooding [IMG] (p97)</p></div></div></body></div>`)[0];

s Ringley Bridges) and localised bank failure nearby; future defensive options (a raised left&ndash;bank wall) were proposed to protect Prestolee following the event. (p45)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>57 properties (Prestolee and Stoneclough) [TAB] (p17)</p></div><div class="nugget-popup quant"><p>57 homes; flood depths up to 1.5 metres (p41)</p></div><div class="nugget-popup quant"><p>Riverside Drive flooded to depths up to 1.5m; apartments on Stoneclough Rise flooded up to 200mm [PAG] (p44)</p></div></div></body></div>`)[0];

                var html_ff1e6e2e4a129811e5665d47f68718e2 = $(`<div id="html_ff1e6e2e4a129811e5665d47f68718e2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Littleborough</h1><div class="nugget-popup"><p>Main&ndash;river flooding caused internal flooding to properties in Littleborough (reported as part of the Rochdale borough impacts). (p17)</p></div><div class="nugget-popup"><p>Properties in the Littleborough and Rochdale area were flooded; a scheme was proposed to assess options for reducing flood risk. [IMG] (p20)</p></div><div class="nugget-popup"><p>Flooding caused power outages in both Bolton and Littleborough and damaged at least one electrical sub&ndash;station in Littleborough. Temporary rerouting and overhead lines were used to restore supply where bridges carrying cables were affected. (p21)</p></div><div class="nugget-popup"><p>Flooding affected the town; the Calder Brook flood basin prevented significant further property flooding. (p29)</p></div><div class="nugget-popup"><p>Littleborough is listed among locations needing action and follow&ndash;up by the Environment Agency/LLFA after the floods, indicating it was affected by flooding. (p34)</p></div><div class="nugget-popup"><p>Littleborough was affected by the Boxing Day floods (26th December 2015); post&ndash;event work and investigations (extended to Rochdale) are being progressed to identify measures such as raising defence walls, flood storage basins, different reservoir operation and natural flood management. [PAG] (p35)</p></div><div class="nugget-popup"><p>Internal flooding of residential and commercial properties from rising rivers and also from surface water, groundwater seepage into cellars and sewer&ndash;related flooding. Flood depths reported up to 1.2 m in habitable spaces. [PAG] (p114)</p></div><div class="nugget-popup"><p>Littleborough was affected by the Boxing Day (26th December 2015) flooding. Community resilience work established prior to the event (Flood Resilience Community Pathfinder) and ongoing partnership with the National Flood Forum provided support after the floods; multi&ndash;agency drop&ndash;in sessions and ongoing support were delivered to those affected. (p115)</p></div><div class="nugget-popup"><p>Main&ndash;river flooding from the River Roch and Greenvale Brook overtopped raised defences and natural banks across Littleborough. Flood depths were increased by surface water and flows from the Rochdale Canal and by a fully saturated catchment. Widespread property flooding above ground floor level, emergency response and community disruption occurred; a flood warning was issued. [PAG] (p117)</p></div><div class="nugget-popup"><p>River Roch at Littleborough reached record&ndash;high levels causing overbanking; high river levels prevented surface water drainage leading to ponding and property flooding. A flood warning was issued and emergency measures (including sandbagging) were used. [IMG,PAG] (p118)</p></div><div class="nugget-popup"><p>Dramatic surface flows were observed down moorland above Littleborough during the intense rainfall, contributing to local flooding impacts in the area. (p123)</p></div><div class="nugget-popup"><p>Dramatic surface&ndash;water flows were recorded down the moorland above Littleborough during the 26 December 2015 event, producing significant runoff into the Upper Roch catchment and contributing to very high flows in the River Roch. (p126)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>175 properties (p17)</p></div><div class="nugget-popup quant"><p>275 properties flooded across Littleborough and Rochdale [IMG] (p20)</p></div><div class="nugget-popup quant"><p>1,000 properties without power in Bolton; 1,000 properties without power in Littleborough; 1 sub&ndash;station damaged in Littleborough (p21)</p></div><div class="nugget-popup quant"><p>175 properties (p29)</p></div><div class="nugget-popup quant"><p>174 properties (up to 1.2m deep) [PAG] (p114)</p></div><div class="nugget-popup quant"><p>158 properties flooded above ground floor level; 17 properties flooded from surface water; flood depths up to 1.2m at Garden Mews; flood warning issued to over 690 properties [PAG] (p117)</p></div><div class="nugget-popup quant"><p>over 690 properties [IMG,PAG] (p118)</p></div></div></body></div>`)[0];

et Street also flooded (they had flooded previously in 2012). [PAG,MUL] (p126)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>36 properties (Wardleworth / Hey Brook area) [TAB] (p17)</p></div><div class="nugget-popup quant"><p>36 properties (Wardleworth and Hey Brook) (p113)</p></div><div class="nugget-popup quant"><p>36 properties flooded (Wardleworth and Hey Brook) (p114)</p></div><div class="nugget-popup quant"><p>4 houses (cellars flooded in 2012) [PAG,MUL] (p126)</p></div></div></body></div>`)[0];
