                var html_156bc7c077bfa999bfa1e38f808ce782 = $(`<div id="html_156bc7c077bfa999bfa1e38f808ce782" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Henley-On-Thames</h1><div class="nugget-popup"><p>Landing stages were damaged and the ground floor of a commercial property in Henley was flooded by the River Thames. (p2)</p></div><div class="nugget-popup"><p>Commercial property in the Henley&ndash;on&ndash;Thames site lies within EA Flood Zone 3/3b (functional floodplain) and was inundated by river (Thames) flooding. Business owners reported previous flooding in 2003 and 2014, and that the event on 4 January 2024 was similar to 2014. [PAG,MUL] (p5)</p></div><div class="nugget-popup"><p>A commercial property in Henley&ndash;on&ndash;Thames was flooded when the adjacent River Thames channel was overwhelmed by exceptionally heavy rainfall on top of antecedent saturated soils; photographic evidence suggests inundation depth was under 0.1 m. The business reported this event on 4 January 2024 as the worst since 2014 (but less severe than 2003). [IMG] (p6)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 commercial property (p2)</p></div><div class="nugget-popup quant"><p>2 commercial properties; flood occurrences: 2003, 2014, 4 January 2024 [PAG,MUL] (p5)</p></div><div class="nugget-popup quant"><p>two commercial properties (across Henley&ndash;on&ndash;Thames and Goring) [IMG] (p6)</p></div></div></body></div>`)[0];
