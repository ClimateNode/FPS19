                var html_f6ff40845b61e51da06d4ed46f00e9ee = $(`<div id="html_f6ff40845b61e51da06d4ed46f00e9ee" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cataract Bridge Mill</h1><div class="nugget-popup"><p>Property was the subject of a flood investigation following a recorded flood incident; the report addresses drainage, culvert condition and inlet trash screen as possible causes. [IMG] (p1)</p></div><div class="nugget-popup"><p>The mill and immediate surrounding site were inundated when an obstruction in the culverted section of Cataract Brook caused water to back up and flood the mill site. Removal of the culvert blockage and improvement of the inlet trash screen were identified as required actions to reduce repeat flooding. (p3)</p></div><div class="nugget-popup"><p>The mill site experienced a flood incident on 3 May 2012. Flooding at the site was exacerbated by a blockage and an inadequate trash screen; the report concluded that removing the blockage and improving the trash screen (with a maintenance clearance schedule) would significantly reduce flood risk to the site. (p4)</p></div><div class="nugget-popup"><p>The Cataract Bridge Mill site was inundated during the flood incident of 3 May 2012 and was the subject of a Section 19 investigation. The site contains a culvert and a manhole through which Cataract Brook passes (trash screen on the eastern culvert entrance is noted). [IMG] (p5)</p></div><div class="nugget-popup"><p>A blockage in the culvert/manhole (including a barrel and other debris) restricted flows and caused water to pond and flood the adjacent land at the Cataract Bridge Mill site; the inlet trash screen was partially blocked which would have increased ponding and contributed to the flooding. CCTV found barrels, tree branches and logs and siltation in the culvert was increased. (p9)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 barrel (p9)</p></div></div></body></div>`)[0];
