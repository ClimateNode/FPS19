                var html_3d06b175d7bea60333ad9fe26f49a2b3 = $(`<div id="html_3d06b175d7bea60333ad9fe26f49a2b3" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lancaster Avenue, Capel-Le-Ferne</h1><div class="nugget-popup"><p>Runoff from arable fields and blocked highway gullies led to surface water flooding affecting properties on Lancaster Avenue. One property flooded internally to approximately 200&ndash;300 mm. Damage in the vicinity to garages and gardens was reported; some flooded properties in the area were evacuated. [TAB] (p2)</p></div><div class="nugget-popup"><p>Overland flows are described as reaching the junction at Capel Street and Lancaster Avenue, indicating Lancaster Avenue is on the route of surface water overland flow. (p3)</p></div><div class="nugget-popup"><p>The junction with Capel Street forms a topographic depression where surface water accumulates; identified as a high&ndash;risk area and consistent with locations of reported properties affected by the 04&ndash;05 November 2023 surface&ndash;water flooding event. [IMG] (p4)</p></div><div class="nugget-popup"><p>Overland flow passed the junction of Capel Street and Lancaster Avenue; drainage gullies within Lancaster Avenue failed to drain runoff, contributing to accumulation of floodwater in the adjacent depression. (p7)</p></div><div class="nugget-popup"><p>Floodwater accumulated in the local topographic depression at the junction with Capel Street; lifting of a manhole at the junction of Lancaster Avenue and Capel Street allowed floodwater to drain away and reduce local flood levels. (p8)</p></div><div class="nugget-popup"><p>A flood alleviation drain under Lancaster Avenue connects two high&ndash;capacity gullies to a 750mm diameter pipe that discharges to a soakaway (with a 225mm diameter overflow). The hydraulic performance of the 750mm pipe was impaired by an obstruction (a foul sewer passing through and blocking a significant part of the surface&ndash;water pipe), reducing drainage capacity during the early November 2023 flood and contributing to local surface water flooding. (p9)</p></div><div class="nugget-popup"><p>Runoff collected in a depression between the junctions of Capel Street/Lancaster Avenue and Lancaster Avenue/Elizabeth Drive, overwhelming the highway drainage and causing flooding of the road and nearby properties. (p11)</p></div><div class="nugget-popup"><p>Flooding affected part of Lancaster Avenue adjacent to Capel Street. The map shows high&ndash;confidence extent on part of the road and a low&ndash;confidence dashed outline extending further into Lancaster Avenue, indicating additional possible road inundation. [IMG] (p13)</p></div><div class="nugget-popup"><p>Flooding affected Lancaster Avenue and flood surveys were sent to residents following the event. [TAB] (p15)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property flooded internally; approximately 6 properties affected in the area; 5 properties flooded internally (area total) [TAB] (p2)</p></div><div class="nugget-popup quant"><p>1 manhole lifted (p8)</p></div><div class="nugget-popup quant"><p>two high&ndash;capacity gullies; 750mm diameter pipe; 225mm diameter overflow (p9)</p></div><div class="nugget-popup quant"><p>At least 6 properties affected; 5 properties flooded internally (p11)</p></div><div class="nugget-popup quant"><p>14 flood surveys sent; 2 flood surveys received [TAB] (p15)</p></div></div></body></div>`)[0];

                var html_b72f38fe3cfd5e0da4e208e272ccd4f7 = $(`<div id="html_b72f38fe3cfd5e0da4e208e272ccd4f7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Capel Street, Capel-Le-Ferne</h1><div class="nugget-popup"><p>Runoff from agricultural fields and blocked drains caused surface water flooding. One property reported internal flooding to approximately 300 mm; one property reported external flooding to the driveway and garden. Some flooded properties in the area were evacuated. [TAB] (p2)</p></div><div class="nugget-popup"><p>A natural surface water overland flow path routes water across the catchment toward Capel Street, delivering overland flows to the junction with Lancaster Avenue. (p3)</p></div><div class="nugget-popup"><p>A topographic depression at the junction with Lancaster Avenue produced a high surface&ndash;water flood risk. This location is consistent with reported properties being affected during the flood event of 04&ndash;05 November 2023, exposing residential buildings at the junction to surface water inundation. [IMG] (p4)</p></div><div class="nugget-popup"><p>Surface water flowed onto and across the carriageway as drainage was overwhelmed. Overland flow passed the junction with Lancaster Avenue and contributed to accumulation in the nearby topographic depression; a blocked local drain (Northern Capel Street Drain) and insufficient capacity in the connected Flood Alleviation Drain network exacerbated the flooding. (p7)</p></div><div class="nugget-popup"><p>This drain did not receive floodwater from the topographic depression until a manhole at the southern corner of Lancaster Avenue and Capel Street was lifted; once opened it accepted water that bypassed the Northern drain, helping floodwater to drain away (lifting was reported to produce a sucking/vacuum sound as water entered the system). (p8)</p></div><div class="nugget-popup"><p>A blockage downstream of the flooding at the junction between Capel Street and Elizabeth Drive prevented the connected gullies from draining floodwater away during the early November 2023 flood, contributing to local surface water inundation. Gullies to the east (at the entrance to Elizabeth Drive) lay beyond the blockage and could drain, which likely limited the depth and extent of flooding until water entered the unblocked network. (p9)</p></div><div class="nugget-popup"><p>Properties along Capel Street experienced surface water flooding because a 225mm foul sewer obstruction likely restricted flow, preventing gullies and the overflow connection between the Capel Street network and the flood&ndash;alleviation network from draining floodwater away during the event. [MUL] (p10)</p></div><div class="nugget-popup"><p>Surface water runoff from saturated agricultural land accumulated in a localised topographic depression between the junction of Capel Street and Lancaster Avenue, overwhelming highway drainage; flooding occurred within the road and contributed to property flooding nearby. (p11)</p></div><div class="nugget-popup"><p>High&ndash;confidence flooding of the highway along Capel Street, concentrated at the intersection with Lancaster Avenue. The map shows the road carriageway inundated; the estimated extent covers the highway only and does not mark properties as flooded. [IMG] (p13)</p></div><div class="nugget-popup"><p>Flooding affected Capel Street and flood surveys were sent to residents following the event. [TAB] (p15)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property internal flooding; 1 property external flooding [TAB] (p2)</p></div><div class="nugget-popup quant"><p>1 manhole lifted (p8)</p></div><div class="nugget-popup quant"><p>300mm diameter concrete pipe (blocked) (p9)</p></div><div class="nugget-popup quant"><p>At least 6 properties affected; 5 properties flooded internally (p11)</p></div><div class="nugget-popup quant"><p>23 flood surveys sent; 3 flood surveys received [TAB] (p15)</p></div></div></body></div>`)[0];

 quant"><p>1 property; 300 mm external flooding (p3)</p></div><div class="nugget-popup quant"><p>At least 6 properties affected; 5 properties flooded internally (p11)</p></div><div class="nugget-popup quant"><p>7 flood surveys sent; 1 flood survey received [TAB] (p15)</p></div></div></body></div>`)[0];

                var html_3ee16cd6ad1e8c15c932460b6b78c010 = $(`<div id="html_3ee16cd6ad1e8c15c932460b6b78c010" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Capel-Le-Ferne</h1><div class="nugget-popup"><p>Flooding was recorded in the settlement during the evening of 04 November into the early morning of 05 November 2023 following a period of prolonged rainfall and a short, intense burst of rain; floodwaters affected Capel&ndash;le&ndash;Ferne. (p1)</p></div><div class="nugget-popup"><p>Properties near the junction of Lancaster Avenue and Capel Street experienced overland surface water runoff leading to internal and external flooding, causing damage to garages and gardens and some properties being evacuated. (p2)</p></div><div class="nugget-popup"><p>Residents reported properties were affected by surface water flooding associated with the event on 04&ndash;05 November 2023. The report identifies a topographic depression at the junction of Capel Street and Lancaster Avenue as a high&ndash;risk location consistent with where properties were reported flooded; resident testimony about the 04&ndash;05 November 2023 event was collected at a meeting on 05 December 2023. (p4)</p></div><div class="nugget-popup"><p>A flood incident occurred in Capel&ndash;le&ndash;Ferne overnight linked to intense local rainfall. The incident took place between 23:00 on 04 November 2023 and 00:45 on 05 November 2023, coinciding with heavy short&ndash;duration rainfall and preceded by high antecedent rainfall in the previous days. (p6)</p></div><div class="nugget-popup"><p>Intense, antecedent rainfall produced large runoff from surrounding agricultural land which flowed southeast into the village. Water entered the village and travelled along the street corridor (past the Baptist Church and onto Capel Street), overwhelming local drainage and causing surface water flooding within the village. (p7)</p></div><div class="nugget-popup"><p>Surface water runoff from saturated agricultural fields accumulated in a local topographic depression between the junction of Capel Street and Lancaster Avenue and the junction of Lancaster Avenue and Elizabeth Drive. The highway drainage system was overwhelmed and obstructed, resulting in flooding of the carriageway and at least six properties (five of which flooded internally). KCC Highways attended the incident and carried out inspection and jetting of road gullies and mainlines on 09 November 2023. Kent Fire Rescue Service attended with vehicles and pumped floodwater out of affected properties and gardens into the highway drainage network. (p11)</p></div><div class="nugget-popup"><p>Flooding affected the highway network in Capel&ndash;le&ndash;Ferne: a high&ndash;confidence flood extent is shown on Capel Street with flooding concentrated at the intersection with Lancaster Avenue, and a lower&ndash;confidence extent extends into Lancaster Avenue and adjacent residential streets. The map notes the estimated extent covers roads only and does not mark properties as flooded. [IMG] (p13)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately six properties affected; five properties flooded internally (p2)</p></div><div class="nugget-popup quant"><p>6 properties; 5 properties internally flooded; 3 fire engines/vehicles (p11)</p></div></div></body></div>`)[0];
