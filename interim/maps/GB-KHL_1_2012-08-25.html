                var html_735c1380696e33fb025171b1b9586292 = $(`<div id="html_735c1380696e33fb025171b1b9586292" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kingston Upon Hull</h1><div class="nugget-popup"><p>City&ndash;wide flash flooding in August 2012 caused extensive urban street flooding across Hull. Roads had standing water deep enough to force vehicles to drive through floodwater and left parked cars partially submerged; floodwater contained foam and debris and disrupted transport and streetscape. [PAG] (p1)</p></div><div class="nugget-popup"><p>Widespread highway flooding across the city and surface water inundation; drainage infrastructure was overwhelmed in many areas leading to flooding before drains could convey flows. (p4)</p></div><div class="nugget-popup"><p>Multiple locations across Hull were flooded on 25th August 2012 (Table 1 lists numerous street&ndash;level incidents and the map shows a cluster of flooded points within the urban area). [PAG] (p6)</p></div><div class="nugget-popup"><p>Multiple streets within the city were flooded on 25th August 2012. Flooding affected Stockholm Road (full length), Copenhagen Road, Sutton Road, Garrick Close, Corona Drive, Ullswater Close, Lowgate, Malham Avenue, Kendal Way, Hawkshead Green, Foster Street, Princes Avenue and Calvert Lane. Flooding was associated with the local drainage system being overwhelmed, producing surface&ndash;water/urban flood impacts on the streets listed. [IMG,PAG] (p7)</p></div><div class="nugget-popup"><p>Widespread flooding across the city. In 2007 drains, ditches and watercourses were overwhelmed causing flooding across large areas of Hull; flood flows exceeded drainage capacity. On 25th August 2012 an intense, localised storm caused surface water flooding concentrated in a central belt of the city, with roads affected, sandbagging and pump operations deployed by council and fire crews. [PAG,MUL] (p8)</p></div><div class="nugget-popup"><p>Intense, highly localised rainfall on 25th August 2012 caused surface water (pluvial) flooding across Hull; residents and operating authorities were unprepared, prompting investigations and planned remediation measures. [TAB] (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>21 properties (p4)</p></div><div class="nugget-popup quant"><p>more than 1300 businesses; 8600 residential properties; 19 residential properties; 2 commercial properties [PAG,MUL] (p8)</p></div></div></body></div>`)[0];

rface water flood alleviation scheme at this location as a remediation measure following the 25th August 2012 event. [TAB] (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>10 properties [TAB] (p5)</p></div></div></body></div>`)[0];
