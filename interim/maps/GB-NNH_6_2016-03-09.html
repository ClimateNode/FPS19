                var html_e9cc1b312b09ed4e41c32f45047070e5 = $(`<div id="html_e9cc1b312b09ed4e41c32f45047070e5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Harper's Brook</h1><div class="nugget-popup"><p>Ordinary watercourse flooding from Harpers Brook contributed to the local flood event that affected Lowick, combining with agricultural and surface water runoff to cause internal flooding of properties in the village. (p10)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Over 70 properties flooded internally; over 200 reports of flooding (impacts in Lowick linked to Harpers Brook's flooding) (p10)</p></div></div></body></div>`)[0];

                var html_77f54028b13d6f37f79d9121b6deeb58 = $(`<div id="html_77f54028b13d6f37f79d9121b6deeb58" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Main Street, Lowick</h1><div class="nugget-popup"><p>Internal flooding of a residential property occurred at Main Street; this property has experienced internal flooding on more than one occasion in the five years prior to the investigation. (p9)</p></div><div class="nugget-popup"><p>Main Street lies in the valley and localised catchment of Harpers Brook and was affected by surface water runoff and ordinary watercourse flooding associated with the event; properties in the Main Street area were among those flooded. (p10)</p></div><div class="nugget-popup"><p>Surface&ndash;water overland flows travelled through the access tunnel beneath the A6116 to a cut&ndash;off ditch behind a stable; the ditch filled and spilled. Internal flooding of one residential property occurred on 09/03/2016 (all ground&ndash;floor rooms flooded) and there was minor ingress of surface water to the rear of a second residential property. Historical incidents include internal flooding of one property (kitchen and another room) at Easter 1998 and internal flooding of one property in late 2012/early 2013 (whole floor replaced). [TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Surface water flowed down an access road to the rear gardens of two properties on Main Street. A second flow route crossed the rear garden of a third property, submerging the patio and then entering the house, causing internal flooding. The flow through the access tunnel beneath the A6116 was reported as very strong. [PAG] (p12)</p></div><div class="nugget-popup"><p>Heavy rainfall on a saturated catchment caused drainage systems to be overwhelmed so excess surface water flowed over ground and followed natural contours to low points around private properties on Main Street; properties at a low point in the valley were vulnerable to overland flow, exacerbated by A6116 embankments which channelled a concentrated flow through the access tunnel. (p13)</p></div><div class="nugget-popup"><p>Properties and recent developments on Main Street experienced surface water flooding and/or had ineffective surface water drainage, prompting a recommendation to review planning policies, flood risk assessments and drainage designs and to contact developers to address the flooding and drainage failures. (p22)</p></div><div class="nugget-popup"><p>Main Street lies within the mapped geographic extent of the 9 March 2016 incident and was subject to overland flow routed from surrounding fields via the mapped drainage network (pipes/culverts and a cut&ndash;off ditch). [IMG] (p30)</p></div><div class="nugget-popup"><p>Surface water ran along the front of a property on Main Street and flowed through to the rear gardens of neighbouring properties, causing flooding of those rear gardens. [IMG,PAG] (p44)</p></div><div class="nugget-popup"><p>Surface water flowed across the paved driveway/access route in front of a property on Main Street, travelling along depressions and slope toward the rear gardens of neighbouring properties. [IMG,PAG] (p45)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property (p9)</p></div><div class="nugget-popup quant"><p>1 residential property (Easter 1998); 1 residential property (late 2012/early 2013); 1 residential property (09/03/2016 &ndash; all ground floor rooms flooded); minor ingress to rear of a second residential property (09/03/2016) [TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup quant"><p>two properties; one property (patio submerged and water entered house) [PAG] (p12)</p></div><div class="nugget-popup quant"><p>two properties [IMG,PAG] (p44)</p></div><div class="nugget-popup quant"><p>1 property (front) [IMG,PAG] (p45)</p></div></div></body></div>`)[0];

                var html_d80095d49b33a0e29a80211c79393c4b = $(`<div id="html_d80095d49b33a0e29a80211c79393c4b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lowick</h1><div class="nugget-popup"><p>A flood incident on 9th March 2016 affected Main Street in Lowick, resulting in internal flooding of one property. [PAG] (p9)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties and widespread local flooding from a combination of agricultural runoff, surface water runoff and ordinary watercourse (Harpers Brook) flooding. Main Street is within the affected valley and properties there and elsewhere in the village were impacted. (p10)</p></div><div class="nugget-popup"><p>Heavy rainfall on a saturated catchment caused local drainage systems to be unable to collect and convey rainwater, producing excess surface water that flowed overland to low points around private properties in Lowick; concentrated flows were formed by the A6116 embankments. [PAG] (p13)</p></div><div class="nugget-popup"><p>Overland flow from surrounding fields was routed toward and into the village during the incident (map inset shows the flood extent). Flow was channelled along mapped main routes and controlled/modified by three key drainage features (Q1, Q2, Q3), pipe/culvert sections and a cut&ndash;off ditch. [IMG] (p30)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property [PAG] (p9)</p></div><div class="nugget-popup quant"><p>Over 70 properties flooded internally; over 200 reports of flooding (total reported incidents) (p10)</p></div><div class="nugget-popup quant"><p>three critical drainage points (Q1, Q2, Q3) [IMG] (p30)</p></div></div></body></div>`)[0];
