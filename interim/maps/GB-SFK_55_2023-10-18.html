                var html_33e26a9e0c7f41d737975caabf5b7ab1 = $(`<div id="html_33e26a9e0c7f41d737975caabf5b7ab1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Dove</h1><div class="nugget-popup"><p>The river overtopped and breached its banks at several points east and west of the A140, causing flooding of adjacent land, inundation of nearby properties and contributing to flooding of transport routes (A140 and Brockford Road). The overtopping contributed to internal flooding of properties in the Brockford Street / Griffin Lane area and to flows travelling southeast to rejoin the river. [PAG,IMG] (p17)</p></div><div class="nugget-popup"><p>During 18 Oct 2023 &ndash; 21 Oct 2023 high flows in the River Dove exceeded the capacity of the small single&ndash;span masonry arch bridge carrying the river under the A140. Water flowed out of the channel upstream and around the bridge abutments, overtopping and flooding onto the A140 carriageway and onto surrounding properties on the west side of the A140 in north Brockford Street. [IMG,PAG] (p19)</p></div><div class="nugget-popup"><p>Flooding associated with the River Dove inundated grazing land adjacent to the channel (sites between Buces Hill and the caravan park at Brockford Road). Works on the river bank and material laid in the river bed for scour protection were noted close to a bridge; residents reported rocks from gabion baskets reducing capacity under/near the bridge, though highway inspections judged the gabions and the laid material to be for scour protection and unlikely to have a significant impact on conveyance. The floodplain continued to operate during the event (sites flooded during Storm Babet). (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>13 properties [PAG,IMG] (p17)</p></div></div></body></div>`)[0];

                var html_a37c4011c38d6746dc6003ca962c9f23 = $(`<div id="html_a37c4011c38d6746dc6003ca962c9f23" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Church Street, Wetheringsett</h1><div class="nugget-popup"><p>Houses on the north side of Church Street had floodwater enter from the highway (a mix of surface runoff and overtopped watercourse). A severe blockage or collapse of a highway drainage pipe on the west side caused rapid backing up and pooling that overtopped the kerb and flowed into adjacent houses. (p24)</p></div><div class="nugget-popup"><p>Church Street was inundated with muddy floodwater, making the road impassable to vehicles and disrupting local transport close to the church. (p30)</p></div><div class="nugget-popup"><p>Floodwater covered the street carriageway at and around the junction, preventing normal vehicular movement and exposing nearby residential properties to inundation. [IMG] (p32)</p></div><div class="nugget-popup"><p>Surface water affected Church Street: the watercourse alongside Church Street was cleared by the riparian owner and flood diversion measures were installed (in Manor Drive) to divert surface water away from Church Street. [TAB,PAG] (p33)</p></div><div class="nugget-popup"><p>Drainage features on Church Street require repairs after being affected (included in SCC Highways planned drainage programme); SCC Highways assigned to carry out drainage repairs. [TAB,PAG] (p34)</p></div><div class="nugget-popup"><p>Drainage features became blocked, requiring riparian owners or SCC Highways to carry out repairs and clearance. (p35)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 partially submerged car (p30)</p></div><div class="nugget-popup quant"><p>1 vehicle partially submerged [IMG] (p32)</p></div></div></body></div>`)[0];

                var html_7e8778d02461050af2711a4d90882ddd = $(`<div id="html_7e8778d02461050af2711a4d90882ddd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Suffolk</h1><div class="nugget-popup"><p>Significant disruption to communities across the county between 18&ndash;21 Oct 2023 due to Storm Babet, with widespread fluvial and surface water flooding impacting infrastructure and services. [PAG] (p4)</p></div><div class="nugget-popup"><p>During 18&ndash;21 October 2023 Suffolk experienced the heaviest rainfall across East Anglia leading to saturated catchments, rapid river rises and significant flooding of roads and properties. The flooding caused substantial disruption to transport (road and rail) and prompted a major incident declaration by the Suffolk Resilience Forum on 20 October. [PAG] (p6)</p></div><div class="nugget-popup"><p>Parts of the Wetheringsett&ndash;cum&ndash;Brockford parish in Suffolk (notably central Wetheringsett and Brockford Street) were identified as low&ndash;lying convergence points for flow paths and were subject to fluvial and pluvial flood risk during the Storm Babet period. A Flood Alert covering Brockford and Wetheringsett was issued on 20 October 2023; catchment runoff and low&ndash;permeability soils contributed to rapid surface water flows into these low spots. [IMG] (p13)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 major incident declared [PAG] (p6)</p></div></div></body></div>`)[0];

                var html_ae718a956dc9b1f1b3d0a952285b06a1 = $(`<div id="html_ae718a956dc9b1f1b3d0a952285b06a1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>East Anglia</h1><div class="nugget-popup"><p>Storm Babet (18 Oct 2023 &ndash; 21 Oct 2023) brought the heaviest rainfall across East Anglia, causing significant flooding of roads and properties. River systems rose rapidly across whole catchments with many flows close to or exceeding their highest on record, producing widespread disruption to road and rail networks. (p6)</p></div></div></body></div>`)[0];

                var html_756c90432ad35e976dbfea629cf3e6d1 = $(`<div id="html_756c90432ad35e976dbfea629cf3e6d1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wetheringsett</h1><div class="nugget-popup"><p>Part of the Wetheringsett&ndash;cum&ndash;Brockford parish which was severely impacted by flooding between 18&ndash;21 Oct 2023; natural and drainage flow routes were overwhelmed, overland flow convergence led to internal flooding of properties and disruption to local infrastructure and services. (p4)</p></div><div class="nugget-popup"><p>Wetheringsett was one of the main affected areas during Storm Babet, experiencing significant internal flooding to property and infrastructure from a combination of surface water runoff, overtopping watercourses and overwhelmed drainage/sewage systems. [IMG,PAG] (p8)</p></div><div class="nugget-popup"><p>Significant internal flooding to properties and village infrastructure in Wetheringsett. The village was identified as one of the main affected areas; floodwater originated from surface runoff, overtopping watercourses and overwhelmed drainage/sewer systems. Localised flooding was also reported in nearby streets (Station Road, Park Green and Weatherup Street). [PAG,IMG] (p9)</p></div><div class="nugget-popup"><p>Central Wetheringsett is mapped as having significant fluvial flood risk from local watercourses (and associated pluvial flow paths). The settlement is identified as a low&ndash;lying convergence point for flows and is expected to be a primary location to experience flooding during high rainfall. Wetheringsett lies toward the upper extent of the Flood Alert area (Flood Alert issued 20 October 2023) for the River Waveney / River Dove. [PAG,IMG] (p13)</p></div><div class="nugget-popup"><p>Significant flooding affected the parish area, inundating residential properties, roads and local infrastructure in Wetheringsett due to saturated catchment conditions and heavy rainfall. [PAG,IMG] (p15)</p></div><div class="nugget-popup"><p>The local area experienced significant surface water runoff and river overtopping causing internal flooding of properties; private sewerage works in the area continued to be affected in months following the event by high water levels, and possible infilling/lack of maintenance of watercourses prevented water egress in places. [IMG] (p22)</p></div><div class="nugget-popup"><p>During the event the village experienced both river (watercourse) flooding and significant surface&ndash;water/flash flows. At least 10 properties suffered internal flooding with internal depths of up to 500 mm. The watercourse entering the village from the east was overwhelmed and overtopped early, with water forcing its way around or over constrictions (including a weir, two small brick&ndash;arch bridges, a culvert under the old mill, and an engineered ~90&deg; turn), adding floodwater onto the highway and into nearby properties. The central area west of the church (a topographic low) was the most impacted. High&ndash;gradient southern and western approach roads produced torrents of surface water across the highway that reached the central low spot. The culvert at the primary school overtopped once its capacity was reached. Community reports indicate some sections of the watercourse north of the village required maintenance and may have reduced channel capacity during the event. (p23)</p></div><div class="nugget-popup"><p>The central village junction experienced torrents of surface water from the south and west that travelled at high speed across the highway and pooled in the village low spot. An eastern watercourse overtopped at a culvert, contributing flood flows into the highway and surrounding properties. [IMG] (p24)</p></div><div class="nugget-popup"><p>Surface water from a large catchment overwhelmed the village watercourse and highway drainage, causing rapid&ndash;onset flooding due to steep topography; the village pumping station was submerged, the foul sewer system was overwhelmed and overflowed into gardens and highways, and properties experienced internal flooding. (p25)</p></div><div class="nugget-popup"><p>Natural areas and vegetation were inundated; muddy floodwater covered the ground and rose partway up tree trunks. Flooding was reported close to the church in Wetheringsett. (p28)</p></div><div class="nugget-popup"><p>An area in east Wetheringsett (near the village church/Church Street) experienced surface water inundation covering ground, vegetation and surrounding buildings; community members required a small boat to move through the flooded area, indicating significant local disruption to movement and access. [IMG,PAG] (p29)</p></div><div class="nugget-popup"><p>Domestic gardens experienced sewage escape following the storm; the village also had observed watercourse blockages and drainage defects (e.g. Church Street, Brockford Street) contributing to local flooding and drainage issues. [TAB,PAG] (p34)</p></div><div class="nugget-popup"><p>Investigation and planned works to improve the watercourse network through Wetheringsett (including investigating capacity at engineered turns) and feasibility work for Natural Flood Management features to attenuate water in the upper catchments. (p35)</p></div><div class="nugget-popup"><p>Surface&ndash;water flows affected the village, prompting proposed works (watercourse improvements and NFM in upper catchments) to improve the village's flood resilience. (p36)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 20 properties (across Wetheringsett&ndash;cum&ndash;Brockford) (p4)</p></div><div class="nugget-popup quant"><p>over twenty properties (parish&ndash;wide) [PAG,IMG] (p9)</p></div><div class="nugget-popup quant"><p>At least 13 properties [IMG] (p22)</p></div><div class="nugget-popup quant"><p>at least 10 properties; internal depths up to 500 mm (p23)</p></div><div class="nugget-popup quant"><p>over 10 properties; internal flood water depths of up to 500mm (p25)</p></div></div></body></div>`)[0];

                var html_20c20b5f994920f2b00df1c2dad21a16 = $(`<div id="html_20c20b5f994920f2b00df1c2dad21a16" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Brockford Street</h1><div class="nugget-popup"><p>Brockford Street (with the River Dove running through it) was identified as a main affected area, suffering internal flooding and impacts to infrastructure from overtopping of the watercourse and surface&ndash;water flow paths during Storm Babet. [PAG] (p8)</p></div><div class="nugget-popup"><p>Significant internal flooding to properties and infrastructure in Brockford Street. Floodwater sources reported included overtopping of the River Dove (which runs south&ndash;north through Brockford Street), surface water from surrounding land, and overwhelmed sewage/drainage systems; observed flow paths conveyed floodwater through the community. [PAG,IMG] (p9)</p></div><div class="nugget-popup"><p>Area identified as a main affected location; river Dove runs south&ndash;north through the community and flooding resulted from river overtopping, surface&ndash;water runoff and overwhelmed drainage, causing internal flooding to properties and damage to infrastructure. [PAG,MUL] (p10)</p></div><div class="nugget-popup"><p>Mapped as being at significant fluvial (main river) and pluvial (surface water) flood risk. Flow paths converge through low&ndash;lying Brockford Street making it a primary location expected to experience flooding during high rainfall events. Brockford Street is within the area covered by the Flood Alert issued 20 October 2023 for the River Waveney / River Dove catchment. [PAG,IMG] (p13)</p></div><div class="nugget-popup"><p>Area identified as low&ndash;lying with several south&ndash;to&ndash;north flow paths converging through Brockford Street; map and report link the River Dove and local surface water flow paths to significant flood risk in this location and describe significant levels of surface water runoff during the October 2023 event, with water able to enter properties via airbricks or gaps under floors. [IMG,PAG] (p14)</p></div><div class="nugget-popup"><p>Severe flooding with floodwater from an overtopped River Dove, significant surface water runoff from the A140 and surrounding fields, and overwhelmed watercourses/drainage. The River Dove breached its banks at several points (east and west of the A140), causing flooding to properties bordering the river and to transport routes. A nearby open watercourse was quickly overwhelmed and overspilled onto the highway. (p16)</p></div><div class="nugget-popup"><p>Figure 15 and the report describe waterflow paths in north Brockford Street directing runoff from the built&ndash;up area towards the River Dove. Community reports and the bridge restriction indicate that during the event water left the channel upstream of the bridge and flowed onto the road and surrounding properties on the west side of the A140. Properties along north Brockford Street lie on these flow paths and were likely exposed to converging runoff and risk of inundation during the event (this is inferred from the map and community reports). [IMG] (p19)</p></div><div class="nugget-popup"><p>Water flowed north along Brockford Street during the event (flow paths split near Bridge House and Easter Cottage). Properties along the street experienced surface&ndash;water inundation and internal flooding; floodwaters contained sewage contamination. [IMG,PAG] (p21)</p></div><div class="nugget-popup"><p>Surface water runoff from surrounding fields to the east and south flowed south of the bridge and affected properties there; possible infilling and loss of watercourse features in the area is reported to have exacerbated flooding and prevented water egress, contributing to internal flooding of properties south of the bridge. [IMG] (p22)</p></div><div class="nugget-popup"><p>Relevant landowners are to carry out required maintenance or inspections of private sewerage systems in Brockford Street to ensure they are functioning correctly (medium&ndash;term action; may require longer planning/funding). (p35)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over twenty properties (parish&ndash;wide) [PAG,IMG] (p9)</p></div><div class="nugget-popup quant"><p>8 properties (recorded in The Street, Brockford Street) [PAG,MUL] (p10)</p></div><div class="nugget-popup quant"><p>13 properties (p16)</p></div><div class="nugget-popup quant"><p>At least 13 properties reported internal flooding (area&ndash;wide) [IMG,PAG] (p21)</p></div><div class="nugget-popup quant"><p>At least 13 properties [IMG] (p22)</p></div></div></body></div>`)[0];
                popup_292bc9d1b8059f8ba15294b673642792.setContent(html_20c20b5f994920f2b00df1c2dad21a16);

                var html_7199ade96ac11dccd459dbd0bebbdc28 = $(`<div id="html_7199ade96ac11dccd459dbd0bebbdc28" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Brockford Green</h1><div class="nugget-popup"><p>Located within the Brockford Street investigation area that experienced significant internal property flooding during Storm Babet (20 Oct 2023). Floodwater sources reported included overtopping of the River Dove (fluvial), surface&ndash;water runoff (pluvial) and overwhelmed drainage/sewer systems; these flows moved through the Brockford Street area causing internal flooding to properties and infrastructure. [PAG,IMG,MUL] (p10)</p></div><div class="nugget-popup"><p>Part of the Wetheringsett&ndash;cum&ndash;Brockford area that experienced significant flooding of residential properties, roads and infrastructure as a result of saturated catchment conditions and Storm Babet rainfall. [IMG] (p15)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8 properties (recorded flooded in Brockford Street 11 Oct 2023 &ndash; 15 Oct 2023) [PAG,IMG,MUL] (p10)</p></div></div></body></div>`)[0];
