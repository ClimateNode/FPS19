                var html_5614650c4ea6c5317737269eaf67e673 = $(`<div id="html_5614650c4ea6c5317737269eaf67e673" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>School Lane, Harpole</h1><div class="nugget-popup"><p>Internal flooding of a property on School Lane: surface water flowed over ground to low points around private property and entered the building (internal flooding). (p7)</p></div><div class="nugget-popup"><p>Internal flooding of a residential property (water entered the building fabric) on more than one occasion; prompted a formal investigation. (p9)</p></div><div class="nugget-popup"><p>A property on the north side of School Lane was inundated by surface water runoff; floodwater affected the property's rear garden and adjacent land. [PAG] (p10)</p></div><div class="nugget-popup"><p>A culverted watercourse beneath School Lane (a Highway Authority asset at that location) and a piped ditch near School Lane flowed through rear gardens on the north side of School Lane and through the rear garden of the property that was flooded; the piped watercourse was reported to reduce in diameter as it passed through manholes within the affected property. [PAG] (p11)</p></div><div class="nugget-popup"><p>Surface water flowing from fields north of School Lane entered properties. On 21/11/2012 one residential property experienced internal flooding affecting most of the ground floor requiring refurbishment and loss of furniture. On 09/03/2016 surface water began to enter a residential property; a team of residents/volunteers (and a pump) helped keep water out as far as possible. [TAB,PAG,MUL] (p12)</p></div><div class="nugget-popup"><p>Surface water from fields north of School Lane flowed south into rear gardens, causing extensive pooling on the lawn of the first property and surrounding the rear of a second property. Drainage around the second property was ineffective and water entered the property. A team of 10 people used a pump and took immediate action to limit the quantity of water entering the property. [PAG] (p13)</p></div><div class="nugget-popup"><p>Surface water from heavy rainfall flowed overland following natural contours to low points at private properties on School Lane. Emergency responders (a team of people) used a pump and other actions to limit water entering a residential property and reduced the flood impact to that property. (p14)</p></div><div class="nugget-popup"><p>A property on School Lane was flooded; resident photographs in Appendix E show the flooded property and the land drainage culvert at the rear of the property. [PAG] (p37)</p></div><div class="nugget-popup"><p>Surface water pooled at the rear of a residential property, reaching the conservatory/patio threshold. Patio paving and adjacent lawn were submerged; outdoor furniture, potted plants and children&#8217;s toys were partially submerged or waterlogged. Flooding threatened entry to the house and caused water accumulation against the building envelope. [IMG,PAG,MUL] (p40)</p></div><div class="nugget-popup"><p>Surface water accumulated across the rear garden and patio of a residential property on School Lane, producing standing water and saturated ground; water visible on lawn and patio indicating local inundation and poor drainage. [IMG,PAG] (p41)</p></div><div class="nugget-popup"><p>Rear garden of a property north of School Lane was flooded; a visible surface water flow route ran across the adjacent grassed field toward the property. [IMG,PAG] (p42)</p></div><div class="nugget-popup"><p>A residential property on School Lane was inundated &mdash; photograph caption explicitly identifies a 'flooded property on School Lane'. [IMG,PAG] (p44)</p></div><div class="nugget-popup"><p>A residential property on School Lane was flooded. A field&ndash;boundary ditch upstream (north of School Lane) had an accumulation of debris, which is identified as a contributing blockage to the flooding of the property. [IMG,PAG] (p45)</p></div><div class="nugget-popup"><p>The rear of a property on School Lane was documented as flooded. Drainage infrastructure (a linear drainage channel with metal grate and a partially exposed drainage feature/inspection pit) and gravel surfacing were present and observed, with evidence of recent inspection or temporary covering, indicating response/maintenance following the flood. [IMG] (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property (p7)</p></div><div class="nugget-popup quant"><p>one property (p9)</p></div><div class="nugget-popup quant"><p>one property [PAG] (p10)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p11)</p></div><div class="nugget-popup quant"><p>1 residential property flooded (21/11/2012); 1 residential property threatened/partially entered (09/03/2016); 10 people assisted (09/03/2016) [TAB,PAG,MUL] (p12)</p></div><div class="nugget-popup quant"><p>2 properties; 10 people [PAG] (p13)</p></div><div class="nugget-popup quant"><p>10 people; 1 residential property (p14)</p></div><div class="nugget-popup quant"><p>1 residential property [IMG,PAG,MUL] (p40)</p></div></div></body></div>`)[0];

                var html_4657dcc2826b6388c5468e96f6e2c0a1 = $(`<div id="html_4657dcc2826b6388c5468e96f6e2c0a1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Harpole</h1><div class="nugget-popup"><p>Flooding at School Lane in Harpole is the subject of the Northamptonshire County Council flood investigation report. (p2)</p></div><div class="nugget-popup"><p>Village location of the flood incident (School Lane, Harpole). Internal flooding of one property occurred in Harpole as part of the event: surface water ran to low points around private property and entered the building. (p7)</p></div><div class="nugget-popup"><p>Village location of the School Lane flood incident in which one property experienced internal flooding. [PAG] (p9)</p></div><div class="nugget-popup"><p>West Harpole experienced surface water flooding associated with a local, primarily culverted, watercourse and blocked/silted field ditches that led to flooding of at least one property on School Lane. [PAG] (p10)</p></div><div class="nugget-popup"><p>A watercourse through Harpole (primarily culverted in places) contributed to property flooding; riparian and culverted sections (including pipe connections from smaller watercourses) were linked to the flood that affected a property in the village. (p11)</p></div><div class="nugget-popup"><p>Heavy rainfall over a saturated catchment caused drainage systems to be ineffective in Harpole, resulting in excess surface water flowing to low points around private properties (notably at School Lane). Emergency action reduced the impact to a residential property. (p14)</p></div><div class="nugget-popup"><p>Location of the flood incident described in the report; the event affected Harpole on the date of the investigation. (p18)</p></div><div class="nugget-popup"><p>A flood incident on 9th March 2016 produced surface water and overland flow from surrounding fields that moved toward and into Harpole. The investigation map marks five flood incident locations clustered on the northern and eastern outskirts and shows probable overland surface water flow routes and main drainage channels conveying water into the village, highlighting vulnerable areas. [IMG] (p30)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property (p7)</p></div><div class="nugget-popup quant"><p>one property [PAG] (p9)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p10)</p></div><div class="nugget-popup quant"><p>1 property (p11)</p></div><div class="nugget-popup quant"><p>10 people; 1 residential property (p14)</p></div><div class="nugget-popup quant"><p>5 flood incident locations [IMG] (p30)</p></div></div></body></div>`)[0];
