                var html_8709886b5b7ebc703e9cf941ac9d3768 = $(`<div id="html_8709886b5b7ebc703e9cf941ac9d3768" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lowdham</h1><div class="nugget-popup"><p>Internal flooding of homes and businesses in the village; repeated incidents for some residents causing distress and ongoing recovery. Low&ndash;lying areas and locations adjacent to watercourses are vulnerable during heavy rainfall events. [PAG,IMG,MUL] (p3)</p></div><div class="nugget-popup"><p>Internal flooding of domestic properties and businesses in central and eastern parts of the village, causing repeated incidents for some residents and significant distress and disruption to those affected. [PAG,IMG] (p4)</p></div><div class="nugget-popup"><p>Cocker Beck overtopped and extensive surface water/runoff overwhelmed drainage, resulting in widespread internal flooding of properties, roads (including Epperstone By&ndash;Pass and Main Street) and open spaces throughout Lowdham. [PAG,IMG] (p5)</p></div><div class="nugget-popup"><p>Restricted capacity of the Cocker Beck (because of the collapsed structure and pumps) prevented discharge of water from Lowdham, causing the Beck to back up and leading to earlier overtopping of Station Road and flooding of local streets and properties. (p6)</p></div><div class="nugget-popup"><p>Experienced surface water flooding and remained at risk from river flooding (including bow wave impacts on properties). Volunteers closed roads to limit bow wave flooding; many hundreds of aqua sacs were delivered and people were helped to evacuate; council&ndash;led visits, clean&ndash;up of roads/paths and bulky&ndash;waste removal took place; recovery grants being delivered to eligible households. (p9)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>60 properties and businesses (internal flooding in the 2 January 2024 event); 300 properties (flooded in 1999) [PAG,IMG,MUL] (p3)</p></div><div class="nugget-popup quant"><p>60 properties and businesses [PAG,IMG] (p4)</p></div><div class="nugget-popup quant"><p>30 properties [PAG,IMG] (p5)</p></div><div class="nugget-popup quant"><p>191 properties (p9)</p></div></div></body></div>`)[0];
