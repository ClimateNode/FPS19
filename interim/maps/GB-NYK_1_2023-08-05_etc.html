                var html_319debac95bf29bc2e3e5753a608309d = $(`<div id="html_319debac95bf29bc2e3e5753a608309d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hackness Road, Newby</h1><div class="nugget-popup"><p>Identified in the report as one of the Newby streets affected by the August and September 2023 flood events. Impacts and responses recorded for the affected locations included property flooding and highway impacts, pump&ndash;outs by the Fire Service, road closures and drainage survey/clearing by NYC Highways, sandbags provided to residents, and follow&ndash;up visits by NYC Flood Risk Team and the Environment Agency. [MUL] (p1)</p></div><div class="nugget-popup"><p>Repeated flooding of the highway during 2023 with associated risk of property flooding; highways flooding can occur almost annually and property flooding estimated every 2&ndash;5 years. Up to seven properties may be affected in a 1&ndash;in&ndash;25&ndash;year event. Location experienced flooding on 05/08/2023 and 18/09/2023. [PAG,MUL] (p2)</p></div><div class="nugget-popup"><p>The culverted section of the main river surcharged and, together with overwhelmed highways, private drains and sewers, caused excess surface water to fall to the low point on Hackness Road, flowing onto the highway and into/under properties. Road users driving through the floodwater generated bow waves that exacerbated the flooding. [TAB,PAG,MUL] (p3)</p></div><div class="nugget-popup"><p>Flows towards the culverted main river under Hackness Road contributed to internal flooding risk to nearby properties; a proposed diversion scheme would provide approximate 1:100 year protection to properties currently affected or at risk. [TAB,MUL] (p4)</p></div><div class="nugget-popup"><p>Properties on Hackness Road were affected by flooding; the council is offering property flood resilience grants to affected properties as a response measure. [MUL] (p5)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>seven properties [PAG,MUL] (p2)</p></div><div class="nugget-popup quant"><p>27 properties [TAB,MUL] (p4)</p></div><div class="nugget-popup quant"><p>approximately ␀A37,000 per property; estimated overall cost approximately ␀A356,000 [MUL] (p5)</p></div></div></body></div>`)[0];
