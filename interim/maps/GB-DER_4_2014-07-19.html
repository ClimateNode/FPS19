                var html_dddebe078590c14484efdf538cab921b = $(`<div id="html_dddebe078590c14484efdf538cab921b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Spondon</h1><div class="nugget-popup"><p>Surface water flooding across the area on 19 July 2014, including internal property flooding in multiple locations and concentrated severe flooding in the Sandringham Drive area. (p4)</p></div><div class="nugget-popup"><p>Up to 17 residential properties were internally flooded in the Spondon area (properties on Sandringham Drive, Caernarvon Close, Holyrood Close and Harlech Close experienced internal flooding). (p5)</p></div><div class="nugget-popup"><p>Many areas of Spondon were affected by the flooding event on 19 July 2014, including internal property flooding. The City Council identified a significant cluster of reported internal and external property and highway flooding incidents on Sandringham Drive, Caernarvon Close, Holyrood Close and Harlech Close. [IMG] (p6)</p></div><div class="nugget-popup"><p>Experienced an extremely localised, short&ndash;duration intense storm (around 15:30 on 19 July 2014) that produced very high rainfall rates centred on and just southwest of Spondon. Because watercourse levels were not expected to be high, any flood impacts associated with this event would be due to rapid, localised surface&ndash;water/urban flooding rather than river overtopping. [IMG] (p12)</p></div><div class="nugget-popup"><p>Surface water flooding occurred across Spondon during the intense localised storm, with local drainage overwhelmed and rapid runoff accumulating in low spots leading to property flooding in parts of the area. (p14)</p></div><div class="nugget-popup"><p>An intense thunderstorm struck Spondon on the afternoon of 19 July 2014, producing extreme/localised rainfall that caused surface water flooding conditions in the area. (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>up to 18 properties (p4)</p></div><div class="nugget-popup quant"><p>up to 17 residential properties (p5)</p></div></div></body></div>`)[0];
