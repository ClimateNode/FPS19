                var html_918b8f54ee5f7ebde4e776f55fd5af55 = $(`<div id="html_918b8f54ee5f7ebde4e776f55fd5af55" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Golden Brook</h1><div class="nugget-popup"><p>Received flow from watercourses (Golden Stream and a drainage ditch) draining the west of Breaston during Storm Babet; acted as the downstream receptor conveying floodwater towards the River Erewash and onwards through Long Eaton. (p3)</p></div><div class="nugget-popup"><p>Flooding during the event was concentrated near local watercourses including Golden Brook; properties in the nearby Long Eaton community were internally flooded while flooding extents were adjacent to or near the course of Golden Brook. [PAG,IMG] (p20)</p></div><div class="nugget-popup"><p>Ordinary watercourse located about 700 m south of the flooded community and mapped in Flood Zone 3; identified in the report as part of the high&ndash;risk watercourse network adjacent to the flooded area and could have contributed to the local flood risk during Storm Babet (role inferred from mapping and proximity). [PAG,IMG] (p21)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>102 residential properties in Long Eaton suffered internal flooding (community total) [PAG,IMG] (p20)</p></div></div></body></div>`)[0];

                var html_bd28b198f15990c4b07e601b89a474e8 = $(`<div id="html_bd28b198f15990c4b07e601b89a474e8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Erewash</h1><div class="nugget-popup"><p>The River Erewash and its channel network are described as part of the sub&ndash;catchment hydrological response during Storm Babet (flowing south through multiple towns into Attenborough Nature Reserve). (p1)</p></div><div class="nugget-popup"><p>Shorter and earlier river responses to heavy rainfall were recorded upstream (near Pinxton and Eastwood) and later, longer responses downstream (near Sandiacre). River Erewash produced very high flows/levels in response to Storm Babet, with stations recording some of the highest&ndash;ranked flows or levels on record. (p3)</p></div><div class="nugget-popup"><p>River Erewash inundation adjacent to Ilkeston contributed to internal flooding of nearby properties during Storm Babet. (p8)</p></div><div class="nugget-popup"><p>River flooding/adjacent river levels contributed to internal flooding of properties in Ilkeston; the community is on the river's floodplain and proximity to the river is linked to clusters of flooded homes. [PAG,IMG] (p9)</p></div><div class="nugget-popup"><p>River Erewash flooding during Storm Babet/October 2023 caused inundation of adjacent residential properties in the Ilkeston floodplain, specifically properties on Digby Street, Station Street and Wentworth Street. [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>Fluvial flooding from the River Erewash (conveyed via the canal) caused flooding in the Ilkeston community; the river was the source of fluvial flood water that inundated properties. [PAG] (p11)</p></div><div class="nugget-popup"><p>The River Erewash overtopped its banks and drove fluvial flooding (with the canal acting as a conduit), contributing to flooding across Ilkeston including internal flooding of homes and non&ndash;residential properties; railway lines and the station also flooded. [IMG] (p12)</p></div><div class="nugget-popup"><p>Contributed to internal flooding of the Sandiacre community during Storm Babet; residential and some commercial properties between the River Erewash (east) and the Erewash Valley Canal (west) were flooded. [IMG] (p13)</p></div><div class="nugget-popup"><p>River Erewash flooding affected the Sandiacre community (community on its floodplain); contributed to internal flooding of residential and commercial properties during the storm. Historic floods of similar extent are recorded for the river. [PAG,MUL] (p14)</p></div><div class="nugget-popup"><p>Overtopping/inundation from the River Erewash caused internal flooding of residential properties and some commercial premises in the Sandiacre community. Properties that flooded during Storm Babet had previously flooded from the River Erewash; the community lies on the Erewash floodplain and many flooded properties are within Flood Zone 2. [PAG,IMG,MUL] (p15)</p></div><div class="nugget-popup"><p>Flooding of the adjacent Sandiacre community; river flooding from the River Erewash caused the internal property flooding reported during the event. Historic similar flood extents recorded in 1947, 1957, 1960, 1977 and 1978. [PAG,IMG,MUL] (p16)</p></div><div class="nugget-popup"><p>The River Erewash overtopped its banks and flowed into the Erewash Canal north of Gas Street; this overtopping initiated the flow path that led to widespread property flooding in the community. [PAG] (p17)</p></div><div class="nugget-popup"><p>The river overtopped its banks, flowed into the Erewash Canal north of Gas Street and caused overtopping of defence walls (west and east banks) opposite Megavaux. Overflowing led to flood water flowing westward and south across Station Road, flooding the industrial park, railyard and residential/business areas; the railway became a flow path and was closed. [PAG,IMG] (p18)</p></div><div class="nugget-popup"><p>The River Erewash overflowed, causing flooding to an industrial estate and a railyard south of Station Road; the Environment Agency issued a Flood Alert (19 Oct 2023) and a Flood Warning for the River Erewash at Sandiacre (21 Oct 2023). (p19)</p></div><div class="nugget-popup"><p>Main river adjacent to the flooded Long Eaton community; flooding from the River Erewash inundated residential properties in Long Eaton during the event. [PAG,IMG] (p20)</p></div><div class="nugget-popup"><p>River levels on the River Erewash prompted a Flood Alert (19 Oct 2023) and a Flood Warning (21 Oct 2023) and contributed to internal flooding in the Long Eaton community. [IMG,PAG] (p21)</p></div><div class="nugget-popup"><p>The River Erewash overflowed and conveyed floodwater into the Long Eaton community, entering via Doncaster Road/Doncaster Grove and causing internal flooding to houses. [PAG] (p22)</p></div><div class="nugget-popup"><p>The River Erewash overflowed and sent flow routes into the Long Eaton community (initially joining Doncaster Road), causing gardens and ground floors of properties to flood and leading to internal flooding across the community. [PAG,IMG] (p23)</p></div><div class="nugget-popup"><p>The community (Langley Mill) sits on the floodplain of the River Erewash and was flooded during the event, causing inundation of residential terraced homes and non&ndash;residential properties (restaurants, shops, depot yard, self&ndash;storage). Critical infrastructure lies adjacent (Midlands Railway Line, A608 Derby Road, A610) and a Severn Trent pumping station and Millhay Heanor STW lie approximately 400m and 900m downstream respectively of the flooded area. (p24)</p></div><div class="nugget-popup"><p>The River Erewash is the main watercourse running through the mapped area and is implicated in river&ndash;flooding interactions with the urban area; culverted sections and tributaries run close to streets and buildings that experienced flooding. [IMG] (p25)</p></div><div class="nugget-popup"><p>River Erewash is identified as the primary watercourse along which the highest flood risk (Flood Zone 3) is concentrated. Properties in Langley Mill flooded internally during Storm Babet; many of those flooded properties fall within the river flood zones shown adjacent to the River Erewash and Erewash Canal, indicating river flooding from the River Erewash impacted the community. [PAG,IMG] (p26)</p></div><div class="nugget-popup"><p>Primary source of flooding in the Langley Mill community. The river overtopped (first identified at a 90&deg; bend south of the Crabapple Drive allotments) and drove floodwater into the Erewash Canal (which acted as a conduit) and, in some locations, interacted with flows from Nether Green Brook to cause internal flooding of properties on Cromford Road, Dean Street, Queen Street, Station Road, Derby Road, Boundary Lane and Enterprise Way. [PAG] (p28)</p></div><div class="nugget-popup"><p>The River Erewash overtopped its west embankment at a 90&ndash;degree bend south of the Crabapple Drive allotments. Overtopping and subsequent flow across industrial yards and the DandD Transport car park routed floodwater onto Cromford Road and caused internal flooding of properties on adjacent streets. [IMG,PAG] (p29)</p></div><div class="nugget-popup"><p>The River Erewash overtopped its banks in multiple locations (including behind DandD Transport car park and at the Derby Road bridge), sending water across the car park onto Cromford Road and contributing directly to internal and external flooding of nearby streets and properties. [PAG] (p30)</p></div><div class="nugget-popup"><p>Experienced exceptionally high flows that overtopped banks and infrastructure, contributing to flooding across Langley Mill and adjacent roads. Wrack marks show peak water reached 59.9mAOD; the river produced record gauge levels at Shipley Gate, reflecting the primary source of the observed inundation. [PAG] (p31)</p></div><div class="nugget-popup"><p>Flooding from the River Erewash affected the Ironville floodplain and contributed to internal flooding of properties in Adelaide Walk during Storm Babet. [IMG,PAG] (p33)</p></div><div class="nugget-popup"><p>Primary source of the event: the Erewash overflowed its west bank upstream of the Midland Railway Line and the excess water flowed across adjacent land onto Nottingham Lane and into the Ironville community, causing internal flooding of homes. [PAG,IMG] (p34)</p></div><div class="nugget-popup"><p>Overflowed its west bank upstream of the Midland Railway Line, causing water to flow over fields and onto Nottingham Lane, through the railway underpass and southwards across recreational playing fields into residential areas. The river overflow was the primary source of internal flooding that affected properties on Adelaide Walk, Regent Court and Deepdale. (p35)</p></div><div class="nugget-popup"><p>The River Erewash was the focus of Flood Alerts and a Flood Warning during the event and contributed to local flooding in Pinxton. The Environment Agency issued a Flood Alert for the River Erewash (Derbyshire and Nottinghamshire) on 19 Oct 2023 at 01:13 and a Flood Warning for the River Erewash at Ironville on 20 Oct 2023 at 11:45. Flooding associated with the river (driven by Storm Babet) led to internal flooding of residential properties in the south&ndash;west corner of Pinxton and emergency evacuations by Derbyshire Fire and Rescue using boats. [IMG,PAG] (p36)</p></div><div class="nugget-popup"><p>The River Erewash caused river flooding affecting the Pinxton community during Storm Babet; the Environment Agency historic record also shows previous river flooding in this location (1965, 1977, 2007). [IMG] (p37)</p></div><div class="nugget-popup"><p>The River Erewash reached a peak gauge level of 2.65 metres (the highest recorded at this station), contributing to local flooding by preventing sewer discharge and allowing floodwater to enter Pinxton Wharf. [PAG] (p39)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>53 residential and 14 non&ndash;residential properties (p8)</p></div><div class="nugget-popup quant"><p>53 residential properties; 14 non&ndash;residential properties [PAG,IMG] (p9)</p></div><div class="nugget-popup quant"><p>53 homes [PAG] (p11)</p></div><div class="nugget-popup quant"><p>53 homes flooded internally; 14 non&ndash;residential properties reported flooding [IMG] (p12)</p></div><div class="nugget-popup quant"><p>129 properties [IMG] (p13)</p></div><div class="nugget-popup quant"><p>129 properties [PAG,MUL] (p14)</p></div><div class="nugget-popup quant"><p>129 properties flooded (community total attributable to river overtopping and subsequent canal conveyance) [PAG] (p17)</p></div><div class="nugget-popup quant"><p>104 homes; 25 businesses (129 homes and businesses total) [IMG,PAG] (p18)</p></div><div class="nugget-popup quant"><p>102 residential properties [PAG] (p19)</p></div><div class="nugget-popup quant"><p>102 residential properties [PAG,IMG] (p20)</p></div><div class="nugget-popup quant"><p>102 residential properties [IMG,PAG] (p21)</p></div><div class="nugget-popup quant"><p>102 properties [PAG] (p22)</p></div><div class="nugget-popup quant"><p>102 homes [PAG,IMG] (p23)</p></div><div class="nugget-popup quant"><p>21 residential properties; 29 non&ndash;residential properties [PAG,IMG] (p26)</p></div><div class="nugget-popup quant"><p>28 homes; 35 non&ndash;residential properties [PAG] (p28)</p></div><div class="nugget-popup quant"><p>59.9mAOD peak wrack mark on both banks; bank heights approx 55mAOD (west) and 58mAOD (east); 1m floodwater depths reported in multiple locations [PAG] (p30)</p></div><div class="nugget-popup quant"><p>maximum gauge level 3.25m recorded at Shipley Gate; wrack level 59.9mAOD; floodwater depths approximately 1m reported in multiple locations [PAG] (p31)</p></div><div class="nugget-popup quant"><p>22 residential properties [IMG,PAG] (p33)</p></div><div class="nugget-popup quant"><p>22 residential properties; 0.9m internal depth at one property in Regent Court; up to 0.5m depth at properties within the Adelaide Park area (p35)</p></div><div class="nugget-popup quant"><p>1 Flood Alert; 1 Flood Warning; 22 properties [IMG,PAG] (p36)</p></div><div class="nugget-popup quant"><p>2.65 metres [PAG] (p39)</p></div></div></body></div>`)[0];
                popup_2bc64ec090453a10527b2045907194e6.setContent(html_bd28b198f15990c4b07e601b89a474e8);

                var html_4bc77f017f332c40035e491537d0f6f5 = $(`<div id="html_4bc77f017f332c40035e491537d0f6f5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Trent</h1><div class="nugget-popup"><p>Later, longer river responses to heavy rainfall were recorded downstream on the River Trent (near Shardlow). The Shardlow gauging station on the River Trent produced the 5th highest ranked flow on record in response to Storm Babet. (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5th highest ranked flow on record (Shardlow station) (p3)</p></div></div></body></div>`)[0];

                var html_a49abc33543c15d455f9d127bfee28e4 = $(`<div id="html_a49abc33543c15d455f9d127bfee28e4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Derby Road Bridge</h1><div class="nugget-popup"><p>The River Erewash overtopped the Derby Road bridge with water high enough to flow over the bridge deck; wrack marks on the upstream face indicate the peak water level reached the bridge and contributed to flooding on Derby Road. (p30)</p></div><div class="nugget-popup"><p>The River Erewash overtopped the upstream face of Derby Road bridge during the event, causing floodwater to flow onto and along Derby Road. Wrack marks on the upstream face record the peak level, and overtopping contributed to flooding of the adjacent highway and damage to pavement and underground services. [PAG,IMG] (p31)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>wrack level 59.9mAOD; floodwater depths of approximately 1m reported in multiple locations [PAG,IMG] (p31)</p></div></div></body></div>`)[0];

rties flooded internally during Storm Babet are shown in Flood Zone 2 (remaining properties in Flood Zone 3). [PAG] (p25)</p></div><div class="nugget-popup quant"><p>16 homes; 21 non&ndash;residential [TAB,PAG] (p28)</p></div><div class="nugget-popup quant"><p>1m floodwater depths reported in multiple locations [PAG] (p30)</p></div></div></body></div>`)[0];

                var html_39fc349525d0aae2e5c4d74c7240aefb = $(`<div id="html_39fc349525d0aae2e5c4d74c7240aefb" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Erewash</h1><div class="nugget-popup"><p>Shorter and earlier river responses to the heavy rainfall were recorded upstream on the River Erewash (e.g. Pinxton, Eastwood). Gauging stations at Pinxton, Sandiacre and near Eastwood produced the highest&ndash;ranked flows or levels on record in response to Storm Babet. (p3)</p></div><div class="nugget-popup"><p>Flooding within the Erewash administrative area (Ilkeston) resulted in internal flooding of homes and businesses; local authority response included sandbag distribution, empty and filled sandbag collection, and removal of flood&ndash;damaged household items by the borough council. [IMG,PAG] (p9)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 gauging stations (Pinxton, Sandiacre, near Eastwood) produced highest&ndash;ranked flows/levels on record; shortest lag time 13 hours (p3)</p></div><div class="nugget-popup quant"><p>53 residential properties; 14 non&ndash;residential properties [IMG,PAG] (p9)</p></div></div></body></div>`)[0];

                var html_7fb7a66b0083fc5496aecb0942aa70bc = $(`<div id="html_7fb7a66b0083fc5496aecb0942aa70bc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Derbyshire</h1><div class="nugget-popup"><p>Within Derbyshire, Storm Babet's intense rainfall led to river and surface&ndash;water flooding in parts of the county. The report records internal flooding of properties in Breaston (west of the community) adjacent to Golden Stream and a drainage ditch, and flooding affected local transport infrastructure (the Midlands Main Line railway). [PAG,IMG] (p4)</p></div><div class="nugget-popup"><p>Flooding associated with Storm Babet affected communities in Derbyshire including internal flooding of properties in Breaston. [PAG] (p6)</p></div><div class="nugget-popup"><p>Internal flooding of properties in the county during Storm Babet: in Ilkeston, properties adjacent to the River Erewash experienced internal flooding from river&ndash;related inundation; in Breaston (Festival Avenue) surface water and sewer surcharge (blocked drains and a surcharging manhole) caused runoff to reach driveways on a downslope and led to internal flooding of homes. (p8)</p></div><div class="nugget-popup"><p>Flooding in Ilkeston (within Derbyshire) during the event resulted in internal flooding to residential and non&ndash;residential properties in the community. [PAG] (p11)</p></div><div class="nugget-popup"><p>River flooding in the Long Eaton community (within Derbyshire) caused internal flooding of residential properties and affected local infrastructure near the River Erewash floodplain. [PAG] (p21)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties in the Long Eaton area (Erewash borough) caused by the River Erewash overflowing and flow routes entering the community via Doncaster Grove/Doncaster Road. Reported impacts include gardens and ground floors flooded, whole ground&ndash;floor internal flooding at a property on Margaret Avenue, and floodwater rising through floors at properties on Denacre Avenue and George Avenue. Derbyshire County Council recorded local water depths of 0.45 m to 0.60 m on Nottingham Road under the railway bridge near Long Eaton Kwik Fit. [PAG] (p23)</p></div><div class="nugget-popup"><p>Properties within the county (the studied community) experienced internal flooding during Storm Babet; the record of previous flooding in the community is also reported (see quant). Specific streets in the community have high surface&ndash;water flood risk, and some properties have flooded historically. [IMG] (p25)</p></div><div class="nugget-popup"><p>Internal flooding of properties in Langley Mill after the River Erewash overtopped and floodwater transferred via the Erewash Canal and contributions from Nether Green Brook. [PAG] (p28)</p></div><div class="nugget-popup"><p>Flooding from the River Erewash in Ironville resulted in internal flooding of residential properties on Adelaide Walk, Regent Court and Deepdale, flooding of Nottingham Lane, Victoria Street and the B6016, and external stock affected at a business depot to the south of the recreational fields. (p35)</p></div><div class="nugget-popup"><p>Derbyshire County Council visited the area and observed evidence of sewer surcharge (manhole covers lifted), indicating sewer network flooding/surcharge and surface water run&ndash;off contributed to internal flooding of residential properties. [PAG] (p38)</p></div><div class="nugget-popup"><p>Surface water runoff accumulated at a local low point north of the railway line causing pooling and flooding on streets in the community (notably Alexandra Terrace and York Terrace). Derbyshire County Council engaged in post&ndash;event investigations with Severn Trent into drainage issues related to this surface water flooding. [PAG] (p40)</p></div><div class="nugget-popup"><p>Communities within the county experienced internal property flooding associated with Storm Babet. Nine residential properties in Aston&ndash;on&ndash;Trent were internally flooded. Local response included removal of effluent from the adopted highway, collection of flood&ndash;damaged items and offers of temporary accommodation; Derbyshire County Council worked with Severn Trent Water to investigate drainage and residents were provided PFR scheme claim forms. [IMG] (p41)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>49 residential properties; 2 non&ndash;residential properties [PAG,IMG] (p4)</p></div><div class="nugget-popup quant"><p>49 homes flooded in Breaston (within Derbyshire) [PAG] (p6)</p></div><div class="nugget-popup quant"><p>53 residential properties; 14 non&ndash;residential properties; one surcharging manhole (p8)</p></div><div class="nugget-popup quant"><p>53 homes; 14 non&ndash;residential properties [PAG] (p11)</p></div><div class="nugget-popup quant"><p>102 residential properties [PAG] (p21)</p></div><div class="nugget-popup quant"><p>102 homes; Recreation Street 1; Devonshire Avenue 4; Harlaxton Drive 1; Carrfield Avenue 2; George Avenue 2; Norfolk Road 23; Doncaster Grove 6; Florence Avenue 10; Landsdown Grove 17; Denacre Avenue 5; Conway Street 7; Nottingham Road 17; Mayfield Grove 4; Margaret Avenue 3; reported local water depths 0.45 m to 0.60 m on Nottingham Road [PAG] (p23)</p></div><div class="nugget-popup quant"><p>15 properties previously flooded (3 residential; 12 non&ndash;residential); 21 residential and 29 non&ndash;residential properties reported flooded internally during Storm Babet (see Storm Babet entry) [IMG] (p25)</p></div><div class="nugget-popup quant"><p>28 homes; 35 non&ndash;residential properties [PAG] (p28)</p></div><div class="nugget-popup quant"><p>22 residential properties; 1 property (Regent Court) with internal flood depth of 0.9m; properties in Adelaide Park experienced up to 0.5m of floodwater. (p35)</p></div><div class="nugget-popup quant"><p>9 residential properties in Aston&ndash;on&ndash;Trent; 1 home on Weston Road; 8 homes on Yates Avenue [IMG] (p41)</p></div></div></body></div>`)[0];

                var html_5f2142b82b33139d7a3c7573f38d0b54 = $(`<div id="html_5f2142b82b33139d7a3c7573f38d0b54" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Erewash Canal</h1><div class="nugget-popup"><p>Acted as a conduit for fluvial floodwater from the River Erewash into the urban area (transporting river water through the canal) &mdash; it was not the source of the flooding. [IMG] (p12)</p></div><div class="nugget-popup"><p>Flooding concentrated along the Erewash Canal (and adjacent River Erewash) contributed to the inundation of the local residential community in Sandiacre; Flood Zone 3 is concentrated closest to the canal, placing adjacent streets and properties at highest risk during the event. [PAG,IMG] (p15)</p></div><div class="nugget-popup"><p>Areas immediately adjacent to the Erewash Canal were shown as having the highest surface&ndash;water flood risk on the map. Properties close to the canal (for example Canal Street) are reported as having experienced internal flooding during the event associated with Storm Babet and the flooding is linked to high water levels in the local watercourses. [PAG,IMG] (p16)</p></div><div class="nugget-popup"><p>Fluvial flood water from the River Erewash entered the canal which acted as a conduit, raising canal water levels and creating a secondary flow path that carried floodwater south across the community and contributed to internal property flooding. [PAG] (p17)</p></div><div class="nugget-popup"><p>The River Erewash overtopped and flowed into the Erewash Canal north of Gas Street (opposite Brookfield Mews). The canal acted as a conduit for flood water, water levels rose and created a secondary flow path which flowed south across the community, causing rapid onset flooding and significant property damage (several properties had floors lifted). [PAG,IMG] (p18)</p></div><div class="nugget-popup"><p>Areas adjacent to the Erewash Canal are mapped as Flood Zone 3 (highest fluvial risk) and the map analysis links the highest flood risk to the canal corridor. These Flood Zone 3 areas are associated with properties that flooded internally during Storm Babet (Oct 2023), so the canal corridor was implicated in the fluvial flooding that affected properties in Langley Mill during 18 Oct 2023 &ndash; 21 Oct 2023. Exact numbers of properties adjacent to the canal that flooded are not specified in the text. [PAG,IMG] (p26)</p></div><div class="nugget-popup"><p>Acted as a conduit for transfer of floodwater from the River Erewash and Nether Green Brook; the canal overtopped (entirely due to inflows from the river and brook) and this contributed to property flooding in the community. (p28)</p></div><div class="nugget-popup"><p>The Erewash Canal overtopped because inflows from the River Erewash and Nether Green Brook entered the canal; the canal overtopping was a direct pathway contributing to flooding of adjacent areas in Langley Mill. [IMG,PAG] (p29)</p></div><div class="nugget-popup"><p>The canal acted as a conduit for floodwater entering from Nether Green Brook, causing flooding across Langley Mill Boatyard, overtopping lock gates, and transferring floodwater southwards; overflow from the canal's west banks flowed overland towards the River Erewash and contributed to downstream flooding. (p30)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>129 properties flooded (community total linked to canal conveyance) [PAG] (p17)</p></div><div class="nugget-popup quant"><p>129 homes and businesses [PAG,IMG] (p18)</p></div></div></body></div>`)[0];

ors being lifted by the force of water). (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>129 properties (p13)</p></div><div class="nugget-popup quant"><p>129 properties [PAG,MUL] (p14)</p></div><div class="nugget-popup quant"><p>104 homes; 25 businesses; 129 properties flooded (p17)</p></div></div></body></div>`)[0];

                var html_fd48bb36f3971392ddc2102b62ff2f64 = $(`<div id="html_fd48bb36f3971392ddc2102b62ff2f64" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Breaston</h1><div class="nugget-popup"><p>Internal flooding of properties in the west of Breaston; the flooded area is adjacent to Golden Stream (a main river) and a drainage ditch that flows between the properties and Johnson's Meadow. (p3)</p></div><div class="nugget-popup"><p>Internal flooding occurred in the west of Breaston during Storm Babet. Forty&ndash;nine residential properties and two non&ndash;residential properties suffered internal flooding. The flooded area is adjacent to Golden Stream and a drainage ditch; floodwaters from these watercourses flow through the community towards Golden Brook. The Midlands Main Line railway running through the area also flooded during the event. [IMG,PAG] (p4)</p></div><div class="nugget-popup"><p>Residential properties within the Breaston community were flooded during the Storm Babet event. The community sits on the floodplain of the Golden Stream and Golden Brook; homes within Flood Zone 2 and Flood Zone 3 were affected. Properties that flooded in this event have documented previous flooding in 2000, 2019 and 2020. The railway running through the area also flooded during Storm Babet. [PAG,IMG] (p5)</p></div><div class="nugget-popup"><p>Internal flooding of residential and some non&ndash;residential properties during Storm Babet; properties on multiple streets were internally flooded. [PAG,IMG] (p6)</p></div><div class="nugget-popup"><p>Golden Stream and an overgrown/obstructed drainage ditch and culvert caused flow to back up and overtop banks. Overtopping and blocked channels sent water into back gardens and roads across the community, resulting in internal flooding of homes and some non&ndash;residential properties. [IMG] (p7)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>49 residential properties; 2 non&ndash;residential properties (p3)</p></div><div class="nugget-popup quant"><p>49 residential properties; 2 non&ndash;residential properties [IMG,PAG] (p4)</p></div><div class="nugget-popup quant"><p>42 homes; 4 non&ndash;residential properties [PAG,IMG] (p5)</p></div><div class="nugget-popup quant"><p>49 homes; 17 residential properties on Gregory Avenue; 4 on Hind Avenue; 13 on Festival Avenue; 2 on Spring Close; 13 on the A6005 (Draycott Road); 2 non&ndash;residential properties at eastern end of Gregory Avenue. [PAG,IMG] (p6)</p></div><div class="nugget-popup quant"><p>49 homes flooded internally; 2 non&ndash;residential properties flooded [IMG] (p7)</p></div></div></body></div>`)[0];

                var html_b09f20487d41493272c4ccd8f59d7cb4 = $(`<div id="html_b09f20487d41493272c4ccd8f59d7cb4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Langley Mill</h1><div class="nugget-popup"><p>There were river&ndash;canal interactions upstream at Langley Mill during the event that likely elevated canal levels prior to the River Erewash overtopping downstream, contributing to the canal acting as a conduit for flood flows. (p17)</p></div><div class="nugget-popup"><p>Langley Mill experienced internal property flooding during Storm Babet (properties are mapped within Flood Zones associated with river flooding) and the community has documented historical flooding. The Long Term Flood Risk Map shows all residential properties have at least a low risk of surface water flooding, with many locations (Station Road, Dean Street, Cromford Road, Enterprise Road) at high surface&ndash;water flood risk. Flood mapping and protection assets (embankments, flood walls) are concentrated along the River Erewash and Erewash Canal within the community. [IMG,PAG] (p26)</p></div><div class="nugget-popup"><p>Internal flooding of homes and non&ndash;residential properties across the Langley Mill community caused by the River Erewash overtopping; the Erewash Canal acted as a conduit and Nether Green Brook contributed in locations. Overtopping was first identified at a 90&deg; bend south of the Crabapple Drive allotments; floodwaters flowed across the Frametrade UK Ltd yard and onto Cromford Road. Flood defences (west and east embankments and an upstream floodwall) are present but were overtopped. Flood Alert issued 19 Oct 2023 01:13; Flood Warning issued 20 Oct 2023 06:44; internal flooding began ~20 Oct 2023 14:00. [TAB,PAG] (p28)</p></div><div class="nugget-popup"><p>Area experienced flooding from two interacting mechanisms: overtopping of the River Erewash (west&ndash;side flooding) and overflow of the Erewash Canal influenced by the River Erewash and Nether Green Brook (east&ndash;side). Floodwater routes led to internal flooding of properties on Cromford Road and adjacent streets (Queen Street, Dean Street, Derby Road) and overtopping across yards and car parks. [IMG] (p29)</p></div><div class="nugget-popup"><p>Floodwater entered the Erewash Canal system and resulted in flooding across Langley Mill Boatyard; canal overtopped lock gates and overflowed west banks, with overland flow encouraged by local topography contributing to flooding towards the River Erewash. (p30)</p></div><div class="nugget-popup"><p>Local watercourses and the Erewash Canal contributed to flooding in Langley Mill. Restricted culvert capacity on Nether Green Brook caused surcharging and overtopping; once into the canal, floodwater was conveyed across the Langley Mill Boatyard and overtopped lock gates, with overland flow directed toward the River Erewash. Homes and commercial properties on Cromford Road, Station Road and Derby Road experienced internal and external flooding. [PAG] (p31)</p></div><div class="nugget-popup"><p>Internal flooding of homes on local streets (localized residential flooding). [IMG] (p41)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>15 properties previously flooded (3 residential and 12 non&ndash;residential); 21 residential and 29 non&ndash;residential properties that flooded internally during Storm Babet are located within Flood Zone 2 [IMG,PAG] (p26)</p></div><div class="nugget-popup quant"><p>28 homes; 35 non&ndash;residential properties [TAB,PAG] (p28)</p></div><div class="nugget-popup quant"><p>five culverts along Nether Green Brook (local to Langley Mill); floodwater depths reported approximately 1m in multiple locations; internal flooding at Frametrade UK Ltd reached approximately 0.9m [PAG] (p31)</p></div><div class="nugget-popup quant"><p>1 home on Weston Road; 8 homes on Yates Avenue [IMG] (p41)</p></div></div></body></div>`)[0];

                var html_e821c8092ff81d3cebc84cbe8830ae37 = $(`<div id="html_e821c8092ff81d3cebc84cbe8830ae37" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ironville</h1><div class="nugget-popup"><p>A large culvert at Ironville on the River Erewash became unblocked and appeared to drain very quickly at around 11:00 on 20 Oct 2023; this rapid release of water is reported as a possible contributor to high downstream flows and flooding. (p30)</p></div><div class="nugget-popup"><p>Twenty&ndash;two residential properties in the Adelaide Walk area suffered internal flooding during the event; the community sits on the floodplain of the River Erewash. [IMG] (p32)</p></div><div class="nugget-popup"><p>Twenty&ndash;two residential properties in the Adelaide Walk area of Ironville suffered internal flooding during Storm Babet. [PAG,IMG] (p33)</p></div><div class="nugget-popup"><p>The community experienced river flooding during Storm Babet: floodwaters from the River Erewash overtopped the west bank upstream of the Midland Railway Line, flowed over fields onto Nottingham Lane, through the railway underpass, across recreational playing fields and into residential areas. Flooding affected houses in Regent Court and Deepdale and also caused inundation along Victoria Street (B6016) between Ironville and Jacksdale. [PAG,IMG] (p34)</p></div><div class="nugget-popup"><p>Community areas were impacted by overland flow from the overflowing River Erewash: internal flooding of residential properties on Adelaide Walk, Regent Court and Deepdale (22 properties in total), local roads (Victoria Street/B6016) were flooded, and recreational playing fields and a nearby business depot experienced floodwater. The Severn Trent pumping station was overwhelmed because it had nowhere to pump to. (p35)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approx. 4 km upstream (location of the culvert); 20 Oct 2023 at ~11:00 (timing of the reported unblocking) (p30)</p></div><div class="nugget-popup quant"><p>22 residential properties [IMG] (p32)</p></div><div class="nugget-popup quant"><p>22 residential properties [PAG,IMG] (p33)</p></div><div class="nugget-popup quant"><p>22 residential properties flooded internally [PAG,IMG] (p34)</p></div><div class="nugget-popup quant"><p>22 residential properties; 0.9m internal depth at one property in Regent Court; up to 0.5m depth at properties within the Adelaide Park area (p35)</p></div></div></body></div>`)[0];
