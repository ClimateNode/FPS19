re required to minimise flood risk. (p19)</p></div><div class="nugget-popup"><p>Surface water flowed along/over Whitings Lane and entered the village overland; recommendations include investigating drainage improvements and highway attenuation on Whitings Lane to intercept flows. [TAB] (p25)</p></div></div></body></div>`)[0];

                var html_5e6715f939e84b325d54fa16936fb4d8 = $(`<div id="html_5e6715f939e84b325d54fa16936fb4d8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hailey</h1><div class="nugget-popup"><p>Surface water flooding on 23rd December 2020 internally flooded residential properties in Delly End (part of Hailey). Flood defences at properties that had them were overwhelmed within minutes and flood levels rose higher than in 2007. (p2)</p></div><div class="nugget-popup"><p>Intense rainfall on 23/12/2020 reportedly overwhelmed the drainage system in Delly End (within Hailey), causing flooding to a greater extent; local land drainage/ploughing associated with a proposed solar farm was anecdotally reported as a possible contributing factor. (p13)</p></div><div class="nugget-popup"><p>The Hailey community experienced flooding issues and has an active working group that identified and progressed multiple actions (highway attenuation at the Triangle on Whitings Lane, upstream attenuation at Singe Wood and Solar Farm land, and arranging regular maintenance with OCC and landowners) to minimise flooding in the village and to benefit Delly End. (p19)</p></div><div class="nugget-popup"><p>Hailey experienced flooding that prompted an active local working group to progress mitigation measures. Actions identified and progressed to address the flooding (and to benefit Delly End) include creating a highway attenuation area at the Triangle on Whitings Lane, modelling existing drainage systems and catchments, providing upstream attenuation at Single Wood and on land proposed for a solar farm, and carrying out regular maintenance of drainage systems by OCC and landowners. [PAG] (p20)</p></div><div class="nugget-popup"><p>Overland surface water and overwhelmed highway drainage entered the village during the event, causing flooding issues within Hailey and prompting recommendations to increase cleansing/maintenance of highway drainage assets. [TAB] (p25)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>6 residential properties (p2)</p></div></div></body></div>`)[0];

                var html_2be77f304943a586e09e9f45d7de2e6b = $(`<div id="html_2be77f304943a586e09e9f45d7de2e6b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Delly End</h1><div class="nugget-popup"><p>Overland surface water flows reach Delly End; the village and properties are at risk of flooding from upstream flows and runoff. Measures proposed include slowing flows upstream (nature&ndash;based solutions), reinstatement of Delly Pool and highway/attenuation works to reduce flood risk to Delly End. (p4)</p></div><div class="nugget-popup"><p>Surface water flooding on 23 December 2020 caused internal flooding of residential properties (flood levels higher than in 2007; locally erected defences were overwhelmed within minutes). Water was very silty/clayey consistent with agricultural runoff. Drains on Wood Lane and Whitings Lane were reported completely blocked (reported since October 2019), contributing to the event. In July 2007 deep ponding made the road at the crossroads impassable; roadside culverts (~900mm) acted as constrictions. In July 2007 the main sewer overloaded and caused a backup of sewage into a house, resulting in internal sewer flooding. [IMG,PAG,MUL] (p10)</p></div><div class="nugget-popup"><p>Surface water flooding began at 10:30am on 23 December 2020, reaching levels reported as higher than in 2007. Property flood defences that existed were overwhelmed within minutes and silty/clayey water inundated the area. The flooding was linked to runoff from recently disturbed agricultural land in the upper catchment; residents cleared overspill into fields and removed a stone wall adjacent to the B4022 which had been acting as a dam, immediately relieving water levels. [PAG] (p11)</p></div><div class="nugget-popup"><p>The B4022 crossroads at Delly Pool (Delly End) was completely flooded and impassable. A culvert under the highway feeding a field drain was reported blocked, causing overspill into adjacent fields. Residents manually cleared the overspill into opposite fields and removed a stone wall adjacent to the B4022 that was acting as a dam; removal had an immediate effect in lowering local water levels. Anecdotal reports linked the flooding to recent land drainage and ploughing on nearby fields associated with a proposed solar farm. [PAG] (p12)</p></div><div class="nugget-popup"><p>The local drainage system was overwhelmed by intense rainfall on 23/12/2020, reportedly causing more extensive flooding in Delly End. Flooding was anecdotally linked to recent agricultural land drainage and ploughing carried out to drain land for a proposed solar farm, which may have altered flow routes. [PAG] (p13)</p></div><div class="nugget-popup"><p>Delly End experienced flooding during the 23rd December 2020 event driven by overland/cross&ndash;catchment flows and blocked highway drainage; subsequent site visits reported that highway drainage had been found completely blocked and that significant cleansing and ditching works were carried out after the event to mitigate risk. [IMG,PAG] (p14)</p></div><div class="nugget-popup"><p>Delly End was a target for interception works because surface water from upslope (Whitings Lane/new ditches) reached the settlement during the December 2020 event; new ditches were installed to slow/intercept flows before they reached Delly End. (p15)</p></div><div class="nugget-popup"><p>Experienced a significantly greater depth and duration of flooding on 23rd December 2020 caused by intense rainfall combined with the highway drainage system not operating at full capacity, recent land drainage works in the upper catchment and lack of maintenance of downstream land drainage systems; flows that would otherwise go to ditches/River Evenlode were diverted towards Delly End. [PAG] (p18)</p></div><div class="nugget-popup"><p>Delly End was affected by runoff and released groundwater from upper catchments that increased volumes entering the drainage system, overwhelming drainage and contributing to flooding. Ditch works downstream (intended to divert water to the River Evenlode) can be overwhelmed, allowing water to divert into Delly End. Proposed/local measures (attenuation at the Triangle on Whitings Lane, upstream attenuation at Singe Wood and Solar Farm, and regular maintenance) are being progressed to reduce future flood risk to Delly End. (p19)</p></div><div class="nugget-popup"><p>Flows from upstream caused flooding risk/impact at Delly End; report recommends upstream flow management, nature&ndash;based solutions and attenuation to slow flows into Delly End. [TAB,PAG] (p25)</p></div><div class="nugget-popup"><p>Overland flows and insufficient highway/drainage capacity caused flooding into the village from Whitings Lane and upstream catchments; properties required property&ndash;level resilience measures and community recovery actions; recommendations include reinstatement of Delly Pool, upstream flow management, increased highway drainage cleansing and modelling of drainage systems. [PAG] (p26)</p></div><div class="nugget-popup"><p>Runoff and insufficient highway drainage capacity in Delly End led to surface water flooding that posed flood risk to properties; recommendations include assessing and improving highway drainage capacity and considering upstream flow management measures. [PAG] (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>At least 6 residential properties flooded internally on 23rd December 2020; 7 properties claimed Grant Aid in July 2007; 1 home affected by internal sewer flooding in July 2007. [IMG,PAG,MUL] (p10)</p></div></div></body></div>`)[0];
                popup_8bd28a0b460700d125817aae91fa8053.setContent(html_2be77f304943a586e09e9f45d7de2e6b);
