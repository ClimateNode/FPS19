                var html_0dd878999b9a639287dba31c51c115b5 = $(`<div id="html_0dd878999b9a639287dba31c51c115b5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>St Helens Metropolitan District</h1><div class="nugget-popup"><p>Residential streets and private properties within the borough (specifically Billinge) were inundated by surface water; public road surfaces were covered by floodwater reaching up to house entrances and garden areas, and private driveways/garages and vehicles were affected. (p1)</p></div><div class="nugget-popup"><p>A flooding incident occurred in Billinge (within the borough) that met the threshold for a formal Section 19 investigation. The incident is recorded as occurring on 8 December 2021 and prompted the council investigation. (p5)</p></div><div class="nugget-popup"><p>Maps and text show above&ndash;normal rainfall for December 2021 and notably high 12&ndash;month totals for the St Helens area. This Section 19 report concerns a flood event affecting St Helens on 8th December 2021; the borough was impacted by flooding during that event (investigated under this report). [IMG] (p6)</p></div><div class="nugget-popup"><p>Surface water flooding from ordinary (non&ndash;main) watercourses affected parts of the borough (notably Billinge) on 8th December 2021. St Helens Borough Council (the LLFA) provided sandbags and, where necessary, temporary accommodation to affected residents. The LLFA were not made aware of the flooding until after floodwaters had receded; the event occurred while staff and vehicle resources were already allocated to winter maintenance. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>The local authority (St Helens Borough Council) responded to the flooding by providing sandbags and offering temporary accommodation to affected residents; the LLFA were not made aware until after floodwaters had receded and the response took place during winter maintenance operations. (p10)</p></div></div></body></div>`)[0];
                popup_6a6a4c324300fe9aef4aec793c656e25.setContent(html_0dd878999b9a639287dba31c51c115b5);

                var html_b11bfe7a6f4395200b581b346dc49d1b = $(`<div id="html_b11bfe7a6f4395200b581b346dc49d1b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Brown Heath Avenue, Chadwick Green</h1><div class="nugget-popup"><p>Surface water flooding affected parts of the street during the event; EA surface water mapping indicates low&ndash;to&ndash;medium risk with highest risk to the area to the rear of properties and the eastern side of the street. The mapping indicates surface water can travel between properties. Local response provided sandbags and, where necessary, temporary accommodation to affected property residents. Flooding in this location related to ordinary watercourses rather than main river flooding. (p9)</p></div><div class="nugget-popup"><p>Properties on Brownheath Avenue were flooded both internally and externally during the event; local culverts to the rear of the street have been reported historically to overtop and allow floodwaters to reach property boundaries. [PAG] (p10)</p></div><div class="nugget-popup"><p>Floodwaters from overtopping watercourses entered the adopted highway on Brownheath Avenue; the highway drainage network could not drain the volume quickly enough, producing roadway depths of about 2&ndash;3 feet. Floodwater progressed southwards toward Powell Drive, damaging fences and enabling a wave into adjacent properties; culvert clearance by MFRS allowed drainage to recover. [PAG] (p13)</p></div><div class="nugget-popup"><p>Floodwaters flowed onto properties and into the adopted highway; highway drainage could not remove the volume of water causing roadway inundation. Floodwaters reached depths of between 2 to 3 feet in the roadway; fences between Brownheath Avenue and Powell Drive were knocked down by the flow, allowing a wave of water to move onto Powell Drive. Once culverts were cleared the overtopping ceased and drainage networks were able to drain the floodwater. [PAG] (p14)</p></div><div class="nugget-popup"><p>Properties on Brownheath Avenue were internally and externally flooded. (p15)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 properties affected internally and externally; 12 further properties affected externally. [PAG] (p10)</p></div><div class="nugget-popup quant"><p>water depth between 2 and 3 feet in the roadway [PAG] (p13)</p></div><div class="nugget-popup quant"><p>2 to 3 feet deep in the roadway [PAG] (p14)</p></div></div></body></div>`)[0];

                var html_a411bf77226ce8470abcbe8dac91f2b9 = $(`<div id="html_a411bf77226ce8470abcbe8dac91f2b9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Powell Drive, St Helens Metropolitan District</h1><div class="nugget-popup"><p>Surface water flooding affected parts of the street during the event; EA surface water mapping indicates low&ndash;to&ndash;medium risk with higher risk on the eastern side. The mapping indicates surface water can travel between properties. Local response provided sandbags and, where necessary, temporary accommodation to affected property residents. Flooding in this location related to ordinary watercourses rather than main river flooding. (p9)</p></div><div class="nugget-popup"><p>Properties on Powell Drive were flooded both internally and externally during the event. [IMG,PAG] (p10)</p></div><div class="nugget-popup"><p>Residential properties were flooded; four properties were flooded internally and externally, and one property was flooded externally. [PAG] (p11)</p></div><div class="nugget-popup"><p>A wave of floodwater moved from Brownheath Avenue into Powell Drive after fences between the two streets were knocked down. This wave caused internal flooding of properties on Powell Drive. Floodwater later drained back into the watercourse via the adopted highway drainage on Powell Drive once blocked culverts were cleared. [IMG,PAG] (p13)</p></div><div class="nugget-popup"><p>A wave of floodwater from Brownheath Avenue (after fences were knocked down) moved toward properties on Powell Drive, resulting in internal flooding of affected properties. Floodwater subsequently drained back into the watercourse once the adopted highway drainage and culverts were cleared. [PAG] (p14)</p></div><div class="nugget-popup"><p>Properties on Powell Drive were internally and externally flooded. (p15)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 properties affected internally and externally; 1 property affected externally. [IMG,PAG] (p10)</p></div><div class="nugget-popup quant"><p>4 properties; 1 property [PAG] (p11)</p></div></div></body></div>`)[0];

                var html_3ed9e95de905350886bbb8cfabe6d140 = $(`<div id="html_3ed9e95de905350886bbb8cfabe6d140" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Carr Mill Road, St Helens Metropolitan District</h1><div class="nugget-popup"><p>An ordinary watercourse running alongside Carr Mill Road had culvert inlet blockages (debris of vegetation, silt and litter) which caused flooding affecting residents; MFRS used pumps and cleared the culvert inlets, after which water levels receded and flow within the culvert returned to normal. (p12)</p></div></div></body></div>`)[0];

                var html_9ac4ff9104c1433ca5627ae0d7aec7a6 = $(`<div id="html_9ac4ff9104c1433ca5627ae0d7aec7a6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Billinge</h1><div class="nugget-popup"><p>Urban floodwater covered the full width of a residential street, reached up to house entrances and gardens, pooled in driveways up to garage doors, and partially submerged a parked car; emergency response activity is visible in images. (p1)</p></div><div class="nugget-popup"><p>A flooding incident occurred in Billinge on 8th December 2021 that met the Council's Section 19 investigation threshold; the event posed or could have posed a risk to human health and caused internal flooding to at least one property used for residential or commercial purposes. (p4)</p></div><div class="nugget-popup"><p>The EA surface water flood map for Billinge shows areas of low&ndash;to&ndash;high surface water flood risk concentrated in low&ndash;lying areas and along watercourses; residential streets (including Brownheath Avenue and Powell Drive) and some community assets lie near or within risk zones. Flooding reported in the event related to ordinary watercourses rather than main river flooding. The EA Reservoir Risk Map indicates the affected area of Billinge was not at risk from reservoir flooding. St Helens Borough Council provided sandbags and temporary accommodation to affected residents during the response. [IMG] (p9)</p></div><div class="nugget-popup"><p>Residential streets in Billinge experienced flooding that inundated properties both internally and externally; the event prompted local response actions and a catchment&ndash;wide EA flood alert was issued after the local flooding had occurred. [PAG] (p10)</p></div><div class="nugget-popup"><p>Overtopping of open watercourses north of Brownheath Avenue (caused by blocked culvert inlets containing silt, vegetation and fly&ndash;tipped material) led to floodwaters travelling south across a public right of way into the Brownheath Avenue adopted highway. Roadway depths reached 2&ndash;3 feet, fences between Brownheath Avenue and Powell Drive were knocked down creating a wave that caused internal flooding of properties on Powell Drive. Once MFRS cleared the culverts the watercourse stopped overtopping and highway drainage was able to clear floodwater. (p13)</p></div><div class="nugget-popup"><p>Flooding in the Billinge area associated with the event that caused properties to be internally and externally flooded on Brownheath Avenue and Powell Drive. (p15)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Brownheath Avenue &ndash; 4 properties affected internally and externally, and 12 further properties affected externally; Powell Drive &ndash; 4 properties affected internally and externally, and 1 property affected externally. [PAG] (p10)</p></div><div class="nugget-popup quant"><p>water depth between 2 and 3 feet in the roadway (p13)</p></div></div></body></div>`)[0];
