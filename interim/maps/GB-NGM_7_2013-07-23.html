                var html_939c5909984924d2ee93b7ed894b54b2 = $(`<div id="html_939c5909984924d2ee93b7ed894b54b2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Nottingham Unitary Authority</h1><div class="nugget-popup"><p>Nottingham is the broader administrative area containing Top Valley and the streets investigated; the report concerns a flood event in this area on 23 July 2013. (p1)</p></div><div class="nugget-popup"><p>An intense storm on the evening of 23 July 2013 caused widespread flooding across the city, resulting in residential properties being flooded. (p3)</p></div><div class="nugget-popup"><p>A number of properties in the area flooded; this prompted the City Council to carry out a formal Section 19 flood investigation and produce this report summarising causes and impacts. (p4)</p></div><div class="nugget-popup"><p>The report area within Nottingham experienced surface water flooding associated with the 23rd July 2013 event; the report treats this locality as affected by that event. (p9)</p></div><div class="nugget-popup"><p>An intense storm on 23rd July 2013 passed across the north of Nottingham City; the resulting surface&ndash;water flood event began during the storm, with rainfall exceeding sewer design standards and causing urban/surface&ndash;water flooding. Severn Trent Water classified the event as 'extreme'. (p10)</p></div><div class="nugget-popup"><p>Properties on Daron Gardens were affected by the 23rd July 2013 flooding. As a response gullies on Daron Gardens have been placed on a Targeted Gully Cleansing Regime for more frequent maintenance to improve removal of surface water. [TAB] (p21)</p></div><div class="nugget-popup"><p>A series of heavy rainfall events passed over the city on 22&ndash;23 July 2013 with a fourth event on 23rd July causing flooding that resulted in internal flooding of 11 residential properties in the Top Valley area and extensive external flooding. [PAG] (p23)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 100 residential properties (p3)</p></div><div class="nugget-popup quant"><p>11 residential properties (total across Daron Gardens and Edern Gardens) [PAG] (p23)</p></div></div></body></div>`)[0];

                var html_e84d6841d3c57aaa09d332185208341b = $(`<div id="html_e84d6841d3c57aaa09d332185208341b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Daron Gardens, Top Valley</h1><div class="nugget-popup"><p>Daron Gardens is highlighted in the report map and is the subject of a Section 19 flood investigation, indicating it was affected by flooding. The map highlights the street segment within a residential block in Top Valley. [IMG] (p1)</p></div><div class="nugget-popup"><p>Properties in Daron Gardens suffered internal flooding as part of the Top Valley event caused by the intense storm. (p3)</p></div><div class="nugget-popup"><p>Internal (over the doorstep) flooding of residential properties. (p5)</p></div><div class="nugget-popup"><p>Properties experienced internal flooding; local topography (head of a valley) and an approximately 500 m2 impervious parking area at the rear of properties contributed to overland runoff and ingress to homes. [PAG] (p7)</p></div><div class="nugget-popup"><p>Properties on Daron Gardens were affected by surface water flooding during the event on 23rd July 2013 (the report treats this area as having experienced the flood event on that date). [PAG] (p9)</p></div><div class="nugget-popup"><p>Properties on Daron Gardens were flooded during and after the intense rainfall on 23rd July 2013 from rapid overland sheet flow and ponding; sheet runoff from playing fields transported soil and debris into gully pots, bitmac footpaths channelled flows towards the street, highway drainage was overwhelmed, and a resident reported faeces and black sludge in floodwater indicating foul sewer network overload. [PAG] (p11)</p></div><div class="nugget-popup"><p>Overland surface&ndash;water flow from the playing fields and along footpaths entered Daron Gardens. Saturated ground prevented infiltration and sheet flow from the steep bank carried silt and debris into gullies. The gully network was overwhelmed and kerbs were breached; water pooled and entered properties via wall vents, airbricks and door frames, moving through houses and exiting via back doors/gardens. A resident reported faeces and black sludge in the flood water, indicating the foul sewer network was also overloaded and contributed to contamination of floodwater. [IMG,PAG] (p12)</p></div><div class="nugget-popup"><p>The local gully network was overwhelmed and the kerb was breached so water pooled at the lower&ndash;threshold properties and entered dwellings via wall vents, air bricks and door frames. Floodwater then exited properties via back doors and gardens and continued flowing downslope. A dividing brick wall at the north end likely caused additional pooling before properties were flooded. [IMG,PAG] (p13)</p></div><div class="nugget-popup"><p>Overland surface water pooled behind a dividing brick wall at the north end of Daron Gardens. Once a footpath gully became overwhelmed, water breached the kerb and pooled within the hollow of the houses until levels overtopped the grass verge at the south&ndash;east end, producing overland flow that entered properties. This caused internal flooding of houses; there is also evidence the foul sewer network was overwhelmed and contributed to the flooding, though this contribution is considered unlikely to be significant given the location near the head of the drainage catchment. [PAG] (p14)</p></div><div class="nugget-popup"><p>Overland (surface water) flow caused internal flooding of residential properties; foul sewer network was reported to have been overwhelmed and to have contributed to flooding though this contribution was considered unlikely to be significant given the location near the head of the drainage catchment. [IMG,PAG] (p15)</p></div><div class="nugget-popup"><p>Internal flooding occurred with damage to flooring, walls, kitchens and furniture; residents had to vacate properties while repair work was carried out. [TAB] (p17)</p></div><div class="nugget-popup"><p>Intense rainfall generated large volumes of surface water runoff that overwhelmed drainage systems, causing water to pond in low&ndash;lying areas and resulting in ingress of water to properties. (p18)</p></div><div class="nugget-popup"><p>Intense, flashy rainfall exceeded local drainage and sewer capacity causing surface water to pond and enter properties on Daron Gardens. Residents attempted to unblock footpath gullies but this was ineffective and properties were flooded; residents were unaware of the flood risk and had no preventative measures to deploy. [PAG] (p19)</p></div><div class="nugget-popup"><p>Surface water flooding affected the Daron Gardens area during the 23rd July 2013 event. The flooding prompted a Flood Defence Grant Aid funding bid (completed March 2014) and led to planned measures including an optioneering study, a topographic survey and a future surface water flood risk management scheme. Gullies on Daron Gardens have been placed on a targeted gully&ndash;cleansing regime for more frequent maintenance to reduce surface water runoff to the public sewer. [TAB,PAG] (p20)</p></div><div class="nugget-popup"><p>Surface&ndash;water flooding on 23rd July 2013 affected properties on the street and prompted placing gullies on a targeted gully&ndash;cleansing regime for more frequent maintenance; residents were given recommendations to improve property&ndash;level resilience and prepare flood plans. [TAB] (p21)</p></div><div class="nugget-popup"><p>Residential properties were flooded internally during the extreme rainfall event; properties lie in a low&ndash;lying part of the natural valley and experienced extensive external area flooding. (p23)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>11 properties (combined across Daron Gardens and Edern Gardens) (p3)</p></div><div class="nugget-popup quant"><p>7 properties (p5)</p></div><div class="nugget-popup quant"><p>7 properties; external flood levels reached 600mm; internal flood levels reached 50mm [PAG] (p14)</p></div><div class="nugget-popup quant"><p>7 properties; 600 mm external flood level; 50 mm internal flood level [IMG,PAG] (p15)</p></div><div class="nugget-popup quant"><p>7 properties (3 council&ndash;owned, 2 housing association, 2 private) [TAB] (p17)</p></div><div class="nugget-popup quant"><p>11 residential properties (total across Daron Gardens and Edern Gardens) (p23)</p></div></div></body></div>`)[0];

                var html_cb43bfe07297e9da5471fc82815f4dbc = $(`<div id="html_cb43bfe07297e9da5471fc82815f4dbc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Edern Gardens, Top Valley</h1><div class="nugget-popup"><p>Edern Gardens is highlighted in the report map and is the subject of a Section 19 flood investigation, indicating it was affected by flooding. The map highlights the street segment within a residential block in Top Valley. [IMG] (p1)</p></div><div class="nugget-popup"><p>Properties in Edern Gardens suffered internal flooding as part of the Top Valley event caused by the intense storm. (p3)</p></div><div class="nugget-popup"><p>Internal (over the doorstep) flooding of residential properties. (p5)</p></div><div class="nugget-popup"><p>Properties experienced internal flooding; Edern Gardens is located downslope at a low spot within the area, making it a receptor for runoff from upslope areas. [PAG] (p7)</p></div><div class="nugget-popup"><p>Properties were flooded during and after the intense rainfall on 23rd July 2013 due to rapid overland flow and ponding in low&ndash;lying areas; runoff from nearby streets (Penllech Close and Colmon Close) likely contributed to overland flow and pooling. (p11)</p></div><div class="nugget-popup"><p>Surface water converged and concentrated at Edern Garden during the 23rd July 2013 event as part of the primary flow path, with flows then exiting toward the playing fields. [IMG] (p12)</p></div><div class="nugget-popup"><p>Rapid surface water flow down the slope used footways and roads as conduits directing water towards properties on Edern Gardens; low&ndash;lying ground and a natural hollow plus potentially overwhelmed road gullies allowed pooling and kerb breach that contributed to flooding of properties on Edern Gardens. [PAG] (p15)</p></div><div class="nugget-popup"><p>Properties on Edern Gardens were flooded when pooled surface water breached the kerb and entered properties. Pooling occurred because gullies at a low spot on nearby Colmon Close were likely overwhelmed and the public surface water sewer may have been at capacity, and because surface water from saturated footpaths and green areas on Parkview Road flowed overland into this lower&ndash;lying location. [IMG,PAG] (p16)</p></div><div class="nugget-popup"><p>Overland flow led to internal flooding of properties with damage to flooring, kitchens, walls, doors, plaster and furniture. A low spot in the footpath allowed water to pool and exacerbate flooding. [TAB,PAG] (p17)</p></div><div class="nugget-popup"><p>Intense rainfall generated large volumes of surface water runoff that overwhelmed drainage systems, causing water to pond in low&ndash;lying areas and resulting in ingress of water to properties. (p18)</p></div><div class="nugget-popup"><p>Surface water from intense rainfall was unable to drain into the highway drainage/sewer system and flooded properties on Edern Gardens; adopted footpath gullies were difficult to access and residents had limited ability to prevent ingress. (p19)</p></div><div class="nugget-popup"><p>Surface water flooding affected the Edern Gardens area during the 23rd July 2013 event. The flooding prompted a Flood Defence Grant Aid funding bid (completed March 2014) and led to planned measures including an optioneering study, a topographic survey and a future surface water flood risk management scheme to be constructed once partnership funding is secured. [TAB] (p20)</p></div><div class="nugget-popup"><p>Properties on Edern Gardens were affected by the 23rd July 2013 flooding and are the subject of resident/landlord recommendations to improve resilience (prepare flood plans, consider property&ndash;level protection). (p21)</p></div><div class="nugget-popup"><p>Residential properties were flooded internally during the extreme rainfall event; properties lie in a low&ndash;lying part of the natural valley and experienced extensive external area flooding. (p23)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>11 properties (combined across Daron Gardens and Edern Gardens) (p3)</p></div><div class="nugget-popup quant"><p>4 properties (p5)</p></div><div class="nugget-popup quant"><p>4 properties (1 council&ndash;owned and 3 private) [TAB,PAG] (p17)</p></div><div class="nugget-popup quant"><p>11 residential properties (total across Daron Gardens and Edern Gardens) (p23)</p></div></div></body></div>`)[0];

                var html_a42987b78915024c8d1c490d29c94de4 = $(`<div id="html_a42987b78915024c8d1c490d29c94de4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Parkview Road, Top Valley</h1><div class="nugget-popup"><p>Overland flow travelled along the footpaths connecting Parkview Road to Daron Gardens during the event; saturated ground and sheet flow from adjacent slopes contributed to runoff that carried silt and debris into footpath gullies and towards Daron Gardens. [IMG] (p12)</p></div><div class="nugget-popup"><p>Surface water on footpaths and saturated green areas pooled at a low spot and contributed overland flow towards Edern Gardens, exacerbating flooding to the lower&ndash;elevation properties. (p17)</p></div></div></body></div>`)[0];

                var html_860203f2200fe884863bcf4c576615c2 = $(`<div id="html_860203f2200fe884863bcf4c576615c2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Colmon Close, Top Valley</h1><div class="nugget-popup"><p>Surface water flowed along the street as part of the primary flow path during the 23rd July 2013 flood event, forming part of the routed runoff through the residential area. [IMG] (p12)</p></div><div class="nugget-popup"><p>Road gullies at a low spot on the bend of Colmon Close collected surface water from uphill areas; during the storm these gullies may have been overwhelmed, causing local pooling at the low spot and contributing to kerb breach and downstream flooding of Edern Gardens. (p15)</p></div><div class="nugget-popup"><p>A low spot on Colmon Close with two road gullies collected surface water from Penllech Close and uphill on Colmon Close; during the storm the gullies were possibly overwhelmed (and the public surface water sewer potentially at capacity), allowing water to pool and breach the kerb &mdash; a contributor to flooding of properties on Edern Gardens. [IMG,PAG] (p16)</p></div></div></body></div>`)[0];
