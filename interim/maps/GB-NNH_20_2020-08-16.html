                var html_d59bdefc3cdab4401a99cbce70b6c863 = $(`<div id="html_d59bdefc3cdab4401a99cbce70b6c863" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Sheep Street, Wellingborough</h1><div class="nugget-popup"><p>Internal flooding affected properties on/around Sheep Street as part of the single flood incident at Sheep Street / Silver Street. (p5)</p></div><div class="nugget-popup"><p>Internal flooding of properties on Sheep Street as part of the single flood incident; water entered buildings (crossed thresholds) causing internal flooding. (p8)</p></div><div class="nugget-popup"><p>Surface&ndash;water runoff and rapid flows entered properties from the street (front and rear). Reported internal flooding included ground&ndash;floor ingress under front doors and basements/cellars filling; one cellar and ground&ndash;floor areas flooded requiring recovery and refurbishment of premises. [TAB,PAG] (p17)</p></div><div class="nugget-popup"><p>Rapid runoff and ponding on Sheep Street; water rushed down the street and collected at the low point around the junction with Doddington Road forming a lake. Water entered properties from the back door and via underground pipework from a neighbouring property, possibly through an air brick. Whole cellar flooded; shallow flooding in rear hall and ground floor entrance hall, rear annexe and basement. Occupant remained in property and later returned on 18 August 2020. Residents and businesses tried to stop vehicles from driving through the flooded street. (p18)</p></div><div class="nugget-popup"><p>Multiple properties on Sheep Street experienced internal flooding; one instance was minor and managed by diverting the flow. (p19)</p></div><div class="nugget-popup"><p>Flow from Silver Street continued southeast down Sheep Street, affecting properties on both sides. At the low point of Sheep Street, runoff from rear roofs and the rear garden flowed towards the rear doors of a residential property. The cellar flooded due to surcharging and overflow of a drainage system that receives water from neighbouring properties and external areas. (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than five buildings (p5)</p></div><div class="nugget-popup quant"><p>more than five buildings (p8)</p></div><div class="nugget-popup quant"><p>50mm across ground floor; 400mm depth in cellar; external depths 1200mm to 1800mm at one property [TAB,PAG] (p17)</p></div><div class="nugget-popup quant"><p>400mm depth in cellar; external depth between 1200mm and 1800mm (p18)</p></div><div class="nugget-popup quant"><p>5 properties (p19)</p></div></div></body></div>`)[0];

ugh other voids, causing internal flooding of rear areas and properties. [PAG] (p20)</p></div><div class="nugget-popup"><p>Floodwater flowed along Silver Street, leaving the road wet and displacing street infrastructure (temporary pedestrian barriers and sections of asphalt), disrupting pedestrian access and affecting shopfront frontage. [IMG,PAG] (p36)</p></div><div class="nugget-popup"><p>Temporary pedestrian barriers and sections of asphalt were moved/displaced by flood water on Silver Street. [IMG,PAG] (p37)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than five buildings (p5)</p></div><div class="nugget-popup quant"><p>more than five buildings (p8)</p></div><div class="nugget-popup quant"><p>10&ndash;20 mm depth; 25 mm depth; 200 mm depth throughout ground floor; lost electricity for approx. 24 hours [TAB] (p17)</p></div><div class="nugget-popup quant"><p>1 property (p19)</p></div></div></body></div>`)[0];

                var html_25eb84f889bce3558fea7dc248295315 = $(`<div id="html_25eb84f889bce3558fea7dc248295315" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wellingborough</h1><div class="nugget-popup"><p>A flood incident at Sheep Street / Silver Street in Wellingborough caused internal flooding of more than five buildings in close proximity. (p5)</p></div><div class="nugget-popup"><p>Town experienced a flood incident on 16 August 2020 that caused internal flooding of properties in the Sheep Street / Silver Street area. (p8)</p></div><div class="nugget-popup"><p>Overland surface water flows from exceeded drainage in the catchment contributed to flooding within the lower parts of the town (town centre area) during the incident. (p14)</p></div><div class="nugget-popup"><p>The town experienced a surface water flooding incident on 16th August 2020. The report records that highway drainage in the area relies on road gullies connecting to the public surface water sewer; gullies at Silver Street and Sheep Street were last cleansed in September 2019 and those at High Street in June 2017. The investigation notes two StreetDoctor reports of blocked drains on Cambridge Street in the streets surrounding the incident. (p15)</p></div><div class="nugget-popup"><p>The town centre area experienced intense surface water flows from northwest to southeast; drainage systems were exceeded, producing powerful flows along roads (notably Broad Green, Church Street and High Street) that caused destructive impacts to buildings and internal flooding of properties. In total, 19 properties in this area are understood to have flooded internally. (p19)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration rainfall on 16/08/2020 overwhelmed surface water drainage across the area. Deep, fast&ndash;moving surface water occupied the full width of roads and footways in affected parts of the town; properties and external areas were flooded and emergency crews pumped deep floodwater to safe areas. Town centre surfaces required clearing in follow&ndash;up operations and sandbags were delivered to some properties. (p21)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than five buildings (p5)</p></div><div class="nugget-popup quant"><p>more than five buildings (p8)</p></div><div class="nugget-popup quant"><p>19 properties (p19)</p></div></div></body></div>`)[0];
