                var html_bbb2be878ea616c714b189d277708ead = $(`<div id="html_bbb2be878ea616c714b189d277708ead" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>St Ives</h1><div class="nugget-popup"><p>Flooding began on 23 December 2020 due to intense rainfall and existing ground conditions; rapid runoff led to significant surface water flooding across the town, inundation of foul drainage and overwhelming of Anglian Water pumping stations. As a result foul water backed up into properties and there was a loss of toilet facilities. (p7)</p></div><div class="nugget-popup"><p>96 flood reports were received by the LLFA for December 2020. Flooding duration was reported between 5 hours and 2 days. 32 properties reported internal flooding. 64 further properties reported external flooding of gardens, outbuildings and roads. 15 commercial premises reported internal flooding (in listed St Ives locations). (p10)</p></div><div class="nugget-popup"><p>Flooding across the town led to internal flooding of residential properties and commercial premises, and external flooding of gardens, outbuildings and roads. Commercial premises internally flooded were reported on Harrison Way, Bramley Road, Harding Way, Edison Road, Needingworth Road and Parson's Drove. [PAG,IMG] (p11)</p></div><div class="nugget-popup"><p>Multiple reports of internal residential property flooding within St Ives (for example at Wheatfields), indicating the town experienced property flooding. (p12)</p></div><div class="nugget-popup"><p>External flooding affected roads, gardens and fields in the town; streets and public areas experienced inundation during the event. [TAB] (p14)</p></div><div class="nugget-popup"><p>Intense antecedent and extreme rainfall caused watercourses throughout St Ives to exceed channel capacity, producing significant surface water (fluvial&ndash;related) flooding across the town. Anglian Water assets were overwhelmed by watercourse flooding, which led to foul water systems backing up. (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>96 flood reports; 32 properties; 64 properties; 15 commercial premises (p10)</p></div><div class="nugget-popup quant"><p>96 flood reports; 32 properties internally flooded; 64 properties externally flooded; 15 commercial premises internally flooded [PAG,IMG] (p11)</p></div></div></body></div>`)[0];
