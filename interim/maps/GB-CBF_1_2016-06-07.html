                var html_fd23344d86112fb9fdf79470335b4821 = $(`<div id="html_fd23344d86112fb9fdf79470335b4821" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cranfield University</h1><div class="nugget-popup"><p>Identified as one of three concentrated flood&ndash;report areas; internal flooding within the university campus was reported. (p8)</p></div><div class="nugget-popup"><p>Flooding was reported on the Cranfield University campus, with inundation along University Way and College Road and a number of campus buildings affected. (p16)</p></div><div class="nugget-popup"><p>Flooding occurred on the campus during the intense rainfall on 7 June 2016; local drainage and surface water runoff overwhelmed drainage capacity leading to flooding of the university area. (p26)</p></div><div class="nugget-popup"><p>Surface&ndash;water runoff from the university campus and airport grounds increased flows to the receiving system; drainage and riparian assets within the campus/airport were identified as needing improvement to reduce runoff and future flooding risk. [TAB] (p39)</p></div><div class="nugget-popup"><p>Overland surface water flow from the airfield and campus drainage influenced local surface water sewer outfall. Culverted sections within the airfield/campus were identified for condition assessment and maintenance to ensure unrestricted flow and to reduce flood risk to the university grounds and the local area. [TAB] (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 80 properties affected across Cranfield and on the Cranfield University campus; 59 internal flooding; 49 residential (p16)</p></div></div></body></div>`)[0];

                var html_f80397c1d0ae0ca5ea023441d37cb891 = $(`<div id="html_f80397c1d0ae0ca5ea023441d37cb891" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Pix Brook</h1><div class="nugget-popup"><p>The Pix Brook flows through Stotfold and is implicated in local flooding that affected properties in the village (notably on Coppice Mead and Brook Street). (p10)</p></div><div class="nugget-popup"><p>Culverts along the immediate area of Pix Brook were inspected and cleared of obstructions as part of the response to local flooding; culvert condition was a focus for reducing local flood impacts around Stotfold/Coppice Mead. (p13)</p></div><div class="nugget-popup"><p>The Pix Brook flowed out of bank and caused flooding in Stotfold on 12 June 2016, leading to inundation of Brook Street and Coppice Mead. [PAG] (p20)</p></div><div class="nugget-popup"><p>Out&ndash;of&ndash;bank flows from Pix Brook caused flooding in Stotfold (notably Brook Street and Coppice Mead) on 12 June 2016. Debris was conveyed along the brook and in the 4 July 2015 event overwhelmed and blocked the trash screen at Brook Street causing rapid upstream water level rise and local flooding. Debris was also photographed at the face of the box culvert at Hitchin Road after the June 2016 event. [PAG,IMG,MUL] (p21)</p></div><div class="nugget-popup"><p>Pix Brook overflowed during the June 2016 event causing bank erosion downstream of the confluence of the old and new channels; channel alterations (new channel with the old channel used as an overflow) have been made; evidence of erosion protection was observed and a number of properties constructed brick walls along the left bank in response to bank erosion/flooding. The IDB undertook hydraulic and blockage modelling of the Pix Brook and found that areas affected in 2016 are not well represented on the Environment Agency Flood Map for Planning. [PAG] (p22)</p></div><div class="nugget-popup"><p>Pix Brook overtopped/blocked channel flows during the June 2016 event, with debris partially blocking a box culvert at Hitchin Road and water reaching the level of air bricks on new properties. Brick walls were observed along the brook bank (photographed 2016) and floodwaters reached ground&ndash;floor ventilation openings, evidencing property inundation risk. (p23)</p></div><div class="nugget-popup"><p>The Pix Brook experienced out&ndash;of&ndash;bank flows during the event, causing flooding in Stotfold. (p25)</p></div><div class="nugget-popup"><p>The channel capacity was exceeded and water flowed out of the Pix Brook at susceptible locations; raised water levels were exacerbated by debris and culvert restrictions causing out&ndash;of&ndash;bank flows. (p27)</p></div><div class="nugget-popup"><p>Culverts on Pix Brook were inspected and debris removed by IDB officers to address local flooding and reduce obstruction to flow. [TAB] (p30)</p></div><div class="nugget-popup"><p>Flooding along the Pix Brook caused flood risk within Stotfold; the brook's behaviour and catchment response are identified as key drivers of local flooding and the report recommends a catchment&ndash;wide study (including upstream Hertfordshire) and assessment of the Standalone Farm Flood Storage Reservoir operating instructions to understand and mitigate future floods. [TAB] (p44)</p></div><div class="nugget-popup"><p>Pix Brook overtopped/caused flooding that affected Stotfold and its infrastructure, contributing to debris and blockages on downstream channels and highway assets; prompted recommendations for a catchment&ndash;wide study, modelling review and changes to asset management. [TAB,PAG] (p45)</p></div><div class="nugget-popup"><p>Pix Brook carried a significant debris load (including watercress and woody debris) from adjacent conservation woodland; debris accumulation and movement during flood flows contributed to blockages and increased flood risk in Stotfold and along the Pix Brook corridor. [TAB,PAG] (p46)</p></div><div class="nugget-popup"><p>The brook has a significant debris load that contributes to blockages and increases local flood risk; debris and blockages at structures (culverts/trash screens) were identified as a cause of flooding risk and must be allowed for in screen design and maintenance. [TAB,PAG] (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>11 properties; 6 properties [PAG] (p20)</p></div><div class="nugget-popup quant"><p>11 properties; 6 properties (internal flooding) [PAG,IMG,MUL] (p21)</p></div></div></body></div>`)[0];

                var html_90904b13b351e2771a29665c8ba84393 = $(`<div id="html_90904b13b351e2771a29665c8ba84393" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bedford Road, Aspley Guise</h1><div class="nugget-popup"><p>Surface water flooding inundated Bedford Road, affecting the highway and adjacent low&ndash;lying areas and disrupting transport along this route. [IMG] (p7)</p></div><div class="nugget-popup"><p>These lower&ndash;lying areas received surface water flows routed from Church Street, Woburn Lane and West Hill during the 07 Jun 2016 &ndash; 12 Jun 2016 event. The configuration of highway levels and low property thresholds contributed to floodwater entering properties in this area. [PAG] (p15)</p></div><div class="nugget-popup"><p>A resident on Bedford Road in Aspley submitted correspondence regarding the flood event, indicating that the area was affected by the flood. (p16)</p></div><div class="nugget-popup"><p>Heavy localized rainfall produced surface water runoff along West Hill and Bedford Road which overwhelmed highway drainage. Surface water and surcharged public foul sewers flowed onto the carriageway (kerb overtopping), flooded pavements and entered properties causing both external and internal flooding; many properties lacked raised thresholds so had no protection from internal flooding. (p25)</p></div><div class="nugget-popup"><p>Flooding affected the area through which a culvert runs (Bedford Road and Aspley House), leading to a recommendation to coordinate an investigation of that culvert and to promote property resilience measures. [TAB] (p37)</p></div><div class="nugget-popup"><p>Surface water overwhelmed highway drainage leading to water retention in the road and risk to adjacent properties; recommendation to increase kerb heights and provide downstream drainage improvements and SuDS integration. [TAB] (p38)</p></div></div></body></div>`)[0];
                popup_b23e9a8ef33a6b47470a41f159967ec3.setContent(html_90904b13b351e2771a29665c8ba84393);

                var html_7ccb44730f7ac160024fcd17a831f551 = $(`<div id="html_7ccb44730f7ac160024fcd17a831f551" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>The Square, Aspley Guise</h1><div class="nugget-popup"><p>Surface water flooding affected The Square area, inundating the roadway and adjacent low&ndash;lying spaces. (p7)</p></div><div class="nugget-popup"><p>These lower&ndash;lying areas received surface water flows routed from Church Street, Woburn Lane and West Hill during the 07 Jun 2016 &ndash; 12 Jun 2016 event. The configuration of highway levels and low property thresholds contributed to floodwater entering properties in this area. [PAG] (p15)</p></div><div class="nugget-popup"><p>Properties and the local highway drainage in The Square were affected by flooding, leading to suggestions for Property Resilience Measures and investigation/maintenance of drainage. [TAB] (p37)</p></div><div class="nugget-popup"><p>Highway drainage overwhelmed during the event, with surface water being retained within the road; recommended raising kerb heights to provide protection to properties and downstream works to collect and discharge retained water. [TAB,PAG] (p38)</p></div></div></body></div>`)[0];

                var html_3e52f57c826f499423b2179944a4baa2 = $(`<div id="html_3e52f57c826f499423b2179944a4baa2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>West Hill, Aspley Guise</h1><div class="nugget-popup"><p>Surface water flooding occurred on West Hill, flooding the highway and nearby low&ndash;lying areas and impacting local transport. [IMG] (p7)</p></div><div class="nugget-popup"><p>Local topography caused surface water to flow along Woburn Lane and West Hill toward the lower&ndash;lying Bedford Road and The Square during the 07 Jun 2016 &ndash; 12 Jun 2016 event; road levels and dropped kerbs allowed runoff to access properties. (p15)</p></div><div class="nugget-popup"><p>Heavy localized rainfall produced surface water runoff along West Hill and Bedford Road which overwhelmed highway drainage. Surface water and surcharged public foul sewers flowed onto the carriageway (kerb overtopping), flooded pavements and entered properties causing both external and internal flooding; many properties lacked raised thresholds so had no protection from internal flooding. (p25)</p></div><div class="nugget-popup"><p>Flooding in West Hill was associated with a culvert and highway drainage issues; this prompted recommendations to investigate the culvert and to promote property resilience measures for residents. [TAB] (p37)</p></div><div class="nugget-popup"><p>Surface water overwhelmed highway drainage leading to water retention in the road and risk to adjacent properties; recommendation to increase kerb heights and provide downstream drainage improvements and SuDS integration. [TAB] (p38)</p></div></div></body></div>`)[0];

                var html_d3e6736a475f2ce01cf4ba90cd7f2d75 = $(`<div id="html_d3e6736a475f2ce01cf4ba90cd7f2d75" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>High Street, Cranfield</h1><div class="nugget-popup"><p>Area identified as one of three concentrated flood&ndash;report areas; the majority of internal (property) flooding reported in the village occurred along High Street and Merchant Lane. (p8)</p></div><div class="nugget-popup"><p>Majority of internal flooding was reported along High Street; some properties reported basement flooding with water depths in excess of 1 m. [IMG] (p9)</p></div><div class="nugget-popup"><p>High Street in Cranfield was affected by flooding and was cleansed by the CBC Waste Team as part of the post&ndash;flood response. (p11)</p></div><div class="nugget-popup"><p>A single property on the High Street experienced internal flooding following the event in Cranfield. (p12)</p></div><div class="nugget-popup"><p>Surface water exceeded the carriageway at low points and flowed onto properties which are lower than the road level; residents reported flooding of properties on the High Street. CBC cleared gullies along the High Street on 11 Jun to restore drainage; one gully at the junction with Merchant Lane was found defective. [PAG] (p17)</p></div><div class="nugget-popup"><p>Gullies along the High Street were emptied and connections rodded on 11 Jun; a gully at the junction of High Street and Merchant Lane was recorded as defective (likely broken connection); some gully connections were obstructed with debris/construction material. Speed tables at the Merchant Lane junction may have blocked surface water flow during rainfall causing accumulation and flooding of lower sections of the carriageway. Properties on the High Street are lower than the carriageway and standing water was reported to have been driven through by vehicles, potentially causing water to exceed the carriageway and affect low points and properties. [PAG] (p18)</p></div><div class="nugget-popup"><p>Properties on the High Street had thresholds lower than the carriageway and surrounding land; standing water on the road overtopped the carriageway at low points (residents reported cars driving through standing water contributing to this). Increased traffic through the village (due to other routes being closed/impassable) was reported at the time. CBC Highways had previously attempted to provide protection to properties. [PAG] (p19)</p></div><div class="nugget-popup"><p>During the 7 June 2016 event highway drains in the High Street lacked capacity, causing surface water ponding that exceeded the carriageway at susceptible points; speed tables increased local ponding and traffic may have driven water off the highway. (p26)</p></div><div class="nugget-popup"><p>Highway drainage defects (including issues associated with service ducting) were identified and recommended for investigation and maintenance to address highway flooding and surface water entering the drainage system. [TAB] (p39)</p></div><div class="nugget-popup"><p>Surface water ponding and flooding of the highway with a risk to adjacent property thresholds; known drainage defects (including issues associated with service ducting) identified prompting recommendations for kerb height increases, gully cleaning and highway drainage maintenance to protect properties. [TAB,PAG] (p40)</p></div><div class="nugget-popup"><p>Recommendations target improvements to the surface water network and receiving systems particularly along Merchant Lane and High Street, indicating these streets experienced surface water flooding/drainage problems during the event. [TAB] (p41)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property (p12)</p></div></div></body></div>`)[0];

 investigation and maintenance to reduce the risk of surface water flooding. [TAB] (p39)</p></div><div class="nugget-popup"><p>Surface water flooding/overland flow affected the ditch along Merchant Lane; the ditch and surface water sewer outfall were identified as needing maintenance so overland flow from the airfield can be collected and to reduce surface water ponding on the highway. [TAB,PAG] (p40)</p></div><div class="nugget-popup"><p>The surface water sewer outfall at Merchant Lane required inspection/maintenance to ensure a free discharge; a small ditch discharge pipe impacted sewer operation, contributing to drainage failure and localised surface water flooding risk along Merchant Lane. [TAB,PAG] (p41)</p></div></div></body></div>`)[0];

                var html_92d17fe75d77e4b09468d5f31e981341 = $(`<div id="html_92d17fe75d77e4b09468d5f31e981341" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Brook Street, Stotfold</h1><div class="nugget-popup"><p>Residential properties on Brook Street were flooded during the event; the report identifies Brook Street as one of the main locations of affected properties in Stotfold. [IMG] (p10)</p></div><div class="nugget-popup"><p>Flooding on 12 June 2016 affected Brook Street (part of the Brook Street and Coppice Mead area). The Brook Street culverts and trash screen have been implicated in past and recent flood incidents and debris was associated with culvert blockage issues. [PAG] (p20)</p></div><div class="nugget-popup"><p>Flooding occurred at Brook Street on 12 June 2016 due to out&ndash;of&ndash;bank flows from the Pix Brook. On 4 July 2015 debris conveyed along Pix Brook overwhelmed and blocked the trash screen on the upstream side of Brook Street, causing rapid upstream water level rise and local flooding; the trash screen was removed by the IDB under Police instruction. [PAG,MUL] (p21)</p></div><div class="nugget-popup"><p>The redevelopment off Brook Street was observed to have suffered flooding in the 2016 event, with water&ndash;marks evident up to the air bricks. The area was largely unoccupied at the time but showed clear flood impact; the supporting Flood Risk Assessment did not consider culvert blockage and the observed flood levels indicate the event magnitude approached the design allowances used. [PAG] (p22)</p></div><div class="nugget-popup"><p>In the June 2016 flood event floodwater reached the level of airbricks on new properties and left visible water marks on external brick walls. The development&#8217;s Flood Risk Assessment did not consider potential culvert blockage, indicating a risk that floor&ndash;level mitigation advice may have been insufficient for the observed event. (p23)</p></div><div class="nugget-popup"><p>The culvert at Brook Street presented a restriction to Pix Brook flow, likely causing localised flooding when downstream levels were already raised; channel geometry immediately up&ndash; and downstream (including sharp changes of direction) increased the potential for silt/debris deposition and out&ndash;of&ndash;bank flows. (p27)</p></div><div class="nugget-popup"><p>The culvert at Brook Street and Hitchin Road was implicated in local flood risk; alterations to the culvert were recommended to be evaluated because of effects on downstream water levels and associated flood risk, and to reduce potential blockage and highway flooding. [TAB] (p45)</p></div><div class="nugget-popup"><p>A back channel running parallel to the gardens of Brook Street accumulated debris which could enter the Pix Brook during flood flows, increasing flood risk to gardens and properties adjacent to that back channel. [TAB] (p46)</p></div><div class="nugget-popup"><p>Culverts at Brook Street and Hitchin Road had compromised performance during flood conditions, contributing to road flooding; actions recommended include review of Risk Assessment and Method Statement for culvert maintenance during floods and advising the highway authority of asset performance issues. [TAB] (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>11 properties affected; 6 properties internally (Brook Street and Coppice Mead) (p20)</p></div><div class="nugget-popup quant"><p>11 properties; 6 properties (internal flooding) [PAG,MUL] (p21)</p></div></div></body></div>`)[0];

ues. [TAB] (p47)</p></div></div></body></div>`)[0];

 class="nugget-popup"><p>Areas within Central Bedfordshire experienced flooding on 7 and 12 June 2016, prompting a Section 19 investigation and publication of strategic and local recommendations to improve recording, communication and community resilience. (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>137 properties; 94 properties flooded internally; 58 residential properties flooded internally [IMG] (p6)</p></div><div class="nugget-popup quant"><p>in excess of 1 m (basement water depth) [IMG] (p9)</p></div></div></body></div>`)[0];

                var html_34d6e7f649d9f61e0e66dba33323e272 = $(`<div id="html_34d6e7f649d9f61e0e66dba33323e272" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Aspley Guise</h1><div class="nugget-popup"><p>Properties in Aspley Guise were affected by the June 2016 flood event. [IMG,TAB] (p6)</p></div><div class="nugget-popup"><p>Surface water flooding occurred in Aspley Guise, concentrated along watercourses and low&ndash;lying areas; key roads were flooded (Bedford Road, The Square and West Hill), impacting local transport and adjacent areas. [IMG] (p7)</p></div><div class="nugget-popup"><p>Experienced flood incidents on the night of 7 June that required police and fire attendance; two vehicles were reported stranded and road debris was later identified and swept. (p11)</p></div><div class="nugget-popup"><p>Residents reported flooding in the area; CBC received correspondence (14 June) from a resident regarding the flood event in Aspley. (p16)</p></div><div class="nugget-popup"><p>Localised intense rainfall produced surface water flooding across these settlements. Surface water was the primary source of flooding during the event, with highway drainage and drainage networks overwhelmed leading to overland flows, surcharge of drainage systems and flooding of highways and properties (internal and external). (p25)</p></div><div class="nugget-popup"><p>Area experienced flooding during the incident, with surface water inundation affecting local roads, land and posing risk to properties and drainage systems; the report recommends considering flood risk in future planning and reviewing assets for this area. (p35)</p></div><div class="nugget-popup"><p>Flooding affected the area through which a culvert runs (Bedford Road and Aspley House), leading to a recommendation to coordinate an investigation of that culvert and to promote property resilience measures. [TAB] (p37)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>16 properties [IMG,TAB] (p6)</p></div><div class="nugget-popup quant"><p>16 properties; 9 residential properties [PAG] (p15)</p></div></div></body></div>`)[0];

                var html_c411271941d9f8d3a75c925b524427bd = $(`<div id="html_c411271941d9f8d3a75c925b524427bd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cranfield</h1><div class="nugget-popup"><p>Cranfield experienced property flooding during the June 2016 event. [IMG,TAB] (p6)</p></div><div class="nugget-popup"><p>Three concentrated areas of flooding were reported within Cranfield (High Street / Merchant Lane area; Cranfield University Campus; Crawley Road). The majority of recorded internal (property) flooding within the village occurred on High Street, Merchant Lane, Maltings Close and within the University campus. [IMG] (p8)</p></div><div class="nugget-popup"><p>Cranfield was affected by flooding on the night of 7th June; CBC visited affected properties and offered assistance, requested urgent cleaning of all gullies, and CBC Waste Team was deployed to cleanse streets and surrounding affected areas. (p11)</p></div><div class="nugget-popup"><p>Flooding reported on 12 June with one property on the High Street experiencing internal flooding; residents were spoken to and did not require assistance; urgent gully cleaning in Cranfield was requested and understood to have been undertaken on 16 June. (p12)</p></div><div class="nugget-popup"><p>Flooding affected Cranfield and the Cranfield University campus: floodwater occurred along University Way and College Road; occupiers reported waters entering properties from front and rear at Maltings Close; a vegetated ditch and connections from surface water/sewers were identified as drainage issues; CBC Highways cleared a main run on University Way after the event and the university is investigating future risk&ndash;reduction measures. (p16)</p></div><div class="nugget-popup"><p>Approximately 80 properties across Cranfield and the Cranfield University campus were recorded as affected by flooding; around 59 properties suffered internal flooding (49 of which were residential). Flooding was reported on the campus along University Way and College Road; CBC Highways subsequently undertook main run clearance on University Way. [PAG] (p17)</p></div><div class="nugget-popup"><p>Localised intense rainfall produced surface water flooding across these settlements. Surface water was the primary source of flooding during the event, with highway drainage and drainage networks overwhelmed leading to overland flows, surcharge of drainage systems and flooding of highways and properties (internal and external). (p25)</p></div><div class="nugget-popup"><p>Severe surface&ndash;water flooding on 7 June 2016: the intense rainfall overwhelmed local drainage causing ponding, carriageway exceedance and localised flooding across the village; highway drainage capacity was exceeded in multiple locations, exacerbating impacts at specific streets. (p26)</p></div><div class="nugget-popup"><p>These areas were affected by the flood incident, with surface water inundation causing localised flooding impacts to streets, drainage systems and properties; the report advises using its findings for planning decisions and reviewing flood assets. (p35)</p></div><div class="nugget-popup"><p>Foul (sewer) flooding and surface&ndash;water runoff affected the village; blocked, altered or lost ditches (notably south of Crawley Road) and drainage defects contributed to increased runoff and flooding of local drainage systems. [TAB,PAG] (p39)</p></div><div class="nugget-popup"><p>Surface water and overland flow issues (notably from the airfield) and restricted/culverted ditches leading to poor outfalls increased local flood risk; recommendations include maintenance of the ditch along Merchant Lane, identification and repair of culverted sections within the airfield and campus, and improvements to ordinary watercourses to restore unrestricted flow. [TAB,PAG] (p40)</p></div><div class="nugget-popup"><p>Overland surface water flow from the airfield and restricted drainage within the campus/airfield affected local land drainage; culverted sections and the ditch along Merchant Lane were identified as needing inspection and maintenance to ensure unrestricted flow and a clear outfall for the surface water sewer. [TAB,PAG] (p41)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>80 properties [IMG,TAB] (p6)</p></div><div class="nugget-popup quant"><p>25 residential properties; 19 commercial properties (p11)</p></div><div class="nugget-popup quant"><p>1 property (p12)</p></div><div class="nugget-popup quant"><p>approximately 80 properties affected; 59 properties suffered internal flooding; 49 of these were residential (p16)</p></div><div class="nugget-popup quant"><p>approximately 80 properties affected; 59 properties suffered internal flooding; 49 of these were residential [PAG] (p17)</p></div></div></body></div>`)[0];

                var html_a9d647d415c3e1bbbe10753e5f91bd85 = $(`<div id="html_a9d647d415c3e1bbbe10753e5f91bd85" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Stotfold</h1><div class="nugget-popup"><p>Properties in Stotfold were directly affected by flooding during the Central Bedfordshire event. [IMG,TAB] (p6)</p></div><div class="nugget-popup"><p>Residential properties in the village were flooded during the event; the majority of affected properties were situated on Coppice Mead and Brook Street. [IMG] (p10)</p></div><div class="nugget-popup"><p>Experienced flooding that prompted multi&ndash;agency response: potential impacts around Coppice Mead; culvert inspections and clearance (including Hitchin Road); deployment of investigatory officers/volunteers; aquasacs/sandbags made available for residents; clean&ndash;up operations instructed to waste contractor; stand down issued after no further actions. (p13)</p></div><div class="nugget-popup"><p>Flooding occurred on 12 June 2016 when Pix Brook overtopped, affecting streets within Stotfold (notably Brook Street and Coppice Mead) and residential properties. (p20)</p></div><div class="nugget-popup"><p>Area around Brook Street suffered fluvial flooding during the June 2016 event with watermarks observed up to air bricks on buildings; the area was highlighted by the Internal Drainage Board in a 2015 post&ndash;flood report and was one of the areas actually affected in the 2016 flood although subsequent publicly available flood mapping did not show these areas as at risk. (p22)</p></div><div class="nugget-popup"><p>Flooding in Stotfold during the event was related to out&ndash;of&ndash;bank flows from the Pix Brook. [PAG] (p25)</p></div><div class="nugget-popup"><p>Rural areas between Stotfold and Letchworth allowed debris and vegetation to enter Pix Brook; debris was found after the event and contributed to culvert blockage and raised upstream water levels, culminating in the brook exceeding capacity and out&ndash;of&ndash;channel flows at susceptible locations. (p27)</p></div><div class="nugget-popup"><p>These areas were affected by the flood incident, with surface water inundation causing localised flooding impacts to streets, drainage systems and properties; the report advises using its findings for planning decisions and reviewing flood assets. (p35)</p></div><div class="nugget-popup"><p>Flooding affected Stotfold from the Pix Brook and overloaded local sewer/receiving systems, with impacts concentrated around High Street South and Church Street; the event prompted recommendations for an Emergency Action Plan, better communication with riparian owners and a catchment&ndash;wide study to understand flood mechanisms and identify solutions. [TAB,PAG] (p44)</p></div><div class="nugget-popup"><p>Stotfold experienced flooding driven by the Pix Brook, leading to infrastructure impacts and triggering recommendations for a catchment&ndash;wide study, asset inspections, planning consultation and review of flood mapping and modelling. [TAB,PAG] (p45)</p></div><div class="nugget-popup"><p>Flooding associated with Pix Brook affected the town, prompting recommended measures including catchment&ndash;wide studies, community resilience actions, an Emergency Action Plan, and liaison between agencies to reduce future flood risk. [TAB,PAG] (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>11 properties affected [IMG,TAB] (p6)</p></div><div class="nugget-popup quant"><p>11 properties; 6 properties (p20)</p></div></div></body></div>`)[0];

                var html_01b852fe1c0e0c1c7ea9e63de2157802 = $(`<div id="html_01b852fe1c0e0c1c7ea9e63de2157802" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Dunstable</h1><div class="nugget-popup"><p>Properties in Dunstable were directly affected by flooding during the Central Bedfordshire event. [IMG,TAB] (p6)</p></div><div class="nugget-popup"><p>Internal flooding across the town, with the majority of internal flooding reported along High Street and Westfield Road; some properties experienced water depths in excess of 1 m within basements. The A505 experienced flooding under the busway. [IMG] (p9)</p></div><div class="nugget-popup"><p>Experienced flood incidents on the night of 7 June that required police and fire attendance; two vehicles were reported stranded and road debris was later identified and swept. (p11)</p></div><div class="nugget-popup"><p>Heavy rainfall on 7 June caused flooding in Dunstable leading to closure of the A505 Church Street, internal flooding of commercial businesses on the A5 High Street South, road damage around sewer manholes, removal of abandoned vehicles and multi&ndash;agency emergency response. (p12)</p></div><div class="nugget-popup"><p>Thirty properties in Dunstable were recorded as affected by flooding during the event; twenty of these suffered internal flooding (ten residential and ten commercial). Surface water flow paths ran north along High Street South through commercial properties, across Church Street and toward the Leisure Centre; low thresholds and basement entrances allowed ingress to properties (one property had a front flood gate but still experienced basement flooding). (p18)</p></div><div class="nugget-popup"><p>Surface water flooding followed a flow path along High Street South through commercial properties, across Church Street and north toward the Leisure Centre, entering lower&ndash;lying properties. Surface water entered the public foul sewer causing overloading and resultant foul flooding beneath the busway. Property thresholds (including basement entrances) allowed ingress; one property with a fitted flood gate still experienced basement flooding, indicating other routes of ingress. [PAG] (p19)</p></div><div class="nugget-popup"><p>Localised intense rainfall produced surface water flooding across these settlements. Surface water was the primary source of flooding during the event, with highway drainage and drainage networks overwhelmed leading to overland flows, surcharge of drainage systems and flooding of highways and properties (internal and external). (p25)</p></div><div class="nugget-popup"><p>The 7 June 2016 rainfall produced predominantly surface water flooding across Dunstable. Topography channelled flows along High Street South into properties, highway drains were overwhelmed, vehicles worsened impacts by creating bow waves, and surface water entered and overloaded the foul public sewer causing foul flooding (notably under the busway). (p26)</p></div><div class="nugget-popup"><p>These areas were affected by the flood incident, with surface water inundation causing localised flooding impacts to streets, drainage systems and properties; the report advises using its findings for planning decisions and reviewing flood assets. (p35)</p></div><div class="nugget-popup"><p>Surface water / urban flooding affected parts of Dunstable during the event, overwhelming local drainage and prompting actions such as investigation of a pump station adjacent to the bus way, proposals for a Flood Response Plan for Church Street and maintenance of highway drainage on Church Street and Luton Road. [TAB,PAG] (p42)</p></div><div class="nugget-popup"><p>Surface water and sewer&ndash;related flooding affected the town during the event, overwhelming highway drainage and sewer capacity in central streets (notably Church Street and High Street South), causing roads to become impassable and creating risk to commercial properties. [TAB] (p43)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>30 properties affected [IMG,TAB] (p6)</p></div><div class="nugget-popup quant"><p>in excess of 1 m (basement water depth) [IMG] (p9)</p></div><div class="nugget-popup quant"><p>30 properties; 20 properties; 10 residential; 10 commercial (p18)</p></div><div class="nugget-popup quant"><p>30 properties; 20 properties internally flooded; 10 residential; 10 commercial [PAG] (p19)</p></div></div></body></div>`)[0];
