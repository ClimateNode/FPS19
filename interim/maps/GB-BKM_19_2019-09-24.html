                var html_6bcb73bdab4694286fa9537d3f9d18d2 = $(`<div id="html_6bcb73bdab4694286fa9537d3f9d18d2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>High Street, Chalfont St Peter</h1><div class="nugget-popup"><p>Internal flooding of business premises and carriageway closure: five business properties on High Street experienced internal flooding; the road was closed by the local highway authority for the duration of the event. [PAG] (p1)</p></div><div class="nugget-popup"><p>Road experienced surface water/urban flooding that caused the carriageway to flood and be closed by the local Highway Authority for the duration of the event. The location was the only road affected due to a natural low point in the carriageway profile. (p2)</p></div><div class="nugget-popup"><p>A foul manhole in the middle of the carriageway surcharged and discharged a large amount of water onto the highway, overwhelming highway drainage, causing ponding in the road and rising water levels that encroached into and flooded shops along the High Street. [PAG] (p4)</p></div><div class="nugget-popup"><p>Heavy rainfall and surface water runoff entered the highway drainage and foul sewer system, overwhelming the foul sewer. Sewage discharged from a manhole in the middle of the carriageway and flowed into the highway drainage, causing backup, ponding of water in the road and rising water levels that encroached into shops along the High Street. [PAG] (p5)</p></div><div class="nugget-popup"><p>Foul sewer became overwhelmed during heavy rainfall and discharged sewage from a manhole in the middle of the carriageway into the highway drainage system. This caused drainage backup, ponding in the road and rising water levels which encroached into shops along High Street; Thames Water attended and pumped flood water away. [PAG,IMG] (p6)</p></div><i>Quantified impacts<
