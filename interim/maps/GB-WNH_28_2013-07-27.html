                var html_b4d5d5f5a3069d70a9d62eee29f164cb = $(`<div id="html_b4d5d5f5a3069d70a9d62eee29f164cb" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>West End, West Haddon</h1><div class="nugget-popup"><p>Repeated surface&ndash;water flooding affected properties on West End: entire ground floors and internal rooms were inundated; garages and a double garage/work pit were flooded; external rear areas of several properties were flooded and in some cases occupants manually prevented ingress to buildings. [TAB,PAG,MUL] (p10)</p></div><div class="nugget-popup"><p>Surface water flowed into and along West End, overtopping kerbs and gullies. Three residential properties were very close to internal flooding; three properties had external areas flooded to their rear and were close to internal flooding; three properties had external/frontage flooding that residents manually prevented entering buildings; at least one property was internally flooded. A commercial property was also reported internally flooded during the event. [PAG] (p11)</p></div><div class="nugget-popup"><p>Flow of water was experienced to the rear of three properties on West End near High Street. At low points on West End the flow in the public highway overtopped kerb lines into private property at relatively shallow depths. Road gullies were unable to accept the quantity of water causing ponding and surcharging of manholes and gullies. A large pond formed at a private access road off West End due to run&ndash;off. [PAG] (p12)</p></div><div class="nugget-popup"><p>A large pond formed on a private access road off West End from runoff from the public highway, producing ponding of about 100mm outside properties and causing internal flooding of two properties to about 25mm on the ground floor. Separately, at the final length of the public surface water sewer at the rear of a property on West End, a reduction in pipe size led to a large area of ponding covering gardens and other open space. (p13)</p></div><div class="nugget-popup"><p>Street&ndash;level flooding occurred despite gullies having been cleared; water flowed along the curb and up against building fronts, affecting access and traffic. [IMG,MUL] (p40)</p></div><div class="nugget-popup"><p>Road surface retains silt deposits from surface water flow indicating recent surface&ndash;water flooding along the carriageway. [IMG,PAG] (p49)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>entire ground floor flooded to around 150mm; entire ground floor flooded to around 100mm; entire ground floor flooded to around 50mm; kitchen flooded to about 25mm; garages flooded to 50mm; three properties (West End) external areas affected; one property on West End internally flooded [TAB,PAG,MUL] (p10)</p></div><div class="nugget-popup quant"><p>three residential properties close to internal flooding; three properties with external/frontage flooding manually prevented ingress; three properties with rear areas affected; one property internally flooded; one commercial property internally flooded [PAG] (p11)</p></div><div class="nugget-popup quant"><p>three properties [PAG] (p12)</p></div><div class="nugget-popup quant"><p>100mm ponding outside properties; 25mm internal flooding; two properties (p13)</p></div><div class="nugget-popup quant"><p>1 property (31 West End) [IMG,MUL] (p40)</p></div></div></body></div>`)[0];

                var html_12b92c5d4de21076708a012f9995c0af = $(`<div id="html_12b92c5d4de21076708a012f9995c0af" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>High Street, West Haddon</h1><div class="nugget-popup"><p>Surface water flowed the full width of the carriageway; water fountains were observed ejecting from road gullies on High Street. The velocity and depth of flow presented a danger and flows contributed to flooding at adjacent properties and to the rear of three properties near High Street. [PAG] (p11)</p></div><div class="nugget-popup"><p>Road gullies were unable to accept the quantity of water, with water ejecting from gullies; areas of ponding and surcharging of manholes and road gullies were reported. A sink hole beneath the carriageway on High Street was reported by residents and repaired (reported cause: sandy soils washed away by ground water). [PAG,MUL] (p12)</p></div></div></body></div>`)[0];

                var html_2c4234d33705ec5e5804ae75158bd97e = $(`<div id="html_2c4234d33705ec5e5804ae75158bd97e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>West Haddon</h1><div class="nugget-popup"><p>Intense short&ndash;duration rainfall overwhelmed drainage, causing excess surface water to flow over ground to low points in the village and resulting in internal flooding of at least one property (recurring). [PAG] (p5)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration rainfall overwhelmed existing drainage so excess surface water flowed overland following natural contours into low points in the village, causing internal flooding of at least one property on more than one occasion. [PAG,MUL] (p6)</p></div><div class="nugget-popup"><p>An intense rainfall event on 27 July 2013 exceeded the capacity of drainage systems causing flooding in the village. Internal flooding occurred in at least one property; at least three other properties were at high risk and residents manually prevented ingress. Drainage system capacity was exceeded and a Preliminary Drainage Investigation was carried out. [MUL] (p8)</p></div><div class="nugget-popup"><p>An intense rainfall event (evening of 27 July 2013) produced multiple surface water overland flows through the village, causing ponding, road flooding and a series of property flooding incidents across the village (see specific streets). Road gullies were overwhelmed and ejected water. (p11)</p></div><div class="nugget-popup"><p>The village experienced surface water flooding during the event: the surface water sewer accepting run&ndash;off from private property and the public highway had insufficient capacity leading to ponding and surcharging of manholes and road gullies; surface water flowed across three natural catchments but was prevented from discharging to natural watercourses due to levels of the public highway and developed private property; highway overtopping led to shallow ingress into private properties; a large pond formed off West End. (p12)</p></div><div class="nugget-popup"><p>Ponding formed at the final length of a public surface water sewer at the rear of a property on West End, covering gardens and other open space; the sewer pipe size reduces at this location which contributed to the ponding. (p14)</p></div><div class="nugget-popup"><p>Identified as being at risk during the Flood Incident; residents are advised to take actions such as property&ndash;level protection, community resilience measures, and signing up for flood warnings. (p16)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration rainfall overwhelmed existing drainage across the village. Drainage systems were surcharged and ejected water to the surface; surface water flowed toward and concentrated at the village low points, causing overtopping of the public highway and exposing properties at low points to flooding. Surface water across the village was directed to a single watercourse discharge location. (p17)</p></div><div class="nugget-popup"><p>Surface water across the village does not follow natural contours and is instead directed to a single watercourse discharge location, concentrating runoff and creating surface water flooding risk; report recommends reinstating historic drainage routes, intrusive investigations (dye/CCTV), re&ndash;excavation of ditches, repair or replacement of piped/culvert sections, dredging/trimming watercourses and a village&ndash;wide maintenance/asset plan to reduce the flood risk. (p18)</p></div><div class="nugget-popup"><p>The parish (specifically The Green and West End areas) experienced repeated surface water flooding prior to drainage works in 2007; residents linked the change in local flooding behaviour to a nearby housing development. [PAG] (p37)</p></div><div class="nugget-popup"><p>Areas within the village (including The Green and West End) experienced surface water/urban flooding, with streets inundated, parked vehicles partially submerged and traffic affected. (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property [PAG] (p5)</p></div><div class="nugget-popup quant"><p>one property [PAG,MUL] (p6)</p></div><div class="nugget-popup quant"><p>at least one property; at least three properties [MUL] (p8)</p></div><div class="nugget-popup quant"><p>two properties internally flooded on Shepherds Row; three properties on West End close to internal flooding; one property on West End internally flooded; one commercial property internally flooded; two properties at Shepherds Row access cut&ndash;off due to ponding; multiple properties with external areas flooded and one property on The Green with water seeping through walls/floors (p11)</p></div><div class="nugget-popup quant"><p>three properties (p12)</p></div></div></body></div>`)[0];
