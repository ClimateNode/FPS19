                var html_992e230038c41facb12d05247b6e51d2 = $(`<div id="html_992e230038c41facb12d05247b6e51d2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Ise</h1><div class="nugget-popup"><p>The River Ise, the main drainage conduit flowing adjacent to the community building, was associated with fluvial flooding that affected the nearby community building (the building is located in Flood Zone 3). Surface water public sewers from neighbouring residential estates discharge into the River Ise at five outfall locations to the north of the flooded building, forming part of the flood pathway. [PAG] (p10)</p></div><div class="nugget-popup"><p>River Ise flood water flowed around the front and rear of the community building at Ise Lodge, ponding at the property (external sports facilities were completely submerged) and entering the rear store where water reached the rear walls; deposited arisings were evident on adjacent banks. Partially fallen trees in the channel likely produced a damming effect and contributed to raised upstream levels. (p12)</p></div><div class="nugget-popup"><p>The River Ise received high volumes of water from the saturated catchment, overwhelmed its channel in the vicinity of Ise Lodge and flooded onto the adjacent floodplain. Fallen trees downstream and restrictions at Barton Road bridge were noted as possible contributors to raised upstream water levels. Large amounts of deposited arisings were evident on the adjacent banks. [PAG] (p13)</p></div><div class="nugget-popup"><p>Floodwater in the River Ise carried and deposited debris along the channel and banks; flow interacted with in&ndash;channel obstructions (trees) leading to accumulation of debris downstream. [PAG] (p51)</p></div><div class="nugget-popup"><p>Downstream reach of the River Ise experienced flooding that deposited debris on banks and in drainage features. Flood flows were impeded by a second tree obstruction on the main channel, exacerbating local high water levels. Floodwater also accumulated into a downstream storm water outlet/pond located below a flooded building and collected around a concrete culvert fitted with a metal grate, indicating overstressing of local drainage infrastructure. (p53)</p></div><div class="nugget-popup"><p>Obstructions (fallen trees / debris) were present on the downstream reaches of the River Ise and contributed to blocked flow that led to flooding of nearby property; the river downstream is explicitly cited in the report pages describing flood impacts. [PAG] (p54)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 outfall locations [PAG] (p10)</p></div><div class="nugget-popup quant"><p>up to 300mm ponded depth (p12)</p></div></div></body></div>`)[0];
