                var html_90786a78d8a9bfd897335f3ac7ad565e = $(`<div id="html_90786a78d8a9bfd897335f3ac7ad565e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Rive Ditch</h1><div class="nugget-popup"><p>Main channel reached capacity quickly and flooded surrounding areas; neighbouring sewer networks and gullies were overwhelmed and surcharged, preventing drainage and causing overland flows and flash flooding of low&ndash;lying areas. This led to internal property flooding, school closures and road closures with major traffic disruption in the Woking area. (p4)</p></div><div class="nugget-popup"><p>Flooding occurred along the Rive Ditch, contributing to urban flash flooding and surface water flows that led to internal property flooding and road closures in adjacent areas. (p5)</p></div><div class="nugget-popup"><p>Flooding occurred along the Rive Ditch on 11th May 2016; the Rive Ditch formed the linear watercourse along which the flash flood extent propagated, affecting adjacent urban areas (Maybury, West Byfleet, Sheerwater). [IMG,PAG] (p6)</p></div><div class="nugget-popup"><p>The Rive Ditch (an ordinary watercourse that becomes an adopted surface water sewer and then a main river) is implicated in localised flooding in the catchment. Sections are shown to be at risk of fluvial flooding (Flood Zones 2 and 3) and the channel/sewer network contributes to surface water flow routes that affected Maybury and West Byfleet during the reported flood event. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>The Main River section overtopped during the event and flooded neighbouring residential area in West Byfleet; trash screens were inspected/cleared pre&ndash;incident and attended during the incident. [PAG] (p12)</p></div><div class="nugget-popup"><p>The Rive Ditch main river section overtopped, causing flooding of adjacent residential properties; residents reported property flooding adjacent to the Rive Ditch. [PAG] (p13)</p></div><div class="nugget-popup"><p>Trash screen at the junction with the Wey Navigation became completely clogged with debris; the ditch exceeded pipe capacity causing back&ndash;up and overtopping that flooded neighbouring residential areas; teams cleared debris continuously and Rangers pumped water from the Rive Ditch into the Basingstoke Canal to help reduce rising flood waters. [PAG] (p14)</p></div><div class="nugget-popup"><p>The pipe capacity was exceeded causing water to back up along the Rive Ditch. Debris built up against the trash screen and responders (BCA Rangers, the EA, fire services and Runnymede officers) repeatedly cleared the screen. BCA Rangers pumped water from the Rive Ditch into the Basingstoke Canal to reduce the rate of rising flood waters. [PAG] (p15)</p></div><div class="nugget-popup"><p>The Rive Ditch trash screen needed to be kept clear of debris by attending contractors during the event, indicating the watercourse was implicated in the fluvial flooding response. (p18)</p></div><div class="nugget-popup"><p>Overflow / flooding associated with Rive Ditch during the 11 May 2016 event that impacted nearby communities; data from the flood was used to refine the Rive Ditch flood alleviation scheme hydrological model. (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>45 properties; three schools; one road closure (p4)</p></div><div class="nugget-popup quant"><p>45 internal property floods; 2 road closures (p5)</p></div></div></body></div>`)[0];

                var html_53f188438dfcc29f26923ad3f05f57a5 = $(`<div id="html_53f188438dfcc29f26923ad3f05f57a5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Runnymede</h1><div class="nugget-popup"><p>Runnymede Borough Council teams attended Rive Ditch on the morning of 11 May 2016 and cleared the trash screen at the junction with the Wey Navigation. The trash screen became completely clogged during the event and contractors continuously removed debris to try to restore flow; contractors worked through the afternoon with EA staff until water levels dropped to near normal. The ditch capacity was exceeded, causing water to back up along the Rive Ditch and residents reported property flooding adjacent to the ditch and flooding on Scotland Bridge Road. (p14)</p></div></div></body></div>`)[0];

                var html_56c6fe01abf1b5b121e174e6a32316ec = $(`<div id="html_56c6fe01abf1b5b121e174e6a32316ec" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Basingstoke Canal</h1><div class="nugget-popup"><p>Areas adjacent to the Basingstoke Canal were affected by the recorded flood extent on 11th May 2016; flooding was concentrated along the nearby watercourse and affected land alongside the canal. [IMG] (p6)</p></div><div class="nugget-popup"><p>During the 11 May 2016 incident, the canal was used as a receiver for water pumped from the Rive Ditch by BCA Rangers to help reduce the rate of rise in floodwaters affecting adjacent areas. (p14)</p></div><div class="nugget-popup"><p>Indicative flood extent for 11 May 2016 closely followed the Basingstoke Canal. Flooding was concentrated along the canal and inundated its immediate surroundings, with inundation extending into adjacent residential areas and woodland next to the waterway. [IMG] (p25)</p></div></div></body></div>`)[0];

                var html_d3e3de669256aeb4a6792d7cda56af0e = $(`<div id="html_d3e3de669256aeb4a6792d7cda56af0e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Woking</h1><div class="nugget-popup"><p>Flash flooding associated with the Rive Ditch reaching capacity and overwhelmed sewer/gully networks caused overland flows and localised inundation. This produced internal flooding of homes across the area, closure of three schools, at least one road closure in the Maybury area and major traffic delays/grid&ndash;lock; Category 1 responders (police, fire, ambulance), Woking Borough Council, Surrey County Council, Thames Water and the Environment Agency attended the incident to prioritise emergency works and assist residents. (p3)</p></div><div class="nugget-popup"><p>The flood event caused major traffic delays and grid&ndash;lock across the Woking area; internal flooding of properties occurred (45 properties reported across the incident) and three schools were closed. Category 1 responders attended the rapidly developing situation. (p4)</p></div><div class="nugget-popup"><p>On 11th May 2016 a localised convective storm stalled over Woking (approx. 11:00&ndash;13:30), producing exceptional short&ndash;duration intensity rainfall that caused localized flash/surface&ndash;water flooding focused on parts of Woking (notably the Maybury area). [PAG] (p7)</p></div><div class="nugget-popup"><p>The report documents flooding that occurred in Woking during the 11 May 2016 event; surface water/urban flooding affected parts of the borough and triggered RMA response and post&ndash;event assessment. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>Flooding occurred in the Woking area during the 11 May 2016 event; the report identifies surface water flood risk and surface water flow routes affecting residential and commercial areas and roads in parts of the borough. (p10)</p></div><div class="nugget-popup"><p>Rapid flash/urban flooding produced numerous reports across the borough (focus on Walton Terrace, Monument Way, Albert Drive, Boundary Road and Maybury). Flood waters began to recede around 15:00; a rest centre was opened; council officers and contractors delivered sandbags and assisted residents; Albert Drive remained flooded at 17:30 with water at kerb level and vehicles caused bow waves that pushed water into low&ndash;lying areas. [PAG] (p12)</p></div><div class="nugget-popup"><p>Numerous reports of flooding across the borough focused on Walton Terrace; emergency procedures were initiated and multi&ndash;agency response and sandbagging were deployed. [PAG] (p13)</p></div><div class="nugget-popup"><p>Significant surface water affected the town on 11 May 2016; foul sewers were reported overloaded by surface water infiltration. Road cleaning was required once flood waters receded (WBC contractors started road cleaning at 20:00 on 11 May). Recovery actions including mapping of flood extents and prioritised clean&ndash;up were carried out. (p15)</p></div><div class="nugget-popup"><p>Localised storm produced surface water and fluvial flooding that exceeded drainage capacity, causing internal flooding of properties, road closures, major traffic congestion and school closures. (p18)</p></div><div class="nugget-popup"><p>Residents of Woking provided information as part of the recovery phase after the flood; engagement activities were organised to address impacts to properties and resilience. [PAG] (p20)</p></div><div class="nugget-popup"><p>Parts of the town experienced flooding associated with the 11 May 2016 event; residents provided information to the investigation and took part in recovery&ndash;phase engagement. [PAG] (p21)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>45 properties; 3 schools; 1 road closure (p3)</p></div><div class="nugget-popup quant"><p>45 properties; three schools (p4)</p></div><div class="nugget-popup quant"><p>1500 sandbags; six WBC staff onsite; six families placed in temporary accommodation [PAG] (p12)</p></div><div class="nugget-popup quant"><p>60 locations (p15)</p></div><div class="nugget-popup quant"><p>45 properties; one road closure; three schools closed (p18)</p></div></div></body></div>`)[0];

                var html_6319e446194d040c20e87e5c2f207a34 = $(`<div id="html_6319e446194d040c20e87e5c2f207a34" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Maybury</h1><div class="nugget-popup"><p>Area was flooded during the flash flood event; there was one road closure and local roads were made unsafe to drive, contributing to traffic issues. (p4)</p></div><div class="nugget-popup"><p>Maybury was one of the areas affected by the flash flooding and surface&ndash;water flow routes associated with the Rive Ditch event, contributing to the total internal property flooding and road closures reported. [PAG] (p5)</p></div><div class="nugget-popup"><p>Maybury was affected by flash flooding on 11th May 2016; floodwaters occurred along the Rive Ditch and the surface water flow route through the largely urban area, producing a linear flood extent impacting the Maybury area. [IMG,PAG] (p6)</p></div><div class="nugget-popup"><p>Maybury was the focus of the localised high&ndash;intensity storm cell on 11th May 2016 and experienced localized flash/surface&ndash;water flooding as the storm stalled over the area. [PAG] (p7)</p></div><div class="nugget-popup"><p>The Maybury area experienced a concentrated period of intense rainfall on 11 May 2016 that resulted in surface water flooding (referred to in the report as the Maybury flood event area). (p8)</p></div><div class="nugget-popup"><p>Maybury is identified as an area with recorded highway flooding ('wetspots') and has experienced localised flooding reported by residents; it is shown on surface water flow&ndash;route risk maps and was considered during the response to the 11 May 2016 flooding. [IMG] (p9)</p></div><div class="nugget-popup"><p>Area experienced surface&ndash;water/flash flooding that generated multiple emergency enquiries and required highways response and a road closure. (p13)</p></div><div class="nugget-popup"><p>Residents in the Maybury area were engaged after the 11 May floods by the Strategic Network Resilience team and the National Flood Forum as part of recovery and to form local flood action groups. (p17)</p></div><div class="nugget-popup"><p>Residents were affected by the 11 May 2016 flooding; local residents are organising (with the National Flood Forum) a Flood Action Group to address ongoing flood concerns and to develop resilience for properties at risk. [PAG] (p19)</p></div><div class="nugget-popup"><p>Properties and residents in the Maybury area were involved in recovery&ndash;phase engagement and recommended to form a Flood Action Group to address ongoing concerns and improve resilience following flooding. [PAG] (p20)</p></div><div class="nugget-popup"><p>The Appendix figure for Maybury includes WBC's indicative flood extents for the 11 May 2016 incident. These extents and the modelled surface&ndash;water overlays show inundation in parts of Maybury &mdash; concentrated in low&ndash;lying areas and alongside watercourses &mdash; affecting adjacent residential and commercial areas during the 11 May 2016 event. (p24)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one road closure (p4)</p></div><div class="nugget-popup quant"><p>45 internal property floods; 2 road closures [PAG] (p5)</p></div><div class="nugget-popup quant"><p>12 emergency flood enquiries; one emergency road closure (p13)</p></div></div></body></div>`)[0];

                var html_a398ff8bad7890716dda5b337e058e30 = $(`<div id="html_a398ff8bad7890716dda5b337e058e30" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>West Byfleet</h1><div class="nugget-popup"><p>Properties and infrastructure in the area were affected by the flash flood; internal property flooding occurred as part of the wider incident. (p4)</p></div><div class="nugget-popup"><p>West Byfleet (Byfleet area) was identified as one of the neighbouring areas affected by the flash flooding and surface water flow routes, contributing to the internal property floods and road closures recorded. [PAG] (p5)</p></div><div class="nugget-popup"><p>West Byfleet was affected by flash flooding on 11th May 2016; flood extent followed the watercourse (Rive Ditch) and surface water flow routes, impacting urban areas of West Byfleet. [IMG] (p6)</p></div><div class="nugget-popup"><p>West Byfleet is identified as an area with recorded highway 'wetspots' and is shown to be at risk from surface water flow routes; it was part of the area considered in relation to the May 11 flood. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>Residential areas were flooded when the Main River section of the Rive Ditch overtopped; additional officers were deployed to deliver sandbags and assist residents in the area. [PAG] (p12)</p></div><div class="nugget-popup"><p>The main river section of the Rive Ditch at West Byfleet overtopped and flooded neighbouring residential areas; officers were deployed to deliver sandbags and the West Byfleet depot was used to support sandbag deployment. (p13)</p></div><div class="nugget-popup"><p>West Byfleet residents were engaged by the National Flood Forum and SCC's resilience team after the 11 May floods; community groups were identified and a flood surgery was held to advise on recovery. (p17)</p></div><div class="nugget-popup"><p>Residents were affected by the 11 May 2016 flooding; local residents are organising (with the National Flood Forum) a Flood Action Group to address ongoing flood concerns and to develop resilience for properties at risk. [PAG] (p19)</p></div><div class="nugget-popup"><p>Residents in West Byfleet were involved in recovery&ndash;phase engagement and a Flood Action Group was proposed to address ongoing concerns and improve resilience for properties at risk of flooding. [PAG] (p20)</p></div><div class="nugget-popup"><p>Indicative flood extents for 11 May 2016 show flooding in the West Byfleet area adjacent to the Basingstoke Canal; residential areas near the canal were inundated by the flood extent. (p25)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>45 internal property floods; 2 road closures [PAG] (p5)</p></div></div></body></div>`)[0];
