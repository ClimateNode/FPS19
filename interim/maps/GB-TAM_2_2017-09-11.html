                var html_4ef10c767f0a15ce0f88c3a3ac7ce8f2 = $(`<div id="html_4ef10c767f0a15ce0f88c3a3ac7ce8f2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Micklehurst Brook</h1><div class="nugget-popup"><p>Debris at the confluence with Staley contributed to grating blockage and localised flooding; downstream culvert collapse adjacent to properties (29 and 33 Micklehurst Road) caused surcharging and collapse that required excavation and replacement. (p15)</p></div><div class="nugget-popup"><p>The Environment Agency identified the Micklehurst Brook (Main River) downstream of the confluence with Staley Brook as requiring culvert restoration following the flood investigation. Works focused on culvert condition in the vicinity of garages opposite 34 Micklehurst Road and additional culvert sections were scheduled for restoration to reduce surcharging and flooding towards the River Tame. [PAG] (p16)</p></div><div class="nugget-popup"><p>Culverted sections of Micklehurst Brook were found to be failed or blocked; sections were assessed and restored (including renewal of failed culvert sections and installation of access chambers) to bring the culvert back to expected standard and reduce flood risk towards the River Tame. [IMG,PAG,MUL] (p17)</p></div><div class="nugget-popup"><p>Debris was washed into or existing debris was disturbed in the Micklehurst Brook culvert; the culvert&#8217;s age, construction and abrupt changes of direction contributed to blockage, which led to flooding downstream that affected properties and the highway. (p21)</p></div></div></body></div>`)[0];

                var html_596ee20917688b0a886bccc0bd583d23 = $(`<div id="html_596ee20917688b0a886bccc0bd583d23" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Tameside Metropolitan District</h1><div class="nugget-popup"><p>On 11 September 2017 the flow in the Micklehurst Brook Culvert was disrupted, causing flooding that affected Micklehurst Road (the highway) and a number of properties in Mossley. [PAG] (p6)</p></div><div class="nugget-popup"><p>A flood event on 11 September 2017 in Mossley (within the Metropolitan Borough of Tameside) affected the highway and a number of properties. (p7)</p></div><div class="nugget-popup"><p>The flood event placed pressure on local infrastructure across the borough and required a significant multi&ndash;agency response (local emergency services, EA, TMBC). [IMG,PAG] (p11)</p></div><div class="nugget-popup"><p>Intensive upland rainfall on 11 September 2017 caused flooding of a number of properties and the highway downstream. Flooding was driven by runoff from Saddleworth Moor and Buckton Moor and was exacerbated by debris in the Micklehurst Brook culvert and the culvert's age, construction and abrupt changes in direction. (p21)</p></div></div></body></div>`)[0];

                var html_acce822b7bfa1a80c6cf96c52878e418 = $(`<div id="html_acce822b7bfa1a80c6cf96c52878e418" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Micklehurst Road, Mossley</h1><div class="nugget-popup"><p>Floodwater flowed across the carriageway, pooling around the kerbs and partially submerging parked vehicles; the inundation disrupted normal movement along the street and affected residential frontages. [PAG] (p1)</p></div><div class="nugget-popup"><p>The highway was flooded when the flow of the Micklehurst Brook Culvert was disrupted; the road flooding formed part of the event that affected nearby properties. (p7)</p></div><div class="nugget-popup"><p>Culvert collapse at the side/rear of 29 Micklehurst Road following extensive rainfall led to flooding in and around a number of properties and the highway; downstream culvert damage created a void beneath a hardstanding area; a temporary road closure was put in place between numbers 9 and 43 to minimise risk. (p11)</p></div><div class="nugget-popup"><p>Properties on Micklehurst Road were flooded internally and externally. A culvert in the rear garden of 33 Micklehurst Road became blocked and surcharged (5 October 2017); the stone culvert was found blocked with debris and the structure unstable. Remedial works followed. [TAB,MUL] (p12)</p></div><div class="nugget-popup"><p>Flooding related to a collapsed culvert at the rear of properties on Micklehurst Road led to road closure, grating clearing at the confluence of Staley and Micklehurst Brooks and surcharging water. A collapse adjacent to 29 Micklehurst Road was exposed and, while repairing that, a further collapse and surcharging occurred to the rear of 33 Micklehurst Road with damage requiring replacement construction. (p15)</p></div><div class="nugget-popup"><p>Surcharge flows between rear gardens of properties on Micklehurst Road and Earnshaw Clough were managed by re&ndash;profiling an overground channel and restoring the culvert; works on the brook/culvert in the vicinity of garages opposite 34 Micklehurst Road were identified and restored, and the road was closed for these works with reopening expected by autumn 2018. [PAG] (p16)</p></div><div class="nugget-popup"><p>Road was closed while culvert condition and failures in the vicinity of garages opposite 34 Micklehurst Road were investigated and repaired; works were required to restore culverted sections and allow the road to be reopened. [IMG,PAG] (p17)</p></div><div class="nugget-popup"><p>A culvert serving Micklehurst Road (from the rear of 33 Micklehurst Road to the grating at the rear of 63/65) was inspected after flood&ndash;related issues; a CCTV survey was limited because large rocks and stones were located close to access points, flow in the culvert was noted as good but not at capacity, and movement of these rocks could restrict flow. It was recommended to review the culvert further and replace the old grating at the rear of 63/65 with a modern inlet structure. The Environment Agency installed CCTV at the confluence of Staley and Micklehurst Brooks to remotely monitor debris on the grating for proactive maintenance. [PAG] (p18)</p></div><div class="nugget-popup"><p>Residents on Micklehurst Road were affected by the autumn 2017 flood; they received newsletters, attended community meetings and were kept informed about restoration works and timescales. (p19)</p></div><div class="nugget-popup"><p>A culvert and inlet located between 35&ndash;65 Micklehurst Road were identified as problematic during the September 2017 Tameside flood; the road and adjacent properties were affected and the culvert/inlet were recommended for upgrading and re&ndash;profiling to reduce future flooding. [TAB,PAG] (p20)</p></div><div class="nugget-popup"><p>A blocked culvert behind 29 Micklehurst Road caused discharge of water and led to property flooding in the residential area. Emergency response measures included placing sandbags around a manhole to prevent overflow, deploying flood barriers and sandbags along the road, and sandbagging the entrance of a stone residential building. Repair work to address the blocked culvert was ongoing. [IMG] (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 culvert collapse at 29 Micklehurst Road; road closure spanning properties numbered 9&ndash;43 (p11)</p></div><div class="nugget-popup quant"><p>10 properties internally flooded; 27 properties externally flooded; 5 properties internally and externally flooded [TAB,MUL] (p12)</p></div><div class="nugget-popup quant"><p>2 properties (29 and 33); damage extended over 3 metres in length (p15)</p></div></div></body></div>`)[0];
