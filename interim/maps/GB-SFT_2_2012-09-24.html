                var html_1ef54e13c0217abba895e65e566c3572 = $(`<div id="html_1ef54e13c0217abba895e65e566c3572" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Dover's Brook</h1><div class="nugget-popup"><p>High levels in Dover's watercourse (Dover's Brook) prevented drainage discharge, flowed back into drainage systems or overflowed; low point in the defence at Dover's Bridge allowed overtopping/entry of water into Sefton Meadows. Environment Agency actions recommended to raise embankment and consider flood warnings. [TAB] (p5)</p></div><div class="nugget-popup"><p>The area of Fouracres (Maghull) experienced local flooding associated with backfilling of drainage outfalls from nearby watercourses (Whinny Brook and Dover's Brook); the report recommends investigating flap valves/non&ndash;return systems on the outfalls into those brooks to reduce backfilling. (p6)</p></div><div class="nugget-popup"><p>Dovers Brook is implicated as the source/adjacent watercourse for the event, with properties closest to its western boundary being flooded; proximity to the brook is identified as a risk factor for the inundation. [PAG,IMG] (p13)</p></div><div class="nugget-popup"><p>High water levels in Dover's Brook prevented outflow at outfalls and caused reverse flow up drainage pipework; water emerged from gullies in residents' gardens and later from manholes, contributing to local flooding. Pumping back into Dover's Brook provided only limited reduction in levels within the nearby residential area until brook levels fell. (p19)</p></div><div class="nugget-popup"><p>Outfalls into Dover's Brook were identified as a mechanism for flooding; the report recommends investigation and installation of flap valves/non&ndash;return systems on these outfalls to reduce backflow and future flooding during the 2012 event. [PAG,TAB] (p21)</p></div><div class="nugget-popup"><p>Bridges Lane (area B) experienced partial highway flooding with water pooling on the road and extending into adjacent fields; photographic evidence (25/09/2012) shows vehicles and agricultural machinery travelling through standing water. Highway flooding depth in the affected stretch was approximately 15 cm. [PAG] (p27)</p></div><div class="nugget-popup"><p>High levels on the River Alt contributed to tide&ndash;locking of the highway drainage system, preventing discharge and contributing to surface water flooding of the highway and gullies overflowing. [PAG,IMG] (p28)</p></div></div></body></div>`)[0];

                var html_d3ec802c2f921d1915ec7b4b6247f116 = $(`<div id="html_d3ec802c2f921d1915ec7b4b6247f116" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Alt</h1><div class="nugget-popup"><p>High River Alt levels restricted discharge from the surface water system and contributed to flooding that affected the adjacent road; the report records a roughly 60m stretch of road between Sefton village and the bridge being inundated to approximately 15cm depth on 2012&ndash;09&ndash;24. (p25)</p></div><div class="nugget-popup"><p>Highway flooding occurred on the stretch of highway between the bridges over the River Alt and Dover's Brook; floodwater reached approximately 15 cm depth along the carriageway. (p27)</p></div><div class="nugget-popup"><p>High River Alt levels on 2012&ndash;09&ndash;24 tide&ndash;locked the highway drainage system so drains could not discharge. Once gullies and pipes reached capacity water flowed onto the highway, causing highway flooding between the bridges over the River Alt and Dover's Brook to a depth of approximately 15 cm and contributing to surface water pooling on Sefton Lane (pooling reported at approximately 12 cm in places). [PAG] (p28)</p></div></div></body></div>`)[0];

        var popup_76012adbefb9a31659707c1a56c7c09c = L.popup({});

        
            
                var html_a4fdeaac093b9238c583536093c2e47b = $(`<div id="html_a4fdeaac093b9238c583536093c2e47b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Moss Lane, Lydiate</h1><div class="nugget-popup"><p>Moss Lane (Lydiate) was identified as one of the areas affected by the 24 September 2012 flooding event. Flooding was associated with overwhelmed drainage / watercourse flow; riparian owners subsequently cleared the watercourse (site meetings held, December 2012) allowing water to divert along its old course. [TAB] (p5)</p></div><div class="nugget-popup"><p>Prolonged rainfall on 2012&ndash;09&ndash;24 overwhelmed the local drainage and culvert capacity causing stormwater to back up and overflow along natural ground contours. The event caused internal flooding to at least 1 property on Moss Lane and flooded gardens and outbuildings. The area also has a recorded significant flood in 2008 that caused internal flooding to 8 properties and led to highway collapse due to wash&ndash;out. (p44)</p></div></div></body></div>`)[0];

        var popup_df40f12ea7db36c0256b57cac55974ac = L.popup({});

        
            
                var html_4a2a9473b5271f9a07df2c87a15c5163 = $(`<div id="html_4a2a9473b5271f9a07df2c87a15c5163" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Fouracres, Maghull</h1><div class="nugget-popup"><p>Drainage outfalls into Whinny Brook and Dover's Brook backfilled when watercourse levels were high; drainage systems were overwhelmed and low&ndash;lying land flooded. Properties in the Fouracres area were affected or at risk. United Utilities proposed fitting non&ndash;return (flap) valves to reduce backflow. [TAB] (p5)</p></div><div class="nugget-popup"><p>Flooding occurred due to backfilling from nearby watercourses (Whinny Brook and Dover's Brook) into drainage outfalls during high river levels/excessive rainfall; recommendations were made specifically for Fouracres (Maghull) to investigate flap valves/non&ndash;return systems and for improved coordination of RMAs. (p6)</p></div><div class="nugget-popup"><p>Flooding affected properties in the northwest section of the Fouracres cul&ndash;de&ndash;sac adjacent to Dovers Brook. A contiguous block of homes/properties are shown as inundated on the council map; affected properties are outlined and shaded blue. [PAG,IMG] (p13)</p></div><div class="nugget-popup"><p>The location plan is titled as showing the extent of a flooding event at Fouracres; the map indicates surface water flooding affecting the Fouracres residential street and adjacent properties, with drainage and surface water sewers shown discharging to outfalls at local watercourses (Dover's Brook / Whitney/Whinny Brook). The plan implies inundation of the residential area but gives no property&ndash;level counts or detailed damage descriptions. [IMG] (p14)</p></div><div class="nugget-popup"><p>Flood water rose in gardens of multiple properties and in a number of instances exceeded property thresholds causing internal flooding. Water in at least one instance appeared to come up through drains and through the floor. Fire Service pumps reduced levels but water remained; additional pumping over 24&ndash;26 Sept was required and at least one further property flooded on the evening of 25 Sept. [PAG] (p16)</p></div><div class="nugget-popup"><p>Approximately 40 properties on Fouracres were affected by flood water, with 24 properties internally flooded. Foul flooding was reported but not confirmed by debris; clean (surface) water flooded back gardens of properties adjacent to The Crescent. Additional small pumps were brought in on the 26th to help clear garden flooding around Fouracres. [PAG,IMG] (p17)</p></div><div class="nugget-popup"><p>Floodwater was present around houses in Fouracres (illustrated in Figure 6). United Utilities concluded flooding in the area occurred due to surface water entering the foul sewer system (via cross&ndash;connections, directly through foul drains, or flood water being discharged into it). [PAG,IMG] (p18)</p></div><div class="nugget-popup"><p>Properties and gardens to the rear of 11, 15 and 13 Fouracres were flooded when high levels in the nearby brooks forced water back up pipework and into gullies; pumping reduced levels in Fouracres only to a limited extent and the area began to drain only once brook levels dropped. [IMG] (p19)</p></div><div class="nugget-popup"><p>The drainage system allowed water to flow from the main river (when Brooks levels were high) into Fouracres, causing flooding of this low&ndash;lying area during the event. (p20)</p></div><div class="nugget-popup"><p>Whinney Brook burst its banks and caused flooding at Fouracres. Emergency services attended, manhole covers were opened and pumping commenced overnight. Power to the road was cut then later restored. Sandbags were delivered and pumps were used to remove floodwater (hoses directed into Whinney Brook). Council teams checked householders for vulnerability. (p51)</p></div></div></body></div>`)[0];

                var html_f13799fcb832b41d55c4cabe887deeb1 = $(`<div id="html_f13799fcb832b41d55c4cabe887deeb1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Water Street, Thornton</h1><div class="nugget-popup"><p>Defects and limited capacity in the piped watercourse serving Water Street resulted in flooding. Sefton Council secured funding to make improvements to the piped watercourse and work towards reducing flood risk. [TAB] (p5)</p></div><div class="nugget-popup"><p>Road and properties inundated. Flooding surcharged manholes on Water Street, causing water to rise to a level sufficient to cause internal flooding; gardens and outbuildings were also flooded. [PAG] (p41)</p></div><div class="nugget-popup"><p>A downstream constriction in the culvert caused water to back up and surcharge manholes located within Water Street; this surcharging rose to a level sufficient to cause internal flooding of properties on Water Street. (p42)</p></div></div></body></div>`)[0];
