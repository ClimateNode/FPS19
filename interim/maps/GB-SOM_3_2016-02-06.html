                var html_cd1e0052f17f650dfeee9ac6842d7996 = $(`<div id="html_cd1e0052f17f650dfeee9ac6842d7996" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1>Rectory Lane, Norton Sub Hamdon</h1><div class="nugget-popup"><p>Highway drains adjacent to properties surcharged and began to flood Rectory Lane; the highway flooded to depths reported between 100 mm and 1200 mm. The surcharge of drains adjacent to properties (Homefield, Clarens and Apple Lodge) contributed to the lane flooding. (p12)</p></div><div class="nugget-popup"><p>Drains surcharged onto the highway causing increased surface water flow along Rectory Lane into Great Street and Little Street; flood depth at the northern end of Rectory Lane was measured at 1.2 m at the peak of the event. (p15)</p></div><div class="nugget-popup"><p>Drains outside the property known as 'the Stables' experienced a capacity failure during the flood: the drain outfall became ineffective once the adjacent watercourse rose to the outfall height, causing local drainage failure and flooding on Rectory Lane. (p16)</p></div><div class="nugget-popup"><p>Surface&ndash;water flooding of the highway / overland flow across the carriageway, prompting Somerset County Council (Highway Authority) to review the frequency of highway drain clearance for Rectory Lane. (p19)</p></div></div></body></div>`)[0];

                var html_cec99f446aed34421d28a7ca25b18cf2 = $(`<div id="html_cec99f446aed34421d28a7ca25b18cf2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Norton Sub Hamdon</h1><div class="nugget-popup"><p>Obstructions in the watercourse downstream of Norton Sub Hamdon were identified as contributors to the flood event; SCC Flood Management Team and FWAG met with landowners and resolved these obstructions during the post&ndash;event response. (p4)</p></div><div class="nugget-popup"><p>Properties in the village reported internal flooding. Downstream of Norton Sub Hamdon there was evidence of substantial natural debris and vegetation (fallen branches, tree trunks, reeds) and other obstructions forming dams that backed&ndash;up the stream and increased flood impacts; pinch&ndash;points (including Pill Bridge and a boundary wall 60 m upstream) and an undersized diversion channel were cited as contributing factors. [IMG] (p14)</p></div><div class="nugget-popup"><p>Inspection found numerous large obstructions (including tree trunks) in the watercourse downstream of Little Street along the River Parrett Trail; these acted as debris traps leading to blockages that likely contributed to flooding in Norton Sub Hamdon (including the drainage failures on Rectory Lane). (p16)</p></div><div class="nugget-popup"><p>Village experienced a damaging flood event that triggered a Section 19 investigation. Flooding issues included channel blockages and pinch points on the local watercourse, prompting community meetings, investigation by the LLFA/FRM team and consideration of feasibility and alleviation measures. (p18)</p></div><div class="nugget-popup"><p>The village experienced flooding consistent with Environment Agency flood risk mapping. The event prompted multi&ndash;agency investigation (FRM site visits, landowner engagement, sewer/pumping station investigations by Wessex Water) and recommendations for resident Flood Action Plans and property&ndash;level protection. Highway drainage review was proposed for Rectory Lane, Great Street, New Road and Little Street. (p19)</p></div></div></body></div>`)[0];
