                var html_afde95a396476fefccc24db7090d9958 = $(`<div id="html_afde95a396476fefccc24db7090d9958" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Warwick</h1><div class="nugget-popup"><p>LLFA received multiple flood reports in Warwick during the intense, highly&ndash;localised thunderstorms on 12 August 2020 relating to short&ndash;duration heavy rainfall (surface water flooding incidents reported to the LLFA). [PAG] (p5)</p></div><div class="nugget-popup"><p>On 30 July 2021 a band of rain associated with Storm Evert passed over Warwick. Radar data suggest the site of interest in Warwick received about 23 mm of rain in 24 hours; surrounding gauges recorded 17&ndash;31 mm. The event prompted warnings of potential surface water and fluvial flood risk. (p6)</p></div><div class="nugget-popup"><p>Internal flooding of properties in the town: 5 commercial premises and 4 residential properties were internally flooded during the event. Highway flooding was also reported in parts of Leamington. Warwickshire County Council (WCC) received two flood reports from the site of interest and a separate Section 19 investigation was undertaken because the event exceeded threshold 3 of the Warwickshire LFRMS. [IMG,PAG] (p7)</p></div><div class="nugget-popup"><p>Internal flooding of properties and standing highway water in the town following an intense rainfall event; the Local Lead Flood Authority (LLFA) carried out a separate Section 19 investigation for the event. [PAG] (p8)</p></div><div class="nugget-popup"><p>Highway surface water flooding reports recorded in Warwick at Castle Lane and by St Nicholas' Church following the July 2021 rainfall event. (p9)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 commercial premises; 4 residential properties; two flood reports [IMG,PAG] (p7)</p></div><div class="nugget-popup quant"><p>5 commercial premises; 4 residential properties [PAG] (p8)</p></div><div class="nugget-popup quant"><p>2 highway flood reports (Castle Lane and by St Nicholas' Church, July 2021) (p9)</p></div></div></body></div>`)[0];
