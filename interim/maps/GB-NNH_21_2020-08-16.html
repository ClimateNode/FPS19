                var html_99921a9a5405dec9e950a10c86ddc235 = $(`<div id="html_99921a9a5405dec9e950a10c86ddc235" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Swanspool Brook</h1><div class="nugget-popup"><p>Flows were directed toward Swanspool Brook but were restricted from entering the brook at the residential block perimeter, causing water to deepen locally and enter properties; elsewhere a strong flow from a car park discharged into Swanspool Brook. (p17)</p></div><div class="nugget-popup"><p>Excess surface water flowed downhill toward Swanspool Brook; low points in the catchment had no effective overland flow routes to divert excess surface water to Swanspool Brook, resulting in reliance on buried drainage systems which were overwhelmed during the event. (p19)</p></div></div></body></div>`)[0];

                var html_b79d320abbbad2c16d4912ffb8321a5a = $(`<div id="html_b79d320abbbad2c16d4912ffb8321a5a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wellingborough</h1><div class="nugget-popup"><p>Parts of Wellingborough (town centre area) experienced flooding during the rainfall and flooding event; public foul and surface water sewers exist throughout the town centre and overland surface water flow from exceedance higher in the catchment is described as a mechanism affecting the area. (p14)</p></div><div class="nugget-popup"><p>Various areas of Wellingborough were affected by flooding; Fire and Rescue received emergency calls from affected areas and attended properties and external areas where relatively deep flood water was held and was pumped to safe areas. Follow&ndash;up teams cleared debris, street surfaces and delivered sandbags to some properties. (p18)</p></div><div class="nugget-popup"><p>Area experienced surface water flooding caused by intense short&ndash;duration rainfall. Surface water drainage systems across the catchment were unable to convey the rain; cumulative flows lower in the catchment were deep and fast&ndash;moving, occupying the full width of roads and footways. Surface water flowed to low points that have no effective overland relief, with reliance on buried drainage systems; some localised drainage points required maintenance. Properties in the area were recorded as being affected and details of affected properties were shared with the LLFA. (p19)</p></div><div class="nugget-popup"><p>Wellingborough is identified as part of a community resilience project because communities there are at risk of surface water flooding; the risk/flood incident prompted recommendations for drainage inspection, maintenance and community preparedness measures. (p23)</p></div></div></body></div>`)[0];
