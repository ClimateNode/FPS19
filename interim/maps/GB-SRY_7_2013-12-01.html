                var html_7f2c40d9eb22c8456f9dea76e8a2ff55 = $(`<div id="html_7f2c40d9eb22c8456f9dea76e8a2ff55" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Redhill Brook</h1><div class="nugget-popup"><p>Redhill Brook was assessed as part of the winter 2013&ndash;14 river flow analysis and is associated with fluvial flood risk in Redhill during that winter; estimates indicate elevated peak flows contributing to flood hazard in the area. [TAB] (p11)</p></div><div class="nugget-popup"><p>Redhill Brook responded rapidly to the storms on 23&ndash;24 December 2013, with substantially higher river levels during the event; this contributed to fluvial flooding in Redhill and the wider catchment. [TAB,MUL] (p25)</p></div><div class="nugget-popup"><p>Burst its banks on 31 December 2013; flow ran into an adjacent quarry. From the end of December 2013 the brook was deliberately diverted into the quarry to attenuate flows. Emergency works were carried out to install an outfall to prevent a potential disaster. A new channel was cut in March 2014 to re&ndash;establish Redhill Brook. [MUL] (p26)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2.46 m ALD on 24/12/2013 [TAB,MUL] (p25)</p></div></div></body></div>`)[0];

                var html_752ce4a6130faf93e9c30778e1a9d709 = $(`<div id="html_752ce4a6130faf93e9c30778e1a9d709" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Mole</h1><div class="nugget-popup"><p>Fluvial flooding from the River Mole and its tributaries caused inundation across river floodplains in Surrey during the winter 2013&ndash;14 storms, contributing to local flood impacts in the Reigate and Banstead area. (p10)</p></div><div class="nugget-popup"><p>The River Mole experienced very high flows during winter 2013&ndash;14 that produced fluvial flooding and inundation across river floodplains in Surrey. Peak flows were driven by the 23&ndash;24 December 2013 storm (largest recorded), with further significant peaks around 17 January 2014 and 1 February 2014. Gauging stations in the middle Mole (Dorking and Leatherhead) exceeded their capacity during the December/January peaks so peak flows were not fully recorded at those sites. [IMG,TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>The middle Mole experienced extreme river levels during the 23&ndash;24 December 2013 storm that exceeded the capacity of gauging stations (Dorking and Leatherhead). The river exhibited flash behaviour &mdash; levels rose rapidly and returned to normal about 10 hours after peak. Significant high flows were also recorded in the middle Mole area on 17 January 2014 and 1 February 2014. [MUL] (p12)</p></div><div class="nugget-popup"><p>High flows in the River Mole caused flooding across Horley and the catchment, contributing to road closures and internal property flooding; river levels in Horley reached record highs. [TAB,MUL] (p21)</p></div><div class="nugget-popup"><p>Extremely high river flows at the Horley gauge during December 2013&ndash;February 2014; river levels in Horley were the highest since EA records began (approximately 1985). [TAB] (p22)</p></div><div class="nugget-popup"><p>Flooding occurred across the River Mole catchment (including Redhill) during the storms of 23 and 24 December 2013; the event comprised a combination of fluvial (river), surface water and groundwater flooding mechanisms affecting the catchment. [MUL] (p25)</p></div><div class="nugget-popup"><p>Identified as the main source of fluvial flooding in the borough, causing a large number of internal property flooding incidents and road closures in Horley, Salfords, Redhill and Reigate. (p29)</p></div></div></body></div>`)[0];

                var html_365a1093ca6b9aeb914d7400e7e002f3 = $(`<div id="html_365a1093ca6b9aeb914d7400e7e002f3" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Reigate and Banstead</h1><div class="nugget-popup"><p>Internal property flooding at multiple addresses and road closures were reported across the district during the winter 2013/14 flooding. (p2)</p></div><div class="nugget-popup"><p>Internal property flooding and wider disruption across the borough, including road closures. (p7)</p></div><div class="nugget-popup"><p>Flooding across the borough during winter 2013/14: 51 sites within the borough flooded (S19 sites), with properties experiencing internal flooding. Flood sources in the borough included high groundwater and surface water; sites were spread across multiple sub&ndash;areas (Banstead & Kingswood; Chipstead & Hooley; Reigate & Redhill; Horley & Salfords). [IMG] (p9)</p></div><div class="nugget-popup"><p>Areas outside the River Mole flood plain were flooded by intense rainfall; the main source of flooding in these areas was surface water from the heavy rainfall rather than fluvial (river) flooding. [PAG] (p13)</p></div><div class="nugget-popup"><p>Provided sandbags to slow ingress of floodwater into properties; responded to tree issues after the storms and flooding; and promoted the Repair and Renew Grant (up to £5000) to support residents and businesses flooded in order to protect properties from future flooding. (p17)</p></div><div class="nugget-popup"><p>Experienced major flooding from multiple sources that resulted in internal property flooding and road closures across the borough. (p29)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 60 incidents of internal property flooding (p7)</p></div><div class="nugget-popup quant"><p>51 sites; approximately 60 incidents of internal property flooding [IMG] (p9)</p></div><div class="nugget-popup quant"><p>approximately 60 incidents of internal property flooding (p29)</p></div></div></body></div>`)[0];

                var html_32a99d70338f63d817cfc5ce78e34a8b = $(`<div id="html_32a99d70338f63d817cfc5ce78e34a8b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Surrey</h1><div class="nugget-popup"><p>Closed roads across Reigate and Banstead; removed a grill and carried out silt clearance on Colesmead Road (Redhill); cleared a culvert on Reigate Road (Hookwood); undertook an assessment of options to reduce flood risk in Burstow; carried out enhanced maintenance on Holly Lane, Garrets Lane and Bolters Lane (Banstead); constructed a new lagoon and drainage system on Outwood Lane (Chipstead); and installed swales and soakaways on Holly Lane (Chipstead). [PAG] (p8)</p></div><div class="nugget-popup"><p>Widespread flooding across the county during winter 2013/14 due to record rainfall and very high groundwater levels; some areas exceeded previous groundwater flood records (2000/01). [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>Widespread flooding across the county during winter 2013/14 from multiple sources: elevated groundwater levels caused groundwater flooding; intense and persistent rainfall produced local pluvial (surface water) flooding; and the River Mole and its tributaries produced fluvial (river) flooding that inundated river flood plains across Surrey. [IMG] (p10)</p></div><div class="nugget-popup"><p>Widespread flooding across the county during winter 2013/14, with a major incident declared and particular impacts reported in Reigate and Banstead. [PAG] (p15)</p></div><div class="nugget-popup"><p>Experienced widespread flooding during Winter 2013/14 (including a February 2014 event) that caused road damage, internal sewer flooding at properties, and required multi&ndash;agency response and recovery actions across the county. [MUL] (p16)</p></div><div class="nugget-popup"><p>Widespread and major flooding across the county driven by exceptional rainfall, from fluvial, surface water, ordinary watercourse and groundwater sources. (p29)</p></div><div class="nugget-popup"><p>The county experienced widespread flooding during the December 2013&ndash;February 2014 winter flood event. Lack of maintenance of riparian watercourses and ditches across the county contributed to the impacts of the flooding, increasing localised inundation and damage. Post&ndash;event data collection captured historic flooding locations to help prioritise drainage maintenance and future defence schemes. [PAG] (p30)</p></div></div></body></div>`)[0];

                var html_145066e2f27ab611256309f9a37c9549 = $(`<div id="html_145066e2f27ab611256309f9a37c9549" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Horley</h1><div class="nugget-popup"><p>Internal property flooding at multiple addresses and road closures were reported in Horley during the winter 2013/14 flooding event. [TAB] (p2)</p></div><div class="nugget-popup"><p>Part of the Horley & Salfords sub&ndash;area investigated after flooding in winter 2013/14; sites in this sub&ndash;area experienced flood impacts during the borough&ndash;wide event. [IMG] (p9)</p></div><div class="nugget-popup"><p>The River Mole gauge at Horley recorded multiple large instantaneous flow peaks during winter 2013&ndash;14, with the maximum peak associated with the 23 December 2013 storm; these high flows reflect the river&ndash;driven flooding risk and contributed to inundation of river floodplains in the area. [IMG,MUL] (p11)</p></div><div class="nugget-popup"><p>Subject to flooding during the winter 2013/14 storms (23&ndash;24 December 2013). Flooding caused road closures and internal property flooding in the town. River flows in Horley showed a sequence of high flow events over winter 2013/14, with flows &gt;10 m3/s on multiple occasions and a major peak event. [TAB,PAG] (p21)</p></div><div class="nugget-popup"><p>Significant surface&ndash;water flooding across the Horley area during winter 2013/2014. River levels on the River Mole reached their highest recorded levels since records began (~1985). Flooding led to temporary road closures across the area (including Meath Green Lane, Mill Lane, Reigate Road (A217), Lee Street and Tanyard Way) and large parts of the sub&ndash;area were within EA Flood Warning/Alert Areas. [TAB] (p22)</p></div><div class="nugget-popup"><p>Horley experienced flooding associated with the Gatwick Stream and Burstow Stream between December 2013 and February 2014; the EA issued repeated flood warnings for parts of Horley and Flood Ambassadors visited affected homes. Surrey County Council implemented temporary road closures in the town during the flooding. [TAB] (p23)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Mean flow at the Horley gauge is 1.4 m3/s; 10 m3/s was exceeded 26 times during the winter; highest instantaneous flow just above 60 m3/s around 23&ndash;Dec&ndash;2013 [IMG,MUL] (p11)</p></div><div class="nugget-popup quant"><p>Maximum over any consecutive 4 weeks (February 2014) had a 121&ndash;year return period; maximum over any consecutive 4 weeks (January 2014) had an 80&ndash;year return period; maximum over any consecutive 14&ndash;days (February 2014) had a 73&ndash;year return period; maximum over any consecutive 14&ndash;days (December 2013) had a 20&ndash;year return period; maximum over any consecutive 14&ndash;days (January 2014) had a 15&ndash;year return period; maximum over any consecutive 4 weeks (December 2013) had a 5&ndash;year return period. [TAB] (p22)</p></div><div class="nugget-popup quant"><p>1523 people warned (23/12/2013, Burstow Stream at East and North Horley); 1530 people warned (02/01/2014); 1501 people warned (06/01/2014); 1506 people warned (17/01/2014); 1492 people warned (01/02/2014); 1508 people warned (06/02/2014); 11 people warned (23/12/2013, Gatwick Stream at South West Horley); 146 people warned (06/01/2014 and 17/01/2014, Gatwick Stream); 151 people warned (01/02/2014, Gatwick Stream); 150 people warned (06/02/2014, Gatwick Stream). [TAB] (p23)</p></div></div></body></div>`)[0];

lt clearance). The diversion and bursting of Redhill Brook affected flows in the area. (p26)</p></div><div class="nugget-popup"><p>Experienced internal property flooding incidents and road closures caused by fluvial flooding from the River Mole. (p29)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2.46 m ALD on 24/12/2013; 50&ndash;year return period (2.0% annual chance) [TAB] (p25)</p></div></div></body></div>`)[0];
