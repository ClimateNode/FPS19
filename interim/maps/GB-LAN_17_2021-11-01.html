                var html_37ce4c844554514cd57e0c4037377549 = $(`<div id="html_37ce4c844554514cd57e0c4037377549" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Brandreth Drive, Parbold</h1><div class="nugget-popup"><p>Brandreth Drive was impacted by the November 2021 flooding event. (p1)</p></div><div class="nugget-popup"><p>Internal flooding of a house on the street on 01 Nov 2021 (and a more significant internal flood on 05 Oct 2021). Historic internal floods at the same property occurred in Sept 2019 and Feb 2020. Flooding was caused by a capacity&ndash;constrained and obstructed culverted watercourse passing under the house and garden and through neighbouring gardens; nearby gardens and external areas were extremely boggy. The issue was resolved when damaged/obstructed lengths of the culvert within private property boundaries were replaced or repaired. (p3)</p></div><div class="nugget-popup"><p>Repeated surface water flooding incidents overwhelmed the local highway drainage. The culverted watercourse leaving the public highway and entering private land had become damaged/dysfunctional, leading to out&ndash;of&ndash;hours emergency responses where homes appeared to be at risk. Landowners later carried out coordinated repairs and, after those works, no further reports of homes flooding in this location were recorded. (p5)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property flooded internally on 01 Nov 2021; additional significant internal flooding on 05 Oct 2021; previous incidents in Sept 2019 and Feb 2020. (p3)</p></div></div></body></div>`)[0];
