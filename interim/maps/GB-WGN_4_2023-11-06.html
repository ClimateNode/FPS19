                var html_00ec09fdb0ce42641505094979fd6df7 = $(`<div id="html_00ec09fdb0ce42641505094979fd6df7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Barley Brook</h1><div class="nugget-popup"><p>Barley Brook rose in response to persistent heavy rainfall and overtopped its banks (around 06:00 on 6 November 2023), causing fluvial flooding of the adjacent low&ndash;lying woodland and footpaths. The high water level submerged the sewer outfall, preventing drainage of surface water from nearby roads and contributing to highway and property flooding. [IMG,MUL] (p7)</p></div><div class="nugget-popup"><p>The sewer outfall into Barley Brook became submerged, preventing surface water from draining away and contributing to ponding on roads. A culverted section of Barley Brook beneath the railway was reported blocked by debris, linked to the local flooding. [IMG,PAG] (p8)</p></div><div class="nugget-popup"><p>Multiple blockages along the Barley Brook watercourse contributed to flooding; open channel was reported in good condition but culvert blockages and an extended culvert length increased risk of unnoticed restrictions on flow. (p11)</p></div><div class="nugget-popup"><p>Water levels within Barley Brook could rise above the United Utilities outlet if a blockage is present, risking overtopping of the outlet and localised flooding related to the surface water drainage system. (p16)</p></div></div></body></div>`)[0];

                var html_975fe34f08bd4422f3812fcd71fbce79 = $(`<div id="html_975fe34f08bd4422f3812fcd71fbce79" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wigan Metropolitan District</h1><div class="nugget-popup"><p>Following severe overnight rainfall Barley Brook rose, causing flooding of adjacent woodland and resulting in flooding affecting properties on Havenwood Road and May Tree Drive. Flooding in the surrounding woodland occurred at approximately 09:00 on 6 November. Flooding on Havenwood Road and May Tree Drive began to appear at approximately 17:00 on 6 November; response crews attended those streets and worked until about 03:00 to clear the water. The brook level was observed to peak at approximately 00:00 on 7 November. [MUL] (p6)</p></div><div class="nugget-popup"><p>Localised fluvial flooding from Barley Brook inundated low&ndash;lying woodland and adjacent footpaths; surface water/ponding affected Havenwood Road and May Tree Drive with sewage backing up due to overwhelmed sewers. [IMG,MUL] (p7)</p></div><div class="nugget-popup"><p>Parts of the local surface water network discharged to Barley Brook which experienced blockages and restricted flows; excess surface water backed up into residents' properties and caused a United Utilities foul pumping station to work at capacity and become inundated with surface water. [PAG,IMG] (p10)</p></div></div></body></div>`)[0];

                var html_13dc8e26bf65658adbe32f60462f11e6 = $(`<div id="html_13dc8e26bf65658adbe32f60462f11e6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Havenwood Road, Wigan Metropolitan District</h1><div class="nugget-popup"><p>Following substantial upland rainfall on 6th November 2023 Havenwood Road flooded; residents experienced varying degrees of flooding. (p5)</p></div><div class="nugget-popup"><p>Surface water ponding on the highway exceeded the kerb and spread towards properties; surface water was unable to drain because the sewer outfall into Barley Brook was submerged. The foul sewer became inundated with surface water, causing sewage to back up onto Havenwood Road. United Utilities attended and the pumping station was reported to be running to capacity; response crews worked on site to clear water until about 03:00. [PAG,MUL] (p7)</p></div><div class="nugget-popup"><p>Surface water ponded on the highway, eventually exceeded the kerb height and spread towards properties. Sewage backed up onto Havenwood Road after the foul sewer system became inundated with surface water; surface water entered foul sewers via private drainage contributing to the pumping station becoming overwhelmed. [PAG] (p8)</p></div><div class="nugget-popup"><p>Surface water levels on the highway exceeded the kerb and spread towards properties. The foul sewer system became inundated with surface water causing sewage to back up onto Havenwood Road. Surface water entered the foul sewer via properties' private drainage and the local foul pumping station became overwhelmed; United Utilities officers attended to keep the pumping station operational. [PAG,MUL] (p9)</p></div></div></body></div>`)[0];

                var html_a1948bc280e5c099dff9aabaa0303919 = $(`<div id="html_a1948bc280e5c099dff9aabaa0303919" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>May Tree Drive, Wigan Metropolitan District</h1><div class="nugget-popup"><p>Residents of May Tree Drive experienced varying degrees of flooding during the event; the United Utilities network and the pumping station located in May Tree Drive had issues related to the event. (p5)</p></div><div class="nugget-popup"><p>Surface water ponding on the highway could not drain to the submerged sewer outfall into Barley Brook and spread towards properties; United Utilities officers reported the foul sewer network reached capacity and the local pumping station was overwhelmed. Response crews attended May Tree Drive to clear the water (attending until ~03:00). [IMG,MUL] (p7)</p></div><div class="nugget-popup"><p>Surface water from the highway was unable to drain (outfall submerged) leading to ponding that spread towards properties; flooding on May Tree Drive was reported and later dissipated. [PAG] (p8)</p></div><div class="nugget-popup"><p>Standing surface water covered the carriageway; highway gullies were submerged; surface water encroached onto residential properties and entered multiple properties causing internal flooding. [PAG,IMG] (p19)</p></div><div class="nugget-popup"><p>Surface water flooding on the evening of 06/11/2023 (approximately 19:00) submerged highway gullies and caused internal flooding to multiple residential properties on May Tree Drive. Photographic evidence shows indoor flooding in a storage/utility room with water covering the floor and damage to stored items. United Utilities reported that the local foul pumping station was inundated with surface water, worked at capacity throughout the evening and continuously for several days afterwards, and that excess surface water backed up into residents' properties and entered the foul sewer. [PAG,IMG] (p20)</p></div></div></body></div>`)[0];

                var html_d7797b7b198b02f8bafac047b4715870 = $(`<div id="html_d7797b7b198b02f8bafac047b4715870" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Spencer Road, Wigan Metropolitan District</h1><div class="nugget-popup"><p>The culvert beneath Spencer Road West (Spencer Road area) had its inlet blocked, causing elevated water levels upstream of the culvert near the railway and contributing to localised surface water flooding until blockages were cleared. [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>The debris screen at the inlet to the Spencer Road culvert had been damaged and was non&ndash;operational, allowing debris to contribute to blockages within the culvert. Following clearance works to the Spencer Road culvert, water levels remained high immediately upstream of the culvert beneath the railway, indicating the culvert blockages contributed to local flooding. [PAG] (p11)</p></div><div class="nugget-popup"><p>Blockages in the Spencer Road culvert were implicated in the local flood risk; works to reinstate a debris screen on the Spencer Road culvert were planned to help prevent blockages and reduce future flooding. (p15)</p></div></div></body></div>`)[0];
