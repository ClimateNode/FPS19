                var html_e223fbfc293a0a5d21174a3c3d7c2db4 = $(`<div id="html_e223fbfc293a0a5d21174a3c3d7c2db4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Cherwell</h1><div class="nugget-popup"><p>Excess surface water from intense rainfall flowed to low points adjacent to the River Cherwell, contributing to local flooding and routing floodwater toward highway drainage systems. (p6)</p></div><div class="nugget-popup"><p>The River Cherwell flows at the north of the village and the area around it is shown as Flood Zone 3; flooding occurred in the village (High Street) to the south of the river on 21 November 2012 and the river and its tributaries are implicated in the local flood risk. [PAG] (p8)</p></div><div class="nugget-popup"><p>The River Cherwell is the Main River passing through Charwelton; it receives two ordinary watercourses (from north and south), was observed to have recently been dredged in places, and bifurcates approximately 30 metres upstream of the Packhorse Bridge where a constructed double plastic pipe splits flow to an unknown outfall. The river's course, its connections to ordinary watercourses and fish&ndash;pond systems, and the engineered pipe/bifurcation arrangements influenced river flooding and flood routing in the village during the event. [PAG] (p9)</p></div><div class="nugget-popup"><p>The River Cherwell overtopped its banks immediately north and west of Packhorse Bridge on 21st November 2012; flows moved northwest&ndash;to&ndash;southeast, flowed over the A361 and contributed to flooding at the village low point and to backing up in culverts. (p11)</p></div><div class="nugget-popup"><p>River water levels affected the outlets from the village drainage; the depth of water in the River Cherwell made outlets unsatisfactory and prevented effective discharge of floodwater from local drainage, exacerbating flooding in Charwelton. (p16)</p></div><div class="nugget-popup"><p>The River Cherwell conveyed flood flows through/adjacent to the village; constrained sections and downstream Main River maintenance issues were linked to overtopping risk to properties and the highway (including concern over the culvert beneath the A361). [PAG] (p18)</p></div><div class="nugget-popup"><p>The River Cherwell (Main River) conveyed flow through a culvert beneath the A361 that was at risk of overtopping/overflow, causing or threatening damage to private property in Charwelton. The report recommends increasing conduit capacity, installing a debris screen at the inlet, improving maintenance access and improving the watercourse profile and lining at inlet and outlet to reduce the risk of overflow and improve downstream free flow. (p19)</p></div><div class="nugget-popup"><p>The River Cherwell experienced elevated, sediment&ndash;laden flows during the flood, with water levels high both downstream (east) and upstream (west) of Packhorse Bridge. Muddy banks, debris and local bank erosion were observed. [IMG] (p41)</p></div><div class="nugget-popup"><p>Channel works recorded: south of Packhorse Bridge the channel was partially trimmed and dredged; further south the channel was fully trimmed and dredged. (p46)</p></div></div></body></div>`)[0];
                popup_f00679cce648fc46b1d932f762200a68.setContent(html_e223fbfc293a0a5d21174a3c3d7c2db4);

                var html_e7c99f79a6b6f6af0186986a6a64a79c = $(`<div id="html_e7c99f79a6b6f6af0186986a6a64a79c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Packhorse Bridge</h1><div class="nugget-popup"><p>The Packhorse Bridge is the low point in the village where the Main River Cherwell and an ordinary watercourse converge. River flow is conveyed beneath the A361 and the bridge via a system of 450mm diameter pipes and a riparian&ndash;owned culverted ordinary watercourse discharges to the River Cherwell south of the bridge. These constrained conduits and the flow convergence at the bridge were central to flood routing through the village during the event. (p9)</p></div><div class="nugget-popup"><p>Pipe culvert sections at Packhorse Bridge had insufficient capacity during the event; water backed up, filled land north of the A361 and then overtopped onto the A361 and adjoining land west of the A361. (p11)</p></div><div class="nugget-popup"><p>Ponding formed immediately south of the Packhorse Bridge extending about 120 metres. Water in the highway exceeded 300 mm depth immediately south of the bridge, causing flooding to an adjacent property. Land immediately west of the High Street at the Packhorse Bridge was completely submerged and overtopped onto the A361. (p12)</p></div><div class="nugget-popup"><p>The River Cherwell beneath the A361 at the Packhorse Bridge (and immediately upstream/downstream) was implicated in restricting outlet capacity during the flood; the condition and route of the culverted/channelled river at this location require investigation and maintenance to restore full flow capacity. [PAG] (p17)</p></div><div class="nugget-popup"><p>Flows immediately upstream and downstream of the bridge were identified as constrained during the flood and were prioritised for reinstatement and maintenance to restore full hydraulic capacity so flood flows could pass without causing overtopping. (p18)</p></div><div class="nugget-popup"><p>Floodwaters nearly submerged the bridge arches and overflowed onto the adjacent road; the road was rendered impassable and nearby properties were threatened by encroaching floodwater. (p38)</p></div><div class="nugget-popup"><p>River levels during the flood rose to nearly the base of the stone arches, with sediment&ndash;laden flow passing under the arches. Debris was observed around the bridge and adjacent banks showed muddy deposits and signs of erosion consistent with the flood. [IMG,PAG] (p41)</p></div></div></body></div>`)[0];

                var html_0e3226116453d1bc1ed3b1b703bf715f = $(`<div id="html_0e3226116453d1bc1ed3b1b703bf715f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>High Street, Charwelton</h1><div class="nugget-popup"><p>High Street was subject to surface water flooding; the highway was closed and at least one property experienced internal flooding. (p5)</p></div><div class="nugget-popup"><p>Flooding occurred on High Street (to the south of the River Cherwell); the highway was closed to traffic and at least one property experienced internal flooding; several other properties were identified as at high risk of flooding. (p8)</p></div><div class="nugget-popup"><p>Flows from the A361 (from culvert overtopping) and from the River Cherwell (overtopping its banks) met at the low point of the village immediately south of the Packhorse Bridge on the High Street. The water was unable to drain into the River Cherwell quickly enough, causing inundation at this location. (p11)</p></div><div class="nugget-popup"><p>Ponding on the High Street about 80 metres south of the Packhorse Bridge; water approximately 150 mm deep at a property on the east side causing that property to flood. Other residential properties on the south side were nearly flooded and were affected by waves from passing traffic through the ponded water. (p12)</p></div><div class="nugget-popup"><p>Overflow from the fishponds outfall and adjacent ditch exceeded the capacity of an ordinary watercourse culvert in the verge, causing turbid water to pool, overtop the curb and flow onto and across High Street (road surface). [IMG] (p39)</p></div><div class="nugget-popup"><p>Flood water was allowed to drain through a purposely created gap in a wall south of Packhorse Bridge; street surfaces were wet with standing water/puddles and the adjacent grass verge showed damage likely associated with vehicular movement during/after inundation. [IMG] (p42)</p></div><div class="nugget-popup"><p>A stone&ndash;lined ditch discharged into an ordinary watercourse culvert in the verge of High Street; the culvert grate was partially submerged with visible debris and foam, indicating active flow that impeded drainage along the verge. (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property (p5)</p></div><div class="nugget-popup quant"><p>at least one property (p8)</p></div></div></body></div>`)[0];
                popup_74feb783d8a3b143abf91c9b58860c31.setContent(html_0e3226116453d1bc1ed3b1b703bf715f);

                var html_1d5c6296a5b85df4ecec06ff23a8634a = $(`<div id="html_1d5c6296a5b85df4ecec06ff23a8634a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Charwelton</h1><div class="nugget-popup"><p>Charwelton experienced surface water flooding driven by intense rainfall on a saturated catchment; at least one property flooded internally and the highway (High Street) was closed. Flooding of a property has occurred on multiple occasions within the previous five years. [PAG] (p5)</p></div><div class="nugget-popup"><p>Intense rainfall on a saturated catchment caused excess surface water to flow overland following natural contours to low points adjacent to the River Cherwell and down via highway drainage. At least one property on High Street flooded internally. The highway (High Street) was closed due to the flood. [PAG,MUL] (p6)</p></div><div class="nugget-popup"><p>The village experienced flooding associated with significant rainfall on the local catchment: flooding occurred on High Street (south of the River Cherwell), the road was closed and at least one property flooded internally; other properties were at high risk. (p8)</p></div><div class="nugget-popup"><p>The village experienced flooding as a result of intense rainfall during the incident. [PAG] (p15)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration rainfall on a saturated catchment overwhelmed existing drainage systems and watercourses. Silt and debris in drains and inlets reduced flow capacity. Excessive flows overtopped drainage and watercourses and flowed to the low point in the village; the local drainage at that low point could not convey the volume of water to the River Cherwell, contributing to flooding of the village. (p16)</p></div><div class="nugget-popup"><p>Flows of water from higher ground overtopped historic drainage systems and concentrated at the low point in the village; local drainage was overwhelmed and outlets to the River Cherwell were rendered unsatisfactory (affected by river water depth), causing overspill of land drainage onto the public highway and private property. (p17)</p></div><div class="nugget-popup"><p>Resident photographs document flooding in Charwelton associated with the incident on 21st November 2012. (p36)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property [PAG] (p5)</p></div><div class="nugget-popup quant"><p>at least one property [PAG,MUL] (p6)</p></div><div class="nugget-popup quant"><p>at least one property (p8)</p></div></div></body></div>`)[0];
