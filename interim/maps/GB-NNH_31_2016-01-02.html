                var html_a035864cb69d7258ad0b139b120ef02d = $(`<div id="html_a035864cb69d7258ad0b139b120ef02d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Windmill Close, Woodford</h1><div class="nugget-popup"><p>Flooding at Windmill Close was caused by moderate rainfall on a saturated catchment; land drainage systems could not convey the rainwater, so excess surface water flowed following natural contours to low points around private property. Field ditches to the south of Windmill Close may have been altered, directing surface water towards private property. (p7)</p></div><div class="nugget-popup"><p>Internal flooding entered the building envelope of a residential property at Windmill Close; residents affected and the property has experienced repeated internal flooding incidents in the last five years. [MUL] (p9)</p></div><div class="nugget-popup"><p>Affected residents were spoken to as part of a Flood Incident Investigation regarding a flooding incident on 2 January 2016; the location was investigated for flood risk (mapping indicated Windmill Close is not shown to be at risk of surface water or fluvial flooding). [PAG] (p10)</p></div><div class="nugget-popup"><p>Surface water flowed into rear gardens from scrub land to the west, ponding around houses and entering air bricks; ground and paving were saturated/damp during the period described. [TAB,MUL] (p12)</p></div><div class="nugget-popup"><p>Surface water flowed from scrub land beyond the rear boundary fence toward the rear of houses, ponded in gardens and around houses and entered air bricks. This caused continual saturated ground and dampness in rear gardens and other external areas. Residents excavated an informal ditch; following that excavation flooding was experienced at a different property on Windmill Close (and at one on Paddock Road) on early January 2016. [PAG,MUL] (p14)</p></div><div class="nugget-popup"><p>Moderate rainfall over a saturated catchment and ineffective land drainage caused excess surface water to flow over ground following natural contours to low points around private properties in Windmill Close. (p15)</p></div><div class="nugget-popup"><p>The Paddock Road/Windmill Close development was identified for review of planning, flood risk assessment and drainage design; developers were to be contacted if surface water drainage measures were absent or ineffective. (p24)</p></div><div class="nugget-popup"><p>Documented residents' photographs relate to a flood incident affecting a property on Windmill Close, indicating the property was impacted by the flood. (p38)</p></div><div class="nugget-popup"><p>Runoff from the surrounding catchment flowed into ditches immediately south of the street, producing ponding and active, turbid flow adjacent to properties. Temporary defensive measures (an informal ditch and sandbags) were placed at the rear of properties to divert water away from the fence line. [IMG,PAG] (p43)</p></div><div class="nugget-popup"><p>An informal, temporary ditch has been constructed at the rear of residential properties and contains pooled/muddy water. The ditch runs parallel to rear boundary fences and shows recent vegetation clearance, indicating local surface water runoff/drainage measures to manage waterlogging at property boundaries. [IMG,PAG] (p44)</p></div><div class="nugget-popup"><p>Sandbags were placed at the rear of a residential property to protect against floodwater entering the rear of the property. (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property (p7)</p></div><div class="nugget-popup quant"><p>one property [MUL] (p9)</p></div><div class="nugget-popup quant"><p>three properties; 50mm depth; 5 incidents (2012&ndash;December 2015); 1 property (02/01/2016); 1 property (03/01/2016); 1 property (07/01/2016); 1 property (09/03/2016) [TAB,MUL] (p12)</p></div><div class="nugget-popup quant"><p>three properties; approximately 50mm depth; approximately five times; one different property on Windmill Close affected on 02/01/16, 03/01/16 and 07/01/16 [PAG,MUL] (p14)</p></div></div></body></div>`)[0];

                var html_40e8a0a981519e9e9de533a1f54e45ac = $(`<div id="html_40e8a0a981519e9e9de533a1f54e45ac" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Paddock Road, Woodford</h1><div class="nugget-popup"><p>Identified as part of the flood incident investigated on 2 January 2016; excess surface water from rainfall on a saturated catchment flowed to low points around private property in the area, contributing to internal flooding of a property within the incident area. (p7)</p></div><div class="nugget-popup"><p>Run&ndash;off from agricultural field ditches flows toward the southwest corner of the Paddock Road housing development. A recently excavated shallow informal ditch (from that corner, along the east boundary of the scrub land) collects this water and conveys it along the rear boundaries of properties, contributing to flooding of those properties. (p11)</p></div><div class="nugget-popup"><p>Surface water runoff from scrub land beyond the rear boundary fence flowed toward the rear of properties, ponded in gardens and around houses (approximately 50mm) and flowed into air bricks. Flooding affected the garage of the property on Paddock Road and caused continual saturated ground and dampness around the property. [PAG,MUL] (p14)</p></div><div class="nugget-popup"><p>Land drainage systems downstream of the Paddock Road housing estate were unable to convey rainwater effectively to larger watercourses, contributing to excess surface water flowing across ground toward private properties. (p15)</p></div><div class="nugget-popup"><p>The formal ditch to the west of Paddock Road and associated drainage/pipework were identified for ownership clarification and investigation; route and condition of pipework were to be checked and maintained to address flood risk. Planning and surface water drainage for the adjacent Paddock Road/Windmill Close development were to be reviewed. [PAG] (p24)</p></div><div class="nugget-popup"><p>Informal temporary ditch to the rear of properties is waterlogged and contains turbid, flowing water used as an ad&ndash;hoc drainage route; muddy, obstructed channel indicates surface water runoff and poor drainage adjacent to property boundaries. [IMG,PAG] (p45)</p></div><div class="nugget-popup"><p>Informal temporary ditch to the rear of properties was waterlogged and carrying muddy, flowing water, indicating runoff/drainage overload affecting rear gardens/properties. [IMG,PAG] (p46)</p></div><div class="nugget-popup"><p>A single line/row of white sandbags was placed at the garage threshold of a residential property to prevent floodwater ingress into the garage. [PAG] (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property (p7)</p></div><div class="nugget-popup quant"><p>one property on Paddock Road; approximately 50mm depth [PAG,MUL] (p14)</p></div></div></body></div>`)[0];

                var html_d54c44d8af08baec1b71d80d3ee29b02 = $(`<div id="html_d54c44d8af08baec1b71d80d3ee29b02" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Mill Road, Woodford</h1><div class="nugget-popup"><p>Mapping indicates a localised area at high risk of surface water flooding to the rear of properties on Mill Road. A surface water public sewer manhole is shown in front of No. 97 Mill Road (with no pipework shown from that point). Ditches discharge to a pipe in a brick headwall at Mill Road, which is part of the flow path conveying water that affects rear boundaries of properties. [PAG] (p11)</p></div><div class="nugget-popup"><p>Surface water overtopped a ditch to the east and flowed into the rear garden causing minor ponding in December 2015. On 11/01/16 the overtopping increased, the pond became much deeper and extended across the width of the garden (ponding located in a depression several metres from the house). [MUL] (p14)</p></div><div class="nugget-popup"><p>Ownership, route and condition of pipework in Mill Road (from the headwall at the end of the formal ditch west of Paddock Road) were identified as unclear and requiring investigation and maintenance to manage flood risk. [PAG] (p24)</p></div></div></body></div>`)[0];

                var html_4f2ee8e57d8af1fbeb2316f10d55577d = $(`<div id="html_4f2ee8e57d8af1fbeb2316f10d55577d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Woodford</h1><div class="nugget-popup"><p>Windmill Close in Woodford is the subject of the Northamptonshire County Council flood investigation report, indicating flooding occurred at this location and was investigated. (p1)</p></div><div class="nugget-popup"><p>Subject of a Northamptonshire County Council flood investigation (report title references Windmill Close, Woodford). (p2)</p></div><div class="nugget-popup"><p>Localised surface water flooding occurred in Woodford on 2 January 2016: moderate rainfall on a saturated catchment with inadequate land drainage caused excess surface water to flow to low points around private properties; one property experienced internal flooding on more than one occasion in the last five years. (p7)</p></div><div class="nugget-popup"><p>A flood incident in the village (Windmill Close) resulted in internal flooding of a residential property; the affected property has flooded on more than one occasion within the past five years. [PAG,MUL] (p9)</p></div><div class="nugget-popup"><p>Moderate rainfall over a saturated catchment led to land drainage systems being unable to convey rainwater, producing excess surface water that flowed to low points around private properties in Woodford. [PAG] (p15)</p></div><div class="nugget-popup"><p>Residents installed temporary, informal drainage systems to protect their properties from flooding during the Flood Incident; residents were identified as being at risk and advised to take protective actions. (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property (p7)</p></div><div class="nugget-popup quant"><p>one property [PAG,MUL] (p9)</p></div></div></body></div>`)[0];
