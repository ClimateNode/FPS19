                var html_8dfe3ce13232b57669b3b403de94df93 = $(`<div id="html_8dfe3ce13232b57669b3b403de94df93" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Woodthorpe Grange Park</h1><div class="nugget-popup"><p>During the 23 July 2013 event surface water runoff from Woodthorpe Grange Park was routed downhill and collected at the low point around Winchester Street/Dornoch Avenue, contributing to rapid overland flows that led to flooding at the junction and along Winchester Street. (p14)</p></div><div class="nugget-popup"><p>The park and surrounding green spaces were likely saturated prior to the storm, increasing runoff that fed primary surface&ndash;water flow paths toward Winchester Street and raised flow volumes and pressure on the public sewer and highway during the storm on 23rd July 2013. [IMG,PAG] (p15)</p></div><div class="nugget-popup"><p>Ground in the park and surrounding green spaces was saturated prior to the storm, increasing surface runoff during the storm on 23rd July 2013. This additional runoff contributed volume to the ordinary watercourse and increased pressure on the public sewer, contributing to flooding on Winchester Street. (p16)</p></div></div></body></div>`)[0];

                var html_878abb913e4b02bc79fdf14227e6de5a = $(`<div id="html_878abb913e4b02bc79fdf14227e6de5a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Nottingham Unitary Authority</h1><div class="nugget-popup"><p>Nottingham contains the Sherwood neighbourhood where the 23 July 2013 flood event occurred; Sherwood roads are listed as impacted. (p1)</p></div><div class="nugget-popup"><p>An intense thunderstorm on the evening of 23 July 2013 caused widespread surface water and sewer flooding across the city, resulting in internal flooding of residential properties and extensive flooding of the highway network. (p4)</p></div><div class="nugget-popup"><p>The northern part of Nottingham City was crossed by an intense storm that initiated the flood event on 23rd July 2013, resulting in surface water flooding across parts of the city. (p12)</p></div><div class="nugget-popup"><p>The Winchester Street area of Nottingham experienced rapid concentrated surface&ndash;water flows down steep streets that converged at a low point, overwhelmed highway gullies, caused sewer network surcharge (photographic evidence of fountains from a stop tap and a manhole) and led to culvert overtopping onto the highway during the storm at about 17:00 on 23rd July 2013. [IMG] (p15)</p></div><div class="nugget-popup"><p>Residents and properties in Nottingham City were affected by flood incidents; funding was sought and allocated to provide property&ndash;level protection (for example flood doors and smart airbricks) to qualifying properties. [PAG] (p29)</p></div><div class="nugget-popup"><p>Storm passing over the city produced excessive surface water that saturated ground and overwhelmed drainage and sewer networks in parts of the city (notably the Sherwood valley), causing internal and external flooding of domestic and commercial properties. [PAG] (p33)</p></div><div class="nugget-popup"><p>Blue&ndash;shaded water accumulation is shown across low&ndash;lying urban areas and adjacent to major roads in the Nottingham map, indicating surface water/urban flooding affecting neighbourhood streets and transport corridors. [IMG] (p38)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 100 residential properties (p4)</p></div><div class="nugget-popup quant"><p>19 residential properties; 1 commercial property (within Sherwood area across Winchester Street, Spondon Street and Haydn Road) [PAG] (p33)</p></div></div></body></div>`)[0];
                popup_0b5ca153840ae5b2bdc1fc012c32d97a.setContent(html_878abb913e4b02bc79fdf14227e6de5a);

                var html_c807ead5680ba3d82be601236364faa6 = $(`<div id="html_c807ead5680ba3d82be601236364faa6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Winchester Street, Sherwood</h1><div class="nugget-popup"><p>Winchester Street is listed as a location impacted by the 23 July 2013 flood event in Sherwood. [IMG] (p1)</p></div><div class="nugget-popup"><p>Internal flooding of properties in the vicinity following the intense storm; reports identify domestic properties and a business in the vicinity suffering internal flooding. (p4)</p></div><div class="nugget-popup"><p>Internal (over the doorstep) flooding occurred within the catchment that includes Winchester Street, resulting in internal flooding of domestic properties and one business. [PAG] (p6)</p></div><div class="nugget-popup"><p>Internal flooding of domestic properties and at least one business within the hydrologically linked catchment that includes Winchester Street; properties experienced internal flooding during the event. [IMG,PAG] (p7)</p></div><div class="nugget-popup"><p>Winchester Street experienced flooding incidents including internal and basement flooding of properties. It was identified as the eastern&ndash;most area affected in the July 23, 2013 flooding incident; historical events include internal flooding of one property (28 June 2012) and basement flooding of one property (5/6 June 2010). [PAG,MUL] (p9)</p></div><div class="nugget-popup"><p>Properties were flooded during and after the intense rainfall on 23rd July 2013 due to rapid overland flow, surcharging of the sewerage system and ponding of surface water; steep catchment topography channelled water towards Winchester Street. (p13)</p></div><div class="nugget-popup"><p>Rapid surface water flow moved downhill along highways and converged on Winchester Street; water collected at the low point at the junction with Dornoch Avenue, causing concentrated surface water flooding along Winchester Street. [PAG] (p14)</p></div><div class="nugget-popup"><p>Surface water flowing rapidly downhill from surrounding high ground converged at the low point on Winchester Street; highway gullies were overwhelmed and unable to drain. The ordinary watercourse that flows behind Cavendish Vale could not freely enter the combined public sewer, causing water to back up, overtop the culvert and flow onto the highway. Photographic evidence shows fountains of water emerging from stop taps and a manhole indicating the public sewer network was at capacity during the storm. [IMG,PAG] (p15)</p></div><div class="nugget-popup"><p>During the storm on 23rd July 2013 floodwater pooled at the low spot on Winchester Street, causing internal flooding of one property and external flooding of at least nine properties. Residents reported external flood depths up to approximately 300mm and water entered the flooded property via air bricks and the front door. Floodwaters receded between half an hour and an hour after the storm. [IMG,PAG] (p16)</p></div><div class="nugget-popup"><p>Highway gullies were overwhelmed on Winchester Street during the same storm, indicating surface&ndash;water flooding on the street. (p18)</p></div><div class="nugget-popup"><p>Internal flooding of one residential property; extensive surface water flooding at the junction with Dornoch Avenue and external flooding of gardens and driveways of nearby properties. [TAB] (p22)</p></div><div class="nugget-popup"><p>Intense rainfall produced large volumes of surface water runoff that overwhelmed drainage, causing localised ponding and internal flooding of properties in the Winchester Street area; flood depths also damaged at least one vehicle. (p23)</p></div><div class="nugget-popup"><p>During the 23 July 2013 storm properties on Winchester Street experienced flooding; residents attempted to block air bricks to stop ingress but measures were overwhelmed or could not be taken by those who were out of their properties. Severn Trent Water modelling identifies hydraulic risk on the public sewer network at Winchester Street. (p24)</p></div><div class="nugget-popup"><p>Flooding on 23rd July 2013 inundated properties. Residents attempted temporary measures (blocking air bricks) which were overwhelmed by the flood volumes. The ordinary watercourse from Woodthorpe Grange Park overwhelmed the inlet to a culvert on Winchester Street and contributed to the flooding. Nottingham City Council subsequently cleared the channel, bank and footpath behind properties to remove impediments to flow. [TAB,PAG] (p25)</p></div><div class="nugget-popup"><p>An ordinary watercourse overwhelmed the inlet to a culvert on Winchester Street during the 23rd July 2013 event and contributed to flooding. The culvert area was investigated; a CCTV survey was carried out and an inspection chamber was de&ndash;silted to restore conveyance into the main combined sewer. [TAB] (p26)</p></div><div class="nugget-popup"><p>Highway gullies on Winchester Street are included in the targeted gully cleansing regime to maintain drainage efficiency during periods of high rainfall; part of the Haydn Road/Winchester Street catchment targeted for additional rainfall monitoring. (p29)</p></div><div class="nugget-popup"><p>Internal and external flooding of domestic and commercial properties when extreme surface water overwhelmed highway drainage and the public sewer network; overtopping of an ordinary watercourse from Woodthorpe Grange Park entered the public sewer via a culvert on Winchester Street, contributing to reverse flow in the sewer. (p33)</p></div><div class="nugget-popup"><p>Winchester Street was included in monitoring after flooding incidents: CCTV cameras were installed to identify interactions between highway drainage, the ordinary watercourse and the public sewer network to inform future mitigation. (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>19 domestic properties; one business (reported across the vicinity of Winchester Street and Haydn Road) (p4)</p></div><div class="nugget-popup quant"><p>19 domestic properties; one business (figures apply across the catchment covering Haydn Road, Winchester Street and surrounding roads) [PAG] (p6)</p></div><div class="nugget-popup quant"><p>19 domestic properties; 1 business (internally flooded across the catchment including Winchester Street) [IMG,PAG] (p7)</p></div><div class="nugget-popup quant"><p>1 property (internal, 28 June 2012); 1 property (basement, 5/6 June 2010) [PAG,MUL] (p9)</p></div><div class="nugget-popup quant"><p>225 mm outlet pipe; 50 l/s estimated maximum flow rate [IMG,PAG] (p15)</p></div><div class="nugget-popup quant"><p>one property; at least 9 properties; 300mm flood depths [IMG,PAG] (p16)</p></div><div class="nugget-popup quant"><p>1 internal property; 9 external properties (on Winchester Street) [TAB] (p22)</p></div><div class="nugget-popup quant"><p>6 properties; 1 vehicle (p23)</p></div><div class="nugget-popup quant"><p>19 residential properties; 1 commercial property (across Winchester Street, Spondon Street and Haydn Road) (p33)</p></div><div class="nugget-popup quant"><p>three CCTV cameras (p34)</p></div></div></body></div>`)[0];
                popup_75947fa7859e889a4b96ba7a7aaae9e5.setContent(html_c807ead5680ba3d82be601236364faa6);

                var html_462c45540ec3cc8906eef96f62468a59 = $(`<div id="html_462c45540ec3cc8906eef96f62468a59" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Spondon Street, Sherwood</h1><div class="nugget-popup"><p>Spondon Street is listed as a location impacted by the 23 July 2013 flood event in Sherwood. (p1)</p></div><div class="nugget-popup"><p>Part of the same hydrologically linked catchment where internal flooding of domestic properties and a business occurred during the event. [IMG,PAG] (p7)</p></div><div class="nugget-popup"><p>Affected by flooding during the event on 23rd July 2013. (p10)</p></div><div class="nugget-popup"><p>Properties were flooded during and after the intense rainfall on 23rd July 2013 due to rapid overland flow, surcharging sewers and ponding of surface water in low&ndash;lying areas. (p13)</p></div><div class="nugget-popup"><p>The map shows primary surface water flow paths branching into side streets including Spondon Street during the 23 July 2013 event; it therefore likely experienced surface water ingress or overland flow from the main Haydn Road/Winchester Street flow paths. [IMG] (p14)</p></div><div class="nugget-popup"><p>Surface water flowed into Spondon Street from the adjacent car park (north side); a property on Spondon Street was internally flooded. Surface water running along Mapperley Street and Mansfield Street likely increased volumes entering Spondon Street due to local topography. [PAG] (p17)</p></div><div class="nugget-popup"><p>Internal flooding of one retail premises due to surface water from surrounding areas. [TAB] (p22)</p></div><div class="nugget-popup"><p>Intense rainfall and overwhelmed highway/public sewer drainage caused surface water to pond in low&ndash;lying areas of Spondon Street, contributing to internal flooding of properties in the affected area. (p23)</p></div><div class="nugget-popup"><p>Car park drainage on the north side of Spondon Street was not acting efficiently and contributed to flooding; this led to cleaning and improvement works and ongoing gully maintenance. [TAB] (p27)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties when excessive surface water from the storm overwhelmed highway drainage and the public sewer network within the local catchment. (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>19 domestic properties; 1 business (internally flooded across the catchment including Spondon Street) [IMG,PAG] (p7)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p17)</p></div><div class="nugget-popup quant"><p>1 internal premise [TAB] (p22)</p></div><div class="nugget-popup quant"><p>6 properties (p23)</p></div><div class="nugget-popup quant"><p>19 residential properties; 1 commercial property (across Winchester Street, Spondon Street and Haydn Road) (p33)</p></div></div></body></div>`)[0];
                popup_925ba11deb22e8bcc26fe02832c6357d.setContent(html_462c45540ec3cc8906eef96f62468a59);

        var popup_fae458b1e882f7fc412adb0a29c0937f = L.popup({});

        
            
                var html_b0560bf1edb8b63083780795cae29b85 = $(`<div id="html_b0560bf1edb8b63083780795cae29b85" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Haydn Road, Old Basford</h1><div class="nugget-popup"><p>Haydn Road is listed as a location impacted by the 23 July 2013 flood event in Sherwood. [IMG] (p1)</p></div><div class="nugget-popup"><p>Internal flooding of properties in the vicinity following the intense storm; reports identify domestic properties and a business in the vicinity suffering internal flooding. (p4)</p></div><div class="nugget-popup"><p>Internal (over the doorstep) flooding occurred within the catchment that includes Haydn Road, resulting in internal flooding of domestic properties and one business. [PAG] (p6)</p></div><div class="nugget-popup"><p>Haydn Road lies along the bottom of the valley within the catchment and is identified as a flood location; domestic properties and a business within the catchment experienced internal flooding. [IMG,PAG] (p7)</p></div><div class="nugget-popup"><p>Haydn Road and its local sewer infrastructure were implicated in repeated flooding incidents. Historical incidents affecting the Haydn Road area include internal flooding at Moores Place (on Haydn Road) with two properties internally flooded on 6 July 2009 and six properties internally flooded on 5/6 June 2010. The Haydn Road depot contains two 6000 m3 offline storage tanks intended to reduce sewer flooding; tank monitoring limitations were noted at the time of the July 23, 2013 incident. [PAG,MUL] (p9)</p></div><div class="nugget-popup"><p>Properties were flooded during and after the intense rainfall on 23rd July 2013 as a result of rapid overland flow, surcharging of the sewerage system and surface water ponding; steep topography channelled flow towards Haydn Road. (p13)</p></div><div class="nugget-popup"><p>The map and investigation indicate Haydn Road was a primary west&ndash;to&ndash;east surface water flow path during the 23 July 2013 event; surface water moved along Haydn Road into the investigation area, feeding the converging flows that caused flooding on nearby roads. [IMG] (p14)</p></div><div class="nugget-popup"><p>Map and image description show primary surface water flow paths crossing Haydn Road, indicating surface water movement across the road during the investigated event. (p17)</p></div><div class="nugget-popup"><p>Surface water flowed rapidly downhill into Haydn Road; the combined sewer system was capacity&ndash;exceeded causing manholes to surcharge (one manhole was ripped from the carriageway and required emergency repair). Sewage was present in the flood waters. Highway gullies were overwhelmed and acted in reverse, debris and soil reduced gully function, road surfaces on surrounding streets were damaged, and pooled water breached kerbs and flooded properties on Haydn Road. [PAG] (p18)</p></div><div class="nugget-popup"><p>High&ndash;velocity surface water flowed along steep surrounding roads into the valley bottom at Haydn Road, ponding at a former railway bridge underpass. The flood overtopped a low (~0.6 m) flood wall and properties experienced internal flooding; highway gullies were overwhelmed and unable to drain the flow, and water could not escape from the rear of ground floors, causing accumulation. [IMG,PAG] (p20)</p></div><div class="nugget-popup"><p>Combination of surface water and surcharging public sewers caused internal flooding of properties west of Hucknall Road. Floodwater (containing sewage) entered properties through front doors, air bricks, windows and via surcharging internal toilets; a ground&ndash;floor toilet was reported to work in reverse allowing sewage into a property. [IMG,PAG] (p21)</p></div><div class="nugget-popup"><p>East of Hucknall Road: sewer flooding emerging from a Severn Trent Water manhole and highway drainage plus surface water ponding caused internal flooding of neighbouring properties, severe road damage from a ripped&ndash;out sewer cover and at least one vehicle damaged. West of Hucknall Road: surface water and sewer flooding caused internal flooding of properties and overtopping of a flood wall; at least one vehicle damaged. [TAB] (p22)</p></div><div class="nugget-popup"><p>Surface water runoff from intense rainfall overwhelmed drainage systems causing ponding and contributing to internal flooding of properties in the Haydn Road area. (p23)</p></div><div class="nugget-popup"><p>On 23 July 2013 flood volumes overwhelmed temporary measures (sandbags, blocked air bricks), flood gates and door barriers on Haydn Road; properties were not protected and were flooded. Some residents were unable to take preventative action due to the timing and fast onset of the flood. (p24)</p></div><div class="nugget-popup"><p>Flooding on 23rd July 2013 inundated properties. Residents east of Hucknall Road used sandbags to block air bricks and doorways; residents west of Hucknall Road closed flood gates and installed flood barriers on front doors, but these measures were overwhelmed by the storm's flood volume. Some residents were absent during the storm and could not take preventative measures. [TAB,PAG] (p25)</p></div><div class="nugget-popup"><p>The storm on 23rd July 2013 breached the flood wall at Moores Place and resulted in flooding affecting the Haydn Road area. Remedial and protective works include installation of flood&ndash;resistant doors, smart airbricks and non&ndash;return valves on properties, construction of a new 1.6 m reinforced flood defence wall and flood gates (Aug&ndash;Sep 2014), underground storage east of Moores Place to hold stormwater, a soakaway strip between Warren Avenue and Ellesmere Crescent, and enlarged highway gullies with direct connections into Severn Trent Water's trunk sewer. Severn Trent Water also fitted telemetry to storage tanks in Nov 2013 to monitor performance. [PAG,MUL] (p27)</p></div><div class="nugget-popup"><p>Haydn Road experienced surface water entering the highway and public sewer during the 23 July 2013 event; to reduce future risk the highway gullies near Moores Place were replaced with larger gully pots with direct connections into the trunk sewer, underground storage was constructed upstream, and overflow storage tanks on Haydn Road provide relief to the downstream sewer network. [TAB,PAG] (p28)</p></div><div class="nugget-popup"><p>Location of the Severn Trent Water depot whose overflow storage tanks required a telemetry alarm after storm overflows; included in gully maintenance under the targeted cleansing regime and within the Haydn Road/Winchester Street catchment for a new rain gauge to monitor storm response. (p29)</p></div><div class="nugget-popup"><p>Internal and external flooding of properties when extreme surface water overwhelmed highway drainage and the public sewer network; capacity of the public sewer network was exceeded during the storm peak. (p33)</p></div><div class="nugget-popup"><p>Haydn Road was monitored with CCTV following flooding incidents and received highway drainage improvements: creation of large gullies, installation of underground storage and a soakaway to store and infiltrate stormwater. (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>19 domestic properties; one business (reported across the vicinity of Winchester Street and Haydn Road) (p4)</p></div><div class="nugget-popup quant"><p>19 domestic properties; one business (figures apply across the catchment covering Haydn Road, Winchester Street and surrounding roads) [PAG] (p6)</p></div><div class="nugget-popup quant"><p>19 domestic properties; 1 business (internally flooded across the catchment including Haydn Road) [IMG,PAG] (p7)</p></div><div class="nugget-popup quant"><p>2 properties (internal, 6 July 2009); 6 properties (internal, 5/6 June 2010) [PAG,MUL] (p9)</p></div><div class="nugget-popup quant"><p>one manhole [PAG] (p18)</p></div><div class="nugget-popup quant"><p>approximately 900mm internal flooding [IMG,PAG] (p20)</p></div><div class="nugget-popup quant"><p>6 properties; 900mm internal flood depths [IMG,PAG] (p21)</p></div><div class="nugget-popup quant"><p>12 internal properties (east of Hucknall Road); 6 internal properties (west of Hucknall Road); at least 1 vehicle damaged (east); at least 1 vehicle damaged (west); 1 public sewerage cover and frame ripped out [TAB] (p22)</p></div><div class="nugget-popup quant"><p>6 properties (p23)</p></div><div class="nugget-popup quant"><p>19 residential properties; 1 commercial property (across Winchester Street, Spondon Street and Haydn Road) (p33)</p></div><div class="nugget-popup quant"><p>three CCTV cameras (p34)</p></div></div></body></div>`)[0];

                var html_48f2bb6f972e7a28816ff0c8a122e1ff = $(`<div id="html_48f2bb6f972e7a28816ff0c8a122e1ff" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Sherwood</h1><div class="nugget-popup"><p>The Sherwood neighbourhood is identified as the area where the 23 July 2013 flood event occurred, affecting main roads including Haydn Road, Winchester Street and Spondon Street. [IMG] (p1)</p></div><div class="nugget-popup"><p>Internal flooding of domestic properties (in the vicinity of Winchester Street and Haydn Road) as part of the wider storm event that caused city&ndash;wide surface water and sewer flooding. (p4)</p></div><div class="nugget-popup"><p>Area of Sherwood (including Winchester Street and Spondon Street) formed part of the hydrologically linked catchment where internal flooding of domestic properties and a business occurred during the event. [PAG] (p7)</p></div><div class="nugget-popup"><p>Sherwood was impacted by the intense storm during which the flood event began on 23rd July 2013; the area experienced surface water flooding associated with that storm. (p12)</p></div><div class="nugget-popup"><p>The flood investigation area is located within a section of Sherwood. During the 23 July 2013 event primary surface water flow paths concentrated along key roads (Haydn Road and Winchester Street) producing urban surface water flooding in the neighbourhood and concentrating flows at low points such as the junction of Dornoch Avenue and Winchester Street. [IMG] (p14)</p></div><div class="nugget-popup"><p>Surface water flooding in the Sherwood neighbourhood concentrated around Spondon Street and the adjacent car park. Surface water pooled where gullies became overwhelmed/blocked and flowed from the car park and along Mapperley Street and Mansfield Street into Spondon Street. Pooling at the west end of the car park led to internal flooding of a commercial property. Flood waters were reported as surface water with no sewage present. [IMG] (p17)</p></div><div class="nugget-popup"><p>Multiple locations in Sherwood experienced surface water and sewer&ndash;related flooding affecting residential and retail properties, road surfaces and vehicles. [TAB] (p22)</p></div><div class="nugget-popup"><p>Low&ndash;lying valley area experienced rapid conveyance of surface water from surrounding high ground, overwhelming highway drainage and public sewers and resulting in internal and external flooding of domestic and commercial properties within the Sherwood area. (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>19 domestic properties; one business (reported across the vicinity of Winchester Street and Haydn Road) (p4)</p></div><div class="nugget-popup quant"><p>19 domestic properties; 1 business (internally flooded across the catchment within Sherwood and adjoining streets) [PAG] (p7)</p></div><div class="nugget-popup quant"><p>one commercial property [IMG] (p17)</p></div><div class="nugget-popup quant"><p>20 internal properties; 10 external properties; at least 2 vehicles damaged [TAB] (p22)</p></div><div class="nugget-popup quant"><p>19 residential properties; 1 commercial property (within Sherwood across Winchester Street, Spondon Street and Haydn Road) (p33)</p></div></div></body></div>`)[0];
