                var html_ec3d5f5801bcee6e9bdbd28a11ccb7fe = $(`<div id="html_ec3d5f5801bcee6e9bdbd28a11ccb7fe" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Harper's Brook</h1><div class="nugget-popup"><p>High water levels in Harpers Brook caused overtopping onto local roads (notably Grafton Road and Sudborough Road) leading to highway flooding and internal flooding of properties. Harpers Brook flooding was the source of multiple incidents including internal flooding of properties and a community building, and repeated highway inundation that required sandbags and other temporary protection measures. [TAB,MUL] (p11)</p></div><div class="nugget-popup"><p>Water level rose (reported approximately six feet), overtopped banks and flowed onto roads and private property; a spillway channel came into partial use and the outflow contributed to deeper water on adjacent roads and properties. (p12)</p></div><div class="nugget-popup"><p>Water levels rose up against a building downstream of Grafton Road bridge, reaching two stone courses above the blue band of bricks on that building. [IMG,PAG] (p40)</p></div><div class="nugget-popup"><p>Areas of siltation were observed on Harpers Brook upstream of Grafton Road bridge following the flood event. [IMG,PAG] (p41)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>three residential properties; community building; flooding 3 feet deep in community building; three properties on Sudborough Road; one property on Grafton Road [TAB,MUL] (p11)</p></div><div class="nugget-popup quant"><p>approximately six feet rise in water level (p12)</p></div><div class="nugget-popup quant"><p>two stone courses above the blue band of bricks [IMG,PAG] (p40)</p></div><div class="nugget-popup quant"><p>two stone courses above the blue band of bricks [IMG] (p41)</p></div></div></body></div>`)[0];

                var html_733d9b483b600c0c4be09d3476a20b19 = $(`<div id="html_733d9b483b600c0c4be09d3476a20b19" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Grafton Road, Brigstock</h1><div class="nugget-popup"><p>Internal flooding of a private property: surface water entered the building as a result of heavy rainfall on a saturated catchment and overwhelmed local drainage, with excess water flowing over ground to low points around the property. [MUL] (p7)</p></div><div class="nugget-popup"><p>Internal flooding of a property on Grafton Road; the same property has experienced internal flooding on more than one occasion within the preceding five years. (p9)</p></div><div class="nugget-popup"><p>Repeated highway flooding around property on Grafton Road caused by high water levels in Harpers Brook overtopping onto the road; one property on Grafton Road was internally flooded and bow waves from vehicles exacerbated flooding of properties. [TAB,MUL] (p11)</p></div><div class="nugget-popup"><p>Area adjacent to the Grafton Road bridge over Harpers Brook sits low; water leaving the brook flowed onto the road and surrounding area and rose until it entered residential properties. One property on Grafton Road was internally flooded. [PAG] (p12)</p></div><div class="nugget-popup"><p>The road junction at the intersection (Grafton Road/Sudborough Road) showed ponding/standing water during the event, affecting the immediate carriageway and verge areas. [IMG] (p42)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property [MUL] (p7)</p></div><div class="nugget-popup quant"><p>1 property (p9)</p></div><div class="nugget-popup quant"><p>1 property internally flooded [TAB,MUL] (p11)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p12)</p></div></div></body></div>`)[0];

                var html_eac733467c512c8a8de08a1fd8f77665 = $(`<div id="html_eac733467c512c8a8de08a1fd8f77665" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Sudborough Road, Brigstock</h1><div class="nugget-popup"><p>Internal flooding of properties on Sudborough Road caused by high water levels in Harpers Brook overtopping onto the road; bow waves from passing vehicles exacerbated flooding of properties. [TAB] (p11)</p></div><div class="nugget-popup"><p>Water flowing from Harpers Brook onto Sudborough Road accumulated in low areas and deepened until it entered residential properties, causing internal flooding; one household installed a flood gate across their frontage (not tested). (p12)</p></div><div class="nugget-popup"><p>Areas of ponding occurred on Sudborough Road, with standing water affecting the road and properties visible from Grafton Road bridge. [IMG,PAG] (p42)</p></div><div class="nugget-popup"><p>Areas of ponding/standing water formed on the carriageway adjacent to properties. Roadside channel drainage within the carriageway was partially filled with debris, reducing drainage capacity and contributing to the ponding; access to the frontage of properties on Sudborough Road was affected by the standing water. [IMG,PAG] (p43)</p></div><div class="nugget-popup"><p>Areas of ponding observed on the carriageway; channel drainage systems cut into the carriageway were recorded (evidence of surface water ponding and drainage intervention on the road). [IMG,PAG] (p44)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Three properties [TAB] (p11)</p></div><div class="nugget-popup quant"><p>3 properties internally flooded (p12)</p></div></div></body></div>`)[0];

                var html_f5f95a71f2ad65f6bdd4837eeb03a606 = $(`<div id="html_f5f95a71f2ad65f6bdd4837eeb03a606" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Brigstock</h1><div class="nugget-popup"><p>Subject of a Northamptonshire County Council flood investigation concerning flooding at Grafton Road. (p2)</p></div><div class="nugget-popup"><p>Surface water from heavy rainfall on a saturated catchment flowed to low points around private property in the village, resulting in internal flooding of at least one property on Grafton Road. [MUL] (p7)</p></div><div class="nugget-popup"><p>Location of a flood incident on Grafton Road in which a property was internally flooded; the property experienced repeated internal flooding events within the last five years. [PAG] (p9)</p></div><div class="nugget-popup"><p>A flooding incident occurred in the village on 9th March 2016. The British Geological Survey dataset indicates the incident was in an area with potential for groundwater flooding to occur at surface level; affected residents within the village were interviewed about the event. [PAG] (p10)</p></div><div class="nugget-popup"><p>Areas of the village experienced flooding from Harpers Brook and surface water. Recorded impacts include internal flooding of residential properties (multiple incidents), a community building flooded to about 3 feet deep, floodwater reaching near the High Street area, the cricket pitch flooded up to the pavilion, structural failure (walls) on Kennel Hill leading to further local flooding, and use of sandbags/air&ndash;brick covers to protect community and medical facilities. [MUL] (p11)</p></div><div class="nugget-popup"><p>Harpers Brook rose and flowed over its banks onto roads and private property in Brigstock; surface water followed natural contours to low points around properties, entering residences and causing internal flooding in nearby homes. [PAG] (p12)</p></div><div class="nugget-popup"><p>Heavy rainfall on a saturated catchment and high water levels in Harpers Brook overwhelmed drainage and watercourses, causing excess surface water to flow over ground to low points around private properties and resulting in internal flooding. Bow waves from vehicles driving through floodwater exacerbated internal flooding to properties. (p13)</p></div><div class="nugget-popup"><p>The map shows blue shaded flood zones overlapping the village centre; two red&ndash;circled locations on the main road lie adjacent to the primary water feature, indicating parts of Brigstock were within mapped flood areas and likely experienced surface&ndash;water flooding during the investigated event. [IMG] (p31)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property [MUL] (p7)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p9)</p></div><div class="nugget-popup quant"><p>three residential properties; community building; flooding 3 feet deep in community building; three properties on Sudborough Road; one property on Grafton Road [MUL] (p11)</p></div><div class="nugget-popup quant"><p>3 properties on Sudborough Road; 1 property on Grafton Road (internally flooded) [PAG] (p12)</p></div></div></body></div>`)[0];
