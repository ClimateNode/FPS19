                var html_e764e8815282ce66f4fe4e4356a6e9c5 = $(`<div id="html_e764e8815282ce66f4fe4e4356a6e9c5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Day Brook</h1><div class="nugget-popup"><p>The Day Brook rose sharply and overtopped its banks, causing fluvial flooding of Athorpe Grove. (p4)</p></div><div class="nugget-popup"><p>The Day Brook (adjacent to Athorpe Grove) overtopped the channel wall and caused internal flooding of properties on Athorpe Grove. (p7)</p></div><div class="nugget-popup"><p>A sharp rise in the water level of the Day Brook during the intense fourth rainfall event contributed to flooding of downstream properties (including Athorpe Grove) by increasing discharge and overtopping/local inundation. (p9)</p></div><div class="nugget-popup"><p>The Day Brook overtopped its banks/walls during the event, causing floodwater to pass over the rear wall of properties on Athorpe Grove and initiate the flooding described. [IMG] (p11)</p></div><div class="nugget-popup"><p>Fast&ndash;responding watercourse that caused flooding in the local catchment; prompted Blue&ndash;Green infrastructure works (Jubilee Ponds, Valley Road Park, Jason Spencer Sports Ground) and property&ndash;level resilience measures to reduce future ingress and give residents time to prepare. [PAG] (p13)</p></div><div class="nugget-popup"><p>A rapid rise in Day Brook water levels on 12 June 2019 caused the watercourse to overtop and breach its walls, producing flooding onto Athorpe Grove and into residential properties. (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than 5 properties reported internal flooding (p4)</p></div><div class="nugget-popup quant"><p>9 properties (p7)</p></div><div class="nugget-popup quant"><p>1.205 m recorded river level [IMG] (p11)</p></div><div class="nugget-popup quant"><p>9 residential properties (p17)</p></div></div></body></div>`)[0];

                var html_df53021c69a06ef284a30805cf9ae1ff = $(`<div id="html_df53021c69a06ef284a30805cf9ae1ff" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Athorpe Grove, Old Basford</h1><div class="nugget-popup"><p>Subject/location of the Section 19 flood investigation following flooding reported during the 12 June 2019 flood event. [PAG] (p1)</p></div><div class="nugget-popup"><p>Day Brook overtopped and flooded Athorpe Grove, causing internal flooding to properties on the street. [PAG] (p4)</p></div><div class="nugget-popup"><p>Properties on Athorpe Grove were flooded. The report recommends installing Property Level Resilience (PLR) measures to affected properties as part of wider Day Brook corridor improvements; Nottingham City Council and the Environment Agency will seek to improve maintenance of local drainage and the watercourse. [PAG] (p5)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties on Athorpe Grove. [PAG] (p6)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties on Athorpe Grove. [PAG] (p7)</p></div><div class="nugget-popup"><p>Properties on Athorpe Grove were flooded during and after the heavy rainfall event; flooding occurred at about 20:30 on 12/06/2019, caused by high runoff and elevated water levels in the nearby Day Brook. [PAG] (p9)</p></div><div class="nugget-popup"><p>Properties on Athorpe Grove experienced internal flooding from both the rear and the front during and after heavy rainfall on 12th June 2019. High water levels in the Day Brook overtopped and damaged the rear boundary wall, creating a flow route into rear gardens. Water then travelled through an alleyway to the front of properties where it pooled at the lowest point. Low door thresholds allowed water ingress. Road gullies were unable to drain standing water (later found to be blocked) so floodwater remained above some property thresholds until gullies were cleared. [PAG] (p10)</p></div><div class="nugget-popup"><p>Day Brook overtopped a rear wall to the properties, the floodwater damaged the wall allowing more water to pass. Water continued to overtop at the rear, flowed through an alley to the front low point where it pooled, and entered properties through low door thresholds causing internal flooding from both rear and front. Road gullies were blocked so water at the front remained above property thresholds until the gullies were unblocked. [PAG] (p11)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties with displacement of occupants; unrepairable damage to furniture, furnishings, floorboards and carpets; external garden damage (outdoor furniture, decking, planting); floodwater damaged the wall separating the watercourse and Athorpe Grove. [PAG] (p12)</p></div><div class="nugget-popup"><p>Street and adjacent properties were affected by the Day Brook channel running beside Athorpe Grove; options considered include diverting and re&ndash;profiling the Day Brook away from Athorpe Grove, creation of embankments and wetlands, and increased maintenance to remove obstructions and reduce flood flow towards the street. [PAG] (p13)</p></div><div class="nugget-popup"><p>Flood flow affected Athorpe Grove due to reduced channel capacity and obstructions in the Day Brook; inaccessible derelict land and vegetation on the brook contributed to water being routed toward Athorpe Grove. Recommended clearance (tree and bush works up to 8 m from the left bank) and improved access for EA maintenance to remove obstructions and allow water to pass away from Athorpe Grove. [PAG] (p14)</p></div><div class="nugget-popup"><p>Rapid rise in water levels in the Day Brook caused the watercourse walls to breach and flood Athorpe Grove, resulting in internal flooding of residential properties. [PAG] (p16)</p></div><div class="nugget-popup"><p>A rapid rise in the Day Brook breached the watercourse walls and flooded Athorpe Grove. Internal flooding occurred in residential properties; blocked road gullies prevented drainage and exacerbated the flooding. [PAG] (p17)</p></div><div class="nugget-popup"><p>Properties in the Athorpe Grove area were affected by flooding associated with Day Brook / surface water. Responses recorded include placing gullies on the Targeted Gully Cleaning Routes, installation of property&ndash;level resilience measures to affected properties, and undertaking a Flood Risk Management Scheme for the area. [TAB,PAG] (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than 5 properties reported internal flooding [PAG] (p4)</p></div><div class="nugget-popup quant"><p>9 properties [PAG] (p6)</p></div><div class="nugget-popup quant"><p>9 properties [PAG] (p7)</p></div><div class="nugget-popup quant"><p>9 properties [PAG] (p12)</p></div><div class="nugget-popup quant"><p>9 residential properties [PAG] (p16)</p></div><div class="nugget-popup quant"><p>9 residential properties [PAG] (p17)</p></div></div></body></div>`)[0];
