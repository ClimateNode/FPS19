                var html_23a23c81696be0e466a6389733f0f4b8 = $(`<div id="html_23a23c81696be0e466a6389733f0f4b8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Milton Keynes Unitary Authority</h1><div class="nugget-popup"><p>Reported internal property flooding affected at least 315 houses, the Hospital and a number of business premises. Debris and leaf litter were observed on gully inlets, which may have restricted gully functioning. (p9)</p></div><div class="nugget-popup"><p>Heavy rainfall overwhelmed the drainage network, causing surface water to gravitate to local low points and resulting in internal flooding of residential properties. Evidence of sewer surcharging was observed, damaging the overlying pavement. (p10)</p></div><div class="nugget-popup"><p>On the evening of 27 May 2018 significant rainfall across parts of Milton Keynes caused flooding across multiple areas, resulting in ingress to residential properties and commercial premises across the borough. [PAG] (p13)</p></div><div class="nugget-popup"><p>Numerous residential estates experienced internal and external flooding during the event; household items and carpets were left outside showing water damage, rack marks from floating debris and wicking on brickwork were observed during post&ndash;event site visits indicating internal inundation of properties. [PAG] (p16)</p></div><div class="nugget-popup"><p>On 27 May 2018 an intense, short&ndash;duration convective storm tracked over central Milton Keynes producing surface&ndash;water/urban flooding. Runoff accumulated in local topographic depressions, with properties located in those depressions being inundated; Property Level Protection (PLP) was identified as potentially beneficial to reduce impacts. (p35)</p></div><div class="nugget-popup"><p>Heavy rainfall overwhelmed the drainage network causing surface water to gravitate to low points in the topography and enter properties; evidence of sewer surcharging was observed causing pavement damage. [PAG] (p40)</p></div><div class="nugget-popup"><p>Significant widespread flooding occurred across Milton Keynes, producing multiple incidents that met the thresholds for formal flood investigation and triggering site meetings, data collection (photos, video, eyewitness statements) and the production of Flood Investigation Reports to determine contributing factors and responsibilities. (p45)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>315 houses (p9)</p></div><div class="nugget-popup quant"><p>over 315 residential properties (p10)</p></div><div class="nugget-popup quant"><p>over 315 residential properties; 1 hospital [PAG] (p13)</p></div><div class="nugget-popup quant"><p>Bletchley: 6 properties; Bradwell Common: 1 property; Cmk: 2 properties; Conniburrow: 1 property; Downs Barn: 2 properties; Eaglestone: 2 properties; Fishermead: 2 properties; Galley Hill: 1 property; Granby: 1 property; Great Linford: 4 properties; Heelands: 1 property; Kents Hill: 1 property; Lakes Estate: 11 properties; Leadenhall: 4 properties; Neath Hill: 16 properties; Peartree Bridge: 2 properties; Pennyland: 1 property; Springfield: 1 property; Stony Stratford: 1 property; Tinkers Bridge: 4 properties [PAG] (p16)</p></div><div class="nugget-popup quant"><p>at least 315 houses [PAG] (p40)</p></div></div></body></div>`)[0];

                var html_9a6c2580220dcc6cb97ec79047ea427e = $(`<div id="html_9a6c2580220dcc6cb97ec79047ea427e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cairngorm Gate, Milton Keynes Unitary Authority</h1><div class="nugget-popup"><p>Location of a pipe burst where escaped water caused localised collapse and subsidence of a paved area; paving was displaced and substrate exposed. [IMG] (p8)</p></div><div class="nugget-popup"><p>The pipe burst undermined an area of interlocking paving, causing subsidence, displacement of paving blocks and localized structural damage requiring repair. (p33)</p></div><div class="nugget-popup"><p>Road gully inlets at Cairngorm Gate were observed to be covered by leaf litter, twigs and other detritus, which reduced gully capacity and may have impeded drainage. This partial or complete blockage is identified as a contributing factor to surface water / urban flooding during the flood event, potentially increasing runoff and the likelihood of nearby property flooding. [IMG] (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>300 mm deep floodwater within retail units [IMG,PAG] (p33)</p></div></div></body></div>`)[0];

                var html_e2b20455a1d208d9becc2ef07614f6e5 = $(`<div id="html_e2b20455a1d208d9becc2ef07614f6e5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Daniels Welch, Coffee Hall</h1><div class="nugget-popup"><p>Indicators of surface water flooding were observed on these roads; Daniels/Welch in particular showed significant evidence of flooding affecting properties (e.g. carpets removed and placed in front gardens to dry/dispose). (p21)</p></div><div class="nugget-popup"><p>Floodwater entered front gardens and exceeded door thresholds on the left&ndash;hand side properties; carpets were removed and placed in front gardens to dry/dispose; water levels exceeded the damp&ndash;proof course and, given front&ndash;facing air bricks, internal water ingress into properties is likely. (p22)</p></div><div class="nugget-popup"><p>Surface&ndash;water flooding concentrated in the low ground at the front of residential properties on the low (eastern) side of the road. Observed evidence shows four distinct clusters of flooding along the street, with flooding on both sides in the northern cluster. An interim drainage channel was observed adjacent to house number 141. [IMG,PAG] (p24)</p></div><div class="nugget-popup"><p>Flooding occurred within the low ground at the front of residential properties on the low side of the road, inundating front gardens/entrances and causing local surface water accumulation. (p25)</p></div><div class="nugget-popup"><p>Experienced an extreme short&ndash;duration rainfall event on 27 May 2018 that is considered very likely to have produced surface water flooding at/around the street (data point reported for the event). [TAB] (p36)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>100 mm to 200 mm exceedance of door thresholds (p22)</p></div><div class="nugget-popup quant"><p>Addresses 121&ndash;141; 145&ndash;175; 213&ndash;233; four clusters [IMG,PAG] (p24)</p></div><div class="nugget-popup quant"><p>Return Period 1 in 602 years [TAB] (p36)</p></div></div></body></div>`)[0];
