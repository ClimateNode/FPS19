                var html_3ed1b84789c1abd1add1c6587e6edc28 = $(`<div id="html_3ed1b84789c1abd1add1c6587e6edc28" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Sunningwell Road, Sunningwell</h1><div class="nugget-popup"><p>The watercourse through the centre of the village was overwhelmed and overland flow from uphill passed through gardens, garages and properties toward the watercourse; properties on Sunningwell Road were affected by floodwater. Report notes flood extents on this event were worse than July 2007 and recommends installing a bypass/overflow at the village green pond to reduce pressure on properties on Sunningwell Road. [TAB] (p2)</p></div><div class="nugget-popup"><p>Flow along the watercourse through/adjacent to Sunningwell Road placed pressure on properties; measures such as a bypass/overflow channel and increased pond capacity are proposed to reduce that flood pressure. (p3)</p></div><div class="nugget-popup"><p>Location at the Penn Lane / Sunningwell Road junction near which a property experienced sewer backflow. (p4)</p></div><div class="nugget-popup"><p>Floodwater flowed along Sunningwell Road where it enters the village from the north; in parts flow reached knee depth. Pond overflow and overland flow caused water to run along the road and back through properties' gardens and garages. (p11)</p></div><div class="nugget-popup"><p>A 600mm diameter culvert carrying the watercourse under Sunningwell Road was reported as being blocked during the event; this reported blockage prompted inspection. The inspection found no capacity concerns with the culvert, but the reported blockage indicates it contributed to local flow restriction during the flood. (p16)</p></div><div class="nugget-popup"><p>Flow from the watercourse passed under Sunningwell Road through culverts, contributed to overland flows into properties and gardens, and the nearby foul sewer network overloaded causing internal flooding in the area. A downstream 900mm culvert running from the village pond into rear gardens was heavily silted, reducing hydraulic capacity and contributing to local flooding and flow restrictions. [PAG] (p18)</p></div><div class="nugget-popup"><p>Area around the Penn Lane / Sunningwell Road junction experienced foul (sewer) flooding when surface water entered the foul sewer network during the 31 Mar&ndash;1 Apr 2023 event, contributing to capacity failure and property flooding in the vicinity. [PAG] (p19)</p></div><div class="nugget-popup"><p>Flood flows and pond/ watercourse pressures moved through the highway and through properties on Sunningwell Road; flows were noted to connect under the main road (via a 375mm culvert), contributing to inundation of the road and adjacent properties. [TAB,PAG] (p25)</p></div><div class="nugget-popup"><p>Flows from the local watercourse/pond/culvert overwhelmed conveyance and flowed through properties on Sunningwell Road; pond outfall and culvert silt/restriction and reduced check&ndash;dam storage increased flow through properties, prompting recommendations for a bypass/overflow channel and increased pond and ditch storage. (p26)</p></div><div class="nugget-popup"><p>Flow from a field ditch to the east conveyed under the main road via a 375mm diameter culvert contributed to flood flows across/under the road; proposal to increase ditch storage to reduce flow through the culvert and modelling of drainage/catchments recommended. [PAG] (p27)</p></div><div class="nugget-popup"><p>Muddy, swollen watercourse running through the back garden with visibly high water levels reaching the garden steps; evidence of recent flooding that poses flood risk to the property and garden area. [IMG] (p41)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property (p4)</p></div><div class="nugget-popup quant"><p>375mm diameter culvert [PAG] (p27)</p></div></div></body></div>`)[0];

                var html_f48adbb1d54178de056b868ae712cc60 = $(`<div id="html_f48adbb1d54178de056b868ae712cc60" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Pen Lane, Sunningwell</h1><div class="nugget-popup"><p>Location near the Penn Lane / Sunningwell Road junction where a property experienced backflow from the sewer system. (p4)</p></div><div class="nugget-popup"><p>Foul sewer backed up at the Sunningwell Road / Penn Lane (sic) junction causing flooding of a nearby garden and an adjacent property due to hydraulic overload of the foul sewer. (p11)</p></div><div class="nugget-popup"><p>The foul sewer network overloaded during the rainfall event causing flooding within the village, particularly affecting the Penn Lane / Sunningwell Road area. A non&ndash;return valve intended to protect a property close to the Penn Lane / Sunningwell Road junction was installed in the wrong chamber and did not provide the intended protection. [PAG] (p18)</p></div><div class="nugget-popup"><p>Foul sewers overloaded during the 31 Mar&ndash;1 Apr 2023 rainfall, causing foul (sewer) flooding in the Penn Lane / Sunningwell Road area. A non&ndash;return valve intended to protect a property close to the Penn Lane / Sunningwell Road junction was installed in the wrong chamber and will not provide the intended protection unless repositioned. [PAG] (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property (p4)</p></div><div class="nugget-popup quant"><p>1 garden; 1 property (p11)</p></div></div></body></div>`)[0];

                var html_af89601478f6063724e1c7d631ee6bbd = $(`<div id="html_af89601478f6063724e1c7d631ee6bbd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bullsmead, Sunningwell</h1><div class="nugget-popup"><p>Bullsmead was affected by floodwater from the pond overflow and overland flow; foul drains in Bullsmead were overwhelmed, causing foul&ndash;water contamination of the floodwater and problems with ground&ndash;floor appliances in homes. (p11)</p></div><div class="nugget-popup"><p>The foul sewer network was overloaded during the event, causing flooding in the Bullsmead area of the village. (p18)</p></div></div></body></div>`)[0];

                var html_cabfe5c785f337bb81f15efe1d554555 = $(`<div id="html_cabfe5c785f337bb81f15efe1d554555" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Oxfordshire</h1><div class="nugget-popup"><p>Exceptionally heavy rainfall and overland flow overwhelmed the watercourse through the centre of Sunningwell. Highway grips and gullies were full of silt and highway drainage was impaired; highway flooding occurred and highway drainage assets (including the main twin 600mm diameter sewers linking to the village green) were desilted by the highway authority following the event. [TAB] (p2)</p></div><div class="nugget-popup"><p>Oxfordshire Highways arranged inspection and clearance of silt from culverts under Sunningwell Road following the flood; works were targeted at culverts that contributed to restricted flow. (p18)</p></div></div></body></div>`)[0];

                var html_648c62474490bad953052cd4dac757ee = $(`<div id="html_648c62474490bad953052cd4dac757ee" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Sunningwell</h1><div class="nugget-popup"><p>Widespread flooding on 31 Mar&ndash;1 Apr 2023 (and highway flooding on 13 Oct 2023): the village watercourse was overwhelmed by overland flow from surrounding hillsides; water passed through gardens, garages and properties toward the watercourse; surface water overloaded foul sewers with reports of foul flooding; grips and gullies were full of silt and sections of culverted watercourse were restricting flow. [TAB,MUL] (p2)</p></div><div class="nugget-popup"><p>Environment Agency surface&ndash;water flood maps show much of the village is at high risk (>3.3% annual chance). A small watercourse runs through the village centre (culverted under some property accesses); two main carrier drains convey flows through the centre to a small pond on land owned by the Parish Council. Springs where Lower Greensand sandstone meets clay feed these watercourses, channelling runoff towards the Bayworth / Sunningwell area. [IMG,PAG] (p8)</p></div><div class="nugget-popup"><p>The village experienced river and overland flooding when the brook burst its banks and the village pond overflowed on 31 March&ndash;1 April 2023. Floodwater flowed along Sunningwell Road, through gardens and garages, and surrounded several properties. Foul drains were overwhelmed in parts of the village, causing foul&ndash;water contamination of floodwater and hydraulic overload of sewers in some locations. (p11)</p></div><div class="nugget-popup"><p>Overland flow paths and ordinary watercourses converge toward the village and the village pond catchment, directing runoff into low&ndash;lying parts of Sunningwell and increasing local surface water flood risk. The existing watercourse through the village was surveyed as part of the investigation. [IMG] (p14)</p></div><div class="nugget-popup"><p>The catchment draining to Sunningwell Brook received the event rainfall used in the hydrology modelling. This produced an estimated total rainfall volume of 65,243 m3 across the catchment and a modeled peak flow in the watercourse of around 0.83 m3/s during the 31 Mar 2023&ndash;01 Apr 2023 event. [IMG,PAG] (p15)</p></div><div class="nugget-popup"><p>Sunningwell experienced multiple flood mechanisms during 31 Mar 2023 &ndash; 01 Apr 2023. Open channel reaches and culverts through the village were heavily silted, reducing conveyance capacity and contributing to overbanking and garden/property flooding. Oxfordshire Highways inspected and cleared silt from culverts under Sunningwell Road. A 900mm diameter culvert running to the rear gardens of Sunningwell Road was approximately 50% silted, reducing its capacity and restricting flow. Significant overland flow from the surrounding hillside passed through and around several properties, increasing peak flows. Overloaded foul sewers in the village (Thames Water's network) caused internal flooding, notably in the Penn Lane / Sunningwell Road and Bullsmead areas. Thames Water are investigating and identified a non&ndash;return valve near the Penn Lane / Sunningwell Road junction that was installed in the wrong chamber and does not provide intended protection. [PAG] (p18)</p></div><div class="nugget-popup"><p>On 31 Mar&ndash;1 Apr 2023 exceptionally heavy rainfall and saturated soils produced significant overland flow from surrounding hillsides, which overwhelmed the watercourse through the centre of the village and caused water to pass through gardens, garages and properties. The event also overloaded foul sewers, producing reports of foul (sewer) flooding. Local gullies and grips were observed filled with silt and some culverted sections of the watercourse were restricting flow, exacerbating flood impacts. [PAG] (p19)</p></div><div class="nugget-popup"><p>The village experienced surface water flooding during the event, prompting a Section 19 investigation and recommendations for property&ndash;level protection, highway drainage assessment and community flood planning. (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>12 properties affected by internal flooding; 6 properties with ground&ndash;floor internal flooding; 2 cellars flooded; 5 properties with internal garage flooding; up to 30cm water depth in some properties (p11)</p></div></div></body></div>`)[0];
