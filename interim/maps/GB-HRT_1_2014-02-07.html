                var html_7ab289e40a4125226f6a112de97d8001 = $(`<div id="html_7ab289e40a4125226f6a112de97d8001" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wymondley Priory</h1><div class="nugget-popup"><p>Staff observed flood water flowing from an adjacent field to the Priory entrance onto Priory Lane as surface water flowed into Little Wymondley. (p21)</p></div><div class="nugget-popup"><p>The online pond at The Priory fed an unnamed watercourse that was heavily silted, narrow and overgrown, reducing channel capacity and contributing to banks overtopping during the storm on 7 February 2014. [PAG] (p28)</p></div></div></body></div>`)[0];

                var html_b1091a6e66b5f06a86d0fc30450bc797 = $(`<div id="html_b1091a6e66b5f06a86d0fc30450bc797" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ash Brook</h1><div class="nugget-popup"><p>Overland and surface water flows entered and filled the Ash Brook; blocked trash screens and culverts too small for the channel caused water to back up and the channel to be overwhelmed, contributing to flooding of Little Wymondley (internal property flooding) and roads becoming impassable. (p7)</p></div><div class="nugget-popup"><p>Little Wymondley lies within the catchment of Ash Brook; flooding on 7 February 2014 affected the village centre and access roads, consistent with Ash Brook (catchment/overflow) being the watercourse associated with the event. [IMG,PAG] (p10)</p></div><div class="nugget-popup"><p>The Ash Brook caused river flooding that affected Little Wymondley on 7 February 2014, contributing to inundation of the village centre, Stevenage Road (up to Elms Close) and access roads such as Priory Lane. [PAG] (p11)</p></div><div class="nugget-popup"><p>Ash Brook is identified as the primary watercourse in the catchment and is the location where an unnamed, partly open channel (which is open for a short length before entering a culvert) discharges. The confluence at the corner of Priory Lane and Stevenage Road is specifically noted as the meeting point, indicating this reach conveyed flows during the investigated event on 7 February 2014. [IMG,PAG] (p15)</p></div><div class="nugget-popup"><p>Ash Brook reached the top of its bank and exited the watercourse on the right&ndash;hand bank at Stevenage Road, flooding properties lower than the road. A blocked trash screen at Chantry Lane impeded flow and caused water to back up upstream, contributing to higher water levels and flooding. (p21)</p></div><div class="nugget-popup"><p>Blockage at a downstream trash screen caused water to back up, creating higher water levels upstream than downstream; water tried to re&ndash;enter the channel at a traffic&ndash;calming location and then receded later the same day. [TAB,PAG] (p22)</p></div><div class="nugget-popup"><p>A private attenuation pond designed to receive surface water from the Stevenage Bypass had overtopped and overflowed into Ash Brook, bypassing the formal outfall. Downstream inlet to Ash Brook was heavily silted and partially blocked with debris; trash screen had been recently cleared with debris deposited on the bank, indicating flood&ndash;related blockage and overtopping into the watercourse. [PAG] (p23)</p></div><div class="nugget-popup"><p>During the storm on 7 February 2014 the Ash Brook had high water levels and banks overtopped in places. The open channel was heavily overgrown and silted, reducing conveyance capacity. Debris (garden waste, leaf litter, twigs and branches) that had accumulated along frontages north of Stevenage Road was washed downstream during the heavy rainfall, increasing the risk of culvert/blockage and overbank flows. [PAG] (p28)</p></div><div class="nugget-popup"><p>Ash Brook had high water levels and in places its banks overtopped during the 7 February 2014 event. A blocked trash screen at Chantry Lane caused Ash Brook to back up and exit the channel, flooding surrounding land and flowing down Stevenage Road. The channel is described as heavily silted and overgrown in numerous locations (reducing capacity) and there is a collapsing revetment wall outside the Elms Close industrial site. [TAB,PAG] (p29)</p></div><div class="nugget-popup"><p>Ash Brook was running high; a blocked trash screen at Chantry Lane caused the brook to back up and exit its channel, flooding surrounding land and contributing flows into the village (including down Stevenage Road). The channel was noted as silted/overgrown in places and had culverts of limited capacity, reducing conveyance and contributing to overtopping during the event. A collapsing revetment outside Elms Close was also observed. [PAG] (p30)</p></div><div class="nugget-popup"><p>Blockage of a trash screen at Chantry Lane caused water in the Ash Brook to back up, exit the channel and flood surrounding land and flow down Stevenage Road; sections of the channel were heavily silted and overgrown, reducing capacity and contributing to overflow. [PAG] (p31)</p></div><div class="nugget-popup"><p>High water levels in Ash Brook during the event submerged drainage outfalls from roads, preventing flows entering the channel and causing backing up of water onto highways. Material left in the channel could become mobile during high flows and potentially block downstream culverts/trash screens. A section of revetment wall outside the Elms Close industrial site was observed collapsing into the channel. [PAG] (p32)</p></div><div class="nugget-popup"><p>High water levels in Ash Brook during the 7 February 2014 event likely submerged road drainage outfalls, preventing flows from the highway entering the channel and causing water to back up onto the roads. [PAG] (p33)</p></div><div class="nugget-popup"><p>The culvert and trash&ndash;screen route of Ash Brook from Chantry Lane down to the entrance of Wymondley Nursing Home was implicated in the Little Wymondley flooding on 7th February 2014. HCC confirmed responsibility for this culvert but it is not recorded on the HCC asset register and therefore not under a maintenance programme, and HCC were investigating whether A1(M) highway run&ndash;off discharges to Ash Brook as a potential contributing factor to the flooding. (p35)</p></div><div class="nugget-popup"><p>The Corey's Mill water meadow is online and part of Ash Brook; its outfall had a blocked trash screen that restricted flow and contributed to flooding at Little Wymondley. The outfall and access were inspected and the trash screen and access were cleared to restore flow; Anglian Water committed to a maintenance plan. [PAG] (p36)</p></div><div class="nugget-popup"><p>Ash Brook was implicated in the flooding affecting Little Wymondley on 7 February 2014; high flows in the brook and its associated conveyance structures (culverts, trash screens) contributed to or exacerbated local inundation. (p37)</p></div><div class="nugget-popup"><p>Flows in Ash Brook (which receives surface water run&ndash;off from the A1(M)) contributed to flooding in Little Wymondley; assets along Ash Brook were identified by CCTV as being in poor condition and implicated in the flood impacts, requiring remedial works/maintenance. (p40)</p></div><div class="nugget-popup"><p>Ash Brook received surface water run&ndash;off from the A1(M) and was implicated in the flooding affecting Little Wymondley; the report identifies sections of the watercourse (including culverted sections, bridges and vegetation) as potentially impeding flows and requires riparian landowners to inspect and clear obstructions to reduce flood risk. [PAG] (p41)</p></div><div class="nugget-popup"><p>Mapped as the main watercourse (red lines) through the village; contributed to observed flooding where surface&ndash;water flow paths converged with the watercourse at low&ndash;lying crossings and nearby areas. [IMG] (p50)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least four residential properties and one commercial property (p7)</p></div><div class="nugget-popup quant"><p>4 residential properties; 1 commercial property (reported) [IMG,PAG] (p10)</p></div><div class="nugget-popup quant"><p>three to four meters of open channel [IMG,PAG] (p15)</p></div><div class="nugget-popup quant"><p>one trash screen (Chantry Lane) became blocked [PAG] (p31)</p></div></div></body></div>`)[0];
                popup_85361feade50a19d72cd1e4f9d9d7241.setContent(html_b1091a6e66b5f06a86d0fc30450bc797);

                var html_b9c96dfb3f58e921afcc453d50446606 = $(`<div id="html_b9c96dfb3f58e921afcc453d50446606" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Corey's Mill</h1><div class="nugget-popup"><p>Residents raised concerns that the outfall from Corey's Mill water meadow (an asset built to take additional flows from the Stevenage Bypass) may have released additional flows during the 7 February 2014 flood, potentially contributing to flooding in Little Wymondley; the asset has not received regular maintenance since a change of ownership and this contribution was recorded as requiring verification by Anglian Water. [TAB] (p29)</p></div><div class="nugget-popup"><p>The Corey's Mill water meadow attenuation area (built to accept A1(M) run&ndash;off and part of Ash Brook) was inspected after the flooding; its outfall had a blocked trash screen which was cleared and access to the outfall cleared to ensure free flow. The feature is implicated in handling surface water/run&ndash;off from the A1(M). (p36)</p></div><div class="nugget-popup"><p>The Ash Brook flows through Corey's Mill water meadow (an Anglian Water riparian area). The watercourse was implicated in the flooding affecting Little Wymondley associated with the 7 February 2014 event. (p37)</p></div><div class="nugget-popup"><p>Corey's Mill and its associated water meadow were implicated in the flood response; a maintenance plan for the mill was requested and the meadow's capacity and need for upgrade or Reservoirs Act listing were to be assessed because of surface water run&ndash;off related to the flooding. (p41)</p></div></div></body></div>`)[0];

                var html_8b3415e9837ba34e1c62dea858093ea7 = $(`<div id="html_8b3415e9837ba34e1c62dea858093ea7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Stevenage Road, Little Wymondley</h1><div class="nugget-popup"><p>Road became impassable due to floodwater; vehicles that attempted to pass generated bow waves that increased the impact of the flooding; police closed the road. (p7)</p></div><div class="nugget-popup"><p>Flowing water made its way along Stevenage Road rather than through the culverted channel because of blocked trash screens and undersized culverts; water was discharged back onto the road and contributed to flooding in the village centre. [PAG] (p8)</p></div><div class="nugget-popup"><p>Properties on Stevenage Road in the village centre suffered internal flooding on 7 February 2014. The main road into and out of Little Wymondley (Stevenage Road) was closed by Hertfordshire Constabulary because it became impassable; vehicles attempting to pass created bow waves that increased flooding impacts to properties. (p10)</p></div><div class="nugget-popup"><p>Flooding affected Stevenage Road (east&ndash;west access) and properties in the centre of the village up to Elms Close. [PAG] (p11)</p></div><div class="nugget-popup"><p>Flood water flows along Stevenage Road rendered the road impassable and led Hertfordshire Constabulary to close the road; flows extended from Chantry Lane to Elms Close and vehicle bow waves increased flooding to nearby properties. (p16)</p></div><div class="nugget-popup"><p>Water was observed and heard flowing along Stevenage Road in the early hours; residents on Stevenage Road awoke to water within their properties and flows beneath under&ndash;floor voids. Flows from the east along Stevenage Road joined water from Priory Lane, contributing to roads becoming impassable. [PAG] (p20)</p></div><div class="nugget-popup"><p>Flood water flowed along Stevenage Road (joining flows from Priory Lane), causing the road to become impassable; vehicles driving through created bow waves that worsened flooding; properties lower than the road were flooded where Ash Brook overtopped the right bank. Water also flowed through the Plume of Feathers car park and some re&ndash;entered Ash Brook downstream of the trash screen. [PAG] (p21)</p></div><div class="nugget-popup"><p>A trash screen/inlet to the Ash Brook adjacent to Stevenage Road became blocked with debris so water could not flow through the screen, causing water to back up and create higher water levels upstream than downstream; flood waters subsequently receded and were able to flow back into the watercourse by the end of the day. [TAB] (p22)</p></div><div class="nugget-popup"><p>Outfall located north of Stevenage Road opposite the junction with Chantry Lane was choked with vegetation, heavily silted and difficult to access; the blocked/outfall condition and associated debris indicate localized flow blockage contributing to flood flow bypass and reduced conveyance into Ash Brook. (p23)</p></div><div class="nugget-popup"><p>Along the frontage of properties north of Stevenage Road garden waste and tree debris accumulated and then was washed downstream during heavy rainfall, reflecting flood flows in the Ash Brook and contributing to hazard and potential blockages during the storm on 7 February 2014. [PAG] (p28)</p></div><div class="nugget-popup"><p>On 7 February 2014 water from the Ash Brook backed up and exited the channel and flowed down Stevenage Road (linked to a blocked trash screen at Chantry Lane). Gullies in Stevenage Road were reported found to be blocked and outfalls were likely submerged, preventing road drainage and causing water to back up onto the road. Residents also reported vehicle bow waves on 7 February pushed flood water towards properties on the road. [TAB,PAG] (p29)</p></div><div class="nugget-popup"><p>Floodwater from Ash Brook backed up and exited the channel and flowed down Stevenage Road. Residents reported vehicle&ndash;generated bow waves on 7 February 2014 that pushed water toward properties, reaching over door thresholds and entering low airbricks. [PAG] (p30)</p></div><div class="nugget-popup"><p>Gullies in Stevenage Road were found to be blocked during the flood; with Ash Brook at high level the road outfalls would have been submerged, preventing drainage into the channel and causing water to back up onto the road on 7 February 2014. (p32)</p></div><div class="nugget-popup"><p>Highway gullies were found to be blocked during the event and, with Ash Brook at high levels submerging outfalls, road drainage could not discharge to the channel. Water backed up onto and along the road, causing significant highway flooding. [PAG] (p33)</p></div><div class="nugget-popup"><p>Culverts carrying ordinary watercourses under Stevenage Road were identified for CCTV survey to confirm their condition and potential role in flooding during the 7 February 2014 event. (p39)</p></div><div class="nugget-popup"><p>Stevenage Road experienced surface water/urban flooding; trash screens on the road require technical assessment and gullies/drainage need review and maintenance to manage road flooding and reduce flood impacts. (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 residential properties; 1 commercial property (reported) (p10)</p></div></div></body></div>`)[0];
                popup_5832c60999c650bd203dc758ff4f92d4.setContent(html_8b3415e9837ba34e1c62dea858093ea7);

                var html_67967ba5b5e06d093d17030cffe7dc6c = $(`<div id="html_67967ba5b5e06d093d17030cffe7dc6c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Priory Lane, Wymondley</h1><div class="nugget-popup"><p>Overland and surface water flows reached the unnamed watercourse along Priory Lane via field drains and surface water discharge points, contributing to the village flooding. (p7)</p></div><div class="nugget-popup"><p>Identified as one of the recurring locations that flooded (including the event on 7 February 2014). (p8)</p></div><div class="nugget-popup"><p>Road access from the north along Priory Lane was affected by flooding on 7 February 2014; the road became impassable in places as the village centre and access roads were inundated. [IMG] (p10)</p></div><div class="nugget-popup"><p>Road access along Priory Lane from the north was flooded, affecting access to the village. [PAG] (p11)</p></div><div class="nugget-popup"><p>Flood water flows along Priory Lane rendered the road impassable and led Hertfordshire Constabulary to close the road; flows extended from Gravely Lane to the junction with Stevenage Road and vehicle bow waves worsened flooding to nearby properties. (p16)</p></div><div class="nugget-popup"><p>Flood water flowed down Priory Lane onto Stevenage Road, adding to flows in the village; roads became impassable. Water entered/flowed under properties' under&ndash;floor voids and threatened a local business on Priory Lane (Hertfordshire Fire and Rescue pumped water away to prevent entry). (p21)</p></div><div class="nugget-popup"><p>Drainage and conveyance beneath and alongside Priory Lane were compromised: an open channel beside the east verge contained leaf litter and debris, and culverts beneath/adjacent to the lane were blocked or silted so flow from the unnamed watercourse discharges into the open channel at the north boundary of Priory Farm land. [PAG] (p25)</p></div><div class="nugget-popup"><p>The unnamed watercourse running to/along Priory Lane is described as heavily overgrown, silted and of limited capacity; with saturated ground and the storm on 7 February 2014 watercourses would have been high and banks could overtop, producing overland flow and flooding onto/around Priory Lane. [PAG] (p28)</p></div><div class="nugget-popup"><p>During the 7 February 2014 event the Priory Lane channel was extremely narrow, overgrown and heavily silted which reduced its capacity and caused it to react quickly to run&ndash;off. Highway gullies along Priory Lane were buried/blocked by verge collapse and the highway drainage was likely overwhelmed, resulting in water flowing down the highway. [TAB,PAG] (p29)</p></div><div class="nugget-popup"><p>Numerous buried gullies (caused by verge collapse from vehicles) prevented highway drainage from entering the system so runoff flowed down the carriageway to the lowest point, contributing to roadway flooding during the 7 February 2014 event. (p32)</p></div><div class="nugget-popup"><p>Buried and blocked gullies (caused by collapsed verges covering manhole covers and open gullies) prevented highway drainage entering the drainage system, causing water to flow along the highway to low points during the heavy rainfall on 7 February 2014. CCTV surveys of culverts along Priory Lane were later undertaken by the LLFA. [PAG] (p33)</p></div><div class="nugget-popup"><p>Culverts carrying ordinary watercourses beneath Priory Lane were subject to CCTV inspection after the 7 February 2014 flood to confirm their condition and assess whether culvert condition or blockage had potential to influence flooding at the location. (p39)</p></div><div class="nugget-popup"><p>An unnamed watercourse and drainage assets along Priory Lane were identified in poor condition from a CCTV survey after the 7 February 2014 flood; works were recommended to program repairs/replacement, and the maintenance regime for gullies and drainage on Priory Lane was to be assessed. (p40)</p></div><div class="nugget-popup"><p>An unnamed watercourse along Priory Lane (connected to the Ash Brook system) was implicated in the flooding response; riparian sections including culverts, bridges, vegetation and debris were identified as potentially impeding flows and requiring inspection and clearance following the event. (p41)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>150mm culvert blocked with debris; 1 x 300mm and 1 x 150mm plastic culverts present; 300mm+ culvert; brick&ndash;arch culvert 450mm noted downstream; downstream outlet culvert 600mm at junction with Stevenage Road. [PAG] (p25)</p></div></div></body></div>`)[0];

                var html_e804b9caec9c7f441fc71928cbc5bd7c = $(`<div id="html_e804b9caec9c7f441fc71928cbc5bd7c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Chantry Lane, Wymondley</h1><div class="nugget-popup"><p>A trash screen on Chantry Lane was blocked, diverting water over open land before it discharged back onto Stevenage Road; flows nonetheless travelled along Stevenage Road and contributed to inundation and access loss. (p7)</p></div><div class="nugget-popup"><p>Flood water flows on Stevenage Road extended from Chantry Lane to Elms Close, indicating the flood extent reached the Chantry Lane area. (p16)</p></div><div class="nugget-popup"><p>Trash screen at Chantry Lane became obstructed with debris, preventing flow through a box culvert; water backed up upstream of the screen, flowed into fields south of Stevenage Road and through allotments and contributed to flooding of Stevenage Road and adjacent lower&ndash;lying properties. (p21)</p></div><div class="nugget-popup"><p>A culvert at Chantry Lane was identified as being too small and liable to cause water to back up and flow outside the channel; high winter antecedent flows and the storm on 7 February 2014 would have contributed to banks overtopping in places, causing flooding associated with the Ash Brook at or near Chantry Lane. [PAG] (p28)</p></div><div class="nugget-popup"><p>The trash screen at Chantry Lane became blocked during the 7 February 2014 event, causing water within the Ash Brook to back up, exit the channel and flood the surrounding land and flow down Stevenage Road. The Chantry Lane culvert is also identified as being undersized and able to cause backing up if overwhelmed. [TAB,PAG] (p29)</p></div><div class="nugget-popup"><p>The trash screen at Chantry Lane became blocked during the event, causing Ash Brook to back up, overtop/exit the channel and flood the surrounding land; the backed&ndash;up water then flowed down towards Stevenage Road. [PAG] (p30)</p></div><div class="nugget-popup"><p>The trash screen at Chantry Lane was to be reviewed and assessed following the 7 February 2014 flooding to determine whether it trapped debris or affected flows and whether it should be retained, redesigned or removed. (p39)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 trash screen blocked [PAG] (p30)</p></div></div></body></div>`)[0];

                var html_df2d7eeaf5236ec89483f22fb9a76057 = $(`<div id="html_df2d7eeaf5236ec89483f22fb9a76057" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Elms Close, Wymondley</h1><div class="nugget-popup"><p>Flooding affected properties on Stevenage Road up to Elms Close on 7 February 2014, indicating inundation reached the area near Elms Close. (p10)</p></div><div class="nugget-popup"><p>Flood water flows on Stevenage Road extended to Elms Close, placing Elms Close within the area affected by flood flows and road impassability. (p16)</p></div><div class="nugget-popup"><p>Water attempting to re&ndash;enter the Ash Brook immediately upstream of a trash screen/box culvert located under Elms Close was impeded by debris on the trash screen. The blockage caused water to back up, producing a higher water level upstream of the screen than downstream; water levels receded through the day and the flood waters returned to the watercourse by the end of the day. [TAB] (p22)</p></div><div class="nugget-popup"><p>During the flood event on 7 February 2014 two trash screens at Elms Close became partially blocked and residents observed upstream water levels higher than downstream. A culvert running from the Elms Close industrial estate to Siccut Road has been identified as undersized and the report notes a revetment wall outside the Elms Close industrial site is collapsing into the Ash Brook, affecting channel capacity. [TAB,PAG] (p29)</p></div><div class="nugget-popup"><p>Two trash screens at the Elms Close industrial area became partially blocked during the 7 February 2014 flood event, with residents observing higher water upstream than downstream. A section of revetment wall outside the Elms Close industrial site was observed collapsing into the Ash Brook (noted as a channel condition that can worsen flooding). [PAG] (p30)</p></div><div class="nugget-popup"><p>Two trash screens at Elms Close became partially blocked during the flood, with residents observing upstream water higher than downstream, indicating backwater and reduced conveyance in the channel during the event. [PAG] (p31)</p></div><div class="nugget-popup"><p>The trash screen at Elms Close was to be reviewed and assessed following the 7 February 2014 flooding to determine whether it affected flow or debris accumulation and whether it should be retained, redesigned or removed. (p39)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>two trash screens at Elms Close became partially blocked [PAG] (p30)</p></div><div class="nugget-popup quant"><p>two trash screens [PAG] (p31)</p></div></div></body></div>`)[0];

                var html_7e4b4be17e8587199a62100bc13ddbe5 = $(`<div id="html_7e4b4be17e8587199a62100bc13ddbe5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hertfordshire</h1><div class="nugget-popup"><p>Parts of the county (notably Little Wymondley) experienced surface water flooding that inundated roads and affected residential properties. (p1)</p></div><div class="nugget-popup"><p>Hertfordshire was hit by a severe storm with heavy rainfall on the evening of 6 February into early 7 February 2014; saturated ground led to runoff and localised flooding, including road closures and flooded properties in Little Wymondley. (p16)</p></div></div></body></div>`)[0];

                var html_9f8c87ce18ea4f7bf859bb1f668905f3 = $(`<div id="html_9f8c87ce18ea4f7bf859bb1f668905f3" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Little Wymondley</h1><div class="nugget-popup"><p>A residential street was flooded with water covering the entire road and extending onto sidewalks and property entrances; road access was impeded and properties were at risk of inundation. [IMG] (p1)</p></div><div class="nugget-popup"><p>Internal flooding of properties causing internal damage to residential and commercial buildings; village access cut off as main road (Stevenage Road) became impassable; vehicle bow waves increased flood impacts and prompted police to close the road. (p7)</p></div><div class="nugget-popup"><p>The village centre was flooded on 7 February 2014 after watercourses were overwhelmed and water flowed outside the channel into the centre; blocked trash screens and undersized culverts contributed to overland flow into the village (vegetation in open watercourses may have reduced severity). [PAG] (p8)</p></div><div class="nugget-popup"><p>Internal flooding occurred in residential properties and a commercial property; the main road into and out of the village became impassable and was closed, and vehicles attempting to pass through floodwater created bow waves that increased flooding impacts to properties. [PAG] (p9)</p></div><div class="nugget-popup"><p>The centre of Little Wymondley was flooded on 7 February 2014: several residential properties and one commercial property suffered internal flooding; access roads from Priory Lane and Stevenage Road were inundated and the main road was closed by police because it became impassable, with vehicle bow waves worsening property flooding. [IMG,PAG] (p10)</p></div><div class="nugget-popup"><p>Flooding affected the centre of the village. [PAG] (p11)</p></div><div class="nugget-popup"><p>The village was the subject of the flood investigation for the 7 February 2014 extreme weather period; flooding in the local watercourse network (Ash Brook and unnamed tributaries) is noted, with culverted sections and the confluence at Priory Lane / Stevenage Road identified as locations of interest where flood flows were conveyed. (p15)</p></div><div class="nugget-popup"><p>Residential and commercial properties were flooded in the village; roads into and out of Little Wymondley became impassable due to flood water. [PAG] (p16)</p></div><div class="nugget-popup"><p>Areas of the village experienced flooding on 7 February 2014 (photos of the flooding on that date were obtained from HCC Highways and local residents). The village is also shown on EA maps as lying in 'high risk' zones for both surface water and river flooding. (p19)</p></div><div class="nugget-popup"><p>Surface water flooding affected the village on 7 February 2014: residents reported water flowing from surrounding land and watercourses into the settlement; flooding began in the early hours (around 05:00) and water entered properties, including flows beneath under&ndash;floor voids; roads became impassable. [IMG,PAG] (p20)</p></div><div class="nugget-popup"><p>The village experienced flooding as Ash Brook reached the top of its bank and overtopped onto Stevenage Road and lower&ndash;lying properties; runoff from fields and flows down Priory Lane added to flooding. Roads were impassable and closed by police; residents reported internal and under&ndash;floor flooding in properties. (p21)</p></div><div class="nugget-popup"><p>Flooding associated with Ash Brook occurred in the Little Wymondley area when a trash screen became blocked causing upstream water levels to rise and temporary local inundation before levels receded later the same day. (p22)</p></div><div class="nugget-popup"><p>The village experienced flooding on 7 February 2014; the subsequent investigation documented drainage and culvert issues (blocked/silted outlets, damaged culvert tops and debris) along Priory Lane and near the railway bridge. [PAG] (p26)</p></div><div class="nugget-popup"><p>Ash Brook and associated surface water flows passed through Corey's Mill water meadow beneath the A602; inlet to the water meadow and culvert/pipe structures were observed with standing water and partially submerged pipes, and map evidence shows surface water and a watercourse converging in the area, indicating flooding of watercourse/channel and local surface water inundation affecting the village vicinity. [PAG] (p27)</p></div><div class="nugget-popup"><p>The Ash Brook and the unnamed Priory Lane watercourse were reported as heavily silted, overgrown and of restricted capacity; with the wet winter and the storm in the early hours of 7 February 2014 water levels were high and banks would have overtopped in places, producing overland flows and local flooding in the village and contributing to culvert backup at locations such as near Little Wymondley Hall and the Elms Close outfall. [PAG] (p28)</p></div><div class="nugget-popup"><p>During the 7 February 2014 event the village experienced flooding from overland flows and from watercourses overtopping/backing up. Residents reported properties being impacted by bow waves generated by vehicles driving through floodwater, which drove water toward properties and could breach door thresholds and airbricks. Water slowed on reaching the village, increasing depths and prolonging inundation. [TAB] (p29)</p></div><div class="nugget-popup"><p>The village, at the lowest point in the Ash Brook catchment, experienced floodwater accumulation as overland flows and drainage converged and slowed; residents reported properties were affected by bow waves from vehicles driving through floodwater which pushed water over door thresholds and into low airbricks. [PAG] (p31)</p></div><div class="nugget-popup"><p>Village sits at lowest point of the Ash Brook catchment so overland flows, watercourses and highway drainage converged and slowed in the village leading to deeper flood levels. Residents reported on 7 February 2014 that vehicle bow waves pushed floodwater towards properties, breaching door thresholds and entering low airbricks. [PAG] (p32)</p></div><div class="nugget-popup"><p>During the heavy rainfall on 7 February 2014, blocked/buried gullies on adopted roads (Stevenage Road and Priory Lane) and runoff from surrounding fields overwhelmed highway drainage; submerged outfalls to Ash Brook caused further back&ndash;up, producing surface water/road flooding within the village. [PAG] (p33)</p></div><div class="nugget-popup"><p>The village experienced flooding on 7 February 2014, prompting an LLFA&ndash;led assessment and interventions (inspections and clearance of watercourse/outfall by Anglian Water and enquiries into highway drainage by HCC). [PAG] (p36)</p></div><div class="nugget-popup"><p>The village experienced flooding on 7 February 2014 driven by intense, prolonged rainfall. Floodwaters affected the community and land in Little Wymondley (overland and fluvial inundation). (p37)</p></div><div class="nugget-popup"><p>Little Wymondley experienced flooding on 7 February 2014 driven by the extreme rainfall; multiple contributing causes combined (as identified in the report) and, because the watercourses are confined through the village, the flooding affected the area and requires a collaborative approach to resolve. (p38)</p></div><div class="nugget-popup"><p>The village was the location of the 7 February 2014 flood; impacts prompted recommendations to assess and improve road resilience (signage, closure procedures) for roads in and out of Little Wymondley and to review/repair drainage and watercourse assets. (p40)</p></div><div class="nugget-popup"><p>Flooding occurred in the village associated with local watercourses (Ash Brook and an unnamed watercourse along Priory Lane), resulting in flood risk and impacts to the community; the report judged there to be limited options for flood alleviation due to confined channels. (p42)</p></div><div class="nugget-popup"><p>Observed surface&ndash;water flow paths and watercourse flows converged on low&ndash;lying points in the village. Photographs document flooding at multiple locations (roads and watercourse crossings). Flood flow directions followed roads and natural contours into the main watercourses, producing concentrated flooding at key spots. [IMG,PAG] (p50)</p></div><div class="nugget-popup"><p>The village was affected by flooding on 7 February 2014; map and photographs show surface water flow across the area and convergence of a watercourse near an unknown culvert, with culvert infrastructure and submerged pipes photographed, indicating local inundation and flow paths through the settlement. [PAG] (p51)</p></div><div class="nugget-popup"><p>Widespread inundation across the village on 07 February 2014: roads, driveways and underpasses were submerged; water encroached on properties and building entrances; vehicles and public infrastructure were affected. [IMG,PAG] (p52)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 4 residential properties; 1 commercial property (p7)</p></div><div class="nugget-popup quant"><p>four residential properties; one commercial property [PAG] (p9)</p></div><div class="nugget-popup quant"><p>4 residential properties; 1 commercial property (reported) [IMG,PAG] (p10)</p></div><div class="nugget-popup quant"><p>4 homes [PAG] (p16)</p></div><div class="nugget-popup quant"><p>3 photographed flood locations [IMG,PAG] (p50)</p></div></div></body></div>`)[0];
