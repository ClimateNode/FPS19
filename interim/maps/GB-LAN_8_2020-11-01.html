                var html_6eaca6d587a3380e7fe10608af92d75c = $(`<div id="html_6eaca6d587a3380e7fe10608af92d75c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Warpers Moss Lane, Burscough Bridge</h1><div class="nugget-popup"><p>Warpers Moss Lane was flooded as part of the November 2020 flood event. (p1)</p></div><div class="nugget-popup"><p>Flooding of a house and road at Warpers Moss Lane caused by an obstructed culvert and capacity constraints / obstructions in local ditched watercourses; connected highway drainage systems failed to function as historically expected. Culvert and highway drainage were cleaned and jetted earlier in the year; remaining risk was addressed when excess silt and vegetation were cleared from the private land watercourses. (p3)</p></div><div class="nugget-popup"><p>Surface water drainage on the public highway was overwhelmed and failed to discharge because downstream ditched watercourses were obstructed by silt and vegetation, causing floodwater to back up into the highway and into at least one home. Repeated reports of flooding were recorded in 2019 and 2020; a resident reported his home flooded on 24 November 2020 and that this had occurred on three separate occasions. The council identified three obstructed ditched watercourses, notified landowners, and remedial works were completed with no further reports of home flooding after clearance. (p5)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 previous incidents; 1 house (p3)</p></div><div class="nugget-popup quant"><p>3 separate ditched watercourses; 3 separate occasions; 1 home (p5)</p></div></div></body></div>`)[0];
