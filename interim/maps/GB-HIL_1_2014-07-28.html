                var html_b9766b0565180e99c08bfa02d4499089 = $(`<div id="html_b9766b0565180e99c08bfa02d4499089" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Borough of Hillingdon</h1><div class="nugget-popup"><p>Borough&ndash;wide impacts from the 28 July storm: roads and transport infrastructure flooded or closed; residents displaced and some placed in temporary accommodation. (p3)</p></div><div class="nugget-popup"><p>Closure of the A40 and the resulting diversions caused tailbacks and traffic disruption across the borough. [TAB] (p7)</p></div><div class="nugget-popup"><p>Surface water flooding overwhelmed local drains after heavy short&ndash;duration rainfall, causing flooding across access roads and into front/rear gardens and properties on Bedford Road, Clyfford Road and West End Road. The event lasted approximately 3 hours; approximately 23 houses were flooded and sandbags were issued to properties; some properties experienced internal flooding. The London Fire Brigade attended to assist residents. [TAB] (p8)</p></div><div class="nugget-popup"><p>Flooding occurred within the borough at Rockingham Parade / The Lynch; resident reports and photographs document local impacts and the location lies within an Environment Agency Flood Zone. [TAB] (p16)</p></div><div class="nugget-popup"><p>Surface water flooding affected the local highway network within the borough (notably Cowley Road). The London Borough of Hillingdon undertook immediate response actions, including checking gullies to assist drainage and mitigate the event. [IMG] (p18)</p></div><div class="nugget-popup"><p>Surface water ponding on the highway at Blossom Way; road flooded and remained covered for approximately 3 hours because verge soakaways were full. The Council created a new soakaway in the verge to reduce the extent of future flooding. [IMG,TAB,MUL] (p20)</p></div><div class="nugget-popup"><p>Experienced surface water/urban flooding during the heavy rainfall event leading to visible water on highways; the council carries out gully clearance maintenance and provided reporting routes to investigate and resolve blocked gullies or sewers causing the flooding. (p21)</p></div><div class="nugget-popup"><p>Local news coverage and photo reports documented flooding across parts of Hillingdon; streets and properties were reported as affected by floodwater. [TAB] (p24)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 29 properties flooded internally; six cars stuck in floodwater (p3)</p></div><div class="nugget-popup quant"><p>approximately 23 houses; duration approximately 3 hours; sandbags provided to 20&ndash;50 properties [TAB] (p8)</p></div></div></body></div>`)[0];
