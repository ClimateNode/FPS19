                var html_3314c11bf4b14d4e84a8ae88c68939b5 = $(`<div id="html_3314c11bf4b14d4e84a8ae88c68939b5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Coombe Hill Infant School</h1><div class="nugget-popup"><p>Multiple flooding incidents reported at the school; the site has experienced an ongoing flooding problem over several months. The site is potentially at risk of groundwater&ndash;influenced flooding via throughflow and flooding from artificial sources; sub&ndash;surface flows associated with the Coombe Conduit beneath the school may affect flood behaviour. [MUL] (p3)</p></div><div class="nugget-popup"><p>Internal flooding of the school building reported on multiple occasions; these repeated internal flood reports triggered a Section 19 flood investigation by the local authority. [IMG] (p8)</p></div><div class="nugget-popup"><p>The site is located in a topographic low and experienced springs/groundwater emergence on the school site. Large volumes of water appeared on the Adventure Playground mulch, with flows increasing and earth being washed away beneath the playground surface, creating hollows on the school grounds. [IMG,PAG] (p10)</p></div><div class="nugget-popup"><p>Site is in a topographical low; runoff from the main road flowed towards the school buildings (north of the site). Large volumes of water appeared on the Adventure Playground play&ndash;area mulch, causing the mulch to increase in size and the flow of water to increase quickly. (p18)</p></div><div class="nugget-popup"><p>A flooding issue at the school playground was reported. The Local Lead Flood Authority (Kingston) conducted a site visit in February 2019 and concluded a land and structural survey was needed. A further LLFA site visit was carried out in November 2019 where previous flooding issues and the potential for SuDS on the site were discussed. Thames Water assessed sewer sources and concluded the likelihood of the flooding coming from sewer sources was low. [PAG,MUL] (p21)</p></div><div class="nugget-popup"><p>Internal property flooding of the school building(s) reported in a written submission; flooding is attributed to groundwater&ndash;related impacts (Chapter 3.1.5) and not to public or private sewer failure. (p22)</p></div><div class="nugget-popup"><p>The flood risk investigation was triggered by multiple reported flood incidents at Coombe Hill Infant School. Anecdotal evidence from the school's site manager indicated the flooding did not require a response from a Category One Responder. [PAG] (p23)</p></div><div class="nugget-popup"><p>Repeated groundwater&ndash;influenced flooding at the school; the site experienced a flooding problem over a period of several months. Investigation concluded the site is at risk of groundwater throughflow flooding, with risk exacerbated by steep topographic differences, a change from permeable upstream geology (Black Park Gravel Member) to London Clay at the site, and building work that may have altered subsurface flows associated with the Coombe Conduit. [MUL] (p24)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 reported flooding incidents [MUL] (p24)</p></div></div></body></div>`)[0];
