                var html_53efd287cd15c49af0d4be9ccbb8eef5 = $(`<div id="html_53efd287cd15c49af0d4be9ccbb8eef5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>The Mere</h1><div class="nugget-popup"><p>The Mere (the water body in north Framlingham) was implicated in the event as the river gauge is located upstream of it and rising River Ore levels affected the Mere and adjacent North Framlingham areas. (p8)</p></div><div class="nugget-popup"><p>The Mere overtopped during the extreme rainfall, with water levels rapidly expanding on the morning of 20 Oct. Overtopping sent fluvial flows through The Elms car park and into the Elms residential area, contributing to internal flooding of ground floor properties and flow towards Riverside and Well Close Square. (p15)</p></div><div class="nugget-popup"><p>The Mere received excess floodwater from the upper catchment and overtopped, adding to pluvial flows that contributed to flooding of streets and properties in north Framlingham. [PAG] (p16)</p></div><div class="nugget-popup"><p>Received excess floodwater from the upper catchment north of Framlingham and exceeded capacity, overtopping onto adjacent roads and contributing to flooding of the town. [PAG] (p17)</p></div><div class="nugget-popup"><p>The Mere area was flooded, with floodwater extending from the waterbody into adjacent land and merging with the inundation that submerged the nearby car park and vegetation. [IMG] (p25)</p></div><div class="nugget-popup"><p>The Mere's river exit was identified as obstructed/poorly managed and was implicated in restricting outflow during the Storm Babet event; Framlingham College and SWT were asked to review maintenance to ensure the river exit is kept clear of waste and debris because it contributed to flooding of properties. [TAB] (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approx. 10 ground floor premises flooded; depths in The Elms car park reached approximately 150 cm (p15)</p></div><div class="nugget-popup quant"><p>10 properties (p16)</p></div></div></body></div>`)[0];

                var html_225b839f4ef5d31923d160977ef216fc = $(`<div id="html_225b839f4ef5d31923d160977ef216fc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Ore</h1><div class="nugget-popup"><p>Exceeded capacity and overtopped its banks during the event, contributing to the majority of property flooding in Framlingham; river level gauge upstream of the Mere was used to monitor rising levels and a Flood Warning was issued. [PAG] (p7)</p></div><div class="nugget-popup"><p>Rapid rises in the River Ore caused the Environment Agency to issue an automatic Flood Warning for Framlingham. The river gauge (located upstream of the Mere) recorded a fast increase in level that produced little forewarning to residents. (p8)</p></div><div class="nugget-popup"><p>The River Ore overtopped its banks and the Mere, producing fluvial flows that inundated adjacent areas in Framlingham and fed flood routes into The Elms car park and residential areas. Upstream river levels at the gauge above the Mere reached their highest on record since installation in 2000. (p15)</p></div><div class="nugget-popup"><p>The River Ore overtopped between the road bridge and the Mere, causing flooding of Bridge Street (road), and flooding of nearby residential and commercial properties. Blockages (likely woody debris) under bridges were reported and may have contributed to overtopping. (p16)</p></div><div class="nugget-popup"><p>The River Ore overtopped and breached its western bank at multiple locations (junction of Albert Place/Fore Street; south of Bridge Street/Riverside; downstream of the B1119 bridge), causing downstream flooding of Riverside, Albert Place and gardens behind properties on Station Road. High river levels submerged drainage outfalls, preventing road drainage and contributing to further inundation. (p19)</p></div><div class="nugget-popup"><p>The Ore exceeded capacity and broke its western bank downstream of the B1119 road bridge, overtopping along Riverside and south of Fore Street and flooding rear gardens of properties on Station Road. The river's overtopping combined with road&ndash;borne flows to flood properties. (p20)</p></div><div class="nugget-popup"><p>The River Ore exceeded its banks: eastern bank overtopping sent fluvial water toward properties along Fairfield Road from the rear, and western bank overtopping flooded public open space and commercial buildings to the west of the river. [PAG] (p21)</p></div><div class="nugget-popup"><p>The Ore exceeded its eastern bank, causing fluvial floodwater to flow into the rear gardens of properties on Fairfield Road, and exceeded its western bank, flooding the public open space and commercial buildings west of the river. River high flows combined with overwhelmed highway drainage prevented road water discharging to the channel, creating a large expanse of water around properties. [PAG] (p22)</p></div><div class="nugget-popup"><p>The River Ore reached capacity and overtopped its banks. Fluvial floodwater rapidly filled rear gardens, leaving properties surrounded by water on both sides. The Environment Agency measured internal flooding depths of up to 110cm in one residential property. [PAG] (p23)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>highest on record since 2000 (p15)</p></div><div class="nugget-popup quant"><p>external wrack mark 102 cm and internal wrack mark 57 cm on Station Road; one commercial property internally flooded to 63 cm; back fence level 85 cm (p19)</p></div><div class="nugget-popup quant"><p>110cm of internal flooding in one residential property [PAG] (p22)</p></div><div class="nugget-popup quant"><p>110cm internal flooding in one residential property [PAG] (p23)</p></div></div></body></div>`)[0];

                var html_b9e5c7706254e6ec778f010abd2d3102 = $(`<div id="html_b9e5c7706254e6ec778f010abd2d3102" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>The Elms Car Park</h1><div class="nugget-popup"><p>Flood water from the overtopped River Ore and surface water runoff collected in the car park, producing deep inundation and acting as a conduit for water to reach the adjacent Elms residential area. (p15)</p></div><div class="nugget-popup"><p>The Elms car park was inundated with muddy floodwater; multiple vehicles were almost completely submerged, causing significant damage to vehicles and loss of use of the car park. [IMG] (p25)</p></div><div class="nugget-popup"><p>Surface water impacted The Elms carpark; actions proposed to improve the carpark drainage system to reduce future inundation. (p35)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>depths reached approximately 150cm (p15)</p></div><div class="nugget-popup quant"><p>at least five vehicles [IMG] (p25)</p></div></div></body></div>`)[0];

                var html_caba2d6a35a3b14bc14f5b21a93b27b6 = $(`<div id="html_caba2d6a35a3b14bc14f5b21a93b27b6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Fore Street, Framlingham</h1><div class="nugget-popup"><p>Likely inundation of the street and adjacent properties as part of the major flooding in Framlingham when the River Ore and Cherry Brook exceeded capacity and pluvial runoff occurred; contributed to internal flooding of properties in the town. [IMG] (p7)</p></div><div class="nugget-popup"><p>Fore Street is named in the Central Framlingham zone and was impacted by flooding associated with the rapid rise in the River Ore during the event; residents had little, if any, forewarning. (p8)</p></div><div class="nugget-popup"><p>Surface water flowed downhill from Fore Street into the central area (Albert Place), providing lateral pluvial inflows that increased floodwater depths and contributed to the road acting as a primary flood channel. (p19)</p></div><div class="nugget-popup"><p>Pluvial flows from Fore Street ran downhill into Albert Place/Station Road and contributed to the road becoming a primary channel for floodwater, adding to inundation in Central Framlingham. [IMG,PAG] (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over one hundred properties (town&ndash;wide) [IMG] (p7)</p></div></div></body></div>`)[0];

                var html_03e783314bb5959773b5fe6ded2810fb = $(`<div id="html_03e783314bb5959773b5fe6ded2810fb" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Brook Lane, Framlingham</h1><div class="nugget-popup"><p>Likely inundation of the lane and nearby properties during the same event in Framlingham caused by River Ore and Cherry Brook overtopping and intense surface&ndash;water runoff, contributing to internal property flooding. [IMG] (p7)</p></div><div class="nugget-popup"><p>Brook Lane (West Framlingham) was listed in the investigation as being affected by flooding during the event when rapidly rising River Ore / Mere levels and intense rainfall caused inundation of the western area of the town. [IMG] (p8)</p></div><div class="nugget-popup"><p>Brook Lane has historical reports of flooded roads and pavements and was identified among the worst&ndash;affected locations during Storm Babet. [PAG] (p9)</p></div><div class="nugget-popup"><p>Brook Lane has documented historical reports of flooded roads and pavements and overflowing drains; the west end is identified as at risk of fluvial flooding. Brook Lane was among the worst affected locations during Storm Babet (Oct 2023). [PAG] (p10)</p></div><div class="nugget-popup"><p>The west end of Brook Lane was shown as at risk of fluvial flooding and Brook Lane was identified as one of the lowest&ndash;lying and worst&ndash;affected streets during Storm Babet, experiencing surface water accumulation and inundation. [PAG] (p12)</p></div><div class="nugget-popup"><p>Floodwater from the breached Cherry Brook flowed onto and along Brook Lane; additional rapid overland flow from fields contributed. This resulted in internal flooding of residential properties and flooding of gardens along Brook Lane, and highway drainage being overwhelmed. [PAG] (p17)</p></div><div class="nugget-popup"><p>Cherry Brook overtopped its banks and created a secondary flow path along Brook Lane toward Station Road. Rapid pluvial runoff from adjacent fields also flowed into Brook Lane. Highway gullies were overwhelmed, and flooding led to internal flooding of residential properties and flooding of gardens along Brook Lane. [IMG,PAG] (p18)</p></div><div class="nugget-popup"><p>Cherry Brook watercourse and pluvial flows exceeded capacity and overtopped onto Brook Lane. Floodwater on Brook Lane could not return to the main river channel; a culverted section under The Mills reduced channel capacity, causing backup and overtopping that added to road, garden and internal property flooding. Highway drainage assets were overwhelmed. [PAG] (p19)</p></div><div class="nugget-popup"><p>Floodwater flowed from the west along Brook Lane and merged with flows in Albert Place/Station Road, resulting in flooding of properties adjacent to Station Road between Albert Place and the junction with Brook Lane. [IMG,PAG] (p20)</p></div><div class="nugget-popup"><p>Residential property grounds and frontages were inundated; floodwater covered much of the ground around a house, submerging the base of a metal fence and encroaching close to the building foundation, placing the property at risk of water ingress. [IMG] (p26)</p></div><div class="nugget-popup"><p>Floodwater inundated the street and entered lower floors of residential properties; some properties were almost entirely surrounded by water, causing significant local disruption and likely access loss. [IMG] (p29)</p></div><div class="nugget-popup"><p>Named as one of the worst&ndash;affected roads; suffered surface water/highway flooding. Actions include investigating drainage capacity, options to reconnect surface water back to the river, and potential culvert capacity enlargement below The Mills. [TAB] (p33)</p></div><div class="nugget-popup"><p>Surface water flowed along Brook Lane during the event; the road was identified among the four worst&ndash;affected routes and drainage capacity was insufficient. Actions include investigating connection of surface water from Brook Lane back into the river and completing highway drainage maintenance. [PAG] (p34)</p></div><div class="nugget-popup"><p>Surface water flowed along Brook Lane; investigations are proposed to reconnect surface flows back into the river and to investigate enlarging the culvert below The Mills to improve conveyance and reduce flooding. [PAG] (p35)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over one hundred properties (town&ndash;wide) [IMG] (p7)</p></div><div class="nugget-popup quant"><p>1 of 4 worst affected roads [TAB] (p33)</p></div></div></body></div>`)[0];

                var html_59529d31a44dbb191076fcc3b2088c06 = $(`<div id="html_59529d31a44dbb191076fcc3b2088c06" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bridge Street, Framlingham</h1><div class="nugget-popup"><p>Included in the North Framlingham (Zone 1) area affected by rapidly rising River Ore / Mere levels during the event; the street and nearby properties/land were impacted by river&ndash;related flooding. (p8)</p></div><div class="nugget-popup"><p>Road and pavements flooded with drains reported overflowing; identified as among the worst&ndash;affected locations during Storm Babet. [PAG] (p9)</p></div><div class="nugget-popup"><p>The River Ore overtopped between the road bridge and the Mere, causing floodwater to inundate Bridge Street and adjacent residential and commercial properties. Fluvial water plus surface&ndash;water run&ndash;off contributed to the flooding; blockages (likely woody debris) under bridges were reported and may have worsened overtopping. [PAG] (p15)</p></div><div class="nugget-popup"><p>The River Ore overtopped between the road bridge and the Mere, flooding residential and commercial properties and the road on Bridge Street. Blockages (likely woody debris) under bridges were reported and may have contributed to overtopping. [IMG,PAG] (p16)</p></div><div class="nugget-popup"><p>Surface&ndash;water flows from Bridge Street contributed pluvial inflows into Well Close Square and toward Albert Place, adding to the combined floodwater in central Framlingham and overwhelming drainage. (p19)</p></div><div class="nugget-popup"><p>Bridge Street was fully inundated; floodwater covered the full width of the road, reached building bases, restricted pedestrian and vehicle access (caution tape deployed), and partially submerged at least one parked vehicle. [IMG] (p25)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one vehicle partially submerged [IMG] (p25)</p></div></div></body></div>`)[0];

ienced highway inundation and has been targeted for completion of highway drainage cyclic maintenance and capacity investigation. [TAB] (p33)</p></div><div class="nugget-popup"><p>Identified as one of the four worst&ndash;affected roads during the event; targeted for completion of highway drainage cyclic maintenance and investigation of drainage capacity and condition. (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 of 4 worst affected roads [TAB] (p33)</p></div><div class="nugget-popup quant"><p>one of four worst affected roads (p34)</p></div></div></body></div>`)[0];

                var html_e5b3ecece58e657a06e6d89f98612e49 = $(`<div id="html_e5b3ecece58e657a06e6d89f98612e49" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Station Road, Framlingham</h1><div class="nugget-popup"><p>Station Road was included in the Central Framlingham flood zone and experienced flooding during the rapid river&ndash;level rise driven by intense rainfall; warning lead&ndash;time was minimal. (p8)</p></div><div class="nugget-popup"><p>Station Road is listed among the lowest&ndash;lying locations and was identified as one of the worst&ndash;affected areas following Storm Babet, indicating it experienced surface water accumulation and local inundation. [PAG] (p12)</p></div><div class="nugget-popup"><p>The Ore breached its western bank downstream of the B1119 bridge, flooding gardens to the rear of properties on Station Road; properties were impacted by floodwater flowing down the road at the front and by river flows to the rear. [PAG] (p19)</p></div><div class="nugget-popup"><p>Properties adjacent to Station Road were flooded from the front by road&ndash;borne floodwater and from the rear by the River Ore overtopping its bank. Measured impacts included an external wrack mark of 102 cm and an internal wrack mark of 57 cm on Station Road; one commercial property recorded 63 cm internal flooding, and a garden back fence level reached 85 cm. [IMG,PAG] (p20)</p></div><div class="nugget-popup"><p>Street&ndash;level flooding with muddy water covering the roadway and entering residential properties; lower&ndash;lying houses experienced internal flooding and properties were largely surrounded by water, disrupting access. [IMG] (p29)</p></div><div class="nugget-popup"><p>Listed among the worst&ndash;affected roads during the flooding; experienced road surface flooding and is subject to required highway drainage maintenance and investigation. [TAB] (p33)</p></div><div class="nugget-popup"><p>Identified as one of the four worst&ndash;affected roads during the event; targeted for completion of highway drainage cyclic maintenance and investigation of drainage capacity and condition. (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>external wrack mark of 102cm; internal wrack mark of 57cm; internal flooding of 63cm at one commercial property; garden back fence level 85cm [PAG] (p19)</p></div><div class="nugget-popup quant"><p>102 cm external wrack mark; 57 cm internal wrack mark; 63 cm internal flooding at one commercial property; 85 cm level on back fence of garden [IMG,PAG] (p20)</p></div><div class="nugget-popup quant"><p>1 of 4 worst affected roads [TAB] (p33)</p></div><div class="nugget-popup quant"><p>one of four worst affected roads (p34)</p></div></div></body></div>`)[0];

                var html_50469112fc1128f50545599c295911f7 = $(`<div id="html_50469112fc1128f50545599c295911f7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Fairfield Road, Framlingham</h1><div class="nugget-popup"><p>Fairfield Road is listed in the East Framlingham flood zone and was affected by flooding during the rapidly rising river levels and intense rainfall; warnings were issued with little lead time. (p8)</p></div><div class="nugget-popup"><p>Fairfield Road experienced blocked and overflowing drains and flooded roads and pavements; it was listed among the worst&ndash;affected locations during Storm Babet. (p9)</p></div><div class="nugget-popup"><p>Fairfield Road has recorded historical incidents of blocked and overflowing drains and of flooded roads and pavements. It was also listed among the worst affected locations during Storm Babet (Oct 2023). [PAG] (p10)</p></div><div class="nugget-popup"><p>Fairfield Road is listed among the lowest&ndash;lying locations and was identified as one of the worst&ndash;affected areas following Storm Babet, indicating it experienced surface water accumulation and local inundation. [PAG] (p12)</p></div><div class="nugget-popup"><p>Floodwater flowed along the road and could not discharge into the River Ore because river levels were exceedingly high; highway drainage assets were overwhelmed, causing road flooding and contributing to floodwater buildup on Fairfield Road. (p19)</p></div><div class="nugget-popup"><p>Culvert capacity was exceeded and flows backed up, causing flood water to flow along Fairfield Road in a southerly direction. The road became described as 'a river' within minutes; extensive flood water accumulated on the road and flooded commercial and residential buildings from the front. Highway drainage was overwhelmed, preventing discharge to the river and creating a large expanse of standing water around properties. [PAG] (p21)</p></div><div class="nugget-popup"><p>Pluvial flows from fields to the east and exceeded culvert capacity sent large volumes of water along Fairfield Road, flooding the road surface and inundating commercial and residential buildings from the front. Simultaneously the River Ore overtopped its eastern bank, flooding properties from the rear. Highway drainage was overwhelmed so water could not discharge to the river, creating a large expanse of standing and fast&ndash;flowing water around properties. Floodwater velocity damaged front fencing at one property; a brick wall in front of another property was knocked over. The Environment Agency recorded up to 110 cm of internal flooding in one residential property. [PAG,MUL] (p22)</p></div><div class="nugget-popup"><p>Culverts beneath Fairfield Road rapidly exceeded capacity and overflowed. Surface water flowed down the four roads that join Fairfield Road, adding to the floodwater on the highway; drainage assets were overwhelmed. [PAG] (p23)</p></div><div class="nugget-popup"><p>Floodwaters inundated Fairfield Road and adjacent properties, covering roads and entering residential and commercial buildings; access disrupted and infrastructure affected. [IMG,PAG] (p28)</p></div><div class="nugget-popup"><p>The road was completely inundated with muddy floodwater that extended into adjacent fields and residential properties. Gardens and driveways were flooded and property boundaries were breached; a garden wall on Fairfield Road was damaged. [IMG,PAG] (p29)</p></div><div class="nugget-popup"><p>Following the storm the Environment Agency met a resident about concerns along Fairfield Road and removed multiple channel/blockage obstructions that had arisen after Storm Babet to reduce local flooding risk. [TAB] (p31)</p></div><div class="nugget-popup"><p>Blockages were observed within the channel along Fairfield Road (including a large willow tree within the channel). Removal actions have been started because these blockages increased flood risk and were linked to the flooding during Storm Babet. [TAB,PAG] (p33)</p></div><div class="nugget-popup"><p>Channel blockages and surface water flow affected the road during the event; identified as one of the four worst&ndash;affected roads requiring removal of blockages, investigation of highway drainage capacity and potential reconnection of surface water flows back into the river. A large willow in the channel (see Willow) was identified for removal to reduce risk. [PAG] (p34)</p></div><div class="nugget-popup"><p>Surface water was flowing on Fairfield Road; investigations proposed to route flows back to the main river and to examine/enlarge culvert connections to the river to reduce local flooding. [PAG] (p35)</p></div><div class="nugget-popup"><p>Culverts beneath Fairfield Road that connect local watercourses to the main river were identified as capacity&ndash;constrained and contributing to flooding; investigation actions propose enlarging these culverts and improving highway drainage to better manage surface water flows. (p36)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property with up to 110cm internal flooding; 1 property with front fencing damaged; 1 property with brick wall knocked over [PAG,MUL] (p22)</p></div><div class="nugget-popup quant"><p>four roads [PAG] (p23)</p></div><div class="nugget-popup quant"><p>1 garden wall damaged [IMG,PAG] (p29)</p></div><div class="nugget-popup quant"><p>one of four worst affected roads [PAG] (p34)</p></div></div></body></div>`)[0];

                var html_29671345b4ea29ddf80e7ff1c8490a66 = $(`<div id="html_29671345b4ea29ddf80e7ff1c8490a66" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Suffolk</h1><div class="nugget-popup"><p>Storm Babet caused significant flooding&ndash;related disruption to communities across the county between 18&ndash;21 October 2023. [PAG] (p4)</p></div><div class="nugget-popup"><p>October 2023 (including Storm Babet) brought unusually heavy rainfall leading to saturated land, river flows close to or exceeding records, and significant flooding of roads and properties across the county. The severity prompted a major incident declaration on 20 October 2023 due to impacts on communities and transport disruption. [PAG,MUL] (p6)</p></div><div class="nugget-popup"><p>Significant rainfall during Storm Babet (20 Oct 2023) caused widespread internal flooding to residential and commercial properties across the county on saturated ground. (p7)</p></div><div class="nugget-popup"><p>Following Storm Babet, county&ndash;wide highway drainage work was implemented: targeted reactive jetting of gullies in worst affected locations and an overhaul of gully inspection and cleansing routines across Suffolk to prioritise known flood&ndash;risk areas. [TAB,PAG] (p31)</p></div></div></body></div>`)[0];

                var html_c76719bda031e855bf4453492452c2e2 = $(`<div id="html_c76719bda031e855bf4453492452c2e2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>East Anglia</h1><div class="nugget-popup"><p>Storm Babet (18&ndash;21 October 2023) brought very heavy rainfall to East Anglia; rivers rose rapidly (many close to or exceeding highest on record) and saturated catchments produced significant flooding of roads and properties across much of the region, with widespread community disruption and impacts to road and rail networks. (p6)</p></div></div></body></div>`)[0];

                var html_44d09a42e915ce6e36bf1cd8b2faabea = $(`<div id="html_44d09a42e915ce6e36bf1cd8b2faabea" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Framlingham</h1><div class="nugget-popup"><p>One of the most severely impacted locations: intense rainfall overwhelmed natural flow paths and the design capacity of drainage infrastructure, and the convergence of surface water and fluvial flow paths led to rapid increases in flood water, causing internal flooding of properties, and disruption to infrastructure and services. (p4)</p></div><div class="nugget-popup"><p>One of the most significantly impacted communities during Storm Babet (20 Oct 2023). The town experienced major flooding from fluvial and pluvial sources (often combined); the majority of property flooding included a fluvial element as the River Ore and Cherry Brook exceeded capacity and overtopped their banks. Water levels rose rapidly and a Flood Warning was issued. [IMG,PAG] (p7)</p></div><div class="nugget-popup"><p>The central area of Framlingham (including the town spine) was affected by flooding during the event as rising River Ore / Mere levels and heavy rainfall caused inundation of central streets and public areas. (p8)</p></div><div class="nugget-popup"><p>The town has been impacted by multiple historical flood events (fluvial and pluvial) and experienced notable impacts during Storm Babet when several streets were among the worst affected. [PAG] (p9)</p></div><div class="nugget-popup"><p>Central and low&ndash;lying parts of Framlingham experienced surface&ndash;water (pluvial) and river (fluvial) flooding. During the October 2023 Storm Babet event, parts of the town (including central areas and locations along the main river channel and tributaries) were among the worst affected &mdash; roads and pavements flooded and drainage systems overflowed. The town has a history of pluvial flood incidents since 2012. [IMG,PAG] (p10)</p></div><div class="nugget-popup"><p>Central and low&ndash;lying parts of Framlingham experienced converging overland pluvial flows from surrounding higher ground and fluvial influence from the Cherry Brook and the River Ore during the event, causing surface water accumulation and fluvial inundation; the valley acted as a storage area retaining excess flood water which discharged slowly into the river and overwhelmed local infrastructure and watercourses. [IMG,PAG] (p12)</p></div><div class="nugget-popup"><p>Multiple overland pluvial flow paths from higher ground converged in the town; the valley acted as a storage area during intense rainfall causing excess flood water to be retained and slowly discharge into the river and down the catchment. Infrastructure and watercourses were overwhelmed during the event. Low&ndash;lying streets identified as some of the worst affected were Brook Lane, Albert Place, Station Road and Fairfield Road. [IMG,PAG] (p13)</p></div><div class="nugget-popup"><p>The town's low&ndash;lying position on Lowestoft Formation 'Diamicton' (boulder clay) and surrounding loamy, clayey soils with reduced infiltration led to overland flow and accumulation of surface water during the extreme rainfall (Storm Babet following a wet week). These ground and topographic conditions contributed to surface water/overland flow flooding of the town. [IMG,PAG] (p14)</p></div><div class="nugget-popup"><p>Overtopping of the River Ore and the Mere combined with pluvial runoff from surrounding roads and catchment flow paths caused rapid expansion of flood water across north Framlingham. Flood water inundated The Elms car park and flowed through to flood the Elms residential area; River overtopping also flooded residential, commercial properties and Bridge Street. Flood water propagated south and west towards Riverside and Well Close Square. [PAG] (p15)</p></div><div class="nugget-popup"><p>Framlingham Mere and the River Ore exceeded capacity and overtopped onto roads. Pluvial flows from multiple pathways added to floodwater and highway drainage assets were overwhelmed. Several locations north of Framlingham reported localised surface&ndash;water flooding and overwhelmed highway drainage. [IMG] (p16)</p></div><div class="nugget-popup"><p>High rainfall caused excess floodwater from the upper catchment to flow into Framlingham Mere and River Ore; both exceeded capacity and overtopped onto roads in and around Framlingham. Pluvial flows from multiple pathways added to the floodwater and highway drainage assets were overwhelmed beyond their design capacity, contributing to localised road and property flooding. [PAG] (p17)</p></div><div class="nugget-popup"><p>Parts of Framlingham (notably West Framlingham and Brook Lane) experienced fluvial overtopping from Cherry Brook combined with rapid surface water runoff from surrounding fields, producing flow routes through the urban area and causing flooding of roads, gardens and properties. [IMG] (p18)</p></div><div class="nugget-popup"><p>High rainfall led to Cherry Brook and the River Ore exceeding capacity, causing overtopping and combining with surface&ndash;water flows across Framlingham. Multiple roads (including Brook Lane, Station Road and Fairfield Road) and highway drainage assets were overwhelmed, resulting in road and property flooding across the town. [PAG] (p19)</p></div><div class="nugget-popup"><p>Central Framlingham acted as a basin into which floodwater collected. Flood flows converged along roads (notably around Albert Place and Station Road), with pluvial inflows from Fore Street, Albert Road and gardens adding to the inundation and highway drainage being overwhelmed. [IMG] (p20)</p></div><div class="nugget-popup"><p>River Ore overtopped both eastern and western banks, flooding public open space and commercial buildings west of the river. Surface water and runoff from surrounding fields and roads converged through central corridors producing extensive flood depths and flow routes through the town. [IMG] (p21)</p></div><div class="nugget-popup"><p>South Framlingham experienced pluvial flooding from adjacent fields which combined with floodwater on roads. The River Ore overtopped in places, causing external rear flooding to properties. Multiple commercial properties on the north end of Woodbridge Road flooded from the front due to surface water; residential properties on Kettleburgh Road were flooded from pluvial flows and overwhelmed ditches. Assets associated with the sewage works reportedly backed up, with water emerging from manhole covers and causing internal flooding (backed&ndash;up toilet) in one property. (p23)</p></div><div class="nugget-popup"><p>High rainfall generated large pluvial flows from multiple directions that converged on the central area; flood routes show water concentrating towards the main road and green space, overwhelming drains and causing local flooding (eg. car park and riverside areas shown in images). [IMG] (p24)</p></div><div class="nugget-popup"><p>Road floodwater observed on multiple streets in Framlingham: Fairfield Road (looking towards Woodbridge Road), Brook Lane and Station Road were shown flooded in investigation images. Flooding affected the carriageways and local access on these streets. [TAB] (p30)</p></div><div class="nugget-popup"><p>Local flooding affected the town: gullies and drains became blocked, in&ndash;channel and woody debris accumulated in watercourses (including the Mere), incidents were reported requiring EA attendance and removal of blockages, and community recovery/resilience activity (including a Framlingham Flood Recovery and Resilience Group) formed in response. [TAB,PAG] (p31)</p></div><div class="nugget-popup"><p>Properties and multiple parts of the town flooded during the October 2023 event (Storm Babet). Flooding affected highway drainage and surface water flow paths leading to impacts on roads and carparks; blockages in the river/channel contributed to local flooding and prompted clearance and maintenance actions. [TAB] (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 100 residential and commercial properties were internally flooded (p4)</p></div><div class="nugget-popup quant"><p>over one hundred properties reported internal flooding [IMG,PAG] (p7)</p></div><div class="nugget-popup quant"><p>five distinct zones [IMG,PAG] (p8)</p></div><div class="nugget-popup quant"><p>4 named locations: Brook Lane, Albert Place, Station Road, Fairfield Road [IMG,PAG] (p13)</p></div><div class="nugget-popup quant"><p>Elms car park depths approximately 150cm; residential internal flooding approximately 80cm; all ground floor premises thought to have been flooded (approx. 10) [PAG] (p15)</p></div><div class="nugget-popup quant"><p>approx. 10 ground&ndash;floor premises; internal flood depth approx. 80 cm [IMG] (p16)</p></div><div class="nugget-popup quant"><p>approximately 33 cm internal flooding of residential and commercial properties on Riverside [PAG] (p19)</p></div><div class="nugget-popup quant"><p>one property (p23)</p></div></div></body></div>`)[0];
                popup_1b268ba6022c3f1b99dac1283a4a8bd8.setContent(html_44d09a42e915ce6e36bf1cd8b2faabea);
