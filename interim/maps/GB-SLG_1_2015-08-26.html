                var html_85cfcddb2ceb7d51b1dabfd83ea80730 = $(`<div id="html_85cfcddb2ceb7d51b1dabfd83ea80730" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Slough Unitary Authority</h1><div class="nugget-popup"><p>Bursts of heavy rainfall on 26 August 2015 rapidly caused surface water flooding across the town, producing external flooding and large puddles on roads. (p5)</p></div><div class="nugget-popup"><p>Short, intense rainfall on 26 August 2015 caused flash/surface&ndash;water flooding across Slough: Edinburgh Avenue was closed and traffic diverted; external flooding occurred on Farnburn Avenue; large surface&ndash;water puddles formed on surrounding roads. [PAG,IMG] (p6)</p></div><div class="nugget-popup"><p>Short, intense rainfall on 26 August 2015 caused flash surface&ndash;water flooding across Slough, producing rapid inundation of streets (notably Edinburgh Avenue and Farnburn Avenue). (p7)</p></div><div class="nugget-popup"><p>Surface water runoff from buildings and car parks on an adjacent estate flowed onto the highway at Edinburgh Avenue, causing surface water flooding on the highway. [PAG] (p11)</p></div><div class="nugget-popup"><p>Surface water and sewer flooding affected parts of the borough. The post&ndash;event investigation identified multiple failed drainage assets across Slough, including blocked gullies (notably on Edinburgh Avenue and Farnburn Road), tarmac&ndash;filled gully pots and a decommissioned 300mm storm overflow pipe that impaired drainage and required remedial works. [TAB,PAG] (p12)</p></div></div></body></div>`)[0];

                var html_020c65a39ec4e85c18c75aadcffb13be = $(`<div id="html_020c65a39ec4e85c18c75aadcffb13be" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Edinburgh Avenue, Slough Unitary Authority</h1><div class="nugget-popup"><p>Roadway fully inundated from curb to curb, impeding normal traffic; emergency responders present on scene conducting response/traffic control. (p1)</p></div><div class="nugget-popup"><p>Rapid inundation of the street during heavy rainfall, causing the road to be closed. Flooding was exacerbated by a failed Thames Water pump station, a collapsed storm overflow pipe, blocked highway drains/gullies and high surface&ndash;water runoff from nearby buildings and car parks. [TAB,PAG] (p4)</p></div><div class="nugget-popup"><p>Closed due to surface water flooding on 26 August 2015, requiring traffic to be diverted. (p5)</p></div><div class="nugget-popup"><p>Flooding caused closure of the road and required traffic to be diverted; known to have flooded historically though no internal property flooding was reported at the time of writing. [PAG,IMG] (p6)</p></div><div class="nugget-popup"><p>Rapid inundation of the street during the 26th August 2015 storm; the speed and extent of flooding were exacerbated by a failed Thames Water pump station, a collapsed Thames Water storm overflow pipe, blocked highway drains/gullies, and high volumes of surface water runoff from nearby buildings and carparks. (p7)</p></div><div class="nugget-popup"><p>Street experienced flooding during the event. [PAG] (p9)</p></div><div class="nugget-popup"><p>Highway gullies were checked after the event; blockages (exacerbated by loose bark chippings washing from planted areas) reduced drainage capacity during the flood. Slough Borough Council cleared the blockages; one gully required civil works because it was filled with Tarmac. Surface water runoff from adjacent estate buildings and car parks flowed onto the highway during the event. (p10)</p></div><div class="nugget-popup"><p>Drainage assets were investigated following the flood; multiple failed assets were discovered. Blocked gullies on Edinburgh Avenue were cleared (Sep 2015). Advice was issued to adjacent landowners to avoid using chipped bark that can float during a flood. [TAB] (p12)</p></div><div class="nugget-popup"><p>Rapid inundation of the street caused by heavy rainfall, with the speed and extent of flooding exacerbated by a failed Thames Water pump station, a collapsed 300mm storm overflow pipe (from recent utility works), blocked highway drains/gullies, and high volumes of surface water runoff from nearby buildings and carparks. [TAB] (p13)</p></div></div></body></div>`)[0];

                var html_b49e9293677e4422e12f9e85a8ed6bb5 = $(`<div id="html_b49e9293677e4422e12f9e85a8ed6bb5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Farnburn Avenue, Slough Unitary Authority</h1><div class="nugget-popup"><p>External (street) flooding occurred during the heavy rainfall event; inundation was rapid and was exacerbated by the same local failures (failed pump station, collapsed storm overflow pipe, blocked drains and high runoff). [TAB,PAG] (p4)</p></div><div class="nugget-popup"><p>External flooding was recorded on 26 August 2015 as a result of the surface water flooding event. [PAG] (p5)</p></div><div class="nugget-popup"><p>External (road) flooding occurred on Farnburn Avenue during the intense rainfall/flash&ndash;flooding event; standing water was observed on the road. [PAG] (p6)</p></div><div class="nugget-popup"><p>Rapid inundation of the street during the 26th August 2015 storm; the speed and extent of flooding were exacerbated by a failed Thames Water pump station, a collapsed Thames Water storm overflow pipe, blocked highway drains/gullies, and high volumes of surface water runoff from nearby buildings and carparks. (p7)</p></div><div class="nugget-popup"><p>Water flowed into a low spot on Farnburn Avenue from a low level sewer chamber and surface water runoff from the north&ndash;east corner of the SEGRO estate; flooding was worse because the Thames Water pump station was not operational. [PAG] (p9)</p></div><div class="nugget-popup"><p>Gullies on Farnburn Avenue drain to soakaways (east and newly installed to the west) to alleviate surface water flooding; the most westerly gully had previously been connected to the Thames Water low level sewer but this connection was closed to reduce risk of sewer surcharge. A resident reported water pouring up and out from a highway drain during the event (indicative of sewer or drain surcharging), while residents on the eastern side reported soakaways worked though drained slowly. (p10)</p></div><div class="nugget-popup"><p>Blocked gullies on Farnburn Road (sic) were cleared as part of the post&ndash;event response (Sep 2015). [TAB] (p12)</p></div><div class="nugget-popup"><p>Rapid inundation of the street caused by heavy rainfall, with the speed and extent of flooding exacerbated by a failed Thames Water pump station, a collapsed 300mm storm overflow pipe (from recent utility works), blocked highway drains/gullies, and high volumes of surface water runoff from nearby buildings and carparks. [TAB] (p13)</p></div><div class="nugget-popup"><p>Water overflowed from a low level sewer chamber onto Farnburn Avenue; gullies on the street are noted to be connected to soakaways (with anecdotal evidence that soakaways on the eastern side of Farnburn Avenue functioned). [IMG] (p16)</p></div></div></body></div>`)[0];
