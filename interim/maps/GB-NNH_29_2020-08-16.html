                var html_e3a254c201843de9aeb054da32d60da5 = $(`<div id="html_e3a254c201843de9aeb054da32d60da5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Station Road, Nassington</h1><div class="nugget-popup"><p>Internal flooding of at least one building on Station Road during the event; repeated internal flooding of a building on more than one occasion in the last five years. Surface water drainage systems were overwhelmed, with runoff flowing to local low points around properties. (p5)</p></div><div class="nugget-popup"><p>Internal flooding of an occupied building occurred on 16 August 2020; the same building has experienced internal flooding on more than one occasion in the last five years. The affected property reported the flood via the Flood Toolkit. (p7)</p></div><div class="nugget-popup"><p>Floodwater entered properties on Station Road, recorded as 'flooding through garage'. [TAB] (p10)</p></div><div class="nugget-popup"><p>Surface water runoff flowed along the highway from south to north; drainage (road gullies/surface water sewer) was exceeded or ineffective, causing water to pool at the low point at the road edge and overtop the dropped kerb and flow onto the adjacent property and into an integral garage. (p16)</p></div><div class="nugget-popup"><p>Photographs taken as part of the flood investigation show a residential property on Station Road with a roadside gully adjacent and a footpath that falls towards the garage door; during the 16 August 2020 flood incident surface water flowed along the carriageway toward the garage entrance, with the gully and the footpath gradient directing runoff toward the property. A parked vehicle is shown partially over the gully, which could have affected drainage access. [IMG] (p32)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property reported via Flood Toolkit (p7)</p></div></div></body></div>`)[0];

                var html_aa2223d1161f2d1e4c21a350bd5edae0 = $(`<div id="html_aa2223d1161f2d1e4c21a350bd5edae0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Nassington</h1><div class="nugget-popup"><p>Surface water flooding caused by intense, short&ndash;duration rainfall overwhelmed drainage, producing excess surface water that flowed to low points around properties in Nassington and led to internal flooding of at least one building on Station Road. (p5)</p></div><div class="nugget-popup"><p>Flooding at Station Road (within Nassington) caused internal flooding of at least one property on 16 August 2020; the affected property has experienced internal flooding on multiple occasions in the last five years and reported the incident to the Flood Toolkit. (p7)</p></div><div class="nugget-popup"><p>In Nassington one property was reported to have flooded internally when surface water (from nearby Church Lane) exceeded drainage capacity, overtopped a dropped kerb and flowed into and through an integral garage. (p15)</p></div><div class="nugget-popup"><p>Intense heavy rainfall over a short period caused widespread surface&ndash;water/flash flooding across this area of Nassington. The Local Lead Flood Authority (NCC Flood and Water Management Team) received multiple formal and anecdotal reports of flooding from the area and individual reports continued to be received in the weeks after the event. Emergency response was largely reactive; fluvial (main river) warnings were not issued because river level triggers were not reached. [PAG] (p17)</p></div><div class="nugget-popup"><p>Intense heavy rainfall on 16th August 2020 caused surface water flooding across the area. Surface water drainage systems across the catchment were unable to collect and convey the rainfall, so excess water flowed over ground following local levels and accumulated in low points around properties. There were no effective overland flow routes to safe areas, resulting in reliance on buried drainage systems whose design capacity was exceeded. (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property reported via Flood Toolkit (p7)</p></div><div class="nugget-popup quant"><p>1 property (p15)</p></div></div></body></div>`)[0];
