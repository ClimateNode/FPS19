                var html_11f74ec11374bae669ddd7640abbece9 = $(`<div id="html_11f74ec11374bae669ddd7640abbece9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>St Neots</h1><div class="nugget-popup"><p>Experienced intense rainfall on 13 and 16 August 2020 that put extreme pressure on local drainage systems and produced high water volumes in watercourses and drainage systems, increasing flood risk across the settlement. Hardened, dry ground preceding the events reduced soakage and worsened surface water runoff. [MUL] (p7)</p></div><div class="nugget-popup"><p>Between 13 and 16 August 2020 intense rainfall overwhelmed drainage networks in the town. Surface water sewers and road drainage were inundated, causing flooding from highways gullies, surface water on roads and surcharging of sewers. Floodwaters followed local topography and entered properties in areas at risk of surface water flooding. (p8)</p></div><div class="nugget-popup"><p>Across the town seven properties were reported to have flooded internally (Drake Road; Monarch Road; Marchioness Way &mdash; 3 properties; Howitts Lane (Eynesbury); Hempsals (Eaton Ford)). Six further properties reported external flooding (Ackerman Street &mdash; 2 properties; Bishops Road (Eynesbury); The Broad Walk (Eynesbury); Ridgeway (Eynesbury)). [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>St Neots area recorded multiple instances of residential flooding across suburbs (Eaton Socon, Eynesbury and Eaton Ford) with houses, gardens and outbuildings affected. [TAB] (p11)</p></div><div class="nugget-popup"><p>Two consecutive extreme rainfall events on 13 and 16 August 2020 produced very intense storms that overwhelmed local drainage, causing surface water flooding across St Neots. Highways drainage and sewer systems came under extreme pressure; investigation and maintenance actions were initiated and a residents Flood Liaison Action Group (FLAG) was set up to work with risk management authorities. (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>7 properties (p8)</p></div><div class="nugget-popup quant"><p>7 properties internal; 6 properties external [PAG,IMG] (p10)</p></div></div></body></div>`)[0];
                popup_9810e7e520b0b4d2f27e8932718f556d.setContent(html_11f74ec11374bae669ddd7640abbece9);

                var html_611ed91dd8b21730e5fdc7a45b95deba = $(`<div id="html_611ed91dd8b21730e5fdc7a45b95deba" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Eynesbury</h1><div class="nugget-popup"><p>Internal property flooding was reported within Eynesbury (Howitts Lane is named as a location where internal flooding occurred). (p9)</p></div><div class="nugget-popup"><p>One property on Howitts Lane reported internal flooding. External flooding was reported at Bishops Road, The Broad Walk and at Ridgeway. One property on Ridgeway reported no internal flooding itself but that neighbouring properties had flooded. [PAG,IMG] (p10)</p></div><div class="nugget-popup"><p>Gardens, outbuildings (including garages) and nearby gardens were flooded; some reports also note flooding inside other nearby homes. [TAB] (p11)</p></div><div class="nugget-popup"><p>Internal flooding of properties (water entered houses and gardens or outbuildings) [TAB,PAG] (p12)</p></div><div class="nugget-popup"><p>Internal property flooding was investigated after an extreme rainfall event. The LLFA liaised with the Highway Authority to arrange cleansing and surveying of the highway surface water drainage system and wrote to riparian landowners requesting ditch maintenance. Ditch clearance was carried out (April 2021) to gain access to a culvert; cleansing of the culvert was scheduled for 2021&ndash;22. The Highway Authority included gullies in a gully&ndash;jetting programme (April&ndash;June 2021) and increased gully maintenance frequency. [IMG] (p14)</p></div><div class="nugget-popup"><p>Internal flooding to residents investigated; contributory cause identified as a blind outfall for a surface water sewer in a resident's back garden that drained highway surface water. Highways Projects arranged rerouting of highway drainage into the Anglian Water surface water sewer to alleviate the issue. [TAB] (p15)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Part of 7 properties reported flooded internally (p9)</p></div><div class="nugget-popup quant"><p>1 property internal; 3 properties external [PAG,IMG] (p10)</p></div></div></body></div>`)[0];

v></div></body></div>`)[0];
