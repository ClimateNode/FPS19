                var html_408eae9dac416201b79e6dea6c64b560 = $(`<div id="html_408eae9dac416201b79e6dea6c64b560" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Market Place, Arnold</h1><div class="nugget-popup"><p>Internal flooding to properties and businesses in the area as part of the wider Arnold event; associated flooding to gardens and outbuildings. [PAG] (p1)</p></div><div class="nugget-popup"><p>Floodwater collected (ponded) at the Market Place, where flows from Front Street combined with other runoff, causing flooding that affected businesses in the area. [PAG] (p6)</p></div><div class="nugget-popup"><p>A contiguous area of internal and external flooding affected the streets and properties along Upper Front Street, through the Market Place and on to Lower Front Street. Floodwater was channeled from Upper Front Street into the Market Place where it combined with water from Front Street, increasing the extent of the flooded area. [IMG] (p7)</p></div><div class="nugget-popup"><p>Identified as an area where NCC and STW will investigate how the highway drainage system worked with the public sewer system following the flood event, implying it was affected by the flooding. (p9)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>24 residential properties; 20 businesses (across the listed areas) [PAG] (p1)</p></div></div></body></div>`)[0];

                var html_d4ef055c85b1f8ca32929144059d261c = $(`<div id="html_d4ef055c85b1f8ca32929144059d261c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Arnold</h1><div class="nugget-popup"><p>Following heavy rainfall on the evening of 12 June 2019, parts of Arnold were affected by surface water/urban flooding. Internal flooding occurred to residential and commercial properties and many gardens and outbuildings were flooded. Specific streets affected include Hall Drive, Brook Gardens, Bentwell Avenue, Bonnington Drive, Brookfield Road, Gedling Road, Front Street, Market Place and Arnot Hill Road. [PAG] (p1)</p></div><div class="nugget-popup"><p>Significant internal flooding of homes and businesses across the Arnold area caused by overland flow from a failed storage attenuation area. The attenuator was full following heavy rain and its bank breached, allowing excess surface water to flow along a natural valley (rear gardens of Bentwell Avenue) and cause extensive damage. [PAG,MUL] (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>24 residential properties; 20 businesses [PAG] (p1)</p></div><div class="nugget-popup quant"><p>24 residential properties; 20 businesses [PAG,MUL] (p3)</p></div></div></body></div>`)[0];
