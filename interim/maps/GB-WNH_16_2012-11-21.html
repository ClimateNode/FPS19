                var html_587b4f9893583cff0ad3b92ad84f0eb4 = $(`<div id="html_587b4f9893583cff0ad3b92ad84f0eb4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Helmdon Primary School</h1><div class="nugget-popup"><p>Surface water run&ndash;off from the school's playing fields flowed into the rear courtyard; ditches to the south and east of the playing field need to be assessed and made to function adequately, and an assessment of outfall and storage requirements is recommended to prevent run&ndash;off entering the courtyard. (p17)</p></div></div></body></div>`)[0];

        var popup_250f3ab7a6b97bd33da6b4090f181d19 = L.popup({});

        
            
                var html_2dd1b486079495daf84d1bdb2d8d0799 = $(`<div id="html_2dd1b486079495daf84d1bdb2d8d0799" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Station Road, Helmdon</h1><div class="nugget-popup"><p>Highway (Station Road) was closed due to flooding; excess surface water flowed to the low point immediately south of Helmdon Brook and was conveyed by highway drainage and public sewers not intended to carry land drainage, contributing to internal flooding of nearby properties. [PAG] (p5)</p></div><div class="nugget-popup"><p>Flooding at the low point of Station Road led to the highway being closed and at least three properties being flooded internally during the event. [PAG] (p6)</p></div><div class="nugget-popup"><p>Flooding occurred on Station Road south of Helmdon Brook on 21 November 2012; the highway was closed to traffic by residents and at least three properties experienced internal flooding (water beyond building thresholds). (p8)</p></div><div class="nugget-popup"><p>Heavy surface water flow continued to the area of Station Road directly south of Helmdon Brook; flows from higher ground and the southern section of Station Road joined the main flow, contributing to ponding and inundation at the south side of Helmdon Brook. (p10)</p></div><div class="nugget-popup"><p>An area of standing water formed extending from immediately south of Helmdon Brook as far as the junction of Station Road and Church Street; residents closed the road. Internal flooding occurred at two residential properties on Station Road (one through air bricks below ground floor level; another with water entering ground floor living areas). One property with purpose&ndash;made flood defences experienced limited ingress but would have had substantially greater internal flooding without them. [PAG] (p11)</p></div><div class="nugget-popup"><p>Internal flooding occurred to multiple residential properties on Station Road: two properties experienced internal flooding (one via air bricks below ground floor level; one with water seeping into and flowing across ground&ndash;floor living areas). A further property had purpose&ndash;made flood defences at the garage and front door which kept floodwater to a minimum (some water still entered); without these defences about 300mm depth would have been present in ground&ndash;floor living areas. Two additional properties further south experienced flood water up to approximately 25mm below ground&ndash;floor level (could have been overtopped if the ponded water was disturbed). An area of Station Road immediately north of Helmdon Brook ponded during the incident but did not affect private property. [PAG] (p12)</p></div><div class="nugget-popup"><p>Collapsed surface water sewer on Station Road (upstream from manhole 5652) and surface water runoff along Station Road; gully and pipework at No. 7 Station Road require investigation of route, condition, capacity and any rights of easement because they are implicated in the runoff/flooding on the road. (p17)</p></div><div class="nugget-popup"><p>Repeated flooding of the road making it impassable at times, with water levels above the kerb, and with properties in the area reported damaged by water and sewage in historic events. Surface water drains and sewers were recorded as overwhelmed or failed on many occasions, directly causing road flooding; the fire service diverted water during an event (21 November 2012). [TAB,MUL] (p35)</p></div><div class="nugget-popup"><p>When manhole 7651 (junction of Church Street and Station Road sewers) surcharges during flood events the overflow is routed into the surface water sewer on the west side of Station Road and outfalls on the pumping&ndash;station side of the road just before the bridge; this overflow changes normal discharge routes and contributes to surcharging in the Station Road drainage system. [PAG] (p39)</p></div><div class="nugget-popup"><p>A river of water flowed down and inundated the road as runoff from surrounding areas (including Grange Lane) was directed toward Station Road. The public surface water sewer surcharged during rain events due to an unreasonable volume of water entering via road gullies, contributing to the roadway flooding. [PAG] (p41)</p></div><div class="nugget-popup"><p>Station Road has a collapsed surface water sewer (upstream from manhole 5652) requiring repair. Surface water sewers from Station Road merge with others at the junction with Church Street, and connections from ditches/streams are restricting flow capacity and causing sewer surcharge. Alterations are planned to route Station Road surface water directly to manhole 6653 to the outfall to reduce surcharge. (p42)</p></div><div class="nugget-popup"><p>Overflow from manhole 7651 into the west side Station Road sewer was observed, indicating sewer surcharge/overflow affecting Station Road. (p44)</p></div><div class="nugget-popup"><p>Main area of flooding during the incident was on Station Road; moisture/flooding evidence on buildings (darkened mortar at the base of a stone house) and flooding associated with the Station Road bridge over Helmdon Brook/inlet channels. [IMG,PAG] (p57)</p></div><div class="nugget-popup"><p>Station Road was a main area affected during the incident; overspill of runoff from fields occurred onto the road and affected property access south of the village centre. [IMG,PAG] (p58)</p></div><div class="nugget-popup"><p>Overspill of runoff from adjacent fields occurred onto Station Road, forming the main area of flooding during the incident and affecting property access on Station Road south of the village centre. [IMG,PAG] (p59)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 3 properties [PAG] (p5)</p></div><div class="nugget-popup quant"><p>at least 3 properties [PAG] (p6)</p></div><div class="nugget-popup quant"><p>at least 3 properties (p8)</p></div><div class="nugget-popup quant"><p>two residential properties; approximately 325mm depth at the deepest point; approximately 300mm depth (would have been present in ground floor living areas without defences) [PAG] (p11)</p></div><div class="nugget-popup quant"><p>2 residential properties (internal flooding); 1 residential property (with flood defences); 2 additional residential properties [PAG] (p12)</p></div></div></body></div>`)[0];

                var html_5c37ce897d068b94e01a738db36399ed = $(`<div id="html_5c37ce897d068b94e01a738db36399ed" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Church Street, Helmdon</h1><div class="nugget-popup"><p>Flows of surface water from Church Street joined the main overland flow contributing to the heavy flow that led to ponding; local road gullies and the public sewerage system were unable to convey the volume of water. [PAG] (p10)</p></div><div class="nugget-popup"><p>A standing area of water formed south of Helmdon Brook and extended as far as the road junction of Station Road and Church Street; residents closed the road to prevent vehicles passing through the water. (p11)</p></div><div class="nugget-popup"><p>Surface water sewers merge at the junction of Church Street and Station Road; Church Street surface water currently routes via the east side of Station Road, a configuration noted as contributing to the surface water management/flooding issues at the junction. (p17)</p></div><div class="nugget-popup"><p>Foul sewer manhole at the junction of Station Road and Church Street frequently surcharged or failed, producing 'fountain' events and sewer&ndash;related surface flooding; sewers were noted as overwhelmed on multiple occasions. [TAB,MUL] (p35)</p></div><div class="nugget-popup"><p>Surface water sewer serving the top and lower parts of Church Street shows continuous flows and the sewer/junction with Station Road (manhole 7651) surcharges during flood events; when backing up the manhole overflows via a pipe into the surface water sewer on the west side of Station Road, altering flow routes and causing surcharging at the junction. [PAG] (p39)</p></div><div class="nugget-popup"><p>Surface water sewers from Church Street merge with the Station Road surface water sewers at their junction; Church Street surface water currently routes via the east side of Station Road. Anglian Water plans to disconnect the overflow from manhole 7651 and ensure Church Street surface water goes directly via the east side of Station Road, actions related to managing surcharge and flows. (p42)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 325mm depth at the deepest point (p11)</p></div></div></body></div>`)[0];
                popup_9c11c90f1fec0daee73f661aca3bd81f.setContent(html_5c37ce897d068b94e01a738db36399ed);

                var html_b3e2ef08676f01b50558a3d58555241c = $(`<div id="html_b3e2ef08676f01b50558a3d58555241c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>The Green, Helmdon</h1><div class="nugget-popup"><p>Some residential properties on The Green had sanitary appliances affected during the flooding incident. (p12)</p></div><div class="nugget-popup"><p>The Green (adjacent to Station Road) was within the main area of flooding during the incident; its proximity to the flooded road and nearby buildings meant properties and parked vehicles along The Green were exposed to floodwater/runoff (evidence includes photographic captioning of The Green as on the left of the main flooded area and moisture staining on nearby buildings). [IMG] (p58)</p></div></div></body></div>`)[0];

                var html_3f6d4a5d32df81aa75b51bbb399bb885 = $(`<div id="html_3f6d4a5d32df81aa75b51bbb399bb885" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Helmdon</h1><div class="nugget-popup"><p>Intense short&ndash;duration rainfall on a saturated catchment caused excess surface water to flow following natural contours to a low point at Station Road, resulting in internal flooding of properties (at least three) and closure of the highway; historic land drainage and drainage infrastructure were ineffective. [PAG] (p5)</p></div><div class="nugget-popup"><p>At least three properties in the village were flooded internally during the event; local highway(s) were closed as a result of flooding. Flooding resulted from intense rainfall on a saturated catchment causing excess surface water to flow to low points in the village. [PAG] (p6)</p></div><div class="nugget-popup"><p>Areas of the village (predominantly south of Helmdon Brook) were impacted by flooding on 21 November 2012; at least three properties flooded internally and several other properties were at high risk or had sanitary appliance issues; the highway was closed in the affected area. (p8)</p></div><div class="nugget-popup"><p>Upstream between the GCR viaduct and Helmdon village there was evidence of the brook overtopping its banks, with water flattening grass up to a distance from the channel. (p11)</p></div><div class="nugget-popup"><p>The village experienced flooding impacts to residential properties: multiple properties on Station Road had internal flooding (see Station Road details) and properties on The Green had sanitary appliances affected. (p12)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration rainfall on a saturated catchment caused existing drainage systems and watercourses to be unable to cope, producing run&ndash;off that flowed into other areas and into highway drainage and public sewers. Ditches and watercourses were largely non&ndash;functional (full of silt and debris), causing overtopping from privately owned land into the public highway and contributing to flooding across the village. (p15)</p></div><div class="nugget-popup"><p>Land drainage in the village has overspilled onto the public highway and into the public sewerage system. The report recommends a village&ndash;wide reinstatement of historic drainage (excavating headwalls and piped ditches, investigating outfalls and culverted sections) and owner maintenance to restore hydraulic capacity and reduce future overspill and local flooding. [PAG] (p16)</p></div><div class="nugget-popup"><p>The document states that diverting or disconnecting ditches and land drainage from the surface water sewer would stop surcharge to the surface water sewers during storm events but would make the flooding worse in Helmdon, indicating Helmdon experiences surface water flooding and that local drainage connections influence flood severity in the village. (p42)</p></div><div class="nugget-popup"><p>Village area experienced flooding during the incident, with the main area of flooding on Station Road (adjacent to The Green) and property moisture visible on Station Road buildings. [IMG,PAG] (p57)</p></div><div class="nugget-popup"><p>Station Road was identified as the main area affected during the incident: property access on Station Road (south of the village centre) was impacted by floodwater/runoff; darkened mortar on buildings indicates moisture penetration from the flooding; overspill of runoff from fields occurred onto Station Road; sandbags were placed on the bank at the Station Road bridge over Helmdon Brook to manage water flow/erosion. [IMG,PAG] (p58)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 3 properties [PAG] (p5)</p></div><div class="nugget-popup quant"><p>at least 3 properties [PAG] (p6)</p></div><div class="nugget-popup quant"><p>at least 3 properties (p8)</p></div><div class="nugget-popup quant"><p>20 metres (grass flattened) (p11)</p></div><div class="nugget-popup quant"><p>5 residential properties (p12)</p></div></div></body></div>`)[0];
