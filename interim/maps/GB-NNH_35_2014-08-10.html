                var html_8ef40ac5f997caa8cb4560435ce6081f = $(`<div id="html_8ef40ac5f997caa8cb4560435ce6081f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>King's Cliffe</h1><div class="nugget-popup"><p>Drainage systems were unable to collect and dispose of rainwater, so excess surface water flowed over ground following natural contours to low points in the village, causing internal flooding of a property. [PAG,MUL] (p6)</p></div><div class="nugget-popup"><p>Excess surface water flowed over ground to low points in the village; internal flooding occurred in at least one property. [PAG,MUL] (p7)</p></div><div class="nugget-popup"><p>Internal flooding of a residential property (water crossed the internal threshold). The property experienced internal flooding on the main event of 10th August 2014 and has experienced internal flooding on more than one occasion in the previous five years. [MUL] (p9)</p></div><div class="nugget-popup"><p>Flooding occurred in Kings Cliffe driven by prolonged/continuous rainfall and by additional flood water sourced from the failure of on&ndash;site drainage at the Sovereign Grange Housing Development; local drainage was overwhelmed. (p16)</p></div><div class="nugget-popup"><p>Surface water flooding in Kings Cliffe is attributed in the report to runoff from the Sovereign Grange housing development; this flood risk includes surface water reaching roads and properties and requires mitigation. (p23)</p></div><div class="nugget-popup"><p>Flooding prompted review of the village drainage system and community actions: identification of vulnerable properties, exploration of property&ndash;level protection, reinstatement/clearing of historic ditches and culverts, and consideration of community&ndash;wide solutions (attenuation areas, tree planting) to manage surface water. (p25)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property [PAG,MUL] (p6)</p></div><div class="nugget-popup quant"><p>one property [PAG,MUL] (p7)</p></div><div class="nugget-popup quant"><p>one property [MUL] (p9)</p></div></div></body></div>`)[0];
