                var html_d00a3a8631945c68e892565f993f840e = $(`<div id="html_d00a3a8631945c68e892565f993f840e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Albert Road, Deal</h1><div class="nugget-popup"><p>Internal flooding to 4 properties (reports of up to 3 cm of floodwater inside); external flooding to 21 properties affecting gardens and garages (reported depths up to 50 cm). [TAB] (p2)</p></div><div class="nugget-popup"><p>Intense afternoon rainfall caused the sewer network to surcharge; manholes along Albert Road surcharged and sewage and surface water ponded and accumulated. The road flooded from the junction with Middle Deal Road to the railway. Internal flooding was reported by properties; some properties experienced external flooding where sandbags or flood boards prevented internal ingress. Southern Water did not initiate their emergency response and the road was not initially closed; vehicles drove through the floodwater creating bow waves that threatened internal flooding. KCC highways and the police later implemented a road closure and KCC provided a tanker to clear flood water. [PAG] (p8)</p></div><div class="nugget-popup"><p>Manholes along the sewer network surcharged causing sewage and surface water to pond and accumulate. Road flooding occurred from the junction of Middle Deal Road to the railway; vehicles driving through the floodwater created bow waves that nearly caused internal flooding to properties. KCC Highways and police closed the road (approx. 16:45) and KCC provided a tanker to clear floodwater. Some properties avoided internal flooding using sandbags or flood boards. [PAG] (p9)</p></div><div class="nugget-popup"><p>Foul (sewer) drains were surcharged/unblocked and water levels were reduced by KFRS; debris cleared to prevent further blockage. Post&ndash;event highway works included cleansing of 10 road gullies. Southern Water later reinstated emergency response measures for Albert Road. [TAB,PAG] (p10)</p></div><div class="nugget-popup"><p>Particularly vulnerable to combined sewer surcharge during the intense rainfall on 28 August 2020, with the surface water sewer acting as a CSO and causing flooding of properties and local disruption; Southern Water reinstated emergency measures at this location. (p11)</p></div><div class="nugget-popup"><p>Albert Road was surveyed following the flooding associated with the 28 August 2020 intense rainfall event; the street was subject to surface water and sewer&ndash;related flooding which prompted the council to send out surveys to residents. [TAB] (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 properties; 21 properties [TAB] (p2)</p></div><div class="nugget-popup quant"><p>4 properties; 11 flood survey responses; 6 properties reported external flooding [PAG] (p8)</p></div><div class="nugget-popup quant"><p>4 properties internally flooded; 6 properties externally flooded [PAG] (p9)</p></div><div class="nugget-popup quant"><p>10 road gullies [TAB,PAG] (p10)</p></div><div class="nugget-popup quant"><p>62 flood surveys sent; 12 flood surveys received [TAB] (p17)</p></div></div></body></div>`)[0];
