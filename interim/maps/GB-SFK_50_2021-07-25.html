fected rear properties/sewer. (p9)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 properties; 3 flood occasions (25.07.2021; July/August 2020; one additional occasion within 6 months prior to report) [IMG,MUL] (p3)</p></div></div></body></div>`)[0];
