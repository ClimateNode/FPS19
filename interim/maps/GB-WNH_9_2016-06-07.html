&ndash;central part of Hellidon is identified as contributing to a flood incident affecting the village. The map notes the village lies in a valley with surrounding hills, which may produce runoff contributing to the flood incident. [IMG] (p30)</p></div><div class="nugget-popup"><p>Surface&ndash;water run&ndash;off from higher ground is shown flowing toward the village area; overland flow routes follow the road network and converge at marked low points/outfalls, contributing to a schematic flood area near the village centre and road bend. Indicated pipe/culvert routes and gullies may be insufficient to contain the flow. [IMG] (p31)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property (p7)</p></div><div class="nugget-popup quant"><p>1 property [PAG,MUL] (p9)</p></div><div class="nugget-popup quant"><p>two puddles; one residential property; one garage [PAG] (p12)</p></div></div></body></div>`)[0];
