                var html_b65fa8744ded3373263933496a0e5023 = $(`<div id="html_b65fa8744ded3373263933496a0e5023" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cuddington Recreation Ground</h1><div class="nugget-popup"><p>A trash screen at the entrance to a culvert in the recreation ground frequently became blocked, exacerbating surface water flooding and contributing to downstream flooding (including on Sandringham Road) by impeding flow through the culvert. [MUL] (p3)</p></div><div class="nugget-popup"><p>The culvert entrance within the recreation ground is believed to contribute to flooding. It has been selected as the site for the Worcester Park Flood Alleviation Scheme (wetland, two dry basins and restored open channel) to provide flood storage and reduce flows along the flow path. [MUL] (p12)</p></div><div class="nugget-popup"><p>The culvert entrance within the recreation ground is identified in the report as a contributing cause of flooding; flows along the recreation ground's flow path exacerbated flooding within Worcester Park (including downstream effects toward Sandringham Road). The site has been selected for a Flood Alleviation Scheme to provide storage and reduce future flood impacts. [PAG,MUL] (p13)</p></div><div class="nugget-popup"><p>Open public space reported as flooded (external) in relation to the 25 July event. [TAB] (p25)</p></div><div class="nugget-popup"><p>A culvert / Beverley Brook trash screen at the recreation ground was blocked by debris, causing water to flow out from the park onto Sandringham Road and impeding drainage, contributing to that road's flooding. (p28)</p></div><div class="nugget-popup"><p>The stretch of the Beverley Brook running through Cuddington Recreation Ground is likely to have contributed to flooding in the recreation ground and on surrounding roads during the event. [PAG] (p30)</p></div><div class="nugget-popup"><p>Trash screen became blocked with silt and debris; interim removal of silt and debris was carried out by the Parks contractor while engaging with TWUL. Debris in the culvert required clearance after the 25/07/2021 flood. [TAB] (p34)</p></div><div class="nugget-popup"><p>A blocked trash screen at Cuddington Recreation Ground during the event caused water to flow out across the park and onto Sandringham Road, increasing the volume of flooding experienced there. (p36)</p></div><div class="nugget-popup"><p>A blocked trash screen/culvert entrance on Cuddington Recreation Ground caused water to flow out of the park onto Sandringham Road; residents reported that this likely caused or exacerbated flooding and that properties on Sandringham Road came close to internal flooding on the date. [PAG] (p40)</p></div><div class="nugget-popup"><p>Blocked trash screen and high volumes of surface water flowing through the recreation ground are identified as likely contributing to surface water flooding that affected Sandringham Road (residents reported properties came close to internal flooding). [PAG] (p41)</p></div><div class="nugget-popup"><p>Following the 7th August 2021 event a contractor cleared debris from the brook within Cuddington Recreation Ground. The park experienced surface water pooling/flow issues; post&ndash;event works included cleaning the main channel of the brook, regrading banks, restoring the drain under the bridge, and improvements to the park's field drainage to reduce pooling and runoff onto Sandringham Road. [TAB] (p42)</p></div><div class="nugget-popup"><p>A reported issue with the trash screen on the culvert allowed water to flow through the park and onto Sandringham Road, contributing to flooding there. [TAB] (p43)</p></div><div class="nugget-popup"><p>Water flowed down through the recreation ground and was reported to be pouring out of it when a trash screen was blocked; this contributed to accumulation of water on adjacent roads (e.g. Sandringham Road) and to flooding of nearby properties/driveways. (p46)</p></div><div class="nugget-popup"><p>The car park driveway was affected by surface water runoff linked to blockages and debris in the brook/culvert at Cuddington Recreation Ground during the 20/10/21 event; this prompted clearing of debris, cleaning of culvert entrance and trash screens, and installation of additional gully pots afterwards. [TAB] (p47)</p></div><div class="nugget-popup"><p>The culvert entrance trash screen was blocked, creating additional surface water flooding that contributed to flooding on nearby Sandringham Road; the screen and an upstream screen were cleaned, a fortnightly cleaning regime reinstated and further remedial works (trash screen replacement, partial brickwork removal and fencing works) were planned. [TAB] (p48)</p></div><div class="nugget-popup"><p>Blockage of the trash screen on the recreation ground contributed to additional surface water flooding that worsened flooding on nearby Sandringham Road; led to actions for more frequent clearing/maintenance of the culvert and trash screen. (p49)</p></div><div class="nugget-popup"><p>Persistent blockage of the culvert and trash screen led to increased surface water flowing across the park and toward Sandringham Road, contributing to surface water flooding during heavy rainfall. [PAG] (p50)</p></div><div class="nugget-popup"><p>Blockage risk at the culvert and trash screen on Cuddington Recreation Ground contributed to local flooding/ponding; regular clearing was required to reduce flood risk prior to the Worcester Park FAS works. [MUL] (p51)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 social media report [TAB] (p25)</p></div></div></body></div>`)[0];

                var html_13c94bd229c7bb72c70bfc5076866a9c = $(`<div id="html_13c94bd229c7bb72c70bfc5076866a9c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Beverley Brook</h1><div class="nugget-popup"><p>Outfalls into Beverley Brook were likely submerged during the events, preventing sewer/discharge and contributing to sewers being inundated and surface&ndash;water flooding in the area. [MUL] (p3)</p></div><div class="nugget-popup"><p>Identified as the main river within Worcester Park and as a source of fluvial flooding for the event on 25 July 2021, contributing to flood risk in the locality. (p11)</p></div><div class="nugget-popup"><p>Part of the drainage network that was unable to convey the volume of runoff during the heavy rainfall events, contributing to surcharging gullies and surface water flooding across Worcester Park. [PAG,IMG,MUL] (p21)</p></div><div class="nugget-popup"><p>Reported flooding incidents on 25 July 2021 were spatially concentrated near Beverley Brook and its tributaries; this correlation suggests the watercourse was associated with flood impacts to nearby residential streets where internal and external flooding was reported. The local sewer network discharges to Beverley Brook, which is noted in the report as part of the drainage catchment for the affected area. [PAG,IMG] (p25)</p></div><div class="nugget-popup"><p>The Beverley Brook and its trash screen at Cuddington Recreation Ground were reported as a cause of local flooding: a blocked trash screen allowed water to back up/overflow from the park and flow onto Sandringham Road. The brook is the receiving watercourse for local sewers and surface water flows, influencing flooding in the area. [IMG,PAG] (p27)</p></div><div class="nugget-popup"><p>The brook was unable to accommodate the volume of water, contributing to sewer outfalls becoming submerged and causing gullies to surcharge; this contributed to surface water flooding of nearby roads and properties. (p28)</p></div><div class="nugget-popup"><p>Very fast flows and a high water level were observed on 25 July 2021; the brook (including culverted sections under the railway) likely contributed to local flooding by submerging outfalls and increasing water levels that affected adjacent streets and properties. [PAG,IMG] (p30)</p></div><div class="nugget-popup"><p>High flows and elevated water levels were observed on the Beverley Brook (including ordinary watercourse stretches). The brook and its subsidiary streams are identified as contributors to local flooding: they likely submerged outfalls and contributed to flooding in Cuddington Recreation Ground and surrounding roads. [IMG] (p31)</p></div><div class="nugget-popup"><p>High water levels in the Beverley Brook submerged sewer/outfall pipes (confirmed by the Section 19 report), meaning there was no capacity for sewers to discharge; this contributed to sewers surcharging and local flooding. [PAG,IMG] (p33)</p></div><div class="nugget-popup"><p>Very high water levels in the Beverley Brook submerged sewer outfalls so the sewer system could not discharge to the river, contributing to surface water flooding; the flood wall along the brook prevented it bursting its banks but may have prevented floodwater draining away after the event. [PAG] (p36)</p></div><div class="nugget-popup"><p>Discharge from multiple catchment areas into the Beverley Brook contributed to flooding that affected Worcester Park on 7th August 2021. (p37)</p></div><div class="nugget-popup"><p>Beverley Brook was unable to accommodate high flows, contributing to submerged sewer outfalls and causing gullies to surcharge; this exacerbated surface water and sewer flooding across Worcester Park and is reported as a likely cause of localized flooding (including flows from Cuddington Recreation Ground toward Sandringham Road). [PAG,IMG] (p39)</p></div><div class="nugget-popup"><p>Beverley Brook was unable to accommodate high runoff, leading to submerged sewer outfalls and likely contributing to sewer surcharging and surface water flooding in Worcester Park. A blocked trash screen on the Beverley Brook culvert at Cuddington Recreation Ground was reported as a cause of water flowing out from the park onto Sandringham Road. [PAG] (p40)</p></div><div class="nugget-popup"><p>Very fast flows and high water levels were observed on 25 July, with a social&ndash;media video showing rapid flows. Surrey County Council investigations confirmed brook levels rose above a TWUL outlet pipe on 25 July, likely submerging outfalls and causing surface water sewers to surcharge, contributing to local flooding (including nearby roads). [PAG,IMG] (p41)</p></div><div class="nugget-popup"><p>Browning Avenue and other local flows are predicted to discharge into the Beverley Brook; reported October 20th flooding incidents align with high flood&ndash;risk zones along the Beverley Brook, especially near crossings and culverted sections, indicating the brook and its culverts influenced local flooding patterns. [IMG] (p46)</p></div><div class="nugget-popup"><p>The Beverley Brook trash screen and culvert were identified by highways to be cleared to TWUL during the incident, indicating the watercourse infrastructure contributed to surface water conveyance issues and required clearing to reduce flooding risk. [TAB] (p48)</p></div><div class="nugget-popup"><p>Discharges from multiple catchment areas into the Beverley Brook contributed to flooding in the Worcester Park area and were identified as a cause needing investigation. [MUL] (p51)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>50 reports of flooding (36 internal, 10 external, 4 social media) associated with the 25 July 2021 event [PAG,IMG] (p25)</p></div><div class="nugget-popup quant"><p>one video showing very fast flows and a high water level on 25th July 2021; 14 internal flooding reports within the Flood Zone that includes parts of the brook [IMG] (p31)</p></div><div class="nugget-popup quant"><p>14 internal flooding reports; one video showing very fast flows [PAG,IMG] (p41)</p></div></div></body></div>`)[0];
                popup_9e78ee8a12af6a15e2c759187337cdd5.setContent(html_13c94bd229c7bb72c70bfc5076866a9c);

                var html_e2d05f6abbe7ec3c53580f01494cb351 = $(`<div id="html_e2d05f6abbe7ec3c53580f01494cb351" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Borough of Sutton</h1><div class="nugget-popup"><p>The report documents multiple rainfall&ndash;driven flooding incidents affecting locations within the borough, describing affected areas, local drainage network issues, local flood mechanisms and actions taken by RMAs. [PAG,MUL] (p6)</p></div><div class="nugget-popup"><p>Responded to widespread flooding on 25th July: received reports of internal and external flooding across the borough, deployed a rapid&ndash;response team and organised contractors to support gully cleansing and traffic management, and rehoused affected residents. [PAG] (p15)</p></div><div class="nugget-popup"><p>Parts of the Sutton area (including Worcester Park) experienced torrential rainfall leading to reported internal and external flooding, surface water flooding and disruption to transport (road closures, bus disruption). Rainfall&ndash;return&ndash;period mapping for the borough was produced to characterise the events. [PAG,IMG,MUL] (p16)</p></div><div class="nugget-popup"><p>Areas of Sutton (specifically Worcester Park) experienced rainfall events that led to property internal flooding (reports on 7th August), surface water external flooding (reports on 20th October), and reflected the severe July flooding across London on 12th and 25th July. [IMG,MUL] (p17)</p></div><div class="nugget-popup"><p>The London Borough of Sutton received and managed flood incidents across Worcester Park during the July&ndash;October 2021 events. A total of 59 flooding reports were recorded for the listed dates (most associated with surface water and surcharging gullies where the drainage network including Beverley Brook was unable to cope). LB Sutton deployed rapid&ndash;response teams and contractors for gully cleansing and traffic management, attended highway and property flooding, and supported residents (including rehousing). Significant disruption included road closures and impacts to public transport. [IMG,PAG,MUL] (p21)</p></div><div class="nugget-popup"><p>Actions and recommendations recorded following the 12 July flood event, including liaison with TWUL and investigation of drainage improvements at Browning Avenue/Washington Road to reduce future flood risk. [PAG] (p24)</p></div><div class="nugget-popup"><p>Reported flooding incidents are mapped within the Sutton borough boundary (northwest Worcester Park), concentrated near major intersections and infrastructure on 25 July 2021. [IMG,PAG] (p26)</p></div><div class="nugget-popup"><p>Parts of the Sutton borough (Worcester Park area) experienced surface&ndash;water and sewer&ndash;related flooding with mapped internal and external flood reports and flooded properties on named roads. [IMG,PAG] (p27)</p></div><div class="nugget-popup"><p>Investigated causes of the 25 July 2021 flooding in Worcester Park and issued recommendations (e.g., investigate groundwater vulnerability on Oaks Avenue, update multi&ndash;agency flood plan, install signage at the A2043 underpass). [PAG] (p36)</p></div><div class="nugget-popup"><p>Worcester Park (within the Sutton area) experienced heavy rainfall&ndash;driven flooding on 7th August 2021 resulting in urban/surface&ndash;water flooding in the locality. [PAG] (p37)</p></div><div class="nugget-popup"><p>Flooding occurred within the borough at Worcester Park resulting in multiple reports of internal property flooding on 7th August 2021; the borough area is used as the administrative context for the event. [PAG,IMG] (p38)</p></div><div class="nugget-popup"><p>Areas within the borough (Worcester Park) experienced surface water and sewer&ndash;related flooding on 7 August 2021, affecting residential streets (see listed locations). Incidents were associated with surface water flow toward Beverley Brook and likely surcharging of gullies/sewers. [PAG,IMG] (p39)</p></div><div class="nugget-popup"><p>Worcester Park (in the Borough of Sutton) experienced flooding that prompted a Section 19 investigation and a programme of mitigation and maintenance actions by local agencies and utilities (signage, highway reprofiling, sewer capacity reviews and culvert maintenance). [PAG,MUL] (p51)</p></div><div class="nugget-popup"><p>Local authority actions were required following flooding: highways reprofiling, investigations and coordination with lead agencies to address sewer capacity, culvert maintenance and catchment discharge issues affecting the borough. [PAG,MUL] (p52)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>36 reports of internal flooding; 10 reports of external flooding; 4 social media reports; 20 residents rehoused [PAG] (p15)</p></div><div class="nugget-popup quant"><p>36 reports of internal flooding; 10 reports of external flooding; 4 social media reports; 20 residents re&ndash;housed [PAG,IMG,MUL] (p16)</p></div><div class="nugget-popup quant"><p>5 reports of internal flooding; 1 unconfirmed flooding report; 2 reports of external flooding [IMG,MUL] (p17)</p></div><div class="nugget-popup quant"><p>59 reports; 41 internal; 12 external; 1 highway; 1 unknown; 20 residents rehoused; 36 internal reports on 25 July 2021; 10 external reports on 25 July 2021; 4 social&ndash;media reports (25 July 2021) [IMG,PAG,MUL] (p21)</p></div><div class="nugget-popup quant"><p>flooded properties on 4 roads [IMG,PAG] (p27)</p></div><div class="nugget-popup quant"><p>6 reports of flooding (within Worcester Park area of the borough) [PAG,IMG] (p38)</p></div><div class="nugget-popup quant"><p>1 property on Browning Avenue; 1 property on Buckland Way; 1 property on Cheam Common Road; 1 property on Donnington Road; 1 property on Oaks Avenue; 1 property on Sandringham Road [PAG,IMG] (p39)</p></div></div></body></div>`)[0];

                var html_06dbdea9459435c523c114ee4c10a1c6 = $(`<div id="html_06dbdea9459435c523c114ee4c10a1c6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Region</h1><div class="nugget-popup"><p>Severe flooding occurred across London during the 12th July 2021 and 25th July 2021 events; the report states the severe London&ndash;wide flooding is reflected in the flooding observed in Worcester Park. [PAG,IMG,MUL] (p17)</p></div><div class="nugget-popup"><p>Severe flooding occurred across London on 12 July 2021 and 25 July 2021, driven by intense, localised rainfall that caused urban/surface&ndash;water flooding. Peak rainfall in some localities may have been under&ndash;recorded by distant gauges. [MUL] (p18)</p></div><div class="nugget-popup"><p>On 12 July 2021 heavy rain across London caused widespread flooding and flash floods; Worcester Park was affected as part of this broader London&ndash;wide rainfall event. [PAG,IMG] (p21)</p></div></div></body></div>`)[0];

                var html_22b6c8e5b1726c9d5af8f3484d48374f = $(`<div id="html_22b6c8e5b1726c9d5af8f3484d48374f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Browning Avenue, Worcester Park</h1><div class="nugget-popup"><p>Flooding occurred on Browning Avenue during the heavy rainfall events; the sewers were inundated and TWUL recorded extreme return periods for this location. [PAG,MUL] (p3)</p></div><div class="nugget-popup"><p>Highway flooding that caused the road to be blocked off temporarily and disrupted traffic; the event caused localised transport disruption. [PAG] (p14)</p></div><div class="nugget-popup"><p>Highway flooding caused disruption on the road that required it to be temporarily blocked off. [PAG] (p15)</p></div><div class="nugget-popup"><p>Highway flooding with water pooling on the road at the junction with Washington Road; surface water accumulated on the carriageway (traffic cones used to block area in photos). The event may have been caused or worsened by an overwhelmed or blocked surface water sewer and limited drainage (only one gully at the junction). No properties were reported flooded during this event. (p22)</p></div><div class="nugget-popup"><p>Highway flooding with water pooling on the road at the junction with Washington Road; surface water sewer appeared overwhelmed or blocked prompting TWUL attendance to clear the surface water sewer. No properties flooded during the event. [PAG,IMG] (p23)</p></div><div class="nugget-popup"><p>TWUL cleared a surface water sewer during the 12 July event and had previously cleared a foul sewer on Browning Avenue due to sewer misuse; the 25 July thunderstorm also affected Browning Avenue, with TWUL estimating the 25 July event as having a 1 in 62 year return period. [TAB,MUL] (p24)</p></div><div class="nugget-popup"><p>Browning Avenue had at least one instance of internal flooding reported. TWUL attended and cleared the surface water sewer on Browning Avenue during the event, indicating sewer&ndash;system involvement in the flooding at this location. [TAB,PAG] (p25)</p></div><div class="nugget-popup"><p>Properties on Browning Avenue are identified as being at higher risk (within 1 in 30 and 1 in 100 year extents) and lie on the surface&ndash;water flow paths where properties reported flooding associated with the 25 July 2021 event. (p29)</p></div><div class="nugget-popup"><p>A request was made to close Browning Avenue to traffic as part of the response to the flooding incident on 25/07/2021. [TAB] (p34)</p></div><div class="nugget-popup"><p>A blockage in the surface water sewer was cleared during the heavy rainfall event, indicating surface water flooding affected the street; subsequent camera checks and further foul sewer clearances were recorded after the event. [TAB] (p35)</p></div><div class="nugget-popup"><p>One report of internal (property) flooding was recorded on 7 August 2021 at Browning Avenue. [PAG,TAB] (p38)</p></div><div class="nugget-popup"><p>Water was likely to pool at the corner by Washington Road on Browning Avenue and then flow north towards the Beverley Brook, driven by insufficient drainage and extensive impermeable surfaces&mdash;indicating local surface water flooding. (p40)</p></div><div class="nugget-popup"><p>Debris was cleared from a surface water sewer on Browning Avenue on 07/08/2021 and again a few weeks later, indicating the road was affected by overwhelmed/blocked surface water sewers and likely sewer flooding on that date. (p42)</p></div><div class="nugget-popup"><p>Debris was cleared from a surface water sewer on Browning Avenue by TWUL during the event following reports of flooding, indicating surface water/sewer&ndash;related flooding impacts. [TAB] (p43)</p></div><div class="nugget-popup"><p>External flooding reported on Browning Avenue during the heavy rainfall on 20th October 2021. (p44)</p></div><div class="nugget-popup"><p>External flooding predominantly covering the road and driveway; water flowed north&ndash;west towards Beverley Brook. The text notes only one gully at the corner and it is not confirmed whether floodwater reached property boundaries. [PAG,IMG] (p45)</p></div><div class="nugget-popup"><p>Road and driveways were reported to be predominantly covered by flood water; resident reported their back garden flooded and that the house came close to internal flooding. Gullies at this location were inundated, contributing to accumulation and flooding; sewers were unable to cope with the volume of water. (p46)</p></div><div class="nugget-popup"><p>Reported flooding location for which TWUL was contacted to attend; road closure was organised due to flooding on 20/10/2021. [TAB] (p47)</p></div><div class="nugget-popup"><p>Flooding on Browning Avenue was attributed to surface water and sewer flooding; a blockage in a surface water sewer was cleared during the incident response. [TAB,PAG] (p48)</p></div><div class="nugget-popup"><p>Experienced flooding where the main causes were identified as surface water and sewer flooding during the heavy rainfall event examined. (p49)</p></div><div class="nugget-popup"><p>Experienced external flooding during heavy rainfall caused by surface water runoff and sewer system surcharge, identified as a main cause of the flooding incident examined for the 20 October 2021 event. [PAG] (p50)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one report of highway flooding [PAG] (p14)</p></div><div class="nugget-popup quant"><p>1 report of highway flooding [PAG] (p15)</p></div><div class="nugget-popup quant"><p>one report of highway flooding; one gully at the junction of Washington Road and Browning Avenue (p22)</p></div><div class="nugget-popup quant"><p>1 highway flooding report [PAG,IMG] (p23)</p></div><div class="nugget-popup quant"><p>1 internal flooding report [TAB,PAG] (p25)</p></div><div class="nugget-popup quant"><p>1 internal flooding report [PAG,TAB] (p38)</p></div><div class="nugget-popup quant"><p>two external flooding reports (across Browning Avenue and Sandringham Road) (p44)</p></div><div class="nugget-popup quant"><p>1 road closure [TAB] (p47)</p></div></div></body></div>`)[0];

                var html_744306350ff56613fa9be1e26d29e10b = $(`<div id="html_744306350ff56613fa9be1e26d29e10b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Sandringham Road, Worcester Park</h1><div class="nugget-popup"><p>Surface water entered and inundated the drainage/sewer network and could not discharge (outfalls likely submerged), contributing to flooding at/around Sandringham Road; a culvert issue in Cuddington Recreation Ground also contributed to surface water reaching this road. LB Sutton subsequently installed new gullies on Sandringham Road to redirect water away from properties and address highway profile issues. (p3)</p></div><div class="nugget-popup"><p>Sandringham Road was specifically identified as being affected by flooding along the Cuddington Recreation Ground flow path and is a target for measures in the Flood Alleviation Scheme to reduce future flooding. [MUL] (p12)</p></div><div class="nugget-popup"><p>Sandringham Road was flooded during the thunderstorms of 25th July 2021; TWUL's analysis records the event at Sandringham Road as having a return period of approximately 1 in 62 years. (p24)</p></div><div class="nugget-popup"><p>Reported internal and external flooding associated with the 25 July event. [TAB,PAG] (p25)</p></div><div class="nugget-popup"><p>Residents reported flooding on Sandringham Road when water flowed out from Cuddington Recreation Ground because the Beverley Brook trash screen/culvert entrance was blocked. (p28)</p></div><div class="nugget-popup"><p>Surface water flowed northwest from Sandringham Road toward A2043 Central Road as part of a mapped flow path; properties on Sandringham Road were on that flow path and reported flooding during the 25 July 2021 event. Sandringham Road is also listed as being at risk from 1 in 30 and 1 in 100 year events. (p29)</p></div><div class="nugget-popup"><p>Gullies were reported blocked (grass cuttings) and surcharging, leading to water pooling on the road; likely prevented surface water draining into the sewer network and contributed to local sewer surcharge. [PAG] (p33)</p></div><div class="nugget-popup"><p>A blocked trash screen in Cuddington Recreation Ground caused water to flow out across the park and onto Sandringham Road, increasing the volume of flooding on the road. (p36)</p></div><div class="nugget-popup"><p>One report of internal flooding (internal source) affecting premises on Sandringham Road during the event. [PAG,IMG,TAB] (p38)</p></div><div class="nugget-popup"><p>High&ndash;volume surface water flow (originating from Cuddington Recreation Ground where the trash screen was frequently blocked) caused flooding on Sandringham Road; residents reported properties came close to internal flooding. (p40)</p></div><div class="nugget-popup"><p>Surface water from Cuddington Recreation Ground and blocked trash screens/islanded gullies caused flooding and pooling on the road; residents reported properties came close to internal flooding. UK water company (TWUL) removed tree roots from a foul sewer on Sandringham Road following flooding, indicating sewer surcharge/impacts. [PAG] (p41)</p></div><div class="nugget-popup"><p>Following flooding on 07/08/2021, TWUL removed tree roots from the foul sewer on Sandringham Road. Sandbags were provided to high&ndash;risk locations including Sandringham Road. [TAB] (p42)</p></div><div class="nugget-popup"><p>Water was reported as flowing through Cuddington Recreation Ground onto Sandringham Road, causing flooding there; Highways provided sandbags to residents adjacent to the Cuddington Recreation Ground culvert including Sandringham Road. [TAB] (p43)</p></div><div class="nugget-popup"><p>External flooding reported on Sandringham Road on 20th October 2021. The local drainage includes two main surface water sewers alongside Sandringham Road (and one main foul sewer); water from Cuddington Recreation Ground enters the surface water sewers via the park culvert. (p44)</p></div><div class="nugget-popup"><p>External flooding of the road; runoff from Cuddington Recreation Ground entered the surface water sewers via the park culvert and accumulated in the road. A resident reported their back garden was flooded and their house came close to internal flooding. Thames Water sewers did not cope with the volume of water on the day and a trash screen was reported blocked. [PAG,IMG] (p45)</p></div><div class="nugget-popup"><p>Water was reported flowing across Cuddington Recreation Ground and accumulating on Sandringham Road; the road lies within a surface water flow path and gullies have been inundated causing accumulation and flooding to properties in the area. Sewers were reported not to cope with the volume of water on the date. (p46)</p></div><div class="nugget-popup"><p>Road closure was organised due to flooding on 20/10/2021. [TAB] (p47)</p></div><div class="nugget-popup"><p>Sandringham Road experienced flooding from surface water and sewer flooding; the blockage of the trash screen at Cuddington Recreation Ground increased surface water flows onto the road. Follow&ndash;up works included a TWUL survey and re&ndash;lining of their surface water sewer and highway actions to install new gullies and consider road remodelling. [TAB,PAG] (p48)</p></div><div class="nugget-popup"><p>Suffered flooding driven by surface water and sewer flooding; blockage of the trash screen on the nearby recreation ground contributed additional surface water flooding. Post&ndash;event highway works (a road hump) were installed and later recommended to be reprofilied to prevent pooling. [PAG] (p49)</p></div><div class="nugget-popup"><p>Flooding on Sandringham Road was caused by surface water and sewer flooding and was exacerbated by blockage of the trash screen on Cuddington Recreation Ground which increased surface water entering the road. Highway profile issues and surface water pooling occurred (a road hump was installed and later recommended to be reprofiled). [PAG] (p50)</p></div><div class="nugget-popup"><p>Surface water pooling and highway profile issues occurred on Sandringham Road following the flooding events, leading to the installation (and need to reprofile) of a road hump to address pooling. [MUL] (p51)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property internally flooded; 1 external flood report [TAB,PAG] (p25)</p></div><div class="nugget-popup quant"><p>two reports of grass cuttings blocking gullies (affecting Oaks Avenue and Sandringham Road) [PAG] (p33)</p></div><div class="nugget-popup quant"><p>1 report [PAG,IMG,TAB] (p38)</p></div><div class="nugget-popup quant"><p>two external flooding reports (across Browning Avenue and Sandringham Road) (p44)</p></div><div class="nugget-popup quant"><p>1 road closure [TAB] (p47)</p></div></div></body></div>`)[0];

                var html_8861a4ceb0119d093b788d1b22ca788c = $(`<div id="html_8861a4ceb0119d093b788d1b22ca788c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Oaks Avenue, Worcester Park</h1><div class="nugget-popup"><p>Reports of flooding at Oaks Avenue led TWUL to attend and inspect foul and surface water sewers. [PAG] (p16)</p></div><div class="nugget-popup"><p>Two properties internally flooded and one external flood reported on 25 July; TWUL attended Oaks Avenue on 7 August to check foul and surface water sewers following additional reports of flooding. [TAB,MUL] (p25)</p></div><div class="nugget-popup"><p>Groundwater flooding is reported as a likely contributor to flooding on Oaks Avenue. The bedrock geology (London Clay) and a raised water table following heavy rainfall may have caused groundwater to rise into gardens and contribute to recorded flooding at this location. [PAG,IMG,MUL] (p32)</p></div><div class="nugget-popup"><p>Gardens and properties experienced flooding: residents reported groundwater rising in gardens following heavy rainfall and at least one resident reported a mass of water (potentially sewage) entering their garden as gullies surcharged. Gullies on the road were reported full and water pooled on the road, consistent with sewers at capacity or blocked outfalls. [PAG,MUL] (p33)</p></div><div class="nugget-popup"><p>One report of internal (property) flooding was recorded on 7 August 2021 at Oaks Avenue; TWUL attended to inspect foul and surface water sewers in response to reports. [PAG,TAB] (p38)</p></div><div class="nugget-popup"><p>Surface water flowed downhill from the southern end of Oaks Avenue towards the junction with Dalmeny Road; gullies were reported to be surcharging during the event, indicating surface water and sewer interaction and localised flooding. [PAG] (p40)</p></div><div class="nugget-popup"><p>Groundwater was reported to have risen into gardens following heavy rainfall (linked to the 25th July event) and on 7th August sewers were inundated by rainfall causing surface water and sewer surcharging; a resident reported a mass of water entering a garden that may have been sewage; gullies were reported blocked which impeded drainage. [PAG,IMG,MUL] (p41)</p></div><div class="nugget-popup"><p>Sewers on Oaks Avenue were inspected on 07/08/2021 and were found to have been inundated by the volume of rainfall, indicating sewer flooding. It was also noted that groundwater levels may have been elevated following heavy rainfall on 12/07/2021 and 25/07/2021, so groundwater flooding on Oaks Avenue on 07/08/2021 is possible. [PAG,MUL] (p42)</p></div><div class="nugget-popup"><p>Flooding was reported on Oaks Avenue: sewers were inundated and gullies surcharged, causing water to accumulate on the surface. TWUL attended site to check foul and surface water sewers following reports of flooding. [TAB] (p43)</p></div><div class="nugget-popup"><p>Sewer network capacity constraints and a potential misconnection were identified on/near Oaks Avenue, contributing to sewer&ndash;related flooding and prompting consideration of capacity increases. [MUL] (p51)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 properties internally flooded; 1 external flood report [TAB,MUL] (p25)</p></div><div class="nugget-popup quant"><p>one report of flooding from a resident on Oaks Avenue [PAG,MUL] (p33)</p></div><div class="nugget-popup quant"><p>1 internal flooding report [PAG,TAB] (p38)</p></div><div class="nugget-popup quant"><p>one report of flooding from a resident on Oaks Avenue; two reports of gullies blocked affecting Oaks Avenue and Sandringham Road [PAG,IMG,MUL] (p41)</p></div></div></body></div>`)[0];

                var html_90e62440c924b1cd64feda7d5f2363c6 = $(`<div id="html_90e62440c924b1cd64feda7d5f2363c6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Green Lane, Worcester Park</h1><div class="nugget-popup"><p>Road closures contributing to disruption of public and non&ndash;public transport during the flooding event. [PAG] (p15)</p></div><div class="nugget-popup"><p>Residential properties experienced internal and external flooding; Green Lane was reported closed due to flooding during the 25 July event. [TAB] (p25)</p></div><div class="nugget-popup"><p>Surface water was conveyed northwest toward Green Lane from low&ndash;lying roads, acting as a flow route toward the Beverley Brook and creating local drainage/ inundation impacts. (p28)</p></div><div class="nugget-popup"><p>Surface water flowed along the mapped flow path and caused flooding of properties on Green Lane during the event; the street is identified as being at risk from 1 in 30 and 1 in 100 year surface water flood events. (p29)</p></div><div class="nugget-popup"><p>Portions of Green Lane lie within Flood Zone 3 and experienced flooding linked to high water levels in the Beverley Brook and surface water flow paths; properties on Green Lane reported internal flooding during the event. [PAG] (p30)</p></div><div class="nugget-popup"><p>Flooding occurred on Green Lane with outfalls submerged; nearby streams leading off Beverley Brook and high flows in the Beverley Brook are identified as likely contributors to flooding on the street. Part of Green Lane lies within Flood Zone 3. [PAG] (p31)</p></div><div class="nugget-popup"><p>Road was closed during the 25/07/21 incident. Foul sewer blockages on Green Lane were identified and later cleared by Thames Water Utilities Ltd (TWUL); gullies/sewers contributed to the flooding and required contractor intervention and cleansing. [TAB,PAG] (p34)</p></div><div class="nugget-popup"><p>Water pooled against the flood wall along the Beverley Brook on Green Lane because sewers could not drain to the submerged river, contributing to local flooding and hindering drainage after the event. (p36)</p></div><div class="nugget-popup"><p>Portions of Green Lane lie within EA Flood Zones (part in Flood Zone 3, majority in Flood Zone 2) adjacent to the Beverley Brook; the brook's high flows on 25 July mean fluvial flooding may have occurred in the area near Green Lane. [PAG,IMG] (p41)</p></div><div class="nugget-popup"><p>Road closure was organised due to flooding on 20/10/2021. [TAB] (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>14 properties internally flooded; 1 external flood report; 2 social media reports [TAB] (p25)</p></div><div class="nugget-popup quant"><p>14 internal flooding reports (within the Flood Zone 3 area) [PAG] (p30)</p></div><div class="nugget-popup quant"><p>14 internal flooding reports within Flood Zone 3 [PAG] (p31)</p></div><div class="nugget-popup quant"><p>1 road closure [TAB] (p47)</p></div></div></body></div>`)[0];

                var html_ee7652573b3c9cff8961daab47956ffa = $(`<div id="html_ee7652573b3c9cff8961daab47956ffa" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Balmoral Road, Worcester Park</h1><div class="nugget-popup"><p>A surface water sewer blockage was reported at the junction of Balmoral Road and Braemar Road during the heavy rainfall event on 7 August 2021, contributing to local surface water / sewer flooding. [TAB] (p42)</p></div></div></body></div>`)[0];

                var html_52c258042ac89e1833fc0d5bc8a24b31 = $(`<div id="html_52c258042ac89e1833fc0d5bc8a24b31" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Worcester Park</h1><div class="nugget-popup"><p>Heavy rainfall caused significant flooding in the Worcester Park area across multiple events. There were numerous internal and external property flooding reports, highway flooding and incidents spread across multiple roads. Flooding was driven by overwhelming surface water entering the sewer network and outfalls to watercourses being submerged. [MUL] (p3)</p></div><div class="nugget-popup"><p>Four significant flood events in 2021 caused internal and external property flooding and at least one highway flooding incident across the Worcester Park area; reports covered multiple locations within the area and were used to trigger a Section 19 investigation. [MUL] (p9)</p></div><div class="nugget-popup"><p>Experienced fluvial flood risk from Beverley Brook; Beverley Brook was identified as a potential source of flooding affecting Worcester Park during the 25 July 2021 event. (p11)</p></div><div class="nugget-popup"><p>Worcester Park area experienced flooding that affected streets and properties along the Cuddington Recreation Ground flow path; the area (including Sandringham Road) is being targeted by a Flood Alleviation Scheme to reduce future incidents. [MUL] (p12)</p></div><div class="nugget-popup"><p>Worcester Park experienced flooding associated with intense rainfall; local streets and flow paths were inundated during the July&ndash;October 2021 rainfall incidents. [PAG,MUL] (p13)</p></div><div class="nugget-popup"><p>The Worcester Park area experienced flooding associated with multiple intense rainfall events between July and October 2021, producing localised flooding and disruption across the area. [MUL] (p14)</p></div><div class="nugget-popup"><p>Multiple flood incidents: internal and external property flooding reports, rehousing of residents, and widespread transport disruption including road closures on A2043 Central Road and Green Lane; emergency rescue from a car stuck in floodwaters. [PAG] (p15)</p></div><div class="nugget-popup"><p>Worcester Park experienced multiple flood incidents during the summer/autumn 2021 rainfall events. Impacts included internal and external property flooding reported during the 25 July event, five reports of internal flooding associated with the 7 August event (TWUL attended Oaks Avenue to check foul and surface water sewers), and two reports of external/surface&ndash;water flooding on 20 October. Local roads (including the A2043 Central Road and Green Lane) were closed during the larger event, causing disruption to public and non&ndash;public transport and requiring emergency response. [PAG,MUL] (p16)</p></div><div class="nugget-popup"><p>Properties and streets in Worcester Park experienced flooding: multiple internal (property) flood reports and external surface water inundation. Thames Water (TWUL) attended Oaks Avenue to check foul and surface water sewers following reports of flooding. [IMG,PAG,MUL] (p17)</p></div><div class="nugget-popup"><p>Worcester Park experienced flooding that reflected the severe London&ndash;wide flooding on 12 July 2021 and 25 July 2021. The flooding was associated with localised intense rainfall leading to urban/surface&ndash;water inundation; the absence of rain gauges within the local hydrological catchment means peak rainfall and the full extent of flooding in Worcester Park are uncertain. [MUL] (p18)</p></div><div class="nugget-popup"><p>Worcester Park experienced multiple flood incidents during the mid&ndash;2021 rainfall events: highway flooding on Browning Avenue (12 July) and widespread internal and external flooding associated with torrential rain on 25 July and other dates, causing road closures, transport disruption and some residents to be rehoused. [PAG,IMG,MUL] (p21)</p></div><div class="nugget-popup"><p>Experienced heavy rainfall on 12 July 2021 with high return&ndash;period estimates; only one reported instance of highway flooding in the area (on Browning Avenue). The heavy rain did not flood properties on that date but may have raised the water table and influenced later floods. (p22)</p></div><div class="nugget-popup"><p>High&ndash;intensity rainfall on 12 July 2021 produced surface&ndash;water (highway) flooding on Browning Avenue: water pooled on the road surface (particularly at the corner with Washington Road), and Thames Water attended to clear the surface water sewer. No properties were recorded as flooding during this event. Local drainage capacity (single gully at the Washington Road/Browning Avenue junction) and blocked sewers likely contributed to accumulation at the topographic low point. [PAG,IMG] (p23)</p></div><div class="nugget-popup"><p>Significant flooding from thunderstorms on 25th July 2021 affected several areas of Worcester Park; high&ndash;level mapping indicates the area experienced return periods equivalent to 1 in 30, 1 in 50 and 1 in 100 year events. (p24)</p></div><div class="nugget-popup"><p>Multiple areas within Worcester Park experienced flooding during intense rainfall events: numerous internal and external property floods on 25 July 2021, further internal flooding reports on 7 August 2021, and a reported flood event on 12 July 2021. The spatial distribution of reports is concentrated near local watercourses. [PAG,IMG,MUL] (p25)</p></div><div class="nugget-popup"><p>Reported internal (property) and street&ndash;level flooding in northwest Worcester Park; flood reports cluster near major intersections and infrastructure nodes on the NW map overlay. [IMG,PAG] (p26)</p></div><div class="nugget-popup"><p>Surface water collected at a topographic low and flooded properties on Caldbeck Avenue, Longfellow Road, Brinkley Road and Lindsay Road; surface water was conveyed downhill toward Green Lane and Beverley Brook. Residents reported Sandringham Road was flooded after water flowed out from Cuddington Recreation Ground where the Beverley Brook trash screen was blocked. [IMG,PAG] (p27)</p></div><div class="nugget-popup"><p>Worcester Park experienced surface water / urban flooding on overland flow paths during the 25th July 2021 event; many properties that reported flooding are located on these flow paths and the area shows high risk of surface water flooding. (p29)</p></div><div class="nugget-popup"><p>Residential streets and properties in Worcester Park experienced surface&ndash;water and fluvial flooding concentrated along identified flow paths. Flooding affected roads including Green Lane, Sandringham Road, Browning Avenue, Longfellow Road, Lindsay Road and A2043 Central Road, with internal and external reports clustered in low&ndash;lying RoFSW zones and alongside river corridors; social media captured very fast flows and high water levels on the Beverley Brook. [PAG,IMG] (p30)</p></div><div class="nugget-popup"><p>Concentrated internal and external property flooding in residential areas adjacent to the Beverley Brook. Reported incidents cluster along streets near the river network and in areas within Flood Zone 3; social media captured very fast flows on the Beverley Brook indicating river influence on local flooding. [PAG,IMG] (p31)</p></div><div class="nugget-popup"><p>Properties adjacent to the Beverley Brook/main river corridor experienced internal flooding reports concentrated in Flood Zone 3. Fast flows and a high water level were observed on the Beverley Brook (social media video) indicating potential fluvial flooding affecting properties near Green Lane and A2043 (Central Road). [PAG,IMG] (p32)</p></div><div class="nugget-popup"><p>Clusters of external and internal flooding were reported near Beverley Brook; road gullies surcharged and water pooled on roads. Sewer surcharge and submerged outfalls contributed to surface&ndash;water backflow and there were resident reports of water (potentially sewage&ndash;contaminated) entering gardens. Heavy rainfall on 12th July may have elevated groundwater, which could have contributed to groundwater flooding reported at Oaks Avenue around the 25th July. [IMG,MUL] (p33)</p></div><div class="nugget-popup"><p>Resident report of a mass of water (possibly sewage) entering a garden on Oaks Avenue; surface water drained downhill along Oaks Avenue towards the junction with Dalmeny Road, gullies were full and water emerged from the gullies into the garden, with likely partial cause being sewer flooding due to sewers at capacity or a misconnection. [TAB] (p34)</p></div><div class="nugget-popup"><p>Inundation from heavy rainfall leading to surface water pooling on roads, sewers surcharging and discharging into roads (exacerbated by blocked sewers and debris), high water levels in the Beverley Brook limiting sewer outfall capacity and causing pooling against the flood wall on Green Lane; potential groundwater flooding in Oaks Avenue; blocked trash screen at Cuddington Recreation Ground led to water flowing across the park and onto Sandringham Road. [MUL] (p36)</p></div><div class="nugget-popup"><p>Multiple properties reported internal flooding across residential streets in Worcester Park; flooding incidents were reported across the neighbourhood and were associated with local sewer and surface&ndash;water issues. [PAG,IMG] (p38)</p></div><div class="nugget-popup"><p>Surface water flowed to topographical low points causing localised flooding of streets and properties. Properties on Caldbeck Avenue, Longfellow Road, Brinkley Road and Lindsay Road are described as flooded; water from Cuddington Recreation Ground flowed onto Sandringham Road with residents reporting properties came close to internal flooding; gullies surcharged and sewer outfalls were likely submerged, contributing to road and underpass flooding. [PAG,IMG] (p39)</p></div><div class="nugget-popup"><p>Surface water and sewer&ndash;related flooding affected multiple streets and properties within Worcester Park on 7 August 2021. Flood water flowed north towards the Beverley Brook, pooled at topographic lows (including Caldbeck Avenue, Longfellow Road, Brinkley Road, Lindsay Road, Sandringham Road, parts of Oaks Avenue, Dalmeny Road and Central Road), gullies surcharged, and a blocked trash screen at Cuddington Recreation Ground is reported to have caused flows onto Sandringham Road. [PAG,IMG] (p40)</p></div><div class="nugget-popup"><p>Multiple reported incidents across the area: surface water runoff and blocked/overwhelmed gullies caused road pooling and near&ndash;internal flooding on streets (e.g., Sandringham Road, Buckland Way, Browning Avenue); surface water sewers were overwhelmed or surcharged causing sewer flooding risk; high flows in the Beverley Brook indicate river (fluvial) flood risk in areas adjacent to the brook; groundwater levels (raised by prior July rainfall) may have contributed to flood impacts at locations such as Oaks Avenue. [PAG,IMG,MUL] (p41)</p></div><div class="nugget-popup"><p>On 7th August 2021 heavy rainfall inundated foul and surface water sewers causing them to be overwhelmed. TWUL inspections on 7th August indicated sewers were inundated (not blocked), resulting in sewer flooding affecting parts of Worcester Park (including Oaks Avenue, Sandringham Road and Browning Avenue). Response actions during and after the event included gully&ndash;suctioning, sandbags on Sandringham Road, tree&ndash;root removal from a foul sewer on Sandringham Road, and debris clearance from a surface water sewer on Browning Avenue. [PAG] (p42)</p></div><div class="nugget-popup"><p>High rainfall caused multiple flooding incidents. Sewers were inundated so gullies surcharged and water accumulated on the surface. A trash screen issue at Cuddington Recreation Ground allowed water to flow through the park onto Sandringham Road, causing flooding. There is potential for groundwater flooding to have caused flooding on Oaks Avenue. [PAG,MUL] (p43)</p></div><div class="nugget-popup"><p>A period of heavy rainfall on 20th October 2021 caused external (surface water/urban) flooding within Worcester Park; two reports of external flooding were received (Browning Avenue and Sandringham Road). No reports of internal flooding were received for this event. [IMG,PAG] (p44)</p></div><div class="nugget-popup"><p>The Worcester Park area experienced heavy rainfall on 20 October 2021 that caused external flooding in the locality; two reports of external flooding were recorded (one on Sandringham Road and one on Browning Avenue). At least one residence reported a flooded back garden and nearly internal flooding. [IMG] (p45)</p></div><div class="nugget-popup"><p>Reported external flooding incidents (mapped as magenta circles) occurred in Worcester Park on 20 October 2021, particularly near river crossings and low&ndash;lying streets where RoFSW zones are concentrated. [IMG] (p46)</p></div><div class="nugget-popup"><p>Multiple heavy&ndash;rainfall flooding incidents across the Worcester Park area resulting in surface water and sewer flooding; persistent blockage of the trash screen in Cuddington Recreation Ground increased surface water flow across the park toward Sandringham Road. [PAG,MUL] (p50)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>59 flooding reports; 41 internal flooding; 12 external flooding; 1 highway flooding; spread across 14 roads; 4 flooding reports from social media [MUL] (p3)</p></div><div class="nugget-popup quant"><p>41 reports of internal flooding; 12 reports of external flooding; 1 report of highway flooding; 1 report with unconfirmed location; 50 reports on 25 July 2021; 6 reports on 7 August 2021; 2 reports on 20 October 2021; 1 report on 12 July 2021; 4 social media reports incorporated for 25 July 2021; reports came from 14 different locations. [MUL] (p9)</p></div><div class="nugget-popup quant"><p>36 reports of internal flooding; 10 reports of external flooding; 4 social media reports; 20 residents rehoused [PAG] (p15)</p></div><div class="nugget-popup quant"><p>5 reports of internal flooding (7th August 2021); 2 reports of external flooding (20th October 2021) [PAG,MUL] (p16)</p></div><div class="nugget-popup quant"><p>five reports of internal flooding; one report with unconfirmed location; two reports of external flooding [IMG,PAG,MUL] (p17)</p></div><div class="nugget-popup quant"><p>59 reports of flooding; 41 internal; 12 external; 1 highway; 1 unknown; 4 social media reports; 20 residents rehoused [PAG,IMG,MUL] (p21)</p></div><div class="nugget-popup quant"><p>one report of highway flooding (p22)</p></div><div class="nugget-popup quant"><p>one report of highway flooding; one gully at the junction of Washington Road and Browning Avenue; TWUL attended once during 2022 to clear a foul sewer blockage [PAG,IMG] (p23)</p></div><div class="nugget-popup quant"><p>50 reports of flooding (residents) received on 25th July; 5 internal reports on 7th August; 1 unconfirmed report on 7th August [PAG,IMG,MUL] (p25)</p></div><div class="nugget-popup quant"><p>flooded properties on 4 roads [IMG,PAG] (p27)</p></div><div class="nugget-popup quant"><p>14 internal flooding reports [PAG,IMG] (p30)</p></div><div class="nugget-popup quant"><p>14 internal flooding reports [PAG,IMG] (p31)</p></div><div class="nugget-popup quant"><p>14 internal flooding reports; one social media video [PAG,IMG] (p32)</p></div><div class="nugget-popup quant"><p>one report of flooding [TAB] (p34)</p></div><div class="nugget-popup quant"><p>6 reports of flooding; 5 internal property flood reports; 1 report with unknown source [PAG,IMG] (p38)</p></div><div class="nugget-popup quant"><p>6 reported locations with 1 report each (Browning Avenue; Buckland Way; Cheam Common Road; Donnington Road; Oaks Avenue; Sandringham Road) [PAG,IMG] (p39)</p></div><div class="nugget-popup quant"><p>14 internal flooding reports [PAG,IMG,MUL] (p41)</p></div><div class="nugget-popup quant"><p>six different flood incidents [PAG,MUL] (p43)</p></div><div class="nugget-popup quant"><p>two external flooding reports [IMG,PAG] (p44)</p></div><div class="nugget-popup quant"><p>two reports of external flooding; one back garden flooded [IMG] (p45)</p></div><div class="nugget-popup quant"><p>25 flooding reports [PAG,MUL] (p50)</p></div></div></body></div>`)[0];
                popup_8687dff49280bead80711092967a9a5f.setContent(html_52c258042ac89e1833fc0d5bc8a24b31);

                var html_3dacb6e63a3701b84769eec11b4e3041 = $(`<div id="html_3dacb6e63a3701b84769eec11b4e3041" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cuddington</h1><div class="nugget-popup"><p>Flooding affected infrastructure in the Cuddington area (blocked trash screen and culvert at Cuddington Recreation Ground required clearing; council and contractors undertook clearance works following the 25/07/2021 event). [TAB] (p34)</p></div><div class="nugget-popup"><p>A reported issue with the trash screen at Cuddington Recreation Ground allowed water to flow through the park onto Sandringham Road, causing flooding; residents adjacent to the Cuddington Recreation Ground culvert were provided with sandbags. [TAB] (p43)</p></div><div class="nugget-popup"><p>Debris accumulation in the brook and a blocked trash screen at Cuddington Recreation Ground impaired flow during heavy rainfall on 20/10/2021, contributing to local flooding risk that led to preparations for internal flooding of surrounding properties; contractor cleared debris (1 October) and culvert/trash screens were cleaned after the event; additional gully pots were installed on the car park driveway. [TAB] (p47)</p></div></div></body></div>`)[0];
