sk: 1 - 3.3% annual chance; properties located in Flood Zone 1 (<0.1% annual chance) while adjacent playing field/rear gardens lie largely in Flood Zone 2 (between 1% and 0.1% annual chance); flow velocities shown >0.25 m/s in darker blue areas. [IMG] (p6)</p></div></div></body></div>`)[0];

                var html_1f6a26245ba947913ee1e83f14f3cadc = $(`<div id="html_1f6a26245ba947913ee1e83f14f3cadc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Haverhill</h1><div class="nugget-popup"><p>An intense localised rainfall event on 25.07.2021 overwhelmed drainage across much of the town. Flooding was reported in multiple streets and properties were inundated north of Sturmer Road (postcode CO9 4BB). Runoff from a nearby industrial estate contributed to flows along Falconer Road once highway drainage was overwhelmed; an embankment prevented Stour Brook overtopping but also impeded flows into the watercourse. (p3)</p></div><div class="nugget-popup"><p>Rear gardens and the playing field to the west were inundated. Surface water accumulated in Sturmer Road (highway) and flowed through rear gardens, adding to volumes from the Stour Brook; this reduced local overland storage capacity and contributed to internal flooding of properties (internal flooding not directly attributable to fluvial flooding). Floodwaters mixed with sewage from private septic tanks on at least one occasion, increasing contamination risk. Highway gullies were overwhelmed and potential surcharge from a surface water sewer serving the industrial estate contributed to flows. [PAG] (p7)</p></div></div></body></div>`)[0];
