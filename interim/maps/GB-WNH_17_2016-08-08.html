led water towards buildings. [IMG,PAG] (p51)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property [MUL] (p7)</p></div><div class="nugget-popup quant"><p>one property (p9)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p10)</p></div></div></body></div>`)[0];
