                var html_ec4a292e8b04fa4d9ce48fe5029d1681 = $(`<div id="html_ec4a292e8b04fa4d9ce48fe5029d1681" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Quebec Road, Tilbury</h1><div class="nugget-popup"><p>The Quebec Road sewer network and local surface water drainage were identified for hydrological modelling to determine capacity and to identify options to reduce flood risk in the Quebec Road area. (p3)</p></div><div class="nugget-popup"><p>Repeated flooding of the road and adjacent properties caused by surface water drainage reaching capacity and surcharging in the road; highway gullies unable to drain and property surface/roof drains unable to discharge, resulting in water rising above kerb height and flooding properties (west side internally, east side externally). [MUL] (p7)</p></div><div class="nugget-popup"><p>Properties on Quebec Road were flooded due to surcharging/backing up of the AW surface water sewer, caused by a restricted outfall and localised high silt levels in the East Dock Sewer. [PAG,MUL] (p9)</p></div><div class="nugget-popup"><p>Frequent and significant flooding of properties on Quebec Road caused in part by an undersized sewer (the last three lengths of 375 mm diameter sewer are under&ndash;capacity and lead to surcharging). The flooding prompted a formal Section 19 Flood Investigation and recommendations for sewer upsizing, combined EA/Anglian Water modelling and surface water management measures. (p11)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>14 named flooding dates (Sep 1993; Jul 1994; Dec 1994; Mar 1996; Apr 1998; Jun 2002; Sep 2002; Jun 2003; Aug 2011; Nov 2011; Jan 2012; Apr 2012; Jun 2012; Sep 2012); nine incidents recorded in 2013 [MUL] (p7)</p></div></div></body></div>`)[0];
