                var html_281584381620ed4cbf36d0e05b0e63a2 = $(`<div id="html_281584381620ed4cbf36d0e05b0e63a2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Church Road, Worlingworth</h1><div class="nugget-popup"><p>Properties on Church Road (within the Central zone) experienced internal flooding due to a combination of surface water runoff from fields, overtopping of local watercourses and overwhelmed drainage/sewer systems; part of the observed flow routes through the village. (p7)</p></div><div class="nugget-popup"><p>Homes on either side of Church Road were affected by floodwater from overwhelmed drainage networks; floodwater cascaded down the street contributing to flows toward Willow Green. (p16)</p></div><div class="nugget-popup"><p>Floodwater from an overwhelmed drainage network and from overtopped adjacent ordinary watercourses reached Church Road. Homes set higher up on either side of Church Road were affected; a west&ndash;east watercourse joins north of Church Road and flows around the back of buildings and through some gardens, contributing to inundation. A culverted section at the highway was quickly overwhelmed, causing significant overtopping that added to floodwater on the highway and into properties. [IMG,PAG] (p17)</p></div><div class="nugget-popup"><p>A watercourse running along the south side of Church Road was quickly overwhelmed by runoff; highways grips could not discharge effectively and the watercourse overtopped its banks, adding to water on the road. Water routed through a culvert under the road into front gardens on the north side and pooled at low points on the highway, flowing into properties' gardens and outbuildings. (p21)</p></div><div class="nugget-popup"><p>Highways drainage was overwhelmed by overland flows in the area. The report specifically recommends the landowner on the south side of Church Road investigate reinstating an open channel where a piped section currently exists between the river and the AW pumping station &mdash; indicating the piped/channel arrangement contributed to flow problems during the event. [IMG] (p22)</p></div><div class="nugget-popup"><p>Area around Church Road was implicated in the investigation: reinstatement/maintenance of watercourses south of Church Road (adjacent to AW pumping station) and investigation of piped sections/outfalls were recommended to address surface&ndash;water flows and drainage issues observed during the flood investigation. [TAB] (p31)</p></div><div class="nugget-popup"><p>Areas north and south of Church Road experienced surface water / overland flows. Actions proposed include reinstating an open channel between the AW pumping station and the nearby watercourse and investigating highway drainage to manage surface water. [PAG] (p32)</p></div><div class="nugget-popup"><p>Land north of Church Road and land to the south of Church Road were identified as being impacted by flood risk; actions proposed include investigating reinstatement of an open channel between the AW pumping station and the eastward watercourse, and potential highway drainage improvements to manage surface water and reduce surface water ingress/foul sewer flooding. [PAG] (p33)</p></div></div></body></div>`)[0];

                var html_5198b13488558df675447b3cc6a94291 = $(`<div id="html_5198b13488558df675447b3cc6a94291" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Shop Street, Worlingworth</h1><div class="nugget-popup"><p>Shop Street (in the Central zone) experienced internal flooding of properties from surface water runoff, overtopping watercourses and overwhelmed sewer/drainage systems, forming part of the central flow paths through the village. (p7)</p></div><div class="nugget-popup"><p>Reported surcharging of the foul network and manhole flooding during high rainfall; surcharging on Shop Street has been observed and may be related to surface&ndash;water infiltration or a leak. Anglian Water investigations are ongoing in relation to this sewer/foul&ndash;network flooding. [PAG] (p8)</p></div><div class="nugget-popup"><p>During Storm Babet Shop Street experienced flooding from both overwhelmed drainage infrastructure and overtopping watercourses; drainage network overflowed, water poured from manhole covers and floodwater deepened to affect homes. [PAG] (p16)</p></div><div class="nugget-popup"><p>Floodwater from an overwhelmed drainage network and from overtopping ordinary watercourses cascaded down Shop Street, deepening and affecting homes on either side of Church Road and Shop Street. The culverted section where a watercourse reaches the highway was quickly overwhelmed, causing significant overtopping onto the highway and adding to flood depths on Shop Street. [PAG] (p17)</p></div><div class="nugget-popup"><p>Manholes on Shop Street were sealed to reduce sewer surcharge after the sewerage network was overwhelmed by surface water; sewer monitors were installed and CCTV surveys of the foul network were initiated to identify possible infiltration. [TAB] (p30)</p></div><div class="nugget-popup"><p>A piped section of an ordinary watercourse beneath the highway on Shop Street was suspected to be blocked as a consequence of the event; an investigation was recommended to confirm the outfall location and clear any blockage to reduce local flooding. [TAB] (p31)</p></div></div></body></div>`)[0];

                var html_477ef43f3a85eef51856183e7d3664b6 = $(`<div id="html_477ef43f3a85eef51856183e7d3664b6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Worlingworth</h1><div class="nugget-popup"><p>Intense rainfall from Storm Babet overwhelmed natural flow routes and the capacity of watercourses and drainage infrastructure, causing converging overland flows, localised ponding and the internal flooding of properties, infrastructure and services within the village. (p4)</p></div><div class="nugget-popup"><p>Storm Babet (20 Oct 2023) produced significant rainfall that caused internal flooding in the village. Flood water entered properties and flowed through defined flow paths from surrounding fields (pluvial runoff), from overtopping local watercourses (fluvial) and from overwhelmed sewerage/drainage systems. The investigation divides affected areas into three zones: West (Newtown and Mill Road), Central (Church Road, Shop Street, Old Stores Close, Willow Tree Yard, Willow Green) and East (Church Street, Worlingworth Hall Farm), indicating multiple streets and clusters experienced internal and external flooding and flow routing through the village. [IMG,PAG] (p7)</p></div><div class="nugget-popup"><p>A significant surface&ndash;water flow path runs west&ndash;to&ndash;east through the village centre. During the event this overwhelmed local drainage, causing highway flooding in the centre of the village and affecting properties in central Worlingworth. [IMG,PAG] (p8)</p></div><div class="nugget-popup"><p>A significant surface&ndash;water flow path runs west&ndash;east through the centre of the village. Most of the affected properties in central Worlingworth fall within areas mapped at high risk of surface water flooding; localised ponding is also noted due to shallow topography. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>During Storm Babet, prolonged antecedent rainfall left ground saturated and the village's clayey, low&ndash;permeability soils produced extensive surface water runoff and overland flow, leading to local flooding. [IMG] (p12)</p></div><div class="nugget-popup"><p>The western part of the village (Newtown) experienced internal flooding to properties. Blocked and poorly maintained watercourses and silted ponds reduced conveyance and holding capacity; debris and fallen trees in channels caused blockages, leading to water backing up, overtopping features and flowing to low points where houses are located. Reports from Mill Lane were also received but severity is not described in detail. (p14)</p></div><div class="nugget-popup"><p>Overland surface water flows caused internal flooding to several residential houses, damaging furniture, flooring and personal effects. Significant surface water flows also caused damage and deposited debris in surrounding hedgerows, gardens and on highways; ponding occurred in isolated low spots on saturated ground. [IMG] (p15)</p></div><div class="nugget-popup"><p>Extensive internal flooding of residential properties with water entering from overwhelmed drainage, surcharging manholes and overtopping watercourses. Floodwaters caused damage to furniture, flooring and personal effects; water poured out of manhole covers into road and verges and overtopped watercourses spilled into properties and onto the highway; overland flows damaged hedgerows, gardens and highways. (p16)</p></div><div class="nugget-popup"><p>The village experienced flooding during Storm Babet from two sources: prolonged heavy rain causing the drainage network to overflow (bringing water up through highway drains and along Shop Street) and overtopping of local ordinary watercourses (notably the west&ndash;east watercourses behind Willow Green and Willow Tree Yard and the south&ndash;north watercourse adjacent to Swan Road). Floodwater cascaded down Shop Street to Willow Green, affected properties in the Close, overtopped culverts at the highway, and inundated gardens and properties adjacent to the watercourses. [IMG] (p17)</p></div><div class="nugget-popup"><p>Significant overland flow and watercourse overtopping caused pooling in the village centre, overwhelming drainage and ponds and causing internal and external flooding to residential homes and businesses. Internal flooding reached 37 cm in affected properties. Highways and Anglian Water assets were overwhelmed; water was forced back up manhole covers. Some properties remained uninhabitable six months after the event. [PAG] (p18)</p></div><div class="nugget-popup"><p>Significant rainfall and saturated ground caused high levels of overland flow toward the centre of the village. Watercourses exceeded capacity and flowed out of bank, contributing to overland flows that overwhelmed water&ndash;management features at pinch points near the community centre. Change in topography slowed flows in the village centre, increasing local accumulation and causing drainage systems to be overcapacity. [IMG,PAG] (p19)</p></div><div class="nugget-popup"><p>The eastern end of the village experienced flooding during the event: a small number of properties were flooded internally and several properties had flooding to gardens and outbuildings due to watercourses and surface&ndash;water runoff overtopping and overwhelming local drainage. [IMG] (p20)</p></div><div class="nugget-popup"><p>Significant rainfall and overland flows caused watercourses to overtop and local low spots to fill in east Worlingworth. Residential properties experienced internal flooding to significant depths; some residents had to move out of their homes for several months. Other properties had water flowing across gardens and into outbuildings without internal inundation. [IMG] (p22)</p></div><div class="nugget-popup"><p>Residential yard and adjacent open field were inundated; floodwater reached close to the top of a garden gate and covered the yard up to the brick wall, with the neighbouring field extensively flooded, indicating property&ndash;level and local area inundation. [IMG,PAG] (p23)</p></div><div class="nugget-popup"><p>Residential backyard and garden were submerged in muddy floodwater. Water covered most of the garden area, reached the bases of the garden shed, hedges and a large tree, and encroached onto a wooden deck, putting items on the deck at risk of being overtaken by rising water. [IMG,PAG] (p24)</p></div><div class="nugget-popup"><p>Floodwater breached the doorway of a residential property and entered the interior, covering the floor to several centimetres, submerging outdoor furniture in the garden and contaminating the house with muddy runoff. [IMG,PAG] (p25)</p></div><div class="nugget-popup"><p>Residential area in central Worlingworth experienced heavy surface&ndash;water/urban flooding that covered the road, extended onto verges and lawns and reached up to houses; vehicles were partially submerged and access would have been impeded. [PAG] (p27)</p></div><div class="nugget-popup"><p>Surface water and overland flows affecting the eastern edge of the village (south of Church Road adjacent to the Anglian Water pumping station) were identified during the investigation. The report recommends reinstating/reprofiling watercourses and attenuation in this area to reduce flood flows. [TAB] (p31)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 30 properties suffered internal flooding (p4)</p></div><div class="nugget-popup quant"><p>over 30 properties [IMG,PAG] (p7)</p></div><div class="nugget-popup quant"><p>23 properties (p16)</p></div><div class="nugget-popup quant"><p>37 cm internal flooding [PAG] (p18)</p></div><div class="nugget-popup quant"><p>2 wheelie bins; 1 garden shed [IMG,PAG] (p24)</p></div></div></body></div>`)[0];
