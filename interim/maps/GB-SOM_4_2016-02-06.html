                var html_f3895ae5d3a2bb228bf3b9069f569ea3 = $(`<div id="html_f3895ae5d3a2bb228bf3b9069f569ea3" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1>Knowle Lane, Misterton</h1><div class="nugget-popup"><p>Large volumes of surface water run&ndash;off onto the highway causing the highway to flood; highway flood depth reported up to 1200 mm during the event. (p4)</p></div><div class="nugget-popup"><p>During the 2016&ndash;02&ndash;06 event a significant volume of surface runoff travelled via Knowle Lane, overwhelming highway drainage. The highway was reported flooded (overall highway depths 100 mm to 1200 mm) and this overland flow contributed to six properties flooding internally (water entered properties at about 18:00&ndash;18:30 to depths of 100&ndash;300 mm). (p11)</p></div><div class="nugget-popup"><p>Middle Street (A356) received surface&ndash;water run&ndash;off from adjacent fields (via Cathole Bridge Road) and from Knowle Lane, causing surface water flooding of the highway and contributing to local flooding impacts in Misterton during the event. (p13)</p></div><div class="nugget-popup"><p>A silt&ndash;trap gully on Knowle Lane (100m south of the junction with Middle Street) was affected by silt and detritus from the flood; the silt trap and downstream pipe were cleared and a collapsed gully cover at the silt trap was logged and repaired on 30/05/2016. (p14)</p></div><div class="nugget-popup"><p>Following the 2016&ndash;02&ndash;06 flood event, Knowle Lane experienced runoff&ndash;related deposition and drainage blockage. A silt trap and the downstream pipe were found to contain silt and were cleared on 2016&ndash;05&ndash;30; one gully cover on the silt trap was found collapsed, logged for a 24&ndash;hour repair and repaired the same day. Run&ndash;off was identified as originating from agricultural land at the top of Knowle Lane, and an additional silt&ndash;trap was later proposed. [PAG] (p15)</p></div><div class="nugget-popup"><p>The watercourse flowing parallel to Knowle Lane and associated sediment transport contributed to the flooding observed on 2016&ndash;02&ndash;06; sedimentation/silt in this channel was identified as a contributory factor and an additional silt&ndash;trap on Knowle Lane was proposed to reduce silt, improve flow and mitigate future flooding. [PAG] (p16)</p></div><div class="nugget-popup"><p>Identified as affected by siltation/sediment issues related to the 2016&ndash;02&ndash;06 flood; an additional silt&ndash;trap on Knowle Lane was proposed to reduce future silt deposition and improve flow, with potential works planned for the 2017/18 financial year. [PAG] (p17)</p></div></div></body></div>`)[0];
                popup_482e5ad9f42c6cf2de807f0cd35e838e.setContent(html_f3895ae5d3a2bb228bf3b9069f569ea3);

                var html_b1c23483b2e98d00bb7cc70a54889a99 = $(`<div id="html_b1c23483b2e98d00bb7cc70a54889a99" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1>Cathole Bridge Road, Misterton</h1><div class="nugget-popup"><p>During the 2016&ndash;02&ndash;06 event a significant volume of surface runoff travelled via Cathol Bridge Road (sic), overwhelming highway drainage. The highway was reported flooded (overall highway depths 100 mm to 1200 mm) and this overland flow contributed to six properties flooding internally (water entered properties at about 18:00&ndash;18:30 to depths of 100&ndash;300 mm). [MUL] (p11)</p></div><div class="nugget-popup"><p>Surface run&ndash;off from fields adjacent to Cathole Bridge Road flowed onto Middle Street during the heavy rainfall, contributing to surface water flooding on Middle Street. (p13)</p></div><div class="nugget-popup"><p>Identified as part of the larger catchment contributing to the 2016&ndash;02&ndash;06 flooding; the LLFA/FWRM team proposed inspecting the catchment (including Cathole Bridge Road) to identify flow improvements to reduce future flood risk. [MUL] (p17)</p></div></div></body></div>`)[0];

                var html_b1363dbcd6abaadb919ceaa64a1a9807 = $(`<div id="html_b1363dbcd6abaadb919ceaa64a1a9807" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1>Silver Street, Misterton</h1><div class="nugget-popup"><p>During the 2016&ndash;02&ndash;06 event a significant volume of surface runoff travelled via Silver Street, overwhelming highway drainage. The highway was reported flooded (overall highway depths 100 mm to 1200 mm) and this overland flow contributed to six properties flooding internally (water entered properties at about 18:00&ndash;18:30 to depths of 100&ndash;300 mm). (p11)</p></div><div class="nugget-popup"><p>The Misterton Stream was observed brown and heavily silt&ndash;laden with active bed movement and gravels reducing channel capacity. Meandering sections and washed&ndash;in bank material created pinch points and, together with debris and obstructions (including at culvert outfalls), reduced conveyance and contributed to flooding downstream. (p13)</p></div></div></body></div>`)[0];

                var html_4b79539bd68d9636ab72833f436ab7cb = $(`<div id="html_4b79539bd68d9636ab72833f436ab7cb" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1>Newbery Lane, Misterton</h1><div class="nugget-popup"><p>During the 2016&ndash;02&ndash;06 event a significant volume of surface runoff travelled via Newbery Lane, overwhelming highway drainage. The highway was reported flooded (overall highway depths 100 mm to 1200 mm) and this overland flow contributed to six properties flooding internally (water entered properties at about 18:00&ndash;18:30 to depths of 100&ndash;300 mm). (p11)</p></div><div class="nugget-popup"><p>During heavy rain, water flows down Newbery Lane (from Silver Street) directly into the Misterton Stream. The Irish Bridge railings collect debris causing blockages, the culvert under the highway is considered too small, an upstream sump/sediment trap has not been maintained, and there are obstructions at the culvert outfall under the railway&mdash;factors that reduced conveyance and contributed to localised flooding on 2016&ndash;02&ndash;06. (p13)</p></div></div></body></div>`)[0];

                var html_1872e027b13280b2c6f5ac093241e370 = $(`<div id="html_1872e027b13280b2c6f5ac093241e370" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Misterton</h1><div class="nugget-popup"><p>Six properties were internally flooded (water depth up to 300mm) and the highway flooded to a depth up to 1200mm; large volumes of surface run&ndash;off flowed onto the highway. (p4)</p></div><div class="nugget-popup"><p>The civil parish (Misterton CP), including the village of Misterton and surrounding farmland, was the focus of the flood investigation and experienced flooding associated with flows in the Misterton Stream that affected the central village area and adjacent fields. [IMG] (p8)</p></div><div class="nugget-popup"><p>Flooding associated with the Misterton Stream flowing eastwards through the village. Community flood incident reports and the LLFA investigation identify overwhelmed highway drains (by agricultural surface run&ndash;off) and blocked watercourses as contributors to flooding in the Misterton area. [PAG,IMG] (p9)</p></div><div class="nugget-popup"><p>Multiple properties flooded &mdash; six properties reported flooded during the event on 2016&ndash;02&ndash;06. The report also records previous community flood incidents in the village (May 2008, December 2008, December 2013). [MUL] (p10)</p></div><div class="nugget-popup"><p>Heavy rainfall and agricultural surface run&ndash;off caused the Misterton Stream to be heavily silt&ndash;laden; surface run&ndash;off from fields adjacent to Cathole Bridge Road flowed onto Middle Street and A356 Middle Street; runoff from Knowle Lane and Newbery Lane channelled into the stream, contributed to blockages and siltation, and affected residents (resident reports of being affected by flooding). (p13)</p></div><div class="nugget-popup"><p>During the 2016&ndash;02&ndash;06 flood event highway drainage in Misterton was overwhelmed by excessive runoff and/or watercourse flows: highway drains exceeded capacity, silt and detritus were washed in reducing capacity, and there were obstructions and debris at the outfall of the culvert running under the railway line. Local gullies and a silt&ndash;trap on Knowle Lane were affected (silt trap later cleared and a collapsed gully cover repaired). [PAG] (p14)</p></div><div class="nugget-popup"><p>Misterton experienced flooding associated with the 2016&ndash;02&ndash;06 event; the flooding aligned with Environment Agency flood risk data, properties and local drainage were affected, and a likelihood of repeated flooding was noted. (p15)</p></div><div class="nugget-popup"><p>The village experienced flooding on 2016&ndash;02&ndash;06; the event corresponded with Environment Agency flood risk data, affected properties/residents, and prompted this investigation which identified contributory factors and proposed measures (community Flood Action Plan support, property&ndash;level protection advice, consideration of additional silt&ndash;trap on Knowle Lane and use of Mill Farm land as flood storage). [PAG] (p16)</p></div></div></body></div>`)[0];
