                var html_1ecfafd92a6f263bb08f83c14b635b07 = $(`<div id="html_1ecfafd92a6f263bb08f83c14b635b07" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Church Lane, Hellidon</h1><div class="nugget-popup"><p>Surface water flowing off agricultural land ponded locally at the access point to the field and around the highway&ndash;facing retaining wall of a residential garage building on Church Lane. At least one property's garage was internally flooded. [TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Muddy, orange&ndash;brown runoff and surface water covered parts of the lane and carriageway, reducing accessibility and creating a road safety hazard; runoff appeared to originate from adjacent land/hedgerow and to have flowed across the road. [IMG,PAG,MUL] (p39)</p></div><div class="nugget-popup"><p>Muddy, sediment&ndash;laden water flowed along the left edge of the paved road, crossed onto the grass verge and pooled near a stone wall; runoff covered sections of the lane and deposited sediment on adjacent grass and near property boundaries. [IMG,PAG,MUL] (p40)</p></div><div class="nugget-popup"><p>Standing muddy/brown water entered a basement/utility room at properties on Church Lane, covering the floor and reaching the bottom rung of a metal step ladder and partially submerging stored items and an appliance; water is contaminated with sediment. Surface water runoff flowed from the paved road onto the adjacent grassy verge, causing waterlogging and some erosion of the roadside and covering tyre tracks. Localised standing muddy water collected at the base of a stone garden wall, partially submerging small plants. [IMG,PAG,MUL] (p41)</p></div><div class="nugget-popup"><p>Muddy floodwater pooled against a stone wall and inundated an adjacent garden/landscaped area; clusters of plants were partially submerged and soil erosion/runoff is evident. [IMG,PAG] (p42)</p></div><div class="nugget-popup"><p>Surface water and runoff deposited fine&ndash;grained soil and mud onto the roadside and paved surface, causing damage to the verge (muddy tire tracks, disturbed verge) and soil deposits on the road; stakes mark the extent of the damaged verge. [IMG,PAG] (p46)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 incidents of garage internal flooding (02/01/2014; 14/02/2014) [TAB,PAG,MUL] (p11)</p></div></div></body></div>`)[0];

                var html_02efab47b35b7193da01e14a58787746 = $(`<div id="html_02efab47b35b7193da01e14a58787746" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Stockwell Lane, Hellidon</h1><div class="nugget-popup"><p>Residential properties on Stockwell Lane were affected by surface water flowing from the south. At one residential property preventative measures were taken to stop internal flooding and one residential property experienced internal flooding to the kitchen. Highway flooding occurred on Stockwell Lane; road gullies were blocked and one residential property was reported at risk. [TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Surface water drainage from the catchment including the corridor from Back Lane to Stockwell Lane was identified as causing flood risk to the area and adjacent properties; insufficient drainage capacity and blocked/failed piped/culvert sections contributed to flooding risk. (p20)</p></div><div class="nugget-popup"><p>A natural low point and field slope identified as the probable route for a culvert conveying water between Cox's Lane and Stockwell Lane; topography channels overland flow along this route, potentially concentrating runoff and transporting soil deposits toward the culvert alignment. (p47)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one residential property internal flooding to kitchen; one residential property at risk [TAB,PAG,MUL] (p11)</p></div></div></body></div>`)[0];

                var html_57b2ff45d8bf00fb48e03eecade0c562 = $(`<div id="html_57b2ff45d8bf00fb48e03eecade0c562" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hellidon</h1><div class="nugget-popup"><p>Subject of a Northamptonshire County Council flood investigation (Church Lane, Hellidon). (p2)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration rainfall caused existing land drainage and watercourses to be unable to convey runoff, so excess surface water flowed over ground following contours into low points in the village, resulting in internal flooding of property(ies). [PAG] (p6)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration rainfall caused existing land drainage and watercourses to be unable to collect runoff, so excess surface water flowed over ground following natural contours to low points in the village, resulting in internal flooding of property(ies). [PAG,MUL] (p7)</p></div><div class="nugget-popup"><p>Internal flooding of a residential property (water crossed the threshold). The property experienced internal flooding on multiple occasions; one documented incident occurred on 2 January 2014. [MUL] (p9)</p></div><div class="nugget-popup"><p>Incident Plans (Appendix C) indicate reported routes of surface water through Hellidon during the event. [PAG] (p13)</p></div><div class="nugget-popup"><p>Residents and properties in Hellidon were identified as being at risk during the Flood Incident; the report advises affected residents to take protective actions (sign up to flood warnings, implement property&ndash;level protection, prepare community flood plans, nominate flood wardens and move valuables to higher ground). (p15)</p></div><div class="nugget-popup"><p>Intense rainfall on a saturated catchment caused surface water and river flooding in the village. Existing drainage systems, land drainage ditches and watercourses were unable to cope, causing water to flow into other areas and into drainage systems not designed for the additional volume. Run&ndash;off from agricultural land was identified as a significant contributing factor. Field drainage systems and outlets were reported to be in poor condition or non&ndash;existent, and the routing of surface water from the south of the village through Hellidon to watercourses in the north is unclear &mdash; all of which increased flood risk to vulnerable properties in the village. (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property; more than one occasion in the last 5 years [PAG] (p6)</p></div><div class="nugget-popup quant"><p>one property [PAG,MUL] (p7)</p></div><div class="nugget-popup quant"><p>1 property [MUL] (p9)</p></div></div></body></div>`)[0];
