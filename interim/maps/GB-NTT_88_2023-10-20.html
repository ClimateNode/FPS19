                var html_12f1eb1cd80f8e36cd2f6dbbe303f1fc = $(`<div id="html_12f1eb1cd80f8e36cd2f6dbbe303f1fc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Worksop</h1><div class="nugget-popup"><p>Sustained heavy rainfall during Storm Babet caused flooding of roads and residential properties in Worksop; flooding occurred faster than normal because the ground was already saturated. (p1)</p></div><div class="nugget-popup"><p>Multiple streets across Worksop experienced surface water and urban flooding during the intense rainfall event; numerous properties were internally flooded across the town. [PAG] (p2)</p></div><div class="nugget-popup"><p>Multiple streets and residential properties across Worksop experienced internal flooding on 20 October 2023 as a result of the rapid rise of the River Ryton and associated surface water flows. Affected streets listed in the report include Allen Street, Central Avenue, Chapel Walk, Dunlin Court, Hardy Street, King Street, Newcastle Avenue, Old Bakery Yard, Poplar Close, Redwing Close, Redwood Avenue and Carlton Road. [IMG,PAG] (p3)</p></div><div class="nugget-popup"><p>Multiple areas of Worksop were flooded on 20 October. Streets listed as flood&ndash;affected on the south side of the River Ryton include Allen Street, Central Avenue, Chapel Walk, Hardy Street, King Street, Newcastle Avenue, Stubbing Lane and The Willows. Residents reported significant flows off Farr Park and down Brook Terrace that caused internal flooding on Newcastle Avenue and King Street. In the Gateford area (Dunlin Court, Lady Walk and Redwing Close) overwhelmed drainage during Storm Babet caused highway flooding that progressed into properties. [IMG,PAG] (p4)</p></div><div class="nugget-popup"><p>Parts of Worksop (notably the Gateford area) were affected by sustained heavy rainfall during Storm Babet which overwhelmed drainage systems, producing highway flooding and surface water that entered properties. [PAG] (p5)</p></div><div class="nugget-popup"><p>Experienced flooding associated with the River Ryton event on 20/10/2023; local authorities cleansed significant detritus from roads, car parks and paths, rehoused affected council tenants, undertook repairs to affected council housing properties, and promoted/administered business recovery grants and business rates relief. [PAG] (p12)</p></div><div class="nugget-popup"><p>Multi&ndash;source flooding affected the communities of Worksop and Shireoaks, prompting multi&ndash;agency recovery and engagement (drop&ndash;in events), and the planning of river/canal desilting and conveyance works to reduce future flood risk. (p13)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>93 residential properties (p1)</p></div><div class="nugget-popup quant"><p>121 properties [PAG] (p2)</p></div><div class="nugget-popup quant"><p>Allen Street (19 properties); Central Avenue (32 properties); Hardy Street (8 properties); King Street (20 properties); Newcastle Avenue (20 properties); Old Bakery Yard (11 properties); Chapel Walk (1 property); Dunlin Court (1 property); Lady Walk (2 properties); Poplar Close (2 properties); Redwing Close (3 properties); Redwood Avenue (1 property); Carlton Road (1 property) [IMG,PAG] (p3)</p></div><div class="nugget-popup quant"><p>6 properties internally flooded in Dunlin Court / Lady Walk / Redwing Close (Gateford area) [IMG,PAG] (p4)</p></div><div class="nugget-popup quant"><p>6 properties (internal flooding in Gateford area: Dunlin Court, Lady Walk and Redwing Close) [PAG] (p5)</p></div></div></body></div>`)[0];
