                var html_953441cf90c240b011f46e309052a1fd = $(`<div id="html_953441cf90c240b011f46e309052a1fd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Rowan Avenue, Boothville</h1><div class="nugget-popup"><p>Heavy rainfall on impermeable road surfaces overwhelmed drainage so excess surface water flowed overland to low points around private property, resulting in internal flooding of residential properties on Rowan Avenue. [MUL] (p7)</p></div><div class="nugget-popup"><p>Two residential properties experienced internal flooding (water entered the buildings). The two properties on Rowan Avenue have also experienced internal flooding on more than one occasion in the previous five years. [MUL] (p9)</p></div><div class="nugget-popup"><p>Runoff from the rising road (approx. 5 m drop along the street) and surface water collection contributed to flooding that affected two properties at the bottom of the slope; gullies and a surface water sewer serve the street and are relevant to the flooding. (p10)</p></div><div class="nugget-popup"><p>Repeated surface water flooding on the north side of Rowan Avenue resulted in water flowing across the full width of driveways, onto garden borders, into garages adjoining houses and through to back gardens. Several incidents also note surface water flooding to driveways and garages adjoining houses on the north side of the street. [TAB,MUL] (p11)</p></div><div class="nugget-popup"><p>Surface water runoff flowed down both carriageways bypassing blocked/ineffectively located road gullies, across the footpath into front driveways of two properties. Floodwater overwhelmed a private channel drain, entered a garage and flowed through to the back garden. At the second property the floodwater covered the whole driveway and was laden with silt and debris which was deposited across the driveway and into the back garden; the garden drain required repeated clearing. [PAG] (p12)</p></div><div class="nugget-popup"><p>Surface water flowed across the whole driveway of the second affected property, laden with silt and debris from surcharging out of an adjacent footway gully; silt deposited across the entire driveway and into the back garden (took hours to clean up). Surface water surged down the road due to the natural gradient and lack of drains, producing a 'tidal wave' effect. Driveways were a few inches deep, which overwhelmed a private drain allowing water to enter and flood garages (garages needed sweeping out). Garden drain required full clearing on each occasion. The runoff problem is long&ndash;standing linked to a gap in the central reservation altering flow paths. [PAG] (p13)</p></div><div class="nugget-popup"><p>Rowan Avenue was affected by a flooding incident; the Environment Agency states that Main Rivers are not in the vicinity and were not a factor in this flooding incident. (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 residential properties [MUL] (p7)</p></div><div class="nugget-popup quant"><p>2 properties [MUL] (p9)</p></div><div class="nugget-popup quant"><p>two properties (p10)</p></div><div class="nugget-popup quant"><p>two houses; six recorded flooding incidents (2014, 2015, 09/03/2016, 17&ndash;19/03/2016, 27/04/2016, 11/05/2016) [TAB,MUL] (p11)</p></div><div class="nugget-popup quant"><p>two properties [PAG] (p12)</p></div><div class="nugget-popup quant"><p>two residential properties; a few inches deep [PAG] (p13)</p></div></div></body></div>`)[0];

                var html_2f450e7924e0958f2f65e9aa6f32b366 = $(`<div id="html_2f450e7924e0958f2f65e9aa6f32b366" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Boothville</h1><div class="nugget-popup"><p>Named in the report title as the location of a Section 19 flood investigation concerning Rowan Avenue. The provided excerpt gives no further detail of flood mechanism, depths or specific damages. (p2)</p></div><div class="nugget-popup"><p>Residential properties in the Boothville area (including two on Rowan Avenue) experienced internal flooding; this local flood incident prompted a formal investigation. [PAG,MUL] (p9)</p></div><div class="nugget-popup"><p>Properties in the Boothville area (specifically two on Rowan Avenue) were affected by surface water flooding during the event. (p10)</p></div><div class="nugget-popup"><p>Flooding at two residential properties on Rowan Avenue in Boothville caused silt and debris to be deposited across driveways and gardens, private drains to be overwhelmed and garages to be flooded; blockages and misplaced drainage on the impermeable catchment led to excess surface water following natural contours to low points around private properties. [PAG] (p13)</p></div><div class="nugget-popup"><p>Excess surface water flowed over ground following natural contours to low points around private properties, putting properties at risk of flooding. (p14)</p></div><div class="nugget-popup"><p>Flooding occurred in Boothville; NCC can suggest possible causes and make recommendations to mitigate flood risk but does not have mandate or funding to force other authorities to act. (p15)</p></div><div class="nugget-popup"><p>Highway carriageway channels in Boothville were affected by surface water/runoff issues prompting recommendations for regular highway drainage cleansing and assessment of drainage asset capacity to reduce flood risk to properties. (p21)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 properties [PAG,MUL] (p9)</p></div><div class="nugget-popup quant"><p>two properties (p10)</p></div><div class="nugget-popup quant"><p>two residential properties; a few inches deep [PAG] (p13)</p></div></div></body></div>`)[0];
