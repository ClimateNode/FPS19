                var html_eb1b55e620171cd3acf9748705dc848f = $(`<div id="html_eb1b55e620171cd3acf9748705dc848f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Brading Marshes</h1><div class="nugget-popup"><p>The WLMP contains proposals to change water levels in the Brading Marshes which could have exacerbated flood risk to Brading; the hydraulic modelling underpinning the WLMP is reported as unclear and possibly insufficient to assess flood risk impacts. [TAB] (p10)</p></div><div class="nugget-popup"><p>Modelled flood water reached 0.65 m OD at the Brading Marshes (left bank) under the base&ndash;case, WLMP and mitigation scenarios (no change relative to the base case). [TAB,PAG] (p67)</p></div></div></body></div>`)[0];

                var html_870483ea08b1ef6d90355ba4f677dbb4 = $(`<div id="html_870483ea08b1ef6d90355ba4f677dbb4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Yar</h1><div class="nugget-popup"><p>The River Yar and its lower reaches / tributaries are associated with flood risk in Brading. A small tributary/drainage channel that flows towards the Yar is linked to the flooding event that affected Nicholas Close on 25 October 2023. [IMG,PAG] (p15)</p></div></div></body></div>`)[0];

                var html_f30160388feed0d28698e8fdd7b996a0 = $(`<div id="html_f30160388feed0d28698e8fdd7b996a0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Nicholas Close, Brading</h1><div class="nugget-popup"><p>Significant pooling outside a property on Nicholas Close; flooding of the adjacent garden; high water levels in the nearby stream east of Nicholas Close. (p7)</p></div><div class="nugget-popup"><p>Residential properties flooded; at least six properties were reported flooded during the event under investigation. Flooding at Nicholas Close has occurred on multiple occasions and is strongly influenced by elevated river levels and downstream/tidal controls. [MUL] (p9)</p></div><div class="nugget-popup"><p>The wastewater pumping station at Nicholas Close is specifically recommended for a review of condition and capacity as part of the Section 19 investigation following recurrent flooding in Brading, indicating the pumping station's relevance to the local flooding issues. [TAB] (p10)</p></div><div class="nugget-popup"><p>Repeated internal flooding of residential properties on Nicholas Close. [PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Recurrent flooding of a residential road; properties on Nicholas Close were inundated during the October 2023 event (part of Storm Babet). [PAG,MUL] (p12)</p></div><div class="nugget-popup"><p>Flooding on 25 October 2023 mainly affected the residential road Nicholas Close. A small tributary/drainage channel flows through the gardens of Nicholas Close towards the River Yar; the channel is culverted where it meets the railway northeast of the road. [IMG,PAG] (p15)</p></div><div class="nugget-popup"><p>Flooding on 25 October 2023 inundated the residential road and gardens of Nicholas Close as a small tributary/drainage channel that flows through the gardens overtopped. [PAG] (p16)</p></div><div class="nugget-popup"><p>Flooding occurred in Nicholas Close on 25 October 2023. The flooding was strongly influenced by elevated river levels within a low&ndash;lying, flat catchment; downstream controls and tidal effects (tide locking) are noted as influential on upstream river levels, contributing to inundation. Multiple agencies responded to the event. (p29)</p></div><div class="nugget-popup"><p>Repeated flooding of properties and gardens; residents had to move out of a flooded property for the majority of the year (Jan 2023); contaminated flood water was present and Southern Water deployed tankers to remove contaminated flood water on 25 Oct 2023. [TAB,PAG,MUL] (p30)</p></div><div class="nugget-popup"><p>Properties and gardens flooded; contaminated flood water was removed by Southern Water tankers; at least one household had to move out of a flooded property for the majority of the year. [PAG] (p31)</p></div><div class="nugget-popup"><p>Channel exceedance of the ordinary watercourse east of the residential area combined with surface water runoff from Morton Common and Morton Road caused pooling at the junction with Morton Road and flow down Nicholas Close, resulting in inundation of the residential area and significant flooding. EA officers and an incident response contractor carried out welfare checks and inspected for blockages (25 Oct&ndash;16 Nov 2023); no visible blockages were located. A silted Network Rail culvert (EW1&ndash;28) was noted as potentially exacerbating impacts. [PAG] (p33)</p></div><div class="nugget-popup"><p>Surface water pooled at the junction with Morton Road and flowed down Nicholas Close. The culverted ordinary watercourse through gardens of Nicholas Close reached high water levels and overflowed into surrounding gardens. Blockage of Network Rail culvert EW1&ndash;28 by silt (last cleared three years prior) may have exacerbated the flooding and played a role in the event. [PAG] (p34)</p></div><div class="nugget-popup"><p>Flooding from a culverted watercourse overflowed into surrounding gardens and properties. Six properties were affected on 25 October 2023, with at least two suffering internal flooding that forced residents to vacate. One property had garden, driveway and house submerged. Some residents (including an elderly couple) were displaced and required extensive repair works; furniture and personal possessions were destroyed. [PAG] (p35)</p></div><div class="nugget-popup"><p>Southern Water pumping station at Nicholas Close flooded and caused sewage to leak into surrounding properties. [PAG] (p37)</p></div><div class="nugget-popup"><p>Photograph and mapping show significant pooling/outside property inundation on Nicholas Close (street and property frontage flooded), indicating local surface water/urban flooding and contributing to disruption and economic impacts. [IMG,PAG] (p38)</p></div><div class="nugget-popup"><p>Significant standing water pooled across the front/yard of a residential property, with water up to the building foundation and garden features (flower pots, planters) partially submerged; a hose is present indicating active water removal efforts. [IMG,PAG] (p39)</p></div><div class="nugget-popup"><p>Hydraulic modelling (base&ndash;case and WLMP scenarios) predicts flooding at Nos. 5 and 6 Nicholas Close. The WLMP scenario would slightly increase flood duration at Nicholas Close (notably increasing duration at No.5); the proposed mitigation scenario reduces the flooded area and reduces flood duration at No.5. [IMG] (p41)</p></div><div class="nugget-popup"><p>Floodwater in the area contained foul sewage; residents reported toilets not functioning during flood events. The nearby Network Rail culvert (EW1&ndash;28) adjacent to Nicholas Close has been reported silted and uncleared for around three years and could increase flood risk to properties if it becomes blocked. The condition and capacity of the Nicholas Close foul pumping station has been questioned and may be allowing sewage to enter floodwater. (p49)</p></div><div class="nugget-popup"><p>Experienced flooding; the report concludes the flooding at Nicholas Close is unlikely to be solely linked to extreme rainfall and that antecedent conditions or other factors are likely drivers of the flooding. (p50)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 6 properties [MUL] (p9)</p></div><div class="nugget-popup quant"><p>6 properties [PAG,MUL] (p11)</p></div><div class="nugget-popup quant"><p>at least 6 properties [PAG,MUL] (p12)</p></div><div class="nugget-popup quant"><p>Six properties; at least two properties internal flooding [PAG] (p34)</p></div><div class="nugget-popup quant"><p>6 properties; 2 properties with internal flooding; 1 property with garden, driveway and house submerged; 1 household displaced for at least 6 months [PAG] (p35)</p></div><div class="nugget-popup quant"><p>2 properties (No.5 and No.6); duration change at No.5 described (increased under WLMP, reduced under mitigation) [IMG] (p41)</p></div></div></body></div>`)[0];

                var html_3d41c056cd1b6c5c58947538a59b5cf6 = $(`<div id="html_3d41c056cd1b6c5c58947538a59b5cf6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Morton Common, Brading</h1><div class="nugget-popup"><p>Repeat flooding along the A3055 at Morton Common causing disruption to a major transport link to Sandown and resulting in road closures. [MUL] (p11)</p></div><div class="nugget-popup"><p>Flooding occurred along Morton Common during the October 2023 event. [PAG] (p12)</p></div><div class="nugget-popup"><p>Flooding was recorded at the A3055 (Morton Common) as shown on the map (red star). The location is in a low&ndash;lying area and the event affected the road alignment at Morton Common. [IMG] (p15)</p></div><div class="nugget-popup"><p>Flooding occurred in Morton Common on 25 October 2023. The inundation was strongly influenced by elevated river levels in a very low&ndash;lying, flat catchment; downstream controls and tidal influences (tide locking) are identified as highly influential on upstream river levels, contributing to the flooding and its persistence. Multiple agencies responded to the flood event. (p29)</p></div><div class="nugget-popup"><p>Reports of flooding affected the A3055 at Morton Common and caused road closures on multiple occasions; transport infrastructure was disrupted. [TAB,PAG,MUL] (p30)</p></div><div class="nugget-popup"><p>Flooding caused closures of the A3055 at Morton Common. [PAG] (p31)</p></div><div class="nugget-popup"><p>Morton Common (A3055) was reported closed due to flooding. (p32)</p></div><div class="nugget-popup"><p>Surface water flowed from Morton Common towards the ordinary watercourse east of Nicholas Close, contributing to channel exceedance and the inundation of the residential area during the flood event. (p33)</p></div><div class="nugget-popup"><p>The A3055 at Morton Common has flooded repeatedly, causing significant disruption and economic impacts due to road closures on multiple dates. [MUL] (p37)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>6 reports of flooding and road closures of A3055 at Morton Common. [TAB,PAG,MUL] (p30)</p></div><div class="nugget-popup quant"><p>6 road closures [MUL] (p37)</p></div></div></body></div>`)[0];

                var html_82b3f3d72841feb346ec0c1c93891616 = $(`<div id="html_82b3f3d72841feb346ec0c1c93891616" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Brading</h1><div class="nugget-popup"><p>Property flooding in the town, including at least six residential properties in Nicholas Close on 25 October 2023; frequent highway flooding affecting the A3055 at Morton Common with multiple road closures over the past year. [PAG,MUL] (p9)</p></div><div class="nugget-popup"><p>Recurrent flooding in the town, including internal flooding of residential properties in Nicholas Close and disruption to the A3055 transport link (Morton Common / Morton Road) causing road closures. [PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Parts of the town were affected during the Storm Babet floods, notably Nicholas Close (recurrent property flooding) and Morton Common which flooded on 25 October 2023. [IMG,PAG] (p12)</p></div><div class="nugget-popup"><p>Flooding on 25 October 2023 mainly affected Nicholas Close, a residential road in Brading. A small tributary/drainage channel that flows through gardens towards the River Yar is associated with the incident (the channel is culverted where it meets the railway). [IMG,PAG] (p15)</p></div><div class="nugget-popup"><p>Parts of Brading were affected by flooding, notably Nicholas Close where residential properties and gardens were inundated on 25 October 2023. [IMG,PAG] (p16)</p></div><div class="nugget-popup"><p>Brading Marshes were inundated during a period of significant flooding; floodwaters affected the marshland and extend into low&ndash;lying parts of Brading as shown in Figure 2&ndash;2 and the flood map. [IMG,PAG] (p17)</p></div><div class="nugget-popup"><p>The A3055 in Brading flooded on multiple occasions, resulting in road closures on the listed dates. [PAG,MUL] (p22)</p></div><div class="nugget-popup"><p>Recurrent flooding at Brading is reported; the report assessed a range of past flood events and analysed the storm event on 24 and 25 October 2023 that affected the area. [PAG] (p25)</p></div><div class="nugget-popup"><p>Recurrent flooding in Brading connected with multiple historical rainfall events. Antecedent conditions (soil saturation) and tide locking in the Brading Marshes are identified as likely contributors to flooding. The event on 25 October 2023 is described as extreme and infrequent (FEH estimate ~1 in 322) and is linked to flooding in the Brading area. [PAG,MUL] (p26)</p></div><div class="nugget-popup"><p>Long history of flooding in the town area, including repeated reports of flooding affecting Nicholas Close (properties and gardens) and repeated flood reports/road closures at the A3055 at Morton Common. [TAB,MUL] (p30)</p></div><div class="nugget-popup"><p>Garden and property flooding in Nicholas Close (residents had to move out of a flooded property for the majority of the year); road flooding led to closure of the A3055 at Morton Common; contaminated flood water was removed from Nicholas Close by Southern Water. [PAG] (p31)</p></div><div class="nugget-popup"><p>Flooding on Morton Common (A3055) within Brading resulted in the road being closed. (p32)</p></div><div class="nugget-popup"><p>Text notes tide locking from the Brading Marshes may have contributed to the flooding by causing higher water levels/backwater effects; this contributed to the flooding mechanisms affecting Nicholas Close and surrounding areas and to wider disruption and economic impacts. [PAG] (p38)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties. (p50)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 6 properties; 5 recorded flood events in Brading since November 2000 [PAG,MUL] (p9)</p></div><div class="nugget-popup quant"><p>6 properties [PAG,MUL] (p11)</p></div><div class="nugget-popup quant"><p>at least 6 properties [IMG,PAG] (p12)</p></div><div class="nugget-popup quant"><p>6 road closure incidents [PAG,MUL] (p22)</p></div><div class="nugget-popup quant"><p>at least 6 properties (p50)</p></div></div></body></div>`)[0];
