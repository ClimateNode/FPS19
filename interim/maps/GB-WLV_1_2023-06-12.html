                var html_ee29477be078de7bdd896e7b25516016 = $(`<div id="html_ee29477be078de7bdd896e7b25516016" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wolverhampton Metropolitan District</h1><div class="nugget-popup"><p>Wolverhampton (the Bilston area) experienced urban surface water flooding during the 12 June 2023 event, with streets inundated and transport/disruption impacts in the affected neighbourhoods. [PAG] (p1)</p></div><div class="nugget-popup"><p>The radar imagery places the epicentre of the high&ndash;intensity rainfall band over the Bilston/Wolverhampton area around 18:00 on 12th June 2023. Multiple image snapshots (18:00&ndash;18:20) show very high, highly localised rainfall cells passing over Wolverhampton and nearby neighbourhoods (including Penn Fields/Lower Gornal vicinity), producing conditions consistent with rapid urban surface&ndash;water and flash flooding in affected streets and low&ndash;lying areas. [PAG,IMG] (p17)</p></div><div class="nugget-popup"><p>Drainage capacity was overwhelmed by the intense storm on 12th June 2023. Surface water runoff was channelled by impermeable surfaces to the lowest points (the highway), overflowing the highway drainage and spilling from the highway into downhill properties; flows also escaped from sewer manholes and highway gullies. [TAB] (p24)</p></div></div></body></div>`)[0];

                var html_c1d1d0621890624b758841d4b68611aa = $(`<div id="html_c1d1d0621890624b758841d4b68611aa" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Dudley Metropolitan District</h1><div class="nugget-popup"><p>A localised, intense band of rainfall was centred on the Dudley&ndash;Tipton area on 12th June 2023 (highest intensities 30&ndash;100 mm/h shown on radar). This produced conditions for isolated surface water / flash flooding in the Dudley&ndash;Tipton area and was highlighted by the Flood Forecasting Centre as having potential for significant impacts. (p16)</p></div><div class="nugget-popup"><p>Radar snapshots show the central band of very high rainfall intensity running from Wolverhampton through Dudley and Tipton around 18:10 on 12th June 2023. This suggests Dudley was subject to intense, short&ndash;duration rainfall producing high runoff rates and a risk of localized surface&ndash;water/flash flooding in urban and valley locations within the borough. [PAG,IMG] (p17)</p></div></div></body></div>`)[0];

                var html_987478c4f64c4abb152e5c5836592f21 = $(`<div id="html_987478c4f64c4abb152e5c5836592f21" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ettingshall Road, Wolverhampton Metropolitan District</h1><div class="nugget-popup"><p>Carriageway inundated by surface water during the 12 June 2023 flood event; road surface was covered edge&ndash;to&ndash;edge with water high enough to partially submerge vehicle wheels, disrupting traffic and access to adjacent residences. (p1)</p></div><div class="nugget-popup"><p>Surface water from isolated heavy rainfall on 12th June 2023 caused internal flooding to properties on Ettingshall Road. (p5)</p></div><div class="nugget-popup"><p>Flooding occurred on the street on 12 June 2023. (p7)</p></div><div class="nugget-popup"><p>Intense, short&ndash;duration rainfall recorded at the monitoring location produced rapid surface water / flash flooding that contributed to flooding of local infrastructure and properties. [IMG] (p18)</p></div><div class="nugget-popup"><p>Surface water flooding on highways and footways affected highway drainage and sewer infrastructure; high&ndash;velocity runoff inundated driveways and gardens and progressed into internal areas of properties (through thresholds and communal areas). Debris and building materials were washed down the catchment and blinded highway drainage. [PAG] (p21)</p></div><div class="nugget-popup"><p>Surface water inundation across the carriageway with highway drainage failure; adjacent driveways and residential properties were flooded. Sewer infrastructure was affected/surcharged contributing to flooding. (p22)</p></div><div class="nugget-popup"><p>Highway gullies and subsurface drainage on Ettingshall Road were overwhelmed during the storm on 12th June 2023; surface water flowed over/around gullies and along the highway to lower&ndash;lying properties, with water escaping from gullies and sewer manholes. Sensors have been placed inside gullies on Ettingshall Road to monitor water levels for operational response. [TAB] (p24)</p></div><div class="nugget-popup"><p>Previous measures (altered road/footpath profile and additional gullies) increased capacity but were insufficient; the storm produced volumes/velocities that would not have been contained by this infrastructure, indicating flooding/overwhelming of drainage on the road. (p25)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>15 properties (across Ettingshall Road and Birmingham New Road) (p5)</p></div></div></body></div>`)[0];

                var html_e217b53f846435693514f9729da32d76 = $(`<div id="html_e217b53f846435693514f9729da32d76" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>West Midlands</h1><div class="nugget-popup"><p>Isolated heavy rainfall on 12th June 2023 caused surface water flooding in parts of the West Midlands, resulting in internal flooding to properties and businesses. (p5)</p></div><div class="nugget-popup"><p>A belt of heavy convective rainfall moved northwest across the West Midlands on 12 June 2023 (approx. 17:00&ndash;20:00). The rainfall epicentre passed over Bilston around 18:00, producing intense downpours that the guidance and radar indicated could cause isolated surface water flooding in urban areas with the potential for significant impacts. [PAG] (p15)</p></div><div class="nugget-popup"><p>Rainfall radar over the West Midlands on 12 June 2023 shows spatially variable but locally very high intensities (cores of 30&ndash;100 mm/h in places). The Met Office issued thunderstorm warnings covering the West Midlands and neighbouring authorities, and the Flood Forecasting Centre warned of isolated surface water flooding with potential for significant impacts. [PAG,IMG] (p16)</p></div><div class="nugget-popup"><p>A localized, fast&ndash;moving belt of very intense rainfall crossed the West Midlands between about 17:00&ndash;20:00 on 12th June 2023. The radar&ndash;derived snapshot shows a concentrated band of very high rainfall intensity moving NW across the region (epicentre around Bilston/Wolverhampton at ~18:00). This produced highly localised extreme runoff potential and is the precipitating cause of reported urban/surface&ndash;water flood impacts in the area (likely rapid surface&ndash;water and flash flooding in low&ndash;lying urban catchments). [PAG,IMG] (p17)</p></div></div></body></div>`)[0];
