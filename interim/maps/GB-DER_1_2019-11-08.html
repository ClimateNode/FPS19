                var html_1b022bd53087df4c93fd34c285d58ce9 = $(`<div id="html_1b022bd53087df4c93fd34c285d58ce9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Derby Rugby Club</h1><div class="nugget-popup"><p>Floodwaters from the overtopping River Derwent / Folly Brook inundated the rugby club grounds. (p22)</p></div><div class="nugget-popup"><p>On 8 November 2019 the access road, adjacent fences and playing fields at the Derby Rugby Football Grounds were inundated and rendered inaccessible; road surface and surrounding field areas were submerged, indicating significant disruption to site access and use. Nearby Haslams Lane experienced flood depths in excess of 1 m and its flood gate was closed at approximately 14:00 on 8 November and reopened the following morning. [PAG,IMG] (p24)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>flood depths in excess of 1 m along Haslams Lane [PAG,IMG] (p24)</p></div></div></body></div>`)[0];

                var html_e231c3f7d165afce1fe2af5cc046e5a7 = $(`<div id="html_e231c3f7d165afce1fe2af5cc046e5a7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Darley Abbey Mills</h1><div class="nugget-popup"><p>Site flood defences were not overtopped but experienced seepage; fluvial water seeping through defences (and groundwater seeping up through floors) caused internal flooding in commercial premises and disrupted business access. (p25)</p></div><div class="nugget-popup"><p>Recorded flood outlines surround Abbey Mills; although defences were not overtopped, seepage through defences and through property floors caused internal flooding of commercial premises and business disruption due to loss of access. [PAG,IMG] (p26)</p></div><div class="nugget-popup"><p>Seepage through the flood defences occurred at Darley Abbey Mills during the 8&ndash;9 November flood. (p43)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 1 commercial property internally flooded; internal flood depth approximately 150 mm (p25)</p></div><div class="nugget-popup quant"><p>1 commercial property; internal flooding up to 150 mm [PAG,IMG] (p26)</p></div></div></body></div>`)[0];

                var html_d573e0aacf890a5a48074d48a477d7de = $(`<div id="html_d573e0aacf890a5a48074d48a477d7de" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Exeter House</h1><div class="nugget-popup"><p>The flood bank located in front of Exeter House was overtopped as river levels rose; overtopping contributed to flood water flowing onto Exeter Place and Meadow Road. Derby City Council deployed sandbags along the top of the flood bank and at the junction with the flood wall to contain flood waters and prevent further overtopping. [PAG,IMG] (p32)</p></div></div></body></div>`)[0];

                var html_701098084aa997f3e09a1a7722afe70e = $(`<div id="html_701098084aa997f3e09a1a7722afe70e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cardinal House</h1><div class="nugget-popup"><p>The combined drainage system for Cardinal House has a hydraulic connection into the surface water system; when the surface water system backed up due to high river levels the combined system also backed up. Gullies in Cardinal House flooded as a result, with recorded flood outlines matching the area's surface&ndash;water flood risk. (p36)</p></div><div class="nugget-popup"><p>Backing up of the connected surface water and combined drainage caused water to flood out of the yard gully into the below&ndash;ground Western Power sub&ndash;station at Cardinal House. Flood water rose internally within the sub&ndash;station and caused failure of switchgear; the circuit failed at 21:56 on 8 Nov leading to widespread blackouts across Derby. Power restoration was completed in stages with the final stage at 23:25 on 8 Nov; restoration was delayed by flooded/closed roads elsewhere. [PAG,IMG] (p37)</p></div><div class="nugget-popup"><p>Flooding of the yard gully led to water entering the underground sub&ndash;station and caused switchgear failure; owners subsequently installed a non&ndash;return valve on the yard gully and a pump inside the sub&ndash;station, and Western Power raised the switchgear level. (p38)</p></div><div class="nugget-popup"><p>Surface water flooding affected the area around Cardinal House due to backing up of fluvial flows into the surface water drainage network, prompting consideration of non&ndash;return valves/pumping to allow discharge of flows. [TAB] (p44)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>greater than 130 mm (p36)</p></div><div class="nugget-popup quant"><p>flood depths greater than 130mm [PAG,IMG] (p37)</p></div></div></body></div>`)[0];

                var html_6a088de9fd2c9b09ce3b07564022c009 = $(`<div id="html_6a088de9fd2c9b09ce3b07564022c009" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Dam Brook</h1><div class="nugget-popup"><p>Dam Brook, an ordinary watercourse in Derby, was part of the local drainage network associated with the flood event of 08 Nov 2019 &ndash; 09 Nov 2019 and is reported alongside other ordinary watercourses and privately owned ditches that were affected. It likely contributed to localised runoff/overland flow and drainage connectivity during the event (some privately owned ditches connecting into the brook were affected). There is insufficient detail to state precise overtopping locations or property&ndash;level inundation. (p9)</p></div></div></body></div>`)[0];

                var html_2fecf706bec564892a4929aa5f99cd69 = $(`<div id="html_2fecf706bec564892a4929aa5f99cd69" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Derby</h1><div class="nugget-popup"><p>Internal flooding at multiple commercial properties and one residential property near the city border; disruption to critical infrastructure including closure of main roads, failure of a pumping station, and flooding of an electricity sub&ndash;station resulting in blackouts. (p7)</p></div><div class="nugget-popup"><p>Flooding occurred across the city within twelve investigation sites (many located adjacent to the River Derwent), affecting urban areas and infrastructure and prompting this Section 19 investigation. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>Flooding affected multiple sites across the city during the investigated event; the majority of the twelve sites considered are located close to the River Derwent and its tributary/ordinary watercourse network. Privately owned ditches connecting to the river were reported as being affected during the flood event. [PAG,IMG,TAB] (p10)</p></div><div class="nugget-popup"><p>Flood events occurred in Derby on 8 November 2019 driven by high river flows from the River Derwent following intense rainfall over the river's headwaters. [PAG,IMG,TAB] (p16)</p></div><div class="nugget-popup"><p>River Derwent peak flows propagated downstream to Derby. The River Derwent at St Mary's Bridge recorded a record high peak flow during the event, producing very high river levels that were associated with the flood incident in Derby on 8 November 2019. [PAG,IMG] (p17)</p></div><div class="nugget-popup"><p>On 8&ndash;9 November 2019 fluvial flooding from the River Derwent propagated downstream into Derby. Exceptionally high river levels overtopped and/or caused seepage through some flood defences, produced groundwater flooding in topographically low areas, and led to the sewer network backing up/surcharging from river water ingress to outfalls. These combined mechanisms produced the recorded flooding across the city; DCiC mapped flood outlines and managed response. [PAG] (p20)</p></div><div class="nugget-popup"><p>Flooding on the A61 at Pektron Island (within the Derby urban area) caused significant highway inundation and required response from Derby City Council. [IMG,PAG] (p21)</p></div><div class="nugget-popup"><p>Parts of Derby (central area) experienced river&ndash;driven flooding impacts during the event: seepage through partially constructed/unsealed sheet pile flood defences at the River Derwent bank led to water being pumped from the construction site back to the river; pump failure allowed floodwater to flow onto adjacent streets (notably City Road) where sandbags were deployed to protect properties. [PAG,IMG] (p28)</p></div><div class="nugget-popup"><p>Widespread impacts across the city including flooded and closed roads that delayed power restoration and blackouts caused by flood&ndash;induced substation failure. (p38)</p></div><div class="nugget-popup"><p>Flooding of the surface water drainage system caused backing&ndash;up at a Western Power underground sub&ndash;station yard gully, resulting in internal flooding of the sub&ndash;station, failure of the switchgear and a circuit failure at 21:56 on 8 Nov that produced blackouts across large areas of Derby. Power was restored in stages, with the final stage completed at 23:25 on 8 Nov; restoration was delayed in places due to flooded/closed roads. [IMG] (p39)</p></div><div class="nugget-popup"><p>Internal flooding of properties across the city; significant flooding on several main highways causing road closures; disruption to the electricity supply network causing a blackout in Derby. (p43)</p></div><div class="nugget-popup"><p>Derby experienced flooding during 8&ndash;9 November 2019 from the River Derwent and from surface water/runoff. Multiple locations were affected: Haslams Lane acted as an active floodplain, Sowter Road functioned as an exceedance channel, and City Road flooded due to incomplete flood defences. Surface water network connectivity and outfalls (including into the River Derwent) contributed to local inundation. [PAG] (p44)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>12 sites; one residential property (p7)</p></div><div class="nugget-popup quant"><p>highest peak on record across an 85&ndash;year period; estimated 75&ndash;95 year return period (ESS analysis); OCOR review estimated 60&ndash;95 year return period (report range 50&ndash;150 years) [PAG] (p20)</p></div><div class="nugget-popup quant"><p>water depths of approximately 500mm [IMG,PAG] (p21)</p></div><div class="nugget-popup quant"><p>depths up to 50mm; two pumps used (4&#8220; and 6"), 6&#8221; pump failed [PAG,IMG] (p28)</p></div><div class="nugget-popup quant"><p>approximately 7 commercial properties; one residential property; five locations (p43)</p></div></div></body></div>`)[0];

                var html_0b695a49e20a8ec03de17fefa523cfb6 = $(`<div id="html_0b695a49e20a8ec03de17fefa523cfb6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Chaddesden Sidings</h1><div class="nugget-popup"><p>Surface water drainage outfall behind Chaddesden Sidings and the railway underpass were identified as affected during the 8&ndash;9 November 2019 event. Actions recommended include investigating a non&ndash;return valve or pumping station on the surface water outfall, reinstating a flood defence bund around the railway underpass as a temporary measure, and investigating a former culvert beneath the railway. (p7)</p></div><div class="nugget-popup"><p>Flooding from multiple sources inundated Chaddesden Sidings. The River Derwent overtopped its banks and flooded the flood plain south of the railway; an underpass allowed that floodwater into Chaddesden Sidings. Additional sources included failure of the Downing Road pumping station and the STW surface water sewer backing up. The A52 and Chequers Road were flooded and closed, and commercial properties along Chequers Road experienced internal flooding. (p38)</p></div><div class="nugget-popup"><p>Chaddesden Sidings experienced flooding from multiple sources: fluvial flooding from the River Derwent overtopping the banks and flowing through an underpass, flooding through a missing/eroded flood defence bund, and backflow from the surface water sewer and railway culvert. Flooding affected the A52 and Chequers Road and caused internal flooding to commercial properties (Chequers Road) up to 1.5 m. [PAG,IMG] (p39)</p></div><div class="nugget-popup"><p>Flooding occurred north of the railway when high river levels caused flows to back up through a previously unknown railway culvert connected into the surface water drainage and the STW surface water sewer; water flowed back from the river into the culvert and flooded into Chaddesden Sidings. Foul manholes in the area are known to surcharge and foul water flooding is believed to have occurred. (p40)</p></div><div class="nugget-popup"><p>Flood defences at Chaddesden Siding were overtopped during the 8&ndash;9 November flood event. (p43)</p></div><div class="nugget-popup"><p>Surface water flooding occurred as fluvial flows backed up into the surface water network behind Chaddesden Sidings, causing discharge blockage and inundation; this led to recommended investigation of the railway culvert function and the potential reinstatement of a flood&ndash;defence bund around the underpass. [TAB] (p44)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>flood depths up to 1.5 m; A52 closed from 21:45 on 08 Nov 2019 (reopened 09 Nov 2019); Chequers Road closed at 07:41 on 09 Nov 2019 (p38)</p></div><div class="nugget-popup quant"><p>internal flooding depths up to 1.5 m to commercial properties (Chequers Road area) [PAG,IMG] (p39)</p></div></div></body></div>`)[0];

                var html_a9a07f344466a4b7bc40745be406a0db = $(`<div id="html_a9a07f344466a4b7bc40745be406a0db" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Derwent</h1><div class="nugget-popup"><p>Heavy, persistent rainfall over the Derwent headwaters on 6&ndash;7 Nov 2019 produced high river response in the River Derwent, which contributed to flood events affecting downstream areas including Derby on 8 November 2019. [PAG] (p16)</p></div><div class="nugget-popup"><p>Heavy rainfall over the Derwent catchment generated a strong river response that propagated downstream and contributed to the high river flows observed at downstream gauges and into Derby. [PAG] (p17)</p></div><div class="nugget-popup"><p>High river flows in the River Derwent and its tributary (Folly Brook) overtopped banks. Fluvial water entered a low&ndash;gradient, poorly maintained ditch and then the highway drainage outfall (which lacked a non&ndash;return valve), allowing river water to backflow into gullies and emerge at the A61 Pektron Island roundabout causing highway flooding. Flood flows from the overtopping also followed Folly Brook onto Haslams Lane, then onto the Rugby Club grounds and Darley Fields. The Pektron Island area was submerged and the roundabout required temporary closure. [PAG] (p21)</p></div><div class="nugget-popup"><p>High river flows caused the River Derwent to overtop its banks; fluvial water entered a nearby low&ndash;fall, poorly maintained ditch, forcing ditch levels above the highway drainage outfall and driving floodwater into the highway drainage network. [PAG] (p22)</p></div><div class="nugget-popup"><p>Fluvial flooding from the River Derwent is implicated in seepage through flood defences around Darley Abbey Mills and is represented by the recorded flood outline that follows the river, contributing to internal flooding and groundwater emergence at nearby properties. [PAG,IMG] (p26)</p></div><div class="nugget-popup"><p>High river levels led to seepage through unsealed joints in partially constructed sheet pile flood defences on the riverbank (behind Old Tomlinson Yard). The seepage required pumping of water from the construction site back to the River Derwent and contributed to surface water reaching City Road when a pump failed. [PAG,IMG] (p28)</p></div><div class="nugget-popup"><p>The River Derwent overtopped its banks (south of Causey Bridge) and sent floodwaters into exceedance channels and across adjacent urban areas, contributing to flows that reached Sowter Road and collected in the Sowter Road underpass. [IMG] (p29)</p></div><div class="nugget-popup"><p>Rising levels in the River Derwent caused overtopping of riverbanks and seepage through the riverside flood wall. These failure modes produced substantial flooding in the Exeter Place / Meadow Road area (seepage and overtopping), contributed to flooding along Meadow Lane (overtopping near the footbridge), and prompted local mitigation (sandbags, penstock operation elsewhere). [PAG,IMG] (p32)</p></div><div class="nugget-popup"><p>The River Derwent overtopped its banks at the footbridge, constricting flows and causing fluvial flooding onto Meadow Lane. Overtopping flooded the road and led to internal flooding of nearby commercial properties and the evacuation of one commercial property. [PAG,IMG] (p34)</p></div><div class="nugget-popup"><p>The River Derwent overtopped its banks (starting by the footbridge, which acted as a constriction), causing fluvial flooding of the Meadow Lane industrial area (flooding of the road and internal flooding of commercial properties). High river levels also caused the surface water sewer to back up, which led to manhole/gully flooding and inundation of highway locations away from the river (including Pentagon Island and Eastgate gullies). [PAG] (p35)</p></div><div class="nugget-popup"><p>The River Derwent overtopped its banks during the event, flooding the floodplain to the south of the railway tracks. Overtopping and high river levels contributed to flood water flowing into Chaddesden Sidings (via an underpass and via backing up into connected drainage features). [PAG,IMG] (p39)</p></div><div class="nugget-popup"><p>The River Derwent overtopped its banks and flooded the floodplain south of the railway, allowing water to flow into Chaddesden Sidings via an underpass (the protective flood bund was absent/eroded). High river levels also caused river flows to back up into a railway culvert and the connected surface water sewer, contributing to flooding north of the railway. Elevated river levels prevented outfalls (including a flap&ndash;valved ditch outfall) from discharging: the ditch filled and overtopped, flooding an adjacent commercial car park, and a separate surface water outfall was prevented from discharging causing pluvial flows to back up and flood one commercial property on Raynesway. [PAG] (p40)</p></div><div class="nugget-popup"><p>Elevated river levels in the River Derwent during the event prevented connected outfalls (flap valves) and surface water systems from discharging. This led to ditch filling and overtopping into an adjacent car park, backflow along surface water pipes causing internal flooding of a commercial property, and contributed to flows backing up through a railway culvert and surface water sewer into areas north of the railway (contributing to flooding and pump station inundation reported by STW). [PAG,IMG] (p41)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>20&ndash;25 year return period event recorded at Derwent Reservoir (upper catchment) [PAG] (p17)</p></div><div class="nugget-popup quant"><p>500 mm water depth at Pektron Roundabout; Pektron Island underwater by 21:45 on 8 Nov 2019 [PAG] (p21)</p></div><div class="nugget-popup quant"><p>depths up to 50mm (reported within the construction site and along City Road); two pumps used (4&#8220; and 6"), 6&#8221; pump failure recorded [PAG,IMG] (p28)</p></div><div class="nugget-popup quant"><p>flood depths exceeding 2 m on Meadow Road; seepage&ndash;related flooding in Darwin Place up to 50 mm; approx. 150&ndash;200 mm flood depths near the bridge on Meadow Lane; four commercial properties internally flooded (Meadow Lane) [PAG,IMG] (p32)</p></div><div class="nugget-popup quant"><p>four commercial properties; one commercial property evacuated; 150mm to 200mm flood depth near the bridge (by 14:30 on 8 Nov 2019) [PAG,IMG] (p34)</p></div><div class="nugget-popup quant"><p>flood depths of approximately 150mm to 200mm near the bridge by 14:30 on 08 Nov 2019; internal flooding at four commercial properties; one commercial property evacuated [PAG] (p35)</p></div><div class="nugget-popup quant"><p>internal flooding depths up to 1.5 m (commercial properties on Chequers Road); car park flooding to approx 300 mm [PAG] (p40)</p></div><div class="nugget-popup quant"><p>approximate maximum depth of 300mm (in adjacent car park); one commercial property internally flooded; one pumping station became flooded [PAG,IMG] (p41)</p></div></div></body></div>`)[0];
