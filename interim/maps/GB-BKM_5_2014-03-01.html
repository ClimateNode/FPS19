                var html_1aae8667156bda9549055ed2b102e564 = $(`<div id="html_1aae8667156bda9549055ed2b102e564" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Chalfont St Giles</h1><div class="nugget-popup"><p>Exceptionally high groundwater levels in the chalk aquifer caused groundwater flooding in the village, which affected local critical infrastructure including the Affinity Water pumping station, the British Telecom telephone exchange, and the main access road to the village shops. (p4)</p></div><div class="nugget-popup"><p>The locality affected by the flood incident was the High Street &mdash; the village centre experienced flooding during the event. [PAG] (p7)</p></div><div class="nugget-popup"><p>Surface&ndash;water and fluvial flooding affected the valley bottom and centre of the village. Flood extents from the central watercourse overlap residential and commercial property footprints and threaten the main road through the village (Pheasant Hill / High Street); the valley topography funnels groundwater, surface water and fluvial flow into the village centre increasing flood depths and extent. [PAG,IMG] (p12)</p></div><div class="nugget-popup"><p>The local river (Misbourne) was at bank full and in spate during the event, causing minor flooding of bankside gardens and farmland in the Chalfont St Giles locality. No reports indicated failings or blockages in highway or surface water drainage that would have worsened the flooding. [PAG] (p17)</p></div><div class="nugget-popup"><p>Exceptionally high groundwater levels in the chalk aquifer flooded parts of the village: a public water supply pumping station and the BT telephone exchange were flooded; over&ndash;pumping from the BT exchange caused flooding of the high street and a carpark, the main street was reduced to one direction of traffic, and there was an economic impact on small businesses. [PAG] (p18)</p></div><div class="nugget-popup"><p>Exceptionally high groundwater levels in the chalk aquifer caused groundwater flooding across the village that affected local critical infrastructure: the Affinity Water pumping station and the BT telephone exchange were impacted, and the main access road to the shops in the village centre was flooded, restricting access. (p23)</p></div><div class="nugget-popup"><p>Groundwater flooding in spring 2014 impacted the village: local critical infrastructure was affected (Affinity Water pumping station and the BT telephone exchange) and the main access road to the village shops was flooded. [TAB,PAG] (p24)</p></div></div></body></div>`)[0];
