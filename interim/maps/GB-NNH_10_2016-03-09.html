                var html_f41420df2468d845b11a75440d86d939 = $(`<div id="html_f41420df2468d845b11a75440d86d939" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Station Road, Irthlingborough</h1><div class="nugget-popup"><p>Heavy rainfall caused surface water drainage and watercourses to be unable to convey rainwater, producing excess surface water that flowed to low points around private property and resulted in internal flooding of properties on Station Road. (p7)</p></div><div class="nugget-popup"><p>Internal flooding of properties occurred on Station Road. The report states internal flooding of more than one property has been experienced on more than one occasion in the five years prior to the investigation. [MUL] (p9)</p></div><div class="nugget-popup"><p>Flooding occurred near Station Road, close to the roundabout junction with the A6 Finedon Road. Several businesses on the north and south sides of Station Road, immediately west of the A6, were affected by the flood. (p10)</p></div><div class="nugget-popup"><p>Station Road was flooded by flowing surface water (flow from the west) during the same overtopping events, impeding access and requiring placement of sandbags on the kerbline during responses. [TAB,MUL] (p12)</p></div><div class="nugget-popup"><p>The carriageway between the businesses was flooded before the overland flow from the watercourse started; water overtopped the lowered kerbs on the south side of the carriageway and flowed off the highway towards private property; attempts were made to unblock road gullies. (p14)</p></div><div class="nugget-popup"><p>Flooding occurred on Station Road when heavy rainfall and overwhelmed drainage/watercourses caused excess surface water to flow to low points around private properties. [PAG] (p15)</p></div><div class="nugget-popup"><p>Heavy rainfall on a saturated catchment caused drainage systems and watercourses to be unable to collect and convey rainwater, resulting in excess surface water flowing over ground into low points around private properties on Station Road. Sections of upstream watercourse that had not been recently maintained were identified as a significant contributory factor; limited records of underground drainage suggest historic/private systems may have exacerbated the incident. (p16)</p></div><div class="nugget-popup"><p>Flooding of the carriageway (overland flow) occurred on Station Road; lowered kerbs are noted at the location of carriageway flooding. [IMG] (p33)</p></div><div class="nugget-popup"><p>Standing floodwater covered the carriageway and part of the footway; responders placed a continuous line of sandbags across the road to control/divert water flow and protect the nearby traffic features, disrupting normal vehicle and pedestrian movement. [IMG] (p42)</p></div><div class="nugget-popup"><p>Floodwater extended from the building edge across the sidewalk and into the carriageway, covering the pavement and affecting parked vehicles and pedestrian movement on Station Road. [IMG,PAG] (p43)</p></div><div class="nugget-popup"><p>Station Road carried the flow route of flood water during the event; wet pavement is visible, an approximate route of a below&ndash;ground culvert under the carriageway is shown directing flow, and unused lowered kerbs on the south carriageway channel are visible along the flood route. [IMG,PAG] (p53)</p></div><div class="nugget-popup"><p>Floodwater flowed across the carriageway along Station Road via the identified flow route and kerb channels, inundating the road surface and affecting access between the businesses either side of the road. [IMG,PAG] (p54)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than one property; more than one occasion in the last 5 years (p7)</p></div><div class="nugget-popup quant"><p>4 businesses (p10)</p></div></div></body></div>`)[0];

                var html_dacc4be7633f43b2a29c187deb892257 = $(`<div id="html_dacc4be7633f43b2a29c187deb892257" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Irthlingborough</h1><div class="nugget-popup"><p>A flood incident on 9 March 2016 (Station Road, Irthlingborough) caused surface water to flow to low points around private properties, resulting in internal flooding of more than one property and repeated internal flooding events within the preceding five years. (p7)</p></div><div class="nugget-popup"><p>Properties in Irthlingborough (specifically on Station Road) experienced internal flooding, with internal flooding of more than one property on multiple occasions. [PAG,MUL] (p9)</p></div><div class="nugget-popup"><p>The east of the town (Station Road area adjacent to the A6/Finedon Road) experienced flooding which affected commercial properties; local ordinary watercourse and culvert blockages/surcharge contributed to the incident. (p10)</p></div><div class="nugget-popup"><p>The flood incident at Station Road in Irthlingborough was caused by heavy rainfall on a saturated catchment, with drainage systems and watercourses unable to convey rainwater effectively; this led to excess surface water flowing overland to low points around private properties within Irthlingborough. (p16)</p></div><div class="nugget-popup"><p>The town experienced a flood incident (the report refers to 'this flood incident' affecting Irthlingborough). The event prompted advice and actions for property owners and communities regarding riparian responsibilities, maintenance of ponds/ditches/open drainage and community resilience measures. (p17)</p></div><div class="nugget-popup"><p>Flooding incidents occurred in Irthlingborough that prompted a Section 19 investigation by the LLFA and the recording of assets and flooding hotspots affecting the area. (p19)</p></div><div class="nugget-popup"><p>The town was the location of the flood investigated in this report and was affected by flooding during the event on 9th March 2016. (p21)</p></div><div class="nugget-popup"><p>A flood incident occurred in the town; the mapped catchment is described as contributing runoff to the flood location within Irthlingborough (map annotation indicates the flood incident location is within the outlined catchment). [IMG] (p32)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than one property; more than one occasion in the last 5 years (p7)</p></div><div class="nugget-popup quant"><p>4 businesses (p10)</p></div></div></body></div>`)[0];
