                var html_1644e613b4b56d33e71fdc5774012eff = $(`<div id="html_1644e613b4b56d33e71fdc5774012eff" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Newcomen Road, Wellingborough</h1><div class="nugget-popup"><p>Intense, short&ndash;duration heavy rainfall overwhelmed surface water drainage. Excess surface water flowed over ground to low points around properties, causing internal flooding of multiple neighbouring buildings on Newcomen Road. (p6)</p></div><div class="nugget-popup"><p>Internal flooding of buildings occurred during a single flood incident; water entered buildings (crossed thresholds) on Newcomen Road. (p8)</p></div><div class="nugget-popup"><p>Properties experienced flooding to rear gardens from surcharging manhole covers (sewer flooding) which flowed across gardens into rear alleys; in other properties surface water ran down adjacent streets and open space into rear gardens and entered properties through rear/kitchen doors and by seepage through rear walls. One property had whole&ndash;ground&ndash;floor inundation reaching electrical sockets, causing loss of electricity and damage to appliances. [TAB] (p17)</p></div><div class="nugget-popup"><p>The north side of Newcomen Road was flooded by surface water flowing south from Gordon Road, across a public open space and through rear garden gates/fences into rear of dwellings. Water entered properties via rear doors, air bricks and other voids, causing internal flooding and prompting some residents to board up back gates to try to prevent recurrence. (p18)</p></div><div class="nugget-popup"><p>Surface water flowed south beneath gates and fencing of rear gardens on the north side of Newcomen Road towards the rear of dwellings. Water entered dwellings via rear doors, air bricks and other voids/weaknesses. Standing water increased in the natural valley so lower properties experienced deeper internal flooding. The foul public sewer at the rear of properties on the south side (also accepting roof water) was exceeded; manhole covers were forcibly lifted and strong flows discharged from open manholes, producing overland flow that contributed to water in the back alley. Roof gutters were also reported overtopping, adding to surface runoff. [PAG] (p19)</p></div><div class="nugget-popup"><p>Overland/surface water flow from the north entering rear gardens; residents have installed improvised barriers (plastic sheeting, wooden planks, bricks) at the base of walls/gates to block or divert water from entering rear gardens. There is also a significant build&ndash;up of fallen leaves that could affect drainage at the carriageway channel, increasing risk of surface water run&ndash;off into properties. [IMG,PAG] (p38)</p></div><div class="nugget-popup"><p>Overland water flow from the north entering rear gardens; residents made attempts to prevent water entering rear gardens. Significant build&ndash;up of fallen leaves along the carriageway channel noted, which could impair gully/road drainage and exacerbate surface water runoff into properties' rear gardens. [PAG] (p39)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than five buildings (p6)</p></div><div class="nugget-popup quant"><p>more than five buildings (p8)</p></div><div class="nugget-popup quant"><p>250mm (assumed to reach electrical sockets); 15mm depth in one property [TAB] (p17)</p></div><div class="nugget-popup quant"><p>8 properties (on Newcomen Road) reported internal flooding; area total 11 properties flooded internally in Wellingborough (p18)</p></div></div></body></div>`)[0];

                var html_133807de175ba2a984858e9c4ae662ee = $(`<div id="html_133807de175ba2a984858e9c4ae662ee" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Mill Road, Wellingborough</h1><div class="nugget-popup"><p>Strong surface water flows reached the junction of Mill Road and Gordon Road; the junction acted as a low point where drainage was overwhelmed and water flowed over kerbs into the nearby public open space and then into rear gardens of properties on Newcomen Road. (p18)</p></div><div class="nugget-popup"><p>Photographs show the low point on Mill Road (opposite the junction with Gordon Road) with wet pavement and storm drains present. The images document surface water accumulation/damp conditions at this low point and the presence of a gully/drain at the carriageway edge adjacent to private rear gardens (Newcomen Road). [IMG,PAG] (p37)</p></div></div></body></div>`)[0];

                var html_4e59599ec4934a4b868a48f5874ca243 = $(`<div id="html_4e59599ec4934a4b868a48f5874ca243" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Northamptonshire</h1><div class="nugget-popup"><p>Met Office issued a yellow thunderstorm warning covering Northamptonshire for 16 August 2020; Gov.uk forecast indicated localised flooding was possible from surface water and small rivers in the area, with properties potentially flooding and travel disruption possible. (p10)</p></div><div class="nugget-popup"><p>Surface water flooding occurred in parts of the catchment within Northamptonshire, affecting highway drainage and developments and prompting multi&ndash;agency actions to cleanse drains, assess capacity and review planning and drainage measures to reduce flood risk. (p27)</p></div></div></body></div>`)[0];

                var html_f241417a41a6286e36c0f1580000e317 = $(`<div id="html_f241417a41a6286e36c0f1580000e317" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wellingborough</h1><div class="nugget-popup"><p>Surface water flooding from intense heavy rainfall led to internal flooding of multiple nearby buildings (on Newcomen Road) when local drainage systems were unable to convey the runoff, causing water to flow to low points around properties. (p6)</p></div><div class="nugget-popup"><p>Area (Newcomen Road within Wellingborough) experienced internal flooding of buildings during the single flood incident. (p8)</p></div><div class="nugget-popup"><p>The report describes a flood incident in the area of Wellingborough involving surface water / urban flooding linked to highway and private drainage discharging to the public surface water sewer. (p15)</p></div><div class="nugget-popup"><p>In this area of Wellingborough (including Newcomen Road), internal flooding affected properties; community impacts included displaced vulnerable residents and property damage such as replaced flooring. (p18)</p></div><div class="nugget-popup"><p>Areas of Wellingborough were affected by surface water/urban flooding. Several properties and external areas held relatively deep flood water with no effective means to drain; Fire and Rescue pumped water from affected properties and external areas to safe areas. Drainage capacity issues were reported. (p20)</p></div><div class="nugget-popup"><p>This area experienced flooding caused by intense heavy rainfall over a relatively short period. Properties were affected; details of affected properties and the immediate response were shared by the Emergency Planning Team with the Lead Local Flood Authority, and Section 19 flood incident investigations were instructed where thresholds were met. [PAG] (p21)</p></div><div class="nugget-popup"><p>Intense heavy rainfall caused surface water drainage systems across the catchment to be unable to collect and convey rainwater, causing excess surface water to flow over ground to low points around properties. These low points flooded because there were no effective overland flow routes to divert water to safe areas, creating a reliance on buried drainage systems (some of which required maintenance/cleansing). There was no prior warning and no community or property&ndash;level resilience measures in place to be deployed. [PAG] (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than five buildings (p6)</p></div><div class="nugget-popup quant"><p>more than five buildings (p8)</p></div><div class="nugget-popup quant"><p>11 properties reported to have flooded internally in this area of Wellingborough (p18)</p></div></div></body></div>`)[0];
