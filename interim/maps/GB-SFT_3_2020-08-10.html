                var html_1ebf3d769e469c94600f455940139adf = $(`<div id="html_1ebf3d769e469c94600f455940139adf" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Westbourne Avenue, Thornton</h1><div class="nugget-popup"><p>Westbourne Avenue experienced flooding during the intense short&ndash;duration storm on the night of 10/11 August 2020; the incident triggered a Section 19 investigation. The street has been affected by flooding each year in the last four years; drainage was temporarily overloaded. (p3)</p></div><div class="nugget-popup"><p>Properties numbered experienced surface water / flash flooding confined to their front and back gardens and to garages. Several driveways slope down from the road to the garages, providing a flow path for runoff into garage areas. The area drains to a conventional surface water sewer that discharges to a local watercourse. (p4)</p></div><div class="nugget-popup"><p>Flooding was confined to the front and back gardens and garages of some properties. The properties are either level with the road or have driveways that slope down from the road to the garages, which facilitated runoff and ingress into garages and gardens. Drainage in the area discharges to a local watercourse running through Thornton. (p5)</p></div><div class="nugget-popup"><p>High&ndash;intensity rainfall caused ponding on the highway; road&ndash;level water drained toward adjacent properties because houses and driveways are lower than the road. Manhole outside No.49 and a manhole in the garden of No.45 were observed to bubble, indicating surcharge of the surface water/drainage system. Blockage was later found in the downstream watercourse section connected to the surface water sewer. (p7)</p></div></div></body></div>`)[0];

                var html_43c4094aefedb6e3a549aa5219e05b46 = $(`<div id="html_43c4094aefedb6e3a549aa5219e05b46" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Thornton</h1><div class="nugget-popup"><p>The report identifies an intense, short&ndash;duration thunderstorm on the night of 10th/11th August 2020 that overloaded drainage across the borough and produced surface&ndash;water/urban flooding in Thornton; Westbourne Avenue (in Thornton) was specifically affected and has experienced flooding annually over the last four years. (p3)</p></div><div class="nugget-popup"><p>The thunderstorm caused surface water / flash flooding at least at the named Westbourne Avenue properties in Thornton; local drainage runs to a watercourse that traverses Thornton from Runnels Lane to Brook Road. (p4)</p></div><div class="nugget-popup"><p>A very intense, short&ndash;duration rainfall cell produced over 20 mm of rain in about 25 minutes (radar peaks ~140 mm/hr), and the text states this occurred 'at the time of the flooding' in Thornton&mdash;i.e. the intense rainfall caused flooding in Thornton. [IMG,PAG] (p6)</p></div><div class="nugget-popup"><p>Short, intense thunderstorm produced rapid onset surface water flooding: rainfall exceeded drainage capacity causing ponding on the highway and flow into properties/driveways that are lower than the road. Manholes were observed to bubble (sewer surcharge) indicating drainage system overload. Overall described as external flooding with minor impacts but potential ongoing wellbeing impacts for residents. [IMG] (p7)</p></div></div></body></div>`)[0];
