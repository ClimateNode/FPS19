                var html_b8d456296d7590ee7f0269d87ee42138 = $(`<div id="html_b8d456296d7590ee7f0269d87ee42138" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Whiston Road, Denton</h1><div class="nugget-popup"><p>High water levels in an ordinary watercourse overtopped banks at a specific location, allowing a combination of surface water and groundwater to enter a basement and cause internal flooding of a building on Whiston Road. (p7)</p></div><div class="nugget-popup"><p>Internal flooding of a building on Whiston Road; water entered the interior of the property during the flood event and the property has experienced internal flooding on more than one occasion in the preceding five years. [PAG,MUL] (p9)</p></div><div class="nugget-popup"><p>Basements of properties flooded and gardens inundated when the watercourse to the rear of the properties was unable to discharge through a 450mm diameter culvert (likely insufficient capacity, blockage or breakage), causing flow to back up into properties. [TAB,MUL] (p12)</p></div><div class="nugget-popup"><p>Properties on Whiston Road were flooded (the report placed particular focus on these flooded properties). (p14)</p></div><div class="nugget-popup"><p>Watercourses could not convey rainfall on the saturated catchment; banks overtopped at a specific location and a combination of surface water and groundwater entered the basement of a property on Whiston Road, causing internal flooding. (p21)</p></div><div class="nugget-popup"><p>Schematic flooding areas shown adjacent to culvert inlets (01A and 02A); main overland flow routes during the incident directed across/along Whiston Road toward the culvert inlets suggesting overland surface water inundation and localised flooding of carriageway/adjacent land. [IMG] (p32)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one building (p7)</p></div><div class="nugget-popup quant"><p>one building [PAG,MUL] (p9)</p></div><div class="nugget-popup quant"><p>2 properties; 1 property; approximately seven occasions [TAB,MUL] (p12)</p></div><div class="nugget-popup quant"><p>1 property (basement flooded) (p21)</p></div></div></body></div>`)[0];

ater/overland flooding in parts of the village. [IMG] (p32)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one building [MUL] (p7)</p></div><div class="nugget-popup quant"><p>one building [PAG] (p9)</p></div><div class="nugget-popup quant"><p>1 property (basement flooded) (p21)</p></div></div></body></div>`)[0];
