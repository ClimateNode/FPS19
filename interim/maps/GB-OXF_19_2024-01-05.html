                var html_39e8857732ad06293b306b29728fb088 = $(`<div id="html_39e8857732ad06293b306b29728fb088" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Sandford Brook</h1><div class="nugget-popup"><p>Flooding of Sandford Brook (alongside the River Ock) contributed to floodwaters entering estate roads and properties in the Nash Drive area, causing roadway inundation and internal property flooding; gardens adjacent to the watercourse rose. [PAG] (p2)</p></div><div class="nugget-popup"><p>Sandford Brook flooded (as a main river watercourse) following a wet autumn/winter and heavy rainfall on 03&ndash;04 January, contributing to flooding of the Nash Drive area on 05&ndash;06 January 2024. (p3)</p></div><div class="nugget-popup"><p>Sandford Brook produced runoff that contributed to the flooding near Nash Drive on 05&ndash;06 Jan 2024; flows from Sandford Brook converged with flows from the Ock upstream of the Nash Drive area, worsening local inundation. [IMG,PAG] (p7)</p></div><div class="nugget-popup"><p>Sandford Brook runs parallel to and converges near Nash Drive and is identified on the report maps as a principal watercourse; it is implicated as contributing to river flooding in the Nash Drive area during the event. [IMG,PAG] (p8)</p></div><div class="nugget-popup"><p>Sandford Brook flooded during the event and contributed to road and property flooding in the area (properties on Nash Drive, Orpwood Road and Chaunterell Way experienced internal flooding); highway drainage reached capacity and road drains surcharged. (p10)</p></div><div class="nugget-popup"><p>Sandford Brook levels rose alongside the River Ock and contributed to flooding that impacted roads and properties in the local area. [PAG] (p15)</p></div><div class="nugget-popup"><p>Sandford Brook levels rose and contributed to impacts on nearby roads and properties, forming part of the flooding observed in the locality. [PAG] (p16)</p></div><div class="nugget-popup"><p>Flooding of Sandford Brook contributed to the flooding of the Nash Drive area. Site visits in March 2024 observed natural woody material and silt in the channel, but these blockages were not judged to be sufficient to make a measurable difference to levels of flooding to properties or roads. [IMG,PAG] (p17)</p></div><div class="nugget-popup"><p>Sandford Brook (a main river watercourse) rose and contributed to the flooding that flowed onto estate roads and into gardens and properties in the Nash Drive area, forming part of the source of the internal flooding on 05&ndash;06 Jan 2024. (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Contributed to internal flooding of 16 residential properties; 12 garages flooded; 5 grounds/gardens flooded [PAG] (p2)</p></div><div class="nugget-popup quant"><p>17 residential properties (p10)</p></div></div></body></div>`)[0];

                var html_cff572356f50455c2e0f684b832573fa = $(`<div id="html_cff572356f50455c2e0f684b832573fa" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Nash Drive, Abingdon</h1><div class="nugget-popup"><p>Flooding occurred on Nash Drive and surrounding roads. (p1)</p></div><div class="nugget-popup"><p>Flood water flowed onto estate roads from the north end of Nash Drive; the north end and roadway were affected and residential properties on Nash Drive were flooded internally (mostly from the front/roadside); water came up out of road drains; gardens of properties closest to the rivers also rose. (p2)</p></div><div class="nugget-popup"><p>Properties in the Nash Drive area were flooded when the River Ock and Sandford Brook flooded following a wet autumn/winter and especially heavy rainfall on 03&ndash;04 January. By mid&ndash;morning on 06 January flood levels had dropped to a point where water was no longer entering properties. (p3)</p></div><div class="nugget-popup"><p>The Nash Drive area was flooded on 05&ndash;06 Jan 2024 when high flows from the River Ock and Sandford Brook inundated the neighbourhood; the area is also mapped as high risk of river flooding. [IMG] (p6)</p></div><div class="nugget-popup"><p>The Nash Drive area was flooded on 05&ndash;06 Jan 2024 due to converging high flows from the River Ock and Sandford Brook upstream; the map and caption identify Nash Drive as the area impacted by these fluvial flows. [IMG,PAG] (p7)</p></div><div class="nugget-popup"><p>The Nash Drive residential area lies between the River Ock and Sandford Brook; the report maps and context indicate the area experienced flooding associated with the nearby watercourses during the event. [IMG,PAG] (p8)</p></div><div class="nugget-popup"><p>Residential properties were flooded internally when floodwater entered from the front (roadside) after the highway drainage system reached capacity and road drains surcharged. (p10)</p></div><div class="nugget-popup"><p>The north end of Nash Drive was inundated on 06 January 2024; floodwater covered the street, reached into gardens and properties, and left vehicles stranded and access compromised. Sandbags were provided to help reduce water entering homes from the road. [IMG] (p11)</p></div><div class="nugget-popup"><p>The Nash Drive area was specifically identified as impacted by rising river levels and associated flooding of roads and nearby properties during the event. (p15)</p></div><div class="nugget-popup"><p>The Nash Drive area experienced flooding of roads and properties caused by very high river levels in the Ock and Sandford Brook, with additional contribution from local surface water runoff from the estate. [PAG] (p16)</p></div><div class="nugget-popup"><p>Flood water from the River Ock and Sandford Brook flowed onto estate roads from the north end of Nash Drive, affecting the north end of the street. Properties on Nash Drive suffered internal flooding between 05 Jan 2024 and 06 Jan 2024 (part of the 17 confirmed residential properties). Flooding mostly entered from the front (roadside) and water also surfaced from road drains; gardens at rear of properties nearest the rivers were inundated. (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>16 residential properties internally flooded in the Nash Drive area (including Chaunterell Way, Nash Drive and Orpwood Way); 12 properties had flooding of integral garages; 5 properties had flooding of grounds and gardens. (p2)</p></div><div class="nugget-popup quant"><p>17 residential properties (across Nash Drive, Orpwood Road and Chaunterell Way) (p10)</p></div><div class="nugget-popup quant"><p>1 property (Francis Little Drive) [PAG] (p16)</p></div><div class="nugget-popup quant"><p>17 residential properties (across Nash Drive, Orpwood Road and Chaunterell Way) (p18)</p></div></div></body></div>`)[0];

 also emerged from road drains. (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>16 residential properties internally flooded in the Nash Drive area (including Chaunterell Way, Nash Drive and Orpwood Way); 12 properties had flooding of integral garages; 5 properties had flooding of grounds and gardens. (p2)</p></div><div class="nugget-popup quant"><p>17 residential properties (across Nash Drive, Orpwood Road and Chaunterell Way) (p10)</p></div><div class="nugget-popup quant"><p>17 residential properties (across Nash Drive, Orpwood Road and Chaunterell Way) (p18)</p></div></div></body></div>`)[0];

                var html_ae496fb21939a750027c7dc240f1f6d6 = $(`<div id="html_ae496fb21939a750027c7dc240f1f6d6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Abingdon</h1><div class="nugget-popup"><p>Flooding affected Nash Drive and surrounding roads within Abingdon. (p1)</p></div><div class="nugget-popup"><p>Flooding in the Nash Drive area (Chaunterell Way, Nash Drive and Orpwood Way) with estate roads inundated and water entering properties (mostly from the front); gardens at rear of riverside properties also rose. Flood water also came up from road drains. (p2)</p></div><div class="nugget-popup"><p>Runoff from the River Ock and Sandford Brook converged upstream of the Nash Drive area, causing fluvial flooding in the Nash Drive area of Abingdon on 05&ndash;06 January 2024. [IMG] (p7)</p></div><div class="nugget-popup"><p>River Ock and Sandford Brook overtopped/caused flooding that led to roads on the estate being flooded and properties experiencing internal flooding overnight. [IMG,MUL] (p9)</p></div><div class="nugget-popup"><p>Parts of Abingdon experienced surface water/urban flooding during the event; example impacts include residential driveway and threshold inundation at Chaunterell Way. [IMG] (p12)</p></div><div class="nugget-popup"><p>River levels in the River Ock and Sandford Brook rose and impacted roads and properties across Abingdon, including the Nash Drive area; local surface water runoff contributed and one property on Francis Little Drive flooded. [IMG,PAG] (p15)</p></div><div class="nugget-popup"><p>During the 05&ndash;06 Jan 2024 flood waters entered the highway drainage system (reported as coming up through road drains) and the main flow path onto roads was overland, with water flowing from roads into properties. (p25)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>16 residential properties internally flooded; 12 properties with integral garages flooded; 5 properties with grounds/gardens flooded; 1 property on Francis Little Drive internally flooded (p2)</p></div><div class="nugget-popup quant"><p>1 property; average river flows of over 16 m3/s on 05 and 06 January 2024 [IMG,PAG] (p15)</p></div></div></body></div>`)[0];
