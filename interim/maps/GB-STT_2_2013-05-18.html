                var html_e74acfb013d6432e8d1251b52a36ae77 = $(`<div id="html_e74acfb013d6432e8d1251b52a36ae77" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ilkeston Walk, Hardwick</h1><div class="nugget-popup"><p>Pluvial (surface&ndash;water) flash flooding on 18 May 2013 caused internal flooding to properties on Ilkeston Walk; flooding was rapid (flash) and took several hours to subside, and anecdotal evidence indicates repeated past occurrences. [PAG] (p9)</p></div><div class="nugget-popup"><p>Pluvial/flash flooding affected properties on Ilkeston Walk; up to 9 properties experienced internal flooding and a further 3 properties were at risk, forcing residents to leave their homes. Floodwaters rose quickly and took several hours to subside; anecdotal evidence indicates repeated past flooding. [IMG,PAG] (p10)</p></div><div class="nugget-popup"><p>Runoff from an adjacent, higher field inundated the adopted footpath, overwhelmed the footpath gully/drain, flowed over the footpath and entered front gardens and properties via very low&ndash;level air bricks and then front doors, causing internal flooding of the dwellings. Properties had no flood protection in place. [PAG] (p11)</p></div><div class="nugget-popup"><p>Flood water reached properties such that internal property flooding was possible; property&ndash;level protection (waterproof flood doors, one&ndash;way brick covers, external waterproofing) would prevent water entering and so avoid internal flooding. Without such measures residents experienced occasional short&ndash;term inconvenience rather than devastating internal flooding. (p13)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>9 properties affected by internal flooding; 3 properties at risk [PAG] (p9)</p></div><div class="nugget-popup quant"><p>up to 9 properties affected by internal flooding; 3 properties at risk [IMG,PAG] (p10)</p></div></div></body></div>`)[0];
