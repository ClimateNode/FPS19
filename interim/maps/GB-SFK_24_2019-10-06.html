                var html_b24f077692229b164add06fef64075bd = $(`<div id="html_b24f077692229b164add06fef64075bd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ingate, Beccles</h1><div class="nugget-popup"><p>Identified in the report title as subject of a Section 19 flood investigation by the Lead Local Flood Authority following a flood event. (p1)</p></div><div class="nugget-popup"><p>Properties on Ingate Road experienced internal flooding during the flood event; part of the total of seven properties reported as flooded internally. (p2)</p></div><div class="nugget-popup"><p>Ingate experienced substantial ponding in a local depression causing migration of exceedance volumes into properties; highway gullies were blocked, highway flooded to similar depths as properties, rear gardens flooded and sewage was reported in gardens. Surcharging of the foul sewer (including jets at manhole ref 5901) contributed to the flooding. [PAG] (p3)</p></div><div class="nugget-popup"><p>Localised ponding at front and rear of buildings in the valley of the town's open drain; highway drainage performance reduced (surcharged outfalls and possible reverse flows) due to especially high levels in the main open drain; blocked highway gullies prevented runoff escape leading to combined highway and foul flooding. (p4)</p></div><div class="nugget-popup"><p>Properties experienced localised ponding at the front and rear due to lack of safe exceedance routes; highway drainage was overwhelmed/ineffective (4 highway gullies were completely blocked) causing no escape for rainfall and contributing to foul flooding. High water levels in the town's main open drain likely reduced highway drainage performance via surcharged outfalls or reverse flows. [PAG] (p5)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>7 properties (p2)</p></div><div class="nugget-popup quant"><p>7 properties (total across Ingate and Fredericks Road) internally flooded; 4 highway gullies reported completely blocked; flood depths up to 400 mm [PAG] (p3)</p></div></div></body></div>`)[0];
