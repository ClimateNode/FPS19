                var html_53a892cb63364db5f305640ecc13e387 = $(`<div id="html_53a892cb63364db5f305640ecc13e387" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Salford Metropolitan District</h1><div class="nugget-popup"><p>Salford is the focus of additional information relating to the Boxing Day flooding (the complementary document provides Salford&ndash;specific aspects of the flood event). (p1)</p></div><div class="nugget-popup"><p>On Boxing Day 2015 flooding occurred in Salford; flooding entered properties on a significant scale, prompting completion of a Flood Incident Report and emergency response activity. (p2)</p></div><div class="nugget-popup"><p>Increased river flows and overtopping of flood defences caused flooding across the city, damaging residential and commercial properties and infrastructure; extensive cleanup followed. [PAG] (p3)</p></div><div class="nugget-popup"><p>Properties in Salford were affected by the Boxing Day flood event; existing flood defences (including Littleton Road Flood Basin and EA defences) mitigated the impact to those properties. [PAG] (p4)</p></div><div class="nugget-popup"><p>River levels in the Irwell rose so high that water passed over the top of the river wall (overtopping). Flood basins (e.g. Littleton Road Flood Basin and other defences) mitigated the impact. [PAG] (p5)</p></div><div class="nugget-popup"><p>On Boxing Day exceptional rainfall caused high flows in the River Irwell; water levels rose and passed over the top of river walls, resulting in flooding in Salford. Flooding occurred both upstream and downstream of Salford (Manchester and Warrington). [PAG] (p6)</p></div><div class="nugget-popup"><p>Boxing Day 2015 floods affected multiple areas within Salford; the most significant flooding occurred in Lower Broughton where many properties and businesses flooded and other properties lost access or power. [PAG] (p7)</p></div><div class="nugget-popup"><p>Boxing Day (26 Dec 2015) floods affected multiple areas across the Salford administrative area. The most significant impacts were in Lower Broughton where residential properties, businesses and community assets were flooded; a wider programme of response and clearance was required across the city. [PAG] (p8)</p></div><div class="nugget-popup"><p>Localised overland flow affected highways and an integral (attached) garage on Mather Fold Road, Worsley. The overland flow was generated by a collapsed/blocked culvert on adjacent farmland. No internal property flooding occurred at this location; third&ndash;party works were underway to rectify the culvert. [PAG] (p9)</p></div><div class="nugget-popup"><p>Multiple river&ndash;flooding incidents affecting the town: the River Irwell flooded residential and commercial areas across Salford in several major events, inundating properties and large areas of land. [TAB,MUL] (p10)</p></div><div class="nugget-popup"><p>Parts of Salford (notably Lower Broughton and the Littleton Road area) experienced flooding on 26 December 2015: floodwaters entered the Littleton Road Flood Basin, the inlet was submerged and water overtopped footpaths; the EA and Salford City Council personnel attended and evacuation advice was issued locally. (p12)</p></div><div class="nugget-popup"><p>Fluvial flooding from the River Irwell on 26th December 2015 inundated an area bounded by the dashed&ndash;blue line shown in the map; properties within this extent flooded and at least one property had silt deposited inside (Figure 5). Not all properties inside the dashed&ndash;blue extent flooded; newer developments with finished floor levels set above the 100&ndash;year plus climate&ndash;change level remained dry. [IMG,PAG] (p18)</p></div><div class="nugget-popup"><p>Flooding at Salford Quays (including the area around the Water Sport Centre / Ontario Basin and the Helly Hansen region), with large quantities of debris deposited across the quayside and adjacent facilities. [PAG] (p20)</p></div><div class="nugget-popup"><p>Flooding was experienced at locations upstream of the Manchester Ship Canal; hydraulic modelling indicated water levels at the flooded locations were independent of canal water levels. [PAG] (p22)</p></div><div class="nugget-popup"><p>Significant river flooding affected Salford when elevated flows in the River Irwell overtopped and passed through local flood defences. Local impacts included inundation of sites within the city (for example Agecroft cemetery was flooded with part of the site below water; cleansing and headstone repairs were undertaken after waters receded). (p24)</p></div><div class="nugget-popup"><p>Extensive residential property flooding and associated service impacts. Fluvial flood waters entered and exceeded the capacity of the public sewer system causing flood water to leave sewers; highway drainage gullies also discharged flood water. Defences noted for Lower Broughton (Littleton Road flood basin) and the future Castle Irwell basin in relation to event return periods. [PAG] (p27)</p></div><div class="nugget-popup"><p>Extensive flooding of residential and commercial property across Salford; damage to the highway network and to footpaths and walkways adjacent to the River Irwell; businesses suffered significant stock losses and financial impacts. (p28)</p></div><div class="nugget-popup"><p>Widespread flooding on 26 December 2015 affected properties across the city; Peel Park (in Salford) had flood waters flow over defences causing damage and delaying renovation works. (p30)</p></div><div class="nugget-popup"><p>Existing (pre&ndash;existing) properties in Salford were flooded during the flooding incident; newly built resilient houses in Lower Broughton (within Salford) did not flood during the same incident. The construction of the Castle Irwell flood basin is intended to reduce flood risk within Salford. [PAG] (p32)</p></div><div class="nugget-popup"><p>Flooding from the River Irwell on 26 December 2015 affected properties in Salford; DCLG funding was made available to improve the flood resistance/resilience of each property that flooded during the Boxing Day event. (p33)</p></div><div class="nugget-popup"><p>Salford experienced flooding on Boxing Day affecting commercial properties (for which the council provided temporary business rate reductions) and residents; actions recommended include promoting flood warnings and advising residents of evacuation procedures. [TAB,PAG] (p39)</p></div><div class="nugget-popup"><p>Areas of Salford experienced severe fluvial (river) and pluvial (rain&ndash;related) flooding on 26 December 2015, affecting homes and businesses across the city. (p41)</p></div><div class="nugget-popup"><p>Widespread river flooding from unprecedented rainfall led to an emergency response across the city; peak river flows far exceeded previous records, volunteers and the Red Cross supported affected communities and residents were sheltered while responders provided situational awareness and outreach. (p42)</p></div><div class="nugget-popup"><p>The borough experienced a widespread flood incident on 26 December 2015: resources were pulled across the conurbation; residents expected sandbag provision; sand at depots was rapidly exhausted; limited emergency officer numbers hindered evacuation decisions; difficulties contacting businesses and vulnerable residents delayed response. (p44)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>500 homes; 198 businesses [PAG] (p3)</p></div><div class="nugget-popup quant"><p>500 residential properties; 198 businesses; a further 168 properties affected through loss of access or power [PAG] (p7)</p></div><div class="nugget-popup quant"><p>500 residential properties; 198 businesses; 168 properties [PAG] (p8)</p></div><div class="nugget-popup quant"><p>0 properties internally flooded at Mather Fold Road; AGMA internal flooding threshold of 5 properties not reached. [PAG] (p9)</p></div><div class="nugget-popup quant"><p>500 residential properties flooded; 196 businesses flooded; 168 further properties affected but not flooded; Approx 74Ha affected (2015); 5,300 properties; 243 hectares (1946); 600 properties (1954); 800 hectares (1888) [TAB,MUL] (p10)</p></div><div class="nugget-popup quant"><p>500 properties flooded; 168 properties affected through loss of access or electricity supply [PAG] (p27)</p></div><div class="nugget-popup quant"><p>500 properties; 168 properties; 198 businesses (p28)</p></div><div class="nugget-popup quant"><p>over 1,000 houses; 1,900 properties [PAG] (p32)</p></div><div class="nugget-popup quant"><p>668 homes; 196 businesses (p41)</p></div><div class="nugget-popup quant"><p>peak flows over 1 metre above previous records (p42)</p></div></div></body></div>`)[0];

                var html_b8304f3a41402849d2363e57cd2b8890 = $(`<div id="html_b8304f3a41402849d2363e57cd2b8890" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Irwell</h1><div class="nugget-popup"><p>Increased flows in the River Irwell from runoff raised water levels and led to flooding where water rose over flood defences to the south east of Frederick Road Bridge (adjacent to Heath Avenue, Lower Broughton). [PAG] (p3)</p></div><div class="nugget-popup"><p>Water levels in the River Irwell rose so high that they passed over the top of the river wall, causing flooding of adjacent areas. [PAG] (p5)</p></div><div class="nugget-popup"><p>Exceptional rainfall generated high flows in the River Irwell which contributed to the Boxing Day flooding; river water levels rose and overtopped river walls. Rock armour (rip rap) placed to protect banks is reported unlikely to have increased river levels. [PAG] (p6)</p></div><div class="nugget-popup"><p>The River Irwell overtopped river walls at multiple locations, deposited debris along the full length of the corridor once levels fell, caused collapse of a river wall and supporting footway at the Soapworks, and contributed to overtopping that entered Agecroft Cemetery and Peel Park. (p8)</p></div><div class="nugget-popup"><p>The River Irwell reached exceptionally high levels across the catchment, contributing to widespread flooding. Many river gauges on the Irwell recorded their highest ever levels and the river flow peaked very high, driving riverine flood impacts in the area. (p9)</p></div><div class="nugget-popup"><p>The River Irwell was the source of major flooding events that inundated Salford, overtopped defences in places and caused widespread property and land flooding across multiple incidents. [TAB,MUL] (p10)</p></div><div class="nugget-popup"><p>River Irwell experienced an extremely high volume leading to overtopping of river walls and extensive flooding of properties and roads in the Lower Broughton area; the high river volumes and overtopping were identified as the cause of local inundation. [PAG] (p13)</p></div><div class="nugget-popup"><p>Overtopping and extremely high river levels led to extensive flooding of properties and roads in the Lower Broughton area; overtopping was attributed to the very high volume of water in the River Irwell (observed in public video footage). Flooding had receded by 22:00 on the day of the event. (p14)</p></div><div class="nugget-popup"><p>Fluvial flooding from the River Irwell inundated the area bounded by the dashed blue lines on Boxing Day; many properties within this area were affected by floodwater while some more recent developments did not flood due to finished floor levels being set above the 1&ndash;in&ndash;100&ndash;year plus climate change level. (p19)</p></div><div class="nugget-popup"><p>The river caused fluvial flooding that affected the area bounded by the dashed blue lines on Boxing Day; rapid rises in water level around Salford Quays are attributed to the Irwell and contributed to damage (loss of pontoons) at Agecroft Rowing Club. (p20)</p></div><div class="nugget-popup"><p>The River Irwell experienced significantly increased flow and water levels due to intense rainfall across the upper catchment, causing river flooding that inundated areas of Salford. Water overtopped and passed through flood defences; the volume of water in the Irwell was identified as the primary cause of flooding in Salford. (p24)</p></div><div class="nugget-popup"><p>Extensive flooding across Salford: widespread residential and commercial property flooding, high river levels making bridges dangerous, and damage to footpaths and walkways adjacent to the River Irwell. [PAG] (p28)</p></div><div class="nugget-popup"><p>Flooding caused damage to footpaths and walkways adjacent to the River Irwell. (p29)</p></div><div class="nugget-popup"><p>High flows in the River Irwell overtopped weirs and drove water into flood storage basins, contributing to flooding of properties in Salford during the incident. (p32)</p></div><div class="nugget-popup"><p>River Irwell flooded on 26 December 2015, causing flooding along its banks in Salford and contributing to flooding of commercial and residential properties; prompted Local Authorities to review event timings and develop an 'impact time' and other response measures. [TAB] (p39)</p></div><div class="nugget-popup"><p>The River Irwell contributed to flooding during the 26 December 2015 event, causing high river levels and backflow risk to outfalls into the river and affecting local authority areas alongside the river (e.g. Lower Broughton). [PAG] (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>37 of 44 Environment Agency gauges on the Irwell recorded their highest ever level; estimated peak flow approximately 430m3/s. (p9)</p></div><div class="nugget-popup quant"><p>500 residential properties flooded; 196 businesses flooded; 168 further properties affected but not flooded; Approx 74Ha affected (2015); 5,300 properties and 243 hectares (1946); 600 properties (1954); 800 hectares (1888) [TAB,MUL] (p10)</p></div><div class="nugget-popup quant"><p>44 river gauges in the Irwell network; 37 of these recorded their highest ever level; peak flow estimated at approximately 430 m3/s; Manchester Racecourse gauge recorded a level 750 mm higher than any previous event. (p24)</p></div><div class="nugget-popup quant"><p>500 properties flooded; 168 properties affected through loss of access or electricity supply; 198 businesses reported flooding [PAG] (p28)</p></div></div></body></div>`)[0];

                var html_a39257037c3e9982a55297766868c131 = $(`<div id="html_a39257037c3e9982a55297766868c131" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Greater Manchester</h1><div class="nugget-popup"><p>The Section 19 investigation covers Greater Manchester and documents the flooding that occurred on Boxing Day. (p1)</p></div><div class="nugget-popup"><p>The Boxing Day 2015 river/main&ndash;river flooding affected multiple parts of Greater Manchester; ten LLFAs within Greater Manchester collaborated on a single investigation report into the event. (p7)</p></div><div class="nugget-popup"><p>The wider Greater Manchester area experienced a significant flood event with widespread impacts: many locations recorded record river levels, numerous properties flooded across multiple locations, and thousands of residents were issued flood warnings as the event developed rapidly. (p9)</p></div><div class="nugget-popup"><p>Extremely high volumes of water affected parts of Greater Manchester resulting in flooding of properties and roads; floodwaters were recorded stored within Littleton Road Flood Basin and the partially complete Castle Irwell flood basin in the aftermath. [MUL] (p14)</p></div><div class="nugget-popup"><p>Erosion of the Manchester Ship Canal bank adjacent to the Valero Energy oil storage facility immediately downstream of Mode Wheel locks in Salford. The site operator took precautionary measures, emptying the oil tanks closest to the canal to mitigate a potential environmental incident. (p21)</p></div><div class="nugget-popup"><p>Across Greater Manchester, over 5,700 properties were issued flood warnings during the incident. (p35)</p></div><div class="nugget-popup"><p>Experienced widespread rainfall in the 24 hours leading up to 9am on 27 December 2015 that saturated catchments and caused rivers across the conurbation to react quickly, contributing to fluvial and pluvial flooding (including impacts in Salford). (p41)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Over 2,400 properties flooded across 60 locations in Greater Manchester; over 5,700 properties were issued a direct flood warning in an 8&ndash;hour period. (p9)</p></div><div class="nugget-popup quant"><p>over 5,700 properties (p35)</p></div></div></body></div>`)[0];

                var html_ead6430c8ea035a3cef164887d802213 = $(`<div id="html_ead6430c8ea035a3cef164887d802213" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Manchester Ship Canal</h1><div class="nugget-popup"><p>High water/erosion affected the canal bank adjacent to a COMAH site; there was bank erosion and no deliberate control of MSC water levels (sluices operate automatically and were not used to hold water back). (p5)</p></div><div class="nugget-popup"><p>Referent to the Manchester Ship Canal sluice operations during the high river levels; attendance/action was taken to ensure sluices operated to manage water during the flood. (p14)</p></div><div class="nugget-popup"><p>Elevated water levels in the Manchester Ship Canal during the Boxing Day event prevented surface water drains from discharging, contributing to local carriageway flooding (e.g. Cadishead Way). [PAG] (p19)</p></div><div class="nugget-popup"><p>High water levels in the Manchester Ship Canal prevented surface water drains from discharging, which is likely to have caused carriageway flooding on Cadishead Way in Irlam. Canal&ndash;related high water also contributed to elevated water levels at Salford Quays during the event, coincident with loss of pontoons at Agecroft Rowing Club. [IMG,PAG] (p20)</p></div><div class="nugget-popup"><p>Flooding from the Manchester Ship Canal occurred, with high water levels and flows passing downstream that caused flooding in the vicinity of Irlam and Latchford locks and an area north of Lymm (Thelwall). Erosion of the canal bank occurred immediately downstream of Mode Wheel locks (Salford Quays) and on the Trafford bank of the Ship Canal adjacent to the Valero Energy oil storage facility; the site operator emptied tanks closest to the canal as a precaution against undermining. (p21)</p></div><div class="nugget-popup"><p>Bank erosion occurred on the canal during the event adjacent to the Valero Energy oil storage facility and on the Trafford bank; canal flow management and related coordination took place during the incident. Modelling noted upstream flooding at nearby locations was independent of canal levels. (p22)</p></div><div class="nugget-popup"><p>The Manchester Ship Canal was identified as a source of flood risk during the 26 December 2015 event; its management and operation prompted coordinated multi&ndash;agency meetings and actions by Peel Holdings/MSCC on Boxing Day to manage the incident and address flood risk to adjacent communities. [PAG] (p23)</p></div><div class="nugget-popup"><p>Salford City Council carried out recovery and highway works following the flooding to return the adopted highway to a condition safe for road users; also identified bridges under its responsibility for scour inspection after the event. (p36)</p></div></div></body></div>`)[0];

                var html_5ec695dde5905a2506fce13b8bf53404 = $(`<div id="html_5ec695dde5905a2506fce13b8bf53404" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lower Broughton</h1><div class="nugget-popup"><p>Floodwaters overtopped flood defences to the south&ndash;east of Frederick Road Bridge (adjacent to Heath Avenue), causing inundation of residential and commercial areas; damage to walkways, river walls and bridges and an extensive cleanup operation followed. (p3)</p></div><div class="nugget-popup"><p>River Irwell overtopped river walls (to the south east of Frederick Road Bridge), causing wide&ndash;scale fluvial flooding across a large area of Lower Broughton that affected residential properties, businesses and community assets. (p8)</p></div><div class="nugget-popup"><p>Affected by the Boxing Day 2015 river&ndash;flooding incident in the local area: residents reported flooding to Salford City Council and emergency reporting/response was mobilised; the Littleton Road flood basin received floodwaters between about 09:00&ndash;09:30 on 26 December as part of the same event. (p11)</p></div><div class="nugget-popup"><p>Extensive flooding affected a number of properties and roads in the Lower Broughton area due to very high River Irwell levels and overtopping of defences. (p13)</p></div><div class="nugget-popup"><p>Flood waters overtopped flood defences in the region of Lower Broughton; observations and photographs show overtopping and water passing through the defences, contributing to local flooding. (p24)</p></div><div class="nugget-popup"><p>Area experienced the greatest number of properties affected by the flooding on 26 December 2015; residents required assistance, cleaning and removal of bulky flood&ndash;damaged items and community response supported vulnerable people. (p30)</p></div><div class="nugget-popup"><p>Newer developments in Lower Broughton were built to resilient standards and did not flood during the flooding incident; adjacent older/existing properties did flood and remain at risk in more extreme events. [PAG] (p31)</p></div><div class="nugget-popup"><p>Existing (pre&ndash;development) properties in Lower Broughton flooded during the flooding incident; over 1,000 newly built houses of resilient construction in Lower Broughton did not flood. Existing properties remain at risk in more extreme events. (p32)</p></div><div class="nugget-popup"><p>Properties in Lower Broughton were flooded on Boxing Day; recommendations include expanding property&ndash;level flood resilience to all at&ndash;risk properties in Lower Broughton and considering additional measures prior to completion of the Castle Irwell Flood Basin. [TAB] (p39)</p></div><div class="nugget-popup"><p>Affected by the River Irwell flood; the report recommends considering additional measures for Lower Broughton prior to completion of the Castle Irwell Flood Basin and references impacts from the Boxing Day flood. (p40)</p></div><div class="nugget-popup"><p>Lower Broughton was the area mainly covered by the fluvial and pluvial flooding on 26 December 2015. (p41)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>500 homes; 198 businesses (p3)</p></div><div class="nugget-popup quant"><p>500 residential properties; 198 businesses; 168 properties (p8)</p></div><div class="nugget-popup quant"><p>over 1,000 houses [PAG] (p31)</p></div><div class="nugget-popup quant"><p>over 1,000 houses (p32)</p></div></div></body></div>`)[0];
