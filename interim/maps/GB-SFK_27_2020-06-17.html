                var html_688168fdd89d247adb4ef81809a0403c = $(`<div id="html_688168fdd89d247adb4ef81809a0403c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>St Thomas's Way, Sicklesmere</h1><div class="nugget-popup"><p>Location of the flood event investigated under Section 19 by the Lead Local Flood Authority (Suffolk County Council). (p1)</p></div><div class="nugget-popup"><p>Properties and local assets on St Thomas's Way experienced flooding: nine properties flooded internally and two properties experienced external flooding. The main private forecourt and garages were flooded. The total affected area was approximately 0.18 ha (1,800 m2). (p2)</p></div><div class="nugget-popup"><p>Surface water drainage capacity was exceeded by an intense storm on 17th June 2020. High&ndash;velocity overland runoff flowed down the 1:20 incline and accumulated at the foot of the slope where two solid blocks of residential properties acted as a barrier, causing ponding against the properties until water spilled over door thresholds. The on&ndash;site highway drainage (gullies, laterals, elephant chambers and soakaway) was found completely blocked and poorly maintained, contributing to the flood impact. (p4)</p></div><div class="nugget-popup"><p>Highway drainage is inadequate or blocked, allowing upslope runoff to travel down the slope and contribute to surface water flooding risk to the residential blocks; recommended actions include investigating and upsizing highway drainage, adding larger/more gully lids and sump pits, installing double lids toward the bottom of the slope, and providing drains for footways currently without them. (p5)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>9 properties internally flooded; 2 properties externally flooded; 0.18Ha (1800m2) affected (p2)</p></div><div class="nugget-popup quant"><p>two property blocks; 60 m wide (p4)</p></div></div></body></div>`)[0];
