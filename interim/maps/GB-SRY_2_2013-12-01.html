                var html_5a02f94c2b5c1f983bc6d062950a5584 = $(`<div id="html_5a02f94c2b5c1f983bc6d062950a5584" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Penton Hook</h1><div class="nugget-popup"><p>Historic river levels downstream of Penton Hook show that the 2013/14 event was one of the recorded flood years (2014), with river levels during the winter 2013/14 event significantly greater than most years between 2003 and 2013. (p12)</p></div><div class="nugget-popup"><p>River levels downstream of Penton Hook were significantly elevated during the 2013/14 event; 2014 is recorded among the notable historic flood years (e.g., 1894, 1947, 2003, 2014) shown in the historic levels series. [PAG,IMG] (p13)</p></div><div class="nugget-popup"><p>Penton Hook pumping station failed during the winter 2013/14 floods. Valves in the chambers were replaced with more robust units, the pumping station building was waterproofed and flood&ndash;resilient doors installed to reduce future submergence damage. (p18)</p></div><div class="nugget-popup"><p>Following the winter 2013/14 flooding, the Environment Agency carried out maintenance at Penton Hook Weir: weir gate maintenance, asbestos surveys at the weir site, six&ndash;yearly electrical inspections and yearly mechanical and electrical maintenance. (p27)</p></div><div class="nugget-popup"><p>Penton Hook formed the downstream extent of the flood&ndash;warning area for properties closest to the River Thames; properties in this reach were included in warnings due to river flooding. [TAB,MUL] (p30)</p></div><div class="nugget-popup"><p>Thames Water carried out works on the Penton Hook pumping station to increase its resilience to future flooding following the event. (p35)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2014 identified as one of the peak recorded years; river levels in 2013/14 were significantly greater than levels observed between 2003 and 2013; highest levels on the Lower Thames for more than 65 years. [PAG,IMG] (p13)</p></div><div class="nugget-popup quant"><p>1 pumping station failed (p18)</p></div><div class="nugget-popup quant"><p>382 properties warned (06/01/2014); 319 properties warned (09/02/2014) [TAB,MUL] (p30)</p></div></div></body></div>`)[0];

                var html_ece488bff60abcedd3d2bd43ee52a461 = $(`<div id="html_ece488bff60abcedd3d2bd43ee52a461" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Thames</h1><div class="nugget-popup"><p>The Environment Agency cleared blockages from the River Thames Navigation in Surrey that were brought down during the winter 2013/14 floods and carried out maintenance and vegetation/obstruction removal along the Thames to restore navigation and conveyance. (p7)</p></div><div class="nugget-popup"><p>Following intense late&ndash;December rainfall the Thames reached its highest point on the reach from Dachet to Teddington on 11 January 2014; further rainfall in late January and February (on saturated ground) produced even larger flows, producing the highest levels on the Lower Thames for more than 65 years and causing rivers to exceed channel capacity in locations. [PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Levels on the Lower Thames rose to their highest for more than 65 years during the event; February rainfall on saturated ground produced the largest river flows, producing exceptional high levels on this reach. [MUL] (p12)</p></div><div class="nugget-popup"><p>River Thames flooding caused widespread flooding across Runnymede, with high river levels backing up many tributaries; produced exceptionally large discharge volumes and prolonged elevated flows that drove the 2013/14 flood impacts across the area. [PAG,IMG,MUL] (p13)</p></div><div class="nugget-popup"><p>Impacted by the winter 2013/14 river flooding: floodwaters deposited large amounts of debris on weirs and created shoals in the channel requiring post&ndash;flood survey and removal; sunken boats were recovered (including one upstream of Staines Bridge); maintenance and repairs were carried out on Penton Hook Weir gates and other weir/lock infrastructure; towpath tree works and other asset inspections/surveys were undertaken as flood recovery actions. [PAG] (p16)</p></div><div class="nugget-popup"><p>Flooding of the Thames washed debris onto weirs and left shoals and sunken boats that required removal; prompted surveys and maintenance by the EA. [PAG,MUL] (p17)</p></div><div class="nugget-popup"><p>Flooding from the River Thames near its confluence with the River Wey in January 2014 was reported to have inundated properties in the Hamm Court area (report of property flooding although this was not confirmed by Environment Agency officers). (p21)</p></div><div class="nugget-popup"><p>Flood Warning issued for the River Thames at Hamm Court as part of the winter 2013/14 flood incident. [TAB] (p22)</p></div><div class="nugget-popup"><p>The River Thames rose to high levels by January and reached peak levels in February 2014 (highest water levels in winter 2013/14, return period ~15&ndash;20 years). These high river levels contributed to river flooding in the Chertsey sub area, associated road closures, internal property flooding and, together with raised groundwater, led to infiltration and surcharging of the foul sewer network causing foul water flooding across the investigation area. (p24)</p></div><div class="nugget-popup"><p>The Thames rose to high levels during prolonged rainfall, issued flood warnings and severe flood warnings were issued as levels worsened; the river contributed to backing up the Chertsey Bourne and to property flooding in the Chertsey area. [MUL] (p25)</p></div><div class="nugget-popup"><p>The River Thames at Chertsey triggered flood alerts and warnings during winter 2013/14; the EA issued a Severe Flood Warning and multiple Flood Warnings for the River Thames at Chertsey to warn people of rising river levels. [TAB,MUL] (p26)</p></div><div class="nugget-popup"><p>The River Thames, forming the eastern boundary of much of the sub area, was a major watercourse associated with fluvial flooding in winter 2013/14; its river flooding contributed to property flooding, road closures and, together with raised groundwater, to infiltration into the foul sewer network causing surcharging and foul sewage flooding. (p28)</p></div><div class="nugget-popup"><p>Flooding from the River Thames inundated low&ndash;lying reaches in Runnymede. Overnight on 10&ndash;11 February 2014 the Thames started to flood from Chertsey Lane into the Meadlake Ditch catchment, causing direct flooding of the Egham Hythe and Pooley Green areas, back&ndash;up of the Meadlake Ditch and flooding of roads to the west of Chertsey Lane. Severe Flood Warnings were issued and a Major Incident was declared with military assistance requested. [MUL] (p29)</p></div><div class="nugget-popup"><p>Fluvial flooding from the River Thames caused widespread flooding across the borough, triggered multiple flood warnings for adjacent communities, and produced large blockages in the navigation that required removal; the EA cleared 22 large trees and other large blockages from the River Thames Navigation in Surrey and Bell Weir Lock was seriously affected. [TAB] (p30)</p></div><div class="nugget-popup"><p>Identified as the main source of fluvial flooding in the borough; contributed to major flooding across Runnymede affecting all three sub&ndash;areas and to internal property flooding incidents during the event. (p33)</p></div><div class="nugget-popup"><p>The Environment Agency cleared large blockages from the River Thames Navigation in Surrey as part of the response to the winter 2013/14 flooding. (p34)</p></div><div class="nugget-popup"><p>Large blockages were cleared from the River Thames Navigation in Surrey as part of the flood response to reduce flood impacts in the area. [PAG] (p35)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2,014 million tonnes of water in 66 days (record volume over two months) [IMG,PAG,MUL] (p12)</p></div><div class="nugget-popup quant"><p>2,014 million tonnes of water in 66 days; highest volume over two months at Kingston since records began in 1885; peak&ndash;level return period estimated at 1 in 15&ndash;20 annual chance; flood volume return period &gt;100 years; highest levels on the Lower Thames for more than 65 years. [PAG,IMG,MUL] (p13)</p></div><div class="nugget-popup quant"><p>8 properties (p21)</p></div><div class="nugget-popup quant"><p>90 properties flooded (combined impact from the River Thames and the Chertsey Bourne) [MUL] (p25)</p></div><div class="nugget-popup quant"><p>4,000 properties [MUL] (p29)</p></div><div class="nugget-popup quant"><p>22 large trees and other large blockages cleared; 5815 properties warned (River Thames at Staines and Egham on 09/02/2014); 7152 properties warned (08/01/2014); 7257 properties warned (07/02/2014); ~4,000 properties impacted borough&ndash;wide [TAB] (p30)</p></div><div class="nugget-popup quant"><p>1170 incidents of internal property flooding (p33)</p></div></div></body></div>`)[0];

                var html_61b9706e70ea7f1bf86736bb930ccfff = $(`<div id="html_61b9706e70ea7f1bf86736bb930ccfff" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Norlands Lane, Thorpe</h1><div class="nugget-popup"><p>The Norlands Lane culvert (which conveyed the Meadlake Ditch) was subject to an asset condition inspection following the flooding; highways drainage assets in the area were inspected because of the incident. (p32)</p></div></div></body></div>`)[0];

                var html_a7773b0c93d9e0f1140d40f9a719170d = $(`<div id="html_a7773b0c93d9e0f1140d40f9a719170d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Runnymede</h1><div class="nugget-popup"><p>Internal property flooding at multiple addresses and road closures reported in the borough. [TAB] (p2)</p></div><div class="nugget-popup"><p>Experienced widespread fluvial flooding during winter 2013/14, resulting in internal property flooding across the borough. (p7)</p></div><div class="nugget-popup"><p>Widespread internal property flooding across the borough; investigations undertaken for sites within three sub areas (Egham & Thorpe, Chertsey, Addlestone). [IMG] (p10)</p></div><div class="nugget-popup"><p>Flooding from the River Thames caused widespread flooding across Runnymede, with Thames high levels backing up into many tributaries and causing widespread issues in the borough during the winter 2013/14 event. [IMG] (p12)</p></div><div class="nugget-popup"><p>Runnymede was particularly affected by the winter 2013/14 river flooding. Local river/weir maintenance, debris removal and removal of sunken boats were carried out in locations within the borough following the floods. (p16)</p></div><div class="nugget-popup"><p>The borough experienced flooding in winter 2013/14 that led to debris being washed onto Thames weirs (removed by the EA), sunken boats being removed from the River Thames (including upstream of Staines Bridge), shoals being left in the riverbed and subsequently removed, and prompted reviews and updates to flood warning thresholds and incident procedures. (p17)</p></div><div class="nugget-popup"><p>Was directly affected by the Winter 2013/14 flooding: pumping stations (Hamm Court and Penton Hook) failed during the floods and were subsequently upgraded (valves replaced, buildings waterproofed, flood&ndash;resilient doors installed); key drainage assets in Runnymede (e.g. Norlands Lane culvert of the Meadlake Ditch) were identified and added to the flood asset register. [PAG] (p18)</p></div><div class="nugget-popup"><p>Flooding during Winter 2013/14 damaged roads and drainage. Surrey County Council completed additional gully and drainage system cleaning on all flood&ndash;affected roads in Runnymede (completed on 28 March 2014); grab lorry and gully tanker were provided to assist cleaning operations; roads were cleansed and re&ndash;opened; trees, debris and ditching works were carried out to restore drainage function. [MUL] (p19)</p></div><div class="nugget-popup"><p>Runnymede was among the areas visited by EA flood ambassadors and flood data recorders during the winter 2013/14 flooding. Properties in the area were recorded as having been internally flooded from fluvial sources and from surface/groundwater during the period of prolonged wet weather. (p22)</p></div><div class="nugget-popup"><p>The borough experienced river flooding, raised groundwater tables and surface water/highway drainage flooding. Raised groundwater and river flooding led to infiltration of the public foul sewer system causing surcharging of foul sewers and foul water flooding across the whole investigation area; restricted use of sanitary appliances and prolonged sewer impacts in parts of the borough (including severe effects on properties in Eastworth Road). (p25)</p></div><div class="nugget-popup"><p>Runnymede was visited by EA flood ambassadors and flood data recorders in January&ndash;February 2014; data recorders verified river levels and recorded property flooding. The EA carried out obstruction removal and vegetation management in locations within the area (example: Rutherwyck Road Ditch, Chertsey) following the 2013/14 floods. (p26)</p></div><div class="nugget-popup"><p>Widespread flooding across the borough caused primarily by the River Thames (fluvial) with some areas flooded via groundwater/subterranean connectivity; properties throughout the borough were impacted. (p29)</p></div><div class="nugget-popup"><p>The borough was heavily affected in winter 2013/14: most flooding was fluvial with some areas experiencing groundwater flooding due to connectivity through gravels; across the borough in the region of 4,000 properties were impacted by the floods. [TAB] (p30)</p></div><div class="nugget-popup"><p>Widespread flooding across the borough during winter 2013/14 caused by exceptional rainfall leading to major fluvial, sewer, ordinary watercourse and groundwater flooding; the River Thames was the main source of fluvial flooding affecting all three sub&ndash;areas of the borough. Lack of maintenance of some riparian ditches contributed to impacts. (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 1170 incidents of internal property flooding (p7)</p></div><div class="nugget-popup quant"><p>115 sites; approximately 1170 incidents of internal property flooding [IMG] (p10)</p></div><div class="nugget-popup quant"><p>90 properties flooded (p25)</p></div><div class="nugget-popup quant"><p>4,000 properties (p29)</p></div><div class="nugget-popup quant"><p>in the region of 4,000 properties [TAB] (p30)</p></div><div class="nugget-popup quant"><p>approximately 1170 incidents of internal property flooding (p33)</p></div></div></body></div>`)[0];

                var html_3f6d006abe3de92854aeb53d532f095c = $(`<div id="html_3f6d006abe3de92854aeb53d532f095c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Surrey</h1><div class="nugget-popup"><p>County experienced fluvial flooding during winter 2013/14; Surrey Fire and Rescue Service pumped water away from properties and county staff assisted residents, deployed signs and sandbags and supported on&ndash;the&ndash;ground response in partnership with Runnymede Borough Council and the Army. (p7)</p></div><div class="nugget-popup"><p>Widespread flooding across the borough during the winter 2013/14 event, including internal property flooding and damage to highways and drainage assets requiring inspection, repairs or programmes of works. (p9)</p></div><div class="nugget-popup"><p>Widespread flooding across the county during winter 2013/14; the event prompted multiple local flood investigation reports including the Runnymede S19 report. [IMG,PAG] (p10)</p></div><div class="nugget-popup"><p>Wide&ndash;spread flooding across the county during winter 2013/14 from multiple sources: elevated groundwater levels caused groundwater flooding in parts of the county, and additional runoff caused rivers to exceed channel capacity leading to river flooding. [TAB] (p11)</p></div><div class="nugget-popup"><p>Widespread river flooding affected the county during winter 2013/14. The event required a coordinated strategic response (EA Area Incident Room opened, maintenance and clearance works carried out) and caused county&ndash;level flood operations, debris clearance and pollution incident responses. [PAG] (p16)</p></div><div class="nugget-popup"><p>Local authority functions and response undertaken across the county: published LFRMS (Dec 2014) and produced Section 19 reports for Winter 2013/14; identified key drainage assets in Runnymede (including Norlands Lane culvert of the Meadlake Ditch) and added them to the flood asset register; inspected flood&ndash;affected roads and commissioned defect repairs; assessed damaged carriageways for inclusion in Project 400 (a targeted resurfacing/repair programme for roads damaged by Winter 2013/14 floods); cleansed and re&ndash;opened roads; provided and recycled sandbags; cleared trees and debris and carried out ditching works; operated a call centre for residents and administered the Repair and Renew Grant to support residents and businesses flooded. [PAG] (p18)</p></div><div class="nugget-popup"><p>Prolonged heavy rainfall in winter 2013/14 led to raised river levels across Surrey; between 23 December 2013 and 23 February 2014 a number of properties across the county were reported internally flooded from fluvial sources and additional properties were recorded as internally flooded from surface water or groundwater. (p22)</p></div><div class="nugget-popup"><p>Prolonged heavy rainfall in autumn and winter 2013/14 led to raised river levels across Surrey (including the Chertsey Bourne and River Thames), causing flooding across the county: roads close to the Chertsey Bourne were flooded and groundwater flooding occurred in Chertsey and Thorpe. (p25)</p></div><div class="nugget-popup"><p>Raised river levels were experienced across Surrey during autumn/winter 2013 leading to widespread flood alerts and warnings; parts of the county experienced significant fluvial flooding during the winter 2013/14 event. (p29)</p></div><div class="nugget-popup"><p>Major flooding across Surrey during winter 2013/14 following exceptional and unprecedented rainfall, producing fluvial, sewer, ordinary watercourse and groundwater flooding; the River Thames was the principal source of fluvial flooding in the county. (p33)</p></div><div class="nugget-popup"><p>The winter 2013/14 floods affected areas across Surrey; lack of maintenance of some riparian&ndash;owned ditches and watercourses contributed to the impacts and historic flood data from the event was collated to prioritise future drainage maintenance and defence schemes. [PAG] (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>115 sites; approximately 1170 incidents of internal property flooding (p9)</p></div><div class="nugget-popup quant"><p>46 days (EA Area Incident Room operation); 860 blockages cleared; 1087 pollution incidents reported [PAG] (p16)</p></div></div></body></div>`)[0];

ass="nugget-popup"><p>Chertsey was affected by the winter 2013/14 river flooding response: the EA installed an AquaDam on Bridge Road (13/02/2014) and used pumps, a sandbag wall was erected at Chaseside Gardens by EA partners and the Armed Forces, and the EA carried out channel/ditch works (Rutherwyck Road Ditch) and engaged with recovery events and Flood Assistance Centres. [TAB,PAG,MUL] (p26)</p></div><div class="nugget-popup"><p>Chertsey was visited by EA flood ambassadors and flood data recorders during the winter 2013/14 floods; local watercourse and culvert issues were addressed by the EA as part of post&ndash;flood clearing works (e.g. works around nearby culverts and ditches). (p30)</p></div><div class="nugget-popup"><p>An AquaDam temporary flood defence was installed in Chertsey during the winter 2013/14 flood event. (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>90 properties flooded [MUL] (p25)</p></div><div class="nugget-popup quant"><p>approximately 155 properties protected (AquaDam); 25 properties protected (sandbag wall) [TAB,PAG,MUL] (p26)</p></div></div></body></div>`)[0];
