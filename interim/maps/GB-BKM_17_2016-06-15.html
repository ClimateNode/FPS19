                var html_b8df98a74154fccb40bd927ad05b5af3 = $(`<div id="html_b8df98a74154fccb40bd927ad05b5af3" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Old Amersham</h1><div class="nugget-popup"><p>High&ndash;intensity, localised rainfall led to rapid surface&ndash;water runoff on urban surfaces, resulting in flooding of homes and businesses; the event had very little warning and was of short duration during business hours. (p4)</p></div><div class="nugget-popup"><p>Internal flooding occurred such that the incident met the council&#8217;s Section 19 thresholds: multiple residential properties (including basements) were internally flooded; at least one property experienced internal flooding for one week or longer; business premises were internally flooded; one or more items of critical infrastructure were flooded. (p5)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>9 residential properties; 20 commercial properties (internally flooded) (Old Amersham and Amersham) (p4)</p></div><div class="nugget-popup quant"><p>five or more residential properties; 1km2; one property for one week or longer; two or more business premises; one or more items of critical infrastructure (p5)</p></div></div></body></div>`)[0];
