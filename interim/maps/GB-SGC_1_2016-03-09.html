                var html_8a58fe510377b1182abf8e17b89b6a5a = $(`<div id="html_8a58fe510377b1182abf8e17b89b6a5a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Oldbury Nate Rhine</h1><div class="nugget-popup"><p>Peak water levels were recorded in the Naite rhine during the 9th March 2016 event; these high levels may have been a contributing factor to flooding of nearby properties (for example Anchor Inn and Christmas Cottage). The report also flagged capacity concerns in the Upper Oldbury Naite/Rockhampton rhine area and recommended a hydraulic&ndash;model review and potential longer&ndash;term alleviation measures. [PAG] (p11)</p></div><div class="nugget-popup"><p>During the 9th March 2016 event the Rhine experienced tide&ndash;locking and high fluvial flows. Closure of the tidal flaps during the rising tide meant fluvial water could not escape for a period (~just under 3 hours), requiring storage within the Rhine and adjacent low&ndash;lying ground and raising water levels to the observed peak (~6.1mAOD at Church Road). This raised peak levels contributed to flooding of adjacent low&ndash;lying areas and properties. [PAG,IMG] (p13)</p></div><div class="nugget-popup"><p>Fluvial flows in the upper Oldbury Naite rhine transferred water into the low&ndash;lying upstream moor storage during the March 2016 flood, influencing downstream Rhine network levels and contributing to elevated flood levels in Oldbury&ndash;on&ndash;Severn. The availability of upstream moor storage reduced peak flows from the Oldbury Naite. (p15)</p></div><div class="nugget-popup"><p>The Oldbury/Naite rhine acted as a primary channel for floodwater during the March 2016 event; its capacity and connections to surrounding fields influenced peak water levels and routing of flows away from the moors. (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Peak level ~6.1mAOD; ~110,000m3 of water required to be stored during the main tide&ndash;locking period; available volume between 4.5 and 6.1mAOD calculated at ~60,000m3; alternative storage estimate ~80,000m3 if tide timing differed. [PAG,IMG] (p13)</p></div></div></body></div>`)[0];

                var html_4c7752764e78febe2d735296387463e4 = $(`<div id="html_4c7752764e78febe2d735296387463e4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Oldbury-On-Severn</h1><div class="nugget-popup"><p>Local flooding occurred in Oldbury&ndash;on&ndash;Severn; the report specifically investigates the flood incident affecting the village on 9 March 2016 and examines tidal influence (tide locking) using tide gauge data from Avonmouth and Sharpness to understand sources of the local flooding. [PAG] (p2)</p></div><div class="nugget-popup"><p>Oldbury&ndash;on&ndash;Severn was impacted by flood flows routed through the Oldbury Naite rhine during the event on 9 March 2016; assessment indicates these flows reached the village and produced the reported flooding. [IMG] (p5)</p></div><div class="nugget-popup"><p>The centre of Oldbury&ndash;on&ndash;Severn experienced elevated water levels on 9 March 2016 when high river flows coincided with a high tide. Surveyed high water and photographic evidence show peak levels in the village, with peak levels recorded below the crest of formal defences. [PAG] (p9)</p></div><div class="nugget-popup"><p>Oldbury&ndash;on&ndash;Severn experienced inundation during the 9 March 2016 event. Parish Council survey points in the village recorded high water levels (around 6.1&ndash;6.4 m) that were below the approximate crest of formal defences (~6.5 mAOD). The survey and photographic evidence document localized flooding of roads and properties within the village. [IMG,PAG] (p10)</p></div><div class="nugget-popup"><p>During the 9th March 2016 event there were instances of property and road flooding in Oldbury&ndash;on&ndash;Severn caused by high rainfall and overland flow routes. Specific properties (the Anchor Inn and Christmas Cottage on Church Road) were flooded; blocked drainage in the Anchor Inn garden was identified as a main cause, with high rhine levels potentially a contributing factor. [PAG] (p11)</p></div><div class="nugget-popup"><p>Property and road flooding occurred during the 9 March 2016 event. Properties at the Anchor Inn and Christmas Cottage, immediately south of the main watercourse on Church Road, experienced flooding driven mainly by overland runoff and a blocked drainage feature in the Anchor Inn garden (thresholds were above peak rhine levels so runoff rather than direct rhine overtopping was the primary cause). Runoff down Church Hill and Westmarsh Lane exacerbated flooding of this and adjacent areas; highway drainage condition and capacity contributed to impacts. [PAG] (p12)</p></div><div class="nugget-popup"><p>The village area is below the local Highest Astronomical Tide (~8.5mAOD) and experienced elevated water levels during the March 2016 flood, with fluvial&ndash;tidal interaction raising levels in the Rhine network and contributing to flooding in Oldbury&ndash;on&ndash;Severn. Upstream moor storage reduced peak levels. [PAG] (p15)</p></div><div class="nugget-popup"><p>Significant parts of Oldbury&ndash;on&ndash;Severn were vulnerable to elevated water levels when fluvial flows combined with spring tides. The Rhine network experienced raised water levels during the March 2016 event; Chapel Road reached around 6.0mAOD. Existing tidal flaps normally convey flows at low/intermediate tides but offer limited benefit when higher fluvial flows coincide with spring tides. Report notes pumping would need to move several cubic metres per second to materially reduce levels. [IMG,PAG] (p16)</p></div><div class="nugget-popup"><p>During the 9 March 2016 event floodwater produced raised water levels through Oldbury&ndash;on&ndash;Severn (around 6.0 mAOD). Peak flows during the event constrained levels in the village and determined the extent/duration of flooding; modelling of upstream storage and field attenuation was identified as relevant to reducing peak levels at Oldbury. (p17)</p></div><div class="nugget-popup"><p>Oldbury&ndash;on&ndash;Severn experienced elevated flood levels during the event; recommendations refer to flood wall overtopping, flood water passing onto roads, and options to reduce flood levels within the village (including using other rhine systems and increasing tidal gate capacity when high fluvial flows combine with spring tides). (p18)</p></div></div></body></div>`)[0];
