                var html_7b5fdbdcd71a36f93d02a438350fbd95 = $(`<div id="html_7b5fdbdcd71a36f93d02a438350fbd95" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Southwick Brook</h1><div class="nugget-popup"><p>Southwick Brook exceeded its capacity upstream of a floodwall, contributing to overflow and the subsequent surface water reaching properties. (p7)</p></div><div class="nugget-popup"><p>Brook capacity was exceeded and the channel overtopped about 100m upstream of Main Street bridge; water levels deepened upstream of the bridge and high downstream levels contributed to overland flows that combined with other surface water to flood properties on Main Street. (p15)</p></div><div class="nugget-popup"><p>Brook overtopped before the start of the concrete flood wall and excess water flowed over local ground to low points around properties. Outfall pipes were covered by high water, restricting discharge and exacerbating surface water ponding and flows onto Main Street. Pipes beneath Main Street and at the ditch northwest of Main Street Bridge and at Millennium Cottage were exceeded, contributing to surface water flowing onto Main Street. (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>11 properties (p15)</p></div><div class="nugget-popup quant"><p>depth of water in Main Street exceeded 1 metre in places; external property areas ~300 mm; internal depths between 20 mm and 150 mm (p18)</p></div></div></body></div>`)[0];

                var html_7ee1339b982faa33d2c6263972c189fe = $(`<div id="html_7ee1339b982faa33d2c6263972c189fe" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Main Street, Southwick</h1><div class="nugget-popup"><p>Internal flooding of buildings on Main Street when excess surface water flowed over ground into low points around properties; drainage systems and watercourses could not convey the rainfall leading to water entering properties. (p7)</p></div><div class="nugget-popup"><p>Internal flooding of buildings on Main Street: floodwater crossed building thresholds and entered premises in the immediate street area. (p9)</p></div><div class="nugget-popup"><p>Flooding from Southwick Brook caused internal flooding to properties on Main Street. [TAB] (p11)</p></div><div class="nugget-popup"><p>Surface water from a blocked/exceeded ditch flowed onto Main Street and east over the bridge; combined with brook overbanking this produced deep water on the street that entered doorways and airbricks, causing internal flooding of residential properties. [PAG] (p15)</p></div><div class="nugget-popup"><p>Surface water from the ditch/headwall northwest of Main Street bridge and from an exceeded piped minor watercourse, combined with brook flows and brook overtopping upstream of the bridge, led to deep flows along Main Street. Water flowed east over the bridge and into doorways and airbricks of properties on the north side of the street. Highway drainage was overwhelmed and outfall pipes were submerged, restricting discharge. [PAG] (p16)</p></div><div class="nugget-popup"><p>Surface water from an exceeded ditch/pipe and overtopping from the brook flowed onto and along Main Street (east and north). Drainage was overwhelmed; water entered doorways and airbricks and caused internal flooding of properties along the street. [PAG] (p17)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than five buildings (p7)</p></div><div class="nugget-popup quant"><p>more than five buildings (p9)</p></div><div class="nugget-popup quant"><p>11 properties [TAB] (p11)</p></div><div class="nugget-popup quant"><p>11 properties [PAG] (p15)</p></div><div class="nugget-popup quant"><p>Depth in Main Street exceeded one metre in places; external areas around 300 mm; internal depths between 20 mm and 150 mm; 11 properties flooded [PAG] (p16)</p></div><div class="nugget-popup quant"><p>11 properties flooded; depth in Main Street exceeded one metre in places; external areas ~300mm; internal depths 20mm to 150mm. [PAG] (p17)</p></div></div></body></div>`)[0];

                var html_e4c64aff84330a479e472bc6262bec2c = $(`<div id="html_e4c64aff84330a479e472bc6262bec2c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Southwick</h1><div class="nugget-popup"><p>Main Street in Southwick was the subject of a flood investigation (report title indicates a flooding incident occurred there and was investigated by the Lead Local Flood Authority). (p3)</p></div><div class="nugget-popup"><p>Internal flooding of more than five buildings in close proximity during the single flood event; excess surface water followed local ground levels to low points in and around properties. (p7)</p></div><div class="nugget-popup"><p>Concentrated internal flooding in the Main Street area of Southwick, with floodwater entering multiple nearby properties. [PAG] (p9)</p></div><div class="nugget-popup"><p>A small area of Southwick (including one property) was included within a Flood Alert for the minor tributaries of the Nene. The Flood Alert was issued on 23 December 2020 and there was no local Flood Warning coverage or telemetry in the area. (p10)</p></div><div class="nugget-popup"><p>Southwick Brook overtopped approximately 100 m upstream of Main Street bridge and, together with surface water from a blocked/exceeded ditch northwest of the bridge and an exceeded piped minor watercourse from Millennium Cottage, flowed onto Main Street and into properties. Water followed ground levels through rear gardens back to the brook. Streets, gardens and properties were inundated; one property reported water entering from both Main Street (front) and the brook (rear). [PAG] (p16)</p></div><div class="nugget-popup"><p>Southwick Brook overtopped and conduits (Main Street bridge and buried pipes) were exceeded, producing overland flows into Main Street and around properties; floodwater followed local ground levels to low points near properties. (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than five buildings (p7)</p></div><div class="nugget-popup quant"><p>more than five buildings [PAG] (p9)</p></div><div class="nugget-popup quant"><p>1 property (p10)</p></div><div class="nugget-popup quant"><p>11 properties; depth in Main Street exceeded one metre in places; external areas ~300 mm; internal depths between 20 mm and 150 mm [PAG] (p16)</p></div><div class="nugget-popup quant"><p>depth of water in Main Street exceeded one metre; external areas of affected properties ~300mm; internal depths between 20mm and 150mm (p18)</p></div></div></body></div>`)[0];
