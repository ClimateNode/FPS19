                var html_266119b09ab57f005eec54ff16770def = $(`<div id="html_266119b09ab57f005eec54ff16770def" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Shobnall Fields</h1><div class="nugget-popup"><p>Floodwater spilled onto Shobnall Fields after Horninglow Channel exceeded capacity and backed up due to elevated River Trent levels during the February 2020 (Storm Dennis) event. Poor maintenance of Horninglow Channel (significant vegetation and debris) is cited as likely having reduced channel capacity and exacerbated the flooding. (p33)</p></div></div></body></div>`)[0];

                var html_6995aa7698620339e01e501d71317158 = $(`<div id="html_6995aa7698620339e01e501d71317158" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Horninglow Channel</h1><div class="nugget-popup"><p>Marked on the map as an ordinary watercourse (with a culverted section) near the flood location; RoFSW mapping shows elevated surface&ndash;water flood zones around the channel. The proximity of the channel to the marked flood location corresponds with reports that multiple properties at Price Court experienced internal flooding and external flooding of gardens, driveways and adjacent sports fields in the early hours of 16th February 2020. [IMG] (p22)</p></div><div class="nugget-popup"><p>Capacity of the channel was exceeded and it overflowed; water from the channel flowed across the playing fields toward Price Court and contributed to inundation of the leisure fields and nearby properties. [PAG] (p23)</p></div><div class="nugget-popup"><p>Capacity of the Horninglow Channel was exceeded; water flowed across the playing fields toward the properties on Price Court, contributing to flooding of the leisure fields and inundation of nearby residential properties. [IMG] (p24)</p></div><div class="nugget-popup"><p>Experienced high flows and elevated water levels during Storm Dennis on 16th February 2020; received discharge from Shobnall Brook and contributed to localised flooding around the south&ndash;eastern corner of Shobnall playing field and the Price Court vicinity. (p27)</p></div><div class="nugget-popup"><p>Channel capacity was exceeded during the February 2020 event and flood water flowed westward across Shobnall playing fields towards Price Court, contributing to ponding and extensive flooding of the fields north of Price Court. [IMG] (p29)</p></div><div class="nugget-popup"><p>The channel exceeded capacity and backed up, spilling onto the adjacent playing fields; water from the open section of the channel flowed across the playing fields toward Price Court and contributed to the observed flooding of properties and sports fields. (p30)</p></div><div class="nugget-popup"><p>The Horninglow Channel contributed river flooding during the event; the channel was found to contain significant vegetation and debris which may have obstructed flow and contributed to flooding in nearby properties including Price Court. (p32)</p></div><div class="nugget-popup"><p>Horninglow Channel had reduced capacity due to vegetation and debris; if the downstream flap valve closed because of high River Trent levels, the channel would have been unable to discharge, leading to backing&ndash;up, capacity exceedance and spilling onto Shobnall Fields and flooding connected drainage (including the private network serving Price Court). (p33)</p></div><div class="nugget-popup"><p>Identified by the investigation as a watercourse requiring improvement and reclassification to Main River to ensure future maintenance and to reduce its contribution to the flooding on 16th February 2020; subject of planned works and responsibility transfer discussions between STW and the EA. [TAB] (p34)</p></div><div class="nugget-popup"><p>Water levels within Horninglow Channel were elevated following the event (flap valve at its downstream extent closed due to high River Trent levels), causing the drainage network to back up and contributing to flooding of the adjacent highway, gardens, driveways and residential properties at Price Court. (p37)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>6 residential properties (p37)</p></div></div></body></div>`)[0];

                var html_f882c6b012a5971e9b0b3a9c0ed560e3 = $(`<div id="html_f882c6b012a5971e9b0b3a9c0ed560e3" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Trent</h1><div class="nugget-popup"><p>High River Trent levels influenced the Horninglow Channel by causing the downstream flap valve to close, preventing discharge and allowing the channel to back up and spill onto the floodplain, contributing to flooding at Price Court and adjacent fields. [PAG,MUL] (p30)</p></div><div class="nugget-popup"><p>River Trent levels were elevated during the February 2020 event (peak recorded at the Drakelow Park gauge), which prevented discharge from the Horninglow Channel and caused the channel to back up. [IMG,PAG] (p31)</p></div><div class="nugget-popup"><p>The River Trent recorded exceptionally high levels in the days following Storm Dennis; elevated Trent levels likely caused the downstream flap valve at the Horninglow Channel to close, preventing discharge, causing back&ndash;up and exacerbating flooding upstream. (p33)</p></div><div class="nugget-popup"><p>High water levels in the River Trent forced the downstream flap valve to close, which elevated levels in connected channels (including Horninglow Channel) and contributed to the backing&ndash;up of drainage that led to flooding at Price Court. (p37)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Peak flow 384 m3/s; maximum level 3.8 m recorded at the Drakelow Park gauge on 17th February 2020. [PAG,MUL] (p30)</p></div><div class="nugget-popup quant"><p>384 m3/s; 3.8 m stage; second highest recorded flow since 1959 [IMG,PAG] (p31)</p></div><div class="nugget-popup quant"><p>6 residential properties (p37)</p></div></div></body></div>`)[0];

                var html_8ead93acccb208d661ac818808830d70 = $(`<div id="html_8ead93acccb208d661ac818808830d70" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Price Court, Shobnall</h1><div class="nugget-popup"><p>Internal property flooding was reported at Price Court following the 2020 storm events; the report focuses on summarising the extent of flooding reported there and determining the most likely cause. (p5)</p></div><div class="nugget-popup"><p>Flooding was reported at Price Court during Storm Dennis and the site was the subject of a Staffordshire County Council (Section 19) investigation into the extent and likely cause of the flooding. [PAG] (p6)</p></div><div class="nugget-popup"><p>Localised flooding occurred at Price Court on 16th February 2020 as part of the Storm Dennis event; residential properties and the immediate street area were inundated and residents reported flood impacts. (p15)</p></div><div class="nugget-popup"><p>Residential properties in the small housing&ndash;development north of Shobnall Road were flooded during the event; these housing&ndash;association managed properties were impacted by floodwater, likely linked to intense rainfall and the nearby Shobnall Brook/overflow. [IMG] (p18)</p></div><div class="nugget-popup"><p>Multiple properties at Price Court experienced internal flooding on 16th February 2020; gardens, driveways and the adjacent sports fields were also reported flooded. [IMG,PAG] (p22)</p></div><div class="nugget-popup"><p>Multiple properties experienced internal flooding; gardens, driveways and the adjacent sports fields were flooded. Water and sewage entered properties (reports of sewage ingress) and anecdotal reports describe depths of around 2 ft. The extent of damage led to evacuation of residents by the Housing Association. [PAG] (p23)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties; gardens, driveways and adjacent sports/playing fields were also flooded. Nearby gullies overflowed and water and sewage entered properties, reaching a depth of approximately 2 ft. The extent of damage led to the Housing Association evacuating residents from their properties. [IMG,PAG] (p24)</p></div><div class="nugget-popup"><p>Flooding affected both property and the highway at Price Court. Several property owners had to vacate their properties and were moved into temporary Housing Association accommodation while repairs were completed (approximately three to four months). [PAG] (p25)</p></div><div class="nugget-popup"><p>Flooding inundated properties and the highway at Price Court; SCC LLFA investigated the flooding that occurred on 16th February 2020. [IMG] (p26)</p></div><div class="nugget-popup"><p>Intense, continuous rainfall recorded at Price Court on 15&ndash;16 February 2020 generated significant volumes of surface water runoff onto already saturated ground, contributing to surface water flooding in the local area. [PAG] (p27)</p></div><div class="nugget-popup"><p>Fields immediately north of Price Court were flooded during the event as flow in the local watercourse rose rapidly and overland flow routes (including flows from the Horninglow channel) routed water across the area, producing greater inundation than expected from the storm magnitude. (p28)</p></div><div class="nugget-popup"><p>Floodwater entered residential properties (internal flooding), flooded gardens and driveways and ponded on adjacent sports fields at the rear of Price Court. The extent of damage prompted the Housing Association to evacuate residents. (p30)</p></div><div class="nugget-popup"><p>Private gullies within Price Court became overwhelmed during the February 2020 flooding. Historical blockages and prior need for jetting were noted; the downstream culvert serving Price Court was reported silted and in poor condition, contributing to drainage becoming inundated and overwhelmed during the event. [PAG] (p31)</p></div><div class="nugget-popup"><p>The private drainage at Price Court became overwhelmed and/or experienced a blockage during the February 2020 event, resulting in internal flooding to properties. Surface water runoff was unable to reach Shobnall Fields (potentially blocked by debris/hedge/fence and raised ground), accumulating in lower&ndash;lying parts of the highway and contributing to flooding at the site. [PAG] (p32)</p></div><div class="nugget-popup"><p>Private surface water drainage at Price Court became overwhelmed on an already saturated catchment; water accumulated in low&ndash;lying areas, backing up the drainage network and flooding residential properties and the adjacent highway. Blocked gullies historically at Price Court may have reduced drainage performance and contributed to rapid overwhelming. (p33)</p></div><div class="nugget-popup"><p>On 16th February 2020 a combination of surface water runoff, elevated levels in adjacent watercourses (Horninglow Channel) and an overwhelmed private/highway drainage network led to floodwater entering the estate. Private drainage and gullies became overwhelmed/blocked, water accumulated in low spots on the highway and entered properties. Gardens, driveways and the highway were also flooded. [PAG] (p37)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>6 residential properties; approximately 2 ft depth [PAG] (p23)</p></div><div class="nugget-popup quant"><p>6 residential properties; ~2 ft depth [IMG,PAG] (p24)</p></div><div class="nugget-popup quant"><p>peak flow approx 1.0 m3/s (p28)</p></div><div class="nugget-popup quant"><p>6 residential properties experienced internal flooding; floodwater reportedly reached approximately 2ft depth in some properties. (p30)</p></div><div class="nugget-popup quant"><p>6 residential properties [PAG] (p37)</p></div></div></body></div>`)[0];

                var html_eab250a022b181997d1dfb0922fce96d = $(`<div id="html_eab250a022b181997d1dfb0922fce96d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Staffordshire</h1><div class="nugget-popup"><p>Storm Dennis (16 February 2020) caused widespread flooding to highways and properties across Staffordshire; SCC undertook investigations in affected areas. (p6)</p></div><div class="nugget-popup"><p>During the Storm Dennis event (16 February 2020) intense rainfall on already saturated soils resulted in significant volumes of surface water flooding across the county and elevated flows in many watercourses, contributing to flooding incidents throughout Staffordshire. (p27)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than 130 applications for grant support; incidents in which five or more properties were internally flooded (p6)</p></div></div></body></div>`)[0];

                var html_0b36cf3480c6490b7ae7741863b45d9e = $(`<div id="html_0b36cf3480c6490b7ae7741863b45d9e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Staffordshire</h1><div class="nugget-popup"><p>Staffordshire experienced exceptionally high rainfall and very wet antecedent conditions in the period up to and including February 2020; river flows were exceptionally high through February and the county was affected by flooding associated with the storms (including the event at Price Court on 16th February 2020). (p15)</p></div><div class="nugget-popup"><p>Experienced sustained/persistent heavy rainfall from Storm Dennis (fronts moving over the county 15&ndash;16 February 2020), which led to surface&ndash;water flooding and contributed to the February 2020 flood impacts in the county. (p17)</p></div></div></body></div>`)[0];
