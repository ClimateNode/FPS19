                var html_a5583cc149dc5912c09decb15e8964df = $(`<div id="html_a5583cc149dc5912c09decb15e8964df" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>St Catherine's Road, Ise Lodge</h1><div class="nugget-popup"><p>Surface water from heavy rainfall on a saturated catchment flowed over ground following natural contours into low points around private property, causing internal flooding of a property on St Catherine's Road. (p7)</p></div><div class="nugget-popup"><p>Internal flooding entered a property on St Catherine's Road (water crossed the building threshold). [PAG,MUL] (p9)</p></div><div class="nugget-popup"><p>A property on St Catherine's Road was flooded. Surface water runoff accumulated to the rear/adjacent to the property (localised area shown at high risk), with roofs and paved areas draining to the surface water sewer that connects to public sewers on Deeble Road. A surface water public sewer manhole and highway gully are located in front of the flooded property; runoff from nearby agricultural fields flowed toward the rear of the property. (p10)</p></div><div class="nugget-popup"><p>Surface water runoff from adjacent arable land flowed into rear gardens, ponded to approximately 300mm depth at the rear of a garden, entered air bricks and flooded a garage; properties were affected by the inundation of rear gardens. [TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>Surface water runoff from arable fields ponded to the rear of a garden and entered private property. Water collected (~300 mm) at the rear boundary, flowed into a neighbouring garden then down the west side of the garden to the patio and around the north and west elevations of the house, entering air bricks and the garage. Reported water depth at the house was 100&ndash;150 mm. Floodwater then flowed along both sides of the driveway onto St Catherine's Road, overwhelming the adjacent highway gully and flooding across and down the road. [PAG] (p12)</p></div><div class="nugget-popup"><p>Heavy rainfall over a saturated catchment caused drainage systems to be ineffective, resulting in excess surface water flowing over ground following natural contours into low points around private properties on St Catherine's Road. Some properties experienced surface water intrusion to gardens and private areas; one property further west has a raised rear garden wall that provided a defence. (p13)</p></div><div class="nugget-popup"><p>External areas of residential properties (front, side and rear patio) were inundated; residents' photographs from the incident show floodwater affecting property curtilage and entrances. (p43)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property (p7)</p></div><div class="nugget-popup quant"><p>1 property [PAG,MUL] (p9)</p></div><div class="nugget-popup quant"><p>two properties; one property; 300mm depth [TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup quant"><p>300 mm ponding at rear of garden; 100&ndash;150 mm depth entering house and garage; 500 mm raised ground height (rear bund) [PAG] (p12)</p></div></div></body></div>`)[0];

                var html_6eeb9427e9c78d68590c87f4dcad68b8 = $(`<div id="html_6eeb9427e9c78d68590c87f4dcad68b8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kettering</h1><div class="nugget-popup"><p>The flood investigation covers an incident in Ise Lodge (St Catherine's Road), which is located within Kettering. (p2)</p></div><div class="nugget-popup"><p>Surface water runoff following heavy rainfall on a saturated catchment overwhelmed land drainage systems and flowed to low points around private property in Kettering; this led to internal flooding of one property on St Catherine's Road. (p7)</p></div><div class="nugget-popup"><p>An internal flooding incident occurred on St Catherine's Road within Kettering; one property was flooded internally. [MUL] (p9)</p></div><div class="nugget-popup"><p>Localised surface water flooding occurred within the Kettering area (specifically at St Catherine's Road) due to heavy rainfall over a saturated catchment and absence/alteration of drainage routes, directing runoff towards private properties. (p13)</p></div><div class="nugget-popup"><p>Overland surface&ndash;water flooding in a residential area converging at a location adjacent to football pitches. The map shows a blue&ndash;shaded flood area and flow paths from surrounding residential catchments and the football pitches that converge at the site. Significant ponding was witnessed at a junction (marked '01') and an approximate drainage manhole associated with the football pitch development is marked ('02'), indicating localised ponding and drainage issues at those points. [IMG] (p29)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property (p7)</p></div><div class="nugget-popup quant"><p>1 property [MUL] (p9)</p></div></div></body></div>`)[0];
