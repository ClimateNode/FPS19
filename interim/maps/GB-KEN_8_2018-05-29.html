                var html_d0b06d632cd4c68cce4bc8bd61982522 = $(`<div id="html_d0b06d632cd4c68cce4bc8bd61982522" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Sheerstone, Iwade</h1><div class="nugget-popup"><p>Internal flooding to residential properties; vehicles damaged and written off; Environment Agency carried out overpumping from the nearby watercourse as part of the response. [TAB] (p7)</p></div><div class="nugget-popup"><p>The river at the Sheerstone Road gauge reached a depth of 1.6 m (recorded at c.12:50), causing the Iwade Stream to flow out of bank through adjacent gardens and onto the road; properties on Sheerstone Road experienced internal flooding as part of the event. (p14)</p></div><div class="nugget-popup"><p>Water began to overwhelm the road culvert at Sheerstone; screen was inspected (found little debris) and a 6" pump was used to overpump from one side of the culvert to the other to manage flows. Photographs show muddy water and a partially blocked bar screen; images also show flooding to the front and rear of a property on Sheerstone Road. (p15)</p></div><div class="nugget-popup"><p>Floodwater inundated the front and rear of properties and the street; muddy water covered the carriageway and encroached onto driveways and patios, partially submerging vehicles and rendering the road impassable. (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8 properties; 3 cars [TAB] (p7)</p></div><div class="nugget-popup quant"><p>11 properties (across Sheerstone Road, Springvale and The Waterway); 1.6 m depth recorded at Sheerstone Road (p14)</p></div><div class="nugget-popup quant"><p>1 property (front and rear flooded) (p15)</p></div></div></body></div>`)[0];

way drainage network. (p35)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>13 properties (p29)</p></div></div></body></div>`)[0];

e (later installed in October 2018). (p38)</p></div><div class="nugget-popup"><p>Iwade experienced flooding from the intense storm runoff that overwhelmed drainage; the Environment Agency and KCC will explore flood risk management opportunities for Iwade. (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>11 properties; river level rose by approximately 2.0 m; peak 2.18 m [IMG] (p14)</p></div></div></body></div>`)[0];
