                var html_aaab21063a5a0c017e125f52e3f6e98d = $(`<div id="html_aaab21063a5a0c017e125f52e3f6e98d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Irwell</h1><div class="nugget-popup"><p>The culvert at Rockliffe Road restricted the River Irwell, putting pressure on the drainage network and contributing to a manhole being lifted; this hydraulic restriction contributed to internal flooding of properties on adjacent streets. (p47)</p></div><div class="nugget-popup"><p>On 26 December 2015 the River Irwell overtopped at Lumb Bridge and came out of channel, flooding Hareholme (contributing to four internally flooded properties) and Irwell Vale (contributing to flooding of the main village and Meadowpark, part of the 62 internally flooded properties reported there). [PAG] (p48)</p></div><div class="nugget-popup"><p>The River Irwell backed up at Lumb Bridge and came out of channel, flooding the main village and Meadowpark in Irwell Vale. In Rawtenstall the river remained in channel but contributed to cellar flooding and undermined foundations at New Hall Hey Business Park, causing a culvert/channel blockage, a breach at the adjacent cricket pitch and subsequent flooding of properties on 26th December 2015. [TAB] (p49)</p></div><div class="nugget-popup"><p>High flows and blockages in the River Irwell caused multiple flood impacts across Rossendale on 26 December 2015: river undermined foundations and caused channel/culvert blockage and breach at a cricket pitch leading to inundation that flowed east and west, causing cellar and ground&ndash;floor flooding; collapse of unconsented gabion defences and a scoured wall at Stacksteads led to the cricket pitch inundation and floodwaters across Brandwood Road, Waterbarn Lane and Brandwood Park, with cellar flooding of properties; high river levels combined with surface water and a local watercourse caused overtopping into Recreation Gardens at Strongstry and Chatterton (bunds exceeded), overtopping close to North Street properties, and undermining of the central pier of Bridgeway Bridge causing its collapse; Lambert's Mill flooded when a surface water drain backed up from high river flows; New Hall Hey Business Park had foundations undermined. [TAB,PAG] (p50)</p></div><div class="nugget-popup"><p>The River Irwell was the primary source of flooding in multiple incidents: it became blocked by collapsed gabion defences and breached a scoured wall at a cricket pitch (inundating the pitch and sending floodwater across adjacent roads and parkland); high river levels contributed to overtopping into Recreation Gardens and overtopping the right bank near North Street; the river also undermined the central pier of Bridgeway Bridge, causing its collapse. [PAG] (p51)</p></div><div class="nugget-popup"><p>Properties over footbridges of the River Irwell on Bacup Road suffered cellar flooding believed to be caused by a groundwater issue associated with the river vicinity on 26 December 2015. (p52)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>17 properties (collectively affected on 26 December 2015 along Rockliffe Road, Market Street and River Street) (p47)</p></div><div class="nugget-popup quant"><p>4 properties; 62 properties [PAG] (p48)</p></div><div class="nugget-popup quant"><p>62 properties (Irwell Vale); 50 properties (Rawtenstall) [TAB] (p49)</p></div><div class="nugget-popup quant"><p>50 properties; 16 properties; 24 properties; 3 inches of water in cellars [TAB,PAG] (p50)</p></div><div class="nugget-popup quant"><p>16 properties; 24 properties [PAG] (p51)</p></div></div></body></div>`)[0];

 to main river overflow, surface water, groundwater ingress and overwhelmed drainage. (p53)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>50 properties; 3 inches of water in cellars (p50)</p></div><div class="nugget-popup quant"><p>16 properties; 24 properties; 19 properties; 21 properties [TAB,PAG] (p51)</p></div><div class="nugget-popup quant"><p>21 properties (Waterfoot); 1 property (Weir); 27 properties (Whitewell Bottom) [TAB,PAG] (p52)</p></div><div class="nugget-popup quant"><p>27 properties (p53)</p></div></div></body></div>`)[0];
