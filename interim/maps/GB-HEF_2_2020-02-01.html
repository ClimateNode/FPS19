                var html_f10e1fedf5dda3c62c0ee7dbf600a9b8 = $(`<div id="html_f10e1fedf5dda3c62c0ee7dbf600a9b8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wellington Brook</h1><div class="nugget-popup"><p>Wellington Brook is the main watercourse through the settlement and is shown on mapping where Flood Zone 3 follows the river corridor; it is designated an Ordinary Watercourse under Herefordshire Council and is associated with the flood risk in the town. [IMG] (p1)</p></div><div class="nugget-popup"><p>Fluvial flooding from the Wellington Brook was identified as the source of flooding for many properties in the village; almost every flooded property was within the brook's flood zone. There were multiple accounts of the brook or stream overflowing and some reports of blocked bridge/culvert or blocked gullies contributing to runoff and ponding. (p2)</p></div><div class="nugget-popup"><p>Fluvial flood water spilled onto the brook's right&ndash;hand bank where the bank is low; adjacent low&ndash;lying road conveyed floodwater and highway gullies and piped outfalls were submerged. Following the flooding, channel maintenance work was carried out on the length of Wellington Brook downstream of the A49. (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>seven accounts of an overflowing river or stream; four accounts of a blocked bridge or culvert; six reports of surface water runoff; six respondents noted a blocked gulley (p2)</p></div></div></body></div>`)[0];

                var html_c4daadd5060bec33df0f4a268ec5ba27 = $(`<div id="html_c4daadd5060bec33df0f4a268ec5ba27" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wellington</h1><div class="nugget-popup"><p>Parts of the settlement fall within Environment Agency Flood Zone 3 along the main river corridor; areas adjacent to the river are identified at highest risk and some areas are shown as benefiting from flood defences. Wellington Primary School is shown outside the highest&ndash;risk zone. [IMG] (p1)</p></div><div class="nugget-popup"><p>Internal flooding of domestic properties across the village during the February 2020 fluvial event, caused primarily by Wellington Brook with additional surface water runoff and backwater from the River Lugg. Flood depths at ground floor ranged from under 6 inches up to 2 ft; some basements recorded depths greater than 6 ft. Flood durations ranged from less than 1 day up to 2 days. Two properties are recorded as flooding from surface water due to a bridge deck being higher than the road causing ponding when gullies blocked. (p2)</p></div><div class="nugget-popup"><p>During the February 2020 flood event internal flooding was reported across the village: road drainage and gullies were submerged so roads conveyed floodwater; a highway closure was implemented. Flooding depths reached up to 1 ft at ground&ndash;floor level and up to 6 ft in basements. Historic floods are recorded (one property in 1998; eight properties in 2007). (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>36 properties (questionnaire returns); 51 properties (Parish Council records); two properties (surface water due to bridge deck) (p2)</p></div><div class="nugget-popup quant"><p>36 properties; depths up to 1 ft at ground level; basements up to 6 ft; 1 property (1998); 8 properties (2007) (p3)</p></div></div></body></div>`)[0];
