                var html_d5c245a7fa20a855d20052d28cf66f35 = $(`<div id="html_d5c245a7fa20a855d20052d28cf66f35" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Sheffield Metropolitan District</h1><div class="nugget-popup"><p>A flooding event occurred in Sheffield associated with the very heavy rainfall on 20 October 2023 (investigation report concerns the Sheffield flood event of that date). (p1)</p></div><div class="nugget-popup"><p>Within Sheffield, river and urban flood risk was significant: the Meadowhall (Sheffield Hadfield's) gauge recorded the 4th highest level on record during Storm Babet. Flood defences completed since 2007 prevented flooding to homes and businesses in Hillsborough and through the Lower Don Valley. [PAG] (p2)</p></div><div class="nugget-popup"><p>Sheffield experienced a combination of surface water, localised watercourse and main river flooding (mainly west/south&ndash;west and along the River Rother). Highway flooding occurred (eg around Little London Road, Weedon Street, Meadowhall Road). Extensive overtopping in Rivelin and Porter Valleys caused damage to paths, ponds and the rights of way network; riverside wall collapses occurred at Moscar Cottages, near Broadfield Mowers and Endcliffe Park. (p5)</p></div><div class="nugget-popup"><p>Sheffield experienced widespread flood&ndash;related impacts during the event (20 October) including multiple streets flooded (e.g. Meadowhall Road, Weedon Street, Loxley Road, Ringinglow Road, A625 Ecclesall Road South). Totley Brook Road suffered significant cellar flooding to homes causing loss of power and gas and limited temporary evacuation. Veolia's Blackstock Road HWRC flooded due to high flows and blockage in the Meers Brook. Wood Royd Road in Deepcar required extensive pumping and sandbagging to prevent property flooding. [MUL] (p6)</p></div><div class="nugget-popup"><p>Widespread response and recovery actions: Lower Don Valley gates were reopened and riverside walkways cleaned; gullies and highway drains were checked and cleaned; wall collapses were fenced off; damaged footpaths and bridleways were inspected and dangerous sections secured; highway flooding occurred around Little London Road and in Millhouses Park; emergency procedures at Clough Dike (Deepcar) were instigated to prevent more severe flooding. [PAG] (p7)</p></div><div class="nugget-popup"><p>Multiple locations within Sheffield experienced flooding during the event (see Table 2), affecting residential and commercial properties across the city. [PAG] (p8)</p></div><div class="nugget-popup"><p>Surface&ndash;water flooding associated with Storm Babet caused properties in Sheffield to flood (see Table 2: Flooded Properties, Sheffield, Storm Babet). (p9)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4th highest on record (Sheffield Hadfield's / Meadowhall gauge) [PAG] (p2)</p></div><div class="nugget-popup quant"><p>135 urgent calls received by Amey Streetsahead OCR; 107 highway flooding jobs; 11 flooding&ndash;to&ndash;property jobs; sandbags deployed to 8 locations (p5)</p></div><div class="nugget-popup quant"><p>11 homes; approximately 30 homes [MUL] (p6)</p></div><div class="nugget-popup quant"><p>6 residential properties; 3 commercial properties [PAG] (p8)</p></div><div class="nugget-popup quant"><p>2 properties (p9)</p></div></div></body></div>`)[0];
