                var html_cac298e2c6935e0a93e24062e15b1bea = $(`<div id="html_cac298e2c6935e0a93e24062e15b1bea" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bristol Harbour</h1><div class="nugget-popup"><p>Tidal floodwater entered the Floating Harbour via overtopping at Bathurst Basin and Junction Lock; tide&ndash;locking and the Northern Stormwater Interceptor allowed River Frome flows into the Harbour. Bristol City Docks pre&ndash;lowered the Harbour to create extra capacity for this tidal inflow. (p11)</p></div><div class="nugget-popup"><p>Tidal overtopping at river structures (Junction Lock and Bathurst Basin Dam) resulted in tidal water entering the Floating Harbour. [TAB] (p14)</p></div><div class="nugget-popup"><p>Experienced elevated water levels during the high tides; was pre&ndash;lowered to provide additional storage capacity and its control structures were operated to manage water levels. (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>four Eastville Sluices; two flood events (p11)</p></div></div></body></div>`)[0];

                var html_f628153631c49d2008cf9d9d60690d1b = $(`<div id="html_f628153631c49d2008cf9d9d60690d1b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cumberland Basin</h1><div class="nugget-popup"><p>Overtopping at Junction Lock led to tidal water entering the Cumberland Basin area of the Floating Harbour, exposing adjacent infrastructure to floodwater. [IMG] (p11)</p></div><div class="nugget-popup"><p>The Cumberland Basin area adjacent to the Clifton Suspension Bridge experienced elevated tidal water levels during the 11 March 2020 high tide; estimated tide heights were used to calculate maximum flood depths for the basin/adjacent infrastructure. (p13)</p></div><div class="nugget-popup"><p>Roads around the Cumberland Basin (including the carriageways at/near the Clifton Suspension Bridge junction) were affected by tidal flooding; Cumberland Basin Road is estimated to have experienced up to 0.40 m of flood depth and roads in this area were closed for approximately 4.5 hours during the high tides. [PAG] (p14)</p></div><div class="nugget-popup"><p>Roads around the Cumberland Basin were closed during the evening high tide on 11 March and the morning high tide on 12 March, indicating inundation of highway infrastructure in the basin area. [TAB] (p15)</p></div><div class="nugget-popup"><p>Part of the road/harbour area actively managed during the high tides on 11&ndash;12 March 2020; associated roads (Cumberland Basin Road) were closed and harbour control structures were monitored/operated to manage rising tidal levels. (p18)</p></div><div class="nugget-popup"><p>Residents of the Sea Mills area were contacted and warned to install flood barriers; Sea Mills was photographed during the high tides on 12 March 2020, indicating direct exposure to the tidal high water. [PAG] (p24)</p></div><div class="nugget-popup"><p>Photographs show high tide at vulnerable basin infrastructure; harbour actions (pre&ndash;lowering) were advised to manage tidal surge impacts. [PAG] (p25)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>estimated high tide ~8.77&ndash;8.78 mAOD (p13)</p></div><div class="nugget-popup quant"><p>Closures 20:00 &ndash; 00:30 (11 Mar) and 07:00 &ndash; 11:00 (12 Mar); approximate flooded durations 3.5 hours and 4 hours [TAB] (p15)</p></div></div></body></div>`)[0];

                var html_8ba5cffb9f00a9231f470c2eec475b86 = $(`<div id="html_8ba5cffb9f00a9231f470c2eec475b86" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bristol Unitary Authority</h1><div class="nugget-popup"><p>High astronomical spring tides combined with a storm surge on 11&ndash;12 March 2020 caused tidal flooding across the Bristol region; roads along the River Avon were significantly impacted and one property flooded internally; no essential infrastructure reported flooded. (p3)</p></div><div class="nugget-popup"><p>Areas of the city adjacent to the River Avon experienced tidal flooding during the high tides of 11&ndash;12 March 2020, with multiple streets, basins and a footpath inundated along the river corridor. [IMG] (p6)</p></div><div class="nugget-popup"><p>Central Bristol was affected by a tidal flood event; flood alerts and warnings were issued and the Environment Agency operated sluices and closed flood gates (e.g. Eastville sluice gates to allow River Frome flows to discharge to the River Avon downstream of Black Rocks, and gates at Shirehampton) with pre/post&ndash;tide checks and clearances to manage tide locking. (p19)</p></div><div class="nugget-popup"><p>On 11 March 2020 (and into 12 March 2020) Bristol experienced tidal/coastal flooding caused by an astronomical high tide combined with a storm surge and westerly winds; the event reached a peak of 8.81mAOD and affected several areas across the city, including the Portway and Cattle Market Road. [PAG] (p21)</p></div><div class="nugget-popup"><p>The city experienced a tidal flood caused by an astronomical high tide combined with a storm surge, reaching a peak of 8.81mAOD and affecting residential and highway infrastructure across multiple areas. (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property (p3)</p></div></div></body></div>`)[0];

                var html_7976cd115cca4bec7d18d6140af6da3b = $(`<div id="html_7976cd115cca4bec7d18d6140af6da3b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Avon In Bristol</h1><div class="nugget-popup"><p>High astronomical spring tides combined with a storm surge caused increased tidal levels and flooding associated with the River Avon, increasing flood extents and producing tidal inundation that significantly affected the riverside road network. (p3)</p></div><div class="nugget-popup"><p>Tidal surge was forced up the River Avon as the tide rose, increasing water levels between Avonmouth and inner&ndash;city locations (via the narrowing channel), producing higher&ndash;than&ndash;predicted city&ndash;centre tide levels and increasing flood risk in the central area. [PAG,MUL] (p10)</p></div><div class="nugget-popup"><p>Tidal flooding of the River Avon caused flooding at local areas including Sea Mills (flooding of the road, parked cars and a property; many properties deployed flood barriers/gates). Tidal flood water also significantly affected the Portway and Cattlemarket Road, forcing their closure. (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property flooded internally (p3)</p></div></div></body></div>`)[0];

                var html_dbb16bc2a9800379d15dfa0be6fc2b0c = $(`<div id="html_dbb16bc2a9800379d15dfa0be6fc2b0c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bedminster Bridge</h1><div class="nugget-popup"><p>The Bedminster Bridge tide monitor in the city centre recorded higher&ndash;than&ndash;predicted high tides on 11&ndash;12 March 2020, indicating an underestimated surge and higher tidal levels affecting the city centre. [TAB,PAG,MUL] (p8)</p></div><div class="nugget-popup"><p>Recorded peak high tide levels at Bedminster Bridge during the two high tide events exceeded predictions: on 11 March 2020 the recorded peak was higher than the predicted peak, and on 12 March 2020 the recorded peak was again higher than predicted. The underestimation was linked to surge/wind effects and to the city&ndash;centre uplift from Avonmouth being larger than the standard adjustment. [PAG] (p9)</p></div><div class="nugget-popup"><p>Observed higher tide level increases at Bedminster Bridge (relative to Avonmouth) indicated that city&ndash;centre high tides were larger than the adjusted forecasts, contributing evidence of underestimated tidal heights during the March events. [MUL] (p10)</p></div><div class="nugget-popup"><p>Bedminster Bridge location recorded a measured high tide of 8.81 mAOD on 11 March 2020 and was included among the flooded locations for which maximum flood depths were estimated. [TAB,PAG] (p13)</p></div><div class="nugget-popup"><p>Tidal gauge at Bedminster Bridge was actively monitored leading up to the high tide and tidal gauge data were downloaded after the event to monitor storm surge and tidal levels. [PAG] (p24)</p></div><div class="nugget-popup"><p>The Bedminster Bridge tidal gauge was monitored leading up to the high tide and tidal gauge data were downloaded after the event, recording the storm surge/tidal levels associated with the 11&ndash;12 March high tides. [PAG] (p25)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8.81mAOD recorded; 8.68mAOD predicted (0.13m under estimated) on 11/03/2020; 8.67mAOD recorded; 8.45mAOD predicted (0.22m under estimated) on 12/03/2020; BCC uplift 0.15m; actual Avonmouth→Bedminster increases 0.18m (11/03/2020) and 0.23m (12/03/2020) [PAG] (p9)</p></div><div class="nugget-popup quant"><p>measured high tide 8.81 mAOD [TAB,PAG] (p13)</p></div></div></body></div>`)[0];

                var html_8764217ffaaa65750ed76aa2fe1125d1 = $(`<div id="html_8764217ffaaa65750ed76aa2fe1125d1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Sea Mills Lane, Sea Mills</h1><div class="nugget-popup"><p>Flooding from the tidal River Avon inundated Sea Mills Lane adjacent to the river; site identified as one of multiple flood locations along the River Avon. [IMG] (p6)</p></div><div class="nugget-popup"><p>Public highway and adjacent residential property inundated; water covered the entire road surface and encroached onto driveways and gardens; multiple parked vehicles were partially submerged, rendering the street impassable. [IMG] (p12)</p></div><div class="nugget-popup"><p>Estimated to have experienced a high tide of 8.72 mAOD on the 11 March high tide, contributing to the locations identified as flooded in Table 5/6. [TAB] (p13)</p></div><div class="nugget-popup"><p>High tide exceeded ground level (ground 8.00 m AOD) producing roadway inundation by tidal water; road experienced significant flooding and remained closed between the evening high tide on 11 March and the morning high tide on 12 March. [TAB,PAG] (p14)</p></div><div class="nugget-popup"><p>Experienced significant flood depths and was closed between the evening high tide on 11 March and the morning high tide on 12 March; one report of internal residential flooding where tide levels overtopped a demountable barrier and entered the rear of the property via a lower&ndash;lying side gate. [TAB,PAG] (p15)</p></div><div class="nugget-popup"><p>High tides on the evening of 11 March and the morning of 12 March 2020 exceeded a property's demountable flood barrier and entered via the side gate into the lower&ndash;lying rear of the property, causing internal residential flooding. (p16)</p></div><div class="nugget-popup"><p>Residents at Sea Mills Lane were notified and the road was actively managed/closed as part of the response to the high tides. [PAG] (p18)</p></div><div class="nugget-popup"><p>Tidal flooding inundated Sea Mills Lane, flooding the road, parked cars and one property; many properties in the area deployed flood barriers/gates in response. (p20)</p></div><div class="nugget-popup"><p>The Sea Mills area was affected by the astronomical high tide combined with a storm surge; property flood defences largely prevented inundation but one property was flooded. Residential properties and nearby highway infrastructure were impacted. (p22)</p></div><div class="nugget-popup"><p>Sea Mills Lane was identified for closure around the high tides on 11&ndash;12 March 2020. Residents of Sea Mills were contacted and advised to install flood barriers to protect properties; photographs of the high tide were taken at Sea Mills. (p24)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8.72 mAOD estimated high tide [TAB] (p13)</p></div><div class="nugget-popup quant"><p>0.72 m maximum flood depth; 5 hours estimated flood duration [TAB,PAG] (p14)</p></div><div class="nugget-popup quant"><p>one internal residential flooding incident; 5 hours (approximate flooding duration inferred) [TAB,PAG] (p15)</p></div><div class="nugget-popup quant"><p>one property (p16)</p></div><div class="nugget-popup quant"><p>1 property (p20)</p></div><div class="nugget-popup quant"><p>1 property (p22)</p></div></div></body></div>`)[0];

                var html_240756c3d8dd523bbb2dca5a5436dbaa = $(`<div id="html_240756c3d8dd523bbb2dca5a5436dbaa" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Portway, Bristol Unitary Authority</h1><div class="nugget-popup"><p>Inundation occurred at the Portway beneath the Clifton Suspension Bridge due to high tides on the tidal River Avon. [IMG] (p6)</p></div><div class="nugget-popup"><p>Tidal flooding encroached onto the roadway and adjacent pedestrian path (photo evidence at 12:55 on 12 Mar 2020); water nearly overtopped the stone barrier separating the road from the water, threatening road access and likely causing disruption to traffic and pedestrians. [IMG] (p12)</p></div><div class="nugget-popup"><p>The Portway under Clifton Suspension Bridge is estimated to have experienced a high tide of 8.77 mAOD on the 11 March high tide and is included among the locations that flooded. [TAB] (p13)</p></div><div class="nugget-popup"><p>Tidal inundation beneath the Clifton Suspension Bridge caused significant roadway flooding; the Portway experienced an estimated maximum flood depth of 0.77 m and was closed during the tidal high periods. [TAB,PAG] (p14)</p></div><div class="nugget-popup"><p>The Portway was closed due to high tides on the evening of 11 March and the morning of 12 March; road closures (20:00&ndash;00:30 on 11th and 07:00&ndash;11:00 on 12th) indicate the road was flooded during those periods. [TAB] (p15)</p></div><div class="nugget-popup"><p>Road was actively managed and closed; officers were in location to manage traffic and the decision was taken to keep the Portway closed overnight on 11 March 2020 as the tide exceeded the forecast. Maintenance contractors were instructed to pump tide water off the highway. (p18)</p></div><div class="nugget-popup"><p>Significant tidal floodwater inundation led to closure of the Portway, disrupting an important transport route into and out of Bristol. [PAG] (p20)</p></div><div class="nugget-popup"><p>Tidal floodwater significantly inundated the Portway, forcing closure of the road and disrupting a primary transport route into and out of Bristol. [PAG] (p21)</p></div><div class="nugget-popup"><p>The Portway (beneath the Clifton Suspension Bridge) was inundated during the high tide and storm surge, affecting highway infrastructure and prompting operational responses. (p22)</p></div><div class="nugget-popup"><p>High tides on 11&ndash;12 March 2020 prompted highway teams to close the Portway (an hour before the high tide on the evening of 11th in both directions and on the morning of 12th in the outbound direction). Following higher than expected tide predictions, the Portway was kept closed in both directions for both high tides. Photographs were taken of the high tide at the Portway. [PAG] (p24)</p></div><div class="nugget-popup"><p>Higher&ndash;than&ndash;expected tides led to the Portway being closed (an hour before the high tide on the evening of 11 March and closed both directions for both high tides after monitoring); closures were implemented due to tidal inundation risk. [PAG] (p25)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8.77 mAOD estimated high tide [TAB] (p13)</p></div><div class="nugget-popup quant"><p>0.77 m; 4.5 hours [TAB,PAG] (p14)</p></div><div class="nugget-popup quant"><p>4.5 hours; 5 hours [TAB] (p15)</p></div></div></body></div>`)[0];

ntly affected Cattle Market Road and caused its closure. (p21)</p></div><div class="nugget-popup"><p>Included in the report's list of locations affected by the 11&ndash;12 March 2020 astronomical high tide combined with a storm surge; the road and adjacent infrastructure were inundated by tidal/coastal flooding. (p22)</p></div><div class="nugget-popup"><p>Cattle Market Road was identified for closure in advance of the high tides on 11&ndash;12 March 2020 and was included among vulnerable locations where photographs of the high tide were taken. [PAG] (p24)</p></div><div class="nugget-popup"><p>Identified as a vulnerable road expected to flood from the high tide; included in the list of specific roads to close and was photographed during the high tide on 12 March, indicating tidal inundation risk/impacts to the road corridor. [PAG] (p25)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Estimated high tide 8.82 mAOD [TAB] (p13)</p></div><div class="nugget-popup quant"><p>1.02 m maximum flood depth; 5 hours estimated flood duration [TAB,PAG] (p14)</p></div><div class="nugget-popup quant"><p>≈5 hours; closed 20:00 (11 Mar) &ndash; 11:30 (12 Mar) [TAB,PAG] (p15)</p></div></div></body></div>`)[0];

 was photographed during the high tide, indicating local tidal inundation risk/impacts. [PAG] (p25)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property (p20)</p></div><div class="nugget-popup quant"><p>one property (p22)</p></div></div></body></div>`)[0];

                var html_9ff6f01166a3716b46b739065aa2d830 = $(`<div id="html_9ff6f01166a3716b46b739065aa2d830" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Avonmouth</h1><div class="nugget-popup"><p>Measured high tide levels at the Avonmouth monitor on 11&ndash;12 March 2020 exceeded the EA forecasts, showing a larger&ndash;than&ndash;predicted surge component which contributed to higher tidal levels affecting the area. [TAB,PAG,MUL] (p8)</p></div><div class="nugget-popup"><p>Used as the upstream tidal reference point for forecasts; an added adjustment of 0.15m to Avonmouth tide values underestimated actual increases to the city centre, contributing to higher&ndash;than&ndash;predicted city&ndash;centre tide levels during the March events. [MUL] (p10)</p></div><div class="nugget-popup"><p>Experienced the measured high tide at the gauge of 8.63 mAOD on the 11 March high tide and was one of the locations used to assess the tidal inundation that led to flooding. [TAB,PAG] (p13)</p></div><div class="nugget-popup"><p>The Avonmouth area was affected by the tidal event; drainage (the rhine network) was managed by the Lower Severn IDB to control flows and reduce flood risk. (p19)</p></div><div class="nugget-popup"><p>High tidal water levels at Avonmouth (predicted and observed) produced a tidal flood risk to Bristol city centre that drove operational responses: forecasts and observed peaks were used to assess whether city defences would provide protection and informed actions such as pre&ndash;lowering the floating harbour and opening Eastville Sluices, monitoring tidal gauges, and triggering road closures and warnings to residents and businesses. [TAB,PAG,MUL] (p23)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8.63 mAOD measured high tide [TAB,PAG] (p13)</p></div></div></body></div>`)[0];
