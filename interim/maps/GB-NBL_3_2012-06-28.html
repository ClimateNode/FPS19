                var html_1b2cd20092d2c90ccd8a2b3162c7662c = $(`<div id="html_1b2cd20092d2c90ccd8a2b3162c7662c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Alnwick</h1><div class="nugget-popup"><p>Intense surface water runoff overwhelmed drainage in Alnwick town centre on 28/06/2012, flooding multiple business premises and inundating several roads and a public car park. Surface water flowed from Market Street and the sloped area south of the Market Street/Bondgate Within junction into a depressed section of Bondgate Within, causing properties on the south side of Bondgate Within (just west of the Market Street junction) to be flooded. Runoff was also directed through the rear of the Iceland store to its rear car park and on to Greenwell Road and the public car park, which became inundated. Movement of large vehicles (notably fire engines) through street floodwater also produced waves that caused flooding into some premises. [IMG,PAG] (p1)</p></div><div class="nugget-popup"><p>Surface water runoff from intense rainfall overwhelmed drainage infrastructure in parts of the town centre, resulting in flooding of business premises; the most significantly affected area was the junction of Market Street and Bondgate Within where runoff accumulated and properties became flooded. (p2)</p></div><div class="nugget-popup"><p>Streets and public spaces in the town centre were submerged by floodwater, impeding traffic and pedestrian movement; vehicles were stranded or partially submerged and people were seen wading through deep water. [IMG] (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>15+ business premises; 4 roads [IMG,PAG] (p1)</p></div></div></body></div>`)[0];
