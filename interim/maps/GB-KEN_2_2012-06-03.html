                var html_af9dded3c9ef74b4d44d0260586146f5 = $(`<div id="html_af9dded3c9ef74b4d44d0260586146f5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Oak Road, High Brooms</h1><div class="nugget-popup"><p>A flood from a section of open channel of a watercourse next to a private car park near Oak Road damaged properties and vehicles. (p1)</p></div><div class="nugget-popup"><p>At Oak Road the open channel section (approx. 30 m) and the upstream culvert inlet are part of the flooded watercourse. A trash screen at the culvert inlet was observed clear in one photo and heavily obstructed by large debris (wood, metal, rubbish) in another &mdash; the debris was lodged against the screen and blocking flow into the culvert, reducing drainage capacity and contributing to local hydraulic obstruction. [IMG] (p3)</p></div><div class="nugget-popup"><p>An ordinary watercourse (open channel and culvert opening with a trash screen) at Oak Road was implicated in flooding. The June 2012 incident prompted remedial actions to reduce future flood risk, including debris removal, replacement/improvement of the trash screen, erection of 'No Flytipping' signs and regular inspections/maintenance. [TAB,MUL] (p4)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>three properties (p1)</p></div><div class="nugget-popup quant"><p>1 trash screen obstructed; ~30 m open channel; ~1 km of downstream culvert [IMG] (p3)</p></div><div class="nugget-popup quant"><p>two similar flood incidents; one incident resulted in internal damage to properties [TAB,MUL] (p4)</p></div></div></body></div>`)[0];
