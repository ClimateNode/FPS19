y of a property at The Square; internal flooding reached approximately 25 mm depth through rooms, required cleaning up and temporarily affected the business. (p12)</p></div><div class="nugget-popup"><p>Arrangement of kerbs and levels allowed surface water flowing off the carriageway to reach the footway and enter doorways of properties, making areas vulnerable to surface water flooding during the event. (p13)</p></div><div class="nugget-popup"><p>Floodwater overflowed onto the pavement and street area in front of a stone building; sandbags were placed at the building base to protect against ingress; debris and displaced paving material concentrated near the building entrance; construction materials and a traffic cone were affected by the floodwater. [IMG,PAG] (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property [PAG] (p6)</p></div><div class="nugget-popup quant"><p>one property [PAG] (p7)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p9)</p></div><div class="nugget-popup quant"><p>1 property; 25 mm depth of water (p12)</p></div></div></body></div>`)[0];

                var html_4cb65e331f4a42616c1b901a3e2c7ebe = $(`<div id="html_4cb65e331f4a42616c1b901a3e2c7ebe" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Broad Street, Earls Barton</h1><div class="nugget-popup"><p>Described as the low point where surface water sewers discharge and identified on flood mapping as high risk; several road gullies on Broad Street were seen to be blocked with leaves and silt during the flood investigation, implicating Broad Street in the surface water flooding observed. [PAG] (p10)</p></div><div class="nugget-popup"><p>Surface water continued east along Broad Street to the low point opposite Churchill Road, with water reported flowing out of road gullies at low areas; overtopping of kerbs at the low point flooded the footway and the road and footways at low points of Broad Street were flooded. (p12)</p></div><div class="nugget-popup"><p>Arrangement of kerbs and levels allowed surface water flowing off the carriageway to reach the footway and enter doorways of properties, making areas vulnerable to surface water flooding during the event. (p13)</p></div><div class="nugget-popup"><p>Floodwater covered the road and intersection, extended onto sidewalks and up to residential doorsteps on the south side of Broad Street, impeding vehicle movement and pedestrian access; parked vehicles were partially in standing floodwater. [IMG,PAG] (p37)</p></div><div class="nugget-popup"><p>Water emerging from a kerbside (offlet) gully and flowing onto the road and pavement, causing localised surface water flooding that pooled along the pavement and extended into the carriageway, affecting pedestrian movement and vehicle passage and posing a hazard. [IMG,PAG] (p38)</p></div><div class="nugget-popup"><p>Localised footway flooding on the south side of Broad Street opposite Churchill Road, with water pooling around a drain and wet pavement causing pedestrian inconvenience and indicating ineffective drainage/blockage. [IMG,PAG] (p42)</p></div><div class="nugget-popup"><p>Footway flooding on the south side of Broad Street opposite Churchill Road. Roof drainage downpipe discharging into a blocked highway gully contributed to surface water accumulation on the pavement, creating localized flooding and risk of water ingress to adjacent properties. [IMG,PAG] (p43)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 parked cars [IMG,PAG] (p37)</p></div></div></body></div>`)[0];

                var html_18c3bcd70d057a2d3077ad677f816f96 = $(`<div id="html_18c3bcd70d057a2d3077ad677f816f96" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Earls Barton</h1><div class="nugget-popup"><p>Moderate rainfall exceeded local drainage capacity so surface water followed contours to low points on the public highway and around private property in Earls Barton, causing internal flooding of at least one property. [PAG] (p6)</p></div><div class="nugget-popup"><p>Moderate rainfall and inadequate drainage led to excess surface water flowing to low points on the public highway and into private property, causing internal flooding (at least one property affected). [PAG] (p7)</p></div><div class="nugget-popup"><p>The Square, within Earls Barton, experienced internal flooding of a property on 16th September 2015; the incident is part of repeated internal flooding incidents in the village over the last five years. [PAG] (p9)</p></div><div class="nugget-popup"><p>Flood incident investigation of the town identified surface water flooding issues during the event: public and surface water sewers conveyed flows into the town centre (The Square/Broad Street), road gullies were observed blocked and runoff from hardstanding and private car parks was seen entering the public highway. (p10)</p></div><div class="nugget-popup"><p>Moderate rainfall could not be collected or conveyed by drainage. Surface water flowed from private property and the highway on higher ground, following natural contours to low points in the village, causing flooding of low&ndash;lying areas, footways and properties; highway drainage and public sewers were relied upon and were vulnerable to blockage and exceedance. [PAG] (p13)</p></div><div class="nugget-popup"><p>Surface water overtopped kerbs and flowed towards private property; highway drainage capacity was identified as insufficient in areas creating flood risk to properties. Actions recommended include regular highway drainage cleansing, asset capacity assessments and review of carriageway/kerb/footway levels to reduce overtopping and runoff to properties. (p20)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property [PAG] (p6)</p></div><div class="nugget-popup quant"><p>one property [PAG] (p7)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p9)</p></div></div></body></div>`)[0];
