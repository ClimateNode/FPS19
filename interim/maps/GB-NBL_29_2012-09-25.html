                var html_fceeaf9f0280a65a0bd1c86b6f4009c9 = $(`<div id="html_fceeaf9f0280a65a0bd1c86b6f4009c9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Morpeth</h1><div class="nugget-popup"><p>Morpeth experienced combined river and surface&ndash;water flooding on 25/09/2012. The River Wansbeck burst its banks producing a peak recorded at the town gauge; 45 residential properties were flooded. Surface&ndash;water and river flooding affected multiple streets (High Stanners flooded from 04:45, Dawson Place flooded around 06:00&ndash;07:00, Copper Chare affected by the Cotting Burn), Mitford Road flooded from the River Wansbeck (surface water had begun earlier), Oldgate Bridge was closed during the event, and evacuations of residents (e.g. High Stanners) took place. [IMG] (p1)</p></div><div class="nugget-popup"><p>The town experienced flooding during the event on 25 September: High Stanners flooded (commenced 04:45); Dawson Place flooded from the Cotting Burn (~06:00&ndash;07:00); Oldgate Bridge was closed (~06:15&ndash;07:00); a fallen tree on Curly Kews hindered the evacuation route; evacuation of residents began in High Stanners and ended at 11:00; 1000 Mitford Road began to flood from the River Wansbeck at 10:00. The town also has historic major floods (2008 and 1963). [TAB,MUL] (p2)</p></div><div class="nugget-popup"><p>Residential areas and streets in Morpeth were heavily flooded; streets submerged to ankle/knee depth with residents wading through water, vehicles partially submerged and emergency services conducting rescues. [IMG,PAG] (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>45 residential properties; 1 road (Mitford Road) [IMG] (p1)</p></div><div class="nugget-popup quant"><p>approximately 1000 properties (2008); 482 properties (1963) [TAB,MUL] (p2)</p></div><div class="nugget-popup quant"><p>1 partially submerged car [IMG,PAG] (p3)</p></div></div></body></div>`)[0];
