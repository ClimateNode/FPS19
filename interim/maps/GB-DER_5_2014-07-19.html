pup"><p>Surface water from an intense, localised summer storm overwhelmed the local drainage; rapid runoff down steep local topography affected properties on Willowcroft Road as surface water travelled from highways, roofs and driveways. (p12)</p></div><div class="nugget-popup"><p>Residents reported floodwater on Willowcroft Road to Derby City Council following the intense, isolated storm; the street experienced surface water flooding during the event. (p14)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>7 properties (p3)</p></div><div class="nugget-popup quant"><p>7 residential properties (p4)</p></div><div class="nugget-popup quant"><p>7 residential properties [PAG] (p5)</p></div><div class="nugget-popup quant"><p>7 homes (p10)</p></div><div class="nugget-popup quant"><p>7 properties (p11)</p></div></div></body></div>`)[0];

                var html_eb109a81919615fc5c9f25eddaaec9d2 = $(`<div id="html_eb109a81919615fc5c9f25eddaaec9d2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Spondon</h1><div class="nugget-popup"><p>Other areas of Spondon experienced surface water flooding during the same event, including isolated cases of internal property flooding affecting nearby localities. (p3)</p></div><div class="nugget-popup"><p>A significant cluster of internally flooded residential properties occurred within Spondon &mdash; specifically on Willowcroft Road &mdash; triggering the formal investigation. Internal flooding affected nearby homes. [IMG] (p5)</p></div><div class="nugget-popup"><p>The urban area of Spondon forms the large upstream catchment whose impermeable surfaces and paved areas generate concentrated surface water runoff that drains by gravity towards the investigation area (Willowcroft Road). This runoff contributed to surface water flow along the public surface water sewer system and the natural flow path during intense rainfall (e.g. 19 July 2014), increasing surface water flood risk in the downstream study area. [IMG] (p6)</p></div><div class="nugget-popup"><p>Around 7 homes along Willowcroft Road (north of the A52) experienced flood water in ground&ndash;floor living areas. An undetermined number of nearby properties suffered severe external property flooding, in some cases close to entering ground&ndash;floor living areas. [IMG,PAG] (p10)</p></div><div class="nugget-popup"><p>On 19th July 2014 an extremely isolated, high&ndash;intensity storm produced rapid surface runoff from largely impermeable paved areas. The local highway gullies and the public surface water sewer network were inundated and exceeded capacity, directing rapid downslope flows into lower elevations. This led to internal flooding of properties and significant damage to ground&ndash;floor living areas; flow routes were defined by local topography toward the River Derwent. [PAG] (p11)</p></div><div class="nugget-popup"><p>Spondon was particularly affected by surface water flooding during the intense storm; the investigation focused on a cluster of properties that were internally flooded as drainage was overwhelmed and runoff followed natural flow paths. (p12)</p></div><div class="nugget-popup"><p>An intense, isolated thunderstorm on the afternoon of 19th July 2014 caused surface water drainage (highway drains and surface water sewers) to be exceeded, resulting in surface water flooding across many areas of Spondon. (p13)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>7 residential properties [IMG] (p5)</p></div><div class="nugget-popup quant"><p>around 7 homes along Willowcroft Road [IMG,PAG] (p10)</p></div><div class="nugget-popup quant"><p>7 properties [PAG] (p11)</p></div><div class="nugget-popup quant"><p>7 properties (p12)</p></div></div></body></div>`)[0];
