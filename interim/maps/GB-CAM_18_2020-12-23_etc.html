                var html_b2d697cda377cb3ab63fc665f64fd214 = $(`<div id="html_b2d697cda377cb3ab63fc665f64fd214" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Millennium Green</h1><div class="nugget-popup"><p>Flows were reported to have come out of bank from the High Street and downstream into the Millennium Green open space, inundating the green during the event; the watercourse then passes through a culvert under the railway where flows were impeded. (p14)</p></div><div class="nugget-popup"><p>The watercourse running through Millennium Green was cleared of vegetation and debris by the Parish Council after the flood to improve flow and reduce future blockage. (p21)</p></div><div class="nugget-popup"><p>The ordinary watercourse culvert beneath the railway at Millennium Green was identified for significant maintenance and clearance following the village flooding; the culvert has been inspected/targeted for clearance to reduce future flood risk. (p25)</p></div></div></body></div>`)[0];

                var html_5db57c6009076c9f2eeebee36877d301 = $(`<div id="html_5db57c6009076c9f2eeebee36877d301" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>High Street, Offord Cluny</h1><div class="nugget-popup"><p>North section experienced significant and prolonged highway flooding that resulted in a full road closure. Properties on the High Street (reported as a key risk area) suffered internal flooding with ingress that did not recede for a number of days; some affected properties subsequently experienced loss of access to foul sewerage provision for an extended period. [PAG] (p11)</p></div><div class="nugget-popup"><p>Extensive surface water flooding of the highway (B1043), adjacent gardens and properties. Wetland to the east exceeded capacity and flooded the road, field edges and properties. Flood water reached significant depth and persisted; the Anglian Water sewer system was impacted and some residents were without foul sewerage provision. [PAG,IMG] (p12)</p></div><div class="nugget-popup"><p>Extensive surface water flooding from an overwhelmed wetland and high groundwater flooded the B1043 (High Street) and adjacent field edge, inundating gardens, outbuildings and properties to the east and causing some rear garden flooding. Floodwater reached significant depth and persisted, causing the road to be closed and the Anglian Water sewer system to be impacted, leaving some residents without foul sewerage provision. [TAB] (p13)</p></div><div class="nugget-popup"><p>Flows were reported to come out of bank from the High Street and flow downstream into Millennium Green and nearby industrial/business curtilage, contributing to property and open&ndash;space inundation; impeded culvert and vegetation downstream affected flow routes. [TAB] (p14)</p></div><div class="nugget-popup"><p>Reports of flooding at High Street (North) were investigated by RMAs and the LLFA; site visits identified that a substantially blocked small&ndash;diameter Network Rail culvert in the vicinity likely contributed to local flooding at this location, prompting confirmation of maintenance actions. [TAB] (p15)</p></div><div class="nugget-popup"><p>Localised flooding caused by reduced flow in the adjacent watercourse due to vegetation and silt build&ndash;up and an unconsented metal security fence obstructing the channel. Investigation and riparian works were carried out: fence removed (actioned under S23), vegetation and silt clearance advised and undertaken, resulting in improved flow by May 2021. [IMG] (p18)</p></div><div class="nugget-popup"><p>Sections of High Street (North and South) were affected during the 23 December 2020 event: surface water flooding occurred (both North and South), and groundwater flooding was recorded in the North. Contributing issues identified for High Street included sewer capacity problems, mis&ndash;connections to foul sewers, RMA operational issues and riparian maintenance shortcomings. [TAB] (p26)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>full road closure lasting approximately 3 weeks [PAG] (p11)</p></div><div class="nugget-popup quant"><p>approximately 45 cm; full road closure lasting approximately 3 weeks; loss of foul sewerage provision to properties for approximately 3 weeks [PAG,IMG] (p12)</p></div><div class="nugget-popup quant"><p>approximately 45 cm depth; road closure lasting approximately 3 weeks; approximately 3 weeks without foul sewerage provision [TAB] (p13)</p></div><div class="nugget-popup quant"><p>flood depths approximately 20&ndash;45cm across the area; residents displaced for 6&ndash;8 months [TAB] (p14)</p></div></div></body></div>`)[0];

                var html_b93fd91518ab894dd78ccb98f7649586 = $(`<div id="html_b93fd91518ab894dd78ccb98f7649586" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Station Lane, Offord Cluny</h1><div class="nugget-popup"><p>Reported as one of the three key risk areas where internal property flooding occurred; ingress of water into properties did not recede for a number of days. [PAG] (p11)</p></div><div class="nugget-popup"><p>Reported as one of three key risk areas where internal property flooding was recorded during the winter 2020/21 event. [PAG,IMG] (p12)</p></div><div class="nugget-popup"><p>Water levels rose rapidly on 23 December 2020, inundating Station Lane and nearby properties to a significant depth before receding. The banked railway acted as a barrier to runoff; outfalls to the main river were submerged. Overflow from a nearby Anglian Water pumping station was involved in local drainage. (p13)</p></div><div class="nugget-popup"><p>Properties internally flooded to shallow depths; gardens and outbuildings also inundated. Residents were displaced from their homes. [TAB] (p14)</p></div><div class="nugget-popup"><p>Reports of localised flooding on Station Lane associated with blocked/insufficient culverts, ditches and highway drainage. LLFA attended site to investigate, downstream investigations were initiated and highway gully cleansing frequency was increased as a response. [TAB] (p17)</p></div><div class="nugget-popup"><p>Station Lane experienced surface water flooding during the 23 December 2020 event. The investigation identified RMA operational issues and riparian maintenance issues as contributing factors to flooding at this location. [TAB] (p26)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 22 cm depth; receded within 5 hours (p13)</p></div><div class="nugget-popup quant"><p>internal flooding up to approximately 22cm; gardens and outbuildings up to approximately 60cm; residents displaced for over 1 month [TAB] (p14)</p></div></div></body></div>`)[0];

                var html_742566ffae2e99f45e28a951beccc012 = $(`<div id="html_742566ffae2e99f45e28a951beccc012" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Offord Cluny</h1><div class="nugget-popup"><p>As part of The Offords, Offord Cluny was within the area reported to have experienced significant flooding on 23 December 2020 and on 14 January 2021. The report and accompanying surface&ndash;water risk map show built&ndash;up areas (including parts of Offord Cluny) overlap medium/high surface&ndash;water risk zones, but the report does not specify which particular streets or properties in Offord Cluny were flooded. [PAG,IMG,MUL] (p7)</p></div><div class="nugget-popup"><p>Widespread flooding across the settlement with internal and external property flooding in multiple areas. Three key risk areas with internal property flooding were identified (High Street North; Station Lane; Parkway/Elm Close/Latin Close/New Road/High Street South). Ingress into properties did not recede for a number of days; some properties lost foul sewerage provision for about three weeks. Significant and prolonged flooding occurred along the B1043 High Street to the north, causing a full road closure. At least eight properties were rendered uninhabitable for between one and eight months. (p11)</p></div><div class="nugget-popup"><p>Extensive surface&ndash;water flooding at High Street (North) low spot and adjacent wetland overtopping, causing inundation of the B1043 carriageway, gardens and properties to the east and low rear spots. Flood depths reached approximately 45 cm; highway was closed for approximately 3 weeks; Anglian Water sewer system was impacted leaving some residents without foul sewerage for about 3 weeks. Ingress into properties did not recede for days and at least some properties were made uninhabitable for extended periods (see combined figures). [PAG,IMG] (p12)</p></div><div class="nugget-popup"><p>Flooding associated with the 23rd December 2020 event inundated properties in The Offords; residents were reported to have to leave their homes for around 6&ndash;8 months. Investigations identified a substantially blocked Network Rail railway culvert on High Street (North) as potentially critical to local flood risk and maintenance actions were confirmed. (p15)</p></div><div class="nugget-popup"><p>Rural road inundated with standing floodwater (photo Jan 2021); road surface damaged and scheduled for replacement after prolonged flooding and high groundwater; a Network Rail culvert in the vicinity was found to be substantially blocked and identified as potentially critical to local flood risk; some properties experienced loss of foul sewerage service associated with ingress to the sewer system. [IMG,MUL] (p16)</p></div><div class="nugget-popup"><p>Reported flooding prompted LLFA investigations and downstream inspections; highway response included cleansing of highway gullies across The Offords and increasing gully maintenance frequency (response to local flooding and drainage issues). [TAB] (p17)</p></div><div class="nugget-popup"><p>Experienced flooding and sewer&ndash;system impacts from excessive rainfall: highway gullies across The Offords required cleansing and gully maintenance frequency was increased; numerous properties were left without foul sewerage for an extended period, prompting response actions. [MUL] (p19)</p></div><div class="nugget-popup"><p>The village experienced flooding associated with the ordinary watercourse and blocked/undersized culverts on 23 December 2020. Post&ndash;event actions recorded include significant riparian maintenance and clearance of the ordinary watercourse and culverts under the railway to reduce future risk, and Parish Council work to prepare a Local Flood Plan. (p25)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>22 flood reports, 29 properties flooded internally, 31 properties flooded externally, 8 properties uninhabitable, road closure lasting approximately 3 weeks (Offord Cluny and Offord d'Arcy) (p11)</p></div><div class="nugget-popup quant"><p>45 cm; 3 weeks; 3 weeks; 8 properties (uninhabitable, at least) [PAG,IMG] (p12)</p></div></div></body></div>`)[0];

                var html_d8307221da6a3f79f807f3f07ae86045 = $(`<div id="html_d8307221da6a3f79f807f3f07ae86045" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Offord D'Arcy</h1><div class="nugget-popup"><p>Significant flooding occurred in the Offords settlement (which includes Offord D'Arcy) as a result of intense rainfall and existing ground conditions; flooding was exacerbated by high River Great Ouse levels and restricted discharge from an ordinary contributory watercourse. Large areas of the Offords are shown at significant risk from surface water flooding and parts of the built environment are in medium&ndash;high risk zones. [PAG,IMG,MUL] (p7)</p></div><div class="nugget-popup"><p>Widespread flooding across the settlement with internal and external property flooding in multiple areas. Three key risk areas with internal property flooding were identified (High Street North; Station Lane; Parkway/Elm Close/Latin Close/New Road/High Street South). Ingress into properties did not recede for a number of days; some properties lost foul sewerage provision for about three weeks. Significant and prolonged flooding occurred along the B1043 High Street to the north, causing a full road closure. At least eight properties were rendered uninhabitable for between one and eight months. (p11)</p></div><div class="nugget-popup"><p>Area&ndash;wide reporting to the LLFA shows multiple flood incidents across the villages: 22 community flood reports were received; properties experienced internal and external flooding; ingress did not recede for days, some properties were uninhabitable and there were prolonged sewer and highway impacts. [PAG,IMG] (p12)</p></div><div class="nugget-popup"><p>Flooding associated with the 23rd December 2020 event inundated properties in The Offords; residents were reported to have to leave their homes for around 6&ndash;8 months. Investigations identified a substantially blocked Network Rail railway culvert on High Street (North) as potentially critical to local flood risk and maintenance actions were confirmed. (p15)</p></div><div class="nugget-popup"><p>Rural road inundated with standing floodwater (photo Jan 2021); road surface damaged and scheduled for replacement after prolonged flooding and high groundwater; a Network Rail culvert in the vicinity was found to be substantially blocked and identified as potentially critical to local flood risk; some properties experienced loss of foul sewerage service associated with ingress to the sewer system. [IMG,MUL] (p16)</p></div><div class="nugget-popup"><p>Reported flooding prompted LLFA investigations and downstream inspections; highway response included cleansing of highway gullies across The Offords and increasing gully maintenance frequency (response to local flooding and drainage issues). [TAB] (p17)</p></div><div class="nugget-popup"><p>Experienced flooding and sewer&ndash;system impacts from excessive rainfall: highway gullies across The Offords required cleansing and gully maintenance frequency was increased; numerous properties were left without foul sewerage for an extended period, prompting response actions. [MUL] (p19)</p></div><div class="nugget-popup"><p>The village experienced flooding associated with the ordinary watercourse and blocked/undersized culverts on 23 December 2020. Post&ndash;event actions recorded include significant riparian maintenance and clearance of the ordinary watercourse and culverts under the railway to reduce future risk, and Parish Council work to prepare a Local Flood Plan. (p25)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>22 flood reports, 29 properties flooded internally, 31 properties flooded externally, 8 properties uninhabitable, road closure lasting approximately 3 weeks (Offord Cluny and Offord d'Arcy) (p11)</p></div><div class="nugget-popup quant"><p>22 flood reports; 29 properties reported flooded internally; 31 properties reported flooded externally; at least 8 properties uninhabitable for 1&ndash;8 months; full road closure lasting approximately 3 weeks; loss of foul sewerage provision for approximately 3 weeks (Offord Cluny and Offord d'Arcy) [PAG,IMG] (p12)</p></div></div></body></div>`)[0];
