                var html_88ed0704de1dd4828ee775bb58b4bfc0 = $(`<div id="html_88ed0704de1dd4828ee775bb58b4bfc0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Axminster</h1><div class="nugget-popup"><p>Axminster was one of the worst affected locations; flooding occurred from an ordinary watercourse and surface water runoff leading to internal property flooding as part of the 20&ndash;21 October 2021 event. [PAG] (p1)</p></div><div class="nugget-popup"><p>Identified as one of the worst&ndash;affected locations during the 20&ndash;21 October 2021 event; intense localised rainfall led to overwhelmed drainage and overtopping watercourses, causing severe surface water and river&ndash;related flooding and internal flooding of multiple properties. [PAG,IMG] (p4)</p></div><div class="nugget-popup"><p>Widespread surface water and ordinary watercourse (Millbrook Stream) flooding across the town. Overtopping of the Millbrook Stream and enhanced surface runoff caused internal flooding of properties and damage to gardens and outbuildings. [IMG] (p5)</p></div><div class="nugget-popup"><p>Properties in Axminster were flooded from overtopping and out&ndash;of&ndash;bank Millbrook flows and from culvert blockage/backing up. Impacts included internal property flooding, deep ground&ndash;floor flooding at one property, damage to public open space and footpaths, and large deposits of material. [PAG,IMG] (p7)</p></div><div class="nugget-popup"><p>Multiple watercourses and surface runoff caused widespread flooding across Axminster. The Weycroft area had nine properties flooded (three due to the River Axe overtopping and six primarily from ordinary watercourse and surface runoff). The flood bank upstream of Stoney Bridges was overtopped. Surface water runoff from adjacent farmland into Lodge Lane and overtopping of an unnamed ordinary watercourse caused significant flooding in Weycroft around 20:30&ndash;21:00 on 20 October 2021, which was then exacerbated by the Axe overtopping around 23:30 with peak river conditions at 00:05 and 03:00 on 21 October 2021. At least two other ordinary watercourses overtopped where culverted under the A358 during peak flows, causing property flooding in the southern urban extent. A local school and church also experienced surface water flooding; garden and road flooding occurred on multiple streets including Musbury Road, Fairy Lane, Lyme Road and Stoney Lane. [PAG] (p10)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 15 properties internally flooded; at least 10 properties primarily affected at the Willhay Lane culvert [IMG] (p5)</p></div><div class="nugget-popup quant"><p>At least 15 properties internally flooded; 3 properties flooded by backing up at Chard Road/Stoney Lane Culvert; 1 property with ground floor flooded up to 2m [PAG,IMG] (p7)</p></div><div class="nugget-popup quant"><p>9 properties (Weycroft); 3 properties (Axe&ndash;related); 6 properties (ordinary watercourse/surface runoff); 3 properties internally flooded up to 18 inches (45 cm) [PAG] (p10)</p></div></div></body></div>`)[0];

                var html_efb39c25aebccf1d5482c240833e8b40 = $(`<div id="html_efb39c25aebccf1d5482c240833e8b40" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Seaton</h1><div class="nugget-popup"><p>Seaton was one of the worst affected locations; flooding involved sewer, ordinary watercourse and surface water mechanisms and resulted in internal property flooding during the event. [PAG] (p1)</p></div><div class="nugget-popup"><p>Properties flooded from a combination of sewer, ordinary watercourse and surface water sources. [TAB] (p2)</p></div><div class="nugget-popup"><p>Intense, localised rainfall caused watercourses to overtop and drainage systems to be overwhelmed in Seaton, resulting in internal property flooding and localised surface water flooding of the public realm and highway. [PAG,IMG] (p4)</p></div><div class="nugget-popup"><p>Multiple watercourses overtopped and heavy surface&ndash;water runoff caused floodwater to reach lower&ndash;lying areas. Residential properties and community buildings experienced internal flooding with flood depths reported up to 100 mm. [IMG] (p12)</p></div><div class="nugget-popup"><p>Overtopping of multiple ordinary watercourses combined with surface water runoff caused substantial flooding of lower&ndash;lying areas of Seaton. Peak flows internally flooded properties (including at least five properties), a hospital and a primary school (internal flooding depths reported up to ~100 mm); floodwaters drained away within a short period allowing most residents to remain in their homes. Highways and car parks acted as storage; garden and garage flooding affected dozens of properties across the town. [PAG] (p13)</p></div><div class="nugget-popup"><p>Recent ordinary watercourse and surface water flooding affected Seaton; an ongoing local flood risk investigation will use information from the event to inform decisions and derive further actions to reduce long&ndash;term risk. [TAB] (p20)</p></div><div class="nugget-popup"><p>Recent flooding in the event has prompted an ongoing local flood risk investigation; the LLFA will use information from the event to inform the study and derive further actions to reduce ordinary watercourse and surface water flood risk. (p21)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>31 properties flooded [TAB] (p2)</p></div><div class="nugget-popup quant"><p>at least 5 properties; 1 hospital; 1 primary school; 5 properties on Scalwell Lane [IMG] (p12)</p></div><div class="nugget-popup quant"><p>5 properties; 1 hospital; 1 primary school [PAG] (p13)</p></div></div></body></div>`)[0];

                var html_c83c8e1599bfbb499e95e3761e6891a7 = $(`<div id="html_c83c8e1599bfbb499e95e3761e6891a7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kenton</h1><div class="nugget-popup"><p>Kenton was reported as affected by flooding from an ordinary watercourse during the 20&ndash;21 October 2021 event. [PAG] (p1)</p></div><div class="nugget-popup"><p>Flooding from an ordinary watercourse affected properties in Kenton. [TAB] (p2)</p></div><div class="nugget-popup"><p>Surface water and ordinary watercourse (culvert) overtopping on the evening of 20 October 2021 caused flooding in properties along Mamhead Road. Floodwaters overtopped when the culvert under Mamhead Road exceeded capacity (around 20:30&ndash;21:30), with waters receding within ~2 hours; high water reached the bumper level on parked cars and the Primary School was internally flooded, resulting in pupils losing multiple school days. (p14)</p></div><div class="nugget-popup"><p>Flooding concerns associated with the watercourse upstream of Kenton village were identified. LLFA actions include site visits to investigate potential unconsented structures that may have contributed to flood risk and advising affected property owners about Property Flood Resilience funding and measures. [TAB] (p20)</p></div><div class="nugget-popup"><p>Unconsented structures in the upstream ordinary watercourse were identified as a potential contributor to flooding risk for Kenton; LLFA to carry out site visits and take appropriate action on those structures to reduce flood risk. (p21)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 properties [TAB] (p2)</p></div><div class="nugget-popup quant"><p>4 properties; 1 Primary School (p14)</p></div></div></body></div>`)[0];

                var html_39db79b98bdd1c4888e87dedad4a2f8a = $(`<div id="html_39db79b98bdd1c4888e87dedad4a2f8a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Weycroft</h1><div class="nugget-popup"><p>Shown on Figure 4.1 as one of the locations in and around Axminster where ordinary watercourses were known to have overtopped during the flooding on 20 October 2021, contributing to localised flood impacts. [IMG] (p5)</p></div><div class="nugget-popup"><p>Nine properties in the Weycroft area flooded: three due to overtopping of the River Axe and six primarily due to ordinary watercourse overtopping and surface water runoff. Surface water/runoff into Lodge Lane and possible ordinary watercourse overtopping occurred around 20:30&ndash;21:00, then Axe overtopping around 23:30, with peak Axe conditions at 00:05 and 03:00 on 21 October 2021. At least three properties flooded internally by surface water experienced up to 18 inches (45 cm) of internal flooding. A flood warning for the River Axe was issued at 22:46 but many properties had already flooded from runoff&ndash;related impacts. (p9)</p></div><div class="nugget-popup"><p>Weycroft area of Axminster experienced property flooding driven by two mechanisms: surface&ndash;water / ordinary&ndash;watercourse runoff and overtopping of the River Axe. The flood bank upstream of Stoney Bridges was overtopped. Local surface&ndash;water runoff from adjacent farmland into Lodge Lane and overtopping of an unnamed ordinary watercourse caused significant flooding around 20:30&ndash;21:00 on 20 October 2021, which was then exacerbated by the Axe overtopping c.23:30 with river peaks around 00:05 and 03:00 on 21 October 2021. Residents received an EA River Axe warning at 22:46 but many properties had already flooded due to the surface&ndash;water event. [MUL] (p10)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>9 properties; 3 properties associated with River Axe; 6 properties associated with ordinary watercourse/surface runoff; at least three properties experienced up to 18 inches (45 cm) internal flooding (p9)</p></div><div class="nugget-popup quant"><p>9 properties; 3 properties; 6 properties; 3 properties (up to 18 inches / 45 cm internal flooding) [MUL] (p10)</p></div></div></body></div>`)[0];
