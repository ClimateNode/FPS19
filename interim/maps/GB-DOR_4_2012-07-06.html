                var html_93e30d18d41046eec448598d69085564 = $(`<div id="html_93e30d18d41046eec448598d69085564" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Dorset</h1><div class="nugget-popup"><p>Many parts of Dorset experienced the worst flooding for over ten years during the event (6&ndash;13 July 2012). Intense torrential rain caused flash flooding in rapid&ndash;response catchments, larger catchments were affected as floodwaters passed through rivers, and rapid rises in groundwater levels caused groundwater flooding to properties and roads. The rainfall triggered landslips (Eype, Lyme Regis, Beaminster Tunnel) and led to road damage and communities being cut off. (p2)</p></div><div class="nugget-popup"><p>Severe disruption was occurring across Dorset on 7 July 2012; the River Bride was placed on a Severe Flood Warning and the Flood Guidance Statement indicated a HIGH flood risk for Dorset as impacts were occurring. There was continuing rainfall with ongoing risk of surface water and river flooding in parts of the county. [PAG] (p8)</p></div><div class="nugget-popup"><p>By 15:00 on 7 July severe disruption was occurring across Dorset as the flood risk was assessed HIGH; the River Bride was on a Severe Flood Warning. Continued episodes of river and surface&ndash;water flooding caused repeated periods of MEDIUM risk (notably 9 July) with significant disruption expected; groundwater flooding began to be noted from 10 July and contributed to ongoing low&ndash;level flooding into mid&ndash;July. [PAG] (p9)</p></div><div class="nugget-popup"><p>Intense rainfall on already&ndash;saturated ground (6&ndash;7 July) produced rapid rises in river levels, raised groundwater and widespread ponding of surface water across many parts of the county. [IMG,PAG] (p12)</p></div><div class="nugget-popup"><p>Intense, slow&ndash;moving occluded frontal rainfall on 6&ndash;8 July 2012 produced runoff and caused flooding in parts of Dorset (particularly West Dorset). Rain gauges located within the flooded areas were used to assess the rarity/return period of the rainfall totals. [IMG,PAG] (p13)</p></div><div class="nugget-popup"><p>Across Dorset approximately 1,700 properties received fluvial and groundwater flood alerts and warnings during the July 2012 event. [TAB,PAG] (p16)</p></div><div class="nugget-popup"><p>Over 70 communities across the county were affected by flooding; multiple hub locations held flood clinics and agencies engaged with affected residents to record impacts and provide support. (p17)</p></div><div class="nugget-popup"><p>County&ndash;level map shows internal flooding incidents across Dorset with the most severe clusters in southern and southwestern parts (notably around Weymouth, Dorchester and Bridport). Darker&ndash;blue zones on the map indicate high incidence of internal (internal&ndash;property) flooding affecting communities and properties within the county. [IMG] (p25)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than 40 properties flooded along the South Winterbourne; three fatalities; 12m increase in groundwater levels (p2)</p></div><div class="nugget-popup quant"><p>approximately 1700 properties [TAB,PAG] (p16)</p></div><div class="nugget-popup quant"><p>over 70 communities; over 300 residents (p17)</p></div></div></body></div>`)[0];
