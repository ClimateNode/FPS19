                var html_fe4ce2a720e58e1a3d5f225621bd14b6 = $(`<div id="html_fe4ce2a720e58e1a3d5f225621bd14b6" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Didcot Parkway Station</h1><div class="nugget-popup"><p>The rail station was the subject of a flood incident investigation (document title identifies Didcot Rail Station as the location of the flood incident). (p1)</p></div><div class="nugget-popup"><p>Flooding at Didcot Railway Station on 31 May 2018 led to disruption at this transport interchange and required assistance to commuters and staff; the event prompted a formal investigation. [PAG,MUL] (p6)</p></div><div class="nugget-popup"><p>Internal flooding of the station property (the Parkway/Didcot Railway Station building). Surface water flooding affected the front of the station and Station Road; the site is at a local low point and drainage from gullies and surface water sewers (which discharge to a downstream Network Rail ditch) was a focus of the investigation. (p7)</p></div><div class="nugget-popup"><p>Flooding affected the main station building, the subway and the station car park; operations at the busy transport interchange were disrupted. Flooding was attributed to surface water sewer exceedance after severe rainfall, with several blockages in pipework (including road cones wedged in the sewer), debris at critical points and a grade 5 sewer defect contributing. Network Rail removed blockages in the forecourt drainage, improved sewer connectivity to under&ndash;car&ndash;park surface water storage tanks, cleared downstream ditch and repaired the sewer defect. (p9)</p></div><div class="nugget-popup"><p>Site was the subject of a flood incident investigation indicating the station was affected by flooding. [PAG] (p19)</p></div><div class="nugget-popup"><p>Floodwater entered a building on the station frontage adjacent to Didcot Parkway (map annotation: 'Flooding entered building here'). [PAG] (p21)</p></div></div></body></div>`)[0];

                var html_74cfce42a8c410f2ab561d42003faa00 = $(`<div id="html_74cfce42a8c410f2ab561d42003faa00" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Didcot</h1><div class="nugget-popup"><p>Didcot is named as the location of the flood incident report (the flood incident occurred in Didcot, the town containing the affected rail station). (p1)</p></div><div class="nugget-popup"><p>Flooding affected Didcot Railway Station on 31 May 2018, inundating station premises and prompting a formal Section 19 flood investigation by the Lead Local Flood Authority. [PAG] (p3)</p></div><div class="nugget-popup"><p>The flood at The Parkway/Didcot Railway Station on 31 May 2018 impacted the town's rail interchange, disrupting commuters and requiring emergency assistance. [PAG,MUL] (p6)</p></div><div class="nugget-popup"><p>The area around Didcot Railway Station experienced drainage system surcharge due to sewer blockages and pipe restrictions (including a blocked sewer near the Cow Lane underpass and debris near surface water storage tanks), contributing to flooding at the station/forecourt and associated underpass drainage problems. [PAG] (p8)</p></div><div class="nugget-popup"><p>Flooding at Didcot Railway Station and surrounding area was attributed to surface water sewer exceedance during severe rainfall; blockages in pipework, a grade 5 sewer defect and interceptor maintenance issues were identified as contributing factors. [PAG] (p10)</p></div><div class="nugget-popup"><p>Surface water and sewer&ndash;related flooding affected Didcot Railway Station and its immediate surroundings: floodwater entered the station entrance and the adjacent car park drainage was compromised. Blocked or inadequate surface water drains, gullies, highway culverts and a sewer syphon were identified as contributing issues and are the focus of recommended inspections and maintenance. [PAG] (p14)</p></div><div class="nugget-popup"><p>Didcot (specifically Didcot Railway Station) experienced flooding on 31 May 2018, triggering a multi&ndash;agency investigation and recommendations to address watercourse ownership/maintenance, drainage capacity and planning controls to reduce future flood risk. [PAG] (p16)</p></div></div></body></div>`)[0];
