                var html_2009713a005699cc73113dd12731bc23 = $(`<div id="html_2009713a005699cc73113dd12731bc23" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Region</h1><div class="nugget-popup"><p>Widespread surface water/urban flooding across the city led to a major&ndash;incident response; London Fire Brigade took many incident calls and crews worked across London to remove floodwater from properties. [PAG] (p6)</p></div><div class="nugget-popup"><p>Surface water and sewer flooding affected properties and local infrastructure across London boroughs, prompting multi&ndash;agency response and follow&ndash;up actions (reviews of Critical Drainage Areas, updates to the Multi&ndash;Agency Flood Plan, consideration of property&ndash;level resilience measures, gully cleaning frequency and sharing of sewer forecasts). [TAB] (p7)</p></div><div class="nugget-popup"><p>Internal flooding of properties in the Royal Borough of Kensington and Chelsea; the event prompted the local authority (RBKC) to commission a Section 19 flood investigation. (p14)</p></div><div class="nugget-popup"><p>Area surrounding Holland Park flooded badly due to intense, short&ndash;duration rainfall (rapid surface water/flash flooding). [TAB] (p29)</p></div><div class="nugget-popup"><p>Experienced intense rainfall on 12 July 2021 that led to surface&ndash;water/urban flooding in parts of the city (first reports of property flooding around 15:00, majority around 17:00). Emergency services and utilities were heavily engaged &mdash; London Fire Brigade took &gt;1,000 calls and Thames Water received nearly 4,000 calls (and ~7,000 online contacts) as customers sought help during the flooding. [PAG] (p56)</p></div><div class="nugget-popup"><p>A pump at Hammersmith Pumping Station failed and remained offline throughout the event, reducing the station's maximum capacity by 3.2 m3/s, affecting pumping capacity during the flood. (p57)</p></div><div class="nugget-popup"><p>Intense rainfall on 12 July 2021 caused surface water flooding and synchronized overland flows in dense urban streets; roads acted as channels conveying floodwater across Notting Hill and northern/central parts of the Royal Borough. Surcharged sewers produced fountains at manholes (reported at the junction of St Marks Road and Lancaster Road, and at Cornwall Crescent). Floodwater collected in basements and internal parts of properties, damaging interiors and business stock; Sloane Square Station experienced internal flooding. Heatmapping of flooded properties shows the highest concentrations in northern and central RBKC (Notting Hill area). [PAG,IMG] (p63)</p></div><div class="nugget-popup"><p>City&ndash;wide impacts from the intense rainfall and surface water flooding led to reduced journeys; Transport for London estimated an economic loss due to fewer journeys travelled per person. [PAG] (p72)</p></div><div class="nugget-popup"><p>Parts of London, including Kensington and Chelsea, experienced intense surface&ndash;water/flash flooding on 12 July 2021 that led to streets and properties being internally flooded and businesses damaged. (p73)</p></div><div class="nugget-popup"><p>The 12 July 2021 intense rainfall produced surface&ndash;water/urban flooding across London boroughs (including RBKC), prompting a London Resilience Partnership debrief, a mayoral roundtable and a Task and Finish Group to examine long&ndash;term surface water flood risk management. [PAG] (p97)</p></div><div class="nugget-popup"><p>On 12 July 2021 numerous flooding incidents occurred across the city. London Fire Brigade and Thames Water deployed teams city&ndash;wide; London Fire Brigade declared a major incident and worked through the night to remove floodwater and provide resources such as pumps and sandbags. Emergency services were heavily tasked and resources were stretched across multiple boroughs. (p105)</p></div><div class="nugget-popup"><p>Multiple London boroughs experienced flooding during the July 2021 storms, driving coordination actions such as sharing sewer forecasts, triaging flood reports, reviewing Multi&ndash;Agency Flood Plans, and implementing lessons from the London Resilience Partnership Debrief and Surface Water Flooding Task and Finish Group. [TAB,MUL] (p106)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 1,000 calls [PAG] (p6)</p></div><div class="nugget-popup quant"><p>at least 340 properties (p14)</p></div><div class="nugget-popup quant"><p>first flooding reports around 15:00; majority of reports around 17:00; more than 1,000 calls to London Fire Brigade; nearly 4,000 calls to Thames Water; nearly 7,000 online contacts to Thames Water [PAG] (p56)</p></div><div class="nugget-popup quant"><p>close to ␀A32,000,000 loss [PAG] (p72)</p></div></div></body></div>`)[0];

ing internal flooding to businesses and damage to stock. [PAG] (p72)</p></div><div class="nugget-popup"><p>During intense rainfall, waves of surface water were reported flowing from Portobello Road toward neighbouring streets, contributing to ponding and property flooding down&ndash;gradient. [TAB] (p77)</p></div><div class="nugget-popup"><p>Intense rainfall and surcharged drains caused large volumes of water to flow down the road flooding businesses and properties; basements were badly affected by sewer flooding (sewage coming up through toilets); vehicles created bow waves that inundated properties; floodwater largely drained away after about two hours as sewer levels lowered. [TAB] (p81)</p></div><div class="nugget-popup"><p>Intense rainfall and surcharged drains produced a large volume of water flowing down the road, flooding several businesses and inundating basements as sewer flooding came up through toilets; vehicles created bow waves that further inundated properties; many gullies were blocked and the water later drained away after about two hours. (p83)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one of 76 streets reported flooded [TAB] (p65)</p></div><div class="nugget-popup quant"><p>3 properties; average internal depth 140 cm; maximum internal depth 150 cm [TAB] (p81)</p></div></div></body></div>`)[0];

                var html_9414a29796b4c50033a8b60e307ac5bc = $(`<div id="html_9414a29796b4c50033a8b60e307ac5bc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Holland Villas Road, Kensington</h1><div class="nugget-popup"><p>Identified as one of the worst&ndash;affected streets during site visits; residents on Holland Villas Road reported flooding on 12 July 2021 with impacts to properties and ongoing community disruption. (p19)</p></div><div class="nugget-popup"><p>Recorded as flooded during the intense rainfall event on 12th July 2021; surface water inundation affected the street. [TAB] (p38)</p></div><div class="nugget-popup"><p>Reported as part of the connected street network (extending from Royal Crescent) that experienced surface water flooding and sewer surcharging; acted as a channel for floodwater, contributing to synchronisation of flows and elevated water levels. (p61)</p></div><div class="nugget-popup"><p>Properties on Holland Villas Road experienced internal flooding due to sewer capacity being exceeded and backflow through property drains, allowing water to enter properties (including basement&ndash;level flats) via toilets, sinks and drains. [TAB] (p64)</p></div><div class="nugget-popup"><p>Reported flooded on 12 July 2021; floodwater affected the street and was associated with overland flow accumulation at basement level and sewer backups entering properties. [TAB] (p65)</p></div><div class="nugget-popup"><p>Basement properties flooded by overland flows and by sewer surcharging; sewage rose from toilets and drains into basements, contaminating and staining walls and flooring which required replacement. [TAB] (p66)</p></div><div class="nugget-popup"><p>Floodwater collecting in basements and ground&ndash;floor properties due to overland flows from surcharged sewers and overflowing drains; sewer flooding also reported coming up from internal drains/toilets, causing interior damage. (p68)</p></div><div class="nugget-popup"><p>Sewers surcharged and manholes came up, causing heavy inundation; large volumes collected in basements and multiple properties were flooded internally, in some cases by more than a metre. Addisland Court was particularly badly affected with basements and ground floor inundated, car park flooded, building pumps overwhelmed and electrical/boiler services damaged, rendering flats uninhabitable and forcing temporary rehousing. [TAB] (p79)</p></div><div class="nugget-popup"><p>Drains and sewers were overloaded and (in one case) inadequate roof drainage led to very deep internal flooding of properties, including basement flooding. (p80)</p></div><div class="nugget-popup"><p>Recorded as having one of the largest maximum internal flood depths; inferred to have experienced internal flooding associated with sewer overflow events in the area. [TAB] (p85)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>13 properties [TAB] (p64)</p></div><div class="nugget-popup quant"><p>13 properties flooded; average internal depth 105 cm; maximum internal depth 300 cm; Addisland Court flood depths up to 3 m [TAB] (p79)</p></div><div class="nugget-popup quant"><p>maximum internal depth 100 cm; average internal depth 80 cm (p80)</p></div></div></body></div>`)[0];

div><div class="nugget-popup"><p>Sewer flooding rose through shower drains and toilets and caused internal flooding and property damage (Figure 9&ndash;7 top left). Flooding included sewage contamination that stained walls/flooring and required replacement, posing health risks. [PAG] (p70)</p></div><div class="nugget-popup"><p>The street experienced sewer surcharging and surface water collecting downhill; residents experienced sewer flooding coming up from basement toilets, roof/ceiling water ingress, and water entering properties. [TAB] (p77)</p></div><div class="nugget-popup"><p>Drains overflowed as sewers surcharged, causing floodwater to flow along the street into properties. Reports include sewage rising from toilets in basement flats, water entering from roofs/ceilings in at least one case, and Holland Park Station being flooded; the street&#8217;s downhill position caused water to collect. (p78)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>21 properties [TAB] (p64)</p></div><div class="nugget-popup quant"><p>one of 76 streets reported flooded [TAB] (p65)</p></div><div class="nugget-popup quant"><p>21 properties [TAB] (p77)</p></div><div class="nugget-popup quant"><p>5 properties flooded internally (across affected properties in this report); average internal depth 30 cm; maximum internal depth 30 cm (p78)</p></div></div></body></div>`)[0];

gget-popup"><p>Experienced very large internal flood depths caused by overloaded drains and sewers; properties suffered internal and basement flooding. (p80)</p></div><div class="nugget-popup"><p>Many properties were flooded internally: sewage backed up through toilets in basements and the majority were flooded by overflowing drains and manholes which collected in basements. One resident pumped out a very large volume; flooding persisted for about two hours before the water suddenly drained away. [TAB] (p84)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>17 properties [TAB] (p64)</p></div><div class="nugget-popup quant"><p>1 property (4 Royal Crescent) (p68)</p></div><div class="nugget-popup quant"><p>maximum internal depth 100 cm; average internal depth 80 cm (p80)</p></div><div class="nugget-popup quant"><p>17 properties flooded internally; average internal depth 60 cm; maximum internal depth 300 cm; 130 m³ pumped out by one resident; internal flooding up to 3 m; flooding lasted ~2 hours for several residents [TAB] (p84)</p></div></div></body></div>`)[0];

                var html_9eb511ebbe539337bb07bdc1fe8cb68b = $(`<div id="html_9eb511ebbe539337bb07bdc1fe8cb68b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ladbroke Road, Notting Hill</h1><div class="nugget-popup"><p>Internal flooding of properties on Ladbroke Road with substantial inundation of internal spaces reported by residents; ground&ndash;floor areas were flooded during the 12 July 2021 event. [PAG,IMG] (p90)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>average internal flood depth 62 cm [PAG,IMG] (p90)</p></div></div></body></div>`)[0];

                var html_cbe1cea2ba7a932260dd14949f251cff = $(`<div id="html_cbe1cea2ba7a932260dd14949f251cff" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Borough of Kensington and Chelsea</h1><div class="nugget-popup"><p>Extreme rainfall on 12 July 2021 caused internal flooding across the borough, resulting in flooded properties and overland flows that overwhelmed local drainage. (p5)</p></div><div class="nugget-popup"><p>Internal flooding of properties within the borough. (p14)</p></div><div class="nugget-popup"><p>On 12 July 2021 the borough experienced flooding that led to properties being flooded and road closures. Residents submitted photographs and reports of flooded properties which were used to document impacts. (p16)</p></div><div class="nugget-popup"><p>Council officers undertook site visits to the worst&ndash;affected areas of the borough following flooding. (p18)</p></div><div class="nugget-popup"><p>During the intense rainfall event on 12 July 2021 the borough experienced combined sewer and surface water flooding. The combined sewer system reached capacity, causing sewers to surcharge and stormwater to overflow via manholes onto roads, with roads then conveying water downhill according to local topography. The report identifies sewer and surface water flooding as the main cause of flooding in the July 2021 event. [PAG,IMG] (p22)</p></div><div class="nugget-popup"><p>During the 12 July 2021 event, sewer and surface&ndash;water flooding occurred across the borough: combined sewers reached capacity and surcharged, causing overflows via manholes and overland flow along roads; sewer flow was pushed up into properties (including basement properties) through toilets, sinks and shower drains as sewers backed up. (p23)</p></div><div class="nugget-popup"><p>During the intense rainfall on 12 July 2021 the borough experienced widespread surface water ponding and sewer surcharging. Sewers and drains reached capacity causing surcharges through manholes onto roads (roads acted as conveyance pathways) and floodwater entering properties, with basement properties particularly affected by backflow through toilets, sinks and shower drains. [PAG,IMG] (p27)</p></div><div class="nugget-popup"><p>Basements of properties were flooded; reports of basement flooding in the borough following the event. (p30)</p></div><div class="nugget-popup"><p>Surface water (urban) flooding occurred during the intense rainfall event on 12 July 2021. The Tidal Thames defences were reported as operating normally during the event (no overtopping or breach of tidal defences). (p36)</p></div><div class="nugget-popup"><p>Parts of the borough experienced surface water / urban flooding during the 12 July 2021 intense rainfall event; streets within the borough were listed as having been flooded in the report. [TAB] (p37)</p></div><div class="nugget-popup"><p>Surface water / urban flooding during the event on 12 July 2021 caused inundation of multiple streets in the borough; the streets listed in Table 6&ndash;1 (Stafford Terrace, Holland Road, Queensdale Road, Warwick Road, Holland Villas Road and Royal Crescent) were flooded. [PAG] (p38)</p></div><div class="nugget-popup"><p>On 12 July 2021 the borough experienced surface&ndash;water and sewer (urban) flooding: sewers surcharged, causing sewage and floodwater to back up into basements and via shower/toilet drains, manholes/fountains formed where sewers were surcharged, roads conveyed floodwater, floodwater collected in basements and internal flooding damaged business stock (including flooding inside Sloane Square station). [PAG,IMG] (p41)</p></div><div class="nugget-popup"><p>Intense convective rainfall on 12 July 2021 caused surface&ndash;water and sewer&ndash;related flooding across parts of the borough. The event prompted hydrological analysis (radar and gauge data) to quantify rainfall totals and understand the surface&ndash;water flooding response in the borough. [PAG,IMG] (p47)</p></div><div class="nugget-popup"><p>An intense band of rain formed rapidly over central London and produced high rainfall totals over the Royal Borough of Kensington and Chelsea between 15:00&ndash;18:00 on 12 July 2021. The heavy, concentrated rainfall caused surface&ndash;water/urban flooding in the borough and triggered the Section 19 flood investigation. [PAG,IMG] (p52)</p></div><div class="nugget-popup"><p>Intense convective rainfall on 12 July 2021 produced very high local rainfall totals across the borough (15:00&ndash;18:00), which led to surface water flooding across streets and public areas and caused sewer surcharge (fountains at manholes and internal sewer flooding) and internal flooding of properties and businesses. [PAG,IMG] (p53)</p></div><div class="nugget-popup"><p>Intense, short&ndash;duration rainfall on 12 July 2021 (starting around 15:00) produced surface water/urban flooding across the borough. Areas experienced highly variable return periods (southern parts <1 in 2 years; locations of heaviest rainfall in the borough up to around a 1 in 185‑year storm). A high Thames tide at Chelsea (15:45, 3.80mAOD) coincided with the heavy rainfall on 12 July. (p55)</p></div><div class="nugget-popup"><p>Interceptor and local sewers surcharged, causing flooding at street level; tide&ndash;locking impeded sewer discharge and increased manhole depths; operational failures at pumping stations contributed to borough&ndash;wide flooding. (p60)</p></div><div class="nugget-popup"><p>Intense rainfall and surcharged sewers produced overland flow across the borough. Roads acted as channels conveying floodwater (examples given: A3220, A40, Portobello Road). Surcharging sewers caused fountains at manholes (photographed at the junction of St Marks Road and Lancaster Road, and at Cornwall Crescent). High urban and hydrological connectivity synchronised flows across streets in the Notting Hill area and adjacent neighbourhoods&mdash;Portobello Road, Arundel Gardens, Elgin Crescent, Blenheim Crescent, Lower Clarendon Walk, St Marks Road, Camelford Court, Clarendon Road&mdash;and a wider corridor including Royal Crescent, Holland Villas Road, Bramley Road, St Anns Road, Stoneleigh Street, St Anns Villas, St James's Gardens, Norland Square, Queensdale Road, Princedale Road, Holland Park Avenue, Addison Road, Warwick Road, Napier Road, Edwardes Square, Cope Place and Scarsdale Villas, all of which contributed to and experienced surface water/sewer&ndash;driven flooding on 12 July 2021. [PAG,IMG] (p63)</p></div><div class="nugget-popup"><p>Properties recorded as flooded; floodwater entered properties via backflow through property drains into basement flats (through toilets, sinks and drains). [TAB,PAG] (p64)</p></div><div class="nugget-popup"><p>Flooding across the borough affected properties and basements: surface water and sewage&ndash;contaminated water entered properties (including basements and bathrooms), causing internal flooding, sewage contamination and damage to fixtures, finishes and fittings on multiple streets. [PAG] (p69)</p></div><div class="nugget-popup"><p>Council&ndash;owned properties were internally flooded with sewage and overland floodwater; sewage staining required replacement of walls and flooring and posed health risks. The Council incurred substantial costs responding and repairing flood&ndash;damaged properties and providing temporary accommodation. [PAG] (p70)</p></div><div class="nugget-popup"><p>Within the Royal Borough of Kensington and Chelsea, 76 streets were reported to have flooded on 12 July 2021; properties were internally flooded (receptors), business stock was damaged (e.g. Portobello Road), and three primary schools (Colville Primary, Thomas Jones Primary, Avondale Park Primary) experienced internal flooding. The borough&#8217;s records note that many flooded streets had at least one FLIP installed yet some properties still flooded. (p73)</p></div><div class="nugget-popup"><p>Widespread intense rainfall caused surface water and combined sewer systems to exceed capacity across the borough, leading to sewers surcharging, manhole overflows and multiple basement and ground&ndash;floor property inundations on several streets. [TAB] (p79)</p></div><div class="nugget-popup"><p>Widespread internal flooding across the borough during the intense rainfall on 12th July 2021. Multiple streets and properties experienced internal flooding; sewer surcharge and surface&ndash;water flow pathways contributed to internal property flooding and sewer&ndash;related issues. [PAG] (p90)</p></div><div class="nugget-popup"><p>Widespread flooding across the borough on 12 July 2021: 76 streets were reported to have flooded, with internal flooding of properties (including basements), sewer surcharging (manhole fountains and sewage entering buildings) and roads acting as channels conveying floodwater. Businesses suffered internal flooding and stock damage (for example reported at Portobello Road) and Sloane Square Station experienced internal flooding. Many flooded streets had FLIPs installed but some of those properties still experienced internal flooding. [PAG,IMG] (p91)</p></div><div class="nugget-popup"><p>The borough experienced intense surface&ndash;water/urban flooding on 12 July 2021 that triggered the Section 19 investigation and ongoing engagement with Thames Water over sewer and asset performance; RBKC has been actively engaged with Thames Water's independent review on behalf of residents. (p92)</p></div><div class="nugget-popup"><p>Surface water / urban flooding on 12 July 2021 produced very short warning lead times for the borough, affected properties and local emergency decision&ndash;making, and led to recommendations that the borough seeks funding for Property Flood Resilience (PFR) schemes, develops local surface&ndash;water forecasting, and coordinates with other Risk Management Authorities. [PAG] (p95)</p></div><div class="nugget-popup"><p>The borough collected reports of internal property flooding following the 12 July 2021 event and ran the Section 19 investigation questionnaire; over 300 responses were submitted to the RBKC questionnaire. Initial reports of flooding within the borough were received by local teams during the event. (p96)</p></div><div class="nugget-popup"><p>As the local authority, RBKC was required to update and consolidate three existing Multi&ndash;Agency Flood Plans into a single Multi&ndash;Agency Flood Plan, to review it annually and after events, and to introduce a training and exercising framework. RBKC is also tasked with supporting London&ndash;wide actions on rest centre standards and ensuring critical infrastructure sites (points of contact, contingency plans, protection resources and business continuity arrangements) are included in the MAFP. (p100)</p></div><div class="nugget-popup"><p>The area experienced intense rainfall on 12 July 2021 that produced overland flows and caused sewer surcharge, leading to internal property flooding (including basement inundation) and surface flooding of streets. Borough authorities undertook Section 19 investigation and coordinated response and recovery actions. (p105)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least 340 properties (p5)</p></div><div class="nugget-popup quant"><p>at least 340 properties (p14)</p></div><div class="nugget-popup quant"><p>less than 10 reports of basement flooding (p30)</p></div><div class="nugget-popup quant"><p>manhole depths increased by 0.5m; fountains at surcharged manholes rose to over 1m (p60)</p></div><div class="nugget-popup quant"><p>5 properties [TAB,PAG] (p64)</p></div><div class="nugget-popup quant"><p>76 streets reported flooded; around 65% of flooded streets had at least one FLIP installed; highest average internal flood depth reported on a street ~140 cm. [PAG] (p90)</p></div><div class="nugget-popup quant"><p>at least 76 streets; over 340 properties (p105)</p></div></div></body></div>`)[0];
                popup_7dd81d709a10e31532cda5686dc62324.setContent(html_cbe1cea2ba7a932260dd14949f251cff);

                var html_c39ea79cbb4c123e64f2b08e969bbde1 = $(`<div id="html_c39ea79cbb4c123e64f2b08e969bbde1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Notting Hill</h1><div class="nugget-popup"><p>Area experienced the heaviest rainfall during the 12 July 2021 storm; this extreme rainfall is described in the report as likely to have caused the observed flooding in the borough. (p5)</p></div><div class="nugget-popup"><p>Radar&ndash;derived estimates show Notting Hill (radar grid square 152) received the heaviest rainfall in RBKC during the 12 July 2021 storm, an intensity estimated up to a 1&ndash;in&ndash;185&ndash;year event, producing intense short&ndash;duration runoff and surface water flooding in the areas that experienced the heaviest rainfall. (p55)</p></div><div class="nugget-popup"><p>Intense rainfall combined with surcharged sewers produced overland flow across the Notting Hill area; roads acted as channels conveying floodwater and sewers discharged at manholes, increasing local water levels and causing urban flooding. (p61)</p></div><div class="nugget-popup"><p>Intense rainfall and surcharging of sewers produced overland flow through the Notting Hill area. Roads (including Portobello Road and Ladbroke Grove) acted as channels conveying water, synchronising flows from neighbouring streets and increasing water levels. Specific streets in the Notting Hill area reported overland flow and property flooding: Arundel Gardens, Elgin Crescent, Blenheim Crescent, Lower Clarendon Walk, St Marks Road (junction with Lancaster Road reported manhole fountains), Camelford Court and Clarendon Road. Flooded properties are concentrated in this area as shown in the report heatmap. [IMG] (p63)</p></div><div class="nugget-popup"><p>Internal flooding affected businesses on Portobello Road (photograph reproduced from My London shows internal flooding damaging stock). The area also shows a high concentration of FLIPs in the borough FLIP heatmap, indicating properties in this area were subject to flood risk and some properties with FLIPs suffered flooding during the event. [PAG,IMG] (p91)</p></div><div class="nugget-popup"><p>Notting Hill experienced the heaviest rainfall during the storm on 12 July 2021 (the maximum local return period was estimated up to 1 in 185 years), contributing to local surface water and urban flooding across the area. (p105)</p></div></div></body></div>`)[0];

                var html_01afb4f50afe0e0a6d8fc0f9aab4c2ec = $(`<div id="html_01afb4f50afe0e0a6d8fc0f9aab4c2ec" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>North Kensington</h1><div class="nugget-popup"><p>Area experienced intense rainfall&ndash;driven overland flow and sewer surcharge causing flooding of properties and community assets in North Kensington. (p6)</p></div><div class="nugget-popup"><p>Identified as a Critical Drainage Area with complex surface water and sewer interactions; susceptible to pooling and sewer surcharge leading to overland flows and potential internal sewer flooding to properties during the July 2021 event. (p23)</p></div><div class="nugget-popup"><p>Areas of northern Kensington (around Royal Crescent and Holland Villas Road) experienced overland flow driven by intense rainfall and hydraulic connectivity between streets. Flood pathways are described starting from Bramley Road and running south through St Anns Road, Stoneleigh Street to St Anns Villas, then through St James's Gardens, Norland Square, Queensdale Road, Princedale Road, Royal Crescent, Holland Park Avenue and onward to Holland Villas Road, Addison Road, Warwick Road, Napier Road, Edwardes Square, Cope Place and Scarsdale Villas. These streets are reported as having contributed to and experienced surface water flooding and sewer surcharging. [IMG] (p63)</p></div></div></body></div>`)[0];

                var html_3d93126fcb553c76f902e207690ba171 = $(`<div id="html_3d93126fcb553c76f902e207690ba171" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lancaster West Estate</h1><div class="nugget-popup"><p>Several properties that are part of Lancaster West Estate were flooded during the event, with basement and internal flooding reported due to overland flow and sewer surcharge. (p6)</p></div><div class="nugget-popup"><p>Basement properties were flooded by overland flows collecting at basement level and by sewer flooding that came up from toilets and drains at basement level; sewage contaminated walls and flooring requiring replacement. Lancaster West Estate incurred repair and rehousing costs. (p67)</p></div><div class="nugget-popup"><p>Floodwater entered commercial and operational premises on the estate (including the Baseline Studios), causing internal flooding and damage to business stock and property. (p72)</p></div><div class="nugget-popup"><p>A large local sewer across the estate surcharged, causing manhole discharge and floodwater to inundate basement areas across the estate; basement depths were greater than at nearby Barandon Walk though impact was reduced where basements were used for car parking. [TAB] (p87)</p></div><div class="nugget-popup"><p>Lancaster (Lancaster West estate) was put forward for SuDS retrofitting as part of climate adaptation work after the intense rainfall on 12 July 2021, indicating the estate experienced surface water/urban flooding during the event; the report notes rainfall exceeded SuDS design standards so retrofit could reduce but not eliminate flooding. (p92)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>33 council&ndash;owned commercial and operational properties affected (including premises in Baseline Studios on Lancaster West Estate) (p72)</p></div></div></body></div>`)[0];

                var html_c75089fc7725ff936cb08ce755381619 = $(`<div id="html_c75089fc7725ff936cb08ce755381619" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kensington</h1><div class="nugget-popup"><p>Area was identified among the worst affected during the 12 July 2021 event; council officers conducted site visits, met residents who gave first&ndash;hand accounts of flooding and observed continuing impacts on individuals and the community. [PAG] (p19)</p></div><div class="nugget-popup"><p>Area identified as a Critical Drainage Area with complex interaction of surface water and sewer flooding during the July 2021 event; sewers surcharged and overland flow conveyed along roads, with risk of internal sewer flooding to properties (notably basements) as sewers reached capacity. [PAG] (p23)</p></div><div class="nugget-popup"><p>Identified in the report as a Critical Drainage Area where complex interactions of surface water and sewer flooding occur; therefore Kensington was susceptible to pooling and sewer surcharge during the intense rainfall on 12 July 2021, contributing to local flooding and impacts on properties (including basements) in the area. [PAG,IMG] (p27)</p></div><div class="nugget-popup"><p>Kensington (within the Royal Borough) was within the area over which an intense, fast&ndash;moving band of rain passed on 12 July 2021 (15:00&ndash;18:00). This produced high local rainfall totals and contributed to surface&ndash;water/urban flooding in the area investigated by the Section 19 report. [PAG,IMG] (p52)</p></div><div class="nugget-popup"><p>The Holland Park / Kensington area (Holland Park PS catchment / grid square 120) experienced the most intense rainfall during 15:00&ndash;18:00 on 12 July 2021, producing very high HYRAD pixel totals within the catchment and contributing to localized surface water flooding and rapid runoff that overwhelmed drainage and sewers. [IMG,PAG] (p53)</p></div><div class="nugget-popup"><p>Kensington experienced widespread surface&ndash;water and sewer&ndash;surcharge driven overland flooding on 12 July 2021. Dense urban connectivity caused flows from neighbouring streets to synchronise, increasing water levels and causing many streets and properties (including basements) to flood; manholes were observed fountain­ing as sewers surcharged and roads conveyed large volumes of water. [IMG] (p62)</p></div><div class="nugget-popup"><p>Local area experienced intense rainfall&ndash;driven flooding: streets and buildings (including schools, community facilities and residences) were affected by surface water and sewer surcharging, with sewage surfacing and entering properties. [TAB] (p86)</p></div><div class="nugget-popup"><p>Areas of central and northern Kensington are shown to have high concentrations of FLIPs and the report notes that there are properties with FLIPs that nevertheless suffered internal flooding during the 12 July 2021 event; this indicates parts of Kensington experienced internal and sewer&ndash;related flooding on that date (specific streets and property counts for Kensington not given). [PAG,IMG] (p91)</p></div></div></body></div>`)[0];
