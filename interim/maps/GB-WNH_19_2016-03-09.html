                var html_938845e60c4dead27abf265c51e1d6a1 = $(`<div id="html_938845e60c4dead27abf265c51e1d6a1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Banbury Road</h1><div class="nugget-popup"><p>Internal flooding of property on Banbury Road due to overtopping of the adjacent watercourse onto Banbury Road. [TAB,PAG,MUL] (p12)</p></div><div class="nugget-popup"><p>Culverts under Banbury Road had insufficient capacity; upstream watercourse depth increased and spilled onto Banbury Road causing ponding extending approximately 50 metres west and 30 metres east. Floodwater surrounded and entered a property on Banbury Road (entered front door and came up through the floor), leaving internal flooding (ground floor ~100mm, deeper in some sunken rooms) and external areas up to 600mm depth. Floodwater receded over a few hours leaving mud throughout; professional cleaners were employed. Surface water and agricultural run&ndash;off flowed north within the carriageway and likely contributed. Five cars became stuck in the flood water on Banbury Road and were written off. (p14)</p></div><div class="nugget-popup"><p>Culverts beneath Banbury Road were identified as a restriction on the north/south watercourse flow; this likely contributed to the watercourse overtopping onto the road and to internal flooding of a property. (p15)</p></div><div class="nugget-popup"><p>Banbury Road is shown crossed by an identified culvert (Q2/A) and by mapped overland flow routes; the incident plan indicates surface&ndash;water/overland flooding affected Banbury Road during the 9 March 2016 event, with flood flow routes crossing the carriageway near the culvert location. [IMG] (p33)</p></div><div class="nugget-popup"><p>Road was inundated by floodwater; the incident was documented in photographs taken by the local Parish Council. [PAG] (p54)</p></div><div class="nugget-popup"><p>Floodwater covered the entire width of the road, rendering it impassable for vehicles and pedestrians and causing local transport disruption; people and a vehicle were observed at the far end assessing or held up by the flooding. [IMG,PAG] (p55)</p></div><div class="nugget-popup"><p>Road overtopped by floodwater flowing from adjacent fields across the carriageway; rendered impassable and threatening nearby houses and roadside infrastructure. [IMG,PAG] (p56)</p></div><div class="nugget-popup"><p>Floodwater entered the property, inundating exterior areas (outbuilding/garage) and multiple interior rooms including a living area and kitchen, causing substantial water intrusion and likely property damage and disruption to the household. [IMG,PAG] (p57)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>50 metres; 30 metres; 1 property; 300 mm; 100 mm; 600 mm; 5 cars (p14)</p></div><div class="nugget-popup quant"><p>one property (p15)</p></div><div class="nugget-popup quant"><p>two people; one vehicle [IMG,PAG] (p55)</p></div></div></body></div>`)[0];

                var html_4e4431fcbcc971b44e6a19903998cb96 = $(`<div id="html_4e4431fcbcc971b44e6a19903998cb96" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Moreton Pinkney</h1><div class="nugget-popup"><p>Site of the flood incident on 9 March 2016 where surface water and watercourse runoff led to internal flooding of at least one property. (p7)</p></div><div class="nugget-popup"><p>A flood incident occurred in the village (Banbury Lane) causing internal flooding of at least one property on 9 March 2016; the village has experienced repeat internal flooding of that property within the last five years. [PAG,MUL] (p9)</p></div><div class="nugget-popup"><p>The village experienced surface water and ordinary watercourse (fluvial) flooding that led to internal flooding of properties; areas either side of the watercourse through the village are shown as Flood Zone 3 (functional floodplain). [PAG] (p10)</p></div><div class="nugget-popup"><p>Heavy rainfall on a saturated catchment caused local watercourses and drainage to be unable to convey flows. Culverts under Banbury Road had insufficient capacity causing upstream water to overtop and pond on Banbury Road (approx. 50 m west and 30 m east). Floodwater surrounded and entered a property on Banbury Road (entered front door, came up through the floor) producing internal flooding and mud throughout; external partially enclosed areas of the same property were filled to depths up to 600 mm. Five cars became stuck on Banbury Road and were written off. Surface water and agricultural run&ndash;off contributed to carriageway flooding. At the south/north watercourse at Brook Street flows rose, overtopped and extended up Brook Street, affecting surrounding land and gardens; gardens of three properties on Brook Street were affected. Floodwater subsequently receded over a few hours leaving mud and requiring professional cleaning. [PAG] (p14)</p></div><div class="nugget-popup"><p>Heavy rainfall on a saturated catchment caused drainage systems and local watercourses to be unable to convey rainwater to larger watercourses north of the village. This led to watercourses overtopping and overland flow following natural contours to low points around private properties, resulting in internal flooding. [PAG] (p15)</p></div><div class="nugget-popup"><p>The watercourse immediately north of Brook Street has variable width/depth and obstructions (footbridges, land slips, fallen trees and vegetation) that slowed conveyance, leading to channel deepening and causing flooding that affected the village and put residents at risk. [PAG] (p16)</p></div><div class="nugget-popup"><p>The village experienced flooding which prompted a Section 19 investigation by the Lead Local Flood Authority (NCC); NCC can suggest causes and make recommendations to mitigate flood risk in the village. (p18)</p></div><div class="nugget-popup"><p>A flood incident is annotated near the eastern edge of the village; the map shows the catchment boundary that contributed to that flood incident and encloses the majority of the village. [IMG] (p32)</p></div><div class="nugget-popup"><p>Schematic areas of flooding are shown within and near Moreton Pinkney associated with overland surface water flow converging on the main watercourse. Key drainage chokepoints identified include a culvert under Banbury Road (Q2/A) and a ford at Brook Street (Q3/A), with main routes of overland flow directed towards the village watercourse during the flood incident. [IMG,TAB] (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property (p7)</p></div><div class="nugget-popup quant"><p>1 property [PAG,MUL] (p9)</p></div><div class="nugget-popup quant"><p>over 70 properties; over 200 reports of flooding [PAG] (p10)</p></div><div class="nugget-popup quant"><p>5 cars; three properties; ponding extent approximately 50 metres to the west and 30 metres to the east on Banbury Road; internal flooding depth of approximately 100 mm in the ground floor; property surrounded by floodwater to approximately 300 mm; external areas flooded to depths up to 600 mm. [PAG] (p14)</p></div><div class="nugget-popup quant"><p>one property [PAG] (p15)</p></div></div></body></div>`)[0];
