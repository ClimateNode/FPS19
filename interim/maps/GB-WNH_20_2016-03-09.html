                var html_8a66700a9933acacc77c1ad195dd669d = $(`<div id="html_8a66700a9933acacc77c1ad195dd669d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Watery Lane, Nether Heyford</h1><div class="nugget-popup"><p>Internal flooding of a property where excess surface water (from heavy rainfall on a saturated catchment and ordinary watercourse/ runoff) flowed to low points around private property; below&ndash;ground drainage systems were unable to collect and convey the rainwater, contributing to the internal flooding. [MUL] (p7)</p></div><div class="nugget-popup"><p>Internal flooding of property(ies) on Watery Lane during the event; one property experienced internal flooding on 9 March 2016 and the property has been internally flooded on more than one occasion within the previous five years. [MUL] (p9)</p></div><div class="nugget-popup"><p>Surface water flowed down Watery Lane causing internal flooding of a property; a garage was flooded on one property and at another property garage doors prevented internal garage flooding but the driveway and garden were flooded. [TAB,MUL] (p12)</p></div><div class="nugget-popup"><p>Deluge of water flowed down Watery Lane; manhole covers lifted and the road surface raised (damage to carriageway). Two properties on Watery Lane were affected by flooding. (p14)</p></div><div class="nugget-popup"><p>Flooding on Watery Lane was caused by exceedance of the Heyford Brook and South View Brook culverts at manhole chambers on Bugbrooke Road near The Green, resulting in surface water and water discharging from manholes and flowing over ground towards low points around properties. Poorly maintained ditch and pipework alongside the allotments reduced drainage effectiveness despite highway gullies being in working order. (p15)</p></div><div class="nugget-popup"><p>Ditches and pipework alongside the allotments on Watery Lane were in poor maintenance, reducing drainage effectiveness. Properties situated at localised low points on Watery Lane were vulnerable to overland flow of surface water running off the highway and were affected during the incident. [PAG] (p16)</p></div><div class="nugget-popup"><p>Overland surface&ndash;water flow and localised flooding occurred along Watery Lane during the incident on 9th March 2016; the incident plan shows Watery Lane within the mapped overland flow/flood schematic area and flow arrows directing surface water eastward across the lane. [IMG] (p34)</p></div><div class="nugget-popup"><p>Surface water flowed from Bugbrooke Road along Watery Lane, causing pooling and runoff on the road and adjacent grass verge. [IMG,PAG] (p45)</p></div><div class="nugget-popup"><p>Floodwater inundated the driveway of a residential property at the north end of Watery Lane, covering the entire driveway, reaching a brick wall and the bases of large potted plants, and extending towards the street &mdash; impacting residential access and threatening property. [IMG,PAG] (p51)</p></div><div class="nugget-popup"><p>Floodwater covered the full width of the road and extended onto adjacent driveways and front gardens; water lapped at refuse bins and partially surrounded a parked vehicle, restricting access along the street and onto properties. [IMG,PAG] (p52)</p></div><div class="nugget-popup"><p>The full carriageway was covered by muddy floodwater, impeding vehicle movement and threatening access to adjacent properties; water reached above the bottoms of vehicle wheels in places while pavements remained mostly clear. [IMG,PAG] (p53)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property [MUL] (p7)</p></div><div class="nugget-popup quant"><p>1 property; more than one occasion in last 5 years [MUL] (p9)</p></div><div class="nugget-popup quant"><p>internal flooding of 1 property; 1 garage flooded; 1 property driveway and garden flooded [TAB,MUL] (p12)</p></div><div class="nugget-popup quant"><p>two properties; road surface raised over 1 ft (p14)</p></div><div class="nugget-popup quant"><p>1 driveway (residential property at north end of Watery Lane) [IMG,PAG] (p51)</p></div><div class="nugget-popup quant"><p>one vehicle partially surrounded by floodwater [IMG,PAG] (p52)</p></div><div class="nugget-popup quant"><p>1 street inundated; 1 parked car affected [IMG,PAG] (p53)</p></div></div></body></div>`)[0];

                var html_461d56bf59050c5b10241c993ef10695 = $(`<div id="html_461d56bf59050c5b10241c993ef10695" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Northamptonshire</h1><div class="nugget-popup"><p>Widespread flooding across the county on 9 March 2016 from heavy rainfall (approx. 30mm in 12 hours) caused surface water runoff, agricultural runoff and ordinary watercourse flooding, resulting in internal flooding across the county and numerous reports of flooding. (p7)</p></div><div class="nugget-popup"><p>During the event on 9 March 2016 parts of Northamptonshire experienced flooding from a combination of agricultural runoff, surface water runoff and ordinary watercourse flooding; this resulted in internal flooding and multiple reports across the county. [PAG] (p9)</p></div><div class="nugget-popup"><p>Heavy rain on 9th March 2016 exceeded the capacity of culverted watercourses causing surface water to pool and flow in the Nether Heyford area. Water pooled to around 300 mm depth at the Braybrooke Road / Watery Lane junction; surface water flowed down Watery Lane. One property on Watery Lane suffered internal flooding. A second property on Watery Lane had its garage protected by closed garage doors, but its driveway and garden were flooded. (p13)</p></div><div class="nugget-popup"><p>Heavy rainfall on a saturated catchment in Northamptonshire (affecting Nether Heyford) caused drainage systems and culverts to be exceeded, producing surface water flooding that affected streets, fields and properties. Waters rose up to around 3 ft in places; river monitoring recorded a rise of 1.8 m at nearby gauges; waters had receded by 5pm on 10 March 2016. [MUL] (p15)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 70 properties; over 200 reports of flooding (p7)</p></div><div class="nugget-popup quant"><p>over 70 properties; over 200 reports of flooding [PAG] (p9)</p></div><div class="nugget-popup quant"><p>2 properties; 300 mm water depth at Braybrooke Road/Watery Lane junction (p13)</p></div><div class="nugget-popup quant"><p>up to 3 ft deep in places; rise of 1.8 m recorded [MUL] (p15)</p></div></div></body></div>`)[0];

                var html_f7c43e42baddc813133e0ca01ec9d409 = $(`<div id="html_f7c43e42baddc813133e0ca01ec9d409" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Nether Heyford</h1><div class="nugget-popup"><p>Subject of a Northamptonshire County Council flood investigation for Watery Lane (report title indicates flooding at Watery Lane, Nether Heyford). (p2)</p></div><div class="nugget-popup"><p>The village experienced excess surface water runoff and ordinary watercourse flooding during the event at Watery Lane, resulting in internal flooding of a property on Watery Lane. [MUL] (p7)</p></div><div class="nugget-popup"><p>Nether Heyford experienced flooding during the 9 March 2016 event; residents were affected and consulted as part of the investigation. At least one property in the village (on Watery Lane) suffered internal flooding. [PAG] (p9)</p></div><div class="nugget-popup"><p>The village experienced flooding from a combination of agricultural runoff, surface water runoff and ordinary watercourse flooding, resulting in internal flooding of properties and numerous flood reports. [PAG] (p10)</p></div><div class="nugget-popup"><p>Heavy rainfall on a saturated catchment caused drainage systems and culverts to be unable to convey and dispose of rainwater. Surface water emerged from manhole covers and flowed over ground following natural contours to low points around private properties, resulting in flooding of properties in the village. [PAG] (p16)</p></div><div class="nugget-popup"><p>Schematic flood areas on the incident plan are concentrated in the eastern and northeastern parts of Nether Heyford. Overland flow routes shown on the plan indicate surface&ndash;water flooding in the village during the incident, driven by flows along Heyford Brook, culverted sections and outlets to Horseton Brook at key junctions. [IMG] (p34)</p></div><div class="nugget-popup"><p>Photographs submitted by the Community Flood Group (Appendix H) show watercourses and culvert inlets/outlets (Heyford Brook culvert and South View culvert) discharging into Horestone/Bugbrooke Brook and floodwater affecting the north end of Watery Lane. Floodwater inundated the inlet/outlet structures and reached the driveway and property frontages at the north end of Watery Lane. (p54)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property [MUL] (p7)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p9)</p></div><div class="nugget-popup quant"><p>over 70 properties flooded internally; over 200 reports of flooding [PAG] (p10)</p></div></div></body></div>`)[0];
