                var html_77bb99a5114b74f0eed7f719fb4116c7 = $(`<div id="html_77bb99a5114b74f0eed7f719fb4116c7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Kimberley</h1><div class="nugget-popup"><p>Following a prolonged period of heavy rainfall on 24 September 2019 (around 10:00am) parts of Kimberley were subject to significant floodwater. Flooding affected properties along Main Street and areas adjacent to the low point on Eastwood Road. Seven businesses suffered internal flooding and additional businesses struggled to keep floodwater out of their premises. [IMG,PAG] (p1)</p></div><div class="nugget-popup"><p>Parts of Kimberley were subject to significant floodwater following an intense 3&ndash;hour downpour; 7 businesses were internally flooded and additional businesses struggled to keep floodwater out. Flooding was concentrated along the Main Street and adjacent to the low point on Eastwood Road. (p2)</p></div><div class="nugget-popup"><p>An intense three&ndash;hour downpour over the built&ndash;up urban area produced rapid overland flow across impermeable surfaces, with flows running down side streets into the valley floor and converging at the town centre (notably the intersection of High Street and Main Street). Consequences across the town included drainage capacity exceedance (e.g. Sainsbury's car park and rear building flooding), and manholes lifting in rear gardens and on side roads as smaller drains and combined sewers struggled to cope. [IMG] (p3)</p></div><div class="nugget-popup"><p>Widespread surface water from heavy rainfall overwhelmed local drainage: the rear car park of Sainsbury's reached capacity and flooded into the rear of the building; manholes were observed lifting in rear gardens and on side roads as smaller connecting drains struggled; rapid surface runoff along Main Street bypassed gullies and ran onto footpaths via low/drop kerbs, flooding low&ndash;threshold business entrances; ponding at a low point on Eastwood Road left vehicles stranded and caused flooding of the adjacent Broxtowe Borough Council Depot; the low point junction of Church Hill was also inundated with vehicles partially submerged. [IMG] (p4)</p></div><div class="nugget-popup"><p>Businesses in Kimberley were affected by the flood event; local economic support/advice may be offered to affected businesses by the county council's Growth and Economic Development Team and The Growth Hub. (p6)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>7 businesses [IMG,PAG] (p1)</p></div><div class="nugget-popup quant"><p>7 businesses (p2)</p></div></div></body></div>`)[0];
