                var html_185ac3e61503a86862407fab5491bfb4 = $(`<div id="html_185ac3e61503a86862407fab5491bfb4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Corbridge</h1><div class="nugget-popup"><p>Defences at Corbridge overtopped when the River Tyne and its tributaries swelled. Flooding affected the southern side of the river with internal flooding of homes, damage to businesses and to a nearby caravan park; families were rescued from upper floors. Surface water problems also occurred around Station Road in the weeks afterwards. Temporary repairs to flood defences were made and recovery/mitigation actions (pumps, clean&ndash;up, PLR grants, drainage investigations) were undertaken. [IMG,TAB,PAG] (p1)</p></div><div class="nugget-popup"><p>Flooding in Corbridge damaged/affected local flood defences (temporary repairs carried out), caused damage to highway infrastructure (repairs made), affected the sewer network (CCTV and cleansing carried out; sewer outfalls checked) and affected properties (property&ndash;level resilience grants made available). Community recovery and an initial economic assessment after the floods were completed. [TAB] (p2)</p></div><div class="nugget-popup"><p>Floodwaters from the River Tyne overtopped embankments and flowed across low&ndash;lying parts of Corbridge (Dilston Haugh, Station Road, The Stanners, Tinkler&#8217;s Bank), causing ponding, embankment erosion, cemetery damage and impacts to nearby sports club facilities; photographs and callouts on the map document property and infrastructure water damage. [IMG,PAG] (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>43 residential properties; 12 businesses; 2 other buildings [IMG,TAB,PAG] (p1)</p></div></div></body></div>`)[0];
