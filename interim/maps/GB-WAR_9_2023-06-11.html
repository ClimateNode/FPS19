                var html_8219a0bce570446f5f79fb7fcd9997f7 = $(`<div id="html_8219a0bce570446f5f79fb7fcd9997f7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Piccadilly Crescent, Piccadilly</h1><div class="nugget-popup"><p>Two properties on Piccadilly Crescent experienced internal flooding during an intense, localized thunderstorm on 11 June 2023; the heavy downpour caused internal property flooding. [PAG] (p3)</p></div><div class="nugget-popup"><p>Internal flooding of two properties occurred when high&ndash;intensity rainfall exceeded the capacity of the piped drainage network or prevented flows entering the network quickly enough. Flooding was compounded because the two properties sit at the low spot of Piccadilly Crescent and front landscaping created an accessible route for surface water flows. Flooding was reported to the LLFA and verified with photographs; a site visit found no apparent asset failure or restriction within the drainage network. [IMG] (p4)</p></div><div class="nugget-popup"><p>Properties on Piccadilly Crescent were subject to flooding caused by an under&ndash;performing local drainage network and surface water run&ndash;off; actions include gully cleansing, maintenance of the 150mm VC drain, installation of a continuous liner to improve connectivity to Trinity Road, and property flood resilience consideration. [TAB] (p6)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>two properties [PAG] (p3)</p></div><div class="nugget-popup quant"><p>two properties [IMG] (p4)</p></div></div></body></div>`)[0];
