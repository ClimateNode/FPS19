                var html_758fe42f85e0512009f046f26f11a5d9 = $(`<div id="html_758fe42f85e0512009f046f26f11a5d9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cockshot Brook</h1><div class="nugget-popup"><p>High flows on Cockshot Brook during the 26 December 2015 event are described as likely to have prevented water discharging from the drainage system; the outfall from the culverted section into Cockshot Brook appears to have no non&ndash;return mechanism, which may have allowed water to back up into the culvert during high flow. [PAG] (p11)</p></div><div class="nugget-popup"><p>High / extreme flows on Cockshot Brook prevented discharge from the connected drainage/culverted system; absence of a non&ndash;return mechanism on the outfall may allow water to back up the culvert during times of high flow. [PAG] (p12)</p></div><div class="nugget-popup"><p>Receives discharge from the drainage outfall (within Kenylo Bridge abutment) and forms part of the downstream conveyance network related to the localised flooding. [IMG] (p15)</p></div><div class="nugget-popup"><p>High water levels in Cockshot Brook during the 26 December 2015 event are recorded as a likely factor that reduced the efficiency of the drainage outfall and contributed to local flooding. [PAG] (p16)</p></div><div class="nugget-popup"><p>Outfall into Cockshut Brook is located within the abutment of Kenylo Bridge; a culverted section feeding the brook was recorded with blockages which impaired flow and were identified during the flood investigation, necessitating remedial works. [IMG] (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>outfall into the brook located approximately 120 metres west of the flooded area. [IMG] (p15)</p></div><div class="nugget-popup quant"><p>4 blockages [IMG] (p19)</p></div></div></body></div>`)[0];

                var html_45945c7b5ddfcc0089d484b21badbabd = $(`<div id="html_45945c7b5ddfcc0089d484b21badbabd" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Stone Pit Lane, Croft</h1><div class="nugget-popup"><p>Subject of a Section 19 flood investigation by Warrington Borough Council indicating that flooding affected Stone Pit Lane; no specific flood mechanism or impacts are given in the provided extract. (p1)</p></div><div class="nugget-popup"><p>Carriageway flooding occurred; the flood affected the entrance to Turret Hall and the Stables. [TAB,MUL] (p4)</p></div><div class="nugget-popup"><p>Stone Pit Lane was severely affected by flooding; water covered the full width of the road and extended onto verges and adjacent land, rendering the road impassable and posing risk to nearby properties (as shown in the provided image). (p7)</p></div><div class="nugget-popup"><p>Severe localised flooding of the lane verge and adjacent land during the event on 26 December 2015. Water encroached onto the roadside, prompting deployment of diversion signage, cones and sandbags. Entrances to nearby properties (The Stables and Turret Hall) off Stone Pit Lane were observed still flooded and the ditch water level remained high at the site visit on 13 January 2016. [PAG,IMG,MUL] (p8)</p></div><div class="nugget-popup"><p>Described as the 'affected area' during the flood event. Nearby gauging stations recorded extremely high flows (Atherton Lake Brook &gt;1 in 1000 year), and high flows on Cockshot Brook are reported as likely to have prevented drainage discharge from the culverted outfall, allowing water to back up the culvert and contribute to flooding at Stone Pit Lane. (p11)</p></div><div class="nugget-popup"><p>Referenced as the nearby 'affected area' (Stone Pit Lane) connected to the observed overland flow on Heath Lane; the weather front that produced heavy rainfall is reported to have passed over Stone Pit Lane during the same event. (p12)</p></div><div class="nugget-popup"><p>Stone Pit Lane and accesses to nearby properties (including accesses to The Stables and Turret Hall) were flooded on 26 December 2015 due to blockage of the culvert from the drainage ditch to the outfall into Cockshot Brook causing the ditch to overflow. (p16)</p></div></div></body></div>`)[0];
