 property (No. 9 Chapel Lane) [IMG] (p40)</p></div></div></body></div>`)[0];

div></div></body></div>`)[0];

                var html_4bf5b222d35418fe89fa97f2f3120240 = $(`<div id="html_4bf5b222d35418fe89fa97f2f3120240" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Denford</h1><div class="nugget-popup"><p>Intense, short&ndash;duration rainfall on a saturated catchment produced excess surface water that flowed following natural contours to areas in and around Duck End, Chapel Lane and Freeman's Lane within Denford; internal flooding of at least one property was reported and had occurred four times in one year. [PAG] (p5)</p></div><div class="nugget-popup"><p>Internal flooding was reported at Duck End (in Denford). At least one property suffered internal flooding during the incident; that property had experienced internal flooding four times within one year. [PAG] (p6)</p></div><div class="nugget-popup"><p>The village experienced significant rainfall on the Denford catchment leading to high volumes of surface water flowing into lower areas (including Duck End), resulting in internal flooding of at least one property and two properties requiring continuous efforts to prevent internal flooding. (p8)</p></div><div class="nugget-popup"><p>Gardens of residential properties and the highway on High Street were affected by floodwater; an ordinary watercourse culvert beneath High Street was a contributing factor. The River Nene rose to levels that brought properties adjacent to it close to flooding and caused rear gardens to be affected. Large areas of ponding occurred throughout Duck End and Chapel Lane and in the rear gardens of properties on Freeman's Lane because the ordinary watercourse could not discharge quickly enough. At the junction of Duck End and Freeman's Lane a poorly functioning highway gully prevented satisfactory drain down. Large agricultural fields south of Spinney Rise were submerged. Floodwater at Duck End included foul water from the public sewerage system. (p11)</p></div><div class="nugget-popup"><p>Intense, short&ndash;duration rainfall on a saturated catchment caused existing drainage systems and watercourses to be unable to cope. Water flowed into areas and drainage systems not designed to manage the additional volume, producing ponding and flooding across Denford. (p14)</p></div><div class="nugget-popup"><p>Intense rainfall on a saturated catchment overwhelmed drainage and watercourses. An ordinary watercourse east of the village was overtopped, producing high&ndash;velocity flow into Denford that spanned the full highway width. Existing drainage and culverts (Duck End and High Street) lacked capacity or were in poor repair, preventing conveyance to the River Nene and causing ponding and flooding within the village. (p15)</p></div><div class="nugget-popup"><p>Overflow and inability of an ordinary watercourse to discharge into the River Nene led to land drainage overspilling onto neighbouring properties, the public highway and the public sewerage system within the village. (p16)</p></div><div class="nugget-popup"><p>Properties adjacent to the River Nene were exposed to river flooding; residents were also affected by surface water runoff from neighbouring land and by the emergence of groundwater. Report recommends consideration of flood defence works on the River Nene and assessment of outfalls, highway drainage and pond function to reduce downstream flood risk. (p18)</p></div><div class="nugget-popup"><p>A pond between Denford and the A45 Road overflowed, with water extending beyond the pond onto adjacent grassy and reedy land surrounding Denford. [IMG] (p43)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property; four times in one year [PAG] (p5)</p></div><div class="nugget-popup quant"><p>1 property; 4 incidents in one year [PAG] (p6)</p></div><div class="nugget-popup quant"><p>1 property internally flooded; 2 properties required continuous efforts to prevent internal flooding; 4 incidents in one year (p8)</p></div></div></body></div>`)[0];
