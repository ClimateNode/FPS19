                var html_2bca6165a07815372e49fd991b2780f0 = $(`<div id="html_2bca6165a07815372e49fd991b2780f0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Borough Green Road, Ightham</h1><div class="nugget-popup"><p>Flooding affected Borough Green Road (referred to here as Green Road) during the event; the street was one of the areas named as being affected by flooding. (p1)</p></div><div class="nugget-popup"><p>Internal flooding to properties in the area of Borough Green Road (referred to here as Green Road) adjacent to the Busty Stream during the flood reported on 25 June 2016. (p4)</p></div><div class="nugget-popup"><p>The full width of the carriageway on Borough Green Road (referred to here as Green Road) was flooded by flowing water above kerb height; flows ran down the road and entered properties internally via doorways and airbricks. Flows continued eastwards where some water re&ndash;entered the watercourse via driveway entrances. (p14)</p></div><div class="nugget-popup"><p>Flood&ndash;water exceedance flow routed around Borough Green Road during the event, consistent with the updated Flood Map for Surface Water. (p20)</p></div></div></body></div>`)[0];

                var html_7af534d32af68390d1f3f1f7c5f4e87b = $(`<div id="html_7af534d32af68390d1f3f1f7c5f4e87b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Busty Lane, Ightham</h1><div class="nugget-popup"><p>Flooding affected Busty Lane; it is named in the report as one of the areas impacted by the flood event. (p1)</p></div><div class="nugget-popup"><p>Internal flooding to properties in the area of Busty Lane during the flood reported on 25 June 2016. (p4)</p></div><div class="nugget-popup"><p>KCC records show high flows in the watercourse caused flooding at the eastern end of Busty Lane in Sep 2009, Nov 2013 and Jan 2014. Anecdotal evidence from residents also links wet winters (notably 2000 and 2003) to high flows and flooding affecting external areas of properties alongside the watercourse. The lane lies within the area of flooding considered by this report. [MUL] (p6)</p></div><div class="nugget-popup"><p>Flows from the Busty Stream travelled down Busty Lane, coming out of bank near the bend by Elim Cottages and the culvert under Ezel Villas. High flows could not drain downstream through the culvert quickly enough, causing significant ponding/backing up of water in the lower part of Busty Lane and adjacent areas. (p13)</p></div><div class="nugget-popup"><p>Water flowed out of the watercourse bank through and around properties adjacent to the watercourse, through front and rear gardens and onto Borough Green Road. (p14)</p></div><div class="nugget-popup"><p>As follow&ndash;up maintenance after the flooding, the community and parish council cleared excess vegetation from the banks and removed excess silt from the bed of the watercourse along Busty Lane. (p16)</p></div><div class="nugget-popup"><p>A small build&ndash;up of silt was noted within the watercourse at the end of Busty Lane, deposited during the flooding event; the depth was limited and considered not significant. (p19)</p></div><div class="nugget-popup"><p>Flood exceedance flows passed around Busty Lane (and Borough Green Road); residents report historical flooding at the end of Busty Lane and external areas of property have flooded in wet conditions. During the 25th June 2016 event the exceedance route was close to that predicted and upstream ponding reached about 2 metres. (p20)</p></div><div class="nugget-popup"><p>A culvert at Busty Lane was implicated in the flooding (risk of blockages by debris/standing water); report recommends installing a trash screen and inspecting/maintaining the culvert to reduce blockage&ndash;related flooding. [TAB] (p26)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>maximum depth of flood water approximately 2 metres (as illustrated around a parked van) (p13)</p></div><div class="nugget-popup quant"><p>less than 150mm silt depth (p19)</p></div><div class="nugget-popup quant"><p>2 metres deep (p20)</p></div></div></body></div>`)[0];

                var html_1f5f30b0e1c2214f28e3bfe5d2cc069f = $(`<div id="html_1f5f30b0e1c2214f28e3bfe5d2cc069f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Thong Lane, Borough Green</h1><div class="nugget-popup"><p>Out&ndash;of&ndash;bank flows from the adjacent watercourse (part of the River Bourne) ran onto the road; the carriageway was flooded to a depth that made it impassable except to high vehicles and 4x4s; the culvert under the bridge abutment was blocked with mud and silt. (p24)</p></div></div></body></div>`)[0];

                var html_9ad8b19c7b3885a2d6fcab47ba107042 = $(`<div id="html_9ad8b19c7b3885a2d6fcab47ba107042" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Ightham</h1><div class="nugget-popup"><p>The village of Ightham experienced flooding affecting areas including Borough Green Road and Busty Lane during the reported flood event. (p1)</p></div><div class="nugget-popup"><p>Significant flooding within the village reported on 25 June 2016 that caused internal flooding to properties in the areas of Busty Lane and Borough Green Road adjacent to the Busty Stream. (p4)</p></div><div class="nugget-popup"><p>Flooding was reported downstream of Ightham along the River Bourne as high flows exceeded the watercourse capacity, causing inundation downstream of the village. (p15)</p></div><div class="nugget-popup"><p>Ightham experienced flooding associated with the intense, highly variable rainfall on 25 June 2016. Rain&ndash;gauge records from nearby sites were used in the post&ndash;event analysis to assess how rainfall across the Busty Stream catchment contributed to flooding at Ightham. (p17)</p></div><div class="nugget-popup"><p>Fen Pond Road, located upstream of Ightham within the Busty Stream catchment, experienced flooding on 25 June 2016 when high flows exceeded a culvert; this was reported to KCC by Ightham Parish Council and may have resulted in flooding affecting properties in the vicinity. (p23)</p></div><div class="nugget-popup"><p>Flooding in the village caused by the Busty Stream and associated culvert issues, resulting in internal flooding of properties and accumulation of silt and debris in the watercourse. (p26)</p></div><div class="nugget-popup"><p>Residential properties and residents in the community experienced flooding; the area has been identified as having suffered flood impacts and for follow&ndash;up community resilience support. (p27)</p></div></div></body></div>`)[0];
