<div class="nugget-popup quant"><p>Approximately 33 properties flooded in Bethersden (22 internally, 11 externally). (p1)</p></div><div class="nugget-popup quant"><p>rise from approximately 18.2 m to 21.12 m [MUL] (p5)</p></div></div></body></div>`)[0];

                var html_6c8132f94d5768e50c4203d34f471305 = $(`<div id="html_6c8132f94d5768e50c4203d34f471305" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bethersden</h1><div class="nugget-popup"><p>Intense rainfall on 25 July 2021 caused local river levels (Bethersden Stream and an unnamed tributary of the River Beult) to rise quickly. The highway surface water drainage network surcharged and culverts under Church Hill and Norton Lane surcharged. The sewer network was reported unable to cope in isolated areas, causing sewer flooding. Properties throughout the village were flooded (internal and external). (p1)</p></div><div class="nugget-popup"><p>Internal flooding of a residential property with floodwater entering the building. [IMG,PAG] (p3)</p></div><div class="nugget-popup"><p>Bethersden was the location of the rain gauge recording the extreme rainfall on 25 July 2021; flooding in the village began around 15:00 on 25 July 2021 when intense rainfall led to surface water runoff and tributary flows that flooded properties. [PAG] (p4)</p></div><div class="nugget-popup"><p>Intense convective rainfall generated flooding in Bethersden, with reports indicating flooding started at approximately 15:00 on 25 July 2021. The Bethersden rain gauge recorded 101.75 mm between 11:15 and 21:45 on 25 July, with 58.77 mm between 14:00 and 15:00, producing rapid surface&ndash;water/flash flooding in the locality. (p5)</p></div><div class="nugget-popup"><p>On 25th July 2021 intense rainfall overwhelmed drainage and watercourses; watercourses overtopped and surface water runoff caused property flooding across the village. (p8)</p></div><div class="nugget-popup"><p>Intense rainfall on 25 July 2021 overwhelmed drainage and local ditches which overtopped, causing flooding of properties along Ashford Road and adjacent areas (Bailey Fields). Debris was reported near drainage pipes south of Bailey Fields which contributed to reduced discharge capacity. KFRS attended Ashford Road on 25 July 2021 and pumped out floodwater from multiple properties. Surveys identified damaged/silted and partially collapsed pipes reducing system capacity; overland flows from land to the south overtopped the land drainage ditch and led to property flooding. [PAG,IMG] (p9)</p></div><div class="nugget-popup"><p>Multiple local locations in Bethersden experienced flooding on 25 July 2021: culverts surcharged at Church Hill and Norton Lane causing floodwater onto roads; a collapsed culvert beneath Union Chapel led to surcharging and flooding of surrounding properties; properties on The Street were flooded and required pumping. [PAG] (p12)</p></div><div class="nugget-popup"><p>Intense rainfall on 25 July 2021 overwhelmed local surface water drainage systems and local watercourses, causing flooding to properties and carriageway flooding of local roads. [PAG] (p13)</p></div><div class="nugget-popup"><p>Intense rainfall on 25 July 2021 overwhelmed local surface water drainage and receiving watercourses, causing flooding to properties and carriageways in Bethersden. [PAG] (p14)</p></div><div class="nugget-popup"><p>Multiple reported flood incidents across the village concentrated near local watercourses and at road junctions. Road flooding affected routes into/out of the village (including the A28), prompting KCC to repair highway drainage and prompting risk&ndash;management work to investigate mitigation measures (including culvert improvements at Church Hill). [IMG] (p15)</p></div><div class="nugget-popup"><p>The Flood Map for Planning shows Bethersden village lying within Flood Zone 2 and Flood Zone 3, with streams running through or near populated areas. Areas of the village (particularly to the west and south where tributaries feed the River Beult) were identified as being at elevated flood risk during the event on 2021&ndash;07&ndash;25. [IMG,PAG] (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 33 properties; 22 properties flooded internally; 11 properties flooded externally (p1)</p></div><div class="nugget-popup quant"><p>1 property; approximately 90 cm of floodwater [IMG,PAG] (p3)</p></div><div class="nugget-popup quant"><p>5 properties; 30 properties (p8)</p></div><div class="nugget-popup quant"><p>5 properties; 30 properties [PAG,IMG] (p9)</p></div><div class="nugget-popup quant"><p>33 properties [PAG] (p13)</p></div><div class="nugget-popup quant"><p>33 properties [PAG] (p14)</p></div></div></body></div>`)[0];
