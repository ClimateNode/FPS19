                var html_e7c622d74b2dfe70c2a37605fd315d48 = $(`<div id="html_e7c622d74b2dfe70c2a37605fd315d48" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Garrison Lane, Felixstowe</h1><div class="nugget-popup"><p>Suffolk County Council (Lead Local Flood Authority) carried out a Section 19 investigation into a flood event affecting Garrison Lane (the subject of this report). (p1)</p></div><div class="nugget-popup"><p>Properties at a low point part way down the hill on Garrison Lane (IP11 7ST) were inundated when an intense, short&ndash;duration rainfall event produced overland/pluvial runoff that was funnelled by local topography (including Stour Avenue) toward the corner of Garrison Lane, causing flooding of properties to the west of Garrison Lane. (p3)</p></div><div class="nugget-popup"><p>A large volume of surface water flowed down Garrison Lane, overwhelming the highway drainage infrastructure and sending water southwards towards nearby properties; this runoff contributed to inundation of the nearby retirement housing complex and associated garages. (p5)</p></div><div class="nugget-popup"><p>Properties at a low point part way down the hill were inundated by rapid overland surface&ndash;water flow directed by local topography; emergency services pumped out basements and water largely receded after ~1 hour and mostly drained within 24 hours. [PAG] (p6)</p></div><div class="nugget-popup"><p>Surface water flowed along the carriageway, transporting and depositing sediments and debris adjacent to a storm drain; visible post&ndash;event traces document the flow path and low&ndash;point accumulation on the road surface. [IMG] (p8)</p></div><div class="nugget-popup"><p>A restriction in the existing 225 mm sewer (between MH6304 and MH6101) has been identified; an upgrade is proposed to remove this restriction as a measure intended to address sewer&ndash;related flooding and reduce sewer surcharges/overland flow along Garrison Lane. (p10)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>9 No. of the flats flooded internally; 12 No. residents evacuated; 2 No. adjacent semi&ndash;detached residential properties impacted; internal flood depths up to 1.2m in access corridor and up to 0.6m in flats; basement external depths reached 1.5m and internal depths over 0.6m. (p5)</p></div></div></body></div>`)[0];
