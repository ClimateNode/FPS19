                var html_315fe8b0cd26463a219b9b249951fd2b = $(`<div id="html_315fe8b0cd26463a219b9b249951fd2b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Maplebeck</h1><div class="nugget-popup"><p>Flooding of roads and properties in Maplebeck caused by intense rainfall following a prolonged wet period that saturated the ground, leading to faster onset of flooding. (p1)</p></div><div class="nugget-popup"><p>Internal flooding affected dwellings in the central area of the village (highlighted on the map). Five residential properties experienced internal flooding; additional properties had flooding to gardens and outbuildings; the public highway was rendered unpassable. The village sits in a natural bowl, increasing its susceptibility to surface water flooding. [IMG,PAG] (p2)</p></div><div class="nugget-popup"><p>Internal flooding in the village (Maplebeck sits in a natural bowl resulting in surface water ingress to built areas). The mapped surface&ndash;water flood extents correlate with flooding experienced during Storm Babet. Local surface&ndash;water assets (trash screens on culverts, highway gullies, below&ndash;ground piped system) were reported as of potential concern during follow&ndash;up meetings. [IMG,PAG] (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 residential properties [IMG,PAG] (p2)</p></div></div></body></div>`)[0];
