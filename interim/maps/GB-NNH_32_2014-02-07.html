                var html_6844439effb1d79dafb2c4aac84947a0 = $(`<div id="html_6844439effb1d79dafb2c4aac84947a0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lidl</h1><div class="nugget-popup"><p>The supermarket car park on Oakley Road was heavily flooded; parking spaces and areas of the car park were submerged and rendered inaccessible to vehicles. (p65)</p></div><div class="nugget-popup"><p>Supermarket car park and delivery area were submerged by flood water, with water extending into parking and delivery zones and partially submerging vehicles, preventing use of the car park. [IMG] (p66)</p></div><div class="nugget-popup"><p>Car park and delivery area at the Oakley Road / Gainsborough Road junction were submerged by floodwater. Water covered paved surfaces, reached up to the base of the supermarket building and delivery door, and partially submerged utility equipment and the delivery bay, impeding access and hindering delivery operations. (p67)</p></div></div></body></div>`)[0];

                var html_8c5dcf9aaccf70a36071da833c4159ec = $(`<div id="html_8c5dcf9aaccf70a36071da833c4159ec" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Gainsborough Road, Corby</h1><div class="nugget-popup"><p>Overflow from a part&ndash;culverted Ordinary Watercourse led to banks overtopping and the public highway being affected; the road (a critical arterial route for Corby) was flooded and private property and commercial premises were also affected by the overflow. [PAG] (p6)</p></div><div class="nugget-popup"><p>An ordinary watercourse (part&ndash;culverted) experienced high flows and overtopped its banks, causing overflow onto the public highway at Gainsborough Road; private property and commercial premises were also affected. Debris build&ndash;up at culvert grilles exacerbated the flooding. The road is identified as a critical arterial route for the town, so the flooding had significant transport impact. [PAG] (p7)</p></div><div class="nugget-popup"><p>An ordinary watercourse overtopped and caused flooding across Gainsborough Road. The depth and velocity of flow affected the community and placed residential properties at high risk of internal flooding; the road (a critical arterial route) was affected. [PAG] (p9)</p></div><div class="nugget-popup"><p>Carriageway and footways became impassable to pedestrians and vehicles; adjacent public highway and private gardens were flooded when the local watercourse became full to capacity and overtopped its banks. [PAG] (p12)</p></div><div class="nugget-popup"><p>Public highway and adjacent private gardens flooded; flood water reached approximately three metres away from residential thresholds and an estimated depth at the area outside residences exceeded 500 mm. Bow waves from vehicles driving through the flood presented a danger of internal flooding to dwellings. (p13)</p></div><div class="nugget-popup"><p>A residential section of the road was submerged, preventing vehicle access. Traffic cones were placed to block the flooded section; floodwater reached up to the sidewalk and affected access to nearby terraced houses. [IMG,PAG] (p54)</p></div><div class="nugget-popup"><p>Surface water and sewer water encroached from a nearby grassy area and drainage points onto the road at the junction with Lowry Close, causing flow across the carriageway and creating hazards for road users. [IMG,PAG] (p60)</p></div><div class="nugget-popup"><p>Water pooling at the junction with Lowry Close with water bubbling from a manhole cover and road gullies; the adjacent open watercourse (south of Gainsborough Road) was muddy and at high levels, contributing to local flood risk. [IMG,PAG] (p61)</p></div><div class="nugget-popup"><p>Flooding along Gainsborough Road between Lowry Close and Blake Road with water covering the road and partially onto the sidewalk, leading to temporary traffic control measures. [IMG,PAG] (p62)</p></div><div class="nugget-popup"><p>The carriageway and adjacent verges between Lowry Close and Blake Road were inundated, rendering the road impassable to vehicles and pedestrians. Street furniture and traffic islands were partially submerged and pedestrian entrances to properties were affected by residual floodwater. [IMG,PAG] (p63)</p></div><div class="nugget-popup"><p>Floodwater covered the road and encroached on pedestrian entrances and front yards of properties; access to properties was partially obstructed as water remained at doorstep level after recession. [IMG,PAG] (p64)</p></div><div class="nugget-popup"><p>Pedestrian entrances to properties between Lowry Close and Blake Road were inundated; flood waters receded to a shallow depth at entrances. [IMG,PAG] (p65)</p></div><div class="nugget-popup"><p>The junction of Gainsborough Road with Oakley Road (adjacent to the supermarket) was associated with flooding: the supermarket car park and delivery area at this intersection were inundated, with water covering a significant portion of the paved area and restricting access. [IMG,PAG] (p67)</p></div><div class="nugget-popup"><p>The junction with Oakley Road was submerged by standing floodwater covering the carriageway and surrounding land; traffic signs and a lamp post were partially submerged and the junction was impassable. Flooding also affected the nearby supermarket car park/delivery area. [IMG,PAG] (p68)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 3 metres from residential thresholds; approximately 75 mm in other recent incidents; depth exceeded 500 mm (p13)</p></div><div class="nugget-popup quant"><p>approximately 150 mm depth at pedestrian entrances [IMG,PAG] (p63)</p></div><div class="nugget-popup quant"><p>150 mm depth (receded) [IMG,PAG] (p64)</p></div><div class="nugget-popup quant"><p>150mm depth [IMG,PAG] (p65)</p></div></div></body></div>`)[0];

                var html_3f3befed111916766bdeeccc14f38b3a = $(`<div id="html_3f3befed111916766bdeeccc14f38b3a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Oakley Road, Corby</h1><div class="nugget-popup"><p>Affected by overflow from the Ordinary Watercourse when its banks overtopped; the public highway (an arterial route) was flooded and private property and commercial premises were impacted by the overflow. (p6)</p></div><div class="nugget-popup"><p>Flooding from the ordinary watercourses (which combine near Oakley Road) caused depth and velocity of flow affecting Oakley Road; residential properties were at high risk of internal flooding and the road (a critical arterial route) was impacted. [PAG] (p9)</p></div><div class="nugget-popup"><p>Carriageway and footways were impassable; surface water flowed out of the watercourse over the supermarket car park at the Gainsborough/Oakley junction at high velocity and into Oakley Road; drainage systems were unable to discharge and backed up, causing flooding at the supermarket area. (p12)</p></div><div class="nugget-popup"><p>An open section of watercourse immediately west of the supermarket junction overtopped, producing overland surface water flow that collected on Oakley Road; floodwater also collected in the supermarket car park and delivery bay. Flooding on Oakley Road overspilled to adjacent open space. (p13)</p></div><div class="nugget-popup"><p>The entrance to the supermarket car park on Oakley Road experienced flooding where surface water overland flow met standing flood water, creating waves and standing water at the entrance. [IMG,PAG] (p65)</p></div><div class="nugget-popup"><p>Entrance to supermarket car park and adjacent carriageway were heavily flooded, rendering vehicle and pedestrian access difficult and impassable; standing flood water covered the full width of the road at the car park entrance and interacted with moving overland flow. [IMG,PAG] (p66)</p></div><div class="nugget-popup"><p>Surface water overland flow met standing floodwater at the entrance to the supermarket car park on Oakley Road; flooding reached the car park entrance and extended along the road toward the south, impeding vehicular and pedestrian access to the supermarket entrance. [IMG,PAG] (p67)</p></div><div class="nugget-popup"><p>Standing floodwater covered the carriageway and adjacent areas at the Oakley Road / Gainsborough Road junction and extended into the supermarket car park and delivery area; water reached up to and over kerbs and the bases of traffic signs, rendering the road impassable to vehicles and pedestrians. [IMG,PAG] (p68)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>depth exceeded 200 mm (p13)</p></div></div></body></div>`)[0];

                var html_c127b8f9dbe8e9a31b4dfddbd6aeab9d = $(`<div id="html_c127b8f9dbe8e9a31b4dfddbd6aeab9d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lowry Close, Corby</h1><div class="nugget-popup"><p>The single vehicular access point became blocked by flood water, preventing entry/exit; flooding occurred adjacent to the area due to drainage systems backing up into the locality. (p12)</p></div><div class="nugget-popup"><p>Flood water covered the front garden of a residential property; debris accumulated on the garden (possibly from foul water sources). (p13)</p></div><div class="nugget-popup"><p>Floodwater and water emerging from drainage (manhole/gullies) affected the area around Lowry Close at its junction with Gainsborough Road, with water flowing onto pavements and the carriageway. [IMG,PAG] (p60)</p></div><div class="nugget-popup"><p>Surface water pooling at the junction with Gainsborough Road with water bubbling up from a manhole cover and road gullies; nearby open watercourse north of Lowry Close was at high, muddy levels and at or near capacity, increasing the risk of overflow onto adjacent land. [IMG,PAG] (p61)</p></div><div class="nugget-popup"><p>Floodwater at the junction extended into Lowry Close; manhole bubbling and gully discharge indicate sewer surcharge and surface water affecting the street. [IMG,PAG] (p62)</p></div><div class="nugget-popup"><p>The junction of Lowry Close with Gainsborough Road was submerged, making the junction impassable and affecting access for pedestrians and vehicles. [IMG,PAG] (p63)</p></div></div></body></div>`)[0];

                var html_bc61185faf5b4ad88a3696c00c6fd1a5 = $(`<div id="html_bc61185faf5b4ad88a3696c00c6fd1a5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Blake Road, Corby</h1><div class="nugget-popup"><p>Area adjacent to Blake Road experienced flooding when drainage systems backed up because they could not discharge to the high watercourse levels, resulting in inundation of highway and nearby private land. (p12)</p></div><div class="nugget-popup"><p>A culverted watercourse running from Blake Road to the supermarket was implicated in the flooding; a partial CCTV survey has confirmed its route and condition over much of its length and a full survey and likely repair/replacement/clearance works are recommended to address its role in causing/propagating flooding to the highway and nearby properties. (p20)</p></div><div class="nugget-popup"><p>Entrance to the culvert at Blake Road was submerged, indicating local inundation affecting drainage infrastructure and contributing to road/area inundation. [IMG,PAG] (p64)</p></div><div class="nugget-popup"><p>Entrance to the culvert at Blake Road was submerged; floodwater overflowed onto adjacent pavement and field, submerging fences and vegetation. [IMG,PAG] (p65)</p></div></div></body></div>`)[0];

                var html_7666971eb3216cb3e27679231446de4c = $(`<div id="html_7666971eb3216cb3e27679231446de4c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Corby</h1><div class="nugget-popup"><p>Corby is the town in which Gainsborough Road was the subject of a Northamptonshire County Council flood investigation (report title references Gainsborough Road, Corby). (p2)</p></div><div class="nugget-popup"><p>High water levels and strong flows in a part&ndash;culverted Ordinary Watercourse caused banks to overtop, resulting in flooding that affected public highways (notably Gainsborough Road and Oakley Road), private properties and commercial premises in the town. [PAG] (p6)</p></div><div class="nugget-popup"><p>Flooding of a part&ndash;culverted ordinary watercourse led to overtopping and overflow that affected key roads (Gainsborough Road and Oakley Road) in the town, and caused property and commercial premises to be affected. The flooding disrupted critical arterial routes for the town; an increased frequency of flooding is also noted. [PAG] (p7)</p></div><div class="nugget-popup"><p>Parts of Corby (notably Gainsborough Road and Oakley Road) experienced flooding on 7th February 2014 due to overtopping of ordinary watercourses, placing residential properties at high risk of internal flooding and affecting critical arterial routes. [PAG] (p9)</p></div><div class="nugget-popup"><p>Flooding affected open space and highways. (p11)</p></div><div class="nugget-popup"><p>Floodwater on Oakley Road reached a depth in excess of 200 mm, causing road flooding in Corby. [PAG] (p14)</p></div><div class="nugget-popup"><p>Heavy rainfall caused excessive flows in ordinary watercourses which raised water levels and overtopped banks, affecting adjoining property across Corby. Local drainage systems were unable to discharge to the watercourse, exacerbating flooding. Culverted sections of the watercourse were reported as possibly partially blocked or damaged, and debris grilles at culvert entrances became easily blocked, contributing to reduced conveyance and overtopping. (p18)</p></div><div class="nugget-popup"><p>Localised surface&ndash;water and sewer&ndash;related flooding associated with blocked culvert grilles and runoff/groundwater emergence. Culvert protection grilles required inspection and clearing during heavy rainfall and were a factor in local drainage performance; the event prompted a borough&ndash;wide flood risk management study. (p21)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>depth exceeded 200 mm on Oakley Road [PAG] (p14)</p></div></div></body></div>`)[0];
                popup_dff9609d0b7a2cd3204d2f371f981ea4.setContent(html_7666971eb3216cb3e27679231446de4c);
