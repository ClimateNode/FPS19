                var html_2eaf5e19accd7195dffb784402257171 = $(`<div id="html_2eaf5e19accd7195dffb784402257171" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>British Sugar</h1><div class="nugget-popup"><p>Flooding of the adjacent Compiegne Way impeded HGV access to the factory to the west; high traffic flows during the sugar beet campaign increased silt loading on the flooded carriageway, affecting vehicle movements and access. (p5)</p></div><div class="nugget-popup"><p>Access to the British Sugar factory was limited by highway flooding. The flooded section of highway is a significant HGV route for the factory (especially during the sugar beet campaign), so closures and flooding restricted HGV access and disrupted operations. [TAB,PAG] (p6)</p></div><div class="nugget-popup"><p>A reservoir (storage lagoon) owned by British Sugar was identified as a potential source of flood risk but a February 2024 assessment found it functioning normally with no evidence of leaks. The reservoir may locally recharge groundwater but was judged to have, at most, a minor impact on the observed flooding and was discounted as a significant contributor. (p10)</p></div><div class="nugget-popup"><p>Investigated as the owner/operator of an adjacent reservoir for possible contribution to a flooding incident that submerged the nearby road (Compiegne Way). The company&#8217;s site and traffic flows were considered in recommended actions to reroute HGVs when the road flooded. [TAB] (p13)</p></div><div class="nugget-popup"><p>Flooding of Compiegne Way (driven by high groundwater and reliance on pumped drainage) displaced HGV traffic onto local roads; recommendation to investigate rerouting traffic flows within the factory to avoid HGVs using local roads when the road flooded and to consult the company on highway remedial works. (p15)</p></div></div></body></div>`)[0];
                popup_8a1e9e1528b1fd55983a357117979917.setContent(html_2eaf5e19accd7195dffb784402257171);

                var html_da347920c07afebd284f16c4a113010f = $(`<div id="html_da347920c07afebd284f16c4a113010f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Lark</h1><div class="nugget-popup"><p>The River Lark received near&ndash;constant pumped discharge of groundwater from the highway drainage network, causing erosion concerns at the outfall and limiting times when pumps could discharge at full capacity; recommendation to lift the outfall and provide erosion protection to mitigate these impacts. [PAG] (p15)</p></div></div></body></div>`)[0];

                var html_84c72914eb6ece76c7bde398e723e979 = $(`<div id="html_84c72914eb6ece76c7bde398e723e979" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Compiegne Way, Bury St Edmunds</h1><div class="nugget-popup"><p>Road surface entirely covered by floodwater, with road markings and a metal barrier partially submerged; a triangular warning sign was partially submerged. Flooding rendered the road impassable and caused disruption to road users. (p1)</p></div><div class="nugget-popup"><p>Repeated flooding of the highway leading to closure of this major transport route for periods ranging from hours to weeks (recorded repeatedly over the last 10&ndash;15 years). Remedial response during the event included clearing excess water and silt to enable access to the drainage network, cleansing the highway drainage, replacing pumps and repairing the road surface. Investigation work was carried out to assess contribution from adjacent reservoir and recommendations developed (pump life extension, treatment upstream of pumps, increased street cleansing, diversion of part of the catchment, additional roadside storage, raising outfall level, signage and traffic management to prevent HGV movements during floods). (p3)</p></div><div class="nugget-popup"><p>A 200 m stretch of the carriageway was significantly inundated on both sides; the lower western carriageway experienced greater flood depths. The flooded section is a major HGV route to the British Sugar factory and a primary approach route to Bury St Edmunds from the north&ndash;east, causing disruption and silt deposition on the highway. (p5)</p></div><div class="nugget-popup"><p>Repeated flooding of the highway during winter/early spring. January 2024 event led to the highway being formally closed for approximately 1 month while investigations and remedial works were carried out. February 2024 event caused the road to be closed for 12&ndash;24 hours. Pumps were replaced; road surface damage repaired; repairs were delayed by continuous inflow of water from an unknown source. When river levels were high the sump&ndash;and&ndash;pump drainage outfall could not discharge, contributing to accumulation. Flooding has limited access to the British Sugar factory and prevented access to Bury St Edmunds from the north&ndash;east, stranded vehicles, and generated insurance claims. [PAG] (p8)</p></div><div class="nugget-popup"><p>Low&ndash;lying section of the highway accumulates surface water after heavy/prolonged rainfall (pluvial flooding). Road drainage collects runoff from ~1.5 km of road into a sump&ndash;and&ndash;pump system; the pump discharges via ~1 km of pipe to the River Lark. When river levels are high the outfall sits below peak river level and the highway drainage cannot discharge at full volume, indirectly causing flooding of the highway. Elevated groundwater (recorded Feb 2024) has been observed emerging from the verge and saturating the road surface ('bubbling' reported), consistent with groundwater flooding and contributing to surface inundation and reduced drainage resilience. [PAG] (p9)</p></div><div class="nugget-popup"><p>Groundwater was observed at or very near the road surface causing water to emerge from the verge and flow onto the carriageway. Highway engineers reported water 'bubbling' out of the verge onto the road even during dry periods; a panel engineer confirmed groundwater emerging from the verge while assessing the adjacent reservoir. The road sits on a narrow band of clayey superficial deposits that remain saturated longer, maintaining surface emergence of groundwater. [PAG] (p10)</p></div><div class="nugget-popup"><p>Repeated flooding at the low point in Compiegne Way caused by seasonally high groundwater emerging from the chalk aquifer and surface water from a 1.6 km highway catchment that drains to a pumped drainage system. Frequent pump burnout (exacerbated by high silt loading) and an outfall below peak River Lark levels have resulted in the pump being unable to discharge during high river flows. The road becomes partially blocked or inundated to depths requiring emergency road closures; flooding is prolonged because groundwater involvement prevents rapid drainage, requiring extended closures while water is removed and the drainage network/road surface remediated, imposing significant remediation costs on highway authorities and disrupting vehicular traffic, HGV routes and local access. (p12)</p></div><div class="nugget-popup"><p>Road became partially to fully submerged and was rendered impassable in places during January 2024, preventing use by cars and HGVs, disrupting access for local residents and businesses, and blocking a key diversion route for A14 closures. Remedial actions were carried out (clearing water and silt, cleansing drainage, pump replacement and road repair). [TAB] (p13)</p></div><div class="nugget-popup"><p>Compiegne Way experienced frequent groundwater flooding, making the road subject to regular inundation and displacement of traffic onto local roads; pumps servicing the highway drainage could not always discharge at full capacity; led to proposals to raise the road, reroute traffic, implement TROs for HGVs and install signage to reduce attempts to drive through floodwaters. [PAG] (p15)</p></div><div class="nugget-popup"><p>Flooding on Compiegne Way during the event displaced traffic onto local roads; report recommends rerouting traffic to prevent displacement during future flood events. (p16)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 1.5 km of road network draining to this section; approximately 1 km of piped discharge to River Lark; road level approximately 32.6 m AOD; groundwater level recorded ~32 m AOD (February 2024) [PAG] (p9)</p></div></div></body></div>`)[0];

                var html_5093fab60bb0ad3fb58273a9d17506f0 = $(`<div id="html_5093fab60bb0ad3fb58273a9d17506f0" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Suffolk</h1><div class="nugget-popup"><p>Both sides of a 200 m stretch of Compiegne Way carriageway were significantly impacted by floodwater; the slightly lower western carriageway experienced greater flood depths. The flooded section is a major HGV route serving the British Sugar factory and an important approach to Bury St Edmunds, with associated silt loading noted. [IMG,PAG] (p5)</p></div></div></body></div>`)[0];

                var html_cb6073fabe1fc0d885821ff80dd435e7 = $(`<div id="html_cb6073fabe1fc0d885821ff80dd435e7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bury St Edmunds</h1><div class="nugget-popup"><p>Compiegne Way in Bury St Edmunds experienced surface water flooding that covered the carriageway and rendered the road impassable, causing local transport disruption. (p1)</p></div><div class="nugget-popup"><p>Part of the town (Compiegne Way) experienced groundwater&ndash; and surface&ndash;water&ndash;driven flooding causing transport disruption and displacement of traffic onto local roads; local highway interventions and investigations were undertaken as described above. (p3)</p></div><div class="nugget-popup"><p>A section of highway within the town (Compiegne Way) was inundated, disrupting a major transport route into the town from the north&ndash;east and affecting HGV movements. [IMG] (p5)</p></div><div class="nugget-popup"><p>Flooded highway restricted vehicular access approaching Bury St Edmunds from the north&ndash;east, preventing residents and visitors from accessing the town during closures and causing travel disruption. [TAB,PAG] (p6)</p></div><div class="nugget-popup"><p>Groundwater flooding presents a significant risk across large parts of the town due to an underlying chalk aquifer. Groundwater levels were recorded as 'notably high' in February 2024 (approx. 32 m AOD), which places groundwater at or near the surface in low&ndash;lying areas and correlates with reported incidents of groundwater emergence and previous reports of flooding. (p9)</p></div><div class="nugget-popup"><p>Local residents, businesses and traffic access into and out of Bury St Edmunds were disrupted when Compiegne Way flooded and was subject to emergency closures; the road forms part of the town's access routes and its closure forced diversions and affected HGV and local traffic. (p12)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>groundwater level recorded approximately 32 m AOD (February 2024) (p9)</p></div></div></body></div>`)[0];
