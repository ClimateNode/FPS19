                var html_80fb261825de48b1231a9015d95011be = $(`<div id="html_80fb261825de48b1231a9015d95011be" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Felton</h1><div class="nugget-popup"><p>Flooding on 28/06/2012 affected properties and roads. Surface water from the highway (including B3645 and an unnamed road adjacent to the Riverside) overwhelmed drainage (a highway drain adjacent to the B3645 appeared broken) causing water to enter dwellings and properties. The Back Burn (an ordinary watercourse) rose rapidly and overtopped its banks, flooding properties and gardens on the right&ndash;hand bank. Some properties' flood defences were effective. Businesses off Main Street were also affected as surface water flowed down the steep Main Street towards the river Coquet. [IMG] (p1)</p></div><div class="nugget-popup"><p>Surface water collected in Main Street and flowed southerly toward the River Coquet; steep slope increased flood velocities. The majority of this water flowed into the river, but some businesses off Main Street were affected. The war memorial at the junction of the B6345 and Riverside was inundated when the two gullies could not accept the flow. [IMG] (p2)</p></div><div class="nugget-popup"><p>Upstream runoff from the A1, land drainage works carried out by a landowner, and reported felling of trees were identified on the map and in the report as possible contributors that increase flood risk in Felton, including increased flow into the Bach Burn (Back Burn) and potential flooding within the village. [IMG] (p3)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 residential properties; 1 business; 4 roads [IMG] (p1)</p></div><div class="nugget-popup quant"><p>water depth reached 2 ft [IMG] (p2)</p></div></div></body></div>`)[0];
