                var html_fc7d9ac463d902df2c7ef9e9b2244923 = $(`<div id="html_fc7d9ac463d902df2c7ef9e9b2244923" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Burcote Fields, Towcester</h1><div class="nugget-popup"><p>A culvert inlet became blocked, causing high water levels that overtopped banks; surface water flowed over land following natural contours to low points on Burcote Fields, causing internal flooding of at least one building (this building has experienced internal flooding on more than one occasion in the last five years). (p7)</p></div><div class="nugget-popup"><p>Internal flooding of one building at Burcote Fields; the building has experienced internal flooding on more than one occasion in the last five years. [MUL] (p9)</p></div><div class="nugget-popup"><p>Burcote Fields was affected by surface water / culvert (surface water sewer) flooding during the incident; the culvert inlet trash screen immediately south of Burcote Fields had silt and debris built up and was buckled and broken (riparian&ndash;owned), impairing flow through the 1200mm culvert that runs north under Burcote Fields, Burcote Road and Vernon Road toward the River Tove. An affected resident was spoken to about the flooding incident. [PAG] (p10)</p></div><div class="nugget-popup"><p>Watercourse overtopped the culvert headwall (trash screen blocked), causing floodwater to flow onto Burcote Fields and into properties and a garage; roads and sewers contaminated with mud and debris and required clearing; residents used sandbags to minimise impacts. [TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup"><p>The trash screen at the entrance to the culvert under Burcote Fields became blocked with debris causing the watercourse to rise and overtop its banks. Surface water flowed overland from the culvert headwall north onto the road (Burcote Fields) towards two properties; residents and the Fire Service took action to minimise ingress to the front doorway of one property. The Fire Service over&ndash;pumped the flood water and cleared the trash screen. (p12)</p></div><div class="nugget-popup"><p>Flooding occurred at Burcote Fields and this event generated resource implications that require review by County Council departments. (p16)</p></div><div class="nugget-popup"><p>Flooding occurred at Burcote Fields. Road drainage and the culvert/trash&ndash;screen at the site were implicated and require assessment and agreed maintenance arrangements to manage flood risk. [PAG] (p17)</p></div><div class="nugget-popup"><p>Site of a culvert whose entrance has a trash screen; ownership and maintenance responsibilities for that trash screen were identified as needing agreement to manage flood risk. The development's drainage designs and any un&ndash;adopted drainage require review and agreed maintenance regimes following the flooding incident. [PAG] (p18)</p></div><div class="nugget-popup"><p>An inlet to a culvert on a watercourse became blocked, causing high water levels that overtopped banks. Surface water then flowed over land following natural contours to low points on Burcote Fields; a property located in this area was affected and the area is deemed high risk of surface water flooding. (p20)</p></div><div class="nugget-popup"><p>Area/catchment was the subject of a flood incident investigation; the map shows the contributing catchment to an ordinary watercourse (used to understand flood flow paths and risk). [IMG] (p30)</p></div><div class="nugget-popup"><p>Main flood incident concentrated near a culvert (labelled '01') with significant overland flow converging from higher ground, resulting in schematic flooding of adjacent properties and erosion to banks. The culvert headwall had a damaged grille and there was observable bank erosion. [IMG] (p31)</p></div><div class="nugget-popup"><p>Trash screen on a watercourse south of Burcote Fields intercepted debris during the flood investigation event: vertical bars are bent and branches/leaves are accumulated at the base and on the bank, indicating forceful flow and debris transport that impacted the screen and may have reduced culvert conveyance. [IMG] (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one building (p7)</p></div><div class="nugget-popup quant"><p>one building [MUL] (p9)</p></div><div class="nugget-popup quant"><p>at least one property; one garage; two properties; 4 or 5 times (overtopping reported 2012&ndash;2016); at least one property (09/03/2016) [TAB,PAG,MUL] (p11)</p></div><div class="nugget-popup quant"><p>two properties; one property (p12)</p></div></div></body></div>`)[0];
