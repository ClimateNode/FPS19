                var html_04bbf96320394121a866fea36253dfe7 = $(`<div id="html_04bbf96320394121a866fea36253dfe7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Borsdane Brook</h1><div class="nugget-popup"><p>Borsdane Brook is identified as a watercourse adjacent to mapped flood extents and is associated with fluvial flood risk concentrated immediately adjacent to the main river and watercourses (notably affecting the Templeton Road / central Platt Bridge area). [IMG] (p24)</p></div></div></body></div>`)[0];

                var html_1c49af444dc6a8c35a06664931e4d531 = $(`<div id="html_1c49af444dc6a8c35a06664931e4d531" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Keats Way, Platt Bridge</h1><div class="nugget-popup"><p>Keats Way is within the Bickershaw Lane study area and therefore is shown to be at risk from fluvial (river) flooding, surface water flooding and sewer flooding during the reported event. (p11)</p></div><div class="nugget-popup"><p>Keats Way lies within the Bickershaw Lane study area which was impacted by flooding during the 1 January 2025 event; floodwaters affected the street and adjacent properties. (p17)</p></div><div class="nugget-popup"><p>The 1% annual probability modelled fluvial flood extent covers all properties along Keats Way East, placing properties on Keats Way at modelled risk of river flooding. [PAG] (p25)</p></div><div class="nugget-popup"><p>Water backed up into properties on Keats Way after the pedestrian bridge at the end of Keats Way surcharged due to high water levels. (p29)</p></div><div class="nugget-popup"><p>Mapped flow arrows show floodwater from brooks and drains converging at Keats Way, indicating the street was traversed by flood flows and potentially affected by inundation and blocked drainage pathways (no explicit count of internally flooded properties provided for Keats Way). [PAG,IMG] (p50)</p></div><div class="nugget-popup"><p>The water level in Brookside Brook Drain built up and eventually overtopped to the east of Keats Way. The highway drainage outfall for Keats Way East was submerged by the high water. (p51)</p></div><div class="nugget-popup"><p>Floodwater backed up via highway drainage outfalls and surcharged through highway gullies and external drains on the east side of Bickershaw Lane, with water appearing between 02:00 and 03:00 on 1 January 2025. Floodwater flowed south along shown flow paths and approached properties on Keats Way East as outfalls were submerged early in the event. [PAG] (p52)</p></div><div class="nugget-popup"><p>Mentioned as part of calls (Bickershaw Lane including Keats Lane, sic) in the Tactical Commander&#8217;s list of incident calls during the Platt Bridge flooding response. [TAB] (p57)</p></div><div class="nugget-popup"><p>Floodwater backed up along the highway drain and surcharged through the highway gullies along Keats Way, causing highway flooding. (p62)</p></div><div class="nugget-popup"><p>Keats Way East (including the sections referenced with Bickershaw Lane and Simpkin Street) experienced flooding driven by overtopping of Brookside Brook Drain and surcharging of highway drains, together with combined sewerage system backups contributing to flooding at properties. Recommendations include feasibility studies, raised defences and property flood resilience (PFR) measures. [PAG] (p63)</p></div></div></body></div>`)[0];

                var html_653b99bb16c6ed3e2dcf285ba2f9ebb3 = $(`<div id="html_653b99bb16c6ed3e2dcf285ba2f9ebb3" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Simpkin Street, Platt Bridge</h1><div class="nugget-popup"><p>Located within the Bickershaw Lane study area (east) which is shown to be at risk from fluvial (river) flooding, surface water flooding and sewer flooding. The study area (Platt Bridge) was impacted by the widespread flooding event on 1 January 2025. The functionality of highway drain outfalls and surface water sewers that discharge to watercourses in the area can be affected when watercourse levels are high and outfalls become submerged. (p11)</p></div><div class="nugget-popup"><p>Simpkin Street lies within the Bickershaw Lane study area which was impacted by flooding during the 1 January 2025 event; floodwaters affected the street and adjacent properties. [IMG] (p17)</p></div><div class="nugget-popup"><p>Water backed up into properties on Simpkin Street corresponding to surcharge and high water levels in nearby watercourses. (p29)</p></div><div class="nugget-popup"><p>Floodwater affected residents; water remained in the area for approximately 6 hours according to resident reports. (p40)</p></div><div class="nugget-popup"><p>Internally flooded properties resulting from floodwater routed along mapped pathways and contributions from overwhelmed drainage/sewer networks. The map/legend identifies 4 verified internally flooded properties on Simpkin Street. [PAG,IMG] (p50)</p></div><div class="nugget-popup"><p>A manhole on Simpkin Street was reported to have surcharged (likely due to backup via the United Utilities surface water sewer outfall into Brookside Brook Drain). Floodwater from Brookside Brook Drain and from Bickershaw Lane flowed onto the northeast corner of Simpkin Street; residents reported being impacted by flooding from approximately 06:00 on 1 January 2025. [PAG] (p52)</p></div><div class="nugget-popup"><p>Floodwater from Brookside Brook Drain (via Bickershaw Lane) flowed southwards onto the northeast corner of Simpkin Street; residents reported internal flooding of properties and being impacted by flooding from approximately 06:00. [PAG] (p53)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties: 4 residential properties reported to have flooded internally. Residents on Simpkin Street reported flood depths similar to those on Bickershaw Lane (internal depths at least 600mm on the east side; external depths to front reaching 900mm). (p54)</p></div><div class="nugget-popup"><p>Respondents in the Simpkin Street area reported limited emergency response during the flood event and that the area was affected by flooding. (p56)</p></div><div class="nugget-popup"><p>The Bickershaw Lane/Simpkin Street area was affected by floodwater; residents reported that floodwater had receded and local representatives attended to inspect damages. (p58)</p></div><div class="nugget-popup"><p>Fluvial flooding impacted properties on Simpkin Street as Brookside Brook Drain and surface water drainage surcharged; combined and surface water sewerage systems in the area were overwhelmed. (p59)</p></div><div class="nugget-popup"><p>It is reported that water likely backed up via the United Utilities surface water sewer and surcharged the manholes on Simpkin Street. (p62)</p></div></div></body></div>`)[0];
                popup_e3324ff614f1ba7ca23e0a431ca330f0.setContent(html_653b99bb16c6ed3e2dcf285ba2f9ebb3);

                var html_35f2fc8fba3b04b36e82bd3415ca951d = $(`<div id="html_35f2fc8fba3b04b36e82bd3415ca951d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Templeton Road, Platt Bridge</h1><div class="nugget-popup"><p>Part of the Templeton Road study area which the report identifies as having fluvial (river) flooding as the main source of risk, with additional surface water and sewer risk. Environment Agency mapping shows large parts of the Templeton Road area at surface water risk. The study area (Platt Bridge) was impacted by the widespread flooding event on 1 January 2025. [PAG] (p11)</p></div><div class="nugget-popup"><p>Large parts of the Templeton Road area are shown to be at surface water flood risk (covering similar areas to the fluvial risk). During the 1 January 2025 event the Templeton Road pumping station was submerged. (p12)</p></div><div class="nugget-popup"><p>The Templeton Road lies within the Templeton Road study area which was impacted by flooding during the 1 January 2025 event; floodwaters affected the road and adjacent properties. [IMG] (p17)</p></div><div class="nugget-popup"><p>Templeton Road lies within the Environment Agency high&ndash;risk flood extent adjacent to main watercourses; Figure 6&ndash;2 (drone footage) shows flood extents across the Templeton Road area. [PAG,IMG] (p24)</p></div><div class="nugget-popup"><p>Modelled 1% and 0.1% annual probability fluvial flood extents are shown adjacent to and around Templeton Road. Drone imagery referenced in the report shows flood extents across the Templeton Road area. [PAG,IMG] (p25)</p></div><div class="nugget-popup"><p>Surface water ponding occurred around Templeton Road in the 3.3% annual probability event. In the 1% event the flood extent expands around the north of Templeton Road and stretches down Templeton Road south of the car park. Templeton Road is also covered (partially or entirely) in the 0.1% annual probability event. (p26)</p></div><div class="nugget-popup"><p>In the 1% annual probability event the flood extent expands around Templeton Road and stretches down Templeton Road south of the car park; in the 0.1% event the flood extents increase further and Templeton Road is partially or entirely covered. [IMG,PAG] (p27)</p></div><div class="nugget-popup"><p>Floodwater affected residents along Templeton Road; residents reported flooding started at around 07:00 on 1 January 2025. The Templeton Road pumping station (on/near the road) was submerged by floodwater. (p40)</p></div><div class="nugget-popup"><p>Drone footage and site observations show flood extents across the Templeton Road area. Specific gulleys and manholes were known to have surcharged and residents reported the combined sewer system being overwhelmed, indicating sewer surcharging and surface water inundation of the area. (p43)</p></div><div class="nugget-popup"><p>Most severe internal flooding in the area: floodwater entered from a low point on the right bank of Hey Brook and spread westward into the residential area; combined sewer system was overwhelmed and a pumping station lost power, exacerbating impacts. 10 properties internally flooded on Templeton Road. [PAG,IMG] (p44)</p></div><div class="nugget-popup"><p>Hey Brook overtopped along the right bank to the east of Templeton Road at a low point on the bank. (p45)</p></div><div class="nugget-popup"><p>Road inundated by floodwater flowing north from Hey Brook after the brook overtopped its right bank; water pooled at the bottom of Templeton Road and then extended north along the road. External highway drains were reported to surcharge and the combined sewer system backed up, contributing foul sewage into the floodwater. [PAG] (p46)</p></div><div class="nugget-popup"><p>Drone footage shows flood extent across the Templeton Road area. Residential and commercial parts of the area were inundated, causing disruption to residents and businesses; respondents reported properties being flooded, displacement to temporary accommodation, property damage and financial losses, and adverse wellbeing/mental&ndash;health impacts. (p47)</p></div><div class="nugget-popup"><p>Internal flooding of properties on Templeton Road (residential and commercial). Templeton Road pumping station was partially submerged by floodwater; electricity supply to the area was isolated at 10:30 on 01/01/2025 which stopped normal operation until emergency generator delivery and restoration on 02/01/2025, restricting drainage operation and access during the outage. [PAG] (p48)</p></div><div class="nugget-popup"><p>Templeton Road pumping station was flooded; the pumping station continued to operate until Electricity North West isolated the electricity supply to the area. [PAG] (p49)</p></div><div class="nugget-popup"><p>Flooding led to evacuations: 12 residents along Templeton Road were evacuated; residents were carried to safety or transported using inflatable watercraft; appliances were used to pump flood water out of properties and the road network. [PAG] (p56)</p></div><div class="nugget-popup"><p>Power at/serving the Templeton Road pumping station was isolated by Electricity North West; United Utilities arranged an alternative generator supply (02/01/2025 08:00) and, on request of the emergency services, accessed the pumping station and restored power (02/01/2025 13:00). [TAB,PAG,MUL] (p57)</p></div><div class="nugget-popup"><p>Properties on Templeton Road were flooded; residents received immediate assistance from Wigan Council, including help accessing electricians and emergency accommodation. Skips were provided for flooded properties. (p58)</p></div><div class="nugget-popup"><p>Overtopping of Hey Brook caused fluvial floodwater to flow northerly and impact properties on Templeton Road. Highway drainage backed up because the river outfall was submerged and the combined/surface water sewer systems were overwhelmed. United Utilities provided a temporary generator via boat to restore power at the Templeton Road pumping station. [PAG] (p59)</p></div><div class="nugget-popup"><p>The Templeton Road area was affected as part of the Platt Bridge flood event caused by fluvial flooding from Hey Brook that interacted with surface water, sewer and groundwater. Templeton Road pumping station was inoperable for several hours after Electricity North West isolated the electricity supply; United Utilities provided a temporary generator via boat to restore power. The broader local impacts included road closures, flooding of businesses and properties, displacement of residents, damage to homes and loss of possessions, and telecommunications disruption. (p60)</p></div><div class="nugget-popup"><p>Fluvial flooding from Hey Brook overtopping in the Templeton Road area led to high water levels that submerged the outfall of the highway drain, causing floodwater to back up along the drain and surcharge upstream in Platt Bridge. Flooding was compounded by interacting surface water, sewer and groundwater mechanisms. Recommended mitigations (raised defences, storage, conveyance improvements, NFM and PFR) are being considered. (p61)</p></div><div class="nugget-popup"><p>The Templeton Road pumping station was submerged due to fluvial flooding from Hey Brook. Its operation was not impacted until the electricity supply was isolated; United Utilities then restored power using an emergency generator. The station could be compromised in a more significant future flood. (p62)</p></div></div></body></div>`)[0];
                popup_78806d8ccdf9d339da7bdec36428a957.setContent(html_35f2fc8fba3b04b36e82bd3415ca951d);

                var html_68170fcf041a97e9a8856246578f6cbf = $(`<div id="html_68170fcf041a97e9a8856246578f6cbf" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Greater Manchester</h1><div class="nugget-popup"><p>A major incident was declared (06:45) in response to the flooding and the Strategic Coordinating Group was activated to coordinate emergency response across agencies. [PAG] (p56)</p></div><div class="nugget-popup"><p>Flooding occurred across the whole of Greater Manchester; residential properties were reported flooded and verified by the Environment Agency. (p58)</p></div></div></body></div>`)[0];

                var html_e15417ce4d1eceb5f09f6d254768699e = $(`<div id="html_e15417ce4d1eceb5f09f6d254768699e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Platt Bridge</h1><div class="nugget-popup"><p>Platt Bridge was impacted by widespread flooding on 1 January 2025. The report identifies multiple sources affecting the area including fluvial (river) flooding, surface water flooding and sewer flooding across the study areas (Templeton Road and Bickershaw Lane). (p11)</p></div><div class="nugget-popup"><p>The rainstorm on 1 January 2025 was the main driver of observed flooding in Platt Bridge. Sources included extreme rainfall, overtopping of Hey Brook and Brookside Brook Drain, groundwater emergence in the Bickershaw Lane area, and highway drains and sewers surcharging. Receptors included internal flooding, submersion of the Templeton Road pumping station, resident displacement, loss of possessions, and negative health impacts. The event resulted in internal flooding of residential and commercial properties in the area. (p12)</p></div><div class="nugget-popup"><p>Fluvial flooding from Hey Brook, interacting with surface water, sewer and groundwater mechanisms, resulted in flooding of local properties and businesses, flooding of road networks, submersion of Templeton Road pumping station, disruption to local services, resident displacement, loss of possessions, and negative mental and physical health impacts for the local community. [PAG] (p13)</p></div><div class="nugget-popup"><p>The 1 January 2025 flood event inundated two distinct parts of Platt Bridge: the Bickershaw Lane area (Bickershaw Lane, Keats Way, Simpkin Street) and the Templeton Road area (Templeton Road, Walthew Lane, Platt Street). Each area was affected by different flooding mechanisms (not specified in the provided text). The report does not provide flood depths or specific internal water ingress routes for affected properties. [IMG] (p17)</p></div><div class="nugget-popup"><p>Modelled fluvial flood extents (1% and 0.1% annual probability) affect parts of the Platt Bridge study area. Flood&ndash;prone areas are concentrated around the main river and extend into residential and recreational zones within the Platt Bridge area. (p25)</p></div><div class="nugget-popup"><p>Surface water flood extents (1% and increasing in 0.1% events) cover or partly cover multiple streets in the north&ndash;west of the study area associated with Platt Bridge (including Elm Street, Templeton Road and other local streets). Sewers in Platt Bridge were constructed prior to 1980 and may be of lower capacity, increasing the risk of sewer flooding during larger rainfall/flood events. [IMG,PAG] (p27)</p></div><div class="nugget-popup"><p>External property flooding affected the Platt Bridge area (residents on Bickershaw Lane reported external flooding); local mitigation (scrapes) have been installed upstream but are reported ineffective/inundated by groundwater. (p30)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties caused by floodwater entering from a low point on the right bank of Hey Brook and spreading westwards into the Templeton Road area. The combined sewer and surface water sewer systems became overwhelmed and specific gulleys/manholes were observed to have surcharged (first manhole to surcharge along the highway drain noted near Platt Street). A pumping station lost power within the flooded zone, likely exacerbating flooding. Confirmed internally flooded properties: 10 properties on Templeton Road, 9 properties on Walthw Lane, and 2 properties on Platt Street. [IMG,PAG] (p44)</p></div><div class="nugget-popup"><p>Extreme rainfall in Platt Bridge and the surrounding area led to increased fluvial flows and the combined and surface water sewerage systems becoming overwhelmed. (p45)</p></div><div class="nugget-popup"><p>Water from Hey Brook backed up via the highway drain outfall and surcharged highway gullies on Platt Street (first gulley to surcharge was outside the Post Office). Drone footage shows flood extents across the Templeton Road area. Residential properties and businesses were flooded, causing house repair costs, replacement of possessions, higher energy bills for drying (dehumidifiers/heaters), displaced residents moved to temporary accommodation, lost sentimental belongings and significant stress/mental&ndash;health impacts. (p47)</p></div><div class="nugget-popup"><p>Extreme, double&ndash;peaked rainfall in Platt Bridge increased fluvial flows and overwhelmed the combined sewer system, contributing to flooding across the area (combined sewer overwhelmed and high fluvial flows). (p51)</p></div><div class="nugget-popup"><p>Platt Bridge area experienced flooding that generated a high volume of emergency calls (calls increased significantly at 08:25). Response was prioritised to the area, multiple nearby roads were closed, and Wigan Council transported residents from Platt Bridge to a rest centre and provided emergency accommodation. (p56)</p></div><div class="nugget-popup"><p>The centre of Platt Bridge was the focus of the emergency response: multiple calls and reports of residents in distress led to prioritisation of Forward Incident Officers; Electricity North West isolated supply to the whole area and later supplied a generator at the Platt Bridge McDonalds to support people; emergency services and Wigan Council representatives were active during and immediately after the flooding. [TAB,PAG] (p57)</p></div><div class="nugget-popup"><p>Internal flooding of properties across the settlement: at least 35 residential properties and 11 commercial properties were internally flooded. Flooding drivers included Hey Brook overtopping (fluvial floodwater flowing north and impacting streets) and overwhelmed combined and surface water sewer systems with submerged outfalls leading to highway drainage backing up. [PAG] (p59)</p></div><div class="nugget-popup"><p>Fluvial flooding from Hey Brook, which combined with surface water, sewer and groundwater mechanisms, caused flooding across the area. There were road closures; flooding of the post office, supermarket and other local businesses; internet connectivity issues due to access difficulties to telecommunications masts; residents displaced and living in temporary accommodation; damage to homes and loss of possessions; negative physical and mental health impacts reported. [PAG] (p60)</p></div><div class="nugget-popup"><p>Fluvial flooding from Hey Brook led to high water levels that submerged the outfall of a highway drain, causing the drain to back up and surcharge upstream in Platt Bridge. Flooding in the area was the result of interacting mechanisms (river overtopping combined with surface water, sewer and groundwater contributions), increasing local flood risk and reducing community resilience without a local Flood Warning. [PAG] (p61)</p></div></div></body></div>`)[0];

                var html_80143cb72c6b1e5523df1e33daff848d = $(`<div id="html_80143cb72c6b1e5523df1e33daff848d" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hindley</h1><div class="nugget-popup"><p>Modelled surface water pooling (ponding) across the Hindley study area: in the 3.3% annual probability scenario ponding occurs along Keats Way, by Platt Street (A58), surrounding Silver Street and Templeton Road extending south to the carpark, on residential streets around Woodcock Drive, on the land of the Hindley pumping station and its solar panels, and on green spaces/woodland in the north&ndash;east of the study area. In the 1% scenario extents increase (notably Keats Way near the Hindley pumping station and expanded extent on Templeton Road). In the 0.1% scenario flood extents further expand to cover much of the residential housing around Keats Way and land west of the Hindley pumping station and to partially or entirely cover Liverpool Road (A58), Platt Street (A58), Walthew Lane, Elm Street, Aspinall Street, Silver Street, Sherwood Crescent, Templeton Road, Lormax Street, Stephen Street, Davies Street, Victoria Street and Gas Street. Groundwater flooding: residents on Bickershaw Lane reported water rising through the ground and coming up through property floors during the 1 January 2025 flood event. (p26)</p></div><div class="nugget-popup"><p>Although the Hindley pumping station itself was not flooded, the adjacent solar panel area was impacted and the access road from Templeton Road was flooded, making access to the pumping station impossible during the flood event and restricting access for United Utilities and other companies (including telecommunications). (p49)</p></div></div></body></div>`)[0];
