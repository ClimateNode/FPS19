                var html_7605b14ad154f6765c8fd80e3423fdd9 = $(`<div id="html_7605b14ad154f6765c8fd80e3423fdd9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Windle Brook</h1><div class="nugget-popup"><p>Windle Brook (the Mill Bourne / Hale Bourne) is part of the Mill Bourne catchment draining the eastern part of Surrey Heath. During winter 2013/14 the catchment became saturated after repeated storm events (notably the 23 December 2013 event), reducing its capacity to absorb further rainfall and contributing to river&ndash;level rises and flooding in the eastern parts of the borough. [MUL] (p10)</p></div><div class="nugget-popup"><p>Windle Brook (named as part of the Mill Bourne system) was part of the Main River network and main surface water flow routes through the sub area during the winter 2013/14 events, contributing to surface water and fluvial flooding that led to road closures in Lightwater. (p20)</p></div><div class="nugget-popup"><p>The Environment Agency issued Flood Alerts for Windle Brook (with Hale, Mill and Addlestone Bournes), indicating elevated river levels and flood risk in the Lightwater sub area. [TAB,MUL] (p21)</p></div></div></body></div>`)[0];

                var html_cec52b5db935c099d7904b6075a59bca = $(`<div id="html_cec52b5db935c099d7904b6075a59bca" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Surrey Heath</h1><div class="nugget-popup"><p>Internal property flooding at multiple addresses across the area and road closures associated with the winter 2013/14 flood incidents. [TAB] (p2)</p></div><div class="nugget-popup"><p>Surrey Heath experienced flooding during the winter 2013/14 event, with internal property flooding incidents and multiple investigation sites recorded. [IMG] (p8)</p></div><div class="nugget-popup"><p>River levels (notably the River Wey and the Blackwater) remained high through the Christmas period and New Year's Day 2014; cumulative rainfall left catchments saturated so that flooding occurred in the borough after relatively small subsequent rainfall events. [MUL] (p12)</p></div><div class="nugget-popup"><p>The district was particularly affected by the winter 2013/14 flooding; the investigation focuses on impacts and response in Surrey Heath. (p14)</p></div><div class="nugget-popup"><p>Area experienced a flooding incident during winter 2013/14 (the subject of this report). (p16)</p></div><div class="nugget-popup"><p>Flooding incident reports in the Camberley sub&ndash;area affecting multiple streets, specifically Robins Bow, Middleton Road, the Maultway and a short section of London Road. (p17)</p></div><div class="nugget-popup"><p>Approximately six incidents of property flooding across the borough; surface water flooding affected the Camberley sub area and a combination of surface water and fluvial (river) flooding affected the Lightwater sub area. Lack of maintenance of some riparian ditches contributed to the scale of impacts. (p22)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 10 incidents of internal property flooding; seven S19 sites [IMG] (p8)</p></div><div class="nugget-popup quant"><p>6 incidents of property flooding (p22)</p></div></div></body></div>`)[0];

                var html_96141b2b9e61ce5737d2fec6fd3eb378 = $(`<div id="html_96141b2b9e61ce5737d2fec6fd3eb378" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Surrey</h1><div class="nugget-popup"><p>Widespread flooding across the county in winter 2013/14 included impacts within the Surrey Heath Borough area: seven sites across two sub&ndash;areas flooded, resulting in internal property flooding incidents. [PAG] (p7)</p></div><div class="nugget-popup"><p>Widespread flooding occurred across the county in winter 2013/14 from multiple sources including groundwater and surface&ndash;water runoff; prolonged rain on saturated ground led to widespread inundation and disruption. [TAB,PAG] (p9)</p></div><div class="nugget-popup"><p>Widespread flooding across Surrey resulted from a sequence of Atlantic storm events and prolonged rain on saturated ground. Peak flows from the 23 December storm caused River Wey flooding; lower reaches (Byfleet, Old Woking, Weybridge) reached their highest levels on Boxing Day. River levels in Guildford rose about 2.5m above normal winter levels. River levels rose again on New Year's Day and the saturated catchments led to flooding after subsequent smaller rainfall events. [PAG,MUL] (p10)</p></div><div class="nugget-popup"><p>Widespread flooding occurred across the county during winter 2013/14; strategic response and asset operation were carried out by the Environment Agency and other RMAs. [PAG] (p14)</p></div><div class="nugget-popup"><p>The county experienced flooding during Winter 2013/14 (Section 19 reports were produced for flooding across the county); roads, properties and drainage systems were affected, prompting inspections, repairs and clearance works. [PAG] (p15)</p></div><div class="nugget-popup"><p>Experienced raised river levels (including the River Thames and its tributaries) during prolonged heavy rainfall in autumn and winter 2013/14. (p21)</p></div><div class="nugget-popup"><p>Exceptional and unprecedented rainfall over Dec&ndash;Feb 2013/14 caused widespread flooding across Surrey; many districts and boroughs within the county were impacted to a greater extent than Surrey Heath. [PAG] (p22)</p></div><div class="nugget-popup"><p>Surrey experienced widespread historic flooding during the winter 2013/14 event. The report records that lack of maintenance of some riparian&ndash;owned ditches and watercourses contributed to the impact of the winter 2013/14 floods and that data from that event was used to identify areas most at risk and to prioritise drainage maintenance and flood defence bids. [PAG] (p23)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>7 sites; 10 incidents of internal property flooding [PAG] (p7)</p></div><div class="nugget-popup quant"><p>2.5m above normal winter levels in Guildford [PAG,MUL] (p10)</p></div><div class="nugget-popup quant"><p>860 blockages and storm damage incidents cleared; 1087 pollution incidents reported; 125 Flood Ambassadors visits involved; 70 flood data recorders deployed to more than 100 locations. [PAG] (p14)</p></div></div></body></div>`)[0];
