                var html_e1c01de409ea25f3969c6641cc73ff48 = $(`<div id="html_e1c01de409ea25f3969c6641cc73ff48" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Church Lane, Marchington</h1><div class="nugget-popup"><p>Surface water covered the road and adjacent pavements/grass near the location of the Church Lane road bridge, with water encroaching onto garden and paved areas. (p1)</p></div><div class="nugget-popup"><p>Internal property flooding was reported on Church Lane; the report focuses on the extent of flooding and investigation into causes. (p6)</p></div><div class="nugget-popup"><p>Church Lane in Marchington experienced flooding associated with Storm Dennis and is the focus of this Section 19 flood investigation report. (p7)</p></div><div class="nugget-popup"><p>Localised flooding occurred at Church Lane in Marchington; the event was assessed using anecdotal evidence from local residents and consultation with Risk Management Authorities. (p16)</p></div><div class="nugget-popup"><p>Church Lane was identified as the flooding location in the report and map. Flooding occurred adjacent to the south&ndash;eastern edge of Marchington where several residential properties, a public house and a village store are located, indicating inundation of the local street and immediate vicinity due to heavy/persistent rainfall and proximity to Marchington Brook and Silver Lane Drainage Ditch. [PAG,IMG] (p19)</p></div><div class="nugget-popup"><p>Marchington Brook is culverted beneath Church Lane opposite the Dog and Partridge public house; the culvert is identified as an asset owned and maintained by Staffordshire County Council Highways and forms part of the watercourse conveyance through the village toward the River Dove. [IMG,PAG] (p20)</p></div><div class="nugget-popup"><p>Properties along Church Lane experienced internal flooding as a result of the brook exceeding capacity combined with accumulated surface water; some residents reported water coming up through their floors. (p25)</p></div><div class="nugget-popup"><p>A flood warning was issued for Church Lane/Church Close on 16th February; Church Lane was closed to vehicles to reduce the risk of bow waves; properties experienced internal flooding and Environment Agency officers visited to record flood levels and offer advice. [PAG] (p26)</p></div><div class="nugget-popup"><p>Church Lane experienced flooding during the February 2020 event; the flood prompted investigations by SCC LLFA and partner Risk Management Authorities to understand flooding mechanisms and identify potential solutions to reduce future risk. (p27)</p></div><div class="nugget-popup"><p>Church Lane experienced flooding in February 2020 identified as river, surface water, highway and sewer flooding. The area is low lying and multiple flow paths caused inundation of the highway/low&ndash;lying area during the event. [PAG] (p28)</p></div><div class="nugget-popup"><p>Low&ndash;lying section of road became surrounded by flood water during the February 2020 event. When Marchington Brook exceeded culvert capacity water spilled onto Church Lane; flood water could surround properties from multiple directions, and bow waves from passing vehicles forced water into properties with thresholds lower than the road. Drainage struggled to remove water while river levels remained high and the catchment was saturated. [IMG] (p29)</p></div><div class="nugget-popup"><p>Flood water from the Marchington Brook combined with accumulated surface water resulted in flooding to properties along Church Lane. High river levels prevented the local surface water drainage from discharging, causing surcharging of drains and surface water flooding to the highway. Bow waves from passing vehicles could push water into properties with thresholds lower than the road. [PAG,IMG] (p30)</p></div><div class="nugget-popup"><p>Floodwater driven from Marchington Brook and overflowing highway drainage caused water to flow across Church Lane and into gardens of properties on Church Lane. Highway gullies and sewer/highway pipes running down Church Lane could not discharge when brook levels were high, causing the drainage system to become overwhelmed and road inundation; bow waves from passing vehicles have pushed water into lower&ndash;threshold properties. [PAG] (p31)</p></div><div class="nugget-popup"><p>Culverts on Church Lane were identified for clearing to improve flow and reduce flood risk from Marchington Brook, indicating Church Lane experienced flood&ndash;related flow/blockage issues. (p33)</p></div><div class="nugget-popup"><p>Church Lane was affected by flooding associated with the February 2020 event. Response and remedial works recorded include sewer cleansing and sealing of manholes, planned culvert clearance, and a proposed 'closing the gap' option as part of the capital scheme to reduce flood passage and road inundation. [TAB,PAG] (p34)</p></div><div class="nugget-popup"><p>Sewer&ndash;related flooding along Church Lane prompted sewer cleansing and sealing of manholes; a community&ndash;led road scheme was developed to prevent vehicles driving along Church Lane during flood events. (p35)</p></div><div class="nugget-popup"><p>Significant community impacts: internal flooding of properties (residential and commercial), flooding to outbuildings, gardens, garages, sheds and driveways, and roads leading into the village flooded causing some residents to be cut off and unable to leave their properties. (p39)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>flood depths of 1 to 9 inches reported inside properties (p25)</p></div><div class="nugget-popup quant"><p>11 residential properties; 2 commercial properties (p39)</p></div></div></body></div>`)[0];

                var html_ffabb68964e9ea1beae113f398e662ab = $(`<div id="html_ffabb68964e9ea1beae113f398e662ab" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Silver Lane, Marchington</h1><div class="nugget-popup"><p>Residents reported issues with the pumping station on Silver Lane during the 16th February 2020 flood event; investigation found a local power outage &mdash; Western Power and Severn Trent re&ndash;set the power and the pumping station was confirmed working. (p26)</p></div><div class="nugget-popup"><p>Observed flow routes show water moving from Church Lane/Church Close southeast towards Silver Lane Ditch (and Silver Lane). The route indicates Silver Lane and its ditch received runoff/flow accumulation during the event, contributing to local drainage overwhelm and water movement along that corridor. [IMG] (p29)</p></div><div class="nugget-popup"><p>Flood water routed across the field toward the drainage ditch at Silver Lane as a primary flow route during the event, receiving overspill flows from the brook and adjacent fields. [PAG] (p30)</p></div><div class="nugget-popup"><p>Floodwater from the Silver Lane ditch spilled from the left bank onto Silver Lane, flowing down the road towards the village. High channel volumes backed up behind culverts beneath Silver Lane/Church Lane, contributing to flooding onto adjacent land and into properties at the eastern edge of the village. (p31)</p></div><div class="nugget-popup"><p>Sewer network/pumping capacity at Silver Lane was identified as compromised by the February 2020 flood; Severn Trent Water commenced assessments and feasibility investigations for upgrades to the Silver Lane pumping station to improve performance and resilience. [TAB] (p34)</p></div></div></body></div>`)[0];

                var html_f38a64df20183d69f8fedf0601e9ecdc = $(`<div id="html_f38a64df20183d69f8fedf0601e9ecdc" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Church Close, Marchington</h1><div class="nugget-popup"><p>A flood warning was issued affecting Church Close on 16th February; properties experienced internal flooding and Environment Agency officers visited affected properties to obtain information on flow routes, depths, extents and timings and to offer support. (p26)</p></div><div class="nugget-popup"><p>The main observed flow route crossed Church Close during the February 2020 event; Church Close was inundated as water moved from Marchington Brook across Church Lane and through Church Close en route to Silver Lane Ditch, contributing to local road inundation and water surrounding nearby properties. [IMG] (p29)</p></div><div class="nugget-popup"><p>The bund behind Church Close was overtopped and bypassed during the 16/02/2020 event, creating an additional flow route down Church Close towards Church Lane and increasing flood depths along Church Lane. [PAG] (p30)</p></div><div class="nugget-popup"><p>The Church Close embankment required repairs/enhancements as a consequence of flooding from Marchington Brook, indicating flood damage or risk to the embankment and adjacent area. (p33)</p></div></div></body></div>`)[0];

</i><div class="nugget-popup quant"><p>more than 130 applications for grant support across East Staffordshire; five or more properties internally flooded in many areas (p7)</p></div></div></body></div>`)[0];

                var html_5a97a9dd9bf97bb1e095391fb6a5c0af = $(`<div id="html_5a97a9dd9bf97bb1e095391fb6a5c0af" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>East Staffordshire</h1><div class="nugget-popup"><p>Storm Dennis caused widespread flooding across East Staffordshire leading to many residential and business impacts; properties were internally flooded and grant support was sought. (p7)</p></div><div class="nugget-popup"><p>Marchington experienced road and internal property flooding on Church Lane / Church Close and Green Lane. Church Lane was closed to vehicles to reduce bow waves risking further property flooding. Environment Agency officers recorded flood levels in the village (visit 18 Feb) and visited properties that experienced internal flooding to collect depths, extents and timings (visit 21 Feb). Residents reported issues with the pumping station on Silver Lane (power&ndash;related) which was investigated and power/reset actions carried out by Western Power and Severn Trent. [MUL] (p26)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>more than 130 applications for grant support; five or more properties internally flooded (p7)</p></div><div class="nugget-popup quant"><p>130 applications; 86 properties; £370,840 [MUL] (p26)</p></div></div></body></div>`)[0];

                var html_ae3c38c1400dc7a3b20a9fd4f5e7525e = $(`<div id="html_ae3c38c1400dc7a3b20a9fd4f5e7525e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Marchington</h1><div class="nugget-popup"><p>Internal property flooding was reported at Church Lane; the event prompted an investigation into the causes and actions to address the flooding. [PAG] (p6)</p></div><div class="nugget-popup"><p>Marchington was impacted by Storm Dennis (arrived 16 February 2020); the report focuses on flooding at Church Lane in Marchington resulting from that event. (p7)</p></div><div class="nugget-popup"><p>Marchington experienced localised flooding at Church Lane on 16 February 2020; impacts were assessed from resident accounts and RMA consultation. (p16)</p></div><div class="nugget-popup"><p>The area of the village around Church Lane was affected by flooding during the event; the mapped flood location is centred on Church Lane at the south&ndash;eastern edge of Marchington. [PAG,IMG] (p19)</p></div><div class="nugget-popup"><p>Residents reported floodwater entering properties in the early hours of 16 February 2020; flooding was attributed at least in part to river flooding contributing to water entering properties. [IMG,PAG] (p24)</p></div><div class="nugget-popup"><p>Multiple properties experienced internal flooding; damage to interior decoration, carpets, flooring, furniture and irreplaceable personal items beyond salvage. Flooding to outbuildings, gardens, garages, sheds and driveways. Several roads into the village were flooded, leaving some residents cut off and unable to leave their properties for several hours. (p25)</p></div><div class="nugget-popup"><p>On 16th February 2020 the village experienced flooding: Environment Agency officers liaised with the Parish Council, recorded flood water levels at multiple locations, and visited properties that had internal flooding to gather information and offer advice; Church Lane was closed to vehicles and residents reported a pumping&ndash;station power fault on Silver Lane which was investigated and reset. [PAG] (p26)</p></div><div class="nugget-popup"><p>Marchington experienced flooding associated with the Storm Dennis rainfall in mid&ndash;February 2020; local authorities collected HydroMaster rainfall data for Marchington following the event and investigations were undertaken to understand the causes of flooding in the village. (p27)</p></div><div class="nugget-popup"><p>The village experienced complex flooding during the 15&ndash;16 February 2020 event from multiple sources (river, surface water, sewer and highway flows). Multiple flow paths were identified carrying water into the low&ndash;lying village, prompting EA investigation and response works. (p28)</p></div><div class="nugget-popup"><p>The village experienced complex, multi&ndash;directional flood flows during the February 2020 event. Elevated Marchington Brook and River Dove levels, a saturated catchment and overwhelmed local drainage caused watercourses and the drainage network to be exceeded; floodwater surrounded properties (notably around Church Lane), roads were inundated, and properties were exposed to water entering from multiple directions and from bow&ndash;waves when the culvert beneath Church Lane exceeded capacity. [IMG] (p29)</p></div><div class="nugget-popup"><p>During the February 2020 Storm Dennis exceedance event, prolonged rainfall saturated the catchment and Marchington Brook was unable to convey flows. Flood water rose to exceptionally high levels, flooding surrounding land and affecting several residential and commercial properties in Marchington. Local drainage and sewers were overwhelmed. [PAG] (p32)</p></div><div class="nugget-popup"><p>Flooding of the surrounding land and of residential and commercial properties in the village after catchment and water levels rose to exceptionally high levels. [PAG] (p33)</p></div><div class="nugget-popup"><p>The village was impacted by flooding during Storm Dennis (February 2020), which triggered a Section 19 investigation and a programme of follow&ndash;up actions: development of the Marchington Brook Flood Alleviation Scheme, property flood resilience surveys and measures, natural flood management work and sewer/highway investigations to reduce future flood risk. [TAB] (p34)</p></div><div class="nugget-popup"><p>Flooding in the village led to sewer network issues and highway flooding: sewer cleansing and manhole sealing were carried out along Church Lane; a community&ndash;led road scheme was developed to prevent vehicles using Church Lane during flood events; investigations into sewer network capacity and upgrades to Silver Lane pumping station were progressed. (p35)</p></div><div class="nugget-popup"><p>Flooding affected the village area on 16th February 2020: roads leading into the village were flooded, leaving some residents cut off and properties in the Church Lane area experienced internal flooding. (p39)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>11 residential properties; 2 commercial properties (p25)</p></div><div class="nugget-popup quant"><p>11 residential properties; 2 commercial properties (p39)</p></div></div></body></div>`)[0];
                popup_51c179fe403ce1ea8894aeae6440025c.setContent(html_ae3c38c1400dc7a3b20a9fd4f5e7525e);
