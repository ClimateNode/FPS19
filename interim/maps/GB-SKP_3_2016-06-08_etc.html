                var html_649b8a0d5f45fc7b9720265623d8aee1 = $(`<div id="html_649b8a0d5f45fc7b9720265623d8aee1" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Torkington Park</h1><div class="nugget-popup"><p>A large area of the park was inundated and park infrastructure (for example metal railings) was partially submerged, rendering the recreational area unusable during the flood event. Flooding at the park is recorded on 11 June and is associated with the wider Hazel Grove flooding that led to road closures nearby. [IMG] (p19)</p></div><div class="nugget-popup"><p>Hazel Grove Brook burst its banks within Torkington Park, flooding the park; the flood overtopped the wall between the park and Torkington Road. [PAG] (p21)</p></div><div class="nugget-popup"><p>Torkington Park was flooded when Hazel Grove Brook burst its banks during the 11 June 2016 event; the park received out&ndash;of&ndash;bank flows and contributed to overtopping at the park boundary. [PAG,IMG] (p22)</p></div><div class="nugget-popup"><p>Site inspection carried out and debris screen cleaned by United Utilities and the Environment Agency following the flood event. [TAB] (p40)</p></div><div class="nugget-popup"><p>Debris accumulated on the park debris screen during the flood event; the screen's performance was affected and is being reviewed. [TAB,MUL] (p42)</p></div></div></body></div>`)[0];

                var html_8cd94e79737b6674cf004683a2d59dda = $(`<div id="html_8cd94e79737b6674cf004683a2d59dda" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bonar Park</h1><div class="nugget-popup"><p>Bonar Park (Recreation Ground) was heavily saturated and acted as the main source of surface&ndash;water runoff during the event; runoff from the park flowed towards the River Mersey and onto Myrtle Street and through alleyways onto Laburnum Way, contributing to property and highway flooding. (p27)</p></div><div class="nugget-popup"><p>Heavily saturated ground and the park's topography generated surface runoff that flowed toward Laburnum Way and Myrtle Street, contributing to surface water flooding in the neighbouring streets; gullies/path drainage within the park were reported blocked and in need of maintenance. [PAG,IMG] (p28)</p></div><div class="nugget-popup"><p>Blocked gullies and land drainage issues on Bonar Park reported following local flooding; issue reported to the Council Greenspace Team for action. [TAB] (p40)</p></div><div class="nugget-popup"><p>Bonar Park and the surrounding pavement experienced drainage/flooding problems following the June 2016 events; actions to improve drainage are being reviewed. [TAB,MUL] (p41)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>6 properties on Oak Street [IMG] (p28)</p></div></div></body></div>`)[0];

                var html_9f566c90a8f521e89a4b11b111699073 = $(`<div id="html_9f566c90a8f521e89a4b11b111699073" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Poise Brook</h1><div class="nugget-popup"><p>Raised river levels on Poise Brook produced fluvial flooding in its catchment; the gauge recorded the highest level in its record on 11 June 2016, indicating Poise Brook was the driver of fluvial flooding affecting nearby communities (Hazel Grove and Offerton Green). (p11)</p></div><div class="nugget-popup"><p>High&ndash;intensity, sustained rainfall over the Poise Brook catchment produced runoff that raised water levels in Poise Brook; the river rose sharply and spilled out of bank, contributing to the flooding observed in Hazel Grove and elevating levels on connected watercourses. [IMG,PAG] (p21)</p></div><div class="nugget-popup"><p>Catchment rainfall caused Poise Brook water levels to rise sharply and overtop banks, contributing to out&ndash;of&ndash;bank flows that flooded nearby streets and properties in Hazel Grove. [IMG] (p22)</p></div><div class="nugget-popup"><p>The Main River Poise Brook flows through Offerton Green and contributed to the property flooding in the area during the June 2016 extreme rainfall events; flooding affected multiple residential streets adjacent to or downstream of the brook. [IMG,MUL] (p23)</p></div><div class="nugget-popup"><p>High levels in Poise Brook during the 8 June event likely reduced the capacity of the local surface water sewer outfall and contributed to flooding; on 11 June fluvial flooding from Poise Brook contributed to flooding in Offerton Green. [IMG,PAG,MUL] (p24)</p></div><div class="nugget-popup"><p>River levels rose sharply during the storm and Poise Brook spilled out of bank upstream of the Bean Leach Road crossing; the raised river levels impeded the local surface water sewer outfall, reducing sewer discharge capacity and exacerbating surface water and sewer flooding in Offerton Green. [IMG,PAG] (p25)</p></div><div class="nugget-popup"><p>Poise Brook spilled out of bank upstream of the Bean Leach Road crossing on 11 June 2016. Floodwater was obstructed behind a privately owned embankment and diverted onto Bean Leach Road, from where it flowed into the adjacent housing estate, flooding low&ndash;lying streets and impeding the local surface water sewer outfall which exacerbated surface water/sewer flooding. [IMG,PAG] (p26)</p></div><div class="nugget-popup"><p>Environment Agency issued a Flood Alert at 19:42 on 11 June for Poise Brook (Mersey Uplands Catchment), affecting Hazel Grove and Offerton Green. [TAB] (p38)</p></div><div class="nugget-popup"><p>Poise Brook produced fluvial flooding risk to the Offerton/Offerton Green area; flood warnings and trigger levels for the Poise Brook flood warning area are to be reviewed. [TAB,MUL] (p42)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>peak level 2.04m recorded on 11 June 2016 (p11)</p></div><div class="nugget-popup quant"><p>23 properties [IMG] (p22)</p></div><div class="nugget-popup quant"><p>57 residential properties flooded on 8 June 2016; 17 properties suffered internal flooding on 8 June 2016; 68 residential properties flooded on 11 June 2016; 66 properties suffered internal flooding on 11 June 2016; 50 properties flooded on both 8 and 11 June 2016 [IMG,MUL] (p23)</p></div></div></body></div>`)[0];

                var html_c1d9c0526fb447315148021f25f3494a = $(`<div id="html_c1d9c0526fb447315148021f25f3494a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lady Brook</h1><div class="nugget-popup"><p>Rising levels on Lady Brook on 11 June 2016 overtopped into the rear of properties on Bridge Lane and contributed to flooding of properties and the highway. [PAG,IMG] (p16)</p></div><div class="nugget-popup"><p>Following prolonged intense rainfall on 11 June 2016, water levels in Lady Brook rose and overtopped the banks, flowing into the rear of properties on Bridge Lane; the river rise occurred over several hours and contributed to the flooding of the highway and properties. [PAG,IMG] (p17)</p></div><div class="nugget-popup"><p>Lady Brook burst its banks and produced flood flow routes through the Bramhall Green/Bridge Lane area, causing inundation of adjacent properties and gardens (for example the July 1973 flood that put shops and houses under three feet of water and later garden flooding reported in April 2010). During the 11 June 2016 rainfall the brook contributed to local flood flow routes shown through Bramhall Green. [IMG,PAG,MUL] (p18)</p></div><div class="nugget-popup"><p>Site inspections carried out along the brook following fluvial flooding to assess impacts. [TAB] (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>18 properties affected where overtopping and associated flooding occurred on Bridge Lane [PAG,IMG] (p16)</p></div><div class="nugget-popup quant"><p>depth of three feet [IMG,PAG,MUL] (p18)</p></div></div></body></div>`)[0];

                var html_ef4e367a6043bd0860e6f42298c2d196 = $(`<div id="html_ef4e367a6043bd0860e6f42298c2d196" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Stockport Metropolitan District</h1><div class="nugget-popup"><p>Widespread flooding across the borough on multiple dates causing direct surface water and fluvial flooding, overwhelming surface water sewers, closure of highways and disruption to rail services; borough assets (highways, parks, greenspaces and public rights of way) suffered flood damage and required investigation and repair. [PAG,MUL] (p4)</p></div><div class="nugget-popup"><p>Widespread flooding across the borough during June 2016 affecting communities and infrastructure: many properties flooded, roads became impassable and a landslip caused significant railway disruption; local infrastructure required repair. [PAG,MUL] (p5)</p></div><div class="nugget-popup"><p>Flooding affected communities across the borough; the investigation documents communities affected and the total number of properties flooded (see Section 2.2) and records response and flood management works carried out by RMAs. (p6)</p></div><div class="nugget-popup"><p>Significant flooding occurred across Stockport during heavy rainfall events in June 2016, resulting in notable surface water and urban flooding within the borough. [PAG,MUL] (p8)</p></div><div class="nugget-popup"><p>Sustained heavy rainfall in June 2016 on already saturated ground generated excessive surface water runoff and rapid rises in river levels, producing significant flood events across Stockport. [MUL] (p9)</p></div><div class="nugget-popup"><p>Significant flooding occurred across Stockport during four rainfall events in June 2016. Intense, short&ndash;duration and longer&ndash;duration storms produced large volumes of surface water runoff leading to surface water flooding and rapid rises in river levels; different parts of the borough experienced peak impacts on different event dates. [PAG,MUL] (p10)</p></div><div class="nugget-popup"><p>Widespread property flooding across the borough during June 2016, with largest fluvial&ndash;driven impacts on 11 June and short&ndash;duration, high&ndash;intensity surface&ndash;water&ndash;driven impacts on 8, 10 and 16 June. [MUL] (p11)</p></div><div class="nugget-popup"><p>Widespread property flooding across the borough during June 2016. Short&ndash;duration, high&ndash;intensity rainfall events on 8, 10 and 16 June caused surface water / flash flooding, while a longer&ndash;duration event on 11 June produced raised river levels (notably Poise Brook) causing fluvial flooding in parts of the borough (for example Hazel Grove and Offerton Green). [PAG,IMG,MUL] (p12)</p></div><div class="nugget-popup"><p>Multiple communities across the borough experienced property flooding. On 8 June 2016 there were 75 properties flooded (all recorded as sewer flooding). On 10 June 2016 there were 30 properties flooded (predominantly sewer flooding with some incidents caused by groundwater). Additional significant property flooding occurred in parts of the borough on 11 June 2016. [PAG,MUL] (p13)</p></div><div class="nugget-popup"><p>Multiple communities across the borough experienced property flooding during the June 2016 events; the 11 June event produced the largest borough&ndash;wide totals. [MUL] (p14)</p></div><div class="nugget-popup"><p>Across June 2016 four intense rainfall events (8, 10, 11 and 16 June) caused widespread surface water and, on 11 June, fluvial flooding across the borough; roads became impassable in places and Risk Management Authorities responded to incidents and recovery. [PAG,MUL] (p16)</p></div><div class="nugget-popup"><p>On 11 June 2016 parts of the Stockport borough (notably the Hazel Grove suburb) experienced flooding affecting residential properties, local roads and public open space (Torkington Park). (p19)</p></div><div class="nugget-popup"><p>The Hazel Grove area of Stockport was heavily affected on 11 June 2016: Hazel Grove Brook (and Poise Brook runoff) caused flooding of properties, and highway, sewer and groundwater flooding were also factors. [IMG] (p21)</p></div><div class="nugget-popup"><p>Multiple flood impacts across the borough during the June 2016 events: river (Hazel Grove/Poise Brook) out&ndash;of&ndash;bank flows causing garden and internal property flooding; sewer systems overwhelmed causing internal property flooding; and highway/surface&ndash;water flooding affecting streets and properties. (p22)</p></div><div class="nugget-popup"><p>Parts of the Stockport borough (notably the Offerton Green suburb) experienced repeated residential property flooding during the June 2016 extreme rainfall events, including internal flooding and evacuations. [MUL] (p23)</p></div><div class="nugget-popup"><p>The Offerton Green suburb of Stockport suffered multiple flood events in June 2016: intense rainfall on 8 June overwhelmed surface water sewers causing external and internal property flooding; repeated flooding occurred on 11 June from surface water and later river (Poise Brook) flooding; lower&ndash;severity rainfall on 16 June caused repeat flooding at Holiday Lane. Flooding led to property inundation, internal flooding, resident evacuations and local road closures. [IMG,MUL] (p24)</p></div><div class="nugget-popup"><p>On 11 June 2016 intense, prolonged rainfall overwhelmed the local surface water sewer in Offerton Green causing surface water and sewer flooding first; later Poise Brook rose and spilled out of bank upstream of the Bean Leach Road crossing, with floodwater obstructed behind a privately owned embankment and diverted onto Bean Leach Road and into the adjacent housing estate. The rising river levels also impeded the surface water sewer outfall, reducing sewer capacity and exacerbating flooding in the estate (Shearwater Road, Fulmar Drive and Teal Close were reported as the lowest&ndash;lying streets where most properties were flooded). [IMG] (p25)</p></div><div class="nugget-popup"><p>Multiple flood impacts across the borough during the reported events: Offerton Green experienced surface water and fluvial flooding from Poise Brook on 11 June 2016 (embankment overtopping and flows into housing areas). During the evening of 16 June 2016, Edgeley (in Stockport) suffered flooding to residential properties predominantly from sewer flooding. [PAG,MUL] (p26)</p></div><div class="nugget-popup"><p>Parts of the borough experienced intense localized storm impacts on 16 June 2016; Edgeley saw concentrated property flooding driven largely by sewer surcharge and local surface water runoff. [IMG,PAG] (p27)</p></div><div class="nugget-popup"><p>Sewer and groundwater flooding affected residential properties in the Reddish area of Stockport. Internal flooding occurred at properties on Windmill Lane (sewer flooding), Gorton Road and Greg Street (groundwater flooding). External flooding occurred at a property on Wemyss Avenue (due to a sewer blockage that was later cleared). United Utilities investigations determined sewers were overloaded by intense rainfall where they were operating normally, and groundwater rise caused other property flooding. (p29)</p></div><div class="nugget-popup"><p>Parts of the Stockport borough were affected by property flooding in June 2016, notably Cheadle where sewer blockages and surface water ponding caused repeated internal and commercial property flooding. [PAG,MUL] (p31)</p></div><div class="nugget-popup"><p>Widespread property sewer flooding across Heald Green. United Utilities investigations found a mix of blockages on sewers and sewers overwhelmed by intense/voluminous rainfall; United Utilities cleared blockages on their assets. [MUL] (p33)</p></div><div class="nugget-popup"><p>June 2016 flood events caused widespread impacts across the borough including disruption to the road and rail networks and greenspaces; multiple road closures; damage to highway infrastructure (bridges, culverts and carriageways) requiring structural and scour inspections, debris removal, repairs and maintenance. The Council estimated initial repair costs of £151,000. (p36)</p></div><div class="nugget-popup"><p>June 2016 flooding damaged highway infrastructure and greenspace across the borough. Bramhall Happy Valley Park had footpaths damaged or swept away; public rights of way lost footpaths and footbridges; the Council has been undertaking repairs and identifying funding for remaining works. [PAG,MUL] (p37)</p></div><div class="nugget-popup"><p>Borough&ndash;wide flooding during the June 2016 events (responses dated 11 June 2016) caused highways and bridges to be closed and then re&ndash;opened; debris on roads and inspections of highway structures; highway drainage gullies in flooded areas were cleaned and known hotspots prioritised; parks, greenspaces and Public Rights of Way were inspected for damage; residents and businesses required recovery support including skips to remove damaged furniture and flood grants. [TAB] (p39)</p></div><div class="nugget-popup"><p>Widespread flooding across the borough during June 2016 that affected multiple communities and prompted the borough&ndash;wide investigation and recommended actions (e.g. maintain highway drains, review flood management and alert trigger levels). [TAB,MUL] (p41)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>295 properties; over £950,000 worth of flood damages, investigation and repair work [PAG,MUL] (p4)</p></div><div class="nugget-popup quant"><p>295 properties affected across June 2016; estimated near ␀a31m cost for local infrastructure repairs [PAG,MUL] (p5)</p></div><div class="nugget-popup quant"><p>295 properties affected in June 2016; 186 properties affected on 11 June 2016; 77 properties affected on 16 June 2016; 75 properties affected on 8 June 2016; 30 properties affected on 10 June 2016 [MUL] (p11)</p></div><div class="nugget-popup quant"><p>295 properties; 186 properties on 11 June 2016; 77 properties on 16 June 2016; 75 properties on 8 June 2016; 30 properties on 10 June 2016 [PAG,IMG,MUL] (p12)</p></div><div class="nugget-popup quant"><p>75 properties (8 June 2016); 30 properties (10 June 2016) [PAG,MUL] (p13)</p></div><div class="nugget-popup quant"><p>104 properties internally flooded; 82 properties externally only; 186 properties total on 11 June 2016 [MUL] (p14)</p></div><div class="nugget-popup quant"><p>75 properties affected on 8 June; 30 properties affected on 10 June; 186 properties affected on 11 June; 77 properties affected on 16 June; 295 properties affected in June 2016 (some properties flooded more than once) [PAG,MUL] (p16)</p></div><div class="nugget-popup quant"><p>64 residential properties; 47 properties with external flooding; 17 properties with internal flooding. (p19)</p></div><div class="nugget-popup quant"><p>5 properties; 23 properties (front gardens); 1 property; 2 properties (p22)</p></div><div class="nugget-popup quant"><p>57 residential properties affected on 8 June 2016 (17 internal); 68 residential properties affected on 11 June 2016 (66 internal); 50 properties flooded on both 8 and 11 June 2016. [MUL] (p23)</p></div><div class="nugget-popup quant"><p>68 residential properties flooded on 11 June; 66 properties suffered internal flooding on 11 June; 50 properties flooded on 8 June also flooded again on 11 June; Shearwater Road: 23 properties internally flooded (11 June); Fulmar Drive: 25 properties internally flooded (11 June); Minsmere Walks: 12 properties internally flooded (11 June); Bean Leach Road: 3 properties internally flooded (11 June); Teal Close: 2 properties internally flooded (11 June); Marple Old Road: 1 property internally flooded (11 June); 7 properties on Holiday Lane flooded again on 16 June. [IMG,MUL] (p24)</p></div><div class="nugget-popup quant"><p>40 residential properties; 25 properties on Edgeley Road; 6 properties on Oak Street; 4 properties on St Lesmo Road; 2 properties on Clwyd Avenue; 1 property on The Circuit; 7 properties on Holiday Lane [PAG,MUL] (p26)</p></div><div class="nugget-popup quant"><p>40 residential properties (in Edgeley) [IMG,PAG] (p27)</p></div><div class="nugget-popup quant"><p>17 residential properties; 11 properties internal flooding on Windmill Lane; 4 properties internal flooding on Gorton Road; 2 properties internal flooding on Greg Street; 1 property external flooding on Wemyss Avenue (p29)</p></div><div class="nugget-popup quant"><p>34 properties in Cheadle flooded across the four June 2016 events (see Cheadle details). [PAG,MUL] (p31)</p></div><div class="nugget-popup quant"><p>14 properties (11 June 2016); 7 properties (16 June 2016); 4 properties flooded on both dates [MUL] (p33)</p></div></div></body></div>`)[0];

                var html_64b3fb2dee54328d355c2f6403628b5e = $(`<div id="html_64b3fb2dee54328d355c2f6403628b5e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Offerton Green, Offerton</h1><div class="nugget-popup"><p>Significant community flooding on 11 June 2016; identified as one of the worst impacted communities during the event. (p4)</p></div><div class="nugget-popup"><p>Area reported as the worst affected on 8 June during surface&ndash;water surcharge of drains and was affected again during the 11 June event when river levels rose and drainage systems were overwhelmed. [MUL] (p5)</p></div><div class="nugget-popup"><p>Fluvial flooding affected Offerton Green due to raised levels on Poise Brook; this is associated with the peak gauge level recorded at the Cooper Street outlet debris screen. (p11)</p></div><div class="nugget-popup"><p>Severe property flooding concentrated in this community. Offerton Green accounted for the majority of property flooding on 8 June 2016 and was reported among communities suffering significant flooding on 11 June 2016. [TAB,PAG,MUL] (p13)</p></div><div class="nugget-popup"><p>Significant property flooding including internal and external inundation; repeated incidents with many properties flooded on multiple event dates. [TAB,MUL] (p14)</p></div><div class="nugget-popup"><p>Properties were flooded due to sewer&ndash;related flooding: 7 properties experienced external&ndash;only flooding on 16 June 2016; United Utilities records indicate these same 7 properties were also flooded on 8 June 2016. [TAB,PAG,MUL] (p15)</p></div><div class="nugget-popup"><p>Offerton Green experienced property flooding from the extreme June 2016 rainfall events (notably 8 and 11 June). Flooding was concentrated around residential streets adjacent to Poise Brook and required some evacuations; United Utilities records show repeated flooding of many properties between events. [IMG,PAG,MUL] (p23)</p></div><div class="nugget-popup"><p>Residential properties experienced both surface&ndash;water and river (Poise Brook) flooding; many properties suffered internal flooding, some residents were evacuated and local roads were closed. [IMG,PAG,MUL] (p24)</p></div><div class="nugget-popup"><p>Following intense, prolonged rainfall the local surface water sewer was overwhelmed causing surface water and sewer flooding in the estate; later Poise Brook overtopped and caused fluvial flooding that entered the estate. Flood flow routes show water diverted from Bean Leach Road into the housing estate; the lowest streets (Shearwater Road, Fulmar Drive and Teal Close) experienced the majority of property flooding. [IMG,PAG] (p25)</p></div><div class="nugget-popup"><p>On 11 June 2016 the area experienced surface water and sewer flooding first (surface water sewer overwhelmed by intense local rainfall), followed by fluvial flooding as Poise Brook rose and spilled out of bank. Floodwater was obstructed behind a private embankment and diverted via Bean Leach Road into the housing estate; rising river levels also impeded the surface water sewer outfall, exacerbating flooding. (p26)</p></div><div class="nugget-popup"><p>Council attended site and visited individual properties to assist residents. United Utilities attended site to assist affected customers. A Flood Alert for Poise Brook (affecting Offerton Green) was issued at 19:42 on 11 June. [TAB,MUL] (p38)</p></div><div class="nugget-popup"><p>Flood Alert issued at 19:42 on 11 June 2016 for Poise Brook (within the River Mersey Uplands Catchment), with Offerton Green identified as being within the Flood Alert area, indicating possible river&ndash;related flooding. [PAG] (p39)</p></div><div class="nugget-popup"><p>Offerton Green was impacted by fluvial flooding from Poise Brook and is the focus of reviews of flood mitigation options and of flood warning trigger levels for the Poise Brook flood warning area. [TAB,MUL] (p42)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>186 properties (p4)</p></div><div class="nugget-popup quant"><p>Part of the 75 properties flooded on 8 June; part of the 186 properties affected on 11 June (these totals are across multiple areas) [MUL] (p5)</p></div><div class="nugget-popup quant"><p>peak level 2.04 m (p11)</p></div><div class="nugget-popup quant"><p>57 properties (8 June 2016; 17 internally flooded, 40 externally only) [TAB,PAG,MUL] (p13)</p></div><div class="nugget-popup quant"><p>66 properties internally flooded; 2 properties externally only; 68 properties total on 11 June 2016; 50 properties flooded on 8 June 2016 also flooded again on 11 June 2016; 7 properties flooded on 8 June 2016 also flooded on 16 June 2016 [TAB,MUL] (p14)</p></div><div class="nugget-popup quant"><p>7 properties externally; flooded on 8 June 2016 and 16 June 2016. [TAB,PAG,MUL] (p15)</p></div><div class="nugget-popup quant"><p>57 residential properties affected on 8 June 2016; 17 of these suffered internal flooding; 68 residential properties affected on 11 June 2016; 66 of these suffered internal flooding; 50 properties flooded on both 8 and 11 June; 23 properties on Shearwater Road flooded internally; 25 properties on Fulmar Drive flooded internally; 12 properties on Minsmere Walks flooded internally; 3 properties on Bean Leach Road flooded internally; 2 properties on Teal Close flooded internally; 1 property on Marple Old Road flooded internally; some local residents evacuated. [IMG,PAG,MUL] (p23)</p></div><div class="nugget-popup quant"><p>68 residential properties flooded on 11 June 2016; 66 properties suffered internal flooding on 11 June 2016; 50 properties flooded on both 8 June 2016 and 11 June 2016; 7 properties on Holiday Lane flooded again on 16 June 2016. [IMG,PAG,MUL] (p24)</p></div></div></body></div>`)[0];

                var html_df571701dc13d3dc3dd283e50383436b = $(`<div id="html_df571701dc13d3dc3dd283e50383436b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hazel Grove</h1><div class="nugget-popup"><p>Significant community flooding during the event on 11 June 2016, reported as one of the worst impacted communities. (p4)</p></div><div class="nugget-popup"><p>Impacted by flooding on 11 June 2016 when prolonged heavy rainfall caused river levels to rise and local drainage systems to become overwhelmed; part of the area included in the group where properties were flooded during this event. (p5)</p></div><div class="nugget-popup"><p>Impacted by raised Poise Brook levels leading to fluvial flooding (impacts are the subject of further analysis in the report's Section 3.2/3.3). (p11)</p></div><div class="nugget-popup"><p>Fluvial flooding from Poise Brook on 11 June 2016 (Poise Brook gauge recorded its highest level, 2.04 m) caused raised river levels that contributed to property flooding in Hazel Grove. The event maps also show severe surface&ndash;water incidents near Hazel Grove on 8 June 2016 (additional surface&ndash;water impacts on that date are indicated by the mapping but are less specifically described in the text). [IMG,MUL] (p12)</p></div><div class="nugget-popup"><p>Property flooding recorded on 8 June 2016 and noted among communities suffering significant flooding on 11 June 2016. [TAB,PAG,MUL] (p13)</p></div><div class="nugget-popup"><p>Substantial property flooding including both internal and external inundation during the 11 June event. [TAB] (p14)</p></div><div class="nugget-popup"><p>On 11 June 2016 prolonged heavy rainfall caused river levels to rise and local drainage to be overwhelmed, resulting in flooding in Hazel Grove. (p16)</p></div><div class="nugget-popup"><p>On 11 June 2016 Hazel Grove experienced flooding that affected residential properties, public open space and the highway. Torkington Park was inundated. Roads were closed to traffic (Torkington Road and Hazelwood Road). Both external and internal property flooding were reported across the suburb. [PAG] (p19)</p></div><div class="nugget-popup"><p>Majority of residential properties in Hazel Grove were flooded by Hazel Grove Brook. Highway (surface&ndash;water) flooding occurred and sewer and groundwater flooding also contributed to local impacts during the intense convective storm. [IMG,PAG] (p20)</p></div><div class="nugget-popup"><p>The majority of properties within Hazel Grove were flooded by Hazel Grove Brook. Highway flooding occurred and sewer and groundwater flooding were also contributing factors to property and highway impacts. [IMG,PAG] (p21)</p></div><div class="nugget-popup"><p>External flooding of a residential property caused by a non&ndash;United Utilities sewer (reported as 'Non&ndash;UU sewer'). [TAB] (p34)</p></div><div class="nugget-popup"><p>Residents evacuated and the Council established an evacuation centre (Hazel Grove Life Centre); officers visited individual properties to assist residents. A Flood Alert for Poise Brook affecting Hazel Grove was issued at 19:42 on 11 June. [TAB] (p38)</p></div><div class="nugget-popup"><p>Environment Agency Flood Alert issued during the June 2016 event (area covered by a Flood Alert on 11 June 2016), indicating possible river&ndash;related flooding. (p39)</p></div><div class="nugget-popup"><p>Community support and recovery activities after flooding including site inspection at Torkington Park, debris&ndash;screen cleaning, and supported community drop&ndash;in sessions and door&ndash;to&ndash;door surveys. [TAB] (p40)</p></div><div class="nugget-popup"><p>Hazel Grove (notably the Kintore Avenue area) experienced surface water/highway flooding issues during the June 2016 events, leading to targeted drainage improvement recommendations. [TAB,PAG,MUL] (p41)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>186 properties (p4)</p></div><div class="nugget-popup quant"><p>186 properties (total across Bramhall Green, Hazel Grove, Heald Green and Offerton Green) (p5)</p></div><div class="nugget-popup quant"><p>1 property (internally flooded) (8 June 2016) [TAB,PAG,MUL] (p13)</p></div><div class="nugget-popup quant"><p>17 properties internally flooded; 47 properties externally only; 64 properties total on 11 June 2016 [TAB] (p14)</p></div><div class="nugget-popup quant"><p>64 residential properties; 47 properties with external flooding; 17 properties with internal flooding; external breakdown: 23 properties on Nelson Street, 15 properties on Hazelwood Road, 5 properties on Wellington Street, 2 properties on Knowsley Road, 1 property on Buckwood Close, 1 property on Macclesfield Road; internal breakdown: 5 properties on Hazelwood Road, 4 properties on Torkington Road, 3 properties on Buxton Road, 2 properties on Chester Road, 2 properties on Kintore Avenue, 1 property on Offerton Road. [PAG] (p19)</p></div><div class="nugget-popup quant"><p>1 property (external) [TAB] (p34)</p></div></div></body></div>`)[0];

                var html_695c66f3aa72f7733d985303c7d8820e = $(`<div id="html_695c66f3aa72f7733d985303c7d8820e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bramhall</h1><div class="nugget-popup"><p>The 11 June 2016 event produced concentrated severe property flooding near Bramhall (maps and text identify several severe and moderate incidents on 11 June); shorter, high&ndash;intensity surface&ndash;water incidents also occurred in the June sequence. [PAG,IMG] (p12)</p></div><div class="nugget-popup"><p>Property flooding affecting two properties: one internally flooded and one externally flooded only. [TAB,PAG] (p13)</p></div><div class="nugget-popup"><p>Bramhall experienced property flooding on 11 June 2016, with external property flooding recorded. [TAB] (p14)</p></div><div class="nugget-popup"><p>Properties on Bridge Lane in the Bramhall Green area were flooded when highway drainage was overwhelmed by intense rainfall and rising levels on Lady Brook overtopped into the rear of properties; the flooding led to evacuations and road closures. [PAG,IMG] (p16)</p></div><div class="nugget-popup"><p>On 11 June 2016 intense, prolonged rainfall overwhelmed highway drains causing surface water to pool on Bridge Lane and at Bramhall Green roundabout. Later rising levels in Lady Brook overtopped into the rear of properties on Bridge Lane and flowed towards the road. The roundabout and Bridge Lane were closed to traffic and some residents were evacuated. [PAG,IMG] (p17)</p></div><div class="nugget-popup"><p>Bridge Lane in Bramhall has a history of flooding: a violent thunderstorm in July 1973 caused drainage sewers to spill and Lady Brook to burst its banks, leaving shops and houses under water to a depth of three feet; Lady Brook also flooded gardens on Bridge Lane in April 2010. During the 11 June 2016 rainfall event a manhole at the Bramhall Green roundabout lifted and spilled water onto the highway. [IMG,PAG,MUL] (p18)</p></div><div class="nugget-popup"><p>Residential properties flooded due to sewer blockages and a separate UU sewer blockage incident &mdash; internal and external flooding recorded across events on 8 and 11 June 2016. [TAB,MUL] (p34)</p></div><div class="nugget-popup"><p>Flooded watercourses damaged riverbanks and trees and transferred debris through greenspaces including Bramhall Happy Valley Park; the Council has commenced repair works to Bramhall Happy Valley Park and is identifying funding for remaining repairs to damaged greenspaces. [TAB,PAG] (p38)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 internally flooded property; 1 externally flooded property; total 2 properties [TAB,PAG] (p13)</p></div><div class="nugget-popup quant"><p>0 properties internally; 1 property externally; 1 property total [TAB] (p14)</p></div><div class="nugget-popup quant"><p>18 properties; 12 properties internally flooded [PAG,IMG] (p16)</p></div><div class="nugget-popup quant"><p>18 properties; 12 properties [PAG,IMG] (p17)</p></div><div class="nugget-popup quant"><p>three feet [IMG,PAG,MUL] (p18)</p></div><div class="nugget-popup quant"><p>On 8 June 2016: 2 properties flooded (Non&ndash;UU sewer; 1 internal, 1 external) and 2 properties flooded (UU sewer; 2 internal). On 11 June 2016: 1 property externally flooded (UU sewer). [TAB,MUL] (p34)</p></div></div></body></div>`)[0];

                var html_1e3d6e5235c8415e5857e4e7f0478843 = $(`<div id="html_1e3d6e5235c8415e5857e4e7f0478843" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Cheadle</h1><div class="nugget-popup"><p>Surface water flooding occurred when extreme rainfall overloaded local drains and sewers, affecting properties and causing local disruption during two events in June. [MUL] (p5)</p></div><div class="nugget-popup"><p>Property flooding occurred in Cheadle associated with the very intense short&ndash;duration rainfall recorded on 16 June 2016. [PAG] (p10)</p></div><div class="nugget-popup"><p>Surface&ndash;water / urban drainage flooding produced moderate to significant property flooding in the Cheadle area during June 2016 (notably on 16 June 2016 and with a smaller/moderate incident shown on 10 June 2016 on the event maps). [PAG,IMG,MUL] (p12)</p></div><div class="nugget-popup"><p>Property flooding occurred on both 8 June and 10 June 2016. On 8 June Cheadle had internal property flooding; on 10 June it was one of the communities with the majority of incidents. [TAB,MUL] (p13)</p></div><div class="nugget-popup"><p>Cheadle experienced property flooding on 11 June 2016 (internal and external) and was also affected during the 16 June 2016 event where it accounted for roughly 25% of incidents; the 11 June impacts involved fluvial contribution combined with sewer/groundwater flooding, while the 16 June event was driven mainly by sewers. [TAB,PAG,MUL] (p14)</p></div><div class="nugget-popup"><p>Properties were flooded due to sewer&ndash;related flooding on 16 June 2016: 18 properties experienced internal flooding and 1 property external&ndash;only flooding. [TAB,PAG] (p15)</p></div><div class="nugget-popup"><p>Property flooding occurred during four June 2016 rainfall events. Flooding was linked primarily to highway flooding and sewer&ndash;related flooding (blockages in United Utilities maintained sewers, highway drainage systems or privately maintained sewers). [IMG,PAG,MUL] (p30)</p></div><div class="nugget-popup"><p>Cheadle experienced repeated property flooding across four June 2016 events. Flooding was predominantly internal (sewer&ndash;related) but on 16 June many businesses on High Street were flooded by surface water ponding on the highway outside premises. [PAG,MUL] (p31)</p></div><div class="nugget-popup"><p>Flood impacts in the town investigated (High Street drainage investigated, blockages removed and cleaning carried out). [TAB] (p40)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Part of the 30 properties flooded on 10 June (across Cheadle and Reddish); part of the 77 properties affected on 16 June (across Edgeley and Cheadle) [MUL] (p5)</p></div><div class="nugget-popup quant"><p>3 properties (internally flooded) (8 June 2016); 10 properties (internally flooded) (10 June 2016) [TAB,MUL] (p13)</p></div><div class="nugget-popup quant"><p>1 property internally; 1 property externally; 2 properties total (11 June 2016) [TAB,PAG,MUL] (p14)</p></div><div class="nugget-popup quant"><p>18 properties internally; 1 property externally; total 19 properties. [TAB,PAG] (p15)</p></div><div class="nugget-popup quant"><p>16 June 2016: 19 properties (9 residential, 10 non&ndash;residential); 10 June 2016: 10 properties (8 residential, 2 non&ndash;residential); 8 June 2016: 3 residential properties; 11 June 2016: 2 properties (1 residential, 1 non&ndash;residential). [IMG,PAG,MUL] (p30)</p></div><div class="nugget-popup quant"><p>34 properties flooded across the four events (3 on 8 June 2016; 10 on 10 June 2016; 2 on 11 June 2016; 19 on 16 June 2016). 10 non&ndash;residential properties flooded on High Street on 16 June 2016; seven commercial properties flooded on 16 June 2016 due to surface water ponding on the highway. [PAG,MUL] (p31)</p></div></div></body></div>`)[0];

                var html_ef991a99f3df65168b985d9da114bd41 = $(`<div id="html_ef991a99f3df65168b985d9da114bd41" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Reddish</h1><div class="nugget-popup"><p>Surface water flooding when local drainage was overloaded by extreme rainfall, resulting in property flooding. (p5)</p></div><div class="nugget-popup"><p>Significant property flooding concentrated in Reddish on 10 June 2016, with the community experiencing the majority of that day's incidents. The event was predominantly sewer flooding across the borough, with some incidents caused by groundwater. [TAB] (p13)</p></div><div class="nugget-popup"><p>Sewer and groundwater flooding affected residential properties in Reddish: internal flooding at properties on Windmill Lane, Gorton Road and Greg Street, and external flooding at one property on Wemyss Avenue. United Utilities investigations found sewers were unable to cope with the intensity of the rainfall (no defects found for Windmill Lane properties), and a sewer blockage causing external flooding at Wemyss Avenue was located and cleared. Groundwater flooding on Gorton Road and Greg Street was identified as a separate cause. [IMG] (p29)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Part of the 30 properties flooded on 10 June (across Cheadle and Reddish) (p5)</p></div><div class="nugget-popup quant"><p>17 properties (16 internally flooded, 1 externally) (10 June 2016) [TAB] (p13)</p></div><div class="nugget-popup quant"><p>17 residential properties; 11 internal floods (Windmill Lane); 4 internal floods (Gorton Road); 2 internal floods (Greg Street); 1 external flood (Wemyss Avenue) [IMG] (p29)</p></div></div></body></div>`)[0];

                var html_b52929a9c2ea19d90e64a6bec6d24026 = $(`<div id="html_b52929a9c2ea19d90e64a6bec6d24026" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bramhall Green</h1><div class="nugget-popup"><p>Flooding occurred when prolonged heavy rainfall caused river levels to rise and local drainage systems to be overwhelmed; Bramhall Green roundabout was severely flooded (photo evidence) impairing traffic and stranding vehicles. [IMG] (p5)</p></div><div class="nugget-popup"><p>Properties experienced internal and external flooding during the 11 June event. [TAB] (p14)</p></div><div class="nugget-popup"><p>On 11 June 2016 heavy rainfall overwhelmed highway drainage causing surface water to pool at the Bramhall Green roundabout and on Bridge Lane; later rising levels on Lady Brook overtopped into the rear of properties. The roundabout and Bridge Lane were flooded and closed; some residents were evacuated. [PAG,IMG] (p16)</p></div><div class="nugget-popup"><p>On 11 June 2016 a manhole on the Bramhall Green roundabout lifted and spilled water onto the highway. The Council's subsequent inspection found sections of connecting pipework in poor structural condition and partially blocked by roots; the Council replaced pipework and installed a new manhole chamber as a response. [IMG] (p18)</p></div><div class="nugget-popup"><p>Environment Agency Flood Alert issued during the June 2016 event (area covered by a Flood Alert on 11 June 2016), indicating possible river&ndash;related flooding. (p39)</p></div><div class="nugget-popup"><p>Inspection and replacement of a damaged section of sewer on Bramhall Green roundabout; site inspections carried out at Bramhall Park, Bramhall Green roundabout and along Lady Brook following flood impacts. [TAB] (p40)</p></div><div class="nugget-popup"><p>Bramhall Green was affected by fluvial (river) flooding from Lady Brook, prompting consideration of options to reduce fluvial flood risk. [TAB,MUL] (p42)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Part of the 186 properties affected on 11 June (across Bramhall Green, Hazel Grove, Heald Green and Offerton Green) [IMG] (p5)</p></div><div class="nugget-popup quant"><p>12 properties internally flooded; 6 properties externally only; 18 properties total on 11 June 2016 [TAB] (p14)</p></div><div class="nugget-popup quant"><p>18 properties flooded on Bridge Lane; 12 properties internally flooded [PAG,IMG] (p16)</p></div></div></body></div>`)[0];

L] (p33)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>186 properties (total across Bramhall Green, Hazel Grove, Heald Green and Offerton Green) (p5)</p></div><div class="nugget-popup quant"><p>1 property (externally flooded) (8 June 2016) [TAB,PAG,MUL] (p13)</p></div><div class="nugget-popup quant"><p>3 properties internally flooded; 11 properties externally only; 14 properties total on 11 June 2016 [TAB] (p14)</p></div><div class="nugget-popup quant"><p>4 properties internally; 4 properties externally; total 8 properties. [TAB] (p15)</p></div><div class="nugget-popup quant"><p>19 properties; 4 properties flooded on more than one occasion; 14 properties (11 June 2016); 1 property (St. Ann's Road, 8 June 2016) [IMG,MUL] (p32)</p></div><div class="nugget-popup quant"><p>14 properties (11 June 2016); 7 properties (16 June 2016); 4 properties flooded on both 11 and 16 June 2016 [PAG,MUL] (p33)</p></div></div></body></div>`)[0];

                var html_e6d1c9d478f7ff6c226ba680cdb69302 = $(`<div id="html_e6d1c9d478f7ff6c226ba680cdb69302" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Edgeley</h1><div class="nugget-popup"><p>Impacted by surface water flooding on 16 June 2016 after intense rainfall overloaded local drains and sewers; part of the area where properties were flooded during this event. (p5)</p></div><div class="nugget-popup"><p>Property flooding occurred in Edgeley on 16 June 2016 linked to the heavy short&ndash;duration rainfall that day. [PAG] (p10)</p></div><div class="nugget-popup"><p>Edgeley experienced a concentrated property flooding impact during the 16 June 2016 event, with sewer flooding recorded as the main source of flooding for that event. (p14)</p></div><div class="nugget-popup"><p>Properties were flooded due to sewer&ndash;related flooding on 16 June 2016: 33 properties experienced internal flooding and 7 properties external&ndash;only flooding. [TAB,PAG] (p15)</p></div><div class="nugget-popup"><p>During the evening of 16 June 2016, residential and highway flooding occurred across Edgeley. Sewer surcharge caused most property flooding; surface water runoff from Bonar Park/Recreation Ground and a blocked surface water sewer on Myrtle Street caused additional highway and property flooding and ponding at Myrtle Street/A560 Brinksway. [IMG] (p27)</p></div><div class="nugget-popup"><p>During the evening of 16 June 2016 about 40 residential properties across Edgeley flooded (mostly internal). The greatest concentration was around Edgeley Road (25 properties flooded, all but one internally). Other property impacts included 6 properties on Oak Street, 4 on St Lesmo Road, 2 on Clwyd Avenue and 1 on The Circuit. Highway, pavement and driveway flooding occurred at the eastern end of Laburnum Way, and surface water ponding affected the junction of Myrtle Street and the A560 Brinksway. Runoff from Bonar Park and a blockage in the surface water sewer on Myrtle Street contributed to surface water flowing down Myrtle Street onto Oak Street and pooling at the Brinksway junction. United Utilities attended during the event, removed the Myrtle Street blockage and later inspected sewers and removed roots. (p28)</p></div><div class="nugget-popup"><p>Council as LLFA attended and visited individual properties assisting residents following flooding; United Utilities attended and cleared a blockage (Myrtle Street) associated with the incident. [TAB] (p38)</p></div><div class="nugget-popup"><p>Flooding in the Laburnum Way area was investigated and cleaned up; blocked gullies and land drainage issues on Bonar Park were reported. A blockage in the Myrtle Street sewer was removed and the sewer is being reviewed to prevent future blockages. [TAB] (p40)</p></div><div class="nugget-popup"><p>A blockage on the Myrtle Road sewer is being reviewed following sewer&ndash;related flooding in Edgeley; investigation aims to prevent recurrence. [TAB,MUL] (p42)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>77 properties (total across Edgeley and Cheadle) (p5)</p></div><div class="nugget-popup quant"><p>33 properties internally; 7 properties externally; total 40 properties. [TAB,PAG] (p15)</p></div><div class="nugget-popup quant"><p>40 residential properties flooded [IMG] (p27)</p></div><div class="nugget-popup quant"><p>40 residential properties; 25 properties on/around Edgeley Road; 6 properties on Oak Street; 4 properties on St Lesmo Road; 2 properties on Clwyd Avenue; 1 property on The Circuit (p28)</p></div></div></body></div>`)[0];
