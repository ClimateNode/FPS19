                var html_9c3e4f42eeb93a73ff379a4dae08d7f3 = $(`<div id="html_9c3e4f42eeb93a73ff379a4dae08d7f3" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Borough of Westminster</h1><div class="nugget-popup"><p>On 12 July 2021 intense rainfall and thunderstorms caused flooding to areas of Westminster (specifically Paddington and the West Kilburn / Maida Vale areas). Highway drains and the local sewer network were unable to cope with the high volume of rainfall, contributing to the flooding. [PAG] (p1)</p></div><div class="nugget-popup"><p>Widespread flooding across the City of Westminster: properties, roads and community facilities inundated; residents evacuated from several streets; transport services disrupted (London Underground delays/closures). Thames Water reported internal flooding in a subset of properties. [PAG] (p2)</p></div><div class="nugget-popup"><p>Flooding occurred across the borough as a result of a combination of surface water and sewer flooding; affected areas included Maida Vale and West Kilburn. [PAG] (p3)</p></div><div class="nugget-popup"><p>Parts of Westminster experienced surface water flooding during the extreme storm on 12 July 2021. WCC's Surface Water Flood Map shows the locations indicated as high risk included areas that flooded during the 12 July event. [PAG] (p5)</p></div><div class="nugget-popup"><p>Historic and recent floods affected transport and properties in Westminster: closure of Victoria Station and flooding of Westminster Station entrance (historic incidents cited in PFRA); basement property flooding on Formosa Street due to sewer flooding; property flooding along Dorset Street from surface water; Maida Vale recorded flooding in June 2009 and July 2007 linked to sewer network overload; parts of Westminster contained areas that experienced flooding during the 12 July 2021 surface&ndash;water flood event (per WCC mapping). [MUL] (p6)</p></div><div class="nugget-popup"><p>Intense convective rainfall on 12 July 2021 produced surface water runoff that overwhelmed urban drainage and sewer systems, causing sewer flooding and property flooding within Westminster; the report references historic sewer&ndash;flooding records for Westminster postcodes and ongoing review with Thames Water about the event. [PAG] (p7)</p></div><div class="nugget-popup"><p>Central Westminster was at the core of intense, localized heavy rainfall on 12 July 2021 which produced surface&ndash;water/urban flooding in the area (radar shows rainfall cores up to and exceeding 16&ndash;32 mm/hour). The flooding formed part of the wider London event that generated large volumes of emergency and utility calls. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>Intense afternoon rainfall on 12th July 2021 overwhelmed highway drainage and sewerage systems within Westminster causing sewer surcharge and resulting in flooding to property basements. (p16)</p></div><div class="nugget-popup"><p>Surface&ndash;water/urban flooding impacted the road network across the Westminster administrative area: impacted roads are concentrated in north&ndash;west Westminster (Maida Vale and West Kilburn), a secondary cluster in Paddington (central&ndash;west), with additional scattered affected routes in central and southern parts of the borough. [IMG] (p21)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>230 properties; 64 roads; 80 properties flooded internally; 1 primary school; 3 libraries; 3 community centres; 7 London Underground lines [PAG] (p2)</p></div><div class="nugget-popup quant"><p>39 properties (flooded in Pimlico on 29 May 2018) [MUL] (p6)</p></div><div class="nugget-popup quant"><p>1,362 internal incidents in the last 20 years; 14 occurrences of at least 2 internal incidents in the last 10 years; 28 occurrences of at least 1 internal incident in the last 10 years; 4 external incidents (last 10 years); 2 external incidents (last 10 years) (values from the table of historic sewer&ndash;flooding records). [PAG] (p7)</p></div></div></body></div>`)[0];

                var html_6f3d801f14646620f13004d3e06c9d5a = $(`<div id="html_6f3d801f14646620f13004d3e06c9d5a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Region</h1><div class="nugget-popup"><p>Intense rainfall on 12 July 2021 caused surface water/urban flooding in Westminster (London). Across Westminster this event impacted properties, roads, public buildings and transport: approximately 230 properties and 64 roads were reported impacted, 80 of those properties were reported by Thames Water as having flooded internally, and seven London Underground lines were delayed or closed due to flooding or signal failures. [PAG] (p2)</p></div><div class="nugget-popup"><p>Flooding occurred within the City of Westminster borough (part of Greater London) as a result of a combination of surface water and sewer flooding. (p3)</p></div><div class="nugget-popup"><p>Widespread surface&ndash;water/urban flooding across London on 12 July 2021 caused a major demand on emergency and utility services and local authority call handling, indicating widespread impacts from the intense, localized rainfall. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>Intense rainfall and thunderstorms on 12th July 2021 caused flooding in parts of Westminster (including Paddington and the West Kilburn / Maida Vale areas). Highway drains and the local sewer network were unable to cope with the high volume of rainfall, resulting in urban/surface water and sewer&ndash;related flooding across the affected areas. [PAG] (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>approximately 230 properties; 64 roads; 80 properties; seven London Underground lines [PAG] (p2)</p></div><div class="nugget-popup quant"><p>over 1,000 calls (London Fire Brigade); over 2,500 calls in five hours (Thames Water); 1,173 calls (council out&ndash;of&ndash;hours call centre) [IMG,PAG] (p9)</p></div><div class="nugget-popup quant"><p>over 150 properties [PAG] (p18)</p></div></div></body></div>`)[0];

                var html_a8b3838da4fd44c2752a4da3dbc3ec85 = $(`<div id="html_a8b3838da4fd44c2752a4da3dbc3ec85" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Maida Vale</h1><div class="nugget-popup"><p>Maida Vale is reported as one of the areas in Westminster affected by the intense rainfall and resulting flooding; evacuations on the listed streets are reported across the West Kilburn / Maida Vale area. (p2)</p></div><div class="nugget-popup"><p>Maida Vale was one of the areas affected by the flood in Westminster, which resulted from a combination of surface water and sewer flooding. (p3)</p></div><div class="nugget-popup"><p>The Maida Vale Flood Alleviation Scheme (constructed 2015) was engaged in relation to the 12 July 2021 storm; its performance during the 12 July 2021 flood event is under review to determine how the scheme managed combined sewer flows and whether storage/relief features operated as intended. [PAG] (p4)</p></div><div class="nugget-popup"><p>Area experienced flooding during the 12 July 2021 storm event. The Maida Vale Flood Alleviation system (storage shafts and relief sewers) was used to divert excess stormwater and sewer flows into storage and then pump flows back into the receiving sewer after the storm to manage sewer flooding. [IMG,PAG] (p5)</p></div><div class="nugget-popup"><p>Internal flooding to a property (entry indicates one affected property). [TAB] (p11)</p></div><div class="nugget-popup"><p>Intense rainfall in Maida Vale on 12th July 2021 produced runoff that tried to enter the sewer network, contributing to the network being at capacity and to sewer surcharge and flooding in Westminster. (p16)</p></div><div class="nugget-popup"><p>Identified as one of the worst&ndash;affected areas during the 12th July 2021 flood; experienced surface water flooding. Gullies in the area had generally been cleansed within three months prior to the event and were not judged to be the cause of the flooding. (p17)</p></div><div class="nugget-popup"><p>A concentrated cluster of impacted roads (blue lines on the map) in the Maida Vale / north&ndash;west Westminster area indicates surface&ndash;water/urban flooding affected the local road network. [IMG] (p21)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 roads evacuated (impacts reported across West Kilburn / Maida Vale) (p2)</p></div><div class="nugget-popup quant"><p>one additional overspill tank (tank over 15 m diameter and 15 m deep) constructed as part of the scheme [IMG,PAG] (p5)</p></div><div class="nugget-popup quant"><p>1 internally flooded property [TAB] (p11)</p></div></div></body></div>`)[0];
