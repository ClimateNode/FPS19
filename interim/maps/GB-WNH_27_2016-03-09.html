                var html_5d8086231f0c460d104471d61777e8ad = $(`<div id="html_5d8086231f0c460d104471d61777e8ad" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Cherwell</h1><div class="nugget-popup"><p>The River Cherwell is the nearby watercourse adjacent to the affected/flooded property. Mapping shows the flooded property located adjacent to an area at high risk of river flooding. Local channels and a brick culvert connect from the property area into the River Cherwell (connections ~100m and ~90m from the property), indicating the river and connected channels were implicated in the flooding at the affected property. (p10)</p></div><div class="nugget-popup"><p>River levels rose beyond the channel on the morning of 9 March 2016, overtopped banks, flooded land either side of the river, overtopped local drainage ditches and flowed down the mill wheel channel; high flows and overtopping contributed to culverts beneath Eydon&ndash;Byfield Road being overwhelmed, creating a damming effect and leading to flooding to the road and nearby property. [PAG] (p12)</p></div><div class="nugget-popup"><p>Heavy rainfall over a saturated catchment caused high flows in the River Cherwell; water levels rose and strong flows overtopped the banks, producing excess surface water flowing to low points around properties. High water levels migrated through permeable soils and also caused groundwater flooding. (p13)</p></div><div class="nugget-popup"><p>The river was in flood, overflowing its banks and inundating adjacent land and infrastructure (evidenced by the submerged footbridge and flooded fields). [IMG,PAG] (p41)</p></div></div></body></div>`)[0];

                var html_87c1b356bb8ef08ef0f8821dbeddb0e4 = $(`<div id="html_87c1b356bb8ef08ef0f8821dbeddb0e4" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Northamptonshire</h1><div class="nugget-popup"><p>Internal flooding of a residential property (listed former mill house) on Byfield&ndash;Eydon Road, West Farndon, which lies within Northamptonshire; the property experienced internal flooding on 9 March 2016 and on other occasions in the previous five years. (p9)</p></div><div class="nugget-popup"><p>Above&ndash;average monthly rainfall in December 2015 and February 2016 led to saturated ground across catchments in Northamptonshire, and intense rainfall on 09/03/2016. These conditions contributed to groundwater rising and to flooding of properties (groundwater ingress through stone tiled flooring and flood water around sides and front of properties). [MUL] (p11)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>one property (p9)</p></div></div></body></div>`)[0];
