                var html_b0ea96a807664d701e88f12d18fdff86 = $(`<div id="html_b0ea96a807664d701e88f12d18fdff86" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Devon</h1><div class="nugget-popup"><p>Intense, very localised rainfall overwhelmed drainage systems across Devon, causing widespread surface water runoff and high numbers of internal property floodings. (p1)</p></div><div class="nugget-popup"><p>Widespread surface water flooding across the county on 17 August 2020 causing internal flooding to properties and disruption to transport networks; totals reported for the event were 175 properties flooded across Devon, concentrated in Barnstaple. [IMG] (p2)</p></div><div class="nugget-popup"><p>A very short&ndash;duration, high&ndash;intensity rainfall event produced large volumes of surface water that overwhelmed local drainage across Devon, affecting multiple areas (including Crediton, Holsworthy, Newton Abbot, North Tawton and Okehampton) and causing flooding of residential properties. [TAB] (p5)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>175 properties internal flooding; 128 residential; 47 commercial; 164 properties in Barnstaple (p1)</p></div><div class="nugget-popup quant"><p>175 properties flooded; 128 residential; 47 commercial; 164 properties in Barnstaple (of which 118 residential and 46 commercial) [IMG] (p2)</p></div><div class="nugget-popup quant"><p>5 properties (across Crediton, Holsworthy, Newton Abbot, North Tawton and Okehampton) [TAB] (p5)</p></div></div></body></div>`)[0];

                var html_9cdbac0a2b6e0124e8b1f7a31bce3191 = $(`<div id="html_9cdbac0a2b6e0124e8b1f7a31bce3191" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>South West England</h1><div class="nugget-popup"><p>Repeated short&ndash;duration, high&ndash;intensity rainfall events caused surface water flooding in Barnstaple. Highway flooding made many key roads impassable and brought traffic to a standstill; the Square experienced high levels of surface water and was impassable. Major routes (A361 and A39) were blocked by floodwater, causing congestion on surrounding roads. Local drainage was overwhelmed and rapidly surcharged so flood water could not enter the drainage system. Prior incidents also resulted in properties being flooded in residential areas of the town (see quantified impacts). [IMG,MUL] (p4)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 properties (Signal Terrace/Clifton Terrace, 19/01/2016); 3 properties (Bradiford, 19/11/2016); 5 properties (Sherrats Oak, Raleigh, 20/11/2016) [IMG,MUL] (p4)</p></div></div></body></div>`)[0];

                var html_9eca15c33f929cd5c29492ead48b1720 = $(`<div id="html_9eca15c33f929cd5c29492ead48b1720" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Barnstaple</h1><div class="nugget-popup"><p>Drainage systems were overwhelmed by intense, localised rainfall causing internal property flooding; Barnstaple was the worst affected location. [PAG] (p1)</p></div><div class="nugget-popup"><p>Widespread, localised surface water flooding across the town. Some areas experienced mainly external flooding to gardens and outbuildings while others suffered internal flooding to dwellings and businesses. Significant disruption to the highway network in Barnstaple town centre (including The Square); A361 and A39 were reported blocked by flooding, causing congestion. [IMG,TAB,PAG] (p2)</p></div><div class="nugget-popup"><p>Very localised, high&ndash;intensity rainfall on 17 August produced large volumes of surface water that overwhelmed drainage. Some areas experienced external flooding to gardens and outbuildings while others suffered internal flooding to dwellings and businesses. Major transport routes (A361 and A39) were blocked by flooding, causing congestion on surrounding roads. Localised but widespread property flooding concentrated in central Barnstaple and along the river. [IMG] (p3)</p></div><div class="nugget-popup"><p>High&ndash;intensity short&ndash;duration rainfall caused local drainage to be overwhelmed and rapidly surcharge. Key roads became impassable; The Square experienced high levels of surface water and was impassable; major routes (A361 and A39) were blocked by floodwater, causing congestion on surrounding roads. Floodwater drained away once the storm abated. (p5)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>164 properties flooded (part of 175 total properties flooded across Devon; 128 residential and 47 commercial) [PAG] (p1)</p></div><div class="nugget-popup quant"><p>164 properties flooded internally (118 residential, 46 commercial) [IMG,TAB,PAG] (p2)</p></div><div class="nugget-popup quant"><p>164 properties flooded internally; 118 residential; 46 commercial [IMG] (p3)</p></div></div></body></div>`)[0];
