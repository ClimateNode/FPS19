                var html_6745a8b9d709fae746f9fce27b06526f = $(`<div id="html_6745a8b9d709fae746f9fce27b06526f" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Godmanchester</h1><div class="nugget-popup"><p>Significant rainfall on 23 December 2020 caused surface&ndash;water flooding and increased river (fluvial) flood pressure in the Godmanchester area; drainage systems were placed under substantial pressure and low&ndash;lying/residential areas adjacent to the River Great Ouse were vulnerable to inundation. [PAG,IMG] (p6)</p></div><div class="nugget-popup"><p>Surface water drainage systems were unable to convey runoff after the 23 December rainfall, leading to excess surface water flowing over ground and following local topography. Ditches, drainage systems and the Great River Ouse experienced high volumes and levels, placing properties at risk of surface water flooding. (p7)</p></div><div class="nugget-popup"><p>Surface water drainage systems in Godmanchester were unable to convey runoff, causing excess surface water to flow over the ground following local topography and putting properties at risk of surface water flooding. Some surface water outfalls discharge into the River Great Ouse; when river levels were high the outfalls became submerged, putting pressure on flap valves and causing water to back up within surface water systems. River levels following the 23 December rainfall exceeded previous records (highest on record) and river flow upstream of Godmanchester was recorded at 47.98 m3/s (204% of the long&ndash;term average), contributing to the back&ndash;up and overtopping issues. [PAG] (p8)</p></div><div class="nugget-popup"><p>Properties, roads, gardens and fields in Godmanchester were flooded: internal property flooding was reported and external flooding affected garages/outbuildings, gardens and highway areas. (p10)</p></div><div class="nugget-popup"><p>Significant surface water flooding when intense and antecedent rainfall caused watercourses throughout Godmanchester to exceed channel capacity and surface water drainage systems to surcharge; at least two properties flooded internally. [IMG,PAG] (p12)</p></div><div class="nugget-popup"><p>Watercourses throughout Godmanchester exceeded channel capacity and surface water drainage systems surcharged, causing significant surface water flooding across the town. (p13)</p></div><div class="nugget-popup"><p>Severe flooding in December 2020 led to blocked/surcharging highway drainage and stress on sewer/pumping assets. Foul pumping stations in Godmanchester were identified as susceptible to inundation from ingress of surface water and groundwater; priority gully cleansing and highway drainage repairs were required. [TAB] (p17)</p></div><div class="nugget-popup"><p>Actions for the town include inclusion of highway drains in the gully cleansing programme and investigation/repair of blocked or collapsed highway drainage networks, reflecting impacts to drainage systems from flooding. (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>12 properties; 4 properties (p10)</p></div><div class="nugget-popup quant"><p>at least two properties [IMG,PAG] (p12)</p></div></div></body></div>`)[0];
