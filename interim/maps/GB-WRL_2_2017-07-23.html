d Lane and Shrewsbury Road, and overland flow through Birkenhead Park that flooded adjacent roads and businesses. (p17)</p></div><div class="nugget-popup"><p>Intense short&ndash;duration rainfall across parts of Wirral exceeded highway gully and sewer capacity and soil infiltration, causing rapid onset surface water and sewer flooding that led to properties being flooded, especially in eastern Wirral. [PAG] (p23)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>Approximately 28 mm of intense rainfall between 06:00 and 10:00 BST on 23 July 2017; 74 properties flooded across the affected areas (35 internally; 39 externally). (p4)</p></div><div class="nugget-popup quant"><p>17 properties (p17)</p></div></div></body></div>`)[0];

ooding of properties. (p23)</p></div><div class="nugget-popup"><p>Properties and the highway in the Oxton area (specifically Alton Road) were affected by surface water run&ndash;off that increased flood risk; the LLFA has been asked to notify the landowner and residents. [TAB] (p25)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>74 properties flooded across the affected areas; 35 properties internally flooded and 39 properties externally flooded. (p4)</p></div><div class="nugget-popup quant"><p>17 properties [PAG] (p17)</p></div><div class="nugget-popup quant"><p>17 properties [PAG] (p18)</p></div></div></body></div>`)[0];
