                var html_cb50d0feb7579b5a725a95bfb3a898ea = $(`<div id="html_cb50d0feb7579b5a725a95bfb3a898ea" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Claverton Close, Bovingdon</h1><div class="nugget-popup"><p>Foul sewer catchment serving the area is pumped out to the wider network; during and after the 16 September 2016 storm the foul sewer network surcharged, with reports of foul water surcharging inside and outside properties. Surface water ingress to the foul network (via cross&ndash;connections from roofs, driveways and patios) likely worsened the surcharging; the pumped arrangement for Farnham Close and Claverton meant reliance on pumping station discharge during the event. [IMG] (p20)</p></div></div></body></div>`)[0];

                var html_900035af1651b3a40cb7ef54c2081ef5 = $(`<div id="html_900035af1651b3a40cb7ef54c2081ef5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hyde Lane, Bovingdon</h1><div class="nugget-popup"><p>Observed surface water flooding occurred on and around Hyde Lane during the 16 September 2016 event. Intense rainfall exceeded the urban drainage capacity producing overland flows that drained along the corridor where Hyde Lane lies (heatmap hotspot). Local foul sewers and the main sewer line in the area were partially involved through surcharge or infiltration of surface water, which limited the ability of gullies and highway drainage to remove water. The Bovingdon Docks serving the highway drainage were full and overflowing, reducing discharge capacity and contributing to flooding impacts in this location. [IMG] (p23)</p></div></div></body></div>`)[0];

                var html_f693e2db8f74966dfebb382f7115a4fe = $(`<div id="html_f693e2db8f74966dfebb382f7115a4fe" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hertfordshire</h1><div class="nugget-popup"><p>A localized area within the county (in and around Bovingdon) experienced exceptionally intense rainfall causing predominantly overland surface water flows with secondary surcharging from sewers and highway drainage; this resulted in property flooding in the county. [TAB,PAG] (p6)</p></div><div class="nugget-popup"><p>A localised area within Hertfordshire (Bovingdon) experienced exceptionally intense rainfall on 16 September 2016 leading to overland surface water flooding and sewer surcharge in the investigation area. [PAG] (p7)</p></div><div class="nugget-popup"><p>Intense rainfall on 16 September 2016 caused flash flooding in Bovingdon (within Hertfordshire); the event generated flood reports to the LLFA and emergency services. (p12)</p></div><div class="nugget-popup"><p>Widespread heavy, localized rainfall on 16 September 2016 across Hertfordshire, with the highest totals concentrated in a small area (including the area around Bovingdon). This intense rainfall produced surface water / flash flooding impacts in the affected locality (including Bovingdon). [IMG,PAG] (p15)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>23 properties flooded; 14 flooded internally [TAB,PAG] (p6)</p></div><div class="nugget-popup quant"><p>23 properties; 14 properties flooded internally [PAG] (p7)</p></div><div class="nugget-popup quant"><p>two incidents of flooding to dwellings (recorded by Thames Water Utilities Ltd) (p12)</p></div></div></body></div>`)[0];

                var html_88454382fcbb15a17c64012b7cc80623 = $(`<div id="html_88454382fcbb15a17c64012b7cc80623" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Bovingdon</h1><div class="nugget-popup"><p>Residential streets were inundated with floodwater covering the road surface; a wooden lychgate/ shelter was partially surrounded by water; parked cars were partially submerged; nearby houses were affected by standing floodwater and access disruption. [IMG] (p1)</p></div><div class="nugget-popup"><p>Exceptionally intense rainfall on 16 September 2016 caused overland surface water flows and secondary surcharging of sewers and highway drainage in and around Bovingdon. Piped drainage was overwhelmed and localised flooding occurred across the investigation area. (p7)</p></div><div class="nugget-popup"><p>Surface water flooding occurred during the event on 16 September 2016; the incident led to properties in the village being inundated and prompted a Section 19 investigation to identify drainage asset issues and resilience measures. [PAG] (p8)</p></div><div class="nugget-popup"><p>Figure 3 and the investigation&ndash;area map identify a red&ndash;outlined area in central Bovingdon that coincides with the Environment Agency 'Risk of Flooding from Surface Water' (1&ndash;in&ndash;100&ndash;year) maximum extent and is labelled as including a flooded area. The investigation area runs west&ndash;east through central Bovingdon and crosses residential streets (including St. Norbert Road and Green Lane) and is adjacent to community facilities (library, education facility). The contributing surface water catchment directs flows west to east through this area. [IMG,PAG] (p9)</p></div><div class="nugget-popup"><p>On 16 September 2016 intense early&ndash;morning rainfall caused flash flooding in Bovingdon; the report states the heaviest rain fell between about 05:00 and 07:00 and corresponds with flood reports of surface&ndash;water inundation in the investigation area. [PAG] (p11)</p></div><div class="nugget-popup"><p>Intense rainfall (approx. 05:00&ndash;07:00 on 16 September 2016) caused flash flooding in the village; properties were flooded, Hertfordshire Fire and Rescue attended near the area known as 'Bovingdon Docks', and Thames Water recorded sewer&ndash;related flooding to dwellings. HCC sent questionnaires to properties identified as potentially affected. (p12)</p></div><div class="nugget-popup"><p>Localized intense rainfall on 16 September 2016 produced surface water flooding across Bovingdon (heatmap shows deepest at Eastnor and Green Lane). The foul water sewer also surcharged on Bovingdon High Street. (p14)</p></div><div class="nugget-popup"><p>Intense, localized rainfall between about 05:00 and 07:00 on 16 September 2016 produced surface water flooding in the Bovingdon investigation area, correlating with recorded flood reports and emergency call&ndash;outs. [PAG] (p16)</p></div><div class="nugget-popup"><p>The village experienced surface water flooding on 16th September 2016. Most properties rely on private plot&ndash;level soakaways and infiltration into the ground is very limited; soakaways are likely in poor condition or inefficient, reducing infiltration capacity. Highway drainage for the affected area drains to local soakaways/boreholes and to a large attenuation/infiltration tank (beneath the private car park between Eastnor and Hamer Close) &mdash; these drainage arrangements constrained runoff conveyance and contributed to surface water flooding during the event. [PAG] (p17)</p></div><div class="nugget-popup"><p>The highway drainage serving Bovingdon was described as running at or near design capacity and was overwhelmed by the rainfall on 16 September 2016; gullies, soakaways and the local attenuation/infiltration tank were unable to fully contain runoff, and surface water (including overland flow from private property) exceeded the drainage system causing surface&ndash;water/urban flooding across the investigation area. [IMG] (p18)</p></div><div class="nugget-popup"><p>On 16 September 2016 intense rainfall exceeded the highway drainage capacity in Bovingdon. Highway gullies were unable to drain the large volumes of water and additional overland flow from private land, gardens and driveways overwhelmed the drainage network. Surface water flowed across the highway (notably High Street and Green Lane) and discharged to the Bovingdon Docks open water feature. [PAG] (p19)</p></div><div class="nugget-popup"><p>The 16 September 2016 storm produced a large volume of surface water runoff that exceeded highway drainage capacity. Highway drainage from Green Lane and the High Street discharges to Bovingdon Docks (the only local open water feature); defects or silted soakaways would have reduced infiltration/storage and increased surface runoff entering the highway drainage. TWUL received reports during and after the event of foul sewer network surcharging causing foul water to discharge inside and outside properties; residents also raised concerns that a historical pipeline from the airfield may have discharged surface water toward Hamer Close during the event. [IMG,PAG] (p20)</p></div><div class="nugget-popup"><p>Short&ndash;duration, intense rainfall on 16 September 2016 exceeded the urban drainage capacity and generated overland surface&ndash;water flows that followed topographic flow routes (matching the EA RoFfSW map). These flows drained towards low&ndash;lying properties in Bovingdon, causing flooding of properties and observable flood depths in the village. [IMG,PAG] (p22)</p></div><div class="nugget-popup"><p>Intense rainfall on 16 September 2016 exceeded the capacity of the urban drainage network causing overland flows into low&ndash;lying properties; foul sewers partially surcharged contributing to flooding along the main sewer line; highway drainage (Bovingdon Docks) was full and overflowing, limiting discharge and exacerbating surface water on the highway. [PAG] (p23)</p></div><div class="nugget-popup"><p>Properties in Bovingdon experienced internal flooding and there was pressure on the downstream drainage network. The investigation notes reports of property flooding, limited knowledge of local surface water and highway drainage assets (including soakaways), and potential foul/surface sewer misconnections contributing to property flooding; options for catchment interception, improved drainage and flood detention were recommended to reduce risk. [TAB] (p27)</p></div><div class="nugget-popup"><p>Surface water/urban flooding affected the village during the 16 September 2016 event, prompting a Section 19 investigation. The investigation identified unknown condition of highways drainage (soakaways and infiltration features) and potential infiltration/mis&ndash;connections between surface water and foul sewers; four potential green areas within Bovingdon were identified as possible surface water attenuation sites to reduce future runoff. [PAG] (p28)</p></div><div class="nugget-popup"><p>Area of investigation for a surface&ndash;water flood study; surface water flow routes and a RoFfSW (1 in 1000 yr extent) are shown as overlapping the investigation area. Four potential green areas in Bovingdon were identified to store runoff during heavy rain to reduce surface&ndash;water flooding and to slow release of flows. [IMG] (p29)</p></div><div class="nugget-popup"><p>Surface water flooding on 16th September 2016 affected the village and prompted investigation into local drainage assets (soakaways, sewers) and the ownership/condition of Bovingdon Docks as potential contributors to the flooding. [TAB] (p31)</p></div><div class="nugget-popup"><p>The village was the focus of the investigation following flooding; individual property owners were supported by the LLFA and recommendations were made to assess and upgrade local drainage (soakaways, interception features and sewer connections) to reduce flood risk. (p32)</p></div><div class="nugget-popup"><p>On 16 September 2016 surface water entered the foul sewer network and overwhelmed it, causing flooding in Bovingdon. Thames Water staff attended the village during the flooding and identified the flooding mechanism as surface water ingress overwhelming the foul network. (p34)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>23 properties; 14 properties flooded internally (p7)</p></div><div class="nugget-popup quant"><p>more than 5 properties flooded; property flooded more than once in 10 year period [PAG] (p8)</p></div><div class="nugget-popup quant"><p>two incidents of flooding to dwellings; 27 questionnaire responses returned (p12)</p></div></div></body></div>`)[0];
                popup_708192d93ee580c095d581179a08eeb5.setContent(html_88454382fcbb15a17c64012b7cc80623);
