                var html_3940fafa3a08f7529a55813c0d8e3331 = $(`<div id="html_3940fafa3a08f7529a55813c0d8e3331" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Nottingham Unitary Authority</h1><div class="nugget-popup"><p>Woolsington Close (the site of the investigated flood) lies within Nottingham and the event was investigated under Section 19 within this administrative area. (p1)</p></div><div class="nugget-popup"><p>An intense storm on the evening of 23 July 2013 caused flooding across the city, resulting in residential properties being flooded. (p3)</p></div><div class="nugget-popup"><p>The intense storm crossed the north of Nottingham City on 23 July 2013; the flood event began during this storm, indicating the area was affected by the resulting flood event. (p9)</p></div><div class="nugget-popup"><p>Nottingham City Council was required to respond to flooding in the Woolsington Close area: they submitted funding bids (including to Flood Defence Grant in Aid), commissioned surveys and optioneering studies, planned construction of a surface water management scheme, and placed gullies on a targeted cleansing regime to reduce repeat flooding. [TAB] (p16)</p></div><div class="nugget-popup"><p>A series of heavy rainfall events over the city saturated soils and filled underground drainage storage; a fourth event on 23 July 2013 caused drainage overload and led to property flooding, including 12 properties on Woolsington Close. [PAG] (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 100 residential properties (p3)</p></div><div class="nugget-popup quant"><p>12 residential properties; 10 internal; 2 external [PAG] (p19)</p></div></div></body></div>`)[0];
                popup_4e3340c4c9c59f208f1efb35c1bd6f6b.setContent(html_3940fafa3a08f7529a55813c0d8e3331);

                var html_d7071b5159302cbd4a5b9289d6dbf86b = $(`<div id="html_d7071b5159302cbd4a5b9289d6dbf86b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Woolsington Close, Bulwell</h1><div class="nugget-popup"><p>Location of the reported flood event that prompted the Section 19 investigation. [IMG] (p1)</p></div><div class="nugget-popup"><p>Properties on Woolsington Close in Strelley were flooded; specifically internal and external flooding occurred to residential properties on the street. (p3)</p></div><div class="nugget-popup"><p>Internal flooding of residential properties (floodwater entering over the doorstep) and external flooding of properties on Woolsington Close. [PAG] (p5)</p></div><div class="nugget-popup"><p>Internal flooding affected residential properties on Woolsington Close and external flooding occurred to additional properties; the incident involved inundation of homes within the street. [IMG,PAG] (p6)</p></div><div class="nugget-popup"><p>Properties experienced internal and external flooding during the event; residents report repeated flooding at properties (varying frequency) and that the 23 July 2013 event caused flooding of properties on the street. The EA surface water map indicates some properties on Woolsington Close are at high risk. [MUL] (p7)</p></div><div class="nugget-popup"><p>Residents on Woolsington Close reported prolonged intense rainfall (up to two to three hours) during the storm that initiated the flood event on 23 July 2013, indicating the street was affected by the event. (p9)</p></div><div class="nugget-popup"><p>Properties were flooded during and after the intense rainfall on 23 July 2013. Surface water flowed from front and rear of properties and pooled in low&ndash;lying areas; road gullies were not draining and a manhole to the east of Woolsington Close was observed to be surcharging. [PAG] (p10)</p></div><div class="nugget-popup"><p>Surface water flowed rapidly across impermeable surfaces and was conveyed to the north&ndash;east side of Woolsington Close, inundating garages and residential properties. An old railway embankment formed an artificial bund so water pooled rather than flowing toward Chilwell Dam Plantation and Broxtowe Park Brook. Road gullies were not draining and a manhole to the east of Woolsington Close was reported to be surcharging. Residents reported water entering properties from the front and rear and pooling in low&ndash;lying areas. [IMG,PAG] (p11)</p></div><div class="nugget-popup"><p>Surface water runoff overwhelmed road gullies during the storm, allowing water to breach the kerb and flow toward low&ndash;lying houses; hard standing on the north side of the street and adjacent garage areas encouraged overland flow toward these properties. [IMG,PAG] (p12)</p></div><div class="nugget-popup"><p>Surface water overwhelmed road gullies, breached kerbs and flowed downslope into low&ndash;lying houses. Water pooled at a low point at the east end and entered properties from both front and rear, causing internal and external flooding. [IMG] (p13)</p></div><div class="nugget-popup"><p>Excessive surface water flow caused pooling at a low point and entered houses from front and rear. Resulted in internal flooding of properties and damage to electrics, carpets, floors, doors, walls and furniture. [TAB,PAG] (p14)</p></div><div class="nugget-popup"><p>Intense rainfall generated large volumes of surface water runoff that overwhelmed highway drainage and exceeded public sewer capacity, causing water to pond in low&ndash;lying Woolsington Close and resulting in flooding affecting residents. (p15)</p></div><div class="nugget-popup"><p>Properties on Woolsington Close were flooded when surface water was unable to drain into the highway drainage and public sewer system during the extreme rainfall on 23rd July 2013. (p16)</p></div><div class="nugget-popup"><p>Surface&ndash;water flooding on 23rd July 2013 affected properties on Woolsington Close, prompting a topographic survey and optioneering study, the commissioning/construction of a surface water flood risk management scheme, placement of gullies on a targeted gully cleansing regime for more frequent maintenance, and distribution of recommendations to residents/landlords to improve property resilience. [PAG] (p17)</p></div><div class="nugget-popup"><p>Intense, repeated rainfall on 22&ndash;23 July 2013 saturated the ground and filled underground drainage storage, overwhelming drainage and causing internal flooding of properties and external flooding outside properties on Woolsington Close. Flooded properties are predominantly in low&ndash;lying areas. [PAG] (p18)</p></div><div class="nugget-popup"><p>Repeated heavy rainfall saturated the ground and filled available storage in underground drainage networks, resulting in internal flooding of low&ndash;lying properties and external flooding outside properties on Woolsington Close. (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>10 properties (internal flooding); 2 properties (external flooding) (p3)</p></div><div class="nugget-popup quant"><p>10 properties; 2 properties [PAG] (p5)</p></div><div class="nugget-popup quant"><p>10 properties (internal); 2 properties (external) [IMG,PAG] (p6)</p></div><div class="nugget-popup quant"><p>10 properties internally flooded; 2 properties externally flooded only; total 12 properties affected; internal flood depths up to 150mm; external flood depths up to 750mm; 5 Nottingham City Council&ndash;owned properties; 7 private properties. [IMG] (p13)</p></div><div class="nugget-popup quant"><p>12 properties affected total; 10 properties internally flooded; 2 properties externally flooded only; internal flood depths up to 150 mm; external flood depths up to 750 mm; (of the 12 properties 5 are Nottingham City Council owned and 7 are private) [TAB,PAG] (p14)</p></div><div class="nugget-popup quant"><p>12 residential properties; 10 internal; 2 external [PAG] (p18)</p></div><div class="nugget-popup quant"><p>12 residential properties; 10 internal; 2 external (p19)</p></div></div></body></div>`)[0];

                var html_ccb3c48fb86e43ccbfb211b4e6dcce29 = $(`<div id="html_ccb3c48fb86e43ccbfb211b4e6dcce29" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Strelley</h1><div class="nugget-popup"><p>The flood event occurred at Woolsington Close within Strelley and was the subject of the Section 19 investigation. (p1)</p></div><div class="nugget-popup"><p>Flooding occurred in Strelley during the intense storm on 23 July 2013, including on Woolsington Close where properties experienced internal and external flooding. (p3)</p></div><div class="nugget-popup"><p>The intense convective storm that moved across the north of Nottingham City on 23 July 2013 affected the Strelley area; the flood event started during the intense rainfall at 17:00 on 23 July 2013. (p9)</p></div><div class="nugget-popup"><p>Areas of green open space in the wider Strelley area were saturated in the 24 hours before the main rainfall, increasing runoff and contributing to rapid overland flow and ponding that led to flooding at Woolsington Close. (p10)</p></div><div class="nugget-popup"><p>Road gullies and highway drains in the Strelley area were subject to the annual maintenance regime but were likely overwhelmed by surface water runoff during the event, contributing to ponding and flooding in the affected catchment (including Woolsington Close). (p15)</p></div><div class="nugget-popup"><p>Properties on Woolsington Close in Strelley were subject to internal and external flooding after a sequence of heavy rainfall events saturated the ground and overwhelmed drainage capacity. (p19)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>10 properties (internal flooding); 2 properties (external flooding) (p3)</p></div><div class="nugget-popup quant"><p>12 residential properties; 10 internal; 2 external (p19)</p></div></div></body></div>`)[0];
