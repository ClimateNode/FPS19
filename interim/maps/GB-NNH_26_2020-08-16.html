                var html_75b0ddc81addfe0280c4dd870b2a3f9c = $(`<div id="html_75b0ddc81addfe0280c4dd870b2a3f9c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Northampton Road, Rushden</h1><div class="nugget-popup"><p>Internal flooding of a building on Northampton Road when surface water drainage was unable to convey intense, short&ndash;duration rainfall and excess water flowed over ground to low points around properties. (p6)</p></div><div class="nugget-popup"><p>Internal flooding of a building on Northampton Road; the property reported internal flooding from the event on 16 August 2020 and had experienced internal flooding on more than one occasion in the previous five years. (p8)</p></div><div class="nugget-popup"><p>The commercial area on Northampton Road (north&ndash;west of the town centre) was recorded as flooded; surface water/urban flooding impacted warehousing, delivery yards and car parking in the localised catchment. (p11)</p></div><div class="nugget-popup"><p>Surface water runoff from the A5001 Northampton Road flowed across the car park frontage to the front of the affected property. Highway gullies on the A5001 may have been blocked at the time of the event; the road gully immediately adjacent to the vehicle access into the site was observed blocked, contributing to poor drainage and runoff on the highway. (p17)</p></div><div class="nugget-popup"><p>Surface water runoff from an adjacent car park flowed to the front of a property, causing water to reach the property frontage and likely ingress. [IMG] (p38)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 building (p6)</p></div></div></body></div>`)[0];
