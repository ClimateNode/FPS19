                var html_af4dc9645742f225697e56410b7583ad = $(`<div id="html_af4dc9645742f225697e56410b7583ad" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Gotham</h1><div class="nugget-popup"><p>Subject of the Section 19 investigation into the November 2019 event. Experienced significant rainfall on 14 November 2019 and was part of the extensive flooding that affected Nottinghamshire during that period. (p1)</p></div><div class="nugget-popup"><p>Internal property flooding, flooding of gardens and curtilages, and flooding of the public highway in parts of the village. [IMG,PAG] (p2)</p></div><div class="nugget-popup"><p>Internal flooding of properties across the village; many gardens and curtilages flooded; public highway flooded. [IMG] (p3)</p></div><div class="nugget-popup"><p>On 14th November heavy rainfall on saturated ground produced rapid surface water run&ndash;off which overtopped ditches and watercourses and in places bypassed watercourses, running straight from land into properties and onto the highway. The foul sewer network backed up during the event, with foul sewage coming out of private drains and internally flooding properties. [IMG] (p4)</p></div><div class="nugget-popup"><p>Community flood resilience store containing sandbags was used; local volunteers distributed sandbags and cleared/kept culverts and watercourses clear. These community actions reduced the number of properties internally flooded during the event; some properties were internally flooded. [PAG] (p7)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>13 reported incidents of internal property flooding [IMG,PAG] (p2)</p></div><div class="nugget-popup quant"><p>13 reported incidents of internal property flooding [IMG] (p3)</p></div><div class="nugget-popup quant"><p>5 properties [IMG] (p4)</p></div></div></body></div>`)[0];
