                var html_c799a3e9513c28650cb42e2ae34255c9 = $(`<div id="html_c799a3e9513c28650cb42e2ae34255c9" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Greenwood Close, Haverhill</h1><div class="nugget-popup"><p>Identified as a location under a Suffolk County Council (LLFA) Section 19 investigation into a flood event affecting Greenwood Close; referenced in the report title and within the spatial scope of the map listing report references (CRNos 330018, 329910, 330025). (p1)</p></div><div class="nugget-popup"><p>Greenwood Close (property C) was impacted by flooding during the intense localised rainfall on 25.07.2021 and is one of the locations examined in the Section 19 investigation. [IMG,PAG] (p3)</p></div><div class="nugget-popup"><p>Internal flooding of property C during the intense localised rainfall event; attached garage reported to flood regularly (annual occurrences reported) and property also flooded in August/September 2020. [PAG,IMG,MUL] (p4)</p></div><div class="nugget-popup"><p>Property C in Greenwood Close flooded internally with ingress to the living room, hallway and part of the kitchen causing damage. Externally, surface water accumulated adjacent to the front door/front wall. The garage was also inundated. [PAG] (p6)</p></div><div class="nugget-popup"><p>Although the mapping does not clearly show flow paths for Greenwood Close, the report links Property C to Greenwood Close and records Property C as one of four properties that experienced flooding during the event; water began to recede after ≈2&ndash;3 hours and was almost completely drained within 24 hours. [PAG] (p7)</p></div><div class="nugget-popup"><p>A property at Greenwood Close (Property C) was inundated by surface water flow during the event; anecdotal evidence reports water began to recede after approximately 2&ndash;3 hours and had almost completely drained away within 24 hours. Mapping did not clearly show the flow path through Greenwood Close, but the property impact is reported. [PAG,IMG] (p8)</p></div><div class="nugget-popup"><p>Anglian Water sewers in Greenwood Close (recorded as 100mm or 150mm diameter) are reported to have been a contributing factor to backing up of runoff during the intense rainfall on 25 July 2021, exacerbating surface water accumulation. [PAG] (p9)</p></div><div class="nugget-popup"><p>Surface water runoff backed up within the highway sewer network, lifting manhole/gully grates outside properties (reported outside Property C) and creating a pressurised discharge that flooded the highway and at least one property. [PAG] (p10)</p></div><div class="nugget-popup"><p>The street slopes down toward Property C so surface water runoff was directed from the highway into the property front; a manhole outside Property C was reported to have blown, reflecting drainage failure on Greenwood Close. [IMG] (p11)</p></div><div class="nugget-popup"><p>A manhole immediately outside Property C was reported to have 'blown' (indicating sewer/manhole failure or surcharge) and surface water/drainage blockages were identified for CCTV investigation; drainage issues here were linked to property flooding and are scheduled for jetting and CCTV inspection. [TAB,PAG] (p12)</p></div><div class="nugget-popup"><p>A drainage bottleneck in Greenwood Close was identified as contributing to surface water flooding and recommended for CCTV survey to investigate causes of the blockage that contributed to properties being flooded. (p13)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 incidents [PAG,IMG,MUL] (p4)</p></div><div class="nugget-popup quant"><p>internal depths 50&ndash;100mm; external surface water 450&ndash;600mm adjacent to front door/front wall; water began to recede after approximately 2&ndash;3 hours and had almost completely drained within 24 hours. [PAG] (p6)</p></div><div class="nugget-popup quant"><p>1 property (Property C); part of 4 properties affected (A, B, C, D) [PAG] (p7)</p></div><div class="nugget-popup quant"><p>1 property (Property C) [PAG,IMG] (p8)</p></div><div class="nugget-popup quant"><p>1 manhole; 1 property (Property C) [TAB,PAG] (p12)</p></div><div class="nugget-popup quant"><p>4 properties (Properties A, B, C and D) (p13)</p></div></div></body></div>`)[0];

h;3 hours and had almost completely drained away within 24 hours. Mapping highlights Harewood Terrace as being on a main flow path with elevated flow velocities in the worst&ndash;case pluvial scenario. [PAG,IMG] (p8)</p></div><div class="nugget-popup"><p>Driveway and garage of Property D (situated at the end of Buckingham Drive/Harewood Terrace) were affected by surface water accumulating at the low point; the nearest gully was not at the low point so water collected in front of garage doors. [PAG] (p10)</p></div><div class="nugget-popup"><p>Surface water travelled into the rear of a property (Property D) through an access gate in the boundary fence; the rear driveway slopes down toward the garage which would have directed runoff toward the property and garage. [IMG,TAB] (p12)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>3 incidents in the past 3 years [PAG,IMG,MUL] (p4)</p></div><div class="nugget-popup quant"><p>internal depths up to 450mm; water began to recede after approximately 2&ndash;3 hours and had almost completely drained within 24 hours. [PAG] (p6)</p></div><div class="nugget-popup quant"><p>internal depths up to 450 mm; 1 property (Property D); part of 4 properties affected (A, B, C, D) [PAG] (p7)</p></div><div class="nugget-popup quant"><p>1 property (Property D) [PAG,IMG] (p8)</p></div><div class="nugget-popup quant"><p>3 gullies (recorded in the junction) [PAG] (p10)</p></div><div class="nugget-popup quant"><p>1 property (Property D) [IMG,TAB] (p12)</p></div></div></body></div>`)[0];

                var html_607643d5ef98e071e10840f128f78207 = $(`<div id="html_607643d5ef98e071e10840f128f78207" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Hazel Close, Haverhill</h1><div class="nugget-popup"><p>Hazel Close (property B) was impacted by flooding during the intense localised rainfall on 25.07.2021 and is one of the locations considered in the Section 19 investigation. [IMG,PAG] (p3)</p></div><div class="nugget-popup"><p>Internal flooding of property B during the intense localised rainfall event; property B's attached garage floods regularly and had a linear drain installed previously which reduced frequency/severity. Flooding also occurred in August/September 2020. [PAG,IMG,MUL] (p4)</p></div><div class="nugget-popup"><p>Property B in Hazel Close flooded internally via the front door. Ground&ndash;floor flooring was damaged; the elderly resident was rehoused for health reasons and other occupants were rehoused while the property was dried out/redecorated. The garage was inundated. [PAG] (p6)</p></div><div class="nugget-popup"><p>Mapping and text indicate a flow path past and through Hazel Close that reached Property B; Property B is recorded as one of the properties affected by surface&ndash;water flooding. Water began to recede after approximately 2&ndash;3 hours and had almost completely drained within 24 hours. [PAG] (p7)</p></div><div class="nugget-popup"><p>Surface water flowed past and through a property in Hazel Close (Property B) during the event; water began to recede after approximately 2&ndash;3 hours and had almost completely drained away within 24 hours. [PAG,IMG] (p8)</p></div><div class="nugget-popup"><p>On 25 July 2021 intense rainfall and limited sewer/gully capacity caused surface water runoff to overload gullies and contributed to backing up of the Anglian Water sewer network in the cul&ndash;de&ndash;sac/turning head area, increasing flood pressure on properties adjacent to the turning head. [PAG] (p9)</p></div><div class="nugget-popup"><p>Driveway/path slopes down from the highway toward Property B, directing surface water runoff from the street into the front of the house, increasing risk of water entering the property. [IMG] (p11)</p></div><div class="nugget-popup"><p>Hazel Close was identified for investigation to determine if additional gullies are required and for reactive jetting of highways drainage following the event, indicating local drainage failure or overwhelm contributed to flooding risk. [TAB,PAG] (p12)</p></div><div class="nugget-popup"><p>Surface water entered properties from the rear; Hazel Close gullies were recommended for review/additional installation to address the ingress. (p13)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>2 incidents [PAG,IMG,MUL] (p4)</p></div><div class="nugget-popup quant"><p>rehousing for 1 week; water began to recede after approximately 2&ndash;3 hours and had almost completely drained within 24 hours. [PAG] (p6)</p></div><div class="nugget-popup quant"><p>1 property (Property B); part of 4 properties affected (A, B, C, D) [PAG] (p7)</p></div><div class="nugget-popup quant"><p>1 property (Property B) [PAG,IMG] (p8)</p></div><div class="nugget-popup quant"><p>4 properties (Properties A, B, C and D) (p13)</p></div></div></body></div>`)[0];

                var html_5a72a03f36099e4d454238385f853145 = $(`<div id="html_5a72a03f36099e4d454238385f853145" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Elm Close, Haverhill</h1><div class="nugget-popup"><p>Property A at Elm Close experienced flooding when drainage was overwhelmed during the intense, localised rainfall event on 25 July 2021. [IMG] (p3)</p></div><div class="nugget-popup"><p>Internal flooding of property A and its neighbouring property during the intense localised rainfall event; property reported flooded in July 2021 and also in August 2020 and on at least one earlier occasion. [PAG,MUL] (p4)</p></div><div class="nugget-popup"><p>Property A in Elm Close flooded internally. Flood waters accumulated in low spots immediately outside the property adjacent to the front wall and entered through the front door; water also seeped through brickwork walls. Flooring materials and furniture were damaged in the living room and hallway. [PAG,IMG] (p6)</p></div><div class="nugget-popup"><p>Elm Close acted as a surface&ndash;water flow path toward Property A during the event; mapping shows flow directed southward through Elm Close and identified it as a flood pathway for surface&ndash;water run&ndash;off that reached nearby properties. [IMG] (p7)</p></div><div class="nugget-popup"><p>On 25 July 2021 a single gully at the lowest point of the cul&ndash;de&ndash;sac could not accommodate flows, causing excess surface water to travel towards and accumulate in front of Property A (which is at lower elevation than the highway) and leading to internal flooding of that property. (p9)</p></div><div class="nugget-popup"><p>A single gully at the low point (adjacent to Property A) was overwhelmed, causing excess surface water to travel downhill toward Property A, accumulating in front of the property and leading to internal flooding; conversion of front gardens to hard surfacing increased runoff and pressure on the drainage. [IMG,PAG] (p10)</p></div><div class="nugget-popup"><p>Highways drainage in Elm Close was targeted for reactive jetting and consideration for additional gullies after the event, indicating the surface&ndash;water drainage was compromised and contributed to local property flood risk. [TAB,PAG] (p12)</p></div><div class="nugget-popup"><p>Surface water travelled into properties from the rear (via an access gate) during the event; gullies on Elm Close were identified for investigation to reduce recurrence. (p13)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 property (Property A) [IMG] (p3)</p></div><div class="nugget-popup quant"><p>300&ndash;450mm external adjacent to front wall; water began to recede after approximately 2&ndash;3 hours and had almost completely drained within 24 hours. [PAG,IMG] (p6)</p></div><div class="nugget-popup quant"><p>4 properties (Properties A, B, C and D) (p13)</p></div></div></body></div>`)[0];

                var html_41a57c432f79b8e9d107548e0c26503a = $(`<div id="html_41a57c432f79b8e9d107548e0c26503a" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Haverhill</h1><div class="nugget-popup"><p>Central and western Haverhill are within the mapped scope of the investigation; the map and report references link parts of Haverhill (including Clements, schools, cemetery and recreation ground areas) to the referenced CRNos, indicating the town area was the focus of the LLFA Section 19 flood investigation. [IMG] (p1)</p></div><div class="nugget-popup"><p>An intense localised rainfall event on 25 July 2021 overwhelmed drainage networks across much of Haverhill. Flooding was reported to Suffolk County Council in Sturmer Road, Hazel Close, High Street, Harewood Terrace, Greenwood Close, Elm Close, Chauntry Road and Withersfield Road. This triggered several Section 19 investigations; four specific locations (Elm Close &ndash; property A, Hazel Close &ndash; property B, Greenwood Close &ndash; property C, Harewood Terrace &ndash; property D) were investigated and found to have comparable flooding impacts. [IMG] (p3)</p></div><div class="nugget-popup"><p>An intense, localised rainfall event on 25 July 2021 caused surface water/urban flooding across much of Haverhill. Flooding was reported to Suffolk County Council in multiple streets (Sturmer Road, Hazel Close, High Street, Harewood Terrace, Greenwood Close, Elm Close, Chauntry Road and Withersfield Road). Four specific residential properties (Elm Close &ndash; property A; Hazel Close &ndash; property B; Greenwood Close &ndash; property C; Harewood Terrace &ndash; property D) were investigated as being internally flooded or otherwise impacted by the event. [IMG,PAG] (p4)</p></div><div class="nugget-popup"><p>Multiple residential properties in the Haverhill area were affected by surface water flooding on 25th July 2021. Properties A, B, C and D experienced inundation with water beginning to recede after approximately 2&ndash;3 hours and almost completely drained within 24 hours. Property D (Harewood Terrace) flooded internally via the rear garage door with internal depths reaching up to 450mm; flooring was damaged and tools and decorating materials stored on the ground floor garage were damaged. [IMG] (p7)</p></div><div class="nugget-popup"><p>Intense rainfall on 25 July 2021 overwhelmed drainage across parts of the town, producing large volumes of surface water on the highway and contributing to localised internal flooding of residential streets (see Elm Close, Hazel Close, Greenwood Close). (p9)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8 locations reported to SCC; 4 properties (investigated, Northern Haverhill) [IMG] (p3)</p></div><div class="nugget-popup quant"><p>4 properties; 8 streets [IMG,PAG] (p4)</p></div><div class="nugget-popup quant"><p>4 properties; internal depths up to 450mm [IMG] (p7)</p></div></div></body></div>`)[0];
