                var html_4a3ade16158c716a6855da117112c9d8 = $(`<div id="html_4a3ade16158c716a6855da117112c9d8" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Manchester Road, Burnley</h1><div class="nugget-popup"><p>Overland flow from the blocked culverted watercourse reached Manchester Road and likely overwhelmed the existing highway drainage system, causing water to accumulate at the fronts of nearby properties until it drained away. Lancashire Highways carried out a CCTV survey of the highway drainage outside affected properties, identified two drainage faults which have been repaired. An appraisal of the highway drainage on Manchester Road has been recommended. [TAB,PAG] (p16)</p></div><div class="nugget-popup"><p>Volume of water from a blocked culverted watercourse was routed overland and reached Manchester Road, overwhelming the highway drainage and causing water to accumulate at the front of nearby properties until it drained away. Highway drainage faults on Manchester Road were subsequently repaired. [PAG] (p17)</p></div><div class="nugget-popup"><p>A blockage was identified within a culverted watercourse located approximately 6 m north east of Manchester Road; the blockage prevented the Lead Local Flood Authority from completing its investigation at that point so any impact of the blockage during the flood event is unknown. Local residents confirmed no further flooding has occurred at this point since the December 2015 flood event. Lancashire Highways have appraised the highway drainage on Manchester Road and programmed major drainage improvement works. [TAB] (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>two drainage faults [TAB,PAG] (p16)</p></div><div class="nugget-popup quant"><p>two drainage faults [PAG] (p17)</p></div></div></body></div>`)[0];

                var html_8670d4d854ce5cf08b24142733297a67 = $(`<div id="html_8670d4d854ce5cf08b24142733297a67" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lancashire</h1><div class="nugget-popup"><p>Significant flooding occurred across Lancashire in December 2015, affecting communities and prompting review of communication and coordinated actions by risk management authorities. (p3)</p></div><div class="nugget-popup"><p>The December 2015 floods caused widespread flooding across the county, affecting homes and businesses; the event resulted in major impacts on people, homes and businesses and led to recommendations for property&ndash;level flood resilience and preparatory/response actions by risk management authorities. [TAB] (p8)</p></div><div class="nugget-popup"><p>Widespread flooding during the extreme storms and rainfall of November&ndash;December 2015 that caused damage across the county, including damage to private gardens, garages and out&ndash;buildings, business premises, agricultural property, roads, bridges, retaining walls, water treatment plants, power and communications installations, and community buildings such as schools, village and town halls. (p9)</p></div><div class="nugget-popup"><p>Two major storm events in December 2015 caused flooding across Lancashire, affecting multiple communities; a countywide Section 19&ndash;style investigation was initiated to identify affected communities and priorities. [TAB,PAG] (p10)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>over 2,500 properties [TAB] (p8)</p></div><div class="nugget-popup quant"><p>over 2,500 properties (p9)</p></div></div></body></div>`)[0];
