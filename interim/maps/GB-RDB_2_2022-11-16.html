                var html_6d5a6344884906ea4d69ebc774749e31 = $(`<div id="html_6d5a6344884906ea4d69ebc774749e31" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Westwood Recreation Ground</h1><div class="nugget-popup"><p>Site subject of a Section 19 flood risk investigation, indicating flooding occurred at the recreation ground that prompted the investigation. (p1)</p></div><div class="nugget-popup"><p>The on&ndash;site watercourse exceeded its capacity and overtopped its banks causing significant fluvial flooding within the recreation ground that extended into properties backing onto the park. A trash screen at the point where the watercourse enters a culvert became blocked by debris carried by floodwaters, which exacerbated the flooding; floodwaters receded once the trash screen was cleared. (p3)</p></div><div class="nugget-popup"><p>Significant inundation of the recreation ground during the 2022 incident, with flood water extending across both the eastern and western sides of the park; most significant flooding occurred in the western section just beyond the pond and trash screen. The 2022 incident was associated with internal flooding of local properties and external flooding reports. (p6)</p></div><div class="nugget-popup"><p>The recreation ground and surrounding properties experienced flooding during the November 2022 rainfall event; attendees at a 5 June 2023 roadshow reported internal and/or external flooding associated with the 16&ndash;17 November 2022 incident. Photos of flooded sites were collected and the location was used in GIS mapping, desktop assessment and a site visit to identify overland flow routes and flood mechanisms. (p7)</p></div><div class="nugget-popup"><p>The recreation ground was the location of the reported flood incident. Seven Kings Water passes through the site into a central pond and then through a trash screen into a culvert beneath the southern half of the ground; this watercourse behaviour was associated with flooding of the recreation ground during the event. [PAG] (p10)</p></div><div class="nugget-popup"><p>Seven Kings Water overtopped its banks during heavy rainfall, causing significant flooding across the recreation ground: the pathway east of the watercourse was covered, the south&ndash;western section of the park (beyond the culvert) was flooded, and floodwaters extended towards houses that back onto the park (Chester Road, Spencer Road, Westwood Road). [IMG] (p11)</p></div><div class="nugget-popup"><p>Flooding of the recreation ground (including the south&ndash;western section beyond the culvert). The downstream pond/trash screen became blocked with debris carried from upstream, which exacerbated flooding within the park; after contractors cleared the trash screen flood waters were observed to recede. [PAG,IMG] (p13)</p></div><div class="nugget-popup"><p>Floodwaters within the pond/park were exacerbated by a trash screen at the downstream end of the pond becoming blocked with debris carried from upstream. Blockage increased flooding within Westwood Recreation Ground; after the trash screen was cleared by contractors flood waters were observed to recede. [PAG,IMG] (p14)</p></div><div class="nugget-popup"><p>Flooding occurred within the recreation ground during the 16&ndash;17 November 2022 event when Seven Kings Water emerges from a culvert at the northern boundary and becomes an open channel and pond within the site. Surcharging of the culverted watercourse/surface water sewer contributed to inundation through the body of the recreation ground, with flow passing a trash screen and culverting beneath the southern half towards High Road. [PAG,IMG] (p16)</p></div><div class="nugget-popup"><p>Overland surface water / ponding affecting the western side of the recreation ground; adjacent properties reported flooding during the 16&ndash;17 November 2022 event. (Report also notes that, given the low rainfall return period of this event, surface water was considered an unlikely sole source of the flooding.) [IMG,PAG] (p17)</p></div><div class="nugget-popup"><p>The recreation ground was affected by flooding during the 16 Nov 2022 &ndash; 17 Nov 2022 event. Seven Kings Water (a Main River) enters the northern part of the ground and is culverted through the southern half; the report notes the western side of the ground and surrounding properties lie within the EA RoFSW 0.1% extent and that properties reported flooding during the November 2022 event. The site topography, high water table and urbanised catchment were identified as factors increasing flood risk in the area. [PAG,IMG] (p18)</p></div><div class="nugget-popup"><p>Seven Kings Water (a Main River) overtopped its banks and flooded the low&ndash;lying area of Westwood Recreation Ground. The trash screen was reported blocked by debris (branches, leaves, detritus), which reduced the watercourse hydraulic capacity and contributed to the scale of flooding; the majority of flooding occurred beyond the trash screen. Flood levels were observed to recede after the trash screen was cleared. Reported fluvial flooding is attributed to the event on 17 November 2022 and affected properties within Flood Zone 3 adjacent to the recreation ground. (p19)</p></div><div class="nugget-popup"><p>Flooding within the recreation ground caused by the Seven Kings Water reaching and overtopping within the park as a trash screen at the pond became blocked by debris, reducing hydraulic capacity and increasing flood extent. Once the trash screen was cleared flood levels were observed to recede. [PAG,IMG] (p20)</p></div><div class="nugget-popup"><p>The culverted watercourse within Westwood Recreation Ground exceeded hydraulic capacity and overtopped its banks, causing flooding of the recreation ground and surrounding properties. A blocked trash screen (debris, branches, leaves) reduced culvert capacity and exacerbated flooding. High groundwater table reduced infiltration capacity, increasing flood impact. [PAG] (p21)</p></div><div class="nugget-popup"><p>Westwood Recreation Ground flooded during the 17 November 2022 event: high water levels prevented safe unblocking of the trash screen; pumps were used to remove water from the ground (17&ndash;20 Nov). Post&ndash;event works at the ground included tree removal around the trash screen, pond desilting, increased debris&ndash;cleaning frequency, installation of three river flood sensors, and plans to raise the bund and reduce hardstanding to improve protection and infiltration. [TAB] (p22)</p></div><div class="nugget-popup"><p>The recreation ground and the immediate surroundings were inundated during the 16&ndash;17 Nov 2022 event; surrounding properties experienced internal and external flooding. The EA attended the site (attempted trash&ndash;screen clearance) and later recorded flood extent and flooded property data. [TAB,PAG] (p23)</p></div><div class="nugget-popup"><p>The watercourse within Westwood Recreation Ground exceeded its capacity and overtopped its banks during the event; the trash screen at the point where the watercourse enters the culverted system was reported blocked, which exacerbated the fluvial flooding. Multiple surrounding properties experienced internal and external flooding as a result. (p24)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>8 properties (internal flooding); 10 properties (external flooding) (p3)</p></div><div class="nugget-popup quant"><p>8 properties internally flooded; 10 reports of external flooding (p6)</p></div><div class="nugget-popup quant"><p>ten reports of external flooding; eight reports of internal flooding [PAG,IMG] (p13)</p></div></div></body></div>`)[0];

                var html_144530443a6fbdafcda7cfeffcb4a8c5 = $(`<div id="html_144530443a6fbdafcda7cfeffcb4a8c5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>London Borough of Redbridge</h1><div class="nugget-popup"><p>A trash screen on the waterway within Westwood Recreation Ground is identified in recommendations for more frequent maintenance to help reduce future flood risk. (p4)</p></div><div class="nugget-popup"><p>Properties and land around Westwood Recreation Ground experienced flooding during the November 2022 event; attendees reported internal and/or external flooding. A survey, desktop GIS mapping and a site visit were carried out to investigate overland flow routes and flood mechanisms at the recreation ground. [TAB,PAG] (p7)</p></div><div class="nugget-popup"><p>Westwood Recreation Ground experienced significant flooding when Seven Kings Water overtopped its banks, covering the pathway to the east of the watercourse and flooding the south&ndash;western section of the park beyond the culvert. Floodwaters extended towards and reached houses bordering the western side of the park. The trash screen at the downstream end of the pond became blocked with debris, exacerbating flooding; once Redbridge contractors cleared the screen, flood waters were observed to recede. [PAG] (p12)</p></div><div class="nugget-popup"><p>Intense, concentrated rainfall during 16&ndash;17 Nov 2022 (three distinct peaks, with the largest on the evening of 16 Nov and early 17 Nov) contributed to the flood event affecting Redbridge; rainfall data from nearby gauges were used to characterise the event and its return period for the Westwood Recreation Ground catchment. [PAG] (p15)</p></div><div class="nugget-popup"><p>Fluvial flooding from Seven Kings Water overtopped its banks and flowed into the low&ndash;lying area of Westwood Recreation Ground beyond the trash screen. The trash screen was reported blocked by debris which reduced hydraulic capacity; the majority of flooding occurred beyond the trash screen. Flood levels receded after the trash screen was cleared. Properties that reported flooding were located within Flood Zone 3. [IMG,PAG] (p19)</p></div><div class="nugget-popup"><p>The borough experienced fluvial flooding on 17 November 2022: the watercourse in Westwood Recreation Ground overtopped, flooding the recreation ground and surrounding properties. Blocked trash screen and high groundwater table increased flood severity and reduced infiltration. [PAG] (p21)</p></div><div class="nugget-popup"><p>A flood on 16&ndash;17 November 2022 caused internal and external flooding of multiple properties surrounding Westwood Recreation Ground and triggered a Section 19 investigation by the borough. [PAG] (p23)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>10 reports of external flooding to properties; 8 reports of internal flooding [PAG] (p12)</p></div></div></body></div>`)[0];
                popup_c7c0ce30fd3056c12208e140947f70aa.setContent(html_144530443a6fbdafcda7cfeffcb4a8c5);

                var html_ff079a38a7205d04bb602f4b3824eb29 = $(`<div id="html_ff079a38a7205d04bb602f4b3824eb29" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Spencer Road, London Borough of Redbridge</h1><div class="nugget-popup"><p>Properties along Spencer Road back onto Westwood Recreation Ground and were affected by floodwaters from Seven Kings Water overtopping, with floodwater extending towards these houses. [IMG] (p11)</p></div><div class="nugget-popup"><p>During the 17 November 2022 event a manhole chamber on Spencer Road exhibited very high water levels, suggesting a partial blockage in the surface water/sewer system; this was reported to TWUL. Although no sewer flooding was reported, the high manhole level indicates the sewer network was under stress and could contribute to future sewer flooding if overwhelmed. [PAG] (p21)</p></div><div class="nugget-popup"><p>Flooding occurred along Spencer Road during the flood event; the London Fire Brigade reported flooding and requested attendance from the Environment Agency. [TAB] (p23)</p></div><div class="nugget-popup"><p>A sewer network blockage on Spencer Road was reported and is being investigated in relation to the flood event. (p24)</p></div></div></body></div>`)[0];
