oded; garage of 1 property flooded; gardens of 2 properties flooded [PAG] (p10)</p></div><div class="nugget-popup quant"><p>1 property (p12)</p></div></div></body></div>`)[0];

                var html_dc84290b50adb1462d3bb0f89c90e2f5 = $(`<div id="html_dc84290b50adb1462d3bb0f89c90e2f5" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>The Hill, Syresham</h1><div class="nugget-popup"><p>Surface water flowed down The Hill on 21 November 2012; an access track at The Hill conveyed runoff toward Wappenham Road as part of the overland flow routes. (p10)</p></div><div class="nugget-popup"><p>Springs and groundwater flowed to the surface at locations on The Hill; water flowed beneath the foundations of a garage (potentially undermining it). The local ditch and pipe system flowed strongly during the flood, moving debris and affecting a property. (p11)</p></div><div class="nugget-popup"><p>During the flooding incident there was a blockage in the ditch system to the rear of No.4 The Hill; the blockage was later cleared. (p12)</p></div><div class="nugget-popup"><p>Continuous emergence of groundwater on high ground resulting in flowing water down the paved road surface; ditch at this location connects to the main watercourse and a ditch/pipe arrangement has undermined the foundations of a garage on The Hill. [IMG,PAG] (p38)</p></div><div class="nugget-popup"><p>A ditch alongside The Hill enters a pipe system at the base of a garage and has eroded/undermined the garage foundations, exposing the footing and creating a risk of structural instability. [IMG,PAG] (p39)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>1 garage; 1 property (p11)</p></div></div></body></div>`)[0];

                var html_70451275e848efcd863ef268bf5d5941 = $(`<div id="html_70451275e848efcd863ef268bf5d5941" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Syresham</h1><div class="nugget-popup"><p>Intense rainfall on a saturated catchment caused excess surface water to flow over ground following natural contours to low points in the village, resulting in internal flooding of at least one property. The village has experienced internal flooding on more than one occasion in the last five years. [PAG] (p5)</p></div><div class="nugget-popup"><p>Intense rainfall on a saturated catchment caused excess surface water to flow over ground to low points in the village, resulting in internal flooding of properties. Internal flooding of at least one property occurred; the same or similar internal flooding has been experienced on more than one occasion within the previous five years. [PAG] (p6)</p></div><div class="nugget-popup"><p>At least one property in the village flooded internally on 21 November 2012; various other properties were identified as being at high risk of flooding. Foul&ndash;water flooding and associated odours were reported in parts of the village (Abbey Road and High Street). (p8)</p></div><div class="nugget-popup"><p>Intense rainfall on a saturated catchment overwhelmed existing drainage. Drainage systems (including historic drains) were silted, partly removed or in poor repair, reducing conveyance capacity. As a result water flowed uncontrolled onto the highway and through private properties. (p17)</p></div><div class="nugget-popup"><p>Surface water from higher ground was not collected by historic/remaining drainage (some in poor condition, unknown or removed) and flowed uncontrolled onto the public highway and through private properties in the village, causing flooding of the highway and private properties. (p18)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>at least one property; more than one occasion in the last 5 years [PAG] (p5)</p></div><div class="nugget-popup quant"><p>at least 1 property [PAG] (p6)</p></div><div class="nugget-popup quant"><p>at least one property (p8)</p></div></div></body></div>`)[0];
