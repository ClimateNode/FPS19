                var html_5ce88e33dceee61694a6cd67f61be118 = $(`<div id="html_5ce88e33dceee61694a6cd67f61be118" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Lambourn</h1><div class="nugget-popup"><p>Included in the report's list of locations that experienced the most severe flooding during the West Berkshire 2024 event and investigated; flooding occurred as part of the wider event driven by heavy rainfall and high groundwater levels. (p15)</p></div><div class="nugget-popup"><p>Following Storms Henk, Isha and Jocelyn, 5 properties in Lambourn were reported flooded: 3 properties internally flooded and 2 properties externally flooded. Road closures reported: 1. [TAB] (p19)</p></div><div class="nugget-popup"><p>Affected by flooding associated with Storm Henk; the report assessed the event's rainfall, levels and flows at this location. (p24)</p></div><div class="nugget-popup"><p>Included as one of the eight radar grid squares used to characterise the spatial distribution of rainfall during the January flood/rainfall event. [TAB] (p26)</p></div><div class="nugget-popup"><p>Local river gauge recorded a peak daily water level during the January 2024 event, indicating elevated river levels associated with the storm. [PAG,IMG] (p27)</p></div><div class="nugget-popup"><p>The river gauge at Lambourn recorded a very high river level during the January 2024 event, indicating local fluvial flooding; the January peak at this station was the second&ndash;highest on its AMAX record. [TAB] (p28)</p></div><div class="nugget-popup"><p>The village experienced flooding from fluvial (River Lambourn), sewer and surface water sources during the 2024 event. [PAG] (p71)</p></div><div class="nugget-popup"><p>The village experienced flooding in early January 2024 from multiple sources (river/Lambourn, groundwater, surface water and sewer). Flooding affected areas generally mapped as Flood Zone 2 and areas with high surface water flood risk. Local flood wardens and residents reported the 2024 flooding was more prolonged than the 2013/14 event. [PAG,IMG] (p72)</p></div><div class="nugget-popup"><p>High groundwater and surface water runoff caused widespread flooding across the village: roads and access routes flooded and some became impassable; sewers were surcharged and discharged foul water onto roads and into the River Lambourn; springs emerged through some roads; a paddock south of Crowle Road remained flooded with groundwater; properties experienced internal fluvial, sewer/surface water and groundwater flooding. [PAG] (p73)</p></div><div class="nugget-popup"><p>High groundwater levels during winter 2023/24 contributed to flooding across Lambourn. Groundwater infiltrated the sewer system causing it to become inundated. Inadequate road drainage along Wantage Road and limited ditch capacity feeding the culvert under Gwynn's Piece and Millfield increased surface water runoff and raised the risk of flooding (including potential flooding of Oxford Street). [PAG] (p74)</p></div><div class="nugget-popup"><p>Local response to the 2024 flood event included extraction of foul water from the sewer network and licensed discharge of filtered foul water into the River Lambourn (Atac unit deployed and later relocated within the village). [PAG] (p75)</p></div><div class="nugget-popup"><p>Wantage Road in Lambourn was closed on 5 January 2024 during the January 2024 flooding; Community Information Officers visited on 11 January 2024 to provide advice and gather information on the flooding situation. [PAG] (p76)</p></div><div class="nugget-popup"><p>Residents and businesses in Lambourn were affected by fluvial (river) and surface water flooding, by groundwater flooding in some properties, and by sewer flooding (including sewage backing up / sewer water on roads). Some properties required or already had property flood resilience measures; traffic&ndash;management (traffic lights) was implemented locally to reduce splashing from sewer flooding into houses. (p77)</p></div><div class="nugget-popup"><p>Experienced complex flooding in early 2024. Impacts included inundation of the sewer network (leading to Thames Water recommendations to investigate capacity/condition), groundwater inundating a flip pump on Newbury Road which had to continuously pump to the main sewer, and fluvial flows that contributed but were not the main cause. (p78)</p></div><div class="nugget-popup"><p>Flooding affected the village of Lambourn with multiple sources (fluvial/river, groundwater, sewer and surface water) causing property and transport impacts. [TAB,PAG] (p79)</p></div><div class="nugget-popup"><p>Area experienced flooding during January 2024 triggered by saturated soils, repeated heavy rainfall (particularly from Storm Stork Henk) and high groundwater. The Environment Agency indicated these factors caused flooding in the area while noting no specific capacity issues with the river Lambourn at this location. (p190)</p></div><div class="nugget-popup"><p>Flooding occurred at Lambourn and was the subject of a Section 19 investigation after storms in January 2024 (Storm Henk 02/01/2024; Storm Isha 21&ndash;22/01/2024; Storm Jocelyn 23&ndash;24/01/2024). (p223)</p></div><div class="nugget-popup"><p>Subject of a Section 19 flood investigation following flooding at the location; Thames Water/WSP were asked for records of actions taken in response to the flooding. (p225)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>5 properties; 3 internally flooded; 2 externally flooded; 1 road closure [TAB] (p19)</p></div><div class="nugget-popup quant"><p>1.36 m AOD (peak water level) on 4 January 2024; AMAX rank 2 of 24 [PAG,IMG] (p27)</p></div><div class="nugget-popup quant"><p>1.36 m AOD (4 January 2024); January 2024 AMAX rank 2 of 24 [TAB] (p28)</p></div><div class="nugget-popup quant"><p>approximately 12 properties flooded internally (winter 2013/14); approximately nine properties flooded externally (winter 2013/14) [PAG] (p71)</p></div><div class="nugget-popup quant"><p>floodwaters approximately 200mm deep (Wantage Road); impassable for approximately eight weeks (Wantage Road); one property with internal fluvial flooding with ~50mm internal depth; two properties with internal groundwater flooding on 04 Jan 2024 with floodwater reaching ~250mm [PAG] (p73)</p></div><div class="nugget-popup quant"><p>5 properties flooded; 3 properties flooded internally; 2 properties flooded externally; 1 road closure (Wantage Road) [TAB,PAG] (p79)</p></div></div></body></div>`)[0];

                var html_1c573d706281833fb42450c512081792 = $(`<div id="html_1c573d706281833fb42450c512081792" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>West Ilsley</h1><div class="nugget-popup"><p>Noted in the report as having experienced flooding at a less significant scale during the West Berkshire 2024 flood event. Part of the regional flooding driven by high groundwater and heavy rainfall associated with Storms Henk, Isha and Jocelyn. [MUL] (p15)</p></div><div class="nugget-popup"><p>Cellar flooding was experienced and was observed to be pumped onto the highway. [PAG] (p134)</p></div></div></body></div>`)[0];

                var html_fa7fe53fd01a5dcd1e840786606ca65c = $(`<div id="html_fa7fe53fd01a5dcd1e840786606ca65c" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Streatley</h1><div class="nugget-popup"><p>Internal and external property flooding to residents and businesses and road closures were reported in Streatley during the January 2024 storms. [MUL] (p17)</p></div><div class="nugget-popup"><p>Properties in Streatley were flooded following the storms: 21 properties flooded, of which 6 were flooded internally and 15 externally. No road closures were reported. [TAB] (p19)</p></div><div class="nugget-popup"><p>Affected by flooding associated with Storm Henk (heavy rainfall and raised flows) and included in the report's assessment of impacted areas. (p24)</p></div><div class="nugget-popup"><p>Radar grid at Streatley recorded heavy rainfall during the event and is identified among the affected locations in the report. (p27)</p></div><div class="nugget-popup"><p>Village experienced multi&ndash;source flooding in early 2024: River Thames overtopped between Cleeve Lock and Goring Lock causing fluvial flooding; groundwater emergence (springs) arose in agricultural fields north of Cleeve Court Road; surface water and sewer sources also contributed. Residents moved vehicles to higher ground due to flood depths. [PAG] (p117)</p></div><div class="nugget-popup"><p>River Thames overtopped banks between Cleeve Lock and Goring Lock producing fluvial flooding; groundwater emerged as springs in agricultural fields north of Cleeve Court Road; surface water runoff from surrounding high ground and down Streatley Hill produced debris&ndash;filled flows and contributed to flooding; residents moved vehicles to higher ground due to unsafe vehicular access. Residential and commercial buildings experienced internal and basement flooding, including The Swan Hotel and the basement of St Mary's Church used for flood&ndash;equipment storage. The Swan Hotel lost trading while lower levels were inundated. [IMG,PAG] (p118)</p></div><div class="nugget-popup"><p>Multiple flood sources affected Streatley: River Thames overtopping caused external fluvial flooding in the low&ndash;lying Cleeve Court area (all 11 properties at Cleeve Court and 3 properties on Cleeve Court Road were flooded externally). High groundwater led to internal groundwater flooding reported by a resident on three occasions (including 5 January). Surface water runoff on Streatley Hill generated debris&ndash;filled flood currents. At least 2 properties in Cleeve Court experienced internal sewer flooding from sewage backflow. The Swan Hotel was affected by fluvial and surface water flooding, causing a loss of trading. Residents reported 2024 flood depths were deeper than in previous events, with maximum flood depths in gardens along Cleeve Court Road reaching around 1 m. [PAG] (p119)</p></div><div class="nugget-popup"><p>River Thames overtopped its banks and flooded low&ndash;lying Cleeve Court in Streatley. High groundwater contributed to prolonged inundation and perched water. Sewers serving Cleeve Court backed up during the early flood period, with some sewage reaching lower bathrooms of properties; the local sewage pumping station appears to have been overwhelmed (pumps may have stopped) due to floodwater ingress/overload. Drainage ditches were observed to be overgrown, reducing conveyance and prolonging flooding. Lock telemetry failure and a lock gate failure were also reported during the flooding. [PAG] (p120)</p></div><div class="nugget-popup"><p>Residents and the local flood warden reported issues after heavy rainfall that prompted Thames Water to plan remedial actions (improved telemetry, faster responses to capacity alerts, upgraded/more powerful pumps) to address capacity exceedance and related impacts experienced by residents. (p121)</p></div><div class="nugget-popup"><p>Internal fluvial flooding of a property in Streatley caused by debris build&ndash;up at Goring Lock (River Thames). [PAG] (p122)</p></div><div class="nugget-popup"><p>Properties in the Streatley area experienced internal sewer flooding (residents reported properties had non&ndash;return valves fitted) and groundwater flooding affecting premises (including basements). Highway gullies and ditches became blocked after flood events; residents reported flood alerts/warnings were often issued too late and flooding had already occurred prior to warnings. [PAG] (p123)</p></div><div class="nugget-popup"><p>Flooding inundated areas of the village that lie in Flood Zone 3. The summary states Streatley experienced flooding as a result of Storms Henk, Isha and Jocelyn; the High Street is identified as having high surface water flood risk. (p124)</p></div><div class="nugget-popup"><p>Identified as one of the sources of flooding for the event; contributed to the overall flooding that affected properties in the area. (p125)</p></div><div class="nugget-popup"><p>River levels on the Thames rose during the named storms of early January 2024; local lock and weir operations were used to try to manage levels but weirs could only be partially closed between successive storms and were reopened. (p211)</p></div><div class="nugget-popup"><p>Flooding occurred in Streatley associated with Storm Henk (02/01/2024), Storm Isha (21/01/2024&ndash;22/01/2024), and Storm Jocelyn (23/01/2024&ndash;24/01/2024); the event is the subject of a Section 19 flood investigation. [MUL] (p220)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>21 properties flooded; 6 properties internally flooded; 15 properties externally flooded; 0 road closures [TAB] (p19)</p></div><div class="nugget-popup quant"><p>29.1 mm rainfall; 1 in 4&ndash;year return period (p27)</p></div><div class="nugget-popup quant"><p>approximately 6 properties flooded internally; approximately 4 properties affected by internal groundwater flooding; The Swan Hotel flooded for approximately 15 days from 05 Jan 2024; flood depths reached approximately 1 m in lower levels and approximately 10 cm in higher levels. [IMG,PAG] (p118)</p></div><div class="nugget-popup quant"><p>11 properties; 3 properties; at least 2 properties; 3 occasions; approximately 1 m [PAG] (p119)</p></div><div class="nugget-popup quant"><p>approximately 6 m (dead trees/debris along river channel) [PAG] (p120)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p122)</p></div><div class="nugget-popup quant"><p>21 properties flooded; 6 properties flooded internally; 15 properties flooded externally (p125)</p></div></div></body></div>`)[0];

                var html_1a83742fe80cbdba1e04f87c3b787129 = $(`<div id="html_1a83742fe80cbdba1e04f87c3b787129" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Purley-On-Thames</h1><div class="nugget-popup"><p>Flooding following the storms caused widespread property flooding in Purley on Thames: 75 properties flooded in total, of which 25 were internally flooded and 50 externally flooded; five road closures were recorded. [TAB] (p19)</p></div><div class="nugget-popup"><p>Affected by flooding associated with Storm Henk (heavy rainfall and raised flows) and included in the report's assessment of impacted areas. (p24)</p></div><div class="nugget-popup"><p>Radar grid at Purley&ndash;on&ndash;Thames recorded heavy rainfall during the event, forming part of the spatial rainfall that contributed to the flood investigation. [PAG] (p27)</p></div><div class="nugget-popup"><p>Flooding affected large areas of Lower Purley (the low&ndash;lying residential area north of St Mary&#8217;s Church). Approximately 75 properties were flooded either internally and/or externally, of which approximately 25 properties were flooded internally. [PAG] (p109)</p></div><div class="nugget-popup"><p>Large areas of the village were flooded during the early&ndash;2024 event: properties experienced fluvial flooding followed by groundwater and sewer impacts. Residents were largely unable to use wastewater facilities effectively; garden and garage flooding occurred widely; internal flooding persisted for some properties. [PAG,IMG] (p110)</p></div><div class="nugget-popup"><p>Purley on Thames experienced elevated groundwater levels, fluvial (river) flooding and sewer flooding. Properties were reported flooded internally for up to two weeks, and external flooding remained visible during a site visit on 14 March 2024. [IMG,PAG] (p111)</p></div><div class="nugget-popup"><p>Low&ndash;lying parts of Purley on Thames were flooded when high groundwater, overtopping of the River Thames and an overburdened sewer system combined. River overtopping flooded the low&ndash;lying area of Lower Purley and affected garages converted to living accommodation; elevated groundwater exacerbated prolonged inundation. [PAG] (p112)</p></div><div class="nugget-popup"><p>Fluvial flooding overtopped the Blount's Meadow bund and affected properties in Purley on Thames: 2 properties experienced internal flooding; 10 properties experienced garage flooding; 12 properties experienced external garden flooding. (p113)</p></div><div class="nugget-popup"><p>The Environment Agency received reports of flooding across Purley on Thames: internal fluvial flooding from the River Thames affected properties and external flooding affected other properties; Community Information Officers visited multiple days to provide advice; EA deployed pumps operating in Purley until property flood risk reduced. (p114)</p></div><div class="nugget-popup"><p>Excessive inundation of the sewer system (sewer surcharging/inundation) causing local flooding; area was visited by Council representatives during the January 2024 event and Thames Water was recommended to carry out CCTV and remedial works. (p115)</p></div><div class="nugget-popup"><p>Flooding in Purley on Thames during named storms led to both groundwater, fluvial (river) and sewer&ndash;related flooding that affected properties and local roads; multiple road closures were recorded. [TAB] (p116)</p></div><div class="nugget-popup"><p>Purley experienced a combination of fluvial (river), surface water and groundwater flooding mechanisms. In response to rising water levels in January 2024 the Environment Agency deployed pumps to reduce flood risk; pumps operated until the risk of property flooding was reduced. A flood bund located behind Wintringham Way is present as a local defence. (p207)</p></div><div class="nugget-popup"><p>Experienced flooding in January 2024 affecting properties; the Environment Agency operated high&ndash;volume pumps in Purley&ndash;on&ndash;Thames and deployed Community Information Officers to the area to provide information and record property flooding. (p209)</p></div><div class="nugget-popup"><p>Flooding occurred in Purley associated with Storm Henk (02/01/2024), Storm Isha (21/01/2024&ndash;22/01/2024), and Storm Jocelyn (23/01/2024&ndash;24/01/2024); the event is the subject of a Section 19 flood investigation. [MUL] (p220)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>75 properties flooded; 25 properties internally flooded; 50 properties externally flooded; 5 road closures [TAB] (p19)</p></div><div class="nugget-popup quant"><p>30.5 mm rainfall; 1 in 5&ndash;year return period [PAG] (p27)</p></div><div class="nugget-popup quant"><p>75 properties; 25 properties [PAG] (p109)</p></div><div class="nugget-popup quant"><p>Approximately 75 properties flooded (internal and/or external); approximately 25 properties flooded internally; 75 properties experienced garden flooding; 41 properties experienced garage flooding; internal flood depths ~250 mm to 1.3 m; external flooding depths up to 1.5 m; internal flooding lasted for up to two weeks. [PAG,IMG] (p110)</p></div><div class="nugget-popup quant"><p>properties flooded internally for up to two weeks [IMG,PAG] (p111)</p></div><div class="nugget-popup quant"><p>2 properties internal flooding; 10 properties garage flooding; 12 properties external garden flooding [PAG] (p112)</p></div><div class="nugget-popup quant"><p>2 properties; 10 properties; 12 properties (p113)</p></div><div class="nugget-popup quant"><p>12 reports of flooding across Purley on Thames; 2 properties internal fluvial flooding; 2 properties external fluvial flooding; 6 properties external flooding from unknown sources; 3 pumps deployed (p114)</p></div><div class="nugget-popup quant"><p>75 properties; 25 properties flooded internally; 50 properties flooded externally; 5 road closures (St Marys Avenue, Wintringham Way, Chestnut Grove, Colyton Way, Brading Way). [TAB] (p116)</p></div><div class="nugget-popup quant"><p>3 pumps (p207)</p></div></div></body></div>`)[0];

                var html_b07f1bbe59c0afaf46bc042e7a873435 = $(`<div id="html_b07f1bbe59c0afaf46bc042e7a873435" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Pangbourne</h1><div class="nugget-popup"><p>Properties in Pangbourne were flooded following the storms: 4 properties flooded, all 4 flooded internally. No road closures were reported. [TAB] (p19)</p></div><div class="nugget-popup"><p>Affected by flooding associated with Storm Henk; the report assessed rainfall, levels and flows for this location. (p24)</p></div><div class="nugget-popup"><p>Recorded as one of the assessed radar grid squares that captured heavy rainfall during the January flood/rainfall event across West Berkshire. [TAB] (p26)</p></div><div class="nugget-popup"><p>Local river gauge recorded a peak daily water level in January 2024 following the storm period, showing raised river levels associated with the event. [PAG,IMG] (p27)</p></div><div class="nugget-popup"><p>Gauges at Pangbourne recorded peak river levels and flows during January 2024, indicating significant fluvial flooding in the locality. [TAB] (p28)</p></div><div class="nugget-popup"><p>Flooding began around 4 January 2024 (first signs reported 04/01/2024). Flooding in January 2024 was reported by residents and the Pangbourne flood warden as caused by fluvial sources (River Thames, Sulham Brook, River Pang) together with groundwater emergence. Historic event 2013/14 affected the village (see quant). [PAG,MUL] (p100)</p></div><div class="nugget-popup"><p>Areas of the village (Flood Zone 2 and 3) experienced fluvial and groundwater flooding in early January 2024. Four properties experienced internal flooding (two residential, two commercial). One residential property had internal groundwater flooding starting 6 Jan 2024, lasting approximately three days, with flood depths reaching about 75 mm; that same property also experienced external fluvial flooding from the River Thames but overland entry was prevented by flood sacks. [PAG,IMG] (p101)</p></div><div class="nugget-popup"><p>Residential and commercial properties experienced internal flooding from both groundwater and river (fluvial) sources. One residential property had internal groundwater flooding followed by river water entering the rear of the property. One commercial property had its car park flooded when the River Thames overtopped and was internally flooded in early January. Another commercial property experienced combined groundwater and fluvial internal flooding, with external car park flooding progressing into the building; flows became dangerously strong and residents were evacuated to hotels. Roads and community infrastructure were affected: Mill Lane was impassable, the Wharf overtopped where the River Thames backed up the River Pang, and a medical surgery car park was flooded causing the surgery to relocate for about three days. [PAG] (p102)</p></div><div class="nugget-popup"><p>High groundwater and elevated River Thames levels caused overtopping of the Thames and backing up of the River Pang, leading to flooding across Pangbourne. Debris built up on Whitchurch Weir, obstructing flows; silted grips on Mill Lane prevented effective drainage causing road flooding; at least one property suffered indirect flooding from burst pipes after supplies were turned off and then frozen and burst. [PAG] (p103)</p></div><div class="nugget-popup"><p>Pangbourne experienced fluvial flooding from the River Thames; the Environment Agency received five reports of flooding in the area, including internal flooding of two properties and external flooding of three properties. Community Information Officers visited on 4&ndash;5 January 2024 to advise residents and collect information. [PAG] (p105)</p></div><div class="nugget-popup"><p>Area experienced flooding during the January 2024 events; West Berkshire Council representatives visited the Pangbourne area in response and local residents received flood sacks distributed by the Parish Council. (p106)</p></div><div class="nugget-popup"><p>Residential properties and local roads were flooded; properties experienced internal flooding and transport was disrupted by road closures. [PAG] (p107)</p></div><div class="nugget-popup"><p>Properties in Pangbourne experienced internal flooding caused by river (fluvial) and groundwater sources. External flooding extent not recorded in the table. [TAB,PAG] (p108)</p></div><div class="nugget-popup"><p>Pangbourne is specifically named in the document as a location now being investigated for flooding that occurred during the January 2024 storm period (Section 19 investigation requested of Thames Water). (p223)</p></div><div class="nugget-popup"><p>Subject of a Section 19 flood investigation following flooding at the location; Thames Water/WSP were asked for records of actions taken in response to the flooding. (p225)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 properties flooded; 4 properties internally flooded; 0 road closures [TAB] (p19)</p></div><div class="nugget-popup quant"><p>1.128 m AOD (peak water level) on 7 January 2024; AMAX rank 1 of 37 [PAG,IMG] (p27)</p></div><div class="nugget-popup quant"><p>1.128 m AOD (7 January 2024); January 2024 AMAX rank 1 of 37; 5.09 m³/s flow (7 January 2024); January 2024 AMAX flow rank 4 of 56; AEP 22 [TAB] (p28)</p></div><div class="nugget-popup quant"><p>4 properties; 20 properties [PAG,MUL] (p100)</p></div><div class="nugget-popup quant"><p>4 properties; 2 residential properties; 2 commercial properties; 1 residential property; 75 mm flood depth; 3 days [PAG,IMG] (p101)</p></div><div class="nugget-popup quant"><p>internal flood depth ~200 mm (residential peak ~12/13 Jan); commercial property flood depths 200 mm&ndash;1 m (early Jan) lasting ~one week; another commercial property flooded internally from 04 Jan for ~four weeks; flood depths ~50 cm by 06 Jan; surgery relocated for ~3 days; evacuations to hotels (from 06 Jan) [PAG] (p102)</p></div><div class="nugget-popup quant"><p>1 property [PAG] (p103)</p></div><div class="nugget-popup quant"><p>five reports of flooding across Pangbourne; 2 properties internal fluvial flooding; 3 properties external fluvial flooding [PAG] (p105)</p></div><div class="nugget-popup quant"><p>4 properties flooded internally; 4 road closures [PAG] (p107)</p></div><div class="nugget-popup quant"><p>4 properties flooded internally; 0 road closures [TAB,PAG] (p108)</p></div></div></body></div>`)[0];

                var html_d690d936ae83707a7754dd163e4dca3e = $(`<div id="html_d690d936ae83707a7754dd163e4dca3e" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Burghfield</h1><div class="nugget-popup"><p>Affected by flooding associated with Storm Henk (heavy rainfall and raised flows) and included in the report's assessment of impacted areas. (p24)</p></div><div class="nugget-popup"><p>Recorded as one of eight 1x1 km radar grid squares covering the main affected areas during the January flood/rainfall event; experienced the intense rainfall associated with the event. [TAB] (p26)</p></div><div class="nugget-popup"><p>Recorded as one of the eight main affected locations for the January 2024 flood investigation; a 1 x 1 km radar grid was purchased and assessed at this location. The location experienced heavy rainfall during the 4&ndash;5 January 2024 event that contributed to the wider flood event and was therefore included in the investigation. [PAG,IMG] (p27)</p></div><div class="nugget-popup"><p>Flooding affected the village from groundwater and fluvial sources. During winter 2013/14 approximately 18 properties were flooded internally and approximately four properties were flooded externally across the entirety of Burghfield. Similar sources (groundwater and fluvial from the River Kennet and Kennet and Avon Canal) contributed to flooding again in early 2024. [PAG,MUL] (p32)</p></div><div class="nugget-popup"><p>Early&ndash;2024 flooding in Burghfield Bridge was caused by high groundwater and fluvial overtopping of the Kennet and Avon Canal. Floodwater flowed from the canal south through the Cunning Man pub car park, through a culvert under Burghfield Road onto the first 50 yards of Pingewood Road North and down Green Lane, affecting residential properties. Groundwater emerged across the residential area and had to be pumped south to lower derelict land. Internal flooding affected properties (residential and commercial). High groundwater filled septic tanks causing loss of ability to use showers, toilets and washing machines in some properties; raw sewage emergence from septic fields was also reported. Flooding impeded road access (cars broke down on Pingewood Road North) creating access issues for emergency vehicles. Floodwaters took a long time to subside. [IMG,PAG,MUL] (p33)</p></div><div class="nugget-popup"><p>The Environment Agency received 10 reports of flooding across Burghfield during the 2024 flood event: two properties reported internal flooding and seven properties reported external flooding. Six of the affected properties were located in Burghfield Bridge. (p36)</p></div><div class="nugget-popup"><p>Subject of site visits following the January 2024 flood event; guidance issued for riparian owners (within Burghfield Bridge) to maintain ditches to allow free passage of water during flood events, indicating local flooding and watercourse/ditch impacts. (p37)</p></div><div class="nugget-popup"><p>Low&ndash;lying areas of Burghfield were inundated by fluvial flooding during the early 2024 event. Flooding was driven by the River Kennet and Kennet and Avon Canal overtopping and by the overtopping of nearby lakes, causing water to pond in the settlement's low&ndash;lying areas. [IMG] (p40)</p></div><div class="nugget-popup"><p>Reported flooding across the area during the January 2024 event; two properties reported internal flooding and seven properties reported external flooding. (p45)</p></div><div class="nugget-popup"><p>Areas across Burghfield were affected by fluvial flooding during the January 2024 event, with flooding attributed to the River Kennet and the Kennet and Avon Canal (the report notes the 2013/14 event affected properties across Burghfield and indicates the 2024 event affected similar areas). [IMG] (p48)</p></div><div class="nugget-popup"><p>The Environment Agency received 10 reports of flooding across Burghfield during January 2024; two properties reported internal flooding and seven properties reported external flooding. Flood alerts for River Enborne and Foudry Brook were in force during 02/01/2024&ndash;07/01/2024. (p51)</p></div><div class="nugget-popup"><p>Two roads in Burghfield (Reading Road and Padworth Road) were closed due to flooding on 5th January 2024; both reopened 8th January 2024. [TAB] (p133)</p></div><div class="nugget-popup"><p>Properties closest to the River Kennet at Burghfield were subject to a flood warning in force 02/01/2024 &ndash; 11/01/2024, indicating threat from river flooding. [PAG] (p184)</p></div><div class="nugget-popup"><p>Flooding occurred in Burghfield associated with Storm Henk (02/01/2024), Storm Isha (21/01/2024&ndash;22/01/2024), and Storm Jocelyn (23/01/2024&ndash;24/01/2024); the event is the subject of a Section 19 flood investigation. [MUL] (p220)</p></div><div class="nugget-popup"><p>Area (specifically Burghfield Bridge / Eastbury) affected by wet&ndash;weather issues: assets impacted by groundwater infiltration and, in some locations, rivers overtopping/bursting banks. Thames Water is undertaking investigations; no assets are reported as broken or requiring repair at present. (p224)</p></div><div class="nugget-popup"><p>Flooding occurred in Burghfield (the investigation specifically references the Burghfield Bridge area). The location was included in a Section 19 flood investigation into flooding that occurred in January 2024 and Thames Water was asked to provide details of actions taken in response. (p225)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>18 properties; 4 properties [PAG,MUL] (p32)</p></div><div class="nugget-popup quant"><p>approximately ten properties internally flooded; first 50 yards of Pingewood Road North inundated; flooding persisted for approximately a week and a half; high groundwater issues continued for several months; (historic winter 2013/14: approximately 18 properties internally flooded and approximately four properties externally flooded across Burghfield) [IMG,PAG,MUL] (p33)</p></div><div class="nugget-popup quant"><p>10 reports; 2 internally flooded properties; 7 externally flooded properties; 6 affected properties located in Burghfield Bridge (p36)</p></div><div class="nugget-popup quant"><p>10 reports of flooding across Burghfield; two properties reported internal flooding; seven properties reported external flooding (p45)</p></div><div class="nugget-popup quant"><p>approximately 18 properties flooded internally; approximately four properties flooded externally [IMG,MUL] (p48)</p></div><div class="nugget-popup quant"><p>10 reports; 2 properties (internal flooding); 7 properties (external flooding) (p51)</p></div><div class="nugget-popup quant"><p>2 road closures [TAB] (p133)</p></div></div></body></div>`)[0];

further properties on Northcroft Lane [IMG] (p81)</p></div><div class="nugget-popup quant"><p>2 properties (p82)</p></div><div class="nugget-popup quant"><p>approximately one week [PAG] (p83)</p></div><div class="nugget-popup quant"><p>1 road closure (Northcroft Lane) [TAB] (p88)</p></div></div></body></div>`)[0];
