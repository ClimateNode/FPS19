                var html_05550eb8e70ce3af7e581e4e8089faf2 = $(`<div id="html_05550eb8e70ce3af7e581e4e8089faf2" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Wycombe District</h1><div class="nugget-popup"><p>The district contains Marlow and multiple streets/properties recorded as flooded across several events; the report analyses the Jan&ndash;Feb 2014 event (unusually wet winter with particularly wet days on 23 Jan and 6 Feb) which contributed to fluvial and surface&ndash;water flooding across the area. Historical records in the SFRA/SWMP show numerous internal flood incidents across the district. [TAB,PAG] (p15)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>30 properties flooded [TAB,PAG] (p15)</p></div></div></body></div>`)[0];

                var html_0bf778b12cf6c9b9f8ce190d9313fc0b = $(`<div id="html_0bf778b12cf6c9b9f8ce190d9313fc0b" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>River Thames</h1><div class="nugget-popup"><p>The River Thames runs adjacent to Marlow and is likely the source or contributor to the flooding that affected Pound Lane and East Marlow in January&ndash;February 2014 (the text does not explicitly state causation, so this is inferred). (p7)</p></div><div class="nugget-popup"><p>The River Thames (a designated Main River draining a catchment of over 6700 km2) rose in response to rainfall and influenced groundwater and gravel water levels around Marlow, contributing to the flooding experienced in the town during the January&ndash;February 2014 event. [PAG] (p10)</p></div><div class="nugget-popup"><p>Fluvial flooding of the River Thames overtopped banks and inundated low&ndash;lying Thames&ndash;valley towns including areas around Marlow; the river rise stopped navigation and caused widespread inundation during major historical floods and is the principal fluvial hazard analysed for January&ndash;February 2014. [TAB,PAG,MUL] (p15)</p></div><div class="nugget-popup"><p>Fluvial flooding of the River Thames contributed to flooding in Marlow (notably the Pound Lane / Gossmore Lane area) during the January&ndash;February 2014 event, interacting with high groundwater and surface water to cause internal property flooding. [TAB,PAG] (p16)</p></div><div class="nugget-popup"><p>River levels in the Thames peaked (10 January 2014 and a higher peak 9&ndash;11 February 2014) and these high river levels contributed to raised groundwater and held up water in the Terrace Gravels beneath and around Marlow. [PAG,MUL] (p18)</p></div><div class="nugget-popup"><p>Recorded two pronounced high&ndash;water periods that generated the January and February 2014 flooding episodes in Marlow &mdash; a peak around 10 January 2014 and a higher peak between 9&ndash;11 February 2014, producing elevated river levels upstream of Marlow Lock. [IMG,PAG,MUL] (p19)</p></div><div class="nugget-popup"><p>River Thames water levels peaked around 10 January 2014 and rose to a higher peak between 9&ndash;11 February 2014. Areas of Marlow close to the Thames and below approximately 28.2m AOD were likely inundated by floodwaters from the Thames; an Environment Agency Flood Warning was issued for the Marlow reach on 6 January 2014 and river peaks caused continuing and then more severe flooding in February. [PAG,MUL] (p20)</p></div><div class="nugget-popup"><p>High River Thames levels and two peaks (around 10 January 2014 and a second peak around 11 February 2014) caused inundation of low&ndash;lying areas close to the river (areas below ~28.2 m AOD). The river going out of bank led to direct flooding of riverside zones and contributed to more severe flooding during the February peak. [PAG,MUL] (p21)</p></div><div class="nugget-popup"><p>Thames&ndash;wide flooding led to a major incident declaration by Thames Valley Police and triggered flood warnings for properties along the Marlow reach (flood warnings issued for properties from All Saints Church / Bisham to Little Marlow). [TAB,PAG] (p24)</p></div><div class="nugget-popup"><p>Environment Agency issued Flood Warning for properties closest to the River Thames between All Saints Church, Bisham and Little Marlow, indicating river&ndash;driven flood risk to riverside properties. [TAB] (p25)</p></div><div class="nugget-popup"><p>Flood warning was in force for properties closest to the River Thames between All Saints Church (Bisham) and Little Marlow during the event; the warning was later removed (no longer in force on 21 February 2014). [TAB] (p27)</p></div><div class="nugget-popup"><p>River levels rose above the bank and directly flooded areas of Marlow adjacent to the river during the January&ndash;February 2014 event; this Thames flood was estimated to be a 5% AEP event. (p32)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>4 feet above normal at Windsor Bridge (1947); more than 8 feet above normal at Bray Lock (1947) [TAB,PAG,MUL] (p15)</p></div></div></body></div>`)[0];

                var html_d5bac436e7bae308f42ec510cb2b8611 = $(`<div id="html_d5bac436e7bae308f42ec510cb2b8611" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Pound Lane, Marlow</h1><div class="nugget-popup"><p>Surface water flooding occurred in the Pound Lane area during January&ndash;February 2014. Surface water in this area is managed by local soakaways, with excess collected in sumps and pumped to the River Thames (drainage arrangement relevant to the flooding experienced). (p8)</p></div><div class="nugget-popup"><p>The Pound Lane area of Marlow was identified as an area where flooding was experienced during January&ndash;February 2014. Local surface water drainage in this area relies on soakaways with excess water collected in sumps and pumped to the River Thames, and the area was included in the study of flooded assets. [IMG] (p9)</p></div><div class="nugget-popup"><p>Properties on Pound Lane and Gossmore Lane experienced internal flooding during the January&ndash;February 2014 event. Flooding is attributed to Thames fluvial influence combined with intense surface water runoff during the exceptionally wet winter. [TAB] (p16)</p></div><div class="nugget-popup"><p>The Pound Lane / Pound Crescent / Trout Close / Pike Close / Garnet Court area (Area A) flooded from groundwater and, for some properties, also from the River Thames. Householders used submersible pumps but could only pump to local sumps; permanently sited council pumps in sumps could not cope. Buckinghamshire Fire and Rescue initially pumped the area and later brought in a higher&ndash;capacity pump; this area was the main focus for the fire service response. [PAG] (p20)</p></div><div class="nugget-popup"><p>The Pound Lane area experienced flooding impacts during the event; BFRS estimated that properties in this area were affected by flooding in some way (not all internally). (p22)</p></div><div class="nugget-popup"><p>Area experienced flooding that required pumping and community response: pumps in the Pound Lane area were operating to protect properties, sandbags were issued, residents undertook self&ndash;help, and the road was closed due to flooding. [TAB,PAG,MUL] (p24)</p></div><div class="nugget-popup"><p>Pound Lane experienced flooding requiring pumping and flood response: surface&ndash;water pump overwhelmed, BFRS pumping assistance, road closure, and sandbag distribution; a pump was sited in Pound Lane by TfB. [TAB,PAG,MUL] (p25)</p></div><div class="nugget-popup"><p>Area used as the main sandbag distribution and pumping hub during the event. A sandbag station was set up and manned 24 hrs/day; pumps and a supersucker operated from the Pound Lane area to remove floodwater from nearby properties; an Incident Control Unit was set up at Marlow Sports Centre in Pound Lane. Groundwater levels in lower Pound Lane dropped during the response. [TAB,PAG,MUL] (p26)</p></div><div class="nugget-popup"><p>Groundwater flooding affected lower Pound Lane; pumps were deployed in the Pound Lane/Lock Road area to protect properties; Pound Lane was later re&ndash;opened after response activity. [TAB,PAG,MUL] (p27)</p></div><div class="nugget-popup"><p>Sand bags were distributed and groundwater levels affected the area; military presence moved out and the lane was later re&ndash;opened. Sand/Land drainage and pumping operations were used as part of the response. [TAB,PAG,MUL] (p28)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>150 properties (p22)</p></div><div class="nugget-popup quant"><p>810 sandbags; 12 sandbag walls; 3 pumps; 1200 sandbags (reported total at one delivery) [TAB,PAG,MUL] (p26)</p></div><div class="nugget-popup quant"><p>3 pumps; 5 properties cleared by Supersucker [TAB,PAG,MUL] (p27)</p></div></div></body></div>`)[0];

                var html_db733aa5b2a1424efe9dec5739c1b4f7 = $(`<div id="html_db733aa5b2a1424efe9dec5739c1b4f7" style="width: 100.0%; height: 100.0%;"><head><meta charset="utf-8"><link href="../../../../output/html/style.css" rel="stylesheet"/></head><body class="readout"><div><h1 class='h-popup'>Marlow</h1><div class="nugget-popup"><p>Prolonged above&ndash;average rainfall caused groundwater levels to rise and land saturation with groundwater emergence. Surface water drainage pumps were overwhelmed; a culvert on an ordinary watercourse had insufficient capacity; the River Thames overtopped its banks twice, flooding low&ndash;lying areas of Marlow; the sewer system became overwhelmed from groundwater infiltration and caused flooding. (p5)</p></div><div class="nugget-popup"><p>Following prolonged high groundwater and saturated ground, groundwater emergence and subsequent rainfall caused flooding where surface water drainage pumps were overwhelmed and a culvert on an ordinary watercourse lacked capacity. The River Thames overtopped its banks during two peak events, flooding low&ndash;lying areas of Marlow. Groundwater infiltration overwhelmed the sewer system, causing internal flooding to properties. The incident met the threshold of internal flooding to five or more residential properties within 1 km². [PAG] (p6)</p></div><div class="nugget-popup"><p>Two areas within Marlow (Pound Lane area and East Marlow) experienced flooding during January&ndash;February 2014. [PAG] (p7)</p></div><div class="nugget-popup"><p>Two areas within Marlow experienced flooding during January&ndash;February 2014 (Pound Lane area and eastern Marlow). The report describes surface water drainage arrangements for these areas: Pound Lane uses soakaways with excess collected in sumps and pumped to the River Thames; eastern Marlow routes runoff via a piped network discharging to the Newt Ditch (a culverted ordinary watercourse). [PAG] (p8)</p></div><div class="nugget-popup"><p>Parts of Marlow experienced flooding during January&ndash;February 2014, specifically the Pound Lane and East Marlow areas. Flooding affected the urban drainage areas where surface water is managed by soakaways, piped networks and discharges to Newt Ditch and the River Thames. [PAG,IMG] (p9)</p></div><div class="nugget-popup"><p>Flooding was experienced within Marlow (notably the Pound Lane area and East Marlow). Surface water in Pound Lane is normally managed by soakaways with excess collected in sumps and pumped to the River Thames; in East Marlow runoff is routed through a piped network discharging to the Newt Ditch (a culverted ordinary watercourse). These local drainage arrangements were the channels through which floodwaters and runoff were routed during the event. [PAG] (p10)</p></div><div class="nugget-popup"><p>Internal flooding recorded at properties across many streets in Marlow (examples listed in the record include Glade Road, The Causeway, Dedmere Road, Gossmore Lane, Garnet Court, Pound Lane, The Croft, Claremont Road, Station Road, Henley Road, High Street, Hillside Road, Maple Rise, Newtown Road, Oak Tree Road, Peacock Road, St Peter Street, West Street, Wycombe Street and Marlow Bottom Road). Surface&ndash;water flooding was recorded at Higginson Park. Groundwater in the underlying Chalk rose to exceptionally high levels and could resurface through the gravels beneath Marlow, contributing to inundation in built areas. [TAB,PAG] (p16)</p></div><div class="nugget-popup"><p>River levels peaked at Marlow (peak 10 January 2014 and a higher peak 9&ndash;11 February 2014) and high Thames levels held up groundwater in the underlying gravels; groundwater levels in and around Marlow rose, contributing to flooding impacts in the town. [PAG,MUL] (p17)</p></div><div class="nugget-popup"><p>Groundwater levels in the Terrace Gravels beneath and around Marlow rose &mdash; caused by excess flow from the Chilterns and being held up by high River Thames levels &mdash; producing elevated groundwater conditions in January&ndash;February 2014. [PAG] (p18)</p></div><div class="nugget-popup"><p>Experienced elevated River Thames water levels associated with the January and February 2014 high&ndash;water periods; the town was subject to river flooding risk when Thames levels peaked in early January and again in early February 2014. [PAG,IMG,MUL] (p19)</p></div><div class="nugget-popup"><p>At the start of January 2014, with groundwater high and the Thames already high, low&ndash;lying parts of Marlow experienced flooding primarily from groundwater. The River Thames peaked in January and again in February, causing further and more severe flooding. Areas below ~28.2m AOD close to the river were likely inundated. Groundwater, surface water and sewer flooding are described as interlinked contributors to the problems. [PAG] (p20)</p></div><div class="nugget-popup"><p>Low&ndash;lying parts of Marlow were inundated in January&ndash;February 2014. Areas below about 28.2m AOD close to the River Thames were likely inundated by Thames floodwaters. Area A (Pound Lane, Pound Crescent, Trout Close, Pike Close, Garnet Court) flooded from groundwater and in places from the River Thames; permanently sited council sump pumps could not cope and Buckinghamshire Fire and Rescue Service initially pumped the water then deployed a higher&ndash;capacity pump. Area B flooded directly from the River Thames and had reports of sewage problems; BFRS protected properties in St Peters Street. In Area C (Firview Close) piped drains backed up and rising groundwater threatened properties until residents pumped water over an informal bund in the A404 drainage ditch to prevent Thames waters backing up the ditch and flooding properties. A forward control point was established in Higginson Park to support multi&ndash;agency tactical coordination. [PAG,IMG] (p21)</p></div><div class="nugget-popup"><p>Widespread local flooding across Marlow from blocked piped drains, rising groundwater emergence and surface water that could not drain to the Newt Ditch; emergency response and community pumping limited impacts but properties and some evacuations occurred. [PAG] (p22)</p></div><div class="nugget-popup"><p>Describes the Jan&ndash;Feb 2014 flooding in Marlow: River Thames flows overtopped banks and flooded the floodplain; unusually high Chalk and gravel groundwater caused groundwater to emerge at the surface; surface water pumps were overwhelmed and piped drainage could not discharge to Newt Ditch (culvert capacity reduced by sediment); groundwater infiltrated foul sewers causing surcharging and flooding of low&ndash;lying areas. Report summarises affected properties, evacuations and estimated flood likelihood. (p23)</p></div><div class="nugget-popup"><p>Multiple flood impacts across the town during January&ndash;February 2014: Flood Warnings issued for properties close to the River Thames; flooding reported in St Peter Street and basement flooding on the High Street; groundwater flooding affecting Riverpark Drive and front and rear gardens in Garnet Court; road closures (Pound Lane); extensive pumping operations and sandbag distribution to protect properties; relief crews and fire service pumping operations sustained on site for multiple days. [TAB,PAG] (p24)</p></div><div class="nugget-popup"><p>Widespread local flooding across Marlow during January&ndash;February 2014: basement flooding on the High Street; flooding at Garnet Court requiring continuous pumping from a large storm drain; Flood Warning issued for properties along the River Thames from All Saints Church, Bisham to Little Marlow; road closures (Pound Lane); pumping operations at Pound Lane and St Peter Street; evacuations and multi&ndash;agency response (BFRS, EA, TfB, WDC, MTC); sandbag distribution and a 24&ndash;hour sandbag station. [TAB,PAG,MUL] (p25)</p></div><div class="nugget-popup"><p>Multiple flood impacts across the town: carpark flooding (Fieldhouse Lane), residential properties flooded (e.g. a flat in Mill Road), groundwater and sewer&ndash;related flooding issues (sewerage contaminating floodwater, Higginson Park closed for contamination), pumping and sandbagging operations across several streets to protect homes. [TAB,PAG] (p26)</p></div><div class="nugget-popup"><p>Town&ndash;wide flooding impacts and response: contaminated floodwater from sewers; public health advice issued; incident control set up at Marlow Sports Centre and Environmental Health/Housing officers located at Court Garden to advise residents; swift&ndash;water rescue team and multiple pump operations deployed; military/RAF and local authorities provided sandbags, portaloos and manpower; flood warnings were issued and later lifted for properties along the Thames near Marlow. [TAB,PAG] (p27)</p></div><div class="nugget-popup"><p>Multiple flood impacts across Marlow during January&ndash;February 2014: contaminated floodwater (raw sewage) in residential areas (notably Quarrydale Drive), public&ndash;health advice issued, Higginson Park closed due to contamination, pumping operations conducted by fire service and Thames Water to lower groundwater and sewer levels, encouragements to residents to restrict water use, and temporary sanitation provided to affected streets. [TAB,PAG] (p28)</p></div><div class="nugget-popup"><p>Prolonged flooding across parts of Marlow in January&ndash;February 2014. Ground was saturated and unusually high groundwater levels caused groundwater to emerge and flood low&ndash;lying areas. Surface&ndash;water drainage that relies on infiltration failed due to high groundwater; permanent surface&ndash;water pumps were unable to cope and failed. Surface water piped to Newt Ditch caused flooding where the ditch was overwhelmed. Infiltration into foul sewers caused surcharging and sewer flooding. Areas close to the River Thames were flooded when the river overtopped its banks. (p32)</p></div><i>Quantified impacts</i><div class="nugget-popup quant"><p>five or more residential properties within an area of 1km2; two river level peaks [PAG] (p6)</p></div><div class="nugget-popup quant"><p>55 to 60 properties flooded internally; 2 assisted self&ndash;elected evacuations [PAG] (p22)</p></div><div class="nugget-popup quant"><p>approximately 150 properties affected; 55 to 60 properties flooded internally; 2 assisted self&ndash;elected evacuations (p23)</p></div><div class="nugget-popup quant"><p>4 homes protected; 4 portaloos; 250 men (military) to be placed in 7 sectors; 100 sandbags; 500 sandbags; 3 pumps; 4 properties cleared [TAB,PAG] (p27)</p></div></div></body></div>`)[0];
                popup_68834e2879926c1d05d9166a2af3495c.setContent(html_db733aa5b2a1424efe9dec5739c1b4f7);
